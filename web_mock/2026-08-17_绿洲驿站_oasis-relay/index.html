<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>绿洲驿站 · Oasis Relay — 丝路沙漠绿洲文化杂志</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" />
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    /* === Design Tokens === */
    :root {
      --sand-gold: #D9A441;
      --terracotta: #B4552D;
      --oasis-teal: #1F7A6D;
      --night-brown: #2B1E17;
      --cream: #F4EAD8;
      --cream-2: #E8DCC0;
      --ink: #2B1E17;
      --ink-soft: #5C4A3A;
      --serif: "Noto Serif SC", "Cormorant Garamond", Georgia, serif;
      --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      --display: "Cormorant Garamond", "Noto Serif SC", Georgia, serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    body {
      font-family: var(--sans);
      color: var(--ink);
      background: var(--cream);
      overflow-x: hidden;
      cursor: none;
    }
    @media (max-width: 768px) { body { cursor: auto; } }

    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: none; border: none; background: none; }
    @media (max-width: 768px) { button { cursor: pointer; } }

    /* === Custom Cursor === */
    .cursor-outer, .cursor-inner, .cursor-glow {
      position: fixed;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      will-change: transform;
    }
    .cursor-outer {
      width: 32px; height: 32px;
      border: 2px solid #fff;
      border-radius: 50%;
      mix-blend-mode: difference;
      transition: width .3s ease, height .3s ease, border-color .3s ease;
      box-shadow: 0 0 12px rgba(217,164,65,.4);
    }
    .cursor-outer.hover {
      width: 56px; height: 56px;
      border-color: var(--sand-gold);
    }
    .cursor-inner {
      width: 6px; height: 6px;
      background: var(--sand-gold);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--sand-gold), 0 0 20px rgba(217,164,65,.5);
    }
    .cursor-glow {
      width: 120px; height: 120px;
      background: radial-gradient(circle, rgba(217,164,65,.15) 0%, transparent 70%);
      border-radius: 50%;
      transition: width .4s ease, height .4s ease, opacity .4s ease;
      opacity: .6;
    }
    @media (max-width: 768px) {
      .cursor-outer, .cursor-inner, .cursor-glow { display: none; }
    }

    .ripple-ring {
      position: fixed;
      border: 2px solid var(--sand-gold);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%) scale(0);
      opacity: 1;
      animation: rippleExpand .7s ease-out forwards;
    }
    @keyframes rippleExpand {
      to { transform: translate(-50%, -50%) scale(3); opacity: 0; }
    }

    /* === Nav === */
    .nav {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 20px 48px;
      display: flex; align-items: center; justify-content: space-between;
      transition: background .4s ease, padding .4s ease, backdrop-filter .4s ease;
    }
    .nav.scrolled {
      background: rgba(43,30,23,.92);
      backdrop-filter: blur(12px);
      padding: 12px 48px;
    }
    .nav-brand {
      font-family: var(--serif);
      font-weight: 900;
      font-size: 22px;
      color: var(--cream);
      letter-spacing: .12em;
      display: flex; align-items: center; gap: 10px;
    }
    .nav-brand-mark {
      width: 28px; height: 28px;
      border: 2px solid var(--sand-gold);
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: 14px; color: var(--sand-gold);
      font-family: var(--display);
    }
    .nav-links {
      display: flex; gap: 36px;
      list-style: none;
    }
    .nav-links a {
      color: var(--cream);
      font-size: 14px;
      letter-spacing: .08em;
      position: relative;
      padding: 4px 0;
      transition: color .3s ease;
    }
    .nav-links a::after {
      content: '';
      position: absolute; left: 0; bottom: 0;
      width: 0; height: 1px;
      background: var(--sand-gold);
      transition: width .4s ease;
    }
    .nav-links a:hover { color: var(--sand-gold); }
    .nav-links a:hover::after { width: 100%; }
    .nav-cta {
      padding: 10px 22px;
      border: 1px solid var(--sand-gold);
      color: var(--sand-gold);
      font-size: 13px;
      letter-spacing: .1em;
      border-radius: 2px;
      transition: background .3s ease, color .3s ease;
    }
    .nav-cta:hover { background: var(--sand-gold); color: var(--night-brown); }

    .nav-hamburger {
      display: none;
      width: 32px; height: 32px;
      position: relative;
    }
    .nav-hamburger span {
      position: absolute; left: 4px; right: 4px; height: 2px;
      background: var(--cream);
      transition: transform .3s ease, opacity .3s ease, top .3s ease;
    }
    .nav-hamburger span:nth-child(1) { top: 10px; }
    .nav-hamburger span:nth-child(2) { top: 18px; }
    .nav-hamburger.open span:nth-child(1) { top: 15px; transform: rotate(45deg); }
    .nav-hamburger.open span:nth-child(2) { top: 15px; transform: rotate(-45deg); }

    @media (max-width: 768px) {
      .nav { padding: 16px 20px; }
      .nav.scrolled { padding: 10px 20px; }
      .nav-links { display: none; }
      .nav-hamburger { display: block; }
      .nav-cta { display: none; }
      .nav-menu-mobile {
        display: flex; flex-direction: column;
        position: fixed; top: 0; right: -100%;
        width: 75%; height: 100vh;
        background: var(--night-brown);
        padding: 80px 32px;
        gap: 24px;
        transition: right .4s ease;
        z-index: 99;
      }
      .nav-menu-mobile.open { right: 0; }
      .nav-menu-mobile a {
        color: var(--cream);
        font-family: var(--serif);
        font-size: 20px;
        letter-spacing: .1em;
      }
    }

    /* === Hero === */
    .hero {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      background: var(--night-brown);
    }
    .hero-canvas {
      position: absolute; inset: 0;
      z-index: 1;
    }
    .hero-bg-img {
      position: absolute; inset: 0;
      z-index: 0;
      background-size: cover;
      background-position: center;
      opacity: .35;
      filter: sepia(.3) saturate(1.2);
      transition: transform .2s linear;
      will-change: transform;
    }
    .hero-overlay {
      position: absolute; inset: 0;
      z-index: 2;
      background:
        radial-gradient(ellipse at 50% 70%, transparent 0%, rgba(43,30,23,.6) 60%, var(--night-brown) 100%),
        linear-gradient(180deg, rgba(43,30,23,.4) 0%, transparent 40%, rgba(43,30,23,.7) 100%);
    }
    .hero-caravan {
      position: absolute; bottom: 18%; left: 0; right: 0;
      z-index: 3;
      height: 120px;
      pointer-events: none;
      will-change: transform;
    }
    .hero-caravan svg {
      width: 100%; height: 100%;
      opacity: .55;
    }

    .hero-content {
      position: relative; z-index: 5;
      min-height: 100vh;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center;
      padding: 120px 24px 80px;
      color: var(--cream);
    }
    .hero-kicker {
      font-family: var(--display);
      font-style: italic;
      font-size: 18px;
      letter-spacing: .3em;
      color: var(--sand-gold);
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeInUp 1s ease .3s forwards;
    }
    .hero-title {
      font-family: var(--serif);
      font-weight: 900;
      font-size: clamp(48px, 8vw, 120px);
      line-height: 1;
      letter-spacing: .08em;
      margin-bottom: 16px;
      color: var(--cream);
      text-shadow: 0 4px 30px rgba(0,0,0,.5);
    }
    .hero-title .accent { color: var(--sand-gold); }
    .hero-typewriter {
      font-family: var(--serif);
      font-size: clamp(16px, 2vw, 22px);
      font-weight: 400;
      letter-spacing: .15em;
      color: var(--cream-2);
      min-height: 36px;
      margin-bottom: 40px;
    }
    .hero-typewriter .caret {
      display: inline-block;
      width: 2px; height: 1.1em;
      background: var(--sand-gold);
      vertical-align: text-bottom;
      margin-left: 4px;
      animation: caretBlink 1s steps(2) infinite;
    }
    @keyframes caretBlink { 50% { opacity: 0; } }

    .hero-scroll-hint {
      position: absolute; bottom: 40px; left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      color: var(--cream);
      opacity: .6;
      font-size: 12px;
      letter-spacing: .25em;
      text-align: center;
    }
    .hero-scroll-hint .mouse {
      width: 22px; height: 36px;
      border: 1px solid var(--cream);
      border-radius: 11px;
      margin: 0 auto 12px;
      position: relative;
    }
    .hero-scroll-hint .mouse::after {
      content: '';
      position: absolute;
      top: 6px; left: 50%;
      width: 3px; height: 6px;
      background: var(--cream);
      border-radius: 2px;
      transform: translateX(-50%);
      animation: mouseScroll 2s ease-in-out infinite;
    }
    @keyframes mouseScroll {
      0%, 100% { opacity: 1; top: 6px; }
      50% { opacity: .2; top: 18px; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero-cta-row {
      display: flex; gap: 16px; align-items: center;
      opacity: 0;
      animation: fadeInUp 1s ease 1.2s forwards;
    }
    .btn-primary {
      padding: 14px 32px;
      background: var(--sand-gold);
      color: var(--night-brown);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: .1em;
      border-radius: 2px;
      position: relative;
      overflow: hidden;
      transition: transform .3s ease, box-shadow .3s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(217,164,65,.4);
    }
    .btn-primary .shine {
      position: absolute; top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,.4), transparent);
      transition: left .6s ease;
    }
    .btn-primary:hover .shine { left: 150%; }

    .btn-ghost {
      padding: 14px 28px;
      border: 1px solid rgba(244,234,216,.4);
      color: var(--cream);
      font-size: 14px;
      letter-spacing: .1em;
      border-radius: 2px;
      transition: border-color .3s ease, color .3s ease;
    }
    .btn-ghost:hover { border-color: var(--sand-gold); color: var(--sand-gold); }

    /* === Section === */
    .section {
      padding: 140px 48px;
      position: relative;
    }
    .section-header {
      max-width: 1200px;
      margin: 0 auto 64px;
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 40px;
    }
    .section-kicker {
      font-family: var(--display);
      font-style: italic;
      font-size: 14px;
      letter-spacing: .3em;
      color: var(--terracotta);
      margin-bottom: 12px;
      display: flex; align-items: center; gap: 12px;
    }
    .section-kicker::before {
      content: '';
      width: 32px; height: 1px;
      background: var(--terracotta);
    }
    .section-title {
      font-family: var(--serif);
      font-weight: 700;
      font-size: clamp(32px, 5vw, 56px);
      color: var(--ink);
      line-height: 1.2;
      letter-spacing: .04em;
    }
    .section-desc {
      max-width: 400px;
      font-size: 15px;
      line-height: 1.8;
      color: var(--ink-soft);
    }
    @media (max-width: 768px) {
      .section { padding: 80px 20px; }
      .section-header { flex-direction: column; align-items: flex-start; gap: 20px; }
    }

    /* === Scroll reveal === */
    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity .8s ease, transform .8s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* === Features (Articles) === */
    .features-section { background: var(--cream); }
    .features-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 32px;
    }
    .feature-card {
      position: relative;
      overflow: hidden;
      background: var(--night-brown);
      border-radius: 4px;
      cursor: pointer;
      transition: transform .4s ease;
    }
    .feature-card:nth-child(1) { grid-column: span 7; grid-row: span 2; }
    .feature-card:nth-child(2) { grid-column: span 5; }
    .feature-card:nth-child(3) { grid-column: span 5; }
    .feature-card:nth-child(4) { grid-column: span 6; }
    .feature-card:nth-child(5) { grid-column: span 6; }

    .feature-card-img {
      width: 100%;
      aspect-ratio: 16/10;
      object-fit: cover;
      transition: transform .8s ease, filter .6s ease;
      filter: saturate(.9);
    }
    .feature-card:nth-child(1) .feature-card-img { aspect-ratio: 4/3; }
    .feature-card:hover .feature-card-img {
      transform: scale(1.04);
      filter: saturate(1.1);
    }
    .feature-shine {
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,.15), transparent);
      transform: skewX(-20deg);
      pointer-events: none;
      transition: left .9s ease;
    }
    .feature-card:hover .feature-shine { left: 150%; }

    .feature-card-body {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 32px;
      background: linear-gradient(180deg, transparent, rgba(43,30,23,.9));
      color: var(--cream);
    }
    .feature-tag {
      display: inline-block;
      padding: 4px 12px;
      background: var(--sand-gold);
      color: var(--night-brown);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .15em;
      margin-bottom: 12px;
      border-radius: 2px;
    }
    .feature-title {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 8px;
      letter-spacing: .04em;
    }
    .feature-card:nth-child(1) .feature-title { font-size: 32px; }
    .feature-meta {
      font-size: 12px;
      opacity: .7;
      letter-spacing: .1em;
    }
    @media (max-width: 768px) {
      .features-grid { grid-template-columns: 1fr; }
      .feature-card, .feature-card:nth-child(n) { grid-column: span 1; grid-row: span 1; }
      .feature-card:nth-child(1) .feature-title { font-size: 24px; }
    }

    /* === Oasis Cards (3D tilt) === */
    .oasis-section {
      background: var(--night-brown);
      color: var(--cream);
      position: relative;
      overflow: hidden;
    }
    .oasis-section::before {
      content: '';
      position: absolute;
      top: -200px; right: -200px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(217,164,65,.1) 0%, transparent 60%);
      pointer-events: none;
    }
    .oasis-section .section-title { color: var(--cream); }
    .oasis-section .section-desc { color: var(--cream-2); opacity: .7; }
    .oasis-section .section-kicker { color: var(--sand-gold); }
    .oasis-section .section-kicker::before { background: var(--sand-gold); }

    .oasis-tabs {
      max-width: 1200px;
      margin: 0 auto 48px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid rgba(244,234,216,.15);
    }
    .oasis-tab {
      padding: 12px 24px;
      color: rgba(244,234,216,.5);
      font-size: 14px;
      letter-spacing: .08em;
      position: relative;
      transition: color .3s ease;
      cursor: pointer;
    }
    .oasis-tab:hover { color: var(--cream); }
    .oasis-tab.active { color: var(--sand-gold); }
    .oasis-tab.active::after {
      content: '';
      position: absolute; left: 0; right: 0; bottom: -1px;
      height: 2px;
      background: var(--sand-gold);
    }

    .oasis-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 28px;
      perspective: 1200px;
    }
    .oasis-card {
      position: relative;
      height: 420px;
      transform-style: preserve-3d;
      transition: transform .6s cubic-bezier(.23,1,.32,1);
      cursor: pointer;
    }
    .oasis-card-face {
      position: absolute; inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 4px;
      overflow: hidden;
    }
    .oasis-card-front {
      background: #1a110c;
    }
    .oasis-card-back {
      transform: rotateY(180deg);
      background: var(--cream);
      color: var(--ink);
      padding: 28px;
      display: flex; flex-direction: column;
    }
    .oasis-card.flipped { transform: rotateY(180deg); }

    .oasis-card-img {
      width: 100%; height: 65%;
      object-fit: cover;
      transition: transform .8s ease;
    }
    .oasis-card:hover .oasis-card-img { transform: scale(1.05); }
    .oasis-card-info {
      padding: 20px 24px;
      color: var(--cream);
    }
    .oasis-card-name {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: .06em;
    }
    .oasis-card-loc {
      font-size: 12px;
      color: var(--sand-gold);
      letter-spacing: .15em;
      margin-bottom: 12px;
    }
    .oasis-card-hint {
      font-size: 11px;
      opacity: .5;
      letter-spacing: .2em;
    }
    .oasis-back-title {
      font-family: var(--serif);
      font-size: 24px;
      color: var(--terracotta);
      margin-bottom: 16px;
      letter-spacing: .05em;
    }
    .oasis-back-text {
      font-size: 14px;
      line-height: 1.8;
      color: var(--ink-soft);
      flex: 1;
    }
    .oasis-back-stats {
      display: flex;
      gap: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(43,30,23,.1);
    }
    .oasis-stat { text-align: center; }
    .oasis-stat-num {
      font-family: var(--display);
      font-size: 28px;
      color: var(--oasis-teal);
      font-weight: 600;
    }
    .oasis-stat-label {
      font-size: 11px;
      color: var(--ink-soft);
      letter-spacing: .1em;
    }

    /* === Map Section === */
    .map-section {
      background: var(--cream-2);
      position: relative;
    }
    .map-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 48px;
      align-items: start;
    }
    .map-canvas-wrap {
      position: relative;
      border-radius: 4px;
      overflow: hidden;
      aspect-ratio: 16/9;
      background: #d4c4a0;
      box-shadow: 0 20px 60px rgba(43,30,23,.2);
    }
    .map-canvas-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: .25;
      filter: sepia(.5);
    }
    .map-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(244,234,216,.2) 0%, rgba(244,234,216,.5) 100%);
    }
    .map-svg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
    }
    .map-node {
      cursor: pointer;
    }
    .map-node-dot {
      fill: var(--terracotta);
      transition: r .3s ease, fill .3s ease;
    }
    .map-node:hover .map-node-dot {
      fill: var(--sand-gold);
    }
    .map-node-pulse {
      fill: none;
      stroke: var(--terracotta);
      stroke-width: 1.5;
      opacity: .8;
      transform-origin: center;
      animation: nodePulse 3s ease-out infinite;
    }
    .map-node:nth-child(2) .map-node-pulse { animation-delay: .5s; }
    .map-node:nth-child(3) .map-node-pulse { animation-delay: 1s; }
    .map-node:nth-child(4) .map-node-pulse { animation-delay: 1.5s; }
    .map-node:nth-child(5) .map-node-pulse { animation-delay: 2s; }
    .map-node:nth-child(6) .map-node-pulse { animation-delay: 2.5s; }
    @keyframes nodePulse {
      0% { r: 6; opacity: .8; }
      100% { r: 20; opacity: 0; }
    }
    .map-node-label {
      font-family: var(--serif);
      font-size: 11px;
      fill: var(--ink);
      text-anchor: middle;
      opacity: .8;
      pointer-events: none;
      font-weight: 600;
    }

    // ===========================
    // Custom Cursor
    // ===========================
    function CustomCursor() {
      const outerRef = useRef(null);
      const innerRef = useRef(null);
      const glowRef = useRef(null);
      const ripplesRef = useRef([]);
      const pos = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
      const target = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
      const rafRef = useRef(null);
      const isHovering = useRef(false);
      const reducedMotion = useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      const visible = useRef(true);

      const animate = useCallback(() => {
        if (!visible.current || reducedMotion.current) return;
        pos.current.x += (target.current.x - pos.current.x) * 0.18;
        pos.current.y += (target.current.y - pos.current.y) * 0.18;

        if (innerRef.current) {
          innerRef.current.style.transform = `translate(${pos.current.x}px, ${pos.current.y}px) translate(-50%, -50%)`;
        }
        if (outerRef.current) {
          const ease = isHovering.current ? 0.12 : 0.18;
          const ox = (target.current.x - pos.current.x) * ease + pos.current.x;
          outerRef.current.style.transform = `translate(${ox}px, ${target.current.y * 0.0 + pos.current.y}px) translate(-50%, -50%)`;
        }
        if (glowRef.current) {
          glowRef.current.style.transform = `translate(${pos.current.x}px, ${pos.current.y}px) translate(-50%, -50%)`;
        }
        rafRef.current = requestAnimationFrame(animate);
      }, []);

      useEffect(() => {
        if (reducedMotion.current) return;
        const handleMove = (e) => {
          target.current.x = e.clientX;
          target.current.y = e.clientY;
        };
        const handleOver = (e) => {
          const t = e.target;
          if (t.closest && (
            t.closest('a') || t.closest('button') || t.closest('.feature-card') ||
            t.closest('.oasis-card') || t.closest('.map-node') || t.closest('.oasis-tab') ||
            t.closest('input') || t.closest('.nav-hamburger')
          )) {
            isHovering.current = true;
            outerRef.current && outerRef.current.classList.add('hover');
          } else {
            isHovering.current = false;
            outerRef.current && outerRef.current.classList.remove('hover');
          }
        };
        const handleClick = (e) => {
          const ring = document.createElement('div');
          ring.className = 'ripple-ring';
          ring.style.left = e.clientX + 'px';
          ring.style.top = e.clientY + 'px';
          ring.style.width = '40px';
          ring.style.height = '40px';
          document.body.appendChild(ring);
          setTimeout(() => ring.remove(), 700);
        };

        window.addEventListener('mousemove', handleMove, { passive: true });
        document.addEventListener('mouseover', handleOver);
        document.addEventListener('click', handleClick);

        rafRef.current = requestAnimationFrame(animate);

        const handleVis = () => {
          visible.current = !document.hidden;
          if (visible.current && !rafRef.current) {
            rafRef.current = requestAnimationFrame(animate);
          }
        };
        document.addEventListener('visibilitychange', handleVis);

        return () => {
          cancelAnimationFrame(rafRef.current);
          window.removeEventListener('mousemove', handleMove);
          document.removeEventListener('mouseover', handleOver);
          document.removeEventListener('click', handleClick);
          document.removeEventListener('visibilitychange', handleVis);
        };
      }, [animate]);

      return (
        <>
          <div ref={glowRef} className="cursor-glow" />
          <div ref={outerRef} className="cursor-outer" />
          <div ref={innerRef} className="cursor-inner" />
        </>
      );
    }

    // ===========================
    // Sand Particle Canvas
    // ===========================
    function SandParticles() {
      const canvasRef = useRef(null);
      const rafRef = useRef(null);
      const mouse = useRef({ x: -1000, y: -1000 });
      const reducedMotion = useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let w, h, particles, time = 0;
        const visibleRef = { current: true };

        const resize = () => {
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
        };

        const initParticles = () => {
          const count = Math.floor((w * h) / 12000);
          particles = [];
          for (let i = 0; i < count; i++) {
            particles.push({
              x: Math.random() * w,
              y: Math.random() * h,
              size: Math.random() * 1.8 + 0.3,
              speedX: (Math.random() - 0.5) * 0.3,
              speedY: (Math.random() - 0.3) * 0.2 + 0.05,
              alpha: Math.random() * 0.6 + 0.2,
              hue: Math.random() > 0.7 ? 40 : 35
            });
          }
        };

        const noise = (x, y, t) => {
          return Math.sin(x * 0.002 + t) * Math.cos(y * 0.0025 + t * 0.8) * 0.5 + 0.5;
        };

        const render = () => {
          if (!visibleRef.current) return;
          ctx.clearRect(0, 0, w, h);
          time += 0.008;

          // gradient glow at bottom
          const grad = ctx.createLinearGradient(0, h * 0.5, 0, h);
          grad.addColorStop(0, 'rgba(217,164,65,0)');
          grad.addColorStop(1, 'rgba(217,164,65,0.12)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, h * 0.5, w, h * 0.5);

          for (let p of particles) {
            const n = noise(p.x, p.y, time);
            p.x += p.speedX + (n - 0.5) * 0.4;
            p.y += p.speedY + Math.sin(time + p.x * 0.01) * 0.15;

            // mouse repel
            const dx = p.x - mouse.current.x;
            const dy = p.y - mouse.current.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 120) {
              const force = (120 - dist) / 120;
              p.x += (dx / dist) * force * 2;
              p.y += (dy / dist) * force * 2;
            }

            if (p.x < -10) p.x = w + 10;
            if (p.x > w + 10) p.x = -10;
            if (p.y < -10) p.y = h + 10;
            if (p.y > h + 10) p.y = -10;

            ctx.globalAlpha = p.alpha * (0.7 + n * 0.3);
            ctx.fillStyle = `hsl(${p.hue + n * 10}, 70%, ${55 + n * 15}%)`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * (0.8 + n * 0.5), 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;

          rafRef.current = requestAnimationFrame(render);
        };

        const handleMove = (e) => {
          mouse.current.x = e.clientX;
          mouse.current.y = e.clientY;
        };

        const handleVis = () => {
          visibleRef.current = !document.hidden;
          if (visibleRef.current && !rafRef.current) {
            rafRef.current = requestAnimationFrame(render);
          }
        };

        resize();
        initParticles();
        window.addEventListener('resize', () => { resize(); initParticles(); });
        window.addEventListener('mousemove', handleMove, { passive: true });
        document.addEventListener('visibilitychange', handleVis);

        if (reducedMotion.current) {
          // static single render
          render();
          cancelAnimationFrame(rafRef.current);
          return;
        }
        rafRef.current = requestAnimationFrame(render);

        return () => {
          cancelAnimationFrame(rafRef.current);
          window.removeEventListener('resize', resize);
          window.removeEventListener('mousemove', handleMove);
          document.removeEventListener('visibilitychange', handleVis);
        };
      }, []);

      return <canvas ref={canvasRef} className="hero-canvas" />;
    }

    // ===========================
    // Typewriter
    // ===========================
    function Typewriter({ texts }) {
      const [text, setText] = useState('');
      const [index, setIndex] = useState(0);
      const [deleting, setDeleting] = useState(false);
      const rafRef = useRef(null);
      const timerRef = useRef(null);
      const reducedMotion = useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);

      useEffect(() => {
        if (reducedMotion.current) {
          setText(texts[0]);
          return;
        }
        let charIndex = 0;
        let isDel = false;
        let phraseIdx = 0;
        const delay = 80;
        const deleteDelay = 40;
        const pauseDelay = 2000;

        const tick = () => {
          const current = texts[phraseIdx];
          if (!isDel) {
            charIndex++;
            setText(current.substring(0, charIndex));
            if (charIndex === current.length) {
              isDel = true;
              timerRef.current = setTimeout(() => {
                if (!document.hidden) rafRef.current = requestAnimationFrame(loop);
              }, pauseDelay);
              return;
            }
          } else {
            charIndex--;
            setText(current.substring(0, charIndex));
            if (charIndex === 0) {
              isDel = false;
              phraseIdx = (phraseIdx + 1) % texts.length;
            }
          }
          timerRef.current = setTimeout(() => {
            if (!document.hidden) rafRef.current = requestAnimationFrame(loop);
          }, isDel ? deleteDelay : delay);
        };

        const loop = () => { tick(); };

        rafRef.current = requestAnimationFrame(loop);

        return () => {
          cancelAnimationFrame(rafRef.current);
          clearTimeout(timerRef.current);
        };
      }, []);

      return (
        <div className="hero-typewriter">
          {text}
          <span className="caret" />
        </div>
      );
    }

    // ===========================
    // Counter number animation
    // ===========================
    function Counter({ end, duration = 2000, suffix = '', decimals = 0 }) {
      const [count, setCount] = useState(0);
      const ref = useRef(null);
      const rafRef = useRef(null);
      const started = useRef(false);

      useEffect(() => {
        const el = ref.current;
        if (!el) return;

        const io = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting && !started.current) {
              started.current = true;
              animate();
            }
          });
        }, { threshold: 0.5 });

        io.observe(el);
        return () => io.disconnect();
      }, []);

      const animate = () => {
        const start = performance.now();
        const step = (now) => {
          const progress = Math.min((now - start) / duration, 1);
          // easeOutCubic
          const eased = 1 - Math.pow(1 - progress, 3);
          const val = end * eased;
          setCount(decimals ? val.toFixed(decimals) : Math.floor(val));
          if (progress < 1) {
            rafRef.current = requestAnimationFrame(step);
          }
        };
        rafRef.current = requestAnimationFrame(step);
      };

      useEffect(() => () => cancelAnimationFrame(rafRef.current), []);

      return (
        <span ref={ref} className="stat-item-num">
          {count.toLocaleString()}<span className="stat-item-unit">{suffix}</span>
        </span>
      );
    }

    // ===========================
    // Scroll reveal
    // ===========================
    function useReveal() {
      useEffect(() => {
        const els = document.querySelectorAll('.reveal');
        const io = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
              io.unobserve(entry.target);
            }
          });
        }, { threshold: 0.15 });

        els.forEach(el => io.observe(el));
        return () => io.disconnect();
      }, []);
    }

    // ===========================
    // 3D Tilt Oasis Card
    // ===========================
    function OasisCard({ oasis }) {
      const cardRef = useRef(null);
      const [flipped, setFlipped] = useState(false);
      const reducedMotion = useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);

      const handleMove = (e) => {
        if (reducedMotion.current || flipped) return;
        const card = cardRef.current;
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateY = ((x - centerX) / centerX) * 12;
        const rotateX = ((centerY - y) / centerY) * 12;
        card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(0)`;
      };

      const handleLeave = () => {
        const card = cardRef.current;
        if (!flipped) {
          card.style.transform = 'rotateX(0) rotateY(0)';
        }
      };

      const handleClick = () => {
        setFlipped(f => !f);
        const card = cardRef.current;
        if (!flipped) {
          card.style.transform = 'rotateY(180deg)';
        } else {
          card.style.transform = 'rotateX(0) rotateY(0)';
        }
      };

      return (
        <div
          ref={cardRef}
          className={`oasis-card ${flipped ? 'flipped' : ''}`}
          onMouseMove={handleMove}
          onMouseLeave={handleLeave}
          onClick={handleClick}
        >
          <div className="oasis-card-face oasis-card-front">
            <img src={oasis.img} alt={oasis.name} className="oasis-card-img" />
            <div className="oasis-card-info">
              <div className="oasis-card-loc">{oasis.location}</div>
              <div className="oasis-card-name">{oasis.name}</div>
              <div className="oasis-card-hint">点击翻阅 →</div>
            </div>
          </div>
          <div className="oasis-card-face oasis-card-back">
            <div className="oasis-back-title">{oasis.name}</div>
            <p className="oasis-back-text">{oasis.description}</p>
            <div className="oasis-back-stats">

    // ===========================
    // Ripple Button
    // ===========================
    function RippleButton({ className, children, onClick, style }) {
      const btnRef = useRef(null);
      const reducedMotion = useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);

      const handleClick = (e) => {
        if (!reducedMotion.current) {
          const btn = btnRef.current;
          const rect = btn.getBoundingClientRect();
          const size = Math.max(rect.width, rect.height) * 2;
          const x = e.clientX - rect.left - size / 2;
          const y = e.clientY - rect.top - size / 2;

          const ripple = document.createElement('span');
          ripple.className = 'ripple-inner';
          ripple.style.width = size + 'px';
          ripple.style.height = size + 'px';
          ripple.style.left = x + 'px';
          ripple.style.top = y + 'px';
          btn.appendChild(ripple);

          ripple.animate([
            { transform: 'scale(0)', opacity: '1' },
            { transform: 'scale(1)', opacity: '0' }
          ], { duration: 600, easing: 'ease-out' });

          setTimeout(() => ripple.remove(), 600);
        }
        onClick && onClick(e);
      };

      return (
        <button ref={btnRef} className={className} onClick={handleClick} style={style}>
          {children}
        </button>
      );
    }

    // ===========================
    // Hero parallax
    // ===========================
    function useParallax() {
      const bgRef = useRef(null);
      const caravanRef = useRef(null);

      useEffect(() => {
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced) return;

        let ticking = false;
        const handleScroll = () => {
          if (!ticking) {
            requestAnimationFrame(() => {
              const y = window.scrollY;
              if (bgRef.current) {
                bgRef.current.style.transform = `translateY(${y * 0.3}px) scale(1.1)`;
              }
              if (caravanRef.current) {
                caravanRef.current.style.transform = `translateY(${y * -0.15}px)`;
                caravanRef.current.style.opacity = Math.max(0, 0.55 - y / 1200);
              }
              ticking = false;
            });
            ticking = true;
          }
        };
        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      return { bgRef, caravanRef };
    }

  </script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>季风邮局 Monsoon Post — 信件乘着季风抵达</title>
  <link rel="preconnect" href="https://miaoda.feishu.cn" />
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Mono:wght@300;400;500&display=swap" />
  <style>
    /* =========================================================
       MONSOON POST — Design Tokens
       ========================================================= */
    :root {
      --ochre-50: #FBF1E4;
      --ochre-100: #F5E1C5;
      --ochre-200: #EBC997;
      --ochre-300: #DBAB65;
      --ochre-400: #C98B3C;
      --ochre-500: #B06A1E;
      --ochre-600: #8C4F12;
      --ochre-700: #6A390C;

      --vermilion-400: #E8734A;
      --vermilion-500: #D4542A;
      --vermilion-600: #B03A17;

      --indigo-50: #E9ECF5;
      --indigo-100: #C9CFE3;
      --indigo-200: #97A1C8;
      --indigo-300: #6672AA;
      --indigo-400: #414D85;
      --indigo-500: #24305C;
      --indigo-600: #141D3E;
      --indigo-700: #0A1128;
      --indigo-800: #050A1A;

      --paper-50: #FBF7EC;
      --paper-100: #F5EEDB;
      --paper-200: #EDE3C8;
      --paper-300: #E3D5AE;

      --brass-300: #E8C97A;
      --brass-400: #D4AF5A;
      --brass-500: #B8913A;
      --brass-600: #8F6D22;

      --font-display: 'Noto Serif SC', 'Songti SC', serif;
      --font-serif: 'Cormorant Garamond', 'Noto Serif SC', serif;
      --font-mono: 'DM Mono', 'Menlo', monospace;

      --max-w: 1400px;
      --gutter: clamp(24px, 5vw, 80px);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-serif);
      background: var(--paper-100);
      color: var(--indigo-700);
      overflow-x: hidden;
      cursor: none;
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
    }

    /* Paper texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9998;
      opacity: 0.4;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(176, 106, 30, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(36, 48, 92, 0.04) 0%, transparent 50%);
      mix-blend-mode: multiply;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9997;
      opacity: 0.08;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
    }

    a { color: inherit; text-decoration: none; cursor: none; }
    button { cursor: none; font-family: inherit; border: none; background: none; color: inherit; }
    ul, ol { list-style: none; margin: 0; padding: 0; }
    img { display: block; max-width: 100%; }

    /* =========================================================
       Custom Cursor
       ========================================================= */
    .cursor-outer,
    .cursor-inner,
    .cursor-dot {
      position: fixed;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%);
      will-change: transform;
      border-radius: 50%;
    }
    .cursor-outer {
      width: 44px; height: 44px;
      border: 2px solid var(--indigo-700);
      box-shadow:
        0 0 20px rgba(36, 48, 92, 0.25),
        0 0 40px rgba(176, 106, 30, 0.15);
      transition:
        width 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2),
        height 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2),
        border-color 0.3s ease,
        background-color 0.3s ease,
        box-shadow 0.3s ease;
    }
    .cursor-inner {
      width: 20px; height: 20px;
      border: 1.5px solid var(--vermilion-500);
      background: rgba(232, 115, 74, 0.15);
      transition:
        width 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.2),
        height 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.2),
        border-color 0.2s ease,
        background-color 0.2s ease,
        opacity 0.2s ease;
    }
    .cursor-dot {
      width: 6px; height: 6px;
      background: var(--brass-500);
      box-shadow: 0 0 12px var(--brass-400), 0 0 24px rgba(212, 175, 90, 0.5);
      transition: transform 0.15s ease, background 0.2s ease;
    }
    /* Cursor states */
    body.cursor-hover .cursor-outer {
      width: 60px; height: 60px;
      border-color: var(--vermilion-500);
      background: rgba(212, 84, 42, 0.06);
      box-shadow:
        0 0 30px rgba(212, 84, 42, 0.3),
        0 0 60px rgba(176, 106, 30, 0.2);
    }
    body.cursor-hover .cursor-inner {
      width: 32px; height: 32px;
      border-color: var(--brass-500);
      background: rgba(232, 201, 122, 0.2);
    }
    body.cursor-click .cursor-dot {
      transform: translate(-50%, -50%) scale(0.3);
    }
    body.cursor-text .cursor-outer {
      width: 2px; height: 28px;
      border-radius: 1px;
      border-color: var(--indigo-700);
    }
    body.cursor-text .cursor-inner {
      width: 2px; height: 28px;
      opacity: 0;
    }
    /* Ripple effect on click */
    .cursor-ripple {
      position: fixed;
      width: 44px; height: 44px;
      border: 2px solid var(--vermilion-500);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99998;
      transform: translate(-50%, -50%) scale(0.5);
      opacity: 0.8;
      animation: cursorRipple 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes cursorRipple {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0.8; border-width: 2px; }
      100% { transform: translate(-50%, -50%) scale(3.5); opacity: 0; border-width: 0.5px; }
    }

    /* =========================================================
       Navigation
       ========================================================= */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 20px var(--gutter);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.4s ease, backdrop-filter 0.4s ease, padding 0.4s ease;
    }
    .nav.scrolled {
      background: rgba(251, 247, 236, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 14px var(--gutter);
      border-bottom: 1px solid rgba(176, 106, 30, 0.12);
    }
    .nav-brand {
      display: flex; align-items: center; gap: 12px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--indigo-700);
      letter-spacing: 0.04em;
    }
    .nav-brand-mark {
      width: 36px; height: 36px;
      position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .nav-brand-mark svg { width: 100%; height: 100%; }
    .nav-links {
      display: flex; align-items: center; gap: 40px;
      font-family: var(--font-serif);
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.06em;
    }
    .nav-link {
      position: relative;
      padding: 6px 0;
      color: var(--indigo-600);
      transition: color 0.3s ease;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      left: 50%; bottom: 0;
      width: 0; height: 1.5px;
      background: var(--vermilion-500);
      transition: width 0.3s cubic-bezier(0.2, 0.9, 0.3, 1), left 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    .nav-link:hover { color: var(--vermilion-600); }
    .nav-link:hover::after { width: 100%; left: 0; }
    .nav-cta {
      padding: 10px 22px;
      border: 1.5px solid var(--indigo-600);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--indigo-700);
      transition: all 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.1);
      position: relative;
      overflow: hidden;
    }
    .nav-cta::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: var(--indigo-600);
      transition: left 0.4s cubic-bezier(0.7, 0, 0.3, 1);
      z-index: -1;
    }
    .nav-cta:hover {
      color: var(--paper-50);
      border-color: var(--indigo-600);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(20, 29, 62, 0.25);
    }
    .nav-cta:hover::before { left: 0; }

    /* =========================================================
       Hero Section
       ========================================================= */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      overflow: hidden;
      padding: 120px var(--gutter) 80px;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .hero-bg-image {
      position: absolute;
      inset: -10%;
      width: 120%; height: 120%;
      object-fit: cover;
      opacity: 0.85;
      transform: scale(1.05);
      filter: saturate(0.9) contrast(1.05);
    }
    .hero-bg-gradient {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(251, 247, 236, 0.3) 0%, rgba(251, 247, 236, 0.75) 55%, var(--paper-100) 100%),
        linear-gradient(90deg, rgba(251, 247, 236, 0.5) 0%, transparent 50%);
    }
    .hero-wind-canvas {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .hero-kicker {
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ochre-600);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s cubic-bezier(0.2, 0.9, 0.3, 1) 0.3s forwards;
    }
    .hero-kicker-line {
      width: 48px; height: 1px;
      background: var(--ochre-500);
      position: relative;
      overflow: hidden;
    }
    .hero-kicker-line::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: var(--brass-400);
      animation: lineSweep 2s cubic-bezier(0.7, 0, 0.3, 1) 1s infinite;
    }
    @keyframes lineSweep {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .hero-title {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: clamp(3rem, 8vw, 7rem);
      line-height: 1.05;
      color: var(--indigo-700);
      letter-spacing: -0.02em;
      margin: 0;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 1s cubic-bezier(0.2, 0.9, 0.3, 1) 0.5s forwards;
    }
    .hero-title-line { display: block; }
    .hero-title-accent {
      font-style: italic;
      color: var(--vermilion-500);
      font-family: var(--font-serif);
      font-weight: 600;
      letter-spacing: -0.01em;
      position: relative;
      display: inline-block;
    }
    .hero-title-accent svg {
      position: absolute;
      bottom: -8px; left: 0;
      width: 100%; height: 16px;
      stroke: var(--brass-500);
      stroke-width: 2;
      fill: none;
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: underlineDraw 1.5s cubic-bezier(0.2, 0.9, 0.3, 1) 1.4s forwards;
    }
    @keyframes underlineDraw {
      to { stroke-dashoffset: 0; }
    }

    .hero-subtitle {
      font-family: var(--font-serif);
      font-size: clamp(1.1rem, 2vw, 1.4rem);
      font-weight: 400;
      line-height: 1.7;
      color: var(--indigo-500);
      max-width: 560px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.9s cubic-bezier(0.2, 0.9, 0.3, 1) 0.8s forwards;
    }

    .hero-cta-row {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s cubic-bezier(0.2, 0.9, 0.3, 1) 1.1s forwards;
    }
    .btn-primary {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 36px;
      background: var(--indigo-600);
      color: var(--paper-50);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 999px;
      overflow: hidden;
      transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2), box-shadow 0.4s ease;
      box-shadow: 0 4px 20px rgba(20, 29, 62, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(20, 29, 62, 0.4);
    }
    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0; left: -75%;
      width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(232, 201, 122, 0.3), transparent);
      transform: skewX(-20deg);
      transition: left 0.8s cubic-bezier(0.7, 0, 0.3, 1);
    }
    .btn-primary:hover::before { left: 125%; }
    .btn-primary-arrow {
      display: inline-block;
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.3);
    }
    .btn-primary:hover .btn-primary-arrow { transform: translateX(4px); }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-serif);
      font-size: 1rem;
      font-style: italic;
      color: var(--indigo-500);
      padding: 10px 4px;
      position: relative;
    }
    .btn-ghost::after {
      content: '';
      position: absolute;
      left: 0; bottom: 4px;
      width: 100%; height: 1px;
      background: var(--indigo-400);
      transform-origin: right;
      transform: scaleX(0.5);
      transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    .btn-ghost:hover::after {
      transform-origin: left;
      transform: scaleX(1);
    }

    .hero-stat-row {
      display: flex;
      gap: 48px;
      margin-top: 20px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s cubic-bezier(0.2, 0.9, 0.3, 1) 1.3s forwards;
    }
    .hero-stat {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .hero-stat-num {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--vermilion-500);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .hero-stat-num .unit {
      font-size: 1rem;
      color: var(--ochre-500);
      margin-left: 2px;
    }
    .hero-stat-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--indigo-400);
    }

    /* Scroll indicator */
    .hero-scroll {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      animation: fadeIn 1s ease 2s forwards;
    }
    .hero-scroll-text {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--indigo-400);
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }
    .hero-scroll-line {
      width: 1px;
      height: 60px;
      background: linear-gradient(180deg, var(--ochre-400), transparent);
      position: relative;
      overflow: hidden;
    }
    .hero-scroll-line::after {
      content: '';
      position: absolute;
      top: -20px; left: 0;
      width: 100%; height: 20px;
      background: var(--brass-400);
      animation: scrollDrop 2.5s ease-in-out infinite;
    }
    @keyframes scrollDrop {
      0% { top: -20px; opacity: 0; }
      30% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* Floating envelope in hero */
    .hero-envelope {
      position: absolute;
      right: 8%;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      width: clamp(240px, 28vw, 420px);
      opacity: 0;
      animation: fadeIn 1.2s ease 0.8s forwards, envelopeFloat 8s ease-in-out 2s infinite;
    }
    @keyframes envelopeFloat {
      0%, 100% { transform: translateY(-50%) rotate(-2deg); }
      50% { transform: translateY(calc(-50% - 20px)) rotate(1deg); }
    }
    .hero-envelope img {
      width: 100%;
      border-radius: 4px;
      box-shadow:
        0 30px 80px rgba(36, 48, 92, 0.25),
        0 10px 30px rgba(176, 106, 30, 0.15);
      transform: perspective(800px) rotateY(-8deg) rotateX(4deg);
      transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    .hero-envelope:hover img {
      transform: perspective(800px) rotateY(-2deg) rotateX(1deg) scale(1.03);
    }

    /* =========================================================
       Section Base Styles
       ========================================================= */
    .section {
      padding: 140px var(--gutter);
      position: relative;
    }
    .section-header {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 64px;
      max-width: 680px;
    }
    .section-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--ochre-600);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .section-eyebrow::before {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--vermilion-500);
      box-shadow: 0 0 8px var(--vermilion-400);
    }
    .section-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.6rem);
      font-weight: 700;
      line-height: 1.15;
      color: var(--indigo-700);
      margin: 0;
      letter-spacing: -0.01em;
    }
    .section-title em {
      font-style: italic;
      color: var(--vermilion-500);
      font-family: var(--font-serif);
      font-weight: 600;
    }
    .section-desc {
      font-size: 1.1rem;
      line-height: 1.7;
      color: var(--indigo-400);
      margin: 0;
      max-width: 520px;
    }

    /* Reveal on scroll */
    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.9s cubic-bezier(0.2, 0.9, 0.3, 1), transform 0.9s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* =========================================================
       Narrative / Scroll Section — Journey
       ========================================================= */
    .journey {
      background: var(--paper-50);
      position: relative;
      overflow: hidden;
    }
    .journey::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 120px;
      background: linear-gradient(180deg, var(--paper-100), transparent);
      pointer-events: none;
    }
    .journey-scroll {
      position: relative;
      max-width: 1100px;
      margin: 0 auto;
    }
    .journey-scroll-track {
      position: absolute;
      left: 50%;
      top: 0; bottom: 0;
      width: 2px;
      transform: translateX(-50%);
      background: linear-gradient(180deg,
        transparent 0%,
        var(--ochre-300) 10%,
        var(--indigo-300) 50%,
        var(--ochre-300) 90%,
        transparent 100%);
      opacity: 0.4;
    }
    .journey-step {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 40px;
      align-items: center;
      min-height: 300px;
      position: relative;
    }
    .journey-step-node {
      grid-column: 2;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--paper-50);
      border: 2.5px solid var(--vermilion-500);
      position: relative;
      z-index: 2;
      transition: all 0.4s ease;
    }
    .journey-step-node::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px solid var(--brass-400);
      opacity: 0;
      transition: all 0.5s ease;
    }
    .journey-step.visible .journey-step-node {
      background: var(--vermilion-500);
      box-shadow: 0 0 20px rgba(212, 84, 42, 0.5);
    }
    .journey-step.visible .journey-step-node::after {
      opacity: 0.6;
      animation: nodePulse 3s ease-out infinite;
    }
    @keyframes nodePulse {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(2.5); opacity: 0; }
    }
    .journey-step-content {
      grid-column: 1;
      text-align: right;
      padding-right: 20px;
    }
    .journey-step:nth-child(even) .journey-step-content {
      grid-column: 3;
      text-align: left;
      padding-right: 0;
      padding-left: 20px;
    }
    .journey-step-num {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: var(--ochre-500);
      margin-bottom: 10px;
    }
    .journey-step-title {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--indigo-700);
      margin-bottom: 12px;
      line-height: 1.2;
    }
    .journey-step-text {
      font-size: 1rem;
      line-height: 1.7;
      color: var(--indigo-400);
      max-width: 380px;
    }
    .journey-step:nth-child(odd) .journey-step-text {
      margin-left: auto;
    }
    .journey-step-visual {
      grid-column: 3;
      padding-left: 20px;
    }
    .journey-step:nth-child(even) .journey-step-visual {
      grid-column: 1;
      grid-row: 1;
      padding-left: 0;
      padding-right: 20px;
      text-align: right;
    }
    .journey-step-visual-box {
      display: inline-block;
      padding: 24px;
      background: var(--paper-100);
      border: 1px solid var(--ochre-200);
      border-radius: 8px;
      font-family: var(--font-display);
      font-size: 2.5rem;
      position: relative;
      transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    }
    .journey-step-visual-box:hover {
      transform: translateY(-4px) rotate(-1deg);
    }
    .journey-step-visual-box::before {
      content: '';
      position: absolute;
      inset: 4px;
      border: 1px dashed var(--ochre-300);
      border-radius: 4px;
      pointer-events: none;
    }

    /* =========================================================
       Letter Writing Room Section
       ========================================================= */
    .writing {
      background: var(--indigo-700);
      color: var(--paper-50);
      position: relative;
      overflow: hidden;
    }
    .writing::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(212, 84, 42, 0.15), transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(232, 201, 122, 0.1), transparent 50%);
      pointer-events: none;
    }
    .writing .section-title { color: var(--paper-50); }
    .writing .section-desc { color: var(--indigo-200); }
    .writing .section-eyebrow { color: var(--brass-400); }
    .writing .section-eyebrow::before { background: var(--brass-400); box-shadow: 0 0 8px var(--brass-300); }

    .writing-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 80px;
      align-items: start;
      position: relative;
      z-index: 1;
    }
    .writing-tools {
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: sticky;
      top: 120px;
    }
    .writing-tool {
      padding: 24px;
      border: 1px solid rgba(232, 201, 122, 0.2);
      border-radius: 12px;
      background: rgba(251, 247, 236, 0.03);
      transition: all 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    .writing-tool:hover {
      border-color: rgba(232, 201, 122, 0.5);
      background: rgba(251, 247, 236, 0.06);
      transform: translateX(6px);
    }
    .writing-tool::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--brass-400);
      transform: scaleY(0);
      transform-origin: top;
      transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    .writing-tool:hover::before { transform: scaleY(1); }
    .writing-tool-icon {
      width: 40px; height: 40px;
      margin-bottom: 14px;
      color: var(--brass-400);
    }
    .writing-tool-title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--paper-50);
      margin-bottom: 8px;
    }
    .writing-tool-desc {
      font-size: 0.92rem;
      line-height: 1.6;
      color: var(--indigo-200);
    }

    .letter-paper {
      background: var(--paper-100);
      border-radius: 4px;
      padding: 60px 60px 80px;
      box-shadow:
        0 50px 120px rgba(0, 0, 0, 0.4),
        0 20px 40px rgba(0, 0, 0, 0.2);
      position: relative;
      transform: perspective(1000px) rotateY(-3deg) rotateX(1deg);
      transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
      will-change: transform;
    }
    .letter-paper:hover {
      transform: perspective(1000px) rotateY(-1deg) rotateX(0.5deg);
    }
    .letter-paper::before {
      content: '';
      position: absolute;
      top: 20px; left: 20px; right: 20px; bottom: 20px;
      border: 1px solid rgba(176, 106, 30, 0.15);
      pointer-events: none;
      border-radius: 2px;
    }
    .letter-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(176, 106, 30, 0.2);
    }
    .letter-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .letter-to-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ochre-500);
    }
    .letter-to {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--indigo-700);
    }
    .letter-stamp {
      width: 70px; height: 80px;
      border: 1px solid var(--indigo-400);
      background: var(--paper-50);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 0.6rem;
      color: var(--indigo-500);
      position: relative;
      transform: rotate(4deg);
    }
    .letter-stamp svg {
      width: 32px; height: 32px;
      margin-bottom: 4px;
      color: var(--vermilion-500);
    }
    .letter-stamp-text {
      font-family: var(--font-mono);
      font-size: 0.55rem;
      letter-spacing: 0.1em;
    }

    .letter-body {
      min-height: 280px;
      font-family: var(--font-serif);
      font-size: 1.1rem;
      line-height: 2;
      color: var(--indigo-600);
      font-style: italic;
      position: relative;
    }
    .typewriter-cursor {
      display: inline-block;
      width: 2px;
      height: 1.4em;
      background: var(--vermilion-500);
      vertical-align: text-bottom;
      margin-left: 2px;
      animation: typeBlink 1s step-end infinite;
    }
    @keyframes typeBlink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .letter-controls {
      margin-top: 40px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      padding-top: 24px;
      border-top: 1px solid rgba(176, 106, 30, 0.15);
    }
    .letter-btn {
      padding: 10px 20px;
      border: 1px solid var(--ochre-400);
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--indigo-600);
      background: transparent;
      transition: all 0.3s ease;
    }
    .letter-btn:hover {
      background: var(--ochre-100);
      border-color: var(--ochre-500);
      color: var(--indigo-700);
    }
    .letter-btn.send {
      background: var(--vermilion-500);
      border-color: var(--vermilion-500);
      color: var(--paper-50);
    }
    .letter-btn.send:hover {
      background: var(--vermilion-600);
      box-shadow: 0 4px 16px rgba(212, 84, 42, 0.4);
    }

    .letter-signature {
      margin-top: 32px;
      text-align: right;
      font-family: var(--font-display);
      font-style: italic;
      color: var(--indigo-500);
    }

    /* =========================================================
       Wind Route Map Section
       ========================================================= */
    .windmap {
      background: var(--paper-50);
      position: relative;
      overflow: hidden;
    }
    .windmap-container {
      position: relative;
      max-width: 1200px;
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 50%, var(--paper-100) 0%, var(--paper-200) 100%);
      border: 1px solid var(--ochre-200);
      box-shadow:
        inset 0 0 80px rgba(176, 106, 30, 0.08),
        0 20px 60px rgba(36, 48, 92, 0.1);
    }
    .windmap-canvas {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
    }
    .windmap-legend {
      position: absolute;
      top: 24px;
      right: 24px;
      background: rgba(251, 247, 236, 0.9);
      backdrop-filter: blur(8px);
      padding: 18px 22px;
      border-radius: 10px;
      border: 1px solid var(--ochre-200);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 2;
    }
    .windmap-legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--indigo-500);
    }
    .windmap-legend-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
    }
    .windmap-legend-dot.ochre { background: var(--ochre-500); }
    .windmap-legend-dot.indigo { background: var(--indigo-400); }
    .windmap-legend-dot.vermilion { background: var(--vermilion-500); box-shadow: 0 0 8px var(--vermilion-400); }

    .windmap-stats {
      position: absolute;
      bottom: 24px;
      left: 24px;
      display: flex;
      gap: 32px;
      z-index: 2;
    }
    .windmap-stat {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .windmap-stat-value {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--indigo-700);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .windmap-stat-value .unit {
      font-size: 0.85rem;
      color: var(--ochre-500);
      font-weight: 500;
      margin-left: 2px;
    }
    .windmap-stat-label {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--indigo-400);
    }

    /* Route selector */
    .windmap-routes {
      position: absolute;
      bottom: 24px;
      right: 24px;
      display: flex;
      gap: 8px;
      z-index: 2;
    }
    .route-btn {
      padding: 8px 16px;
      background: rgba(251, 247, 236, 0.85);
      border: 1px solid var(--ochre-300);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--indigo-500);
      transition: all 0.3s ease;
    }
    .route-btn.active,
    .route-btn:hover {
      background: var(--indigo-600);
      color: var(--paper-50);
      border-color: var(--indigo-600);
    }

    /* =========================================================
       Stamp Gallery Section
       ========================================================= */
    .gallery {
      background: var(--paper-100);
      position: relative;
    }
    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 64px;
      gap: 40px;
      flex-wrap: wrap;
    }
    .gallery-filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 10px 20px;
      border: 1px solid var(--ochre-300);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--indigo-500);
      background: var(--paper-50);
      transition: all 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    .filter-btn:hover,
    .filter-btn.active {
      background: var(--indigo-600);
      color: var(--paper-50);
      border-color: var(--indigo-600);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(20, 29, 62, 0.2);
    }

    .stamp-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 40px 32px;
    }
    .stamp-card {
      position: relative;
      aspect-ratio: 3 / 4;
      perspective: 1000px;
      cursor: none;
    }
    .stamp-card-inner {
      position: relative;
      width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.2, 0.9, 0.3, 1);
      will-change: transform;
    }
    .stamp-card:hover .stamp-card-inner {
      transform: rotateY(10deg) rotateX(-5deg) translateY(-6px);
    }
    .stamp-card-front,
    .stamp-card-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 4px;
      overflow: hidden;
    }
    .stamp-card-front {
      background: var(--paper-50);
      border: 2px solid var(--ochre-400);
      display: flex;
      flex-direction: column;
      padding: 14px;
      box-shadow: 0 4px 20px rgba(36, 48, 92, 0.1);
      transition: box-shadow 0.4s ease;
    }
    .stamp-card:hover .stamp-card-front {
      box-shadow:
        0 20px 40px rgba(36, 48, 92, 0.2),
        0 0 0 1px var(--brass-400),
        0 0 30px rgba(212, 175, 90, 0.2);
    }
    /* Perforated edge effect */
    .stamp-card-front::before,
    .stamp-card-front::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 10px;
      background-image: radial-gradient(circle, var(--paper-100) 3.5px, transparent 4px);
      background-size: 12px 12px;
      background-position: -6px center;
      background-repeat: repeat-x;
    }
    .stamp-card-front::before { top: -5px; }
    .stamp-card-front::after { bottom: -5px; transform: rotate(180deg); }

    .stamp-art {
      flex: 1;
      background: var(--ochre-50);
      border-radius: 2px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .stamp-art svg {
      width: 60%; height: 60%;
      color: var(--indigo-600);
    }
    .stamp-art::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), transparent 50%);
      pointer-events: none;
    }
    .stamp-info {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 4px;
    }
    .stamp-name {
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--indigo-700);
      line-height: 1.2;
    }
    .stamp-value {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--vermilion-500);
      font-weight: 500;
    }
    .stamp-series {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ochre-500);
      margin-top: 4px;
      padding: 0 4px;
    }

    /* Shine sweep on hover */
    .stamp-art::after {
      content: '';
      position: absolute;
      top: -50%; left: -60%;
      width: 40%; height: 200%;
      background: linear-gradient(105deg, transparent, rgba(255, 255, 255, 0.6), transparent);
      transform: skewX(-20deg);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .stamp-card:hover .stamp-art::after {
      opacity: 1;
      animation: shineSweep 1.2s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    }
    @keyframes shineSweep {
      0% { left: -60%; opacity: 1; }
      100% { left: 120%; opacity: 0; }
    }

    /* =========================================================
       Manifesto / CTA Section
       ========================================================= */
    .manifesto {
      background: var(--indigo-800);
      color: var(--paper-50);
      text-align: center;
      padding: 180px var(--gutter);
      position: relative;
      overflow: hidden;
    }
    .manifesto::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 30%, rgba(212, 84, 42, 0.2), transparent 60%),
        radial-gradient(circle at 20% 80%, rgba(232, 201, 122, 0.08), transparent 40%);
      pointer-events: none;
    }
    .manifesto-inner {
      position: relative;
      z-index: 1;
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }
    .manifesto-wax {
      width: 120px; height: 120px;
      margin-bottom: 16px;
      position: relative;
    }
    .manifesto-wax img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 10px 40px rgba(212, 84, 42, 0.4);
    }
    .manifesto-quote {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 4vw, 2.8rem);
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: -0.01em;
      margin: 0;
    }
    .manifesto-quote em {
      font-style: italic;
      color: var(--brass-300);
      font-family: var(--font-serif);
      font-weight: 600;
    }
    .manifesto-text {
      font-size: 1.1rem;
      line-height: 1.7;
      color: var(--indigo-200);
      max-width: 560px;
      margin: 0;
    }
    .manifesto-cta {
      margin-top: 20px;
      padding: 18px 48px;
      background: var(--vermilion-500);
      color: var(--paper-50);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border-radius: 999px;
      transition: all 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(212, 84, 42, 0.4);
    }
    .manifesto-cta:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 40px rgba(212, 84, 42, 0.5);
      background: var(--vermilion-400);
    }
    .manifesto-cta::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      transform: skewX(-25deg);
      transition: left 0.7s cubic-bezier(0.7, 0, 0.3, 1);
    }
    .manifesto-cta:hover::before { left: 140%; }

    /* =========================================================
       Footer
       ========================================================= */
    .footer {
      background: var(--indigo-900, #030712);
      color: var(--indigo-300);
      padding: 80px var(--gutter) 40px;
      position: relative;
    }
    .footer-top {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 60px;
      padding-bottom: 60px;
      border-bottom: 1px solid rgba(151, 161, 200, 0.15);
    }
    .footer-brand {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .footer-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--paper-50);
    }
    .footer-tagline {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1rem;
      color: var(--indigo-300);
      max-width: 320px;
      line-height: 1.6;
    }
    .footer-col-title {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--brass-400);
      margin-bottom: 20px;
    }
    .footer-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .footer-link {
      font-size: 0.95rem;
      color: var(--indigo-300);
      transition: color 0.3s ease, transform 0.3s ease;
      display: inline-block;
    }
    .footer-link:hover {
      color: var(--paper-50);
      transform: translateX(4px);
    }
    .footer-bottom {
      padding-top: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: var(--indigo-400);
    }

    /* =========================================================
       Floating Particles (Rain / Wind)
       ========================================================= */
    .particles-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    /* =========================================================
       Responsive
       ========================================================= */
    @media (max-width: 1024px) {
      .writing-grid { grid-template-columns: 1fr; gap: 48px; }
      .writing-tools { position: static; flex-direction: row; flex-wrap: wrap; }
      .writing-tool { flex: 1 1 260px; }
      .hero-envelope { display: none; }
      .footer-top { grid-template-columns: 1fr 1fr; gap: 40px; }
      .journey-step { grid-template-columns: 1fr auto; }
      .journey-step-visual { display: none; }
      .journey-step-content { grid-column: 1; text-align: left; padding-right: 20px; padding-left: 0; }
      .journey-step:nth-child(even) .journey-step-content { grid-column: 1; padding-left: 0; }
      .journey-scroll-track { left: calc(100% - 20px); }
    }

    @media (max-width: 640px) {
      body { cursor: auto; }

          targetY = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
          if (!rafId) rafId = requestAnimationFrame(animate);
        };

        const animate = () => {
          currentX += (targetX - currentX) * friction;
          currentY += (targetY - currentY) * friction;

          if (bgRef.current) {
            bgRef.current.style.transform = `scale(1.05) translate(${currentX * -15}px, ${currentY * -10}px)`;

          if (envelopeRef.current) {

          if (Math.abs(targetX - currentX) > 0.01 || Math.abs(targetY - currentY) > 0.01) {

            rafId = null;

        if (typeTimerRef.current) {
          clearTimeout(typeTimerRef.current);
          typeTimerRef.current = null;

        setText('');
        setIsTyping(true);
        let i = 0;

        const typeChar = () => {
          if (i < sample.length) {
            setText(sample.slice(0, i + 1));
            i++;
            // Variable timing for natural feel
            const char = sample[i - 1];
            const delay = char === '\n' ? 300 : char === '，' || char === '。' ? 180 : 40 + Math.random() * 40;
            typeTimerRef.current = setTimeout(typeChar, delay);
          } else {
            setIsTyping(false);
          }
        };

        typeTimerRef.current = setTimeout(typeChar, 300);
      }, []);

      useEffect(() => {
        // Trigger on first view
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting && text === '' && !isTyping) {

          { threshold: 0.3 }

        if (prefersReducedMotion) return;
        const el = paperRef.current;
        if (!el) return;

        let rafId = null;
        let targetRx = 1, targetRy = -3;
        let currentRx = 1, currentRy = -3;
        const friction = 0.08;

        const onMove = (e) => {
          const rect = el.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width - 0.5;
          const y = (e.clientY - rect.top) / rect.height - 0.5;
          targetRy = x * -6;
          targetRx = y * 4;
          if (!rafId) rafId = requestAnimationFrame(animate);
        };

        const animate = () => {
          currentRx += (targetRx - currentRx) * friction;
          currentRy += (targetRy - currentRy) * friction;
          el.style.transform = `perspective(1000px) rotateY(${currentRy}deg) rotateX(${currentRx}deg)`;
          if (Math.abs(targetRx - currentRx) > 0.01 || Math.abs(targetRy - currentRy) > 0.01) {
            rafId = requestAnimationFrame(animate);
          } else {
            rafId = null;
          }
        };

        const onLeave = () => {
          targetRx = 1;
          targetRy = -3;
          if (!rafId) rafId = requestAnimationFrame(animate);
        };

        el.addEventListener('mousemove', onMove);
        el.addEventListener('mouseleave', onLeave);
        return () => {
          el.removeEventListener('mousemove', onMove);
          el.removeEventListener('mouseleave', onLeave);
          if (rafId) cancelAnimationFrame(rafId);
        };
      }, []);

      const handleSample = (idx) => {
        setSampleIdx(idx);
        startTypewriter(letterSamples[idx]);
      };

      const handleSend = () => {
        if (typeTimerRef.current) {
          clearTimeout(typeTimerRef.current);
          typeTimerRef.current = null;
        }
        setIsTyping(false);
        // Ripple on send — simulate via small animation
        setText((t) => t + '  ✉');
      };

      useEffect(() => {
        return () => {
          if (typeTimerRef.current) clearTimeout(typeTimerRef.current);
        };
      }, []);

    // =========================================================
    // Wind Route Map Section
    // =========================================================
    const WindMap = () => {
      const canvasRef = useRef(null);
      const [activeRoute, setActiveRoute] = useState(0);
      const rafRef = useRef(null);
      const particlesRef = useRef([]);

      const routes = [
        { name: '西南季风', color: '#D4542A', speed: 1.2 },
        { name: '东北季风', color: '#414D85', speed: 0.9 },
        { name: '台风季', color: '#B03A17', speed: 1.8 },
      ];

      const [stats, setStats] = useState({ wind: 0, distance: 0, days: 0 });
      const statTargets = [
        { wind: 28, distance: 5240, days: 47 },
        { wind: 22, distance: 4860, days: 53 },
        { wind: 45, distance: 3120, days: 28 },
      ];

      // Animate stats when route changes
      useEffect(() => {
        if (prefersReducedMotion) {
          setStats(statTargets[activeRoute]);
          return;
        }

        const target = statTargets[activeRoute];
        const start = { ...stats };
        const duration = 900;
        let startTime = null;
        let rafId = null;

        const easeOut = (t) => 1 - Math.pow(1 - t, 3);

        const animate = (ts) => {
          if (!startTime) startTime = ts;
          const p = Math.min((ts - startTime) / duration, 1);
          const e = easeOut(p);
          setStats({
            wind: Math.round(start.wind + (target.wind - start.wind) * e),
            distance: Math.round(start.distance + (target.distance - start.distance) * e),
            days: Math.round(start.days + (target.days - start.days) * e),
          });
          if (p < 1) rafId = requestAnimationFrame(animate);
        };

        rafId = requestAnimationFrame(animate);
        return () => {
          if (rafId) cancelAnimationFrame(rafId);
        };
      }, [activeRoute]);

      // Canvas wind particles
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;

        const resize = () => {
          const rect = canvas.getBoundingClientRect();
          canvas.width = rect.width * dpr;
          canvas.height = rect.height * dpr;
          ctx.scale(dpr, dpr);
        };
        resize();
        window.addEventListener('resize', resize);

        // Create wind particles with route-based direction
        const route = routes[activeRoute];
        const angle = activeRoute === 0 ? -30 : activeRoute === 1 ? 150 : 80;
        const rad = (angle * Math.PI) / 180;

        const particles = [];
        const count = 80;
        const w = canvas.offsetWidth;
        const h = canvas.offsetHeight;

        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * w,
            y: Math.random() * h,
            len: 10 + Math.random() * 30,
            speed: (0.5 + Math.random() * 1.5) * route.speed,
            opacity: 0.2 + Math.random() * 0.6,
            size: 0.8 + Math.random() * 1.2,
          });
        }
        particlesRef.current = particles;

        let running = true;

        const render = () => {
          if (!running) return;
          ctx.clearRect(0, 0, w, h);

          // Draw map-like grid
          ctx.strokeStyle = 'rgba(176, 106, 30, 0.08)';
          ctx.lineWidth = 1;
          for (let x = 0; x < w; x += 40) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, h);
            ctx.stroke();
          }
          for (let y = 0; y < h; y += 40) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
            ctx.stroke();
          }

          // Draw stylized continents (abstract shapes)
          ctx.fillStyle = 'rgba(176, 106, 30, 0.1)';
          ctx.strokeStyle = 'rgba(176, 106, 30, 0.3)';
          ctx.lineWidth = 1.5;
          // Left landmass
          ctx.beginPath();
          ctx.moveTo(w * 0.05, h * 0.3);
          ctx.quadraticCurveTo(w * 0.15, h * 0.2, w * 0.2, h * 0.35);
          ctx.quadraticCurveTo(w * 0.22, h * 0.55, w * 0.15, h * 0.7);
          ctx.quadraticCurveTo(w * 0.05, h * 0.75, w * 0.03, h * 0.55);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Right landmass
          ctx.beginPath();
          ctx.moveTo(w * 0.75, h * 0.25);
          ctx.quadraticCurveTo(w * 0.88, h * 0.2, w * 0.95, h * 0.4);
          ctx.quadraticCurveTo(w * 0.97, h * 0.65, w * 0.85, h * 0.75);
          ctx.quadraticCurveTo(w * 0.72, h * 0.7, w * 0.7, h * 0.5);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Central islands
          ctx.fillStyle = 'rgba(176, 106, 30, 0.12)';
          ctx.beginPath();
          ctx.ellipse(w * 0.45, h * 0.5, w * 0.06, h * 0.04, 0.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.beginPath();
          ctx.ellipse(w * 0.55, h * 0.4, w * 0.04, h * 0.03, -0.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Route line
          ctx.strokeStyle = route.color;
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 6]);
          ctx.globalAlpha = 0.5;
          ctx.beginPath();
          if (activeRoute === 0) {
            ctx.moveTo(w * 0.12, h * 0.55);
            ctx.quadraticCurveTo(w * 0.4, h * 0.25, w * 0.82, h * 0.4);
          } else if (activeRoute === 1) {
            ctx.moveTo(w * 0.82, h * 0.45);
            ctx.quadraticCurveTo(w * 0.55, h * 0.65, w * 0.12, h * 0.5);
          } else {
            ctx.moveTo(w * 0.3, h * 0.75);
            ctx.quadraticCurveTo(w * 0.55, h * 0.3, w * 0.9, h * 0.5);
          }
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = 1;

          // Port dots
          const ports = activeRoute === 0
            ? [[0.12, 0.55], [0.45, 0.48], [0.82, 0.4]]
            : activeRoute === 1
            ? [[0.82, 0.45], [0.55, 0.55], [0.12, 0.5]]
            : [[0.3, 0.75], [0.55, 0.4], [0.9, 0.5]];

          ports.forEach(([px, py], idx) => {
            ctx.fillStyle = route.color;
            ctx.beginPath();
            ctx.arc(w * px, h * py, 5, 0, Math.PI * 2);
            ctx.fill();
            // Glow pulse
            const pulseSize = 5 + Math.sin(Date.now() / 500 + idx) * 3;
            ctx.strokeStyle = route.color;
            ctx.globalAlpha = 0.4;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(w * px, h * py, pulseSize + 3, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 1;
          });

          // Wind streak particles
          const dx = Math.cos(rad);
          const dy = Math.sin(rad);

          particles.forEach((p) => {
            ctx.strokeStyle = route.color;
            ctx.globalAlpha = p.opacity * 0.7;
            ctx.lineWidth = p.size;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x + dx * p.len, p.y + dy * p.len);
            ctx.stroke();

            // Move
            p.x += dx * p.speed;
            p.y += dy * p.speed;

            // Wrap around
            if (p.x > w + 50) p.x = -50;
            if (p.x < -50) p.x = w + 50;
            if (p.y > h + 50) p.y = -50;
            if (p.y < -50) p.y = h + 50;
          });
          ctx.globalAlpha = 1;

          rafRef.current = requestAnimationFrame(render);
        };

        render();

        // Pause on visibility change
        const onVis = () => {
          if (document.hidden) {
            running = false;
            if (rafRef.current) cancelAnimationFrame(rafRef.current);
          } else {
            running = true;
            render();
          }
        };
        document.addEventListener('visibilitychange', onVis);

        return () => {
          running = false;
          window.removeEventListener('resize', resize);
          document.removeEventListener('visibilitychange', onVis);
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
        };
      }, [activeRoute]);

      return (
        <section className="section windmap" id="windmap">
          <div className="section-header reveal">
            <span className="section-eyebrow">Wind Routes · 风向航线图</span>
            <h2 className="section-title">
              追踪<em>风的轨迹</em>
            </h2>
            <p className="section-desc">
              实时显示三股季风的风速、航线与航程。
              拖动或悬停查看沿途港口，点击切换不同季节的航线。
            </p>
          </div>

          <div className="windmap-container reveal">
            <canvas ref={canvasRef} className="windmap-canvas"></canvas>

            <div className="windmap-legend">
              <div className="windmap-legend-item">
                <span className="windmap-legend-dot ochre"></span>
                <span>港口城市</span>
              </div>
              <div className="windmap-legend-item">
                <span className="windmap-legend-dot vermilion"></span>
                <span>当前航线</span>
              </div>
              <div className="windmap-legend-item">
                <span className="windmap-legend-dot indigo"></span>
                <span>风向流</span>
              </div>
            </div>

            <div className="windmap-stats">
              <div className="windmap-stat">
                <span className="windmap-stat-value">
                  {stats.wind}<span className="unit">节</span>
                </span>
                <span className="windmap-stat-label">平均风速</span>
              </div>
              <div className="windmap-stat">
                <span className="windmap-stat-value">
                  {stats.distance.toLocaleString()}<span className="unit">浬</span>
                </span>
                <span className="windmap-stat-label">航线距离</span>
              </div>
              <div className="windmap-stat">
                <span className="windmap-stat-value">
                  {stats.days}<span className="unit">天</span>
                </span>
                <span className="windmap-stat-label">预计航程</span>
              </div>
            </div>

            <div className="windmap-routes">
              {routes.map((r, i) => (
                <button
                  key={i}
                  className={`route-btn interactive ${activeRoute === i ? 'active' : ''}`}
                  onClick={() => setActiveRoute(i)}
                >
                  {r.name}
                </button>
              ))}
            </div>
          </div>
        </section>
      );
    };

          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.12, rootMargin: '0px 0px -60px 0px' }
        );

        const els = document.querySelectorAll('.reveal');
        els.forEach((el) => observer.observe(el));
        return () => observer.disconnect();
      }, []);

      return (
        <>
          <Navigation />
          <Hero />
          <JourneySection />
          <WritingRoom />
          <WindMap />
          <StampGallery />
          <Manifesto />
          <Footer />
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <script>
    // =========================================================
    // Custom Cursor (vanilla JS, direct DOM, no React)
    // =========================================================
    (function() {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduced) return;

      const outer = document.getElementById('cursorOuter');
      const inner = document.getElementById('cursorInner');
      const dot = document.getElementById('cursorDot');
      if (!outer || !inner || !dot) return;

      // Spring physics
      const state = {
        mouseX: window.innerWidth / 2,
        mouseY: window.innerHeight / 2,
        outerX: window.innerWidth / 2,
        outerY: window.innerHeight / 2,
        innerX: window.innerWidth / 2,
        innerY: window.innerHeight / 2,
        dotX: window.innerWidth / 2,
        dotY: window.innerHeight / 2,
      };

      // Spring constants (Hooke's law: F = -kx - damping*v)
      const outerSpring = { k: 0.06, damping: 0.75, vx: 0, vy: 0 };
      const innerSpring = { k: 0.12, damping: 0.7, vx: 0, vy: 0 };
      const dotSpring = { k: 0.25, damping: 0.6, vx: 0, vy: 0 };

      let rafId = null;
      let running = true;

      const springStep = (current, target, spring, dt) => {
        const force = (target - current) * spring.k;
        spring.vx += force;
        spring.vx *= spring.damping;
        return current + spring.vx;
      };

      const animate = () => {
        if (!running) return;

        state.outerX += (state.mouseX - state.outerX) * outerSpring.k;
        state.outerY += (state.mouseY - state.outerY) * outerSpring.k;

        state.innerX += (state.mouseX - state.innerX) * innerSpring.k;
        state.innerY += (state.mouseY - state.innerY) * innerSpring.k;

        state.dotX += (state.mouseX - state.dotX) * dotSpring.k;
        state.dotY += (state.mouseY - state.dotY) * dotSpring.k;

        outer.style.transform = `translate(${state.outerX}px, ${state.outerY}px) translate(-50%, -50%)`;
        inner.style.transform = `translate(${state.innerX}px, ${state.innerY}px) translate(-50%, -50%)`;
        dot.style.transform = `translate(${state.dotX}px, ${state.dotY}px) translate(-50%, -50%)`;

        rafId = requestAnimationFrame(animate);
      };

      const onMove = (e) => {
        state.mouseX = e.clientX;
        state.mouseY = e.clientY;
      };

      const onDown = (e) => {
        document.body.classList.add('cursor-click');
        // Ripple effect
        const ripple = document.createElement('div');
        ripple.className = 'cursor-ripple';
        ripple.style.left = e.clientX + 'px';
        ripple.style.top = e.clientY + 'px';
        document.body.appendChild(ripple);
        setTimeout(() => ripple.remove(), 700);
      };

      const onUp = () => {
        document.body.classList.remove('cursor-click');
      };

      // Hover detection
      const addHoverListeners = () => {
        const interactives = document.querySelectorAll('.interactive, a, button, [role="button"]');
        interactives.forEach((el) => {
          if (el.dataset.cursorBound) return;
          el.dataset.cursorBound = '1';
          el.addEventListener('mouseenter', () => {
            document.body.classList.add('cursor-hover');
          });
          el.addEventListener('mouseleave', () => {
            document.body.classList.remove('cursor-hover');
            document.body.classList.remove('cursor-text');
          });
        });
      };

      // Initial bind
      addHoverListeners();
      // Re-bind periodically for dynamic content
      const hoverObserver = new MutationObserver(addHoverListeners);
      hoverObserver.observe(document.body, { childList: true, subtree: true });

      window.addEventListener('mousemove', onMove);
      window.addEventListener('mousedown', onDown);
      window.addEventListener('mouseup', onUp);

      // Start animation immediately (cursor appears at center)
      animate();

      // Visibility pause
      const onVis = () => {
        if (document.hidden) {
          running = false;
          if (rafId) cancelAnimationFrame(rafId);
        } else {
          running = true;
          animate();
        }
      };
      document.addEventListener('visibilitychange', onVis);

      // Cleanup on unload
      window.addEventListener('beforeunload', () => {
        running = false;
        if (rafId) cancelAnimationFrame(rafId);
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mousedown', onDown);
        window.removeEventListener('mouseup', onUp);
        document.removeEventListener('visibilitychange', onVis);
        hoverObserver.disconnect();
      });
    })();

    // =========================================================
    // Global Particle Layer (wind/rain particles with parallax)
    // =========================================================
    (function() {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduced) return;

      const canvas = document.getElementById('particlesCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;

      let width, height;
      const resize = () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      };
      resize();
      window.addEventListener('resize', resize);

      // Particle types: wind streaks + paper flecks
      const particles = [];
      const WIND_COUNT = 30;
      const FLECK_COUNT = 25;

      for (let i = 0; i < WIND_COUNT; i++) {
        particles.push({
          type: 'wind',
          x: Math.random() * width,
          y: Math.random() * height,
          len: 30 + Math.random() * 80,
          speed: 0.3 + Math.random() * 0.8,
          opacity: 0.05 + Math.random() * 0.12,
          angle: -15 + Math.random() * 10,
          thickness: 0.6 + Math.random() * 0.8,
        });
      }

      for (let i = 0; i < FLECK_COUNT; i++) {
        particles.push({
          type: 'fleck',
          x: Math.random() * width,
          y: Math.random() * height,
          size: 1 + Math.random() * 2.5,
          speed: 0.15 + Math.random() * 0.4,
          opacity: 0.15 + Math.random() * 0.25,
          angle: -10 + Math.random() * 20,
          rotation: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.02,
          driftPhase: Math.random() * Math.PI * 2,
          driftSpeed: 0.01 + Math.random() * 0.02,
        });
      }

      let running = true;
      let rafId = null;
      let scrollY = 0;

      const onScroll = () => {
        scrollY = window.scrollY;
      };
      window.addEventListener('scroll', onScroll, { passive: true });

      const render = () => {
        if (!running) return;
        ctx.clearRect(0, 0, width, height);

        // Only show particles when not scrolled too far (top atmosphere)
        const scrollFactor = Math.max(0, 1 - scrollY / 800);
        if (scrollFactor < 0.02) {
          rafId = requestAnimationFrame(render);
          return;
        }

        particles.forEach((p) => {
          const alpha = p.opacity * scrollFactor;

          if (p.type === 'wind') {
            const rad = (p.angle * Math.PI) / 180;
            ctx.strokeStyle = `rgba(36, 48, 92, ${alpha})`;
            ctx.lineWidth = p.thickness;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x + Math.cos(rad) * p.len, p.y + Math.sin(rad) * p.len);
            ctx.stroke();

            const rad2 = (p.angle * Math.PI) / 180;
            p.x += Math.cos(rad2) * p.speed;
            p.y += Math.sin(rad2) * p.speed;

            if (p.x > width + 100) { p.x = -100; p.y = Math.random() * height; }
            if (p.x < -100) { p.x = width + 100; p.y = Math.random() * height; }
            if (p.y > height + 100) { p.y = -100; p.x = Math.random() * width; }
            if (p.y < -100) { p.y = height + 100; p.x = Math.random() * width; }
          } else if (p.type === 'fleck') {
            // Paper flecks with sine drift
            p.driftPhase += p.driftSpeed;
            const drift = Math.sin(p.driftPhase) * 0.5;
            const rad = ((p.angle + drift * 10) * Math.PI) / 180;

            p.x += Math.cos(rad) * p.speed + drift * 0.3;
            p.y += Math.sin(rad) * p.speed;
            p.rotation += p.rotSpeed;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotation);
            ctx.fillStyle = `rgba(176, 106, 30, ${alpha})`;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
            ctx.restore();

            if (p.y > height + 50) { p.y = -50; p.x = Math.random() * width; }
            if (p.x > width + 50) p.x = -50;
            if (p.x < -50) p.x = width + 50;
          }
        });

        rafId = requestAnimationFrame(render);
      };

      render();

      const onVis = () => {
        if (document.hidden) {
          running = false;
          if (rafId) cancelAnimationFrame(rafId);
        } else {
          running = true;
          render();
        }
      };
      document.addEventListener('visibilitychange', onVis);

      window.addEventListener('beforeunload', () => {
        running = false;
        if (rafId) cancelAnimationFrame(rafId);
        window.removeEventListener('resize', resize);
        window.removeEventListener('scroll', onScroll);
        document.removeEventListener('visibilitychange', onVis);
      });
    })();

    // =========================================================
    // Hero wind canvas (more prominent wind streaks)
    // =========================================================
    (function() {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduced) return;

      const canvas = document.getElementById('heroWindCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;

      let width, height;
      const resize = () => {
        const rect = canvas.getBoundingClientRect();
        width = rect.width;
        height = rect.height;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      };

      // Wait for layout
      requestAnimationFrame(() => {
        resize();
        init();
      });

      window.addEventListener('resize', resize);

      // Wind streak particles + a few larger "wind veins"
      let streaks = [];
      let veins = [];
      let running = true;
      let rafId = null;

      function init() {
        streaks = [];
        veins = [];

        for (let i = 0; i < 50; i++) {
          streaks.push({
            x: Math.random() * width,
            y: Math.random() * height,
            len: 20 + Math.random() * 120,
            speed: 0.4 + Math.random() * 1.5,
            opacity: 0.06 + Math.random() * 0.15,
            angle: -20 + Math.random() * 15,
            thickness: 0.5 + Math.random() * 1,
          });
        }

        for (let i = 0; i < 5; i++) {
          veins.push({
            y: height * 0.2 + Math.random() * height * 0.6,
            amplitude: 15 + Math.random() * 25,
            speed: 0.002 + Math.random() * 0.004,
            phase: Math.random() * Math.PI * 2,
            opacity: 0.04 + Math.random() * 0.06,
            thickness: 1 + Math.random() * 1.5,
          });
        }

        render();
      }

      const render = () => {
        if (!running) return;
        ctx.clearRect(0, 0, width, height);

        // Draw wind veins (large wavy lines)
        veins.forEach((v) => {
          ctx.strokeStyle = `rgba(176, 106, 30, ${v.opacity})`;
          ctx.lineWidth = v.thickness;
          ctx.lineCap = 'round';
          ctx.beginPath();
          for (let x = 0; x <= width; x += 10) {
            const waveY = v.y + Math.sin(x * 0.005 + v.phase) * v.amplitude;
            if (x === 0) ctx.moveTo(x, waveY);
            else ctx.lineTo(x, waveY);
          }
          ctx.stroke();
          v.phase += v.speed;
        });

        // Draw streaks
        streaks.forEach((p) => {
          const rad = (p.angle * Math.PI) / 180;
          const grad = ctx.createLinearGradient(p.x, p.y, p.x + Math.cos(rad) * p.len, p.y + Math.sin(rad) * p.len);
          grad.addColorStop(0, `rgba(212, 84, 42, 0)`);
          grad.addColorStop(0.5, `rgba(176, 106, 30, ${p.opacity})`);
          grad.addColorStop(1, `rgba(36, 48, 92, 0)`);
          ctx.strokeStyle = grad;
          ctx.lineWidth = p.thickness;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x + Math.cos(rad) * p.len, p.y + Math.sin(rad) * p.len);
          ctx.stroke();

          p.x += Math.cos(rad) * p.speed;
          p.y += Math.sin(rad) * p.speed;

          if (p.x > width + 100) { p.x = -100; p.y = Math.random() * height; }
          if (p.y > height + 100) { p.y = -100; p.x = Math.random() * width; }
        });

        rafId = requestAnimationFrame(render);
      };

      const onVis = () => {
        if (document.hidden) {
          running = false;
          if (rafId) cancelAnimationFrame(rafId);
        } else {
          running = true;
          if (width && height) render();
        }
      };
      document.addEventListener('visibilitychange', onVis);

      window.addEventListener('beforeunload', () => {
        running = false;
        if (rafId) cancelAnimationFrame(rafId);
        window.removeEventListener('resize', resize);
        document.removeEventListener('visibilitychange', onVis);
      });
    })();

    // =========================================================
    // Magnetic attraction for certain elements (inverse square)
    // =========================================================
    (function() {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduced) return;
      if (window.innerWidth < 640) return;

      let elements = [];
      let mouseX = -9999, mouseY = -9999;
      let rafId = null;
      let running = true;

      const STRENGTH = 0.15;
      const MAX_DIST = 120;

      const findMagnetic = () => {
        elements = Array.from(document.querySelectorAll('.btn-primary, .manifesto-cta, .nav-cta')).map((el) => ({
          el,
          baseX: 0,
          baseY: 0,
          curX: 0,
          curY: 0,
        }));
      };

      const updatePositions = () => {
        elements.forEach((item) => {
          const rect = item.el.getBoundingClientRect();
          item.baseX = rect.left + rect.width / 2;
          item.baseY = rect.top + rect.height / 2;
        });
      };

      const animate = () => {
        if (!running) return;
        updatePositions();

        elements.forEach((item) => {
          const dx = mouseX - item.baseX;
          const dy = mouseY - item.baseY;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < MAX_DIST && dist > 0) {
            // Inverse square-like pull, but softer
            const force = (1 - dist / MAX_DIST) * STRENGTH * 15;
            const targetX = (dx / dist) * force;
            const targetY = (dy / dist) * force;
            item.curX += (targetX - item.curX) * 0.12;
            item.curY += (targetY - item.curY) * 0.12;
          } else {
            // Spring back
            item.curX += (0 - item.curX) * 0.08;
            item.curY += (0 - item.curY) * 0.08;
          }

          item.el.style.transform = `translate(${item.curX}px, ${item.curY}px)`;
        });

        rafId = requestAnimationFrame(animate);
      };

      const onMove = (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      };

      // Initialize after content renders
      setTimeout(() => {
        findMagnetic();
        animate();
      }, 2000);

      window.addEventListener('mousemove', onMove);

      // Re-scan for new elements
      const observer = new MutationObserver(() => {
        findMagnetic();
      });
      observer.observe(document.body, { childList: true, subtree: true });

      const onVis = () => {
        if (document.hidden) {
          running = false;
          if (rafId) cancelAnimationFrame(rafId);
        } else {
          running = true;
          animate();
        }
      };
      document.addEventListener('visibilitychange', onVis);

      window.addEventListener('beforeunload', () => {
        running = false;
        if (rafId) cancelAnimationFrame(rafId);
        window.removeEventListener('mousemove', onMove);
        document.removeEventListener('visibilitychange', onVis);
        observer.disconnect();
      });
    })();
  </script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>远航班机 LONG HAUL · 航空黄金时代档案展</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Special+Elite&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" />
  <style>
    :root {
      --wine: #7A1E2B;
      --wine-deep: #5a1520;
      --wine-light: #9a2a3a;
      --cream: #F5EBDD;
      --cream-dark: #e8dcc8;
      --gold: #B98A44;
      --gold-light: #d6a85e;
      --gold-deep: #8a6430;
      --charcoal: #221E1B;
      --ink: #2b2622;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: var(--cream);
      color: var(--charcoal);
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 18px;
      line-height: 1.6;
      overflow-x: hidden;
      cursor: none;
    }

    /* Paper texture overlay */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        radial-gradient(ellipse at 20% 30%, rgba(122,30,43,0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(185,138,68,0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: 1;
    }

    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.06'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 2;
      mix-blend-mode: multiply;
    }

    /* ====== CUSTOM CURSOR ====== */
    .cursor-ring {
      position: fixed;
      top: 50%; left: 50%;
      width: 40px; height: 40px;
      border: 2px solid var(--cream);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.3s cubic-bezier(0.2, 0.8, 0.2, 1),
                  height 0.3s cubic-bezier(0.2, 0.8, 0.2, 1),
                  border-color 0.3s ease,
                  background 0.3s ease;
      box-shadow:
        0 0 20px rgba(185, 138, 68, 0.6),
        0 0 40px rgba(185, 138, 68, 0.3),
        inset 0 0 10px rgba(245, 235, 221, 0.2);
      will-change: transform;
      mix-blend-mode: difference;
    }

    .cursor-dot {
      position: fixed;
      top: 50%; left: 50%;
      width: 6px; height: 6px;
      background: var(--gold);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10000;
      transform: translate(-50%, -50%);
      box-shadow:
        0 0 8px var(--gold),
        0 0 16px rgba(185, 138, 68, 0.6);
      transition: transform 0.15s ease, background 0.3s ease;
      will-change: transform;
    }

    .cursor-ring.hover {
      width: 60px; height: 60px;
      border-color: var(--gold);
      background: rgba(185, 138, 68, 0.1);
    }

    .cursor-ring.clicking {
      width: 30px; height: 30px;
      border-color: var(--wine-light);
    }

    .cursor-ripple {
      position: fixed;
      width: 20px; height: 20px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      animation: cursorRipple 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes cursorRipple {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(4); opacity: 0; }
    }

    /* ====== NAV ====== */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 24px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(34,30,27,0.9) 0%, rgba(34,30,27,0) 100%);
      backdrop-filter: blur(4px);
      transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .nav.scrolled {
      background: rgba(34, 30, 27, 0.95);
      padding: 16px 48px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.3);
    }

    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--cream);
      letter-spacing: 3px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-logo-wings {
      font-size: 14px;
      color: var(--gold);
      letter-spacing: 1px;
      font-family: 'Special Elite', monospace;
    }

    .nav-links {
      display: flex;
      gap: 36px;
      list-style: none;
    }

    .nav-links a {
      color: var(--cream);
      text-decoration: none;
      font-family: 'Special Elite', monospace;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      position: relative;
      padding: 6px 0;
      transition: color 0.3s ease;
      cursor: none;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 0; height: 1px;
      background: var(--gold);
      transition: width 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-ticket-btn {
      padding: 10px 24px;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: 'Special Elite', monospace;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: transparent;
      cursor: none;
      position: relative;
      overflow: hidden;
      transition: color 0.4s ease;
    }

    .nav-ticket-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: var(--gold);
      transition: left 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: -1;
    }

    .nav-ticket-btn:hover {
      color: var(--charcoal);
    }

    .nav-ticket-btn:hover::before {
      left: 0;
    }

    /* ====== HERO ====== */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 700px;
      background: var(--charcoal);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 120%, rgba(122,30,43,0.3) 0%, transparent 60%),
        radial-gradient(ellipse at 20% 20%, rgba(185,138,68,0.1) 0%, transparent 40%),
        linear-gradient(180deg, #1a1715 0%, #2b231f 50%, #3d2a22 100%);
    }

    .hero-content {
      position: relative;
      z-index: 10;
      text-align: center;
      color: var(--cream);
      width: 90%;
      max-width: 900px;
    }

    .hero-eyebrow {
      font-family: 'Special Elite', monospace;
      font-size: 14px;
      letter-spacing: 6px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 24px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards;
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(48px, 8vw, 100px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: 4px;
      margin-bottom: 12px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s forwards;
    }

    .hero-title em {
      font-style: italic;
      color: var(--gold);
      font-weight: 600;
    }

    .hero-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(18px, 2.5vw, 28px);
      font-weight: 400;
      font-style: italic;
      letter-spacing: 2px;
      color: var(--cream-dark);
      margin-bottom: 40px;
      min-height: 40px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.8s forwards;
    }

    .hero-subtitle .cursor-blink {
      display: inline-block;
      width: 2px;
      background: var(--gold);
      margin-left: 4px;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .hero-meta {
      display: flex;
      justify-content: center;
      gap: 60px;
      margin-bottom: 48px;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 1.1s forwards;
    }

    .hero-meta-item {
      text-align: center;
    }

    .hero-meta-label {
      font-family: 'Special Elite', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .hero-meta-value {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--cream);
    }

    .hero-scroll {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--gold);
      font-family: 'Special Elite', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      z-index: 10;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 1.4s forwards;
    }

    .hero-scroll-line {
      width: 1px;
      height: 40px;
      background: var(--gold);
      margin: 12px auto 0;
      position: relative;
      overflow: hidden;
    }

    .hero-scroll-line::after {
      content: '';
      position: absolute;
      top: -40px; left: 0;
      width: 100%; height: 40px;
      background: var(--cream);
      animation: scrollDown 2s cubic-bezier(0.6, 0, 0.4, 1) infinite;
    }

    @keyframes scrollDown {
      0% { top: -40px; }
      100% { top: 40px; }
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Compass - hero center piece */
    .compass-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      opacity: 0.08;
      z-index: 2;
      pointer-events: none;
    }

    .compass-rose {
      position: absolute;
      inset: 0;
      animation: compassRotate 120s linear infinite;
    }

    .compass-needle {
      position: absolute;
      top: 50%; left: 50%;
      width: 4px;
      height: 45%;
      transform-origin: bottom center;
      transform: translate(-50%, -100%) rotate(0deg);
      animation: needleSway 8s ease-in-out infinite;
    }

    .compass-needle::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 60px solid var(--wine);
      filter: drop-shadow(0 0 10px rgba(122,30,43,0.5));
    }

    .compass-needle::after {
      content: '';
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 60px solid var(--gold);
      filter: drop-shadow(0 0 10px rgba(185,138,68,0.5));
    }

    @keyframes compassRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes needleSway {
      0%, 100% { transform: translate(-50%, -100%) rotate(-5deg); }
      50% { transform: translate(-50%, -100%) rotate(7deg); }
    }

    /* Flying particles */
    .particle {
      position: absolute;
      width: 3px; height: 3px;
      background: var(--gold);
      border-radius: 50%;
      pointer-events: none;
      z-index: 3;
      opacity: 0;
    }

    /* ====== SECTION COMMON ====== */
    .section {
      position: relative;
      padding: 120px 48px;
      z-index: 10;
    }

    .section-label {
      font-family: 'Special Elite', monospace;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--wine);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .section-label::before {
      content: '';
      width: 40px;
      height: 1px;
      background: var(--wine);
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(36px, 5vw, 64px);
      font-weight: 700;
      line-height: 1.1;
      color: var(--charcoal);
      margin-bottom: 16px;
    }

    .section-title em {
      font-style: italic;
      color: var(--wine);
      font-weight: 400;
    }

    .section-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-style: italic;
      color: var(--ink);
      opacity: 0.7;
      max-width: 600px;
      margin-bottom: 60px;
    }

    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1),
                  transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .reveal.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    /* ====== TICKET SECTION ====== */
    .ticket-section {
      background: var(--cream);
    }

    .ticket-section-inner {
      max-width: 1100px;
      margin: 0 auto;
    }

    .ticket-showcase {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }

    .ticket-card {
      position: relative;
      perspective: 1500px;
      height: 320px;
    }

    .ticket-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(0.2, 0.8, 0.2, 1);
      cursor: none;
    }

    .ticket-inner.flipped {
      transform: rotateY(180deg);
    }

    .ticket-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 4px;
      overflow: hidden;
      box-shadow:
        0 30px 60px rgba(34, 30, 27, 0.25),
        0 10px 20px rgba(34, 30, 27, 0.15);
    }

    .ticket-front {
      background: var(--cream);
      border: 1px solid var(--gold-deep);
      display: flex;
    }

    .ticket-main {
      flex: 1;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .ticket-main::after {
      content: '';
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 1px;
      border-right: 2px dashed var(--gold-deep);
    }

    .ticket-airline {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--wine);
      letter-spacing: 2px;
    }

    .ticket-airline-sub {
      font-family: 'Special Elite', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--gold-deep);
      text-transform: uppercase;
    }

    .ticket-flight-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ticket-city {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--charcoal);
      letter-spacing: 1px;
    }

    .ticket-city small {
      display: block;
      font-family: 'Special Elite', monospace;
      font-size: 10px;
      font-weight: normal;
      color: var(--gold-deep);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .ticket-arrow {
      width: 60px;
      height: 2px;
      background: var(--gold);
      position: relative;
      margin: 0 10px;
    }

    .ticket-arrow::before {
      content: '';
      position: absolute;
      right: 0; top: -4px;
      width: 0; height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 8px solid var(--gold);
    }

    .ticket-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(185, 138, 68, 0.3);
    }

    .ticket-detail-label {
      font-family: 'Special Elite', monospace;
      font-size: 8px;
      letter-spacing: 1.5px;
      color: var(--gold-deep);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .ticket-detail-value {
      font-family: 'Playfair Display', serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--charcoal);
    }

    .ticket-stub {
      width: 100px;
      background: var(--wine);
      color: var(--cream);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .ticket-stub::before {
      content: '';
      position: absolute;
      left: -3px; top: 0; bottom: 0;
      width: 6px;
      background: radial-gradient(circle, var(--cream) 35%, transparent 35%);
      background-size: 6px 12px;
      background-repeat: repeat-y;
    }

    .ticket-stub:hover {
      background: var(--wine-deep);
    }

    .ticket-stub-label {
      font-family: 'Special Elite', monospace;
      font-size: 8px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold-light);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    .ticket-stub-gate {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
    }

    .ticket-stub-tear {
      font-family: 'Special Elite', monospace;
      font-size: 7px;
      letter-spacing: 1px;
      color: var(--gold-light);
      text-transform: uppercase;
      writing-mode: vertical-rl;
    }

    .ticket-back {
      transform: rotateY(180deg);
      background: var(--cream-dark);
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .ticket-back h4 {
      font-family: 'Playfair Display', serif;
      font-size: 14px;
      color: var(--wine);
      letter-spacing: 1px;
    }

    .ticket-back p {
      font-family: 'Crimson Pro', serif;
      font-size: 12px;
      line-height: 1.5;
      color: var(--ink);
    }

    .ticket-stamp {
      position: absolute;
      top: 40%;
      left: 60%;
      transform: rotate(-15deg) scale(0);
      width: 100px;
      height: 100px;
      border: 3px solid var(--wine);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Special Elite', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--wine);
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .ticket-stamp.stamped {
      transform: rotate(-15deg) scale(1);
      opacity: 0.85;
    }

    .ticket-info h3 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--charcoal);
      margin-bottom: 20px;
      line-height: 1.2;
    }

    .ticket-info p {
      font-size: 17px;
      line-height: 1.7;
      color: var(--ink);
      margin-bottom: 24px;
    }

    .ticket-actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn-primary, .btn-secondary {
      padding: 14px 28px;
      font-family: 'Special Elite', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      cursor: none;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: var(--wine);
      color: var(--cream);
    }

    .btn-primary:hover {
      background: var(--wine-deep);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(122, 30, 43, 0.3);
    }

    .btn-secondary {
      background: transparent;
      color: var(--wine);
      border: 1px solid var(--wine);
    }

    .btn-secondary:hover {
      background: var(--wine);
      color: var(--cream);
    }

    /* Shine sweep */
    .shine-sweep {
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.3),
        transparent
      );
      pointer-events: none;
    }

    .ticket-front:hover .shine-sweep {
      animation: shineSweep 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes shineSweep {
      0% { left: -100%; }
      100% { left: 200%; }
    }

    /* ====== ROUTE MAP SECTION ====== */
    .map-section {
      background: var(--charcoal);
      color: var(--cream);
      position: relative;
      overflow: hidden;
    }

    .map-section .section-label {
      color: var(--gold);
    }

    .map-section .section-label::before {
      background: var(--gold);
    }

    .map-section .section-title {
      color: var(--cream);
    }

    .map-section .section-title em {
      color: var(--gold);
    }

    .map-section .section-subtitle {
      color: var(--cream-dark);
    }

    .map-container {
      position: relative;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      height: 500px;
    }

    .map-svg {
      width: 100%;
      height: 100%;
    }

    .map-land {
      fill: rgba(185, 138, 68, 0.15);
      stroke: rgba(185, 138, 68, 0.4);
      stroke-width: 1;
    }

    .map-graticule {
      fill: none;
      stroke: rgba(185, 138, 68, 0.1);
      stroke-width: 0.5;
    }

    .flight-path {
      fill: none;
      stroke: var(--gold);
      stroke-width: 1.5;
      stroke-dasharray: 4 6;
      stroke-dashoffset: 200;
      animation: dashPath 3s linear infinite;
    }

    .flight-path.paused {
      animation-play-state: paused;
      stroke-dashoffset: 0;
      stroke-dasharray: none;
      stroke-width: 1;
      opacity: 0.4;
    }

    @keyframes dashPath {
      to { stroke-dashoffset: 0; }
    }

    .destination-dot {
      fill: var(--gold);
      cursor: none;
      transition: all 0.3s ease;
    }

    .destination-dot:hover {
      fill: var(--cream);
      r: 8;
    }

    .destination-pulse {
      fill: none;
      stroke: var(--gold);
      stroke-width: 1;
      transform-origin: center;
      animation: pulseRing 2s ease-out infinite;
    }

    @keyframes pulseRing {
      0% { r: 5; opacity: 0.8; }
      100% { r: 20; opacity: 0; }
    }

    .destination-label {
      fill: var(--cream);
      font-family: 'Special Elite', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      pointer-events: none;
    }

    .destination-year {
      fill: var(--gold);
      font-family: 'Cormorant Garamond', serif;
      font-size: 9px;
      font-style: italic;
      pointer-events: none;
    }

    .map-legend {
      display: flex;
      gap: 32px;
      margin-top: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .map-legend-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Special Elite', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--cream-dark);
    }

    .map-legend-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px rgba(185, 138, 68, 0.6);
    }

    .map-legend-line {
      width: 24px;
      height: 1.5px;
      background: repeating-linear-gradient(90deg, var(--gold) 0 4px, transparent 4px 10px);
    }

    /* ====== AIRCRAFT ARCHIVE SECTION ====== */
    .archive-section {
      background: var(--cream);
    }

    .archive-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    .archive-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 48px;
      flex-wrap: wrap;
    }

    .archive-tab {
      padding: 12px 24px;
      font-family: 'Special Elite', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: transparent;
      border: 1px solid var(--gold-deep);
      color: var(--charcoal);
      cursor: none;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .archive-tab.active {
      background: var(--wine);
      border-color: var(--wine);
      color: var(--cream);
    }

    .archive-tab:hover:not(.active) {
      border-color: var(--wine);
      color: var(--wine);
    }

    .archive-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }

    .aircraft-card {
      position: relative;
      background: var(--cream);
      border: 1px solid var(--gold-deep);
      border-radius: 2px;
      overflow: hidden;
      cursor: none;
      transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      transform-style: preserve-3d;
      will-change: transform;
    }

    .aircraft-card:hover {
      box-shadow:
        0 20px 40px rgba(122, 30, 43, 0.2),
        0 5px 15px rgba(34, 30, 27, 0.1);
    }

    .aircraft-card-img {
      width: 100%;
      height: 200px;
      background: var(--cream-dark);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .aircraft-card-img svg {
      width: 70%;
      height: 70%;
      opacity: 0.7;
      transition: all 0.5s ease;
    }

    .aircraft-card:hover .aircraft-card-img svg {
      opacity: 1;
      transform: scale(1.1);
    }

    .aircraft-card-body {
      padding: 24px;
    }

    .aircraft-card-tag {
      font-family: 'Special Elite', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold-deep);
      margin-bottom: 8px;
    }

    .aircraft-card-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--charcoal);
      margin-bottom: 8px;
    }

    .aircraft-card-sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 14px;
      color: var(--ink);
      opacity: 0.7;
      margin-bottom: 16px;
    }

    .aircraft-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding-top: 16px;
      border-top: 1px solid rgba(185, 138, 68, 0.3);
    }

    .aircraft-stat {
      text-align: center;
    }

    .aircraft-stat-value {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--wine);
    }

    .aircraft-stat-label {
      font-family: 'Special Elite', monospace;
      font-size: 8px;
      letter-spacing: 1px;
      color: var(--gold-deep);
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* ====== CREW UNIFORM SECTION ====== */
    .crew-section {
      background: linear-gradient(180deg, var(--wine-deep) 0%, var(--wine) 100%);
      color: var(--cream);
      position: relative;
      overflow: hidden;
    }

    .crew-section::before {
      content: '';
      position: absolute;
      top: -200px; right: -200px;
      width: 600px; height: 600px;
      border: 1px solid rgba(245, 235, 221, 0.1);
      border-radius: 50%;
    }

    .crew-section::after {
      content: '';
      position: absolute;
      bottom: -300px; left: -300px;
      width: 800px; height: 800px;
      border: 1px solid rgba(185, 138, 68, 0.1);
      border-radius: 50%;
    }

    .crew-inner {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    .crew-section .section-label {
      color: var(--gold);
    }

    .crew-section .section-label::before {
      background: var(--gold);
    }

    .crew-section .section-title {
      color: var(--cream);
    }

    .crew-section .section-title em {
      color: var(--gold);
    }

    .crew-section .section-subtitle {
      color: rgba(245, 235, 221, 0.7);
    }

    .crew-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }

    .crew-card {
      position: relative;
      aspect-ratio: 3/4;
      background: rgba(245, 235, 221, 0.05);
      border: 1px solid rgba(185, 138, 68, 0.3);
      overflow: hidden;
      cursor: none;
      transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .crew-card:hover {
      transform: translateY(-8px);
      border-color: var(--gold);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .crew-card-img {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, rgba(122,30,43,0.3), rgba(34,30,27,0.6));
    }

    .crew-card-img svg {
      width: 60%;
      height: 60%;
      opacity: 0.5;
      transition: all 0.5s ease;
    }

    .crew-card:hover .crew-card-img svg {
      opacity: 0.8;
      transform: scale(1.05);
    }

    .crew-card-info {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 20px;
      background: linear-gradient(0deg, rgba(34,30,27,0.9) 0%, transparent 100%);
      transform: translateY(30%);
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .crew-card:hover .crew-card-info {
      transform: translateY(0);
    }

    .crew-card-era {
      font-family: 'Special Elite', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .crew-card-name {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--cream);
      margin-bottom: 4px;
    }

    .crew-card-desc {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      font-style: italic;
      color: rgba(245, 235, 221, 0.7);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease 0.1s;
    }

    .crew-card:hover .crew-card-desc {
      opacity: 1;
      transform: translateY(0);
    }

    /* ====== CABIN SECTION ====== */
    .cabin-section {
      background: var(--cream);
    }

    .cabin-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    .cabin-showcase {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
    }

    .cabin-visual {
      position: relative;
      height: 500px;
      background: var(--charcoal);
      border-radius: 4px;
      overflow: hidden;
    }

    .cabin-visual-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at center, rgba(185,138,68,0.15) 0%, transparent 70%),
        linear-gradient(180deg, #2a2522 0%, #1a1715 100%);
    }

    .cabin-visual-inner svg {
      width: 80%;
      height: 60%;
    }

    .cabin-detail-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: rgba(34, 30, 27, 0.9);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .cabin-detail-item {
      text-align: center;
      flex: 1;
    }

    .cabin-detail-label {
      font-family: 'Special Elite', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .cabin-detail-value {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--cream);
    }

    .cabin-text h3 {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-weight: 700;
      color: var(--charcoal);
      line-height: 1.2;
      margin-bottom: 24px;
    }

    .cabin-text h3 em {
      font-style: italic;
      color: var(--wine);
      font-weight: 400;
    }

    .cabin-text p {
      font-size: 17px;
      line-height: 1.7;
      color: var(--ink);
      margin-bottom: 20px;
    }

    .cabin-features {
      list-style: none;
      margin-top: 32px;
    }

    .cabin-features li {
      padding: 12px 0;
      border-bottom: 1px solid rgba(185, 138, 68, 0.2);
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: 'Crimson Pro', serif;
      font-size: 16px;
      color: var(--charcoal);
    }

    .cabin-features li::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
      box-shadow: 0 0 6px rgba(185, 138, 68, 0.5);
    }

    /* ====== STATS BANNER ====== */
    .stats-banner {
      background: var(--charcoal);
      padding: 80px 48px;
      position: relative;
      overflow: hidden;
    }

    .stats-banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 30% 50%, rgba(122,30,43,0.2) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 50%, rgba(185,138,68,0.1) 0%, transparent 50%);
    }

    .stats-grid {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 40px;
      position: relative;
      z-index: 2;
    }

    .stat-item {
      text-align: center;
    }

    .stat-number {
      font-family: 'Playfair Display', serif;
      font-size: clamp(36px, 5vw, 56px);
      font-weight: 900;
      color: var(--gold);
      line-height: 1;
      margin-bottom: 8px;
    }

    .stat-number .stat-unit {
      font-size: 0.5em;
      font-weight: 400;
      color: var(--gold-light);
    }

    .stat-label {
      font-family: 'Special Elite', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--cream-dark);
      text-transform: uppercase;
    }

    /* ====== FOOTER / CTA ====== */
    .footer {
      background: var(--wine-deep);
      color: var(--cream);
      padding: 100px 48px 48px;
      position: relative;
      overflow: hidden;
    }

    .footer::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
    }

    .footer-cta {
      text-align: center;
      margin-bottom: 80px;
    }

    .footer-cta h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 16px;
    }

    .footer-cta h2 em {
      font-style: italic;
      color: var(--gold);
      font-weight: 400;
    }

    .footer-cta p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-style: italic;
      color: rgba(245, 235, 221, 0.7);
      margin-bottom: 36px;
    }

    .footer-form {
      display: flex;
      gap: 12px;
      max-width: 500px;
      margin: 0 auto;
    }

    .footer-form input {
      flex: 1;
      padding: 14px 20px;
      background: rgba(245, 235, 221, 0.08);
      border: 1px solid rgba(185, 138, 68, 0.4);
      color: var(--cream);
      font-family: 'Crimson Pro', serif;
      font-size: 16px;
      outline: none;
      transition: all 0.3s ease;
      cursor: none;
    }

    .footer-form input::placeholder {
      color: rgba(245, 235, 221, 0.4);
      font-style: italic;
    }

    .footer-form input:focus {
      border-color: var(--gold);
      background: rgba(245, 235, 221, 0.12);
      box-shadow: 0 0 20px rgba(185, 138, 68, 0.2);
    }

    .footer-form button {
      padding: 14px 28px;
      background: var(--gold);
      border: none;
      color: var(--charcoal);
      font-family: 'Special Elite', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: none;
      transition: all 0.3s ease;
    }

    .footer-form button:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(185, 138, 68, 0.3);
    }

    .footer-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 32px;
      border-top: 1px solid rgba(185, 138, 68, 0.2);
      flex-wrap: wrap;
      gap: 20px;
    }

    .footer-logo {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .footer-text {
      font-family: 'Special Elite', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: rgba(245, 235, 221, 0.5);
      text-transform: uppercase;
    }

    .footer-links {
      display: flex;
      gap: 24px;
      list-style: none;
    }

    .footer-links a {
      color: rgba(245, 235, 221, 0.6);
      text-decoration: none;
      font-family: 'Special Elite', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: none;
      transition: color 0.3s ease;
    }

    .footer-links a:hover {
      color: var(--gold);
    }

    /* ====== RESPONSIVE ====== */
    @media (max-width: 900px) {
      .nav { padding: 16px 24px; }
      .nav-links { display: none; }
      .section { padding: 80px 24px; }
      .ticket-showcase { grid-template-columns: 1fr; gap: 40px; }
      .crew-grid { grid-template-columns: repeat(2, 1fr); }
      .cabin-showcase { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 32px; }
      .map-container { height: 350px; }
      .footer-form { flex-direction: column; }
      .hero-meta { gap: 30px; flex-wrap: wrap; justify-content: center; }
    }

    @media (max-width: 600px) {
      .crew-grid { grid-template-columns: 1fr 1fr; }
      .archive-grid { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .ticket-details { grid-template-columns: repeat(3, 1fr); }
      .ticket-city { font-size: 20px; }
    }

    /* ====== REDUCED MOTION ====== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .reveal { opacity: 1; transform: none; }
      .cursor-ring, .cursor-dot { display: none; }
      html, body { cursor: auto; }
      * { cursor: auto !important; }
    }
  </style>

<body>

  <div id="root"></div>

  <!-- Custom cursor elements -->
  <div class="cursor-ring" id="cursorRing"></div>
  <div class="cursor-dot" id="cursorDot"></div>

  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ============================================================
    // CUSTOM CURSOR — physics-based magnetic follow
    // ============================================================
    (function initCursor() {
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reducedMotion) return;

      const ring = document.getElementById('cursorRing');
      const dot = document.getElementById('cursorDot');
      if (!ring || !dot) return;

      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      let ringX = mouseX;
      let ringY = mouseY;
      let dotX = mouseX;
      let dotY = mouseY;
      let rafId = null;
      let visible = false;

      // Spring physics constants
      const RING_STIFFNESS = 0.08;
      const RING_DAMPING = 0.7;
      const DOT_STIFFNESS = 0.25;
      const DOT_DAMPING = 0.8;
      let ringVelX = 0, ringVelY = 0;
      let dotVelX = 0, dotVelY = 0;

      function animate() {
        // Ring — slower, springier
        const ringDx = mouseX - ringX;
        const ringDy = mouseY - ringY;
        ringVelX += ringDx * RING_STIFFNESS;
        ringVelY += ringDy * RING_STIFFNESS;
        ringVelX *= RING_DAMPING;
        ringVelY *= RING_DAMPING;
        ringX += ringVelX;
        ringY += ringVelY;

        // Dot — tighter follow
        const dotDx = mouseX - dotX;
        const dotDy = mouseY - dotY;
        dotVelX += dotDx * DOT_STIFFNESS;
        dotVelY += dotDy * DOT_STIFFNESS;
        dotVelX *= DOT_DAMPING;
        dotVelY *= DOT_DAMPING;
        dotX += dotVelX;
        dotY += dotVelY;

        ring.style.left = ringX + 'px';
        ring.style.top = ringY + 'px';
        dot.style.left = dotX + 'px';
        dot.style.top = dotY + 'px';

        rafId = requestAnimationFrame(animate);
      }

      function onMove(e) {
        mouseX = e.clientX;
        mouseY = e.clientY;
        if (!visible) {
          visible = true;
          ringX = mouseX;
          ringY = mouseY;
          dotX = mouseX;
          dotY = mouseY;
        }
      }

      function onClick(e) {
        const ripple = document.createElement('div');
        ripple.className = 'cursor-ripple';
        ripple.style.left = e.clientX + 'px';
        ripple.style.top = e.clientY + 'px';
        document.body.appendChild(ripple);
        setTimeout(() => ripple.remove(), 800);

        ring.classList.add('clicking');
        setTimeout(() => ring.classList.remove('clicking'), 200);
      }

      function onEnter(e) {
        if (e.target.closest('a, button, .aircraft-card, .crew-card, .ticket-inner, .destination-dot, input')) {
          ring.classList.add('hover');
        }
      }

      function onLeave(e) {
        if (e.target.closest('a, button, .aircraft-card, .crew-card, .ticket-inner, .destination-dot, input')) {
          ring.classList.remove('hover');
        }
      }

      function start() {
        if (rafId) return;
        rafId = requestAnimationFrame(animate);
      }

      function stop() {
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
      }

      window.addEventListener('mousemove', onMove, { passive: true });
      window.addEventListener('click', onClick);
      document.addEventListener('mouseover', onEnter);
      document.addEventListener('mouseout', onLeave);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) stop();
        else start();
      });
      window.addEventListener('beforeunload', stop);

      start();
    })();

    // ============================================================
    // PARTICLE SYSTEM — confetti / spark particles on hero
    // ============================================================
    (function initParticles() {
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reducedMotion) return;

      const hero = document.querySelector('.hero');
      if (!hero) return;

      let rafId = null;
      const particles = [];
      const MAX_PARTICLES = 30;

      function createParticle() {
        const el = document.createElement('div');
        el.className = 'particle';
        const size = Math.random() * 3 + 1;
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        const x = Math.random() * hero.offsetWidth;
        const y = hero.offsetHeight + 10;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.background = Math.random() > 0.5 ? '#B98A44' : '#F5EBDD';
        hero.appendChild(el);

        particles.push({
          el,
          x,
          y,
          vx: (Math.random() - 0.5) * 0.8,
          vy: -Math.random() * 1.5 - 0.5,
          life: 1,
          decay: 0.003 + Math.random() * 0.004,
          sway: Math.random() * 0.5,
          swayOffset: Math.random() * Math.PI * 2,
          time: 0,
        });
      }

      let spawnTimer = 0;

      function animate() {
        spawnTimer++;
        if (spawnTimer > 20 && particles.length < MAX_PARTICLES) {
          spawnTimer = 0;
          createParticle();
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.time += 0.02;
          p.x += p.vx + Math.sin(p.time * 2 + p.swayOffset) * p.sway;
          p.y += p.vy;
          p.life -= p.decay;

          if (p.life <= 0 || p.y < -20) {
            p.el.remove();
            particles.splice(i, 1);
            continue;
          }

          p.el.style.left = p.x + 'px';
          p.el.style.top = p.y + 'px';
          p.el.style.opacity = p.life;
        }

        rafId = requestAnimationFrame(animate);
      }

      function start() {
        if (rafId) return;
        rafId = requestAnimationFrame(animate);
      }

      function stop() {
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
      }

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) stop();
        else if (isElementInViewport(hero)) start();
      });

      // Start only when hero visible
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) start();
          else stop();
        });
      }, { threshold: 0.1 });
      observer.observe(hero);

      // Cleanup on unload
      window.addEventListener('beforeunload', () => {
        stop();
        observer.disconnect();
      });

      function isElementInViewport(el) {
        const rect = el.getBoundingClientRect();
        return rect.bottom > 0 && rect.top < window.innerHeight;
      }
    })();

    // ============================================================
    // SCROLL REVEAL
    // ============================================================
    (function initScrollReveal() {
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reducedMotion) return;

      const reveals = document.querySelectorAll('.reveal');
      if (!reveals.length) return;

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const delay = entry.target.dataset.delay || 0;
            setTimeout(() => entry.target.classList.add('revealed'), delay);
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15, rootMargin: '0px 0px -50px 0px' });

      reveals.forEach(el => observer.observe(el));
    })();

    // ============================================================
    // NUMBER COUNTER — physics-based easing
    // ============================================================
    function useCountUp(target, duration = 2000, startOnView = true) {
      const [value, setValue] = useState(0);
      const ref = useRef(null);
      const rafRef = useRef(null);
      const startedRef = useRef(false);

      useEffect(() => {
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reducedMotion) {
          setValue(target);
          return;
        }

        if (!startOnView) return;

        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting && !startedRef.current) {
              startedRef.current = true;
              animate();
              observer.disconnect();
            }
          });
        }, { threshold: 0.5 });

        if (ref.current) observer.observe(ref.current);

        function animate() {
          const startTime = performance.now();

          function step(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);

            // Ease out cubic
            const eased = 1 - Math.pow(1 - progress, 3);
            setValue(Math.round(target * eased));

            if (progress < 1) {
              rafRef.current = requestAnimationFrame(step);
            }
          }

          rafRef.current = requestAnimationFrame(step);
        }

        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          observer.disconnect();
        };
      }, [target, duration, startOnView]);

      return [value, ref];
    }

    // ============================================================
    // TYPEWRITER — character-by-character with variable speed
    // ============================================================
    function useTypewriter(words, typeSpeed = 80, pauseTime = 2000) {
      const [text, setText] = useState('');
      const [wordIndex, setWordIndex] = useState(0);
      const [charIndex, setCharIndex] = useState(0);
      const [isDeleting, setIsDeleting] = useState(false);
      const timeoutRef = useRef(null);

      useEffect(() => {
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reducedMotion) {
          setText(words[0]);
          return;
        }

        const currentWord = words[wordIndex];
        let delay = isDeleting ? typeSpeed / 2 : typeSpeed;

        // Variable typing speed (slight randomness for natural feel)
        if (!isDeleting) {
          delay = typeSpeed + Math.random() * 40 - 20;
        }

        if (!isDeleting && charIndex < currentWord.length) {
          timeoutRef.current = setTimeout(() => {
            setText(currentWord.substring(0, charIndex + 1));
            setCharIndex(charIndex + 1);
          }, delay);
        } else if (!isDeleting && charIndex === currentWord.length) {
          timeoutRef.current = setTimeout(() => {
            setIsDeleting(true);
          }, pauseTime);
        } else if (isDeleting && charIndex > 0) {
          timeoutRef.current = setTimeout(() => {
            setText(currentWord.substring(0, charIndex - 1));
            setCharIndex(charIndex - 1);
          }, delay);
        } else if (isDeleting && charIndex === 0) {
          setIsDeleting(false);
          setWordIndex((wordIndex + 1) % words.length);
        }

        return () => {
          if (timeoutRef.current) clearTimeout(timeoutRef.current);
        };
      }, [charIndex, isDeleting, wordIndex, words, typeSpeed, pauseTime]);

      return text;
    }

    // ============================================================
    // 3D TILT CARD — direct DOM transform, no React re-render
    // ============================================================
    function useTilt(maxTilt = 10) {
      const ref = useRef(null);

      useEffect(() => {
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reducedMotion) return;
        const el = ref.current;
        if (!el) return;

        let currentX = 0, currentY = 0;
        let targetX = 0, targetY = 0;
        let rafId = null;

        // Inertia / damping
        function animate() {
          currentX += (targetX - currentX) * 0.1;
          currentY += (targetY - currentY) * 0.1;
          el.style.transform = `perspective(1000px) rotateX(${currentY}deg) rotateY(${currentX}deg) scale3d(1.02, 1.02, 1.02)`;
          rafId = requestAnimationFrame(animate);
        }

        function onMove(e) {
          const rect = el.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width - 0.5;
          const y = (e.clientY - rect.top) / rect.height - 0.5;
          targetX = x * maxTilt * 2;
          targetY = -y * maxTilt * 2;
        }

        function onEnter() {
          if (!rafId) rafId = requestAnimationFrame(animate);
        }

        function onLeave() {
          targetX = 0;
          targetY = 0;
          setTimeout(() => {
            if (rafId && Math.abs(targetX) < 0.01 && Math.abs(targetY) < 0.01) {
              cancelAnimationFrame(rafId);
              rafId = null;
            }
          }, 500);
          // Reset smoothly
          const reset = () => {
            currentX += (0 - currentX) * 0.1;
            currentY += (0 - currentY) * 0.1;
            el.style.transform = `perspective(1000px) rotateX(${currentY}deg) rotateY(${currentX}deg)`;
            if (Math.abs(currentX) > 0.05 || Math.abs(currentY) > 0.05) {
              requestAnimationFrame(reset);
            } else {
              el.style.transform = '';
            }
          };
          if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }
          requestAnimationFrame(reset);
        }

        el.addEventListener('mousemove', onMove, { passive: true });
        el.addEventListener('mouseenter', onEnter);
        el.addEventListener('mouseleave', onLeave);

        return () => {
          if (rafId) cancelAnimationFrame(rafId);
          el.removeEventListener('mousemove', onMove);
          el.removeEventListener('mouseenter', onEnter);
          el.removeEventListener('mouseleave', onLeave);
        };
      }, [maxTilt]);

      return ref;
    }

    // Announce upgrade capability
    function announceUpgrade() {
      try {
        window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
      } catch(e) {}
    }
    announceUpgrade();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announceUpgrade, { once: true });
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Initialize scroll reveal after first render (React renders async)
    // Re-run the reveal observer after a tick
    setTimeout(() => {
      const reveals = document.querySelectorAll('.reveal');
      if (reveals.length) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const delay = entry.target.dataset.delay || 0;
              setTimeout(() => entry.target.classList.add('revealed'), parseInt(delay));
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.15, rootMargin: '0px 0px -50px 0px' });
        reveals.forEach(el => observer.observe(el));
      }
    }, 100);
  </script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>升降之间 · 老公寓电梯志</title>
<meta name="creative-medium" content="interactive-prototype">
<style>
/* ==========  CSS CUSTOM PROPERTIES ========== */
:root {
  --terrazzo: #7E8F82;
  --terrazzo-dark: #3E4A42;
  --cream: #F0E8D5;
  --cream-dark: #D9CFB8;
  --iron: #26292C;
  --iron-light: #3A3E42;
  --brass: #B08D3E;
  --brass-light: #D4AF5E;
  --brass-dark: #8A6E2E;
  --lamp: #E8C77D;
  --lamp-glow: rgba(232, 199, 125, 0.4);
  --neon: #C8452C;
  --neon-glow: rgba(200, 69, 44, 0.6);

  --font-serif: Georgia, "STSong", "SimSun", serif;
  --font-mono: "Courier New", monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;

  --floor-h: calc((100vh - 120px) / 6.5);
  --shaft-w: 110px;
  --stage-w: 55%;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--iron);
  font-family: var(--font-sans);
  color: var(--iron);
  cursor: none;
}

/* ========== CUSTOM CURSOR ========== */
.cursor-outer, .cursor-inner {
  position: fixed;
  top: 0;
  left: 0;
  pointer-events: none;
  z-index: 9999;
  mix-blend-mode: difference;
  transition: transform 0.15s ease-out, width 0.2s ease, height 0.2s ease;
}
.cursor-outer {
  width: 28px;
  height: 28px;
  border: 2px solid var(--brass-light);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 8px rgba(212, 175, 94, 0.3);
}
.cursor-inner {
  width: 6px;
  height: 6px;
  background: var(--brass-light);
  border-radius: 50%;
  transform: translate(-50%, -50%);
}
.cursor-hover .cursor-outer {
  width: 44px;
  height: 44px;
  border-color: #fff;
}
.cursor-hover .cursor-inner {
  width: 4px;
  height: 4px;
}
.cursor-grab .cursor-outer {
  width: 36px;
  height: 36px;
}

/* ========== MAIN LAYOUT ========== */
.app {
  display: flex;
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
}

/* ===== STAGE (LEFT) ===== */
.stage {
  position: relative;
  width: var(--stage-w);
  height: 100vh;
  background: linear-gradient(180deg,
    var(--iron) 0%,
    var(--iron) 60px,
    var(--terrazzo-dark) 60px,
    var(--terrazzo-dark) calc(100% - 40px),
    var(--iron) calc(100% - 40px),
    var(--iron) 100%
  );
  overflow: hidden;
}

/* building decorative frame */
.stage::before {
  content: "";
  position: absolute;
  top: 50px;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--brass);
  z-index: 5;
}
.stage::after {
  content: "";
  position: absolute;
  bottom: 30px;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--brass);
  z-index: 5;
}

/* Title overlay */
.title-block {
  position: absolute;
  top: 14px;
  left: 30px;
  z-index: 20;
  color: var(--cream);
  pointer-events: none;
}
.title-block h1 {
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: normal;
  letter-spacing: 4px;
  color: var(--brass-light);
}
.title-block p {
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--terrazzo);
  margin-top: 2px;
}

/* Instruction hint */
.hint {
  position: absolute;
  top: 16px;
  right: 20px;
  z-index: 20;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--terrazzo);
  text-align: right;
  line-height: 1.6;
  pointer-events: none;
}
.hint b {
  color: var(--brass-light);
  font-weight: normal;
}

/* Sound toggle */
.sound-toggle {
  position: absolute;
  top: 56px;
  right: 20px;
  z-index: 25;
  width: 28px;
  height: 28px;
  border: 1px solid var(--brass);
  border-radius: 50%;
  background: transparent;
  cursor: none;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}
.sound-toggle:hover { border-color: var(--brass-light); background: rgba(212,175,94,0.1); }
.sound-toggle svg { width: 14px; height: 14px; stroke: var(--brass-light); fill: none; }
.sound-muted svg { stroke: var(--terrazzo); }

/* ===== FLOORS ===== */
.floors {
  position: absolute;
  top: 60px;
  left: 0;
  right: 0;
  bottom: 40px;
  display: flex;
  flex-direction: column-reverse;
}

.floor {
  position: relative;
  flex: 1;
  border-bottom: 1px solid rgba(126, 143, 130, 0.3);
  overflow: hidden;
  transition: filter 0.8s ease;
  filter: brightness(0.35) saturate(0.5);
}
.floor.active {
  filter: brightness(1) saturate(1);
}

/* ceiling top trim - art deco stepped */
.floor::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 6px;
  background: linear-gradient(180deg, var(--terrazzo-dark) 0%, transparent 100%);
  border-bottom: 1px solid rgba(176,141,62,0.2);
  z-index: 2;
}

/* each floor has unique bg */
.floor-1 { background: var(--terrazzo-dark); }
.floor-2 { background: #3A463E; }
.floor-3 { background: #3C4840; }
.floor-4 { background: #39443D; }
.floor-5 { background: #3B473F; }
.floor-rf { background: #1E2530; }

/* floor label (left side) */
.floor-label {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--brass);
  letter-spacing: 1px;
  z-index: 3;
  writing-mode: vertical-rl;
  text-orientation: mixed;
}
.floor-label b {
  display: block;
  font-size: 14px;
  color: var(--brass-light);
  margin-bottom: 4px;
}
.floor.active .floor-label b { color: var(--cream); }

/* summon button */
.summon-btn {
  position: absolute;
  right: calc(var(--shaft-w) + 14px);
  top: 50%;
  transform: translateY(-50%);
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid var(--brass);
  background: var(--iron);
  cursor: none;
  z-index: 10;
  transition: all 0.15s ease;
}
.summon-btn::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--brass-dark);
  transition: all 0.2s ease;
}
.summon-btn:hover { border-color: var(--brass-light); box-shadow: 0 0 10px var(--lamp-glow); }
.summon-btn.active::before { background: var(--lamp); box-shadow: 0 0 8px var(--lamp); }
.summon-btn.pressed { transform: translateY(-50%) scale(0.9); }

/* direction arrows */
.dir-arrows {
  position: absolute;
  right: calc(var(--shaft-w) + 14px);
  top: calc(50% - 18px);
  display: flex;
  flex-direction: column;
  gap: 2px;
  z-index: 9;
  pointer-events: none;
}
.dir-arrow {
  width: 0;
  height: 0;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  opacity: 0.2;
  transition: opacity 0.2s ease;
}
.dir-arrow.up { border-bottom: 6px solid var(--lamp); }
.dir-arrow.down { border-top: 6px solid var(--lamp); }
.dir-arrow.on { opacity: 1; }

/* ===== ELEVATOR SHAFT ===== */
.shaft {
  position: absolute;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  width: var(--shaft-w);
  bottom: 40px;
  background: linear-gradient(180deg,
    #1a1c1e 0%,
    var(--iron) 5%,
    #1e2023 100%
  );
  z-index: 6;
  border-left: 2px solid var(--iron-light);
  border-right: 2px solid var(--iron-light);
  overflow: hidden;
}

/* shaft top - pulley room area */
.shaft-top {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 50px;
  background: var(--iron);
  z-index: 7;
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid var(--iron-light);
}

/* pulley wheel */
.pulley {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 3px solid var(--brass);
  background: radial-gradient(circle, var(--brass-dark) 0%, var(--iron) 60%);
  position: relative;
}
.pulley::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--iron);
  border: 2px solid var(--brass);
}
.pulley::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 2px;
  right: 2px;
  height: 2px;
  background: var(--brass);
  transform-origin: center;
  margin-top: -1px;
}

/* cables */
.cables {
  position: absolute;
  top: 50px;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 6;
  pointer-events: none;
}
.cable {
  position: absolute;
  top: 0;
  width: 2px;
  background: linear-gradient(180deg, var(--iron-light) 0%, #4a4e52 50%, var(--iron-light) 100%);
}
.cable-1 { left: 30px; }
.cable-2 { left: 50%; transform: translateX(-50%); }
.cable-3 { right: 30px; }

/* dust particles container */
.dust-container {
  position: absolute;
  top: 50px;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 5;
  pointer-events: none;
  overflow: hidden;
}
.dust {
  position: absolute;
  width: 2px;
  height: 2px;
  background: var(--lamp-glow);
  border-radius: 50%;
  opacity: 0;
}

/* ===== DIAL (semicircular floor indicator) ===== */
.dial-container {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 180px;
  height: 100px;
  z-index: 30;
  pointer-events: none;
}
.dial-svg {
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: auto;
}
.dial-arc {
  fill: none;
  stroke: var(--brass);
  stroke-width: 3;
}
.dial-arc-inner {
  fill: none;
  stroke: var(--brass-dark);
  stroke-width: 1;
}
.dial-tick {
  stroke: var(--brass-light);
  stroke-width: 1.5;
}
.dial-number {
  font-family: var(--font-mono);
  font-size: 9px;
  fill: var(--brass-light);
  text-anchor: middle;
  dominant-baseline: middle;
}
.dial-pointer {
  transform-origin: 90px 88px;
  transition: none;
  cursor: none;
}
.dial-pivot {
  fill: var(--brass-light);
  stroke: var(--brass-dark);
  stroke-width: 1;
}
.dial-glass {
  fill: rgba(240, 232, 213, 0.03);
  stroke: var(--brass-dark);
  stroke-width: 1;
}

/* ===== ELEVATOR CAR ===== */
.car {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  width: 84px;
  height: calc((100vh - 160px) / 6.5 * 0.85);
  background: linear-gradient(180deg, var(--iron-light) 0%, var(--iron) 100%);
  z-index: 8;
  border: 2px solid var(--brass-dark);
  border-top: 3px solid var(--brass);
  transition: bottom 0.1s linear;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

/* car interior ceiling lamp */
.car-lamp {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 20px;
  height: 14px;
  background: radial-gradient(ellipse at top, var(--lamp) 0%, var(--brass-light) 60%, var(--brass-dark) 100%);
  border-radius: 50% 50% 40% 40%;
  z-index: 2;
  transform-origin: top center;
}
.car-lamp::after {
  content: "";
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  width: 40px;
  height: 30px;
  background: radial-gradient(ellipse at top, var(--lamp-glow) 0%, transparent 70%);
  pointer-events: none;
}

/* car floor */
.car-floor {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 6px;
  background: var(--brass-dark);
  border-top: 1px solid var(--brass);
}

/* car doors - iron grating */
.car-doors {
  position: absolute;
  top: 24px;
  left: 0;
  right: 0;
  bottom: 6px;
  z-index: 5;
  overflow: hidden;
}
.door {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 50%;
  background: repeating-linear-gradient(
    45deg,
    var(--iron) 0px,
    var(--iron) 3px,
    var(--iron-light) 3px,
    var(--iron-light) 5px
  ),
  repeating-linear-gradient(
    -45deg,
    transparent 0px,
    transparent 4px,
    var(--iron-light) 4px,
    var(--iron-light) 5px
  );
  border: 1px solid var(--brass-dark);
  transition: transform 1.2s cubic-bezier(0.65, 0, 0.35, 1);
}
.door-left {
  left: 0;
  border-right: 1px solid var(--brass);
}
.door-right {
  right: 0;
  border-left: 1px solid var(--brass);
}
.car.door-open .door-left { transform: translateX(-95%); }
.car.door-open .door-right { transform: translateX(95%); }

/* car interior visible behind doors */
.car-interior {
  position: absolute;
  top: 24px;
  left: 4px;
  right: 4px;
  bottom: 6px;
  background: linear-gradient(180deg, #2e3236 0%, #232629 100%);
  z-index: 3;
}
.car-interior::before {
  /* handrail */
  content: "";
  position: absolute;
  top: 55%;
  left: 6px;
  right: 6px;
  height: 2px;
  background: var(--brass);
}
.car-interior::after {
  /* floor reflection */
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 12px;
  background: linear-gradient(180deg, transparent 0%, rgba(176,141,62,0.15) 100%);
}

/* ===== FLOOR SCENES ===== */
.scene {
  position: absolute;
  top: 6px;
  left: 40px;
  right: calc(var(--shaft-w) + 50px);
  bottom: 0;
  z-index: 2;
}

/* -- Floor 1: Lobby & Cosmetics -- */
.scene-1 .awning {
  position: absolute;
  top: 0;
  left: 0;
  width: 100px;
  height: 18px;
  background: repeating-linear-gradient(
    90deg,
    var(--cream) 0px,
    var(--cream) 8px,
    var(--neon) 8px,
    var(--neon) 14px
  );
  clip-path: polygon(0 0, 100% 0, 92% 100%, 8% 100%);
  z-index: 3;
}
.scene-1 .entrance {
  position: absolute;
  top: 18px;
  left: 14px;
  width: 60px;
  height: calc(100% - 24px);
  background: linear-gradient(180deg, var(--iron) 0%, #1a1c1e 100%);
  border: 2px solid var(--brass);
}
.scene-1 .entrance::before {
  content: "先施公司";
  position: absolute;
  top: -14px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-serif);
  font-size: 9px;
  color: var(--brass-light);
  letter-spacing: 2px;
  white-space: nowrap;
}
.scene-1 .glass-counter {
  position: absolute;
  bottom: 18px;
  left: 100px;
  width: 120px;
  height: 40px;
  background: linear-gradient(180deg, rgba(240,232,213,0.2) 0%, rgba(240,232,213,0.05) 100%);
  border: 1px solid var(--brass);
  border-top: 2px solid var(--brass-light);
}
.scene-1 .glass-counter::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 50%;
  background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
}
.scene-1 .cosmetic-jar {
  position: absolute;
  bottom: 40px;
  width: 12px;
  height: 16px;
  background: linear-gradient(180deg, var(--cream) 0%, var(--cream-dark) 100%);
  border-radius: 2px 2px 4px 4px;
  cursor: none;
  transition: transform 0.2s ease;
}
.scene-1 .cosmetic-jar::before {
  content: "";
  position: absolute;
  top: -4px;
  left: 0;
  right: 0;
  height: 4px;
  background: var(--brass);
  border-radius: 1px 1px 0 0;
}
.scene-1 .cosmetic-jar:hover { transform: translateY(-3px); }
.scene-1 .jar-1 { left: 115px; }
.scene-1 .jar-2 { left: 140px; height: 20px; }
.scene-1 .jar-3 { left: 165px; }
.scene-1 .jar-4 { left: 190px; height: 18px; width: 10px; }

.scene-1 .perfume {
  position: absolute;
  bottom: 40px;
  left: 215px;
  width: 10px;
  height: 24px;
  background: linear-gradient(180deg, rgba(200,69,44,0.7) 0%, rgba(200,69,44,0.4) 100%);
  cursor: none;
  transition: transform 0.2s ease;
}
.scene-1 .perfume::before {
  content: "";
  position: absolute;
  top: -6px;
  left: 50%;
  transform: translateX(-50%);
  width: 4px;
  height: 6px;
  background: var(--brass);
}
.scene-1 .perfume:hover { transform: scale(1.1); }

/* herringbone tile floor */
.scene-1 .floor-tile {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 18px;
  background:
    repeating-linear-gradient(
      45deg,
      var(--terrazzo) 0px,
      var(--terrazzo) 4px,
      var(--terrazzo-dark) 4px,
      var(--terrazzo-dark) 8px
    );
  border-top: 1px solid var(--brass-dark);
}

/* -- Floor 2: Silk & Cloth -- */
.scene-2 { }
.scene-2 .fabric-rack {
  position: absolute;
  bottom: 18px;
  left: 10px;
  width: 90px;
  height: 60px;
  border: 1px solid var(--brass-dark);
  background: rgba(0,0,0,0.15);
}
.scene-2 .fabric-roll {
  position: absolute;
  bottom: 5px;
  width: 14px;
  height: 40px;
  border-radius: 2px;
  cursor: none;
  transition: transform 0.2s ease;
}
.scene-2 .fabric-roll:hover { transform: translateY(-2px); }
.scene-2 .roll-1 { left: 8px; background: linear-gradient(180deg, #8B2E2E 0%, #6B1E1E 100%); }
.scene-2 .roll-2 { left: 26px; background: linear-gradient(180deg, #2E5B8B 0%, #1E3B6B 100%); }
.scene-2 .roll-3 { left: 44px; background: linear-gradient(180deg, #D4AF5E 0%, #A08030 100%); }
.scene-2 .roll-4 { left: 62px; background: linear-gradient(180deg, #3E4A42 0%, #2E3A32 100%); }

.scene-2 .cutting-table {
  position: absolute;
  bottom: 18px;
  right: 10px;
  width: 100px;
  height: 24px;
  background: var(--terrazzo);
  border-top: 2px solid var(--brass-dark);
}
.scene-2 .ruler {
  position: absolute;
  bottom: 44px;
  right: 20px;
  width: 70px;
  height: 5px;
  background: linear-gradient(180deg, var(--cream) 0%, var(--cream-dark) 100%);
  cursor: none;
  transition: transform 0.2s ease;
}
.scene-2 .ruler:hover { transform: rotate(-3deg); }
.scene-2 .ruler::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-image: repeating-linear-gradient(
    90deg,
    var(--iron) 0px,
    var(--iron) 1px,
    transparent 1px,
    transparent 10px
  );
}
.scene-2 .bolt {
  position: absolute;
  bottom: 42px;
  left: 110px;
  width: 60px;
  height: 8px;
  background: linear-gradient(180deg, #C8452C 0%, #8B2E2E 100%);
  border-radius: 2px;
}

/* -- Floor 3: Clocks & Eyewear -- */
.scene-3 { }
.scene-3 .clock-big {
  position: absolute;
  top: 10px;
  left: 20px;
  width: 46px;
  height: 56px;
  cursor: none;
  transition: transform 0.2s ease;
}
.scene-3 .clock-big:hover { transform: scale(1.05); }
.scene-3 .clock-face {
  position: absolute;
  top: 6px;
  left: 3px;
  right: 3px;
  bottom: 10px;
  background: var(--cream);
  border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
  border: 2px solid var(--brass);
}
.scene-3 .clock-face::before,
.scene-3 .clock-face::after {
  content: "";
  position: absolute;
  background: var(--iron);
  transform-origin: bottom center;
  top: 50%;
  left: 50%;
}
.scene-3 .clock-face::before {
  width: 2px;
  height: 12px;
  margin-left: -1px;
  margin-top: -12px;
  transform: rotate(30deg);
}
.scene-3 .clock-face::after {
  width: 1px;
  height: 16px;
  margin-left: -0.5px;
  margin-top: -16px;
  transform: rotate(180deg);
}
.scene-3 .clock-base {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 14px;
  background: linear-gradient(180deg, var(--brass) 0%, var(--brass-dark) 100%);
  border-radius: 3px 3px 6px 6px;
}
.scene-3 .clock-top {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 12px;
  height: 8px;
  background: var(--brass-dark);
  border-radius: 50% 50% 20% 20%;
}

.scene-3 .eyewear-stand {
  position: absolute;
  bottom: 18px;
  right: 20px;
  width: 70px;
  height: 40px;
  border: 1px solid var(--brass-dark);
  background: rgba(0,0,0,0.1);
}
.scene-3 .glasses {
  position: absolute;
  width: 24px;
  height: 10px;
  cursor: none;
  transition: transform 0.2s ease;
}
.scene-3 .glasses:hover { transform: scale(1.15); }
.scene-3 .glasses::before,
.scene-3 .glasses::after {
  content: "";
  position: absolute;
  top: 2px;
  width: 9px;
  height: 7px;
  border: 1.5px solid var(--brass-light);
  border-radius: 50%;
  background: rgba(200,200,220,0.1);
}
.scene-3 .glasses::before { left: 0; }
.scene-3 .glasses::after { right: 0; }
.scene-3 .glasses span {
  position: absolute;
  top: 4px;
  left: 9px;
  right: 9px;
  height: 1.5px;
  background: var(--brass-light);
}
.scene-3 .g1 { top: 8px; left: 8px; }
.scene-3 .g2 { top: 8px; right: 8px; }
.scene-3 .g3 { bottom: 8px; left: 20px; }

/* brass shelf */
.scene-3 .brass-shelf {
  position: absolute;
  top: 20px;
  right: 10px;
  width: 80px;
  height: 2px;
  background: var(--brass);
  box-shadow: 0 4px 0 var(--brass-dark);
}

/* -- Floor 4: Stationery & Books -- */
.scene-4 { }
.scene-4 .bookshelf {
  position: absolute;
  top: 6px;
  left: 10px;
  width: 100px;
  height: calc(100% - 24px);
  background: var(--terrazzo-dark);
  border: 1px solid var(--brass-dark);
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  padding: 8px 4px;
}
.scene-4 .shelf-row {
  display: flex;
  gap: 2px;
  height: 16px;
  border-bottom: 1px solid var(--brass-dark);
  align-items: flex-end;
}
.scene-4 .book {
  width: 7px;
  height: 14px;
  background: var(--cream-dark);
  border-radius: 1px;
}
.scene-4 .book:nth-child(2n) { background: #8B6F47; height: 12px; }
.scene-4 .book:nth-child(3n) { background: var(--neon); height: 13px; }
.scene-4 .book:nth-child(5n) { background: #2E5B8B; height: 15px; }

.scene-4 .pen-counter {
  position: absolute;
  bottom: 18px;
  right: 10px;
  width: 80px;
  height: 28px;
  background: var(--terrazzo);
  border-top: 1px solid var(--brass);
}
.scene-4 .pen {
  position: absolute;
  bottom: 24px;
  width: 3px;
  height: 22px;
  cursor: none;
  transition: transform 0.2s ease;
  transform-origin: bottom center;
}
.scene-4 .pen:hover { transform: rotate(-8deg); }
.scene-4 .pen::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: var(--brass-light);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
}
.scene-4 .pen::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 16px;
  background: var(--iron);
  border: 1px solid var(--brass-dark);
}
.scene-4 .pen1 { right: 60px; }
.scene-4 .pen2 { right: 50px; height: 20px; }
.scene-4 .pen3 { right: 40px; height: 24px; }

.scene-4 .poster {
  position: absolute;
  top: 16px;
  right: 20px;
  width: 50px;
  height: 34px;
  background: var(--cream);
  border: 1px solid var(--brass-dark);
  padding: 4px;
  cursor: none;
  transition: transform 0.2s ease;
}
.scene-4 .poster:hover { transform: scale(1.05); }
.scene-4 .poster::before {
  content: "石印画報";
  display: block;
  font-family: var(--font-serif);
  font-size: 7px;
  color: var(--neon);
  text-align: center;
  line-height: 1;
  margin-bottom: 2px;
}
.scene-4 .poster::after {
  content: "中華民國二十五年";
  display: block;
  font-size: 5px;
  color: var(--iron);
  text-align: center;
  font-family: var(--font-mono);
}

/* -- Floor 5: Barber & Photo -- */
.scene-5 { }
.scene-5 .barber-chair {
  position: absolute;
  bottom: 18px;
  left: 15px;
  width: 40px;
  height: 50px;
  cursor: none;
  transition: transform 0.2s ease;
}
.scene-5 .barber-chair:hover { transform: rotate(3deg); }
.scene-5 .chair-back {
  position: absolute;
  top: 0;
  left: 5px;
  width: 24px;
  height: 28px;
  background: var(--neon);
  border-radius: 4px 4px 2px 2px;
  border: 1px solid var(--brass-dark);
}
.scene-5 .chair-seat {
  position: absolute;
  bottom: 14px;
  left: 0;
  width: 34px;
  height: 12px;
  background: var(--neon);
  border: 1px solid var(--brass-dark);
  border-radius: 2px;
}
.scene-5 .chair-base {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 8px;
  height: 14px;
  background: var(--brass-dark);
}
.scene-5 .chair-pump {
  position: absolute;
  bottom: 10px;
  right: 0;
  width: 12px;
  height: 4px;
  background: var(--brass);
  border-radius: 2px;
}

.scene-5 .camera {
  position: absolute;
  bottom: 22px;
  right: 25px;
  width: 40px;
  height: 34px;
  cursor: none;
  transition: transform 0.2s ease;
}
.scene-5 .camera:hover { transform: scale(1.1); }
.scene-5 .camera-body {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 26px;
  background: var(--iron);
  border: 1px solid var(--brass);
  border-radius: 2px;
}
.scene-5 .camera-lens {
  position: absolute;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: radial-gradient(circle, #1a1c1e 0%, var(--iron-light) 70%, var(--brass) 100%);
  border: 2px solid var(--brass-light);
}
.scene-5 .camera-flash {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 12px;
  height: 8px;
  background: var(--brass);
  border-radius: 2px 2px 0 0;
}

.scene-5 .mirror-wall {
  position: absolute;
  top: 8px;
  left: 70px;
  width: 60px;
  height: calc(100% - 26px);
  background: linear-gradient(135deg,
    rgba(240,232,213,0.15) 0%,
    rgba(240,232,213,0.05) 50%,
    rgba(240,232,213,0.15) 100%
  );
  border: 1px solid var(--brass-dark);
}
.scene-5 .mirror-wall::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 1px;
  background: rgba(176,141,62,0.3);
}

/* -- Floor RF: Roof Garden -- */
.scene-rf { }
.scene-rf .night-sky {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 18px;
  background: linear-gradient(180deg, #0a0d14 0%, #1a1f2e 50%, #2a2535 100%);
}
.scene-rf .star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: var(--cream);
  border-radius: 50%;
  animation: twinkle 3s ease-in-out infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}
.scene-rf .star:nth-child(1) { top: 20%; left: 10%; animation-delay: 0s; }
.scene-rf .star:nth-child(2) { top: 15%; left: 40%; animation-delay: 1s; }
.scene-rf .star:nth-child(3) { top: 30%; left: 70%; animation-delay: 0.5s; }
.scene-rf .star:nth-child(4) { top: 10%; left: 85%; animation-delay: 1.5s; }
.scene-rf .star:nth-child(5) { top: 40%; left: 25%; animation-delay: 2s; }
.scene-rf .star:nth-child(6) { top: 25%; left: 55%; animation-delay: 0.7s; }

.scene-rf .moon {
  position: absolute;
  top: 15%;
  right: 10%;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, var(--cream) 0%, var(--cream-dark) 100%);
  box-shadow: 0 0 20px rgba(240,232,213,0.3);
}

.scene-rf .tea-table {
  position: absolute;
  bottom: 22px;
  left: 30px;
  width: 40px;
  height: 20px;
  cursor: none;
  transition: transform 0.2s ease;
}
.scene-rf .tea-table:hover { transform: scale(1.05); }
.scene-rf .table-top {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: var(--brass-dark);
  border-radius: 2px;
}
.scene-rf .table-leg-l,
.scene-rf .table-leg-r {
  position: absolute;
  top: 4px;
  width: 2px;
  height: 16px;
  background: var(--brass);
}
.scene-rf .table-leg-l { left: 4px; transform: rotate(-5deg); }
.scene-rf .table-leg-r { right: 4px; transform: rotate(5deg); }
.scene-rf .teacup {
  position: absolute;
  top: -6px;
  left: 50%;
  transform: translateX(-50%);
  width: 8px;
  height: 7px;
  background: var(--cream);
  border-radius: 0 0 4px 4px;
}

.scene-rf .rattan-chair {
  position: absolute;
  bottom: 22px;
  left: 5px;
  width: 20px;
  height: 26px;
}
.scene-rf .rattan-chair::before {
  content: "";
  position: absolute;
  bottom: 0;
  left: 2px;
  width: 16px;
  height: 4px;
  background: var(--brass-dark);
  border-radius: 2px;
}
.scene-rf .rattan-chair::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 0;
  width: 18px;
  height: 16px;
  background: repeating-linear-gradient(
    45deg,
    var(--brass-dark) 0px,
    var(--brass-dark) 1px,
    transparent 1px,
    transparent 3px
  );
  border: 1px solid var(--brass-dark);
  border-radius: 4px 4px 0 0;
}

/* neon sign back */
.scene-rf .neon-sign {
  position: absolute;
  top: 8px;
  left: 10px;
  height: 18px;
  padding: 2px 8px;
  font-family: var(--font-serif);
  font-size: 10px;
  color: var(--neon);
  letter-spacing: 3px;
  border: 1px solid var(--neon);
  text-shadow: 0 0 6px var(--neon-glow), 0 0 12px var(--neon-glow);
  box-shadow: 0 0 8px var(--neon-glow), inset 0 0 4px var(--neon-glow);
  animation: neon-flicker 3s ease-in-out infinite;
}
@keyframes neon-flicker {
  0%, 95%, 97%, 99%, 100% { opacity: 1; text-shadow: 0 0 6px var(--neon-glow), 0 0 12px var(--neon-glow); box-shadow: 0 0 8px var(--neon-glow); }
  96%, 98% { opacity: 0.7; text-shadow: 0 0 3px var(--neon-glow); box-shadow: 0 0 3px var(--neon-glow); }
}

/* ===== ARCHIVE PANEL (RIGHT) ===== */
.panel {
  width: 45%;
  height: 100vh;
  background: var(--cream);
  position: relative;
  overflow-y: auto;
  overflow-x: hidden;
  cursor: none;
}
.panel::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 8px;
  background: repeating-linear-gradient(
    90deg,
    var(--terrazzo-dark) 0px,
    var(--terrazzo-dark) 4px,
    transparent 4px,
    transparent 8px
  );
  z-index: 5;
}

.panel-inner {
  padding: 40px 36px 36px;
  position: relative;
}

.panel-floor-num {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--brass);
  letter-spacing: 3px;
  margin-bottom: 8px;
}

.panel-title {
  font-family: var(--font-serif);
  font-size: 32px;
  font-weight: normal;
  color: var(--iron);
  letter-spacing: 4px;
  margin-bottom: 4px;
  line-height: 1.3;
}

.panel-subtitle {
  font-size: 12px;
  color: var(--terrazzo-dark);
  letter-spacing: 2px;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--cream-dark);
}

.panel-section {
  margin-bottom: 20px;
}
.panel-section h3 {
  font-family: var(--font-serif);
  font-size: 15px;
  color: var(--neon);
  letter-spacing: 2px;
  margin-bottom: 8px;
  padding-left: 12px;
  border-left: 3px solid var(--brass);
}
.panel-section p {
  font-size: 13px;
  line-height: 1.9;
  color: var(--iron);
  text-align: justify;
}

.panel-meta {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 20px 0;
  padding: 16px;
  background: rgba(126, 143, 130, 0.1);
  border-left: 3px solid var(--brass);
}
.panel-meta-item b {
  display: block;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--brass);
  letter-spacing: 1px;
  margin-bottom: 2px;
}
.panel-meta-item span {
  font-size: 12px;
  color: var(--iron);
}

.panel-quote {
  margin: 20px 0;
  padding: 16px 20px;
  border-top: 1px solid var(--brass);
  border-bottom: 1px solid var(--brass);
  font-family: var(--font-serif);
  font-size: 14px;
  font-style: italic;
  color: var(--terrazzo-dark);
  line-height: 1.8;
  letter-spacing: 1px;
}
.panel-quote::before {
  content: "「";
  color: var(--brass);
  font-size: 18px;
}
.panel-quote::after {
  content: "」";
  color: var(--brass);
  font-size: 18px;
}

/* archive tag - handwritten style */
.archive-tag {
  position: absolute;
  z-index: 100;
  background: var(--cream);
  border: 1px solid var(--brass);
  padding: 10px 12px;
  width: 180px;
  font-size: 11px;
  line-height: 1.6;
  color: var(--iron);
  box-shadow: 3px 3px 0 var(--brass-dark);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  transform: translateY(5px);
  font-family: var(--font-serif);
}
.archive-tag.visible {
  opacity: 1;
  transform: translateY(0);
}
.archive-tag h4 {
  font-size: 12px;
  color: var(--neon);
  margin-bottom: 4px;
  border-bottom: 1px dashed var(--brass-dark);
  padding-bottom: 4px;
  letter-spacing: 1px;
}

/* panel transition */
.panel-content {
  transition: opacity 0.4s ease, transform 0.4s ease;
}
.panel-content.fade-out {
  opacity: 0;
  transform: translateY(10px);
}
.panel-content.fade-in {
  opacity: 1;
  transform: translateY(0);
}

/* ========== RESPONSIVE ========== */
@media (max-width: 1024px) {
  :root {
    --shaft-w: 90px;
  }
  .panel-inner { padding: 32px 24px 24px; }
  .panel-title { font-size: 26px; }
  .title-block h1 { font-size: 18px; }
}

@media (max-width: 768px) {
  .app {
    flex-direction: column;
    overflow-y: auto;
    height: auto;
    min-height: 100vh;
  }
  html, body { overflow-y: auto; }

  .stage {
    width: 100%;
    height: 70vh;
    min-height: 500px;
  }

  .panel {
    width: 100%;
    height: auto;
    min-height: 50vh;
  }

  :root {
    --shaft-w: 80px;
    --floor-h: calc((70vh - 100px) / 6.5);
  }

  .panel-inner { padding: 28px 24px 40px; }
  .panel-meta { grid-template-columns: 1fr; }
}

@media (max-width: 480px) {
  :root {
    --shaft-w: 60px;
  }
  .stage { min-height: 420px; height: 60vh; }
  .title-block h1 { font-size: 15px; letter-spacing: 2px; }
  .title-block p { font-size: 9px; }
  .hint { font-size: 9px; }
  .dial-container { width: 140px; height: 80px; }
  .dial-pointer { transform-origin: 70px 70px; }
  .panel-title { font-size: 22px; letter-spacing: 2px; }
  .panel-section p { font-size: 12px; }
  .floor-label { font-size: 8px; left: 6px; }
  .summon-btn { right: calc(var(--shaft-w) + 8px); width: 18px; height: 18px; }
}

/* ========== REDUCED MOTION ========== */
@media (prefers-reduced-motion: reduce) {
  .car { transition: none !important; }
  .door { transition: none !important; }
  .panel-content { transition: none !important; }
  .car-lamp { animation: none !important; }
  .dust { display: none !important; }
  .neon-sign { animation: none !important; }
  .star { animation: none !important; }
  * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
}

/* ========== ARRIVAL BELL RIPPLE ========== */
.arrival-ripple {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 20px;
  height: 20px;
  border: 2px solid var(--lamp);
  border-radius: 50%;
  pointer-events: none;
  z-index: 10;
  animation: ripple-out 0.8s ease-out forwards;
}
@keyframes ripple-out {
  0% { width: 20px; height: 20px; opacity: 0.8; }
  100% { width: 100px; height: 100px; opacity: 0; }
}
</style>
</head>
<body>

<!-- Custom cursor -->
<div class="cursor-outer" id="cursorOuter"></div>
<div class="cursor-inner" id="cursorInner"></div>

<!-- Archive tag tooltip -->
<div class="archive-tag" id="archiveTag">
  <h4 id="tagTitle"></h4>
  <span id="tagText"></span>
</div>

<div class="app">
  <!-- ===== STAGE: Building cross-section ===== -->
  <div class="stage" id="stage">
    <div class="title-block">
      <h1>升降之间</h1>
      <p>老公寓电梯志 · 一栋百货大楼的垂直漫游</p>
    </div>

    <div class="hint">
      <b>拨动指针</b> 或 <b>按下楼层钮</b> 召梯<br>
      ↑↓ 上下一层 &nbsp; 1-5/R 直达
    </div>

    <button class="sound-toggle sound-muted" id="soundToggle" title="到站铃声开关">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      </svg>
    </button>

    <!-- Semicircular dial -->
    <div class="dial-container" id="dialContainer">
      <svg class="dial-svg" viewBox="0 0 180 100" id="dialSvg">
        <!-- glass face -->
        <path class="dial-glass" d="M 10 88 A 80 80 0 0 1 170 88 L 170 92 L 10 92 Z"/>
        <!-- outer arc -->
        <path class="dial-arc" d="M 12 88 A 78 78 0 0 1 168 88"/>
        <!-- inner arc -->
        <path class="dial-arc-inner" d="M 24 88 A 66 66 0 0 1 156 88"/>
        <!-- ticks and numbers generated by JS -->
        <g id="dialTicks"></g>
        <!-- pointer -->
        <g class="dial-pointer" id="dialPointer">
          <line x1="90" y1="88" x2="90" y2="18" stroke="#D4AF5E" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="90" y1="88" x2="90" y2="25" stroke="#B08D3E" stroke-width="1"/>
          <circle class="dial-pivot" cx="90" cy="88" r="5"/>
        </g>
        <!-- center post -->
        <rect x="85" y="88" width="10" height="8" fill="#8A6E2E"/>
      </svg>
    </div>

    <!-- Floors -->
    <div class="floors" id="floors">
      <!-- Floors generated by JS -->
    </div>

    <!-- Elevator shaft -->
    <div class="shaft" id="shaft">
      <div class="shaft-top">
        <div class="pulley" id="pulley"></div>
      </div>
      <div class="cables">
        <div class="cable cable-1" id="cable1"></div>
        <div class="cable cable-2" id="cable2"></div>
        <div class="cable cable-3" id="cable3"></div>
      </div>
      <div class="dust-container" id="dustContainer"></div>

      <!-- Elevator car -->
      <div class="car" id="car">
        <div class="car-lamp" id="carLamp"></div>
        <div class="car-interior"></div>
        <div class="car-doors">
          <div class="door door-left"></div>
          <div class="door door-right"></div>
        </div>
        <div class="car-floor"></div>
      </div>
    </div>
  </div>

  <!-- ===== PANEL: Archive ===== -->
  <div class="panel" id="panel">
    <div class="panel-inner">
      <div class="panel-content" id="panelContent">
        <!-- Content generated by JS -->
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   升降之间 · 老公寓电梯志
   Pure vanilla JS — no external dependencies
   ============================================================ */

(function() {
  'use strict';

  // ========== CONFIG ==========
  var FLOORS = [
    { id: '1', label: '1F', name: '大堂 · 洋货化妆品柜', angle: 180 },
    { id: '2', label: '2F', name: '绸布庄', angle: 150 },
    { id: '3', label: '3F', name: '钟表眼镜柜', angle: 120 },
    { id: '4', label: '4F', name: '文具书籍部', angle: 90 },
    { id: '5', label: '5F', name: '理发厅与照相馆', angle: 60 },
    { id: 'RF', label: 'RF', name: '屋顶花园茶座', angle: 30 }
  ];

  // ========== EASING ==========
  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  // ========== STATE ==========
  var state = {
    currentFloor: 0,  // index
    targetFloor: null,
    isMoving: false,
    isDoorOpen: true, // starts open at 1F
    isDragging: false,
    soundOn: false,
    reducedMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches,
    rafId: null,
    moveStartTime: 0,
    moveDuration: 0,
    moveStartY: 0,
    moveEndY: 0,
    pulleyAngle: 0,
    dustParticles: [],
    pointerAngle: 180 // starts at 1F (bottom)
  };

  // ========== DOM REFS ==========

  // ========== CUSTOM CURSOR ==========
  function initCursor() {
    el.cursorOuter = document.getElementById('cursorOuter');
    el.cursorInner = document.getElementById('cursorInner');

    var mouseX = window.innerWidth / 2;
    var mouseY = window.innerHeight / 2;
    var outerX = mouseX;
    var outerY = mouseY;

    function onMouseMove(e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
      el.cursorInner.style.transform = 'translate(' + (mouseX - 3) + 'px, ' + (mouseY - 3) + 'px)';
    }

    function animate() {
      outerX += (mouseX - outerX) * 0.15;
      outerY += (mouseY - outerY) * 0.15;
      el.cursorOuter.style.transform = 'translate(' + (outerX - 14) + 'px, ' + (outerY - 14) + 'px)';
      state.cursorRaf = requestAnimationFrame(animate);
    }

    document.addEventListener('mousemove', onMouseMove, { passive: true });
    animate();

    // hover effects
    var interactiveSelectors = 'button, .summon-btn, .dial-pointer, .cosmetic-jar, .perfume, .fabric-roll, .ruler, .clock-big, .glasses, .pen, .poster, .barber-chair, .camera, .tea-table, .sound-toggle';
    document.addEventListener('mouseover', function(e) {
      if (e.target.closest(interactiveSelectors)) {
        document.body.classList.add('cursor-hover');
      }
    });
    document.addEventListener('mouseout', function(e) {
      if (e.target.closest(interactiveSelectors)) {
        document.body.classList.remove('cursor-hover');
      }
    });
  }

  // ========== DIAL (semicircular pointer) ==========
  function initDial() {
    el.dialSvg = document.getElementById('dialSvg');
    el.dialPointer = document.getElementById('dialPointer');
    el.dialTicks = document.getElementById('dialTicks');
    el.dialContainer = document.getElementById('dialContainer');

    var cx = 90, cy = 88, rOuter = 75, rInner = 58, rNum = 48;

    // generate ticks and numbers
    var tickHtml = '';
    FLOORS.forEach(function(floor, idx) {
      var angle = floor.angle * Math.PI / 180;
      // major tick
      var x1 = cx + rOuter * Math.cos(angle);
      var y1 = cy - rOuter * Math.sin(angle);
      var x2 = cx + rInner * Math.cos(angle);
      var y2 = cy - rInner * Math.sin(angle);
      tickHtml += '<line class="dial-tick" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" data-floor-idx="' + idx + '"/>';

      // number
      var nx = cx + rNum * Math.cos(angle);
      var ny = cy - rNum * Math.sin(angle);
      tickHtml += '<text class="dial-number" x="' + nx + '" y="' + ny + '">' + floor.label + '</text>';
    });
    // decorative small ticks between floors
    for (var i = 180; i >= 30; i -= 5) {
      var isMajor = false;
      for (var j = 0; j < FLOORS.length; j++) {
        if (FLOORS[j].angle === i) { isMajor = true; break; }
      }
      if (!isMajor) {
        var ang = i * Math.PI / 180;
        var sx1 = cx + rOuter * Math.cos(ang);
        var sy1 = cy - rOuter * Math.sin(ang);
        var sx2 = cx + (rOuter - 4) * Math.cos(ang);
        var sy2 = cy - (rOuter - 4) * Math.sin(ang);
        tickHtml += '<line stroke="#8A6E2E" stroke-width="0.8" x1="' + sx1 + '" y1="' + sy1 + '" x2="' + sx2 + '" y2="' + sy2 + '"/>';
      }
    }

    // sunburst decoration on top
    for (var k = 30; k <= 180; k += 10) {
      var ang2 = k * Math.PI / 180;
      var bx = cx + (rInner - 10) * Math.cos(ang2);
      var by = cy - (rInner - 10) * Math.sin(ang2);
      var ex = cx + 20 * Math.cos(ang2);
      var ey = cy - 20 * Math.sin(ang2);
      tickHtml += '<line stroke="rgba(176,141,62,0.15)" stroke-width="1" x1="' + bx + '" y1="' + by + '" x2="' + ex + '" y2="' + ey + '"/>';
    }

    el.dialTicks.innerHTML = tickHtml;

    // set initial pointer position
    updatePointer(FLOORS[0].angle);

    // drag interaction
    var isDragging = false;

    function getAngleFromEvent(e) {
      var rect = el.dialSvg.getBoundingClientRect();
      var clientX = e.touches ? e.touches[0].clientX : e.clientX;
      var clientY = e.touches ? e.touches[0].clientY : e.clientY;
      var svgScale = rect.width / 180;
      var x = (clientX - rect.left) / svgScale - cx;
      var y = (cy - (clientY - rect.top) / svgScale);
      var ang = Math.atan2(y, x) * 180 / Math.PI;
      // clamp to 0-180
      if (ang < 0) ang = 0;
      if (ang > 180) ang = 180;
      return ang;
    }

    function onPointerDown(e) {
      if (state.isMoving) return;
      isDragging = true;
      state.isDragging = true;
      document.body.classList.add('cursor-grab');
      e.preventDefault();
      onPointerMove(e);
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      e.preventDefault();
      var ang = getAngleFromEvent(e);
      updatePointer(ang);
    }

    function onPointerUp(e) {
      if (!isDragging) return;
      isDragging = false;
      state.isDragging = false;
      document.body.classList.remove('cursor-grab');

      var ang = getAngleFromEvent(e);
      // snap to nearest floor
      var nearestIdx = 0;
      var nearestDiff = Infinity;
      FLOORS.forEach(function(f, idx) {
        var diff = Math.abs(f.angle - ang);
        if (diff < nearestDiff) {
          nearestDiff = diff;
          nearestIdx = idx;
        }
      });
      // animate pointer to snapped position then summon
      animatePointerTo(FLOORS[nearestIdx].angle, 300, function() {
        summonElevator(nearestIdx);
      });
    }

    el.dialPointer.addEventListener('mousedown', onPointerDown);
    document.addEventListener('mousemove', onPointerMove, { passive: false });
    document.addEventListener('mouseup', onPointerUp);

    // touch support
    el.dialPointer.addEventListener('touchstart', onPointerDown, { passive: false });
    document.addEventListener('touchmove', onPointerMove, { passive: false });
    document.addEventListener('touchend', onPointerUp);

    // click on tick marks
    el.dialTicks.querySelectorAll('.dial-tick').forEach(function(tick) {
      tick.style.cursor = 'none';
      tick.addEventListener('click', function() {
        if (state.isMoving) return;
        var idx = parseInt(tick.dataset.floorIdx, 10);
        animatePointerTo(FLOORS[idx].angle, 400, function() {
          summonElevator(idx);
        });
      });
    });
  }

  function updatePointer(angle) {
    state.pointerAngle = angle;
    el.dialPointer.style.transform = 'rotate(' + (180 - angle) + 'deg)';
  }

  function animatePointerTo(targetAngle, duration, callback) {
    var startAngle = state.pointerAngle;
    var diff = targetAngle - startAngle;
    var startTime = performance.now();

    function step(now) {
      var t = Math.min(1, (now - startTime) / duration);
      var eased = easeInOutCubic(t);
      updatePointer(startAngle + diff * eased);
      if (t < 1) {
        requestAnimationFrame(step);
      } else if (callback) {
        callback();
      }
    }
    requestAnimationFrame(step);
  }

  // ========== ELEVATOR MOVEMENT ==========
  function initElevator() {
    el.car = document.getElementById('car');
    el.pulley = document.getElementById('pulley');
    el.cable1 = document.getElementById('cable1');
    el.cable2 = document.getElementById('cable2');
    el.cable3 = document.getElementById('cable3');
    el.carLamp = document.getElementById('carLamp');
    el.shaft = document.getElementById('shaft');
    el.stage = document.getElementById('stage');

    // initial position at 1F (bottom)
    setCarPosition(getFloorY(0));
    // door starts open
    setTimeout(function() {
      el.car.classList.add('door-open');
      updateFloorLights(0);
    }, 600);
  }

  function getFloorY(idx) {
    // returns bottom position of car for a given floor index (0 = 1F, bottom)
    var shaftHeight = el.shaft.clientHeight - 50; // minus shaft-top
    var carHeight = el.car.clientHeight;
    var floorHeight = shaftHeight / FLOORS.length;
    // add a little offset so car aligns with floor level
    return idx * floorHeight + 8;
  }

  function setCarPosition(bottomPx) {
    el.car.style.bottom = bottomPx + 'px';

    // update pulley rotation based on distance moved
    var carHeight = el.car.clientHeight;
    var travelDistance = bottomPx;
    var pulleyRadius = 17; // px approx
    var angle = (travelDistance / (2 * Math.PI * pulleyRadius)) * 360;
    state.pulleyAngle = angle;
    el.pulley.style.transform = 'rotate(' + angle + 'deg)';

    // update cable apparent length (using gradient position trick)
    var c1 = el.cable1, c2 = el.cable2, c3 = el.cable3;
    // cables connect top of shaft to top of car
    var shaftHeight = el.shaft.clientHeight - 50;
    var cableLength = shaftHeight - bottomPx - carHeight;
    var pct = Math.max(0, cableLength / shaftHeight * 100);
    c1.style.height = pct + '%';
    c2.style.height = pct + '%';
    c3.style.height = pct + '%';
  }

  function summonElevator(targetIdx) {
    if (state.isMoving) return;
    if (targetIdx === state.currentFloor && state.isDoorOpen) return;

    // if already at this floor but door closed, just open
    if (targetIdx === state.currentFloor && !state.isDoorOpen) {
      openDoor();
      return;
    }

    // direction arrows
    var direction = targetIdx > state.currentFloor ? 'up' : 'down';
    setDirectionArrow(state.currentFloor, direction, true);
    setDirectionArrow(targetIdx, direction, true);

    // close door first
    if (state.isDoorOpen) {
      closeDoor(function() {
        startMove(targetIdx);
      });
    } else {
      startMove(targetIdx);
    }
  }

  function startMove(targetIdx) {
    state.isMoving = true;
    state.targetFloor = targetIdx;

    var startY = getFloorY(state.currentFloor);
    var endY = getFloorY(targetIdx);
    var distance = Math.abs(endY - startY);

    // speed: ~500ms per floor, min 400, max 3000
    var floorDiff = Math.abs(targetIdx - state.currentFloor);
    var duration = state.reducedMotion ? 0 : Math.max(400, floorDiff * 600 + 400);

    if (state.reducedMotion) {
      setCarPosition(endY);
      finishMove();
      return;
    }

    state.moveStartTime = performance.now();
    state.moveDuration = duration;
    state.moveStartY = startY;
    state.moveEndY = endY;

    // animate pointer to show progress
    var startAngle = FLOORS[state.currentFloor].angle;
    var endAngle = FLOORS[targetIdx].angle;
    animatePointerTo(endAngle, duration, null);

    requestAnimationFrame(moveLoop);
  }

  function moveLoop(now) {
    if (state.paused) {
      state.moveStartTime = now - (state.moveDuration * (state.lastProgress || 0));
    }
    var t = Math.min(1, (now - state.moveStartTime) / state.moveDuration);
    state.lastProgress = t;
    var eased = easeInOutCubic(t);
    var currentY = state.moveStartY + (state.moveEndY - state.moveStartY) * eased;
    setCarPosition(currentY);

    // lamp swing proportional to velocity
    var velocity = Math.sin(t * Math.PI); // max in middle
    var swingAngle = Math.sin(now / 150) * 5 * velocity;
    el.carLamp.style.transform = 'translateX(-50%) rotate(' + swingAngle + 'deg)';

    if (t < 1) {
      state.rafId = requestAnimationFrame(moveLoop);
    } else {
      finishMove();
    }
  }

  function finishMove() {
    state.isMoving = false;
    state.currentFloor = state.targetFloor;
    state.targetFloor = null;

    // reset lamp
    el.carLamp.style.transform = 'translateX(-50%) rotate(0deg)';

    // arrival effects
    playArrivalBell();
    showArrivalRipple();

    // clear direction arrows
    FLOORS.forEach(function(f, idx) {
      setDirectionArrow(idx, 'up', false);
      setDirectionArrow(idx, 'down', false);
    });

    // clear summon button active state
    document.querySelectorAll('.summon-btn').forEach(function(btn) {
      btn.classList.remove('active');
    });

    // open door
    setTimeout(openDoor, 200);
  }

  // ========== DOORS ==========
  function closeDoor(callback) {
    state.isDoorOpen = false;
    el.car.classList.remove('door-open');
    // fade out current floor
    updateFloorLights(null);
    if (callback) {
      setTimeout(callback, state.reducedMotion ? 0 : 1100);
    }
  }

  function openDoor() {
    state.isDoorOpen = true;
    el.car.classList.add('door-open');
    updateFloorLights(state.currentFloor);
    // switch panel content
    switchPanel(state.currentFloor);
    // active summon button off
    var btn = document.querySelector('.summon-btn[data-floor-idx="' + state.currentFloor + '"]');
    if (btn) btn.classList.remove('active');
  }

  // ========== FLOOR LIGHTS ==========
  function updateFloorLights(activeIdx) {
    document.querySelectorAll('.floor').forEach(function(f, i) {
      if (activeIdx === null) {
        f.classList.remove('active');
      } else if (parseInt(f.dataset.index, 10) === activeIdx) {
        f.classList.add('active');
      } else {

      }

  // ========== DIRECTION ARROWS ==========

    var arrow = document.getElementById('dir' + (dir === 'up' ? 'Up' : 'Down') + '-' + floorIdx);

  // ========== ARRIVAL BELL (WebAudio) ==========
  var audioCtx = null;
  function playArrivalBell() {
    if (!state.soundOn) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var now = audioCtx.currentTime;

      // bell sound - two dings
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(660, now + 0.15);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.3);

      // second ding
      var osc2 = audioCtx.createOscillator();
      var gain2 = audioCtx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(1100, now + 0.12);
      osc2.frequency.exponentialRampToValueAtTime(880, now + 0.35);
      gain2.gain.setValueAtTime(0.1, now + 0.12);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(now + 0.12);
      osc2.stop(now + 0.5);
    } catch(e) { /* silently fail */ }
  }

  function showArrivalRipple() {
    if (state.reducedMotion) return;
    var ripple = document.createElement('div');
    ripple.className = 'arrival-ripple';
    var carRect = el.car.getBoundingClientRect();
    var shaftRect = el.shaft.getBoundingClientRect();
    ripple.style.left = (carRect.left - shaftRect.left + carRect.width / 2) + 'px';
    ripple.style.top = (carRect.top - shaftRect.top + carRect.height / 2) + 'px';
    el.shaft.appendChild(ripple);
    setTimeout(function() { ripple.remove(); }, 800);
  }

  function switchPanel(idx, immediate) {
    var data = panelData[idx];
    if (!data) return;

    if (immediate || state.reducedMotion) {
      renderPanel(data);
      return;
    }

    el.panelContent.classList.add('fade-out');
    setTimeout(function() {
      renderPanel(data);
      el.panelContent.classList.remove('fade-out');
      // force reflow
      void el.panelContent.offsetWidth;
      el.panelContent.classList.add('fade-in');
      setTimeout(function() {
        el.panelContent.classList.remove('fade-in');
      }, 400);
    }, 300);
  }

  function renderPanel(data) {
    var html =
      '<div class="panel-floor-num">' + data.num + '</div>' +
      '<h2 class="panel-title">' + data.title + '</h2>' +
      '<p class="panel-subtitle">' + data.subtitle + '</p>';

    data.sections.forEach(function(sec) {
      html += '<div class="panel-section"><h3>' + sec.h3 + '</h3><p>' + sec.p + '</p></div>';
    });

    html += '<div class="panel-meta">';
    data.meta.forEach(function(m) {
      html += '<div class="panel-meta-item"><b>' + m.label + '</b><span>' + m.val + '</span></div>';
    });
    html += '</div>';

    if (data.quote) {
      html += '<div class="panel-quote">' + data.quote + '</div>';
    }

    el.panelContent.innerHTML = html;
  }

  // ========== DUST PARTICLES ==========
  function initDust() {
    if (state.reducedMotion) return;
    el.dustContainer = document.getElementById('dustContainer');
    var count = 15;
    for (var i = 0; i < count; i++) {
      var d = document.createElement('div');
      d.className = 'dust';
      var dust = {
        el: d,
        x: Math.random() * 100,
        y: Math.random() * 100,
        speed: 0.02 + Math.random() * 0.04,
        sway: Math.random() * 2 - 1,
        opacity: 0.1 + Math.random() * 0.3,
        size: 1 + Math.random() * 2
      };
      d.style.left = dust.x + '%';
      d.style.top = dust.y + '%';
      d.style.width = dust.size + 'px';
      d.style.height = dust.size + 'px';
      d.style.opacity = dust.opacity;
      state.dustParticles.push(dust);
      el.dustContainer.appendChild(d);
    }

    animateDust();
  }

  function animateDust() {
    if (state.paused) {
      state.dustRaf = requestAnimationFrame(animateDust);
      return;
    }
    state.dustParticles.forEach(function(d) {
      d.y += d.speed;
      d.x += d.sway * 0.02;
      if (d.y > 100) {
        d.y = -2;
        d.x = Math.random() * 100;
      }
      if (d.x < 0) d.x = 100;
      if (d.x > 100) d.x = 0;
      d.el.style.top = d.y + '%';
      d.el.style.left = d.x + '%';
    });
    state.dustRaf = requestAnimationFrame(animateDust);
  }

  // ========== ARCHIVE TAG (hover tooltip) ==========
  function initArchiveTag() {
    el.archiveTag = document.getElementById('archiveTag');
    el.tagTitle = document.getElementById('tagTitle');
    el.tagText = document.getElementById('tagText');

    var tagItems = document.querySelectorAll('[data-tag]');
    tagItems.forEach(function(item) {
      item.addEventListener('mouseenter', function(e) {
        var title = item.dataset.tag;
        var desc = item.dataset.tagDesc;
        el.tagTitle.textContent = title;
        el.tagText.textContent = desc;
        el.archiveTag.classList.add('visible');
        updateTagPosition(e);
      });
      item.addEventListener('mousemove', updateTagPosition);
      item.addEventListener('mouseleave', function() {
        el.archiveTag.classList.remove('visible');
      });
    });
  }

  function updateTagPosition(e) {
    var x = e.clientX + 16;
    var y = e.clientY + 16;
    // keep within viewport
    var tagW = 180;
    if (x + tagW > window.innerWidth - 10) {
      x = e.clientX - tagW - 16;
    }
    if (y + 120 > window.innerHeight - 10) {
      y = e.clientY - 120;
    }
    el.archiveTag.style.left = x + 'px';
    el.archiveTag.style.top = y + 'px';
  }

  // ========== KEYBOARD ==========
  function initKeyboard() {
    document.addEventListener('keydown', function(e) {
      if (state.isMoving || state.isDragging) return;
      var target = null;

      switch(e.key) {
        case 'ArrowUp':
          e.preventDefault();
          if (state.currentFloor < FLOORS.length - 1) {
            target = state.currentFloor + 1;
          }
          break;
        case 'ArrowDown':
          e.preventDefault();
          if (state.currentFloor > 0) {
            target = state.currentFloor - 1;
          }
          break;
        case '1':
        case '2':
        case '3':
        case '4':
        case '5':
          target = parseInt(e.key, 10) - 1;
          break;
        case '6':
        case 'r':
        case 'R':
          target = 5; // RF
          break;
        default:
          return;
      }

      if (target !== null && target !== state.currentFloor) {
        // pointer animation first
        animatePointerTo(FLOORS[target].angle, 350, function() {
          summonElevator(target);
        });
      }
    });
  }

  // ========== SOUND TOGGLE ==========
  function initSoundToggle() {
    el.soundToggle = document.getElementById('soundToggle');
    el.soundToggle.addEventListener('click', function() {
      state.soundOn = !state.soundOn;
      if (state.soundOn) {
        el.soundToggle.classList.remove('sound-muted');
        // unlock audio on user gesture
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
        } catch(e) {}
      } else {
        el.soundToggle.classList.add('sound-muted');
      }
    });
  }

  // ========== VISIBILITY CHANGE ==========
  function initVisibility() {
    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        state.paused = true;
      } else {
        state.paused = false;
      }
    });
  }

  // ========== RESIZE ==========
  function initResize() {
    var resizeTimeout;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(function() {
        // recalc car position
        setCarPosition(getFloorY(state.currentFloor));
      }, 200);
    });
  }

  // ========== CLEANUP ==========
  function initCleanup() {
    window.addEventListener('beforeunload', function() {
      if (state.rafId) cancelAnimationFrame(state.rafId);
      if (state.dustRaf) cancelAnimationFrame(state.dustRaf);
      if (state.cursorRaf) cancelAnimationFrame(state.cursorRaf);
      if (audioCtx) audioCtx.close();
    });
  }

  // ========== INIT ==========
  function init() {
    buildFloors();
    initDial();
    initElevator();
    initPanel();
    initCursor();
    initDust();
    initArchiveTag();
    initKeyboard();
    initSoundToggle();
    initVisibility();
    initResize();
    initCleanup();

    // announce upgrade capability
    try {
      window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    } catch(e) {}
  }

  // Start
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();

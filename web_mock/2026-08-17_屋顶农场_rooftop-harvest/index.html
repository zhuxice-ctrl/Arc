<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>Rooftop Harvest · 屋顶农场</title>
<link rel="preconnect" href="https://miaoda.feishucdn.cn" />
<link rel="stylesheet" href="https://miaoda.feishucdn.cn/fonts/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" />
<style>
  /* ========== RESET & BASE ========== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #F5F0E6;
    color: #2A2A28;
    overflow-x: hidden;
    cursor: none;
    line-height: 1.6;
  }
  @media (max-width: 768px) { body { cursor: auto; } }
  img { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: none; border: none; background: none; }
  @media (max-width: 768px) { button { cursor: pointer; } }

  /* ========== COLOR TOKENS ========== */
  :root {
    --tomato: #D64532;
    --tomato-dark: #B53624;
    --tomato-light: #E8745F;
    --basil: #4A7C4A;
    --basil-dark: #3A6339;
    --basil-light: #6BA36A;
    --cream: #F5F0E6;
    --cream-dark: #E8E0D0;
    --wheat: #E8DCC4;
    --charcoal: #2A2A28;
    --charcoal-light: #4A4A48;
    --sunflower: #E8B23A;
  }

  /* ========== CUSTOM CURSOR ========== */
  .cursor-outer {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 40px;
    height: 40px;
    border: 2px solid #fff;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.25s cubic-bezier(.25,.46,.45,.94),
                height 0.25s cubic-bezier(.25,.46,.45,.94),
                border-color 0.25s ease,
                background-color 0.25s ease;
    box-shadow:
      0 0 20px rgba(214, 69, 50, 0.4),
      0 0 40px rgba(74, 124, 74, 0.2),
      inset 0 0 10px rgba(255,255,255,0.1);
    mix-blend-mode: difference;
  }
  .cursor-inner {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 8px;
    height: 8px;
    background: var(--tomato);
    border-radius: 50%;
    pointer-events: none;
    z-index: 10000;
    transform: translate(-50%, -50%);
    transition: width 0.2s ease, height 0.2s ease, background 0.2s ease;
    box-shadow:
      0 0 10px var(--tomato),
      0 0 20px rgba(214, 69, 50, 0.5);
  }
  .cursor-outer.hover {
    width: 60px;
    height: 60px;
    border-color: var(--basil-light);
    background: rgba(74, 124, 74, 0.1);
  }
  .cursor-inner.hover {
    width: 4px;
    height: 4px;
    background: var(--basil);
  }
  .cursor-outer.click {
    width: 30px;
    height: 30px;
    border-color: var(--sunflower);
  }
  .cursor-ripple {
    position: fixed;
    border-radius: 50%;
    border: 2px solid var(--tomato);
    pointer-events: none;
    z-index: 9998;
    animation: rippleExpand 0.6s ease-out forwards;
    opacity: 0;
  }
  @keyframes rippleExpand {
    0% { width: 0; height: 0; opacity: 0.8; }
    100% { width: 80px; height: 80px; opacity: 0; border-width: 0px; }
  }
  @media (max-width: 768px) {
    .cursor-outer, .cursor-inner, .cursor-ripple { display: none; }
  }

  /* ========== PARTICLES ========== */
  .particle-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  /* ========== NAV ========== */
  .nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    padding: 24px 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.4s ease, padding 0.4s ease, backdrop-filter 0.4s ease;
  }
  .nav.scrolled {
    background: rgba(245, 240, 230, 0.9);
    backdrop-filter: blur(20px);
    padding: 16px 48px;
    box-shadow: 0 1px 20px rgba(42, 42, 40, 0.06);
  }
  .nav-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 24px;
    color: var(--charcoal);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-logo-mark {
    width: 36px;
    height: 36px;
    position: relative;
  }
  .nav-links {
    display: flex;
    gap: 40px;
    align-items: center;
  }
  .nav-link {
    font-size: 14px;
    font-weight: 500;
    color: var(--charcoal-light);
    position: relative;
    transition: color 0.3s ease;
    letter-spacing: 0.02em;
  }
  .nav-link::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0;
    height: 2px;
    background: var(--tomato);
    transition: width 0.3s cubic-bezier(.25,.46,.45,.94);
  }
  .nav-link:hover { color: var(--tomato); }
  .nav-link:hover::after { width: 100%; }
  .nav-cta {
    padding: 12px 28px;
    background: var(--tomato);
    color: #fff;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.3s cubic-bezier(.25,.46,.45,.94);
    position: relative;
    overflow: hidden;
  }
  .nav-cta::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: left 0.5s ease;
  }
  .nav-cta:hover {
    background: var(--tomato-dark);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(214, 69, 50, 0.3);
  }
  .nav-cta:hover::before { left: 100%; }
  .nav-hamburger { display: none; }
  @media (max-width: 768px) {
    .nav { padding: 16px 20px; }
    .nav.scrolled { padding: 12px 20px; }
    .nav-links { display: none; }
    .nav-hamburger {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 8px;
    }
    .nav-hamburger span {
      width: 24px;
      height: 2px;
      background: var(--charcoal);
      transition: all 0.3s ease;
    }
    .mobile-menu {
      position: fixed;
      top: 0;
      right: -100%;
      width: 80%;
      max-width: 320px;
      height: 100vh;
      background: var(--cream);
      z-index: 2000;
      padding: 80px 32px;
      transition: right 0.4s cubic-bezier(.25,.46,.45,.94);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .mobile-menu.open { right: 0; }
    .mobile-menu .nav-link { font-size: 20px; }
    .mobile-menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(42, 42, 40, 0.4);
      z-index: 1999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .mobile-menu-overlay.open { opacity: 1; pointer-events: auto; }
  }

  /* ========== HERO ========== */
  .hero {
    min-height: 100vh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 120px 48px 80px;
  }
  .hero-bg {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 0;
  }
  .hero-bg-image {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.25;
    filter: saturate(0.9);
  }
  .hero-gradient {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(214, 69, 50, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(74, 124, 74, 0.1) 0%, transparent 50%),
      linear-gradient(180deg, var(--cream) 0%, var(--cream) 100%);
  }
  .hero-content {
    position: relative;
    z-index: 2;
    max-width: 1200px;
    width: 100%;
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 60px;
    align-items: center;
  }
  .hero-tag {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 20px;
    background: rgba(74, 124, 74, 0.1);
    border: 1px solid rgba(74, 124, 74, 0.2);
    border-radius: 50px;
    font-size: 13px;
    font-weight: 500;
    color: var(--basil);
    margin-bottom: 32px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .hero-tag-dot {
    width: 6px;
    height: 6px;
    background: var(--basil);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.3); }
  }
  .hero-title {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(48px, 7vw, 96px);
    line-height: 1.05;
    color: var(--charcoal);
    margin-bottom: 24px;
    font-weight: 400;
  }
  .hero-title span {
    color: var(--tomato);
    font-style: italic;
    position: relative;
    display: inline-block;
  }
  .hero-title span::after {
    content: '';
    position: absolute;
    bottom: 8px;
    left: 0;
    width: 100%;
    height: 8px;
    background: rgba(214, 69, 50, 0.15);
    z-index: -1;
    border-radius: 4px;
  }
  .hero-subtitle {
    font-size: 18px;
    color: var(--charcoal-light);
    line-height: 1.7;
    margin-bottom: 40px;
    max-width: 520px;
  }
  .hero-actions {
    display: flex;
    gap: 16px;
    margin-bottom: 48px;
  }
  .btn-primary {
    padding: 16px 36px;
    background: var(--tomato);
    color: #fff;
    border-radius: 50px;
    font-size: 15px;
    font-weight: 600;
    transition: all 0.3s cubic-bezier(.25,.46,.45,.94);
    position: relative;
    overflow: hidden;
  }
  .btn-primary::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: left 0.6s ease;
  }
  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(214, 69, 50, 0.35);
    background: var(--tomato-dark);
  }
  .btn-primary:hover::before { left: 100%; }
  .btn-secondary {
    padding: 16px 36px;
    background: transparent;
    color: var(--charcoal);
    border: 1.5px solid var(--charcoal-light);
    border-radius: 50px;
    font-size: 15px;
    font-weight: 500;
    transition: all 0.3s ease;
  }
  .btn-secondary:hover {
    background: var(--charcoal);
    color: var(--cream);
    border-color: var(--charcoal);
  }
  .hero-stats {
    display: flex;
    gap: 48px;
  }
  .hero-stat {
    display: flex;
    flex-direction: column;
  }
  .hero-stat-number {
    font-family: 'DM Serif Display', serif;
    font-size: 36px;
    color: var(--tomato);
    line-height: 1;
    margin-bottom: 4px;
  }
  .hero-stat-label {
    font-size: 13px;
    color: var(--charcoal-light);
    font-weight: 500;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .hero-visual {
    position: relative;
    height: 560px;
  }
  .hero-image-main {
    position: absolute;
    width: 85%;
    height: 75%;
    top: 0;
    right: 0;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(42, 42, 40, 0.15);
    transform: rotate(2deg);
    transition: transform 0.5s ease;
  }
  .hero-image-main:hover { transform: rotate(0deg) scale(1.02); }
  .hero-image-main img { width: 100%; height: 100%; object-fit: cover; }
  .hero-image-float {
    position: absolute;
    width: 200px;
    height: 200px;
    bottom: 0;
    left: 0;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(42, 42, 40, 0.2);
    transform: rotate(-6deg);
    animation: floatY 6s ease-in-out infinite;
  }
  .hero-image-float img { width: 100%; height: 100%; object-fit: cover; }
  @keyframes floatY {
    0%, 100% { transform: rotate(-6deg) translateY(0); }
    50% { transform: rotate(-6deg) translateY(-15px); }
  }
  .hero-badge {
    position: absolute;
    top: 30%;
    right: -10px;
    background: var(--basil);
    color: #fff;
    padding: 14px 24px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 10px 30px rgba(74, 124, 74, 0.3);
    animation: floatBadge 4s ease-in-out infinite;
    z-index: 3;
  }
  @keyframes floatBadge {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .hero-badge-icon {
    width: 20px;
    height: 20px;
    background: rgba(255,255,255,0.2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }
  .hero-scroll-hint {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--charcoal-light);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .hero-scroll-line {
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, var(--charcoal-light), transparent);
    animation: scrollLine 2s ease-in-out infinite;
  }
  @keyframes scrollLine {
    0%, 100% { opacity: 0.3; transform: scaleY(0.6); }
    50% { opacity: 1; transform: scaleY(1); }
  }

  @media (max-width: 768px) {
    .hero { padding: 100px 20px 60px; min-height: auto; }
    .hero-content { grid-template-columns: 1fr; gap: 40px; }
    .hero-visual { height: 340px; }
    .hero-image-float { width: 140px; height: 140px; }
    .hero-stats { gap: 24px; flex-wrap: wrap; }
    .hero-actions { flex-direction: column; }
    .btn-primary, .btn-secondary { text-align: center; }
  }

  /* ========== SECTION COMMON ========== */
  .section {
    padding: 120px 48px;
    position: relative;
  }
  .section-label {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--tomato);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .section-title {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(36px, 5vw, 64px);
    line-height: 1.1;
    color: var(--charcoal);
    margin-bottom: 20px;
    font-weight: 400;
  }
  .section-desc {
    font-size: 17px;
    color: var(--charcoal-light);
    line-height: 1.7;
    max-width: 560px;
  }
  .section-header {
    max-width: 700px;
    margin-bottom: 64px;
  }
  .container {
    max-width: 1280px;
    margin: 0 auto;
  }
  @media (max-width: 768px) {
    .section { padding: 80px 20px; }
    .section-header { margin-bottom: 40px; }
  }

  /* ========== STORY SECTION ========== */
  .story-section {
    background: var(--cream);
    position: relative;
  }
  .story-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: center;
  }
  .story-visual {
    position: relative;
    height: 500px;
  }
  .story-image {
    position: absolute;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(42, 42, 40, 0.15);
  }
  .story-image-1 {
    width: 70%;
    height: 80%;
    top: 0;
    left: 0;
  }
  .story-image-1 img { width: 100%; height: 100%; object-fit: cover; }
  .story-image-2 {
    width: 45%;
    height: 40%;
    bottom: 0;
    right: 0;
  }
  .story-image-2 img { width: 100%; height: 100%; object-fit: cover; }
  .story-vine {
    position: absolute;
    top: -40px;
    right: 20%;
    width: 80px;
    height: 200px;
    z-index: 2;
  }
  .vine-path {
    stroke: var(--basil);
    stroke-width: 2;
    fill: none;
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
  }
  .vine-path.animate {
    animation: vineGrow 2.5s ease-out forwards;
  }
  @keyframes vineGrow {
    to { stroke-dashoffset: 0; }
  }
  .story-content-block {
    margin-bottom: 32px;
    padding-left: 24px;
    border-left: 2px solid var(--wheat);
    transition: border-color 0.3s ease, padding-left 0.3s ease;
  }
  .story-content-block:hover {
    border-left-color: var(--tomato);
    padding-left: 28px;
  }
  .story-content-block h3 {
    font-family: 'DM Serif Display', serif;
    font-size: 24px;
    color: var(--charcoal);
    margin-bottom: 8px;
    font-weight: 400;
  }
  .story-content-block p {
    font-size: 15px;
    color: var(--charcoal-light);
    line-height: 1.7;
  }
  @media (max-width: 768px) {
    .story-grid { grid-template-columns: 1fr; gap: 40px; }
    .story-visual { height: 350px; }
  }

  /* ========== CROPS SECTION ========== */
  .crops-section {
    background: var(--wheat);
    position: relative;
  }
  .crops-section::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(42,42,40,0.1), transparent);
  }
  .crops-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 48px;
    flex-wrap: wrap;
  }
  .crop-tab {
    padding: 12px 28px;
    background: transparent;
    border: 1.5px solid rgba(42,42,40,0.15);
    border-radius: 50px;
    font-size: 14px;
    font-weight: 500;
    color: var(--charcoal-light);
    transition: all 0.3s ease;
  }
  .crop-tab:hover {
    border-color: var(--basil);
    color: var(--basil);
  }
  .crop-tab.active {
    background: var(--charcoal);
    color: var(--cream);
    border-color: var(--charcoal);
  }
  .crops-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 32px;
  }
  .crop-card {
    background: var(--cream);
    border-radius: 20px;
    overflow: hidden;
    transition: transform 0.4s cubic-bezier(.25,.46,.45,.94), box-shadow 0.4s ease;
    position: relative;
    transform-style: preserve-3d;
    perspective: 1000px;
  }
  .crop-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 60px rgba(42,42,40,0.12);
  }
  .crop-card-image {
    position: relative;
    height: 240px;
    overflow: hidden;
  }
  .crop-card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s cubic-bezier(.25,.46,.45,.94);
  }
  .crop-card:hover .crop-card-image img { transform: scale(1.08); }
  .crop-card-image::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 50%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transform: skewX(-25deg);
  }
  .crop-card:hover .crop-card-image::after {
    animation: gloss 0.8s ease forwards;
  }
  @keyframes gloss {
    to { left: 150%; }
  }
  .crop-season {
    position: absolute;
    top: 16px;
    left: 16px;
    padding: 6px 14px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    border-radius: 50px;
    font-size: 12px;
    font-weight: 600;
    color: var(--basil);
    z-index: 2;
  }
  .crop-card-body {
    padding: 24px;
  }
  .crop-card-name {
    font-family: 'DM Serif Display', serif;
    font-size: 26px;
    color: var(--charcoal);
    margin-bottom: 6px;
    font-weight: 400;
  }
  .crop-card-latin {
    font-size: 13px;
    color: var(--charcoal-light);
    font-style: italic;
    margin-bottom: 16px;
    opacity: 0.7;
  }
  .crop-card-desc {
    font-size: 14px;
    color: var(--charcoal-light);
    line-height: 1.6;
    margin-bottom: 20px;
  }
  .crop-card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 16px;
    border-top: 1px solid rgba(42,42,40,0.08);
  }
  .crop-yield {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--charcoal-light);
  }
  .crop-yield strong {
    color: var(--tomato);
    font-size: 18px;
    font-family: 'DM Serif Display', serif;
    margin-right: 4px;
  }
  .crop-leaf-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s ease;
  }
  .crop-card:hover .crop-leaf-icon {
    animation: leafSway 0.8s ease-in-out infinite;
  }
  @keyframes leafSway {

      p.y += p.vy;
      p.rotation += p.rotSpeed;
      drawLeaf(p);
      if (p.y > canvas.height + 20) {
        particles[i] = createParticle();
      }
      if (p.x < -20 || p.x > canvas.width + 20) {
        p.vx *= -1;
      }
    });
    rafId = requestAnimationFrame(animate);
  };

  const start = () => {
    if (!rafId && pageVisible) rafId = requestAnimationFrame(animate);
  };
  const stop = () => {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  };

  const handleVis = () => {
    pageVisible = !document.hidden;
    if (pageVisible) start();
    else stop();
  };

  resize();
  init();
  window.addEventListener('resize', () => { resize(); init(); });
  document.addEventListener('visibilitychange', handleVis);
  start();

  return () => {
    stop();
    window.removeEventListener('resize', resize);
    document.removeEventListener('visibilitychange', handleVis);
  };
}

// ========== SCROLL REVEAL ==========
function initReveal() {
  if (prefersReducedMotion) {
    document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
    return;
  }
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });

  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  return () => observer.disconnect();
}

// ========== NAV SCROLL EFFECT ==========
function initNavScroll() {
  const nav = document.querySelector('.nav');
  if (!nav) return;
  let ticking = false;
  const onScroll = () => {
    if (!ticking) {
      requestAnimationFrame(() => {
        if (window.scrollY > 50) nav.classList.add('scrolled');
        else nav.classList.remove('scrolled');
        ticking = false;
      });
      ticking = true;
    }
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  return () => window.removeEventListener('scroll', onScroll);
}

// ========== COUNTER ANIMATION (number counting up) ==========
function useCounter(target, duration = 2000, start = false) {
  const [value, setValue] = useState(0);
  const rafRef = useRef(null);

  useEffect(() => {
    if (!start || prefersReducedMotion) {
      setValue(target);
      return;
    }
    const startTime = performance.now();
    const animate = (now) => {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      // easeOutCubic
      const eased = 1 - Math.pow(1 - progress, 3);
      setValue(Math.round(eased * target));
      if (progress < 1) {
        rafRef.current = requestAnimationFrame(animate);
      }
    };
    rafRef.current = requestAnimationFrame(animate);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [target, duration, start]);

  return value;
}

// ========== TYPEWRITER ==========
function useTypewriter(words, typeSpeed = 100, deleteSpeed = 60, pause = 2000) {
  const [text, setText] = useState('');
  const [wordIndex, setWordIndex] = useState(0);
  const [isDeleting, setIsDeleting] = useState(false);
  const timerRef = useRef(null);

  useEffect(() => {
    if (prefersReducedMotion) {
      setText(words[0]);
      return;
    }
    const currentWord = words[wordIndex % words.length];
    let delay = isDeleting ? deleteSpeed : typeSpeed;

    if (!isDeleting && text === currentWord) {
      delay = pause;
      timerRef.current = setTimeout(() => setIsDeleting(true), delay);
    } else if (isDeleting && text === '') {
      setIsDeleting(false);
      setWordIndex(w => w + 1);
    } else {
      timerRef.current = setTimeout(() => {
        setText(prev => isDeleting
          ? prev.substring(0, prev.length - 1)
          : currentWord.substring(0, prev.length + 1)
        );
      }, delay);
    }
    return () => {
      if (timerRef.current) clearTimeout(timerRef.current);
    };
  }, [text, isDeleting, wordIndex, words, typeSpeed, deleteSpeed, pause]);

  return text;
}

// ========== 3D CARD TILT (direct DOM, no React setState) ==========
function initCardTilt() {
  if (prefersReducedMotion || window.innerWidth < 768) return;
  const cards = document.querySelectorAll('.crop-card');

  const handleMove = (e) => {
    const card = e.currentTarget;
    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;
    const rotateY = ((x - centerX) / centerX) * 8;
    const rotateX = ((centerY - y) / centerY) * 8;
    card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-8px)`;
  };

  const handleLeave = (e) => {
    e.currentTarget.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) translateY(0)';
  };

  cards.forEach(card => {
    card.addEventListener('mousemove', handleMove);
    card.addEventListener('mouseleave', handleLeave);
  });

  return () => {
    cards.forEach(card => {
      card.removeEventListener('mousemove', handleMove);
      card.removeEventListener('mouseleave', handleLeave);
    });
  };
}

// ========== VINE GROW ON SCROLL ==========
function initVineGrow() {
  if (prefersReducedMotion) {
    document.querySelectorAll('.vine-path').forEach(el => el.classList.add('animate'));
    return;
  }
  const vines = document.querySelectorAll('.vine-path');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('animate');
      }
    });
  }, { threshold: 0.3 });
  vines.forEach(v => observer.observe(v));
  return () => observer.disconnect();
}

                <img src={IMG_FARMER} alt="农夫采收" />
              </div>
              <div className="story-image story-image-2">
                <img src={IMG_TOMATO} alt="新鲜番茄" />
              </div>
              <div className="story-vine">
                <svg viewBox="0 0 80 200" fill="none" width="100%" height="100%">
                  <path className="vine-path" d="M40 0 Q20 30 40 60 Q60 90 40 120 Q20 150 40 180 Q35 190 40 200" />
                  <path className="vine-path" d="M40 40 Q25 35 20 45" style={{ strokeDasharray: 40, strokeDashoffset: 40 }} />
                  <path className="vine-path" d="M40 100 Q55 95 60 105" style={{ strokeDasharray: 40, strokeDashoffset: 40 }} />
                  <path className="vine-path" d="M40 160 Q25 155 20 165" style={{ strokeDasharray: 40, strokeDashoffset: 40 }} />
                </svg>
              </div>
            </div>

            <div className="story-content">
              <div className="section-label reveal">我们的故事</div>
              <h2 className="section-title reveal reveal-delay-1">
                从一片天台<br />到一座农园
              </h2>
              <p className="section-desc reveal reveal-delay-2" style={{ marginBottom: '40px' }}>
                2021 年的春天，我们在一栋老百货的屋顶，
                开始了一场关于城市与食物的小实验。
              </p>

              <div className="story-content-block reveal reveal-delay-2">
                <h3>为什么是屋顶</h3>
                <p>城市里的土地太贵，天台却被闲置。我们想证明：只要有光、有土、有真心，一百米的高空也能长出一片田野。</p>
              </div>
              <div className="story-content-block reveal reveal-delay-3">
                <h3>有机，不只是说说</h3>
                <p>所有作物都不使用化学农药和化肥。我们用堆肥改良土壤，用天敌防治虫害，用手一根一根地拔除杂草。</p>
              </div>
              <div className="story-content-block reveal reveal-delay-4">
                <h3>从农场到餐桌，只有三层楼</h3>
                <p>楼下的餐厅用我们的番茄做意面，隔壁的咖啡馆用我们的罗勒调鸡尾酒。摘下锅，不过几分钟的距离。</p>
              </div>
            </div>
          </div>
        </div>
      </section>

      {/* CROPS */}
      <section className="section crops-section" id="crops">
        <div className="container">
          <div className="section-header">
            <div className="section-label reveal">当季作物</div>
            <h2 className="section-title reveal reveal-delay-1">现在正在生长</h2>
            <p className="section-desc reveal reveal-delay-2">
              每一季都有不同的惊喜。以下是这个季节，你可以在农园里找到、也可以亲手摘下的作物。
            </p>
          </div>

          <div className="crops-tabs reveal reveal-delay-2">
            {Object.keys(CROPS).map((key) => (
              <button
                key={key}
                className={`crop-tab ${activeTab === key ? 'active' : ''}`}
                onClick={() => setActiveTab(key)}
              >
                {TAB_LABELS[key]}
              </button>
            ))}
          </div>

          <div className="crops-grid">
            {CROPS[activeTab].map((crop, i) => (
              <div key={crop.name} className="crop-card reveal" style={{ transitionDelay: `${i * 0.1}s` }}>
                <div className="crop-card-image">
                  <img src={crop.image} alt={crop.name} />
                  <span className="crop-season">{crop.season}</span>
                </div>
                <div className="crop-card-body">
                  <h3 className="crop-card-name">{crop.name}</h3>
                  <div className="crop-card-latin">{crop.latin}</div>
                  <p className="crop-card-desc">{crop.desc}</p>
                  <div className="crop-card-meta">
                    <div className="crop-yield">
                      <strong>{crop.yield}</strong>{crop.unit} · 亩产
                    </div>
                    <span className="crop-leaf-icon">
                      <LeafIcon size={18} color="#4A7C4A" />
                    </span>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* MARKET */}
      <section className="section market-section" id="market">
        <div className="market-bg-pattern"></div>
        <div className="container">
          <div className="section-header">
            <div className="section-label reveal">周末市集</div>
            <h2 className="section-title reveal reveal-delay-1">九月的屋顶聚会</h2>
            <p className="section-desc reveal reveal-delay-2">
              每个周末，我们把农园变成市集。
              新鲜的菜、刚出炉的面包、手作的果酱，还有认识食物的人们。
            </p>
          </div>

          <div className="market-content">
            <div className="market-schedule">
              {MARKET_DAYS.map((day, i) => (
                <div key={i} className="market-day reveal" style={{ transitionDelay: `${i * 0.1}s` }}>
                  <div className="market-day-date">
                    <div className="day">{day.day}</div>
                    <div className="month">{day.month}</div>
                  </div>
                  <div className="market-day-info">
                    <h4>{day.title}</h4>
                    <p>{day.desc}</p>
                    <span className="market-day-time">{day.time}</span>
                  </div>
                </div>
              ))}
            </div>

            <div className="reveal reveal-delay-2">
              <div className="market-image">
                <img src={IMG_MARKET} alt="周末市集" />
                <div className="market-image-overlay">
                  <h3>14 家摊位 · 每周六</h3>
                  <p>从农场到餐桌，从早餐到夕阳</p>
                </div>
              </div>
              <div className="market-stalls">
                {STALLS.map((stall, i) => (
                  <div key={i} className="stall-item">
                    <span className={`stall-dot ${stall.color}`}></span>
                    {stall.name}
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      </section>

      {/* FARMERS */}
      <section className="section farmers-section" id="farmers">
        <div className="container">
          <div className="section-header">
            <div className="section-label reveal">农夫团队</div>
            <h2 className="section-title reveal reveal-delay-1">照顾这片园子的人</h2>
            <p className="section-desc reveal reveal-delay-2">
              他们不是农民出身，但都选择了和泥土打交道的生活。
              来认识一下每天在屋顶上忙碌的这群人。
            </p>
          </div>

          <div className="farmers-grid">
            {FARMERS.map((farmer, i) => (
              <div key={farmer.name} className="farmer-card reveal" style={{ transitionDelay: `${i * 0.15}s` }}>
                <div className="farmer-avatar">
                  <img src={farmer.image} alt={farmer.name} />
                </div>
                <h3 className="farmer-name">{farmer.name}</h3>
                <div className="farmer-role">{farmer.role}</div>
                <p className="farmer-bio">{farmer.bio}</p>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* BOOKING */}
      <section className="section booking-section" id="booking">
        <div className="container">
          <div className="booking-content">
            <div>
              <div className="section-label reveal">预约体验</div>
              <h2 className="section-title reveal reveal-delay-1">
                来屋顶<br />当一天农夫
              </h2>
              <p className="section-desc reveal reveal-delay-2" style={{ marginBottom: '40px' }}>
                选择你感兴趣的体验，留下联系方式，
                我们会在 24 小时内和你确认时间。
              </p>

              <div className="experience-tiles">
                {EXPERIENCES.map((exp, i) => (
                  <div
                    key={exp.id}
                    className={`exp-tile reveal ${selectedExp === exp.id ? 'selected' : ''}`}
                    style={{ transitionDelay: `${i * 0.1}s` }}
                    onClick={() => setSelectedExp(exp.id)}
                  >
                    <div className="exp-tile-icon">{exp.icon}</div>
                    <div className="exp-tile-content">
                      <h4>{exp.title}</h4>
                      <p>{exp.desc}</p>
                      <div className="exp-tile-price">{exp.price}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="booking-form reveal reveal-delay-2">
              {!formSubmitted ? (
                <form onSubmit={handleSubmit}>
                  <h3 style={{ fontFamily: 'DM Serif Display, serif', fontSize: '28px', marginBottom: '8px', color: 'var(--charcoal)', fontWeight: 400 }}>
                    预约{EXPERIENCES.find(e => e.id === selectedExp)?.title}
                  </h3>
                  <p style={{ fontSize: '14px', color: 'var(--charcoal-light)', marginBottom: '32px' }}>
                    填写信息，我们会尽快联系你确认细节。
                  </p>

                  <div className="form-row">
                    <div className="form-group">
                      <label className="form-label">姓名</label>
                      <input
                        type="text"
                        name="name"
                        className="form-input"
                        placeholder="你的名字"
                        value={formData.name}
                        onChange={handleInputChange}
                        required
                      />
                    </div>
                    <div className="form-group">
                      <label className="form-label">人数</label>
                      <select name="people" className="form-select" value={formData.people} onChange={handleInputChange} required>
                        <option value="">请选择</option>
                        <option value="1">1 人</option>
                        <option value="2">2 人</option>
                        <option value="3-4">3-4 人</option>
                        <option value="5+">5 人以上</option>
                      </select>
                    </div>
                  </div>

                  <div className="form-group">
                    <label className="form-label">邮箱</label>
                    <input
                      type="email"
                      name="email"
                      className="form-input"
                      placeholder="you@example.com"
                      value={formData.email}
                      onChange={handleInputChange}
                      required
                    />
                  </div>

                  <div className="form-group">
                    <label className="form-label">手机号</label>
                    <input
                      type="tel"
                      name="phone"
                      className="form-input"
                      placeholder="138 0000 0000"
                      value={formData.phone}
                      onChange={handleInputChange}
                      required
                    />
                  </div>

                  <div className="form-group">
                    <label className="form-label">期望日期</label>
                    <input
                      type="date"
                      name="date"
                      className="form-input"
                      value={formData.date}
                      onChange={handleInputChange}
                      required
                    />
                  </div>

                  <div className="form-group">
                    <label className="form-label">有什么想说的（可选）</label>
                    <textarea
                      name="message"
                      className="form-textarea"
                      placeholder="比如对什么作物特别感兴趣、饮食禁忌等等"
                      value={formData.message}
                      onChange={handleInputChange}
                    ></textarea>
                  </div>

                  <button type="submit" className="form-submit">
                    提交预约
                  </button>
                </form>
              ) : (
                <div className="form-success">
                  <div className="form-success-icon">
                    <LeafIcon size={36} color="#fff" />
                  </div>
                  <h3>预约已提交!</h3>
                  <p>我们会在 24 小时内联系你确认时间。<br />期待在屋顶见到你 🌿</p>
                  <button
                    className="btn-secondary"
                    style={{ marginTop: '24px' }}
                    onClick={() => { setFormSubmitted(false); setFormData({ name: '', email: '', phone: '', date: '', people: '', message: '' }); }}
                  >
                    再预约一次
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      </section>

      {/* FOOTER */}
      <footer className="footer">
        <div className="container">
          <div className="footer-top">
            <div className="footer-brand">
              <div className="nav-logo">
                <LogoMark />
                <span>Rooftop Harvest</span>
              </div>
              <p>
                城市中心的屋顶有机农场。
                我们相信，好的食物不一定要远方，
                抬头看看，它可能就在你头顶的天台之上。
              </p>
            </div>
            <div className="footer-col">
              <h5>探索</h5>
              <a href="#story" onClick={(e) => { e.preventDefault(); scrollToSection('story'); }}>农园故事</a>
              <a href="#crops" onClick={(e) => { e.preventDefault(); scrollToSection('crops'); }}>当季作物</a>
              <a href="#market" onClick={(e) => { e.preventDefault(); scrollToSection('market'); }}>周末市集</a>
              <a href="#farmers" onClick={(e) => { e.preventDefault(); scrollToSection('farmers'); }}>农夫团队</a>
            </div>
            <div className="footer-col">
              <h5>体验</h5>
              <a href="#booking" onClick={(e) => { e.preventDefault(); scrollToSection('booking'); }}>采收体验</a>
              <a href="#booking" onClick={(e) => { e.preventDefault(); scrollToSection('booking'); }}>烹饪工坊</a>
              <a href="#booking" onClick={(e) => { e.preventDefault(); scrollToSection('booking'); }}>租一块菜床</a>
              <a href="#">企业团建</a>
            </div>
            <div className="footer-col">
              <h5>联系</h5>
              <a href="#">hello@rooftopharvest.cn</a>
              <a href="#">021-8888-6666</a>
              <a href="#">上海市静安区南京西路1788号<br />国际中心12F 屋顶</a>
            </div>
          </div>
          <div className="footer-bottom">
            <span>© 2026 Rooftop Harvest · 屋顶农场. All rights reserved.</span>
            <div className="footer-socials">
              <a href="#" className="social-icon" title="微信">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M8.5 4C4.36 4 1 6.91 1 10.5c0 2.08 1.13 3.93 2.89 5.12L3 18l2.88-1.44c.82.28 1.7.44 2.62.44.25 0 .5-.01.74-.03-.16-.49-.24-1-.24-1.53 0-3.31 3.13-6 7-6 .24 0 .47.01.7.04C16.02 6.36 12.68 4 8.5 4zm-2 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm5 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM16 11c-3.31 0-6 2.24-6 5s2.69 5 6 5c.72 0 1.41-.1 2.06-.28L20 22l-.75-1.75C20.95 19.1 22 17.66 22 16c0-2.76-2.69-5-6-5zm-2 3c.41 0 .75.34.75.75s-.34.75-.75.75-.75-.34-.75-.75.34-.75.75-.75zm4 0c.41 0 .75.34.75.75s-.34.75-.75.75-.75-.34-.75-.75.34-.75.75-.75z"/>
                </svg>
              </a>
              <a href="#" className="social-icon" title="小红书">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm3.5 13.5h-7v-1h7v1zm0-2.5h-7v-1h7v1zm0-2.5h-7v-1h7v1z"/>
                </svg>
              </a>
              <a href="#" className="social-icon" title="微博">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M10.5 9C6.36 9 3 11.46 3 14.5S6.36 20 10.5 20s7.5-2.46 7.5-5.5S14.64 9 10.5 9zm0 8c-3.31 0-6-1.57-6-3.5S7.19 10 10.5 10s6 1.57 6 3.5-2.69 3.5-6 3.5zM20 8c0 2.21-2.02 4-4.5 4 .28-.61.5-1.29.5-2 0-1.93-1.57-3.5-3.5-3.5C10.79 6.5 9.12 7.72 8.5 9.5 7.86 7.56 6.97 6 7 6c0 0 3.5-4.5 8.5-2.5 3.6 1.45 4.5 4.5 4.5 4.5z"/>
                </svg>
              </a>
            </div>
          </div>
        </div>
      </footer>
    </div>
  );
}

// Render
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// Announce upgrade availability
function announceUpgrade() {
  window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}
</script>

</body>
</html>

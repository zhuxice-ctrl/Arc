<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>云朵收集所 · The Cloud Collector's Club</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" />
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  :root{
    --cloud: #F7F4EE;
    --mist: #8FA3B5;
    --mist-soft: #b8c6d4;
    --mist-deep: #6f8395;
    --apricot: #F2A65A;
    --apricot-deep: #e08a3a;
    --slate: #33404C;
    --slate-soft: #4a5968;
    --gold: #D9B98A;
    --gold-deep: #b89665;
    --paper: #EFEADD;
    --ink: #2a3440;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family: 'Inter','Noto Serif SC',system-ui,sans-serif;
    background: var(--cloud);
    color: var(--slate);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    cursor: none;
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:0.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.01ms !important;
    }
    body{cursor:auto;}
    .cursor-dot,.cursor-ring,.cursor-mist{display:none !important;}
  }
  /* ============ Custom Cursor ============ */
  .cursor-dot{
    position:fixed;top:0;left:0;width:10px;height:10px;
    border-radius:50%;background:var(--apricot);
    pointer-events:none;z-index:9999;
    transform: translate(-50%,-50%);
    transition: width .25s cubic-bezier(.2,.9,.3,1.2), height .25s cubic-bezier(.2,.9,.3,1.2), background .3s;
    mix-blend-mode: normal;
    box-shadow: 0 0 12px rgba(242,166,90,.7), 0 0 24px rgba(242,166,90,.3);
  }
  .cursor-ring{
    position:fixed;top:0;left:0;width:36px;height:36px;
    border:2px solid var(--slate);
    border-radius:50%;pointer-events:none;z-index:9998;
    transform: translate(-50%,-50%);
    transition: width .35s cubic-bezier(.2,.9,.3,1.2), height .35s cubic-bezier(.2,.9,.3,1.2),
                border-color .3s, border-width .3s, background .3s;
    backdrop-filter: blur(2px);
  }
  .cursor-mist{
    position:fixed;top:0;left:0;width:80px;height:80px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(143,163,181,.25) 0%, rgba(143,163,181,0) 70%);
    pointer-events:none;z-index:9997;
    transform: translate(-50%,-50%);
    transition: width .6s cubic-bezier(.2,.9,.3,1.2), height .6s cubic-bezier(.2,.9,.3,1.2), opacity .5s;
    filter: blur(12px);
  }
  .cursor-hover .cursor-dot{width:6px;height:6px;background:var(--slate);box-shadow:0 0 8px rgba(51,64,76,.6);}
  .cursor-hover .cursor-ring{width:56px;height:56px;border-color:var(--apricot);border-width:2px;background:rgba(242,166,90,.08);}
  .cursor-hover .cursor-mist{width:120px;height:120px;opacity:.7;}
  .cursor-click .cursor-ring{
    width:80px !important;height:80px !important;
    border-color:var(--apricot);
    background: rgba(242,166,90,.15);
  }
  .cursor-ripple{
    position:fixed;width:10px;height:10px;border-radius:50%;
    border:2px solid var(--apricot);
    pointer-events:none;z-index:9996;
    transform: translate(-50%,-50%) scale(1);
    opacity:.8;
    animation: ripple-expand .8s cubic-bezier(.16,1,.3,1) forwards;
  }
  @keyframes ripple-expand{
    0%{width:10px;height:10px;opacity:.8;border-width:3px;}
    100%{width:120px;height:120px;opacity:0;border-width:1px;}
  }

  /* ============ NAV ============ */
  .nav{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    padding: 28px 56px;
    transition: background .4s, backdrop-filter .4s, padding .4s;
  }
  .nav.scrolled{
    background: rgba(247,244,238,.75);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 18px 56px;
    border-bottom: 1px solid rgba(143,163,181,.15);
  }
  .nav-logo{
    font-family:'Cormorant Garamond','Noto Serif SC',serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: .5px;
    color: var(--slate);
    display:flex;align-items:center;gap:12px;
  }
  .nav-logo-mark{
    width:36px;height:24px;
    position:relative;
  }
  .nav-links{
    display:flex;gap:44px;align-items:center;
    list-style:none;
  }
  .nav-links a{
    text-decoration:none;color:var(--slate);
    font-size:14px;font-weight:500;letter-spacing:.3px;
    position:relative;
    padding: 6px 0;
    transition: color .3s;
  }
  .nav-links a::after{
    content:'';position:absolute;bottom:0;left:0;right:0;
    height:1px;background:var(--apricot);
    transform: scaleX(0);transform-origin: center;
    transition: transform .4s cubic-bezier(.16,1,.3,1);
  }
  .nav-links a:hover{color:var(--apricot-deep);}
  .nav-links a:hover::after{transform: scaleX(1);}
  .nav-cta{
    padding: 10px 22px;
    background: var(--slate);
    color: var(--cloud);
    border: none;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: .4px;
    transition: background .3s, transform .3s;
    position:relative;
    overflow:hidden;
    cursor: none;
  }
  .nav-cta:hover{background:var(--apricot-deep);transform: translateY(-1px);}
  .nav-mobile-btn{display:none;}
  @media (max-width: 768px){
    .nav{padding:18px 20px;}
    .nav.scrolled{padding:14px 20px;}
    .nav-links{display:none;}
    .nav-cta{display:none;}
    .nav-mobile-btn{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border:none;background:transparent;cursor:none;}
    .nav-mobile-btn span{display:block;width:22px;height:1.5px;background:var(--slate);position:relative;}
    .nav-mobile-btn span::before,.nav-mobile-btn span::after{content:'';position:absolute;left:0;width:22px;height:1.5px;background:var(--slate);}
    .nav-mobile-btn span::before{top:-7px;}
    .nav-mobile-btn span::after{top:7px;}
  }

  /* ============ HERO ============ */
  .hero{
    position:relative;
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding: 120px 40px 80px;
  }
  .hero-sky{
    position:absolute;inset:0;
    background: linear-gradient(180deg, #f0ece0 0%, #f7f4ee 40%, #ede8da 100%);
  }
  .cloud-layer{
    position:absolute;
    top:0;left:0;right:0;
    pointer-events:none;
    will-change: transform;
  }
  .cloud{
    position:absolute;
    background: #fff;
    border-radius: 50%;
    filter: blur(2px);
    opacity: .85;
    box-shadow:
      60px 10px 0 -10px #fff,
      120px 5px 0 -15px #fff,
      -40px 15px 0 -5px #fff,
      -100px 10px 0 -10px #fff;
  }
  .cloud-1{width:120px;height:60px;top:12%;left:8%;opacity:.7;}
  .cloud-2{width:180px;height:80px;top:25%;left:60%;opacity:.9;}
  .cloud-3{width:90px;height:45px;top:45%;left:20%;opacity:.6;}
  .cloud-4{width:200px;height:90px;top:60%;left:75%;opacity:.8;}
  .cloud-5{width:140px;height:65px;top:75%;left:10%;opacity:.75;}
  .cloud-6{width:160px;height:75px;top:35%;left:40%;opacity:.5;}

  .hero-content{
    position:relative;
    text-align:center;
    z-index:2;
    max-width: 900px;
  }
  .hero-eyebrow{
    font-size: 12px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--mist-deep);
    margin-bottom: 28px;
    font-weight: 500;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp .9s .2s cubic-bezier(.16,1,.3,1) forwards;
  }
  .hero-title{
    font-family: 'Cormorant Garamond','Noto Serif SC',serif;
    font-size: clamp(48px, 7vw, 108px);
    font-weight: 500;
    line-height: 1.02;
    color: var(--slate);
    letter-spacing: -.5px;
    margin-bottom: 28px;
    opacity: 0;
    transform: translateY(30px);
    animation: fadeUp 1s .4s cubic-bezier(.16,1,.3,1) forwards;
  }
  .hero-title em{
    font-style: italic;
    color: var(--apricot-deep);
    font-weight: 400;
  }
  .hero-sub{
    font-size: 17px;
    line-height: 1.8;
    color: var(--slate-soft);
    max-width: 560px;
    margin: 0 auto 48px;
    font-weight: 300;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp .9s .7s cubic-bezier(.16,1,.3,1) forwards;
  }
  .hero-actions{
    display:flex;gap:18px;justify-content:center;flex-wrap:wrap;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp .9s .9s cubic-bezier(.16,1,.3,1) forwards;
  }
  .btn-primary{
    padding: 16px 36px;
    background: var(--apricot);
    color: var(--slate);
    border: none;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .5px;
    transition: background .3s, transform .3s, box-shadow .3s;
    cursor: none;
    position:relative;
    overflow:hidden;
  }
  .btn-primary:hover{
    background: var(--apricot-deep);
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(242,166,90,.35);
  }
  .btn-ghost{
    padding: 16px 36px;
    background: transparent;
    color: var(--slate);
    border: 1.5px solid var(--mist-soft);
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: .5px;
    transition: border-color .3s, color .3s, transform .3s;
    cursor: none;
  }
  .btn-ghost:hover{border-color:var(--slate);color:var(--slate);transform: translateY(-2px);}
  @keyframes fadeUp{
    to{opacity:1;transform:translateY(0);}
  }

  .hero-scroll-indicator{
    position:absolute;
    bottom: 40px;
    left:50%;
    transform: translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:12px;
    color: var(--mist-deep);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    z-index: 2;
    opacity: 0;
    animation: fadeIn .9s 1.4s forwards;
  }
  @keyframes fadeIn{to{opacity:.7;}}
  .scroll-line{
    width:1px;height:60px;
    background: linear-gradient(to bottom, var(--mist-soft), transparent);
    position:relative;
    overflow:hidden;
  }
  .scroll-line::after{
    content:'';
    position:absolute;
    top:-20px;left:0;
    width:1px;height:20px;
    background: var(--apricot);
    animation: scroll-drop 2s infinite cubic-bezier(.55,.06,.68,.19);
  }
  @keyframes scroll-drop{
    0%{top:-20px;}
    100%{top:60px;}
  }

  /* ============ Today's Cloud ============ */
  .today-section{
    padding: 140px 40px;
    max-width: 1280px;
    margin: 0 auto;
    position:relative;
  }
  .section-label{
    display:flex;align-items:center;gap:16px;
    margin-bottom: 20px;
  }
  .section-label-num{
    font-family:'Cormorant Garamond',serif;
    font-size: 13px;
    color: var(--apricot-deep);
    font-weight: 600;
    letter-spacing: 2px;
  }
  .section-label-line{
    flex:1;
    max-width: 60px;
    height:1px;
    background: var(--mist-soft);
  }
  .section-head{
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-bottom: 64px;
    flex-wrap:wrap;
    gap: 24px;
  }
  .section-title{
    font-family: 'Cormorant Garamond','Noto Serif SC',serif;
    font-size: clamp(36px, 4.5vw, 64px);
    font-weight: 500;
    color: var(--slate);
    line-height: 1.1;
    max-width: 600px;
  }
  .section-title em{
    font-style: italic;
    color: var(--apricot-deep);
    font-weight: 400;
  }
  .section-desc{
    max-width: 360px;
    font-size: 15px;
    line-height: 1.7;
    color: var(--slate-soft);
    font-weight: 300;
  }

  .today-feature{
    display:grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 64px;
    align-items:center;
    background: var(--paper);
    border-radius: 32px;
    padding: 60px;
    position:relative;
    overflow:hidden;
    transition: transform .5s cubic-bezier(.16,1,.3,1);
    transform-style: preserve-3d;
  }
  .today-feature::before{
    content:'';
    position:absolute;
    top:0;left:0;right:0;bottom:0;
    background: radial-gradient(ellipse at 30% 20%, rgba(242,166,90,.12), transparent 60%);
    pointer-events:none;
  }
  .today-cloud-visual{
    position:relative;
    aspect-ratio: 4/3;
    display:flex;align-items:center;justify-content:center;
    transform-style: preserve-3d;
  }
  .cloud-big{
    width: 70%;
    height: 55%;
    background: #fff;
    border-radius: 50%;
    position:relative;
    filter: blur(3px);
    box-shadow:
      80px 20px 0 -20px #fff,
      160px 10px 0 -30px #fff,
      -60px 30px 0 -10px #fff,
      -140px 15px 0 -20px #fff,
      0 60px 80px -20px rgba(143,163,181,.3);
    transform: translateZ(30px);
    animation: cloudFloat 8s ease-in-out infinite;
  }
  @keyframes cloudFloat{
    0%,100%{transform: translateZ(30px) translateY(0);}
    50%{transform: translateZ(30px) translateY(-15px);}
  }
  .cloud-smaller{
    position:absolute;
    width: 40%;
    height: 30%;
    background: #fff;
    border-radius: 50%;
    filter: blur(2px);
    opacity: .7;
    box-shadow:
      40px 10px 0 -10px #fff,
      80px 5px 0 -15px #fff;
  }
  .cloud-smaller.s1{
    top: 15%; right: 10%;
    animation: cloudFloat 6s ease-in-out .5s infinite;
  }
  .cloud-smaller.s2{
    bottom: 20%; left: 5%;
    animation: cloudFloat 10s ease-in-out 1s infinite;
  }
  .today-info{
    position:relative;
    z-index:2;
  }
  .today-tag{
    display:inline-block;
    padding: 6px 16px;
    background: rgba(242,166,90,.15);
    color: var(--apricot-deep);
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1px;
    margin-bottom: 24px;
  }
  .today-name{
    font-family: 'Cormorant Garamond','Noto Serif SC',serif;
    font-size: clamp(36px, 3.5vw, 52px);
    font-weight: 500;
    color: var(--slate);
    line-height: 1.1;
    margin-bottom: 20px;
  }
  .today-latin{
    font-family: 'Cormorant Garamond',serif;
    font-style: italic;
    font-size: 18px;
    color: var(--mist-deep);
    margin-bottom: 28px;
    letter-spacing: .5px;
  }
  .today-desc{
    font-size: 15px;
    line-height: 1.9;
    color: var(--slate-soft);
    margin-bottom: 36px;
    font-weight: 300;
  }
  .today-stats{
    display:grid;
    grid-template-columns: repeat(3,1fr);
    gap: 24px;
    padding-top: 28px;
    border-top: 1px solid rgba(143,163,181,.2);
  }
  .stat-item{
    display:flex;flex-direction:column;gap:6px;
  }
  .stat-val{
    font-family:'Cormorant Garamond',serif;
    font-size: 32px;
    font-weight: 500;
    color: var(--slate);
  }
  .stat-label{
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--mist-deep);
  }
  @media (max-width: 768px){
    .today-feature{grid-template-columns:1fr;padding:40px 28px;gap:40px;}
    .today-section{padding:80px 20px;}
    .section-head{flex-direction:column;align-items:flex-start;gap:16px;}
  }

  /* ============ Gallery ============ */
  .gallery-section{
    padding: 120px 40px;
    max-width: 1320px;
    margin: 0 auto;
    position:relative;
  }
  .filter-bar{
    display:flex;gap:10px;flex-wrap:wrap;
    margin-bottom: 48px;
  }
  .filter-chip{
    padding: 10px 22px;
    background: transparent;
    border: 1px solid var(--mist-soft);
    border-radius: 999px;
    color: var(--slate-soft);
    font-size: 13px;
    font-weight: 500;
    transition: all .3s cubic-bezier(.16,1,.3,1);
    cursor: none;
  }
  .filter-chip:hover{border-color:var(--slate);color:var(--slate);}
  .filter-chip.active{
    background: var(--slate);
    border-color: var(--slate);
    color: var(--cloud);
  }
  .gallery-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 28px;
  }
  .cloud-card{
    background: var(--cloud);
    border-radius: 24px;
    padding: 28px;
    position:relative;
    overflow:hidden;
    transition: transform .5s cubic-bezier(.16,1,.3,1), box-shadow .5s;
    cursor: none;
    transform-style: preserve-3d;
    border: 1px solid rgba(143,163,181,.1);
  }
  .cloud-card:hover{
    transform: translateY(-8px);
    box-shadow: 0 24px 60px rgba(51,64,76,.12);
  }
  .cloud-card-visual{
    aspect-ratio: 4/3;
    background: var(--paper);
    border-radius: 16px;
    margin-bottom: 20px;
    position:relative;
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .cloud-card-cloud{
    width: 60%;
    height: 40%;
    background: #fff;
    border-radius: 50%;
    position:relative;
    filter: blur(2px);
    box-shadow:
      40px 10px 0 -10px #fff,
      80px 5px 0 -15px #fff,
      -30px 15px 0 -5px #fff;
    transition: transform .6s cubic-bezier(.16,1,.3,1);
  }
  .cloud-card:hover .cloud-card-cloud{
    transform: scale(1.1) translateY(-5px);
  }
  .cloud-card-tag{
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--apricot-deep);
    font-weight: 500;
    margin-bottom: 8px;
  }
  .cloud-card-title{
    font-family: 'Cormorant Garamond','Noto Serif SC',serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--slate);
    margin-bottom: 10px;
  }
  .cloud-card-latin{
    font-family: 'Cormorant Garamond',serif;
    font-style: italic;
    font-size: 13px;
    color: var(--mist-deep);
    margin-bottom: 14px;
  }
  .cloud-card-desc{
    font-size: 13px;
    line-height: 1.6;
    color: var(--slate-soft);
    font-weight: 300;
    display:-webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow:hidden;
  }
  .cloud-card-rarity{
    position:absolute;
    top:16px;right:16px;
    padding: 4px 10px;
    background: rgba(217,185,138,.2);
    color: var(--gold-deep);
    border-radius: 999px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .card-shine{
    position:absolute;
    top:0;left:-100%;
    width:50%;height:100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent);
    transform: skewX(-20deg);
    transition: left .7s ease;
    pointer-events:none;
  }
  .cloud-card:hover .card-shine{left: 150%;}

  /* ============ Guide ============ */
  .guide-section{
    padding: 140px 40px;
    background: var(--paper);
    position:relative;
    overflow:hidden;
  }
  .guide-inner{
    max-width: 1200px;
    margin: 0 auto;
  }
  .guide-steps{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 32px;
    margin-top: 64px;
  }
  .step-item{
    padding: 40px 32px;
    background: var(--cloud);
    border-radius: 24px;
    position:relative;
    transition: transform .4s cubic-bezier(.16,1,.3,1);
    cursor: none;
    overflow:hidden;
  }
  .step-item:hover{
    transform: translateY(-6px);
  }
  .step-num{
    font-family:'Cormorant Garamond',serif;
    font-size: 64px;
    font-weight: 300;
    color: var(--mist-soft);
    line-height: 1;
    margin-bottom: 24px;
    opacity: .5;
    transition: color .4s, opacity .4s;
  }
  .step-item:hover .step-num{
    color: var(--apricot);
    opacity: 1;
  }
  .step-title{
    font-family: 'Cormorant Garamond','Noto Serif SC',serif;
    font-size: 24px;
    font-weight: 500;
    color: var(--slate);
    margin-bottom: 14px;
  }
  .step-desc{

// ========== Custom Cursor ==========
function CustomCursor(){
  const dotRef = useRef(null);
  const ringRef = useRef(null);
  const mistRef = useRef(null);
  const posRef = useRef({x: window.innerWidth/2, y: window.innerHeight/2});
  const targetRef = useRef({x: window.innerWidth/2, y: window.innerHeight/2});
  const rafRef = useRef(null);
  const reducedMotion = useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  useEffect(()=>{
    if (reducedMotion.current) return;
    const move = (e)=>{
      targetRef.current.x = e.clientX;
      targetRef.current.y = e.clientY;
      if (dotRef.current) {
        dotRef.current.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%,-50%)`;
      }
    };
    const tick = ()=>{
      const p = posRef.current;
      const t = targetRef.current;
      // spring / damping physics
      const dx = t.x - p.x;
      const dy = t.y - p.y;
      p.x += dx * 0.15;
      p.y += dy * 0.15;
      if (ringRef.current) {
        ringRef.current.style.transform = `translate(${p.x}px, ${p.y}px) translate(-50%,-50%)`;
      }
      // mist with more lag
      const mx = t.x - (t.x - p.x) * 2.5;
      const my = t.y - (t.y - p.y) * 2.5;
      if (mistRef.current) {
        mistRef.current.style.transform = `translate(${p.x + dx*0.3}px, ${p.y + dy*0.3}px) translate(-50%,-50%)`;
      }
      rafRef.current = requestAnimationFrame(tick);
    };
    const onOver = (e)=>{
      const el = e.target.closest('a, button, .cloud-card, .step-item, .story-card, input, .filter-chip');
      if (el) document.body.classList.add('cursor-hover');
      else document.body.classList.remove('cursor-hover');
    };
    const onClick = (e)=>{
      document.body.classList.add('cursor-click');
      // create ripple
      const ripple = document.createElement('div');
      ripple.className = 'cursor-ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      document.body.appendChild(ripple);
      setTimeout(()=>{ document.body.classList.remove('cursor-click'); }, 250);
      setTimeout(()=>{ ripple.remove(); }, 800);
    };
    const onVisible = ()=>{
      if (document.hidden) {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      } else {
        rafRef.current = requestAnimationFrame(tick);
      }
    };
    window.addEventListener('mousemove', move, {passive:true});
    window.addEventListener('mouseover', onOver, {passive:true});
    window.addEventListener('click', onClick);
    document.addEventListener('visibilitychange', onVisible);
    rafRef.current = requestAnimationFrame(tick);
    // initial center
    if (dotRef.current) {
      dotRef.current.style.transform = `translate(${posRef.current.x}px, ${posRef.current.y}px) translate(-50%,-50%)`;
    }
    return ()=>{
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseover', onOver);
      window.removeEventListener('click', onClick);
      document.removeEventListener('visibilitychange', onVisible);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  },[]);

  if (reducedMotion.current) return null;
  return (
    <>
      <div ref={mistRef} className="cursor-mist" style={{transform:`translate(${window.innerWidth/2}px, ${window.innerHeight/2}px) translate(-50%,-50%)`}}></div>
      <div ref={ringRef} className="cursor-ring" style={{transform:`translate(${window.innerWidth/2}px, ${window.innerHeight/2}px) translate(-50%,-50%)`}}></div>
      <div ref={dotRef} className="cursor-dot" style={{transform:`translate(${window.innerWidth/2}px, ${window.innerHeight/2}px) translate(-50%,-50%)`}}></div>
    </>
  );
}

// ========== Particle Cloud System ==========
function ParticleCloud(){
  const canvasRef = useRef(null);
  const rafRef = useRef(null);
  const particlesRef = useRef([]);
  const mouseRef = useRef({x: -1000, y: -1000});
  const reducedMotion = useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  useEffect(()=>{
    if (reducedMotion.current) return;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    let w, h;
    const resize = ()=>{
      w = canvas.width = canvas.offsetWidth * window.devicePixelRatio;
      h = canvas.height = canvas.offsetHeight * window.devicePixelRatio;
    };
    resize();
    window.addEventListener('resize', resize);

    // Create particles
    const count = 60;
    particlesRef.current = [];
    for (let i = 0; i < count; i++){
      particlesRef.current.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: (Math.random() * 30 + 20) * window.devicePixelRatio,
        vx: (Math.random() - 0.5) * 0.3 * window.devicePixelRatio,
        vy: (Math.random() - 0.5) * 0.15 * window.devicePixelRatio,
        alpha: Math.random() * 0.08 + 0.03,
        phase: Math.random() * Math.PI * 2,
      });
    }

    const onMove = (e)=>{
      const rect = canvas.getBoundingClientRect();
      mouseRef.current.x = (e.clientX - rect.left) * window.devicePixelRatio;
      mouseRef.current.y = (e.clientY - rect.top) * window.devicePixelRatio;
    };
    window.addEventListener('mousemove', onMove, {passive:true});

    const tick = ()=>{
      ctx.clearRect(0,0,w,h);
      const mx = mouseRef.current.x;
      const my = mouseRef.current.y;
      particlesRef.current.forEach(p=>{
        // Drift
        p.x += p.vx;
        p.y += p.vy + Math.sin(p.phase) * 0.1;
        p.phase += 0.01;
        // Wrap
        if (p.x < -p.r) p.x = w + p.r;
        if (p.x > w + p.r) p.x = -p.r;
        if (p.y < -p.r) p.y = h + p.r;
        if (p.y > h + p.r) p.y = -p.r;
        // Mouse attraction (inverse square magnetic)
        const dx = mx - p.x;
        const dy = my - p.y;
        const dist2 = dx*dx + dy*dy;
        const maxDist = 200 * window.devicePixelRatio;
        if (dist2 < maxDist * maxDist && dist2 > 1){
          const dist = Math.sqrt(dist2);
          const force = (1 - dist / maxDist) * 0.4;
          p.x += (dx / dist) * force;
          p.y += (dy / dist) * force;
        }
        // Draw cloud puff
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
        grad.addColorStop(0, `rgba(255,255,255,${p.alpha})`);
        grad.addColorStop(0.5, `rgba(255,255,255,${p.alpha*0.5})`);
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fill();
      });
      rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);

    const onVisible = ()=>{
      if (document.hidden) {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      } else {
        rafRef.current = requestAnimationFrame(tick);
      }
    };
    document.addEventListener('visibilitychange', onVisible);

    return ()=>{
      window.removeEventListener('resize', resize);
      window.removeEventListener('mousemove', onMove);
      document.removeEventListener('visibilitychange', onVisible);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  },[]);

  if (reducedMotion.current) return null;
  return <canvas ref={canvasRef} className="particle-canvas" style={{position:'absolute', inset:0, pointerEvents:'none', zIndex:1}} />;
}

// ========== Typewriter ==========
function Typewriter({text, speed=80, className=''}){
  const [displayed, setDisplayed] = useState('');
  const [done, setDone] = useState(false);
  const timeoutRef = useRef(null);
  const ref = useRef(null);
  const startedRef = useRef(false);

  useEffect(()=>{
    const observer = new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if (entry.isIntersecting && !startedRef.current){
          startedRef.current = true;
          startType();
        }
      });
    }, {threshold: 0.3});
    if (ref.current) observer.observe(ref.current);
    return ()=>{
      observer.disconnect();
      if (timeoutRef.current) clearTimeout(timeoutRef.current);
    };
  },[text]);

  const startType = ()=>{
    let i = 0;
    const type = ()=>{
      if (i < text.length){
        setDisplayed(text.slice(0, i+1));
        i++;
        timeoutRef.current = setTimeout(type, speed + Math.random() * 40);
      } else {
        setDone(true);
      }
    };
    type();
  };

  return (
    <span ref={ref} className={className}>
      {displayed}
      {!done && <span className="typewriter-cursor"></span>}
    </span>
  );
}

// ========== Counter ==========
function Counter({end, duration=2000, suffix='', className=''}){
  const [val, setVal] = useState(0);
  const ref = useRef(null);
  const startedRef = useRef(false);
  const rafRef = useRef(null);

  useEffect(()=>{
    const observer = new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if (entry.isIntersecting && !startedRef.current){
          startedRef.current = true;
          animate();
        }
      });
    }, {threshold: 0.5});
    if (ref.current) observer.observe(ref.current);
    return ()=>{
      observer.disconnect();
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  },[end]);

  const animate = ()=>{
    const start = performance.now();
    const from = 0;
    const to = end;
    const easeOut = (t) => 1 - Math.pow(1 - t, 3);
    const step = (now)=>{
      const t = Math.min(1, (now - start) / duration);
      const eased = easeOut(t);
      setVal(Math.floor(from + (to - from) * eased));
      if (t < 1) rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
  };

  return (
    <span ref={ref} className={`counter-num ${className}`}>
      {val}{suffix}
    </span>
  );
}

// ========== Reveal on scroll ==========
function useReveal(){
  const ref = useRef(null);
  useEffect(()=>{
    const el = ref.current;
    if (!el) return;
    const observer = new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, {threshold: 0.12});
    observer.observe(el);
    return ()=> observer.disconnect();
  },[]);
  return ref;
}

// ========== Cloud card with 3D tilt ==========
function CloudCard({cloud, index}){
  const cardRef = useRef(null);

  const handleMove = (e)=>{
    const card = cardRef.current;
    if (!card) return;
    const rect = card.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    card.style.transform = `perspective(800px) rotateY(${x * 8}deg) rotateX(${-y * 8}deg) translateY(-8px)`;
  };
  const handleLeave = ()=>{
    if (cardRef.current) {
      cardRef.current.style.transform = '';
    }
  };

  return (
    <div
      ref={cardRef}
      className="cloud-card"
      onMouseMove={handleMove}
      onMouseLeave={handleLeave}
      style={{transitionDelay: `${index * 0.05}s`}}
    >
      <div className="card-shine"></div>
      {cloud.rarity !== '常见' && (
        <span className="cloud-card-rarity">{cloud.rarity}</span>
      )}
      <div className="cloud-card-visual" style={{background: `linear-gradient(180deg, ${cloud.color}15, ${cloud.color}25)`}}>
        <div className="cloud-card-cloud" style={{filter: `blur(2px) drop-shadow(0 4px 12px ${cloud.color}40)`}}></div>
      </div>
      <div className="cloud-card-tag">{cloud.tag}</div>
      <h3 className="cloud-card-title">{cloud.name}</h3>
      <div className="cloud-card-latin">{cloud.latin}</div>
      <p className="cloud-card-desc">{cloud.desc}</p>
    </div>
  );
}

// ========== Hero parallax clouds ==========
function HeroClouds(){
  const layersRef = useRef([]);
  const reducedMotion = useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const rafRef = useRef(null);
  const timeRef = useRef(0);

  useEffect(()=>{
    if (reducedMotion.current) return;
    const onScroll = ()=>{
      const y = window.scrollY;
      layersRef.current.forEach((layer, i)=>{
        if (layer) {
          const speed = (i + 1) * 0.15;
          layer.style.transform = `translateY(${y * speed}px)`;
        }
      });
    };
    window.addEventListener('scroll', onScroll, {passive:true});

    // Drifting animation
    const tick = ()=>{
      timeRef.current += 0.005;
      const t = timeRef.current;
      const clouds = document.querySelectorAll('.hero .cloud');
      clouds.forEach((c, i)=>{
        const speed = 0.3 + i * 0.1;
        const offset = Math.sin(t * speed + i) * 20;
        const offsetY = Math.cos(t * speed * 0.7 + i) * 10;
        c.style.transform = `translate(${offset}px, ${offsetY}px)`;
      });
      rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);

    const onVisible = ()=>{
      if (document.hidden) {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      } else {
        rafRef.current = requestAnimationFrame(tick);
      }
    };
    document.addEventListener('visibilitychange', onVisible);

    return ()=>{
      window.removeEventListener('scroll', onScroll);
      document.removeEventListener('visibilitychange', onVisible);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  },[]);

  if (reducedMotion.current) return null;
  return (
    <>
      <div ref={el=>layersRef.current[0]=el} className="cloud-layer" style={{height:'100%'}}>
        <div className="cloud cloud-1"></div>
        <div className="cloud cloud-4"></div>
      </div>
      <div ref={el=>layersRef.current[1]=el} className="cloud-layer" style={{height:'100%'}}>
        <div className="cloud cloud-2"></div>
        <div className="cloud cloud-5"></div>
      </div>
      <div ref={el=>layersRef.current[2]=el} className="cloud-layer" style={{height:'100%'}}>
        <div className="cloud cloud-3"></div>
        <div className="cloud cloud-6"></div>
      </div>
    </>
  );
}

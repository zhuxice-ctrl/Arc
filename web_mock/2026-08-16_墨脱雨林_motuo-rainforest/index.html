<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>墨脱雨林 · 垂直生态探索 | Medog Rainforest</title>
<meta name="creative-medium" content="interactive-prototype" />
<link rel="preconnect" href="https://miaoda.feishucdn.cn" />
<link rel="stylesheet" href="https://miaoda.feishucdn.cn/fonts/css2?family=Noto+Serif+SC:wght@300;400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;500&display=swap" />
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  :root {
    --pine-deep: #0f1f17;
    --pine: #1a2f23;
    --pine-mid: #2a4736;
    --moss: #3d5c47;
    --moss-light: #5a7a5c;
    --mist: #e8ebe5;
    --mist-dim: #c8cfc4;
    --amber: #d4913a;
    --amber-light: #e8b060;
    --amber-deep: #a66820;
    --text-primary: #f0f2ed;
    --text-secondary: #a8b3a4;
    --text-dim: #6b7867;
    --card-bg: rgba(26, 47, 35, 0.6);
    --card-border: rgba(90, 122, 92, 0.2);
    --glow-amber: rgba(212, 145, 58, 0.4);
    --glow-moss: rgba(90, 122, 92, 0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--pine-deep);
    color: var(--text-primary);
    overflow-x: hidden;
    cursor: none;
    line-height: 1.6;
  }
  body.no-custom-cursor { cursor: auto; }
  body.no-custom-cursor .cursor,
  body.no-custom-cursor .cursor-dot,
  body.no-custom-cursor .cursor-glow,
  body.no-custom-cursor .ripple { display: none !important; }

  img { display: block; max-width: 100%; }
  button { font-family: inherit; cursor: none; border: none; background: none; color: inherit; }
  body.no-custom-cursor button { cursor: pointer; }
  a { color: inherit; text-decoration: none; cursor: none; }
  body.no-custom-cursor a { cursor: pointer; }

  /* ---------- Custom Cursor ---------- */
  .cursor {
    position: fixed;
    top: 0; left: 0;
    width: 36px; height: 36px;
    border: 2px solid var(--mist);
    border-radius: 50%;
    pointer-events: none;
    z-index: 99999;
    transform: translate(-50%, -50%);
    transition: width 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                height 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.25s ease,
                background 0.25s ease;
    mix-blend-mode: difference;
  }
  .cursor-dot {
    position: fixed;
    top: 0; left: 0;
    width: 6px; height: 6px;
    background: var(--amber);
    border-radius: 50%;
    pointer-events: none;
    z-index: 100000;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px var(--amber), 0 0 20px var(--glow-amber);
    transition: width 0.2s ease, height 0.2s ease, background 0.2s ease;
  }
  .cursor-glow {
    position: fixed;
    top: 0; left: 0;
    width: 120px; height: 120px;
    background: radial-gradient(circle, var(--glow-moss) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 99998;
    transform: translate(-50%, -50%);
    opacity: 0.5;
    transition: opacity 0.3s ease;
  }
  .cursor.hover { width: 56px; height: 56px; border-color: var(--amber); }
  .cursor.hover + .cursor-dot { width: 3px; height: 3px; }
  .cursor.click {
    width: 28px; height: 28px;
    border-color: var(--amber-light);
    transition: width 0.08s ease, height 0.08s ease;
  }
  .ripple {
    position: fixed;
    width: 20px; height: 20px;
    border: 2px solid var(--amber);
    border-radius: 50%;
    pointer-events: none;
    z-index: 99997;
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    animation: rippleExpand 0.6s ease-out forwards;
  }
  @keyframes rippleExpand {
    0% { width: 20px; height: 20px; opacity: 1; border-width: 2px; }
    100% { width: 120px; height: 120px; opacity: 0; border-width: 1px; }
  }

  /* ---------- Mist particles ---------- */
  .mist-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  /* ---------- Navigation ---------- */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 24px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 100;
    transition: background 0.4s ease, backdrop-filter 0.4s ease, padding 0.4s ease;
  }
  .nav.scrolled {
    background: rgba(15, 31, 23, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 16px 48px;
    border-bottom: 1px solid var(--card-border);
  }
  .nav-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'Noto Serif SC', serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 2px;
  }
  .nav-logo-mark {
    width: 36px; height: 36px;
    border: 1.5px solid var(--amber);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .nav-logo-mark::before {
    content: '';
    position: absolute;
    width: 8px; height: 8px;
    background: var(--amber);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--amber);
  }
  .nav-links {
    display: flex;
    gap: 40px;
    list-style: none;
  }
  .nav-links a {
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--text-secondary);
    transition: color 0.3s ease;
    position: relative;
    padding: 4px 0;
  }
  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: 0; left: 50%;
    width: 0; height: 1px;
    background: var(--amber);
    transition: width 0.3s ease, left 0.3s ease;
  }
  .nav-links a:hover { color: var(--text-primary); }
  .nav-links a:hover::after { width: 100%; left: 0; }
  .nav-cta {
    padding: 10px 24px;
    border: 1px solid var(--moss-light);
    border-radius: 100px;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--mist);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .nav-cta::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--amber);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .nav-cta:hover { border-color: var(--amber); color: var(--pine-deep); }
  .nav-cta:hover::before { transform: scaleX(1); }
  .nav-cta span { position: relative; z-index: 1; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    height: 100vh;
    min-height: 700px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hero-bg {
    position: absolute;
    inset: -5%;
    background-image: var(--hero-bg, none);
    background-size: cover;
    background-position: center;
    will-change: transform;
    z-index: 1;
  }
  .hero-bg-overlay {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(15,31,23,0.3) 0%, rgba(15,31,23,0.5) 40%, rgba(15,31,23,0.85) 100%),
      linear-gradient(90deg, rgba(15,31,23,0.4) 0%, transparent 50%);
    z-index: 2;
  }
  .hero-content {
    position: relative;
    z-index: 3;
    text-align: center;
    max-width: 900px;
    padding: 0 24px;
  }
  .hero-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 8px 20px;
    border: 1px solid var(--card-border);
    border-radius: 100px;
    background: rgba(26, 47, 35, 0.5);
    backdrop-filter: blur(10px);
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--mist-dim);
    text-transform: uppercase;
    margin-bottom: 32px;
  }
  .hero-eyebrow-dot {
    width: 6px; height: 6px;
    background: var(--amber);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--amber);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.5); opacity: 0.6; }
  }
  .hero-title {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(42px, 7vw, 96px);
    font-weight: 300;
    line-height: 1.1;
    letter-spacing: 8px;
    margin-bottom: 24px;
    text-shadow: 0 4px 40px rgba(0,0,0,0.5);
  }
  .hero-title strong {
    font-weight: 900;
    background: linear-gradient(135deg, var(--mist) 0%, var(--amber-light) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero-subtitle {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(16px, 2vw, 24px);
    font-weight: 300;
    letter-spacing: 6px;
    color: var(--mist-dim);
    margin-bottom: 48px;
  }
  .hero-desc {
    font-size: 15px;
    color: var(--text-secondary);
    max-width: 540px;
    margin: 0 auto 56px;
    line-height: 1.9;
    letter-spacing: 0.5px;
  }
  .hero-scroll {
    position: absolute;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    color: var(--mist-dim);
    font-size: 11px;
    letter-spacing: 3px;
  }
  .hero-scroll-line {
    width: 1px; height: 60px;
    background: linear-gradient(180deg, var(--moss-light) 0%, transparent 100%);
    position: relative;
    overflow: hidden;
  }
  .hero-scroll-line::after {
    content: '';
    position: absolute;
    top: -20px; left: 0;
    width: 100%; height: 20px;
    background: var(--amber);
    animation: scrollDown 2s ease-in-out infinite;
  }
  @keyframes scrollDown {
    0% { top: -20px; }
    100% { top: 60px; }
  }
  .hero-elevation {
    position: absolute;
    right: 48px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .hero-elevation-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 48px;
    font-weight: 300;
    color: var(--mist);
    letter-spacing: -2px;
  }
  .hero-elevation-unit {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--amber);
    text-transform: uppercase;
  }
  .hero-elevation-bar {
    width: 2px;
    height: 120px;
    background: var(--pine-mid);
    position: relative;
    margin-top: 8px;
    border-radius: 2px;
  }
  .hero-elevation-bar-fill {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    height: 20%;
    background: linear-gradient(180deg, var(--amber) 0%, var(--amber-deep) 100%);
    border-radius: 2px;
    box-shadow: 0 0 12px var(--glow-amber);
    transition: height 0.3s ease;
  }
  .hero-elevation-label {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 2px;
    writing-mode: vertical-rl;
    margin-top: 12px;
  }

  /* ---------- Section base ---------- */
  section { position: relative; }
  .section-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 120px 48px;
  }
  .section-label {
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--amber);
    text-transform: uppercase;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-label::before {
    content: '';
    width: 24px; height: 1px;
    background: var(--amber);
  }
  .section-title {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(32px, 4vw, 52px);
    font-weight: 700;
    line-height: 1.25;
    margin-bottom: 20px;
    letter-spacing: 2px;
  }
  .section-subtitle {
    font-size: 16px;
    color: var(--text-secondary);
    max-width: 600px;
    line-height: 1.9;
  }

  /* ---------- Elevation Journey section ---------- */
  .elevation-section {
    background: var(--pine-deep);
    position: relative;
    overflow: hidden;
  }
  .elevation-section::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, var(--moss) 50%, transparent 100%);
  }
  .elevation-zones {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
    margin-top: 72px;
  }
  .zone-card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.3s ease,
                box-shadow 0.4s ease;
    will-change: transform;
  }
  .zone-card:hover {
    border-color: var(--moss-light);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 30px var(--glow-moss);
    transform: translateY(-8px);
  }
  .zone-card-img {
    position: relative;
    height: 200px;
    overflow: hidden;
  }
  .zone-card-img img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .zone-card:hover .zone-card-img img { transform: scale(1.08); }
  .zone-card-img::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 40%, var(--pine-deep) 100%);
  }
  .zone-altitude {
    position: absolute;
    top: 16px; left: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--amber-light);
    background: rgba(15, 31, 23, 0.6);
    backdrop-filter: blur(8px);
    padding: 4px 10px;
    border-radius: 4px;
    z-index: 2;
  }
  .zone-card-body {
    padding: 24px;
  }
  .zone-card-name {
    font-family: 'Noto Serif SC', serif;
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }
  .zone-card-en {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .zone-card-desc {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.8;
    margin-bottom: 20px;
  }
  .zone-card-stats {
    display: flex;
    gap: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--card-border);
  }
  .zone-stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .zone-stat-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 500;
    color: var(--mist);
  }
  .zone-stat-label {
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  /* ---------- Waterfall section ---------- */
  .waterfall-section {
    position: relative;
    height: 90vh;
    min-height: 600px;
    overflow: hidden;
    display: flex;
    align-items: center;
  }
  .waterfall-bg {
    position: absolute;
    inset: -10%;
    background-image: var(--waterfall-bg, none);
    background-size: cover;
    background-position: center;
    z-index: 1;
    will-change: transform;
  }
  .waterfall-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(15,31,23,0.9) 0%, rgba(15,31,23,0.5) 50%, transparent 100%);
    z-index: 2;
  }
  .waterfall-content {
    position: relative;
    z-index: 3;
    max-width: 560px;
    padding-left: 48px;
  }
  .waterfall-quote {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(24px, 3vw, 36px);
    font-weight: 300;
    line-height: 1.6;
    letter-spacing: 3px;
    margin-bottom: 32px;
    position: relative;
  }
  .waterfall-quote::before {
    content: '"';
    position: absolute;
    top: -30px; left: -20px;
    font-size: 120px;
    font-family: 'Noto Serif SC', serif;
    color: var(--amber);
    opacity: 0.3;
    line-height: 1;
  }
  .waterfall-author {
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--amber);
  }
  .waterfall-meta {
    margin-top: 48px;
    display: flex;
    gap: 48px;
  }
  .waterfall-meta-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .waterfall-meta-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 300;
    color: var(--mist);
  }
  .waterfall-meta-label {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  /* ---------- Biodiversity section ---------- */
  .biodiversity-section {
    background: linear-gradient(180deg, var(--pine-deep) 0%, #12251b 100%);
    position: relative;
    overflow: hidden;
  }
  .biodiversity-section::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, var(--moss) 50%, transparent 100%);
  }
  .biodiversity-grid {
    display: grid;
    grid-template-columns: 1.2fr 0.8fr 1fr;
    grid-template-rows: auto auto;
    gap: 24px;
    margin-top: 72px;
  }
  .bio-card {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.5s ease;
    will-change: transform;
  }
  .bio-card:hover {
    box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 40px var(--glow-moss);
  }
  .bio-card-large { grid-row: span 2; }
  .bio-card-img {
    position: relative;
    height: 100%;
    min-height: 300px;
    overflow: hidden;
  }
  .bio-card-large .bio-card-img { min-height: 100%; }
  .bio-card-img img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .bio-card:hover .bio-card-img img { transform: scale(1.1); }
  .bio-card-img::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 30%, rgba(15, 31, 23, 0.95) 100%);
  }
  .bio-card-info {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 32px;
    z-index: 2;
  }
  .bio-card-tag {
    display: inline-block;
    padding: 4px 12px;
    background: rgba(212, 145, 58, 0.15);
    border: 1px solid rgba(212, 145, 58, 0.3);
    border-radius: 100px;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--amber);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .bio-card-name {
    font-family: 'Noto Serif SC', serif;
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 4px;
    letter-spacing: 2px;
  }
  .bio-card-latin {
    font-size: 12px;
    font-style: italic;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .bio-card-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--mist-dim);
  }
  .status-dot {
    width: 6px; height: 6px;
    background: #d9644f;
    border-radius: 50%;
    box-shadow: 0 0 8px #d9644f;
    animation: pulse 2s ease-in-out infinite;
  }

  /* ---------- Stats section ---------- */
  .stats-section {
    background: var(--pine);
    position: relative;
    padding: 80px 0;
    overflow: hidden;
  }
  .stats-section::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(212, 145, 58, 0.05) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 50%, rgba(90, 122, 92, 0.08) 0%, transparent 50%);
  }
  .stats-grid {
    position: relative;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 40px;
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 48px;
  }
  .stat-item { text-align: center; }
  .stat-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(40px, 5vw, 64px);
    font-weight: 300;
    color: var(--mist);
    letter-spacing: -2px;
    line-height: 1;
    margin-bottom: 12px;
  }
  .stat-num .unit {
    font-size: 0.4em;
    color: var(--amber);
    margin-left: 4px;
    font-weight: 400;
  }
  .stat-label {

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ========== Image URLs ==========

  tropical: "/spark/app/app_17c8a2vmgbq/runtime/api/v1/storage/object/bucket_aadkqhml4gmjw_static/static%2Faadkqhedw7ciu_ve_miaoda",
  subtropical: "/spark/app/app_17c8a2vmgbq/runtime/api/v1/storage/object/bucket_aadkqhml4gmjw_static/static%2Faadkqhc42nmcs_ve_miaoda",
  temperate: "/spark/app/app_17c8a2vmgbq/runtime/api/v1/storage/object/bucket_aadkqhml4gmjw_static/static%2Faadkqg5rkwqas_ve_miaoda",
  alpine: "/spark/app/app_17c8a2vmgbq/runtime/api/v1/storage/object/bucket_aadkqhml4gmjw_static/static%2Faadkqhhdfcafs_ve_miaoda",

  redPanda: "/spark/app/app_17c8a2vmgbq/runtime/api/v1/storage/object/bucket_aadkqhml4gmjw_static/static%2Faadkqhde2vomw_ve_miaoda",
  tropicalBird: "/spark/app/app_17c8a2vmgbq/runtime/api/v1/storage/object/bucket_aadkqhml4gmjw_static/static%2Faadkqhc552mjs_ve_miaoda",
};

// ========== Utility: RAF loop manager ==========
function createRafManager() {
  let rafId = null;
  const callbacks = new Set();
  let lastTime = 0;
  let running = false;

  function tick(t) {
    if (!running) return;
    const dt = Math.min((t - lastTime) / 1000, 0.05);
    lastTime = t;
    callbacks.forEach(cb => { try { cb(dt, t); } catch(e) {} });
    rafId = requestAnimationFrame(tick);
  }

  function add(cb) {
    callbacks.add(cb);
    if (!running && callbacks.size > 0) {
      running = true;
      lastTime = performance.now();
      rafId = requestAnimationFrame(tick);
    }
    return () => remove(cb);
  }

  function remove(cb) {
    callbacks.delete(cb);
    if (callbacks.size === 0) {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
    }
  }

  function pause() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
  }

  function resume() {
    if (callbacks.size > 0 && !running) {
      running = true;
      lastTime = performance.now();
      rafId = requestAnimationFrame(tick);
    }
  }

  function dispose() {
    running = false;
    callbacks.clear();
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
  }

  return { add, remove, pause, resume, dispose };
}

// ========== Custom Cursor ==========
function CustomCursor() {
  const cursorRef = useRef(null);
  const dotRef = useRef(null);
  const glowRef = useRef(null);
  const posRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const targetRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });

  useEffect(() => {
    // Check reduced motion
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) {
      document.body.classList.add('no-custom-cursor');
      return;
    }
    if (window.innerWidth < 768) {
      document.body.classList.add('no-custom-cursor');
      return;
    }

    const rafMgr = createRafManager();

    function onMove(e) {
      targetRef.current.x = e.clientX;
      targetRef.current.y = e.clientY;
    }

    // Spring physics for cursor follow
    let velX = 0, velY = 0, velGlowX = 0, velGlowY = 0;
    const cursorX = { current: window.innerWidth / 2 };
    const cursorY = { current: window.innerHeight / 2 };
    const glowX = { current: window.innerWidth / 2 };
    const glowY = { current: window.innerHeight / 2 };

    function update(dt) {
      // Outer ring: strong spring
      const k = 0.18, damping = 0.75;
      const ax = (targetRef.current.x - cursorX.current) * k;
      const ay = (targetRef.current.y - cursorY.current) * k;
      velX = (velX + ax) * damping;
      velY = (velY + ay) * damping;
      cursorX.current += velX;
      cursorY.current += velY;

      // Glow: slower, more drift
      const kg = 0.06, dg = 0.82;
      const gx = (targetRef.current.x - glowX.current) * kg;
      const gy = (targetRef.current.y - glowY.current) * kg;
      velGlowX = (velGlowX + gx) * dg;
      velGlowY = (velGlowY + gy) * dg;
      glowX.current += velGlowX;
      glowY.current += velGlowY;

      if (cursorRef.current) {
        cursorRef.current.style.transform = `translate(${cursorX.current}px, ${cursorY.current}px) translate(-50%, -50%)`;
      }
      if (dotRef.current) {
        dotRef.current.style.transform = `translate(${targetRef.current.x}px, ${targetRef.current.y}px) translate(-50%, -50%)`;
      }
      if (glowRef.current) {
        glowRef.current.style.transform = `translate(${glowX.current}px, ${glowY.current}px) translate(-50%, -50%)`;
      }
    }

    function onEnter(e) {
      if (e.target.closest('a, button, .zone-card, .bio-card, .sound-track, input')) {
        cursorRef.current?.classList.add('hover');
      }
    }
    function onLeave(e) {
      if (e.target.closest('a, button, .zone-card, .bio-card, .sound-track, input')) {
        cursorRef.current?.classList.remove('hover');
      }
    }
    function onDown() {
      cursorRef.current?.classList.add('click');
      // Create ripple
      const ripple = document.createElement('div');
      ripple.className = 'ripple';
      ripple.style.left = targetRef.current.x + 'px';
      ripple.style.top = targetRef.current.y + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    }
    function onUp() { cursorRef.current?.classList.remove('click'); }

    function onVisibility() {
      if (document.hidden) rafMgr.pause();
      else rafMgr.resume();
    }

    window.addEventListener('mousemove', onMove, { passive: true });
    document.addEventListener('mouseover', onEnter);
    document.addEventListener('mouseout', onLeave);
    document.addEventListener('mousedown', onDown);
    document.addEventListener('mouseup', onUp);
    document.addEventListener('visibilitychange', onVisibility);

    const unsub = rafMgr.add(update);

    return () => {
      unsub();
      rafMgr.dispose();
      window.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseover', onEnter);
      document.removeEventListener('mouseout', onLeave);
      document.removeEventListener('mousedown', onDown);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, []);

  return (
    <>
      <div ref={cursorRef} className="cursor" />
      <div ref={dotRef} className="cursor-dot" />
      <div ref={glowRef} className="cursor-glow" />
    </>
  );
}

// ========== Mist Particles ==========
function MistCanvas() {
  const canvasRef = useRef(null);

  useEffect(() => {
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) return;

    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];
    const rafMgr = createRafManager();

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Create mist particles with drift physics
    const COUNT = 40;
    for (let i = 0; i < COUNT; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.3) * 8,
        vy: (Math.random() - 0.5) * 2,
        size: 80 + Math.random() * 200,
        opacity: 0.02 + Math.random() * 0.06,
        phase: Math.random() * Math.PI * 2,
        speed: 0.2 + Math.random() * 0.4,
      });
    }

    function update(dt) {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => {
        // Drift with sine wave for organic movement
        p.phase += p.speed * dt;
        p.x += (p.vx + Math.sin(p.phase) * 4) * dt;
        p.y += p.vy * dt;

        // Wrap around
        if (p.x > width + p.size) p.x = -p.size;
        if (p.x < -p.size) p.x = width + p.size;
        if (p.y > height + p.size) p.y = -p.size;
        if (p.y < -p.size) p.y = height + p.size;

        // Draw soft mist blob
        const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
        gradient.addColorStop(0, `rgba(232, 235, 229, ${p.opacity})`);
        gradient.addColorStop(1, 'rgba(232, 235, 229, 0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function onVisibility() {
      if (document.hidden) rafMgr.pause();
      else rafMgr.resume();
    }
    document.addEventListener('visibilitychange', onVisibility);

    const unsub = rafMgr.add(update);

    return () => {
      unsub();
      rafMgr.dispose();
      window.removeEventListener('resize', resize);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, []);

  return <canvas ref={canvasRef} className="mist-canvas" />;
}

function Hero() {
  const bgRef = useRef(null);

    let rafId = null;
    let target = 700;

    function onScroll() {
      const scrollY = window.scrollY;
      const maxScroll = document.body.scrollHeight - window.innerHeight;
      const progress = Math.min(scrollY / maxScroll, 1);
      target = Math.round(700 + progress * 4300);

      // Parallax hero bg
      if (bgRef.current) {
        const heroProgress = Math.min(scrollY / window.innerHeight, 1);
        bgRef.current.style.transform = `scale(1.1) translateY(${heroProgress * 60}px)`;
      }
    }

    // Spring easing for counter
    let vel = 0;
    function tick() {
      const k = 0.08, damping = 0.8;
      const a = (target - displayedRef.current) * k;
      vel = (vel + a) * damping;
      displayedRef.current += vel;

      if (Math.abs(target - displayedRef.current) > 0.5 || Math.abs(vel) > 0.1) {
        if (elevationRef.current) {
          elevationRef.current.textContent = Math.round(displayedRef.current);

        if (barRef.current) {
          const pct = ((displayedRef.current - 700) / 4300) * 100;
          barRef.current.style.height = Math.max(5, pct) + '%';
        }
      }

      rafId = requestAnimationFrame(tick);
    }

    function onVisibility() {
      if (document.hidden) {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
      } else if (!rafId) {
        rafId = requestAnimationFrame(tick);
      }
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    document.addEventListener('visibilitychange', onVisibility);
    rafId = requestAnimationFrame(tick);

    return () => {
      if (rafId) cancelAnimationFrame(rafId);
      window.removeEventListener('scroll', onScroll);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, []);

  return (
    <section className="hero" data-screen-label="01-Hero">

  const cardRefs = useRef([]);

  useEffect(() => {
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion || window.innerWidth < 768) return;

    const handlers = [];
    cardRefs.current.forEach((card, i) => {
      if (!card) return;
      let rafId = null;
      let targetX = 0, targetY = 0, currentX = 0, currentY = 0;
      let velX = 0, velY = 0;

      function onMove(e) {
        const rect = card.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        // Inverse-square magnetic pull toward mouse
        const dx = e.clientX - cx;
        const dy = e.clientY - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const maxTilt = 8;
        const strength = Math.min(maxTilt, maxTilt * 200 / (dist + 50));
        targetX = -(dy / (rect.height / 2)) * strength * 0.6;
        targetY = (dx / (rect.width / 2)) * strength * 0.6;
      }
      function onLeave() { targetX = 0; targetY = 0; }

      function tick() {
        // Spring physics
        const k = 0.12, d = 0.7;
        const ax = (targetX - currentX) * k;
        const ay = (targetY - currentY) * k;
        velX = (velX + ax) * d;
        velY = (velY + ay) * d;
        currentX += velX;
        currentY += velY;
        card.style.transform = `perspective(1000px) rotateX(${currentX}deg) rotateY(${currentY}deg) translateY(-4px)`;
        rafId = requestAnimationFrame(tick);
      }

      function onEnter() {
        if (!rafId) rafId = requestAnimationFrame(tick);
      }

      card.addEventListener('mousemove', onMove);
      card.addEventListener('mouseleave', onLeave);
      card.addEventListener('mouseenter', onEnter);

      handlers.push(() => {
        card.removeEventListener('mousemove', onMove);
        card.removeEventListener('mouseleave', onLeave);
        card.removeEventListener('mouseenter', onEnter);
        if (rafId) cancelAnimationFrame(rafId);
      });
    });

    return () => handlers.forEach(h => h());
  }, []);

  return (
    <section id="zones" className="elevation-section" data-screen-label="02-Zones">

          短短几十公里的水平距离内，海拔落差超过 4000 米，
          浓缩了从赤道到极地的各种植被类型。
        </p>
        <div className="elevation-zones">
          {zones.map((z, i) => (
            <div
              key={i}
              ref={el => cardRefs.current[i] = el}
              className={`zone-card reveal reveal-delay-${i + 1}`}
              style={{ transitionDelay: `${i * 0.1}s` }}
            >

// ========== Waterfall Section (parallax + typewriter) ==========
function WaterfallSection() {
  const bgRef = useRef(null);
  const [text, setText] = useState('');
  const fullText = '在云雾与瀑布之间，每一步都是未知的世界。';

  useEffect(() => {
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const section = document.getElementById('waterfall');
    if (!section) return;

    // Parallax
    function onScroll() {
      const rect = section.getBoundingClientRect();
      const vh = window.innerHeight;
      if (rect.top < vh && rect.bottom > 0) {
        const progress = (vh - rect.top) / (vh + rect.height);
        if (bgRef.current) {
          bgRef.current.style.transform = `translateY(${(progress - 0.5) * 80}px) scale(1.15)`;
        }
      }
    }
    window.addEventListener('scroll', onScroll, { passive: true });

    // Typewriter
    let started = false;
    let index = 0;
    let timeoutId = null;
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting && !started) {
          started = true;
          if (reduceMotion) {
            setText(fullText);
            return;
          }
          function type() {
            if (index <= fullText.length) {
              setText(fullText.slice(0, index));
              index++;
              timeoutId = setTimeout(type, 80 + Math.random() * 60);
            }
          }
          type();
        }
      });
    }, { threshold: 0.3 });
    observer.observe(section);

    return () => {
      window.removeEventListener('scroll', onScroll);
      observer.disconnect();
      if (timeoutId) clearTimeout(timeoutId);
    };
  }, []);

  return (
    <section id="waterfall" className="waterfall-section" data-screen-label="03-Waterfall">
      <div ref={bgRef} className="waterfall-bg" />
      <div className="waterfall-overlay" />
      <div className="waterfall-content">
        <div className="section-label">HIDDEN GEMS</div>
        <h2 className="waterfall-quote">
          {text}
          <span className="typewriter-cursor" />
        </h2>
        <p className="waterfall-author">—— 《墨脱植物名录》序</p>
        <div className="waterfall-meta">
          <div className="waterfall-meta-item">
            <span className="waterfall-meta-val">500<span style={{fontSize: 18, opacity: 0.6}}>m</span></span>
            <span className="waterfall-meta-label">最大落差</span>
          </div>
          <div className="waterfall-meta-item">
            <span className="waterfall-meta-val">200+</span>
            <span className="waterfall-meta-label">瀑布数量</span>
          </div>
          <div className="waterfall-meta-item">
            <span className="waterfall-meta-val">85<span style={{fontSize: 18, opacity: 0.6}}>%</span></span>
            <span className="waterfall-meta-label">年湿度</span>
          </div>

    </section>
  );

// ========== Stats Counter ==========
function StatsSection() {
  const stats = [
    { value: 4300, suffix: 'm', label: '垂直落差' },
    { value: 3200, suffix: '+', label: '高等植物' },
    { value: 470, suffix: '+', label: '脊椎动物' },
    { value: 85, suffix: '%', label: '森林覆盖率' },
  ];
  const [started, setStarted] = useState(false);
  const sectionRef = useRef(null);
  const valuesRef = useRef(stats.map(() => 0));
  const targetsRef = useRef(stats.map(s => s.value));

  useEffect(() => {
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const section = sectionRef.current;
    if (!section) return;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting && !started) {
          setStarted(true);
          if (reduceMotion) {
            valuesRef.current = targetsRef.current.slice();
            section.querySelectorAll('.stat-num-val').forEach((el, i) => {
              el.textContent = Math.round(targetsRef.current[i]);
            });
            return;
          }

          let rafId = null;
          const springs = stats.map((_, i) => ({
            val: 0, vel: 0, target: targetsRef.current[i],
          }));

          function tick() {
            let allDone = true;
            springs.forEach((s, i) => {
              const k = 0.06, d = 0.82;
              const a = (s.target - s.val) * k;
              s.vel = (s.vel + a) * d;
              s.val += s.vel;
              if (Math.abs(s.target - s.val) > 0.5 || Math.abs(s.vel) > 0.1) allDone = false;
              const els = section.querySelectorAll('.stat-num-val');
              if (els[i]) els[i].textContent = Math.round(s.val);
            });
            if (!allDone) rafId = requestAnimationFrame(tick);
          }
          rafId = requestAnimationFrame(tick);

          // Cleanup on visibility
          function onVisibility() {
            if (document.hidden && rafId) {
              cancelAnimationFrame(rafId);
              rafId = null;
            } else if (!document.hidden && !rafId) {
              let allDone = springs.every(s => Math.abs(s.target - s.val) < 0.5 && Math.abs(s.vel) < 0.1);
              if (!allDone) rafId = requestAnimationFrame(tick);
            }
          }
          document.addEventListener('visibilitychange', onVisibility);
        }
      });
    }, { threshold: 0.3 });
    observer.observe(section);

    return () => observer.disconnect();
  }, [started]);

  return (
    <section className="stats-section" ref={sectionRef} data-screen-label="05-Stats">
      <div className="stats-grid">
        {stats.map((s, i) => (
          <div key={i} className="stat-item reveal" style={{ transitionDelay: `${i * 0.1}s` }}>
            <div className="stat-num">
              <span className="stat-num-val">0</span>
              <span className="unit">{s.suffix}</span>
            </div>
            <div className="stat-divider" />
            <div className="stat-label">{s.label}</div>
          </div>
        ))}
      </div>
    </section>
  );
}

function SoundSection() {

    { name: '高山虫鸣', dur: '2:55' },
  ];

  useEffect(() => {
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const section = document.getElementById('sound');
    if (!section || reduceMotion) return;

    // Spectrum animation with organic, non-uniform motion
    const BAR_COUNT = 48;
    const bars = barsRef.current.filter(Boolean);
    if (bars.length === 0) return;

    // Each bar has its own phase and speed for natural look
    const barPhases = bars.map(() => ({
      phase: Math.random() * Math.PI * 2,
      speed: 0.5 + Math.random() * 2,
      amp: 0.3 + Math.random() * 0.7,
      offset: Math.random() * Math.PI,
    }));

    let t = 0;
    function animate() {
      t += 0.03;
      bars.forEach((bar, i) => {
        if (!bar) return;
        const p = barPhases[i];
        // Multi-frequency sine for natural spectrum look
        let val =
          Math.sin(t * p.speed + p.phase) * 0.3 +
          Math.sin(t * p.speed * 2.3 + p.offset) * 0.2 +
          Math.sin(t * p.speed * 0.7 + p.phase * 1.5) * 0.25 +
          0.2;
        val = Math.max(0.05, Math.min(1, val * p.amp));
        bar.style.height = (val * 100) + '%';
      });
      rafRef.current = requestAnimationFrame(animate);
    }

    animate();

    function onVisibility() {
      if (document.hidden) {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        rafRef.current = null;
      } else if (!rafRef.current) {
        animate();
      }
    }
    document.addEventListener('visibilitychange', onVisibility);

    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, []);

  const trackSelect = (i) => {
    setActiveTrack(i);
  };

  const barCount = 48;

  return (
    <section id="sound" className="sound-section" data-screen-label="06-Sound">
      <div className="section-inner">

                ref={el => barsRef.current[i] = el}
                className="spectrum-bar"
                style={{ height: '20%' }}
              />
            ))}
          </div>
          <div className="sound-info reveal reveal-delay-3">
            <h3 className="sound-info-title">沉浸式自然声场</h3>
            <p className="sound-info-desc">
              带上耳机，感受从低地雨林到高山苔原的声场渐变。
              虫鸣、鸟啼、流水、风过林梢——这是墨脱最真实的声音档案。
            </p>
            <div className="sound-tracks">
              {tracks.map((t, i) => (
                <div
                  key={i}
                  className={`sound-track ${i === activeTrack ? 'active' : ''}`}
                  onClick={() => trackSelect(i)}
                >
                  <div className="sound-track-play">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="#1a2f23">
                      <path d="M8 5v14l11-7z" />
                    </svg>
                  </div>
                  <div className="sound-track-info">
                    <div className="sound-track-name">{t.name}</div>
                    <div className="sound-track-dur">{t.dur}</div>
                  </div>
                  <div className="sound-track-wave">
                    <span /><span /><span /><span /><span /><span />
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

// ========== CTA Section ==========
function CtaSection() {
  const [email, setEmail] = useState('');
  const [submitted, setSubmitted] = useState(false);
  const btnRef = useRef(null);

  useEffect(() => {
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion || window.innerWidth < 768) return;
    const btn = btnRef.current;
    if (!btn) return;

    let rafId = null;
    let tx = 0, ty = 0, cx = 0, cy = 0;
    let vx = 0, vy = 0;

    function onMove(e) {
      const rect = btn.getBoundingClientRect();
      const dx = e.clientX - (rect.left + rect.width / 2);
      const dy = e.clientY - (rect.top + rect.height / 2);
      // Magnetic inverse-square pull
      const dist = Math.sqrt(dx * dx + dy * dy);
      const pull = Math.min(12, 150 / (dist + 20));
      tx = (dx / (rect.width / 2)) * pull * 3;
      ty = (dy / (rect.height / 2)) * pull * 3;
    }
    function onLeave() { tx = 0; ty = 0; }

    function tick() {
      const k = 0.15, d = 0.7;
      const ax = (tx - cx) * k;
      const ay = (ty - cy) * k;
      vx = (vx + ax) * d;
      vy = (vy + ay) * d;
      cx += vx;
      cy += vy;
      btn.style.transform = `translate(${cx}px, ${cy}px)`;
      rafId = requestAnimationFrame(tick);
    }

    function onEnter() { if (!rafId) rafId = requestAnimationFrame(tick); }

    btn.addEventListener('mousemove', onMove);
    btn.addEventListener('mouseleave', onLeave);
    btn.addEventListener('mouseenter', onEnter);

    return () => {
      btn.removeEventListener('mousemove', onMove);
      btn.removeEventListener('mouseleave', onLeave);
      btn.removeEventListener('mouseenter', onEnter);
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, []);

  const handleSubmit = (e) => {
    e.preventDefault();
    if (email && email.includes('@')) {
      setSubmitted(true);
      setTimeout(() => setSubmitted(false), 2500);
      setEmail('');
    }
  };

  return (
    <section className="cta-section" data-screen-label="07-CTA">
      <div className="section-inner">
        <div className="cta-card reveal">
          <div className="section-label" style={{ justifyContent: 'center', display: 'flex' }}>JOIN THE EXPEDITION</div>
          <h2 className="cta-title" style={{ marginTop: 16 }}>加入雨林探索计划</h2>
          <p className="cta-subtitle">
            订阅我们的垂直生态通讯，每月收到来自墨脱的田野笔记、
            物种观察记录与独家摄影作品。
          </p>
          <form className="cta-form" onSubmit={handleSubmit}>
            <input
              type="email"
              className="cta-input"
              placeholder="输入你的邮箱地址"
              value={email}
              onChange={e => setEmail(e.target.value)}
            />
            <button ref={btnRef} type="submit" className="cta-btn">
              {submitted ? '已订阅 ✓' : '立即订阅'}
            </button>
          </form>
          <p className="cta-note">我们尊重你的隐私，随时可以取消订阅。</p>
        </div>
      </div>
    </section>
  );
}

// ========== Scroll Reveal Observer ==========
function useScrollReveal() {
  useEffect(() => {
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) {
      document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
      return;
    }

    const els = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          observer.unobserve(e.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -50px 0px' });

    els.forEach(el => observer.observe(el));
    return () => observer.disconnect();
  }, []);
}

function App() {

  useEffect(() => {
    // Announce upgrade availability

      window.parent?.postMessage?.({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    }
    announce();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announce, { once: true });
    }
  }, []);

  return (
    <>
      <CustomCursor />
      <MistCanvas />
      <Navigation />

        <Hero />

        <WaterfallSection />
        <Biodiversity />

      </main>
      <Footer />
    </>
  );
}

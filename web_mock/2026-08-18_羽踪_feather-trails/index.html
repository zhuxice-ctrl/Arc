<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>羽踪 · 候鸟迁徙观测站</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #F4F1E8;
      --ink: #1F242C;
      --accent: #E46A2B;
      --feather: #7C8694;
      --paper: #FBF9F2;
      --line: rgba(31,36,44,0.12);
      --line2: rgba(31,36,44,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; overflow-x: hidden; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans SC", "PingFang SC", sans-serif;
      font-weight: 400;
      cursor: none;
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
    }
    @media (prefers-reduced-motion: reduce) {
      body { cursor: auto; }
      .cursor-wrap { display: none !important; }
      * { transition: none !important; animation: none !important; }
    }
    .serif { font-family: "Noto Serif SC", "Songti SC", serif; }
    .mono { font-family: "JetBrains Mono", monospace; }

    /* ============ Custom Cursor ============ */
    .cursor-wrap {
      position: fixed; top: 0; left: 0;
      width: 0; height: 0;
      pointer-events: none;
      z-index: 9999;
      mix-blend-mode: normal;
    }
    .cursor-ring {
      position: absolute;
      width: 38px; height: 38px;
      border: 2px solid #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.25s cubic-bezier(.2,.8,.2,1),
                  height 0.25s cubic-bezier(.2,.8,.2,1),
                  border-color 0.25s, background 0.25s;
      box-shadow: 0 0 20px rgba(228,106,43,0.6),
                  0 0 40px rgba(228,106,43,0.3),
                  inset 0 0 10px rgba(255,255,255,0.2);
      backdrop-filter: invert(0.1);
    }
    .cursor-dot {
      position: absolute;
      width: 7px; height: 7px;
      background: var(--accent);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px var(--accent);
      transition: transform 0.15s ease;
    }
    .cursor-ring.is-hover {
      width: 58px; height: 58px;
      border-color: var(--accent);
      background: rgba(228,106,43,0.12);
    }
    .cursor-dot.is-hover { transform: translate(-50%, -50%) scale(1.4); }
    .cursor-ring.is-click { width: 30px; height: 30px; }
    .cursor-ripple {
      position: absolute;
      width: 10px; height: 10px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
    }
    @keyframes rippleExpand {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(6); opacity: 0; }
    }

    /* ============ Nav ============ */
    .nav {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 48px;
      transition: background 0.4s, backdrop-filter 0.4s, padding 0.4s;
    }
    .nav.scrolled {
      background: rgba(244,241,232,0.85);
      backdrop-filter: blur(16px);
      padding: 14px 48px;
      border-bottom: 1px solid var(--line);
    }
    .nav-logo {
      font-family: "Noto Serif SC", serif;
      font-size: 22px; font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--ink);
      display: flex; align-items: center; gap: 10px;
    }
    .nav-logo-mark {
      width: 28px; height: 28px;
      position: relative;
    }
    .nav-links {
      display: flex; align-items: center; gap: 36px;
      list-style: none;
    }
    .nav-links a {
      color: var(--ink);
      text-decoration: none;
      font-size: 14px;
      position: relative;
      padding: 4px 0;
      transition: color 0.3s;
    }
    .nav-links a::after {
      content: ''; position: absolute;
      left: 0; bottom: 0;
      width: 0; height: 1.5px;
      background: var(--accent);
      transition: width 0.35s cubic-bezier(.2,.8,.2,1);
    }
    .nav-links a:hover { color: var(--accent); }
    .nav-links a:hover::after { width: 100%; }
    .nav-cta {
      padding: 9px 20px;
      background: var(--ink);
      color: var(--bg) !important;
      border-radius: 999px;
      font-size: 13px !important;
      font-weight: 500;
      transition: background 0.3s, transform 0.3s !important;
    }
    .nav-cta:hover { background: var(--accent); transform: translateY(-1px); }
    .nav-cta::after { display: none !important; }

    /* ============ Hero ============ */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex; flex-direction: column;
      justify-content: center;
      padding: 0 80px;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute; inset: 0;
      z-index: 0;
    }
    .hero-bg img {
      width: 100%; height: 100%;
      object-fit: cover;
      filter: saturate(0.9) brightness(0.85);
    }
    .hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg,
        rgba(244,241,232,0.3) 0%,
        rgba(244,241,232,0.1) 40%,
        rgba(31,36,44,0.55) 100%);
      z-index: 1;
    }
    .hero-particles {
      position: absolute; inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    .hero-content {
      position: relative; z-index: 3;
      max-width: 780px;
      color: #fff;
      padding-top: 80px;
    }
    .hero-kicker {
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      letter-spacing: 0.3em;
      color: var(--accent);
      margin-bottom: 28px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s 0.2s forwards;
    }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    .hero-title {
      font-family: "Noto Serif SC", serif;
      font-size: clamp(48px, 6.5vw, 96px);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: 0.04em;
      margin-bottom: 28px;
      text-shadow: 0 2px 40px rgba(0,0,0,0.3);
    }
    .hero-title .word {
      display: inline-block;
      opacity: 0;
      transform: translateY(40px);
      animation: titleUp 1.1s cubic-bezier(.2,.8,.2,1) forwards;
    }
    @keyframes titleUp { to { opacity: 1; transform: translateY(0); } }
    .hero-sub {
      font-size: 18px;
      line-height: 1.8;
      max-width: 560px;
      margin-bottom: 44px;
      color: rgba(255,255,255,0.88);
      opacity: 0;
      animation: fadeUp 1s 0.9s forwards;
    }
    .hero-actions {
      display: flex; gap: 18px;
      opacity: 0;
      animation: fadeUp 1s 1.1s forwards;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 30px;
      border-radius: 999px;
      font-size: 14px; font-weight: 500;
      cursor: none;
      border: none;
      transition: all 0.35s cubic-bezier(.2,.8,.2,1);
      text-decoration: none;
      position: relative;
      overflow: hidden;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 6px 24px rgba(228,106,43,0.35);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(228,106,43,0.5);
    }
    .btn-ghost {
      background: transparent;
      color: #fff;
      border: 1.5px solid rgba(255,255,255,0.5);
    }
    .btn-ghost:hover {
      border-color: #fff;
      background: rgba(255,255,255,0.1);
      transform: translateY(-2px);
    }
    .btn-gloss::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: left 0.7s;
    }
    .btn-gloss:hover::before { left: 150%; }
    .hero-scroll {
      position: absolute;
      bottom: 36px; left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      color: rgba(255,255,255,0.7);
      font-size: 12px;
      letter-spacing: 0.25em;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      animation: floatY 2.4s ease-in-out infinite;
    }
    @keyframes floatY {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(8px); }
    }
    .hero-scroll-line {
      width: 1px; height: 40px;
      background: linear-gradient(180deg, rgba(255,255,255,0.5), transparent);
    }
    .hero-stat-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 3;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(8px);
      background: rgba(31,36,44,0.3);
    }
    .hero-stat {
      padding: 22px 28px;
      border-right: 1px solid rgba(255,255,255,0.1);
      color: #fff;
    }
    .hero-stat:last-child { border-right: none; }
    .stat-num {
      font-family: "Noto Serif SC", serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.02em;
    }
    .stat-label {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.15em;
      margin-top: 4px;
    }

    /* ============ Section Base ============ */
    .section {
      padding: 120px 80px;
      position: relative;
    }
    .section-head {
      display: flex; align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 64px;
    }
    .section-tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.3em;
      color: var(--accent);
      margin-bottom: 16px;
    }
    .section-title {
      font-family: "Noto Serif SC", serif;
      font-size: clamp(32px, 3.8vw, 52px);
      font-weight: 700;
      line-height: 1.2;
      color: var(--ink);
    }
    .section-desc {
      max-width: 380px;
      font-size: 14px;
      line-height: 1.8;
      color: var(--feather);
    }

    /* scroll reveal */
    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.9s cubic-bezier(.2,.8,.2,1), transform 0.9s cubic-bezier(.2,.8,.2,1);
    }
    .reveal.in { opacity: 1; transform: translateY(0); }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }
    .reveal-delay-4 { transition-delay: 0.4s; }

    /* ============ Route Section ============ */
    .route-section {
      background: var(--paper);
      position: relative;
    }
    .route-map {
      position: relative;
      width: 100%;
      height: 520px;
      background: var(--bg);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--line);
    }
    .route-map svg {
      width: 100%; height: 100%;
    }
    .route-info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-top: 40px;
    }
    .route-card {
      padding: 28px;
      background: #fff;
      border-radius: 12px;
      border: 1px solid var(--line);
      transition: all 0.4s cubic-bezier(.2,.8,.2,1);
      position: relative;
      overflow: hidden;
    }
    .route-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 16px 48px rgba(31,36,44,0.08);
    }
    .route-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 4px; height: 100%;
      background: var(--accent);
      transform: scaleY(0);
      transform-origin: top;
      transition: transform 0.4s cubic-bezier(.2,.8,.2,1);
    }
    .route-card:hover::before { transform: scaleY(1); }
    .route-card-num {
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      color: var(--accent);
      letter-spacing: 0.1em;
      margin-bottom: 12px;
    }
    .route-card-title {
      font-family: "Noto Serif SC", serif;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .route-card-desc {
      font-size: 13px;
      line-height: 1.8;
      color: var(--feather);
    }
    .route-card-meta {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px dashed var(--line);
      display: flex; justify-content: space-between;
      font-size: 12px;
      color: var(--feather);
    }

    /* ============ Species Section ============ */
    .species-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }
    .species-card {
      background: var(--paper);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      transition: all 0.4s cubic-bezier(.2,.8,.2,1);
      cursor: none;
      position: relative;
      transform-style: preserve-3d;
      perspective: 1000px;
    }
    .species-card:hover {
      border-color: var(--accent);
      box-shadow: 0 24px 60px rgba(31,36,44,0.12);
    }
    .species-img-wrap {
      position: relative;
      aspect-ratio: 3/4;
      overflow: hidden;
      background: var(--bg);
    }
    .species-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(.2,.8,.2,1);
      transform: scale(1.02);
    }
    .species-card:hover .species-img-wrap img {
      transform: scale(1.08);
    }
    .species-gloss {
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
      transform: skewX(-15deg);
      pointer-events: none;
    }
    .species-card:hover .species-gloss {
      animation: glossSweep 0.9s ease-out forwards;
    }
    @keyframes glossSweep {
      0% { left: -100%; }
      100% { left: 150%; }
    }
    .species-tag {
      position: absolute;
      top: 14px; left: 14px;
      padding: 4px 10px;
      background: rgba(31,36,44,0.7);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 11px;
      border-radius: 999px;
      letter-spacing: 0.1em;
    }
    .species-info {
      padding: 20px;
    }
    .species-name {
      font-family: "Noto Serif SC", serif;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .species-latin {
      font-style: italic;
      font-size: 12px;
      color: var(--feather);
      margin-bottom: 14px;
      letter-spacing: 0.02em;
    }
    .species-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .species-stat {
      font-size: 11px;
      color: var(--feather);
    }
    .species-stat strong {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      margin-top: 2px;
    }

    /* ============ Live Data Section ============ */
    .live-section {
      background: var(--ink);
      color: var(--bg);
      position: relative;
      overflow: hidden;
    }
    .live-section .section-title { color: #fff; }
    .live-section .section-desc { color: rgba(244,241,232,0.6); }
    .live-section .section-tag { color: var(--accent); }

    .live-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 32px;
    }
    .live-panel {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 32px;
      backdrop-filter: blur(12px);
    }
    .live-panel-title {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.7);
      margin-bottom: 24px;
      display: flex; align-items: center; gap: 10px;
    }
    .live-pulse {
      width: 8px; height: 8px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 8px #4ade80;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.6; }
    }
    /* spectrum bars */
    .spectrum {
      display: flex; align-items: flex-end;
      gap: 5px;
      height: 160px;
      padding: 16px 0;
    }
    .spectrum-bar {
      flex: 1;
      background: linear-gradient(180deg, var(--accent), rgba(228,106,43,0.3));
      border-radius: 3px 3px 0 0;
      min-height: 4px;
      transition: height 0.3s cubic-bezier(.4,0,.2,1);
    }
    .spectrum-labels {
      display: flex; justify-content: space-between;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      margin-top: 8px;
      font-family: "JetBrains Mono", monospace;
    }

    .live-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 28px;
    }
    .live-stat {
      padding: 20px;
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .live-stat-num {
      font-family: "Noto Serif SC", serif;
      font-size: 36px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 6px;
    }
    .live-stat-label {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
    }

    .bird-list {
      list-style: none;
    }
    .bird-list li {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 13px;
    }
    .bird-list li:last-child { border-bottom: none; }
    .bird-list-name { font-weight: 500; }
    .bird-list-count {
      font-family: "JetBrains Mono", monospace;
      color: var(--accent);
      font-size: 14px;
    }

    /* ============ Journal Section ============ */
    .journal-section { background: var(--bg); }
    .journal-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 24px;
    }
    .journal-card {
      background: var(--paper);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      transition: all 0.4s cubic-bezier(.2,.8,.2,1);
      cursor: none;
      position: relative;
    }
    .journal-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 20px 50px rgba(31,36,44,0.08);
    }
    .journal-card.big { grid-row: span 2; }
    .journal-img {
      aspect-ratio: 16/10;
      overflow: hidden;
      background: var(--bg);
    }
    .journal-card.big .journal-img { aspect-ratio: 4/3; }
    .journal-img img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(.2,.8,.2,1);
    }
    .journal-card:hover .journal-img img { transform: scale(1.05); }
    .journal-body { padding: 24px; }
    .journal-meta {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--feather);
    }
    .journal-cat {
      color: var(--accent);
      font-weight: 500;
      letter-spacing: 0.05em;
    }
    .journal-title {
      font-family: "Noto Serif SC", serif;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 10px;
    }
    .journal-card.big .journal-title { font-size: 26px; }
    .journal-excerpt {
      font-size: 13px;
      line-height: 1.8;
      color: var(--feather);
    }
    .journal-author {
      margin-top: 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .author-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #d97706);
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      position: relative;
    }
    .author-avatar::after {
      content: '';
      position: absolute;
      inset: -3px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      opacity: 0;
      animation: avatarPulse 2.5s ease-out infinite;
    }
    @keyframes avatarPulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    .author-name {
      font-size: 13px;
      font-weight: 500;
    }
    .author-role {
      font-size: 11px;
      color: var(--feather);
    }

    /* ============ Footer ============ */
    .footer {

    // ==============================================
    // Custom Cursor
    // ==============================================
    const CURSOR_STATE = { x: window.innerWidth / 2, y: window.innerHeight / 2,
      tx: window.innerWidth / 2, ty: window.innerHeight / 2,
      isHover: false, isClick: false, rafId: 0, ripples: [] };

    function useCursorInit() {
      const ringRef = useRef(null);
      const dotRef = useRef(null);

      useEffect(() => {
        const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
        if (mq.matches) return;
        if ('ontouchstart' in window && window.innerWidth < 800) return;

        const ring = ringRef.current;
        const dot = dotRef.current;
        if (!ring || !dot) return;

        CURSOR_STATE.x = window.innerWidth / 2;
        CURSOR_STATE.y = window.innerHeight / 2;
        CURSOR_STATE.tx = CURSOR_STATE.x;
        CURSOR_STATE.ty = CURSOR_STATE.y;

        const onMove = (e) => {
          CURSOR_STATE.tx = e.clientX;
          CURSOR_STATE.ty = e.clientY;
        };

        const animate = () => {
          // spring model: x += (tx - x) * k
          const k = 0.18;
          CURSOR_STATE.x += (CURSOR_STATE.tx - CURSOR_STATE.x) * k;
          CURSOR_STATE.y += (CURSOR_STATE.ty - CURSOR_STATE.y) * k;

          ring.style.left = CURSOR_STATE.x + 'px';
          ring.style.top = CURSOR_STATE.y + 'px';
          dot.style.left = CURSOR_STATE.tx + 'px';
          dot.style.top = CURSOR_STATE.ty + 'px';

          CURSOR_STATE.rafId = requestAnimationFrame(animate);
        };
        CURSOR_STATE.rafId = requestAnimationFrame(animate);

        const onOver = (e) => {
          const t = e.target.closest('a, button, .species-card, .route-card, .journal-card, .nav-cta, .btn, li, input, textarea');
          if (t) {
            CURSOR_STATE.isHover = true;
            ring.classList.add('is-hover');
            dot.classList.add('is-hover');
          }
        };
        const onOut = (e) => {
          const t = e.target.closest('a, button, .species-card, .route-card, .journal-card, .nav-cta, .btn, li, input, textarea');
          if (t) {
            CURSOR_STATE.isHover = false;
            ring.classList.remove('is-hover');
            dot.classList.remove('is-hover');
          }
        };
        const onClick = (e) => {
          // spawn ripple
          const ripple = document.createElement('div');
          ripple.className = 'cursor-ripple';
          ripple.style.left = e.clientX + 'px';
          ripple.style.top = e.clientY + 'px';
          ring.parentElement.appendChild(ripple);
          ripple.style.animation = 'rippleExpand 0.6s ease-out forwards';
          setTimeout(() => ripple.remove(), 650);

          ring.classList.add('is-click');
          setTimeout(() => ring.classList.remove('is-click'), 150);
        };

        window.addEventListener('mousemove', onMove);
        document.addEventListener('mouseover', onOver);
        document.addEventListener('mouseout', onOut);
        document.addEventListener('click', onClick);

        const onVis = () => {
          if (document.hidden) {
            cancelAnimationFrame(CURSOR_STATE.rafId);
          } else {
            CURSOR_STATE.rafId = requestAnimationFrame(animate);
          }
        };
        document.addEventListener('visibilitychange', onVis);

        return () => {
          cancelAnimationFrame(CURSOR_STATE.rafId);
          window.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseover', onOver);
          document.removeEventListener('mouseout', onOut);
          document.removeEventListener('click', onClick);
          document.removeEventListener('visibilitychange', onVis);
        };
      }, []);

      return { ringRef, dotRef };
    }

    // ==============================================
    // Flock Particles (bird formation)
    // ==============================================
    function useFlockParticles(canvasRef, count = 40) {
      useEffect(() => {
        const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
        if (mq.matches) return;

        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let w, h;
        let rafId = 0;
        let birds = [];
        let t = 0;

        const resize = () => {
          const dpr = window.devicePixelRatio || 1;
          w = canvas.clientWidth;
          h = canvas.clientHeight;
          canvas.width = w * dpr;
          canvas.height = h * dpr;
          ctx.scale(dpr, dpr);
        };
        resize();

        for (let i = 0; i < count; i++) {
          birds.push({
            baseX: Math.random() * w,
            baseY: Math.random() * h,
            phase: Math.random() * Math.PI * 2,
            speed: 0.3 + Math.random() * 0.5,
            ampX: 30 + Math.random() * 80,
            ampY: 15 + Math.random() * 40,
            size: 2 + Math.random() * 3,
            flapSpeed: 0.15 + Math.random() * 0.1,
            flapPhase: Math.random() * Math.PI * 2,
          });
        }

        const drawBirdShape = (x, y, size, flap, angle) => {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(angle);
          ctx.beginPath();
          const wingY = Math.sin(flap) * size * 1.2;
          // left wing
          ctx.moveTo(-size * 2.5, wingY);
          ctx.quadraticCurveTo(-size, -size * 0.3, 0, 0);
          // right wing
          ctx.quadraticCurveTo(size, -size * 0.3, size * 2.5, wingY);
          ctx.quadraticCurveTo(size, size * 0.2, 0, size * 0.2);
          ctx.quadraticCurveTo(-size, size * 0.2, -size * 2.5, wingY);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        };

        const render = () => {
          t += 0.016;
          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = 'rgba(255,255,255,0.85)';

          for (let i = 0; i < birds.length; i++) {
            const b = birds[i];
            const x = b.baseX + Math.sin(t * b.speed + b.phase) * b.ampX;
            const y = b.baseY + Math.cos(t * b.speed * 0.7 + b.phase) * b.ampY;
            const dx = Math.cos(t * b.speed + b.phase) * b.ampX * b.speed;
            const dy = -Math.sin(t * b.speed * 0.7 + b.phase) * b.ampY * b.speed * 0.7;
            const angle = Math.atan2(dy, dx);
            const flap = Math.sin(t * 8 + b.flapPhase) * 0.6 + 0.2;

            const alpha = 0.5 + Math.sin(t * 0.5 + i * 0.2) * 0.3;
            ctx.globalAlpha = alpha;
            drawBirdShape(x, y, b.size, flap, angle);
          }
          ctx.globalAlpha = 1;

          rafId = requestAnimationFrame(render);
        };
        rafId = requestAnimationFrame(render);

        const onVis = () => {
          if (document.hidden) {
            cancelAnimationFrame(rafId);
          } else {
            rafId = requestAnimationFrame(render);
          }
        };
        document.addEventListener('visibilitychange', onVis);
        window.addEventListener('resize', resize);

        return () => {
          cancelAnimationFrame(rafId);
          document.removeEventListener('visibilitychange', onVis);
          window.removeEventListener('resize', resize);
        };
      }, [count]);
    }

    // ==============================================
    // Floating Feathers
    // ==============================================
    function useFeatherFall(layerRef, count = 18) {
      useEffect(() => {
        const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
        if (mq.matches) return;

        const layer = layerRef.current;
        if (!layer) return;
        let rafId = 0;
        let feathers = [];
        let t = 0;

        const FeatherSvg = () => `
          <svg viewBox="0 0 24 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C8 10 4 20 12 34C20 20 16 10 12 2Z" fill="currentColor" opacity="0.8"/>
            <path d="M12 2L12 34" stroke="currentColor" strokeWidth="1" opacity="0.6"/>
          </svg>
        `;

        for (let i = 0; i < count; i++) {
          const el = document.createElement('div');
          el.className = 'feather';
          el.innerHTML = FeatherSvg();
          layer.appendChild(el);
          feathers.push({
            el,
            x: Math.random() * window.innerWidth,
            y: -Math.random() * window.innerHeight,
            vy: 0.3 + Math.random() * 0.5,
            swayAmp: 20 + Math.random() * 40,
            swaySpeed: 0.008 + Math.random() * 0.012,
            phase: Math.random() * Math.PI * 2,
            rot: Math.random() * 30 - 15,
            rotSpeed: (Math.random() - 0.5) * 0.05,
            scale: 0.6 + Math.random() * 0.8,
            delay: Math.random() * 200,
          });
        }

        const render = () => {
          t += 16;
          const h = window.innerHeight;
          for (let i = 0; i < feathers.length; i++) {
            const f = feathers[i];
            f.y += f.vy;
            f.rot += f.rotSpeed;
            const swayX = Math.sin(t * f.swaySpeed + f.phase) * f.swayAmp;
            const actualX = f.x + swayX;

            if (f.y > h + 50) {
              f.y = -50;
              f.x = Math.random() * window.innerWidth;
            }

            f.el.style.transform = `translate(${actualX}px, ${f.y}px) rotate(${f.rot}deg) scale(${f.scale})`;
            f.el.style.opacity = f.y < 100 ? f.y / 100 : (f.y > h - 100 ? (h - f.y) / 100 : 1);
          }
          rafId = requestAnimationFrame(render);
        };
        rafId = requestAnimationFrame(render);

        const onVis = () => {
          if (document.hidden) {
            cancelAnimationFrame(rafId);
          } else {
            rafId = requestAnimationFrame(render);
          }
        };
        document.addEventListener('visibilitychange', onVis);

        return () => {
          cancelAnimationFrame(rafId);
          document.removeEventListener('visibilitychange', onVis);
          feathers.forEach(f => f.el.remove());
        };
      }, [count]);
    }

    // ==============================================
    // Scroll Reveal Observer
    // ==============================================
    function useScrollReveal() {
      useEffect(() => {
        const els = document.querySelectorAll('.reveal');
        const io = new IntersectionObserver((entries) => {
          entries.forEach(e => {
            if (e.isIntersecting) {
              e.target.classList.add('in');
              io.unobserve(e.target);
            }
          });
        }, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });
        els.forEach(el => io.observe(el));
        return () => io.disconnect();
      }, []);
    }

    // ==============================================
    // Nav scroll state
    // ==============================================
    function useNavScroll() {
      const [scrolled, setScrolled] = useState(false);
      useEffect(() => {
        const onScroll = () => {
          setScrolled(window.scrollY > 80);
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      return scrolled;
    }

    // ==============================================
    // Typewriter
    // ==============================================
    function useTypewriter(text, speed = 80, startDelay = 500) {
      const [display, setDisplay] = useState('');
      const [done, setDone] = useState(false);
      useEffect(() => {
        let idx = 0;
        let timer = null;
        let startTimer = null;

        const start = () => {
          timer = setInterval(() => {
            idx++;
            setDisplay(text.slice(0, idx));
            if (idx >= text.length) {
              clearInterval(timer);
              setDone(true);
            }
          }, speed);
        };
        startTimer = setTimeout(start, startDelay);

        return () => {
          clearTimeout(startTimer);
          clearInterval(timer);
        };
      }, [text, speed, startDelay]);
      return { display, done };
    }

    // ==============================================
    // Counter
    // ==============================================
    function useCounter(target, duration = 2000, start = 0, decimals = 0) {
      const [val, setVal] = useState(start);
      const ref = useRef(null);
      const startedRef = useRef(false);
      const rafRef = useRef(0);

      useEffect(() => {
        const el = ref.current;
        if (!el) return;

        const startAnim = () => {
          if (startedRef.current) return;
          startedRef.current = true;
          const startTime = performance.now();

          const step = (now) => {
            const p = Math.min((now - startTime) / duration, 1);
            // easeOutCubic
            const eased = 1 - Math.pow(1 - p, 3);
            const current = start + (target - start) * eased;
            setVal(decimals > 0 ? parseFloat(current.toFixed(decimals)) : Math.floor(current));
            if (p < 1) rafRef.current = requestAnimationFrame(step);
          };
          rafRef.current = requestAnimationFrame(step);
        };

        const io = new IntersectionObserver((entries) => {
          entries.forEach(e => {
            if (e.isIntersecting) startAnim();
          });
        }, { threshold: 0.5 });
        io.observe(el);

        return () => {
          io.disconnect();
          cancelAnimationFrame(rafRef.current);
        };
      }, [target, duration, start, decimals]);

      return { val, ref };
    }

    // ==============================================
    // 3D Card Tilt (direct DOM manipulation)
    // ==============================================
    function useCardTilt(containerRef, strength = 12) {
      useEffect(() => {
        const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
        if (mq.matches) return;
        if ('ontouchstart' in window && window.innerWidth < 800) return;

        const card = containerRef.current;
        if (!card) return;

        const onMove = (e) => {
          const rect = card.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const dx = (e.clientX - cx) / (rect.width / 2);
          const dy = (e.clientY - cy) / (rect.height / 2);
          card.style.transform = `perspective(1000px) rotateY(${dx * strength}deg) rotateX(${-dy * strength}deg) translateZ(4px)`;
        };
        const onLeave = () => {
          card.style.transform = 'perspective(1000px) rotateY(0) rotateX(0) translateZ(0)';
        };

        card.addEventListener('mousemove', onMove);
        card.addEventListener('mouseleave', onLeave);

        return () => {
          card.removeEventListener('mousemove', onMove);
          card.removeEventListener('mouseleave', onLeave);
        };
      }, [strength]);
    }

    // ==============================================
    // Magnetic Button
    // ==============================================
    function useMagnetic(btnRef, strength = 0.25) {
      useEffect(() => {
        const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
        if (mq.matches) return;
        if ('ontouchstart' in window && window.innerWidth < 800) return;

        const btn = btnRef.current;
        if (!btn) return;

        const onMove = (e) => {
          const rect = btn.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const dx = (e.clientX - cx) * strength;
          const dy = (e.clientY - cy) * strength;
          btn.style.transform = `translate(${dx}px, ${dy}px)`;
        };
        const onLeave = () => {
          btn.style.transform = 'translate(0, 0)';
        };

        btn.addEventListener('mousemove', onMove);
        btn.addEventListener('mouseleave', onLeave);

        return () => {
          btn.removeEventListener('mousemove', onMove);
          btn.removeEventListener('mouseleave', onLeave);
        };
      }, [strength]);
    }

    // ==============================================
    // Spectrum Bars
    // ==============================================
    function useSpectrum(containerRef, barCount = 24) {
      const barsRef = useRef([]);
      const rafRef = useRef(0);

      useEffect(() => {
        const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
        if (mq.matches) return;

        let t = 0;
        const render = () => {
          t += 0.08;
          for (let i = 0; i < barCount; i++) {
            const bar = barsRef.current[i];
            if (!bar) continue;
            // layered sine waves for organic feel
            const v = 0.4
              + 0.3 * Math.sin(t * 1.2 + i * 0.4)
              + 0.2 * Math.sin(t * 0.7 + i * 0.9 + 1)
              + 0.1 * Math.sin(t * 2.1 + i * 0.2);
            const h = Math.max(0.03, Math.min(1, v)) * 100;
            bar.style.height = h + '%';
          }
          rafRef.current = requestAnimationFrame(render);
        };
        rafRef.current = requestAnimationFrame(render);

        const onVis = () => {
          if (document.hidden) {
            cancelAnimationFrame(rafRef.current);
          } else {
            rafRef.current = requestAnimationFrame(render);
          }
        };
        document.addEventListener('visibilitychange', onVis);

        return () => {
          cancelAnimationFrame(rafRef.current);
          document.removeEventListener('visibilitychange', onVis);
        };
      }, [barCount]);

      return { barsRef, barCount };
    }

    // ==============================================
    // Route path drawing on scroll
    // ==============================================
    function useRoutePath(mapRef) {
      const [drawn, setDrawn] = useState(false);
      useEffect(() => {
        const el = mapRef.current;
        if (!el) return;
        const io = new IntersectionObserver((entries) => {
          entries.forEach(e => {
            if (e.isIntersecting) {
              setDrawn(true);
              io.unobserve(el);
            }
          });
        }, { threshold: 0.3 });
        io.observe(el);
        return () => io.disconnect();
      }, []);
      return drawn;
    }

    // ==============================================
    // Hero Parallax
    // ==============================================
    function useHeroParallax(heroRef) {
      useEffect(() => {
        const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
        if (mq.matches) return;
        const hero = heroRef.current;
        if (!hero) return;
        const bg = hero.querySelector('.hero-bg img');
        const content = hero.querySelector('.hero-content');

        const onScroll = () => {
          const y = window.scrollY;
          if (y < window.innerHeight) {
            bg.style.transform = `translateY(${y * 0.3}px) scale(${1 + y * 0.0003})`;
            content.style.transform = `translateY(${y * 0.15}px)`;
            content.style.opacity = Math.max(0, 1 - y / 500);
          }
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
    }

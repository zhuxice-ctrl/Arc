<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>The Spice Route — From Malabar to Quanzhou</title>

<link rel="preconnect" href="https://miaoda.feishu.cn" />
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,400&display=swap" />

<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<style>
/* ============================================================
   THE SPICE ROUTE — single-page interactive magazine
   Palette: saffron #E8590C · cinnamon #6B3F23 · cardamom #FAF3E3
            turmeric #E9B44C · pepper #20180F
   ============================================================ */

:root {
  --saffron: #E8590C;
  --saffron-deep: #C74A08;
  --cinnamon: #6B3F23;
  --cinnamon-deep: #4A2A16;
  --cardamom: #FAF3E3;
  --cardamom-mid: #EFE4CC;
  --turmeric: #E9B44C;
  --turmeric-deep: #C8962E;
  --pepper: #20180F;
  --pepper-soft: #3A2D1F;
  --ink: #2B1E10;

  --font-display: 'Cormorant Garamond', 'Times New Roman', serif;
  --font-body: 'Source Serif 4', Georgia, serif;

  --easing-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --easing-smooth: cubic-bezier(0.22, 1, 0.36, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: var(--cardamom);
  color: var(--pepper);
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  cursor: none;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
  body { cursor: auto; }
  .cursor-dot, .cursor-ring, .cursor-glow { display: none !important; }
}

/* ===== Paper grain texture overlay ===== */
.paper-grain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 100;
  opacity: 0.35;
  mix-blend-mode: multiply;
  background-image:
    radial-gradient(rgba(107, 63, 35, 0.18) 1px, transparent 1px),
    radial-gradient(rgba(32, 24, 15, 0.08) 1px, transparent 1px);
  background-size: 3px 3px, 7px 7px;
  background-position: 0 0, 1px 2px;
}

/* ===== Custom cursor ===== */
.cursor-dot, .cursor-ring, .cursor-glow {
  position: fixed;
  top: 0; left: 0;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  will-change: transform;
}
.cursor-dot {
  width: 8px; height: 8px;
  background: var(--saffron);
  border-radius: 50%;
  box-shadow: 0 0 10px rgba(232, 89, 12, 0.8),
              0 0 24px rgba(232, 89, 12, 0.4);
  transition: width 0.25s var(--easing-spring),
              height 0.25s var(--easing-spring),
              background-color 0.25s ease;
}
.cursor-ring {
  width: 40px; height: 40px;
  border: 2px solid var(--pepper);
  border-radius: 50%;
  transition: width 0.25s var(--easing-spring),
              height 0.25s var(--easing-spring),
              border-color 0.25s ease,
              background-color 0.25s ease;
}
.cursor-glow {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(233, 180, 76, 0.35) 0%, transparent 70%);
  transition: width 0.4s var(--easing-smooth),
              height 0.4s var(--easing-smooth),
              opacity 0.3s ease;
  opacity: 0.7;
}
body.cursor-hover .cursor-dot {
  width: 12px; height: 12px;
  background: var(--turmeric);
}
body.cursor-hover .cursor-ring {
  width: 60px; height: 60px;
  border-color: var(--saffron);
}
body.cursor-hover .cursor-glow {
  width: 120px; height: 120px;
  opacity: 0.9;
}
body.cursor-click .cursor-ring {
  width: 24px; height: 24px;
  background: rgba(232, 89, 12, 0.3);
}

/* Click ripple */
.cursor-ripple {
  position: fixed;
  pointer-events: none;
  z-index: 9998;
  border: 2px solid var(--saffron);
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(0);
  opacity: 1;
  animation: rippleExpand 0.7s ease-out forwards;
}
@keyframes rippleExpand {
  0% { transform: translate(-50%, -50%) scale(0); opacity: 0.9; border-width: 3px; }
  100% { transform: translate(-50%, -50%) scale(3); opacity: 0; border-width: 1px; }
}

/* ===== Navigation ===== */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 500;
  padding: 24px 48px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  backdrop-filter: blur(8px);
  background: rgba(250, 243, 227, 0.6);
  border-bottom: 1px solid rgba(107, 63, 35, 0.1);
  transition: all 0.4s ease;
}
.nav-logo {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--pepper);
  text-transform: uppercase;
}
.nav-logo span { color: var(--saffron); }
.nav-links {
  display: flex;
  gap: 36px;
  list-style: none;
}
.nav-links a {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--pepper-soft);
  text-decoration: none;
  position: relative;
  display: inline-block;
  transition: color 0.3s ease;
  cursor: none;
}
.nav-links a::after {
  content: '';
  position: absolute;
  bottom: -4px; left: 50%;
  width: 0; height: 1.5px;
  background: var(--saffron);
  transition: all 0.4s var(--easing-spring);
  transform: translateX(-50%);
}
.nav-links a:hover { color: var(--saffron); }
.nav-links a:hover::after { width: 100%; }

/* ===== Hero Section ===== */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 30% 40%, rgba(233, 180, 76, 0.25) 0%, transparent 55%),
    radial-gradient(ellipse at 70% 70%, rgba(232, 89, 12, 0.12) 0%, transparent 50%),
    var(--cardamom);
  padding: 120px 48px 80px;
}

.hero-inner {
  position: relative;
  z-index: 2;
  max-width: 1200px;
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 60px;
  align-items: center;
}

.hero-text .eyebrow {
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--saffron);
  margin-bottom: 24px;
  font-weight: 500;
  overflow: hidden;
}
.eyebrow-caret {
  display: inline-block;
  width: 10px; height: 1.5px;
  background: var(--saffron);
  vertical-align: middle;
  margin-right: 12px;
}

.hero-title {
  font-family: var(--font-display);
  font-size: clamp(56px, 8vw, 120px);
  line-height: 0.95;
  font-weight: 500;
  color: var(--pepper);
  letter-spacing: -0.02em;
  margin-bottom: 32px;
  position: relative;
}
.hero-title .the {
  font-style: italic;
  font-weight: 300;
  color: var(--cinnamon);
  display: block;
  font-size: 0.55em;
  margin-bottom: 8px;
  letter-spacing: 0.05em;
}
.hero-title .spice {
  color: var(--saffron);
  position: relative;
  display: inline-block;
}
/* Shimmer sweep */
.hero-title .spice::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 60%; height: 100%;
  background: linear-gradient(
    110deg,
    transparent 0%,
    rgba(255, 240, 200, 0.6) 50%,
    transparent 100%
  );
  animation: shimmer 4.5s ease-in-out infinite;
  animation-delay: 1.5s;
}
@keyframes shimmer {
  0% { left: -100%; }
  55% { left: 160%; }
  100% { left: 160%; }
}

.hero-subtitle {
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.7;
  color: var(--pepper-soft);
  max-width: 480px;
  margin-bottom: 40px;
  font-weight: 300;
}
.hero-subtitle .typewriter-cursor {
  display: inline-block;
  width: 2px;
  background: var(--saffron);
  margin-left: 2px;
  animation: blink 1s step-end infinite;
}
@keyframes blink {
  50% { opacity: 0; }
}

.hero-cta {
  display: flex;
  gap: 16px;
  align-items: center;
  flex-wrap: wrap;
}
.btn-primary {
  font-family: var(--font-display);
  font-size: 15px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 16px 36px;
  background: var(--pepper);
  color: var(--cardamom);
  border: none;
  cursor: none;
  position: relative;
  overflow: hidden;
  transition: all 0.4s ease;
  font-weight: 500;
}
.btn-primary::before {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 0; height: 0;
  background: var(--saffron);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: width 0.6s ease, height 0.6s ease;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(32, 24, 15, 0.25); }
.btn-primary:hover::before { width: 300px; height: 300px; }
.btn-primary span { position: relative; z-index: 1; }

.btn-ghost {
  font-family: var(--font-display);
  font-size: 15px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 16px 36px;
  background: transparent;
  color: var(--pepper);
  border: 1.5px solid var(--pepper);
  cursor: none;
  transition: all 0.4s ease;
  font-weight: 500;
}
.btn-ghost:hover {
  background: var(--pepper);
  color: var(--cardamom);
  transform: translateY(-2px);
}

/* Hero map side */
.hero-map-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  max-width: 520px;
  margin-left: auto;
}
.hero-map {
  width: 100%;
  height: 100%;
  position: relative;
  will-change: transform;
}
.hero-map svg {
  width: 100%; height: 100%;
  display: block;
}
.map-land { fill: rgba(107, 63, 35, 0.15); stroke: var(--cinnamon); stroke-width: 0.5; }
.map-sea { fill: rgba(233, 180, 76, 0.08); }
.map-route {
  fill: none;
  stroke: var(--saffron);
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-dasharray: 8 6;
  stroke-dashoffset: 1000;
  filter: drop-shadow(0 0 4px rgba(232, 89, 12, 0.5));
  animation: routeDraw 6s ease-out forwards;
  animation-delay: 0.8s;
}
@keyframes routeDraw {
  to { stroke-dashoffset: 0; }
}
.port-marker {
  fill: var(--saffron);
  animation: portPulse 2.5s ease-in-out infinite;
  transform-origin: center;
  transform-box: fill-box;
}
.port-marker.p2 { animation-delay: 0.6s; }
.port-marker.p3 { animation-delay: 1.2s; }
.port-marker.p4 { animation-delay: 1.8s; }
@keyframes portPulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.8); opacity: 0.4; }
}
.port-label {
  font-family: var(--font-display);
  font-size: 11px;
  fill: var(--cinnamon-deep);
  font-style: italic;
  letter-spacing: 0.06em;
}
.dhow-ship {
  animation: shipSail 6s linear forwards;
  animation-delay: 0.8s;
  transform-origin: center;
}
@keyframes shipSail {
  from { offset-distance: 0%; }
  to { offset-distance: 100%; }
}

.compass {
  position: absolute;
  bottom: 20px; right: 20px;
  width: 70px; height: 70px;
  border: 1.5px solid var(--cinnamon);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--cinnamon-deep);
  background: rgba(250, 243, 227, 0.7);
  backdrop-filter: blur(4px);
}
.compass::before {
  content: '';
  position: absolute;
  width: 2px; height: 26px;
  background: linear-gradient(to bottom, var(--saffron) 50%, var(--cinnamon) 50%);
  animation: compassSpin 12s linear infinite;
}
@keyframes compassSpin {
  0%, 100% { transform: rotate(-8deg); }
  50% { transform: rotate(8deg); }
}
.compass span {
  position: absolute;
  font-size: 9px;
  font-weight: 600;
}
.compass .n { top: 4px; color: var(--saffron); }
.compass .s { bottom: 4px; }
.compass .e { right: 6px; }
.compass .w { left: 6px; }

/* ===== Section shared ===== */
.section {
  padding: 120px 48px;
  position: relative;
}
.section-inner {
  max-width: 1200px;
  margin: 0 auto;
}
.section-label {
  font-family: var(--font-display);
  font-size: 13px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--saffron);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.section-label::before {
  content: '';
  width: 40px; height: 1px;
  background: var(--saffron);
}
.section-title {
  font-family: var(--font-display);
  font-size: clamp(40px, 5vw, 68px);
  line-height: 1.05;
  font-weight: 500;
  color: var(--pepper);
  margin-bottom: 24px;
  letter-spacing: -0.01em;
}
.section-title em {
  font-style: italic;
  color: var(--cinnamon);
  font-weight: 400;
}
.section-desc {
  font-size: 17px;
  color: var(--pepper-soft);
  max-width: 580px;
  line-height: 1.7;
  font-weight: 300;
  margin-bottom: 60px;
}

/* Scroll reveal */
.reveal {
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 0.9s var(--easing-smooth), transform 0.9s var(--easing-smooth);
}
.reveal.in-view {
  opacity: 1;
  transform: translateY(0);
}
.reveal.delay-1 { transition-delay: 0.1s; }
.reveal.delay-2 { transition-delay: 0.2s; }
.reveal.delay-3 { transition-delay: 0.3s; }
.reveal.delay-4 { transition-delay: 0.4s; }
.reveal.delay-5 { transition-delay: 0.5s; }

/* ===== Spice Gallery ===== */
.spice-section {
  background: var(--cardamom-mid);
  position: relative;
}
.spice-section::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 60px;
  background: linear-gradient(to bottom, var(--cardamom), transparent);
}

.spice-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 28px;
  margin-top: 40px;
}

.spice-card {
  position: relative;
  background: var(--cardamom);
  border: 1px solid rgba(107, 63, 35, 0.18);
  padding: 28px 24px;
  cursor: none;
  transition: box-shadow 0.5s ease, border-color 0.4s ease;
  transform-style: preserve-3d;
  perspective: 1000px;
  will-change: transform;
  overflow: hidden;
}
.spice-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.15) 50%, transparent 60%);
  transform: translateX(-100%);
  transition: transform 0.8s ease;
  pointer-events: none;
}
.spice-card:hover {
  box-shadow:
    0 20px 50px rgba(107, 63, 35, 0.25),
    0 0 0 1px var(--saffron);
  border-color: var(--saffron);
}
.spice-card:hover::before { transform: translateX(100%); }

.spice-icon {
  width: 56px; height: 56px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
  font-size: 26px;
  position: relative;
}
.spice-icon.saffron { background: rgba(232, 89, 12, 0.15); color: var(--saffron); }
.spice-icon.cinnamon { background: rgba(107, 63, 35, 0.15); color: var(--cinnamon); }
.spice-icon.cardamom { background: rgba(233, 180, 76, 0.2); color: var(--turmeric-deep); }
.spice-icon.turmeric { background: rgba(233, 180, 76, 0.25); color: var(--turmeric-deep); }
.spice-icon.pepper { background: rgba(32, 24, 15, 0.15); color: var(--pepper); }
.spice-icon.clove { background: rgba(107, 63, 35, 0.2); color: var(--cinnamon-deep); }
.spice-icon.nutmeg { background: rgba(107, 63, 35, 0.18); color: var(--cinnamon); }
.spice-icon.staranise { background: rgba(232, 89, 12, 0.18); color: var(--saffron-deep); }

.spice-name {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 600;
  color: var(--pepper);
  margin-bottom: 4px;
  letter-spacing: -0.01em;
}
.spice-latin {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 13px;
  color: var(--cinnamon);
  margin-bottom: 16px;
  letter-spacing: 0.03em;
}
.spice-desc {
  font-size: 14px;
  color: var(--pepper-soft);
  line-height: 1.6;
  margin-bottom: 16px;
  font-weight: 300;
}
.spice-meta {
  display: flex;
  gap: 16px;
  padding-top: 16px;
  border-top: 1px solid rgba(107, 63, 35, 0.12);
  font-size: 12px;
  color: var(--cinnamon);
  font-family: var(--font-display);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.spice-meta strong {
  display: block;
  color: var(--pepper);
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 2px;
  letter-spacing: 0;
  text-transform: none;
  font-family: var(--font-body);
}
.spice-expand {
  margin-top: 16px;
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--saffron);
  font-family: var(--font-display);
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: gap 0.3s ease;
}
.spice-card:hover .spice-expand { gap: 12px; }

/* ===== Spice detail modal ===== */
.spice-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(32, 24, 15, 0.7);
  backdrop-filter: blur(6px);
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}
.spice-modal-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.spice-modal {
  background: var(--cardamom);
  max-width: 680px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  padding: 48px;
  position: relative;
  transform: translateY(30px) scale(0.95);
  transition: transform 0.5s var(--easing-spring);
  border: 1px solid rgba(107, 63, 35, 0.2);
}
.spice-modal-overlay.open .spice-modal {
  transform: translateY(0) scale(1);
}
.spice-modal-close {
  position: absolute;
  top: 20px; right: 20px;
  width: 36px; height: 36px;
  border: 1.5px solid var(--pepper);
  background: transparent;
  color: var(--pepper);
  cursor: none;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
}
.spice-modal-close:hover {
  background: var(--pepper);
  color: var(--cardamom);
  transform: rotate(90deg);
}
.spice-modal-header {
  display: flex;
  align-items: center;
  gap: 24px;
  margin-bottom: 32px;
  padding-bottom: 24px;
  border-bottom: 1px solid rgba(107, 63, 35, 0.15);
}
.spice-modal-icon {
  width: 80px; height: 80px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  flex-shrink: 0;
}
.spice-modal h2 {
  font-family: var(--font-display);
  font-size: 44px;
  font-weight: 600;
  color: var(--pepper);
  letter-spacing: -0.01em;
}
.spice-modal .latin {
  font-family: var(--font-display);
  font-style: italic;
  color: var(--cinnamon);
  font-size: 16px;
}
.modal-section { margin-bottom: 28px; }
.modal-section h3 {
  font-family: var(--font-display);
  font-size: 13px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--saffron);
  margin-bottom: 10px;
  font-weight: 600;
}
.modal-section p {
  font-size: 15px;
  color: var(--pepper-soft);
  line-height: 1.7;
  font-weight: 300;
}
.modal-flavor-profile {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}
.flavor-tag {
  padding: 6px 14px;
  background: rgba(233, 180, 76, 0.2);

// Scroll reveal via IntersectionObserver
function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });
    els.forEach(el => observer.observe(el));
    return () => observer.disconnect();
  }, []);
}

// Number counter with RAF and visibility handling
function useCounter(target, ref, duration = 2000, start = false) {
  useEffect(() => {
    if (!start || !ref.current) return;
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReduced) {
      ref.current.textContent = target.toLocaleString();
      return;
    }

    let rafId = null;
    let startTime = null;
    let pausedAt = null;

    const step = (timestamp) => {
      if (!startTime) startTime = timestamp;
      const progress = Math.min((timestamp - startTime) / duration, 1);
      // easeOutCubic
      const eased = 1 - Math.pow(1 - progress, 3);
      const current = Math.floor(eased * target);
      if (ref.current) ref.current.textContent = current.toLocaleString();
      if (progress < 1) rafId = requestAnimationFrame(step);
    };

    const handleVisibility = () => {
      if (document.hidden) {
        if (rafId) {
          cancelAnimationFrame(rafId);
          pausedAt = performance.now();
        }
      } else {
        if (pausedAt && startTime) {
          startTime += performance.now() - pausedAt;
          rafId = requestAnimationFrame(step);
          pausedAt = null;
        }
      }
    };

    document.addEventListener('visibilitychange', handleVisibility);
    rafId = requestAnimationFrame(step);

    return () => {
      if (rafId) cancelAnimationFrame(rafId);
      document.removeEventListener('visibilitychange', handleVisibility);
    };
  }, [target, ref, duration, start]);
}

    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      setTyped(fullText);

    let i = 0;

      if (i < fullText.length) {
        setTyped(fullText.slice(0, i + 1));
        i++;
        timeoutId = setTimeout(type, 22 + Math.random() * 28);

    // Start after a brief delay

    return () => {

function SpiceCard({ spice, onOpen }) {
  const cardRef = useRef(null);

  // 3D tilt on mousemove — direct DOM, no setState
  useEffect(() => {
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReduced) return;

    const card = cardRef.current;
    if (!card) return;

    let rafId = null;
    let targetRX = 0, targetRY = 0;
    let currentRX = 0, currentRY = 0;

    const handleMove = (e) => {
      const rect = card.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      targetRY = (x - 0.5) * 10;
      targetRX = (0.5 - y) * 10;
      if (!rafId) rafId = requestAnimationFrame(animate);
    };

    const animate = () => {
      currentRX += (targetRX - currentRX) * 0.12;
      currentRY += (targetRY - currentRY) * 0.12;
      card.style.transform = `perspective(800px) rotateX(${currentRX}deg) rotateY(${currentRY}deg) translateY(-4px)`;
      if (Math.abs(targetRX - currentRX) > 0.05 || Math.abs(targetRY - currentRY) > 0.05) {
        rafId = requestAnimationFrame(animate);
      } else {
        rafId = null;
      }
    };

    const handleLeave = () => {
      targetRX = 0;
      targetRY = 0;
      if (!rafId) rafId = requestAnimationFrame(animate);
    };

    card.addEventListener('mousemove', handleMove);
    card.addEventListener('mouseleave', handleLeave);

    return () => {
      card.removeEventListener('mousemove', handleMove);
      card.removeEventListener('mouseleave', handleLeave);
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, []);

  return (
    <div
      className="spice-card reveal"
      ref={cardRef}
      data-interactive
      onClick={() => onOpen(spice)}
    >
      <div className={`spice-icon ${spice.iconClass}`}>{spice.icon}</div>
      <h3 className="spice-name">{spice.name}</h3>
      <div className="spice-latin">{spice.latin}</div>
      <p className="spice-desc">{spice.desc}</p>
      <div className="spice-meta">
        <div>
          <strong>Origin</strong>
          {spice.origin}
        </div>
        <div>
          <strong>Taste</strong>
          {spice.flavor.split(' · ')[0]}
        </div>
      </div>
      <div className="spice-expand">
        Read Story →
      </div>
    </div>
  );
}

function TradeRoute() {
  const sectionRef = useRef(null);
  const pathRef = useRef(null);
  const [progress, setProgress] = useState(0);

  useEffect(() => {
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const section = sectionRef.current;
    const path = pathRef.current;
    if (!section || !path) return;

    if (prefersReduced) {
      setProgress(1);
      return;
    }

    let rafId = null;
    let targetProgress = 0;
    let currentProgress = 0;

    const updateProgress = () => {
      const rect = section.getBoundingClientRect();
      const vh = window.innerHeight;
      // progress from 0 (section bottom at top of viewport) to 1 (section top at bottom)
      const scrolled = (vh - rect.top) / (vh + rect.height);
      targetProgress = Math.max(0, Math.min(1, scrolled));
      if (!rafId) rafId = requestAnimationFrame(animate);
    };

    const animate = () => {
      currentProgress += (targetProgress - currentProgress) * 0.06;
      setProgress(currentProgress);
      // dash offset for route drawing
      if (path) {
        const len = path.getTotalLength();
        path.style.strokeDasharray = `${len * currentProgress} ${len}`;
      }
      if (Math.abs(targetProgress - currentProgress) > 0.001) {
        rafId = requestAnimationFrame(animate);
      } else {
        rafId = null;
      }
    };

    const handleVisibility = () => {
      if (document.hidden && rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    };

    window.addEventListener('scroll', updateProgress, { passive: true });
    window.addEventListener('resize', updateProgress);
    document.addEventListener('visibilitychange', handleVisibility);
    updateProgress();

    return () => {
      window.removeEventListener('scroll', updateProgress);
      window.removeEventListener('resize', updateProgress);
      document.removeEventListener('visibilitychange', handleVisibility);
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, []);

function SpiceWheel() {
  const [activeIndex, setActiveIndex] = useState(0);
  const [rotation, setRotation] = useState(0);
  const containerRef = useRef(null);
  const isDragging = useRef(false);
  const lastAngle = useRef(0);
  const rotationRef = useRef(0);
  const rafRef = useRef(null);
  const targetRotation = useRef(0);

  const active = SPICES[activeIndex];

  // Smooth rotation with damped follow (direct DOM)
  useEffect(() => {
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReduced) return;
    const svg = containerRef.current?.querySelector('.wheel-svg');
    if (!svg) return;

    const animate = () => {
      rotationRef.current += (targetRotation.current - rotationRef.current) * 0.1;
      svg.style.transform = `rotate(${rotationRef.current}deg)`;
      if (Math.abs(targetRotation.current - rotationRef.current) > 0.05) {
        rafRef.current = requestAnimationFrame(animate);
      } else {
        rafRef.current = null;
      }
    };

    // initial animation
    targetRotation.current = 0;
    if (!rafRef.current) rafRef.current = requestAnimationFrame(animate);

    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, []);

  // Auto-rotate slowly when idle
  useEffect(() => {
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReduced) return;
    if (isDragging.current) return;

    let rafId = null;
    let lastT = null;

    const tick = (t) => {
      if (!lastT) lastT = t;
      const dt = (t - lastT) / 1000;
      lastT = t;
      if (!isDragging.current) {
        targetRotation.current += dt * 3; // 3 deg/sec
        if (!rafRef.current && containerRef.current?.querySelector('.wheel-svg')) {
          const svg = containerRef.current.querySelector('.wheel-svg');
          const animate = () => {
            rotationRef.current += (targetRotation.current - rotationRef.current) * 0.05;
            svg.style.transform = `rotate(${rotationRef.current}deg)`;
            if (Math.abs(targetRotation.current - rotationRef.current) > 0.01) {
              rafRef.current = requestAnimationFrame(animate);
            } else {
              rafRef.current = null;
            }
          };
          rafRef.current = requestAnimationFrame(animate);
        }
      }
      rafId = requestAnimationFrame(tick);
    };
    rafId = requestAnimationFrame(tick);

    const handleVisibility = () => {
      if (document.hidden) {
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      } else {
        lastT = null;
        if (!rafId) rafId = requestAnimationFrame(tick);
      }
    };
    document.addEventListener('visibilitychange', handleVisibility);

    return () => {
      if (rafId) cancelAnimationFrame(rafId);
      document.removeEventListener('visibilitychange', handleVisibility);
    };
  }, []);

  // Drag / rotate interaction
  const getAngle = useCallback((clientX, clientY) => {
    const el = containerRef.current;
    if (!el) return 0;
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    return Math.atan2(clientY - cy, clientX - cx) * (180 / Math.PI);
  }, []);

  const handleStart = useCallback((e) => {
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    isDragging.current = true;
    lastAngle.current = getAngle(clientX, clientY);
  }, [getAngle]);

  const handleMove = useCallback((e) => {
    if (!isDragging.current) return;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const angle = getAngle(clientX, clientY);
    const delta = angle - lastAngle.current;
    lastAngle.current = angle;
    targetRotation.current += delta;

    // determine active segment based on rotation
    const normalized = ((targetRotation.current % 360) + 360) % 360;
    const segAngle = 360 / SPICES.length;
    // segments are placed at angles 0, segAngle, 2*segAngle... centered on their midpoint
    // center of segment i is at i * segAngle (original position before rotation)
    // after rotation R, the segment at top (angle = -90deg or 270deg) is the one where
    // (i * segAngle + R) mod 360 is closest to 270 (top position)
    const topAngle = 270;
    let closestIdx = 0;
    let minDiff = 360;
    for (let i = 0; i < SPICES.length; i++) {
      const segCenter = (i * segAngle + normalized) % 360;
      let diff = Math.abs(segCenter - topAngle);
      if (diff > 180) diff = 360 - diff;
      if (diff < minDiff) { minDiff = diff; closestIdx = i; }
    }
    if (closestIdx !== activeIndex) setActiveIndex(closestIdx);

    e.preventDefault();
  }, [getAngle, activeIndex]);

  const handleEnd = useCallback(() => {
    isDragging.current = false;
    // snap to nearest segment
    const segAngle = 360 / SPICES.length;
    const targetSnap = activeIndex * segAngle;
    const currentMod = ((targetRotation.current % 360) + 360) % 360;
    let diff = targetSnap - currentMod;
    if (diff > 180) diff -= 360;
    if (diff < -180) diff += 360;
    targetRotation.current += diff;
  }, [activeIndex]);

  useEffect(() => {
    const container = containerRef.current;
    if (!container) return;

    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);
    window.addEventListener('touchmove', handleMove, { passive: false });
    window.addEventListener('touchend', handleEnd);

    return () => {
      window.removeEventListener('mousemove', handleMove);
      window.removeEventListener('mouseup', handleEnd);
      window.removeEventListener('touchmove', handleMove);
      window.removeEventListener('touchend', handleEnd);
    };
  }, [handleMove, handleEnd]);

  // Build wheel segments
  const segAngle = 360 / SPICES.length;
  const segments = SPICES.map((spice, i) => {
    const startAngle = i * segAngle - 90 - segAngle / 2;
    const endAngle = startAngle + segAngle;
    const startRad = (startAngle * Math.PI) / 180;
    const endRad = (endAngle * Math.PI) / 180;
    const rOuter = 180;
    const rInner = 90;
    const x1 = 200 + rOuter * Math.cos(startRad);
    const y1 = 200 + rOuter * Math.sin(startRad);
    const x2 = 200 + rOuter * Math.cos(endRad);
    const y2 = 200 + rOuter * Math.sin(endRad);
    const x3 = 200 + rInner * Math.cos(endRad);
    const y3 = 200 + rInner * Math.sin(endRad);
    const x4 = 200 + rInner * Math.cos(startRad);
    const y4 = 200 + rInner * Math.sin(startRad);
    const largeArc = segAngle > 180 ? 1 : 0;
    const d = `M ${x1} ${y1} A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${x2} ${y2} L ${x3} ${y3} A ${rInner} ${rInner} 0 ${largeArc} 0 ${x4} ${y4} Z`;

    // label position
    const midRad = ((startAngle + endAngle) / 2 * Math.PI) / 180;
    const labelR = (rOuter + rInner) / 2;
    const lx = 200 + labelR * Math.cos(midRad);
    const ly = 200 + labelR * Math.sin(midRad);

    return { d, spice, lx, ly, i };
  });

  return (
    <section className="wheel-section" id="wheel">
      <div className="section-inner">
        <div className="section-label reveal">Chapter III</div>
        <h2 className="section-title reveal delay-1">
          The <em>Chromatic</em> Wheel
        </h2>
        <p className="section-desc reveal delay-2">
          Every spice carries a color and a character. Spin the wheel, meet each one, and discover how a single hue can evoke an entire coastline.
        </p>

        <div className="wheel-container">
          <div
            className="wheel-stage"
            ref={containerRef}
            data-interactive
            onMouseDown={handleStart}
            onTouchStart={handleStart}
          >
            <svg className="wheel-svg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
              <defs>
                {SPICES.map((s, i) => (
                  <filter key={i} id={`wglow-${i}`}>
                    <feGaussianBlur stdDeviation="2" />
                  </filter>
                ))}
              </defs>

              {/* Outer ring */}
              <circle cx="200" cy="200" r="190" fill="none" stroke="rgba(107,63,35,0.2)" strokeWidth="1" />

              {/* Segments */}
              {segments.map((seg) => (
                <g key={seg.spice.id}>
                  <path
                    d={seg.d}
                    fill={seg.spice.color}
                    opacity={activeIndex === seg.i ? 1 : 0.85}
                    stroke="rgba(250,243,227,0.3)"
                    strokeWidth="1"
                    style={{ transition: 'opacity 0.3s ease', cursor: 'none' }}
                  />
                  <text
                    x={seg.lx}
                    y={seg.ly}
                    textAnchor="middle"
                    dominantBaseline="middle"
                    fill="white"
                    fontFamily="Cormorant Garamond, serif"
                    fontSize="14"
                    fontWeight="600"
                    letterSpacing="1"
                    transform={`rotate(${(seg.i * segAngle)} ${seg.lx} ${seg.ly})`}
                    style={{ pointerEvents: 'none' }}
                  >
                    {seg.spice.name}
                  </text>
                </g>
              ))}

              {/* Inner circle */}
              <circle cx="200" cy="200" r="80" fill="#FAF3E3" stroke="rgba(107,63,35,0.3)" strokeWidth="1.5" />
              <circle cx="200" cy="200" r="70" fill="none" stroke="rgba(107,63,35,0.1)" strokeWidth="1" strokeDasharray="4 4" />
            </svg>

            <div className="wheel-center">
              <div className="wheel-center-title" style={{ color: active.color }}>{active.icon}</div>
              <div className="wheel-center-sub">{active.name}</div>
            </div>
          </div>

          <div className="wheel-info reveal delay-2">
            <h3>{active.name}</h3>
            <div className="w-latin">{active.latin}</div>
            <p>{active.history}</p>
            <div className="wheel-stats">
              <div className="wheel-stat">
                <div className="stat-label">Origin</div>
                <div className="stat-value">{active.origin}</div>
              </div>
              <div className="wheel-stat">
                <div className="stat-label">Weight</div>
                <div className="stat-value">{active.weight}</div>
              </div>
            </div>
            <div className="wheel-hint">
              Drag to rotate the wheel and explore each spice
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

/* ================================================================
   NUMBERS / ANECDOTES
   ================================================================ */

function NumberCard({ data, index }) {
  const valueRef = useRef(null);
  const [inView, setInView] = useState(false);
  const cardRef = useRef(null);

  useEffect(() => {
    const el = cardRef.current;
    if (!el) return;
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          setInView(true);
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.5 });
    observer.observe(el);
    return () => observer.disconnect();
  }, []);

  useCounter(data.value, valueRef, 2200 + index * 200, inView);

  return (
    <div className="number-card reveal" ref={cardRef} style={{ transitionDelay: `${index * 0.1}s` }}>
      <div className="number-value">
        <span ref={valueRef}>0</span>
        <span className="unit">{data.unit}</span>
      </div>
      <div className="number-label">{data.label}</div>
      <div className="number-note">{data.note}</div>
    </div>
  );
}

  return (

/* ================================================================
   CUSTOM CURSOR (imperative, direct DOM)
   ================================================================ */

function initCursor() {
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (prefersReduced) return;

  const dot = document.getElementById('cursorDot');
  const ring = document.getElementById('cursorRing');
  const glow = document.getElementById('cursorGlow');

  // Initialize at screen center immediately
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  dot.style.transform = `translate(${cx}px, ${cy}px) translate(-50%, -50%)`;
  ring.style.transform = `translate(${cx}px, ${cy}px) translate(-50%, -50%)`;
  glow.style.transform = `translate(${cx}px, ${cy}px) translate(-50%, -50%)`;

  let mouseX = cx, mouseY = cy;
  let ringX = cx, ringY = cy;
  let glowX = cx, glowY = cy;
  let rafId = null;

  const animate = () => {
    // Damped follow — different speeds per layer
    ringX += (mouseX - ringX) * 0.18;
    ringY += (mouseY - ringY) * 0.18;
    glowX += (mouseX - glowX) * 0.08;
    glowY += (mouseY - glowY) * 0.08;

    dot.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
    ring.style.transform = `translate(${ringX}px, ${ringY}px) translate(-50%, -50%)`;
    glow.style.transform = `translate(${glowX}px, ${glowY}px) translate(-50%, -50%)`;

    rafId = requestAnimationFrame(animate);
  };
  rafId = requestAnimationFrame(animate);

  const handleMove = (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  };

  const handleVisibility = () => {
    if (document.hidden) {
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    } else {
      if (!rafId) rafId = requestAnimationFrame(animate);
    }
  };

  document.addEventListener('mousemove', handleMove);
  document.addEventListener('visibilitychange', handleVisibility);

  // Hover state on interactive elements
  const handleOver = (e) => {
    if (e.target.closest('[data-interactive], a, button, input, .spice-card, .port-card, .wheel-stage')) {
      document.body.classList.add('cursor-hover');
    }
  };
  const handleOut = (e) => {
    if (e.target.closest('[data-interactive], a, button, input, .spice-card, .port-card, .wheel-stage')) {
      document.body.classList.remove('cursor-hover');
    }
  };

  document.addEventListener('mouseover', handleOver);
  document.addEventListener('mouseout', handleOut);

  // Click ripple
  const handleClick = (e) => {
    document.body.classList.add('cursor-click');
    setTimeout(() => document.body.classList.remove('cursor-click'), 200);

    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = `${e.clientX}px`;
    ripple.style.top = `${e.clientY}px`;
    ripple.style.width = '50px';
    ripple.style.height = '50px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 700);
  };
  document.addEventListener('click', handleClick);

  // Cleanup on unload
  window.addEventListener('beforeunload', () => {
    if (rafId) cancelAnimationFrame(rafId);
    document.removeEventListener('mousemove', handleMove);
    document.removeEventListener('visibilitychange', handleVisibility);
    document.removeEventListener('mouseover', handleOver);
    document.removeEventListener('mouseout', handleOut);
    document.removeEventListener('click', handleClick);
  });

  return () => {
    if (rafId) cancelAnimationFrame(rafId);
    document.removeEventListener('mousemove', handleMove);
    document.removeEventListener('visibilitychange', handleVisibility);
    document.removeEventListener('mouseover', handleOver);
    document.removeEventListener('mouseout', handleOut);
    document.removeEventListener('click', handleClick);
  };
}

/* ================================================================
   FLOATING SPICE PARTICLES
   ================================================================ */

function initParticles() {
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (prefersReduced) return;

  const particles = [];
  const chars = ['●', '✦', '❋', '◉', '❀', '✺'];
  const colors = ['#E8590C', '#6B3F23', '#E9B44C', '#C74A08', '#B87333'];
  const count = 14;

  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'particle';
    el.textContent = chars[Math.floor(Math.random() * chars.length)];
    el.style.color = colors[Math.floor(Math.random() * colors.length)];
    document.body.appendChild(el);

    particles.push({
      el,
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: (Math.random() - 0.5) * 0.3,
      vy: -(0.2 + Math.random() * 0.5),
      size: 10 + Math.random() * 18,
      rot: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 0.8,
      opacity: 0.15 + Math.random() * 0.25,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.005 + Math.random() * 0.01,
    });
    el.style.fontSize = `${particles[i].size}px`;
    el.style.opacity = particles[i].opacity;
  }

  let rafId = null;
  let lastTime = null;

  const animate = (t) => {
    if (!lastTime) lastTime = t;
    const dt = t - lastTime;
    lastTime = t;

    particles.forEach((p) => {
      p.sway += p.swaySpeed * dt;
      p.x += p.vx + Math.sin(p.sway) * 0.3;
      p.y += p.vy;
      p.rot += p.rotSpeed;

      // wrap around
      if (p.y < -30) {
        p.y = window.innerHeight + 30;
        p.x = Math.random() * window.innerWidth;
      }
      if (p.x < -30) p.x = window.innerWidth + 30;
      if (p.x > window.innerWidth + 30) p.x = -30;

      p.el.style.transform = `translate(${p.x}px, ${p.y}px) rotate(${p.rot}deg)`;
    });

    rafId = requestAnimationFrame(animate);
  };
  rafId = requestAnimationFrame(animate);

  const handleVisibility = () => {
    if (document.hidden) {
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; lastTime = null; }
    } else {
      if (!rafId) rafId = requestAnimationFrame(animate);
    }
  };
  document.addEventListener('visibilitychange', handleVisibility);

  window.addEventListener('beforeunload', () => {
    if (rafId) cancelAnimationFrame(rafId);
    document.removeEventListener('visibilitychange', handleVisibility);
  });
}

/* ================================================================
   APP
   ================================================================ */

function App() {
  useReveal();

  useEffect(() => {
    const cleanupCursor = initCursor();
    initParticles();

    // Announce upgrade capability
    const announceUpgrade = () => {
      window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    };
    announceUpgrade();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announceUpgrade, { once: true });
    }

    return () => {
      if (cleanupCursor) cleanupCursor();
    };
  }, []);

  return (
    <>
      <Nav />
      <Hero />
      <SpiceGallery />
      <TradeRoute />
      <SpiceWheel />
      <NumbersSection />
      <Closing />
      <footer className="footer">
        The Spice Route · An Interactive Journal · <span>Volume I</span>
      </footer>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

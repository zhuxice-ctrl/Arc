<style>
  /* ===== Design Tokens (CSS variables for live tweaking) ===== */
  :root {
    --bg-deep: #0a0a0f;
    --bg-mid: #14141c;
    --bg-soft: #1c1c28;
    --text-moon: #f0ede6;
    --text-dim: #a8a59c;
    --text-mute: #6b6963;
    --accent-lava: #ff6b2c;
    --accent-lava-soft: #ff8a55;
    --accent-lava-deep: #cc4a10;
    --brass: #c9a35a;
    --brass-light: #e0c380;
    --brass-deep: #8a7238;
    --border-soft: rgba(201, 163, 90, 0.18);
    --border-med: rgba(201, 163, 90, 0.35);
    --glow-lava: rgba(255, 107, 44, 0.5);
    --glow-brass: rgba(201, 163, 90, 0.4);
    --cursor-size: 20px;
    --cursor-dot: 5px;
    --effect-intensity: 1;
    --star-density: 1;
    --orbit-speed: 1;
    --cursor-enabled: 1;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    background: var(--bg-deep);
  }

  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 300;
    color: var(--text-moon);
    background: var(--bg-deep);
    overflow-x: hidden;
    cursor: none;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* Disable custom cursor on touch devices */
  @media (hover: none) and (pointer: coarse) {
    body { cursor: auto; }
    .cursor, .cursor-dot, .cursor-ring { display: none !important; }
  }

  /* ===== Custom Cursor ===== */
  .cursor-ring {
    position: fixed;
    width: var(--cursor-size);
    height: var(--cursor-size);
    border: 2px solid var(--text-moon);
    border-radius: 50%;
    pointer-events: none;
    z-index: 2147483647;
    transform: translate(-50%, -50%);
    transition: width 0.25s cubic-bezier(0.17, 0.67, 0.3, 1.33),
                height 0.25s cubic-bezier(0.17, 0.67, 0.3, 1.33),
                border-color 0.3s ease,
                opacity 0.3s ease;
    mix-blend-mode: difference;
    box-shadow: 0 0 12px var(--glow-lava), 0 0 24px var(--glow-brass);
    will-change: transform, width, height;
  }

  .cursor-dot {
    position: fixed;
    width: var(--cursor-dot);
    height: var(--cursor-dot);
    background: var(--accent-lava);
    border-radius: 50%;
    pointer-events: none;
    z-index: 2147483647;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px var(--glow-lava), 0 0 16px var(--accent-lava);
    will-change: transform;
  }

  .cursor-ring.hovering {
    width: 48px;
    height: 48px;
    border-color: var(--accent-lava);
  }

  .cursor-ring.clicking {
    width: 14px;
    height: 14px;
    border-color: var(--brass-light);
  }

  .cursor-dot.clicking {
    width: 2px;
    height: 2px;
  }

  .cursor-ripple {
    position: fixed;
    width: 20px;
    height: 20px;
    border: 1.5px solid var(--accent-lava);
    border-radius: 50%;
    pointer-events: none;
    z-index: 2147483646;
    transform: translate(-50%, -50%);
    animation: rippleExpand 0.7s ease-out forwards;
    opacity: 0.9;
  }

  @keyframes rippleExpand {
    0% { width: 20px; height: 20px; opacity: 0.9; border-width: 2px; }
    100% { width: 80px; height: 80px; opacity: 0; border-width: 0.5px; }
  }

  /* ===== Starfield Canvas ===== */
  .starfield-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* ===== Navigation ===== */
  .nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding: 24px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(to bottom, rgba(10, 10, 15, 0.9), transparent);
    backdrop-filter: blur(8px);
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'Noto Serif SC', serif;
    font-weight: 500;
    font-size: 20px;
    letter-spacing: 0.15em;
    color: var(--text-moon);
  }

  .nav-logo-mark {
    width: 32px;
    height: 32px;
    position: relative;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 36px;
    list-style: none;
  }

  .nav-link {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    position: relative;
    cursor: pointer;
    transition: color 0.3s ease;
    padding: 4px 0;
  }

  .nav-link::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0;
    height: 1px;
    background: var(--accent-lava);
    transition: width 0.3s ease;
  }

  .nav-link:hover {
    color: var(--text-moon);
  }

  .nav-link:hover::after {
    width: 100%;
  }

  .nav-link.active {
    color: var(--text-moon);
  }

  .nav-link.active::after {
    width: 100%;
  }

  .nav-cta {
    padding: 10px 22px;
    border: 1px solid var(--border-med);
    border-radius: 2px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--brass-light);
    background: transparent;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .nav-cta::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, var(--glow-lava), transparent);
    transition: left 0.5s ease;
  }

  .nav-cta:hover {
    border-color: var(--accent-lava);
    color: var(--text-moon);
    background: rgba(255, 107, 44, 0.1);
    box-shadow: 0 0 20px var(--glow-lava);
  }

  .nav-cta:hover::before {
    left: 100%;
  }

  /* ===== Hero Section ===== */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 120px 24px 80px;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 900px;
  }

  .hero-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 28px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }

  .hero-eyebrow::before,
  .hero-eyebrow::after {
    content: '';
    width: 32px;
    height: 1px;
    background: var(--brass);
    opacity: 0.5;
  }

  .hero-title {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(48px, 8vw, 104px);
    font-weight: 300;
    line-height: 1.05;
    letter-spacing: 0.08em;
    color: var(--text-moon);
    margin-bottom: 24px;
    text-wrap: pretty;
  }

  .hero-title strong {
    font-weight: 700;
    color: var(--accent-lava);
    font-style: italic;
  }

  .hero-subtitle {
    font-size: 16px;
    line-height: 1.8;
    color: var(--text-dim);
    max-width: 520px;
    margin: 0 auto 48px;
    font-weight: 300;
    letter-spacing: 0.03em;
  }

  .hero-subtitle .type-caret {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--accent-lava);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .hero-actions {
    display: flex;
    gap: 16px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn-primary {
    padding: 16px 36px;
    background: var(--accent-lava);
    color: var(--bg-deep);
    border: none;
    border-radius: 2px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
  }

  .btn-primary:hover {
    background: var(--accent-lava-soft);
    box-shadow: 0 0 32px var(--glow-lava);
    transform: translateY(-2px);
  }

  .btn-ghost {
    padding: 16px 36px;
    background: transparent;
    color: var(--text-moon);
    border: 1px solid var(--border-med);
    border-radius: 2px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .btn-ghost:hover {
    border-color: var(--brass-light);
    color: var(--brass-light);
    background: rgba(201, 163, 90, 0.05);
  }

  .hero-meta {
    position: absolute;
    bottom: 48px;
    left: 48px;
    right: 48px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-mute);
    letter-spacing: 0.1em;
    z-index: 2;
  }

  .hero-meta-block {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .hero-meta-label {
    color: var(--text-mute);
    text-transform: uppercase;
    letter-spacing: 0.2em;
  }

  .hero-meta-value {
    color: var(--text-dim);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .meta-pulse {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-lava);
    box-shadow: 0 0 8px var(--accent-lava);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  .scroll-indicator {
    position: absolute;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--text-mute);
    text-transform: uppercase;
    z-index: 2;
  }

  .scroll-arrow {
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, var(--brass), transparent);
    position: relative;
    animation: scrollDown 2s ease-in-out infinite;
  }

  .scroll-arrow::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: -3px;
    width: 7px;
    height: 7px;
    border-right: 1px solid var(--brass);
    border-bottom: 1px solid var(--brass);
    transform: rotate(45deg);
  }

  @keyframes scrollDown {
    0% { transform: translateY(-8px); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(8px); opacity: 0; }
  }

  /* ===== Orbital Rings ===== */
  .orbital-stage {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
    pointer-events: none;
  }

  .orbit-center {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent-lava);
    box-shadow: 0 0 20px var(--accent-lava), 0 0 40px var(--glow-lava), 0 0 80px var(--glow-lava);
    z-index: 3;
  }

  .orbit-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid var(--border-soft);
  }

  .orbit-ring-1 {
    width: 280px;
    height: 280px;
    animation: orbitRotate var(--orbit-duration, 20s) linear infinite;
  }

  .orbit-ring-2 {
    width: 440px;
    height: 440px;
    animation: orbitRotate var(--orbit-duration, 20s) linear infinite reverse;
    animation-delay: -5s;
    border-style: dashed;
    border-color: rgba(201, 163, 90, 0.12);
  }

  .orbit-ring-3 {
    width: 620px;
    height: 620px;
    animation: orbitRotate var(--orbit-duration, 20s) linear infinite;
    animation-delay: -10s;
    border-color: rgba(201, 163, 90, 0.08);
  }

  .orbit-ring-4 {
    width: 820px;
    height: 820px;
    animation: orbitRotate var(--orbit-duration, 20s) linear infinite reverse;
    animation-delay: -15s;
    border-style: dotted;
    border-color: rgba(255, 107, 44, 0.06);
  }

  .orbit-planet {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--brass-light);
    box-shadow: 0 0 12px var(--glow-brass);
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
  }

  .orbit-planet.orange {
    background: var(--accent-lava);
    box-shadow: 0 0 12px var(--glow-lava);
    width: 8px;
    height: 8px;
    top: -4px;
  }

  .orbit-planet.tiny {
    width: 6px;
    height: 6px;
    background: var(--text-moon);
    box-shadow: 0 0 8px rgba(240, 237, 230, 0.6);
    top: -3px;
  }

  @keyframes orbitRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* ===== Section base ===== */
  .section {
    position: relative;
    z-index: 2;
    padding: 120px 48px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .section-header {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 64px;
    text-align: center;
  }

  .section-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--brass);
  }

  .section-title {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(32px, 5vw, 56px);
    font-weight: 400;
    letter-spacing: 0.06em;
    color: var(--text-moon);
    line-height: 1.2;
  }

  .section-desc {
    font-size: 15px;
    line-height: 1.8;
    color: var(--text-dim);
    max-width: 560px;
    margin: 8px auto 0;
    font-weight: 300;
  }

  /* ===== Telescopes / Collection Section ===== */
  .telescopes-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }

  .telescope-card {
    position: relative;
    padding: 32px 28px;
    background: linear-gradient(160deg, var(--bg-soft), var(--bg-mid));
    border: 1px solid var(--border-soft);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.17, 0.67, 0.3, 1.33);
    overflow: hidden;
    transform-style: preserve-3d;
    perspective: 1000px;
  }

  .telescope-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--brass), transparent);
    opacity: 0.3;
  }

  .telescope-card:hover {
    border-color: var(--brass);
    transform: translateY(-8px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px var(--glow-brass);
  }

  .telescope-icon {
    width: 56px;
    height: 56px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(201, 163, 90, 0.08);
    border: 1px solid var(--border-soft);
    border-radius: 4px;
    transition: all 0.3s ease;
  }

  .telescope-card:hover .telescope-icon {
    background: rgba(255, 107, 44, 0.12);
    border-color: var(--accent-lava);
  }

  .telescope-number {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-mute);
    letter-spacing: 0.2em;
    margin-bottom: 8px;
  }

  .telescope-name {
    font-family: 'Noto Serif SC', serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--text-moon);
    margin-bottom: 8px;
    letter-spacing: 0.05em;
  }

  .telescope-spec {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--brass);
    margin-bottom: 16px;
    letter-spacing: 0.1em;
  }

  .telescope-desc {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text-dim);
    margin-bottom: 24px;
    font-weight: 300;
  }

  .telescope-stats {
    display: flex;
    gap: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border-soft);
  }

  .telescope-stat {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .telescope-stat-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    font-weight: 500;
    color: var(--accent-lava);
  }

  .telescope-stat-label {
    font-size: 10px;
    color: var(--text-mute);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .card-shine {
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      120deg,
      transparent 40%,
      rgba(201, 163, 90, 0.15) 50%,
      transparent 60%
    );
    transition: left 0.6s ease;
    pointer-events: none;
  }

  .telescope-card:hover .card-shine {
    left: 100%;
  }

  /* ===== Booking / Stargazing Nights Section ===== */
  .booking-section {
    position: relative;
    z-index: 2;
    padding: 120px 48px;
    background: linear-gradient(180deg, transparent, rgba(20, 20, 28, 0.6), transparent);
  }

  .booking-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 64px;
    align-items: center;
  }

  .booking-left {
    position: relative;
  }

  .booking-date-display {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    color: var(--accent-lava);
    letter-spacing: 0.2em;
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  .booking-title {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(28px, 4vw, 44px);
    font-weight: 400;
    line-height: 1.3;
    color: var(--text-moon);
    margin-bottom: 24px;
    letter-spacing: 0.05em;
  }

  .booking-title em {
    color: var(--brass);
    font-style: normal;
    font-weight: 500;
  }

  .booking-desc {
    font-size: 15px;
    line-height: 1.9;
    color: var(--text-dim);
    margin-bottom: 32px;
    font-weight: 300;
  }

  .booking-highlights {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 36px;
  }

  .booking-highlight {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 14px;
    color: var(--text-dim);
  }

  .highlight-icon {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255, 107, 44, 0.1);
    border: 1px solid var(--border-med);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* Calendar */
  .calendar {
    background: var(--bg-soft);
    border: 1px solid var(--border-soft);
    border-radius: 4px;
    padding: 28px;
    position: relative;
  }

  .calendar::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent-lava), transparent);
  }

  .calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  .calendar-title {
    font-family: 'Noto Serif SC', serif;

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#ff6b2c",
  "starDensity": 1,
  "effectIntensity": 1,
  "customCursor": true,
  "orbitSpeed": 1,
  "meteorEnabled": true,
  "darkIntensity": 1
}/*EDITMODE-END*/;

// ============================================================
// Custom Cursor Hook (physics-based spring follow)
// ============================================================
function useCustomCursor(enabled, intensity) {
  const ringRef = useRef(null);
  const dotRef = useRef(null);
  const ripplesRef = useRef([]);
  const animRef = useRef(null);
  const posRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const targetRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const velRef = useRef({ x: 0, y: 0 });
  const [isHovering, setIsHovering] = useState(false);
  const [isClicking, setIsClicking] = useState(false);

  useEffect(() => {
    if (!enabled) return;

    const spring = 0.18 * intensity;
    const damping = 0.75;

    const animate = () => {
      const dx = targetRef.current.x - posRef.current.x;
      const dy = targetRef.current.y - posRef.current.y;
      velRef.current.x = (velRef.current.x + dx * spring) * damping;
      velRef.current.y = (velRef.current.y + dy * spring) * damping;
      posRef.current.x += velRef.current.x;
      posRef.current.y += velRef.current.y;

      if (ringRef.current) {
        ringRef.current.style.left = posRef.current.x + 'px';
        ringRef.current.style.top = posRef.current.y + 'px';
      }
      if (dotRef.current) {
        dotRef.current.style.left = targetRef.current.x + 'px';
        dotRef.current.style.top = targetRef.current.y + 'px';
      }

      animRef.current = requestAnimationFrame(animate);
    };
    animRef.current = requestAnimationFrame(animate);

    const handleMove = (e) => {
      targetRef.current.x = e.clientX;
      targetRef.current.y = e.clientY;

      // Hover detection on interactive elements
      const hovered = e.target.closest('button, a, .telescope-card, .calendar-day, .timeline-item, .nav-link, .footer-link, .archive-tab, .tweak-toggle, .tweak-chip, .tweaks-fab, input');
      setIsHovering(!!hovered);
    };

    const handleDown = (e) => {
      setIsClicking(true);
      // Create ripple
      const ripple = document.createElement('div');
      ripple.className = 'cursor-ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => {
        if (ripple.parentNode) ripple.parentNode.removeChild(ripple);
      }, 700);
    };

    const handleUp = () => {
      setIsClicking(false);
    };

    const handleVisibility = () => {
      if (document.hidden) {
        if (animRef.current) cancelAnimationFrame(animRef.current);
      } else {
        if (!animRef.current) animRef.current = requestAnimationFrame(animate);
      }
    };

    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mousedown', handleDown);
    window.addEventListener('mouseup', handleUp);
    document.addEventListener('visibilitychange', handleVisibility);

    return () => {
      if (animRef.current) cancelAnimationFrame(animRef.current);
      window.removeEventListener('mousemove', handleMove);
      window.removeEventListener('mousedown', handleDown);
      window.removeEventListener('mouseup', handleUp);
      document.removeEventListener('visibilitychange', handleVisibility);
    };
  }, [enabled, intensity]);

  return { ringRef, dotRef, isHovering, isClicking };
}

// ============================================================
// Starfield Canvas (twinkling stars with parallax)
// ============================================================
function Starfield({ density, intensity }) {
  const canvasRef = useRef(null);
  const animRef = useRef(null);
  const scrollYRef = useRef(0);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    const starCount = Math.floor(width * height * 0.00015 * density);
    const stars = [];
    const layers = 3;

    for (let i = 0; i < starCount; i++) {
      const layer = Math.floor(Math.random() * layers);
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: 0.5 + Math.random() * (1.5 + layer * 0.8),
        baseBrightness: 0.3 + Math.random() * 0.7,
        twinkleSpeed: 0.5 + Math.random() * 2,
        twinklePhase: Math.random() * Math.PI * 2,
        layer: layer,
        parallaxFactor: 0.05 + layer * 0.08,
        color: Math.random() > 0.92 ? '#ff6b2c' : (Math.random() > 0.85 ? '#c9a35a' : '#f0ede6')
      });
    }

    let time = 0;
    let rafId = null;
    const speed = 0.016 * intensity;

    const animate = () => {
      time += speed;
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        const parallaxY = (scrollYRef.current * s.parallaxFactor) % height;
        let y = s.y - parallaxY;
        if (y < 0) y += height;
        if (y > height) y -= height;

        const twinkle = s.baseBrightness * (0.6 + 0.4 * Math.sin(time * s.twinkleSpeed + s.twinklePhase));
        ctx.beginPath();
        ctx.arc(s.x, y, s.size, 0, Math.PI * 2);
        ctx.fillStyle = s.color;
        ctx.globalAlpha = twinkle;
        ctx.fill();

        // Glow for bigger stars
        if (s.size > 1.2) {
          ctx.beginPath();
          ctx.arc(s.x, y, s.size * 2.5, 0, Math.PI * 2);
          const grad = ctx.createRadialGradient(s.x, y, 0, s.x, y, s.size * 2.5);
          grad.addColorStop(0, s.color);
          grad.addColorStop(1, 'transparent');
          ctx.fillStyle = grad;
          ctx.globalAlpha = twinkle * 0.3;
          ctx.fill();
        }
      }

      ctx.globalAlpha = 1;
      rafId = requestAnimationFrame(animate);
    };
    animate();
    animRef.current = rafId;

    const handleScroll = () => {
      scrollYRef.current = window.scrollY;
    };

    const handleResize = () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    };

    const handleVisibility = () => {
      if (document.hidden) {
        if (animRef.current) cancelAnimationFrame(animRef.current);
        animRef.current = null;
      } else {
        if (!animRef.current) animate();
      }
    };

    window.addEventListener('scroll', handleScroll, { passive: true });
    window.addEventListener('resize', handleResize);
    document.addEventListener('visibilitychange', handleVisibility);

    return () => {
      if (animRef.current) cancelAnimationFrame(animRef.current);
      window.removeEventListener('scroll', handleScroll);
      window.removeEventListener('resize', handleResize);
      document.removeEventListener('visibilitychange', handleVisibility);
    };
  }, [density, intensity]);

  return <canvas ref={canvasRef} className="starfield-canvas" />;
}

// ============================================================
// Meteor effect (periodic shooting stars)
// ============================================================
function Meteors({ enabled, intensity }) {
  const containerRef = useRef(null);
  const timerRef = useRef(null);

  useEffect(() => {
    if (!enabled) return;
    if (!containerRef.current) return;

    const spawnMeteor = () => {
      if (document.hidden) return;
      const meteor = document.createElement('div');
      meteor.className = 'meteor';
      const startX = Math.random() * window.innerWidth * 0.8 + window.innerWidth * 0.1;
      const startY = -100;
      meteor.style.left = startX + 'px';
      meteor.style.top = startY + 'px';
      meteor.style.opacity = '0.8';
      const len = 60 + Math.random() * 100;
      meteor.style.height = len + 'px';
      containerRef.current.appendChild(meteor);

      let x = startX;
      let y = startY;
      const vx = (2 + Math.random() * 3) * intensity;
      const vy = (3 + Math.random() * 4) * intensity;
      let life = 0;
      const maxLife = 80 + Math.random() * 60;

      const move = () => {
        x += vx;
        y += vy;
        life++;
        meteor.style.left = x + 'px';
        meteor.style.top = y + 'px';
        meteor.style.opacity = Math.max(0, 0.8 * (1 - life / maxLife));

        if (life < maxLife && y < window.innerHeight + 100) {
          requestAnimationFrame(move);
        } else {
          if (meteor.parentNode) meteor.parentNode.removeChild(meteor);
        }
      };
      requestAnimationFrame(move);
    };

    const scheduleNext = () => {
      const delay = (2500 + Math.random() * 5000) / intensity;
      timerRef.current = setTimeout(() => {
        spawnMeteor();
        scheduleNext();
      }, delay);
    };
    scheduleNext();

    return () => {
      if (timerRef.current) clearTimeout(timerRef.current);
    };
  }, [enabled, intensity]);

  return <div ref={containerRef} style={{ position: 'fixed', top: 0, left: 0, width: '100%', height: '100%', pointerEvents: 'none', zIndex: 1, overflow: 'hidden' }} />;
}

// ============================================================
// Typewriter effect
// ============================================================
function useTypewriter(text, speed = 40, delay = 500) {
  const [displayed, setDisplayed] = useState('');
  const [done, setDone] = useState(false);
  const timerRef = useRef(null);
  const indexRef = useRef(0);

  useEffect(() => {
    indexRef.current = 0;
    setDisplayed('');
    setDone(false);

    const startTimer = setTimeout(() => {
      const typeChar = () => {
        if (indexRef.current < text.length) {
          setDisplayed(text.slice(0, indexRef.current + 1));
          indexRef.current++;
          timerRef.current = setTimeout(typeChar, speed + Math.random() * 30);
        } else {
          setDone(true);
        }
      };
      typeChar();
    }, delay);

    return () => {
      clearTimeout(startTimer);
      if (timerRef.current) clearTimeout(timerRef.current);
    };
  }, [text, speed, delay]);

  return { displayed, done };
}

// ============================================================
// Animated counter
// ============================================================
function AnimatedNumber({ value, suffix = '', duration = 2000, trigger }) {
  const [display, setDisplay] = useState(0);
  const ref = useRef(null);
  const animRef = useRef(null);
  const startedRef = useRef(false);

  useEffect(() => {
    if (!ref.current) return;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting && !startedRef.current) {
          startedRef.current = true;
          const start = performance.now();
          const startVal = 0;
          const endVal = value;

          const animate = (now) => {
            const elapsed = now - start;
            const progress = Math.min(elapsed / duration, 1);
            // easeOutCubic
            const eased = 1 - Math.pow(1 - progress, 3);
            setDisplay(Math.round(startVal + (endVal - startVal) * eased));

            if (progress < 1) {
              animRef.current = requestAnimationFrame(animate);
            }
          };
          animRef.current = requestAnimationFrame(animate);
        }
      });
    }, { threshold: 0.3 });

    observer.observe(ref.current);

    return () => {
      observer.disconnect();
      if (animRef.current) cancelAnimationFrame(animRef.current);
    };
  }, [value, duration, trigger]);

  return <span ref={ref}>{display}{suffix}</span>;
}

// ============================================================
// Card tilt effect (direct DOM, no React state)
// ============================================================
function useCardTilt(enabled) {
  const ref = useRef(null);

  useEffect(() => {
    if (!enabled) return;
    const el = ref.current;
    if (!el) return;

    const handleMove = (e) => {
      const rect = el.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      el.style.transform = `translateY(-8px) rotateY(${x * 8}deg) rotateX(${-y * 8}deg)`;
    };

    const handleLeave = () => {
      el.style.transform = '';
    };

    el.addEventListener('mousemove', handleMove);
    el.addEventListener('mouseleave', handleLeave);

    return () => {
      el.removeEventListener('mousemove', handleMove);
      el.removeEventListener('mouseleave', handleLeave);
    };
  }, [enabled]);

  return ref;
}

// ============================================================
// Scroll reveal
// ============================================================
function useReveal() {
  useEffect(() => {
    const elements = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });

    elements.forEach((el) => observer.observe(el));
    return () => observer.disconnect();
  }, []);
}

    const now = new Date();
    now.setDate(1);
    now.setMonth(now.getMonth() + monthOffset);
    const firstDay = now.getDay();
    const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const monthNames = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];

    const cells = [];

// ============================================================
// Tweaks Panel (observatory-themed)
// ============================================================
function TweaksPanel({ tweaks, setTweak, onClose }) {
  const accentOptions = ['#ff6b2c', '#c9a35a', '#f0ede6', '#9cf0b0'];

  const setAccent = (color) => {
    setTweak('accentColor', color);
    document.documentElement.style.setProperty('--accent-lava', color);
    // Adjust derived colors
    const hex = color;
    // Update related CSS vars
    document.documentElement.style.setProperty('--glow-lava', hex + '80');
  };

  const setDensity = (v) => {
    setTweak('starDensity', v);
    document.documentElement.style.setProperty('--star-density', v);
  };

  const setIntensity = (v) => {
    setTweak('effectIntensity', v);
    document.documentElement.style.setProperty('--effect-intensity', v);
  };

  const toggleCursor = (v) => {
    setTweak('customCursor', v);
    document.documentElement.style.setProperty('--cursor-enabled', v ? 1 : 0);
    document.body.style.cursor = v ? 'none' : 'auto';
  };

  const setOrbitSpeed = (v) => {
    setTweak('orbitSpeed', v);
    document.documentElement.style.setProperty('--orbit-speed', v);
  };

  const toggleMeteor = (v) => {
    setTweak('meteorEnabled', v);
  };

  const setDarkIntensity = (v) => {
    setTweak('darkIntensity', v);
    // Adjust deep background darkness
    if (v >= 1) {
      document.documentElement.style.setProperty('--bg-deep', '#0a0a0f');
      document.documentElement.style.setProperty('--bg-mid', '#14141c');
      document.documentElement.style.setProperty('--bg-soft', '#1c1c28');
    } else {
      const lighten = Math.round((1 - v) * 20);
      document.documentElement.style.setProperty('--bg-deep', `hsl(240, 20%, ${5 + lighten}%)`);
      document.documentElement.style.setProperty('--bg-mid', `hsl(240, 18%, ${8 + lighten}%)`);
      document.documentElement.style.setProperty('--bg-soft', `hsl(240, 15%, ${12 + lighten}%)`);
    }
  };

  return (
    <div className="tweaks-panel">
      <div className="tweaks-panel-header">
        <div className="tweaks-panel-title">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="6" stroke="#c9a35a" strokeWidth="1" />
            <circle cx="8" cy="8" r="2" fill="#ff6b2c" />
            <line x1="8" y1="2" x2="8" y2="4" stroke="#c9a35a" strokeWidth="1" />
            <line x1="8" y1="12" x2="8" y2="14" stroke="#c9a35a" strokeWidth="1" />
            <line x1="2" y1="8" x2="4" y2="8" stroke="#c9a35a" strokeWidth="1" />
            <line x1="12" y1="8" x2="14" y2="8" stroke="#c9a35a" strokeWidth="1" />
          </svg>
          观测控制台
        </div>
        <button
          onClick={onClose}
          style={{
            background: 'transparent',
            border: 'none',
            color: 'var(--text-mute)',
            cursor: 'pointer',
            fontSize: '18px',
            padding: '4px 8px'
          }}
        >
          ×
        </button>
      </div>
      <div className="tweaks-panel-body">
        <div className="tweak-section-label">主题色彩</div>

        <div className="tweak-row">
          <span className="tweak-label">强调色</span>
          <div className="tweak-color-chips">
            {accentOptions.map((c) => (
              <div
                key={c}
                className={`tweak-chip ${tweaks.accentColor === c ? 'active' : ''}`}
                style={{ background: c, boxShadow: `0 0 6px ${c}80` }}
                onClick={() => setAccent(c)}
              />
            ))}
          </div>
        </div>

        <div className="tweak-row">
          <span className="tweak-label">背景深度</span>
          <input
            type="range"
            className="tweak-slider"
            min="0.4"
            max="1"
            step="0.05"
            value={tweaks.darkIntensity}
            onChange={(e) => setDarkIntensity(parseFloat(e.target.value))}
          />
        </div>

        <div className="tweak-section-label">星空效果</div>

        <div className="tweak-row">
          <span className="tweak-label">星点密度</span>
          <input
            type="range"
            className="tweak-slider"
            min="0.3"
            max="2"
            step="0.1"
            value={tweaks.starDensity}
            onChange={(e) => setDensity(parseFloat(e.target.value))}
          />
          <span className="tweak-value">{Math.round(tweaks.starDensity * 100)}%</span>
        </div>

        <div className="tweak-row">
          <span className="tweak-label">轨道转速</span>
          <input
            type="range"
            className="tweak-slider"
            min="0.2"
            max="3"
            step="0.1"
            value={tweaks.orbitSpeed}
            onChange={(e) => setOrbitSpeed(parseFloat(e.target.value))}
          />
          <span className="tweak-value">{tweaks.orbitSpeed.toFixed(1)}×</span>
        </div>

        <div className="tweak-row">
          <span className="tweak-label">流星效果</span>
          <div
            className={`tweak-toggle ${tweaks.meteorEnabled ? 'active' : ''}`}
            onClick={() => toggleMeteor(!tweaks.meteorEnabled)}
          />
        </div>

        <div className="tweak-section-label">交互</div>

        <div className="tweak-row">
          <span className="tweak-label">自定义光标</span>
          <div
            className={`tweak-toggle ${tweaks.customCursor ? 'active' : ''}`}
            onClick={() => toggleCursor(!tweaks.customCursor)}
          />
        </div>

        <div className="tweak-row">
          <span className="tweak-label">动效强度</span>
          <input
            type="range"
            className="tweak-slider"
            min="0.2"
            max="2"
            step="0.1"
            value={tweaks.effectIntensity}
            onChange={(e) => setIntensity(parseFloat(e.target.value))}
          />
          <span className="tweak-value">{Math.round(tweaks.effectIntensity * 100)}%</span>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// useTweaks (simplified inline version)
// ============================================================
function useTweaks(defaults) {
  const [tweaks, setTweaksState] = useState(defaults);

  const setTweak = useCallback((key, value) => {
    setTweaksState((prev) => ({ ...prev, [key]: value }));
  }, []);

  // Host protocol
  useEffect(() => {
    const handleActivate = () => {
      window.parent.postMessage({ type: 'miaoda:tweaks:available' }, '*');
    };
    window.addEventListener('miaoda:tweaks:activate', handleActivate);
    return () => window.removeEventListener('miaoda:tweaks:activate', handleActivate);
  }, []);

  return [tweaks, setTweak];
}

// ============================================================
// Main App
// ============================================================
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const { ringRef, dotRef, isHovering, isClicking } = useCustomCursor(
    tweaks.customCursor && !prefersReduced,
    tweaks.effectIntensity
  );

  useReveal();

  // Announce upgrade
  useEffect(() => {
    const announce = () => {
      window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    };
    announce();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announce, { once: true });
    }
  }, []);

  // Apply accent color on mount
  useEffect(() => {
    document.documentElement.style.setProperty('--accent-lava', tweaks.accentColor);
    document.documentElement.style.setProperty('--glow-lava', tweaks.accentColor + '80');
  }, []);

  const effectiveOrbitSpeed = prefersReduced ? 0.01 : tweaks.orbitSpeed;
  const effectiveIntensity = prefersReduced ? 0.1 : tweaks.effectIntensity;
  const effectiveDensity = tweaks.starDensity;
  const effectiveMeteor = tweaks.meteorEnabled && !prefersReduced;

  return (
    <>
      {/* Starfield background */}
      <Starfield density={effectiveDensity} intensity={effectiveIntensity} />

      {/* Meteors */}
      <Meteors enabled={effectiveMeteor} intensity={effectiveIntensity} />

      {/* Custom cursor */}
      {tweaks.customCursor && !prefersReduced && (
        <>
          <div
            ref={ringRef}
            className={`cursor-ring ${isHovering ? 'hovering' : ''} ${isClicking ? 'clicking' : ''}`}
          />
          <div
            ref={dotRef}
            className={`cursor-dot ${isClicking ? 'clicking' : ''}`}
          />
        </>
      )}

      <Nav />
      <Hero />
      <TelescopesSection />
      <BookingSection />
      <StatsSection />
      <ArchiveSection />
      <Footer />

      {/* Tweaks FAB + Panel */}
      {tweaksOpen && (
        <TweaksPanel
          tweaks={tweaks}
          setTweak={setTweak}
          onClose={() => setTweaksOpen(false)}
        />
      )}
      <button
        className="tweaks-fab"
        onClick={() => setTweaksOpen((v) => !v)}
        aria-label="打开观测控制台"
      >
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <circle cx="11" cy="11" r="8" stroke="currentColor" strokeWidth="1.2" />
          <circle cx="11" cy="11" r="2.5" fill="currentColor" />
          <line x1="11" y1="3" x2="11" y2="5" stroke="currentColor" strokeWidth="1.2" />
          <line x1="11" y1="17" x2="11" y2="19" stroke="currentColor" strokeWidth="1.2" />
          <line x1="3" y1="11" x2="5" y2="11" stroke="currentColor" strokeWidth="1.2" />
          <line x1="17" y1="11" x2="19" y2="11" stroke="currentColor" strokeWidth="1.2" />
        </svg>
      </button>
    </>
  );
}

root.render(<App />);
</script>

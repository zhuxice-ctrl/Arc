<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="creative-medium" content="interactive-prototype">
<title>奇普 · 结绳记事</title>
<style>
  /* ============================================
     色板：植物染料原色（禁蓝紫渐变）
     主背景：陈旧羊驼毛褐 #B8A682
     深背景区：深木色 #3B2E22
     绳色：赭红 #A8412C / 姜黄 #C8923A / 苔绿 #6B7A4F / 靛青 #2F5D6E / 炭黑 #2B2622 / 羊驼白 #EDE4D3
     结节高亮：金赭 #D9A441
     文字：墨褐 #2B2622 on 浅 / 羊驼白 #EDE4D3 on 深
     ============================================ */
  :root {
    --bg-main: #B8A682;
    --bg-deep: #3B2E22;
    --bg-deep-2: #4a392a;
    --ink: #2B2622;
    --ink-soft: #5c4a3a;
    --ink-faint: #8a7560;
    --paper: #EDE4D3;
    --paper-dark: #d9cfbc;
    --gold: #D9A441;
    --gold-deep: #b8862a;
    --rope-red: #A8412C;
    --rope-gold: #C8923A;
    --rope-green: #6B7A4F;
    --rope-indigo: #2F5D6E;
    --rope-charcoal: #2B2622;
    --rope-white: #EDE4D3;
    --shadow: rgba(43, 38, 34, 0.25);
    --shadow-soft: rgba(43, 38, 34, 0.12);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-main);
    font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    cursor: none;
  }

  body {
    position: relative;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(237, 228, 211, 0.25) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(59, 46, 34, 0.15) 0%, transparent 60%),
      var(--bg-main);
  }

  /* 纸纹噪点 — 极淡 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 0.17  0 0 0 0 0.15  0 0 0 0 0.13  0 0 0 0.04 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.6;
    mix-blend-mode: multiply;
    z-index: 1;
  }

  /* ============================================
     自定义光标：纺锤形
     ============================================ */
  .cursor {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 32px;
    height: 32px;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.08s ease-out;
    will-change: transform;
  }

  .cursor svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 1px 2px var(--shadow));
  }

  .cursor.hover-cord {
    transform: translate(-50%, -50%) rotate(45deg) scale(1.15);
  }

  .cursor.plucking {
    transform: translate(-50%, -50%) scale(0.9);
  }

  /* ============================================
     顶部标题区
     ============================================ */
  .header {
    position: fixed;
    top: 28px;
    left: 40px;
    z-index: 10;
    pointer-events: none;
  }

  .header h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.4em;
    color: var(--ink);
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
  }

  .header h1 .en {
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.3em;
    color: var(--ink-soft);
    margin-left: 14px;
    font-style: italic;
    font-family: "Times New Roman", Georgia, serif;
  }

  .header .sub {
    margin-top: 6px;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.2em;
  }

  /* ============================================
     右下角绳结计数
     ============================================ */
  .cord-index {
    position: fixed;
    top: 32px;
    right: 40px;
    z-index: 10;
    text-align: right;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.15em;
    line-height: 1.8;
    pointer-events: none;
  }

  .cord-index .total {
    font-size: 24px;
    color: var(--ink);
    font-weight: 600;
    font-family: "Times New Roman", Georgia, serif;
  }

  /* ============================================
     操作提示
     ============================================ */
  .hint {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    font-size: 12px;
    letter-spacing: 0.3em;
    color: var(--ink-soft);
    pointer-events: none;
    transition: opacity 0.6s ease;
  }

  .hint.hidden {
    opacity: 0;
  }

  /* ============================================
     主舞台 SVG
     ============================================ */
  .quipu-stage {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    display: block;
  }

  .main-cord {
    fill: none;
    stroke: var(--rope-charcoal);
    stroke-width: 5;
    stroke-linecap: round;
    filter: drop-shadow(0 2px 3px var(--shadow));
  }

  .pendant-cord {
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: round;
    cursor: pointer;
    transition: filter 0.3s ease;
    filter: drop-shadow(0 1px 1px var(--shadow-soft));
  }

  .pendant-cord:hover {
    filter: drop-shadow(0 2px 4px var(--shadow));
  }

  .pendant-cord.active {
    filter: drop-shadow(0 0 6px var(--gold)) drop-shadow(0 2px 4px var(--shadow));
  }

  .knot-group {
    pointer-events: none;
  }

  .knot-single {
    fill: currentColor;
    filter: drop-shadow(0 1px 1px var(--shadow-soft));
    transition: fill 0.4s ease, filter 0.4s ease;
  }

  .knot-long {
    fill: currentColor;
    filter: drop-shadow(0 1px 1px var(--shadow-soft));
    transition: fill 0.4s ease, filter 0.4s ease;
  }

  .knot-eight {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    filter: drop-shadow(0 1px 1px var(--shadow-soft));
    transition: stroke 0.4s ease, filter 0.4s ease;
  }

  .knot-group.lit .knot-single,
  .knot-group.lit .knot-long {
    fill: var(--gold);
    filter: drop-shadow(0 0 4px var(--gold)) drop-shadow(0 1px 2px var(--shadow));
  }

  .knot-group.lit .knot-eight {
    stroke: var(--gold);
    filter: drop-shadow(0 0 4px var(--gold)) drop-shadow(0 1px 2px var(--shadow));
  }

  .knot-digit {
    font-family: "Times New Roman", Georgia, serif;
    font-size: 16px;
    font-weight: 600;
    fill: var(--ink);
    opacity: 0;
    transition: opacity 0.5s ease;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  .knot-group.lit .knot-digit {
    opacity: 1;
  }

  .knot-place-label {
    font-family: "Songti SC", serif;
    font-size: 9px;
    fill: var(--ink-faint);
    opacity: 0;
    transition: opacity 0.5s ease;
    text-anchor: middle;
    writing-mode: tb;
  }

  .knot-group.lit .knot-place-label {
    opacity: 0.8;
  }

  /* 悬停时绳顶小挂环 */
  .cord-hanger {
    fill: var(--rope-charcoal);
    opacity: 0.6;
  }

  /* 类别色标在绳顶 */
  .cord-tag {
    font-size: 9px;
    fill: var(--ink-soft);
    text-anchor: middle;
    font-family: "Songti SC", serif;
    letter-spacing: 0.1em;
    opacity: 0.7;
    transition: opacity 0.3s ease, fill 0.3s ease;
  }

  .cord-group:hover .cord-tag {
    opacity: 1;
    fill: var(--ink);
  }

  .cord-group.active .cord-tag {
    opacity: 1;
    fill: var(--gold-deep);
    font-weight: 600;
  }

  /* ============================================
     底部档案条
     ============================================ */
  .archive-panel {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 20;
    background: linear-gradient(to top,
      var(--bg-deep) 0%,
      var(--bg-deep) 85%,
      rgba(59, 46, 34, 0.95) 92%,
      transparent 100%);
    color: var(--paper);
    transform: translateY(100%);
    transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    will-change: transform;
  }

  .archive-panel.visible {
    transform: translateY(0);
  }

  .archive-top-edge {
    height: 24px;
    position: relative;
    margin-bottom: -1px;
  }

  .archive-top-edge::before {
    content: "";
    position: absolute;
    top: 10px;
    left: 40px;
    right: 40px;
    height: 1px;
    background: var(--gold);
    opacity: 0.4;
  }

  .archive-top-edge::after {
    content: "";
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 32px;
    height: 4px;
    background: var(--gold);
    opacity: 0.5;
    border-radius: 2px;
  }

  .archive-content {
    padding: 20px 60px 36px;
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    gap: 40px;
    align-items: start;
  }

  .archive-section {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .archive-label {
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--gold);
    opacity: 0.7;
    margin-bottom: 4px;
  }

  .archive-region {
    font-size: 26px;
    font-weight: 600;
    color: var(--paper);
    letter-spacing: 0.1em;
    line-height: 1.3;
  }

  .archive-region .quechua {
    display: block;
    font-size: 12px;
    font-weight: 400;
    font-style: italic;
    letter-spacing: 0.2em;
    color: var(--paper-dark);
    font-family: "Times New Roman", Georgia, serif;
    margin-top: 2px;
  }

  .archive-meta {
    font-size: 12px;
    color: var(--paper-dark);
    line-height: 2;
    letter-spacing: 0.1em;
  }

  .archive-meta span {
    display: block;
  }

  .archive-number-section {
    text-align: center;
  }

  .archive-number-main {
    font-size: 64px;
    font-weight: 300;
    font-family: "Times New Roman", Georgia, serif;
    color: var(--paper);
    letter-spacing: 0.05em;
    line-height: 1;
    margin-bottom: 8px;
  }

  .archive-number-main .digit-animate {
    display: inline-block;
    overflow: hidden;
    vertical-align: baseline;
  }

  .archive-unit {
    font-size: 13px;
    color: var(--paper-dark);
    letter-spacing: 0.2em;
  }

  .archive-category {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px 12px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    font-size: 11px;
    letter-spacing: 0.2em;
  }

  .category-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .archive-description {
    font-size: 12px;
    line-height: 1.9;
    color: var(--paper-dark);
    letter-spacing: 0.05em;
  }

  .archive-close {
    position: absolute;
    top: 20px;
    right: 40px;
    width: 28px;
    height: 28px;
    border: none;
    background: transparent;
    cursor: pointer;
    color: var(--paper-dark);
    font-size: 18px;
    opacity: 0.6;
    transition: opacity 0.2s;
  }

  .archive-close:hover {
    opacity: 1;
  }

  /* ============================================
     光尘粒子
     ============================================ */
  .dust-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    overflow: hidden;
  }

  .dust-particle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: var(--paper);
    border-radius: 50%;
    opacity: 0;
  }

  /* ============================================
     图例说明
     ============================================ */
  .legend {
    position: fixed;
    bottom: 60px;
    left: 40px;
    z-index: 10;
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 0.15em;
    line-height: 2.2;
    pointer-events: none;
    opacity: 0.8;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .legend-swatch {
    width: 16px;
    height: 3px;
    border-radius: 1px;
  }

  /* ============================================
     绳顶主绳上的挂珠
     ============================================ */
  .main-cord-bead {
    fill: var(--rope-charcoal);
  }

  /* ============================================
     响应式
     ============================================ */
  @media (max-width: 900px) {
    .header {
      top: 16px;
      left: 20px;
    }
    .header h1 {
      font-size: 20px;
    }
    .cord-index {
      top: 18px;
      right: 20px;
    }
    .legend {
      left: 20px;
      bottom: 50px;
      font-size: 9px;
    }
    .archive-content {
      padding: 16px 24px 24px;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .archive-number-section {
      grid-column: 1 / -1;
      order: -1;
    }
    .archive-number-main {
      font-size: 48px;
    }
    .archive-close {
      right: 20px;
      top: 14px;
    }
    .hint {
      font-size: 10px;
      letter-spacing: 0.2em;
    }
    html, body {
      cursor: auto;
    }
    .cursor {
      display: none;
    }
  }

  /* ============================================
     减少动效模式
     ============================================ */
  @media (prefers-reduced-motion: reduce) {
    .dust-particle {
      display: none;
    }
    .pendant-cord {
      transition: none;
    }
    .knot-single, .knot-long, .knot-eight {
      transition: none;
    }
    .knot-digit, .knot-place-label {
      transition: none;
    }
    .archive-panel {
      transition: none;
    }
    .cursor {
      transition: none;
    }
  }
</style>
</head>
<body>

  <!-- 自定义光标 -->
  <div class="cursor" id="cursor" aria-hidden="true">
    <svg viewBox="0 0 32 32" fill="none">
      <!-- 纺锤形 -->
      <ellipse cx="16" cy="16" rx="3" ry="12" fill="#2B2622" />
      <rect x="14" y="2" width="4" height="28" rx="2" fill="#D9A441" opacity="0.9"/>
      <ellipse cx="16" cy="16" rx="5" ry="3" fill="#2B2622" />
      <line x1="16" y1="4" x2="16" y2="2" stroke="#D9A441" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="16" y1="30" x2="16" y2="28" stroke="#D9A441" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- 光尘粒子容器 -->
  <div class="dust-container" id="dustContainer" aria-hidden="true"></div>

  <!-- 顶部标题 -->
  <header class="header">
    <h1>奇<span style="display:inline-block;width:0.3em"></span>普<span class="en">Quipu</span></h1>
    <div class="sub">结绳记事 · 印加帝国账目</div>
  </header>

  <!-- 右上角索引 -->
  <div class="cord-index">
    <div>子绳总数</div>
    <div class="total"><span id="cordCount">7</span> <span style="font-size:11px;color:var(--ink-soft);letter-spacing:0.1em;">根</span></div>
    <div style="margin-top:8px;font-size:9px;opacity:0.7;">PENDANT CORDS</div>
  </div>

  <!-- 左下图例 -->
  <div class="legend">
    <div class="legend-item">
      <span class="legend-swatch" style="background:#A8412C"></span>
      <span>赭红 · 人口/军事</span>
    </div>
    <div class="legend-item">
      <span class="legend-swatch" style="background:#C8923A"></span>
      <span>姜黄 · 黄金/贡品</span>
    </div>
    <div class="legend-item">
      <span class="legend-swatch" style="background:#6B7A4F"></span>
      <span>苔绿 · 农作物</span>
    </div>
    <div class="legend-item">
      <span class="legend-swatch" style="background:#2F5D6E"></span>
      <span>靛青 · 远方行省</span>
    </div>
    <div class="legend-item">
      <span class="legend-swatch" style="background:#2B2622"></span>
      <span>炭黑 · 牲畜/羊驼</span>
    </div>
    <div class="legend-item">
      <span class="legend-swatch" style="background:#EDE4D3;border:1px solid #8a7560"></span>
      <span>羊驼白 · 和平/银</span>
    </div>
  </div>

  <!-- 主舞台 SVG -->
  <svg class="quipu-stage" id="quipuStage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-label="奇普绳帘">
    <!-- 主绳 -->
    <path id="mainCord" class="main-cord" d="" />
    <!-- 主绳挂珠（子绳悬挂点）将由 JS 生成 -->
    <g id="mainCordBeads"></g>
    <!-- 子绳组 -->
    <g id="pendantCords"></g>
  </svg>

  <!-- 底部档案条 -->
  <section class="archive-panel" id="archivePanel" aria-live="polite">
    <button class="archive-close" id="archiveClose" aria-label="关闭档案">×</button>
    <div class="archive-top-edge"></div>
    <div class="archive-content">
      <div class="archive-section">
        <div class="archive-label">地区 / PROVINCE</div>
        <div class="archive-region" id="archiveRegion">
          —
          <span class="quechua" id="archiveQuechua">—</span>
        </div>
        <div class="archive-meta" style="margin-top:12px;">
          <span id="archiveYear">—</span>
          <span id="archiveRuler">—</span>
        </div>
      </div>
      <div class="archive-section archive-number-section">
        <div class="archive-label">解 读 数 值</div>
        <div class="archive-number-main" id="archiveNumber">0</div>
        <div class="archive-unit" id="archiveUnit">—</div>
        <div style="margin-top:12px;">
          <span class="archive-category" id="archiveCategory">
            <span class="category-dot" id="categoryDot"></span>
            <span id="categoryName">—</span>
          </span>
        </div>
      </div>
      <div class="archive-section">
        <div class="archive-label">档案记述 / RECORD</div>
        <p class="archive-description" id="archiveDesc">—</p>
      </div>
    </div>
  </section>

  <!-- 操作提示 -->
  <div class="hint" id="hint">拨 动 子 绳 · 解 读 印 加 帝 国 账 目</div>

<script>

  // ============================================
  // 全局状态
  // ============================================
  var state = {
    cords: [],        // 每根绳子的物理状态
    activeCordId: null,
    animating: false,
    rafId: null,
    lastTime: 0,
    visible: true,
    hintShown: true
  };

  // ============================================
  // DOM 引用
  // ============================================
  var stage = document.getElementById('quipuStage');
  var mainCordEl = document.getElementById('mainCord');
  var mainCordBeadsEl = document.getElementById('mainCordBeads');
  var pendantCordsEl = document.getElementById('pendantCords');
  var cursorEl = document.getElementById('cursor');
  var archivePanel = document.getElementById('archivePanel');
  var archiveClose = document.getElementById('archiveClose');
  var hintEl = document.getElementById('hint');
  var dustContainer = document.getElementById('dustContainer');

  // ============================================
  // 工具函数
  // ============================================
  function createSvgEl(name, attrs) {
    var el = document.createElementNS('http://www.w3.org/2000/svg', name);
    if (attrs) {
      for (var key in attrs) {
        if (attrs.hasOwnProperty(key)) {
          el.setAttribute(key, attrs[key]);
        }
      }
    }
    return el;
  }

  function getCordX(index, total) {
    var totalW = STAGE_W - 200;
    var spacing = totalW / (total + 1);
    return 100 + spacing * (index + 1);
  }

  function getPointOnCord(cordX, displacement, ratio) {
    var r = ratio;
    // 二次贝塞尔曲线：控制点在中间，偏移0.6*displacement
    // y 线性分布 → t = r
    // x = x + 2(1-r)r * 0.6*displacement + r^2 * displacement
    var x = cordX + 2 * (1 - r) * r * 0.6 * displacement + r * r * displacement;
    var y = MAIN_CORD_Y + r * CORD_LENGTH;
    return { x: x, y: y };
  }

  function getCordPath(cordX, displacement) {
    var midY = MAIN_CORD_Y + CORD_LENGTH * 0.5;
    var controlX = cordX + displacement * 0.6;
    return 'M ' + cordX + ' ' + MAIN_CORD_Y +
           ' Q ' + controlX + ' ' + midY +
           ' ' + (cordX + displacement) + ' ' + CORD_BOTTOM_Y;
  }

  // ============================================
  // 结节绘制
  // ============================================
  function drawKnotGroup(cordData, place, digit, yRatio, cordGroupEl) {
    var g = createSvgEl('g', {
      class: 'knot-group',
      'data-place': place,
      'data-digit': digit,
      'data-ratio': yRatio
    });

    // 位置标签
    var label = createSvgEl('text', {
      class: 'knot-place-label',
      x: 0,
      y: 0,
      dx: -14
    });
    label.textContent = PLACE_LABELS[place];
    g.appendChild(label);

    // 数字文本
    var digitEl = createSvgEl('text', {
      class: 'knot-digit',
      x: 0,
      y: 0,
      dx: 18
    });
    digitEl.textContent = digit;
    g.appendChild(digitEl);

    if (digit === 0) {
      // 零位无结
      cordGroupEl.appendChild(g);
      return g;
    }

    if (place === 'units') {
      // 个位：八字结(1) 或 长结(2-9)
      if (digit === 1) {
        // 八字结
        var eight = createSvgEl('path', {
          class: 'knot-eight',
          d: 'M 0 -5 C -5 -5, -6 0, 0 3 C 6 0, 5 -5, 0 -5 M 0 3 C -5 5, -6 10, 0 12 C 6 10, 5 5, 0 3',
          style: 'color:' + cordData.color
        });
        g.appendChild(eight);
      } else {
        // 长结：高度随圈数增加
        var height = 4 + digit * 3;
        var longKnot = createSvgEl('g', { class: 'knot-long', style: 'color:' + cordData.color });

        // 主体椭圆
        var body = createSvgEl('ellipse', {
          cx: 0, cy: 0, rx: 4, ry: height
        });
        longKnot.appendChild(body);

        // 横向缠绕线（表示圈数）
        for (var i = 0; i < digit; i++) {
          var yOffset = -height + (height * 2 / (digit + 1)) * (i + 1);
          var wrap = createSvgEl('line', {
            x1: -4, y1: yOffset,
            x2: 4, y2: yOffset,
            stroke: '#2B2622',
            'stroke-width': 0.8,
            opacity: 0.4
          });
          longKnot.appendChild(wrap);
        }

        g.appendChild(longKnot);
      }
    } else {
      // 十/百/千位：单结堆叠
      var singleGroup = createSvgEl('g', {
        class: 'knot-singles',
        style: 'color:' + cordData.color
      });

      var spacing = 11;
      var totalHeight = (digit - 1) * spacing;
      var startY = -totalHeight / 2;

      for (var j = 0; j < digit; j++) {
        var ky = startY + j * spacing;
        var knot = createSvgEl('g', { class: 'knot-single' });

        // 单结：椭圆形状
        var ellipse = createSvgEl('ellipse', {
          cx: 0, cy: ky, rx: 4.5, ry: 3.5
        });
        knot.appendChild(ellipse);

        // 绳穿过结（细线）
        var thread = createSvgEl('line', {
          x1: 0, y1: ky - 3,
          x2: 0, y2: ky + 3,
          stroke: cordData.color,
          'stroke-width': 1,
          opacity: 0.5
        });
        knot.appendChild(thread);

        singleGroup.appendChild(knot);
      }

      g.appendChild(singleGroup);
    }

    cordGroupEl.appendChild(g);
    return g;
  }

  // ============================================
  // 初始化绳帘
  // ============================================
  function initQuipu() {
    var totalCords = QUIPU_DATA.length;

    // 绘制主绳（略带弧度的水平绳）
    var mainCordPath = 'M 60 ' + MAIN_CORD_Y +
                       ' C 400 ' + (MAIN_CORD_Y - 8) +
                       ', 1200 ' + (MAIN_CORD_Y - 8) +
                       ', 1540 ' + MAIN_CORD_Y;
    mainCordEl.setAttribute('d', mainCordPath);

    // 生成每根子绳
    QUIPU_DATA.forEach(function(cordData, index) {
      var x = getCordX(index, totalCords);

      // 物理状态
      var cordState = {
        id: cordData.id,
        x: x,
        data: cordData,
        displacement: 0,
        velocity: 0,
        swinging: false,
        litPlaces: [],     // 已点亮的位
        decoded: false,
        knotGroups: {},    // 各 knot-group 元素引用
        groupEl: null,
        pathEl: null,
        tagEl: null
      };

      state.cords.push(cordState);

      // 主绳挂珠
      var bead = createSvgEl('ellipse', {
        cx: x, cy: MAIN_CORD_Y - 1, rx: 4, ry: 3,
        class: 'main-cord-bead',
        opacity: 0.8
      });
      mainCordBeadsEl.appendChild(bead);

      // 子绳组
      var cordGroup = createSvgEl('g', {
        class: 'cord-group',
        'data-cord-id': cordData.id
      });
      cordState.groupEl = cordGroup;

      // 绳体
      var path = createSvgEl('path', {
        class: 'pendant-cord',
        d: getCordPath(x, 0),
        stroke: cordData.color,
        'data-cord-id': cordData.id
      });
      cordState.pathEl = path;
      cordGroup.appendChild(path);

      // 绳顶小挂环
      var hanger = createSvgEl('path', {
        class: 'cord-hanger',
        d: 'M ' + (x - 4) + ' ' + (MAIN_CORD_Y + 2) +
           ' Q ' + x + ' ' + (MAIN_CORD_Y + 6) +
           ', ' + (x + 4) + ' ' + (MAIN_CORD_Y + 2),
        fill: 'none',
        stroke: cordData.color,
        'stroke-width': 1.5
      });
      cordGroup.appendChild(hanger);

      // 绳尾小坠
      var tail = createSvgEl('ellipse', {
        cx: x, cy: CORD_BOTTOM_Y + 2, rx: 3, ry: 2,
        fill: cordData.color,
        opacity: 0.6
      });
      cordGroup.appendChild(tail);
      cordState.tailEl = tail;

      // 类别标签（绳顶）
      var tag = createSvgEl('text', {
        class: 'cord-tag',
        x: x,
        y: MAIN_CORD_Y + 22
      });
      tag.textContent = cordData.category;
      cordState.tagEl = tag;
      cordGroup.appendChild(tag);

      // 绘制四个位的结节
      var places = ['thousands', 'hundreds', 'tens', 'units'];
      places.forEach(function(place) {
        var digit = cordData.digits[place];
        var ratio = PLACE_RATIOS[place];
        var kg = drawKnotGroup(cordData, place, digit, ratio, cordGroup);
        cordState.knotGroups[place] = kg;
      });

      pendantCordsEl.appendChild(cordGroup);
    });

    // 初始更新结节位置
    updateAllKnotPositions();
  }

  // ============================================
  // 更新所有结节的位置（跟随绳体摆动）
  // ============================================
  function updateAllKnotPositions() {
    for (var i = 0; i < state.cords.length; i++) {
      var cord = state.cords[i];
      var places = ['thousands', 'hundreds', 'tens', 'units'];

      for (var p = 0; p < places.length; p++) {
        var place = places[p];
        var ratio = PLACE_RATIOS[place];
        var pos = getPointOnCord(cord.x, cord.displacement, ratio);
        var kg = cord.knotGroups[place];
        if (kg) {
          kg.setAttribute('transform', 'translate(' + pos.x + ',' + pos.y + ')');
        }
      }

      // 绳尾
      if (cord.tailEl) {
        var tailX = cord.x + cord.displacement;
        cord.tailEl.setAttribute('cx', tailX);
      }
    }
  }

  // ============================================
  // 物理更新
  // ============================================
  function updatePhysics(dt) {
    var anySwinging = false;

    for (var i = 0; i < state.cords.length; i++) {
      var cord = state.cords[i];
      if (!cord.swinging) continue;

      // 弹簧阻尼运动
      var force = -SPRING_K * cord.displacement - DAMPING * cord.velocity;
      var acceleration = force / MASS;

      cord.velocity += acceleration * dt;
      cord.displacement += cord.velocity * dt;

      // 停止条件
      if (Math.abs(cord.velocity) < SWING_THRESHOLD && Math.abs(cord.displacement) < SWING_THRESHOLD) {
        cord.displacement = 0;
        cord.velocity = 0;
        cord.swinging = false;
      } else {
        anySwinging = true;
      }

      // 更新绳体路径
      cord.pathEl.setAttribute('d', getCordPath(cord.x, cord.displacement));
    }

    // 更新结节位置
    if (anySwinging) {
      updateAllKnotPositions();
    }

    return anySwinging;
  }

  // ============================================
  // 结节点亮序列
  // ============================================
  function startKnotIllumination(cordId) {
    var cord = state.cords[cordId];
    if (!cord || cord.decoded) return;

    var places = ['thousands', 'hundreds', 'tens', 'units'];
    var delay = 0;
    var illumInterval = 320; // 每位点亮间隔

    places.forEach(function(place, idx) {
      var digit = cord.data.digits[place];
      // 跳过零位（但也要等待时间，保持节奏）
      setTimeout(function() {
        if (state.cords[cordId] && state.cords[cordId].id === cordId) {
          var kg = cord.knotGroups[place];
          if (kg) {
            kg.classList.add('lit');
          }
          cord.litPlaces.push(place);
        }
      }, delay);
      delay += illumInterval;
    });

    // 全部点亮后显示档案
    setTimeout(function() {
      if (state.cords[cordId] && !state.cords[cordId].decoded) {
        cord.decoded = true;
        showArchive(cord.data);
      }
    }, delay + 200);
  }

  // ============================================
  // 弹拨绳子
  // ============================================
  function pluckCord(cordId, direction) {
    var cord = state.cords[cordId];
    if (!cord) return;

    // 给初速度
    cord.velocity = PLUCK_VELOCITY * (direction > 0 ? 1 : -1);
    cord.swinging = true;

    // 活跃状态
    if (state.activeCordId !== cordId) {
      // 清除旧的活跃
      if (state.activeCordId !== null && state.cords[state.activeCordId]) {
        state.cords[state.activeCordId].pathEl.classList.remove('active');
        state.cords[state.activeCordId].groupEl.classList.remove('active');
      }
      state.activeCordId = cordId;
      cord.pathEl.classList.add('active');
      cord.groupEl.classList.add('active');
    }

    // 启动动画循环
    startAnimation();

    // 开始结点亮序列（稍作延迟，等摆动开始后）
    if (!cord.decoded) {
      setTimeout(function() {
        startKnotIllumination(cordId);
      }, 200);
    } else {
      // 已解码，直接显示档案
      showArchive(cord.data);
    }

    // 隐藏提示
    if (state.hintShown) {
      hintEl.classList.add('hidden');
      state.hintShown = false;
    }
  }

  // ============================================
  // 档案面板
  // ============================================
  function showArchive(data) {
    document.getElementById('archiveRegion').innerHTML =
      data.region + '<span class="quechua">' + data.quechua + '</span>';
    document.getElementById('archiveYear').textContent = data.year;
    document.getElementById('archiveRuler').textContent = data.ruler;
    document.getElementById('archiveUnit').textContent = data.unit;
    document.getElementById('archiveDesc').textContent = data.desc;
    document.getElementById('categoryName').textContent = data.colorName + '绳 · ' + data.category;
    document.getElementById('categoryDot').style.background = data.color;

    // 数字滚动动画
    animateNumber('archiveNumber', data.value);

    archivePanel.classList.add('visible');
  }

  function hideArchive() {
    archivePanel.classList.remove('visible');

    // 清除活跃绳
    if (state.activeCordId !== null && state.cords[state.activeCordId]) {
      state.cords[state.activeCordId].pathEl.classList.remove('active');
      state.cords[state.activeCordId].groupEl.classList.remove('active');
      state.activeCordId = null;
    }
  }

  function animateNumber(elId, target) {
    var el = document.getElementById(elId);
    if (REDUCED_MOTION) {
      el.textContent = target.toLocaleString();
      return;
    }

    var duration = 800;
    var start = 0;
    var startTime = null;

    function step(timestamp) {
      if (!state.visible) {
        // 页面隐藏时直接设终值
        el.textContent = target.toLocaleString();
        return;
      }
      if (!startTime) startTime = timestamp;
      var progress = Math.min((timestamp - startTime) / duration, 1);
      // easeOutCubic
      var eased = 1 - Math.pow(1 - progress, 3);
      var current = Math.round(start + (target - start) * eased);
      el.textContent = current.toLocaleString();

      if (progress < 1) {
        requestAnimationFrame(step);
      }
    }

    requestAnimationFrame(step);
  }

  // ============================================
  // 主动画循环
  // ============================================
  function startAnimation() {
    if (state.animating) return;
    state.animating = true;
    state.lastTime = performance.now();
    animate(state.lastTime);
  }

  function animate(timestamp) {
    if (!state.visible) {
      state.animating = false;
      state.rafId = null;
      return;
    }

    var dt = (timestamp - state.lastTime) / 1000;
    // 限制最大 dt，防止切换标签后大跳
    if (dt > 0.05) dt = 0.05;
    state.lastTime = timestamp;

    var anySwinging = updatePhysics(dt);

    if (anySwinging) {
      state.rafId = requestAnimationFrame(animate);
    } else {
      state.animating = false;
      state.rafId = null;
    }
  }

  // ============================================
  // 交互事件
  // ============================================
  function getMousePositionInSvg(clientX, clientY) {
    var rect = stage.getBoundingClientRect();
    var scaleX = STAGE_W / rect.width;
    var scaleY = STAGE_H / rect.height;
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY
    };
  }

  function findNearestCord(mouseX) {
    var minDist = Infinity;
    var nearestId = null;
    var direction = 1;

    for (var i = 0; i < state.cords.length; i++) {
      var cord = state.cords[i];
      var dist = Math.abs(mouseX - cord.x);
      if (dist < minDist) {
        minDist = dist;
        nearestId = cord.id;
        direction = mouseX > cord.x ? 1 : -1;
      }
    }

    // 只有在一定范围内才算命中
    if (minDist < 50) {
      return { id: nearestId, direction: direction, distance: minDist };
    }
    return null;
  }

  // 鼠标移动（更新自定义光标 + 悬停效果）
  var mouseX = window.innerWidth / 2;
  var mouseY = window.innerHeight / 2;
  var targetMouseX = mouseX;
  var targetMouseY = mouseY;
  var mouseRaf = null;
  var hoveredCordId = null;

  function updateCursor() {
    if (window.innerWidth <= 900) return; // 移动端不显示自定义光标
    // 缓动跟随
    mouseX += (targetMouseX - mouseX) * 0.25;
    mouseY += (targetMouseY - mouseY) * 0.25;
    cursorEl.style.transform =
      'translate(' + (mouseX - 16) + 'px, ' + (mouseY - 16) + 'px) ' +
      (cursorEl.classList.contains('hover-cord') ? 'rotate(45deg) scale(1.15)' : '') +
      (cursorEl.classList.contains('plucking') ? 'scale(0.9)' : '');
    mouseRaf = requestAnimationFrame(updateCursor);
  }

  document.addEventListener('mousemove', function(e) {
    targetMouseX = e.clientX;
    targetMouseY = e.clientY;

    if (!mouseRaf) {
      mouseRaf = requestAnimationFrame(updateCursor);
    }

    // 悬停检测
    var svgPos = getMousePositionInSvg(e.clientX, e.clientY);
    var nearest = findNearestCord(svgPos.x);

    if (nearest && svgPos.y > MAIN_CORD_Y + 20 && svgPos.y < CORD_BOTTOM_Y - 20) {
      if (hoveredCordId !== nearest.id) {
        hoveredCordId = nearest.id;
        cursorEl.classList.add('hover-cord');
      }
    } else {
      if (hoveredCordId !== null) {
        hoveredCordId = null;
        cursorEl.classList.remove('hover-cord');
      }
    }
  });

  // 点击弹拨
  stage.addEventListener('click', function(e) {
    var svgPos = getMousePositionInSvg(e.clientX, e.clientY);
    var nearest = findNearestCord(svgPos.x);

    if (nearest && svgPos.y > MAIN_CORD_Y + 20 && svgPos.y < CORD_BOTTOM_Y + 20) {
      // 弹拨方向基于点击位置在绳的哪一侧
      var direction = svgPos.x > state.cords[nearest.id].x ? 1 : -1;
      pluckCord(nearest.id, direction);

      // 光标弹拨反馈
      cursorEl.classList.add('plucking');
      setTimeout(function() {
        cursorEl.classList.remove('plucking');
      }, 150);
    }
  });

  // 关闭档案
  archiveClose.addEventListener('click', function(e) {
    e.stopPropagation();
    hideArchive();
  });

  // 键盘 ESC 关闭档案
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      hideArchive();
    }
  });

  // ============================================
  // 光尘粒子（档案室斜光中的悬浮微粒）
  // ============================================
  function initDustParticles() {
    if (REDUCED_MOTION) return;

    var count = 18;
    for (var i = 0; i < count; i++) {
      var particle = document.createElement('div');
      particle.className = 'dust-particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.top = Math.random() * 60 + 20 + '%';
      particle.style.width = (Math.random() * 2 + 1) + 'px';
      particle.style.height = particle.style.width;
      particle.style.opacity = (Math.random() * 0.3 + 0.1).toString();
      dustContainer.appendChild(particle);

      animateDustParticle(particle);
    }
  }

  function animateDustParticle(particle) {
    var speed = Math.random() * 0.3 + 0.1; // 每秒像素
    var swaySpeed = Math.random() * 0.5 + 0.2;
    var swayAmp = Math.random() * 15 + 5;
    var startTime = Math.random() * 1000;
    var startX = parseFloat(particle.style.left);
    var startY = parseFloat(particle.style.top);
    var rafId = null;

    function step(timestamp) {
      if (!state.visible) {
        rafId = null;
        return;
      }
      var t = (timestamp + startTime) / 1000;
      var x = startX + Math.sin(t * swaySpeed) * swayAmp * 0.1;
      var y = startY + Math.sin(t * swaySpeed * 0.7) * 2;

      particle.style.left = x + '%';
      particle.style.top = y + '%';
      particle.style.opacity = (0.1 + Math.sin(t * 0.8) * 0.08).toString();

      rafId = requestAnimationFrame(step);
    }

    // 延迟启动，错开相位
    setTimeout(function() {
      if (state.visible) {
        rafId = requestAnimationFrame(step);
      }
    }, Math.random() * 3000);
  }

  // ============================================
  // 入场动画
  // ============================================
  function playEntranceAnimation() {
    if (REDUCED_MOTION) return;

    // 子绳逐根"滴落"入场
    var cordGroups = pendantCordsEl.querySelectorAll('.cord-group');
    cordGroups.forEach(function(group, index) {
      group.style.opacity = '0';
      group.style.transform = 'translateY(-30px)';
      group.style.transition = 'opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1)';

      setTimeout(function() {
        group.style.opacity = '1';
        group.style.transform = 'translateY(0)';
      }, 200 + index * 120);
    });

    // 提示文字淡入
    hintEl.style.opacity = '0';
    setTimeout(function() {
      hintEl.style.opacity = '';
    }, 1200);
  }

  // ============================================
  // 主绳微摆动（环境感）
  // ============================================
  var mainCordSwayTime = 0;
  var mainCordRafId = null;

  function startMainCordSway() {
    if (REDUCED_MOTION) return;

    function step(timestamp) {
      if (!state.visible) {
        mainCordRafId = null;
        return;
      }
      mainCordSwayTime += 0.016;

      // 主绳非常轻微的呼吸式波动
      var sway = Math.sin(mainCordSwayTime * 0.3) * 1.5;
      var mainCordPath = 'M 60 ' + (MAIN_CORD_Y + sway * 0.3) +
                         ' C 400 ' + (MAIN_CORD_Y - 8 + sway) +
                         ', 1200 ' + (MAIN_CORD_Y - 8 - sway * 0.7) +
                         ', 1540 ' + (MAIN_CORD_Y + sway * 0.5);
      mainCordEl.setAttribute('d', mainCordPath);

      // 挂珠跟随
      var beads = mainCordBeadsEl.querySelectorAll('.main-cord-bead');
      for (var i = 0; i < beads.length; i++) {
        var bead = beads[i];
        var cx = parseFloat(bead.getAttribute('cx'));
        // 基于位置计算主绳在该点的 y 偏移
        var t = (cx - 60) / 1480; // 归一化
        var yOffset = Math.sin(t * Math.PI) * sway * 0.8 + sway * 0.3;
        bead.setAttribute('cy', MAIN_CORD_Y - 1 + yOffset);
      }

      mainCordRafId = requestAnimationFrame(step);
    }

    mainCordRafId = requestAnimationFrame(step);
  }

  // ============================================
  // 可见性处理（RAF随页面可见性暂停）
  // ============================================
  document.addEventListener('visibilitychange', function() {
    state.visible = !document.hidden;
    if (state.visible) {
      state.lastTime = performance.now();
      // 重新启动主动画
      if (state.animating && !state.rafId) {
        state.rafId = requestAnimationFrame(animate);
      }
      // 重新启动主绳摆动
      if (!mainCordRafId && !REDUCED_MOTION) {
        startMainCordSway();
      }
    }
  });

  // ============================================
  // 页面卸载清理
  // ============================================
  window.addEventListener('beforeunload', function() {
    if (state.rafId) {
      cancelAnimationFrame(state.rafId);
    }
    if (mouseRaf) {
      cancelAnimationFrame(mouseRaf);
    }
    if (mainCordRafId) {
      cancelAnimationFrame(mainCordRafId);
    }
  });

  // ============================================
  // 触屏支持
  // ============================================
  stage.addEventListener('touchstart', function(e) {
    if (e.touches.length === 0) return;
    var touch = e.touches[0];
    var svgPos = getMousePositionInSvg(touch.clientX, touch.clientY);
    var nearest = findNearestCord(svgPos.x);

    if (nearest && svgPos.y > MAIN_CORD_Y + 20 && svgPos.y < CORD_BOTTOM_Y + 20) {
      var direction = svgPos.x > state.cords[nearest.id].x ? 1 : -1;
      pluckCord(nearest.id, direction);
    }
  }, { passive: true });

  // ============================================
  // 初始化
  // ============================================
  function init() {
    initQuipu();
    initDustParticles();
    playEntranceAnimation();
    startMainCordSway();

    // 光标初始位置居中
    cursorEl.style.transform = 'translate(calc(50vw - 16px), calc(50vh - 16px))';
    mouseX = window.innerWidth / 2;
    mouseY = window.innerHeight / 2;
    targetMouseX = mouseX;
    targetMouseY = mouseY;
  }

  // DOM 就绪即启动，避免等待资源
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>

</body>

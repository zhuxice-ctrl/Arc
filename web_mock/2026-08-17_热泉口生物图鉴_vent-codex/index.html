<style>
/* ============================================================
   HYDROTHERMAL VENT CODEX — Global Styles
   Palette:
     --abyss:      #0A0E10  deep charcoal (page bg)
     --copper:     #D4502A  vent fluid / primary
     --sulfur:     #F2C14E  mineral deposits / accent
     --biolum:     #3A8E7C  bioluminescence / secondary
   ============================================================ */

:root {
  --abyss: #0A0E10;
  --abyss-2: #0E1417;
  --abyss-3: #131B1E;
  --copper: #D4502A;
  --copper-dim: #9E3B1E;
  --sulfur: #F2C14E;
  --sulfur-dim: #B8913A;
  --biolum: #3A8E7C;
  --biolum-bright: #5CB89E;
  --mist: #C8B89A;
  --bone: #E8DFD0;
  --ash: #6B7270;
  --ash-light: #8A9190;
  --vent-shadow: rgba(212, 80, 42, 0.35);
  --bio-shadow: rgba(58, 142, 124, 0.4);

  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Space Grotesk', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--abyss);
  color: var(--bone);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
  cursor: none; /* custom cursor */
  -webkit-font-smoothing: antialiased;
}

/* hide custom cursor on touch devices */
@media (hover: none) {
  body { cursor: auto; }
  .custom-cursor, .cursor-dot, .cursor-glow { display: none !important; }
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: none; background: none; border: none; color: inherit; }

img { max-width: 100%; display: block; }

/* ===========  Custom Cursor  =========== */
.custom-cursor {
  position: fixed;
  top: 0; left: 0;
  width: 0; height: 0;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  will-change: transform;
}
.cursor-ring {
  position: absolute;
  top: 50%; left: 50%;
  width: 36px; height: 36px;
  border: 2px solid rgba(255,255,255,0.85);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: width 0.25s cubic-bezier(.2,.8,.2,1),
              height 0.25s cubic-bezier(.2,.8,.2,1),
              border-color 0.3s ease,
              border-style 0.2s ease;
  mix-blend-mode: difference;
}
.cursor-ring::before {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 1px solid var(--copper);
  opacity: 0.5;
  transition: opacity 0.3s ease;
}
.cursor-dot {
  position: absolute;
  top: 50%; left: 50%;
  width: 6px; height: 6px;
  background: var(--copper);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 8px var(--copper), 0 0 16px rgba(212,80,42,0.6);
  transition: width 0.2s ease, height 0.2s ease, background 0.2s ease;
}
.cursor-glow {
  position: absolute;
  top: 50%; left: 50%;
  width: 80px; height: 80px;
  background: radial-gradient(circle, rgba(212,80,42,0.15) 0%, transparent 70%);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  transition: width 0.4s ease, height 0.4s ease, background 0.4s ease;
}

/* hover states */
.custom-cursor.is-hover .cursor-ring {
  width: 64px; height: 64px;
  border-color: var(--sulfur);
  border-style: dashed;
  animation: cursorSpin 4s linear infinite;
}
.custom-cursor.is-hover .cursor-ring::before {
  opacity: 0;
}
.custom-cursor.is-hover .cursor-dot {
  width: 4px; height: 4px;
  background: var(--sulfur);
  box-shadow: 0 0 6px var(--sulfur);
}
.custom-cursor.is-hover .cursor-glow {
  width: 140px; height: 140px;
  background: radial-gradient(circle, rgba(242,193,78,0.18) 0%, transparent 70%);
}

/* click ripple */
.cursor-ripple {
  position: absolute;
  top: 50%; left: 50%;
  width: 0; height: 0;
  border: 2px solid var(--biolum-bright);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  opacity: 0;
  pointer-events: none;
  animation: cursorRipple 0.7s ease-out forwards;
}

@keyframes cursorSpin {
  from { transform: translate(-50%, -50%) rotate(0deg); }
  to   { transform: translate(-50%, -50%) rotate(360deg); }
}
@keyframes cursorRipple {
  0%   { width: 0; height: 0; opacity: 1; border-width: 3px; }
  100% { width: 80px; height: 80px; opacity: 0; border-width: 1px; }
}

/* ===========  Particle / Bubble Canvas  =========== */
#bubble-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 1;
}

/* ===========  Navigation  =========== */
.nav-bar {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  padding: 22px 48px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 100;
  background: linear-gradient(to bottom, rgba(10,14,16,0.85) 0%, transparent 100%);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.nav-logo {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 500;
  letter-spacing: 0.08em;
  color: var(--bone);
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav-logo-mark {
  width: 26px; height: 26px;
  border: 1.5px solid var(--copper);
  border-radius: 50%;
  position: relative;
}
.nav-logo-mark::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 8px; height: 8px;
  background: var(--copper);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 8px var(--copper);
  animation: logoPulse 3s ease-in-out infinite;
}
@keyframes logoPulse {
  0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
  50%      { opacity: 1;   transform: translate(-50%, -50%) scale(1.3); }
}
.nav-links {
  display: flex;
  gap: 36px;
  list-style: none;
}
.nav-links a {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ash-light);
  position: relative;
  padding-bottom: 4px;
  transition: color 0.3s ease;
}
.nav-links a:hover {
  color: var(--sulfur);
}
.nav-links a::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0;
  width: 0; height: 1px;
  background: var(--sulfur);
  transition: width 0.4s cubic-bezier(.2,.8,.2,1);
}
.nav-links a:hover::after { width: 100%; }

.nav-depth {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--biolum-bright);
  letter-spacing: 0.08em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-depth-value {
  font-variant-numeric: tabular-nums;
  color: var(--bone);
  font-size: 13px;
  font-weight: 500;
}

/* ===========  Hero Section  =========== */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 0 48px;
}
.hero-inner {
  position: relative;
  z-index: 2;
  max-width: 1200px;
  width: 100%;
  text-align: left;
}
.hero-eyebrow {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--copper);
  margin-bottom: 28px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.hero-eyebrow::before {
  content: '';
  width: 32px; height: 1px;
  background: var(--copper);
}
.hero-title {
  font-family: var(--font-display);
  font-size: clamp(48px, 8vw, 120px);
  font-weight: 300;
  line-height: 0.95;
  letter-spacing: -0.02em;
  color: var(--bone);
  margin-bottom: 36px;
}
.hero-title em {
  font-style: italic;
  font-weight: 400;
  color: var(--copper);
}
.hero-title .sulfur { color: var(--sulfur); font-style: italic; font-weight: 400; }

.typewriter-line {
  font-family: var(--font-mono);
  font-size: 14px;
  color: var(--biolum-bright);
  min-height: 28px;
  margin-bottom: 48px;
  letter-spacing: 0.04em;
  max-width: 640px;
}
.typewriter-line::after {
  content: '▋';
  display: inline-block;
  margin-left: 2px;
  color: var(--biolum);
  animation: blink 1s steps(2) infinite;
}
@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}

.hero-meta {
  display: flex;
  gap: 56px;
  margin-bottom: 56px;
  flex-wrap: wrap;
}
.hero-meta-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.hero-meta-label {
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--ash);
}
.hero-meta-value {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 300;
  color: var(--bone);
  font-variant-numeric: tabular-nums;
}
.hero-meta-value .unit {
  font-size: 14px;
  font-family: var(--font-body);
  font-weight: 300;
  color: var(--ash-light);
  margin-left: 4px;
}

.hero-cta-row {
  display: flex;
  gap: 20px;
  align-items: center;
  flex-wrap: wrap;
}
.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 16px 32px;
  background: var(--copper);
  color: var(--abyss);
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  position: relative;
  overflow: hidden;
  transition: all 0.3s ease;
  border: 1px solid var(--copper);
}
.btn-primary::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
  transition: left 0.6s ease;
}
.btn-primary:hover::before { left: 100%; }
.btn-primary:hover {
  background: var(--sulfur);
  border-color: var(--sulfur);
  box-shadow: 0 0 30px var(--vent-shadow);
}
.btn-ghost {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 16px 32px;
  border: 1px solid var(--ash);
  color: var(--bone);
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}
.btn-ghost:hover {
  border-color: var(--biolum);
  color: var(--biolum-bright);
  box-shadow: 0 0 20px rgba(58,142,124,0.2), inset 0 0 20px rgba(58,142,124,0.05);
}
.btn-arrow {
  font-size: 16px;
  transition: transform 0.3s ease;
}
.btn-primary:hover .btn-arrow,
.btn-ghost:hover .btn-arrow {
  transform: translateX(4px);
}

/* hero vent graphic */
.hero-vent {
  position: absolute;
  right: -5%;
  bottom: 0;
  width: 45%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}
.hero-vent svg {
  width: 100%; height: 100%;
}

/* ===========  Section common  =========== */
.section {
  position: relative;
  padding: 140px 48px;
  z-index: 2;
}
.section-inner {
  max-width: 1280px;
  margin: 0 auto;
}
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 64px;
  gap: 40px;
  flex-wrap: wrap;
}
.section-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--copper);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.section-eyebrow::before {
  content: '';
  width: 20px; height: 1px;
  background: var(--copper);
}
.section-title {
  font-family: var(--font-display);
  font-size: clamp(36px, 5vw, 64px);
  font-weight: 300;
  line-height: 1.05;
  letter-spacing: -0.015em;
  color: var(--bone);
}
.section-title em { font-style: italic; color: var(--copper); font-weight: 400; }
.section-desc {
  max-width: 460px;
  font-size: 15px;
  line-height: 1.7;
  color: var(--ash-light);
  font-weight: 300;
}
.section-number {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ash);
  letter-spacing: 0.1em;
}

/* scroll reveal */
.reveal {
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.9s cubic-bezier(.2,.8,.2,1), transform 0.9s cubic-bezier(.2,.8,.2,1);
}
.reveal.is-visible {
  opacity: 1;
  transform: translateY(0);
}
.reveal-delay-1 { transition-delay: 0.1s; }
.reveal-delay-2 { transition-delay: 0.2s; }
.reveal-delay-3 { transition-delay: 0.35s; }
.reveal-delay-4 { transition-delay: 0.5s; }

/* ===========  Creature Gallery  =========== */
.gallery-section {
  background: linear-gradient(180deg, var(--abyss) 0%, var(--abyss-2) 100%);
}
.gallery-filter {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 40px;
}
.filter-chip {
  padding: 10px 20px;
  border: 1px solid var(--ash);
  color: var(--ash-light);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}
.filter-chip:hover {
  border-color: var(--sulfur);
  color: var(--sulfur);
}
.filter-chip.active {
  background: var(--copper);
  border-color: var(--copper);
  color: var(--abyss);
  font-weight: 500;
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}
@media (max-width: 900px) { .gallery-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .gallery-grid { grid-template-columns: 1fr; } }

.creature-card {
  position: relative;
  background: var(--abyss-3);
  border: 1px solid rgba(255,255,255,0.06);
  overflow: hidden;
  cursor: none;
  transform-style: preserve-3d;
  perspective: 800px;
  transition: border-color 0.4s ease, box-shadow 0.4s ease;
}
.creature-card:hover {
  border-color: rgba(212,80,42,0.4);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(212,80,42,0.1);
}
.creature-card-inner {
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  position: relative;
}

.creature-visual {
  position: relative;
  height: 220px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 50%, rgba(58,142,124,0.08) 0%, transparent 70%);
  margin: -28px -28px 0;
  overflow: hidden;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.creature-visual svg {
  width: 60%;
  height: auto;
  filter: drop-shadow(0 0 20px rgba(58,142,124,0.3));
  transition: transform 0.5s cubic-bezier(.2,.8,.2,1), filter 0.4s ease;
}
.creature-card:hover .creature-visual svg {
  filter: drop-shadow(0 0 30px var(--bio-shadow)) drop-shadow(0 0 60px rgba(58,142,124,0.2));
}

/* gloss sweep */
.creature-visual::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 50%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
  transform: skewX(-20deg);
  transition: left 0.8s ease;
  pointer-events: none;
}
.creature-card:hover .creature-visual::after { left: 150%; }

.creature-index {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ash);
  letter-spacing: 0.1em;
}
.creature-name {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 400;
  color: var(--bone);
  letter-spacing: -0.01em;
}
.creature-latin {
  font-family: var(--font-display);
  font-size: 14px;
  font-style: italic;
  color: var(--biolum-bright);
  font-weight: 300;
  margin-top: -10px;
}
.creature-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,0.06);
}
.creature-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.stat-label {
  font-family: var(--font-mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ash);
}
.stat-value {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 400;
  color: var(--sulfur);
  font-variant-numeric: tabular-nums;
}

/* bioluminescent pulse dot */
.pulse-dot {
  position: absolute;
  top: 20px; right: 20px;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--biolum);
  box-shadow: 0 0 6px var(--biolum), 0 0 12px var(--biolum);
  z-index: 3;
}
.pulse-dot::before,
.pulse-dot::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 1px solid var(--biolum-bright);
  opacity: 0;
  animation: bioPulse 2.8s ease-in-out infinite;
}
.pulse-dot::after { animation-delay: 1.4s; }
@keyframes bioPulse {
  0%   { transform: scale(0.6); opacity: 0.8; }
  100% { transform: scale(3);   opacity: 0;   }
}

/* ===========  Vent Map Section  =========== */
.map-section {
  background: var(--abyss-2);
  position: relative;
  overflow: hidden;
}
.map-section::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background:
    radial-gradient(circle at 20% 30%, rgba(212,80,42,0.04) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(58,142,124,0.04) 0%, transparent 40%);
  pointer-events: none;
}
.map-container {
  position: relative;
  width: 100%;
  aspect-ratio: 2 / 1;
  border: 1px solid rgba(255,255,255,0.06);
  background: var(--abyss-3);
  overflow: hidden;
}
.map-svg {
  width: 100%; height: 100%;
  display: block;
}
.vent-marker {
  cursor: none;
  transition: all 0.3s ease;
}
.vent-marker .vent-dot {
  fill: var(--copper);
  filter: drop-shadow(0 0 6px rgba(212,80,42,0.8));
  transition: r 0.3s ease, fill 0.3s ease;
}
.vent-marker:hover .vent-dot {
  fill: var(--sulfur);
  filter: drop-shadow(0 0 12px rgba(242,193,78,0.9));
}
.vent-marker .vent-pulse {
  fill: none;
  stroke: var(--copper);
  stroke-width: 1;
  opacity: 0;
  transform-origin: center;
  transform-box: fill-box;
  animation: ventPulse 3s ease-out infinite;
}
.vent-marker:hover .vent-pulse {
  stroke: var(--sulfur);
}
@keyframes ventPulse {
  0%   { r: 4;  opacity: 0.7; }
  100% { r: 20; opacity: 0;   }
}

.map-legend {
  position: absolute;
  bottom: 20px;
  left: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ash-light);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: rgba(10,14,16,0.8);
  backdrop-filter: blur(8px);
  padding: 14px 18px;
  border: 1px solid rgba(255,255,255,0.06);
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}
.legend-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
}
.legend-dot.copper { background: var(--copper); box-shadow: 0 0 6px var(--copper); }
.legend-dot.sulfur { background: var(--sulfur); box-shadow: 0 0 6px var(--sulfur); }

/* ===========  Reduced Motion  =========== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;

<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ============================================================
   Utility: RAF scheduler with visibility pause
   ============================================================ */
const rafRegistry = new Set();
let rafRunning = false;

function rafLoop() {
  if (!rafRunning) return;
  rafRegistry.forEach(fn => fn());
  requestAnimationFrame(rafLoop);
}
function startRaf() {
  if (rafRunning) return;
  rafRunning = true;
  requestAnimationFrame(rafLoop);
}
function stopRaf() {
  rafRunning = false;
}
function addRaf(fn) {
  rafRegistry.add(fn);
  if (rafRegistry.size > 0) startRaf();
}
function removeRaf(fn) {
  rafRegistry.delete(fn);
  if (rafRegistry.size === 0) stopRaf();
}

// visibilitychange: pause/resume
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopRaf();
  else if (rafRegistry.size > 0) startRaf();
});

// IntersectionObserver for scroll reveal
let revealObserver = null;
function getRevealObserver() {
  if (revealObserver) return revealObserver;
  revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });
  return revealObserver;
}

/* ============================================================
   Custom Cursor
   ============================================================ */
function CustomCursor() {
  const cursorRef = useRef(null);
  const ringRef = useRef(null);
  const dotRef = useRef(null);
  const glowRef = useRef(null);
  const stateRef = useRef({
    x: window.innerWidth / 2,
    y: window.innerHeight / 2,
    tx: window.innerWidth / 2,
    ty: window.innerHeight / 2,
    isHover: false,
  });
  const rafIdRef = useRef(null);
  const rippleKeyRef = useRef(0);
  const [ripples, setRipples] = useState([]);

  useEffect(() => {
    const cursor = cursorRef.current;
    if (!cursor) return;

    // center immediately
    cursor.style.transform = `translate(${stateRef.current.x}px, ${stateRef.current.y}px)`;

    const onMove = (e) => {
      stateRef.current.tx = e.clientX;
      stateRef.current.ty = e.clientY;
    };

    // hover detection
    const onOver = (e) => {
      const target = e.target.closest('a, button, .creature-card, .vent-marker, .timeline-item, .reading-card, .filter-chip, .modal-close');
      if (target && cursor) {
        stateRef.current.isHover = true;
        cursor.classList.add('is-hover');
      }
    };
    const onOut = (e) => {
      if (cursor) {
        stateRef.current.isHover = false;
        cursor.classList.remove('is-hover');
      }
    };

    // click ripple
    const onClick = (e) => {
      const key = ++rippleKeyRef.current;
      setRipples(prev => [...prev, { key, x: e.clientX, y: e.clientY }]);
      setTimeout(() => {
        setRipples(prev => prev.filter(r => r.key !== key));
      }, 700);
    };

    const animate = () => {
      const s = stateRef.current;
      // smooth follow
      s.x += (s.tx - s.x) * 0.18;
      s.y += (s.ty - s.y) * 0.18;
      if (cursor) {
        cursor.style.transform = `translate(${s.x}px, ${s.y}px)`;
      }
    };
    addRaf(animate);

    window.addEventListener('mousemove', onMove);
    document.addEventListener('mouseover', onOver);
    document.addEventListener('mouseout', onOut);
    document.addEventListener('click', onClick);

    return () => {
      removeRaf(animate);
      window.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseover', onOver);
      document.removeEventListener('mouseout', onOut);
      document.removeEventListener('click', onClick);
    };
  }, []);

  return (
    <div className="custom-cursor" ref={cursorRef}>
      <div className="cursor-glow" ref={glowRef}></div>
      <div className="cursor-ring" ref={ringRef}></div>
      <div className="cursor-dot" ref={dotRef}></div>
      {ripples.map(r => (
        <div key={r.key} className="cursor-ripple"></div>
      ))}
    </div>
  );
}

/* ============================================================
   Bubble / Thermal Particle Canvas
   ============================================================ */
function BubbleCanvas() {
  const canvasRef = useRef(null);
  const particlesRef = useRef([]);
  const animRef = useRef(null);
  const reducedMotion = useRef(
    window.matchMedia('(prefers-reduced-motion: reduce)').matches
  );

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const DPR = Math.min(window.devicePixelRatio || 1, 2);

    const resize = () => {
      canvas.width = window.innerWidth * DPR;
      canvas.height = window.innerHeight * DPR;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.scale(DPR, DPR);
    };
    resize();
    window.addEventListener('resize', resize);

    // create particles — mix of bubbles (rising) and thermal drift (sinking/mix)
    const COUNT = 60;
    const particles = [];
    for (let i = 0; i < COUNT; i++) {
      const type = Math.random() < 0.7 ? 'bubble' : 'thermal';
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: type === 'bubble'
          ? 0.5 + Math.random() * 2.5
          : 0.8 + Math.random() * 1.5,
        vy: type === 'bubble'
          ? -(0.15 + Math.random() * 0.6)
          : (0.05 + Math.random() * 0.2),
        vx: (Math.random() - 0.5) * 0.15,
        phase: Math.random() * Math.PI * 2,
        speed: 0.005 + Math.random() * 0.012,
        sway: 5 + Math.random() * 20,
        type,
        opacity: 0.15 + Math.random() * 0.5,
      });
    }
    particlesRef.current = particles;

    const animate = () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      ctx.clearRect(0, 0, w, h);

      particles.forEach(p => {
        p.phase += p.speed;
        p.y += p.vy;
        p.x += p.vx + Math.sin(p.phase) * 0.3;

        // wrap around
        if (p.type === 'bubble' && p.y < -10) {
          p.y = h + 10;
          p.x = Math.random() * w;
        }
        if (p.type === 'thermal' && p.y > h + 10) {
          p.y = -10;
          p.x = Math.random() * w;
        }
        if (p.x < -20) p.x = w + 20;
        if (p.x > w + 20) p.x = -20;

        ctx.beginPath();
        if (p.type === 'bubble') {
          ctx.strokeStyle = `rgba(242, 193, 78, ${p.opacity * 0.4})`;
          ctx.lineWidth = 0.5;
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.stroke();
          // highlight
          ctx.fillStyle = `rgba(242, 193, 78, ${p.opacity * 0.8})`;
          ctx.beginPath();
          ctx.arc(p.x - p.r * 0.3, p.y - p.r * 0.3, p.r * 0.25, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // thermal particle — copper glow
          const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
          grd.addColorStop(0, `rgba(212, 80, 42, ${p.opacity * 0.7})`);
          grd.addColorStop(1, 'rgba(212, 80, 42, 0)');
          ctx.fillStyle = grd;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    };

    if (!reducedMotion.current) {
      addRaf(animate);
    }

    return () => {
      removeRaf(animate);
      window.removeEventListener('resize', resize);
    };
  }, []);

  return <canvas id="bubble-canvas" ref={canvasRef} />;
}

/* ============================================================
   Navigation
   ============================================================ */
function Navigation({ depth }) {
  const [scrolled, setScrolled] = useState(false);

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 40);
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  const handleNav = (e, href) => {
    e.preventDefault();
    const target = document.querySelector(href);
    if (target) target.scrollIntoView({ behavior: 'smooth' });
  };

  return (
    <nav className="nav-bar">
      <a href="#top" className="nav-logo" onClick={(e) => handleNav(e, '#top')}>
        <span className="nav-logo-mark"></span>
        <span>VENT CODEX</span>
      </a>
      <ul className="nav-links">
        <li><a href="#creatures" onClick={(e) => handleNav(e, '#creatures')}>Creatures</a></li>
        <li><a href="#map" onClick={(e) => handleNav(e, '#map')}>Vents</a></li>
        <li><a href="#timeline" onClick={(e) => handleNav(e, '#timeline')}>Expeditions</a></li>
        <li><a href="#reading" onClick={(e) => handleNav(e, '#reading')}>Journal</a></li>
      </ul>
      <div className="nav-depth">
        <span>DEPTH</span>
        <span className="nav-depth-value">{depth.toFixed(0)} m</span>
      </div>
    </nav>
  );
}

/* ============================================================
   Typewriter
   ============================================================ */
function TypewriterLine({ phrases }) {
  const [text, setText] = useState('');
  const [phraseIdx, setPhraseIdx] = useState(0);
  const [deleting, setDeleting] = useState(false);
  const timeoutRef = useRef(null);

  useEffect(() => {
    const full = phrases[phraseIdx % phrases.length];
    let delay;

    if (!deleting && text === full) {
      delay = 1800;
      timeoutRef.current = setTimeout(() => setDeleting(true), delay);
    } else if (deleting && text === '') {
      delay = 300;
      timeoutRef.current = setTimeout(() => {
        setDeleting(false);
        setPhraseIdx(i => i + 1);
      }, delay);
    } else {
      delay = deleting ? 30 : 55;
      timeoutRef.current = setTimeout(() => {
        setText(prev => deleting
          ? prev.slice(0, -1)
          : full.slice(0, prev.length + 1)
        );
      }, delay);
    }

    return () => clearTimeout(timeoutRef.current);
  }, [text, deleting, phraseIdx, phrases]);

  useEffect(() => {
    return () => clearTimeout(timeoutRef.current);
  }, []);

  return <div className="typewriter-line">{text}</div>;
}

/* ============================================================
   Number Counter (scroll-triggered)
   ============================================================ */
function NumberCounter({ value, suffix = '', duration = 2000 }) {
  const [display, setDisplay] = useState(0);
  const ref = useRef(null);
  const startedRef = useRef(false);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !startedRef.current) {
          startedRef.current = true;
          const start = 0;
          const startTime = performance.now();
          const tick = (now) => {
            const p = Math.min((now - startTime) / duration, 1);
            // easeOutCubic
            const eased = 1 - Math.pow(1 - p, 3);
            setDisplay(Math.round(start + (value - start) * eased));
            if (p < 1) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        }
      });
    }, { threshold: 0.5 });
    obs.observe(el);
    return () => obs.disconnect();
  }, [value, duration]);

  return (
    <span ref={ref}>
      {display.toLocaleString()}
      {suffix}
    </span>
  );
}

/* ============================================================
   Creature Card with 3D tilt
   ============================================================ */
function CreatureCard({ creature, index, onOpen }) {
  const cardRef = useRef(null);
  const innerRef = useRef(null);

  useEffect(() => {
    const card = cardRef.current;
    const inner = innerRef.current;
    if (!card || !inner) return;

    const onMove = (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const px = x / rect.width;
      const py = y / rect.height;
      const rotateX = (py - 0.5) * -10;
      const rotateY = (px - 0.5) * 12;
      inner.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(0)`;
    };
    const onLeave = () => {
      inner.style.transform = 'perspective(800px) rotateX(0) rotateY(0) translateZ(0)';
    };

    card.addEventListener('mousemove', onMove);
    card.addEventListener('mouseleave', onLeave);

    return () => {
      card.removeEventListener('mousemove', onMove);
      card.removeEventListener('mouseleave', onLeave);
    };
  }, []);

  const handleClick = () => onOpen(creature);

  return (
    <div
      className="creature-card reveal"
      ref={cardRef}
      onClick={handleClick}
      style={{ transitionDelay: `${(index % 3) * 0.1}s` }}
    >
      <div className="creature-card-inner" ref={innerRef} style={{ transition: 'transform 0.2s ease-out' }}>
        <span className="pulse-dot"></span>
        <div className="creature-visual">
          <CreatureSvg type={creature.svg} />
        </div>
        <div className="creature-index">
          SPECIMEN #{String(index + 1).padStart(3, '0')}
        </div>
        <div className="creature-name">{creature.name}</div>
        <div className="creature-latin">{creature.latin}</div>
        <div className="creature-stats">
          <div className="creature-stat">
            <span className="stat-label">Depth</span>
            <span className="stat-value">{creature.depth}</span>
          </div>
          <div className="creature-stat">
            <span className="stat-label">Length</span>
            <span className="stat-value">{creature.length}</span>
          </div>
          <div className="creature-stat">
            <span className="stat-label">Temp</span>
            <span className="stat-value">{creature.temp}</span>
          </div>
        </div>
      </div>
    </div>
  );
}

  const [tooltip, setTooltip] = useState(null);
  const mapRef = useRef(null);

  const vents = [
    { id: 1, name: 'East Pacific Rise', lat: -9, lon: -104, depth: 2600, temp: 350, discovered: 1979, type: 'Fast-spreading' },
    { id: 2, name: 'Mid-Atlantic Ridge', lat: 23, lon: -45, depth: 3650, temp: 365, discovered: 1985, type: 'Slow-spreading' },
    { id: 3, name: 'Juan de Fuca', lat: 46, lon: -130, depth: 2200, temp: 305, discovered: 1984, type: 'Subduction zone' },
    { id: 4, name: 'Gakkel Ridge', lat: 80, lon: 80, depth: 4000, temp: 280, discovered: 2001, type: 'Ultra-slow' },
    { id: 5, name: 'Southwest Indian Ridge', lat: -28, lon: 65, depth: 2800, temp: 320, discovered: 2007, type: 'Ultra-slow' },
    { id: 6, name: 'Lau Basin', lat: -21, lon: -175, depth: 2000, temp: 340, discovered: 1989, type: 'Back-arc' },
    { id: 7, name: 'Manus Basin', lat: -3, lon: 152, depth: 1700, temp: 325, discovered: 1991, type: 'Back-arc' },
    { id: 8, name: 'Galápagos Rift', lat: -1, lon: -86, depth: 2500, temp: 340, discovered: 1977, type: 'Fast-spreading' },
    { id: 9, name: 'Pacific-Antarctic Ridge', lat: -38, lon: -115, depth: 2300, temp: 330, discovered: 2005, type: 'Fast-spreading' },
    { id: 10, name: 'Central Indian Ridge', lat: -5, lon: 70, depth: 3200, temp: 310, discovered: 2001, type: 'Intermediate' },
  ];

  // lat/lon → SVG x/y projection (equirectangular approximation on 1000x500 SVG)
  const project = (lat, lon) => {
    const x = ((lon + 180) / 360) * 1000;
    const y = ((90 - lat) / 180) * 500;
    return { x, y };
  };

  const handleHover = (vent, e) => {
    const map = mapRef.current;
    if (!map) return;
    const rect = map.getBoundingClientRect();
    setTooltip({
      vent,
      x: e.clientX - rect.left + 15,
      y: e.clientY - rect.top - 10,
    });
  };
  const handleMove = (e) => {
    if (!tooltip) return;
    const map = mapRef.current;
    if (!map) return;
    const rect = map.getBoundingClientRect();
    setTooltip(prev => prev ? {
      ...prev,
      x: e.clientX - rect.left + 15,
      y: e.clientY - rect.top - 10,
    } : null);
  };
  const handleLeave = () => setTooltip(null);

  const ref = useRef(null);
  useEffect(() => {
    const obs = getRevealObserver();
    const items = ref.current?.querySelectorAll('.reveal');
    items?.forEach(el => obs.observe(el));
    return () => items?.forEach(el => obs.unobserve(el));
  }, []);

  return (
    <section className="section map-section" id="map" ref={ref}>
      <div className="section-inner">
        <div className="section-header">
          <div className="reveal">
            <div className="section-eyebrow">§ 03 — Vent Distribution</div>
            <h2 className="section-title">
              Chimneys of the <em>Abyss</em>
            </h2>
          </div>
          <p className="section-desc reveal reveal-delay-2">
            Over 700 hydrothermal vent fields have been documented across
            the global mid-ocean ridge system. Each is a distinct island of
            life, connected by deep-ocean currents and larval dispersal.
          </p>
        </div>

        <div className="map-container reveal reveal-delay-2" ref={mapRef} onMouseMove={handleMove}>
          <svg className="map-svg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet">
            {/* depth contour background */}
            <defs>
              <radialGradient id="oceanGrad" cx="50%" cy="50%">
                <stop offset="0%" stopColor="#131B1E"/>
                <stop offset="100%" stopColor="#0A0E10"/>
              </radialGradient>
              <pattern id="ridgeTexture" patternUnits="userSpaceOnUse" width="40" height="40">
                <path d="M0 20 Q10 15 20 20 T40 20" stroke="rgba(212,80,42,0.06)" strokeWidth="0.5" fill="none"/>
              </pattern>
            </defs>
            <rect width="1000" height="500" fill="url(#oceanGrad)"/>
            <rect width="1000" height="500" fill="url(#ridgeTexture)"/>

            {/* simplified ridge lines */}
            <path d="M250 100 Q280 200 300 280 Q320 380 350 450"
              stroke="rgba(212,80,42,0.15)" strokeWidth="2" fill="none" strokeDasharray="4 6"/>
            <path d="M550 80 Q580 180 620 250 Q660 320 680 420"
              stroke="rgba(212,80,42,0.15)" strokeWidth="2" fill="none" strokeDasharray="4 6"/>
            <path d="M800 120 Q820 220 850 320"
              stroke="rgba(212,80,42,0.15)" strokeWidth="2" fill="none" strokeDasharray="4 6"/>
            {/* equator */}
            <line x1="0" y1="250" x2="1000" y2="250"
              stroke="rgba(255,255,255,0.04)" strokeWidth="1" strokeDasharray="2 4"/>

            {/* stylized continents (very simplified outlines) */}
            <g fill="rgba(200,184,154,0.04)" stroke="rgba(200,184,154,0.1)" strokeWidth="0.5">
              {/* N America */}
              <path d="M120 80 L200 70 L230 110 L260 140 L240 200 L200 230 L160 220 L130 180 L110 140 Z"/>
              {/* S America */}
              <path d="M200 260 L240 250 L260 300 L270 380 L250 440 L220 460 L200 420 L190 360 Z"/>
              {/* Europe */}
              <path d="M450 70 L510 60 L540 90 L520 140 L480 160 L440 140 Z"/>
              {/* Africa */}
              <path d="M460 180 L530 170 L560 220 L550 300 L520 380 L480 400 L450 340 L440 260 Z"/>
              {/* Asia */}
              <path d="M560 50 L720 40 L780 90 L800 160 L760 220 L700 230 L640 210 L590 180 L560 130 Z"/>
              {/* Australia */}
              <path d="M800 320 L880 310 L900 350 L890 390 L840 400 L800 380 Z"/>
              {/* Antarctica hint */}
              <path d="M100 480 L900 480 L880 500 L120 500 Z"/>
            </g>

            {/* vent markers */}
            {vents.map((v, i) => {
              const { x, y } = project(v.lat, v.lon);
              return (
                <g key={v.id}
                   className="vent-marker"
                   onMouseEnter={(e) => handleHover(v, e)}
                   onMouseLeave={handleLeave}
                   style={{ animationDelay: `${i * 0.2}s` }}
                >
                  <circle className="vent-pulse" cx={x} cy={y} r="4"
                    style={{ animationDelay: `${i * 0.3}s` }}/>
                  <circle className="vent-dot" cx={x} cy={y} r="4"/>
                </g>
              );
            })}
          </svg>

          {/* legend */}
          <div className="map-legend">
            <div className="legend-item">
              <span className="legend-dot copper"></span>
              <span>Active Vent Field</span>
            </div>
            <div className="legend-item">
              <span className="legend-dot sulfur"></span>
              <span>High-Temperature Black Smoker</span>
            </div>
            <div className="legend-item">
              <span className="legend-dot biolum"></span>
              <span>Bioluminescent Community</span>
            </div>
          </div>

          {/* tooltip */}
          {tooltip && (
            <div
              className={`map-tooltip visible`}
              style={{
                left: Math.min(tooltip.x, 600),
                top: Math.max(tooltip.y - 80, 10),
              }}
            >
              <h4>{tooltip.vent.name}</h4>
              <div className="tt-row">
                <span className="tt-label">Depth</span>
                <span className="tt-val">{tooltip.vent.depth} m</span>
              </div>
              <div className="tt-row">
                <span className="tt-label">Max Temp</span>
                <span className="tt-val">{tooltip.vent.temp}°C</span>
              </div>
              <div className="tt-row">
                <span className="tt-label">Discovered</span>
                <span className="tt-val">{tooltip.vent.discovered}</span>
              </div>
              <div className="tt-row">
                <span className="tt-label">Type</span>
                <span className="tt-val">{tooltip.vent.type}</span>
              </div>
            </div>
          )}
        </div>
      </div>
    </section>
  );
}

    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    ripple.style.width = ripple.style.height = Math.max(rect.width, rect.height) + 'px';
    ripple.style.marginLeft = -Math.max(rect.width, rect.height) / 2 + 'px';
    ripple.style.marginTop = -Math.max(rect.width, rect.height) / 2 + 'px';
    card.appendChild(ripple);
    setTimeout(() => ripple.remove(), 800);
  };

  const ref = useRef(null);
  useEffect(() => {
    const obs = getRevealObserver();
    const items = ref.current?.querySelectorAll('.reveal');
    items?.forEach(el => obs.observe(el));

function SpecimenModal({ creature, onClose }) {
  useEffect(() => {
    const onKey = (e) => e.key === 'Escape' && onClose();
    window.addEventListener('keydown', onKey);
    document.body.style.overflow = creature ? 'hidden' : '';
    return () => {
      window.removeEventListener('keydown', onKey);
      document.body.style.overflow = '';
    };
  }, [creature, onClose]);

  if (!creature) return null;

  return (
    <div className={`modal-overlay ${creature ? 'open' : ''}`} onClick={onClose}>
      <div className="modal-content" onClick={(e) => e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}>×</button>

            <li><a href="#">Newsletter</a></li>
          </ul>
        </div>
      </div>
      <div className="footer-bottom">
        <span>© 2026 Vent Codex Project · Marine Biology Consortium</span>
        <span>Abyssal Station · Long. 106°32'W · Lat. 2°47'S</span>
      </div>
    </footer>
  );
}

/* ============================================================
   Depth Bar (fixed right)
   ============================================================ */
function DepthBar({ scrollPct }) {
  const depth = Math.round(scrollPct * 5000);
  return (
    <div className="depth-bar">
      <div className="depth-bar-fill" style={{ height: `${scrollPct * 100}%` }}></div>
      <div className="depth-bar-label" style={{ top: `${scrollPct * 100}%` }}>
        {depth}m
      </div>
    </div>
  );
}

/* ============================================================
   App Root
   ============================================================ */
function App() {
  const [scrollPct, setScrollPct] = useState(0);
  const [selectedCreature, setSelectedCreature] = useState(null);

  useEffect(() => {
    let ticking = false;
    const onScroll = () => {
      if (!ticking) {
        requestAnimationFrame(() => {
          const h = document.documentElement;
          const total = h.scrollHeight - h.clientHeight;
          const pct = total > 0 ? Math.max(0, Math.min(1, h.scrollTop / total)) : 0;
          setScrollPct(pct);
          ticking = false;
        });
        ticking = true;
      }
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  const depth = scrollPct * 5000;

  return (
    <>
      <CustomCursor />
      <BubbleCanvas />
      <Navigation depth={depth} />
      <DepthBar scrollPct={scrollPct} />

      <HeroSection />
      <GallerySection onOpenCreature={setSelectedCreature} />
      <VentMapSection />
      <TimelineSection />
      <ReadingSection />
      <Footer />

      <SpecimenModal creature={selectedCreature} onClose={() => setSelectedCreature(null)} />
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>

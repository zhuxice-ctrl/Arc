<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>Cirque Brume — Foggy Night Circus</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=IM+Fell+English+SC&family=UnifrakturMaguntia&display=swap" />
  <style>
    /* ---------- Design Tokens ---------- */
    :root {
      --crimson: #7A1E2B;
      --crimson-deep: #4A1018;
      --charcoal: #14100E;
      --charcoal-2: #1E1814;
      --ivory: #F3EAD8;
      --ivory-dim: #C8BFA8;
      --brass: #C89B5A;
      --brass-light: #E4BE7E;
      --brass-dark: #8B6A35;
      --fog: rgba(243, 234, 216, 0.06);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Cormorant Garamond', Georgia, serif;
      background: var(--charcoal);
      color: var(--ivory);
      overflow-x: hidden;
      cursor: none;
      line-height: 1.6;
      font-size: 18px;
    }

    @media (max-width: 768px) {
      body { cursor: auto; font-size: 16px; }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }

    /* ---------- Custom Cursor ---------- */
    .cursor-ring, .cursor-dot {
      position: fixed;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%);
      will-change: transform;
    }
    .cursor-ring {
      width: 36px; height: 36px;
      border: 2px solid var(--ivory);
      border-radius: 50%;
      box-shadow:
        0 0 12px rgba(243, 234, 216, 0.4),
        0 0 24px rgba(200, 155, 90, 0.3),
        inset 0 0 8px rgba(200, 155, 90, 0.2);
      transition: width 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  height 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  border-color 0.25s ease,
                  background 0.25s ease;
    }
    .cursor-ring.hover {
      width: 56px; height: 56px;
      border-color: var(--brass);
      background: rgba(200, 155, 90, 0.08);
    }
    .cursor-ring.click {
      width: 24px; height: 24px;
      border-color: var(--crimson);
    }
    .cursor-dot {
      width: 6px; height: 6px;
      background: var(--brass);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--brass), 0 0 16px var(--brass-light);
    }

    .cursor-ripple {
      position: fixed;
      border: 1.5px solid var(--brass-light);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99998;
      transform: translate(-50%, -50%);
      animation: rippleOut 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes rippleOut {
      0% { width: 0; height: 0; opacity: 1; }
      100% { width: 120px; height: 120px; opacity: 0; }
    }

    @media (max-width: 768px) {
      .cursor-ring, .cursor-dot { display: none; }
    }

    /* ---------- Dust Particles ---------- */
    #dust-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.6;
    }

    /* ---------- Nav ---------- */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 48px;
      mix-blend-mode: difference;
    }
    .nav-logo {
      font-family: 'UnifrakturMaguntia', serif;
      font-size: 22px;
      color: var(--ivory);
      letter-spacing: 1px;
    }
    .nav-links {
      display: flex;
      gap: 36px;
      list-style: none;
      font-family: 'IM Fell English SC', serif;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .nav-links a {
      color: var(--ivory);
      text-decoration: none;
      position: relative;
      padding-bottom: 4px;
      transition: color 0.3s;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 0; height: 1px;
      background: var(--brass);
      transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .nav-links a:hover::after { width: 100%; }
    .nav-links a:hover { color: var(--brass); }

    .nav-cta {
      font-family: 'IM Fell English SC', serif;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--ivory);
      background: transparent;
      border: 1px solid var(--ivory);
      padding: 10px 20px;
      cursor: none;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }
    .nav-cta::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--brass);
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: -1;
    }
    .nav-cta:hover::before { transform: translateY(0); }
    .nav-cta:hover {
      color: var(--charcoal);
      border-color: var(--brass);
    }

    @media (max-width: 768px) {
      .nav { padding: 16px 20px; }
      .nav-links { display: none; }
    }

    /* ---------- Curtain Hero ---------- */
    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('/spark/app/app_17c86hy8xjd/runtime/api/v1/storage/object/bucket_aadkqhkds4kdi_static/static%2Faadkqhafgs6aw_ve_miaoda');
      background-size: cover;
      background-position: center;
      filter: brightness(0.55) contrast(1.05);
    }
    .hero-vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at center top, transparent 0%, rgba(20, 16, 14, 0.4) 50%, var(--charcoal) 100%),
        linear-gradient(to bottom, transparent 60%, var(--charcoal) 100%);
      pointer-events: none;
    }

    /* Curtains */
    .curtain {
      position: absolute;
      top: 0;
      height: 100%;
      width: 50%;
      z-index: 5;
      background:
        repeating-linear-gradient(90deg,
          var(--crimson-deep) 0px,
          var(--crimson) 40px,
          #5a141d 80px,
          var(--crimson) 120px,
          var(--crimson-deep) 160px);
      box-shadow: inset 0 0 80px rgba(0,0,0,0.6);
      transform-origin: center;
      transition: transform 1.8s cubic-bezier(0.77, 0, 0.175, 1);
    }
    .curtain-left { left: 0; border-right: 2px solid var(--brass-dark); }
    .curtain-right { right: 0; border-left: 2px solid var(--brass-dark);
      background:
        repeating-linear-gradient(90deg,
          var(--crimson-deep) 0px,
          var(--crimson) 40px,
          #5a141d 80px,
          var(--crimson) 120px,
          var(--crimson-deep) 160px);
    }
    .curtain.open-left { transform: translateX(-100%); }
    .curtain.open-right { transform: translateX(100%); }

    .curtain-tassel {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 40px;
      background:
        repeating-linear-gradient(90deg,
          var(--brass-dark) 0px,
          var(--brass) 3px,
          var(--brass-dark) 6px);
    }

    /* Spotlight */
    .spotlight {
      position: absolute;
      top: -10%;
      left: 50%;
      width: 600px;
      height: 120vh;
      background: linear-gradient(to bottom,
        rgba(228, 190, 126, 0.12) 0%,
        rgba(200, 155, 90, 0.04) 40%,
        transparent 70%);
      transform-origin: top center;
      transform: translateX(-50%) rotate(-8deg);
      pointer-events: none;
      mix-blend-mode: screen;
      z-index: 3;
      animation: spotlightSwing 8s ease-in-out infinite;
    }
    @keyframes spotlightSwing {
      0%, 100% { transform: translateX(-50%) rotate(-8deg); }
      50% { transform: translateX(-50%) rotate(8deg); }
    }

    .hero-content {
      position: relative;
      z-index: 4;
      text-align: center;
      padding: 0 20px;
    }
    .hero-eyebrow {
      font-family: 'IM Fell English SC', serif;
      font-size: 14px;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: var(--brass);
      margin-bottom: 24px;
      opacity: 0;
      animation: fadeInUp 1s 0.6s forwards;
    }
    .hero-title {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-style: italic;
      font-size: clamp(60px, 12vw, 160px);
      line-height: 0.95;
      color: var(--ivory);
      margin-bottom: 20px;
      letter-spacing: -2px;
      opacity: 0;
      animation: fadeInUp 1s 0.9s forwards;
      text-shadow: 0 2px 40px rgba(200, 155, 90, 0.3);
    }
    .hero-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(18px, 2.5vw, 28px);
      color: var(--ivory-dim);
      margin-bottom: 48px;
      font-weight: 300;
      opacity: 0;
      animation: fadeInUp 1s 1.2s forwards;
    }
    .hero-cta-group {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeInUp 1s 1.5s forwards;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn-primary {
      font-family: 'IM Fell English SC', serif;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--charcoal);
      background: var(--brass);
      border: none;
      padding: 16px 36px;
      cursor: none;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 32px rgba(200, 155, 90, 0.3);
    }
    .btn-primary::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: left 0.6s;
    }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-primary:hover::after { left: 100%; }

    .btn-ghost {
      font-family: 'IM Fell English SC', serif;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--ivory);
      background: transparent;
      border: 1px solid var(--ivory);
      padding: 16px 36px;
      cursor: none;
      position: relative;
      overflow: hidden;
      transition: all 0.3s;
    }
    .btn-ghost:hover {
      border-color: var(--brass);
      color: var(--brass);
    }

    /* Scroll indicator */
    .scroll-indicator {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--ivory-dim);
      font-family: 'IM Fell English SC', serif;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .scroll-indicator-line {
      width: 1px;
      height: 50px;
      background: linear-gradient(to bottom, var(--brass), transparent);
      position: relative;
      overflow: hidden;
    }
    .scroll-indicator-line::after {
      content: '';
      position: absolute;
      top: -20px; left: 0;
      width: 100%; height: 20px;
      background: var(--brass-light);
      animation: scrollDown 2s ease-in-out infinite;
    }
    @keyframes scrollDown {
      0% { top: -20px; }
      100% { top: 100%; }
    }

    /* ---------- Section Shared ---------- */
    .section {
      position: relative;
      padding: 140px 48px;
      z-index: 2;
    }
    .section-inner {
      max-width: 1400px;
      margin: 0 auto;
    }
    .section-label {
      font-family: 'IM Fell English SC', serif;
      font-size: 13px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--brass);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .section-label::before {
      content: '';
      width: 40px; height: 1px;
      background: var(--brass);
    }
    .section-title {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-style: italic;
      font-size: clamp(40px, 6vw, 72px);
      color: var(--ivory);
      line-height: 1.05;
      margin-bottom: 20px;
    }
    .section-desc {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-style: italic;
      color: var(--ivory-dim);
      max-width: 600px;
      margin-bottom: 60px;
    }

    @media (max-width: 768px) {
      .section { padding: 80px 20px; }
    }

    /* ---------- Acts Grid ---------- */
    .acts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 28px;
    }
    .act-card {
      position: relative;
      aspect-ratio: 3/4;
      overflow: hidden;
      cursor: none;
      transform-style: preserve-3d;
      perspective: 1000px;
      transition: transform 0.2s ease-out;
    }
    .act-card-inner {
      position: relative;
      width: 100%; height: 100%;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }
    .act-card:hover .act-card-inner {
      transform: scale(1.03);
    }
    .act-card img {
      width: 100%; height: 100%;
      object-fit: cover;
      filter: brightness(0.7) saturate(1.1);
      transition: filter 0.6s, transform 0.6s;
    }
    .act-card:hover img {
      filter: brightness(0.55) saturate(1.2);
    }
    .act-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top,
        rgba(20, 16, 14, 0.95) 0%,
        rgba(20, 16, 14, 0.4) 50%,
        transparent 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 32px;
    }
    .act-number {
      position: absolute;
      top: 24px; right: 28px;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 60px;
      font-weight: 400;
      color: var(--brass);
      opacity: 0.6;
      line-height: 1;
    }
    .act-name {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      font-style: italic;
      color: var(--ivory);
      margin-bottom: 8px;
      transform: translateY(10px);
      transition: transform 0.4s;
    }
    .act-card:hover .act-name { transform: translateY(0); }
    .act-type {
      font-family: 'IM Fell English SC', serif;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--brass);
      margin-bottom: 12px;
    }
    .act-desc {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      font-style: italic;
      color: var(--ivory-dim);
      line-height: 1.5;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .act-card:hover .act-desc {
      max-height: 100px;
      opacity: 1;
      margin-bottom: 16px;
    }
    .act-detail-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'IM Fell English SC', serif;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--brass);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.4s 0.1s;
      background: none;
      border: none;
      cursor: none;
      padding: 0;
    }
    .act-card:hover .act-detail-btn {
      opacity: 1;
      transform: translateY(0);
    }
    .act-detail-btn:hover { color: var(--brass-light); }
    .act-detail-btn::after {
      content: '→';
      transition: transform 0.3s;
    }
    .act-detail-btn:hover::after { transform: translateX(4px); }

    /* ---------- Act Detail Modal ---------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 16, 14, 0.92);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }
    .modal-content {
      background: var(--charcoal-2);
      border: 1px solid var(--brass-dark);
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      transform: translateY(40px) scale(0.95);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal-overlay.open .modal-content {
      transform: translateY(0) scale(1);
    }
    .modal-img {
      position: relative;
      overflow: hidden;
    }
    .modal-img img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .modal-body {
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .modal-close {
      position: absolute;
      top: 20px; right: 24px;
      width: 36px; height: 36px;
      background: none;
      border: 1px solid var(--brass-dark);
      color: var(--brass);
      font-size: 20px;
      cursor: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      z-index: 10;
    }
    .modal-close:hover {
      background: var(--crimson);
      border-color: var(--crimson);
      color: var(--ivory);
      transform: rotate(90deg);
    }
    .modal-label {
      font-family: 'IM Fell English SC', serif;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--brass);
    }
    .modal-title {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      font-weight: 700;
      font-style: italic;
      color: var(--ivory);
      line-height: 1.1;
    }
    .modal-desc {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      color: var(--ivory-dim);
      line-height: 1.7;
    }
    .modal-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 20px 0;
      border-top: 1px solid var(--brass-dark);
      border-bottom: 1px solid var(--brass-dark);
    }
    .modal-meta-item span {
      font-family: 'IM Fell English SC', serif;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--brass);
      display: block;
      margin-bottom: 4px;
    }
    .modal-meta-item strong {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-style: italic;
      font-weight: 400;
      color: var(--ivory);
    }

    @media (max-width: 768px) {
      .modal-content { grid-template-columns: 1fr; }
      .modal-img { height: 300px; }
    }

    /* ---------- Booking / Seat Selection ---------- */
    .booking-section {
      background:
        radial-gradient(ellipse at top center, rgba(122, 30, 43, 0.15), transparent 60%),
        var(--charcoal-2);
    }
    .booking-wrap {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 60px;
      align-items: start;
    }
    .seat-map-wrap {
      position: relative;
    }
    .stage-label {
      text-align: center;
      font-family: 'IM Fell English SC', serif;
      font-size: 14px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--brass);
      padding: 18px;
      background: linear-gradient(to bottom, var(--crimson-deep), var(--crimson));
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      margin-bottom: 30px;
      position: relative;
      box-shadow: 0 4px 20px rgba(122, 30, 43, 0.4);
    }
    .stage-label::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: var(--brass);
    }

    .seat-rows {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
    .seat-row {
      display: flex;
      gap: 6px;
      justify-content: center;
    }
    .seat {
      width: 22px; height: 22px;
      border-radius: 50% 50% 30% 30%;
      border: 1.5px solid var(--brass-dark);
      background: transparent;
      cursor: none;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }
    .seat:hover:not(.sold):not(.selected) {
      background: rgba(200, 155, 90, 0.2);
      border-color: var(--brass);
      transform: scale(1.3);
    }
    .seat.selected {
      background: var(--brass);
      border-color: var(--brass);
      transform: scale(1.2);
      box-shadow: 0 0 12px rgba(200, 155, 90, 0.6);
    }
    .seat.sold {
      background: rgba(122, 30, 43, 0.4);
      border-color: var(--crimson-deep);
      cursor: not-allowed;
    }
    .seat.vip { border-color: var(--crimson); }
    .seat.vip.selected { background: var(--crimson); box-shadow: 0 0 12px rgba(122, 30, 43, 0.6); }
    .seat-gap { width: 22px; height: 22px; }

    .legend {
      display: flex;
      gap: 24px;
      justify-content: center;
      margin-top: 36px;
      flex-wrap: wrap;

      { count: 18, vip: false },  // Row E
      { count: 18, vip: false },  // Row F
      { count: 16, vip: false },  // Row G
      { count: 14, vip: false },  // Row H
    ];
    const VIP_PRICE = 180;
    const STANDARD_PRICE = 85;
    const ROW_LABELS = ['A','B','C','D','E','F','G','H'];

    // Generate random sold seats per date
    function generateSoldSeats(seed) {
      const sold = new Set();
      let s = seed;
      const rng = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
      SEAT_LAYOUT.forEach((row, ri) => {
        for (let i = 0; i < row.count; i++) {
          if (rng() < 0.35) sold.add(`${ri}-${i}`);
        }
      });
      return sold;
    }

    // ==============================================
    // CUSTOM CURSOR (vanilla JS, physics-based)
    // ==============================================
    (function initCursor() {
      const ring = document.getElementById('cursorRing');
      const dot = document.getElementById('cursorDot');
      if (!ring || !dot) return;

      // Check reduced motion or mobile
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const isMobile = window.innerWidth <= 768;
      if (reduced || isMobile) {
        ring.style.display = 'none';
        dot.style.display = 'none';
        return;
      }

      // Physics state: ring follows dot with spring damping
      let targetX = window.innerWidth / 2;
      let targetY = window.innerHeight / 2;
      let ringX = targetX;
      let ringY = targetY;
      let dotX = targetX;
      let dotY = targetY;
      let velX = 0;
      let velY = 0;

      // Spring constants for ring
      const SPRING_K = 0.18;
      const DAMPING = 0.72;

      let rafId = null;
      let visible = true;

      function tick() {
        if (!visible) return;

        // Dot: direct follow (subtle easing)
        dotX += (targetX - dotX) * 0.6;
        dotY += (targetY - dotY) * 0.6;

        // Ring: spring-damper follow
        const dx = targetX - ringX;
        const dy = targetY - ringY;
        velX = (velX + dx * SPRING_K) * DAMPING;
        velY = (velY + dy * SPRING_K) * DAMPING;
        ringX += velX;
        ringY += velY;

        ring.style.transform = `translate(${ringX}px, ${ringY}px) translate(-50%, -50%)`;
        dot.style.transform = `translate(${dotX}px, ${dotY}px) translate(-50%, -50%)`;

        rafId = requestAnimationFrame(tick);
      }

      function onMove(e) {
        targetX = e.clientX;
        targetY = e.clientY;
      }

      // Hover state
      function onOver(e) {
        const t = e.target;
        if (t.closest && (
          t.closest('button') || t.closest('a') || t.closest('.act-card') ||
          t.closest('.seat') || t.closest('.city-card') || t.closest('.date-chip') ||
          t.closest('.nav-cta') || t.closest('.modal-close')
        )) {
          ring.classList.add('hover');
        }
      }
      function onOut(e) {
        const t = e.target;
        if (t.closest && (
          t.closest('button') || t.closest('a') || t.closest('.act-card') ||
          t.closest('.seat') || t.closest('.city-card') || t.closest('.date-chip') ||
          t.closest('.nav-cta') || t.closest('.modal-close')
        )) {
          ring.classList.remove('hover');
        }
      }

      // Click ripple
      function onClick(e) {
        ring.classList.add('click');
        setTimeout(() => ring.classList.remove('click'), 150);

        const ripple = document.createElement('div');
        ripple.className = 'cursor-ripple';
        ripple.style.left = e.clientX + 'px';
        ripple.style.top = e.clientY + 'px';
        document.body.appendChild(ripple);
        setTimeout(() => ripple.remove(), 800);
      }

      // Visibility
      function onVisibility() {
        if (document.hidden) {
          visible = false;
          if (rafId) cancelAnimationFrame(rafId);
        } else {
          visible = true;
          rafId = requestAnimationFrame(tick);
        }
      }

      window.addEventListener('mousemove', onMove, { passive: true });
      window.addEventListener('mouseover', onOver, { passive: true });
      window.addEventListener('mouseout', onOut, { passive: true });
      window.addEventListener('click', onClick, { passive: true });
      document.addEventListener('visibilitychange', onVisibility);

      window.addEventListener('beforeunload', () => {
        if (rafId) cancelAnimationFrame(rafId);
      });

      // Start immediately at screen center
      rafId = requestAnimationFrame(tick);
    })();

    // ==============================================
    // DUST PARTICLES (vanilla JS canvas)
    // ==============================================
    (function initDust() {
      const canvas = document.getElementById('dust-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduced) { canvas.style.display = 'none'; return; }

      let w, h;
      let particles = [];
      let rafId = null;
      let visible = true;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }

      function initParticles() {
        particles = [];
        const count = Math.floor((w * h) / 18000);
        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: Math.random() * 1.5 + 0.3,
            vx: (Math.random() - 0.5) * 0.3,
            vy: -(Math.random() * 0.4 + 0.1),
            alpha: Math.random() * 0.5 + 0.1,
            wobble: Math.random() * Math.PI * 2,
            wobbleSpeed: Math.random() * 0.02 + 0.005
          });
        }
      }

      function tick() {
        if (!visible) return;
        ctx.clearRect(0, 0, w, h);

        particles.forEach(p => {
          p.wobble += p.wobbleSpeed;
          p.x += p.vx + Math.sin(p.wobble) * 0.15;
          p.y += p.vy;

          if (p.y < -10) {
            p.y = h + 10;
            p.x = Math.random() * w;
          }
          if (p.x < -10) p.x = w + 10;
          if (p.x > w + 10) p.x = -10;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(228, 190, 126, ${p.alpha})`;
          ctx.fill();
        });

        rafId = requestAnimationFrame(tick);
      }

      function onVisibility() {
        if (document.hidden) {
          visible = false;
          if (rafId) cancelAnimationFrame(rafId);
        } else {
          visible = true;
          rafId = requestAnimationFrame(tick);
        }
      }

      window.addEventListener('resize', () => { resize(); initParticles(); });
      document.addEventListener('visibilitychange', onVisibility);
      window.addEventListener('beforeunload', () => {
        if (rafId) cancelAnimationFrame(rafId);
      });

      resize();
      initParticles();
      rafId = requestAnimationFrame(tick);
    })();

    // ==============================================
    // REVEAL ON SCROLL
    // ==============================================
    function useReveal() {
      useEffect(() => {
        const els = document.querySelectorAll('.reveal, .timeline-item');
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(e => {
            if (e.isIntersecting) {
              e.target.classList.add('visible');
              observer.unobserve(e.target);
            }
          });
        }, { threshold: 0.15 });

        els.forEach(el => observer.observe(el));
        return () => observer.disconnect();
      }, []);
    }

    // ==============================================
    // COUNTER ANIMATION (hooke/spring easing)
    // ==============================================
    function useCountUp(target, start = 0, duration = 2000, trigger = true) {
      const [val, setVal] = useState(start);
      const rafRef = useRef(null);

      useEffect(() => {
        if (!trigger) return;

        let startTime = null;
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function step(timestamp) {
          if (!startTime) startTime = timestamp;
          const progress = Math.min((timestamp - startTime) / duration, 1);

          // Ease out cubic (spring-like)
          const eased = 1 - Math.pow(1 - progress, 3);
          setVal(Math.floor(start + (target - start) * eased));

          if (progress < 1 && !reduced) {
            rafRef.current = requestAnimationFrame(step);
          } else {
            setVal(target);
          }
        }

        if (reduced) {
          setVal(target);
        } else {
          rafRef.current = requestAnimationFrame(step);
        }

        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
        };
      }, [target, start, duration, trigger]);

      return val;
    }

    // ==============================================
    // TYPEWRITER
    // ==============================================
    function Typewriter({ text, speed = 60, delay = 0 }) {
      const [shown, setShown] = useState('');
      const timeoutRef = useRef(null);

      useEffect(() => {
        let i = 0;
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (reduced) {
          setShown(text);
          return;
        }

        const startTimeout = setTimeout(() => {
          function type() {
            if (i < text.length) {
              setShown(text.slice(0, i + 1));
              i++;
              timeoutRef.current = setTimeout(type, speed + (Math.random() * 30 - 10));
            }
          }
          type();
        }, delay);

        return () => {
          clearTimeout(startTimeout);
          if (timeoutRef.current) clearTimeout(timeoutRef.current);
        };
      }, [text, speed, delay]);

      return (
        <span>
          {shown}
          <span className="typewriter-cursor"></span>
        </span>
      );
    }

    // ==============================================
    // STATS COUNTERS
    // ==============================================
    function StatsCounters() {
      const [inView, setInView] = useState(false);
      const ref = useRef(null);

      useEffect(() => {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(e => {
            if (e.isIntersecting) {
              setInView(true);
              observer.disconnect();
            }
          });
        }, { threshold: 0.3 });

        if (ref.current) observer.observe(ref.current);
        return () => observer.disconnect();
      }, []);

      const c1 = useCountUp(139, 0, 2000, inView);
      const c2 = useCountUp(37, 0, 1800, inView);
      const c3 = useCountUp(6, 0, 1500, inView);
      const c4 = useCountUp(420000, 0, 2400, inView);

      return (

    // ==============================================
    // SEAT MAP
    // ==============================================
    function SeatMap({ soldSeats, selectedSeats, onSelect, curtainOpen }) {
      const rowRefs = useRef([]);

      // 3D tilt on mousemove (direct DOM manipulation)
      const mapRef = useRef(null);
      useEffect(() => {
        const map = mapRef.current;
        if (!map) return;

        let rafId = null;
        let targetRotX = 0;
        let targetRotY = 0;
        let rotX = 0;
        let rotY = 0;
        let velX = 0;
        let velY = 0;

        function onMove(e) {
          const rect = map.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const dx = (e.clientX - cx) / (rect.width / 2);
          const dy = (e.clientY - cy) / (rect.height / 2);
          targetRotY = dx * 6;
          targetRotX = -dy * 4;
        }

        function tick() {
          velX = (velX + (targetRotX - rotX) * 0.1) * 0.8;
          velY = (velY + (targetRotY - rotY) * 0.1) * 0.8;
          rotX += velX;
          rotY += velY;
          map.style.transform = `perspective(1000px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
          rafId = requestAnimationFrame(tick);
        }

        map.addEventListener('mousemove', onMove, { passive: true });
        rafId = requestAnimationFrame(tick);

        return () => {
          map.removeEventListener('mousemove', onMove);
          if (rafId) cancelAnimationFrame(rafId);
        };
      }, []);

      return (
        <div className="seat-map-wrap" ref={mapRef} style={{ transition: 'opacity 1s', opacity: curtainOpen ? 1 : 0.3 }}>
          <div className="stage-label">La Scène</div>
          <div className="seat-rows">
            {SEAT_LAYOUT.map((row, ri) => (
              <div className="seat-row" key={ri} ref={el => rowRefs.current[ri] = el}>
                {Array.from({ length: row.count }).map((_, si) => {
                  const key = `${ri}-${si}`;
                  const sold = soldSeats.has(key);
                  const selected = selectedSeats.has(key);
                  const vip = row.vip;
                  let cls = 'seat';
                  if (sold) cls += ' sold';
                  if (selected) cls += ' selected';
                  if (vip) cls += ' vip';
                  return (
                    <button
                      key={si}
                      className={cls}
                      disabled={sold}
                      onClick={() => onSelect(ri, si)}
                      aria-label={`Row ${ROW_LABELS[ri]} seat ${si + 1} ${vip ? 'VIP' : 'Standard'}`}
                    ></button>
                  );
                })}
              </div>
            ))}
          </div>
          <div className="legend">
            <div className="legend-item">
              <div className="legend-dot"></div>
              <span>Available</span>
            </div>
            <div className="legend-item">
              <div className="legend-dot vip"></div>
              <span>VIP (₣{VIP_PRICE})</span>
            </div>
            <div className="legend-item">
              <div className="legend-dot selected"></div>
              <span>Selected</span>
            </div>
            <div className="legend-item">
              <div className="legend-dot sold"></div>
              <span>Sold</span>
            </div>
          </div>
        </div>
      );
    }

    // ==============================================
    // ACT CARD with 3D tilt (direct DOM)
    // ==============================================
    function ActCard({ act, number, onClick }) {
      const cardRef = useRef(null);

      useEffect(() => {
        const card = cardRef.current;
        if (!card) return;

        let rafId = null;
        let targetRx = 0;
        let targetRy = 0;
        let rx = 0;
        let ry = 0;
        let vx = 0;
        let vy = 0;
        let isHovering = false;

        function onEnter() { isHovering = true; }
        function onLeave() {
          isHovering = false;
          targetRx = 0;
          targetRy = 0;
        }
        function onMove(e) {
          if (!isHovering) return;
          const rect = card.getBoundingClientRect();
          const dx = (e.clientX - rect.left) / rect.width - 0.5;
          const dy = (e.clientY - rect.top) / rect.height - 0.5;
          targetRy = dx * 12;
          targetRx = -dy * 10;
        }

        function tick() {
          vx = (vx + (targetRx - rx) * 0.15) * 0.78;
          vy = (vy + (targetRy - ry) * 0.15) * 0.78;
          rx += vx;
          ry += vy;
          card.style.transform = `perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg)`;
          rafId = requestAnimationFrame(tick);
        }

        card.addEventListener('mouseenter', onEnter);
        card.addEventListener('mouseleave', onLeave);
        card.addEventListener('mousemove', onMove, { passive: true });
        rafId = requestAnimationFrame(tick);

        return () => {
          card.removeEventListener('mouseenter', onEnter);
          card.removeEventListener('mouseleave', onLeave);
          card.removeEventListener('mousemove', onMove);
          if (rafId) cancelAnimationFrame(rafId);
        };
      }, []);

      return (
        <div className="act-card" ref={cardRef} onClick={onClick}>
          <div className="act-card-inner">
            <img src={act.img} alt={act.name} />
            <div className="act-card-overlay">
              <div className="act-number">{String(number).padStart(2, '0')}</div>
              <div className="act-type">{act.type}</div>
              <div className="act-name">{act.name}</div>
              <div className="act-desc">{act.desc}</div>
              <button className="act-detail-btn" onClick={(e) => { e.stopPropagation(); onClick(); }}>
                View Act
              </button>
            </div>
          </div>
        </div>
      );
    }

              <h2 className="section-title">Six Acts,<br/>One Impossible Night.</h2>
              <p className="section-desc">
                From the heights of the trapeze to the silence of the mime, each act is a small universe — curtained in fog, lit by flame, and gone by morning.
              </p>
            </div>
            <div className="acts-grid">
              {ACTS.map((act, i) => (
                <div key={act.id} className="reveal" style={{ transitionDelay: `${i * 0.08}s` }}>
                  <ActCard
                    act={act}
                    number={i + 1}
                    onClick={() => onActClick(act)}
                  />
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    // ==============================================
    // BOOKING SECTION
    // ==============================================
    function BookingSection({ curtainOpen }) {
      const [activeDate, setActiveDate] = useState(2);
      const [soldSeats, setSoldSeats] = useState(() => generateSoldSeats(42));
      const [selectedSeats, setSelectedSeats] = useState(new Set());

      const handleDateChange = useCallback((idx) => {
        setActiveDate(idx);
        setSoldSeats(generateSoldSeats(42 + idx * 137));
        setSelectedSeats(new Set());
      }, []);

      const handleSelect = useCallback((ri, si) => {
        const key = `${ri}-${si}`;
        setSelectedSeats(prev => {
          const next = new Set(prev);
          if (next.has(key)) next.delete(key);
          else next.add(key);
          return next;
        });
      }, []);

      useReveal();

      return (
        <section className="section booking-section" id="booking">
          <div className="section-inner">
            <div className="reveal" style={{ marginBottom: '60px', textAlign: 'center' }}>
              <div className="ornament">
                <div className="ornament-line"></div>
                <span className="ornament-star">✦</span>
                <div className="ornament-line"></div>
              </div>
              <div className="section-label" style={{ justifyContent: 'center' }}>Réservation</div>
              <h2 className="section-title" style={{ textAlign: 'center' }}>Choose Your Seat</h2>
              <p className="section-desc" style={{ margin: '0 auto 60px', textAlign: 'center' }}>
                Every seat tells a story. Pick yours — the fog will do the rest.
              </p>
            </div>

            <div className="booking-wrap reveal">
              <SeatMap
                soldSeats={soldSeats}
                selectedSeats={selectedSeats}
                onSelect={handleSelect}
                curtainOpen={curtainOpen}
              />
              <BookingPanel
                selectedSeats={selectedSeats}
                onDateChange={handleDateChange}
                activeDate={activeDate}
              />
            </div>
          </div>
        </section>
      );
    }

    // ==============================================
    // CHRONICLE
    // ==============================================
    function Chronicle() {
      useReveal();
      return (
        <section className="section chronicle-section" id="chronicle">
          <div className="section-inner">
            <div className="reveal" style={{ marginBottom: '60px' }}>
              <div className="section-label">Chronique</div>
              <h2 className="section-title">Forty Years<br/>In the Fog.</h2>
              <p className="section-desc">
                From a single tent on the outskirts of Montmartre to the grand chapiteaux of Europe — the true story of Cirque Brume, written in rouge and sawdust.
              </p>
            </div>
            <div className="timeline">
              {CHRONICLE.map((item, i) => (
                <div key={i} className="timeline-item" style={{ transitionDelay: `${i * 0.1}s` }}>
                  <div className="timeline-year">{item.year}</div>
                  <div className="timeline-title">{item.title}</div>
                  <div className="timeline-desc">{item.desc}</div>
                </div>
              ))}
            </div>
            <StatsCounters />
          </div>
        </section>
      );
    }

    // ==============================================
    // TOUR CITIES
    // ==============================================
    function TourSection() {
      useReveal();
      return (
        <section className="section tour-section" id="tour">
          <div className="section-inner">
            <div className="reveal" style={{ marginBottom: '60px' }}>
              <div className="section-label">La Tournée</div>
              <h2 className="section-title">Eight Cities.<br/>One Tent.</h2>
              <p className="section-desc">
                The crimson chapiteau travels by rail and by road. It arrives in the dark of night and vanishes before dawn.
              </p>
            </div>
            <div className="cities-grid reveal">
              {CITIES.map((c, i) => (
                <div className="city-card" key={i} style={{ transitionDelay: `${i * 0.05}s` }}>
                  <div className="city-date">{c.date}</div>
                  <div className="city-name">{c.city}</div>
                  <div className="city-venue">{c.venue}</div>
                  <span className={`city-status ${c.status}`}>{c.statusLabel}</span>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    // ==============================================
    // FOOTER
    // ==============================================
    function Footer() {
      return (
        <footer className="footer">
          <div className="footer-inner">
            <div className="footer-brand">
              <h2>Cirque Brume</h2>
              <p>Une nuit merveilleuse depuis 1887. Dans la brume, sous les étoiles, sur la route.</p>
            </div>
            <div className="footer-col">
              <h4>Programme</h4>
              <ul>
                <li><a href="#acts">Les Volants</a></li>
                <li><a href="#acts">Danse de Flamme</a></li>
                <li><a href="#acts">L'Enfant de Cristal</a></li>
                <li><a href="#acts">Le Silence</a></li>
                <li><a href="#acts">Le Voile d'Or</a></li>
              </ul>
            </div>
            <div className="footer-col">
              <h4>Visiter</h4>
              <ul>
                <li><a href="#tour">Paris · 12–18 Oct</a></li>
                <li><a href="#tour">Lyon · 24–28 Oct</a></li>
                <li><a href="#tour">Marseille · 5–11 Nov</a></li>
                <li><a href="#tour">Vienna · 2–8 Déc</a></li>
                <li><a href="#tour">Budapest · 14–20 Déc</a></li>
              </ul>
            </div>
            <div className="footer-col">
              <h4>Contact</h4>
              <ul>
                <li><a href="#">Presse &amp; Médias</a></li>
                <li><a href="#">Réservation Groupe</a></li>
                <li><a href="#">Accès VIP</a></li>
                <li><a href="#">Carrières</a></li>
                <li><a href="#">Correspondance</a></li>
              </ul>
            </div>
          </div>
          <div className="footer-bottom">
            <span>© MCMXXVII Cirque Brume · Tous droits réservés</span>
            <span>Fondé à Montmartre · 1887</span>
          </div>
        </footer>
      );
    }

    // ==============================================
    // APP
    // ==============================================
    function App() {
      const [selectedAct, setSelectedAct] = useState(null);
      const [curtainOpen, setCurtainOpen] = useState(false);

      // Announce upgrade capability
      useEffect(() => {
        function announce() {
          window.parent?.postMessage?.({
            type: 'miaoda:upgrade:available',
            kind: 'interactive-prototype'
          }, '*');
        }
        announce();
        if (document.readyState !== 'complete') {
          window.addEventListener('load', announce, { once: true });
        }
      }, []);

      // Close modal on Escape
      useEffect(() => {
        function onKey(e) {
          if (e.key === 'Escape') setSelectedAct(null);
        }
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      // Lock scroll when modal open
      useEffect(() => {
        if (selectedAct) {
          document.body.style.overflow = 'hidden';
        } else {
          document.body.style.overflow = '';
        }
      }, [selectedAct]);

      return (
        <>
          <Nav />
          <Hero onEnter={() => setCurtainOpen(true)} />
          <Marquee />
          <ActsSection onActClick={setSelectedAct} />
          <BookingSection curtainOpen={curtainOpen} />
          <Chronicle />
          <TourSection />
          <Footer />
          <ActModal act={selectedAct} onClose={() => setSelectedAct(null)} />
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

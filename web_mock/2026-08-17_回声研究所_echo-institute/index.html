<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="creative-medium" content="interactive-prototype" />
<title>Institute of Echoes — A Residency for Sound Art</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
  /* ============================================================
     Institute of Echoes — V1
     Single-page interactive mockup
     ============================================================ */

  :root {
    --ink: #1A1612;
    --paper: #F2EBDF;
    --paper-dark: #E6DDCB;
    --ember: #D9642A;
    --ember-glow: rgba(217, 100, 42, 0.55);
    --moss: #6B7F3E;
    --moss-glow: rgba(107, 127, 62, 0.45);
    --oxide: #3A5249;
    --oxide-dark: #2A3C36;
    --rust: #8C3A1A;

    --serif: "Cormorant Garamond", "Times New Roman", serif;
    --sans: "Space Grotesk", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;

    --gutter: clamp(20px, 4vw, 64px);
    --maxw: 1440px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
    cursor: none;
  }

  /* custom cursor — hide native everywhere on interactive too */
  a, button, [role="button"], input, textarea, select,
  .cursor-hover-target { cursor: none; }

  @media (max-width: 900px) {
    html, body { cursor: auto; }
    a, button, [role="button"], input { cursor: auto; }
    .cursor-ring, .cursor-dot, .cursor-ripple { display: none !important; }
  }

  /* ---------- Custom cursor ---------- */
  .cursor-ring,
  .cursor-dot {
    position: fixed;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 9999;
    transform: translate3d(-50%, -50%, 0);
    will-change: transform, width, height, opacity;
  }
  .cursor-ring {
    width: 38px; height: 38px;
    border: 2px solid var(--ink);
    border-radius: 50%;
    transition: width 0.25s cubic-bezier(.2,.8,.2,1),
                height 0.25s cubic-bezier(.2,.8,.2,1),
                border-color 0.25s,
                background 0.25s,
                opacity 0.2s;
    mix-blend-mode: difference;
    background: transparent;
  }
  .cursor-dot {
    width: 6px; height: 6px;
    background: var(--ember);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--ember-glow),
                0 0 24px rgba(217,100,42,0.3);
    transition: width 0.2s ease, height 0.2s ease, background 0.2s;
  }
  body.cursor-hover .cursor-ring {
    width: 64px; height: 64px;
    border-color: var(--ember);
    background: rgba(217,100,42,0.08);
  }
  body.cursor-hover .cursor-dot {
    width: 10px; height: 10px;
    background: var(--ink);
    box-shadow: 0 0 16px var(--ember-glow);
  }
  body.cursor-click .cursor-ring {
    width: 24px; height: 24px;
    background: var(--ember);
    border-color: var(--ember);
  }
  .cursor-ripple {
    position: fixed;
    top: 0; left: 0;
    width: 10px; height: 10px;
    border: 1.5px solid var(--ember);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate3d(-50%, -50%, 0) scale(0);
    opacity: 0.8;
    will-change: transform, opacity;
  }
  @keyframes rippleOut {
    0%   { transform: translate3d(-50%,-50%,0) scale(0.3); opacity: 0.7; }
    100% { transform: translate3d(-50%,-50%,0) scale(8);   opacity: 0; }
  }

  /* ---------- Page shell ---------- */
  .page {
    position: relative;
    min-height: 100vh;
  }

  /* dust mote particles layer */
  .dust-canvas {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
    opacity: 0.5;
  }

  /* ---------- Nav ---------- */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px var(--gutter);
    mix-blend-mode: difference;
    color: var(--paper);
    transition: background 0.4s ease, color 0.4s ease, padding 0.4s ease, mix-blend-mode 0.4s;
  }
  .nav.scrolled {
    mix-blend-mode: normal;
    background: rgba(242, 235, 223, 0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--ink);
    border-bottom: 1px solid rgba(26,22,18,0.08);
    padding: 14px var(--gutter);
  }
  .nav-brand {
    font-family: var(--serif);
    font-style: italic;
    font-size: 22px;
    letter-spacing: 0.01em;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-brand .mark {
    width: 14px; height: 14px;
    border: 1.5px solid currentColor;
    border-radius: 50%;
    position: relative;
  }
  .nav-brand .mark::after {
    content: "";
    position: absolute;
    inset: 4px;
    background: currentColor;
    border-radius: 50%;
  }
  .nav-links {
    display: flex;
    gap: 36px;
    list-style: none;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .nav-links a {
    color: inherit;
    text-decoration: none;
    position: relative;
    padding: 4px 0;
  }
  .nav-links a::after {
    content: "";
    position: absolute;
    left: 0; bottom: 0;
    width: 100%; height: 1px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.4s cubic-bezier(.2,.8,.2,1);
  }
  .nav-links a:hover::after {
    transform: scaleX(1);
    transform-origin: left;
  }
  .nav-cta {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 10px 18px;
    border: 1px solid currentColor;
    background: transparent;
    color: inherit;
    position: relative;
    overflow: hidden;
    transition: color 0.35s ease;
  }
  .nav-cta::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--ember);
    transform: translateX(-101%);
    transition: transform 0.45s cubic-bezier(.7,0,.3,1);
    z-index: -1;
  }
  .nav-cta:hover { color: var(--paper); border-color: var(--ember); }
  .nav-cta:hover::before { transform: translateX(0); }

  .burger {
    display: none;
    width: 32px; height: 32px;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    background: none;
    border: none;
    padding: 0;
  }
  .burger span {
    display: block;
    height: 1.5px;
    background: currentColor;
    transition: transform 0.3s ease, opacity 0.3s ease;
  }

  @media (max-width: 900px) {
    .nav-links, .nav-cta { display: none; }
    .burger { display: flex; }
  }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    height: 100vh;
    min-height: 680px;
    background: var(--ink);
    color: var(--paper);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 var(--gutter);
  }
  .hero-bg {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 20% 30%, rgba(217,100,42,0.18), transparent 55%),
                radial-gradient(ellipse at 80% 70%, rgba(107,127,62,0.14), transparent 50%),
                linear-gradient(180deg, #1A1612 0%, #14110E 100%);
    z-index: 0;
  }
  .hero-reel {
    position: absolute;
    right: -8vw;
    top: 50%;
    transform: translateY(-50%);
    width: 55vw;
    max-width: 780px;
    aspect-ratio: 1;
    z-index: 1;
    opacity: 0.18;
    pointer-events: none;
  }
  .hero-reel svg { width: 100%; height: 100%; }

  .hero-inner {
    position: relative;
    z-index: 2;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
  }
  .hero-eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ember);
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .hero-eyebrow .pulse {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--ember);
    box-shadow: 0 0 0 0 var(--ember-glow);
    animation: pulseDot 2.4s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%   { box-shadow: 0 0 0 0 rgba(217,100,42,0.5); }
    70%  { box-shadow: 0 0 0 14px rgba(217,100,42,0); }
    100% { box-shadow: 0 0 0 0 rgba(217,100,42,0); }
  }

  .hero-title {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(48px, 8.2vw, 128px);
    line-height: 0.95;
    letter-spacing: -0.02em;
    margin-bottom: 32px;
  }
  .hero-title em {
    font-style: italic;
    color: var(--ember);
    font-weight: 400;
  }
  .hero-sub {
    font-size: 17px;
    line-height: 1.6;
    max-width: 480px;
    opacity: 0.78;
    margin-bottom: 44px;
    font-weight: 300;
  }
  .hero-ctas {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    align-items: center;
  }
  .btn-primary {
    font-family: var(--sans);
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 16px 32px;
    background: var(--ember);
    color: var(--paper);
    border: none;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s ease;
  }
  .btn-primary::after {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    transform: skewX(-20deg);
    transition: left 0.6s ease;
  }
  .btn-primary:hover::after { left: 150%; }
  .btn-primary:active { transform: scale(0.97); }

  .btn-ghost {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 16px 24px;
    background: transparent;
    color: var(--paper);
    border: 1px solid rgba(242,235,223,0.35);
    display: inline-flex;
    align-items: center;
    gap: 12px;
    transition: border-color 0.3s, color 0.3s;
  }
  .btn-ghost:hover { border-color: var(--ember); color: var(--ember); }
  .btn-ghost .play {
    width: 0; height: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-left: 8px solid currentColor;
  }

  /* spectrum in hero */
  .hero-spectrum {
    position: absolute;
    left: 0; right: 0;
    bottom: 80px;
    height: 140px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 3px;
    z-index: 2;
    padding: 0 var(--gutter);
    opacity: 0.55;
    pointer-events: none;
  }
  .spec-bar {
    flex: 1;
    max-width: 6px;
    min-width: 2px;
    background: linear-gradient(180deg, var(--ember) 0%, rgba(217,100,42,0.2) 100%);
    border-radius: 2px 2px 0 0;
    transform-origin: bottom;
  }

  .hero-meta {
    position: absolute;
    bottom: 28px;
    left: var(--gutter);
    right: var(--gutter);
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    opacity: 0.45;
    z-index: 3;
  }
  .hero-meta .scroll-hint {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .hero-meta .scroll-hint .line {
    width: 40px; height: 1px;
    background: currentColor;
    position: relative;
    overflow: hidden;
  }
  .hero-meta .scroll-hint .line::after {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 50%; height: 100%;
    background: var(--ember);
    animation: scrollLine 2.2s ease-in-out infinite;
  }
  @keyframes scrollLine {
    0%   { left: -50%; }
    50%  { left: 100%; }
    100% { left: 100%; }
  }

  /* ---------- Marquee ---------- */
  .marquee {
    background: var(--ember);
    color: var(--paper);
    overflow: hidden;
    padding: 14px 0;
    border-top: 1px solid var(--rust);
    border-bottom: 1px solid var(--rust);
  }
  .marquee-track {
    display: flex;
    gap: 48px;
    white-space: nowrap;
    animation: marquee 40s linear infinite;
    width: max-content;
  }
  .marquee-track span {
    font-family: var(--serif);
    font-style: italic;
    font-size: 18px;
    letter-spacing: 0.02em;
    display: inline-flex;
    align-items: center;
    gap: 48px;
  }
  .marquee-track span::after {
    content: "✦";
    font-style: normal;
    font-size: 10px;
    opacity: 0.7;
  }
  @keyframes marquee {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  .marquee:hover .marquee-track { animation-play-state: paused; }

  /* ---------- Section common ---------- */
  section {
    position: relative;
    z-index: 2;
    padding: clamp(80px, 12vh, 160px) var(--gutter);
  }
  .section-inner {
    max-width: var(--maxw);
    margin: 0 auto;
  }
  .section-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 56px;
    gap: 40px;
    flex-wrap: wrap;
  }
  .section-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ember);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-label .tick {
    width: 24px; height: 1px;
    background: currentColor;
  }
  .section-title {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(36px, 5vw, 68px);
    line-height: 1;
    letter-spacing: -0.02em;
    max-width: 700px;
  }
  .section-title em { font-style: italic; color: var(--oxide); }
  .section-desc {
    max-width: 360px;
    font-size: 14px;
    line-height: 1.7;
    opacity: 0.7;
    font-weight: 300;
  }

  /* ---------- Exhibitions grid (tilt cards) ---------- */
  .exhibitions {
    background: var(--paper);
  }
  .exhib-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 24px;
  }
  .exhib-card {
    grid-column: span 4;
    position: relative;
    background: var(--paper-dark);
    border: 1px solid rgba(26,22,18,0.08);
    padding: 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    transform-style: preserve-3d;
    transition: border-color 0.3s, box-shadow 0.3s;
    will-change: transform;
    min-height: 440px;
  }
  .exhib-card:hover {
    border-color: var(--ember);
    box-shadow: 0 30px 60px -20px rgba(26,22,18,0.25);
  }
  .exhib-card.featured {
    grid-column: span 8;
    grid-row: span 2;
    min-height: auto;
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .exhib-card.featured .exhib-artist { color: var(--ember); }
  .exhib-card.featured .exhib-desc { opacity: 0.65; }

  .exhib-artist {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--moss);
  }
  .exhib-title {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 500;
    line-height: 1.1;
    letter-spacing: -0.01em;
  }
  .exhib-card.featured .exhib-title { font-size: 48px; }
  .exhib-desc {
    font-size: 13px;
    line-height: 1.65;
    opacity: 0.75;
    font-weight: 300;
    max-width: 320px;
  }
  .exhib-visual {
    flex: 1;
    position: relative;
    overflow: hidden;
    margin: -28px -28px 0 -28px;
    min-height: 160px;
    background: linear-gradient(135deg, var(--oxide-dark), var(--oxide));
  }
  .exhib-card.featured .exhib-visual {
    min-height: 280px;
    margin: 0 -28px;
    background: linear-gradient(180deg, transparent, rgba(217,100,42,0.2)),
                radial-gradient(circle at 30% 40%, rgba(107,127,62,0.4), transparent 60%);
  }
  /* waveform inside visual */
  .waveform {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 20px;
  }
  .wave-bar {
    width: 3px;
    background: var(--paper);
    opacity: 0.6;
    border-radius: 2px;
  }

  .exhib-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    opacity: 0.6;
    padding-top: 16px;
    border-top: 1px solid currentColor;
  }
  .exhib-meta .listen {
    color: var(--ember);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .exhib-meta .listen .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    transition: transform 0.3s;
  }
  .exhib-meta .listen:hover .dot {
    transform: scale(1.6);
    box-shadow: 0 0 12px currentColor;
  }

  @media (max-width: 900px) {
    .exhib-grid { grid-template-columns: 1fr; }
    .exhib-card, .exhib-card.featured {
      grid-column: 1 / -1;
      grid-row: auto;
      min-height: auto;
    }
    .exhib-card.featured .exhib-title { font-size: 32px; }
  }

  /* ---------- Stats / Numbers ---------- */
  .stats {
    background: var(--ink);
    color: var(--paper);
    overflow: hidden;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 40px;
  }
  .stat-item {
    position: relative;
  }
  .stat-num {
    font-family: var(--serif);
    font-size: clamp(56px, 7vw, 108px);
    line-height: 0.9;
    font-weight: 500;
    color: var(--ember);
    letter-spacing: -0.03em;
  }
  .stat-num .unit {
    font-size: 0.4em;
    vertical-align: super;
    margin-left: 2px;
    opacity: 0.7;
  }
  .stat-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.6;
    margin-top: 14px;
  }
  .stat-item::after {
    content: "";
    position: absolute;
    right: -20px; top: 10%;
    width: 1px; height: 80%;
    background: rgba(242,235,223,0.12);
  }
  .stat-item:last-child::after { display: none; }

  @media (max-width: 900px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 40px 20px; }
    .stat-item::after { display: none; }
  }

  /* ---------- Artists (magnetic hover) ---------- */
  .artists {
    background: var(--paper);
  }
  .artists-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 24px;
  }
  .artist-card {
    position: relative;
    text-align: center;
  }
  .artist-avatar {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    overflow: hidden;
    margin-bottom: 18px;
    transition: transform 0.3s ease;
    background: linear-gradient(135deg, var(--oxide), var(--moss));
  }
  .artist-avatar::before {
    content: "";
    position: absolute;
    inset: -4px;
    border: 2px solid var(--ember);
    border-radius: 50%;
    opacity: 0;
    transform: scale(0.9);
    transition: opacity 0.4s, transform 0.4s cubic-bezier(.2,.8,.2,1);
  }
  .artist-card:hover .artist-avatar::before {
    opacity: 0.8;
    transform: scale(1);
    animation: avatarPulse 2.2s ease-out infinite;
  }
  @keyframes avatarPulse {
    0%   { box-shadow: 0 0 0 0 var(--ember-glow); transform: scale(1); }
    70%  { box-shadow: 0 0 0 18px rgba(217,100,42,0); transform: scale(1); }
    100% { box-shadow: 0 0 0 0 rgba(217,100,42,0); transform: scale(1); }
  }
  .artist-card:hover .artist-avatar { transform: translateY(-4px); }
  .artist-name {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .artist-role {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.55;
  }
  .artist-initials {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif);
    font-style: italic;
    font-size: 42px;
    color: var(--paper);
    opacity: 0.85;
  }

  @media (max-width: 900px) {
    .artists-row { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 520px) {
    .artists-row { grid-template-columns: repeat(2, 1fr); }
  }

  /* ---------- Residency (typewriter + tabs) ---------- */
  .residency {
    background: var(--paper-dark);
    position: relative;
    overflow: hidden;
  }
  .residency::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;

    background: linear-gradient(90deg, transparent, rgba(26,22,18,0.15), transparent);
  }
  .residency-wrap {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: start;
  }
  .residency-left {
    position: sticky;
    top: 120px;
  }
  .typewriter {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(28px, 3.5vw, 48px);
    line-height: 1.15;

  .typewriter .caret {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--ember);
    vertical-align: -0.1em;
    margin-left: 2px;

  .residency-tabs {

  .res-tab {

  .res-tab::before {
    content: "";

    left: 0; top: 0; bottom: 0;
    width: 3px;

    transform: scaleY(0);
    transform-origin: top;

  .res-tab:hover { transform: translateX(4px); }
  .res-tab.active { border-color: var(--ember); }

  .res-tab h4 {

  @keyframes spin {

  .vinyl-label {

  .tonearm {
    position: absolute;

  .listen-ctrl {

  .play-btn {

  .play-btn .icon {

  .progress {
    flex: 1;

  .progress-fill {

  .progress-thumb {

  @media (max-width: 900px) {

  /* ---------- Footer ---------- */
  footer {

  .footer-tagline {

  .footer-col h5 {

  .footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .footer-col a {

  .newsletter {

  .newsletter input {
    flex: 1;
    background: rgba(242,235,223,0.08);

  }
  .newsletter input::placeholder { color: rgba(242,235,223,0.4); }
  .newsletter input:focus {
    border-color: var(--ember);
    background: rgba(242,235,223,0.12);
  }
  .newsletter button {
    padding: 12px 20px;
    background: var(--ember);
    color: var(--paper);
    border: none;
    font-family: var(--mono);
    font-size: 11px;

    text-transform: uppercase;
    transition: background 0.25s;
  }
  .newsletter button:hover { background: var(--rust); }

  .footer-bottom {
    display: flex;
    justify-content: space-between;

    letter-spacing: 0.14em;
    text-transform: uppercase;

  @media (max-width: 900px) {
    .footer-top { grid-template-columns: 1fr 1fr; gap: 40px; }
  }
  @media (max-width: 520px) {
    .footer-top { grid-template-columns: 1fr; }
  }

  /* ---------- Reveal on scroll ---------- */
  .reveal {
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 0.9s cubic-bezier(.2,.8,.2,1),
                transform 0.9s cubic-bezier(.2,.8,.2,1);
  }
  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
    .reveal { opacity: 1; transform: none; }
    .cursor-ring, .cursor-dot, .cursor-ripple { display: none !important; }
    html, body { cursor: auto; }
    a, button { cursor: pointer; }
    .spec-bar { transform: scaleY(0.6) !important; }
    .wave-bar { transform: scaleY(0.5) !important; }
  }
</style>

<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel">
/* ================================================================
   Institute of Echoes — V1 (single-file JSX)
   ================================================================ */

const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ---------- Reduced motion helper ----------
const reduceMotion = () => {
  if (typeof window === "undefined") return false;
  return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
};

// ---------- Custom Cursor ----------
// Direct DOM manipulation (not React state) for performance on mousemove.
// Uses RAF + lerp (damped follow) for smoothness.
function useCustomCursor() {
  useEffect(() => {
    if (reduceMotion()) return;
    if (window.innerWidth <= 900) return;

    const ring = document.createElement("div");
    ring.className = "cursor-ring";
    const dot = document.createElement("div");
    dot.className = "cursor-dot";
    document.body.appendChild(ring);
    document.body.appendChild(dot);

    // spring physics state
    let targetX = window.innerWidth / 2;
    let targetY = window.innerHeight / 2;
    let x = targetX;
    let y = targetY;
    let vx = 0;
    let vy = 0;
    let rafId = null;
    let visible = true;

    // spring constants
    const stiffness = 0.18;
    const damping = 0.75;

    const onMove = (e) => {
      targetX = e.clientX;
      targetY = e.clientY;
    };

    const loop = () => {
      // Hooke's-law-like spring integration
      const ax = (targetX - x) * stiffness;
      const ay = (targetY - y) * stiffness;
      vx = (vx + ax) * damping;
      vy = (vy + ay) * damping;
      x += vx;
      y += vy;

      ring.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%, -50%)`;
      dot.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%, -50%)`;

      if (visible) rafId = requestAnimationFrame(loop);
    };
    rafId = requestAnimationFrame(loop);

    // hover detection
    const hoverSelector = "a, button, [role='button'], .cursor-hover-target, input, .exhib-card, .artist-card, .res-tab, .track";
    const onOver = (e) => {
      if (e.target.closest(hoverSelector)) {
        document.body.classList.add("cursor-hover");
      }
    };
    const onOut = (e) => {
      if (e.target.closest(hoverSelector)) {
        document.body.classList.remove("cursor-hover");
      }
    };
    const onDown = () => document.body.classList.add("cursor-click");
    const onUp = () => document.body.classList.remove("cursor-click");

    // ripple on click
    const onClick = (e) => {
      const r = document.createElement("div");
      r.className = "cursor-ripple";
      r.style.left = e.clientX + "px";
      r.style.top = e.clientY + "px";
      r.style.animation = "rippleOut 0.7s ease-out forwards";
      document.body.appendChild(r);
      setTimeout(() => r.remove(), 750);
    };

    // pause on hidden
    const onVis = () => {
      if (document.hidden) {
        visible = false;
        if (rafId) cancelAnimationFrame(rafId);
      } else {
        visible = true;
        if (!rafId) rafId = requestAnimationFrame(loop);
      }
    };

    window.addEventListener("mousemove", onMove, { passive: true });
    document.addEventListener("mouseover", onOver);
    document.addEventListener("mouseout", onOut);
    window.addEventListener("mousedown", onDown);
    window.addEventListener("mouseup", onUp);
    window.addEventListener("click", onClick);
    document.addEventListener("visibilitychange", onVis);

    return () => {
      visible = false;
      if (rafId) cancelAnimationFrame(rafId);
      window.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseover", onOver);
      document.removeEventListener("mouseout", onOut);
      window.removeEventListener("mousedown", onDown);
      window.removeEventListener("mouseup", onUp);
      window.removeEventListener("click", onClick);
      document.removeEventListener("visibilitychange", onVis);
      ring.remove();
      dot.remove();
    };
  }, []);
}

// ---------- Dust particles (floating motes) ----------
function useDustParticles(canvasRef) {
  useEffect(() => {
    if (reduceMotion()) return;
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let w = 0, h = 0;
    let particles = [];
    let rafId = null;
    let visible = true;
    const COUNT = 60;

    const resize = () => {
      w = canvas.width = window.innerWidth * devicePixelRatio;
      h = canvas.height = window.innerHeight * devicePixelRatio;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
    };

    const init = () => {
      particles = [];
      for (let i = 0; i < COUNT; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: (Math.random() * 1.5 + 0.5) * devicePixelRatio,
          vx: (Math.random() - 0.5) * 0.15 * devicePixelRatio,
          vy: (Math.random() - 0.5) * 0.15 * devicePixelRatio,
          phase: Math.random() * Math.PI * 2,
          speed: 0.008 + Math.random() * 0.015,
          alpha: 0.2 + Math.random() * 0.5,
        });
      }
    };

    let t = 0;
    const loop = () => {
      t += 1;
      ctx.clearRect(0, 0, w, h);
      for (const p of particles) {
        // slow drift + sine wave wobble
        p.x += p.vx + Math.sin(p.phase + t * p.speed) * 0.3;
        p.y += p.vy + Math.cos(p.phase + t * p.speed * 0.7) * 0.2;
        // wrap
        if (p.x < -10) p.x = w + 10;
        if (p.x > w + 10) p.x = -10;
        if (p.y < -10) p.y = h + 10;
        if (p.y > h + 10) p.y = -10;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(217, 100, 42, ${p.alpha})`;
        ctx.fill();
      }
      if (visible) rafId = requestAnimationFrame(loop);
    };

    resize();
    init();
    rafId = requestAnimationFrame(loop);

    const onVis = () => {
      if (document.hidden) {
        visible = false;
        if (rafId) cancelAnimationFrame(rafId);
      } else {
        visible = true;
        rafId = requestAnimationFrame(loop);
      }
    };
    const onResize = () => { resize(); init(); };

    window.addEventListener("resize", onResize);
    document.addEventListener("visibilitychange", onVis);

    return () => {
      visible = false;
      if (rafId) cancelAnimationFrame(rafId);
      window.removeEventListener("resize", onResize);
      document.removeEventListener("visibilitychange", onVis);
    };
  }, [canvasRef]);
}

// ---------- Spectrum bars (simulated audio) ----------
function useSpectrum(containerRef, count = 64) {
  useEffect(() => {
    if (reduceMotion()) return;
    const el = containerRef.current;
    if (!el) return;

    // create bars
    el.innerHTML = "";
    const bars = [];
    for (let i = 0; i < count; i++) {
      const b = document.createElement("div");
      b.className = "spec-bar";
      el.appendChild(b);
      bars.push(b);
    }

    // per-bar state for independent motion
    const state = bars.map((_, i) => ({
      target: 0.3 + Math.random() * 0.5,
      current: 0.3,
      velocity: 0,
      freq: 0.02 + Math.random() * 0.03,
      phase: Math.random() * Math.PI * 2,
      // lower freqs = bigger amplitude (simulates real spectrum)
      weight: Math.pow(1 - i / count, 0.6) * 0.7 + 0.3,
    }));

    let rafId = null;
    let visible = true;
    let t = 0;

    const loop = () => {
      t += 1;
      for (let i = 0; i < state.length; i++) {
        const s = state[i];
        // oscillating target driven by sine, each bar different freq
        const noise = Math.sin(t * s.freq + s.phase) * 0.5 + 0.5;
        const base = 0.15 + noise * s.weight * 0.85;
        // add occasional transients
        const transient = Math.random() < 0.003 ? Math.random() * 0.5 : 0;
        s.target = base + transient;

        // damped spring toward target
        const accel = (s.target - s.current) * 0.12;
        s.velocity = (s.velocity + accel) * 0.78;
        s.current = Math.max(0.02, Math.min(1, s.current + s.velocity));

        bars[i].style.transform = `scaleY(${s.current})`;
      }
      if (visible) rafId = requestAnimationFrame(loop);
    };
    rafId = requestAnimationFrame(loop);

    const onVis = () => {
      if (document.hidden) {
        visible = false;
        if (rafId) cancelAnimationFrame(rafId);
      } else {
        visible = true;
        rafId = requestAnimationFrame(loop);
      }
    };
    document.addEventListener("visibilitychange", onVis);

    return () => {
      visible = false;
      if (rafId) cancelAnimationFrame(rafId);
      document.removeEventListener("visibilitychange", onVis);
    };
  }, [containerRef, count]);
}

// ---------- Waveform bars inside each exhibition card ----------
function useWaveform(containerRef, count = 28) {
  useEffect(() => {
    if (reduceMotion()) return;
    const el = containerRef.current;
    if (!el) return;
    el.innerHTML = "";
    const bars = [];
    for (let i = 0; i < count; i++) {
      const b = document.createElement("div");
      b.className = "wave-bar";
      el.appendChild(b);
      bars.push(b);
    }
    const state = bars.map((_, i) => ({
      current: 0.4 + Math.random() * 0.3,
      velocity: 0,
      target: 0.5,
      phase: Math.random() * Math.PI * 2,
      speed: 0.015 + Math.random() * 0.02,
    }));
    let rafId = null;
    let visible = true;
    let t = 0;
    const loop = () => {
      t += 1;
      for (let i = 0; i < state.length; i++) {
        const s = state[i];
        const wave = Math.sin(t * s.speed + s.phase);
        s.target = 0.3 + wave * wave * 0.6;
        const a = (s.target - s.current) * 0.08;
        s.velocity = (s.velocity + a) * 0.75;
        s.current = Math.max(0.05, Math.min(1, s.current + s.velocity));
        bars[i].style.transform = `scaleY(${s.current})`;
      }
      if (visible) rafId = requestAnimationFrame(loop);
    };
    rafId = requestAnimationFrame(loop);
    const onVis = () => {
      if (document.hidden) {
        visible = false;
        if (rafId) cancelAnimationFrame(rafId);
      } else {
        visible = true;
        rafId = requestAnimationFrame(loop);
      }
    };
    document.addEventListener("visibilitychange", onVis);
    return () => {
      visible = false;
      if (rafId) cancelAnimationFrame(rafId);
      document.removeEventListener("visibilitychange", onVis);
    };
  }, [containerRef, count]);
}

// ---------- Tilt card ----------
function useTilt(ref, strength = 12) {
  useEffect(() => {
    if (reduceMotion()) return;
    const el = ref.current;
    if (!el) return;
    let rafId = null;
    let targetRx = 0, targetRy = 0;
    let curRx = 0, curRy = 0;
    let active = false;

    const onMove = (e) => {
      const rect = el.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width - 0.5;
      const py = (e.clientY - rect.top) / rect.height - 0.5;
      targetRy = px * strength;
      targetRx = -py * strength;
    };
    const onEnter = () => { active = true; loop(); };
    const onLeave = () => {
      active = false;
      targetRx = 0; targetRy = 0;
      // keep animating to rest
    };

    const loop = () => {
      curRx += (targetRx - curRx) * 0.12;
      curRy += (targetRy - curRy) * 0.12;
      el.style.transform = `perspective(900px) rotateX(${curRx}deg) rotateY(${curRy}deg)`;
      if (active || Math.abs(targetRx - curRx) > 0.05 || Math.abs(targetRy - curRy) > 0.05) {
        rafId = requestAnimationFrame(loop);
      } else {
        el.style.transform = "";
        rafId = null;
      }
    };

    el.addEventListener("mousemove", onMove);
    el.addEventListener("mouseenter", onEnter);
    el.addEventListener("mouseleave", onLeave);

    return () => {
      el.removeEventListener("mousemove", onMove);
      el.removeEventListener("mouseenter", onEnter);
      el.removeEventListener("mouseleave", onLeave);
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, [ref, strength]);
}

// ---------- Scroll reveal ----------
function useReveal() {
  useEffect(() => {
    if (reduceMotion()) return;
    const items = document.querySelectorAll(".reveal");
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          e.target.classList.add("visible");
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -60px 0px" });
    items.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);
}

// ---------- Count-up numbers ----------
function useCountUp(ref, target, duration = 2200) {
  useEffect(() => {
    if (reduceMotion()) {
      if (ref.current) ref.current.textContent = target.toLocaleString();
      return;
    }
    const el = ref.current;
    if (!el) return;
    let rafId = null;
    let start = null;
    const easing = (t) => 1 - Math.pow(1 - t, 3); // easeOutCubic

    const tick = (ts) => {
      if (!start) start = ts;
      const progress = Math.min(1, (ts - start) / duration);
      const val = Math.floor(easing(progress) * target);
      el.textContent = val.toLocaleString();
      if (progress < 1) rafId = requestAnimationFrame(tick);
    };

    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          rafId = requestAnimationFrame(tick);
          io.disconnect();
        }
      });
    }, { threshold: 0.4 });
    io.observe(el);

    return () => {
      io.disconnect();
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, [ref, target, duration]);
}

// ---------- Magnetic button ----------
function useMagnetic(ref, strength = 0.25) {
  useEffect(() => {
    if (reduceMotion()) return;
    const el = ref.current;
    if (!el) return;
    let rafId = null;
    let tx = 0, ty = 0;
    let cx = 0, cy = 0;
    let active = false;

    const onMove = (e) => {
      const rect = el.getBoundingClientRect();
      const cxp = rect.left + rect.width / 2;
      const cyp = rect.top + rect.height / 2;
      const dx = (e.clientX - cxp) * strength;
      const dy = (e.clientY - cyp) * strength;
      tx = dx; ty = dy;
    };
    const onEnter = () => { active = true; loop(); };
    const onLeave = () => {
      active = false;
      tx = 0; ty = 0;
    };

    const loop = () => {
      cx += (tx - cx) * 0.15;
      cy += (ty - cy) * 0.15;
      el.style.transform = `translate(${cx}px, ${cy}px)`;
      if (active || Math.abs(tx - cx) > 0.2 || Math.abs(ty - cy) > 0.2) {
        rafId = requestAnimationFrame(loop);
      } else {
        el.style.transform = "";
        rafId = null;
      }
    };

    el.addEventListener("mousemove", onMove);
    el.addEventListener("mouseenter", onEnter);
    el.addEventListener("mouseleave", onLeave);

    return () => {
      el.removeEventListener("mousemove", onMove);
      el.removeEventListener("mouseenter", onEnter);
      el.removeEventListener("mouseleave", onLeave);
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, [ref, strength]);
}

// ---------- Typewriter ----------
function useTypewriter(ref, texts, speed = 45, pause = 2200) {
  useEffect(() => {
    if (reduceMotion()) {
      if (ref.current) ref.current.innerHTML = texts[0] + '<span class="caret"></span>';
      return;
    }
    const el = ref.current;
    if (!el) return;
    let idx = 0;
    let char = 0;
    let typing = true;
    let timer = null;
    let cancelled = false;

    const step = () => {
      if (cancelled) return;
      const current = texts[idx];
      if (typing) {
        char++;
        el.innerHTML = current.slice(0, char) + '<span class="caret"></span>';
        if (char >= current.length) {
          typing = false;
          timer = setTimeout(() => { typing = false; step(); }, pause);
          return;
        }
        // variable speed for more natural feel
        const delay = speed + (Math.random() - 0.5) * 30;
        timer = setTimeout(step, delay);
      } else {
        char--;
        el.innerHTML = current.slice(0, char) + '<span class="caret"></span>';
        if (char <= 0) {
          typing = true;
          idx = (idx + 1) % texts.length;
          timer = setTimeout(step, 400);
          return;
        }
        timer = setTimeout(step, speed * 0.45);
      }
    };
    timer = setTimeout(step, 600);

    return () => {
      cancelled = true;
      if (timer) clearTimeout(timer);
    };
  }, [ref, texts, speed, pause]);
}

// ---------- Parallax (slow bg layer) ----------
function useParallaxLayer(ref, speed = 0.1) {
  useEffect(() => {
    if (reduceMotion()) return;
    const el = ref.current;
    if (!el) return;
    let rafId = null;
    let scrollY = 0;
    let targetY = 0;

    const onScroll = () => {
      const rect = el.getBoundingClientRect();
      const centerOffset = rect.top + rect.height / 2 - window.innerHeight / 2;
      targetY = centerOffset * speed;
      if (!rafId) rafId = requestAnimationFrame(update);
    };
    const update = () => {
      scrollY += (targetY - scrollY) * 0.08;
      el.style.transform = `translateY(${scrollY}px)`;
      if (Math.abs(targetY - scrollY) > 0.1) {
        rafId = requestAnimationFrame(update);
      } else {
        rafId = null;
      }
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => {
      window.removeEventListener("scroll", onScroll);
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, [ref, speed]);
}

// ---------- Nav scroll state ----------
function useNavScrolled() {
  useEffect(() => {
    const nav = document.querySelector(".nav");
    if (!nav) return;
    let ticking = false;
    const onScroll = () => {
      if (!ticking) {
        requestAnimationFrame(() => {
          if (window.scrollY > 40) nav.classList.add("scrolled");
          else nav.classList.remove("scrolled");
          ticking = false;
        });
        ticking = true;
      }
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
}

                <div style={{ flex: 1 }}>
                  <div className="progress cursor-hover-target">
                    <div className="progress-fill" style={{ width: `${progress * 100}%` }}></div>
                    <div className="progress-thumb" style={{ left: `${progress * 100}%` }}></div>
                  </div>
                  <div className="time-codes">
                    <span>{formatTime(progress)}</span>
                    <span>{currentTrack.dur}</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      {/* Footer */}
      <footer>
        <div className="footer-inner">
          <div className="footer-top">
            <div className="reveal">
              <div className="footer-brand">Institute of<br />Echoes</div>
              <p className="footer-tagline">
                A residency and exhibition space devoted to sound art,
                listening practices, and the spaces between notes.
              </p>
              <form className="newsletter" onSubmit={handleSubscribe}>
                <input
                  type="email"
                  placeholder="your@email.com"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}

                />
                <button type="submit" className="cursor-hover-target">

              </form>

}

// SVG component for the parallax reel
function VinylReelSVG() {
  return (
    <svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="reelGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor="#D9642A" stopOpacity="0.9" />
          <stop offset="100%" stopColor="#D9642A" stopOpacity="0" />
        </radialGradient>
      </defs>
      {/* outer ring */}
      <circle cx="250" cy="250" r="240" fill="none" stroke="#F2EBDF" strokeWidth="1" opacity="0.2" />
      <circle cx="250" cy="250" r="220" fill="none" stroke="#F2EBDF" strokeWidth="0.5" opacity="0.15" />
      <circle cx="250" cy="250" r="200" fill="none" stroke="#F2EBDF" strokeWidth="0.5" opacity="0.15" />
      <circle cx="250" cy="250" r="180" fill="none" stroke="#F2EBDF" strokeWidth="0.5" opacity="0.15" />
      <circle cx="250" cy="250" r="160" fill="none" stroke="#F2EBDF" strokeWidth="0.5" opacity="0.15" />
      <circle cx="250" cy="250" r="140" fill="none" stroke="#F2EBDF" strokeWidth="0.5" opacity="0.15" />
      {/* center hub */}
      <circle cx="250" cy="250" r="120" fill="url(#reelGrad)" opacity="0.5" />
      <circle cx="250" cy="250" r="40" fill="#1A1612" stroke="#D9642A" strokeWidth="1.5" />
      <circle cx="250" cy="250" r="10" fill="#1A1612" stroke="#D9642A" strokeWidth="1" />
      {/* reel spool details */}
      {Array.from({ length: 6 }).map((_, i) => {
        const angle = (i / 6) * Math.PI * 2;
        const x = 250 + Math.cos(angle) * 30;
        const y = 250 + Math.sin(angle) * 30;
        return <circle key={i} cx={x} cy={y} r="4" fill="#D9642A" opacity="0.8" />;
      })}
      {/* spoke lines */}
      {Array.from({ length: 12 }).map((_, i) => {
        const angle = (i / 12) * Math.PI * 2;
        const x1 = 250 + Math.cos(angle) * 50;
        const y1 = 250 + Math.sin(angle) * 50;
        const x2 = 250 + Math.cos(angle) * 230;
        const y2 = 250 + Math.sin(angle) * 230;
        return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="#D9642A" strokeWidth="0.5" opacity="0.25" />;
      })}
    </svg>
  );
}

// ---------- Announce upgrade availability ----------
function announceUpgrade() {
  window.parent.postMessage({ type: "miaoda:upgrade:available", kind: "interactive-prototype" }, "*");
}
announceUpgrade();
if (document.readyState !== "complete") {
  window.addEventListener("load", announceUpgrade, { once: true });
}

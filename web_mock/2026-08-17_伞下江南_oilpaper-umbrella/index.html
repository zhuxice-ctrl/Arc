<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>伞下江南 · 油纸伞工坊</title>
  <link rel="preconnect" href="https://miaoda.feishucdn.cn" />
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600;700;900&family=ZCOOL+XiaoWei&display=swap" />
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --paper: #F5EFE0;
      --paper-deep: #EAE1CC;
      --amber: #C88A2E;
      --amber-deep: #A66D1C;
      --amber-light: #E0B156;
      --dai: #2D3E4E;
      --dai-light: #4A5F73;
      --zhu: #B8342A;
      --zhu-light: #D44A3E;
      --ink: #1A1A1A;
      --paper-gray: #8B8374;
      --bamboo: #7A8B4A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Noto Serif SC', serif;
      font-weight: 400;
      line-height: 1.8;
      overflow-x: hidden;
      cursor: none;
    }
    @media (max-width: 768px) {
      html, body { cursor: auto; }
    }
    a { color: inherit; text-decoration: none; cursor: none; }
    button { cursor: none; font-family: inherit; }
    @media (max-width: 768px) { a, button { cursor: pointer; } }
    img { max-width: 100%; display: block; }

    /* ========== 宣纸纹理背景 ========== */
    .paper-texture {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.6;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(200, 138, 46, 0.04) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(45, 62, 78, 0.03) 0%, transparent 45%),
        repeating-linear-gradient(
          45deg,
          transparent,
          transparent 2px,
          rgba(184, 52, 42, 0.008) 2px,
          rgba(184, 52, 42, 0.008) 4px
        );
    }

    /* ========== 自定义光标 ========== */
    .cursor-outer {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      border: 2px solid #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 9999;
      mix-blend-mode: difference;
      box-shadow:
        0 0 12px rgba(200, 138, 46, 0.6),
        0 0 24px rgba(200, 138, 46, 0.3),
        inset 0 0 8px rgba(255,255,255,0.1);
      transition: width 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  height 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  border-color 0.2s ease,
                  opacity 0.2s ease;
    }
    .cursor-outer.hover {
      width: 60px;
      height: 60px;
      border-color: var(--amber-light);
      box-shadow:
        0 0 20px rgba(200, 138, 46, 0.8),
        0 0 40px rgba(200, 138, 46, 0.4),
        inset 0 0 12px rgba(200, 138, 46, 0.2);
    }
    .cursor-outer.click {
      width: 28px;
      height: 28px;
    }
    .cursor-inner {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background: var(--zhu);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10000;
      mix-blend-mode: normal;
      box-shadow: 0 0 8px var(--zhu), 0 0 16px rgba(184, 52, 42, 0.5);
      transition: background 0.2s ease, width 0.15s ease, height 0.15s ease;
    }
    .cursor-inner.hover {
      width: 10px;
      height: 10px;
      background: var(--amber-light);
    }

    /* ========== 光标涟漪 ========== */
    .cursor-ripple {
      position: fixed;
      width: 0;
      height: 0;
      border: 1.5px solid var(--amber);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 9998;
      opacity: 0.8;
      animation: rippleExpand 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes rippleExpand {
      0% { width: 0; height: 0; opacity: 0.9; border-width: 2px; }
      100% { width: 120px; height: 120px; opacity: 0; border-width: 1px; }
    }

    /* ========== 雨滴粒子 canvas ========== */
    .rain-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    /* ========== 导航 ========== */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 48px;
      transition: background 0.4s ease, backdrop-filter 0.4s ease, padding 0.4s ease;
    }
    .nav.scrolled {
      background: rgba(245, 239, 224, 0.85);
      backdrop-filter: blur(12px);
      padding: 14px 48px;
      border-bottom: 1px solid rgba(200, 138, 46, 0.15);
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 24px;
      color: var(--ink);
    }
    .nav-brand .brand-seal {
      width: 36px;
      height: 36px;
      background: var(--zhu);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 18px;
      border-radius: 4px;
      transform: rotate(-4deg);
      box-shadow: 0 2px 8px rgba(184, 52, 42, 0.3);
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 36px;
      list-style: none;
    }
    .nav-links a {
      position: relative;
      font-size: 15px;
      color: var(--ink);
      transition: color 0.3s ease;
      padding: 4px 0;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 0;
      height: 2px;
      background: var(--zhu);
      transform: translateX(-50%);
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .nav-links a:hover { color: var(--zhu); }
    .nav-links a:hover::after { width: 100%; }
    .nav-cta {
      padding: 10px 24px;
      border: 1px solid var(--amber-deep);
      background: transparent;
      color: var(--amber-deep);
      border-radius: 2px;
      font-size: 14px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .nav-cta::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(200,138,46,0.15), transparent);
      transition: left 0.6s ease;
    }
    .nav-cta:hover {
      background: var(--amber-deep);
      color: #fff;
      box-shadow: 0 4px 16px rgba(200,138,46,0.3);
    }
    .nav-cta:hover::before { left: 100%; }

    .hamburger {
      display: none;
      background: none;
      border: none;
      width: 32px;
      height: 24px;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px 0;
    }
    .hamburger span {
      display: block;
      width: 100%;
      height: 2px;
      background: var(--ink);
      transition: all 0.3s ease;
    }

    @media (max-width: 768px) {
      .nav { padding: 16px 20px; }
      .nav.scrolled { padding: 12px 20px; }
      .nav-links { display: none; }
      .hamburger { display: flex; }
    }

    /* ========== HERO ========== */
    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 10;
    }
    .hero-inner {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 1400px;
      padding: 0 48px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 60px;
      align-items: center;
    }
    .hero-text {
      position: relative;
    }
    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: var(--zhu);
      letter-spacing: 4px;
      margin-bottom: 28px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s 0.3s ease forwards;
    }
    .hero-eyebrow::before {
      content: '';
      width: 32px;
      height: 1px;
      background: var(--zhu);
    }
    .hero-title {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: clamp(48px, 7vw, 96px);
      line-height: 1.1;
      color: var(--ink);
      margin-bottom: 24px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 0.9s 0.5s ease forwards;
    }
    .hero-title .accent {
      color: var(--zhu);
      display: inline-block;
      position: relative;
    }
    .hero-sub {
      font-size: 17px;
      line-height: 2;
      color: var(--dai);
      max-width: 480px;
      margin-bottom: 40px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s 0.7s ease forwards;
    }
    .hero-buttons {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s 0.9s ease forwards;
    }
    .btn-primary {
      padding: 14px 36px;
      background: var(--zhu);
      color: #fff;
      border: none;
      border-radius: 2px;
      font-size: 15px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(184, 52, 42, 0.3);
    }
    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.6s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(184, 52, 42, 0.4);
    }
    .btn-primary:hover::before { left: 120%; }
    .btn-ghost {
      padding: 14px 36px;
      background: transparent;
      color: var(--dai);
      border: 1px solid var(--dai-light);
      border-radius: 2px;
      font-size: 15px;
      transition: all 0.3s ease;
    }
    .btn-ghost:hover {
      background: var(--dai);
      color: var(--paper);
      border-color: var(--dai);
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Hero Umbrella 3D 交互区 */
    .hero-umbrella-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
      opacity: 0;
      animation: fadeIn 1s 0.4s ease forwards;
    }
    @keyframes fadeIn { to { opacity: 1; } }
    .hero-umbrella {
      position: relative;
      width: 480px;
      height: 480px;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out;
    }
    .umbrella-canopy {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, var(--paper-light) 0%, var(--paper) 40%, var(--paper-deep) 75%, var(--amber-deep) 100%);
      border-radius: 50% 50% 50% 50% / 12% 12% 88% 88%;
      box-shadow:
        inset 0 -20px 40px rgba(45, 62, 78, 0.15),
        inset 0 10px 20px rgba(255,255,255,0.4),
        0 20px 60px rgba(0,0,0,0.15);
      transform: rotateX(18deg);
      transform-origin: center top;
    }
    .umbrella-canopy::before {
      content: '';
      position: absolute;
      inset: 12%;
      border-radius: 50% 50% 50% 50% / 12% 12% 88% 88%;
      background:
        radial-gradient(ellipse at 30% 30%, rgba(184, 52, 42, 0.15) 0%, transparent 20%),
        radial-gradient(ellipse at 70% 50%, rgba(45, 62, 78, 0.1) 0%, transparent 25%),
        radial-gradient(ellipse at 50% 70%, rgba(200, 138, 46, 0.12) 0%, transparent 30%);
    }
    .umbrella-canopy::after {
      content: '荷';
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 72px;
      color: var(--zhu);
      opacity: 0.75;
      text-shadow: 2px 2px 8px rgba(184,52,42,0.2);
    }
    /* 伞骨 */
    .umbrella-ribs {
      position: absolute;
      top: 49%;
      left: 50%;
      width: 100%;
      height: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }
    .umbrella-rib {
      position: absolute;
      top: 0;
      left: 50%;
      width: 1.5px;
      height: 100%;
      background: linear-gradient(to bottom, var(--amber-deep), var(--amber));
      transform-origin: top center;
      opacity: 0.6;
    }
    /* 伞柄 */
    .umbrella-handle {
      position: absolute;
      top: 49%;
      left: 50%;
      width: 6px;
      height: 140px;
      background: linear-gradient(to bottom, var(--amber-deep), var(--amber), var(--amber-deep));
      transform: translateX(-50%);
      border-radius: 0 0 3px 3px;
      box-shadow: 2px 4px 10px rgba(0,0,0,0.15);
    }
    .umbrella-handle::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      background: var(--zhu);
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(184, 52, 42, 0.4);
    }
    /* 伞顶 */
    .umbrella-top {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 24px;
      background: linear-gradient(to bottom, var(--amber-light), var(--amber-deep));
      border-radius: 50% 50% 20% 20%;
      z-index: 2;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    /* 伞面光泽扫过 */
    .umbrella-shine {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.45) 50%, transparent 60%);
      border-radius: inherit;
      animation: shineSweep 4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes shineSweep {
      0%, 60% { left: -100%; }
      100% { left: 120%; }
    }

    /* 雨滴落到伞面的特效 */
    .umbrella-drip {
      position: absolute;
      width: 3px;
      height: 3px;
      background: var(--dai-light);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
    }

    @media (max-width: 768px) {
      .hero-inner {
        grid-template-columns: 1fr;
        padding: 0 20px;
        gap: 40px;
        text-align: center;
        padding-top: 100px;
      }
      .hero-text { order: 2; }
      .hero-umbrella-wrap { order: 1; }
      .hero-umbrella { width: 280px; height: 280px; }
      .umbrella-canopy::after { font-size: 42px; }
      .umbrella-handle { height: 80px; }
      .hero-buttons { justify-content: center; }
      .hero-sub { margin-left: auto; margin-right: auto; }
      .hero-eyebrow { justify-content: center; }
    }

    /* ========== 数字统计条 ========== */
    .stats-bar {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
      gap: 80px;
      padding: 60px 48px;
      border-top: 1px solid rgba(200,138,46,0.2);
      border-bottom: 1px solid rgba(200,138,46,0.2);
      background: rgba(234, 225, 204, 0.4);
      flex-wrap: wrap;
    }
    .stat-item {
      text-align: center;
    }
    .stat-num {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 56px;
      color: var(--zhu);
      line-height: 1;
      margin-bottom: 8px;
      text-shadow: 2px 2px 0 rgba(200,138,46,0.1);
    }
    .stat-label {
      font-size: 14px;
      color: var(--dai);
      letter-spacing: 2px;
    }
    .stat-label .unit {
      color: var(--paper-gray);
      font-size: 12px;
      margin-left: 4px;
    }
    @media (max-width: 768px) {
      .stats-bar { gap: 32px; padding: 40px 20px; }
      .stat-num { font-size: 36px; }
    }

    /* ========== 通用 Section 样式 ========== */
    .section {
      position: relative;
      z-index: 10;
      padding: 120px 48px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .section-head {
      text-align: center;
      margin-bottom: 80px;
    }
    .section-eyebrow {
      font-size: 13px;
      color: var(--zhu);
      letter-spacing: 6px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }
    .section-title {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: clamp(36px, 4.5vw, 56px);
      color: var(--ink);
      margin-bottom: 16px;
    }
    .section-desc {
      font-size: 15px;
      color: var(--paper-gray);
      max-width: 560px;
      margin: 0 auto;
      line-height: 1.9;
    }
    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }
    .reveal-delay-4 { transition-delay: 0.4s; }
    .reveal-delay-5 { transition-delay: 0.5s; }

    @media (max-width: 768px) {
      .section { padding: 60px 20px; }
      .section-head { margin-bottom: 48px; }
    }

    /* ========== 故事 Section ========== */
    .story-section {
      background: var(--paper);
    }
    .story-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: center;
    }
    .story-img-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      aspect-ratio: 4/5;
    }
    .story-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .story-img-wrap:hover img { transform: scale(1.05); }
    .story-img-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 60%, rgba(45, 62, 78, 0.3) 100%);
      pointer-events: none;
    }
    .story-seal {
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 72px;
      height: 72px;
      background: var(--zhu);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 28px;
      border-radius: 6px;
      transform: rotate(-6deg);
      z-index: 2;
      box-shadow: 0 8px 24px rgba(184, 52, 42, 0.3);
      opacity: 0.9;
    }
    .story-content h3 {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 28px;
      color: var(--dai);
      margin-bottom: 28px;
      line-height: 1.5;
      font-weight: 400;
    }
    .story-content p {
      font-size: 16px;
      color: var(--ink);
      line-height: 2.1;
      margin-bottom: 20px;
      text-indent: 2em;
    }
    .story-content .quote {
      position: relative;
      padding: 24px 32px;
      margin: 32px 0;
      border-left: 3px solid var(--zhu);
      background: rgba(234, 225, 204, 0.5);
      font-style: italic;
      color: var(--dai);
      text-indent: 0;
    }
    .story-content .quote::before {
      content: '"';
      position: absolute;
      top: -10px;
      left: 12px;
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 56px;
      color: var(--zhu);
      opacity: 0.3;
    }
    @media (max-width: 768px) {
      .story-grid { grid-template-columns: 1fr; gap: 40px; }
    }

    /* ========== 伞骨结构 Section ========== */
    .structure-section {
      background: linear-gradient(180deg, var(--paper) 0%, var(--paper-deep) 100%);
    }
    .structure-visual {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 500px;
      perspective: 1200px;
    }
    .umbrella-3d {
      position: relative;
      width: 400px;
      height: 400px;
      transform-style: preserve-3d;
      animation: floatY 6s ease-in-out infinite;
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0) rotateY(0deg); }
      50% { transform: translateY(-15px) rotateY(8deg); }
    }
    .umbrella-top-view {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, var(--paper) 0%, var(--amber-light) 70%, var(--amber-deep) 100%);
      transform: rotateX(75deg);
      box-shadow: 0 30px 60px rgba(45, 62, 78, 0.2);

    .artisans-grid {
      display: grid;

    }

    .artisan-img {
      position: relative;

      overflow: hidden;

    .artisan-img img {

    .artisan-title {

      color: var(--zhu);

      margin-bottom: 16px;

    .artisan-bio {
      font-size: 14px;

    .artisan-skills {

    /* ========== 预约体验 Section ========== */
    .booking-section {
      background: linear-gradient(135deg, var(--dai) 0%, #1e2d3a 100%);
      color: var(--paper);
      position: relative;
      overflow: hidden;
    }
    .booking-section::before {
      content: '';
      position: absolute;
      top: -100px;
      right: -100px;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200,138,46,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .booking-section::after {
      content: '';
      position: absolute;
      bottom: -150px;
      left: -100px;

      height: 500px;

    .booking-feat {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }
    .booking-feat .feat-icon {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      background: rgba(200, 138, 46, 0.2);
      border: 1px solid var(--amber);

      align-items: center;
      justify-content: center;
      color: var(--amber-light);
      font-size: 18px;
    }
    .booking-feat h4 {
      font-size: 16px;
      color: var(--paper);
      margin-bottom: 4px;
      font-weight: 500;

    .booking-feat p {

      color: rgba(245, 239, 224, 0.6);
      line-height: 1.7;

    .booking-form {
      background: rgba(245, 239, 224, 0.06);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(200, 138, 46, 0.2);
      border-radius: 6px;
      padding: 40px;

    .form-title {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 24px;
      color: var(--paper);
      margin-bottom: 28px;
    }

      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;

    .form-group label {
      font-size: 13px;
      color: rgba(245, 239, 224, 0.7);
      letter-spacing: 1px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 12px 16px;
      background: rgba(245, 239, 224, 0.08);
      border: 1px solid rgba(245, 239, 224, 0.15);
      border-radius: 2px;
      color: var(--paper);
      font-size: 15px;
      font-family: inherit;
      transition: all 0.3s ease;
      outline: none;
      cursor: none;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--amber);
      background: rgba(245, 239, 224, 0.12);
      box-shadow: 0 0 0 3px rgba(200, 138, 46, 0.15);

    .form-group select option {
      background: var(--dai);
      color: var(--paper);
    }
    .form-group textarea {
      resize: vertical;
      min-height: 100px;

    .form-submit {

      padding: 16px;
      background: var(--zhu);
      color: #fff;
      border: none;
      border-radius: 2px;

      transition: left 0.6s ease;

    @media (max-width: 768px) {

      .booking-form { padding: 28px 20px; }
      .form-row { grid-template-columns: 1fr; gap: 0; }

    /* ========== Footer ========== */
    .footer {
      position: relative;
      z-index: 10;
      background: var(--ink);
      color: rgba(245, 239, 224, 0.6);
      padding: 60px 48px 30px;

    .footer-top {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 60px;

    .footer-brand {
      font-family: 'Ma Shan Zheng', cursive;

      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;

    .footer-brand .seal {
      width: 36px;
      height: 36px;
      background: var(--zhu);
      color: #fff;
      display: flex;
      align-items: center;

      border-radius: 4px;

    .footer-desc {
      font-size: 14px;
      line-height: 1.9;

    .footer-col h5 {
      font-size: 15px;
      color: var(--paper);
      margin-bottom: 20px;

    .footer-col a:hover { color: var(--amber-light); }
    .footer-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 28px;
      border-top: 1px solid rgba(245, 239, 224, 0.1);
      font-size: 12px;
      flex-wrap: wrap;
      gap: 12px;
    }
    @media (max-width: 768px) {
      .footer { padding: 40px 20px 24px; }
      .footer-top { grid-template-columns: 1fr 1fr; gap: 32px; }

    /* ========== 打字机效果 ========== */
    .typewriter {
      display: inline-block;
    }
    .typewriter-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--zhu);
      margin-left: 4px;
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;

    @keyframes blink {
      0%, 100% { opacity: 1; }

    /* ========== 竹骨生长 ========== */
    .bamboo-grow {
      stroke-dasharray: 200;
      stroke-dashoffset: 200;

    .bamboo-grow.visible {
      animation: bambooGrow 2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes bambooGrow {
      to { stroke-dashoffset: 0; }
    }

    /* ========== 回到顶部按钮 ========== */
    .back-to-top {
      position: fixed;
      bottom: 32px;
      right: 32px;
      width: 48px;
      height: 48px;
      background: var(--dai);
      color: var(--paper);
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 90;
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 4px 16px rgba(45, 62, 78, 0.3);
    }
    .back-to-top.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .back-to-top:hover {
      background: var(--zhu);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(184, 52, 42, 0.4);
    }

    /* ========== 移动端菜单 ========== */
    .mobile-menu {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(245, 239, 224, 0.98);
      backdrop-filter: blur(12px);
      z-index: 99;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      transform: translateX(100%);
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .mobile-menu.open { transform: translateX(0); }
    .mobile-menu a {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 24px;
      color: var(--ink);
      letter-spacing: 4px;
    }
    .mobile-close {
      position: absolute;
      top: 24px;
      right: 24px;
      background: none;
      border: none;
      font-size: 28px;
      color: var(--ink);
      width: 40px;
      height: 40px;
    }

    /* ========== 遮罩层（伞面展开） ========== */
    .page-loader {
      position: fixed;
      inset: 0;
      background: var(--paper);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    .page-loader.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .loader-umbrella {
      position: relative;
      width: 80px;
      height: 80px;
    }
    .loader-canopy {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%) scaleX(0);
      width: 100%;
      height: 65%;
      background: linear-gradient(180deg, var(--paper-light), var(--amber));
      border-radius: 50% 50% 50% 50% / 20% 20% 80% 80%;
      transform-origin: center top;
      animation: umbrellaOpen 1.5s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
    }
    @keyframes umbrellaOpen {
      0% { transform: translateX(-50%) scaleX(0) rotateX(60deg); }
      100% { transform: translateX(-50%) scaleX(1) rotateX(0deg); }
    }
    .loader-handle {
      position: absolute;
      top: 62%;
      left: 50%;
      transform: translateX(-50%) scaleY(0);
      width: 3px;
      height: 35%;
      background: var(--amber-deep);
      transform-origin: top center;
      animation: handleGrow 0.8s ease-out 1.2s forwards;
    }
    @keyframes handleGrow {
      to { transform: translateX(-50%) scaleY(1); }
    }

    /* ========== prefers-reduced-motion 降级 ========== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .cursor-outer, .cursor-inner, .cursor-ripple, .rain-canvas { display: none; }
      html, body { cursor: auto; }
      a, button { cursor: pointer; }
      .reveal { opacity: 1; transform: none; }
    }
  </style>

  <div id="root"></div>

  <script type="text/babel">
  const { useState, useEffect, useRef, useCallback, useMemo } = React;

  // ========== 全局动画 ID 管理 ==========
  const animRegistry = {
    rafIds: new Set(),
    timeouts: new Set(),
    intervals: new Set(),
    paused: false,
  };
  function safeRAF(cb) {
    let id;
    const wrapped = (t) => {
      animRegistry.rafIds.delete(id);
      cb(t);
    };
    id = requestAnimationFrame(wrapped);
    animRegistry.rafIds.add(id);

  // ========== 自定义光标组件 ==========
  function CustomCursor() {
    const outerRef = useRef(null);
    const innerRef = useRef(null);
    const ripplesRef = useRef([]);
    const posRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
    const targetRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
    const [hover, setHover] = useState(false);
    const [click, setClick] = useState(false);
    const [ripples, setRipples] = useState([]);
    const rafRef = useRef(null);

    useEffect(() => {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduced) return;
      if (window.innerWidth <= 768) return;

      const lerp = (a, b, t) => a + (b - a) * t;

      const animate = () => {
        if (animRegistry.paused) {
          rafRef.current = safeRAF(animate);
          return;
        }
        posRef.current.x = lerp(posRef.current.x, targetRef.current.x, 0.18);
        posRef.current.y = lerp(posRef.current.y, targetRef.current.y, 0.18);

        if (outerRef.current) {
          outerRef.current.style.left = posRef.current.x + 'px';
          outerRef.current.style.top = posRef.current.y + 'px';
        }
        if (innerRef.current) {
          innerRef.current.style.left = targetRef.current.x + 'px';
          innerRef.current.style.top = targetRef.current.y + 'px';
        }
        rafRef.current = safeRAF(animate);
      };
      rafRef.current = safeRAF(animate);

      const onMove = (e) => {
        targetRef.current.x = e.clientX;
        targetRef.current.y = e.clientY;
      };

      const onOver = (e) => {
        const target = e.target;
        if (target.closest('a, button, [data-interactive], .gallery-item, .artisan-card, input, select, textarea')) {
          setHover(true);
        } else {
          setHover(false);
        }
      };

      const onDown = (e) => {
        setClick(true);
        const id = Date.now() + Math.random();
        setRipples(prev => [...prev, { id, x: e.clientX, y: e.clientY }]);
        safeTimeout(() => {
          setRipples(prev => prev.filter(r => r.id !== id));
        }, 800);
        safeTimeout(() => setClick(false), 150);
      };

      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseover', onOver);
      window.addEventListener('mousedown', onDown);

      return () => {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseover', onOver);
        window.removeEventListener('mousedown', onDown);
      };
    }, []);

    return (
      <>
        <div
          ref={outerRef}
          className={`cursor-outer ${hover ? 'hover' : ''} ${click ? 'click' : ''}`}
        />
        <div
          ref={innerRef}
          className={`cursor-inner ${hover ? 'hover' : ''}`}
        />
        {ripples.map(r => (
          <div
            key={r.id}
            className="cursor-ripple"
            style={{ left: r.x, top: r.y }}
          />
        ))}
      </>
    );
  }

  // ========== 雨滴粒子系统 ==========
  function RainParticles() {
    const canvasRef = useRef(null);
    const rafRef = useRef(null);
    const dropsRef = useRef([]);

    useEffect(() => {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduced) return;

      const canvas = canvasRef.current;
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w, h;

      const resize = () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      };
      resize();
      window.addEventListener('resize', resize);

      // 初始化雨滴
      const DROP_COUNT = Math.min(80, Math.floor(window.innerWidth / 20));
      const drops = [];
      for (let i = 0; i < DROP_COUNT; i++) {
        drops.push({
          x: Math.random() * w,
          y: Math.random() * h,
          len: 8 + Math.random() * 16,
          speed: 2 + Math.random() * 3,
          opacity: 0.1 + Math.random() * 0.25,
          sway: (Math.random() - 0.5) * 0.5,
        });
      }
      dropsRef.current = drops;

      // 涟漪池
      const ripples = [];
      const ripplePool = [];

      const animate = () => {
        if (animRegistry.paused) {
          rafRef.current = safeRAF(animate);
          return;
        }
        ctx.clearRect(0, 0, w, h);

        // 画雨滴
        ctx.lineWidth = 1;
        drops.forEach(d => {
          ctx.beginPath();
          ctx.strokeStyle = `rgba(45, 62, 78, ${d.opacity})`;
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(d.x + d.sway, d.y + d.len);
          ctx.stroke();

          d.y += d.speed;
          d.x += d.sway * 0.1;

          if (d.y > h) {
            // 生成涟漪
            if (Math.random() < 0.15) {
              const r = ripplePool.pop() || { x: 0, y: 0, r: 0, maxR: 20, opacity: 0.3 };
              r.x = d.x;
              r.y = h - 10;
              r.r = 2;
              r.maxR = 15 + Math.random() * 15;
              r.opacity = 0.25 + Math.random() * 0.2;
              ripples.push(r);
            }
            d.y = -d.len;
            d.x = Math.random() * w;
          }
        });

        // 画涟漪
        for (let i = ripples.length - 1; i >= 0; i--) {
          const r = ripples[i];
          r.r += 0.6;
          r.opacity -= 0.008;
          if (r.opacity <= 0 || r.r >= r.maxR) {
            ripplePool.push(ripples.splice(i, 1)[0]);
            continue;
          }
          ctx.beginPath();
          ctx.strokeStyle = `rgba(45, 62, 78, ${r.opacity})`;
          ctx.ellipse(r.x, r.y, r.r, r.r * 0.35, 0, 0, Math.PI * 2);
          ctx.stroke();
        }

        rafRef.current = safeRAF(animate);
      };
      rafRef.current = safeRAF(animate);

      return () => {
        window.removeEventListener('resize', resize);
      };
    }, []);

    return <canvas ref={canvasRef} className="rain-canvas" />;
  }

  // ========== 滚动渐入 Hook ==========
  function useReveal() {
    useEffect(() => {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduced) {
        document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
        return;
      }
      const els = document.querySelectorAll('.reveal');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });

      els.forEach(el => observer.observe(el));
      return () => observer.disconnect();
    }, []);
  }

  // ========== 数字计数 Hook ==========
  function useCounter(ref, target, duration = 2000) {
    useEffect(() => {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const el = ref.current;
      if (!el) return;
      if (reduced) {
        el.textContent = target;
        return;
      }

      let started = false;
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting && !started) {
            started = true;
            const start = performance.now();
            const easeOutExpo = (t) => t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
            const tick = (now) => {
              const elapsed = now - start;
              const progress = Math.min(elapsed / duration, 1);
              const val = Math.floor(easeOutExpo(progress) * target);
              el.textContent = val;
              if (progress < 1) {
                safeRAF(tick);
              } else {
                el.textContent = target;
              }
            };
            safeRAF(tick);
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.5 });
      observer.observe(el);
      return () => observer.disconnect();
    }, [target, duration]);
  }

  // ========== 打字机效果 ==========
  function Typewriter({ text, speed = 80, delay = 0 }) {
    const [displayed, setDisplayed] = useState('');
    const [done, setDone] = useState(false);
    const indexRef = useRef(0);

    useEffect(() => {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduced) {
        setDisplayed(text);
        setDone(true);
        return;
      }
      let timer;
      const start = () => {
        const type = () => {
          if (indexRef.current < text.length) {
            setDisplayed(text.slice(0, indexRef.current + 1));
            indexRef.current++;
            timer = safeTimeout(type, speed + Math.random() * 40);
          } else {
            setDone(true);
          }
        };
        type();
      };
      timer = safeTimeout(start, delay);
      return () => { clearTimeout(timer); indexRef.current = 0; setDisplayed(''); setDone(false); };
    }, [text, speed, delay]);

    return (
      <span className="typewriter">
        {displayed}
        {!done && <span className="typewriter-cursor" />}
      </span>
    );
  }

  // ========== Hero 伞面 3D 倾斜 ==========
  function HeroUmbrella3D() {
    const wrapRef = useRef(null);
    const umbrellaRef = useRef(null);

    useEffect(() => {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduced) return;
      const wrap = wrapRef.current;
      const umb = umbrellaRef.current;
      if (!wrap || !umb) return;

      let targetRX = 0, targetRY = 0;
      let currentRX = 0, currentRY = 0;
      let rafId = null;
      let hovering = false;

      const onMove = (e) => {
        if (!hovering) return;
        const rect = wrap.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;
        targetRY = x * 20;
        targetRX = -y * 15;
      };

      const onEnter = () => { hovering = true; };
      const onLeave = () => {
        hovering = false;
        targetRX = 0;
        targetRY = 0;
      };

      const animate = () => {
        if (animRegistry.paused) {
          rafId = safeRAF(animate);
          return;
        }
        currentRX += (targetRX - currentRX) * 0.08;
        currentRY += (targetRY - currentRY) * 0.08;
        umb.style.transform = `rotateX(${currentRX}deg) rotateY(${currentRY}deg)`;
        rafId = safeRAF(animate);
      };
      rafId = safeRAF(animate);

      wrap.addEventListener('mousemove', onMove);
      wrap.addEventListener('mouseenter', onEnter);
      wrap.addEventListener('mouseleave', onLeave);

      return () => {
        wrap.removeEventListener('mousemove', onMove);
        wrap.removeEventListener('mouseenter', onEnter);
        wrap.removeEventListener('mouseleave', onLeave);
      };
    }, []);

    // 生成伞骨
    const ribCount = 16;
    const ribs = [];
    for (let i = 0; i < ribCount; i++) {
      const angle = (i / ribCount) * 360;
      ribs.push(
        <div
          key={i}
          className="umbrella-rib"
          style={{ transform: `rotate(${angle}deg)` }}
        />
      );
    }

    return (
      <div className="hero-umbrella-wrap" ref={wrapRef} data-interactive>
        <div className="hero-umbrella" ref={umbrellaRef}>
          <div className="umbrella-top" />
          <div className="umbrella-canopy">
            <div className="umbrella-shine" />
          </div>
          <div className="umbrella-ribs">{ribs}</div>
          <div className="umbrella-handle" />
        </div>
      </div>
    );
  }

        </nav>

        {/* 移动端菜单 */}
        <div className={`mobile-menu ${mobileOpen ? 'open' : ''}`}>
          <button className="mobile-close" onClick={() => setMobileOpen(false)}>×</button>
          <a onClick={() => scrollTo('story')}>工坊故事</a>
          <a onClick={() => scrollTo('structure')}>伞骨结构</a>
          <a onClick={() => scrollTo('process')}>制作工序</a>
          <a onClick={() => scrollTo('gallery')}>伞面画廊</a>
          <a onClick={() => scrollTo('artisans')}>匠人</a>
          <a onClick={() => scrollTo('booking')}>预约体验</a>
        </div>

        {/* Hero */}
        <section className="hero" id="top">
          <div className="hero-inner">
            <div className="hero-text">
              <div className="hero-eyebrow">非 遗 手 作 · 一 伞 一 世 界</div>
              <h1 className="hero-title">
                伞下<span className="accent">江南</span>
                <br />
                油纸伞工坊
              </h1>
              <p className="hero-sub">
                <Typewriter
                  text="七十二道工序，一把伞的修行。从竹骨到宣纸，从桐油到朱砂，我们用三百年的手艺，为你撑开一方烟雨江南。"
                  speed={55}
                  delay={1200}
                />
              </p>
              <div className="hero-buttons">
                <button className="btn-primary" onClick={() => scrollTo('booking')}>
                  预约手作体验
                </button>
                <button className="btn-ghost" onClick={() => scrollTo('story')}>
                  走进工坊 →
                </button>
              </div>
            </div>
            <HeroUmbrella3D />
          </div>
        </section>

        {/* 数字统计 */}
        <div className="stats-bar">
          <div className="stat-item">
            <div className="stat-num" ref={stat1Ref}>0</div>
            <div className="stat-label">道工序 <span className="unit">每把</span></div>
          </div>
          <div className="stat-item">
            <div className="stat-num" ref={stat2Ref}>0</div>
            <div className="stat-label">年历史 <span className="unit">传承</span></div>
          </div>
          <div className="stat-item">
            <div className="stat-num" ref={stat3Ref}>0</div>
            <div className="stat-label">位匠人 <span className="unit">在册</span></div>
          </div>
          <div className="stat-item">
            <div className="stat-num" ref={stat4Ref}>0</div>
            <div className="stat-label">把伞 <span className="unit">累计出品</span></div>
          </div>
        </div>

        {/* 工坊故事 */}
        <section className="section story-section" id="story">
          <div className="section-head">
            <div className="section-eyebrow reveal">ABOUT US</div>
            <h2 className="section-title reveal reveal-delay-1">工坊故事</h2>
            <p className="section-desc reveal reveal-delay-2">
              三百年风雨，一把伞的传承。从清代的纸伞铺到今日的非遗工坊，变的是岁月，不变的是匠人手中的温度。
            </p>
          </div>
          <div className="story-grid">
            <div className="story-img-wrap reveal" data-interactive>
              <img src={IMAGES.artisan} alt="匠人制伞" />
              <div className="story-seal">匠心</div>
            </div>
            <div className="story-content">
              <h3 className="reveal reveal-delay-1">
                「撑开是江南，合上是风骨」
              </h3>
              <p className="reveal reveal-delay-2">
                伞下江南油纸伞工坊坐落于徽州古城深处的一条老巷里。青石板路尽头，两扇斑驳的木门后，便是这座已有三百年历史的制伞作坊。院子里晒着刚刷过桐油的伞面，空气里弥漫着竹子和桐油的清香。
              </p>
              <div className="quote reveal reveal-delay-3">
                做伞和做人一样，骨要正，面要平，经得住雨，耐得住晒。
                <br />—— 沈伯年
              </div>
              <p className="reveal reveal-delay-4">
                我们坚持全手工制作，从选竹到成品，七十二道工序一道不少。每一把伞都经过匠人数十日的打磨，既是遮风挡雨的实用之物，更是值得收藏的艺术品。我们相信，手作的温度，是机器永远无法复制的。
              </p>
            </div>
          </div>
        </section>

        {/* 伞骨结构 */}
        <section className="section structure-section" id="structure">
          <div className="section-head">
            <div className="section-eyebrow reveal">STRUCTURE</div>
            <h2 className="section-title reveal reveal-delay-1">伞骨结构</h2>
            <p className="section-desc reveal reveal-delay-2">
              一把油纸伞，看似简单，内里却有乾坤。三十二根伞骨如星辰般展开，支撑起一方晴空。
            </p>
          </div>
          <div className="structure-visual reveal">
            <div className="umbrella-3d">
              <div className="umbrella-top-view">
                {[...Array(16)].map((_, i) => (
                  <div
                    key={i}
                    className="rib-radial bamboo-grow"
                    style={{
                      transform: `rotate(${i * 22.5}deg)`,
                      animationDelay: `${i * 0.08}s`,
                    }}
                  />
                ))}
              </div>
            </div>
            <div className="structure-label label-1" data-interactive>
              <span className="dot" /> 伞顶 · 葫芦头
            </div>
            <div className="structure-label label-2" data-interactive>
              <span className="dot" /> 伞骨 · 三十二根
            </div>
            <div className="structure-label label-3" data-interactive>
              <span className="dot" /> 伞面 · 桑皮纸
            </div>
            <div className="structure-label label-4" data-interactive>
              <span className="dot" /> 伞柄 · 实心竹
            </div>
          </div>
        </section>

        {/* 制作工序 */}
        <section className="section process-section" id="process">
          <div className="section-head">
            <div className="section-eyebrow reveal">CRAFTSMANSHIP</div>
            <h2 className="section-title reveal reveal-delay-1">五道大工</h2>
            <p className="section-desc reveal reveal-delay-2">
              选竹·削骨·裱纸·上桐油·绘花——五大工序，每一步都是修行。
            </p>
          </div>
          <div className="process-tabs reveal reveal-delay-3">
            {PROCESS_STEPS.map(step => (
              <button
                key={step.id}
                className={`process-tab ${activeProcess === step.id ? 'active' : ''}`}
                onClick={() => setActiveProcess(step.id)}
              >
                {step.title}
              </button>
            ))}
          </div>
          {currentStep && (
            <div className="process-content fade-in-panel" key={currentStep.id}>
              <div className="process-text">
                <div className="process-step-num">{currentStep.num}</div>
                <h3 className="process-step-title">{currentStep.title}</h3>
                <p className="process-step-desc">{currentStep.desc}</p>
                <div className="process-meta">
                  {currentStep.meta.map((m, i) => (
                    <div className="process-meta-item" key={i}>
                      <div className="m-label">{m.label}</div>
                      <div className="m-value">{m.value}</div>
                    </div>
                  ))}
                </div>
              </div>
              <div className="process-img" data-interactive>
                <img src={currentStep.img} alt={currentStep.title} />
              </div>
            </div>
          )}
        </section>

        {/* 画廊 */}
        <section className="section gallery-section" id="gallery">
          <div className="section-head">
            <div className="section-eyebrow reveal">GALLERY</div>
            <h2 className="section-title reveal reveal-delay-1">伞面画廊</h2>
            <p className="section-desc reveal reveal-delay-2">
              每一把伞，都是独一无二的艺术品。从山水到花鸟，从工笔到写意，尽在一方伞面之上。
            </p>
          </div>
          <div className="gallery-filter reveal reveal-delay-3">
            {[
              { key: 'all', label: '全部' },
              { key: 'collection', label: '藏品' },
              { key: 'design', label: '纹样' },
              { key: 'craft', label: '工艺' },
              { key: 'scene', label: '场景' },
            ].map(f => (
              <button
                key={f.key}
                className={galleryFilter === f.key ? 'active' : ''}
                onClick={() => setGalleryFilter(f.key)}
              >
                {f.label}
              </button>
            ))}
          </div>
          <div className="gallery-grid">
            {filteredGallery.map((item, idx) => (
              <div
                key={item.id}
                className={`gallery-item ${item.className} reveal`}
                style={{ transitionDelay: `${idx * 0.1}s` }}
                data-interactive
              >
                <img src={item.img} alt={item.title} />
                <div className="overlay">
                  <div className="g-title">{item.title}</div>
                  <div className="g-sub">{item.sub}</div>
                </div>
              </div>
            ))}
          </div>
        </section>

        {/* 匠人 */}
        <section className="section artisans-section" id="artisans">
          <div className="section-head">
            <div className="section-eyebrow reveal">ARTISANS</div>
            <h2 className="section-title reveal reveal-delay-1">匠人精神</h2>
            <p className="section-desc reveal reveal-delay-2">
              他们用一生做好一件事——在这个快节奏的时代，守着一方慢工坊。
            </p>
          </div>
          <div className="artisans-grid">
            {ARTISANS.map((a, i) => (
              <div
                key={a.name}
                className={`artisan-card reveal reveal-delay-${i + 1}`}
                data-interactive
              >
                <div className="artisan-img">
                  <img src={a.img} alt={a.name} />
                </div>
                <div className="artisan-info">
                  <h3 className="artisan-name">{a.name}</h3>
                  <div className="artisan-title">{a.title}</div>
                  <p className="artisan-bio">{a.bio}</p>
                  <div className="artisan-skills">
                    {a.skills.map(s => <span key={s}>{s}</span>)}
                  </div>
                </div>
              </div>
            ))}
          </div>
        </section>

        {/* 预约体验 */}
        <section className="booking-section" id="booking" style={{ padding: '120px 0' }}>
          <div className="booking-wrap">
            <div className="booking-left">
              <div className="section-eyebrow" style={{ color: 'var(--amber-light)' }}>BOOKING</div>
              <h2 className="booking-title">预约手作体验</h2>
              <p className="booking-desc">
                来工坊亲手做一把属于自己的油纸伞吧。从选料到成品，全程由大师指导。
                一日匠人，终身难忘。我们相信，最好的故事，是你亲自参与创作的那一个。
              </p>
              <div className="booking-features">
                <div className="booking-feat">
                  <div className="feat-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                      <circle cx="12" cy="12" r="10" />
                      <polyline points="12 6 12 12 16 14" />
                    </svg>
                  </div>
                  <div>
                    <h4>一日制伞体验</h4>
                    <p>从削骨到绘花，大师全程指导，六小时完成专属伞面</p>
                  </div>
                </div>
                <div className="booking-feat">
                  <div className="feat-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                      <path d="M12 2L2 7l10 5 10-5-10-5z" />
                      <path d="M2 17l10 5 10-5" />
                      <path d="M2 12l10 5 10-5" />
                    </svg>
                  </div>
                  <div>
                    <h4>非遗工坊参观</h4>
                    <p>漫步百年老作坊，亲历七十二道工序，与匠人面对面交流</p>
                  </div>
                </div>
                <div className="booking-feat">
                  <div className="feat-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                      <circle cx="12" cy="7" r="4" />
                    </svg>
                  </div>
                  <div>
                    <h4>大师亲传课程</h4>
                    <p>三天系统学习，掌握核心技艺，结业颁发工坊证书</p>
                  </div>
                </div>
              </div>
            </div>
            <div className="booking-form">
              <h3 className="form-title">填写预约信息</h3>
              {formSubmitted ? (
                <div style={{ textAlign: 'center', padding: '40px 20px' }}>
                  <div style={{ fontSize: '48px', marginBottom: '16px' }}>✓</div>
                  <div style={{ fontFamily: "'ZCOOL XiaoWei', serif", fontSize: '22px', color: 'var(--paper)', marginBottom: '8px' }}>预约成功</div>
                  <div style={{ fontSize: '14px', color: 'rgba(245,239,224,0.7)' }}>我们会在 24 小时内与您联系确认</div>
                </div>
              ) : (
                <form onSubmit={handleFormSubmit}>
                  <div className="form-row">
                    <div className="form-group">
                      <label>姓名</label>
                      <input
                        type="text"
                        name="name"
                        value={formData.name}
                        onChange={handleFormChange}
                        placeholder="请输入您的姓名"
                        required
                      />
                    </div>
                    <div className="form-group">
                      <label>联系电话</label>
                      <input
                        type="tel"
                        name="phone"
                        value={formData.phone}
                        onChange={handleFormChange}
                        placeholder="请输入手机号码"
                        required
                      />
                    </div>
                  </div>
                  <div className="form-row">
                    <div className="form-group">
                      <label>到店日期</label>
                      <input
                        type="date"
                        name="date"
                        value={formData.date}
                        onChange={handleFormChange}
                        required
                      />
                    </div>
                    <div className="form-group">
                      <label>体验人数</label>
                      <select name="people" value={formData.people} onChange={handleFormChange}>
                        <option value="1人">1 人</option>
                        <option value="2人">2 人</option>
                        <option value="3-5人">3-5 人</option>
                        <option value="5人以上">5 人以上</option>
                      </select>
                    </div>
                  </div>
                  <div className="form-group">
                    <label>体验项目</label>
                    <select name="experience" value={formData.experience} onChange={handleFormChange}>
                      <option value="full">一日制伞体验（含午餐）</option>
                      <option value="visit">非遗工坊参观</option>
                      <option value="master">大师亲传课程（三天）</option>
                      <option value="custom">定制专属伞（远程）</option>
                    </select>
                  </div>
                  <div className="form-group">
                    <label>备注留言</label>
                    <textarea
                      name="message"
                      value={formData.message}
                      onChange={handleFormChange}
                      placeholder="有什么想告诉我们的，或者特殊的需求……"
                    />
                  </div>
                  <button type="submit" className="form-submit">
                    提 交 预 约
                  </button>
                </form>
              )}
            </div>
          </div>
        </section>

        {/* Footer */}
        <footer className="footer">
          <div className="footer-top">
            <div>
              <div className="footer-brand">
                <div className="seal">伞</div>
                <span>伞下江南</span>
              </div>
              <p className="footer-desc">
                传承三百年油纸伞制作技艺，致力于非遗手工艺的活态传承与创新表达。
                每一把伞，都是一段可以遮风挡雨的故事。
              </p>
            </div>
            <div className="footer-col">
              <h5>探索</h5>
              <ul>
                <li><a onClick={() => scrollTo('story')}>工坊故事</a></li>
                <li><a onClick={() => scrollTo('process')}>制作工序</a></li>
                <li><a onClick={() => scrollTo('gallery')}>伞面画廊</a></li>
                <li><a onClick={() => scrollTo('artisans')}>匠人团队</a></li>
              </ul>
            </div>
            <div className="footer-col">
              <h5>体验</h5>
              <ul>
                <li><a onClick={() => scrollTo('booking')}>一日体验</a></li>
                <li><a onClick={() => scrollTo('booking')}>大师课程</a></li>
                <li><a onClick={() => scrollTo('booking')}>企业定制</a></li>
                <li><a onClick={() => scrollTo('booking')}>礼品合作</a></li>
              </ul>
            </div>
            <div className="footer-col">
              <h5>联系</h5>
              <ul>
                <li>徽州古城·伞巷 18 号</li>
                <li>0559-XXX-XXXX</li>
                <li>hello@sxjn.art</li>
                <li>周二至周日 · 9:00-18:00</li>
              </ul>
            </div>
          </div>
          <div className="footer-bottom">
            <span>© 2026 伞下江南油纸伞工坊 · 国家级非物质文化遗产</span>
            <span>匠心手作 · 每把皆孤品</span>
          </div>
        </footer>

        {/* 回到顶部 */}
        <button
          className={`back-to-top ${backTopVisible ? 'visible' : ''}`}
          onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
          aria-label="回到顶部"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <polyline points="18 15 12 9 6 15" />
          </svg>
        </button>
      </>
    );
  }

  // ========== 渲染 ==========
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);

  // ========== 升级宣告 ==========
  function announceUpgrade() {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  }
  announceUpgrade();
  if (document.readyState !== 'complete') {
    window.addEventListener('load', announceUpgrade, { once: true });
  }
  </script>
</body>
</html>

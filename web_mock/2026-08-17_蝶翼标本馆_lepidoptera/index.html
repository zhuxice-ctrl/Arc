<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>蝶翼标本馆 Lepidoptera · 私人昆虫学收藏</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" />
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg-deep: #14352A;
      --bg-deeper: #0D271F;
      --bg-elev: #1A4033;
      --accent: #E8862E;
      --surface: #F5E6D0;
      --surface-dim: #E8D4B8;
      --gold: #C9A227;
      --gold-soft: rgba(201, 162, 39, 0.35);
      --ink: #0A1F17;
      --ink-soft: #2A4A3E;
      --muted: #6B7F74;
      --cream: #FDF6E9;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: var(--bg-deep);
      color: var(--surface);
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
      scroll-behavior: smooth;
      cursor: none;
    }

    @media (prefers-reduced-motion: reduce) {
      html, body { cursor: auto; }
      * { animation: none !important; transition: none !important; }
    }

    /* Custom cursor */
    .cursor-outer {
      position: fixed;
      top: 0; left: 0;
      width: 44px; height: 44px;
      border: 2px solid #fff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%);
      mix-blend-mode: difference;
      transition: width 0.25s cubic-bezier(.25,.46,.45,.94),
                  height 0.25s cubic-bezier(.25,.46,.45,.94),
                  border-color 0.25s ease,
                  opacity 0.2s ease;
      will-change: transform;
    }
    .cursor-outer.hover {
      width: 64px; height: 64px;
      border-color: var(--accent);
      mix-blend-mode: normal;
      box-shadow: 0 0 20px rgba(232, 134, 46, 0.6),
                  inset 0 0 12px rgba(232, 134, 46, 0.3);
    }
    .cursor-outer.click {
      width: 28px; height: 28px;
      border-color: var(--gold);
    }
    .cursor-inner {
      position: fixed;
      top: 0; left: 0;
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      pointer-events: none;
      z-index: 100000;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px var(--accent), 0 0 16px rgba(232, 134, 46, 0.5);
      transition: background 0.2s ease, width 0.2s ease, height 0.2s ease;
      will-change: transform;
    }
    .cursor-inner.hover {
      width: 4px; height: 4px;
      background: var(--gold);
      box-shadow: 0 0 12px var(--gold);
    }
    .cursor-ripple {
      position: fixed;
      top: 0; left: 0;
      width: 0; height: 0;
      border: 1px solid var(--gold);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99998;
      transform: translate(-50%, -50%);
      animation: cursorRipple 0.6s ease-out forwards;
    }
    @keyframes cursorRipple {
      0% { width: 0; height: 0; opacity: 1; }
      100% { width: 80px; height: 80px; opacity: 0; }
    }

    a, button, [role="button"] { cursor: none; }
    @media (prefers-reduced-motion: reduce) {
      a, button, [role="button"] { cursor: pointer; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-deeper); }
    ::-webkit-scrollbar-thumb { background: var(--gold-soft); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

    /* Navigation */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      padding: 20px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(13,39,31,0.9) 0%, rgba(13,39,31,0) 100%);
      backdrop-filter: blur(0px);
      transition: all 0.4s cubic-bezier(.25,.46,.45,.94);
    }
    .nav.scrolled {
      padding: 14px 48px;
      background: rgba(13, 39, 31, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(201, 162, 39, 0.15);
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Noto Serif SC', serif;
      font-weight: 700;
      font-size: 18px;
      color: var(--surface);
      letter-spacing: 2px;
    }
    .nav-logo-mark {
      width: 32px; height: 32px;
      position: relative;
    }
    .nav-links {
      display: flex;
      gap: 36px;
      list-style: none;
    }
    .nav-links a {
      color: var(--surface-dim);
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 1px;
      font-weight: 400;
      position: relative;
      padding: 4px 0;
      transition: color 0.3s ease;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      left: 0; bottom: 0;
      width: 0; height: 1px;
      background: var(--accent);
      transition: width 0.35s cubic-bezier(.25,.46,.45,.94);
    }
    .nav-links a:hover { color: var(--surface); }
    .nav-links a:hover::after { width: 100%; }
    .nav-cta {
      padding: 10px 24px;
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: 400;
      position: relative;
      overflow: hidden;
      transition: color 0.3s ease;
    }
    .nav-cta::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: var(--gold);
      transition: left 0.4s cubic-bezier(.25,.46,.45,.94);
      z-index: -1;
    }
    .nav-cta:hover { color: var(--ink); }
    .nav-cta:hover::before { left: 0; }

    /* Hero section */
    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 40%, #1A4033 0%, #0D271F 60%, #071812 100%);
    }
    .hero-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .hero-particle {
      position: absolute;
      background: var(--gold);
      border-radius: 50%;
      opacity: 0;
      box-shadow: 0 0 6px var(--gold);
    }
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 0 24px;
      max-width: 900px;
    }
    .hero-eyebrow {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 18px;
      color: var(--gold);
      letter-spacing: 4px;
      margin-bottom: 24px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s 0.3s cubic-bezier(.25,.46,.45,.94) forwards;
    }
    .hero-title {
      font-family: 'Noto Serif SC', serif;
      font-weight: 900;
      font-size: clamp(48px, 8vw, 120px);
      line-height: 1.1;
      color: var(--surface);
      letter-spacing: 8px;
      margin-bottom: 20px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 1.2s 0.5s cubic-bezier(.25,.46,.45,.94) forwards;
    }
    .hero-title .hl {
      color: var(--accent);
      position: relative;
      display: inline-block;
    }
    .hero-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 24px;
      color: var(--surface-dim);
      letter-spacing: 2px;
      margin-bottom: 48px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s 0.8s cubic-bezier(.25,.46,.45,.94) forwards;
    }
    .hero-typewriter {
      font-size: 16px;
      color: var(--surface-dim);
      letter-spacing: 3px;
      margin-bottom: 56px;
      height: 24px;
      opacity: 0;
      animation: fadeIn 1s 1.2s ease forwards;
    }
    .hero-typewriter .caret {
      display: inline-block;
      width: 2px;
      height: 18px;
      background: var(--accent);
      margin-left: 4px;
      vertical-align: middle;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .hero-scroll {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 3px;
      opacity: 0;
      animation: fadeIn 1s 1.8s ease forwards;
    }
    .hero-scroll-line {
      width: 1px;
      height: 50px;
      background: linear-gradient(180deg, var(--gold) 0%, transparent 100%);
      animation: scrollLine 2s ease-in-out infinite;
    }
    @keyframes scrollLine {
      0%, 100% { transform: scaleY(1); transform-origin: top; opacity: 1; }
      50% { transform: scaleY(0.3); transform-origin: top; opacity: 0.4; }
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* Hero butterfly wings animation */
    .hero-butterfly {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 400px;
      pointer-events: none;
      z-index: 1;
    }
    .hero-butterfly svg {
      width: 100%;
      height: 100%;
    }
    .wing-left, .wing-right {
      transform-origin: center;
      animation: wingFlap 4.2s ease-in-out infinite;
    }
    .wing-right { animation-delay: 0s; }
    .wing-left { animation-delay: 0s; animation-direction: reverse; }
    @keyframes wingFlap {
      0%, 100% { transform: scaleX(1); }
      50% { transform: scaleX(0.85); }
    }

    /* Section base */
    .section {
      padding: 120px 48px;
      position: relative;
    }
    .section-inner {
      max-width: 1280px;
      margin: 0 auto;
    }
    .section-label {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 16px;
      color: var(--gold);
      letter-spacing: 3px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .section-label::before {
      content: '';
      width: 40px;
      height: 1px;
      background: var(--gold);
    }
    .section-title {
      font-family: 'Noto Serif SC', serif;
      font-weight: 700;
      font-size: clamp(32px, 4vw, 56px);
      color: var(--surface);
      line-height: 1.2;
      margin-bottom: 20px;
    }
    .section-desc {
      font-size: 16px;
      color: var(--surface-dim);
      line-height: 1.8;
      max-width: 560px;
      margin-bottom: 60px;
    }

    /* Stats bar */
    .stats {
      background: var(--bg-deeper);
      padding: 80px 48px;
      border-top: 1px solid rgba(201, 162, 39, 0.1);
      border-bottom: 1px solid rgba(201, 162, 39, 0.1);
    }
    .stats-grid {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 40px;
      text-align: center;
    }
    .stat-num {
      font-family: 'Noto Serif SC', serif;
      font-size: 56px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 12px;
    }
    .stat-label {
      font-size: 14px;
      color: var(--surface-dim);
      letter-spacing: 2px;
    }
    .stat-divider {
      width: 30px;
      height: 1px;
      background: var(--gold-soft);
      margin: 0 auto 12px;
    }

    /* Collection gallery */
    .collection {
      background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-deeper) 100%);
    }
    .collection-filter {
      display: flex;
      gap: 12px;
      margin-bottom: 48px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 10px 22px;
      background: transparent;
      border: 1px solid rgba(245, 230, 208, 0.2);
      color: var(--surface-dim);
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 13px;
      letter-spacing: 1px;
      font-weight: 400;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .filter-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.35s cubic-bezier(.25,.46,.45,.94);
      z-index: -1;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--surface); }
    .filter-btn.active {
      background: var(--accent);
      color: var(--ink);
      border-color: var(--accent);
      font-weight: 500;
    }
    .collection-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
    }
    .specimen-card {
      position: relative;
      aspect-ratio: 4/3;
      background: var(--bg-elev);
      overflow: hidden;
      border: 1px solid rgba(201, 162, 39, 0.12);
      transition: border-color 0.4s ease, transform 0.4s cubic-bezier(.25,.46,.45,.94);
      transform-style: preserve-3d;
      perspective: 1000px;
    }
    .specimen-card:hover {
      border-color: var(--gold-soft);
    }
    .specimen-card-img {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .specimen-card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(.25,.46,.45,.94);
      filter: saturate(0.9) brightness(0.95);
    }
    .specimen-card:hover .specimen-card-img img {
      transform: scale(1.06);
      filter: saturate(1.1) brightness(1.05);
    }
    .specimen-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(13,39,31,0.95) 100%);
      pointer-events: none;
    }
    .specimen-card-info {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 28px 24px 24px;
      transform: translateY(8px);
      transition: transform 0.4s cubic-bezier(.25,.46,.45,.94);
    }
    .specimen-card:hover .specimen-card-info {
      transform: translateY(0);
    }
    .specimen-order {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 13px;
      color: var(--gold);
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .specimen-name {
      font-family: 'Noto Serif SC', serif;
      font-weight: 700;
      font-size: 22px;
      color: var(--surface);
      margin-bottom: 4px;
    }
    .specimen-latin {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 14px;
      color: var(--surface-dim);
      margin-bottom: 12px;
    }
    .specimen-meta {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.5px;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: all 0.4s 0.1s cubic-bezier(.25,.46,.45,.94);
    }
    .specimen-card:hover .specimen-meta {
      opacity: 1;
      max-height: 40px;
    }
    .specimen-shine {
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      transform: skewX(-20deg);
      transition: left 0.8s ease;
      pointer-events: none;
    }
    .specimen-card:hover .specimen-shine {
      left: 150%;
    }
    .specimen-pin {
      position: absolute;
      top: 12px; right: 12px;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px var(--gold), 0 1px 2px rgba(0,0,0,0.5);
      z-index: 3;
    }
    .specimen-frame-num {
      position: absolute;
      top: 16px; left: 16px;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 14px;
      color: var(--gold);
      z-index: 3;
    }

    /* Exhibition halls section */
    .exhibition {
      background: var(--bg-deeper);
    }
    .exhibit-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 48px;
      border-bottom: 1px solid rgba(201, 162, 39, 0.15);
    }
    .exhibit-tab {
      padding: 16px 28px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 1px;
      position: relative;
      transition: color 0.3s ease;
      cursor: none;
    }
    .exhibit-tab::after {
      content: '';
      position: absolute;
      left: 0; bottom: -1px;
      width: 100%; height: 2px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.4s cubic-bezier(.25,.46,.45,.94);
    }
    .exhibit-tab:hover { color: var(--surface-dim); }
    .exhibit-tab.active { color: var(--surface); font-weight: 500; }
    .exhibit-tab.active::after { transform: scaleX(1); }

    .exhibit-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }
    .exhibit-image {
      position: relative;
      aspect-ratio: 4/3;
      overflow: hidden;
      border: 1px solid rgba(201, 162, 39, 0.2);
    }
    .exhibit-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.8s cubic-bezier(.25,.46,.45,.94);
    }
    .exhibit-image:hover img {
      transform: scale(1.04);
    }
    .exhibit-image::before {
      content: '';
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(201, 162, 39, 0.3);
      z-index: 2;
      pointer-events: none;
    }
    .exhibit-text h3 {
      font-family: 'Noto Serif SC', serif;
      font-size: 36px;
      font-weight: 700;
      color: var(--surface);
      margin-bottom: 16px;
    }
    .exhibit-text .exhibit-sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: var(--gold);
      font-size: 18px;
      letter-spacing: 2px;
      margin-bottom: 24px;
    }
    .exhibit-text p {
      font-size: 15px;
      line-height: 2;
      color: var(--surface-dim);
      margin-bottom: 20px;
    }
    .exhibit-features {
      list-style: none;
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .exhibit-features li {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 14px;
      color: var(--surface-dim);
    }
    .exhibit-features li::before {
      content: '';
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Entomologist journal */
    .journal {
      background: var(--bg-deep);
      background-image:
        radial-gradient(ellipse at top right, rgba(201, 162, 39, 0.05) 0%, transparent 50%),
        radial-gradient(ellipse at bottom left, rgba(232, 134, 46, 0.04) 0%, transparent 50%);
    }
    .journal-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
    }
    .journal-card {
      background: var(--bg-elev);
      border: 1px solid rgba(201, 162, 39, 0.1);
      padding: 36px 32px;
      position: relative;
      transition: all 0.4s cubic-bezier(.25,.46,.45,.94);
      overflow: hidden;
    }
    .journal-card:hover {
      border-color: rgba(201, 162, 39, 0.3);
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .journal-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--gold));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.5s cubic-bezier(.25,.46,.45,.94);
    }
    .journal-card:hover::before { transform: scaleX(1); }
    .journal-date {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 14px;
      color: var(--gold);
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    .journal-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--surface);
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .journal-excerpt {
      font-size: 14px;
      color: var(--surface-dim);
      line-height: 1.9;
      margin-bottom: 24px;
    }
    .journal-author {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-top: 20px;
      border-top: 1px solid rgba(201, 162, 39, 0.1);
    }
    .journal-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--gold));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Serif SC', serif;
      font-weight: 700;

    // ========== Custom Cursor ==========
    function useCustomCursor() {
      const outerRef = useRef(null);
      const innerRef = useRef(null);
      const posRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
      const targetRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
      const hoverRef = useRef(false);
      const rafRef = useRef(null);
      const visibleRef = useRef(true);
      const ripplesRef = useRef([]);

      useEffect(() => {
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced) return;

        const lerp = (a, b, t) => a + (b - a) * t;

        const animate = () => {
          if (!visibleRef.current) {
            rafRef.current = requestAnimationFrame(animate);
            return;
          }
          posRef.current.x = lerp(posRef.current.x, targetRef.current.x, 0.18);
          posRef.current.y = lerp(posRef.current.y, targetRef.current.y, 0.18);

          if (outerRef.current) {
            outerRef.current.style.transform = `translate(${posRef.current.x}px, ${posRef.current.y}px) translate(-50%, -50%)`;
          }
          if (innerRef.current) {
            innerRef.current.style.transform = `translate(${targetRef.current.x}px, ${targetRef.current.y}px) translate(-50%, -50%)`;
          }
          rafRef.current = requestAnimationFrame(animate);
        };

        const onMove = (e) => {
          targetRef.current.x = e.clientX;
          targetRef.current.y = e.clientY;
        };

        const onOver = (e) => {
          const t = e.target;
          if (t.closest('a, button, [role="button"], .specimen-card, .journal-card, .filter-btn, .exhibit-tab, input, select, textarea, .nav-cta, .booking-submit')) {
            hoverRef.current = true;
            if (outerRef.current) outerRef.current.classList.add('hover');
            if (innerRef.current) innerRef.current.classList.add('hover');
          }
        };

        const onOut = (e) => {
          const t = e.target;
          if (t.closest('a, button, [role="button"], .specimen-card, .journal-card, .filter-btn, .exhibit-tab, input, select, textarea, .nav-cta, .booking-submit')) {
            hoverRef.current = false;
            if (outerRef.current) outerRef.current.classList.remove('hover');
            if (innerRef.current) innerRef.current.classList.remove('hover');
          }
        };

        const onClick = (e) => {
          if (outerRef.current) {
            outerRef.current.classList.add('click');
            setTimeout(() => outerRef.current && outerRef.current.classList.remove('click'), 150);
          }
          // Create ripple
          const ripple = document.createElement('div');
          ripple.className = 'cursor-ripple';
          ripple.style.left = e.clientX + 'px';
          ripple.style.top = e.clientY + 'px';
          document.body.appendChild(ripple);
          ripplesRef.current.push(ripple);
          setTimeout(() => {
            ripple.remove();
            ripplesRef.current = ripplesRef.current.filter(r => r !== ripple);
          }, 600);
        };

        const onVisibility = () => {
          visibleRef.current = !document.hidden;
        };

        window.addEventListener('mousemove', onMove);
        document.addEventListener('mouseover', onOver);
        document.addEventListener('mouseout', onOut);
        document.addEventListener('click', onClick);
        document.addEventListener('visibilitychange', onVisibility);

        rafRef.current = requestAnimationFrame(animate);

        return () => {
          cancelAnimationFrame(rafRef.current);
          window.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseover', onOver);
          document.removeEventListener('mouseout', onOut);
          document.removeEventListener('click', onClick);
          document.removeEventListener('visibilitychange', onVisibility);
          ripplesRef.current.forEach(r => r.remove());
          ripplesRef.current = [];
        };
      }, []);

      return { outerRef, innerRef };
    }

    // ========== Particles ==========
    function useParticles(containerRef, count = 30) {
      useEffect(() => {
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced) return;
        const container = containerRef.current;
        if (!container) return;

        const particles = [];
        let rafId = null;
        let visible = true;

        for (let i = 0; i < count; i++) {
          const p = document.createElement('div');
          p.className = 'hero-particle';
          const size = Math.random() * 3 + 1;
          p.style.width = size + 'px';
          p.style.height = size + 'px';
          p.style.left = Math.random() * 100 + '%';
          p.style.top = Math.random() * 100 + '%';
          container.appendChild(p);
          particles.push({
            el: p,
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            vx: (Math.random() - 0.5) * 0.3,
            vy: (Math.random() - 0.5) * 0.3,
            baseOpacity: Math.random() * 0.5 + 0.2,
            phase: Math.random() * Math.PI * 2,
            speed: Math.random() * 0.02 + 0.005
          });
        }

        const animate = () => {
          if (!visible) {
            rafId = requestAnimationFrame(animate);
            return;
          }
          const time = Date.now() * 0.001;
          particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0) p.x = window.innerWidth;
            if (p.x > window.innerWidth) p.x = 0;
            if (p.y < 0) p.y = window.innerHeight;
            if (p.y > window.innerHeight) p.y = 0;
            const opacity = p.baseOpacity * (0.5 + 0.5 * Math.sin(time * p.speed * 100 + p.phase));
            p.el.style.opacity = opacity;
            p.el.style.left = p.x + 'px';
            p.el.style.top = p.y + 'px';
          });
          rafId = requestAnimationFrame(animate);
        };

        const onVisibility = () => { visible = !document.hidden; };
        document.addEventListener('visibilitychange', onVisibility);

        rafId = requestAnimationFrame(animate);

        return () => {
          cancelAnimationFrame(rafId);
          document.removeEventListener('visibilitychange', onVisibility);
          particles.forEach(p => p.el.remove());
        };
      }, [containerRef, count]);
    }

    // ========== Scroll reveal ==========
    function useScrollReveal() {
      useEffect(() => {
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced) {
          document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
          return;
        }
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        return () => observer.disconnect();
      }, []);
    }

    // ========== Nav scroll ==========
    function useNavScroll() {
      const [scrolled, setScrolled] = useState(false);
      useEffect(() => {
        const onScroll = () => {
          setScrolled(window.scrollY > 50);
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      return scrolled;
    }

    // ========== Typewriter ==========
    function useTypewriter(words, speed = 80, pause = 2000) {
      const [text, setText] = useState('');
      const [wordIdx, setWordIdx] = useState(0);
      const [deleting, setDeleting] = useState(false);
      const timerRef = useRef(null);
      const visibleRef = useRef(true);

      useEffect(() => {
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced) {
          setText(words[0]);
          return;
        }

        const tick = () => {
          if (!visibleRef.current) {
            timerRef.current = setTimeout(tick, 500);
            return;
          }
          const current = words[wordIdx % words.length];

          if (!deleting) {
            const next = current.slice(0, text.length + 1);
            setText(next);
            if (next === current) {
              setDeleting(true);
              timerRef.current = setTimeout(tick, pause);
              return;
            }
            timerRef.current = setTimeout(tick, speed);
          } else {
            const next = current.slice(0, text.length - 1);
            setText(next);
            if (next === '') {
              setDeleting(false);
              setWordIdx(w => (w + 1) % words.length);
              timerRef.current = setTimeout(tick, 400);
              return;
            }
            timerRef.current = setTimeout(tick, speed / 2);
          }
        };

        timerRef.current = setTimeout(tick, 500);

        const onVis = () => { visibleRef.current = !document.hidden; };
        document.addEventListener('visibilitychange', onVis);

        return () => {
          clearTimeout(timerRef.current);
          document.removeEventListener('visibilitychange', onVis);
        };
      }, [text, deleting, wordIdx, words, speed, pause]);

      return text;
    }

    // ========== Counter animation ==========
    function useCounter(target, duration = 2000, triggerRef) {
      const [value, setValue] = useState(0);
      const startedRef = useRef(false);
      const rafRef = useRef(null);
      const startTimeRef = useRef(null);

      useEffect(() => {
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced) {
          setValue(target);
          return;
        }

        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting && !startedRef.current) {
              startedRef.current = true;
              startTimeRef.current = performance.now();
              const step = (now) => {
                if (document.hidden) {
                  rafRef.current = requestAnimationFrame(step);
                  return;
                }
                const progress = Math.min((now - startTimeRef.current) / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                setValue(Math.floor(eased * target));
                if (progress < 1) {
                  rafRef.current = requestAnimationFrame(step);
                }
              };
              rafRef.current = requestAnimationFrame(step);
            }
          });
        }, { threshold: 0.5 });

        if (triggerRef.current) observer.observe(triggerRef.current);

        return () => {
          observer.disconnect();
          cancelAnimationFrame(rafRef.current);
        };
      }, [target, duration, triggerRef]);

      return value;
    }

    // ========== 3D Tilt Card (direct DOM) ==========
    function useTiltCard(cardRef, intensity = 12) {
      useEffect(() => {
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced) return;
        const card = cardRef.current;
        if (!card) return;

        let rafId = null;
        let targetRotX = 0, targetRotY = 0;
        let currentRotX = 0, currentRotY = 0;

        const lerp = (a, b, t) => a + (b - a) * t;

        const animate = () => {
          currentRotX = lerp(currentRotX, targetRotX, 0.1);
          currentRotY = lerp(currentRotY, targetRotY, 0.1);
          card.style.transform = `perspective(1000px) rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
          rafId = requestAnimationFrame(animate);
        };

        const onMove = (e) => {
          const rect = card.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width - 0.5;
          const y = (e.clientY - rect.top) / rect.height - 0.5;
          targetRotX = -y * intensity;
          targetRotY = x * intensity;
        };

        const onLeave = () => {
          targetRotX = 0;
          targetRotY = 0;
        };

        card.addEventListener('mousemove', onMove);
        card.addEventListener('mouseleave', onLeave);
        rafId = requestAnimationFrame(animate);

        return () => {
          cancelAnimationFrame(rafId);
          card.removeEventListener('mousemove', onMove);
          card.removeEventListener('mouseleave', onLeave);
        };
      }, [cardRef, intensity]);
    }

          <div className="specimen-card-overlay" />
          <div className="specimen-card-info">
            <div className="specimen-order">{specimen.category}</div>
            <div className="specimen-name">{specimen.name}</div>
            <div className="specimen-latin">{specimen.latin}</div>
            <div className="specimen-meta">
              <span>产地 · {specimen.origin}</span>
              <span>展弦 · {specimen.wingspan}</span>
            </div>
          </div>
        </div>
      );
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Announce upgrade capability
    function announceUpgrade() {
      window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    }
    announceUpgrade();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announceUpgrade, { once: true });
    }
  </script>
</body>
</html>

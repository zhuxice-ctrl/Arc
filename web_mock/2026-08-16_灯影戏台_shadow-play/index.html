<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>灯影戏台 · 皮影戏数字剧院</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=ZCOOL+XiaoWei&family=JetBrains+Mono:wght@400;500&display=swap" />
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  :root{
    --ink: #14100C;
    --ink-soft: #1C1611;
    --ink-2: #261E17;
    --cinnabar: #C93B2E;
    --cinnabar-soft: #E05A4D;
    --gold: #E8B84B;
    --gold-soft: #F0CE7A;
    --rice: #F3E9D2;
    --rice-soft: #E8DCC0;
    --smoke: rgba(243,233,210,0.06);
    --shadow-base: 0 40px 80px -20px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--rice);font-family:"Noto Serif SC",serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;cursor:none}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;border:none;background:none;color:inherit;cursor:none}
  ::selection{background:var(--cinnabar);color:var(--rice)}

  /* ============== CUSTOM CURSOR ============== */
  .cursor-layer{position:fixed;inset:0;pointer-events:none;z-index:9999;mix-blend-mode:normal}
  .cursor-ring{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(232,184,75,0.4),0 0 18px rgba(232,184,75,0.6),0 0 40px rgba(201,59,46,0.3);transition:width .25s cubic-bezier(.2,.8,.2,1),height .25s cubic-bezier(.2,.8,.2,1),margin .25s cubic-bezier(.2,.8,.2,1),border-color .2s}
  .cursor-ring.hover{width:60px;height:60px;margin:-30px 0 0 -30px;border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,184,75,0.6),0 0 24px rgba(232,184,75,0.8),0 0 60px rgba(201,59,46,0.5)}
  .cursor-ring.down{width:28px;height:28px;margin:-14px 0 0 -14px}
  .cursor-dot{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--cinnabar);box-shadow:0 0 10px var(--cinnabar-soft),0 0 20px var(--cinnabar)}
  .cursor-ring.hover .cursor-dot{background:var(--gold);box-shadow:0 0 10px var(--gold)}
  .cursor-ripple{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border:1.5px solid var(--gold);border-radius:50%;opacity:0;pointer-events:none}
  @keyframes cursorRipple{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(8)}}

  /* ============== LAYOUT ============== */
  .stage{position:relative;min-height:100vh;width:100%}
  .noise::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95  0 0 0 0 0.9  0 0 0 0 0.75  0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");opacity:.55;mix-blend-mode:overlay}

  /* ============== NAV ============== */
  nav.topnav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:22px 48px;backdrop-filter:blur(8px);background:linear-gradient(to bottom,rgba(20,16,12,0.8),rgba(20,16,12,0))}
  .brand{display:flex;align-items:center;gap:14px}
  .brand-seal{width:40px;height:40px;border:1.5px solid var(--gold);border-radius:4px;display:grid;place-items:center;font-family:"ZCOOL XiaoWei",serif;color:var(--gold);font-size:18px;letter-spacing:1px;position:relative;overflow:hidden;transition:all .4s}
  .brand-seal::after{content:"";position:absolute;inset:0;background:var(--cinnabar);transform:translateX(-101%);transition:transform .5s cubic-bezier(.77,0,.175,1)}
  .brand-seal:hover::after{transform:translateX(0)}
  .brand-seal:hover{color:var(--rice);border-color:var(--cinnabar)}
  .brand-seal span{position:relative;z-index:1}
  .brand-text{display:flex;flex-direction:column;line-height:1.1}
  .brand-cn{font-family:"ZCOOL XiaoWei",serif;font-size:20px;color:var(--rice);letter-spacing:4px}
  .brand-en{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--gold);letter-spacing:2px;margin-top:2px}
  .nav-links{display:flex;gap:36px;align-items:center}
  .nav-links a{font-size:14px;letter-spacing:2px;position:relative;padding:6px 0;color:var(--rice-soft);transition:color .3s}
  .nav-links a::after{content:"";position:absolute;left:50%;bottom:0;width:0;height:1px;background:var(--gold);transition:all .3s cubic-bezier(.2,.8,.2,1)}
  .nav-links a:hover{color:var(--gold)}
  .nav-links a:hover::after{width:100%;left:0}
  .nav-cta{padding:10px 22px;border:1px solid var(--gold);color:var(--gold);font-size:12px;letter-spacing:3px;position:relative;overflow:hidden;transition:all .4s cubic-bezier(.2,.8,.2,1)}
  .nav-cta::before{content:"";position:absolute;inset:0;background:var(--gold);transform:translateY(101%);transition:transform .4s cubic-bezier(.77,0,.175,1)}
  .nav-cta:hover{color:var(--ink)}
  .nav-cta:hover::before{transform:translateY(0)}
  .nav-cta span{position:relative;z-index:1}

  /* ============== HERO / CURTAIN ============== */
  .hero{position:relative;min-height:100vh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:var(--ink)}
  .curtain-fabric{position:absolute;inset:0;pointer-events:none}
  .curtain-left,.curtain-right{position:absolute;top:0;bottom:0;width:52%;background:linear-gradient(to right,var(--ink) 0%,#1a130d 40%,#231911 70%,#1a130d 100%);z-index:3;transition:transform 1.6s cubic-bezier(.77,0,.175,1)}
  .curtain-left{left:0;box-shadow:inset -40px 0 80px -20px rgba(0,0,0,0.8);transform:translateX(0)}
  .curtain-right{right:0;box-shadow:inset 40px 0 80px -20px rgba(0,0,0,0.8);transform:translateX(0)}
  .curtain-left.open{transform:translateX(-100%)}
  .curtain-right.open{transform:translateX(100%)}
  .curtain-pleats{position:absolute;top:0;bottom:0;width:100%;background-image:repeating-linear-gradient(to right,transparent 0px,rgba(201,59,46,0.08) 2px,transparent 4px,transparent 60px)}
  .stage-light{position:absolute;top:-30%;left:50%;width:140%;height:160%;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 20%, rgba(232,184,75,0.18) 0%, rgba(232,184,75,0.06) 30%, transparent 60%);pointer-events:none;z-index:2;animation:lightBreath 6s ease-in-out infinite}
  @keyframes lightBreath{0%,100%{opacity:.8;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.05)}}

  .hero-content{position:relative;z-index:4;text-align:center;padding:0 24px}
  .hero-eyebrow{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:6px;color:var(--gold);margin-bottom:32px;opacity:0;transform:translateY(20px);animation:fadeUp 1s .3s forwards}
  .hero-title{font-family:"ZCOOL XiaoWei",serif;font-size:clamp(72px,12vw,180px);line-height:1;color:var(--rice);letter-spacing:16px;margin-bottom:24px;opacity:0;transform:translateY(40px);animation:fadeUp 1.2s .5s forwards;text-shadow:0 0 60px rgba(232,184,75,0.3)}
  .hero-sub{font-size:18px;letter-spacing:8px;color:var(--rice-soft);margin-bottom:48px;opacity:0;transform:translateY(20px);animation:fadeUp 1s .8s forwards}
  .hero-cta-row{display:flex;gap:20px;justify-content:center;opacity:0;transform:translateY(20px);animation:fadeUp 1s 1.1s forwards}
  @keyframes fadeUp{to{opacity:1;transform:translateY(0)}}

  .btn-primary{position:relative;padding:16px 36px;background:var(--cinnabar);color:var(--rice);font-size:14px;letter-spacing:4px;overflow:hidden;transition:all .4s cubic-bezier(.2,.8,.2,1);border:1px solid var(--cinnabar)}
  .btn-primary::after{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);transition:left .6s}
  .btn-primary:hover{background:var(--cinnabar-soft);transform:translateY(-2px);box-shadow:0 20px 40px -10px rgba(201,59,46,0.5)}
  .btn-primary:hover::after{left:100%}
  .btn-ghost{position:relative;padding:16px 36px;border:1px solid var(--gold);color:var(--gold);font-size:14px;letter-spacing:4px;overflow:hidden;transition:all .4s}
  .btn-ghost:hover{background:var(--gold);color:var(--ink);box-shadow:0 20px 40px -10px rgba(232,184,75,0.4)}

  .scroll-hint{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;animation:fadeUp 1s 1.4s forwards}
  .scroll-hint span{font-size:11px;letter-spacing:4px;color:var(--rice-soft);font-family:"JetBrains Mono",monospace}
  .scroll-line{width:1px;height:40px;background:linear-gradient(to bottom,var(--gold),transparent);position:relative;overflow:hidden}
  .scroll-line::after{content:"";position:absolute;top:-100%;left:0;width:100%;height:50%;background:var(--gold);animation:scrollDown 2s ease-in-out infinite}
  @keyframes scrollDown{0%{top:-50%}100%{top:110%}}

  /* Hero puppet silhouette */
  .hero-puppets{position:absolute;bottom:0;left:0;right:0;height:70%;z-index:3;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 5%}
  .hero-puppet{height:85%;filter:drop-shadow(0 20px 40px rgba(0,0,0,0.8));opacity:.85;will-change:transform;transition:transform .1s linear}
  .hero-puppet.center{height:100%;opacity:1}
  .hero-puppet img{height:100%;object-fit:contain;mix-blend-mode:luminosity;filter:brightness(0.8) sepia(0.5) saturate(2) hue-rotate(-10deg)}

  /* ============== SECTION BASE ============== */
  section{position:relative;padding:140px 80px;overflow:hidden}
  .section-label{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:14px}
  .section-label::before{content:"";width:40px;height:1px;background:var(--gold)}
  .section-title{font-family:"ZCOOL XiaoWei",serif;font-size:clamp(40px,5vw,72px);letter-spacing:8px;color:var(--rice);margin-bottom:20px;line-height:1.1}
  .section-desc{font-size:16px;line-height:1.9;color:var(--rice-soft);max-width:560px;letter-spacing:1px}
  .section-header{margin-bottom:80px}

  .reveal{opacity:0;transform:translateY(40px);transition:opacity 1s cubic-bezier(.2,.8,.2,1),transform 1s cubic-bezier(.2,.8,.2,1)}
  .reveal.in{opacity:1;transform:translateY(0)}

  /* ============== SHOWS ============== */
  .shows{background:var(--ink-soft)}
  .shows-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;perspective:1200px}
  .show-card{position:relative;background:var(--ink-2);border:1px solid rgba(232,184,75,0.15);padding:32px;height:480px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transform-style:preserve-3d;transition:border-color .4s,box-shadow .4s;will-change:transform}
  .show-card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(232,184,75,0.12),transparent 60%);opacity:0;transition:opacity .4s;pointer-events:none}
  .show-card:hover{border-color:rgba(232,184,75,0.5);box-shadow:0 30px 60px -20px rgba(0,0,0,0.8)}
  .show-card:hover::before{opacity:1}
  .show-num{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--cinnabar);letter-spacing:3px;margin-bottom:24px}
  .show-title{font-family:"ZCOOL XiaoWei",serif;font-size:32px;letter-spacing:4px;color:var(--rice);margin-bottom:12px;line-height:1.2}
  .show-subtitle{font-size:13px;color:var(--gold);letter-spacing:2px;margin-bottom:20px}
  .show-desc{font-size:14px;line-height:1.9;color:var(--rice-soft);opacity:.8}
  .show-puppet{position:absolute;right:-20px;bottom:0;height:65%;opacity:.15;transition:opacity .4s,transform .4s}
  .show-card:hover .show-puppet{opacity:.35;transform:translateX(-10px) rotate(-2deg)}
  .show-puppet img{height:100%;object-fit:contain;filter:brightness(0.5) sepia(1) saturate(5) hue-rotate(-20deg)}
  .show-meta{display:flex;gap:24px;margin-top:24px;padding-top:24px;border-top:1px solid rgba(232,184,75,0.1)}
  .show-meta div{display:flex;flex-direction:column;gap:4px}
  .show-meta strong{font-size:14px;color:var(--rice);font-weight:600}
  .show-meta span{font-size:11px;color:var(--rice-soft);letter-spacing:2px;opacity:.7;font-family:"JetBrains Mono",monospace}
  .show-tag{display:inline-block;padding:4px 12px;border:1px solid var(--cinnabar);color:var(--cinnabar);font-size:11px;letter-spacing:2px;margin-bottom:16px;align-self:flex-start}

  /* ============== PUPPET GALLERY ============== */
  .gallery{background:var(--ink)}
  .gallery-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:80px}
  .gallery-tabs{display:flex;gap:12px}
  .gal-tab{padding:10px 20px;border:1px solid rgba(243,233,210,0.2);font-size:13px;letter-spacing:2px;color:var(--rice-soft);transition:all .3s}
  .gal-tab.active{border-color:var(--gold);color:var(--gold);background:rgba(232,184,75,0.08)}
  .gal-tab:hover:not(.active){border-color:var(--rice-soft);color:var(--rice)}

  .gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
  .puppet-card{position:relative;aspect-ratio:2/3;background:linear-gradient(180deg,var(--ink-2),var(--ink-soft));border:1px solid rgba(232,184,75,0.1);overflow:hidden;transition:all .5s cubic-bezier(.2,.8,.2,1)}
  .puppet-card:hover{transform:translateY(-8px);border-color:rgba(232,184,75,0.4);box-shadow:0 40px 80px -20px rgba(0,0,0,0.7)}
  .puppet-card-img{position:absolute;inset:0;display:grid;place-items:center;padding:20% 10% 10%}
  .puppet-card-img img{height:100%;object-fit:contain;filter:brightness(0.4) sepia(1) saturate(3) hue-rotate(-15deg);transition:all .6s cubic-bezier(.2,.8,.2,1)}
  .puppet-card:hover .puppet-card-img img{filter:brightness(0.7) sepia(0.5) saturate(4) hue-rotate(-5deg);transform:scale(1.08)}
  .puppet-card-light{position:absolute;top:0;left:50%;transform:translateX(-50%);width:80%;height:50%;background:radial-gradient(ellipse at top,rgba(232,184,75,0.15),transparent 70%);pointer-events:none}
  .puppet-card-info{position:absolute;bottom:0;left:0;right:0;padding:20px;background:linear-gradient(to top,rgba(20,16,12,0.95),transparent);transform:translateY(20px);opacity:.7;transition:all .4s}
  .puppet-card:hover .puppet-card-info{transform:translateY(0);opacity:1}
  .puppet-card-info h4{font-family:"ZCOOL XiaoWei",serif;font-size:20px;letter-spacing:3px;color:var(--rice);margin-bottom:4px}
  .puppet-card-info p{font-size:11px;color:var(--gold);letter-spacing:2px;font-family:"JetBrains Mono",monospace}
  .puppet-card-info .more{margin-top:8px;font-size:12px;color:var(--rice-soft);letter-spacing:2px;opacity:0;transform:translateY(8px);transition:all .3s .1s}
  .puppet-card:hover .puppet-card-info .more{opacity:1;transform:translateY(0)}

  /* ============== CRAFT / PROCESS ============== */
  .craft{background:var(--ink-soft);position:relative;overflow:hidden}
  .craft-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
  .craft-visual{position:relative;aspect-ratio:1;background:radial-gradient(ellipse at center,rgba(232,184,75,0.08),transparent 70%);border:1px solid rgba(232,184,75,0.1);border-radius:50%;display:grid;place-items:center;overflow:hidden}
  .craft-visual-inner{position:relative;width:70%;height:70%;border-radius:50%;display:grid;place-items:center;animation:slowSpin 30s linear infinite}
  @keyframes slowSpin{to{transform:rotate(360deg)}}
  .craft-visual-inner img{width:60%;object-fit:contain;filter:brightness(0.3) sepia(1) saturate(5) hue-rotate(-10deg)}
  .craft-ring{position:absolute;border:1px dashed rgba(232,184,75,0.2);border-radius:50%}
  .craft-ring.r1{inset:10%;animation:spin 20s linear infinite reverse}
  .craft-ring.r2{inset:25%;animation:spin 15s linear infinite}
  .craft-ring.r3{inset:40%;border-style:solid;border-color:rgba(201,59,46,0.3);animation:spin 25s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  .craft-step{position:absolute;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:2px;color:var(--gold);background:var(--ink);padding:6px 10px;border:1px solid rgba(232,184,75,0.3);white-space:nowrap}
  .craft-step.s1{top:5%;left:50%;transform:translateX(-50%)}
  .craft-step.s2{top:30%;right:2%;transform:translateY(-50%)}
  .craft-step.s3{bottom:25%;right:5%}
  .craft-step.s4{bottom:5%;left:50%;transform:translateX(-50%)}
  .craft-step.s5{bottom:25%;left:5%}
  .craft-step.s6{top:30%;left:2%;transform:translateY(-50%)}

  .craft-steps{display:flex;flex-direction:column;gap:32px}
  .craft-step-item{display:flex;gap:24px;align-items:flex-start;padding:20px;border:1px solid transparent;transition:all .3s}
  .craft-step-item:hover{border-color:rgba(232,184,75,0.2);background:rgba(232,184,75,0.03)}
  .craft-step-num{font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--cinnabar);min-width:40px;letter-spacing:2px;padding-top:4px}
  .craft-step-body h4{font-family:"ZCOOL XiaoWei",serif;font-size:22px;letter-spacing:3px;color:var(--rice);margin-bottom:8px}
  .craft-step-body p{font-size:14px;line-height:1.9;color:var(--rice-soft);opacity:.85}

  /* ============== STATS / COUNTER ============== */
  .stats{background:var(--ink);padding:100px 80px;position:relative;overflow:hidden}
  .stats::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(to right,transparent,rgba(232,184,75,0.3),transparent)}
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:40px;text-align:center}
  .stat-item{position:relative}
  .stat-num{font-family:"ZCOOL XiaoWei",serif;font-size:64px;color:var(--gold);line-height:1;margin-bottom:12px;letter-spacing:2px;text-shadow:0 0 40px rgba(232,184,75,0.3)}
  .stat-label{font-size:13px;letter-spacing:3px;color:var(--rice-soft);opacity:.8}
  .stat-sep{position:absolute;right:-20px;top:50%;transform:translateY(-50%);width:1px;height:40px;background:rgba(232,184,75,0.2)}

  /* ============== LANTERNS (floating ambient) ============== */
  .lantern{position:fixed;pointer-events:none;z-index:1;opacity:.3}
  .lantern img{width:40px;filter:brightness(0.6) sepia(1) saturate(3) hue-rotate(-10deg)}

  /* ============== DRUM BUTTON ============== */
  .drum-wrap{position:relative;display:inline-block}
  .drum-ripple{position:absolute;inset:0;border:1px solid var(--gold);border-radius:50%;opacity:0;pointer-events:none}
  .drum-btn{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--cinnabar-soft),var(--cinnabar) 60%,#8b2418);color:var(--rice);display:grid;place-items:center;font-family:"ZCOOL XiaoWei",serif;font-size:24px;letter-spacing:4px;box-shadow:0 10px 30px rgba(201,59,46,0.4),inset 0 -4px 8px rgba(0,0,0,0.3),inset 0 4px 8px rgba(255,255,255,0.1);transition:all .2s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
  .drum-btn::after{content:"";position:absolute;inset:8px;border:1px solid rgba(232,184,75,0.3);border-radius:50%}
  .drum-btn:hover{transform:scale(1.05);box-shadow:0 15px 40px rgba(201,59,46,0.5),inset 0 -4px 8px rgba(0,0,0,0.3),inset 0 4px 8px rgba(255,255,255,0.15)}
  .drum-btn:active{transform:scale(0.95)}
  @keyframes drumRipple{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.5)}}

  /* ============== CTA SECTION ============== */
  .cta-section{background:var(--ink-soft);padding:140px 80px;text-align:center;position:relative;overflow:hidden}
  .cta-bg{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(232,184,75,0.05),transparent 70%)}
  .cta-inner{position:relative;z-index:1}
  .cta-title{font-family:"ZCOOL XiaoWei",serif;font-size:clamp(48px,6vw,96px);letter-spacing:12px;color:var(--rice);margin-bottom:24px}
  .cta-desc{font-size:16px;letter-spacing:2px;color:var(--rice-soft);margin-bottom:48px;max-width:500px;margin-left:auto;margin-right:auto;line-height:1.9}
  .drum-row{display:flex;flex-direction:column;align-items:center;gap:20px}

/* ========== CUSTOM CURSOR ========== */
function CustomCursor(){
  const ringRef = useRef(null);
  const dotRef = useRef(null);
  const rippleRef = useRef(null);
  const rafRef = useRef(0);
  const targetRef = useRef({x: window.innerWidth/2, y: window.innerHeight/2});
  const posRef = useRef({x: window.innerWidth/2, y: window.innerHeight/2});
  const [hover, setHover] = useState(false);
  const [down, setDown] = useState(false);

  useEffect(()=>{
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduced) return;

    const move = (e)=>{
      targetRef.current.x = e.clientX;
      targetRef.current.y = e.clientY;
    };
    const over = (e)=>{
      const t = e.target.closest('a,button,.show-card,.puppet-card,.gal-tab,.craft-step-item,.drum-btn');
      setHover(!!t);
    };
    const mdown = ()=>setDown(true);
    const mup = ()=>setDown(false);

    const tick = ()=>{
      // spring physics toward target
      const p = posRef.current;
      const t = targetRef.current;
      const stiffness = 0.18;
      const damping = 0.82;
      if(!p.vx) p.vx = 0;
      if(!p.vy) p.vy = 0;
      p.vx = (p.vx + (t.x - p.x) * stiffness) * damping;
      p.vy = (p.vy + (t.y - p.y) * stiffness) * damping;
      p.x += p.vx;
      p.y += p.vy;
      if(ringRef.current) ringRef.current.style.transform = `translate(${p.x - window.innerWidth/2}px, ${p.y - window.innerHeight/2}px)`;
      if(dotRef.current) dotRef.current.style.transform = `translate(${p.x - window.innerWidth/2}px, ${p.y - window.innerHeight/2}px)`;
      rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);

    window.addEventListener('mousemove', move);
    window.addEventListener('mouseover', over);
    window.addEventListener('mousedown', mdown);
    window.addEventListener('mouseup', mup);

    const vis = ()=>{
      if(document.hidden) cancelAnimationFrame(rafRef.current);
      else rafRef.current = requestAnimationFrame(tick);
    };
    document.addEventListener('visibilitychange', vis);

    return ()=>{
      cancelAnimationFrame(rafRef.current);
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseover', over);
      window.removeEventListener('mousedown', mdown);
      window.removeEventListener('mouseup', mup);
      document.removeEventListener('visibilitychange', vis);
    };
  },[]);

  const handleRipple = ()=>{
    if(!rippleRef.current) return;
    const r = rippleRef.current;
    r.style.animation = 'none';
    r.offsetHeight; // reflow
    r.style.animation = 'cursorRipple .6s ease-out forwards';
  };

  return (
    <div className="cursor-layer" onMouseDown={handleRipple}>
      <div ref={ringRef} className={`cursor-ring ${hover?'hover':''} ${down?'down':''}`}>
        <div ref={dotRef} className="cursor-dot"></div>
      </div>
      <div ref={rippleRef} className="cursor-ripple" style={{transform:'translate(-50%,-50%)'}}></div>
    </div>
  );
}

/* ========== PARTICLES (embers) ========== */
function Particles(){
  const ref = useRef(null);
  const rafRef = useRef(0);
  const particlesRef = useRef([]);

  useEffect(()=>{
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduced) return;

    const container = ref.current;
    if(!container) return;
    const count = 30;
    const ps = [];
    for(let i=0;i<count;i++){
      const el = document.createElement('div');
      el.className = 'particle';
      const size = Math.random()*2+1;
      el.style.width = size+'px';
      el.style.height = size+'px';
      container.appendChild(el);
      ps.push({
        el,
        x: Math.random()*window.innerWidth,
        y: Math.random()*window.innerHeight,
        vx: (Math.random()-0.5)*0.3,
        vy: -0.2 - Math.random()*0.5,
        life: Math.random(),
        maxLife: 8 + Math.random()*12,
        size
      });
    }
    particlesRef.current = ps;

    let last = performance.now();
    const tick = (now)=>{
      const dt = Math.min((now - last)/16.67,3);
      last = now;
      ps.forEach(p=>{
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life += 0.005 * dt;
        if(p.y < -20 || p.life > 1){
          p.y = window.innerHeight + 20;
          p.x = Math.random()*window.innerWidth;
          p.life = 0;
        }
        const opacity = Math.sin(p.life * Math.PI) * 0.6;
        p.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
        p.el.style.opacity = opacity;
      });
      rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);

    const vis = ()=>{
      if(document.hidden){ cancelAnimationFrame(rafRef.current); }
      else { last = performance.now(); rafRef.current = requestAnimationFrame(tick); }
    };
    document.addEventListener('visibilitychange', vis);

    return ()=>{
      cancelAnimationFrame(rafRef.current);
      document.removeEventListener('visibilitychange', vis);
      ps.forEach(p=>p.el.remove());
    };
  },[]);

  return <div className="particles" ref={ref}></div>;
}

/* ========== FLOATING LANTERNS ========== */
function FloatingLanterns(){
  const ref = useRef(null);
  const rafRef = useRef(0);
  const itemsRef = useRef([]);

  useEffect(()=>{
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduced) return;

    const container = ref.current;
    if(!container) return;
    const count = 5;
    const items = [];
    for(let i=0;i<count;i++){
      const el = document.createElement('div');
      el.className = 'lantern';
      el.innerHTML = `<img src="${IMG.lantern}" alt="lantern" />`;
      container.appendChild(el);
      items.push({
        el,
        baseX: Math.random()*window.innerWidth,
        baseY: Math.random()*window.innerHeight,
        phase: Math.random()*Math.PI*2,
        speed: 0.3 + Math.random()*0.5,
        ampX: 20 + Math.random()*30,
        ampY: 15 + Math.random()*20,
        size: 30 + Math.random()*30
      });
    }
    itemsRef.current = items;

    let t0 = performance.now();
    const tick = (now)=>{
      const t = (now - t0)/1000;
      items.forEach(it=>{
        const x = it.baseX + Math.sin(t*it.speed + it.phase) * it.ampX;
        const y = it.baseY + Math.cos(t*it.speed*0.7 + it.phase) * it.ampY;
        const rot = Math.sin(t*it.speed*0.5 + it.phase) * 5;
        it.el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
        it.el.firstChild.style.width = it.size + 'px';
      });
      rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);

    const vis = ()=>{
      if(document.hidden){ cancelAnimationFrame(rafRef.current); }
      else { t0 = performance.now() - (t0 ? (performance.now()-t0) : 0); rafRef.current = requestAnimationFrame(tick); }
    };
    document.addEventListener('visibilitychange', vis);

    return ()=>{
      cancelAnimationFrame(rafRef.current);
      document.removeEventListener('visibilitychange', vis);
      items.forEach(it=>it.el.remove());
    };
  },[]);

  return <div ref={ref} style={{position:'fixed',inset:0,pointerEvents:'none',zIndex:1}}></div>;
}

/* ========== SCROLL REVEAL HOOK ========== */
function useReveal(){
  useEffect(()=>{
    const els = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{
        if(e.isIntersecting){
          e.target.classList.add('in');
          io.unobserve(e.target);
        }
      });
    },{threshold:0.15});
    els.forEach(el=>io.observe(el));
    return ()=>io.disconnect();
  },[]);
}

/* ========== COUNTER ========== */
function Counter({to,duration=2000,suffix=""}){
  const ref = useRef(null);
  const rafRef = useRef(0);
  const [val, setVal] = useState(0);
  const startedRef = useRef(false);

  useEffect(()=>{
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const el = ref.current;
    if(!el) return;
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{
        if(e.isIntersecting && !startedRef.current){
          startedRef.current = true;
          if(reduced){ setVal(to); return; }
          const start = performance.now();
          const begin = 0;
          const animate = (now)=>{
            const p = Math.min((now - start)/duration,1);
            // ease out cubic
            const eased = 1 - Math.pow(1-p,3);
            setVal(Math.floor(begin + (to - begin) * eased));
            if(p < 1) rafRef.current = requestAnimationFrame(animate);
          };
          rafRef.current = requestAnimationFrame(animate);
        }
      });
    },{threshold:0.5});
    io.observe(el);
    return ()=>{
      io.disconnect();
      cancelAnimationFrame(rafRef.current);
    };
  },[to,duration]);

  return <span ref={ref}>{val}{suffix}</span>;
}

/* ========== TYPEWRITER ========== */
function Typewriter({texts,speed=80,pause=2000}){
  const [idx, setIdx] = useState(0);
  const [display, setDisplay] = useState("");
  const [deleting, setDeleting] = useState(false);
  const timeoutRef = useRef(null);

  useEffect(()=>{
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduced){
      setDisplay(texts[0]);
      return;
    }
    const current = texts[idx % texts.length];

    const step = ()=>{
      if(!deleting){
        if(display.length < current.length){
          setDisplay(current.slice(0, display.length+1));
          timeoutRef.current = setTimeout(step, speed + Math.random()*40);
        } else {
          timeoutRef.current = setTimeout(()=>setDeleting(true), pause);
        }
      } else {
        if(display.length > 0){
          setDisplay(display.slice(0,-1));
          timeoutRef.current = setTimeout(step, speed/2);
        } else {
          setDeleting(false);
          setIdx(i=>(i+1)%texts.length);
        }
      }
    };
    timeoutRef.current = setTimeout(step, speed);
    return ()=>clearTimeout(timeoutRef.current);
  },[display, deleting, idx, texts, speed, pause]);

  return (
    <span className="typewriter">
      {display}<span className="typewriter-caret"></span>
    </span>
  );
}

/* ========== 3D TILT CARD ========== */
function TiltCard({children,className=""}){
  const ref = useRef(null);
  const rafRef = useRef(0);
  const targetRef = useRef({rx:0,ry:0,mx:50,my:50});
  const curRef = useRef({rx:0,ry:0,mx:50,my:50});

  useEffect(()=>{
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduced) return;
    const el = ref.current;
    if(!el) return;

    const onMove = (e)=>{
      const r = el.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width;
      const py = (e.clientY - r.top) / r.height;
      targetRef.current.ry = (px - 0.5) * 15;
      targetRef.current.rx = -(py - 0.5) * 15;
      targetRef.current.mx = px * 100;
      targetRef.current.my = py * 100;
    };
    const onLeave = ()=>{
      targetRef.current.rx = 0;
      targetRef.current.ry = 0;
    };

    const tick = ()=>{
      const t = targetRef.current;
      const c = curRef.current;
      c.rx += (t.rx - c.rx) * 0.1;
      c.ry += (t.ry - c.ry) * 0.1;
      c.mx += (t.mx - c.mx) * 0.1;
      c.my += (t.my - c.my) * 0.1;
      el.style.transform = `perspective(1000px) rotateX(${c.rx}deg) rotateY(${c.ry}deg)`;
      el.style.setProperty('--mx', c.mx+'%');
      el.style.setProperty('--my', c.my+'%');
      rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);

    el.addEventListener('mousemove', onMove);
    el.addEventListener('mouseleave', onLeave);

    const vis = ()=>{
      if(document.hidden) cancelAnimationFrame(rafRef.current);
      else rafRef.current = requestAnimationFrame(tick);
    };
    document.addEventListener('visibilitychange', vis);

    return ()=>{
      cancelAnimationFrame(rafRef.current);
      el.removeEventListener('mousemove', onMove);
      el.removeEventListener('mouseleave', onLeave);
      document.removeEventListener('visibilitychange', vis);
    };
  },[]);

  return (
    <div ref={ref} className={className}>{children}</div>
  );
}

/* ========== DRUM BUTTON (ripple) ========== */
function DrumButton(){
  const [ripples, setRipples] = useState([]);
  const idRef = useRef(0);

  const handleClick = ()=>{
    const id = ++idRef.current;
    setRipples(r=>[...r,id]);
    setTimeout(()=>{
      setRipples(r=>r.filter(x=>x!==id));
    }, 700);
  };

  return (
    <div className="drum-wrap">
      {ripples.map(id=>(
        <div key={id} className="drum-ripple" style={{animation:'drumRipple .7s ease-out forwards'}}></div>
      ))}
      <button className="drum-btn" onClick={handleClick}>开幕</button>
    </div>
  );
}

/* ========== HERO PUPPET PARALLAX ========== */
function HeroPuppets({open}){

  useEffect(()=>{
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduced) return;
    const move = (e)=>{
      mouseRef.current.x = (e.clientX / window.innerWidth - 0.5) * 2;
      mouseRef.current.y = (e.clientY / window.innerHeight - 0.5) * 2;
    };
    const tick = ()=>{
      const c = curRef.current;
      const m = mouseRef.current;

      puppets.forEach((p,i)=>{

      });
      rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);
    window.addEventListener('mousemove', move);
    const vis = ()=>{
      if(document.hidden) cancelAnimationFrame(rafRef.current);
      else rafRef.current = requestAnimationFrame(tick);
    };
    document.addEventListener('visibilitychange', vis);
    return ()=>{
      cancelAnimationFrame(rafRef.current);
      window.removeEventListener('mousemove', move);
      document.removeEventListener('visibilitychange', vis);
    };
  },[]);

  return (
    <div className="hero-puppets" ref={ref}>
      <div className="hero-puppet" style={{'--depth':1}}>
        <img src={IMG.female} alt="shadow puppet" />
      </div>
      <div className="hero-puppet center">
        <img src={IMG.warrior} alt="shadow puppet main" />
      </div>
      <div className="hero-puppet">
        <img src={IMG.scholar} alt="shadow puppet" />
      </div>
    </div>
  );
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>拐弯 Detour · 城市漫游独立杂志</title>

<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,600;8..60,700&family=Noto+Serif+SC:wght@300;400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" />

<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: "Noto Serif SC", "Source Serif 4", Georgia, serif;
  background: var(--cream);
  color: var(--ink);
  overflow-x: hidden;
  cursor: none;
}
@media (max-width: 768px) { body { cursor: auto; } }
a { color: inherit; text-decoration: none; cursor: none; }
button { font-family: inherit; cursor: none; border: none; background: none; }
@media (max-width: 768px) { a, button { cursor: pointer; } }
img { display: block; max-width: 100%; }
ul, ol { list-style: none; }

/* ===== Design Tokens ===== */
:root {
  --brick: #C14A33;
  --brick-dark: #9E3A26;
  --cream: #F6F1E7;
  --cream-dark: #EDE6D6;
  --ink: #191512;
  --ink-soft: #2A241F;
  --mustard: #D9A62E;
  --sage: #6E7F6A;
  --sage-dark: #4F5E4C;

  --font-display: "Playfair Display", "Noto Serif SC", Georgia, serif;
  --font-body: "Noto Serif SC", "Source Serif 4", Georgia, serif;
  --font-sans: "Inter", "Noto Serif SC", sans-serif;

  --max-width: 1280px;
  --gutter: 40px;
}

/* ===== Paper Texture Overlay ===== */
.paper-texture {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9000;
  opacity: 0.06;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ===== Custom Cursor ===== */
.cursor-outer {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 36px;
  height: 36px;
  border: 2px solid var(--ink);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 10000;
  transition: width 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
              height 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
              border-color 0.25s ease,
              background-color 0.25s ease;
  will-change: transform;
  mix-blend-mode: difference;
  border-color: #fff;
}
.cursor-inner {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 6px;
  height: 6px;
  background: var(--brick);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 10001;
  transition: transform 0.12s ease-out, background-color 0.2s ease;
  will-change: transform;
}
.cursor-glow {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(217,166,46,0.25) 0%, transparent 70%);
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 9999;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.cursor-outer.is-hover {
  width: 64px;
  height: 64px;
  background: rgba(193, 74, 51, 0.15);
}
.cursor-outer.is-click {
  width: 28px;
  height: 28px;
}
.cursor-outer.is-link {
  width: 12px;
  height: 12px;
  border-width: 3px;
}
.cursor-ripple {
  position: fixed;
  width: 36px;
  height: 36px;
  border: 2px solid var(--mustard);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 9998;
  animation: cursorRipple 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes cursorRipple {
  0% { width: 36px; height: 36px; opacity: 1; border-color: var(--mustard); }
  100% { width: 120px; height: 120px; opacity: 0; border-color: var(--brick); }
}
@media (max-width: 768px) {
  .cursor-outer, .cursor-inner, .cursor-glow { display: none; }
}

/* ===== Nav ===== */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 20px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: background-color 0.4s ease, padding 0.4s ease, box-shadow 0.4s ease;
  mix-blend-mode: normal;
}
.nav.scrolled {
  background: rgba(246, 241, 231, 0.92);
  backdrop-filter: blur(12px);
  padding: 14px 40px;
  box-shadow: 0 1px 0 rgba(25, 21, 18, 0.08);
}
.nav-logo {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 900;
  letter-spacing: -0.5px;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav-logo-mark {
  width: 32px;
  height: 32px;
  position: relative;
}
.nav-logo-mark::before,
.nav-logo-mark::after {
  content: '';
  position: absolute;
  background: var(--brick);
  border-radius: 2px;
}
.nav-logo-mark::before {
  width: 100%;
  height: 5px;
  top: 8px;
  left: 0;
  transform: rotate(-12deg);
}
.nav-logo-mark::after {
  width: 5px;
  height: 16px;
  bottom: 4px;
  right: 6px;
  transform: rotate(-12deg);
}
.nav-links {
  display: flex;
  gap: 36px;
  align-items: center;
}
.nav-links a {
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--ink-soft);
  position: relative;
  transition: color 0.3s ease;
}
.nav-links a::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: 0;
  width: 0;
  height: 1.5px;
  background: var(--brick);
  transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1);
}
.nav-links a:hover { color: var(--brick); }
.nav-links a:hover::after { width: 100%; }
.nav-cta {
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  padding: 10px 22px;
  background: var(--brick);
  color: var(--cream) !important;
  border-radius: 2px;
  position: relative;
  overflow: hidden;
  transition: background-color 0.3s ease;
}
.nav-cta::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition: left 0.6s ease;
}
.nav-cta:hover::before { left: 100%; }
.nav-cta:hover { background: var(--brick-dark); }

.nav-burger { display: none; width: 32px; height: 24px; position: relative; }
.nav-burger span {
  position: absolute; left: 0; width: 100%; height: 2px;
  background: var(--ink); transition: all 0.3s ease;
}
.nav-burger span:nth-child(1) { top: 2px; }
.nav-burger span:nth-child(2) { top: 11px; }
.nav-burger span:nth-child(3) { top: 20px; }

@media (max-width: 768px) {
  .nav { padding: 16px 20px; }
  .nav-links { display: none; }
  .nav-burger { display: block; }
  .nav-logo { font-size: 22px; }
}

/* ===== Hero ===== */
.hero {
  min-height: 100vh;
  padding: 120px 40px 80px;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow: hidden;
}
.hero-grid {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 60px;
  max-width: var(--max-width);
  margin: 0 auto;
  width: 100%;
  align-items: center;
}
.hero-kicker {
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--brick);
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.hero-kicker::before {
  content: '';
  width: 40px;
  height: 1px;
  background: var(--brick);
}
.hero-title {
  font-family: var(--font-display);
  font-size: clamp(56px, 9vw, 130px);
  font-weight: 900;
  line-height: 0.92;
  letter-spacing: -2px;
  color: var(--ink);
  margin-bottom: 32px;
}
.hero-title span.italic {
  font-style: italic;
  font-weight: 400;
  color: var(--brick);
  font-family: var(--font-display);
}
.hero-title .chinese {
  font-family: var(--font-body);
  font-weight: 900;
  display: block;
  margin-top: 8px;
  font-size: 0.55em;
  letter-spacing: 12px;
  color: var(--ink-soft);
}
.hero-sub {
  font-size: 17px;
  line-height: 1.8;
  color: var(--ink-soft);
  max-width: 480px;
  margin-bottom: 40px;
  font-weight: 300;
}
.hero-ctas {
  display: flex;
  gap: 20px;
  align-items: center;
  flex-wrap: wrap;
}
.btn-primary {
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 16px 32px;
  background: var(--ink);
  color: var(--cream);
  border-radius: 2px;
  position: relative;
  overflow: hidden;
  transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.btn-primary:hover {
  background: var(--brick);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(193, 74, 51, 0.3);
}
.btn-ghost {
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 16px 4px;
  color: var(--ink);
  border-bottom: 1.5px solid var(--ink);
  transition: all 0.3s ease;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.btn-ghost:hover {
  color: var(--brick);
  border-color: var(--brick);
  gap: 14px;
}
.hero-meta {
  display: flex;
  gap: 48px;
  margin-top: 64px;
  padding-top: 32px;
  border-top: 1px solid rgba(25, 21, 18, 0.12);
  flex-wrap: wrap;
}
.hero-meta-item {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.hero-meta-num {
  font-family: var(--font-display);
  font-size: 36px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1;
}
.hero-meta-num .unit {
  font-size: 16px;
  font-weight: 400;
  color: var(--brick);
  margin-left: 2px;
}
.hero-meta-label {
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--sage-dark);
}

/* Hero cover / right side */
.hero-cover {
  position: relative;
  perspective: 1200px;
}
.hero-cover-inner {
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.15s ease-out;
  will-change: transform;
}
.issue-cover {
  aspect-ratio: 3 / 4;
  background: var(--brick);
  border-radius: 4px;
  box-shadow:
    -20px 30px 60px rgba(25, 21, 18, 0.25),
    0 0 0 1px rgba(25, 21, 18, 0.1);
  position: relative;
  overflow: hidden;
  color: var(--cream);
  padding: 40px 36px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transform: rotateY(-8deg) rotateX(3deg);
}
.issue-cover::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity: 0.08;
  mix-blend-mode: overlay;
  pointer-events: none;
}
.cover-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  position: relative;
  z-index: 2;
}
.cover-logo {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 900;
  letter-spacing: -1px;
  font-style: italic;
}
.cover-issue {
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  text-align: right;
  line-height: 1.6;
}
.cover-issue strong {
  font-size: 22px;
  font-family: var(--font-display);
  font-weight: 700;
  display: block;
  letter-spacing: 0;
  font-style: italic;
}
.cover-center {
  position: relative;
  z-index: 2;
  margin: auto 0;
}
.cover-headline {
  font-family: var(--font-display);
  font-size: 48px;
  font-weight: 900;
  line-height: 0.95;
  letter-spacing: -1px;
}
.cover-headline em {
  font-style: italic;
  font-weight: 400;
  font-size: 0.6em;
  display: block;
  margin-top: 8px;
  color: var(--mustard);
}
.cover-subtitle {
  font-size: 13px;
  font-weight: 300;
  margin-top: 16px;
  line-height: 1.6;
  opacity: 0.9;
}
.cover-bottom {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  position: relative;
  z-index: 2;
}
.cover-tag {
  font-family: var(--font-sans);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 4px 10px;
  border: 1px solid rgba(246, 241, 231, 0.4);
  border-radius: 20px;
}
.cover-date {
  font-family: var(--font-display);
  font-size: 11px;
  font-style: italic;
  opacity: 0.7;
}
.cover-graphic {
  position: absolute;
  right: -20px;
  top: 50%;
  transform: translateY(-50%);
  width: 180px;
  height: 180px;
  z-index: 1;
}
.cover-graphic svg {
  width: 100%;
  height: 100%;
  opacity: 0.15;
}

.hero-cover-sticker {
  position: absolute;
  bottom: -20px;
  left: -30px;
  width: 110px;
  height: 110px;
  background: var(--mustard);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  font-style: italic;
  color: var(--ink);
  text-align: center;
  z-index: 10;
  box-shadow: 0 8px 24px rgba(217, 166, 46, 0.4);
  animation: stickerFloat 4s ease-in-out infinite;
  animation-delay: 1s;
}
@keyframes stickerFloat {
  0%, 100% { transform: translateY(0) rotate(-8deg); }
  50% { transform: translateY(-12px) rotate(-6deg); }
}
.hero-cover-sticker span {
  line-height: 1.2;
  transform: rotate(-12deg);
}

.hero-scroll-hint {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--sage-dark);
}
.scroll-line {
  width: 1px;
  height: 40px;
  background: linear-gradient(to bottom, var(--sage), transparent);
  position: relative;
  overflow: hidden;
}
.scroll-line::after {
  content: '';
  position: absolute;
  top: -100%;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--brick);
  animation: scrollDown 2s ease-in-out infinite;
}
@keyframes scrollDown {
  0% { top: -100%; }
  50%, 100% { top: 100%; }
}

@media (max-width: 900px) {
  .hero-grid { grid-template-columns: 1fr; gap: 40px; }
  .hero-cover { max-width: 320px; margin: 0 auto; }
  .hero { padding: 100px 20px 60px; }
  .hero-meta { gap: 24px; margin-top: 40px; }
  .hero-cover-sticker { width: 80px; height: 80px; font-size: 11px; left: -15px; bottom: -10px; }
}

/* ===== Typewriter ===== */
.typewriter-cursor {
  display: inline-block;
  width: 3px;
  height: 0.9em;
  background: var(--brick);
  margin-left: 4px;
  vertical-align: middle;
  animation: blink 1.1s step-end infinite;
}
@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}

/* ===== Section Base ===== */
.section {
  padding: 120px 40px;
  position: relative;
}
.section-inner {
  max-width: var(--max-width);
  margin: 0 auto;
}
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 60px;
  flex-wrap: wrap;
  gap: 24px;
}
.section-label {
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--brick);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.section-label::before {
  content: '';
  width: 24px;
  height: 1px;
  background: var(--brick);
}
.section-title {
  font-family: var(--font-display);
  font-size: clamp(36px, 5vw, 56px);
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -1px;
  color: var(--ink);
}
.section-title em {
  font-style: italic;
  color: var(--brick);
  font-weight: 400;
}
.section-desc {
  font-size: 15px;
  line-height: 1.7;
  color: var(--ink-soft);
  max-width: 420px;
  font-weight: 300;
}

@media (max-width: 768px) {
  .section { padding: 80px 20px; }
  .section-header { margin-bottom: 40px; }
}

/* ===== Featured Articles ===== */
.articles {
  background: var(--cream-dark);
}
.articles-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px;
}
.article-card {
  background: var(--cream);
  border-radius: 4px;
  overflow: hidden;
  transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  position: relative;
  box-shadow: 0 2px 8px rgba(25, 21, 18, 0.06);
  transform-style: preserve-3d;
  will-change: transform;
}
.article-card:hover {
  transform: translateY(-8px);
  box-shadow: 0 20px 40px rgba(25, 21, 18, 0.15);
}
.article-img {
  aspect-ratio: 4 / 3;
  position: relative;
  overflow: hidden;
}
.article-img-inner {
  position: absolute;
  inset: 0;
  transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}
.article-card:hover .article-img-inner {
  transform: scale(1.05);
}
.article-category {
  position: absolute;
  top: 16px;
  left: 16px;
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 5px 12px;
  background: var(--cream);
  color: var(--brick);
  border-radius: 2px;
  z-index: 2;
}
.article-body {
  padding: 28px 24px 32px;
}
.article-title {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  line-height: 1.25;
  color: var(--ink);
  margin-bottom: 12px;
  transition: color 0.3s ease;
}
.article-card:hover .article-title { color: var(--brick); }
.article-excerpt {
  font-size: 14px;
  line-height: 1.7;
  color: var(--ink-soft);
  margin-bottom: 20px;
  font-weight: 300;
}
.article-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 16px;
  border-top: 1px solid rgba(25, 21, 18, 0.08);
}
.article-author {
  display: flex;
  align-items: center;
  gap: 10px;
}
.author-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--sage);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 700;
  color: var(--cream);
  position: relative;
}
.author-avatar::after {
  content: '';
  position: absolute;
  inset: -3px;
  border: 1.5px solid var(--mustard);
  border-radius: 50%;
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.article-card:hover .author-avatar::after {

/* ===== Utility: Particle System ===== */
const createParticles = (container, x, y, count = 12, color = '#D9A62E') => {
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const velocity = 2 + Math.random() * 3;
    const size = 3 + Math.random() * 4;
    p.style.cssText = `
      position: fixed;
      left: ${x}px;
      top: ${y}px;
      width: ${size}px;
      height: ${size}px;
      background: ${color};
      border-radius: 50%;
      pointer-events: none;
      z-index: 9997;
      opacity: 1;
      transition: none;
    `;
    document.body.appendChild(p);
    let vx = Math.cos(angle) * velocity;
    let vy = Math.sin(angle) * velocity;
    let px = x;
    let py = y;
    let life = 1;
    const decay = 0.02 + Math.random() * 0.01;
    const gravity = 0.08;
    const friction = 0.96;
    
    const tick = () => {
      vy += gravity;
      vx *= friction;
      vy *= friction;
      px += vx;
      py += vy;
      life -= decay;
      p.style.left = px + 'px';
      p.style.top = py + 'px';
      p.style.opacity = life;
      p.style.transform = `scale(${life})`;
      if (life > 0) {
        requestAnimationFrame(tick);
      } else {
        p.remove();
      }
    };
    requestAnimationFrame(tick);
  }
};

  /* Typewriter */
  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) {

      return;
    }
    
    let currentPhrase = 0;
    let currentChar = 0;
    let isDeleting = false;
    let rafId;
    let lastTime = 0;
    let typeDelay = 120;
    let holdDelay = 2000;
    let holding = false;
    
    const loop = (time) => {
      if (time - lastTime < (holding ? holdDelay : (isDeleting ? typeDelay * 0.5 : typeDelay))) {
        rafId = requestAnimationFrame(loop);
        return;
      }
      lastTime = time;
      
      const phrase = taglines[currentPhrase];
      
      if (!isDeleting && !holding) {
        currentChar++;
        setTypewriterText(phrase.slice(0, currentChar));
        if (currentChar === phrase.length) {
          holding = true;
          lastTime = time;
        }
      } else if (holding) {
        holding = false;
        isDeleting = true;
      } else if (isDeleting) {
        currentChar--;
        setTypewriterText(phrase.slice(0, currentChar));
        if (currentChar === 0) {
          isDeleting = false;
          currentPhrase = (currentPhrase + 1) % taglines.length;
          typeDelay = 100 + Math.random() * 60;
        }
      }
      
      rafId = requestAnimationFrame(loop);
    };
    
    rafId = requestAnimationFrame(loop);
    
    const handleVisibility = () => {
      if (document.hidden) {
        cancelAnimationFrame(rafId);
      } else {
        lastTime = performance.now();
        rafId = requestAnimationFrame(loop);
      }
    };

    return () => {

      return;
    }
    
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
    
    elements.forEach((el, i) => {

/* ===== Custom Cursor ===== */
(function initCursor() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isMobile = window.innerWidth <= 768;
  if (reduced || isMobile) return;

  const outer = document.getElementById('cursorOuter');
  const inner = document.getElementById('cursorInner');
  const glow = document.getElementById('cursorGlow');
  
  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let outerX = mouseX;
  let outerY = mouseY;
  let glowX = mouseX;
  let glowY = mouseY;
  let rafId;
  let isVisible = true;

  // Spring physics for outer cursor
  const spring = { x: mouseX, y: mouseY };
  const velocity = { x: 0, y: 0 };
  const stiffness = 0.18;  // Hooke's law: F = -kx
  const damping = 0.7;     // damping force
  const mass = 1;

  const updateCursor = () => {
    if (!isVisible) {
      rafId = requestAnimationFrame(updateCursor);
      return;
    }

    // Inner cursor: direct follow with slight easing (simple lerp)
    const innerLerp = 0.35;
    let currentInnerX = parseFloat(inner.style.left || '50%');
    // Use getBoundingClientRect approach instead - simpler:
    inner.style.transform = `translate(${mouseX - inner.getBoundingClientRect().left - inner.offsetWidth/2 + inner.offsetWidth/2}px, ${mouseY - inner.getBoundingClientRect().top - inner.offsetHeight/2 + inner.offsetHeight/2}px)`;
    // Actually just use transform on fixed position
    
    // Outer cursor: spring physics (Hooke's law)
    const dx = mouseX - outerX;
    const dy = mouseY - outerY;
    const forceX = dx * stiffness;
    const forceY = dy * stiffness;
    velocity.x = (velocity.x + forceX / mass) * damping;
    velocity.y = (velocity.y + forceY / mass) * damping;
    outerX += velocity.x;
    outerY += velocity.y;

    outer.style.transform = `translate(${outerX - 18}px, ${outerY - 18}px)`;
    outer.style.top = '0';
    outer.style.left = '0';
    inner.style.transform = `translate(${mouseX - 3}px, ${mouseY - 3}px)`;
    inner.style.top = '0';
    inner.style.left = '0';

    // Glow: slowest follow, momentum
    glowX += (mouseX - glowX) * 0.08;
    glowY += (mouseY - glowY) * 0.08;
    glow.style.transform = `translate(${glowX - 40}px, ${glowY - 40}px)`;
    glow.style.top = '0';
    glow.style.left = '0';

    rafId = requestAnimationFrame(updateCursor);
  };

  const handleMouseMove = (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    glow.style.opacity = '1';
  };

  const handleMouseDown = (e) => {
    outer.classList.add('is-click');
    // Ripple
    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
    
    // Particles on buttons
    const target = e.target.closest('[data-particle]');
    if (target) {
      createParticles(null, e.clientX, e.clientY, 16, '#D9A62E');
    }
  };

  const handleMouseUp = () => {
    outer.classList.remove('is-click');
  };

  const handleMouseOver = (e) => {
    const hoverable = e.target.closest('[data-hoverable]');
    if (hoverable) {
      const isLink = hoverable.tagName === 'A' || hoverable.tagName === 'BUTTON' || hoverable.closest('a, button');
      outer.classList.add('is-hover');
      if (isLink) outer.classList.add('is-link');
    }
  };

  const handleMouseOut = (e) => {
    const hoverable = e.target.closest('[data-hoverable]');
    if (hoverable) {
      outer.classList.remove('is-hover', 'is-link');
    }
  };

  const handleVisibility = () => {
    isVisible = !document.hidden;
    if (isVisible) {
      rafId = requestAnimationFrame(updateCursor);
    } else {
      cancelAnimationFrame(rafId);
    }
  };

  document.addEventListener('mousemove', handleMouseMove);
  document.addEventListener('mousedown', handleMouseDown);
  document.addEventListener('mouseup', handleMouseUp);
  document.addEventListener('mouseover', handleMouseOver);
  document.addEventListener('mouseout', handleMouseOut);
  document.addEventListener('visibilitychange', handleVisibility);
  
  window.addEventListener('beforeunload', () => {
    cancelAnimationFrame(rafId);
    document.removeEventListener('mousemove', handleMouseMove);
    document.removeEventListener('mousedown', handleMouseDown);
    document.removeEventListener('mouseup', handleMouseUp);
    document.removeEventListener('mouseover', handleMouseOver);
    document.removeEventListener('mouseout', handleMouseOut);
    document.removeEventListener('visibilitychange', handleVisibility);
  });

  // Start
  rafId = requestAnimationFrame(updateCursor);
})();

/* ===== Card 3D Tilt ===== */
(function initTilt() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isMobile = window.innerWidth <= 768;
  if (reduced || isMobile) return;

  let rafId;
  const tiltElements = new Map();
  
  const updateTilts = () => {
    tiltElements.forEach((state, el) => {
      if (!state.active) {
        // Spring back to center
        state.rotX += (0 - state.rotX) * 0.1;
        state.rotY += (0 - state.rotY) * 0.1;
        if (Math.abs(state.rotX) < 0.01 && Math.abs(state.rotY) < 0.01) {
          state.rotX = 0;
          state.rotY = 0;
          el.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
          return;
        }
      }
      el.style.transform = `perspective(1000px) rotateX(${state.rotX.toFixed(2)}deg) rotateY(${state.rotY.toFixed(2)}deg)`;
    });
    
    rafId = requestAnimationFrame(updateTilts);
  };

  document.addEventListener('mouseover', (e) => {
    const tiltEl = e.target.closest('[data-tilt]');
    if (tiltEl && !tiltElements.has(tiltEl)) {
      tiltElements.set(tiltEl, { rotX: 0, rotY: 0, active: true });
      if (tiltElements.size === 1) {
        rafId = requestAnimationFrame(updateTilts);
      }
    }
  });

  document.addEventListener('mousemove', (e) => {
    document.querySelectorAll('[data-tilt]').forEach(el => {
      const state = tiltElements.get(el);
      if (!state || !state.active) return;
      const rect = el.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const maxTilt = 8;
      state.rotY = ((x - centerX) / centerX) * maxTilt;
      state.rotX = -((y - centerY) / centerY) * maxTilt;
    });
  });

  document.addEventListener('mouseout', (e) => {
    const tiltEl = e.target.closest('[data-tilt]');
    if (tiltEl) {
      const state = tiltElements.get(tiltEl);
      if (state) state.active = false;
    }
  });

  // Visibility pause
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      cancelAnimationFrame(rafId);
    } else if (tiltElements.size > 0) {
      rafId = requestAnimationFrame(updateTilts);
    }
  });

  window.addEventListener('beforeunload', () => {
    cancelAnimationFrame(rafId);
  });
})();

/* ===== Magnetic Buttons ===== */
(function initMagnetic() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isMobile = window.innerWidth <= 768;
  if (reduced || isMobile) return;

  let rafId;
  const magnets = new Map();

  const updateMagnets = () => {
    magnets.forEach((state, el) => {
      // Inverse square attraction toward mouse
      const dx = state.targetX - state.currentX;
      const dy = state.targetY - state.currentY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      
      if (!state.hovered && dist < 0.1) {
        state.currentX = 0;
        state.currentY = 0;
        el.style.transform = `translate(0, 0)`;
        return;
      }
      
      // Spring-like easing
      state.currentX += dx * 0.2;
      state.currentY += dy * 0.2;
      
      el.style.transform = `translate(${state.currentX.toFixed(1)}px, ${state.currentY.toFixed(1)}px)`;
    });
    
    rafId = requestAnimationFrame(updateMagnets);
  };

  document.addEventListener('mouseover', (e) => {
    const mag = e.target.closest('[data-magnetic]');
    if (mag && !magnets.has(mag)) {
      magnets.set(mag, { currentX: 0, currentY: 0, targetX: 0, targetY: 0, hovered: true });
      if (magnets.size === 1) {
        rafId = requestAnimationFrame(updateMagnets);
      }
    }
  });

  document.addEventListener('mousemove', (e) => {
    magnets.forEach((state, el) => {
      const rect = el.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const dx = e.clientX - centerX;
      const dy = e.clientY - centerY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const maxDist = 100;
      
      if (dist < maxDist) {
        // Inverse square: closer = stronger pull
        const strength = Math.pow(1 - dist / maxDist, 2) * 20;
        state.targetX = (dx / dist) * strength;
        state.targetY = (dy / dist) * strength;
        state.hovered = true;
      } else {
        state.targetX = 0;
        state.targetY = 0;
        state.hovered = false;
      }
    });
  });

  document.addEventListener('mouseout', (e) => {
    const mag = e.target.closest('[data-magnetic]');
    if (mag) {
      const state = magnets.get(mag);
      if (state) {
        state.hovered = false;
        state.targetX = 0;
        state.targetY = 0;
      }
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      cancelAnimationFrame(rafId);
    } else if (magnets.size > 0) {
      rafId = requestAnimationFrame(updateMagnets);
    }
  });

  window.addEventListener('beforeunload', () => {
    cancelAnimationFrame(rafId);
  });
})();

(function initNavScroll() {
  const nav = document.getElementById('nav');
  let ticking = false;
  
  const updateNav = () => {
    if (window.scrollY > 50) {
      nav.classList.add('scrolled');
    } else {
      nav.classList.remove('scrolled');
    }
    ticking = false;
  };
  
  window.addEventListener('scroll', () => {
    if (!ticking) {
      requestAnimationFrame(updateNav);
      ticking = true;
    }
  });
})();

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="creative-medium" content="interactive-prototype">
    <title>山海经异兽图鉴</title>
    <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@300;400;500;600;700;900&family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&display=swap">
    <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
    <style>
        /* ==================== CSS Reset & Base ==================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Noto Serif SC', 'Songti SC', serif;
            background: #F5EFE0;
            color: #1A2E3A;
            overflow-x: hidden;
            cursor: none;
        }
        @media (max-width: 768px) {
            body { cursor: auto; }
        }

        /* ==================== Color Tokens ==================== */
        :root {
            --paper: #F5EFE0;
            --paper-dark: #EDE4CE;
            --paper-warm: #F0E6D0;
            --vermilion: #C23A2B;
            --vermilion-deep: #9E2A1E;
            --vermilion-light: #D9513F;
            --ink: #1A2E3A;
            --ink-soft: #2D4350;
            --ink-light: #4A6070;
            --gold: #B8935A;
            --gold-light: #D4B377;
            --gold-dark: #8A6D3B;
            --seal-red: #B8342A;
        }

        /* ==================== Scrollbar ==================== */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--paper-dark); }
        ::-webkit-scrollbar-thumb { background: var(--vermilion); border-radius: 4px; }

        /* ==================== Custom Cursor ==================== */
        .cursor-outer {
            position: fixed;
            width: 40px;
            height: 40px;
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            mix-blend-mode: difference;
            transition: width 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        height 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        border-color 0.25s ease;
            box-shadow: 0 0 20px rgba(194, 58, 43, 0.6), 0 0 40px rgba(194, 58, 43, 0.3);
        }
        .cursor-outer.hover {
            width: 60px;
            height: 60px;
            border-color: var(--gold-light);
        }
        .cursor-outer.click {
            width: 20px;
            height: 20px;
        }
        .cursor-inner {
            position: fixed;
            width: 8px;
            height: 8px;
            background: var(--vermilion);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px var(--vermilion), 0 0 20px rgba(194, 58, 43, 0.5);
            transition: background 0.2s ease, transform 0.15s ease;
        }
        .cursor-inner.hover {
            background: var(--gold);
            box-shadow: 0 0 15px var(--gold-light), 0 0 30px rgba(184, 147, 90, 0.5);
        }

        .cursor-ripple {
            position: fixed;
            border: 2px solid var(--vermilion);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%) scale(0);
            opacity: 1;
            animation: rippleExpand 0.6s ease-out forwards;
        }
        @keyframes rippleExpand {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
        }

        @media (max-width: 768px) {
            .cursor-outer, .cursor-inner { display: none; }
        }

        /* ==================== Navigation ==================== */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 20px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(245, 239, 224, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(184, 147, 90, 0.2);
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .nav.hidden { transform: translateY(-100%); }
        .nav-logo {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 28px;
            color: var(--vermilion);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .nav-logo-seal {
            width: 36px;
            height: 36px;
            background: var(--vermilion);
            color: var(--paper);
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            position: relative;
        }
        .nav-logo-seal::after {
            content: '';
            position: absolute;
            inset: 2px;
            border: 1px solid rgba(245, 239, 224, 0.4);
            border-radius: 2px;
        }
        .nav-links {
            display: flex;
            gap: 36px;
            list-style: none;
        }
        .nav-links a {
            color: var(--ink);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            position: relative;
            padding: 6px 0;
            transition: color 0.3s ease;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--vermilion);
            transition: width 0.3s ease;
        }
        .nav-links a:hover { color: var(--vermilion); }
        .nav-links a:hover::after { width: 100%; }

        .nav-hamburger {
            display: none;
            width: 32px;
            height: 24px;
            flex-direction: column;
            justify-content: space-between;
            background: none;
            border: none;
            cursor: none;
        }
        .nav-hamburger span {
            width: 100%;
            height: 2px;
            background: var(--ink);
            transition: all 0.3s ease;
        }

        @media (max-width: 768px) {
            .nav { padding: 16px 20px; }
            .nav-links { display: none; }
            .nav-hamburger { display: flex; cursor: pointer; }
        }

        /* ==================== Hero Section ==================== */
        .hero {
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding-top: 80px;
        }
        .hero-bg {
            position: absolute;
            inset: 0;
            background-image: url('/spark/app/app_17cb3bgr1nr/runtime/api/v1/storage/object/bucket_aadkqopsawqao_static/static%2Faadkqoeuyowco_ve_miaoda');
            background-size: cover;
            background-position: center;
            opacity: 0.25;
            filter: sepia(0.2) saturate(0.9);
        }
        .hero-paper-texture {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(194, 58, 43, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(26, 46, 58, 0.06) 0%, transparent 50%);
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 900px;
            padding: 0 24px;
        }
        .hero-eyebrow {
            font-size: 14px;
            letter-spacing: 8px;
            color: var(--vermilion);
            font-weight: 500;
            margin-bottom: 32px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s ease 0.3s forwards;
        }
        .hero-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: clamp(48px, 10vw, 120px);
            color: var(--ink);
            line-height: 1.1;
            letter-spacing: 8px;
            margin-bottom: 32px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1.2s ease 0.5s forwards;
        }
        .hero-title span {
            display: inline-block;
            position: relative;
        }
        .hero-title .gold-char {
            color: var(--gold-dark);
            position: relative;
        }
        .hero-subtitle {
            font-size: clamp(16px, 2vw, 20px);
            color: var(--ink-light);
            line-height: 1.8;
            margin-bottom: 48px;
            font-weight: 300;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s ease 0.8s forwards;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .hero-stats {
            display: flex;
            justify-content: center;
            gap: 64px;
            margin-bottom: 56px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s ease 1.1s forwards;
        }
        .hero-stat {
            text-align: center;
        }
        .hero-stat-num {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 48px;
            color: var(--vermilion);
            line-height: 1;
            margin-bottom: 8px;
        }
        .hero-stat-label {
            font-size: 13px;
            color: var(--ink-light);
            letter-spacing: 2px;
        }
        .hero-cta {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s ease 1.4s forwards;
        }
        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            opacity: 0.6;
            z-index: 2;
        }
        .scroll-indicator-text {
            font-size: 12px;
            letter-spacing: 4px;
            color: var(--ink-light);
        }
        .scroll-indicator-line {
            width: 1px;
            height: 60px;
            background: linear-gradient(to bottom, var(--ink-light), transparent);
            position: relative;
            overflow: hidden;
        }
        .scroll-indicator-line::after {
            content: '';
            position: absolute;
            top: -20px;
            left: 0;
            width: 100%;
            height: 20px;
            background: var(--vermilion);
            animation: scrollDown 2s ease-in-out infinite;
        }
        @keyframes scrollDown {
            0% { top: -20px; }
            100% { top: 80px; }
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Seal decorations */
        .seal-deco {
            position: absolute;
            width: 80px;
            height: 80px;
            background: var(--vermilion);
            color: var(--paper);
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            opacity: 0.15;
            letter-spacing: 2px;
            writing-mode: vertical-rl;
        }

        @media (max-width: 768px) {
            .hero-stats { gap: 32px; }
            .hero-stat-num { font-size: 32px; }
            .hero-title { letter-spacing: 4px; }
        }

        /* ==================== Section Common ==================== */
        .section {
            padding: 120px 48px;
            position: relative;
        }
        .section-header {
            text-align: center;
            margin-bottom: 80px;
        }
        .section-eyebrow {
            font-size: 13px;
            letter-spacing: 6px;
            color: var(--vermilion);
            margin-bottom: 16px;
            font-weight: 500;
        }
        .section-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: clamp(36px, 5vw, 64px);
            color: var(--ink);
            letter-spacing: 4px;
            margin-bottom: 20px;
        }
        .section-subtitle {
            font-size: 16px;
            color: var(--ink-light);
            max-width: 560px;
            margin: 0 auto;
            line-height: 1.8;
        }
        .section-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
        }
        .section-divider-line {
            width: 60px;
            height: 1px;
            background: var(--gold);
        }
        .section-divider-dot {
            width: 8px;
            height: 8px;
            background: var(--vermilion);
            transform: rotate(45deg);
        }

        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .section { padding: 80px 20px; }
            .section-header { margin-bottom: 48px; }
        }

        /* ==================== Creature Gallery ==================== */
        .gallery {
            background: var(--paper);
        }
        .gallery-filter {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 60px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 10px 24px;
            border: 1px solid var(--gold);
            background: transparent;
            color: var(--ink-soft);
            font-family: inherit;
            font-size: 14px;
            cursor: none;
            border-radius: 2px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .filter-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--vermilion);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: -1;
        }
        .filter-btn:hover {
            color: var(--paper);
            border-color: var(--vermilion);
        }
        .filter-btn:hover::before { transform: scaleX(1); }
        .filter-btn.active {
            background: var(--ink);
            color: var(--paper);
            border-color: var(--ink);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 32px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .creature-card {
            position: relative;
            background: var(--paper-warm);
            border: 1px solid rgba(184, 147, 90, 0.3);
            overflow: hidden;
            cursor: none;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        box-shadow 0.4s ease;
            transform-style: preserve-3d;
            perspective: 1000px;
        }
        .creature-card:hover {
            box-shadow: 0 20px 60px rgba(26, 46, 58, 0.15), 0 8px 20px rgba(194, 58, 43, 0.1);
        }
        .creature-card-img-wrap {
            position: relative;
            width: 100%;
            padding-top: 100%;
            overflow: hidden;
            background: var(--paper-dark);
        }
        .creature-card-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        filter 0.6s ease;
            filter: sepia(0.1) saturate(0.9);
        }
        .creature-card:hover .creature-card-img {
            transform: scale(1.08);
            filter: sepia(0) saturate(1.05);
        }
        .creature-card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(26, 46, 58, 0.7) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .creature-card:hover .creature-card-overlay { opacity: 1; }

        .creature-card-seal {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 48px;
            height: 48px;
            background: var(--vermilion);
            color: var(--paper);
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            writing-mode: vertical-rl;
            letter-spacing: 1px;
            opacity: 0.9;
            transform: rotate(5deg);
            transition: transform 0.3s ease;
        }
        .creature-card:hover .creature-card-seal {
            transform: rotate(0deg) scale(1.1);
        }

        .creature-card-body {
            padding: 24px;
            position: relative;
        }
        .creature-card-name {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 28px;
            color: var(--ink);
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        .creature-card-origin {
            font-size: 13px;
            color: var(--gold-dark);
            letter-spacing: 2px;
            margin-bottom: 12px;
            font-weight: 500;
        }
        .creature-card-desc {
            font-size: 14px;
            color: var(--ink-light);
            line-height: 1.7;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .creature-card-tags {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .creature-tag {
            font-size: 11px;
            padding: 3px 10px;
            border: 1px solid var(--gold);
            color: var(--gold-dark);
            border-radius: 2px;
            letter-spacing: 1px;
        }
        .creature-tag.beast { border-color: var(--vermilion); color: var(--vermilion); }
        .creature-tag.bird { border-color: var(--ink-soft); color: var(--ink-soft); }
        .creature-tag.aquatic { border-color: #2A6F8A; color: #2A6F8A; }

        /* Ink splash hover effect */
        .ink-splash {
            position: absolute;
            pointer-events: none;
            z-index: 1;
        }

        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 16px;
            }
            .creature-card-body { padding: 16px; }
            .creature-card-name { font-size: 22px; }
        }

        /* ==================== Detail Modal ==================== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(26, 46, 58, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            padding: 24px;
            cursor: none;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background: var(--paper);
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: grid;
            grid-template-columns: 1fr 1fr;
        }
        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }
        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: var(--vermilion);
            color: var(--paper);
            border: none;
            font-size: 20px;
            cursor: none;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
            border-radius: 2px;
        }
        .modal-close:hover { transform: rotate(90deg); }

        .modal-image {
            position: relative;
            min-height: 400px;
            background: var(--paper-dark);
            overflow: hidden;
        }
        .modal-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: sepia(0.1);
        }
        .modal-image-decor {
            position: absolute;
            inset: 0;
            border: 8px solid var(--paper);
            pointer-events: none;
        }
        .modal-image-seal {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 60px;
            height: 60px;
            background: var(--vermilion);
            color: var(--paper);
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            writing-mode: vertical-rl;
            transform: rotate(-3deg);
        }

        .modal-info {
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .modal-origin {
            font-size: 13px;
            letter-spacing: 3px;
            color: var(--gold-dark);
            font-weight: 500;
        }
        .modal-name {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 56px;
            color: var(--ink);
            letter-spacing: 4px;
            line-height: 1;
        }
        .modal-pinyin {
            font-size: 14px;
            color: var(--ink-light);
            letter-spacing: 2px;
            margin-top: -12px;
        }
        .modal-classification {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .modal-divider {
            width: 40px;
            height: 2px;
            background: var(--vermilion);
            margin: 8px 0;
        }
        .modal-section-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--ink);
            letter-spacing: 2px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-section-title::before {
            content: '';
            width: 3px;
            height: 14px;
            background: var(--vermilion);
        }
        .modal-text {
            font-size: 14px;
            color: var(--ink-soft);
            line-height: 1.9;
        }
        .modal-text.classic {
            font-style: italic;
            color: var(--ink-light);
            border-left: 2px solid var(--gold);
            padding-left: 16px;
        }
        .modal-attributes {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .modal-attr {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .modal-attr-label {
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--gold-dark);
        }
        .modal-attr-value {
            font-size: 14px;
            color: var(--ink);
            font-weight: 500;
        }
        .typewriter-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: var(--vermilion);

        // ==================== Custom Cursor ====================
        function CustomCursor({ reducedMotion }) {
            const outerRef = useRef(null);
            const innerRef = useRef(null);
            const [hovered, setHovered] = useState(false);
            const [clicked, setClicked] = useState(false);
            const [ripples, setRipples] = useState([]);
            const mousePos = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
            const targetPos = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
            const innerPos = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
            const rafId = useRef(null);
            const visible = useRef(true);

            useEffect(() => {
                if (reducedMotion) return;

                const handleMouseMove = (e) => {
                    targetPos.current = { x: e.clientX, y: e.clientY };
                };

                const handleMouseEnter = (e) => {
                    if (e.target.closest('a, button, .creature-card, .filter-btn, .timeline-left, .timeline-right')) {
                        setHovered(true);
                    } else {
                        setHovered(false);
                    }
                };

                const handleMouseDown = (e) => {
                    setClicked(true);
                    const id = Date.now();
                    setRipples(prev => [...prev, { id, x: e.clientX, y: e.clientY }]);
                    setTimeout(() => {
                        setRipples(prev => prev.filter(r => r.id !== id));
                    }, 600);
                    setTimeout(() => setClicked(false), 150);
                };

                const animate = () => {
                    if (!visible.current) return;

                    // Spring physics for outer cursor (follows with delay)
                    const dx = targetPos.current.x - mousePos.current.x;
                    const dy = targetPos.current.y - mousePos.current.y;
                    mousePos.current.x += dx * 0.18;
                    mousePos.current.y += dy * 0.18;

                    // Inner cursor (more responsive)
                    innerPos.current.x += (targetPos.current.x - innerPos.current.x) * 0.45;
                    innerPos.current.y += (targetPos.current.y - innerPos.current.y) * 0.45;

                    if (outerRef.current) {
                        outerRef.current.style.left = mousePos.current.x + 'px';
                        outerRef.current.style.top = mousePos.current.y + 'px';
                    }
                    if (innerRef.current) {
                        innerRef.current.style.left = innerPos.current.x + 'px';
                        innerRef.current.style.top = innerPos.current.y + 'px';
                    }

                    rafId.current = requestAnimationFrame(animate);
                };

                const handleVisibility = () => {
                    visible.current = !document.hidden;
                    if (visible.current && !rafId.current) {
                        rafId.current = requestAnimationFrame(animate);
                    }
                };

                window.addEventListener('mousemove', handleMouseMove);
                window.addEventListener('mouseover', handleMouseEnter);
                window.addEventListener('mousedown', handleMouseDown);
                document.addEventListener('visibilitychange', handleVisibility);

                rafId.current = requestAnimationFrame(animate);

                return () => {
                    if (rafId.current) cancelAnimationFrame(rafId.current);
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('mouseover', handleMouseEnter);
                    window.removeEventListener('mousedown', handleMouseDown);
                    document.removeEventListener('visibilitychange', handleVisibility);
                };
            }, [reducedMotion]);

            if (reducedMotion) return null;

            return (
                <>
                    <div ref={outerRef} className={`cursor-outer ${hovered ? 'hover' : ''} ${clicked ? 'click' : ''}`} />
                    <div ref={innerRef} className={`cursor-inner ${hovered ? 'hover' : ''}`} />
                    {ripples.map(r => (
                        <div key={r.id} className="cursor-ripple" style={{ left: r.x + 'px', top: r.y + 'px' }} />
                    ))}
                </>
            );
        }

        // ==================== Ink Particle System ====================
        function ParticleCanvas({ reducedMotion }) {
            const canvasRef = useRef(null);
            const rafId = useRef(null);
            const visible = useRef(true);

            useEffect(() => {
                if (reducedMotion) return;
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');

                const resize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };
                resize();
                window.addEventListener('resize', resize);

                const particles = [];
                const particleCount = 35;

                for (let i = 0; i < particleCount; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        vx: (Math.random() - 0.5) * 0.3,
                        vy: (Math.random() - 0.5) * 0.2 - 0.1,
                        radius: Math.random() * 2.5 + 0.5,
                        opacity: Math.random() * 0.4 + 0.1,
                        color: Math.random() > 0.7 ? '#C23A2B' : '#1A2E3A',
                        pulseSpeed: Math.random() * 0.02 + 0.005,
                        pulsePhase: Math.random() * Math.PI * 2
                    });
                }

                let time = 0;

                const animate = () => {
                    if (!visible.current) return;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    time += 0.016;

                    particles.forEach(p => {
                        // Gentle drift
                        p.x += p.vx;
                        p.y += p.vy;

                        // Wrap around
                        if (p.x < -10) p.x = canvas.width + 10;
                        if (p.x > canvas.width + 10) p.x = -10;
                        if (p.y < -10) p.y = canvas.height + 10;
                        if (p.y > canvas.height + 10) p.y = -10;

                        // Pulse opacity
                        const pulse = Math.sin(time * p.pulseSpeed * 60 + p.pulsePhase) * 0.3 + 0.7;
                        const finalOpacity = p.opacity * pulse;

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = finalOpacity;
                        ctx.fill();

                        // Outer glow for larger particles
                        if (p.radius > 1.5) {
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, p.radius * 2.5, 0, Math.PI * 2);
                            const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 2.5);
                            gradient.addColorStop(0, p.color);
                            gradient.addColorStop(1, 'transparent');
                            ctx.fillStyle = gradient;
                            ctx.globalAlpha = finalOpacity * 0.3;
                            ctx.fill();
                        }
                    });

                    ctx.globalAlpha = 1;
                    rafId.current = requestAnimationFrame(animate);
                };

                const handleVisibility = () => {
                    visible.current = !document.hidden;
                    if (visible.current && !rafId.current) {
                        rafId.current = requestAnimationFrame(animate);
                    }
                };

                document.addEventListener('visibilitychange', handleVisibility);
                rafId.current = requestAnimationFrame(animate);

                return () => {
                    if (rafId.current) cancelAnimationFrame(rafId.current);
                    window.removeEventListener('resize', resize);
                    document.removeEventListener('visibilitychange', handleVisibility);
                };
            }, [reducedMotion]);

            if (reducedMotion) return null;
            return <canvas ref={canvasRef} className="particle-canvas" />;
        }

        // ==================== Spectrum Bars (Ambient) ====================
        function SpectrumBars({ reducedMotion }) {
            const barsRef = useRef(null);
            const rafId = useRef(null);
            const visible = useRef(true);

            useEffect(() => {
                if (reducedMotion) return;
                const container = barsRef.current;
                if (!container) return;

                const barCount = 18;
                const bars = [];
                for (let i = 0; i < barCount; i++) {
                    const bar = document.createElement('div');
                    bar.className = 'spectrum-bar';
                    container.appendChild(bar);
                    bars.push({
                        el: bar,
                        height: 4,
                        target: 4,
                        velocity: 0,
                        freq: Math.random() * 0.02 + 0.01,
                        phase: Math.random() * Math.PI * 2
                    });
                }

                let time = 0;

                const animate = () => {
                    if (!visible.current) return;
                    time += 0.016;

                    bars.forEach((b, i) => {
                        // Sine wave with different frequencies for organic feel
                        const base = 8 + Math.sin(time * b.freq * 60 + b.phase) * 12;
                        const noise = Math.sin(time * 3 + i * 0.5) * 4;
                        b.target = Math.max(3, base + noise + 8);

                        // Spring physics toward target
                        const spring = 0.06;
                        const damping = 0.75;
                        const force = (b.target - b.height) * spring;
                        b.velocity = (b.velocity + force) * damping;
                        b.height += b.velocity;

                        b.el.style.height = b.height + 'px';
                    });

                    rafId.current = requestAnimationFrame(animate);
                };

                const handleVisibility = () => {
                    visible.current = !document.hidden;
                    if (visible.current && !rafId.current) {
                        rafId.current = requestAnimationFrame(animate);
                    }
                };

                document.addEventListener('visibilitychange', handleVisibility);
                rafId.current = requestAnimationFrame(animate);

                return () => {
                    if (rafId.current) cancelAnimationFrame(rafId.current);
                    document.removeEventListener('visibilitychange', handleVisibility);
                };
            }, [reducedMotion]);

            if (reducedMotion) {
                return (
                    <div className="spectrum-bars">
                        {Array.from({ length: 18 }).map((_, i) => (
                            <div key={i} className="spectrum-bar" style={{ height: '8px' }} />
                        ))}
                    </div>
                );
            }
            return <div ref={barsRef} className="spectrum-bars" />;
        }

        // ==================== Number Counter ====================
        function NumberCounter({ value, duration = 2000, suffix = '' }) {
            const [display, setDisplay] = useState(0);
            const ref = useRef(null);
            const started = useRef(false);

            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting && !started.current) {
                            started.current = true;
                            const start = 0;
                            const startTime = performance.now();

                            const animate = (now) => {
                                const elapsed = now - startTime;
                                const progress = Math.min(elapsed / duration, 1);
                                // Ease out cubic
                                const eased = 1 - Math.pow(1 - progress, 3);
                                setDisplay(Math.floor(start + (value - start) * eased));

                                if (progress < 1) {
                                    requestAnimationFrame(animate);
                                }
                            };
                            requestAnimationFrame(animate);
                        }
                    });
                }, { threshold: 0.5 });

                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, [value, duration]);

            return <span ref={ref}>{display}{suffix}</span>;
        }

        // ==================== Reveal on Scroll ====================
        function useReveal() {
            useEffect(() => {
                const elements = document.querySelectorAll('.reveal');
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.15, rootMargin: '0px 0px -50px 0px' });

                elements.forEach(el => observer.observe(el));
                return () => observer.disconnect();
            }, []);
        }

        // ==================== Typewriter ====================
        function Typewriter({ text, speed = 30, trigger = false }) {
            const [displayed, setDisplayed] = useState('');
            const timeoutRef = useRef(null);
            const started = useRef(false);

            useEffect(() => {
                if (!trigger || started.current) return;
                started.current = true;
                let index = 0;

                const type = () => {
                    if (index < text.length) {
                        setDisplayed(text.slice(0, index + 1));
                        index++;
                        timeoutRef.current = setTimeout(type, speed + Math.random() * 20);
                    }
                };

                timeoutRef.current = setTimeout(type, 300);

                return () => {
                    if (timeoutRef.current) clearTimeout(timeoutRef.current);
                };
            }, [text, speed, trigger]);

            return (
                <span>
                    {displayed}
                    {displayed.length < text.length && <span className="typewriter-cursor" />}
                </span>
            );
        }

        // ==================== Creature Card with 3D Tilt ====================
        function CreatureCard({ creature, onClick, reducedMotion }) {
            const cardRef = useRef(null);
            const rafId = useRef(null);
            const target = useRef({ rx: 0, ry: 0, sx: 1, sy: 1 });
            const current = useRef({ rx: 0, ry: 0, sx: 1, sy: 1 });
            const isHovered = useRef(false);

            useEffect(() => {
                if (reducedMotion) return;
                const card = cardRef.current;
                if (!card) return;

                const handleMouseMove = (e) => {
                    if (!isHovered.current) return;
                    const rect = card.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / rect.width - 0.5;
                    const y = (e.clientY - rect.top) / rect.height - 0.5;

                    target.current.ry = x * 12;
                    target.current.rx = -y * 12;
                    target.current.sx = 1.02;
                    target.current.sy = 1.02;
                };

                const handleMouseEnter = () => {
                    isHovered.current = true;
                };

                const handleMouseLeave = () => {
                    isHovered.current = false;
                    target.current.rx = 0;
                    target.current.ry = 0;
                    target.current.sx = 1;
                    target.current.sy = 1;
                };

                // Spring physics for smooth tilt
                const animate = () => {
                    const spring = 0.12;
                    const damping = 0.8;

                    const dx = target.current.rx - current.current.rx;
                    const dy = target.current.ry - current.current.ry;
                    const dsx = target.current.sx - current.current.sx;
                    const dsy = target.current.sy - current.current.sy;

                    current.current.rx += dx * spring;
                    current.current.ry += dy * spring;
                    current.current.sx += dsx * spring;
                    current.current.sy += dsy * spring;

                    card.style.transform = `perspective(1000px) rotateX(${current.current.rx}deg) rotateY(${current.current.ry}deg) scale(${current.current.sx})`;

                    rafId.current = requestAnimationFrame(animate);
                };

                card.addEventListener('mousemove', handleMouseMove);
                card.addEventListener('mouseenter', handleMouseEnter);
                card.addEventListener('mouseleave', handleMouseLeave);

                rafId.current = requestAnimationFrame(animate);

                return () => {
                    if (rafId.current) cancelAnimationFrame(rafId.current);
                    card.removeEventListener('mousemove', handleMouseMove);
                    card.removeEventListener('mouseenter', handleMouseEnter);
                    card.removeEventListener('mouseleave', handleMouseLeave);
                };
            }, [reducedMotion]);

            return (
                <div
                    className="creature-card"
                    ref={cardRef}
                    onClick={() => onClick(creature)}
                    style={{ transformStyle: 'preserve-3d' }}
                >
                    <div className="creature-card-img-wrap">
                        <img
                            src={creature.image}
                            alt={creature.name}
                            className="creature-card-img"
                            loading="lazy"
                        />
                        <div className="creature-card-overlay" />
                        <div className="creature-card-seal pulse-seal">
                            {creature.name.charAt(0)}
                        </div>
                    </div>
                    <div className="creature-card-body">
                        <div className="creature-card-origin gloss-text">{creature.origin}</div>
                        <h3 className="creature-card-name">{creature.name}</h3>
                        <p className="creature-card-desc">{creature.description}</p>
                        <div className="creature-card-tags">
                            {creature.tags.slice(0, 3).map((tag, i) => (
                                <span key={i} className={`creature-tag ${creature.type}`}>{tag}</span>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

                                    <span className="modal-attr-value">{creature.ability}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ==================== Narrative Timeline ====================
        function Narrative() {
            return (
                <section className="narrative section" id="narrative">
                    <div className="section-header reveal">
                        <div className="section-eyebrow">流 传 沿 革</div>
                        <h2 className="section-title">千年图卷</h2>
                        <p className="section-subtitle">
                            自先秦至今，《山海经》历经数代传承，<br />
                            如一幅徐徐展开的长卷，绵延不绝。
                        </p>
                        <div className="section-divider">
                            <span className="section-divider-line" />
                            <span className="section-divider-dot" />
                            <span className="section-divider-line" />
                        </div>
                    </div>

                    <div className="scroll-timeline">
                        {TIMELINE.map((item, i) => (
                            <div key={i} className="timeline-item reveal">
                                <div className="timeline-left">
                                    {i % 2 === 0 && (
                                        <>
                                            <div className="timeline-year">{item.year}</div>
                                            <h3 className="timeline-title">{item.title}</h3>
                                            <p className="timeline-text">{item.text}</p>
                                        </>
                                    )}
                                </div>
                                <div className="timeline-marker" />
                                <div className="timeline-right">
                                    {i % 2 === 1 && (
                                        <>
                                            <div className="timeline-year">{item.year}</div>
                                            <h3 className="timeline-title">{item.title}</h3>
                                            <p className="timeline-text">{item.text}</p>
                                        </>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                </section>
            );
        }

        // ==================== Quote Section ====================
        function QuoteSection() {
            return (
                <section className="quote-section" id="quote">
                    <div className="quote-content reveal">
                        <div className="quote-mark">「</div>
                        <p className="quote-text">
                            山海经者，<br />
                            古之圣王之遗文也。
                        </p>
                        <div className="quote-author">—— 郭璞《山海经序》</div>
                        <div className="quote-author-deco">
                            <span className="quote-author-deco-line" />
                            <span style={{ color: 'var(--gold)' }}>❖</span>
                            <span className="quote-author-deco-line" />
                        </div>
                    </div>
                </section>
            );
        }

        // ==================== Footer ====================
        function Footer() {
            const scrollToTop = () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            return (
                <footer className="footer">
                    <div className="footer-content">
                        <div className="footer-brand">
                            <div className="footer-brand-title">
                                <div className="footer-brand-seal">山</div>
                                山海经异兽图鉴
                            </div>
                            <p className="footer-brand-desc">
                                以数字之笔，重现上古神话。<br />
                                集《山海经》所载异兽于一卷，探千年奇书之瑰奇。
                            </p>
                        </div>
                        <div className="footer-col">
                            <h4>图鉴分类</h4>
                            <ul>
                                <li><a href="#">瑞兽篇</a></li>
                                <li><a href="#">神鸟篇</a></li>
                                <li><a href="#">异鱼篇</a></li>
                                <li><a href="#">山神篇</a></li>
                            </ul>
                        </div>
                        <div className="footer-col">
                            <h4>关于</h4>
                            <ul>
                                <li><a href="#">创作缘起</a></li>
                                <li><a href="#">参考古籍</a></li>
                                <li><a href="#">画师团队</a></li>
                                <li><a href="#">联系我们</a></li>
                            </ul>
                        </div>
                        <div className="footer-col">
                            <h4>更多</h4>
                            <ul>
                                <li><a href="#">每日异兽</a></li>
                                <li><a href="#">图鉴收藏</a></li>
                                <li><a href="#">古籍阅览室</a></li>
                                <li><a href="#">神话地图</a></li>
                            </ul>
                        </div>
                    </div>
                    <div className="footer-bottom">
                        © 山海经异兽图鉴 · 数字神话博物馆 · 传承三千年东方想象
                    </div>

                    <button
                        className="back-to-top visible"
                        onClick={scrollToTop}
                        aria-label="回到顶部"
                    >
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                            <path d="M18 15l-6-6-6 6" />
                        </svg>
                    </button>
                </footer>
            );
        }

        // ==================== Main App ====================
        function App() {
            const [selectedCreature, setSelectedCreature] = useState(null);
            const [showBackToTop, setShowBackToTop] = useState(false);
            const [reducedMotion, setReducedMotion] = useState(false);

            useReveal();

            useEffect(() => {
                // Check prefers-reduced-motion
                const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
                setReducedMotion(mq.matches);
                const handler = (e) => setReducedMotion(e.matches);
                mq.addEventListener('change', handler);
                return () => mq.removeEventListener('change', handler);
            }, []);

            useEffect(() => {
                const handleScroll = () => {
                    setShowBackToTop(window.scrollY > 600);
                };
                window.addEventListener('scroll', handleScroll, { passive: true });
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            // Announce upgrade capability
            useEffect(() => {
                const announce = () => {
                    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
                };
                announce();
                if (document.readyState !== 'complete') {
                    window.addEventListener('load', announce, { once: true });
                }
            }, []);

            const scrollToTop = () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            return (
                <div className="app">
                    <CustomCursor reducedMotion={reducedMotion} />
                    <ParticleCanvas reducedMotion={reducedMotion} />

                    <Nav />
                    <Hero reducedMotion={reducedMotion} />
                    <Gallery onSelectCreature={setSelectedCreature} reducedMotion={reducedMotion} />
                    <Narrative />
                    <QuoteSection />
                    <Footer />

                    <CreatureModal
                        creature={selectedCreature}
                        onClose={() => setSelectedCreature(null)}
                        reducedMotion={reducedMotion}
                    />

                    <button
                        className={`back-to-top ${showBackToTop ? 'visible' : ''}`}
                        onClick={scrollToTop}
                        aria-label="回到顶部"
                    >
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                            <path d="M18 15l-6-6-6 6" />
                        </svg>
                    </button>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>

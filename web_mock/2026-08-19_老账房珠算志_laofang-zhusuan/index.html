<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="creative-medium" content="interactive-prototype">
<title>老賬房 · 珠算志 | 源記號流水賬</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700&family=Ma+Shan+Zheng&display=swap">
<style>
/* ========== 設計令牌 · DESIGN TOKENS ========== */
:root {
  --paper: #F2EBD8;
  --paper-2: #EDE4CB;
  --paper-shadow: #D9CDAE;
  --paper-stain: #C9B88B;
  --ink: #2A2419;
  --ink-soft: #4A3F2C;
  --ink-light: #7A6E55;
  --cinnabar: #B83A2E;
  --cinnabar-deep: #962A20;
  --cinnabar-light: #D45A4E;
  --walnut: #6B4A2B;
  --walnut-light: #8B6A3F;
  --walnut-mid: #5A3E22;
  --walnut-dark: #3D2A15;
  --walnut-deep: #2A1D0E;
  --old-gold: #B8964A;
  --old-gold-light: #D4B668;
  --brass: #C9A961;
  --brass-dark: #9E7E3A;

  --font-song: "Noto Serif SC", "Songti SC", "SimSun", "STSong", serif;
  --font-brush: "Ma Shan Zheng", "KaiTi", "STKaiti", "楷体", cursive;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
html { -webkit-text-size-adjust: 100%; }

body {
  background: var(--walnut-deep);
  font-family: var(--font-song);
  color: var(--ink);
  cursor: none;
  user-select: none;
  -webkit-user-select: none;
}

/* ========== 紙張紋理 SVG 濾鏡 ========== */
.paper-filters { position: absolute; width: 0; height: 0; overflow: hidden; }

/* ========== 自定義光標 · CUSTOM CURSOR ========== */
#cursor {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--cinnabar);
  border: 2px solid var(--paper);
  box-shadow: 0 0 0 1px var(--cinnabar-deep), 0 2px 6px rgba(0,0,0,0.35);
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  transition: width 0.15s ease, height 0.15s ease, background 0.15s ease;
  will-change: left, top;
}
#cursor.dragging {
  width: 20px;
  height: 20px;
  background: var(--old-gold);
  border-color: var(--walnut-dark);
}
#cursor::after {
  content: '';
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
}

/* ========== 算盤 · ABACUS ========== */
#abacus-wrap {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  padding: 16px 24px 12px;
  background: linear-gradient(180deg,
    var(--walnut-deep) 0%,
    var(--walnut-dark) 40%,
    transparent 100%);
  pointer-events: none;
}
#abacus-wrap > * { pointer-events: auto; }

.abacus-frame {
  position: relative;
  max-width: 720px;
  margin: 0 auto;
  padding: 12px 18px 14px;
  background:
    linear-gradient(180deg, var(--walnut-light) 0%, var(--walnut-mid) 45%, var(--walnut-dark) 100%);
  border-radius: 6px 6px 4px 4px;
  box-shadow:
    inset 0 1px 0 rgba(255,220,170,0.2),
    inset 0 -2px 4px rgba(0,0,0,0.4),
    0 4px 12px rgba(0,0,0,0.5),
    0 1px 0 var(--walnut-deep);
}
.abacus-frame::before,
.abacus-frame::after {
  content: '';
  position: absolute;
  top: 6px;
  bottom: 6px;
  width: 10px;
  background: linear-gradient(90deg, var(--walnut-mid), var(--walnut-light) 50%, var(--walnut-mid));
  border-radius: 2px;
  box-shadow: inset 1px 0 0 rgba(255,220,170,0.15), inset -1px 0 0 rgba(0,0,0,0.3);
}
.abacus-frame::before { left: 4px; }
.abacus-frame::after { right: 4px; }

.abacus-beam {
  position: absolute;
  left: 22px;
  right: 22px;
  top: 52%;
  height: 10px;
  background: linear-gradient(180deg,
    var(--walnut-dark) 0%,
    var(--walnut-mid) 30%,
    var(--walnut-light) 50%,
    var(--walnut-mid) 70%,
    var(--walnut-dark) 100%);
  border-radius: 2px;
  box-shadow:
    inset 0 1px 0 rgba(255,220,170,0.25),
    inset 0 -1px 0 rgba(0,0,0,0.4),
    0 1px 2px rgba(0,0,0,0.3);
  transform: translateY(-50%);
  z-index: 3;
}

.rods-container {
  position: relative;
  display: flex;
  justify-content: space-between;
  align-items: stretch;
  height: 110px;
  padding: 6px 14px;
  z-index: 2;
}

.rod {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.rod::before {
  content: '';
  position: absolute;
  top: 2px;
  bottom: 2px;
  left: 50%;
  width: 3px;
  transform: translateX(-50%);
  background: linear-gradient(90deg,
    var(--brass-dark) 0%,
    var(--brass) 35%,
    var(--old-gold-light) 50%,
    var(--brass) 65%,
    var(--brass-dark) 100%);
  border-radius: 2px;
  z-index: 0;
  box-shadow: 0 0 1px rgba(0,0,0,0.3);
}

.rod-section {
  position: relative;
  width: 100%;
  z-index: 1;
}
.rod-section.upper {
  height: 46px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}
.rod-section.lower {
  height: 54px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
}

.bead {
  width: 82%;
  max-width: 36px;
  aspect-ratio: 1 / 0.55;
  border-radius: 50% / 40%;
  background:
    radial-gradient(ellipse at 35% 30%, rgba(255,220,170,0.4) 0%, transparent 45%),
    linear-gradient(180deg, var(--walnut-light) 0%, var(--walnut-mid) 50%, var(--walnut-dark) 100%);
  box-shadow:
    inset 0 1px 1px rgba(255,220,170,0.35),
    inset 0 -2px 3px rgba(0,0,0,0.4),
    0 2px 4px rgba(0,0,0,0.3);
  cursor: grab;
  position: relative;
  margin: -1px 0;
  transition: box-shadow 0.15s ease;
  touch-action: none;
}
.bead::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 50%;
  width: 4px;
  height: 4px;
  background: var(--brass-dark);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
}
.bead:active { cursor: grabbing; }
.bead.active {
  box-shadow:
    inset 0 1px 1px rgba(255,220,170,0.25),
    inset 0 -2px 3px rgba(0,0,0,0.4),
    0 1px 2px rgba(0,0,0,0.2),
    0 0 6px rgba(212,182,104,0.0);
}

.abacus-readout {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 8px;
  padding: 0 8px 0 4px;
  font-family: var(--font-brush);
  font-size: 13px;
  color: var(--old-gold-light);
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  letter-spacing: 0.05em;
}
.abacus-readout .value-label { opacity: 0.7; }
.abacus-readout .value-num {
  font-family: var(--font-song);
  font-weight: 600;
  color: var(--paper);
  letter-spacing: 0.1em;
}
.abacus-readout .year-label {
  font-family: var(--font-brush);
  color: var(--cinnabar-light);
}

/* ========== 賬簿 · LEDGER BOOK ========== */
#ledger {
  position: absolute;
  top: 160px;
  left: 0;
  right: 0;
  bottom: 0;
  perspective: 1800px;
  overflow: hidden;
}

.book-spine {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 24px;
  transform: translateX(-50%);
  background:
    linear-gradient(90deg,
      transparent 0%,
      rgba(0,0,0,0.15) 40%,
      rgba(0,0,0,0.25) 50%,
      rgba(0,0,0,0.15) 60%,
      transparent 100%);
  z-index: 1;
  pointer-events: none;
}

.page {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 50%;
  writing-mode: vertical-rl;
  -webkit-writing-mode: vertical-rl;
  -ms-writing-mode: tb-rl;
  background: var(--paper);
  overflow: hidden;
  transition: transform 0.7s cubic-bezier(0.4, 0.0, 0.2, 1);
  transform-origin: left center;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  will-change: transform;
}
.page.right {
  right: 0;
  transform-origin: left center;
}
.page.left {
  left: 0;
  transform-origin: right center;
  transform: rotateY(180deg);
}
.page.flipping-right {
  animation: flipRight 0.7s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
  z-index: 10;
}
.page.flipping-left {
  animation: flipLeft 0.7s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
  z-index: 10;
}

@keyframes flipRight {
  0% { transform: rotateY(0deg); }
  100% { transform: rotateY(-180deg); }
}
@keyframes flipLeft {
  0% { transform: rotateY(-180deg); }
  100% { transform: rotateY(0deg); }
}

/* 紙張紋理覆蓋層 */
.page::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(184, 150, 74, 0.12) 0%, transparent 40%),
    radial-gradient(ellipse at 75% 70%, rgba(184, 150, 74, 0.08) 0%, transparent 35%),
    radial-gradient(ellipse at 60% 15%, rgba(139, 106, 63, 0.06) 0%, transparent 30%);
  pointer-events: none;
  z-index: 2;
}
/* 紙張紋理 - 通過 SVG 噪聲 */
.page::after {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0.4;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
  background-size: 120px 120px;
  pointer-events: none;
  z-index: 3;
}

/* 毛邊效果 */
.page-edge {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 20px;
  pointer-events: none;
  z-index: 4;
}
.page.right .page-edge {
  left: -10px;
  background: linear-gradient(90deg, transparent 0%, var(--paper) 100%);
  mask-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 20 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 0 L15 10 L18 20 L14 35 L17 50 L13 65 L16 80 L12 92 L15 100 L20 100 Z' fill='black'/%3E%3C/svg%3E");
  -webkit-mask-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 20 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 0 L15 10 L18 20 L14 35 L17 50 L13 65 L16 80 L12 92 L15 100 L20 100 Z' fill='black'/%3E%3C/svg%3E");
  mask-size: 100% 200px;
  -webkit-mask-size: 100% 200px;
  mask-repeat: repeat-y;
  -webkit-mask-repeat: repeat-y;
}
.page.left .page-edge {
  right: -10px;
  background: linear-gradient(-90deg, transparent 0%, var(--paper) 100%);
  transform: scaleX(-1);
}

/* 折痕 */
.fold-line {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(180deg,
    transparent 5%,
    rgba(107, 74, 43, 0.12) 20%,
    rgba(107, 74, 43, 0.08) 50%,
    rgba(107, 74, 43, 0.12) 80%,
    transparent 95%);
  pointer-events: none;
  z-index: 5;
}
.page.right .fold-line { right: 30%; }
.page.left .fold-line { left: 30%; }

/* 水漬 */
.water-stain {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(ellipse at center,
    rgba(139, 106, 63, 0.15) 0%,
    rgba(139, 106, 63, 0.08) 40%,
    transparent 70%);
  pointer-events: none;
  z-index: 6;
}

/* ========== 賬頁內容 · PAGE CONTENT ========== */
.page-content {
  position: absolute;
  inset: 24px 28px 28px 28px;
  display: flex;
  flex-direction: column-reverse;  /* 豎排：欄從右到左 */
  gap: 0;
  overflow: hidden;
  z-index: 7;
}

/* 封面頁 */
.cover-page {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 32px;
  padding: 40px 20px;
  text-align: center;
}
.cover-title {
  font-size: clamp(36px, 5vw, 56px);
  font-weight: 700;
  letter-spacing: 0.3em;
  color: var(--ink);
  writing-mode: vertical-rl;
  -webkit-writing-mode: vertical-rl;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.05);
  line-height: 1.3;
}
.cover-sub {
  font-size: clamp(14px, 1.8vw, 18px);
  color: var(--ink-soft);
  writing-mode: vertical-rl;
  -webkit-writing-mode: vertical-rl;
  letter-spacing: 0.2em;
  opacity: 0.85;
}
.cover-seal {
  width: 64px;
  height: 64px;
  border: 3px solid var(--cinnabar);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-brush);
  font-size: 18px;
  color: var(--cinnabar);
  writing-mode: vertical-rl;
  -webkit-writing-mode: vertical-rl;
  letter-spacing: 0.1em;
  transform: rotate(-5deg);
  opacity: 0.85;
  box-shadow: inset 0 0 0 1px var(--cinnabar-light), 1px 1px 0 rgba(184, 58, 46, 0.2);
}
.cover-year-range {
  font-size: 13px;
  color: var(--ink-light);
  letter-spacing: 0.15em;
  margin-top: 12px;
}
.cover-hint {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-brush);
  font-size: 13px;
  color: var(--ink-light);
  opacity: 0.6;
  animation: hintPulse 2.5s ease-in-out infinite;
}
@keyframes hintPulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 0.8; }
}

/* 賬目欄 */
.entry-column {
  height: 100%;
  padding: 4px 10px;
  border-right: 1px solid rgba(107, 74, 43, 0.15);
  display: flex;
  flex-direction: column;
  font-size: 13px;
  line-height: 1.9;
  color: var(--ink);
}
.page.left .entry-column { border-right: none; border-left: 1px solid rgba(107, 74, 43, 0.15); }

.entry-col-title {
  font-weight: 600;
  font-size: 12px;
  color: var(--ink-soft);
  padding-bottom: 6px;
  border-bottom: 1px solid rgba(107, 74, 43, 0.2);
  margin-bottom: 8px;
  letter-spacing: 0.1em;
  text-align: center;
}

.entry {
  padding: 3px 0;
  border-bottom: 1px dashed rgba(107, 74, 43, 0.1);
  position: relative;
}
.entry:last-child { border-bottom: none; }

.entry-date {
  font-size: 11px;
  color: var(--ink-light);
  margin-bottom: 2px;
}
.entry-desc {
  font-size: 12px;
  color: var(--ink);
  margin-bottom: 2px;
  line-height: 1.6;
}
.entry-type {
  display: inline-block;
  font-size: 10px;
  padding: 0 4px;
  border: 1px solid var(--ink-light);
  border-radius: 2px;
  color: var(--ink-soft);
  margin-right: 4px;
  vertical-align: middle;
}
.entry-type.shou { border-color: var(--cinnabar); color: var(--cinnabar); }
.entry-type.fu { border-color: var(--ink-soft); color: var(--ink-soft); }

.entry-amount {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
  margin-top: 2px;
}
.entry-amount .num {
  font-family: var(--font-brush);
  font-weight: normal;
}
.entry-note {
  font-family: var(--font-brush);
  font-size: 11px;
  color: var(--cinnabar);
  margin-top: 3px;
  line-height: 1.4;
  opacity: 0.9;
}
.entry-note.stamp {
  display: inline-block;
  border: 1.5px solid var(--cinnabar);
  padding: 1px 4px;
  border-radius: 2px;
  transform: rotate(-2deg);
  font-size: 10px;
}
.entry-note.circle::before {
  content: '○';
  margin-right: 2px;
}

/* 頁眉頁腳 */
.page-header {
  position: absolute;
  top: 8px;
  right: 12px;
  font-family: var(--font-brush);
  font-size: 14px;
  color: var(--cinnabar);
  writing-mode: horizontal-tb;
  z-index: 8;
  letter-spacing: 0.1em;
}
.page.left .page-header {
  right: auto;
  left: 12px;
}
.page-footer {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: var(--ink-light);
  writing-mode: horizontal-tb;
  z-index: 8;
  letter-spacing: 0.2em;
  opacity: 0.6;
}

/* 月份總結 */
.month-summary {
  margin-top: auto;
  padding-top: 8px;
  border-top: double rgba(107, 74, 43, 0.3);
  font-size: 11px;
  color: var(--ink-soft);
  line-height: 1.8;
}
.month-summary .total {
  font-family: var(--font-brush);
  font-size: 13px;
  color: var(--cinnabar);
  font-weight: normal;
}

/* 年標題大欄 */
.year-title-col {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 20px 12px 0 12px;
  border-right: 2px solid rgba(107, 74, 43, 0.3);
}
.page.left .year-title-col { border-right: none; border-left: 2px solid rgba(107, 74, 43, 0.3); }

.year-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--ink);
  writing-mode: vertical-rl;
  -webkit-writing-mode: vertical-rl;
  letter-spacing: 0.2em;
  margin-bottom: 16px;
  line-height: 1.4;
}
.year-sub {
  font-size: 11px;
  color: var(--ink-light);
  writing-mode: vertical-rl;
  -webkit-writing-mode: vertical-rl;
  letter-spacing: 0.15em;
  opacity: 0.7;
}
.year-seal {
  margin-top: 24px;
  width: 44px;
  height: 44px;
  border: 2px solid var(--cinnabar);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-brush);
  font-size: 14px;
  color: var(--cinnabar);
  opacity: 0.8;
  writing-mode: vertical-rl;
  -webkit-writing-mode: vertical-rl;
}

/* ========== 頁碼 / 翻頁提示 ========== */
.page-indicator {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
  z-index: 50;
  pointer-events: none;
}
.page-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--walnut-mid);
  border: 1px solid var(--old-gold);
  transition: all 0.3s ease;
}
.page-dot.active {
  background: var(--cinnabar);
  border-color: var(--cinnabar-light);
  transform: scale(1.3);
}

/* ========== 響應式 · RESPONSIVE ========== */
@media (max-width: 1024px) {
  .abacus-frame { max-width: 600px; }
  .rods-container { height: 95px; }
  .rod-section.upper { height: 40px; }
  .rod-section.lower { height: 46px; }
  #ledger { top: 140px; }
  .entry-column { font-size: 12px; padding: 4px 8px; }
  .entry-desc { font-size: 11px; }
  .year-title { font-size: 18px; }
}

@media (max-width: 768px) {
  #abacus-wrap { padding: 10px 12px 8px; }
  .abacus-frame {
    max-width: 480px;
    padding: 8px 12px 10px;
    border-radius: 4px;
  }
  .abacus-frame::before,
  .abacus-frame::after { width: 6px; top: 4px; bottom: 4px; }
  .abacus-frame::before { left: 2px; }
  .abacus-frame::after { right: 2px; }
  .rods-container { height: 78px; padding: 4px 10px; }
  .abacus-beam { left: 14px; right: 14px; height: 8px; }
  .rod-section.upper { height: 32px; }
  .rod-section.lower { height: 38px; }
  .bead { max-width: 26px; }
  .abacus-readout { font-size: 11px; margin-top: 6px; }
  #ledger { top: 118px; }
  .page-content { inset: 16px 14px 20px 14px; }
  .entry-column { font-size: 11px; padding: 4px 6px; }
  .entry-desc { font-size: 10px; }
  .year-title { font-size: 16px; letter-spacing: 0.15em; }
  .cover-title { font-size: 36px; }
}

@media (max-width: 480px) {
  #abacus-wrap { padding: 8px 8px 6px; }
  .abacus-frame { max-width: 100%; padding: 6px 8px 8px; }
  .rods-container { height: 65px; padding: 3px 6px; }
  .abacus-beam { left: 10px; right: 10px; height: 6px; }
  .rod-section.upper { height: 26px; }
  .rod-section.lower { height: 31px; }
  .bead { max-width: 20px; }
  .bead::after { width: 3px; height: 3px; }
  .abacus-readout { font-size: 10px; margin-top: 4px; padding: 0 4px 0 2px; }
  .abacus-readout .value-label { display: none; }
  #ledger { top: 100px; }
  .page-content { inset: 12px 10px 16px 10px; }
  .entry-column { font-size: 10px; padding: 3px 5px; }
  .entry-desc { font-size: 9px; line-height: 1.5; }
  .entry-date { font-size: 9px; }
  .entry-amount { font-size: 10px; }
  .entry-note { font-size: 9px; }
  .year-title { font-size: 14px; letter-spacing: 0.1em; }
  .year-seal { width: 34px; height: 34px; font-size: 11px; margin-top: 16px; }
  .cover-title { font-size: 28px; letter-spacing: 0.2em; }
  .cover-seal { width: 48px; height: 48px; font-size: 14px; }
  .page-dot { width: 6px; height: 6px; }
  #cursor { width: 12px; height: 12px; }
}

/* ========== 減弱動畫 · REDUCED MOTION ========== */
@media (prefers-reduced-motion: reduce) {
  .page { transition: none; }
  .page.flipping-right,
  .page.flipping-left { animation: none; }
  .bead { transition: none; }
  .cover-hint { animation: none; opacity: 0.7; }
  #cursor { transition: none; }
}

/* ========== 雜項 ========== */
.snap-flash {
  animation: snapFlash 0.25s ease-out;
}
@keyframes snapFlash {
  0% { filter: brightness(1); }
  30% { filter: brightness(1.3); }
  100% { filter: brightness(1); }
}

  const headerRight = $('headerRight');
  const headerLeft = $('headerLeft');
  const cursorEl = $('cursor');
  const pageIndicator = $('pageIndicator');

  // ========== 工具函數 ==========
  const upperBeadValue = function(rodIndex) { return rods[rodIndex].upper * 5; };
  const lowerBeadValue = function(rodIndex) { return rods[rodIndex].lower; };
  const rodValue = function(i) { return upperBeadValue(i) + lowerBeadValue(i); };

  function totalValue() {
    // 最右兩位作為年值，其餘裝飾
    // rod[ROD_COUNT-1] = 個位，rod[ROD_COUNT-2] = 十位
    const ones = rodValue(ROD_COUNT - 1);
    const tens = rodValue(ROD_COUNT - 2);
    return tens * 10 + ones;
  }

  function formatValue(val) {
    if (val === 0) return '〇';
    const digits = ['〇', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
    let str = '';
    if (val >= 10) {
      const t = Math.floor(val / 10);
      str += digits[t] + '十';
    }
    const o = val % 10;
    if (o > 0) str += digits[o];
    return str;
  }

  function findNearestTarget(val) {
    let nearest = TARGET_VALUES[0];
    let minDist = Math.abs(val - TARGET_VALUES[0]);
    for (let i = 1; i < TARGET_VALUES.length; i++) {
      const d = Math.abs(val - TARGET_VALUES[i]);
      if (d < minDist) { minDist = d; nearest = TARGET_VALUES[i]; }
    }
    return { value: nearest, distance: minDist };
  }

  function pageIndexForValue(val) {
    for (let i = 0; i < PAGES.length; i++) {
      if (PAGES[i].value === val) return i;
    }
    return 0;
  }

  // ========== 算盤渲染 · ABACUS RENDER ==========
  function renderAbacus() {
    rodsEl.innerHTML = '';
    for (let i = 0; i < ROD_COUNT; i++) {
      const rod = document.createElement('div');
      rod.className = 'rod';
      rod.dataset.index = i;

      // 上珠區
      const upperSection = document.createElement('div');
      upperSection.className = 'rod-section upper';
      const upperBead = document.createElement('div');
      upperBead.className = 'bead upper';
      upperBead.dataset.rod = i;
      upperBead.dataset.type = 'upper';
      upperBead.dataset.index = 0;
      if (rods[i].upper > 0) upperBead.classList.add('active');
      upperSection.appendChild(upperBead);

      // 下珠區
      const lowerSection = document.createElement('div');
      lowerSection.className = 'rod-section lower';
      for (let j = 3; j >= 0; j--) {  // 從上到下渲染，j=3 最上方
        const bead = document.createElement('div');
        bead.className = 'bead lower';
        bead.dataset.rod = i;
        bead.dataset.type = 'lower';
        bead.dataset.index = j;
        if (j < rods[i].lower) bead.classList.add('active');
        lowerSection.appendChild(bead);
      }

      rod.appendChild(upperSection);
      rod.appendChild(lowerSection);
      rodsEl.appendChild(rod);
    }
    updateBeadPositions();
    updateReadout();
  }

  function updateBeadPositions() {
    const rodEls = rodsEl.querySelectorAll('.rod');
    rodEls.forEach(function(rodEl, i) {
      const upperBead = rodEl.querySelector('.bead.upper');
      const upperSection = rodEl.querySelector('.rod-section.upper');
      const upperH = upperSection.clientHeight;
      const beadH = upperBead.offsetHeight || 20;

      if (beadDragging && beadDragging.rodIndex === i && beadDragging.type === 'upper') {
        // 拖動中，由 RAF 更新
      } else {
        if (rods[i].upper > 0) {
          upperBead.style.transform = 'translateY(' + (upperH - beadH) + 'px)';
        } else {
          upperBead.style.transform = 'translateY(0)';
        }
      }

      const lowerBeads = rodEl.querySelectorAll('.bead.lower');
      const lowerSection = rodEl.querySelector('.rod-section.lower');
      const lowerH = lowerSection.clientHeight;
      const lowerBeadH = lowerBeads[0] ? lowerBeads[0].offsetHeight : 18;
      const activeCount = rods[i].lower;

      lowerBeads.forEach(function(bead, idx) {
        // idx: 0=最上面那個下珠 (DOM 順序)，3=最下面
        const beadOrder = 3 - idx;  // 0=最下，3=最上
        if (beadDragging && beadDragging.rodIndex === i && beadDragging.type === 'lower' && beadOrder === beadDragging.beadIndex) {
          // 拖動中
        } else {
          if (beadOrder < activeCount) {
            // active - 堆在頂部
            const stackY = (activeCount - 1 - beadOrder) * (lowerBeadH - 4);
            bead.style.transform = 'translateY(' + (-lowerH + lowerBeadH + stackY) + 'px)';
          } else {
            // inactive - 堆在底部
            const stackY = (beadOrder - activeCount) * (lowerBeadH - 4);
            bead.style.transform = 'translateY(' + stackY + 'px)';
          }
        }
      });
    });
  }

  function updateReadout() {
    const val = totalValue();
    valueNumEl.textContent = formatValue(val);
    const nearest = findNearestTarget(val);
    const pageData = PAGES[pageIndexForValue(nearest.value)];
    if (pageData) {
      yearLabelEl.textContent = '源記號·' + pageData.yearLabel;
    }
  }

  // ========== 算盤拖動 · ABACUS DRAG ==========
  function setupAbacusDrag() {
    rodsEl.addEventListener('mousedown', onBeadStart);
    rodsEl.addEventListener('touchstart', onBeadStart, { passive: false });
    document.addEventListener('mousemove', onBeadMove);
    document.addEventListener('touchmove', onBeadMove, { passive: false });
    document.addEventListener('mouseup', onBeadEnd);
    document.addEventListener('touchend', onBeadEnd);
    document.addEventListener('touchcancel', onBeadEnd);
  }

  function getEventY(e) {
    if (e.touches && e.touches.length > 0) return e.touches[0].clientY;
    if (e.changedTouches && e.changedTouches.length > 0) return e.changedTouches[0].clientY;
    return e.clientY;
  }

  function onBeadStart(e) {
    const beadEl = e.target.closest('.bead');
    if (!beadEl) return;
    e.preventDefault();

    const rodIndex = parseInt(beadEl.dataset.rod, 10);
    const type = beadEl.dataset.type;
    const beadIndex = parseInt(beadEl.dataset.index, 10);

    const rect = beadEl.getBoundingClientRect();
    const sectionEl = beadEl.parentElement;
    const sectionRect = sectionEl.getBoundingClientRect();

    const y = getEventY(e);
    const offsetY = y - rect.top;

    beadDragging = {
      rodIndex: rodIndex,
      type: type,
      beadIndex: beadIndex,
      offsetY: offsetY,
      sectionTop: sectionRect.top,
      sectionHeight: sectionRect.height,
      beadHeight: rect.height,
      element: beadEl
    };

    cursorEl.classList.add('dragging');
    updateCursorDragState();

    if (!rafId && isVisible) rafId = requestAnimationFrame(dragLoop);
  }

  function onBeadMove(e) {
    if (!beadDragging) return;
    e.preventDefault();
    const y = getEventY(e);
    beadDragging.currentY = y - beadDragging.sectionTop - beadDragging.offsetY;
    beadDragging.currentY = Math.max(0, Math.min(beadDragging.sectionHeight - beadDragging.beadHeight, beadDragging.currentY));
  }

  function onBeadEnd() {
    if (!beadDragging) return;

    const { rodIndex, type, currentY, sectionHeight, beadHeight } = beadDragging;
    const midpoint = (sectionHeight - beadHeight) / 2;
    const pastMid = currentY >= midpoint;

    if (type === 'upper') {
      // 上珠：往下撥 = 靠攏橫檔 = active
      rods[rodIndex].upper = pastMid ? 1 : 0;
    } else {
      // 下珠：index 0 最下面那個，往上撥 = active
      // 下珠往上撥靠近橫檔即 active，需要計算：y 值越小越靠上
      const ratio = currentY / (sectionHeight - beadHeight);  // 0=最頂, 1=最底
      const isActive = ratio < 0.6;  // 越靠近頂部(橫檔)越 active

      // 根據所拖動珠子的位置，重新計算 active 數量
      // 下珠 beadIndex: 0=最底, 3=最頂
      // 如果被拖到 active 區域，則該珠及其以上都 active
      const newActive = isActive ? (beadDragging.beadIndex + 1) : beadDragging.beadIndex;
      rods[rodIndex].lower = Math.max(0, Math.min(4, newActive));
    }

    const el = beadDragging.element;
    el.classList.add('snap-flash');
    setTimeout(function() { el.classList.remove('snap-flash'); }, 250);

    // 播放輕微的"咔"聲（Web Audio）
    playSnapSound();

    beadDragging = null;
    cursorEl.classList.remove('dragging');
    updateBeadPositions();
    updateReadout();

    // 檢查是否需要翻頁
    checkFlipPage();
  }

  function dragLoop() {
    if (!isVisible || !beadDragging) {
      rafId = null;
      return;
    }

    if (beadDragging && typeof beadDragging.currentY === 'number') {
      const el = beadDragging.element;
      if (beadDragging.type === 'upper') {
        el.style.transform = 'translateY(' + beadDragging.currentY + 'px)';
      } else {
        // 下珠需要考慮堆疊
        el.style.transform = 'translateY(' + beadDragging.currentY + 'px)';
      }
      // 實時更新讀數
      updateValueFromDrag();
    }

    rafId = requestAnimationFrame(dragLoop);
  }

  function updateValueFromDrag() {
    // 根據拖動中的位置估算當前值
    if (!beadDragging) return;
    const { rodIndex, type, currentY, sectionHeight, beadHeight, beadIndex } = beadDragging;
    const midpoint = (sectionHeight - beadHeight) / 2;

    let savedUpper = rods[rodIndex].upper;
    let savedLower = rods[rodIndex].lower;

    if (type === 'upper') {
      rods[rodIndex].upper = currentY >= midpoint ? 1 : 0;
    } else {
      const ratio = currentY / (sectionHeight - beadHeight);
      const isActive = ratio < 0.6;
      rods[rodIndex].lower = Math.max(0, Math.min(4, isActive ? (beadIndex + 1) : beadIndex));
    }

    // 僅更新文字，不改變珠子狀態
    const val = totalValue();
    valueNumEl.textContent = formatValue(val);
    const nearest = findNearestTarget(val);
    const pageData = PAGES[pageIndexForValue(nearest.value)];
    if (pageData) {
      yearLabelEl.textContent = '源記號·' + pageData.yearLabel;
    }

    // 恢復
    rods[rodIndex].upper = savedUpper;
    rods[rodIndex].lower = savedLower;
  }

  function checkFlipPage() {
    const val = totalValue();
    const nearest = findNearestTarget(val);
    if (nearest.distance <= SNAP_THRESHOLD) {
      const targetIdx = pageIndexForValue(nearest.value);
      if (targetIdx !== currentPageIndex) {
        flipToPage(targetIdx);
      }
    }
  }

  // ========== 音頻 · AUDIO (輕微吸附聲) ==========
  let audioCtx = null;
  function playSnapSound() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.06);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    } catch (e) { /* 忽略音頻錯誤 */ }
  }

  // ========== 頁面渲染 · PAGE RENDERING ==========
  function renderPage(container, headerEl, pageData, side) {
    container.innerHTML = '';
    headerEl.textContent = '';

    if (pageData.type === 'cover') {
      const cover = document.createElement('div');
      cover.className = 'cover-page';
      cover.innerHTML =
        '<div class="cover-title">' + pageData.title + '</div>' +
        '<div class="cover-sub">' + pageData.subtitle + '</div>' +
        '<div class="cover-seal">源記<br>號印</div>' +
        '<div class="cover-year-range">民國元年至二十五年</div>' +
        '<div class="cover-hint">← 撥動算珠翻閱 →</div>';
      container.appendChild(cover);
      headerEl.textContent = '';
      return;
    }

    // 賬頁
    headerEl.textContent = pageData.year;

    // 年標題欄
    const titleCol = document.createElement('div');
    titleCol.className = 'year-title-col';
    titleCol.innerHTML =
      '<div class="year-title">' + pageData.year + '</div>' +
      '<div class="year-sub">' + pageData.yearGregorian + '</div>' +
      '<div class="year-seal">源記</div>';
    container.appendChild(titleCol);

    // 各月賬目欄
    for (let c = 0; c < pageData.columns.length; c++) {
      const col = pageData.columns[c];
      const colEl = document.createElement('div');
      colEl.className = 'entry-column';

      const title = document.createElement('div');
      title.className = 'entry-col-title';
      title.textContent = col.month;
      colEl.appendChild(title);

      for (let e = 0; e < col.entries.length; e++) {
        const entry = col.entries[e];
        const entryEl = document.createElement('div');
        entryEl.className = 'entry';

        const date = document.createElement('div');
        date.className = 'entry-date';
        date.textContent = entry.date;
        entryEl.appendChild(date);

        const desc = document.createElement('div');
        desc.className = 'entry-desc';
        const typeClass = entry.type === '收' ? 'shou' : 'fu';
        desc.innerHTML = '<span class="entry-type ' + typeClass + '">' + entry.type + '</span>' + entry.desc;
        entryEl.appendChild(desc);

        const amount = document.createElement('div');
        amount.className = 'entry-amount';
        amount.innerHTML = '紋銀<span class="num">' + entry.amount + '</span>';
        entryEl.appendChild(amount);

        if (entry.note) {
          const note = document.createElement('div');
          note.className = 'entry-note' + (entry.noteType ? ' ' + entry.noteType : '');
          note.textContent = entry.note;
          entryEl.appendChild(note);
        }

        colEl.appendChild(entryEl);
      }

      // 月結（最後一欄）
      if (c === pageData.columns.length - 1) {
        const summary = document.createElement('div');
        summary.className = 'month-summary';
        summary.innerHTML =
          '本年總結<br>' +
          '<span class="total">' + pageData.summary + '</span>';
        colEl.appendChild(summary);
      }

      container.appendChild(colEl);
    }
  }

  // ========== 翻頁 · PAGE FLIP ==========
  function flipToPage(targetIdx) {
    if (isFlipping || targetIdx === currentPageIndex) return;
    isFlipping = true;

    const direction = targetIdx > currentPageIndex ? 'forward' : 'backward';
    const targetPage = PAGES[targetIdx];

    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (reducedMotion) {
      renderPage(pageRightContent, headerRight, targetPage, 'right');
      currentPageIndex = targetIdx;
      isFlipping = false;
      updatePageIndicator();
      return;
    }

    // 向前翻：右頁往左翻（翻到更早的年？需要確定方向）
    // 數字越大 = 越後的年份 = 應該在左邊
    // 向右翻頁 = 從右往左翻 = 來到更晚的年份（更大 value）
    // 向左翻頁 = 從左往右翻 = 來到更早的年份（更小 value）
    //
    // 但是豎排書：從右往左翻頁，右邊是前面的內容
    // 所以：value 小的在右，value 大的在左
    // 前進（value 增大）= 書頁從右邊翻到左邊（翻開新頁在右）
    // 後退（value 減小）= 書頁從左邊翻回右邊

    if (direction === 'forward') {
      // 前進：當前右頁翻走（向左翻），新頁從左側出現為右頁
      // 先把新內容放到左頁
      renderPage(pageLeftContent, headerLeft, targetPage, 'left');
      pageLeftEl.style.zIndex = '5';
      pageRightEl.style.zIndex = '10';
      pageLeftEl.classList.remove('flipping-left');
      pageLeftEl.style.transform = 'rotateY(180deg)';

      // 右頁開始翻
      requestAnimationFrame(function() {
        pageRightEl.classList.add('flipping-right');
      });

      setTimeout(function() {
        // 動畫結束：把新內容放到右頁
        renderPage(pageRightContent, headerRight, targetPage, 'right');
        pageRightEl.classList.remove('flipping-right');
        pageRightEl.style.transform = 'rotateY(0deg)';
        pageLeftEl.style.transform = 'rotateY(180deg)';
        currentPageIndex = targetIdx;
        isFlipping = false;
        updatePageIndicator();
      }, 700);
    } else {
      // 後退：新頁從左翻回右邊
      renderPage(pageLeftContent, headerLeft, PAGES[currentPageIndex], 'left');
      pageLeftEl.style.zIndex = '10';
      pageRightEl.style.zIndex = '5';

      requestAnimationFrame(function() {
        pageLeftEl.classList.add('flipping-left');
      });

      setTimeout(function() {
        renderPage(pageRightContent, headerRight, targetPage, 'right');
        pageLeftEl.classList.remove('flipping-left');
        pageLeftEl.style.transform = 'rotateY(180deg)';
        pageRightEl.style.transform = 'rotateY(0deg)';
        currentPageIndex = targetIdx;
        isFlipping = false;
        updatePageIndicator();
      }, 700);
    }
  }

  // ========== 頁碼指示器 ==========
  function renderPageIndicator() {
    pageIndicator.innerHTML = '';
    for (let i = 0; i < PAGES.length; i++) {
      const dot = document.createElement('div');
      dot.className = 'page-dot' + (i === currentPageIndex ? ' active' : '');
      pageIndicator.appendChild(dot);
    }
  }
  function updatePageIndicator() {
    const dots = pageIndicator.querySelectorAll('.page-dot');
    dots.forEach(function(d, i) {
      d.classList.toggle('active', i === currentPageIndex);
    });
  }

  // ========== 自定義光標 · CUSTOM CURSOR ==========
  let cursorX = window.innerWidth / 2;
  let cursorY = window.innerHeight / 2;
  let targetX = cursorX;
  let targetY = cursorY;

  function setupCursor() {
    document.addEventListener('mousemove', function(e) {
      targetX = e.clientX;
      targetY = e.clientY;
    });
    document.addEventListener('touchmove', function(e) {
      if (e.touches.length > 0) {
        targetX = e.touches[0].clientX;
        targetY = e.touches[0].clientY;
      }
    }, { passive: true });

    // 初始位置：屏幕中央
    cursorEl.style.left = cursorX + 'px';
    cursorEl.style.top = cursorY + 'px';

    cursorLoop();
  }

  function cursorLoop() {
    if (!isVisible) return;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) {
      cursorEl.style.left = targetX + 'px';
      cursorEl.style.top = targetY + 'px';
    } else {
      cursorX += (targetX - cursorX) * 0.25;
      cursorY += (targetY - cursorY) * 0.25;
      cursorEl.style.left = cursorX + 'px';
      cursorEl.style.top = cursorY + 'px';
    }
    requestAnimationFrame(cursorLoop);
  }

  function updateCursorDragState() {
    // 拖動時光標變化已由 class 處理
  }

  // ========== 可見性管理 · VISIBILITY ==========
  document.addEventListener('visibilitychange', function() {
    isVisible = !document.hidden;
    if (isVisible) {
      if (beadDragging) rafId = requestAnimationFrame(dragLoop);
      cursorLoop();
    } else {
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }
  });

  // ========== 鍵盤導航 · KEYBOARD ==========
  document.addEventListener('keydown', function(e) {
    if (isFlipping) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      if (currentPageIndex < PAGES.length - 1) {
        snapAbacusToValue(PAGES[currentPageIndex + 1].value);
      }
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      if (currentPageIndex > 0) {
        snapAbacusToValue(PAGES[currentPageIndex - 1].value);
      }
    }
  });

  function snapAbacusToValue(targetVal) {
    // 直接設置算盤值並翻頁
    const tens = Math.floor(targetVal / 10);
    const ones = targetVal % 10;

    const tensRod = ROD_COUNT - 2;
    const onesRod = ROD_COUNT - 1;

    rods[tensRod].upper = tens >= 5 ? 1 : 0;
    rods[tensRod].lower = tens >= 5 ? (tens - 5) : tens;

    rods[onesRod].upper = ones >= 5 ? 1 : 0;
    rods[onesRod].lower = ones >= 5 ? (ones - 5) : ones;

    updateBeadPositions();
    updateReadout();

    const targetIdx = pageIndexForValue(targetVal);
    flipToPage(targetIdx);
  }

  // ========== 窗口大小變化 ==========
  let resizeTimer = null;
  window.addEventListener('resize', function() {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      updateBeadPositions();
    }, 100);
  });

  // ========== 頁面卸載清理 ==========
  window.addEventListener('beforeunload', function() {
    if (rafId) cancelAnimationFrame(rafId);
    if (resizeTimer) clearTimeout(resizeTimer);
    if (audioCtx) {
      try { audioCtx.close(); } catch (e) {}
    }
  });

  // ========== 初始化 · INIT ==========
  function init() {
    renderAbacus();
    renderPage(pageRightContent, headerRight, PAGES[0], 'right');
    renderPageIndicator();
    setupAbacusDrag();
    setupCursor();

    // 確保首次渲染後珠子位置正確
    setTimeout(function() {
      updateBeadPositions();
    }, 50);

    // 宣告可升級為全棧應用
    function announceUpgrade() {
      try {
        window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
      } catch (e) {}
    }
    announceUpgrade();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announceUpgrade, { once: true });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>

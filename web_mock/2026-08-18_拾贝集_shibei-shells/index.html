<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拾贝集 · 贝类标本艺术展</title>
  <meta name="creative-medium" content="interactive-prototype" />
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@300;400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=ZCOOL+XiaoWei&display=swap" />
  <style>
    :root {
      --coral: #E8846A;
      --coral-deep: #C96A50;
      --coral-light: #F2A88E;
      --teal: #2A5C5A;
      --teal-deep: #1A3E3C;
      --teal-light: #4A8C89;
      --cream: #F5EFE6;
      --cream-deep: #EAE0CF;
      --gold: #C9A25C;
      --ink: #2C2A26;
      --ink-soft: #5C5852;
      --ink-light: #8A857C;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: var(--cream);
      color: var(--ink);
      font-family: "Noto Sans SC", sans-serif;
      font-size: 16px;
      line-height: 1.7;
      overflow-x: hidden;
      cursor: none;
    }

    @media (max-width: 768px) {
      html, body { cursor: auto; }
      .cursor, .cursor-dot, .cursor-glow { display: none !important; }
    }

    /* Custom Cursor */
    .cursor {
      position: fixed;
      top: 0; left: 0;
      width: 36px; height: 36px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%);
      transition: width 0.3s cubic-bezier(0.23, 1, 0.32, 1),
                  height 0.3s cubic-bezier(0.23, 1, 0.32, 1),
                  border-color 0.3s ease,
                  background 0.3s ease;
      mix-blend-mode: difference;
    }
    .cursor-dot {
      position: fixed;
      top: 0; left: 0;
      width: 6px; height: 6px;
      background: var(--coral);
      border-radius: 50%;
      pointer-events: none;
      z-index: 100000;
      transform: translate(-50%, -50%);
      transition: transform 0.15s cubic-bezier(0.23, 1, 0.32, 1),
                  background 0.3s ease;
    }
    .cursor-glow {
      position: fixed;
      top: 0; left: 0;
      width: 120px; height: 120px;
      background: radial-gradient(circle, rgba(232,132,106,0.25) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99998;
      transform: translate(-50%, -50%);
      transition: opacity 0.3s ease;
    }
    .cursor.hover-interactive {
      width: 64px; height: 64px;
      border-color: var(--coral);
    }
    .cursor.hover-interactive .cursor-dot-inner {
      transform: scale(1.5);
    }

    /* Cursor ripple */
    .cursor-ripple {
      position: fixed;
      width: 20px; height: 20px;
      border: 2px solid var(--coral);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99997;
      transform: translate(-50%, -50%);
      opacity: 0;
      animation: rippleExpand 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }
    @keyframes rippleExpand {
      0% { width: 20px; height: 20px; opacity: 0.8; }
      100% { width: 120px; height: 120px; opacity: 0; }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .cursor, .cursor-dot, .cursor-glow { display: none !important; }
      html, body { cursor: auto; }
      * { animation: none !important; transition: none !important; }
    }

    /* Typography */
    .font-display { font-family: "ZCOOL XiaoWei", "Noto Serif SC", serif; }
    .font-serif { font-family: "Noto Serif SC", serif; }

    /* Navigation */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      padding: 24px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.4s ease, padding 0.4s ease, backdrop-filter 0.4s ease;
    }
    .nav.scrolled {
      background: rgba(245, 239, 230, 0.85);
      backdrop-filter: blur(20px);
      padding: 14px 48px;
      border-bottom: 1px solid rgba(42, 92, 90, 0.1);
    }
    .nav-logo {
      font-family: "ZCOOL XiaoWei", serif;
      font-size: 24px;
      letter-spacing: 4px;
      color: var(--ink);
      position: relative;
    }
    .nav-logo span {
      display: inline-block;
      color: var(--coral);
    }
    .nav-links {
      display: flex;
      gap: 36px;
      list-style: none;
    }
    .nav-links a {
      text-decoration: none;
      color: var(--ink);
      font-size: 14px;
      letter-spacing: 1px;
      position: relative;
      padding: 4px 0;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 0; height: 1px;
      background: var(--coral);
      transition: width 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .nav-links a:hover::after { width: 100%; }
    .nav-cta {
      padding: 10px 24px;
      background: var(--coral);
      color: var(--cream);
      border: none;
      font-size: 14px;
      letter-spacing: 2px;
      cursor: none;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .nav-cta::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.6s ease;
    }
    .nav-cta:hover::before { left: 100%; }

    .nav-mobile-btn {
      display: none;
      background: none;
      border: none;
      width: 32px; height: 32px;
      position: relative;
      cursor: pointer;
    }
    .nav-mobile-btn span {
      position: absolute;
      left: 0; width: 100%; height: 2px;
      background: var(--ink);
      transition: all 0.3s ease;
    }
    .nav-mobile-btn span:nth-child(1) { top: 8px; }
    .nav-mobile-btn span:nth-child(2) { top: 15px; }
    .nav-mobile-btn span:nth-child(3) { top: 22px; }
    .nav-mobile-btn.open span:nth-child(1) { top: 15px; transform: rotate(45deg); }
    .nav-mobile-btn.open span:nth-child(2) { opacity: 0; }
    .nav-mobile-btn.open span:nth-child(3) { top: 15px; transform: rotate(-45deg); }

    .nav-mobile-menu {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--cream);
      z-index: 999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 32px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .nav-mobile-menu.open { opacity: 1; pointer-events: all; }
    .nav-mobile-menu a {
      font-family: "ZCOOL XiaoWei", serif;
      font-size: 32px;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: 4px;
    }

    @media (max-width: 768px) {
      .nav { padding: 16px 20px; }
      .nav.scrolled { padding: 12px 20px; }
      .nav-links, .nav-cta { display: none; }
      .nav-mobile-btn { display: block; }
      .nav-mobile-menu { display: flex; }
    }

    /* Hero Section */
    .hero {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cream);
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('/spark/app/app_17cam3xge5n/runtime/api/v1/storage/object/bucket_aadkqndjhuals_static/static%2Faadkqm4nyxqig_ve_miaoda');
      background-size: cover;
      background-position: center;
      opacity: 0.25;
      filter: sepia(0.3) saturate(1.2);
      will-change: transform;
    }
    .hero-gradient {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 30% 70%, rgba(232,132,106,0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 30%, rgba(42,92,90,0.1) 0%, transparent 50%),
        linear-gradient(180deg, transparent 60%, var(--cream) 100%);
    }
    .hero-tidal {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 200px;
      pointer-events: none;
      overflow: hidden;
    }
    .hero-tidal-wave {
      position: absolute;
      bottom: -20px;
      width: 200%;
      height: 100px;
      background: var(--coral-light);
      opacity: 0.15;
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    }
    .hero-tidal-wave:nth-child(1) { animation: tidalSwell 8s ease-in-out infinite; }
    .hero-tidal-wave:nth-child(2) { animation: tidalSwell 8s ease-in-out infinite; animation-delay: -2s; opacity: 0.1; bottom: -40px; }
    .hero-tidal-wave:nth-child(3) { animation: tidalSwell 8s ease-in-out infinite; animation-delay: -4s; opacity: 0.06; bottom: -60px; }

    @keyframes tidalSwell {
      0%, 100% { transform: translateX(-25%) translateY(0) scaleY(1); }
      50% { transform: translateX(-25%) translateY(-30px) scaleY(1.2); }
    }

    .hero-content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 0 24px;
    }
    .hero-eyebrow {
      font-size: 13px;
      letter-spacing: 8px;
      color: var(--teal);
      text-transform: uppercase;
      margin-bottom: 24px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s cubic-bezier(0.23, 1, 0.32, 1) 0.3s forwards;
    }
    .hero-title {
      font-family: "ZCOOL XiaoWei", serif;
      font-size: clamp(72px, 12vw, 180px);
      line-height: 1;
      letter-spacing: 16px;
      color: var(--ink);
      margin-bottom: 12px;
      opacity: 0;
      transform: translateY(40px);
      animation: fadeUp 1.2s cubic-bezier(0.23, 1, 0.32, 1) 0.5s forwards;
    }
    .hero-title em {
      font-style: normal;
      color: var(--coral);
      position: relative;
    }
    .hero-subtitle {
      font-family: "Noto Serif SC", serif;
      font-size: clamp(16px, 2vw, 22px);
      color: var(--ink-soft);
      letter-spacing: 6px;
      margin-bottom: 48px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 1s cubic-bezier(0.23, 1, 0.32, 1) 0.8s forwards;
    }
    .hero-meta {
      display: flex;
      justify-content: center;
      gap: 48px;
      flex-wrap: wrap;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s cubic-bezier(0.23, 1, 0.32, 1) 1.1s forwards;
    }
    .hero-meta-item {
      text-align: center;
    }
    .hero-meta-label {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--ink-light);
      margin-bottom: 4px;
    }
    .hero-meta-value {
      font-family: "Noto Serif SC", serif;
      font-size: 18px;
      color: var(--teal);
      letter-spacing: 2px;
    }
    .hero-scroll {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0;
      animation: fadeIn 1s ease 2s forwards;
    }
    .hero-scroll span {
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--ink-light);
    }
    .hero-scroll-line {
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, var(--coral), transparent);
      position: relative;
      overflow: hidden;
    }
    .hero-scroll-line::after {
      content: '';
      position: absolute;
      top: -20px; left: 0;
      width: 100%; height: 20px;
      background: var(--coral);
      animation: scrollDown 2s ease-in-out infinite;
    }
    @keyframes scrollDown {
      0% { top: -20px; }
      100% { top: 100%; }
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* Floating shell decoration */
    .hero-shell-float {
      position: absolute;
      z-index: 5;
      opacity: 0.6;
      pointer-events: none;
    }
    .hero-shell-float.one {
      top: 20%; left: 8%;
      width: 60px; height: 60px;
      animation: shellFloat1 7s ease-in-out infinite;
    }
    .hero-shell-float.two {
      top: 60%; right: 10%;
      width: 80px; height: 80px;
      animation: shellFloat2 9s ease-in-out infinite;
    }
    @keyframes shellFloat1 {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }
    @keyframes shellFloat2 {
      0%, 100% { transform: translateY(0) rotate(8deg); }
      50% { transform: translateY(-30px) rotate(-6deg); }
    }

    /* Section base */
    .section {
      padding: 120px 48px;
      position: relative;
    }
    .section-inner {
      max-width: 1200px;
      margin: 0 auto;
    }
    .section-label {
      font-size: 12px;
      letter-spacing: 6px;
      color: var(--coral);
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .section-title {
      font-family: "ZCOOL XiaoWei", serif;
      font-size: clamp(36px, 5vw, 64px);
      line-height: 1.2;
      color: var(--ink);
      letter-spacing: 4px;
      margin-bottom: 24px;
    }

    @media (max-width: 768px) {
      .section { padding: 80px 20px; }
    }

    /* Foreword section */
    .foreword {
      background: var(--cream);
      position: relative;
    }
    .foreword-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: center;
    }
    .foreword-text p {
      font-size: 16px;
      line-height: 2;
      color: var(--ink-soft);
      margin-bottom: 20px;
    }
    .foreword-text p:first-of-type::first-letter {
      font-family: "ZCOOL XiaoWei", serif;
      font-size: 72px;
      float: left;
      line-height: 0.9;
      padding: 8px 16px 0 0;
      color: var(--coral);
    }
    .foreword-sign {
      margin-top: 40px;
      font-family: "Noto Serif SC", serif;
      font-size: 14px;
      color: var(--teal);
      letter-spacing: 3px;
    }
    .foreword-image {
      position: relative;
      aspect-ratio: 4/5;
      overflow: hidden;
    }
    .foreword-image img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .foreword-image:hover img { transform: scale(1.05); }
    .foreword-image::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 40%, rgba(232,132,106,0.2) 100%);
      z-index: 1;
      pointer-events: none;
    }
    .foreword-image-frame {
      position: absolute;
      top: -16px; left: -16px;
      right: 16px; bottom: 16px;
      border: 1px solid var(--gold);
      z-index: 2;
      pointer-events: none;
    }
    .foreword-image-number {
      position: absolute;
      bottom: 20px; right: 20px;
      z-index: 3;
      font-family: "ZCOOL XiaoWei", serif;
      font-size: 48px;
      color: var(--cream);
      opacity: 0.8;
    }

    @media (max-width: 768px) {
      .foreword-grid {
        grid-template-columns: 1fr;
        gap: 40px;
      }
    }

    /* Stats bar */
    .stats-bar {
      background: var(--teal-deep);
      padding: 60px 48px;
      position: relative;
      overflow: hidden;
    }
    .stats-bar::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(232,132,106,0.1) 0%, transparent 40%),
        radial-gradient(ellipse at 80% 50%, rgba(201,162,92,0.08) 0%, transparent 40%);
    }
    .stats-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 40px;
      position: relative;
    }
    .stat-item {
      text-align: center;
    }
    .stat-number {
      font-family: "ZCOOL XiaoWei", serif;
      font-size: clamp(40px, 5vw, 72px);
      color: var(--cream);
      line-height: 1;
      margin-bottom: 8px;
    }
    .stat-number span {
      font-size: 0.5em;
      color: var(--coral-light);
      margin-left: 4px;
    }
    .stat-label {
      font-size: 13px;
      color: var(--teal-light);
      letter-spacing: 3px;
    }

    @media (max-width: 768px) {
      .stats-bar { padding: 40px 20px; }
      .stats-inner {
        grid-template-columns: repeat(2, 1fr);
        gap: 32px 20px;
      }
    }

    /* Gallery section */
    .gallery {
      background: var(--cream);
    }
    .gallery-header {
      text-align: center;
      margin-bottom: 80px;
    }
    .gallery-filter {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 32px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 8px 24px;
      background: transparent;
      border: 1px solid var(--ink-light);
      color: var(--ink-soft);
      font-size: 13px;
      letter-spacing: 2px;
      cursor: none;
      transition: all 0.3s ease;
      font-family: "Noto Sans SC", sans-serif;
    }
    .filter-btn:hover {
      border-color: var(--coral);
      color: var(--coral);
    }
    .filter-btn.active {
      background: var(--coral);
      border-color: var(--coral);
      color: var(--cream);
    }

    .specimen-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
    }
    .specimen-card {
      position: relative;
      cursor: none;
      overflow: hidden;
      background: var(--cream-deep);
      transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      will-change: transform;
    }
    .specimen-card-image {
      position: relative;
      aspect-ratio: 4/5;
      overflow: hidden;
    }
    .specimen-card-image img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .specimen-card:hover .specimen-card-image img {
      transform: scale(1.08);
    }
    /* Sheen sweep effect */
    .specimen-sheen {
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
      transform: skewX(-20deg);
      pointer-events: none;
      transition: left 0.8s ease;
    }
    .specimen-card:hover .specimen-sheen {
      left: 150%;
    }
    .specimen-card-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 24px;
      background: linear-gradient(to top, rgba(26,62,60,0.9), transparent);
      color: var(--cream);
      transform: translateY(60%);
      transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .specimen-card:hover .specimen-card-overlay {
      transform: translateY(0);
    }
    .specimen-num {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--coral-light);
      margin-bottom: 4px;
    }
    .specimen-name {
      font-family: "ZCOOL XiaoWei", serif;
      font-size: 24px;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }
    .specimen-latin {
      font-size: 12px;
      font-style: italic;
      color: var(--teal-light);
      margin-bottom: 12px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.4s ease 0.1s;
    }
    .specimen-card:hover .specimen-latin {
      opacity: 1;
      transform: translateY(0);
    }
    .specimen-desc {
      font-size: 13px;
      line-height: 1.6;
      color: rgba(245,239,230,0.75);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.4s ease 0.2s;
    }
    .specimen-card:hover .specimen-desc {
      opacity: 1;
      transform: translateY(0);
    }
    .specimen-tag {
      position: absolute;
      top: 16px; right: 16px;
      padding: 4px 10px;
      background: rgba(245,239,230,0.9);
      color: var(--teal-deep);
      font-size: 10px;
      letter-spacing: 2px;
      z-index: 2;
    }

    @media (max-width: 768px) {
      .specimen-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }

    /* Zones section */
    .zones {
      background: var(--teal-deep);
      position: relative;
      overflow: hidden;
    }
    .zones::before {
      content: '';
      position: absolute;
      top: -200px; right: -200px;
      width: 600px; height: 600px;
      border-radius: 50%;
      border: 1px solid rgba(232,132,106,0.1);
    }
    .zones::after {
      content: '';
      position: absolute;
      bottom: -300px; left: -100px;
      width: 500px; height: 500px;
      border-radius: 50%;
      border: 1px solid rgba(201,162,92,0.08);
    }
    .zones-header {
      text-align: center;
      margin-bottom: 80px;
      position: relative;
      z-index: 1;
    }
    .zones-header .section-label { color: var(--coral-light); }
    .zones-header .section-title { color: var(--cream); }
    .zones-header p {
      color: var(--teal-light);
      max-width: 600px;
      margin: 0 auto;
      font-size: 15px;
    }

    .zones-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      position: relative;
      z-index: 1;
    }
    .zone-item {
      display: grid;
      grid-template-columns: 80px 1fr 120px 200px;
      gap: 32px;
      align-items: center;
      padding: 32px 24px;
      background: rgba(42, 92, 90, 0.3);

    const IMG_SCALLOP = '/spark/app/app_17cam3xge5n/runtime/api/v1/storage/object/bucket_aadkqndjhuals_static/static%2Faadkqm3nu4ecg_ve_miaoda';

    // === 标本数据 ===
    const specimens = [

      { id: 'S-004', name: '长刺骨螺', latin: 'Murex pecten', category: '骨螺科', desc: '掠食性海螺的精密武器，百根尖刺构成的防御工事，令人叹为观止。', img: IMG_MUREX, tag: '珍稀' },
      { id: 'S-005', name: '海扇扇贝', latin: 'Pectinidae', category: '双壳类', desc: '放射状肋纹如折扇舒展，珊瑚色渐变至珍珠白的完美对称。', img: IMG_SCALLOP, tag: '典藏' },
      { id: 'S-006', name: '鹦鹉螺（剖）', latin: 'Nautilus pompilius', category: '头足类', desc: '纵切面展示房室结构，从胚壳到住室，记录每一次生长的螺旋史诗。', img: IMG_NAUTILUS, tag: '解剖' },
    ];

    const categories = ['全部', '头足类', '腹足类', '宝螺科', '双壳类'];

    const zones = [
      { num: 'I', title: '潮汐之境', desc: '海岸潮间带生态还原，近距离观察贝类的真实栖息环境', count: 48 },
      { num: 'II', title: '螺旋秘境', desc: '从鹦鹉螺到翁戎螺，探索腹足类的几何之美与演化奇迹', count: 126 },
      { num: 'III', title: '深海遗珍', desc: '千米以下的黑暗世界，发光贝类与未知物种的罕见标本', count: 37 },
      { num: 'IV', title: '贝饰人文', desc: '贝币、螺钿、贝雕——贝壳与人类文明交织的千年故事', count: 89 },
    ];

    // === 自定义光标组件 ===
    function CustomCursor() {
      const cursorRef = useRef(null);
      const dotRef = useRef(null);
      const glowRef = useRef(null);
      const posRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
      const targetRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
      const rafRef = useRef(null);
      const hoverRef = useRef(false);
      const visibleRef = useRef(true);

      useEffect(() => {
        // Reduced motion 检查
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        // 移动端跳过
        if (window.innerWidth <= 768) return;

        const onMouseMove = (e) => {
          targetRef.current.x = e.clientX;
          targetRef.current.y = e.clientY;
        };

        // 弹簧物理积分器
        const spring = { x: 0, y: 0, vx: 0, vy: 0 };
        const stiffness = 0.15;
        const damping = 0.8;

        const animate = () => {
          if (!visibleRef.current) {
            rafRef.current = requestAnimationFrame(animate);
            return;
          }
          const dx = targetRef.current.x - posRef.current.x;
          const dy = targetRef.current.y - posRef.current.y;

          // 外圈 - 弹簧跟随
          spring.vx = (spring.vx + dx * stiffness) * damping;
          spring.vy = (spring.vy + dy * stiffness) * damping;
          posRef.current.x += spring.vx;
          posRef.current.y += spring.vy;

          if (cursorRef.current) {
            cursorRef.current.style.left = posRef.current.x + 'px';
            cursorRef.current.style.top = posRef.current.y + 'px';
          }
          if (glowRef.current) {
            glowRef.current.style.left = posRef.current.x + 'px';
            glowRef.current.style.top = posRef.current.y + 'px';
          }
          // 内点 - 直接跟随
          if (dotRef.current) {
            dotRef.current.style.left = targetRef.current.x + 'px';
            dotRef.current.style.top = targetRef.current.y + 'px';
          }

          rafRef.current = requestAnimationFrame(animate);
        };

        // 悬停检测
        const onMouseOver = (e) => {
          const interactive = e.target.closest('a, button, [data-interactive], .specimen-card, .zone-item, input, select');
          if (interactive && !hoverRef.current) {
            hoverRef.current = true;
            if (cursorRef.current) cursorRef.current.classList.add('hover-interactive');
          }
        };
        const onMouseOut = (e) => {
          const interactive = e.target.closest('a, button, [data-interactive], .specimen-card, .zone-item, input, select');
          if (interactive && hoverRef.current) {
            hoverRef.current = false;
            if (cursorRef.current) cursorRef.current.classList.remove('hover-interactive');
          }
        };

        // 点击涟漪
        const onClick = (e) => {
          const ripple = document.createElement('div');
          ripple.className = 'cursor-ripple';
          ripple.style.left = e.clientX + 'px';
          ripple.style.top = e.clientY + 'px';
          document.body.appendChild(ripple);
          setTimeout(() => ripple.remove(), 800);
        };

        // 可见性暂停
        const onVisibilityChange = () => {
          visibleRef.current = !document.hidden;
        };

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseover', onMouseOver);
        window.addEventListener('mouseout', onMouseOut);
        window.addEventListener('click', onClick);
        document.addEventListener('visibilitychange', onVisibilityChange);

        rafRef.current = requestAnimationFrame(animate);

        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseover', onMouseOver);
          window.removeEventListener('mouseout', onMouseOut);
          window.removeEventListener('click', onClick);
          document.removeEventListener('visibilitychange', onVisibilityChange);
        };
      }, []);

      return (
        <>
          <div ref={glowRef} className="cursor-glow"></div>
          <div ref={cursorRef} className="cursor"></div>
          <div ref={dotRef} className="cursor-dot"></div>
        </>
      );
    }

    // === 数字计数动画 Hook ===
    function useCountUp(target, duration = 2000, start = false) {
      const [value, setValue] = useState(0);
      const rafRef = useRef(null);
      const startTimeRef = useRef(null);
      const startedRef = useRef(false);

      useEffect(() => {
        if (!start || startedRef.current) return;
        startedRef.current = true;
        startTimeRef.current = null;

        const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

        const animate = (ts) => {
          if (!startTimeRef.current) startTimeRef.current = ts;
          const elapsed = ts - startTimeRef.current;
          const progress = Math.min(elapsed / duration, 1);
          const eased = easeOutCubic(progress);
          setValue(Math.floor(target * eased));
          if (progress < 1) {
            rafRef.current = requestAnimationFrame(animate);
          }
        };

        rafRef.current = requestAnimationFrame(animate);

        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
        };
      }, [target, duration, start]);

      return value;
    }

    // === 滚动渐入 Hook ===
    function useReveal() {
      useEffect(() => {
        const elements = document.querySelectorAll('.reveal');
        if (!elements.length) return;

        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1, rootMargin: '0px 0px -60px 0px' });

        elements.forEach(el => observer.observe(el));
        return () => observer.disconnect();
      }, []);
    }

        return () => observer.disconnect();

    // === 标本卡片 3D 倾斜 ===
    function SpecimenCard({ item, index }) {
      const cardRef = useRef(null);
      const rafRef = useRef(null);
      const currentRef = useRef({ rx: 0, ry: 0 });
      const targetRef = useRef({ rx: 0, ry: 0 });

      useEffect(() => {
        const card = cardRef.current;
        if (!card) return;

        const onMouseMove = (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const px = (x / rect.width - 0.5) * 2;
          const py = (y / rect.height - 0.5) * 2;
          targetRef.current.rx = -py * 8;
          targetRef.current.ry = px * 8;
        };

        const onMouseLeave = () => {
          targetRef.current.rx = 0;
          targetRef.current.ry = 0;
        };

        // 阻尼动画
        const animate = () => {
          const dx = targetRef.current.ry - currentRef.current.ry;
          const dy = targetRef.current.rx - currentRef.current.rx;
          currentRef.current.ry += dx * 0.12;
          currentRef.current.rx += dy * 0.12;
          if (card) {
            card.style.transform = `perspective(1000px) rotateX(${currentRef.current.rx}deg) rotateY(${currentRef.current.ry}deg) translateY(-4px)`;
          }
          rafRef.current = requestAnimationFrame(animate);
        };

        card.addEventListener('mousemove', onMouseMove);
        card.addEventListener('mouseleave', onMouseLeave);
        rafRef.current = requestAnimationFrame(animate);

        return () => {
          card.removeEventListener('mousemove', onMouseMove);
          card.removeEventListener('mouseleave', onMouseLeave);
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
        };
      }, []);

      return (
        <div
          className="specimen-card reveal"
          ref={cardRef}
          style={{ transitionDelay: `${index * 0.1}s` }}
          data-interactive
        >
          <div className="specimen-tag">{item.tag}</div>
          <div className="specimen-card-image">
            <img src={item.img} alt={item.name} />
            <div className="specimen-sheen"></div>

              <div className="specimen-latin">{item.latin}</div>
              <div className="specimen-desc">{item.desc}</div>
            </div>
          </div>
        </div>
      );
    }

    // === 打字机效果组件 ===
    function Typewriter({ text, speed = 80, delay = 0 }) {
      const [displayed, setDisplayed] = useState('');
      const [started, setStarted] = useState(false);
      const ref = useRef(null);

      useEffect(() => {
        const el = ref.current;
        if (!el) return;

        const observer = new IntersectionObserver((entries) => {
          if (entries[0].isIntersecting && !started) {
            setTimeout(() => setStarted(true), delay);
            observer.disconnect();
          }
        }, { threshold: 0.5 });

        observer.observe(el);
        return () => observer.disconnect();
      }, [delay, started]);

      useEffect(() => {
        if (!started) return;
        let i = 0;
        let timer = null;

        const type = () => {
          if (i < text.length) {
            setDisplayed(text.slice(0, i + 1));
            i++;
            timer = setTimeout(type, speed + Math.random() * 40);
          }
        };
        type();

        return () => { if (timer) clearTimeout(timer); };
      }, [text, speed, started]);

      return (
        <span ref={ref}>
          {displayed}
          {started && displayed.length < text.length && <span className="type-cursor"></span>}
        </span>
      );
    }

    // === 英雄区视差 ===
    function HeroParallax() {
      const bgRef = useRef(null);
      const shell1Ref = useRef(null);
      const shell2Ref = useRef(null);
      const rafRef = useRef(null);
      const mouseRef = useRef({ x: 0, y: 0 });
      const currentRef = useRef({ x: 0, y: 0 });

      useEffect(() => {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        const onMouseMove = (e) => {
          mouseRef.current.x = (e.clientX / window.innerWidth - 0.5) * 2;
          mouseRef.current.y = (e.clientY / window.innerHeight - 0.5) * 2;
        };

        const animate = () => {
          const dx = mouseRef.current.x - currentRef.current.x;
          const dy = mouseRef.current.y - currentRef.current.y;
          currentRef.current.x += dx * 0.05;
          currentRef.current.y += dy * 0.05;

          if (bgRef.current) {
            bgRef.current.style.transform = `translate(${currentRef.current.x * 15}px, ${currentRef.current.y * 10}px) scale(1.05)`;
          }
          if (shell1Ref.current) {
            shell1Ref.current.style.transform = `translate(${currentRef.current.x * 30}px, ${currentRef.current.y * 20}px)`;
          }
          if (shell2Ref.current) {
            shell2Ref.current.style.transform = `translate(${currentRef.current.x * -25}px, ${currentRef.current.y * -15}px)`;
          }

          rafRef.current = requestAnimationFrame(animate);
        };

        window.addEventListener('mousemove', onMouseMove);
        rafRef.current = requestAnimationFrame(animate);

        const onVisibilityChange = () => {
          if (document.hidden && rafRef.current) {
            cancelAnimationFrame(rafRef.current);
            rafRef.current = null;
          } else if (!document.hidden && !rafRef.current) {
            rafRef.current = requestAnimationFrame(animate);
          }
        };
        document.addEventListener('visibilitychange', onVisibilityChange);

        return () => {
          window.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('visibilitychange', onVisibilityChange);
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
        };
      }, []);

      return { bgRef, shell1Ref, shell2Ref };
    }

    // === 磁性按钮效果 ===
    function MagneticButton({ children, className, onClick }) {
      const btnRef = useRef(null);
      const rafRef = useRef(null);
      const targetRef = useRef({ x: 0, y: 0 });
      const currentRef = useRef({ x: 0, y: 0 });

      useEffect(() => {
        const btn = btnRef.current;
        if (!btn) return;

        let isOver = false;

        const onMouseMove = (e) => {
          const rect = btn.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const dx = e.clientX - cx;
          const dy = e.clientY - cy;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const maxDist = 80;

          if (dist < maxDist) {
            // 反平方引力
            const strength = (1 - dist / maxDist) * 0.4;
            targetRef.current.x = dx * strength;
            targetRef.current.y = dy * strength;
            isOver = true;
          } else {
            targetRef.current.x = 0;
            targetRef.current.y = 0;
            isOver = false;
          }
        };

        const animate = () => {
          const dx = targetRef.current.x - currentRef.current.x;
          const dy = targetRef.current.y - currentRef.current.y;
          currentRef.current.x += dx * 0.2;
          currentRef.current.y += dy * 0.2;

          if (btn) {
            btn.style.transform = `translate(${currentRef.current.x}px, ${currentRef.current.y}px)`;
          }
          rafRef.current = requestAnimationFrame(animate);
        };

        document.addEventListener('mousemove', onMouseMove);
        rafRef.current = requestAnimationFrame(animate);

        return () => {
          document.removeEventListener('mousemove', onMouseMove);
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
        };
      }, []);

      return (
        <button ref={btnRef} className={className} onClick={onClick} data-interactive>
          {children}
        </button>
      );
    }

    // === 滚动驱动的波浪粒子 ===
    function ScrollParticles() {
      const canvasRef = useRef(null);
      const rafRef = useRef(null);
      const particlesRef = useRef([]);

      useEffect(() => {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const resize = () => {
          canvas.width = window.innerWidth;
          canvas.height = 200;
        };
        resize();
        window.addEventListener('resize', resize);

        // 初始化粒子
        const count = 40;
        particlesRef.current = [];
        for (let i = 0; i < count; i++) {
          particlesRef.current.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            baseY: Math.random() * canvas.height,
            size: Math.random() * 3 + 1,
            speed: Math.random() * 0.5 + 0.2,
            offset: Math.random() * Math.PI * 2,
            opacity: Math.random() * 0.4 + 0.2,
          });
        }

        let scrollY = 0;
        const onScroll = () => { scrollY = window.scrollY; };
        window.addEventListener('scroll', onScroll, { passive: true });

        let time = 0;
        const animate = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          time += 0.01;

          particlesRef.current.forEach(p => {
            // 基于滚动的正弦波运动
            const wave = Math.sin(time * p.speed + p.offset) * 20;
            const scrollWave = Math.sin(scrollY * 0.002 + p.offset) * 10;
            p.y = p.baseY + wave + scrollWave;
            p.x += Math.sin(time * 0.5 + p.offset) * 0.3;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(232, 132, 106, ${p.opacity})`;
            ctx.fill();
          });

          rafRef.current = requestAnimationFrame(animate);
        };
        rafRef.current = requestAnimationFrame(animate);

        const onVisibilityChange = () => {
          if (document.hidden && rafRef.current) {
            cancelAnimationFrame(rafRef.current);
            rafRef.current = null;
          } else if (!document.hidden && !rafRef.current) {
            rafRef.current = requestAnimationFrame(animate);
          }
        };
        document.addEventListener('visibilitychange', onVisibilityChange);

        return () => {
          window.removeEventListener('resize', resize);
          window.removeEventListener('scroll', onScroll);
          document.removeEventListener('visibilitychange', onVisibilityChange);
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          style={{
            position: 'absolute',
            bottom: 0,
            left: 0,
            width: '100%',
            height: '200px',
            pointerEvents: 'none',
            zIndex: 5,
          }}
        />
      );
    }

                <p>从潮间带到深海秘境，从自然标本到人文贝艺，一场跨越时空的贝类之旅</p>

                      <p>{zone.desc}</p>

                    <div className="zone-count">
                      <strong>{zone.count}</strong>
                      件展品

                    <div className="zone-arrow">
                      <svg viewBox="0 0 24 24" fill="none" strokeWidth="1.5">

                    </div>

              <div className="curator-content reveal reveal-delay-2">

                <h2>林屿舟</h2>
                <div className="curator-role">海洋生物学家 · 贝类收藏研究者</div>
                <div className="curator-bio">
                  <p>
                    林屿舟，海洋生物学博士，从事贝类分类与演化研究二十年。足迹遍布太平洋、印度洋、大西洋的六十余座岛屿，采集并鉴定贝类标本逾万件。
                  </p>
                  <p>
                    她相信贝壳是海洋留给人类的最精致的礼物——既是科学研究的珍贵材料，也是自然艺术的无上杰作。「拾贝集」是她耗时三年策划的首场跨界艺术展，试图在科学的严谨与艺术的感知之间寻找一条通路。
                  </p>
                </div>
                <div className="curator-quote">
                  <p>"贝壳是有记忆的石头。它记得每一次潮汐的起落，记得每一粒沙的摩擦，记得海洋五亿年的沉默与喧嚣。"</p>
                </div>
                <div className="curator-meta">
                  <div className="curator-meta-item">
                    <strong>20<span style={{fontSize: '0.6em'}}>年</span></strong>
                    <span>研究经验</span>
                  </div>
                  <div className="curator-meta-item">
                    <strong>12,000<span style={{fontSize: '0.6em'}}>+</span></strong>
                    <span>私人收藏</span>
                  </div>
                  <div className="curator-meta-item">
                    <strong>60<span style={{fontSize: '0.6em'}}>+</span></strong>
                    <span>考察岛屿</span>
                  </div>
                </div>
              </div>
            </div>
          </section>

                    <div className="visit-detail">

                      <span>飞行社艺术馆 · 三号展厅（滨海大道 128 号）</span>

                  <li>
                    <div className="visit-icon">
                      <svg viewBox="0 0 24 24">

                  <li>
                    <div className="visit-icon">
                      <svg viewBox="0 0 24 24">

                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                      </svg>
                    </div>
                    <div className="visit-detail">
                      <strong>门票信息</strong>
                      <span>免费入场，需提前预约 · 每日限额八十人</span>
                    </div>
                  </li>
                </ul>
              </div>
              <div className="reveal reveal-delay-2">
                <BookingForm />

            </div>
          </section>

          {/* Footer */}
          <footer className="footer">
            <div className="footer-inner">
              <div className="footer-top">
                <div className="footer-brand">
                  <h3>拾贝集</h3>
                  <p>
                    一场关于贝类标本的艺术展览，汇集来自全球七大海洋的珍贵藏品，在科学与美学的交汇处，聆听海洋五亿年的沉默诗行。
                  </p>
                </div>
                <div className="footer-col">
                  <h4>展览</h4>
                  <ul>
                    <li><a href="#foreword" onClick={(e) => {e.preventDefault(); scrollToSection('foreword');}}>展览前言</a></li>

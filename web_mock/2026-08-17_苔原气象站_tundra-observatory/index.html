<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>苔原气象站 · 年度观测年报</title>

<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/echarts@5.6.0/dist/echarts.min.js" crossorigin="anonymous"></script>

<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@300;400;600;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;500&display=swap" />

<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
  background: #F4F7F5;
  color: #1C2426;
  overflow-x: hidden;
  cursor: none;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  body { cursor: auto; }
  .custom-cursor { display: none !important; }
}

::selection { background: #2FA39A; color: #F4F7F5; }

/* ===== Custom Cursor ===== */
.custom-cursor {
  position: fixed;
  top: 50%; left: 50%;
  width: 32px; height: 32px;
  border: 2px solid #F4F7F5;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  transition: width 0.25s cubic-bezier(.2,.8,.2,1), height 0.25s cubic-bezier(.2,.8,.2,1),
              border-color 0.25s ease, background 0.25s ease;
  mix-blend-mode: difference;
  box-shadow: 0 0 12px rgba(47,163,154,0.6), 0 0 24px rgba(47,163,154,0.3);
}
.custom-cursor::before {
  content: "";
  position: absolute;
  top: 50%; left: 50%;
  width: 6px; height: 6px;
  background: #2FA39A;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: all 0.2s ease;
  box-shadow: 0 0 8px #2FA39A;
}
.custom-cursor.cursor-hover {
  width: 56px; height: 56px;
  border-color: #E8722A;
  box-shadow: 0 0 20px rgba(232,114,42,0.7), 0 0 40px rgba(232,114,42,0.3);
}
.custom-cursor.cursor-hover::before {
  width: 10px; height: 10px;
  background: #E8722A;
  box-shadow: 0 0 12px #E8722A;
}
.custom-cursor.cursor-click {
  width: 20px; height: 20px;
}

/* Cursor ripple */
.cursor-ripple {
  position: fixed;
  border: 1.5px solid #2FA39A;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%, -50%) scale(0);
  animation: rippleExpand 0.6s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes rippleExpand {
  0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
}

/* ===== Navigation ===== */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 20px 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: background 0.4s ease, backdrop-filter 0.4s ease, padding 0.4s ease;
}
.nav.scrolled {
  background: rgba(244,247,245,0.85);
  backdrop-filter: blur(16px);
  padding: 12px 48px;
  border-bottom: 1px solid rgba(95,113,97,0.15);
}
.nav-logo {
  font-family: "Noto Serif SC", serif;
  font-weight: 900;
  font-size: 18px;
  letter-spacing: 0.2em;
  color: #1C2426;
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav-logo-mark {
  width: 28px; height: 28px;
  position: relative;
}
.nav-links {
  display: flex;
  align-items: center;
  gap: 36px;
  list-style: none;
}
.nav-links a {
  text-decoration: none;
  color: #1C2426;
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 0.05em;
  position: relative;
  padding: 4px 0;
  cursor: none;
}
.nav-links a::after {
  content: "";
  position: absolute;
  bottom: 0; left: 0;
  width: 0; height: 1px;
  background: #2FA39A;
  transition: width 0.3s ease;
}
.nav-links a:hover::after { width: 100%; }

.nav-year {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  color: #5F7161;
  letter-spacing: 0.1em;
  border: 1px solid #5F7161;
  padding: 4px 10px;
  border-radius: 2px;
}

/* ===== Hero Section ===== */
.hero {
  position: relative;
  height: 100vh;
  min-height: 700px;
  background: #F4F7F5;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero-aurora {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
}
.aurora-band {
  position: absolute;
  width: 140%;
  height: 200px;
  left: -20%;
  filter: blur(40px);
  opacity: 0.4;
  will-change: transform;
}
.aurora-band-1 {
  top: 15%;
  background: #2FA39A;
  height: 120px;
  border-radius: 50%;
  animation: auroraDrift1 18s ease-in-out infinite;
}
.aurora-band-2 {
  top: 25%;
  background: #5F7161;
  height: 80px;
  border-radius: 50%;
  opacity: 0.25;
  animation: auroraDrift2 24s ease-in-out infinite;
}
.aurora-band-3 {
  top: 35%;
  background: #2FA39A;
  height: 60px;
  border-radius: 50%;
  opacity: 0.3;
  animation: auroraDrift3 30s ease-in-out infinite;
}
@keyframes auroraDrift1 {
  0%, 100% { transform: translateX(-5%) scaleX(1) skewY(-2deg); }
  33% { transform: translateX(8%) scaleX(1.1) skewY(1deg); }
  66% { transform: translateX(3%) scaleX(0.95) skewY(-1deg); }
}
@keyframes auroraDrift2 {
  0%, 100% { transform: translateX(10%) scaleX(1.05) skewY(1deg); }
  50% { transform: translateX(-8%) scaleX(0.9) skewY(-2deg); }
}
@keyframes auroraDrift3 {
  0%, 100% { transform: translateX(-10%) scaleX(1); }
  50% { transform: translateX(12%) scaleX(1.15); }
}

/* Snow particles */
.hero-snow {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  overflow: hidden;
}
.snowflake {
  position: absolute;
  top: -10px;
  background: #fff;
  border-radius: 50%;
  opacity: 0.6;
  will-change: transform;
}

/* Anemometer */
.hero-anemometer {
  position: absolute;
  right: 8%;
  top: 50%;
  transform: translateY(-50%);
  width: 200px;
  height: 400px;
  pointer-events: none;
  opacity: 0.7;
}
.anemometer-pole {
  position: absolute;
  left: 50%;
  top: 40px;
  bottom: 0;
  width: 2px;
  background: linear-gradient(to bottom, #5F7161, #1C2426);
  transform: translateX(-50%);
}
.anemometer-head {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 120px;
  animation: anemometerSpin 3s linear infinite;
  transform-origin: center center;
}
.anemometer-cup {
  position: absolute;
  width: 20px;
  height: 20px;
  background: #E8722A;
  border-radius: 50% 0 50% 50%;
  border: 1.5px solid #1C2426;
}
.anemometer-cup-1 { top: 0; left: 50%; transform: translateX(-50%) rotate(0deg); }
.anemometer-cup-2 { bottom: 0; left: 50%; transform: translateX(-50%) rotate(180deg); }
.anemometer-cup-3 { top: 50%; right: 0; transform: translateY(-50%) rotate(90deg); }
.anemometer-cup-4 { top: 50%; left: 0; transform: translateY(-50%) rotate(-90deg); }
.anemometer-arm {
  position: absolute;
  background: #5F7161;
}
.anemometer-arm-h { top: 50%; left: 10%; right: 10%; height: 1.5px; transform: translateY(-50%); }
.anemometer-arm-v { left: 50%; top: 10%; bottom: 10%; width: 1.5px; transform: translateX(-50%); }

@keyframes anemometerSpin {
  from { transform: translateX(-50%) rotate(0deg); }
  to { transform: translateX(-50%) rotate(360deg); }
}

.hero-content {
  position: relative;
  z-index: 2;
  text-align: left;
  max-width: 1200px;
  width: 100%;
  padding: 0 48px;
}
.hero-eyebrow {
  font-family: "JetBrains Mono", monospace;
  font-size: 13px;
  letter-spacing: 0.3em;
  color: #5F7161;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.hero-eyebrow::before {
  content: "";
  width: 40px; height: 1px;
  background: #5F7161;
}
.hero-title {
  font-family: "Noto Serif SC", serif;
  font-size: clamp(48px, 8vw, 120px);
  font-weight: 900;
  line-height: 1;
  color: #1C2426;
  letter-spacing: -0.02em;
  margin-bottom: 28px;
}
.hero-title .aurora-text {
  color: #2FA39A;
  position: relative;
  display: inline-block;
}
.hero-subtitle {
  font-family: "Noto Serif SC", serif;
  font-size: clamp(18px, 2vw, 24px);
  font-weight: 300;
  color: #5F7161;
  max-width: 560px;
  line-height: 1.8;
  margin-bottom: 48px;
}
.hero-meta {
  display: flex;
  gap: 48px;
  flex-wrap: wrap;
}
.hero-meta-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.hero-meta-label {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: #5F7161;
  text-transform: uppercase;
}
.hero-meta-value {
  font-family: "Noto Serif SC", serif;
  font-size: 28px;
  font-weight: 600;
  color: #1C2426;
}
.hero-meta-value .unit {
  font-size: 14px;
  font-weight: 400;
  color: #5F7161;
  margin-left: 4px;
}

.hero-scroll-indicator {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  z-index: 2;
}
.hero-scroll-indicator span {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  letter-spacing: 0.3em;
  color: #5F7161;
}
.scroll-line {
  width: 1px;
  height: 60px;
  background: linear-gradient(to bottom, #5F7161, transparent);
  position: relative;
  overflow: hidden;
}
.scroll-line::after {
  content: "";
  position: absolute;
  top: -20px;
  left: 0;
  width: 1px;
  height: 20px;
  background: #E8722A;
  animation: scrollDot 2s ease-in-out infinite;
}
@keyframes scrollDot {
  0% { top: -20px; }
  100% { top: 60px; }
}

/* ===== Section Common ===== */
.section {
  padding: 120px 48px;
  max-width: 1400px;
  margin: 0 auto;
  position: relative;
}
.section-header {
  margin-bottom: 72px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 48px;
  flex-wrap: wrap;
}
.section-num {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  letter-spacing: 0.3em;
  color: #2FA39A;
  margin-bottom: 16px;
}
.section-title {
  font-family: "Noto Serif SC", serif;
  font-size: clamp(32px, 4vw, 56px);
  font-weight: 900;
  color: #1C2426;
  line-height: 1.2;
  letter-spacing: -0.01em;
}
.section-desc {
  max-width: 480px;
  font-size: 15px;
  color: #5F7161;
  line-height: 1.9;
}

/* Reveal animation */
.reveal {
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 0.9s cubic-bezier(.2,.8,.2,1), transform 0.9s cubic-bezier(.2,.8,.2,1);
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

/* ===== Polar Night Timeline ===== */
.timeline-section {
  background: #1C2426;
  color: #F4F7F5;
  max-width: 100%;
  margin: 0;
  padding: 120px 48px;
  overflow: hidden;
  position: relative;
}
.timeline-section .section-title { color: #F4F7F5; }
.timeline-section .section-desc { color: rgba(244,247,245,0.6); }
.timeline-section .section-num { color: #2FA39A; }

.timeline-container {
  position: relative;
  max-width: 1000px;
  margin: 0 auto;
  padding: 40px 0;
}
.timeline-track {
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 1px;
  background: rgba(47,163,154,0.3);
  transform: translateX(-50%);
}
.timeline-progress {
  position: absolute;
  left: 50%;
  top: 0;
  width: 2px;
  background: #2FA39A;
  transform: translateX(-50%);
  box-shadow: 0 0 10px #2FA39A;
  transition: height 0.1s linear;
}

.timeline-item {
  position: relative;
  width: 50%;
  padding: 32px 60px;
  opacity: 0.4;
  transition: opacity 0.5s ease;
}
.timeline-item.active { opacity: 1; }
.timeline-item:nth-child(odd) {
  margin-left: 0;
  text-align: right;
  padding-right: 60px;
  padding-left: 20px;
}
.timeline-item:nth-child(even) {
  margin-left: 50%;
  padding-left: 60px;
  padding-right: 20px;
}
.timeline-dot {
  position: absolute;
  top: 40px;
  width: 14px;
  height: 14px;
  background: #1C2426;
  border: 2px solid #2FA39A;
  border-radius: 50%;
  z-index: 2;
  transition: all 0.4s ease;
}
.timeline-item.active .timeline-dot {
  background: #2FA39A;
  box-shadow: 0 0 16px #2FA39A;
  transform: scale(1.2);
}
.timeline-item:nth-child(odd) .timeline-dot { right: -7px; }
.timeline-item:nth-child(even) .timeline-dot { left: -7px; }

.timeline-date {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  letter-spacing: 0.2em;
  color: #2FA39A;
  margin-bottom: 8px;
}
.timeline-heading {
  font-family: "Noto Serif SC", serif;
  font-size: 22px;
  font-weight: 600;
  color: #F4F7F5;
  margin-bottom: 12px;
}
.timeline-text {
  font-size: 14px;
  line-height: 1.9;
  color: rgba(244,247,245,0.7);
}
.timeline-tag {
  display: inline-block;
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  padding: 3px 8px;
  border: 1px solid #E8722A;
  color: #E8722A;
  margin-top: 12px;
  border-radius: 2px;
}

/* ===== Data Observation Section ===== */
.data-section {
  position: relative;
}
.data-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 24px;
}
.data-card {
  background: #fff;
  border: 1px solid rgba(95,113,97,0.15);
  border-radius: 4px;
  padding: 32px;
  position: relative;
  overflow: hidden;
  transition: box-shadow 0.4s ease, transform 0.1s ease;
  transform-style: preserve-3d;
  will-change: transform;
}
.data-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0;
  width: 3px; height: 100%;
  background: #2FA39A;
}
.data-card:hover {
  box-shadow: 0 20px 60px rgba(28,36,38,0.08);
}
.data-card-1 { grid-column: span 4; }
.data-card-2 { grid-column: span 4; }
.data-card-3 { grid-column: span 4; }
.data-card-chart { grid-column: span 8; }
.data-card-side { grid-column: span 4; }

.data-card-label {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: #5F7161;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.data-card-value {
  font-family: "Noto Serif SC", serif;
  font-size: 56px;
  font-weight: 900;
  color: #1C2426;
  line-height: 1;
  margin-bottom: 8px;
  font-variant-numeric: tabular-nums;
}
.data-card-value .unit {
  font-size: 20px;
  font-weight: 400;
  color: #5F7161;
  margin-left: 6px;
}
.data-card-desc {
  font-size: 13px;
  color: #5F7161;
  line-height: 1.7;
}
.data-card-trend {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  padding: 3px 8px;
  border-radius: 2px;
  margin-top: 12px;
}
.trend-up { background: rgba(232,114,42,0.1); color: #E8722A; }
.trend-down { background: rgba(47,163,154,0.1); color: #2FA39A; }

/* Thermometer */
.thermometer {
  display: flex;
  align-items: flex-end;
  gap: 16px;
  height: 180px;
  margin-top: 16px;
}
.thermometer-tube {
  width: 20px;
  height: 100%;
  background: rgba(95,113,97,0.1);
  border-radius: 10px;
  position: relative;
  overflow: hidden;
}
.thermometer-mercury {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  background: linear-gradient(to top, #E8722A, #2FA39A);
  border-radius: 10px;
  transition: height 1.5s cubic-bezier(.2,.8,.2,1);
}
.thermometer-scale {
  flex: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 2px 0;
}
.thermometer-scale span {
  font-family: "JetBrains Mono", monospace;
  font-size: 10px;
  color: #5F7161;
}

.chart-container {
  width: 100%;
  height: 320px;
}

/* Wind rose / spectrum bars */
.wind-spectrum {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  height: 120px;
  margin-top: 20px;
}
.wind-bar {
  flex: 1;
  background: #2FA39A;
  border-radius: 2px 2px 0 0;
  transition: height 1s cubic-bezier(.2,.8,.2,1);
  opacity: 0.6;
}
.wind-bar:hover { opacity: 1; }

/* ===== Team Journals Section ===== */
.journals-section {
  background: rgba(95,113,97,0.04);
  max-width: 100%;
  margin: 0;
  padding: 120px 48px;
  position: relative;
}
.journals-inner {
  max-width: 1200px;
  margin: 0 auto;
}

.journal-tabs {
  display: flex;
  gap: 12px;
  margin-bottom: 40px;
  flex-wrap: wrap;
}
.journal-tab {
  padding: 10px 20px;
  border: 1px solid rgba(95,113,97,0.3);
  background: transparent;
  color: #5F7161;
  font-family: "Noto Sans SC", sans-serif;
  font-size: 14px;
  cursor: none;
  border-radius: 2px;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  gap: 10px;
}
.journal-tab:hover {
  border-color: #2FA39A;
  color: #2FA39A;
}
.journal-tab.active {
  background: #1C2426;
  color: #F4F7F5;
  border-color: #1C2426;
}
.journal-tab-avatar {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #2FA39A;
  position: relative;
  overflow: hidden;
}
.journal-tab.active .journal-tab-avatar {
  animation: avatarPulse 2s ease-in-out infinite;
}
@keyframes avatarPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(47,163,154,0.4); }
  50% { box-shadow: 0 0 0 8px rgba(47,163,154,0); }
}

.journal-content {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 64px;
  align-items: start;
}
.journal-entry {
  background: #fff;
  border: 1px solid rgba(95,113,97,0.15);
  padding: 40px;
  border-radius: 4px;
  position: relative;
}
.journal-entry::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: repeating-linear-gradient(90deg, #E8722A 0, #E8722A 6px, transparent 6px, transparent 12px);
}
.journal-date {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  color: #5F7161;
  letter-spacing: 0.1em;
  margin-bottom: 8px;
}
.journal-author {
  font-family: "Noto Serif SC", serif;
  font-size: 20px;
  font-weight: 600;
  color: #1C2426;
  margin-bottom: 4px;
}
.journal-role {
  font-size: 13px;
  color: #2FA39A;
  margin-bottom: 24px;
}
.journal-text {
  font-size: 15px;
  line-height: 2;
  color: #1C2426;
  min-height: 200px;
}
.typewriter-cursor {
  display: inline-block;

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ===== Utility: RAF Manager for visibility pausing =====
const rafRegistry = new Set();
let visHandlerInstalled = false;
function installVisibilityHandler() {
  if (visHandlerInstalled) return;
  visHandlerInstalled = true;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      rafRegistry.forEach(entry => entry.pause());
    } else {
      rafRegistry.forEach(entry => entry.resume());
    }
  });
}

function useRAFLoop(updateFn, deps = []) {
  const rafRef = useRef(null);
  const lastTimeRef = useRef(0);
  const pausedRef = useRef(false);

  useEffect(() => {
    const loop = (now) => {
      if (!lastTimeRef.current) lastTimeRef.current = now;
      const dt = now - lastTimeRef.current;
      lastTimeRef.current = now;
      if (!pausedRef.current) updateFn(dt, now);
      rafRef.current = requestAnimationFrame(loop);
    };
    rafRef.current = requestAnimationFrame(loop);
    const entry = {
      pause: () => { pausedRef.current = true; },
      resume: () => { pausedRef.current = false; lastTimeRef.current = 0; }
    };
    rafRegistry.add(entry);
    installVisibilityHandler();
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      rafRegistry.delete(entry);
    };
  }, deps);
}

// ===== Scroll Reveal Hook =====
function useScrollReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });
    els.forEach(el => observer.observe(el));
    return () => observer.disconnect();
  }, []);
}

// ===== Number Counter (for data values) =====
function useCounter(target, duration = 2000, start = false) {
  const [value, setValue] = useState(0);
  const startedRef = useRef(false);
  const rafRef = useRef(null);

  useEffect(() => {
    if (!start || startedRef.current) return;
    startedRef.current = true;
    const startTime = performance.now();
    const startVal = 0;
    const diff = target - startVal;

    const easeOutExpo = t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t);

    const tick = (now) => {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      setValue(Math.round(startVal + diff * easeOutExpo(progress)));
      if (progress < 1) {
        rafRef.current = requestAnimationFrame(tick);
      }
    };
    rafRef.current = requestAnimationFrame(tick);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [target, duration, start]);

  return value;
}

// ===== Custom Cursor =====
function CustomCursor() {
  const cursorRef = useRef(null);
  const posRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const targetRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const [hover, setHover] = useState(false);

  useRAFLoop((dt) => {
    if (!cursorRef.current) return;
    const pos = posRef.current;
    const tgt = targetRef.current;
    pos.x += (tgt.x - pos.x) * 0.18;
    pos.y += (tgt.y - pos.y) * 0.18;
    cursorRef.current.style.left = pos.x + 'px';
    cursorRef.current.style.top = pos.y + 'px';
  });

  useEffect(() => {
    const move = (e) => {
      targetRef.current.x = e.clientX;
      targetRef.current.y = e.clientY;
    };
    const over = (e) => {
      if (e.target.closest('a, button, .data-card, .gallery-item, .journal-tab, .message-card, input, textarea, [data-cursor="hover"]')) {
        setHover(true);
      } else {
        setHover(false);
      }
    };
    const click = (e) => {
      const ripple = document.createElement('div');
      ripple.className = 'cursor-ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
      if (cursorRef.current) {
        cursorRef.current.classList.add('cursor-click');
        setTimeout(() => cursorRef.current?.classList.remove('cursor-click'), 150);
      }
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseover', over);
    window.addEventListener('click', click);
    return () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseover', over);
      window.removeEventListener('click', click);
    };
  }, []);

  return (
    <div ref={cursorRef} className={`custom-cursor ${hover ? 'cursor-hover' : ''}`} />
  );
}

// ===== Snow Particles =====
function SnowParticles() {
  const containerRef = useRef(null);
  const particlesRef = useRef([]);

  useEffect(() => {
    const container = containerRef.current;
    if (!container) return;
    const count = 60;
    const particles = [];

    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'snowflake';
      const size = Math.random() * 3 + 1;
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.left = Math.random() * 100 + '%';
      el.style.top = Math.random() * 100 + '%';
      el.style.opacity = (Math.random() * 0.5 + 0.2).toString();
      container.appendChild(el);
      particles.push({
        el,
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        speed: Math.random() * 0.3 + 0.1,
        drift: Math.random() * 0.3 - 0.15,
        size
      });
    }
    particlesRef.current = particles;

    let raf;
    let lastTime = 0;
    let paused = false;

    const loop = (now) => {
      const dt = (now - lastTime) / 16 || 1;
      lastTime = now;
      if (!paused) {
        particles.forEach(p => {
          p.y += p.speed * dt;
          p.x += p.drift * dt;
          if (p.y > window.innerHeight + 10) {
            p.y = -10;
            p.x = Math.random() * window.innerWidth;
          }
          if (p.x > window.innerWidth + 10) p.x = -10;
          if (p.x < -10) p.x = window.innerWidth + 10;
          p.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
        });
      }
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);

    const onVis = () => {
      paused = document.hidden;
      if (!paused) lastTime = 0;
    };
    document.addEventListener('visibilitychange', onVis);

    return () => {
      cancelAnimationFrame(raf);
      document.removeEventListener('visibilitychange', onVis);
      particles.forEach(p => p.el.remove());
    };
  }, []);

  return <div ref={containerRef} className="hero-snow" />;
}

        <li><a href="#data" onClick={scrollTo('data')}>观测数据</a></li>
        <li><a href="#journals" onClick={scrollTo('journals')}>队员手记</a></li>
        <li><a href="#gallery" onClick={scrollTo('gallery')}>生态画廊</a></li>

      </ul>
      <div className="nav-year">ANNUAL · 2025</div>
    </nav>
  );
}

// ===== Polar Night Timeline =====

function Timeline() {
  const [activeIndex, setActiveIndex] = useState(-1);
  const [progress, setProgress] = useState(0);
  const sectionRef = useRef(null);

  useEffect(() => {
    const section = sectionRef.current;
    if (!section) return;

    const onScroll = () => {
      const rect = section.getBoundingClientRect();
      const sectionHeight = section.offsetHeight;
      const viewHeight = window.innerHeight;
      const scrolled = viewHeight - rect.top;
      const total = sectionHeight + viewHeight;
      const pct = Math.max(0, Math.min(1, scrolled / total));
      setProgress(pct);

      // Determine active item
      const items = section.querySelectorAll('.timeline-item');
      let active = -1;
      items.forEach((item, i) => {
        const itemRect = item.getBoundingClientRect();
        if (itemRect.top < viewHeight * 0.6) {
          active = i;
        }
      });
      setActiveIndex(active);
    };

    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <section id="timeline" className="timeline-section" ref={sectionRef}>
      <div className="section-header" style={{ maxWidth: 1000, margin: '0 auto 72px' }}>
        <div>
          <div className="section-num">SECTION 02</div>
          <h2 className="section-title">极夜时间轴</h2>
        </div>
        <p className="section-desc">
          从十月下旬到三月上旬，太阳在地平线以下停留了 84 天。
          这是一段关于等待、观测与坚守的漫长记录，每一天都有值得写下的故事。
        </p>
      </div>

      <div className="timeline-container">
        <div className="timeline-track"></div>
        <div className="timeline-progress" style={{ height: `${progress * 100}%` }}></div>
        {timelineData.map((item, i) => (
          <div
            key={i}
            className={`timeline-item reveal ${i <= activeIndex ? 'active' : ''}`}
          >
            <div className="timeline-dot"></div>
            <div className="timeline-date">{item.date}</div>
            <h3 className="timeline-heading">{item.heading}</h3>
            <p className="timeline-text">{item.text}</p>
            <span className="timeline-tag">{item.tag}</span>
          </div>
        ))}
      </div>
    </section>
  );
}

// ===== Observation Data Section =====
function ObservationData() {
  const chartRef = useRef(null);
  const sectionRef = useRef(null);
  const [countersStarted, setCountersStarted] = useState(false);
  const [thermoHeight, setThermoHeight] = useState(0);
  const [windHeights, setWindHeights] = useState([]);

  const tempValue = useCounter(-6.7, 2000, countersStarted);
  const windValue = useCounter(12.4, 2000, countersStarted);
  const auroraValue = useCounter(147, 2000, countersStarted);

  // Initialize wind bars
  useEffect(() => {
    const heights = Array.from({ length: 24 }, () => Math.random() * 80 + 20);
    setWindHeights(heights);
  }, []);

  // Animate wind bars
  useEffect(() => {
    if (!countersStarted) return;
    let raf;
    let lastTime = 0;
    const animate = (now) => {
      if (now - lastTime > 2000) {
        lastTime = now;
        setWindHeights(prev => prev.map(h => {
          const delta = (Math.random() - 0.5) * 30;
          return Math.max(10, Math.min(100, h + delta));
        }));
      }
      raf = requestAnimationFrame(animate);
    };
    raf = requestAnimationFrame(animate);
    return () => cancelAnimationFrame(raf);
  }, [countersStarted]);

  // Intersection observer to start counters
  useEffect(() => {
    const section = sectionRef.current;
    if (!section) return;
    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) {
        setCountersStarted(true);
        setThermoHeight(72); // -6.7 / -20 ~ 33% of range, let's use 72% visual
        observer.disconnect();
      }
    }, { threshold: 0.2 });
    observer.observe(section);
    return () => observer.disconnect();
  }, []);

  // ECharts initialization
  useEffect(() => {
    const chartEl = chartRef.current;
    if (!chartEl || !window.echarts || !countersStarted) return;

    const chart = echarts.init(chartEl, null, { renderer: 'canvas' });

    const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    const tempData = [-15.2, -16.8, -13.4, -8.1, -2.3, 2.1, 5.8, 4.9, -0.5, -6.7, -11.2, -14.5];
    const windData = [8.2, 9.5, 11.3, 7.8, 6.2, 5.1, 4.8, 5.3, 7.1, 10.2, 12.4, 9.8];

    chart.setOption({
      backgroundColor: 'transparent',
      grid: { top: 40, right: 40, bottom: 40, left: 50 },
      tooltip: {
        trigger: 'axis',
        backgroundColor: 'rgba(28,36,38,0.9)',
        borderColor: 'transparent',
        textStyle: { color: '#F4F7F5', fontSize: 12 }
      },
      legend: {
        data: ['气温', '风速'],
        right: 0,
        top: 0,
        textStyle: { color: '#5F7161', fontSize: 12, fontFamily: 'Noto Sans SC' }
      },
      xAxis: {
        type: 'category',
        data: months,
        axisLine: { lineStyle: { color: 'rgba(95,113,97,0.3)' } },
        axisLabel: { color: '#5F7161', fontSize: 11, fontFamily: 'JetBrains Mono' },
        axisTick: { show: false }
      },
      yAxis: [
        {
          type: 'value',
          name: '气温 °C',
          nameTextStyle: { color: '#5F7161', fontSize: 10, fontFamily: 'JetBrains Mono', padding: [0,0,0,-20] },
          axisLine: { show: false },
          axisTick: { show: false },
          splitLine: { lineStyle: { color: 'rgba(95,113,97,0.1)' } },
          axisLabel: { color: '#5F7161', fontSize: 10, fontFamily: 'JetBrains Mono' }
        },
        {
          type: 'value',
          name: '风速 m/s',
          nameTextStyle: { color: '#5F7161', fontSize: 10, fontFamily: 'JetBrains Mono', padding: [0,-20,0,0] },
          axisLine: { show: false },
          axisTick: { show: false },
          splitLine: { show: false },
          axisLabel: { color: '#5F7161', fontSize: 10, fontFamily: 'JetBrains Mono' }
        }
      ],
      series: [
        {
          name: '气温',
          type: 'line',
          data: tempData,
          smooth: true,
          symbol: 'circle',
          symbolSize: 6,
          itemStyle: { color: '#E8722A' },
          lineStyle: { color: '#E8722A', width: 2 },
          areaStyle: {
            color: {
              type: 'linear',
              x: 0, y: 0, x2: 0, y2: 1,
              colorStops: [
                { offset: 0, color: 'rgba(232,114,42,0.2)' },
                { offset: 1, color: 'rgba(232,114,42,0.01)' }
              ]
            }
          }
        },
        {
          name: '风速',
          type: 'line',
          yAxisIndex: 1,
          data: windData,
          smooth: true,
          symbol: 'circle',
          symbolSize: 5,
          itemStyle: { color: '#2FA39A' },
          lineStyle: { color: '#2FA39A', width: 2 }
        }
      ],
      animationDuration: 1500,
      animationEasing: 'cubicOut'
    });

    const onResize = () => chart.resize();
    window.addEventListener('resize', onResize);

    return () => {
      window.removeEventListener('resize', onResize);
      chart.dispose();
    };
  }, [countersStarted]);

  // 3D tilt effect on cards (direct DOM manipulation, no setState)
  useEffect(() => {
    const cards = document.querySelectorAll('.data-card');
    const handleMove = (e) => {
      const card = e.currentTarget;
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotY = ((x - centerX) / centerX) * 4;
      const rotX = -((y - centerY) / centerY) * 4;
      card.style.transform = `perspective(800px) rotateX(${rotX}deg) rotateY(${rotY}deg) translateY(-4px)`;
    };
    const handleLeave = (e) => {
      e.currentTarget.style.transform = 'perspective(800px) rotateX(0) rotateY(0) translateY(0)';
    };
    cards.forEach(card => {
      card.addEventListener('mousemove', handleMove);
      card.addEventListener('mouseleave', handleLeave);
    });
    return () => {
      cards.forEach(card => {
        card.removeEventListener('mousemove', handleMove);
        card.removeEventListener('mouseleave', handleLeave);
      });
    };
  }, [countersStarted]);

  return (
    <section id="data" className="section data-section" ref={sectionRef}>
      <div className="section-header reveal">
        <div>
          <div className="section-num">SECTION 03</div>
          <h2 className="section-title">观测数据故事</h2>
        </div>
        <p className="section-desc">
          全年 8760 小时不间断的数据采集。12 类传感器、3 座气象塔、1 套电离层监测阵列，
          共同绘写着北极苔原的气候变化图景。
        </p>
      </div>

      <div className="data-grid">
        <div className="data-card data-card-1 reveal" style={{ transitionDelay: '0.1s' }}>
          <div className="data-card-label">年平均气温</div>
          <div className="data-card-value">{tempValue}<span className="unit">°C</span></div>
          <div className="data-card-desc">较百年均值上升 2.3°C，升温速率是全球平均的 2.7 倍</div>
          <span className="data-card-trend trend-up">▲ 较去年 +0.4°C</span>
        </div>

        <div className="data-card data-card-2 reveal" style={{ transitionDelay: '0.2s' }}>
          <div className="data-card-label">年平均风速</div>
          <div className="data-card-value">{windValue.toFixed(1)}<span className="unit">m/s</span></div>
          <div className="data-card-desc">极大风速 47.2 m/s，出现在 11 月 12 日暴风雪过程中</div>
          <span className="data-card-trend trend-up">▲ 较去年 +1.2 m/s</span>

          <div className="wind-spectrum">
            {windHeights.map((h, i) => (
              <div
                key={i}
                className="wind-bar"
                style={{
                  height: `${h}%`,
                  opacity: 0.4 + (h / 100) * 0.5
                }}
              />
            ))}
          </div>
        </div>

        <div className="data-card data-card-3 reveal" style={{ transitionDelay: '0.3s' }}>
          <div className="data-card-label">极光观测次数</div>
          <div className="data-card-value">{auroraValue}<span className="unit">次</span></div>
          <div className="data-card-desc">其中强极光（KP ≥ 6）23 次，弱极光（KP 3-5）124 次</div>
          <span className="data-card-trend trend-down">▼ 较去年 -18 次</span>

          <div className="thermometer">
            <div className="thermometer-tube">
              <div className="thermometer-mercury" style={{ height: `${thermoHeight}%` }}></div>
            </div>
            <div className="thermometer-scale">
              <span>+10°</span>
              <span>0°</span>
              <span>-10°</span>
              <span>-20°</span>
              <span>-30°</span>
            </div>
          </div>
        </div>

        <div className="data-card data-card-chart reveal" style={{ transitionDelay: '0.4s' }}>
          <div className="data-card-label">气温与风速 · 全年走势</div>
          <div ref={chartRef} className="chart-container"></div>
        </div>

        <div className="data-card data-card-side reveal" style={{ transitionDelay: '0.5s' }}>
          <div className="data-card-label">年度关键指标</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 20, marginTop: 20 }}>
            {[
              { label: '年降水量', value: '268 mm', sub: '较常年 +12%' },
              { label: '积雪天数', value: '214 天', sub: '较常年 -8 天' },
              { label: '活动层厚度', value: '92 cm', sub: '多年冻土上限下降' },
              { label: '大气 CO₂', value: '421 ppm', sub: '月均最高值出现在 4 月' },
            ].map((item, i) => (
              <div key={i} style={{ paddingBottom: 16, borderBottom: '1px solid rgba(95,113,97,0.1)' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                  <span style={{ fontSize: 13, color: '#5F7161' }}>{item.label}</span>
                  <span style={{ fontFamily: '"Noto Serif SC", serif', fontSize: 20, fontWeight: 600, color: '#1C2426' }}>{item.value}</span>
                </div>
                <div style={{ fontSize: 11, color: '#2FA39A', marginTop: 4, fontFamily: 'JetBrains Mono, monospace' }}>{item.sub}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}

function Guestbook() {
  const [messages, setMessages] = useState(initialMessages);
  const [name, setName] = useState('');
  const [text, setText] = useState('');
  const [submitting, setSubmitting] = useState(false);

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!name.trim() || !text.trim()) return;

    setSubmitting(true);
    // Simulate submission delay
    setTimeout(() => {
      const now = new Date();
      const dateStr = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')}`;
      setMessages([
        { name: name.trim(), text: text.trim(), time: dateStr, avatar: name.trim()[0] },

      ]);
      setName('');
      setText('');
      setSubmitting(false);
    }, 600);

  return (
    <section id="guestbook" className="guestbook-section">

// ===== Page Loader =====
function PageLoader({ onDone }) {
  const [progress, setProgress] = useState(0);

  useEffect(() => {
    let current = 0;
    const timer = setInterval(() => {
      current += Math.random() * 15 + 5;
      if (current >= 100) {
        current = 100;
        setProgress(100);
        clearInterval(timer);
        setTimeout(onDone, 400);
      } else {
        setProgress(Math.floor(current));
      }
    }, 120);
    return () => clearInterval(timer);
  }, [onDone]);

  return (
    <div className={`page-loader ${progress >= 100 ? 'done' : ''}`}>
      <div className="loader-title">苔原气象站</div>
      <div className="loader-bar">
        <div className="loader-bar-fill" style={{ width: `${progress}%` }}></div>
      </div>
      <div className="loader-percent">{progress}%</div>
    </div>
  );
}

// ===== Main App =====
function App() {
  const [loaded, setLoaded] = useState(false);

  useScrollReveal();

  useEffect(() => {
    // Announce upgrade to host
    const announce = () => {
      window.parent?.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    };
    announce();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announce, { once: true });
    }
  }, []);

  return (
    <>
      {!loaded && <PageLoader onDone={() => setLoaded(true)} />}
      <CustomCursor />
      <Navigation />
      <main>
        <Hero />
        <Timeline />
        <ObservationData />
        <Journals />
        <Gallery />
        <Guestbook />
      </main>
      <Footer />
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="creative-medium" content="interactive-prototype">
  <title>金鱼谱系馆 · 从鲫鱼到百品的千年演化</title>
  <meta name="description" content="一座数字化的金鱼谱系馆，以清代《金鱼图谱》工笔彩绘美学呈现金鱼从野生鲫鱼到数百培育品种的演化史。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 自定义光标 -->
  <div id="custom-cursor" class="custom-cursor">
    <div class="cursor-ring"></div>
    <div class="cursor-dot"></div>
  </div>

  <!-- 顶部标题栏 -->
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="seal">金</span>
        <h1 class="site-title">金鱼谱系馆</h1>
      </div>
      <nav class="header-nav">
        <span class="nav-item active" data-dynasty="all">全谱系</span>
        <span class="nav-item" data-dynasty="song">宋代</span>
        <span class="nav-item" data-dynasty="ming">明代</span>
        <span class="nav-item" data-dynasty="qing">清代</span>
        <span class="nav-item" data-dynasty="modern">当代</span>
      </nav>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="main-content">
    <!-- 左侧时间轴 -->
    <aside class="timeline-column">
      <div class="timeline-title">驯化时间轴</div>
      <div class="timeline-track" id="timeline-track">
        <div class="timeline-line"></div>
        <div class="timeline-handle" id="timeline-handle">
          <div class="handle-knob"></div>
          <div class="handle-label" id="timeline-label">全朝代</div>
        </div>
        <div class="timeline-marks">
          <div class="timeline-mark" data-era="song" data-percent="20">
            <span class="mark-year">宋</span>
            <span class="mark-desc">初入池沼</span>
          </div>
          <div class="timeline-mark" data-era="ming" data-percent="45">
            <span class="mark-year">明</span>
            <span class="mark-desc">盆养盛行</span>
          </div>
          <div class="timeline-mark" data-era="qing" data-percent="75">
            <span class="mark-year">清</span>
            <span class="mark-desc">百品争奇</span>
          </div>
          <div class="timeline-mark" data-era="modern" data-percent="95">
            <span class="mark-year">今</span>
            <span class="mark-desc">谱系大成</span>
          </div>
        </div>
      </div>
      <div class="timeline-hint">拖动探索</div>
    </aside>

    <!-- 中央谱系树画布 -->
    <section class="tree-stage" id="tree-stage">
      <div class="tree-water-bg" id="water-bg"></div>
      <svg id="family-tree" class="family-tree" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- 水波涟漪滤镜 -->
          <filter id="waterRipple" x="-50%" y="-50%" width="200%" height="200%">
            <feTurbulence type="turbulence" baseFrequency="0.01" numOctaves="2" result="turbulence"/>
            <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="3" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <!-- 墨线渐变 -->
          <linearGradient id="inkGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2C2C2C" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#2C2C2C" stop-opacity="0.5"/>
          </linearGradient>
          <!-- 印章图案 -->
          <pattern id="sealPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
            <rect width="60" height="60" fill="none"/>
          </pattern>
        </defs>
        <!-- 谱系连线（动态生成） -->
        <g id="tree-branches"></g>
        <!-- 品种节点（动态生成） -->
        <g id="tree-nodes"></g>
      </svg>

      <!-- 导语浮层 -->
      <div class="intro-layer">
        <div class="intro-text">
          <p class="intro-subtitle">千年驯养 · 一尾成林</p>
          <h2 class="intro-title">从一尾野生鲫鱼<br/>到百品金鱼的演化</h2>
          <p class="intro-desc">点击树上的品种节点，探索祖先与变异的对照</p>
        </div>
      </div>

      <!-- 画布控制 -->
      <div class="canvas-controls">
        <button class="control-btn" id="zoom-in" title="放大">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M21 21l-4.3-4.3"/></svg>
        </button>
        <button class="control-btn" id="zoom-out" title="缩小">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M21 21l-4.3-4.3"/></svg>
        </button>
        <button class="control-btn" id="reset-view" title="全景">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 4v5h5"/></svg>
        </button>
      </div>
    </section>

    <!-- 右侧对照面板 -->
    <aside class="compare-panel" id="compare-panel" aria-hidden="true">
      <div class="panel-handle" id="panel-handle">
        <span class="handle-text">对照阅读</span>
        <svg class="handle-arrow" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 2l8 8-8 8"/></svg>
      </div>
      <div class="panel-content">
        <div class="panel-header">
          <span class="panel-label">对照阅读</span>
          <button class="panel-close" id="panel-close" aria-label="关闭面板">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <div class="compare-body">
          <!-- 祖先侧 -->
          <div class="compare-side ancestor-side">
            <div class="side-label ancestor-label">
              <span class="label-mark"></span>
              <span class="label-text">祖先</span>
            </div>
            <div class="side-fish" id="ancestor-fish">
              <svg viewBox="0 0 160 80" class="fish-svg"></svg>
            </div>
            <div class="side-name">
              <span class="chinese-name" id="ancestor-name">野生鲫鱼</span>
              <span class="latin-name" id="ancestor-latin">Carassius auratus</span>
            </div>
            <div class="side-info">
              <div class="info-item">
                <span class="info-key">朝代</span>
                <span class="info-value" id="ancestor-era">宋代以前</span>
              </div>
              <div class="info-item">
                <span class="info-key">体色</span>
                <span class="info-value" id="ancestor-color">银灰</span>
              </div>
            </div>
          </div>

          <!-- 分隔 -->
          <div class="compare-divider">
            <div class="divider-line"></div>
            <div class="divider-seal">变</div>
            <div class="divider-line"></div>
          </div>

          <!-- 变异侧 -->
          <div class="compare-side variant-side">
            <div class="side-label variant-label">
              <span class="label-mark"></span>
              <span class="label-text">变异</span>
            </div>
            <div class="side-fish" id="variant-fish">
              <svg viewBox="0 0 160 80" class="fish-svg"></svg>
            </div>
            <div class="side-name">
              <span class="chinese-name" id="variant-name">草金</span>
              <span class="latin-name" id="variant-latin">Carassius auratus</span>
            </div>
            <div class="side-info">
              <div class="info-item">
                <span class="info-key">朝代</span>
                <span class="info-value" id="variant-era">南宋</span>
              </div>
              <div class="info-item">
                <span class="info-key">体色</span>
                <span class="info-value" id="variant-color">金红</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 特征对照表 -->
        <div class="feature-compare">
          <h3 class="feature-title">变异特征对照</h3>
          <div class="feature-table" id="feature-table">
            <!-- 动态生成 -->
          </div>
        </div>

        <!-- 形态描述 -->
        <div class="description-block" id="description-block">
          <h3 class="desc-title">形态描述</h3>
          <p class="desc-text" id="desc-text"></p>
        </div>
      </div>
    </aside>
  </main>

  <!-- 底部信息 -->
  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-seal">谱</span>
      <span class="footer-text">金鱼谱系馆 · 据清代《金鱼图谱》工笔美学构建 · 一尾一世界</span>
    </div>
  </footer>

  <!-- 水波涟漪容器（点击反馈） -->
  <div id="ripple-container" class="ripple-container"></div>

  <!-- JS 模块 -->
  <script src="js/data.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/tree.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>Migratory Atlas · 候鸟迁徙观测站</title>
  <meta name="description" content="Migratory Atlas — 一个虚构的候鸟迁徙观测组织，追踪全球候鸟的飞行走廊、物种图鉴与实时观测日志。" />
  <link rel="preconnect" href="https://miaoda.feishu.cn" />
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <style>
/* ============================================================
   Migratory Atlas · Global Styles
   蛋壳米白 #F5F1E8 · 炭黑墨色 #1C1B1A · 落日茜红橙 #E4572E
   羽灰阶：#D9D4CA / #B5B0A8 / #8A8680
   ============================================================ */

:root {
  --color-eggshell: #F5F1E8;
  --color-eggshell-2: #EDE8DC;
  --color-ink: #1C1B1A;
  --color-ink-soft: #2C2A28;
  --color-sunset: #E4572E;
  --color-sunset-deep: #C4411F;
  --color-feather-light: #D9D4CA;
  --color-feather-mid: #B5B0A8;
  --color-feather-dark: #8A8680;

  --font-display: 'Source Serif 4', 'Songti SC', 'SimSun', serif;
  --font-body: 'IBM Plex Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'JetBrains Mono', 'SFMono-Regular', monospace;

  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);

  --max-w: 1280px;
  --gutter: 32px;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  color: var(--color-ink);
  background: var(--color-eggshell);
  overflow-x: hidden;
  cursor: none;
}

/* 隐藏默认光标 - 所有可交互元素也用自定义光标 */
a, button, [role="button"], input, textarea, select, summary {
  cursor: none;
}

::selection {
  background: var(--color-sunset);
  color: var(--color-eggshell);
}

img {
  max-width: 100%;
  display: block;
}

button {
  font-family: inherit;
  border: none;
  background: none;
  color: inherit;
}

a {
  color: inherit;
  text-decoration: none;
}

/* 纸纹背景（用 SVG noise 模拟田野笔记纸张） */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: 0.5;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.11 0 0 0 0 0.105 0 0 0 0 0.10 0 0 0 0.06 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  mix-blend-mode: multiply;
}

#root {
  position: relative;
  z-index: 2;
}

/* ============== 排版系统 ============== */

.display-1 {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: clamp(3rem, 7vw, 6.5rem);
  line-height: 0.98;
  letter-spacing: -0.02em;
  font-variation-settings: 'opsz' 60;
}

.display-2 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(2rem, 4vw, 3.5rem);
  line-height: 1.05;
  letter-spacing: -0.01em;
  font-variation-settings: 'opsz' 40;
}

.eyebrow {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--color-feather-dark);
}

.body-lg {
  font-size: 1.125rem;
  line-height: 1.7;
}

.mono {
  font-family: var(--font-mono);
  font-size: 0.875rem;
}

/* ============== 布局工具 ============== */

.container {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 var(--gutter);
}

.section {
  padding: 120px 0;
  position: relative;
}

@media (max-width: 768px) {
  .section { padding: 80px 0; }
  :root { --gutter: 20px; }
}

/* ============== 工具类 ============== */

.text-sunset { color: var(--color-sunset); }
.text-feather { color: var(--color-feather-dark); }
.text-ink { color: var(--color-ink); }

.divider-thin {
  height: 1px;
  background: var(--color-feather-light);
  width: 100%;
}

.divider-thick {
  height: 2px;
  background: var(--color-ink);
  width: 100%;
}

/* 滚动渐入基础状态 */
.reveal {
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.9s var(--ease-out), transform 0.9s var(--ease-out);
}
.reveal.is-visible {
  opacity: 1;
  transform: translateY(0);
}

/* 自定义选择隐藏 */
.no-select {
  user-select: none;
  -webkit-user-select: none;
}

/* 按钮通用 */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 22px;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border: 1px solid var(--color-ink);
  background: transparent;
  color: var(--color-ink);
  position: relative;
  overflow: hidden;
  transition: color 0.35s var(--ease-out);
}
.btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: var(--color-ink);
  transition: left 0.45s var(--ease-out);
  z-index: -1;
}
.btn:hover {
  color: var(--color-eggshell);
}
.btn:hover::before {
  left: 0;
}
.btn--sunset {
  border-color: var(--color-sunset);
  color: var(--color-sunset);
}
.btn--sunset::before {
  background: var(--color-sunset);
}
.btn--sunset:hover {
  color: var(--color-eggshell);
}
.btn--fill {
  background: var(--color-ink);
  color: var(--color-eggshell);
}
.btn--fill::before {
  background: var(--color-sunset);
}

/* 光泽扫过 */
.shimmer {
  position: relative;
  overflow: hidden;
}
.shimmer::after {
  content: '';
  position: absolute;
  top: 0;
  left: -150%;
  width: 60%;
  height: 100%;
  background: linear-gradient(
    120deg,
    transparent 0%,
    rgba(255,255,255,0.4) 50%,
    transparent 100%
  );
  transform: skewX(-20deg);
  pointer-events: none;
}
.shimmer:hover::after {
  animation: shimmer-sweep 1s var(--ease-out) forwards;
}
@keyframes shimmer-sweep {
  0% { left: -150%; }
  100% { left: 150%; }
}

/* 涟漪 */
.ripple {
  position: absolute;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.3;
  transform: scale(0);
  animation: ripple-out 0.6s ease-out forwards;
  pointer-events: none;
}
@keyframes ripple-out {
  to {
    transform: scale(4);
    opacity: 0;
  }
}

/* ============== 迁徙飞线（贯穿页面） ============== */
.migration-flyline {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}
.migration-flyline path {
  fill: none;
  stroke: var(--color-feather-light);
  stroke-width: 1px;
  stroke-dasharray: 3 8;
}

/* ============== 羽毛粒子画布 ============== */
#feather-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 3;
}

/* ============== 自定义光标 ============== */
.cursor-outer,
.cursor-inner,
.cursor-glow {
  position: fixed;
  top: 0;
  left: 0;
  pointer-events: none;
  z-index: 9999;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  will-change: transform;
}

.cursor-outer {
  width: 36px;
  height: 36px;
  border: 2px solid var(--color-ink);
  transition: width 0.25s var(--ease-out),
              height 0.25s var(--ease-out),
              border-color 0.25s var(--ease-out),
              opacity 0.3s;
  mix-blend-mode: difference;
  border-color: #fff;
}

.cursor-inner {
  width: 6px;
  height: 6px;
  background: var(--color-sunset);
  transition: width 0.2s var(--ease-spring),
              height 0.2s var(--ease-spring),
              background 0.2s;
}

.cursor-glow {
  width: 60px;
  height: 60px;
  background: radial-gradient(circle, rgba(228,87,46,0.25) 0%, transparent 70%);
  transition: width 0.3s var(--ease-out),
              height 0.3s var(--ease-out),
              opacity 0.3s;
  opacity: 0;
}

.cursor--hover .cursor-outer {
  width: 60px;
  height: 60px;
  border-color: var(--color-sunset);
}
.cursor--hover .cursor-inner {
  width: 4px;
  height: 4px;
}
.cursor--hover .cursor-glow {
  opacity: 1;
}

.cursor--click .cursor-outer {
  width: 28px;
  height: 28px;
}

.cursor-label {
  position: fixed;
  top: 0; left: 0;
  pointer-events: none;
  z-index: 10000;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-eggshell);
  background: var(--color-ink);
  padding: 4px 8px;
  transform: translate(-50%, -140%);
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.2s;
}
.cursor--label .cursor-label {
  opacity: 1;
}

/* 光标涟漪 */
.cursor-ripple {
  position: fixed;
  top: 0; left: 0;
  width: 36px; height: 36px;
  border: 1px solid var(--color-sunset);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%, -50%) scale(1);
  opacity: 0.6;
  animation: cursor-ripple 0.6s ease-out forwards;
}
@keyframes cursor-ripple {
  to {
    transform: translate(-50%, -50%) scale(3);
    opacity: 0;
  }
}

@media (max-width: 768px), (hover: none) {
  body { cursor: auto; }
  a, button, input, textarea, select { cursor: pointer; }
  .cursor-outer, .cursor-inner, .cursor-glow, .cursor-label { display: none; }
}

/* ============== Reduced Motion ============== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .reveal {
    opacity: 1;
    transform: none;
  }
  #feather-canvas { display: none; }
}

</style>
</head>

  <!-- 工具库 -->
  <script type="text/babel">
/* ============================================================
   工具函数与小工具组件
   所有动画循环均遵循页面可见性切换暂停、卸载统一取消
   ============================================================ */

// ========== RAF 管理器 ==========
// 统一管理 requestAnimationFrame 循环
const RafManager = (() => {
  let callbacks = new Map();
  let rafId = null;
  let isPaused = false;
  let lastTime = 0;

  function tick(t) {
    if (isPaused) { rafId = null; return; }
    const dt = lastTime ? (t - lastTime) / 1000 : 0;
    lastTime = t;
    callbacks.forEach((cb) => {
      try { cb(dt, t); } catch (e) { /* 单个失败不影响其他 */ }
    });
    rafId = requestAnimationFrame(tick);
  }

  function start() {
    if (rafId || callbacks.size === 0) return;
    lastTime = 0;
    rafId = requestAnimationFrame(tick);
  }

  function stop() {
    if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
      lastTime = 0;
    }
  }

  function add(key, cb) {
    callbacks.set(key, cb);
    start();
  }

  function remove(key) {
    callbacks.delete(key);
    if (callbacks.size === 0) stop();
  }

  function pause() { isPaused = true; stop(); }
  function resume() {
    isPaused = false;
    if (callbacks.size > 0) start();
  }

  // 页面可见性监听
  if (typeof document !== 'undefined') {
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) pause();
      else resume();
    });
    // 卸载时彻底清理
    window.addEventListener('beforeunload', stop);
  }

  return { add, remove, pause, resume, stop };
})();

// ========== 弹簧物理（Hooke 定律 + 阻尼） ==========
class Spring {
  constructor({ stiffness = 180, damping = 12, mass = 1, value = 0, target = 0 } = {}) {
    this.stiffness = stiffness;
    this.damping = damping;
    this.mass = mass;
    this.value = value;
    this.target = target;
    this.velocity = 0;
  }
  setTarget(t) { this.target = t; }
  setValue(v) { this.value = v; this.velocity = 0; }
  // 按 dt (秒) 积分一步，返回新值
  step(dt) {
    const k = this.stiffness;
    const d = this.damping;
    const m = this.mass;
    const force = -k * (this.value - this.target) - d * this.velocity;
    const accel = force / m;
    this.velocity += accel * dt;
    this.value += this.velocity * dt;
    return this.value;
  }
}

// ========== 惯性动量（带阻尼的速度） ==========
class Inertia {
  constructor({ damping = 0.92, value = 0 } = {}) {
    this.damping = damping;
    this.value = value;
    this.velocity = 0;
    this._target = value;
  }
  push(velocity) { this.velocity += velocity; }
  setTarget(t) {
    this.velocity += (t - this._target) * 0.15;
    this._target = t;
  }
  step(dt) {
    // 用阻尼衰减速度
    const decay = Math.pow(this.damping, dt * 60);
    this.velocity *= decay;
    this.value += this.velocity * dt * 60;
    return this.value;
  }
}

// ========== 缓动函数 ==========
const Ease = {
  outCubic: (t) => 1 - Math.pow(1 - t, 3),
  inOutCubic: (t) => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2,
  outExpo: (t) => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
  outBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  },
  lerp: (a, b, t) => a + (b - a) * t,
  clamp: (v, min, max) => Math.min(Math.max(v, min), max),
  mapRange: (v, inMin, inMax, outMin, outMax) =>
    outMin + (outMax - outMin) * ((v - inMin) / (inMax - inMin)),
};

// ========== IntersectionObserver 滚动渐入 ==========
const RevealManager = (() => {
  let observer = null;
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function init() {
    if (observer || prefersReducedMotion) return;
    observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });
  }

  function observe(el) {
    if (!el) return;
    init();
    if (prefersReducedMotion) {
      el.classList.add('is-visible');
      return;
    }
    observer.observe(el);
  }

  function observeAll(selector = '.reveal') {
    document.querySelectorAll(selector).forEach(observe);
  }

  return { observe, observeAll };
})();

// ========== 节流 / 防抖 ==========
function throttle(fn, limit = 16) {
  let inThrottle = false;
  let lastArgs = null;
  return function(...args) {
    if (inThrottle) { lastArgs = args; return; }
    fn.apply(this, args);
    inThrottle = true;
    setTimeout(() => {
      inThrottle = false;
      if (lastArgs) { fn.apply(this, lastArgs); lastArgs = null; }
    }, limit);
  };
}

function debounce(fn, delay = 150) {
  let timer = null;
  return function(...args) {
    if (timer) clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), delay);
  };
}

// ========== 小工具组件 ==========

// 章节编号（经纬度风格：N 32° 45′）
function SectionIndex({ num, total = '06', label }) {
  return React.createElement('div', { className: 'section-index no-select' },
    React.createElement('span', { className: 'section-index__num' }, `${num}/${total}`),
    label && React.createElement('span', { className: 'section-index__label mono' }, label)
  );
}

// 羽翼分隔符（SVG 羽毛剪影）
function FeatherDivider({ className = '' }) {
  return React.createElement('div', { className: `feather-divider ${className}` },
    React.createElement('svg', { viewBox: '0 0 200 40', fill: 'none', xmlns: 'http://www.w3.org/2000/svg' },
      React.createElement('path', {
        d: 'M2 20 C 40 20, 60 5, 100 20 C 140 35, 160 20, 198 20',
        stroke: 'currentColor', strokeWidth: '0.8',
      }),
      React.createElement('path', {
        d: 'M100 20 L 100 8 M70 18 L72 10 M130 22 L128 12 M50 18 L52 13 M150 22 L148 14 M85 18 L86 12 M115 21 L114 13',
        stroke: 'currentColor', strokeWidth: '0.6', strokeLinecap: 'round'
      })
    )
  );
}

// 数据徽章
function DataBadge({ value, unit, label }) {
  return React.createElement('div', { className: 'data-badge' },
    React.createElement('div', { className: 'data-badge__value' },
      React.createElement('span', { className: 'num' }, value),
      unit && React.createElement('span', { className: 'unit mono' }, unit),
    ),
    label && React.createElement('div', { className: 'data-badge__label eyebrow' }, label)
  );
}

// 悬停涟漪
function useRipple() {
  const createRipple = (e) => {
    const target = e.currentTarget;
    const rect = target.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    target.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  };
  return createRipple;
}

// ========== 导出到全局 ==========
Object.assign(window, {
  RafManager, Spring, Inertia, Ease,
  RevealManager, throttle, debounce,
  SectionIndex, FeatherDivider, DataBadge, useRipple,
});

</script>

  <script type="text/babel">
/* ============================================================
   CustomCursor - 自定义光标
   特点：
   - 初始在屏幕中央
   - 白色粗环（difference 混合模式）+ 茜红内点 + 多层发光
   - 悬停可交互元素：放大、变色、显示标签
   - 点击涟漪
   - reduced-motion 下禁用
   ============================================================ */

function CustomCursor() {
  const cursorRef = React.useRef(null);
  const outerRef = React.useRef(null);
  const innerRef = React.useRef(null);
  const glowRef = React.useRef(null);
  const labelRef = React.useRef(null);

  React.useEffect(() => {
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isTouch = window.matchMedia('(hover: none)').matches;
    if (prefersReduced || isTouch) return;

    const cursor = cursorRef.current;
    const outer = outerRef.current;
    const inner = innerRef.current;
    const glow = glowRef.current;
    const label = labelRef.current;

    // 初始位置：屏幕中央
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;

    // 外环有延迟（弹簧跟随），内点即时跟随
    let outerX = mouseX;
    let outerY = mouseY;
    let glowX = mouseX;
    let glowY = mouseY;

    const springOuter = new Spring({ stiffness: 220, damping: 18, value: mouseX });
    const springOuterY = new Spring({ stiffness: 220, damping: 18, value: mouseY });
    const springGlow = new Spring({ stiffness: 120, damping: 14, value: mouseX });

        // 飘落速度（受空气阻力，大小不同速度不同）

// 详情弹窗
function SpeciesModal({ species, onClose, modalRef }) {
  const innerRef = React.useRef(null);

  React.useEffect(() => {
    // 进场动画
    const el = innerRef.current;
    if (el) {
      requestAnimationFrame(() => {
        el.classList.add('is-open');
      });
    }
  }, []);

  const handleClose = () => {
    const el = innerRef.current;
    if (el) {
      el.classList.remove('is-open');
      setTimeout(onClose, 300);
    } else {
      onClose();
    }
  };

  return React.createElement('div', {
    className: 'species-modal',
    onClick: handleClose,
    'data-cursor-hover': true,
  },
    React.createElement('div', {
      ref: innerRef,
      className: 'species-modal__inner',
      onClick: (e) => e.stopPropagation(),
      'data-cursor-hover': true,
    },
      React.createElement('button', {
        className: 'species-modal__close',
        onClick: handleClose,
        'aria-label': 'Close',
        'data-cursor-hover': true,
        'data-cursor-label': '关闭',
      },
        React.createElement('span', null),
        React.createElement('span', null)
      ),

      React.createElement('div', { className: 'species-modal__grid' },
        // 左侧大图
        React.createElement('div', {
          className: 'species-modal__image',
          style: { background: species.color }
        },
          React.createElement(BirdSilhouette, { species: species.id, accent: species.accent }),
          React.createElement('div', { className: 'species-modal__status', style: { background: species.accent } },
            species.status
          )
        ),

        // 右侧信息
        React.createElement('div', { className: 'species-modal__content' },
          React.createElement('span', { className: 'eyebrow' }, `SPECIES · ${species.category.toUpperCase()}`),
          React.createElement('h2', { className: 'species-modal__name display-2' }, species.name),
          React.createElement('div', { className: 'species-modal__en' }, species.en),
          React.createElement('p', { className: 'species-modal__latin' },
            React.createElement('em', null, species.latin)
          ),

          React.createElement('div', { className: 'divider-thin species-modal__divider' }),

          React.createElement('p', { className: 'species-modal__desc' }, species.desc),

          // 数据网格
          React.createElement('div', { className: 'species-modal__data' },
            [
              { label: '翼展', value: species.wingspan, sub: 'Wingspan' },
              { label: '体重', value: species.weight, sub: 'Weight' },

  <script type="text/babel">
/* ============================================================
   MigrationFlyline - 贯穿页面的迁徙飞线（签名元素）
   一条 SVG 路径从 Hero 起笔，贯穿各章节
   光点（候鸟）沿路径飞行，途经各章节节点
   ============================================================ */

function MigrationFlyline() {
  const svgRef = React.useRef(null);

  React.useEffect(() => {
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReduced) return;

    const svg = svgRef.current;
    if (!svg) return;

    let isVisible = !document.hidden;
    let rafId = null;

    // 页面高度变化时更新 SVG 高度
    function updateHeight() {
      const h = document.documentElement.scrollHeight;
      svg.setAttribute('height', h);
      svg.style.height = h + 'px';

      // 根据章节位置生成路径
      const sections = ['about', 'migration', 'species', 'observations', 'volunteer'];
      const points = [];

      // 起点：Hero 下方约 80vh 处
      const hero = document.getElementById('top');
      if (hero) {
        const rect = hero.getBoundingClientRect();
        points.push({ x: window.innerWidth * 0.85, y: rect.bottom * 0.7 });
      }

      sections.forEach((id, i) => {
        const el = document.getElementById(id);
        if (el) {
          const rect = el.getBoundingClientRect();
          const top = rect.top + window.scrollY;
          const x = window.innerWidth * (0.15 + ((i % 3) * 0.3));
          points.push({ x, y: top + rect.height * 0.4 });
        }
      });

      // 终点：页脚
      const footer = document.querySelector('.footer');
      if (footer) {
        const rect = footer.getBoundingClientRect();
        points.push({ x: window.innerWidth * 0.75, y: rect.top + window.scrollY + 40 });
      }

      // 生成平滑贝塞尔路径
      if (points.length >= 2) {
        let d = `M ${points[0].x} ${points[0].y}`;
        for (let i = 1; i < points.length; i++) {
          const prev = points[i - 1];
          const curr = points[i];
          const cpx = (prev.x + curr.x) / 2;
          const cpy1 = prev.y + (curr.y - prev.y) * 0.4;
          const cpy2 = curr.y - (curr.y - prev.y) * 0.4;
          d += ` C ${cpx} ${cpy1}, ${cpx} ${cpy2}, ${curr.x} ${curr.y}`;
        }
        const path = svg.querySelector('.flyline-path');
        if (path) {
          path.setAttribute('d', d);

          // 沿路径的光点
          const birds = svg.querySelectorAll('.flyline-bird');
          birds.forEach((bird, idx) => {
            bird.style.offsetPath = `path('${d}')`;
          });
        }
      }
    }

    const resizeHandler = debounce(updateHeight, 200);
    const scrollHandler = throttle(() => {
      // 滚动时更新小鸟沿路径的位置（视差感）
      // 这里用 CSS offset 动画已经足够，不需要 JS 控制位置
    }, 100);

    function onVisibilityChange() {
      isVisible = !document.hidden;
    }

    // 初始化
    const initTimer = setTimeout(updateHeight, 1000);

    window.addEventListener('resize', resizeHandler);
    window.addEventListener('scroll', scrollHandler, { passive: true });
    document.addEventListener('visibilitychange', onVisibilityChange);

    return () => {
      clearTimeout(initTimer);
      window.removeEventListener('resize', resizeHandler);
      window.removeEventListener('scroll', scrollHandler);
      document.removeEventListener('visibilitychange', onVisibilityChange);
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, []);

  return React.createElement('svg', {
    ref: svgRef,
    className: 'migration-flyline-page',
    'aria-hidden': 'true',
    style: {
      position: 'absolute',
      top: 0,
      left: 0,
      width: '100%',
      pointerEvents: 'none',
      zIndex: 1,
    }
  },
    React.createElement('path', {
      className: 'flyline-path',
      fill: 'none',
      stroke: '#E4572E',
      strokeWidth: '0.8',
      strokeDasharray: '3 7',
      opacity: '0.25',
    }),
    // 3 只沿路径飞的候鸟（不同速度/相位）
    React.createElement('circle', {
      className: 'flyline-bird flyline-bird--1',
      r: '2.5',
      fill: '#E4572E',
      style: { animation: 'flyline-fly 30s linear infinite' }
    }),
    React.createElement('circle', {
      className: 'flyline-bird flyline-bird--2',
      r: '1.8',
      fill: '#E4572E',
      style: { animation: 'flyline-fly 35s linear infinite', animationDelay: '-10s', opacity: '0.6' }
    }),
    React.createElement('circle', {
      className: 'flyline-bird flyline-bird--3',
      r: '1.8',
      fill: '#E4572E',
      style: { animation: 'flyline-fly 40s linear infinite', animationDelay: '-22s', opacity: '0.4' }
    }),
  );
}

// 飞线动画样式
const flylinePageStyles = `

  position: absolute;

(function injectFlylineStyles() {
  if (typeof document === 'undefined') return;
  if (document.getElementById('flyline-page-styles')) return;

Object.assign(window, { MigrationFlyline });

</script>

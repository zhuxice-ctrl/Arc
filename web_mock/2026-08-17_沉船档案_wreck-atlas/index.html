<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>沉船档案 · The Wreck Atlas — 深海沉船沉浸式档案馆</title>

<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" />

<style>
/* ============================================================
   The Wreck Atlas — Deep Sea Shipwreck Immersive Archive
   V1 Web Design
   ============================================================ */

:root {
  --abyss: #05100E;
  --abyss-2: #0A1F1A;
  --abyss-3: #0D2922;
  --kelp: #2E5E4E;
  --kelp-light: #3A7A64;
  --phosphor: #7EE8C7;
  --phosphor-dim: #4FC4A0;
  --verdigris: #B08D57;
  --verdigris-light: #C9A874;
  --bone: #EDE6D6;
  --bone-dim: #C8BFAD;
  --rust: #8B5E3C;
  --ink: #020807;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: var(--abyss);
  color: var(--bone);
  font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
  cursor: none;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* Custom cursor */
.cursor-outer {
  position: fixed;
  top: 0; left: 0;
  width: 40px; height: 40px;
  border: 2px solid #ffffff;
  border-radius: 50%;
  pointer-events: none;
  z-index: 99999;
  mix-blend-mode: difference;
  transform: translate(-50%, -50%);
  transition: width 0.3s cubic-bezier(0.23, 1, 0.32, 1),
              height 0.3s cubic-bezier(0.23, 1, 0.32, 1),
              border-color 0.3s ease,
              opacity 0.3s ease;
  will-change: transform;
}
.cursor-inner {
  position: fixed;
  top: 0; left: 0;
  width: 6px; height: 6px;
  background: var(--phosphor);
  border-radius: 50%;
  pointer-events: none;
  z-index: 99999;
  transform: translate(-50%, -50%);
  box-shadow:
    0 0 8px var(--phosphor),
    0 0 16px rgba(126, 232, 199, 0.5),
    0 0 32px rgba(126, 232, 199, 0.3);
  transition: background 0.2s ease, box-shadow 0.2s ease, width 0.2s ease, height 0.2s ease;
  will-change: transform;
}
.cursor-glow {
  position: fixed;
  top: 0; left: 0;
  width: 120px; height: 120px;
  background: radial-gradient(circle, rgba(126, 232, 199, 0.15) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
  z-index: 99998;
  transform: translate(-50%, -50%);
  transition: opacity 0.3s ease, width 0.4s ease, height 0.4s ease;
  will-change: transform;
}
.cursor-outer.hover {
  width: 60px; height: 60px;
  border-color: var(--phosphor);
}
.cursor-inner.hover {
  width: 10px; height: 10px;
  background: var(--verdigris-light);
  box-shadow: 0 0 12px var(--verdigris-light), 0 0 24px rgba(201, 168, 116, 0.5);
}
.cursor-ripple {
  position: fixed;
  top: 0; left: 0;
  width: 10px; height: 10px;
  border: 1px solid var(--phosphor);
  border-radius: 50%;
  pointer-events: none;
  z-index: 99997;
  transform: translate(-50%, -50%);
  opacity: 0;
}
@keyframes rippleExpand {
  0% { width: 10px; height: 10px; opacity: 0.8; }
  100% { width: 120px; height: 120px; opacity: 0; }
}

a, button, [role="button"], .clickable { cursor: none; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--abyss); }
::-webkit-scrollbar-thumb { background: var(--kelp); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--kelp-light); }

/* ============================================================
   Depth meter (left side)
   ============================================================ */
.depth-meter {
  position: fixed;
  left: 32px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  pointer-events: none;
}
.depth-meter .meter-track {
  width: 2px;
  height: 300px;
  background: linear-gradient(to bottom,
    rgba(126, 232, 199, 0.2) 0%,
    rgba(46, 94, 78, 0.3) 50%,
    rgba(5, 16, 14, 0.8) 100%);
  position: relative;
  border-radius: 1px;
}
.depth-meter .meter-needle {
  position: absolute;
  left: -6px;
  top: 0;
  width: 14px;
  height: 14px;
  background: var(--phosphor);
  border-radius: 50%;
  box-shadow:
    0 0 10px var(--phosphor),
    0 0 20px rgba(126, 232, 199, 0.6);
  transition: top 0.1s linear;
}
.depth-meter .meter-ticks {
  position: absolute;
  left: -20px;
  top: 0;
  width: 100%;
  height: 100%;
}
.depth-meter .meter-tick {
  position: absolute;
  left: 0;
  width: 8px;
  height: 1px;
  background: rgba(237, 230, 214, 0.3);
}
.depth-meter .meter-tick.major {
  width: 14px;
  background: rgba(237, 230, 214, 0.6);
}
.depth-meter .depth-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--bone-dim);
  letter-spacing: 0.1em;
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  text-transform: uppercase;
}
.depth-meter .depth-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 18px;
  font-weight: 500;
  color: var(--phosphor);
  letter-spacing: 0.05em;
  text-shadow: 0 0 10px rgba(126, 232, 199, 0.5);
}
.depth-meter .depth-unit {
  font-size: 11px;
  color: var(--bone-dim);
}

/* ============================================================
   Navigation
   ============================================================ */
.top-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 900;
  padding: 24px 48px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  backdrop-filter: blur(8px);
  background: linear-gradient(to bottom, rgba(5, 16, 14, 0.8), transparent);
  transition: padding 0.4s ease, background 0.4s ease;
}
.top-nav.scrolled {
  padding: 16px 48px;
  background: rgba(5, 16, 14, 0.9);
  border-bottom: 1px solid rgba(126, 232, 199, 0.1);
}
.nav-logo {
  display: flex;
  align-items: center;
  gap: 12px;
}
.nav-logo-mark {
  width: 36px; height: 36px;
  border: 1.5px solid var(--phosphor);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.nav-logo-mark::before {
  content: '';
  position: absolute;
  inset: 4px;
  border: 1px solid rgba(126, 232, 199, 0.4);
  border-radius: 50%;
  animation: sonarPulse 3s ease-out infinite;
}
@keyframes sonarPulse {
  0% { transform: scale(1); opacity: 0.6; }
  100% { transform: scale(1.8); opacity: 0; }
}
.nav-logo-mark svg { width: 16px; height: 16px; color: var(--phosphor); }
.nav-logo-text {
  display: flex;
  flex-direction: column;
}
.nav-logo-title {
  font-family: 'Playfair Display', serif;
  font-size: 16px;
  font-weight: 600;
  color: var(--bone);
  letter-spacing: 0.05em;
}
.nav-logo-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--bone-dim);
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
.nav-links {
  display: flex;
  gap: 36px;
  list-style: none;
}
.nav-links a {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--bone-dim);
  text-decoration: none;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  position: relative;
  padding: 4px 0;
  transition: color 0.3s ease;
}
.nav-links a::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 0;
  height: 1px;
  background: var(--phosphor);
  transition: width 0.3s cubic-bezier(0.23, 1, 0.32, 1);
}
.nav-links a:hover { color: var(--phosphor); }
.nav-links a:hover::after { width: 100%; }
.nav-cta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  padding: 10px 20px;
  border: 1px solid var(--phosphor);
  color: var(--phosphor);
  background: transparent;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  position: relative;
  overflow: hidden;
  transition: color 0.3s ease;
}
.nav-cta::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: var(--phosphor);
  transition: left 0.4s cubic-bezier(0.23, 1, 0.32, 1);
  z-index: -1;
}
.nav-cta:hover { color: var(--abyss); }
.nav-cta:hover::before { left: 0; }

/* ============================================================
   HERO — Surface
   ============================================================ */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(126, 232, 199, 0.12) 0%, transparent 60%),
    linear-gradient(to bottom, #0A2320 0%, var(--abyss) 70%);
}
.hero-light-rays {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 70vh;
  pointer-events: none;
  overflow: hidden;
}
.light-ray {
  position: absolute;
  top: -10%;
  width: 2px;
  height: 120%;
  background: linear-gradient(to bottom,
    rgba(126, 232, 199, 0.3) 0%,
    rgba(126, 232, 199, 0.1) 40%,
    transparent 100%);
  transform-origin: top center;
  animation: raySway 8s ease-in-out infinite alternate;
}
@keyframes raySway {
  0% { transform: rotate(-2deg); opacity: 0.6; }
  100% { transform: rotate(2deg); opacity: 0.3; }
}

.hero-particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}
.particle {
  position: absolute;
  background: var(--phosphor);
  border-radius: 50%;
  opacity: 0.4;
  box-shadow: 0 0 4px var(--phosphor);
}

.hero-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--phosphor);
  letter-spacing: 0.4em;
  text-transform: uppercase;
  margin-bottom: 32px;
  opacity: 0;
  animation: fadeInUp 1s 0.5s ease forwards;
  position: relative;
  z-index: 2;
}
.hero-eyebrow::before,
.hero-eyebrow::after {
  content: '';
  display: inline-block;
  width: 40px;
  height: 1px;
  background: var(--phosphor);
  vertical-align: middle;
  margin: 0 16px;
  opacity: 0.5;
}
.hero-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(4rem, 12vw, 10rem);
  font-weight: 900;
  color: var(--bone);
  text-align: center;
  line-height: 0.95;
  letter-spacing: -0.02em;
  margin-bottom: 24px;
  opacity: 0;
  animation: fadeInUp 1.2s 0.7s ease forwards;
  position: relative;
  z-index: 2;
  text-shadow:
    0 0 80px rgba(126, 232, 199, 0.15),
    0 4px 40px rgba(0,0,0,0.5);
}
.hero-title .atlas {
  display: block;
  font-style: italic;
  font-weight: 400;
  color: var(--phosphor);
  font-size: 0.55em;
  letter-spacing: 0.02em;
  margin-top: 8px;
}
.hero-subtitle {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: clamp(1.1rem, 2vw, 1.5rem);
  color: var(--bone-dim);
  max-width: 600px;
  text-align: center;
  margin-bottom: 48px;
  opacity: 0;
  animation: fadeInUp 1s 1s ease forwards;
  position: relative;
  z-index: 2;
}
.hero-stats {
  display: flex;
  gap: 60px;
  margin-bottom: 64px;
  opacity: 0;
  animation: fadeInUp 1s 1.2s ease forwards;
  position: relative;
  z-index: 2;
}
.hero-stat {
  text-align: center;
}
.hero-stat-num {
  font-family: 'Playfair Display', serif;
  font-size: 3rem;
  font-weight: 700;
  color: var(--phosphor);
  line-height: 1;
  margin-bottom: 6px;
  display: block;
}
.hero-stat-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--bone-dim);
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
.hero-dive {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  opacity: 0;
  animation: fadeInUp 1s 1.5s ease forwards;
  position: relative;
  z-index: 2;
  cursor: none;
}
.hero-dive-text {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--bone-dim);
  letter-spacing: 0.3em;
  text-transform: uppercase;
}
.hero-dive-arrow {
  width: 24px;
  height: 40px;
  border: 1.5px solid var(--phosphor);
  border-radius: 12px;
  position: relative;
  animation: arrowPulse 2s ease-in-out infinite;
}
.hero-dive-arrow::after {
  content: '';
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 3px;
  height: 8px;
  background: var(--phosphor);
  border-radius: 2px;
  animation: arrowDot 2s ease-in-out infinite;
}
@keyframes arrowPulse {
  0%, 100% { opacity: 0.6; transform: translateY(0); }
  50% { opacity: 1; transform: translateY(6px); }
}
@keyframes arrowDot {
  0% { top: 8px; opacity: 1; }
  100% { top: 24px; opacity: 0; }
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Surface wave line */
.surface-line {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(to right,
    transparent 0%,
    var(--phosphor) 20%,
    var(--phosphor) 80%,
    transparent 100%);
  opacity: 0.4;
  z-index: 3;
}

/* ============================================================
   Section common
   ============================================================ */
.section {
  position: relative;
  padding: 160px 80px;
  min-height: 100vh;
}
.section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--phosphor);
  letter-spacing: 0.4em;
  text-transform: uppercase;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.section-label::before {
  content: '';
  width: 24px;
  height: 1px;
  background: var(--phosphor);
}
.section-heading {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.5rem, 5vw, 4.5rem);
  font-weight: 700;
  color: var(--bone);
  line-height: 1.1;
  margin-bottom: 24px;
  letter-spacing: -0.01em;
}
.section-heading em {
  font-style: italic;
  font-weight: 400;
  color: var(--phosphor);
}
.section-desc {
  font-size: 1.1rem;
  color: var(--bone-dim);
  max-width: 560px;
  line-height: 1.8;
  margin-bottom: 64px;
}

/* Scroll reveal */
.reveal {
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 1s ease, transform 1s cubic-bezier(0.23, 1, 0.32, 1);
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

/* ============================================================
   Sonar Scan Section
   ============================================================ */
.sonar-section {
  background:
    radial-gradient(ellipse at center, rgba(46, 94, 78, 0.15) 0%, transparent 70%),
    linear-gradient(to bottom, var(--abyss) 0%, var(--abyss-2) 100%);
}
.sonar-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
  align-items: center;
}
.sonar-display-wrap {
  display: flex;
  justify-content: center;
  position: relative;
}
.sonar-display {
  width: 420px;
  height: 420px;
  border-radius: 50%;
  background:
    radial-gradient(circle, rgba(126, 232, 199, 0.05) 0%, transparent 70%),
    var(--ink);
  border: 1px solid rgba(126, 232, 199, 0.3);
  position: relative;
  overflow: hidden;
  box-shadow:
    inset 0 0 60px rgba(126, 232, 199, 0.1),
    0 0 80px rgba(126, 232, 199, 0.05);
}
.sonar-display::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle, transparent 30%, transparent 31%, rgba(126, 232, 199, 0.1) 31%, rgba(126, 232, 199, 0.1) 32%, transparent 32%),
    radial-gradient(circle, transparent 50%, transparent 51%, rgba(126, 232, 199, 0.1) 51%, rgba(126, 232, 199, 0.1) 52%, transparent 52%),
    radial-gradient(circle, transparent 70%, transparent 71%, rgba(126, 232, 199, 0.1) 71%, rgba(126, 232, 199, 0.1) 72%, transparent 72%),
    linear-gradient(to right, transparent 49.5%, rgba(126, 232, 199, 0.15) 50%, transparent 50.5%),
    linear-gradient(to bottom, transparent 49.5%, rgba(126, 232, 199, 0.15) 50%, transparent 50.5%);
  pointer-events: none;
}
.sonar-sweep {
  position: absolute;
  top: 50%; left: 50%;
  width: 50%;
  height: 2px;
  background: linear-gradient(to right, var(--phosphor), transparent);
  transform-origin: left center;
  animation: sonarSweep 4s linear infinite;
  box-shadow: 0 0 10px var(--phosphor);
}
@keyframes sonarSweep {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.sonar-blip {
  position: absolute;
  width: 6px;
  height: 6px;
  background: var(--phosphor);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 8px var(--phosphor);
}
.sonar-blip::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 100%; height: 100%;
  border: 1px solid var(--phosphor);
  border-radius: 50%;
  animation: blipPulse 2s ease-out infinite;
}
@keyframes blipPulse {
  0% { width: 100%; height: 100%; opacity: 1; }
  100% { width: 400%; height: 400%; opacity: 0; }
}
.sonar-center {
  position: absolute;
  top: 50%; left: 50%;
  width: 10px; height: 10px;
  background: var(--phosphor);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 12px var(--phosphor);
  z-index: 2;
}
.sonar-label {
  position: absolute;
  bottom: -40px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--bone-dim);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  white-space: nowrap;
}
.sonar-stats-wrap {
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.sonar-stat-row {
  display: flex;
  gap: 32px;
}
.sonar-stat {
  flex: 1;
  padding: 20px 0;
  border-top: 1px solid rgba(126, 232, 199, 0.15);
}
.sonar-stat-value {
  font-family: 'Playfair Display', serif;
  font-size: 2.5rem;
  font-weight: 600;
  color: var(--phosphor);
  line-height: 1;
  margin-bottom: 8px;
}
.sonar-stat-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--bone-dim);
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
.sonar-stat-desc {
  font-size: 13px;
  color: var(--bone-dim);
  margin-top: 6px;
  opacity: 0.7;
}

/* ============================================================
   Wreck Archive Section
   ============================================================ */
.wreck-section {
  background:
    radial-gradient(ellipse at 50% 30%, rgba(176, 141, 87, 0.08) 0%, transparent 60%),
    linear-gradient(to bottom, var(--abyss-2) 0%, var(--abyss-3) 100%);
}
.wreck-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 48px;
  flex-wrap: wrap;
}
.wreck-tab {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  padding: 12px 24px;
  background: transparent;
  border: 1px solid rgba(237, 230, 214, 0.15);
  color: var(--bone-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}
.wreck-tab:hover {
  border-color: var(--phosphor);
  color: var(--phosphor);
}
.wreck-tab.active {
  background: var(--phosphor);
  border-color: var(--phosphor);
  color: var(--abyss);
}
.wreck-tab .tab-depth {
  display: block;
  font-size: 9px;
  opacity: 0.6;
  margin-top: 2px;
  letter-spacing: 0.15em;
}

.wreck-content {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 60px;
  min-height: 520px;
  position: relative;
}
.wreck-cross-section {
  background: rgba(2, 8, 7, 0.6);
  border: 1px solid rgba(126, 232, 199, 0.15);
  border-radius: 4px;
  padding: 32px;
  position: relative;
  overflow: hidden;
}
.wreck-cross-section::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--phosphor), transparent);
  animation: scanline 4s linear infinite;
}
@keyframes scanline {
  0% { top: 0; opacity: 0; }
  50% { opacity: 0.5; }
  100% { top: 100%; opacity: 0; }
}

/* ---------- Counter hook ---------- */
function useCountUp(target, duration = 2000, start = false) {
  const [value, setValue] = useState(0);
  const frameRef = useRef(null);
  const startTimeRef = useRef(null);
  const startedRef = useRef(false);

  useEffect(() => {
    if (!start || startedRef.current) return;
    startedRef.current = true;
    startTimeRef.current = null;

    const easeOutExpo = (t) => t === 1 ? 1 : 1 - Math.pow(2, -10 * t);

    const animate = (now) => {
      if (!startTimeRef.current) startTimeRef.current = now;
      const elapsed = now - startTimeRef.current;
      const progress = Math.min(elapsed / duration, 1);
      const eased = easeOutExpo(progress);
      setValue(Math.floor(eased * target));
      if (progress < 1) {
        frameRef.current = requestAnimationFrame(animate);
      }
    };

    frameRef.current = requestAnimationFrame(animate);
    return () => {
      if (frameRef.current) cancelAnimationFrame(frameRef.current);
    };
  }, [target, duration, start]);

  return value;
}

/* ---------- StatCounter component ---------- */
function StatCounter({ value, suffix = '', label, visible }) {
  const count = useCountUp(value, 2000, visible);
  return (
    <div className="sonar-stat">

  );
}

/* ---------- Spectrum bars ---------- */
function Spectrum() {
  const barsRef = useRef([]);
  const rafRef = useRef(null);
  const reduced = useRef(false);

  useEffect(() => {
    reduced.current = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced.current) {
      // Static bars for reduced motion
      barsRef.current.forEach((bar, i) => {
        if (bar) bar.style.height = `${20 + (i % 5) * 15}%`;
      });
      return;
    }

    let phase = 0;
    const numBars = 32;

    const tick = () => {
      phase += 0.03;
      for (let i = 0; i < numBars; i++) {
        const bar = barsRef.current[i];
        if (!bar) continue;
        // Combine multiple sine waves for realistic spectrum
        const h =
          15 +
          35 * Math.abs(Math.sin(phase + i * 0.3)) +
          25 * Math.abs(Math.sin(phase * 0.7 + i * 0.5)) +
          20 * Math.abs(Math.sin(phase * 1.3 + i * 0.15));
        bar.style.height = `${Math.min(h, 100)}%`;
      }
      rafRef.current = requestAnimationFrame(tick);
    };

    const handleVisibility = () => {
      if (document.hidden) {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        rafRef.current = null;
      } else if (!rafRef.current && !reduced.current) {
        rafRef.current = requestAnimationFrame(tick);
      }
    };
    document.addEventListener('visibilitychange', handleVisibility);

    rafRef.current = requestAnimationFrame(tick);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      document.removeEventListener('visibilitychange', handleVisibility);
    };
  }, []);

  return (
    <div className="spectrum-wrap">
      <div className="spectrum-header">
        <span className="spectrum-title">声纹频谱分析</span>
        <span className="spectrum-freq">
          FREQ: <span>1.42 kHz</span>
        </span>
      </div>
      <div className="spectrum-bars">
        {[...Array(32)].map((_, i) => (
          <div
            key={i}
            className="spectrum-bar"
            ref={(el) => (barsRef.current[i] = el)}
            style={{ height: '10%' }}
          />
        ))}
      </div>
      <div className="spectrum-labels">
        <span>20 Hz</span>
        <span>1 kHz</span>
        <span>20 kHz</span>
      </div>
    </div>
  );
}

/* ---------- Typewriter ---------- */
function Typewriter({ text, speed = 60, start = false, delay = 0 }) {
  const [display, setDisplay] = useState('');
  const timeoutRef = useRef(null);

  useEffect(() => {
    if (!start) return;
    let i = 0;
    setDisplay('');

    const type = () => {
      if (i < text.length) {
        setDisplay(text.slice(0, i + 1));
        i++;
        timeoutRef.current = setTimeout(type, speed + Math.random() * 30);
      }
    };

    timeoutRef.current = setTimeout(type, delay);
    return () => {
      if (timeoutRef.current) clearTimeout(timeoutRef.current);
    };
  }, [text, speed, start, delay]);

  return (
    <span>
      {display}
      {start && display.length < text.length && (
        <span style={{ opacity: 0.7, animation: 'blink 1s step-end infinite' }}>_</span>
      )}
    </span>
  );
}

  const [timelineVisible, setTimelineVisible] = useState(false);

  // 3D tilt refs
  const cardRefs = useRef([]);

  useEffect(() => {
    // Intersection Observer for reveal animations
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
          }
        });
      },
      { threshold: 0.15 }
    );

    document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));

    // Section-specific triggers
    const sonarSec = document.getElementById('sonar');
    const wreckSec = document.getElementById('wrecks');
    const timelineSec = document.getElementById('timeline');

    const triggerObserver = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            if (entry.target.id === 'sonar') setSonarVisible(true);
            if (entry.target.id === 'wrecks') setWreckVisible(true);
            if (entry.target.id === 'timeline') setTimelineVisible(true);
          }
        });
      },
      { threshold: 0.3 }
    );

    if (sonarSec) triggerObserver.observe(sonarSec);
    if (wreckSec) triggerObserver.observe(wreckSec);
    if (timelineSec) triggerObserver.observe(timelineSec);

    return () => {
      observer.disconnect();
      triggerObserver.disconnect();
    };
  }, []);

  // 3D tilt effect on artifact cards
  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;

    const cards = cardRefs.current.filter(Boolean);

    const handleMove = (e, card) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotateY = ((x - centerX) / centerX) * 6;
      const rotateX = ((centerY - y) / centerY) * 6;
      card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(0)`;
    };

    const handleLeave = (card) => {
      card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0)';
    };

    cards.forEach((card) => {
      const move = (e) => handleMove(e, card);
      const leave = () => handleLeave(card);
      card.addEventListener('mousemove', move);
      card.addEventListener('mouseleave', leave);
      card._tiltMove = move;
      card._tiltLeave = leave;
    });

    return () => {
      cards.forEach((card) => {
        if (card._tiltMove) card.removeEventListener('mousemove', card._tiltMove);
        if (card._tiltLeave) card.removeEventListener('mouseleave', card._tiltLeave);
      });

/* ============================================================
   Custom Cursor (vanilla JS for performance)
   ============================================================ */
(function initCursor() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const outer = document.getElementById('cursorOuter');
  const inner = document.getElementById('cursorInner');
  const glow = document.getElementById('cursorGlow');
  if (!outer || !inner || !glow) return;

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let outerX = mouseX;
  let outerY = mouseY;
  let glowX = mouseX;
  let glowY = mouseY;
  let rafId = null;
  let visible = true;

  // Initialize at center
  outer.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
  inner.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
  glow.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;

  const lerp = (a, b, t) => a + (b - a) * t;

  function animate() {
    if (!visible) return;
    // Outer follows with spring/damping
    outerX = lerp(outerX, mouseX, reduced ? 1 : 0.15);
    outerY = lerp(outerY, mouseY, reduced ? 1 : 0.15);
    outer.style.transform = `translate(${outerX}px, ${outerY}px) translate(-50%, -50%)`;

    // Glow with heavier damping
    glowX = lerp(glowX, mouseX, reduced ? 1 : 0.08);
    glowY = lerp(glowY, mouseY, reduced ? 1 : 0.08);
    glow.style.transform = `translate(${glowX}px, ${glowY}px) translate(-50%, -50%)`;

    rafId = requestAnimationFrame(animate);
  }

  function onMouseMove(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
    // Inner follows instantly (direct DOM transform, no React)
    inner.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
    if (!rafId && visible) {
      rafId = requestAnimationFrame(animate);
    }
  }

  function onMouseOver(e) {
    const target = e.target.closest('a, button, [role="button"], .clickable, input, textarea, select');
    if (target) {
      outer.classList.add('hover');
      inner.classList.add('hover');
    } else {
      outer.classList.remove('hover');
      inner.classList.remove('hover');
    }
  }

  function onClick(e) {
    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    ripple.style.animation = 'rippleExpand 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  }

  function onVisibility() {
    if (document.hidden) {
      visible = false;
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    } else {
      visible = true;
      if (!rafId) rafId = requestAnimationFrame(animate);
    }
  }

  window.addEventListener('mousemove', onMouseMove, { passive: true });
  document.addEventListener('mouseover', onMouseOver);
  document.addEventListener('click', onClick);
  document.addEventListener('visibilitychange', onVisibility);

  // Start animation
  rafId = requestAnimationFrame(animate);

  // Cleanup on unload
  window.addEventListener('beforeunload', () => {
    if (rafId) cancelAnimationFrame(rafId);
    window.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseover', onMouseOver);
    document.removeEventListener('click', onClick);
    document.removeEventListener('visibilitychange', onVisibility);
  }, { once: true });
})();

/* ============================================================
   Depth Meter & Scroll Logic (vanilla JS)
   ============================================================ */
(function initDepth() {
  const needle = document.getElementById('meterNeedle');
  const depthValue = document.getElementById('depthValue');
  const ticks = document.getElementById('meterTicks');
  const topNav = document.getElementById('topNav');
  const diveCta = document.getElementById('diveCta');

  if (!needle || !depthValue || !ticks) return;

  // Generate meter ticks
  for (let i = 0; i <= 10; i++) {
    const tick = document.createElement('div');
    tick.className = 'meter-tick' + (i % 2 === 0 ? ' major' : '');
    tick.style.top = `${i * 10}%`;
    ticks.appendChild(tick);
  }

  const maxDepth = 4000;

  function onScroll() {
    const scrollTop = window.scrollY;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const progress = Math.min(scrollTop / docHeight, 1);
    const depth = Math.floor(progress * maxDepth);

    // Update depth number
    depthValue.textContent = depth.toLocaleString();

    // Update needle position
    needle.style.top = `${progress * 100}%`;

    // Nav scroll state
    if (topNav) {
      if (scrollTop > 100) topNav.classList.add('scrolled');
      else topNav.classList.remove('scrolled');
    }
  }

  let ticking = false;
  window.addEventListener('scroll', () => {
    if (!ticking) {
      requestAnimationFrame(() => {
        onScroll();
        ticking = false;
      });
      ticking = true;
    }
  }, { passive: true });

  // Smooth scroll for dive CTA
  if (diveCta) {
    diveCta.addEventListener('click', () => {
      const target = document.getElementById('sonar');
      if (target) target.scrollIntoView({ behavior: 'smooth' });
    });
  }

  // Smooth scroll for nav links
  document.querySelectorAll('.nav-links a').forEach((link) => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      const href = link.getAttribute('href');
      const target = document.querySelector(href);
      if (target) target.scrollIntoView({ behavior: 'smooth' });
    });
  });

  // Nav CTA scroll
  const navCta = document.querySelector('.nav-cta');
  if (navCta) {
    navCta.addEventListener('click', () => {
      const target = document.getElementById('sonar');
      if (target) target.scrollIntoView({ behavior: 'smooth' });
    });
  }

  onScroll();
})();

/* ============================================================
   Hero Particles (floating marine snow)
   ============================================================ */
(function initParticles() {
  const container = document.getElementById('heroParticles');
  if (!container) return;

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const count = reduced ? 20 : 60;
  const particles = [];
  let rafId = null;

  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 3 + 1;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    const x = Math.random() * 100;
    const y = Math.random() * 100;
    p.style.left = x + '%';
    p.style.top = y + '%';
    p.style.opacity = (Math.random() * 0.4 + 0.1).toString();
    container.appendChild(p);

    particles.push({
      el: p,
      x,
      y,
      vy: Math.random() * 0.02 + 0.005,
      vx: Math.random() * 0.01 - 0.005,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: Math.random() * 0.01 + 0.005,
    });
  }

  function animate() {
    particles.forEach((p) => {
      p.wobble += p.wobbleSpeed;
      p.x += p.vx + Math.sin(p.wobble) * 0.005;
      p.y += p.vy;

      if (p.y > 105) {
        p.y = -5;
        p.x = Math.random() * 100;
      }
      if (p.x < -5) p.x = 105;
      if (p.x > 105) p.x = -5;

      p.el.style.left = p.x + '%';
      p.el.style.top = p.y + '%';
    });
    rafId = requestAnimationFrame(animate);
  }

  function onVisibility() {
    if (document.hidden) {
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    } else if (!rafId) {
      rafId = requestAnimationFrame(animate);
    }
  }

  document.addEventListener('visibilitychange', onVisibility);
  rafId = requestAnimationFrame(animate);

  window.addEventListener('beforeunload', () => {
    if (rafId) cancelAnimationFrame(rafId);
    document.removeEventListener('visibilitychange', onVisibility);
  }, { once: true });
})();

/* ============================================================
   Hero Stat Counters
   ============================================================ */
(function initHeroCounters() {
  const targets = [
    { id: 'statWrecks', value: 347, suffix: '+' },
    { id: 'statDepth', value: 4791, suffix: '' },
    { id: 'statArtifacts', value: 8600, suffix: '+' },
  ];

  targets.forEach(({ id, value, suffix }) => {
    const el = document.getElementById(id);
    if (!el) return;

    let start = null;
    const duration = 2000;
    let rafId = null;

    const easeOutExpo = (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t));

    function animate(now) {
      if (!start) start = now;
      const elapsed = now - start;
      const progress = Math.min(elapsed / duration, 1);
      const eased = easeOutExpo(progress);
      el.textContent = Math.floor(eased * value).toLocaleString() + suffix;
      if (progress < 1) rafId = requestAnimationFrame(animate);
    }

    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            rafId = requestAnimationFrame(animate);
            observer.disconnect();
          }
        });
      },
      { threshold: 0.5 }
    );
    observer.observe(el);
  });
})();

/* ============================================================

(function announceUpgrade() {
  function announce() {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  }
  announce();
  if (document.readyState !== 'complete') {
    window.addEventListener('load', announce, { once: true });
  }
})();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>云端之上 Skybound · 高原热气球节</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" />
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  /* ========== 设计令牌 ========== */
  :root {
    --terracotta: #C1502E;
    --sand-gold: #D9A441;
    --lime-white: #F4EDE0;
    --olive: #4A5230;
    --chestnut: #3B2A20;
    --warm-beige: #E8DCC5;
    --soft-rust: #A84225;
    --cream: #FBF6EC;
    --font-display: 'Noto Serif SC', serif;
    --font-body: 'Noto Sans SC', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-body);
    background: var(--lime-white);
    color: var(--chestnut);
    overflow-x: hidden;
    cursor: none;
  }

  /* 自定义光标兜底 */
  @media (hover: none) {
    body { cursor: auto; }
    .cursor-ring, .cursor-dot { display: none; }
  }

  /* ========== 自定义光标 ========== */
  .cursor-ring {
    position: fixed;
    top: 0; left: 0;
    width: 36px; height: 36px;
    border: 2px solid #fff;
    border-radius: 50%;
    pointer-events: none;
    z-index: 99999;
    transform: translate(-50%, -50%);
    transition: width .25s cubic-bezier(.4,0,.2,1), height .25s cubic-bezier(.4,0,.2,1),
                border-color .25s, background .25s;
    mix-blend-mode: difference;
    box-shadow: 0 0 16px rgba(255,255,255,.4), 0 0 32px rgba(193,80,46,.3);
  }
  .cursor-ring.hover {
    width: 60px; height: 60px;
    border-color: var(--sand-gold);
    background: rgba(217,164,65,.12);
  }
  .cursor-ring.click {
    width: 20px; height: 20px;
  }
  .cursor-dot {
    position: fixed;
    top: 0; left: 0;
    width: 6px; height: 6px;
    background: var(--terracotta);
    border-radius: 50%;
    pointer-events: none;
    z-index: 100000;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px var(--terracotta), 0 0 20px rgba(193,80,46,.6);
    transition: transform .12s ease-out;
  }

  /* 涟漪 */
  .cursor-ripple {
    position: fixed;
    border: 2px solid var(--sand-gold);
    border-radius: 50%;
    pointer-events: none;
    z-index: 99998;
    transform: translate(-50%, -50%) scale(0);
    opacity: 1;
    animation: rippleExpand .6s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes rippleExpand {
    to { transform: translate(-50%,-50%) scale(6); opacity: 0; }
  }

  /* ========== 页面进度条 ========== */
  .page-progress {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--terracotta), var(--sand-gold));
    z-index: 10000;
    width: 0%;
    transition: width .1s linear;
  }

  /* ========== 导航 ========== */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    padding: 20px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background .4s, backdrop-filter .4s, padding .4s;
  }
  .nav.scrolled {
    background: rgba(244,237,224,.85);
    backdrop-filter: blur(12px);
    padding: 12px 48px;
    border-bottom: 1px solid rgba(59,42,32,.1);
  }
  .nav-logo {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 22px;
    color: var(--chestnut);
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }
  .nav-logo-balloon {
    width: 28px; height: 34px;
    position: relative;
  }
  .nav-links {
    display: flex;
    gap: 36px;
    list-style: none;
  }
  .nav-links a {
    font-size: 14px;
    color: var(--chestnut);
    text-decoration: none;
    position: relative;
    padding: 4px 0;
    transition: color .3s;
  }
  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 0; height: 2px;
    background: var(--terracotta);
    transition: width .3s cubic-bezier(.4,0,.2,1);
  }
  .nav-links a:hover { color: var(--terracotta); }
  .nav-links a:hover::after { width: 100%; }
  .nav-cta {
    padding: 10px 24px;
    background: var(--chestnut);
    color: var(--lime-white) !important;
    border-radius: 999px;
    font-size: 14px;
    transition: background .3s, transform .3s;
    display: inline-block;
  }
  .nav-cta:hover {
    background: var(--terracotta);
    transform: translateY(-1px);
  }

  .hamburger { display: none; }

  /* ========== Hero ========== */
  .hero {
    position: relative;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #F9EFD8 0%, #F4EDE0 40%, #E8DCC5 100%);
  }
  .hero-bg {
    position: absolute;
    inset: 0;
    z-index: 1;
  }
  .hero-bg img {
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: .55;
    mask-image: linear-gradient(to bottom, transparent 0%, black 25%, black 75%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 25%, black 75%, transparent 100%);
  }

  /* 晨光层 */
  .hero-sun-glow {
    position: absolute;
    top: 15%; left: 50%;
    transform: translateX(-50%);
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(217,164,65,.45) 0%, rgba(193,80,46,.2) 40%, transparent 70%);
    z-index: 2;
    filter: blur(20px);
    animation: sunPulse 6s ease-in-out infinite alternate;
  }
  @keyframes sunPulse {
    from { transform: translateX(-50%) scale(1); opacity: .8; }
    to { transform: translateX(-50%) scale(1.08); opacity: 1; }
  }

  /* 热气球容器 */
  .balloon-layer {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }

  /* 热气球本体 SVG */
  .balloon {
    position: absolute;
    will-change: transform;
  }
  .balloon svg { display: block; }
  .balloon-patch { transition: transform .4s cubic-bezier(.4,0,.2,1); transform-origin: center; }
  .balloon:hover .balloon-patch { transform: rotate(2deg) scale(1.02); }

  .hero-content {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 0 24px;
    max-width: 900px;
  }
  .hero-eyebrow {
    font-size: 14px;
    letter-spacing: 6px;
    color: var(--terracotta);
    font-weight: 500;
    margin-bottom: 20px;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 1s .3s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .hero-title {
    font-family: var(--font-display);
    font-size: clamp(48px, 8vw, 110px);
    font-weight: 900;
    line-height: 1.05;
    color: var(--chestnut);
    margin-bottom: 24px;
    opacity: 0;
    transform: translateY(30px);
    animation: fadeUp 1.2s .5s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .hero-title span {
    background: linear-gradient(135deg, var(--terracotta), var(--sand-gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero-subtitle {
    font-size: 18px;
    line-height: 1.8;
    color: var(--olive);
    max-width: 560px;
    margin: 0 auto 40px;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 1s .8s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .hero-actions {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 1s 1.1s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .btn-primary {
    padding: 16px 36px;
    background: var(--terracotta);
    color: #fff;
    border: none;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 500;
    cursor: none;
    position: relative;
    overflow: hidden;
    transition: transform .3s, box-shadow .3s;
    box-shadow: 0 8px 24px rgba(193,80,46,.3);
    font-family: var(--font-body);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(193,80,46,.4);
  }
  .btn-primary::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);
    transition: left .6s;
  }
  .btn-primary:hover::before { left: 120%; }

  .btn-secondary {
    padding: 16px 36px;
    background: transparent;
    color: var(--chestnut);
    border: 1.5px solid var(--chestnut);
    border-radius: 999px;
    font-size: 15px;
    font-weight: 500;
    cursor: none;
    transition: all .3s;
    font-family: var(--font-body);
  }
  .btn-secondary:hover {
    background: var(--chestnut);
    color: var(--lime-white);
  }

  .hero-scroll {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: var(--olive);
    font-size: 12px;
    letter-spacing: 2px;
    animation: floatY 2s ease-in-out infinite;
  }
  .hero-scroll-line {
    width: 1px; height: 40px;
    background: linear-gradient(to bottom, var(--olive), transparent);
  }
  @keyframes floatY {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-8px); }
  }

  /* ========== 数字计数 ========== */
  .stats-bar {
    background: var(--chestnut);
    padding: 60px 48px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 32px;
    color: var(--lime-white);
  }
  .stat-item {
    text-align: center;
  }
  .stat-number {
    font-family: var(--font-display);
    font-size: 56px;
    font-weight: 700;
    color: var(--sand-gold);
    line-height: 1;
    margin-bottom: 8px;
  }
  .stat-number small {
    font-size: 24px;
    color: var(--warm-beige);
    margin-left: 4px;
  }
  .stat-label {
    font-size: 14px;
    color: var(--warm-beige);
    letter-spacing: 2px;
  }

  /* ========== 通用区块 ========== */
  .section {
    padding: 120px 48px;
    position: relative;
  }
  .section-inner {
    max-width: 1280px;
    margin: 0 auto;
  }
  .section-head {
    text-align: center;
    margin-bottom: 72px;
  }
  .section-eyebrow {
    font-size: 13px;
    letter-spacing: 6px;
    color: var(--terracotta);
    font-weight: 500;
    margin-bottom: 16px;
  }
  .section-title {
    font-family: var(--font-display);
    font-size: clamp(32px, 5vw, 52px);
    font-weight: 700;
    color: var(--chestnut);
    margin-bottom: 16px;
  }
  .section-desc {
    font-size: 16px;
    color: var(--olive);
    max-width: 560px;
    margin: 0 auto;
    line-height: 1.8;
  }

  /* 滚动渐入 */
  .reveal {
    opacity: 0;
    transform: translateY(40px);
    transition: opacity .8s cubic-bezier(.2,.8,.2,1), transform .8s cubic-bezier(.2,.8,.2,1);
  }
  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* ========== 节庆日程 ========== */
  .schedule-section {
    background: var(--cream);
  }
  .schedule-tabs {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 48px;
    flex-wrap: wrap;
  }
  .schedule-tab {
    padding: 12px 28px;
    border: 1.5px solid var(--warm-beige);
    background: transparent;
    border-radius: 999px;
    font-size: 14px;
    color: var(--chestnut);
    cursor: none;
    font-family: var(--font-body);
    transition: all .3s;
  }
  .schedule-tab.active {
    background: var(--chestnut);
    border-color: var(--chestnut);
    color: var(--lime-white);
  }
  .schedule-tab:hover:not(.active) {
    border-color: var(--terracotta);
    color: var(--terracotta);
  }

  .timeline {
    position: relative;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 0;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 0; bottom: 0;
    width: 2px;
    background: var(--warm-beige);
    transform: translateX(-50%);
  }
  .timeline-progress {
    position: absolute;
    left: 50%;
    top: 0;
    width: 2px;
    background: linear-gradient(to bottom, var(--terracotta), var(--sand-gold));
    transform: translateX(-50%);
    transition: height .5s cubic-bezier(.2,.8,.2,1);
  }
  .timeline-item {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
    margin-bottom: 48px;
    position: relative;
  }
  .timeline-item:nth-child(odd) .timeline-content {
    grid-column: 1;
    text-align: right;
  }
  .timeline-item:nth-child(even) .timeline-content {
    grid-column: 2;
  }
  .timeline-dot {
    position: absolute;
    left: 50%;
    top: 8px;
    width: 16px; height: 16px;
    background: var(--sand-gold);
    border: 3px solid var(--cream);
    border-radius: 50%;
    transform: translateX(-50%);
    z-index: 2;
    box-shadow: 0 0 0 4px rgba(217,164,65,.2);
    transition: all .4s;
  }
  .timeline-item:hover .timeline-dot {
    background: var(--terracotta);
    box-shadow: 0 0 0 8px rgba(193,80,46,.2);
    transform: translateX(-50%) scale(1.2);
  }
  .timeline-time {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 700;
    color: var(--terracotta);
    margin-bottom: 8px;
  }
  .timeline-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--chestnut);
    margin-bottom: 6px;
  }
  .timeline-desc {
    font-size: 14px;
    color: var(--olive);
    line-height: 1.7;
  }

  /* ========== 飞行员阵容 ========== */
  .pilots-section {
    background: var(--lime-white);
  }
  .pilots-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 32px;
  }
  .pilot-card {
    perspective: 1000px;
    cursor: none;
  }
  .pilot-card-inner {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    background: var(--warm-beige);
    transform-style: preserve-3d;
    transition: transform .3s ease-out, box-shadow .4s;
    will-change: transform;
  }
  .pilot-card:hover .pilot-card-inner {
    box-shadow: 0 24px 48px rgba(59,42,32,.2);
  }
  .pilot-image {
    width: 100%;
    aspect-ratio: 3/4;
    overflow: hidden;
    position: relative;
  }
  .pilot-image img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform .6s cubic-bezier(.2,.8,.2,1);
  }
  .pilot-card:hover .pilot-image img {
    transform: scale(1.06);
  }
  .pilot-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 24px;
    background: linear-gradient(to top, rgba(59,42,32,.9), transparent);
    color: var(--lime-white);
    transform: translateY(20px);
    opacity: 0;
    transition: all .4s cubic-bezier(.2,.8,.2,1);
  }
  .pilot-card:hover .pilot-overlay {
    transform: translateY(0);
    opacity: 1;
  }
  .pilot-overlay p {
    font-size: 13px;
    line-height: 1.7;
  }
  .pilot-info {
    padding: 20px 24px;
    background: var(--cream);
  }
  .pilot-name {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 700;
    color: var(--chestnut);
    margin-bottom: 4px;
  }
  .pilot-meta {
    font-size: 13px;
    color: var(--olive);
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .pilot-meta span { display: flex; align-items: center; gap: 4px; }

  /* ========== 票务 ========== */
  .tickets-section {
    background: linear-gradient(180deg, var(--chestnut) 0%, #2a1e17 100%);
    color: var(--lime-white);
  }
  .tickets-section .section-title { color: var(--lime-white); }
  .tickets-section .section-desc { color: var(--warm-beige); }
  .tickets-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 24px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .ticket-card {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(244,237,224,.15);
    border-radius: 20px;
    padding: 40px 32px;
    position: relative;
    overflow: hidden;
    transition: transform .4s cubic-bezier(.2,.8,.2,1), border-color .4s, background .4s;
    cursor: none;
  }
  .ticket-card:hover {
    transform: translateY(-8px);
    border-color: rgba(217,164,65,.4);
    background: rgba(255,255,255,.06);
  }
  .ticket-card.featured {
    border-color: var(--sand-gold);
    background: rgba(217,164,65,.08);
  }
  .ticket-card.featured::before {
    content: '最受欢迎';
    position: absolute;
    top: 20px; right: -30px;
    background: var(--sand-gold);
    color: var(--chestnut);
    padding: 4px 36px;
    font-size: 12px;
    font-weight: 700;
    transform: rotate(35deg);
  }
  .ticket-card::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
    transition: left .8s;
    pointer-events: none;
  }
  .ticket-card:hover::after { left: 120%; }
  .ticket-name {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--lime-white);
  }
  .ticket-price {
    font-family: var(--font-display);
    font-size: 48px;
    font-weight: 700;
    color: var(--sand-gold);
    margin-bottom: 4px;
  }
  .ticket-price span {
    font-size: 16px;
    color: var(--warm-beige);
    font-weight: 400;
  }
  .ticket-sub {
    font-size: 13px;
    color: var(--warm-beige);
    margin-bottom: 24px;
  }
  .ticket-features {
    list-style: none;
    margin-bottom: 28px;
  }
  .ticket-features li {
    padding: 10px 0;
    font-size: 14px;
    color: var(--warm-beige);
    display: flex;
    align-items: flex-start;
    gap: 10px;
    border-bottom: 1px solid rgba(244,237,224,.08);
  }
  .ticket-features li::before {
    content: '';
    flex-shrink: 0;
    width: 6px; height: 6px;
    background: var(--sand-gold);
    border-radius: 50%;
    margin-top: 7px;
  }
  .ticket-btn {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 1.5px solid var(--sand-gold);
    color: var(--sand-gold);
    border-radius: 999px;
    font-size: 15px;
    font-weight: 500;
    cursor: none;
    transition: all .3s;
    font-family: var(--font-body);
  }
  .ticket-btn:hover {
    background: var(--sand-gold);
    color: var(--chestnut);
  }
  .ticket-card.featured .ticket-btn {
    background: var(--sand-gold);
    color: var(--chestnut);
  }
  .ticket-card.featured .ticket-btn:hover {
    background: var(--terracotta);
    border-color: var(--terracotta);
    color: #fff;
  }
  .ticket-extra {
    max-height: 0;
    overflow: hidden;
    transition: max-height .5s cubic-bezier(.2,.8,.2,1);
    margin-top: 0;
  }
  .ticket-card.expanded .ticket-extra {
    max-height: 300px;
    margin-top: 16px;
  }
  .ticket-extra-title {
    font-size: 13px;
    color: var(--sand-gold);
    margin-bottom: 10px;
    font-weight: 600;
  }
  .ticket-extra-list {
    list-style: none;
  }
  .ticket-extra-list li {
    padding: 6px 0;
    font-size: 13px;
    color: var(--warm-beige);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ========== 场地指南 ========== */
  .venue-section {
    background: var(--cream);
  }
  .venue-wrap {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 64px;

// ========== 自定义光标 ==========
function CustomCursor() {
  const ringRef = useRef(null);
  const dotRef = useRef(null);
  const posRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const targetRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const rafRef = useRef(null);
  const visibleRef = useRef(true);

  useEffect(() => {
    const ring = ringRef.current;
    const dot = dotRef.current;
    if (!ring || !dot) return;

    // 检测 reduced motion
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;

    // 设置初始位置在屏幕中央
    ring.style.left = posRef.current.x + 'px';
    ring.style.top = posRef.current.y + 'px';
    dot.style.left = posRef.current.x + 'px';
    dot.style.top = posRef.current.y + 'px';

    const onMove = (e) => {
      targetRef.current.x = e.clientX;
      targetRef.current.y = e.clientY;
    };

    // 弹簧跟随（环）
    const animate = () => {
      if (!visibleRef.current) { rafRef.current = requestAnimationFrame(animate); return; }
      const dx = targetRef.current.x - posRef.current.x;
      const dy = targetRef.current.y - posRef.current.y;
      // Hooke 定律: F = -kx - bv，简化为 lerp 阻尼
      posRef.current.x += dx * 0.15;
      posRef.current.y += dy * 0.15;
      ring.style.left = posRef.current.x + 'px';
      ring.style.top = posRef.current.y + 'px';
      dot.style.left = targetRef.current.x + 'px';
      dot.style.top = targetRef.current.y + 'px';
      rafRef.current = requestAnimationFrame(animate);
    };
    rafRef.current = requestAnimationFrame(animate);

    // 悬停交互元素
    const onOver = (e) => {
      if (e.target.closest('a, button, [data-hover], input, .pilot-card, .ticket-card, .gallery-item, .venue-hotspot')) {
        ring.classList.add('hover');
      } else {
        ring.classList.remove('hover');
      }
    };

    // 点击涟漪
    const onClick = (e) => {
      ring.classList.add('click');
      setTimeout(() => ring.classList.remove('click'), 150);
      // 涟漪
      const ripple = document.createElement('div');
      ripple.className = 'cursor-ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    };

    const onVisibility = () => {
      visibleRef.current = !document.hidden;
    };

    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseover', onOver);
    window.addEventListener('click', onClick);
    document.addEventListener('visibilitychange', onVisibility);

    return () => {
      cancelAnimationFrame(rafRef.current);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseover', onOver);
      window.removeEventListener('click', onClick);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, []);

  return (
    <>
      <div ref={ringRef} className="cursor-ring" />
      <div ref={dotRef} className="cursor-dot" />
    </>
  );
}

// ========== 拼布热气球 SVG ==========
function PatchworkBalloon({ size = 120, colors = ['#C1502E', '#D9A441', '#4A5230', '#F4EDE0', '#E8DCC5'], style = {} }) {
  const r = size / 2;
  const cx = r;
  const cy = r;
  // 纵向 6 片拼布
  const patches = [];
  for (let i = 0; i < 6; i++) {
    const angle = (i / 6) * Math.PI * 2;
    const nextAngle = ((i + 1) / 6) * Math.PI * 2;
    const x1 = cx + Math.cos(angle) * r;
    const y1 = cy + Math.sin(angle) * r * 0.9;
    const x2 = cx + Math.cos(nextAngle) * r;
    const y2 = cy + Math.sin(nextAngle) * r * 0.9;
    const color = colors[i % colors.length];
    patches.push(
      <path
        key={i}
        d={`M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r*0.9} 0 0 1 ${x2} ${y2} Z`}
        fill={color}
        className="balloon-patch"
        style={{ transformOrigin: `${cx}px ${cy}px` }}
      />
    );
  }
  // 底部收口
  const bottomY = cy + r * 0.85;
  const basketTop = bottomY + 6;

  return (
    <svg width={size} height={size * 1.35} viewBox={`0 0 ${size} ${size * 1.35}`} style={style}>
      <defs>
        <radialGradient id={`balloon-shine-${size}`} cx="35%" cy="30%" r="60%">
          <stop offset="0%" stopColor="#fff" stopOpacity="0.3" />
          <stop offset="100%" stopColor="#fff" stopOpacity="0" />
        </radialGradient>
      </defs>
      <g>
        {patches}
        {/* 高光 */}
        <ellipse cx={cx} cy={cy} rx={r * 0.95} ry={r * 0.85} fill={`url(#balloon-shine-${size})`} />
        {/* 收口 */}
        <path d={`M ${cx - r*0.15} ${bottomY} Q ${cx} ${bottomY + 8} ${cx + r*0.15} ${bottomY}`} fill={colors[0]} opacity="0.8" />
        {/* 绳索 */}
        <line x1={cx - r*0.12} y1={bottomY + 2} x2={cx - r*0.18} y2={basketTop + size*0.15} stroke="#3B2A20" strokeWidth="1" />
        <line x1={cx + r*0.12} y1={bottomY + 2} x2={cx + r*0.18} y2={basketTop + size*0.15} stroke="#3B2A20" strokeWidth="1" />
        <line x1={cx} y1={bottomY + 4} x2={cx} y2={basketTop + size*0.15} stroke="#3B2A20" strokeWidth="1" />
        {/* 吊篮 */}
        <rect x={cx - r*0.22} y={basketTop + size*0.15} width={r*0.44} height={size*0.12} rx="3" fill="#8B6F47" />
        <rect x={cx - r*0.22} y={basketTop + size*0.15} width={r*0.44} height={size*0.04} rx="2" fill="#A0826D" />
      </g>
    </svg>
  );
}

// ========== 数字计数 ==========
function CountUp({ end, duration = 2000, suffix = '', prefix = '' }) {
  const [count, setCount] = useState(0);
  const ref = useRef(null);
  const startedRef = useRef(false);
  const rafRef = useRef(null);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting && !startedRef.current) {
          startedRef.current = true;
          const startTime = performance.now();
          const step = (now) => {
            const progress = Math.min((now - startTime) / duration, 1);
            // easeOutCubic
            const eased = 1 - Math.pow(1 - progress, 3);
            setCount(Math.floor(eased * end));
            if (progress < 1) rafRef.current = requestAnimationFrame(step);
            else setCount(end);
          };
          rafRef.current = requestAnimationFrame(step);
        }
      });
    }, { threshold: 0.3 });

    observer.observe(el);

    const onVisibility = () => {
      if (document.hidden && rafRef.current) {
        cancelAnimationFrame(rafRef.current);
        rafRef.current = null;
      }
    };
    document.addEventListener('visibilitychange', onVisibility);

    return () => {
      observer.disconnect();
      cancelAnimationFrame(rafRef.current);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, [end, duration]);

  return (
    <span ref={ref}>
      {prefix}{count}{suffix}
    </span>
  );
}

// ========== 滚动渐入 ==========
function Reveal({ children, delay = 0, className = '' }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) { setVisible(true); return; }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          setTimeout(() => setVisible(true), delay);
          observer.unobserve(el);
        }
      });
    }, { threshold: 0.15 });

    observer.observe(el);
    return () => observer.disconnect();
  }, [delay]);

  return (
    <div ref={ref} className={`reveal ${visible ? 'visible' : ''} ${className}`}>
      {children}
    </div>
  );
}

// ========== 3D 倾斜卡片 ==========
function TiltCard({ children, className = '' }) {
  const cardRef = useRef(null);

  useEffect(() => {
    const card = cardRef.current;
    if (!card) return;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;

    const onMove = (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      const rotateY = ((x - cx) / cx) * 8;
      const rotateX = ((cy - y) / cy) * 8;
      card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
    };

    const onLeave = () => {
      card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale(1)';
    };

    card.addEventListener('mousemove', onMove);
    card.addEventListener('mouseleave', onLeave);

    return () => {
      card.removeEventListener('mousemove', onMove);
      card.removeEventListener('mouseleave', onLeave);
    };
  }, []);

  return (
    <div ref={cardRef} className={className}>
      {children}
    </div>
  );
}

// ========== 打字机 ==========
function Typewriter({ texts }) {
  const [text, setText] = useState('');
  const [idx, setIdx] = useState(0);
  const timerRef = useRef(null);
  const visibleRef = useRef(true);
  const ref = useRef(null);

  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) { setText(texts[0]); return; }

    let charIdx = 0;
    let currentStr = '';
    let deleting = false;
    let currentTextIdx = 0;

    const type = () => {
      if (!visibleRef.current) {
        timerRef.current = setTimeout(type, 200);
        return;
      }
      const full = texts[currentTextIdx];
      if (!deleting) {
        currentStr = full.slice(0, charIdx + 1);
        charIdx++;
        setText(currentStr);
        if (charIdx === full.length) {
          deleting = true;
          timerRef.current = setTimeout(type, 2000);
          return;
        }
        timerRef.current = setTimeout(type, 80 + Math.random() * 60);
      } else {
        currentStr = full.slice(0, charIdx - 1);
        charIdx--;
        setText(currentStr);
        if (charIdx === 0) {
          deleting = false;
          currentTextIdx = (currentTextIdx + 1) % texts.length;
          timerRef.current = setTimeout(type, 500);
          return;
        }
        timerRef.current = setTimeout(type, 40);
      }
    };

    // IntersectionObserver 控制是否可见
    const el = ref.current;
    let io;
    if (el) {
      io = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) {
            visibleRef.current = false;
          } else {
            visibleRef.current = true;
          }
        });
      }, { threshold: 0.1 });
      io.observe(el);
    }

    timerRef.current = setTimeout(type, 800);

    const onVisibility = () => { visibleRef.current = !document.hidden; };
    document.addEventListener('visibilitychange', onVisibility);

    return () => {
      clearTimeout(timerRef.current);
      document.removeEventListener('visibilitychange', onVisibility);
      if (io) io.disconnect();
    };
  }, [texts]);

  return <div ref={ref} className="typewriter">{text}</div>;
}

// ========== 热气球漂浮（物理） ==========
function FloatingBalloons() {
  const layerRef = useRef(null);
  const balloonsRef = useRef([]);
  const rafRef = useRef(null);
  const visibleRef = useRef(true);

  useEffect(() => {
    const layer = layerRef.current;
    if (!layer) return;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // 创建 8 只气球，不同周期、相位、大小
    const balloonDefs = [
      { size: 90, left: '8%', top: '20%', period: 4.2, phase: 0, drift: 15, colors: ['#C1502E', '#D9A441', '#4A5230', '#F4EDE0'] },
      { size: 140, left: '20%', top: '15%', period: 5.5, phase: 1.2, drift: 20, colors: ['#D9A441', '#C1502E', '#E8DCC5', '#4A5230'] },
      { size: 70, left: '75%', top: '25%', period: 3.8, phase: 2, drift: 12, colors: ['#4A5230', '#D9A441', '#C1502E', '#F4EDE0'] },
      { size: 110, left: '85%', top: '35%', period: 6, phase: 0.8, drift: 18, colors: ['#C1502E', '#4A5230', '#D9A441', '#E8DCC5'] },
      { size: 60, left: '60%', top: '18%', period: 3.2, phase: 2.5, drift: 10, colors: ['#F4EDE0', '#C1502E', '#D9A441', '#4A5230'] },
      { size: 100, left: '35%', top: '10%', period: 4.8, phase: 1.8, drift: 16, colors: ['#D9A441', '#4A5230', '#C1502E', '#F4EDE0'] },
      { size: 50, left: '90%', top: '50%', period: 2.9, phase: 3, drift: 8, colors: ['#E8DCC5', '#C1502E', '#4A5230', '#D9A441'] },
      { size: 80, left: '5%', top: '55%', period: 5, phase: 0.5, drift: 14, colors: ['#4A5230', '#C1502E', '#F4EDE0', '#D9A441'] },
    ];

    const balloons = balloonDefs.map((def, i) => {
      const el = document.createElement('div');
      el.className = 'balloon';
      el.style.left = def.left;
      el.style.top = def.top;
      el.style.opacity = reduced ? 0.7 : 0.85;
      el.style.pointerEvents = 'auto';
      el.style.cursor = 'none';
      // 用 React 渲染 SVG
      const container = document.createElement('div');
      el.appendChild(container);
      // 直接插入 SVG 字符串
      const svg = renderBalloonSVG(def.size, def.colors);
      container.innerHTML = svg;
      layer.appendChild(el);
      return { el, ...def, baseLeft: parseFloat(def.left), baseTop: parseFloat(def.top) };
    });
    balloonsRef.current = balloons;

    if (reduced) return;

    let startTime = performance.now();
    const animate = (now) => {
      if (!visibleRef.current) {
        rafRef.current = requestAnimationFrame(animate);
        return;
      }
      const t = (now - startTime) / 1000;
      balloons.forEach((b) => {
        // 正弦 + 阻尼漂移，垂直方向为主
        const y = Math.sin(t * (2 * Math.PI / b.period) + b.phase) * 12;
        const x = Math.sin(t * (2 * Math.PI / (b.period * 1.3)) + b.phase * 0.7) * (b.drift * 0.3);
        const rot = Math.sin(t * (2 * Math.PI / (b.period * 0.9)) + b.phase) * 3;
        b.el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
      });
      rafRef.current = requestAnimationFrame(animate);
    };
    rafRef.current = requestAnimationFrame(animate);

    const onVisibility = () => {
      visibleRef.current = !document.hidden;
      if (visibleRef.current) startTime = performance.now() - (startTime - startTime); // 不重置时间
    };
    document.addEventListener('visibilitychange', onVisibility);

    return () => {
      cancelAnimationFrame(rafRef.current);
      document.removeEventListener('visibilitychange', onVisibility);
      balloons.forEach((b) => b.el.remove());
    };
  }, []);

  return <div ref={layerRef} className="balloon-layer" />;
}

// 辅助：渲染 SVG 字符串
function renderBalloonSVG(size, colors) {
  const r = size / 2;
  const cx = r, cy = r;
  const bottomY = cy + r * 0.85;
  const basketTop = bottomY + 6;
  const h = size * 1.35;
  let patches = '';
  for (let i = 0; i < 6; i++) {
    const angle = (i / 6) * Math.PI * 2;
    const nextAngle = ((i + 1) / 6) * Math.PI * 2;
    const x1 = cx + Math.cos(angle) * r;
    const y1 = cy + Math.sin(angle) * r * 0.9;
    const x2 = cx + Math.cos(nextAngle) * r;
    const y2 = cy + Math.sin(nextAngle) * r * 0.9;
    patches += `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r*0.9} 0 0 1 ${x2} ${y2} Z" fill="${colors[i % colors.length]}" />`;
  }
  return `
    <svg width="${size}" height="${h}" viewBox="0 0 ${size} ${h}">
      <defs>
        <radialGradient id="bs-${size}" cx="35%" cy="30%" r="60%">
          <stop offset="0%" stop-color="#fff" stop-opacity="0.3" />
          <stop offset="100%" stop-color="#fff" stop-opacity="0" />
        </radialGradient>
      </defs>
      ${patches}
      <ellipse cx="${cx}" cy="${cy}" rx="${r*0.95}" ry="${r*0.85}" fill="url(#bs-${size})" />
      <path d="M ${cx - r*0.15} ${bottomY} Q ${cx} ${bottomY + 8} ${cx + r*0.15} ${bottomY}" fill="${colors[0]}" opacity="0.8" />
      <line x1="${cx - r*0.12}" y1="${bottomY + 2}" x2="${cx - r*0.18}" y2="${basketTop + size*0.15}" stroke="#3B2A20" stroke-width="1" />
      <line x1="${cx + r*0.12}" y1="${bottomY + 2}" x2="${cx + r*0.18}" y2="${basketTop + size*0.15}" stroke="#3B2A20" stroke-width="1" />
      <line x1="${cx}" y1="${bottomY + 4}" x2="${cx}" y2="${basketTop + size*0.15}" stroke="#3B2A20" stroke-width="1" />
      <rect x="${cx - r*0.22}" y="${basketTop + size*0.15}" width="${r*0.44}" height="${size*0.12}" rx="3" fill="#8B6F47" />
      <rect x="${cx - r*0.22}" y="${basketTop + size*0.15}" width="${r*0.44}" height="${size*0.04}" rx="2" fill="#A0826D" />
    </svg>
  `;
}

// ========== 画廊视差滚动 ==========
function GalleryParallax() {
  const trackRef = useRef(null);
  const rafRef = useRef(null);
  const scrollRef = useRef(0);
  const targetRef = useRef(0);
  const visibleRef = useRef(true);

  useEffect(() => {
    const track = trackRef.current;
    if (!track) return;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const onScroll = () => {
      if (!track) return;
      const rect = track.getBoundingClientRect();
      const vh = window.innerHeight;
      const progress = Math.max(0, Math.min(1, (vh - rect.top) / (vh + rect.height)));
      // 计算偏移：向右偏移
      const maxScroll = track.scrollWidth - track.parentElement.clientWidth;
      targetRef.current = -progress * maxScroll * 0.5;
    };

    const animate = () => {
      if (!visibleRef.current || !track) {
        rafRef.current = requestAnimationFrame(animate);
        return;
      }
      // 惯性阻尼
      scrollRef.current += (targetRef.current - scrollRef.current) * 0.08;
      track.style.transform = `translateX(${scrollRef.current}px)`;
      rafRef.current = requestAnimationFrame(animate);
    };

    window.addEventListener('scroll', onScroll, { passive: true });
    if (!reduced) rafRef.current = requestAnimationFrame(animate);

    const onVisibility = () => { visibleRef.current = !document.hidden; };
    document.addEventListener('visibilitychange', onVisibility);

    onScroll();

    return () => {
      window.removeEventListener('scroll', onScroll);
      cancelAnimationFrame(rafRef.current);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, []);

  return (
    <div className="gallery-track-wrap">
      <div ref={trackRef} className="gallery-track">
        {galleryItems.map((item, i) => (
          <div key={i} className="gallery-item" data-hover>
            <img src={item.img} alt={item.title} loading="lazy" />
            <div className="gallery-caption">
              <h4>{item.title}</h4>
              <p>{item.year} · {item.desc}</p>
            </div>
          </div>
        ))}
        {/* 复制一轮做无缝 */}
        {galleryItems.slice(0, 3).map((item, i) => (
          <div key={`dup-${i}`} className="gallery-item" data-hover>
            <img src={item.img} alt={item.title} loading="lazy" />
            <div className="gallery-caption">
              <h4>{item.title}</h4>
              <p>{item.year} · {item.desc}</p>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

                  <TiltCard className="pilot-card-inner">
                    <div className="pilot-image">
                      <img src={p.img} alt={p.name} loading="lazy" />
                      <div className="pilot-overlay">
                        <p>{p.desc}</p>
                      </div>
                    </div>
                    <div className="pilot-info">
                      <div className="pilot-name">{p.name}</div>
                      <div className="pilot-meta">
                        <span>{p.title}</span>
                        <span>·</span>
                        <span>{p.flights} 次飞行</span>
                      </div>
                    </div>
                  </TiltCard>
                </div>
              </Reveal>
            ))}
          </div>
        </div>
      </section>

      {/* 票务 */}
      <section className="section tickets-section" id="tickets">
        <div className="section-inner">
          <Reveal>
            <div className="section-head">
              <div className="section-eyebrow" style={{ color: 'var(--sand-gold)' }}>TICKETS</div>
              <h2 className="section-title">选择你的云端之旅</h2>
              <p className="section-desc">三档票务，满足不同体验需求。点击卡片查看完整权益明细。</p>
            </div>
          </Reveal>

          <div className="tickets-grid">
            {tickets.map((t, i) => (
              <Reveal key={t.name} delay={i * 150}>
                <div
                  className={`ticket-card ${t.featured ? 'featured' : ''} ${expandedTicket === i ? 'expanded' : ''}`}
                  data-hover
                  onClick={() => setExpandedTicket(expandedTicket === i ? null : i)}
                >
                  <div className="ticket-name">{t.name}</div>
                  <div className="ticket-price">¥{t.price}<span> / 人</span></div>
                  <div className="ticket-sub">{t.sub}</div>
                  <ul className="ticket-features">
                    {t.features.map((f, j) => <li key={j}>{f}</li>)}
                  </ul>
                  <button className="ticket-btn" onClick={(e) => { e.stopPropagation(); }} data-hover>
                    {expandedTicket === i ? '收起详情' : '查看更多权益'}
                  </button>
                  <div className="ticket-extra">
                    <div className="ticket-extra-title">附加权益</div>
                    <ul className="ticket-extra-list">
                      {t.extra.map((e, j) => <li key={j}>✓ {e}</li>)}
                    </ul>
                  </div>
                </div>
              </Reveal>
            ))}
          </div>
        </div>
      </section>

      {/* 场地指南 */}
      <section className="section venue-section" id="venue">
        <div className="section-inner">
          <Reveal>
            <div className="section-head">
              <div className="section-eyebrow">VENUE GUIDE</div>
              <h2 className="section-title">峡谷场地指南</h2>
              <p className="section-desc">占地 80 公顷的高原草甸场地，分区规划清晰。点击地图热点查看各区域详情。</p>
            </div>
          </Reveal>

          <Reveal delay={200}>
            <div className="venue-wrap">
              <div className="venue-map" data-hover>
                <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
                  {/* 山脉背景 */}
                  <path d="M 0 120 L 60 60 L 120 100 L 180 40 L 260 90 L 340 50 L 400 80 L 400 300 L 0 300 Z" fill="#C9C4A8" opacity="0.5" />
                  <path d="M 0 160 L 80 110 L 160 140 L 240 100 L 320 130 L 400 110 L 400 300 L 0 300 Z" fill="#B8B08A" opacity="0.4" />
                  {/* 草甸 */}
                  <ellipse cx="200" cy="220" rx="180" ry="60" fill="#8A9560" opacity="0.5" />
                  <ellipse cx="200" cy="240" rx="160" ry="40" fill="#7A8A50" opacity="0.4" />
                  {/* 道路 */}
                  <path d="M 0 260 Q 100 250 200 260 T 400 255" stroke="#D9A441" strokeWidth="2" fill="none" strokeDasharray="8 4" opacity="0.6" />
                  {/* 河流 */}
                  <path d="M 50 0 Q 80 80 120 140 T 200 300" stroke="#8FB0C9" strokeWidth="3" fill="none" opacity="0.6" />

                  {/* 热点 */}
                  {venues.map((v) => (
                    <g
                      key={v.id}
                      className="venue-hotspot"
                      onClick={() => setActiveVenue(v.id)}
                      data-hover
                      transform={`translate(${v.x * 4}, ${v.y * 3})`}
                    >
                      <circle className="hotspot-pulse" cx="0" cy="0" r="12" fill="rgba(193,80,46,0.4)" />
                      <circle className="hotspot-core" cx="0" cy="0" r="7" fill={activeVenue === v.id ? '#C1502E' : '#D9A441'} stroke="#fff" strokeWidth="2" />
                      <text x="12" y="4" fontSize="11" fill="#3B2A20" fontWeight="600">{v.label}</text>
                    </g>
                  ))}
                </svg>
              </div>

              <div className="venue-info">
                <div className="venue-detail" key={activeVenueData.id}>
                  <h4>{activeVenueData.label}</h4>
                  <p>{activeVenueData.desc}</p>
                </div>
                <div style={{ padding: '16px 24px', background: 'var(--warm-beige)', borderRadius: '12px' }}>
                  <div style={{ fontSize: '13px', color: 'var(--olive)', marginBottom: '4px' }}>场地地址</div>
                  <div style={{ fontSize: '15px', color: 'var(--chestnut)', fontWeight: 500 }}>云南省 · 香格里拉高原峡谷飞行场</div>
                </div>
                <div style={{ padding: '16px 24px', background: 'var(--warm-beige)', borderRadius: '12px' }}>
                  <div style={{ fontSize: '13px', color: 'var(--olive)', marginBottom: '4px' }}>交通提示</div>
                  <div style={{ fontSize: '14px', color: 'var(--chestnut)', lineHeight: 1.7 }}>
                    距离香格里拉机场约 45 分钟车程，节日期间提供免费接驳巴士。建议提前 2 小时抵达。
                  </div>
                </div>
              </div>
            </div>
          </Reveal>
        </div>
      </section>

      {/* 历届瞬间 */}
      <section className="section gallery-section" id="gallery">
        <div className="section-inner">
          <Reveal>
            <div className="section-head">
              <div className="section-eyebrow">MEMORIES</div>
              <h2 className="section-title">历年云端瞬间</h2>
              <p className="section-desc">过去六届的精彩画面，每一帧都是天空给我们的礼物。</p>
            </div>
          </Reveal>
        </div>
        <GalleryParallax />
      </section>

      {/* 页脚 */}
      <footer className="footer">
        <div className="footer-inner">
          <div className="footer-top">
            <div className="footer-brand">
              <h3>云端之上 Skybound</h3>
              <p>中国最具影响力的高原热气球节，每年八月在云南香格里拉如期而至。让风带你触摸云端。</p>
              <form className="subscribe-form" onSubmit={handleSubscribe}>
                <input
                  type="text"
                  placeholder="输入邮箱，订阅节日动态"
                  value={subscribeEmail}
                  onChange={(e) => setSubscribeEmail(e.target.value)}
                  className={subscribeStatus.type === 'error' ? 'error' : ''}
                  data-hover
                />
                <button type="submit" className="subscribe-btn" data-hover>订阅</button>
              </form>
              <div className={`subscribe-msg ${subscribeStatus.type}`}>{subscribeStatus.msg}</div>
            </div>

            <div className="footer-col">
              <h4>节日信息</h4>
              <ul>
                <li><a href="#schedule" data-hover>活动日程</a></li>
                <li><a href="#pilots" data-hover>飞行员阵容</a></li>
                <li><a href="#tickets" data-hover>票务信息</a></li>
                <li><a href="#venue" data-hover>场地指南</a></li>
              </ul>
            </div>

            <div className="footer-col">
              <h4>访客须知</h4>
              <ul>
                <li><a href="#" data-hover>安全须知</a></li>
                <li><a href="#" data-hover>交通指南</a></li>
                <li><a href="#" data-hover>常见问题</a></li>
                <li><a href="#" data-hover>退改政策</a></li>
              </ul>
            </div>

            <div className="footer-col">
              <h4>联系我们</h4>
              <ul>
                <li><a href="#" data-hover>合作咨询</a></li>
                <li><a href="#" data-hover>媒体中心</a></li>
                <li><a href="#" data-hover>加入团队</a></li>
                <li><a href="#" data-hover>意见反馈</a></li>
              </ul>
            </div>
          </div>

          <div className="footer-bottom">
            <div className="footer-copy">© 2026 云端之上 Skybound 高原热气球节 · 所有权利保留</div>
            <div className="footer-partners">
              <span>香格里拉文旅局</span>
              <span>·</span>
              <span>中国热气球运动协会</span>
              <span>·</span>
              <span>高原航空运动中心</span>
            </div>
          </div>
        </div>
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

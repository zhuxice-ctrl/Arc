<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>枕木纪行 · Sleeper Line — 复古铁道旅行</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Playfair+Display:wght@400;600;700;900&family=Noto+Serif+SC:wght@400;600;700&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" />
<style>
  /* =========================================================
     枕木纪行 Sleeper Line — 复古铁道旅行官网
     配色：深墨绿 #14251F + 黄铜 #C89B4E + 奶油 #F4EBD8 + 铁锈红 #A63D2F
     ========================================================= */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --c-ink: #14251F;
    --c-ink-2: #1d332c;
    --c-brass: #C89B4E;
    --c-brass-light: #e0b56a;
    --c-brass-dark: #9a7533;
    --c-cream: #F4EBD8;
    --c-cream-2: #e8dcbe;
    --c-rust: #A63D2F;
    --c-rust-light: #c95748;
    --c-shadow: rgba(10, 20, 15, 0.6);

    --f-display: 'Playfair Display', 'Noto Serif SC', serif;
    --f-body: 'Noto Serif SC', 'Playfair Display', serif;
    --f-mono: 'IBM Plex Mono', 'Courier New', monospace;
  }
  html, body {
    background: var(--c-ink);
    color: var(--c-cream);
    font-family: var(--f-body);
    overflow-x: hidden;
    cursor: none;
    scroll-behavior: smooth;
  }
  body { min-height: 100vh; position: relative; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    body { cursor: auto; }
  }
  a, button { cursor: none; }
  @media (prefers-reduced-motion: reduce) {
    a, button { cursor: pointer; }
  }

  /* ========= 自定义光标 ========= */
  .cursor-outer {
    position: fixed; top: 0; left: 0;
    width: 44px; height: 44px;
    border: 2px solid #fff;
    border-radius: 50%;
    pointer-events: none;
    z-index: 99999;
    transform: translate(-50%, -50%);
    transition: width .3s cubic-bezier(.2,.8,.2,1),
                height .3s cubic-bezier(.2,.8,.2,1),
                border-color .3s,
                box-shadow .3s,
                background-color .2s;
    mix-blend-mode: difference;
    will-change: transform;
  }
  .cursor-inner {
    position: fixed; top: 0; left: 0;
    width: 8px; height: 8px;
    background: var(--c-brass);
    border-radius: 50%;
    pointer-events: none;
    z-index: 99999;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 12px var(--c-brass), 0 0 24px rgba(200,155,78,.5);
    transition: width .2s, height .2s, background-color .2s, box-shadow .2s;
    will-change: transform;
  }
  .cursor-glow {
    position: fixed; top: 0; left: 0;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(200,155,78,.15), transparent 70%);
    pointer-events: none;
    z-index: 99998;
    transform: translate(-50%, -50%);
    filter: blur(20px);
    transition: opacity .4s;
    will-change: transform;
  }
  .cursor-outer.hover {
    width: 68px; height: 68px;
    border-color: var(--c-brass);
    box-shadow: 0 0 20px var(--c-brass), inset 0 0 10px rgba(200,155,78,.3);
  }
  .cursor-outer.clicked {
    width: 30px; height: 30px;
    background: rgba(200,155,78,.4);
  }
  .cursor-inner.hover {
    width: 14px; height: 14px;
    background: #fff;
    box-shadow: 0 0 20px #fff, 0 0 40px var(--c-brass);
  }
  .cursor-ripple {
    position: fixed;
    width: 20px; height: 20px;
    border: 2px solid var(--c-brass);
    border-radius: 50%;
    pointer-events: none;
    z-index: 99997;
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    animation: ripple-anim .7s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes ripple-anim {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 1; width: 20px; height: 20px; }
    100% { transform: translate(-50%, -50%) scale(4); opacity: 0; width: 20px; height: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cursor-outer, .cursor-inner, .cursor-glow, .cursor-ripple { display: none !important; }
  }

  /* ========= 蒸汽粒子画布 ========= */
  #steam-canvas {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: .6;
  }

  /* ========= 导航 ========= */
  .nav {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 22px 48px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(180deg, rgba(20,37,31,.9) 0%, rgba(20,37,31,0) 100%);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(200,155,78,.15);
  }
  .nav-logo {
    display: flex; align-items: center; gap: 12px;
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: .08em;
    color: var(--c-cream);
  }
  .nav-logo-mark {
    width: 36px; height: 36px;
    border: 2px solid var(--c-brass);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--f-display);
    font-size: 16px;
    color: var(--c-brass);
    position: relative;
  }
  .nav-logo-mark::after {
    content: '';
    position: absolute; inset: -6px;
    border: 1px solid var(--c-brass);
    border-radius: 50%;
    opacity: .4;
    animation: logo-pulse 3s ease-in-out infinite;
  }
  @keyframes logo-pulse {
    0%, 100% { transform: scale(1); opacity: .4; }
    50% { transform: scale(1.15); opacity: 0; }
  }
  .nav-logo-text small {
    display: block;
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: .3em;
    color: var(--c-brass);
    font-weight: 400;
  }
  .nav-links {
    display: flex; align-items: center; gap: 40px;
    list-style: none;
  }
  .nav-links a {
    font-family: var(--f-mono);
    font-size: 12px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--c-cream);
    text-decoration: none;
    position: relative;
    padding: 4px 0;
    transition: color .3s;
  }
  .nav-links a::after {
    content: '';
    position: absolute; bottom: 0; left: 50%;
    width: 0; height: 1px;
    background: var(--c-brass);
    transition: width .4s cubic-bezier(.2,.8,.2,1), left .4s cubic-bezier(.2,.8,.2,1);
  }
  .nav-links a:hover { color: var(--c-brass); }
  .nav-links a:hover::after { width: 100%; left: 0; }
  .nav-book {
    padding: 12px 24px;
    border: 1px solid var(--c-brass);
    background: transparent;
    color: var(--c-brass);
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .25em;
    text-transform: uppercase;
    transition: all .4s;
    position: relative;
    overflow: hidden;
  }
  .nav-book::before {
    content: '';
    position: absolute; inset: 0;
    background: var(--c-brass);
    transform: translateX(-101%);
    transition: transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .nav-book:hover { color: var(--c-ink); }
  .nav-book:hover::before { transform: translateX(0); }
  .nav-book span { position: relative; z-index: 1; }
  .nav-burger { display: none; }

  @media (max-width: 768px) {
    .nav { padding: 16px 20px; }
    .nav-links { display: none; }
    .nav-book { display: none; }
    .nav-burger {
      display: flex; flex-direction: column; gap: 5px;
      background: none; border: none;
      padding: 6px;
    }
    .nav-burger span {
      display: block;
      width: 22px; height: 2px;
      background: var(--c-cream);
    }
  }

  /* ========= Hero ========= */
  .hero {
    position: relative;
    min-height: 100vh;
    padding: 160px 48px 80px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
    overflow: hidden;
  }
  .hero-bg {
    position: absolute; inset: 0;
    z-index: 0;
  }
  .hero-bg::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(200,155,78,.1), transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(166,61,47,.08), transparent 50%);
  }
  /* 铁轨视差 */
  .rail-perspective {
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 200%;
    height: 60%;
    pointer-events: none;
    z-index: 1;
    opacity: .15;
  }
  .rail-left, .rail-right {
    position: absolute;
    bottom: 0;
    width: 4px;
    height: 100%;
    background: linear-gradient(to top, var(--c-brass), transparent);
    transform-origin: bottom center;
  }
  .rail-left { left: calc(50% - 80px); transform: perspective(400px) rotateY(60deg); }
  .rail-right { left: calc(50% + 80px); transform: perspective(400px) rotateY(-60deg); }
  .rail-ties {
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%;
    height: 100%;
    display: flex; flex-direction: column-reverse;
    justify-content: flex-start;
    gap: 40px;
    padding-bottom: 20px;
  }
  .rail-tie {
    width: 100%;
    height: 3px;
    background: var(--c-brass);
    transform-origin: center;
    animation: rail-move 8s linear infinite;
    opacity: .5;
  }
  .rail-tie:nth-child(1) { animation-delay: 0s; }
  .rail-tie:nth-child(2) { animation-delay: -1s; }
  .rail-tie:nth-child(3) { animation-delay: -2s; }
  .rail-tie:nth-child(4) { animation-delay: -3s; }
  .rail-tie:nth-child(5) { animation-delay: -4s; }
  .rail-tie:nth-child(6) { animation-delay: -5s; }
  .rail-tie:nth-child(7) { animation-delay: -6s; }
  .rail-tie:nth-child(8) { animation-delay: -7s; }
  @keyframes rail-move {
    0% { transform: scaleY(0.1) translateY(0); opacity: 0; }
    20% { opacity: .8; }
    100% { transform: scaleY(8) translateY(-400px); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .rail-tie { animation: none; opacity: .3; }
  }

  .hero-left { position: relative; z-index: 2; }
  .hero-eyebrow {
    font-family: var(--f-mono);
    font-size: 12px;
    letter-spacing: .4em;
    text-transform: uppercase;
    color: var(--c-brass);
    margin-bottom: 24px;
    display: flex; align-items: center; gap: 16px;
  }
  .hero-eyebrow::before {
    content: '';
    width: 40px; height: 1px;
    background: var(--c-brass);
  }
  .hero-title {
    font-family: var(--f-display);
    font-size: clamp(48px, 7vw, 96px);
    line-height: 1;
    font-weight: 900;
    letter-spacing: -.02em;
    color: var(--c-cream);
    margin-bottom: 24px;
  }
  .hero-title .brass { color: var(--c-brass); }
  .hero-title .rust { color: var(--c-rust); font-style: italic; font-weight: 400; }
  .hero-sub {
    font-family: var(--f-mono);
    font-size: 14px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--c-cream-2);
    margin-bottom: 40px;
  }
  .hero-desc {
    font-size: 17px;
    line-height: 1.9;
    color: rgba(244,235,216,.75);
    max-width: 480px;
    margin-bottom: 48px;
  }
  .hero-cta-row {
    display: flex; gap: 20px; flex-wrap: wrap;
  }
  .btn-primary {
    padding: 18px 36px;
    background: var(--c-brass);
    color: var(--c-ink);
    border: none;
    font-family: var(--f-mono);
    font-size: 12px;
    letter-spacing: .3em;
    text-transform: uppercase;
    font-weight: 600;
    position: relative;
    overflow: hidden;
    transition: all .4s cubic-bezier(.2,.8,.2,1);
  }
  .btn-primary:hover {
    background: var(--c-brass-light);
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(200,155,78,.3);
  }
  .btn-ghost {
    padding: 18px 36px;
    background: transparent;
    color: var(--c-cream);
    border: 1px solid rgba(244,235,216,.4);
    font-family: var(--f-mono);
    font-size: 12px;
    letter-spacing: .3em;
    text-transform: uppercase;
    transition: all .4s cubic-bezier(.2,.8,.2,1);
  }
  .btn-ghost:hover {
    border-color: var(--c-brass);
    color: var(--c-brass);
  }

  .hero-right {
    position: relative;
    z-index: 2;
    display: flex; flex-direction: column; gap: 24px;
    align-items: center; justify-content: center;
  }

  /* 蒸汽机车剪影 SVG 容器 */
  .locomotive-container {
    width: 100%; max-width: 520px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform .15s ease-out;
  }
  .locomotive-svg { width: 100%; height: auto; display: block; }
  .wheel { transform-origin: center; transition: transform .1s linear; }

  /* 翻牌站牌 */
  .flip-station {
    width: 100%; max-width: 420px;
    background: var(--c-ink-2);
    border: 2px solid var(--c-brass);
    border-radius: 4px;
    padding: 20px 28px;
    position: relative;
    font-family: var(--f-mono);
  }
  .flip-station::before, .flip-station::after {
    content: '';
    position: absolute; top: 50%;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--c-brass);
    transform: translateY(-50%);
  }
  .flip-station::before { left: -4px; }
  .flip-station::after { right: -4px; }
  .flip-station-label {
    font-size: 10px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--c-brass);
    margin-bottom: 10px;
  }
  .flip-station-name {
    font-family: var(--f-display);
    font-size: 28px;
    font-weight: 700;
    color: var(--c-cream);
    letter-spacing: .05em;
    display: flex; gap: 4px;
  }
  .flip-char {
    display: inline-block;
    position: relative;
    transition: transform .4s cubic-bezier(.2,.8,.2,1);
    transform-style: preserve-3d;
  }
  .flip-char.flip {
    animation: char-flip .6s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes char-flip {
    0% { transform: rotateX(0); }
    50% { transform: rotateX(90deg); }
    100% { transform: rotateX(0); }
  }

  .hero-meta {
    display: flex; gap: 48px; flex-wrap: wrap;
    margin-top: 20px;
  }
  .hero-meta-item {
    display: flex; flex-direction: column; gap: 4px;
  }
  .hero-meta-label {
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--c-brass);
  }
  .hero-meta-value {
    font-family: var(--f-display);
    font-size: 24px;
    font-weight: 700;
    color: var(--c-cream);
  }

  @media (max-width: 900px) {
    .hero { grid-template-columns: 1fr; padding: 120px 24px 60px; }
    .hero-right { order: -1; }
    .locomotive-container { max-width: 320px; }
    .hero-desc { max-width: none; }
  }

  /* ========= 滚动提示 ========= */
  .scroll-hint {
    position: absolute;
    bottom: 40px; left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--c-brass);
  }
  .scroll-wheel {
    width: 24px; height: 36px;
    border: 1.5px solid var(--c-brass);
    border-radius: 12px;
    position: relative;
  }
  .scroll-wheel::after {
    content: '';
    position: absolute;
    top: 6px; left: 50%;
    width: 3px; height: 8px;
    background: var(--c-brass);
    border-radius: 2px;
    transform: translateX(-50%);
    animation: scroll-wheel 2s ease-in-out infinite;
  }
  @keyframes scroll-wheel {
    0%, 100% { transform: translateX(-50%) translateY(0); opacity: 1; }
    50% { transform: translateX(-50%) translateY(12px); opacity: .3; }
  }
  @media (prefers-reduced-motion: reduce) {
    .scroll-wheel::after { animation: none; }
  }

  /* ========= Section 通用 ========= */
  .section {
    position: relative;
    padding: 140px 48px;
    z-index: 2;
  }
  .section-label {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .4em;
    text-transform: uppercase;
    color: var(--c-brass);
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 16px;
  }
  .section-label::before {
    content: '';
    width: 32px; height: 1px;
    background: var(--c-brass);
  }
  .section-title {
    font-family: var(--f-display);
    font-size: clamp(36px, 5vw, 64px);
    font-weight: 700;
    line-height: 1.1;
    color: var(--c-cream);
    margin-bottom: 20px;
  }
  .section-title em {
    font-style: italic;
    color: var(--c-brass);
    font-weight: 400;
  }
  .section-desc {
    font-size: 16px;
    line-height: 1.9;
    color: rgba(244,235,216,.7);
    max-width: 600px;
  }

  @media (max-width: 768px) {
    .section { padding: 80px 24px; }
  }

  /* 滚动渐入 */
  .reveal {
    opacity: 0;
    transform: translateY(40px);
    transition: opacity .9s cubic-bezier(.2,.8,.2,1),
                transform .9s cubic-bezier(.2,.8,.2,1);
  }
  .reveal.in {
    opacity: 1;
    transform: translateY(0);
  }
  .reveal.delay-1 { transition-delay: .1s; }
  .reveal.delay-2 { transition-delay: .2s; }
  .reveal.delay-3 { transition-delay: .3s; }
  .reveal.delay-4 { transition-delay: .4s; }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
  }

  /* ========= 路线区块 ========= */
  .routes {
    background: var(--c-ink);
    position: relative;
  }
  .routes-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
    margin-top: 60px;
  }
  .route-card {
    background: var(--c-ink-2);
    border: 1px solid rgba(200,155,78,.2);
    padding: 32px 28px;
    position: relative;
    transition: all .4s cubic-bezier(.2,.8,.2,1);
    overflow: hidden;
    transform-style: preserve-3d;
  }
  .route-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--c-brass);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .route-card:hover {
    border-color: var(--c-brass);
    transform: translateY(-4px);
    box-shadow: 0 20px 40px rgba(0,0,0,.4);
  }
  .route-card:hover::before { transform: scaleX(1); }
  .route-num {
    font-family: var(--f-mono);
    font-size: 12px;
    letter-spacing: .3em;
    color: var(--c-brass);
    margin-bottom: 20px;
  }
  .route-name {
    font-family: var(--f-display);
    font-size: 28px;
    font-weight: 700;
    color: var(--c-cream);
    margin-bottom: 12px;
    line-height: 1.2;
  }
  .route-path {
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: .2em;
    color: rgba(244,235,216,.5);
    margin-bottom: 24px;
    display: flex; align-items: center; gap: 10px;
  }
  .route-path-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--c-brass);
  }
  .route-path-line {
    flex: 1;
    height: 1px;
    background: repeating-linear-gradient(to right, var(--c-brass) 0, var(--c-brass) 4px, transparent 4px, transparent 8px);
  }
  .route-info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    padding-top: 20px;
    border-top: 1px solid rgba(200,155,78,.15);
  }
  .route-info-item {
    display: flex; flex-direction: column; gap: 4px;
  }
  .route-info-label {
    font-family: var(--f-mono);
    font-size: 9px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: rgba(244,235,216,.4);
  }
  .route-info-value {
    font-family: var(--f-display);
    font-size: 18px;
    font-weight: 600;
    color: var(--c-cream);
  }

  /* 光泽扫过 */
  .route-card::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(200,155,78,.1), transparent);
    transition: left .7s cubic-bezier(.2,.8,.2,1);
    pointer-events: none;
  }
  .route-card:hover::after { left: 150%; }
  @media (prefers-reduced-motion: reduce) {
    .route-card::after { display: none; }
  }

  @media (max-width: 900px) {
    .routes-grid { grid-template-columns: 1fr; }
  }

  /* ========= 时刻表 / 翻牌 ========= */
  .timetable {

/* =========================================================
   动画循环管理：visibilitychange 自动暂停/恢复
   ========================================================= */
const animRegistry = new Set();
let pageVisible = true;

function registerAnim(id, start, stop) {
  animRegistry.add({ id, start, stop, running: false });
}
function startAllAnims() {
  pageVisible = true;
  animRegistry.forEach(a => { if (!a.running) { a.start(); a.running = true; } });
}
function stopAllAnims() {
  pageVisible = false;
  animRegistry.forEach(a => { if (a.running) { a.stop(); a.running = false; } });
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopAllAnims();
  else startAllAnims();
});

/* =========================================================
   蒸汽粒子系统（Canvas）
   ========================================================= */
function initSteamCanvas() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) return;
  const canvas = document.getElementById('steam-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let rafId = null;
  let particles = [];
  let w, h;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function createParticle() {
    return {
      x: Math.random() * w,
      y: h + Math.random() * 100,
      vx: (Math.random() - 0.5) * 0.3,
      vy: -(0.3 + Math.random() * 0.8),
      size: 20 + Math.random() * 60,
      alpha: 0,
      maxAlpha: 0.08 + Math.random() * 0.12,
      life: 0,
      maxLife: 300 + Math.random() * 200,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.01 + Math.random() * 0.02,
    };
  }

  for (let i = 0; i < 25; i++) {
    const p = createParticle();
    p.life = Math.random() * p.maxLife;
    p.y = Math.random() * h;
    particles.push(p);
  }

  function loop() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach((p, idx) => {
      p.life++;
      p.wobble += p.wobbleSpeed;
      p.x += p.vx + Math.sin(p.wobble) * 0.2;
      p.y += p.vy;

      // Fade in/out
      if (p.life < 60) {
        p.alpha = (p.life / 60) * p.maxAlpha;
      } else if (p.life > p.maxLife - 60) {
        p.alpha = ((p.maxLife - p.life) / 60) * p.maxAlpha;
      } else {
        p.alpha = p.maxAlpha;
      }

      // Expand as it rises
      const currentSize = p.size * (1 + (p.life / p.maxLife) * 1.5);

      const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, currentSize);
      gradient.addColorStop(0, `rgba(244, 235, 216, ${p.alpha})`);
      gradient.addColorStop(1, 'rgba(244, 235, 216, 0)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(p.x, p.y, currentSize, 0, Math.PI * 2);
      ctx.fill();

      // Recycle
      if (p.life > p.maxLife || p.y < -currentSize) {
        particles[idx] = createParticle();
      }
    });
    rafId = requestAnimationFrame(loop);
  }

  registerAnim('steam', () => { rafId = requestAnimationFrame(loop); }, () => { cancelAnimationFrame(rafId); rafId = null; });
}

/* =========================================================
   自定义光标
   ========================================================= */
function initCursor() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) return;

  const outer = document.createElement('div');
  outer.className = 'cursor-outer';
  const inner = document.createElement('div');
  inner.className = 'cursor-inner';
  const glow = document.createElement('div');
  glow.className = 'cursor-glow';
  document.body.appendChild(outer);
  document.body.appendChild(inner);
  document.body.appendChild(glow);

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let outerX = mouseX, outerY = mouseY;
  let innerX = mouseX, innerY = mouseY;
  let glowX = mouseX, glowY = mouseY;
  let rafId = null;

  function onMouseMove(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
  }
  window.addEventListener('mousemove', onMouseMove);

  function loop() {
    // Outer follows with damping (弹簧/惯性)
    outerX += (mouseX - outerX) * 0.18;
    outerY += (mouseY - outerY) * 0.18;
    // Inner follows tighter
    innerX += (mouseX - innerX) * 0.45;
    innerY += (mouseY - innerY) * 0.45;
    // Glow lags behind
    glowX += (mouseX - glowX) * 0.08;
    glowY += (mouseY - glowY) * 0.08;

    outer.style.transform = `translate(${outerX}px, ${outerY}px) translate(-50%, -50%)`;
    inner.style.transform = `translate(${innerX}px, ${innerY}px) translate(-50%, -50%)`;
    glow.style.transform = `translate(${glowX}px, ${glowY}px) translate(-50%, -50%)`;

    rafId = requestAnimationFrame(loop);
  }
  rafId = requestAnimationFrame(loop);

  // Hover on interactive elements
  const interactive = 'a, button, .route-card, .ticket, .gallery-item, .departure-row, input, select, .nav-book';
  document.addEventListener('mouseover', (e) => {
    if (e.target.closest(interactive)) {
      outer.classList.add('hover');
      inner.classList.add('hover');
    }
  });
  document.addEventListener('mouseout', (e) => {
    if (e.target.closest(interactive)) {
      outer.classList.remove('hover');
      inner.classList.remove('hover');
    }
  });

  // Click ripple
  document.addEventListener('click', (e) => {
    outer.classList.add('clicked');
    setTimeout(() => outer.classList.remove('clicked'), 200);

    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 700);
  });

  registerAnim('cursor', () => { if (!rafId) rafId = requestAnimationFrame(loop); }, () => { cancelAnimationFrame(rafId); rafId = null; });
}

/* =========================================================
   滚动渐入观察者
   ========================================================= */
function initReveal() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) return;
  const els = document.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window)) {
    els.forEach(el => el.classList.add('in'));
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        en.target.classList.add('in');
        io.unobserve(en.target);
      }
    });
  }, { threshold: 0.15 });
  els.forEach(el => io.observe(el));
}

/* =========================================================
   数字计数动画（滚动触发）
   ========================================================= */
function initCounter() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const els = document.querySelectorAll('[data-count]');
  if (reduced) {
    els.forEach(el => { el.textContent = el.dataset.count + (el.dataset.suffix || ''); });
    return;
  }
  if (!('IntersectionObserver' in window)) return;

  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      const el = en.target;
      const target = parseInt(el.dataset.count, 10);
      const suffix = el.dataset.suffix || '';
      const duration = 2000 + Math.random() * 1000;
      const start = performance.now();
      let rafId;
      function tick(now) {
        const t = Math.min(1, (now - start) / duration);
        // easeOutCubic
        const eased = 1 - Math.pow(1 - t, 3);
        el.textContent = Math.floor(target * eased) + suffix;
        if (t < 1) rafId = requestAnimationFrame(tick);
        else el.textContent = target + suffix;
      }
      rafId = requestAnimationFrame(tick);
      io.unobserve(el);
    });
  }, { threshold: 0.5 });
  els.forEach(el => io.observe(el));
}

/* =========================================================
   3D 倾斜卡片（直接操作 DOM，不触发 React 重渲染）
   ========================================================= */
function initTilt() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) return;
  const cards = document.querySelectorAll('[data-tilt]');
  cards.forEach(card => {
    let rafId = null;
    let targetRX = 0, targetRY = 0;
    let currentRX = 0, currentRY = 0;

    function onMove(e) {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      targetRY = ((x - cx) / cx) * 8;  // 左右倾斜
      targetRX = -((y - cy) / cy) * 6; // 上下倾斜
      if (!rafId) rafId = requestAnimationFrame(animate);
    }

    function animate() {
      // 阻尼插值
      currentRX += (targetRX - currentRX) * 0.12;
      currentRY += (targetRY - currentRY) * 0.12;
      card.style.transform = `perspective(800px) rotateX(${currentRX}deg) rotateY(${currentRY}deg) translateY(-4px)`;
      if (Math.abs(targetRX - currentRX) > 0.05 || Math.abs(targetRY - currentRY) > 0.05) {
        rafId = requestAnimationFrame(animate);
      } else {
        rafId = null;
      }
    }

    function onLeave() {
      targetRX = 0;
      targetRY = 0;
      if (!rafId) rafId = requestAnimationFrame(animate);
    }

    card.addEventListener('mousemove', onMove);
    card.addEventListener('mouseleave', onLeave);
  });
}

/* =========================================================
   机车车轮转动（滚动驱动 + 自转动画）
   ========================================================= */
function initWheels() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) return;
  const wheels = document.querySelectorAll('.wheel');
  let rotation = 0;
  let rafId = null;
  let speed = 0.8;

  function loop() {
    rotation += speed;
    wheels.forEach((w, i) => {
      // 大轮转一圈 小轮转 1.7 圈（齿轮比）
      const ratio = i === 0 ? 1.7 : 1;
      w.style.transform = `rotate(${rotation * ratio}deg)`;
    });
    rafId = requestAnimationFrame(loop);
  }

  // 滚动速度影响转动速度
  let lastScroll = window.scrollY;
  let scrollTimer;
  window.addEventListener('scroll', () => {
    const current = window.scrollY;
    const delta = Math.abs(current - lastScroll);
    speed = 0.8 + Math.min(delta * 0.05, 3);
    lastScroll = current;
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => { speed = 0.8; }, 300);
  });

  registerAnim('wheels', () => { rafId = requestAnimationFrame(loop); }, () => { cancelAnimationFrame(rafId); rafId = null; });
}

/* =========================================================
   磁性按钮效果
   ========================================================= */
function initMagnetic() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) return;
  const btns = document.querySelectorAll('.magnetic');
  btns.forEach(btn => {
    let rafId = null;
    let targetX = 0, targetY = 0;
    let curX = 0, curY = 0;

    function onMove(e) {
      const rect = btn.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = (e.clientX - cx) * 0.25;
      const dy = (e.clientY - cy) * 0.25;
      targetX = dx;
      targetY = dy;
      if (!rafId) rafId = requestAnimationFrame(animate);
    }

    function animate() {
      curX += (targetX - curX) * 0.2;
      curY += (targetY - curY) * 0.2;
      btn.style.transform = `translate(${curX}px, ${curY}px)`;
      if (Math.abs(targetX - curX) > 0.1 || Math.abs(targetY - curY) > 0.1) {
        rafId = requestAnimationFrame(animate);
      } else {
        rafId = null;
      }
    }

    function onLeave() {
      targetX = 0; targetY = 0;
      if (!rafId) rafId = requestAnimationFrame(animate);
    }

    btn.addEventListener('mousemove', onMove);
    btn.addEventListener('mouseleave', onLeave);
  });
}

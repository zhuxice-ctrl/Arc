<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>时计修复所 HOROLOGE — 古董钟表修复工坊</title>

<link rel="preconnect" href="https://miaoda.feishu.cn" />
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Noto+Serif+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" />

<style>
/* ============================================================
   HOROLOGE — 时计修复所
   Antique Horology Atelier Brand Site
   Palette: Ivory #F2EBDD · Ink #171512 · Brass #B08D2E · Burgundy #7A1E2B
   ============================================================ */

:root {
  --ivory:       #F2EBDD;
  --ivory-2:     #E9E0CC;
  --ivory-3:     #DDD2B8;
  --ink:         #171512;
  --ink-soft:    #2A2620;
  --ink-mute:    #4A4439;
  --brass:       #B08D2E;
  --brass-light: #D4B049;
  --brass-dark:  #8A6B1E;
  --burgundy:    #7A1E2B;
  --burgundy-2:  #5C1620;
  --velvet:      #3A0E15;
  --sepia:       #8B6F47;

  --font-display: "Cormorant Garamond", "Noto Serif SC", serif;
  --font-body:    "Noto Serif SC", "Cormorant Garamond", serif;
  --font-mono:    "JetBrains Mono", monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--ivory);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  cursor: none;
}

@media (max-width: 900px) {
  html, body { cursor: auto; }
}

img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: none; background: none; border: none; color: inherit; }
@media (max-width: 900px) { button { cursor: pointer; } }

/* ------- custom cursor ------- */
.cursor-outer, .cursor-inner, .cursor-glow {
  position: fixed;
  top: 0; left: 0;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  will-change: transform;
}
.cursor-outer {
  width: 36px; height: 36px;
  border: 1.5px solid var(--ink);
  border-radius: 50%;
  transition: width 0.35s cubic-bezier(.2,.9,.2,1),
              height 0.35s cubic-bezier(.2,.9,.2,1),
              border-color 0.3s ease,
              background 0.3s ease;
  mix-blend-mode: difference;
  background: rgba(255,255,255,0.04);
}
.cursor-inner {
  width: 6px; height: 6px;
  background: var(--burgundy);
  border-radius: 50%;
  transition: width 0.25s ease, height 0.25s ease, background 0.25s ease;
}
.cursor-glow {
  width: 120px; height: 120px;
  background: radial-gradient(circle, rgba(176,141,46,0.18) 0%, transparent 70%);
  border-radius: 50%;
  transition: opacity 0.4s ease;
}
.cursor-outer.is-hover {
  width: 58px; height: 58px;
  border-color: var(--brass);
  background: rgba(176,141,46,0.08);
}
.cursor-inner.is-hover {
  width: 3px; height: 3px;
  background: var(--brass);
}
.cursor-outer.is-click {
  width: 24px; height: 24px;
  border-color: var(--burgundy);
}
.cursor-ripple {
  position: fixed;
  width: 10px; height: 10px;
  border: 1px solid var(--brass);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%, -50%);
  animation: rippleOut 0.7s cubic-bezier(.2,.9,.2,1) forwards;
}
@keyframes rippleOut {
  0%   { width: 10px; height: 10px; opacity: 1; }
  100% { width: 80px; height: 80px; opacity: 0; }
}

@media (max-width: 900px) {
  .cursor-outer, .cursor-inner, .cursor-glow, .cursor-ripple { display: none; }
}

/* ------- layout primitives ------- */
.section {
  position: relative;
  width: 100%;
  padding: 120px 6vw;
}
.container {
  max-width: 1280px;
  margin: 0 auto;
  position: relative;
}
.eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--brass);
  font-weight: 400;
}
.section-title {
  font-family: var(--font-display);
  font-size: clamp(36px, 5vw, 64px);
  font-weight: 400;
  line-height: 1.08;
  color: var(--ink);
  margin-top: 12px;
  letter-spacing: -0.01em;
}
.section-title em {
  font-style: italic;
  color: var(--brass-dark);
  font-weight: 300;
}

/* ------- top nav ------- */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 22px 6vw;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: background 0.5s ease, padding 0.5s ease, box-shadow 0.5s ease;
}
.nav.scrolled {
  background: rgba(242, 235, 221, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 14px 6vw;
  box-shadow: 0 1px 0 rgba(23,21,18,0.08);
}
.nav-logo {
  display: flex;
  align-items: center;
  gap: 12px;
}
.nav-logo-mark {
  width: 36px; height: 36px;
  position: relative;
}
.nav-logo-text {
  display: flex;
  flex-direction: column;
  line-height: 1;
}
.nav-logo-text .en {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.18em;
  color: var(--ink);
}
.nav-logo-text .zh {
  font-family: var(--font-body);
  font-size: 10px;
  letter-spacing: 0.4em;
  color: var(--ink-mute);
  margin-top: 4px;
}
.nav-links {
  display: flex;
  gap: 40px;
  list-style: none;
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}
.nav-links a {
  position: relative;
  padding: 4px 0;
  transition: color 0.3s ease;
}
.nav-links a::after {
  content: "";
  position: absolute;
  left: 0; bottom: 0;
  height: 1px;
  width: 0;
  background: var(--brass);
  transition: width 0.5s cubic-bezier(.2,.9,.2,1);
}
.nav-links a:hover::after { width: 100%; }
.nav-links a:hover { color: var(--brass-dark); }
.nav-cta {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 10px 20px;
  border: 1px solid var(--ink);
  position: relative;
  overflow: hidden;
  transition: color 0.4s ease;
}
.nav-cta::before {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--ink);
  transform: translateY(101%);
  transition: transform 0.5s cubic-bezier(.2,.9,.2,1);
}
.nav-cta:hover { color: var(--ivory); }
.nav-cta:hover::before { transform: translateY(0); }
.nav-cta span { position: relative; z-index: 1; }

.nav-burger { display: none; }

@media (max-width: 900px) {
  .nav-links { display: none; }
  .nav-burger {
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 28px;
  }
  .nav-burger span {
    height: 1px;
    background: var(--ink);
    transition: transform 0.3s ease, opacity 0.3s ease;
  }
}

/* ------- hero ------- */
.hero {
  min-height: 100vh;
  padding: 120px 6vw 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 40%, rgba(176,141,46,0.12) 0%, transparent 55%),
    radial-gradient(ellipse at 20% 80%, rgba(122,30,43,0.06) 0%, transparent 45%);
  pointer-events: none;
}
.hero-grain {
  position: absolute;
  inset: 0;
  opacity: 0.04;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

.hero-inner {
  width: 100%;
  max-width: 1280px;
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 80px;
  align-items: center;
  position: relative;
  z-index: 2;
}

.hero-text .hero-eyebrow {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.3em;
  color: var(--brass-dark);
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 28px;
}
.hero-eyebrow::before {
  content: "";
  width: 32px; height: 1px;
  background: var(--brass);
}
.hero-title {
  font-family: var(--font-display);
  font-size: clamp(48px, 7vw, 96px);
  font-weight: 400;
  line-height: 0.98;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.hero-title .line {
  display: block;
  overflow: hidden;
}
.hero-title .line span {
  display: inline-block;
  transform: translateY(110%);
  animation: slideUp 1.1s cubic-bezier(.2,.9,.2,1) forwards;
}
.hero-title .line:nth-child(2) span { animation-delay: 0.15s; }
.hero-title .line:nth-child(3) span { animation-delay: 0.3s; }
@keyframes slideUp {
  to { transform: translateY(0); }
}
.hero-title em {
  font-style: italic;
  font-weight: 300;
  color: var(--brass-dark);
}
.hero-sub {
  margin-top: 32px;
  max-width: 460px;
  font-size: 15px;
  line-height: 1.8;
  color: var(--ink-mute);
  opacity: 0;
  animation: fadeIn 1s ease 0.9s forwards;
}
@keyframes fadeIn { to { opacity: 1; } }

.hero-actions {
  margin-top: 40px;
  display: flex;
  gap: 16px;
  align-items: center;
  opacity: 0;
  animation: fadeIn 1s ease 1.1s forwards;
}

.btn-primary {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 16px 32px;
  background: var(--ink);
  color: var(--ivory);
  position: relative;
  overflow: hidden;
  transition: transform 0.3s cubic-bezier(.2,.9,.2,1);
}
.btn-primary::after {
  content: "";
  position: absolute;
  top: 0; left: -100%;
  width: 50%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(176,141,46,0.35), transparent);
  transition: left 0.8s cubic-bezier(.2,.9,.2,1);
}
.btn-primary:hover::after { left: 150%; }

.btn-ghost {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 16px 4px;
  border-bottom: 1px solid var(--ink);
  transition: color 0.3s ease, border-color 0.3s ease;
}
.btn-ghost:hover { color: var(--burgundy); border-color: var(--burgundy); }

.hero-meta {
  margin-top: 60px;
  display: flex;
  gap: 48px;
  padding-top: 32px;
  border-top: 1px solid rgba(23,21,18,0.12);
  opacity: 0;
  animation: fadeIn 1s ease 1.3s forwards;
}
.hero-meta-item .num {
  font-family: var(--font-display);
  font-size: 36px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1;
}
.hero-meta-item .num sup {
  font-size: 16px;
  color: var(--brass);
  vertical-align: super;
}
.hero-meta-item .lbl {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-top: 8px;
}

/* hero watch */
.hero-watch-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  height: 560px;
}
.watch-plate {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-style: preserve-3d;
  will-change: transform;
}
.watch-case {
  width: 440px; height: 440px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 30% 30%, #E5D3A1 0%, #B08D2E 30%, #7A611B 65%, #4A3B0F 100%);
  box-shadow:
    0 40px 80px -20px rgba(23,21,18,0.4),
    inset 0 2px 6px rgba(255,240,200,0.5),
    inset 0 -4px 10px rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.watch-bezel {
  position: absolute;
  inset: 16px;
  border-radius: 50%;
  border: 2px solid rgba(0,0,0,0.3);
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
}
.watch-dial {
  width: 380px; height: 380px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 50% 50%, var(--ivory) 0%, var(--ivory-2) 70%, var(--ivory-3) 100%);
  position: relative;
  box-shadow:
    inset 0 2px 8px rgba(0,0,0,0.15),
    inset 0 -1px 3px rgba(255,255,255,0.6);
}

/* hour markers */
.watch-marker {
  position: absolute;
  left: 50%; top: 50%;
  width: 2px; height: 14px;
  background: var(--ink);
  transform-origin: 50% 178px;
  transform: translate(-50%, -50%);
}
.watch-marker.roman {
  background: transparent;
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 500;
  color: var(--ink);
  width: 40px; height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.watch-brand-label {
  position: absolute;
  top: 28%;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
}
.watch-brand-label .name {
  font-family: var(--font-display);
  font-size: 16px;
  letter-spacing: 0.3em;
  color: var(--ink);
}
.watch-brand-label .sub {
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.25em;
  color: var(--brass-dark);
  margin-top: 3px;
}

/* sub-dial: seconds / balance wheel */
.watch-subdial {
  position: absolute;
  width: 110px; height: 110px;
  border-radius: 50%;
  border: 1px solid rgba(23,21,18,0.2);
  background:
    radial-gradient(circle at 50% 50%, rgba(122,30,43,0.04) 0%, transparent 70%);
  left: 50%; top: 58%;
  transform: translate(-50%, -50%);
}
.watch-subdial .mark {
  position: absolute;
  left: 50%; top: 50%;
  width: 1px; height: 6px;
  background: rgba(23,21,18,0.4);
  transform-origin: 50% 50px;
  transform: translate(-50%, -50%);
}
.balance-wheel {
  position: absolute;
  inset: 18px;
  border-radius: 50%;
  border: 3px solid var(--ink-soft);
  animation: balanceOsc 2.5s ease-in-out infinite;
  transform-origin: center;
}
@keyframes balanceOsc {
  0%, 100% { transform: rotate(-14deg); }
  50%      { transform: rotate(14deg); }
}
.balance-wheel::before,
.balance-wheel::after {
  content: "";
  position: absolute;
  width: 10px; height: 10px;
  background: var(--ink);
  border-radius: 50%;
  top: 50%;
  transform: translateY(-50%);
}
.balance-wheel::before { left: -6px; }
.balance-wheel::after { right: -6px; }
.balance-wheel .spoke {
  position: absolute;
  left: 50%; top: 50%;
  width: 2px; height: 100%;
  background: var(--ink-soft);
  transform: translate(-50%, -50%);
}
.balance-wheel .spoke:nth-child(2) { transform: translate(-50%, -50%) rotate(90deg); }

.hairspring {
  position: absolute;
  left: 50%; top: 50%;
  width: 40px; height: 40px;
  transform: translate(-50%, -50%);
  animation: springPulse 2.5s ease-in-out infinite;
  transform-origin: center;
}
@keyframes springPulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50%      { transform: translate(-50%, -50%) scale(1.08); }
}
.hairspring svg { width: 100%; height: 100%; }

/* hands */
.watch-hands {
  position: absolute;
  inset: 0;
}
.hand {
  position: absolute;
  left: 50%; top: 50%;
  transform-origin: 50% 100%;
  background: var(--ink);
  border-radius: 2px;
  will-change: transform;
}
.hand-hour {
  width: 5px; height: 100px;
  transform: translate(-50%, -100%) rotate(0deg);
  clip-path: polygon(30% 0, 70% 0, 60% 100%, 40% 100%);
}
.hand-minute {
  width: 4px; height: 145px;
  transform: translate(-50%, -100%) rotate(0deg);
  clip-path: polygon(30% 0, 70% 0, 55% 100%, 45% 100%);
}
.hand-second {
  width: 1.5px; height: 160px;
  background: var(--burgundy);
  transform: translate(-50%, -85%) rotate(0deg);
  transition: none;
}
.hand-second::after {
  content: "";
  position: absolute;
  bottom: -14px; left: 50%;
  transform: translateX(-50%);
  width: 10px; height: 10px;
  background: var(--burgundy);
  border-radius: 50%;
}
.watch-center-cap {
  position: absolute;
  left: 50%; top: 50%;
  width: 14px; height: 14px;
  background: var(--ink);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  z-index: 5;
  box-shadow: 0 1px 2px rgba(0,0,0,0.4);
}
.watch-center-cap::after {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: var(--brass);
}

/* floating gears */
.gear-float {
  position: absolute;
  will-change: transform;
  pointer-events: none;
}
.gear-1 { top: 8%; left: 12%; animation: spinGear 24s linear infinite; }
.gear-2 { bottom: 14%; right: 8%; animation: spinGear 18s linear infinite reverse; }
.gear-3 { top: 40%; right: -4%; animation: spinGear 30s linear infinite; opacity: 0.5; }
@keyframes spinGear { to { transform: rotate(360deg); } }

@media (max-width: 1000px) {
  .hero-inner { grid-template-columns: 1fr; gap: 40px; }
  .hero-watch-wrap { height: 420px; order: -1; }
  .watch-case { width: 340px; height: 340px; }
  .watch-dial { width: 290px; height: 290px; }
  .hand-hour { height: 75px; }
  .hand-minute { height: 110px; }
  .hand-second { height: 120px; }
  .watch-subdial { width: 85px; height: 85px; top: 60%; }
  .balance-wheel { inset: 14px; }
  .watch-marker { transform-origin: 50% 135px; }
}

/* ------- marquee ------- */
.marquee-section {
  padding: 28px 0;
  border-top: 1px solid rgba(23,21,18,0.1);
  border-bottom: 1px solid rgba(23,21,18,0.1);
  overflow: hidden;
  background: var(--ivory-2);
}
.marquee-track {
  display: flex;
  gap: 60px;
  white-space: nowrap;
  animation: marquee 40s linear infinite;
}
.marquee-track span {
  font-family: var(--font-display);
  font-size: 16px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  gap: 60px;
}
.marquee-track .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--brass);
}
@keyframes marquee {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

/* ------- craft / process section ------- */
.craft-section {
  background: var(--ink);
  color: var(--ivory);
  position: relative;
  overflow: hidden;
}
.craft-section::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(ellipse at 80% 20%, rgba(176,141,46,0.1) 0%, transparent 50%),
    radial-gradient(ellipse at 10% 80%, rgba(122,30,43,0.1) 0%, transparent 40%);
  pointer-events: none;
}
.craft-section .section-title { color: var(--ivory); }
.craft-section .section-title em { color: var(--brass-light); }
.craft-section .eyebrow { color: var(--brass-light); }

.craft-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
  margin-top: 64px;
  position: relative;
  z-index: 2;
}
.craft-step {
  padding: 36px 28px;
  border: 1px solid rgba(242,235,221,0.12);
  position: relative;
  transition: border-color 0.4s ease, transform 0.5s cubic-bezier(.2,.9,.2,1);
  background: rgba(242,235,221,0.02);
}
.craft-step:hover {
  border-color: var(--brass);
  transform: translateY(-4px);
}
.craft-step-num {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--brass);
  margin-bottom: 48px;
}
.craft-step-icon {
  width: 56px; height: 56px;
  margin-bottom: 24px;
  color: var(--brass-light);
  transition: transform 0.6s cubic-bezier(.2,.9,.2,1);
}
.craft-step:hover .craft-step-icon { transform: rotate(12deg) scale(1.05); }
.craft-step-title {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 500;
  margin-bottom: 12px;
  color: var(--ivory);
}
.craft-step-desc {
  font-size: 13px;
  line-height: 1.7;
  color: rgba(242,235,221,0.6);

@media (max-width: 1000px) {

@media (max-width: 600px) {
  .craft-grid { grid-template-columns: 1fr; }

/* ------- collection / timepieces section ------- */

  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 40px;
  margin-bottom: 48px;
}
.collection-header p {
  max-width: 400px;
  font-size: 14px;
  color: var(--ink-mute);
  line-height: 1.7;
}

  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;

  background: var(--ivory-2);
  border: 1px solid rgba(23,21,18,0.08);
  padding: 32px;
  position: relative;

  transform-style: preserve-3d;
  will-change: transform;
}
.watch-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(176,141,46,0.15) 0%, transparent 60%);
  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
}

  border-color: var(--brass);
}

  aspect-ratio: 4/3;

  align-items: center;
  justify-content: center;
  margin-bottom: 28px;
  position: relative;
}

  width: 70%;

  transition: transform 0.6s cubic-bezier(.2,.9,.2,1);
}

  transform: scale(1.08) rotate(-3deg);
}

.watch-card-tag {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--brass-dark);
  margin-bottom: 8px;
}
.watch-card-name {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 500;
  margin-bottom: 4px;
  color: var(--ink);
}
.watch-card-year {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-mute);
  letter-spacing: 0.1em;
  margin-bottom: 20px;
}
.watch-card-desc {
  font-size: 13px;
  line-height: 1.65;
  color: var(--ink-mute);
  margin-bottom: 20px;
}
.watch-card-price {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 16px;
  border-top: 1px solid rgba(23,21,18,0.1);
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 500;
  color: var(--ink);
}
.watch-card-price .arrow {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 1px solid var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.3s ease, color 0.3s ease, transform 0.4s cubic-bezier(.2,.9,.2,1);

  background: var(--ink);
  color: var(--ivory);

@media (max-width: 1000px) {
  .watches-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  .watches-grid { grid-template-columns: 1fr; }
  .collection-header { flex-direction: column; align-items: flex-start; }
}

  background: var(--ivory-2);
  position: relative;
  overflow: hidden;
}

  display: grid;

  gap: 80px;
  align-items: center;
  margin-top: 0;

  position: relative;
  aspect-ratio: 3/4;
  background: var(--ivory-3);
  overflow: hidden;
}

  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 35%, rgba(176,141,46,0.3) 0%, transparent 60%),
    linear-gradient(180deg, rgba(122,30,43,0.15) 0%, rgba(23,21,18,0.3) 100%);

.master-portrait-frame {
  position: absolute;
  inset: 16px;
  border: 1px solid var(--brass);
  pointer-events: none;
}

  position: absolute;
  bottom: 32px; left: 32px; right: 32px;
  color: var(--ivory);
}

  font-family: var(--font-body);
  font-size: 28px;
  font-weight: 500;
}
.master-portrait-name .en {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 16px;
  color: var(--brass-light);
  margin-top: 4px;
}

.master-content .quote {
  font-family: var(--font-display);
  font-size: clamp(24px, 3vw, 36px);
  font-style: italic;
  font-weight: 300;

  color: var(--ink);
  margin-bottom: 32px;
}
.master-content .quote::before {
  content: """;
  font-size: 80px;
  line-height: 0;
  color: var(--brass);

  margin-bottom: 24px;
  font-family: var(--font-display);
}
.master-bio {
  font-size: 14px;
  line-height: 1.8;
  color: var(--ink-mute);
  margin-bottom: 28px;
  max-width: 480px;
}
.master-stats {
  display: flex;
  gap: 36px;
  padding-top: 28px;
  border-top: 1px solid rgba(23,21,18,0.15);

.master-stat .n {
  font-family: var(--font-display);

  font-weight: 500;
  color: var(--burgundy);

.master-stat .l {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-top: 4px;

  content: "";

.form-sub {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;

  margin-bottom: 32px;
}

  display: block;

  width: 100%;

  font-size: 15px;

  appearance: none;
  cursor: none;
}

  left: 0; right: 0; bottom: 0;
  height: 1px;

  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

  margin-top: 32px;

  padding: 18px;

}

.reveal {

  transform: translateY(30px);
  transition: opacity 0.9s cubic-bezier(.2,.9,.2,1),
              transform 0.9s cubic-bezier(.2,.9,.2,1);
}
.reveal.in-view {
  opacity: 1;
  transform: translateY(0);
}
.reveal-delay-1 { transition-delay: 0.1s; }
.reveal-delay-2 { transition-delay: 0.2s; }
.reveal-delay-3 { transition-delay: 0.3s; }
.reveal-delay-4 { transition-delay: 0.4s; }

.scroll-bar {
  position: fixed;
  top: 0; left: 0;
  height: 2px;
  background: var(--brass);
  z-index: 200;
  transform-origin: left;
  transform: scaleX(0);
  pointer-events: none;
}

.magnetic {
  display: inline-block;
  transition: transform 0.15s ease-out;

}

}

    };
    rafRef.current = requestAnimationFrame(tick);

    const onMove = (e) => {
      targetRef.current.x = e.clientX;
      targetRef.current.y = e.clientY;
    };

    const onOver = (e) => {
      const t = e.target;
      if (t.closest && t.closest("a, button, .magnetic, .watch-card, .craft-step, input, select, textarea")) {
        outerRef.current && outerRef.current.classList.add("is-hover");
        innerRef.current && innerRef.current.classList.add("is-hover");
      }
    };
    const onOut = (e) => {
      const t = e.target;
      if (t.closest && t.closest("a, button, .magnetic, .watch-card, .craft-step, input, select, textarea")) {
        outerRef.current && outerRef.current.classList.remove("is-hover");
        innerRef.current && innerRef.current.classList.remove("is-hover");
      }
    };

    const onClick = (e) => {
      // click ripple
      const r = document.createElement("div");
      r.className = "cursor-ripple";
      r.style.left = e.clientX + "px";
      r.style.top = e.clientY + "px";
      document.body.appendChild(r);
      setTimeout(() => r.remove(), 750);

      // squeeze
      outerRef.current && outerRef.current.classList.add("is-click");
      setTimeout(() => outerRef.current && outerRef.current.classList.remove("is-click"), 200);
    };

    const onVisibility = () => {
      visibleRef.current = !document.hidden;
    };

    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseover", onOver);
    window.addEventListener("mouseout", onOut);
    window.addEventListener("mousedown", onClick);
    document.addEventListener("visibilitychange", onVisibility);

    return () => {
      cancelAnimationFrame(rafRef.current);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseover", onOver);
      window.removeEventListener("mouseout", onOut);
      window.removeEventListener("mousedown", onClick);
      document.removeEventListener("visibilitychange", onVisibility);
    };
  }, []);

  return (
    <>
      <div ref={glowRef} className="cursor-glow" />
      <div ref={outerRef} className="cursor-outer" style={{ left: "50%", top: "50%" }} />
      <div ref={innerRef} className="cursor-inner" style={{ left: "50%", top: "50%" }} />
    </>
  );
}

// ---------- Scroll progress bar ----------
function ScrollBar() {
  const ref = useRef(null);
  const rafRef = useRef(null);

  useEffect(() => {
    const onScroll = () => {
      if (rafRef.current) return;
      rafRef.current = requestAnimationFrame(() => {
        rafRef.current = null;
        const sc = document.documentElement.scrollTop || document.body.scrollTop;
        const h = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const p = h > 0 ? sc / h : 0;
        if (ref.current) ref.current.style.transform = `scaleX(${p})`;
      });
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  return <div ref={ref} className="scroll-bar" style={{ width: "100%" }} />;
}

// ---------- Hero watch (live time) ----------
function HeroWatch() {
  const plateRef = useRef(null);

  // hands rotation via direct DOM
  const hourRef = useRef(null);
  const minRef = useRef(null);
  const secRef = useRef(null);
  const rafRef = useRef(null);
  const visibleRef = useRef(true);

  useEffect(() => {
    const tick = () => {
      if (!visibleRef.current) { rafRef.current = requestAnimationFrame(tick); return; }
      const now = new Date();
      const ms = now.getMilliseconds();
      const s = now.getSeconds() + ms / 1000;
      const m = now.getMinutes() + s / 60;
      const h = (now.getHours() % 12) + m / 60;

      if (hourRef.current) hourRef.current.style.transform = `translate(-50%, -100%) rotate(${h * 30}deg)`;
      if (minRef.current)  minRef.current.style.transform  = `translate(-50%, -100%) rotate(${m * 6}deg)`;
      if (secRef.current)  secRef.current.style.transform  = `translate(-50%, -85%) rotate(${s * 6}deg)`;

      rafRef.current = requestAnimationFrame(tick);
    };
    if (!prefersReducedMotion()) {
      rafRef.current = requestAnimationFrame(tick);
    } else {
      // single static set
      const now = new Date();
      const s = now.getSeconds();
      const m = now.getMinutes() + s / 60;
      const h = (now.getHours() % 12) + m / 60;
      if (hourRef.current) hourRef.current.style.transform = `translate(-50%, -100%) rotate(${h * 30}deg)`;
      if (minRef.current)  minRef.current.style.transform  = `translate(-50%, -100%) rotate(${m * 6}deg)`;
      if (secRef.current)  secRef.current.style.transform  = `translate(-50%, -85%) rotate(${s * 6}deg)`;
    }

    const onVis = () => { visibleRef.current = !document.hidden; };
    document.addEventListener("visibilitychange", onVis);

    return () => {
      cancelAnimationFrame(rafRef.current);
      document.removeEventListener("visibilitychange", onVis);
    };
  }, []);

  // parallax tilt on mousemove — direct DOM
  useEffect(() => {
    if (prefersReducedMotion()) return;
    const el = plateRef.current;
    if (!el) return;

    let targetX = 0, targetY = 0;
    let curX = 0, curY = 0;
    let raf = null;

    const onMove = (e) => {
      const rect = el.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      targetX = (e.clientY - cy) / rect.height * -6;
      targetY = (e.clientX - cx) / rect.width * 6;
    };

    const lerp = (a, b, t) => a + (b - a) * t;
    const tick = () => {
      curX = lerp(curX, targetX, 0.06);
      curY = lerp(curY, targetY, 0.06);
      el.style.transform = `perspective(1200px) rotateX(${curX}deg) rotateY(${curY}deg)`;
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);

    const onLeave = () => { targetX = 0; targetY = 0; };

    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseleave", onLeave);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseleave", onLeave);
    };
  }, []);

  // roman numerals for 12/3/6/9 + line markers for others
  const markers = [];
  const romans = { 0: "XII", 3: "III", 6: "VI", 9: "IX" };
  for (let i = 0; i < 12; i++) {
    const isRoman = i % 3 === 0;
    markers.push(
      <div
        key={i}
        className={`watch-marker ${isRoman ? "roman" : ""}`}
        style={{ transform: `translate(-50%, -50%) rotate(${i * 30}deg)` }}
      >
        {isRoman ? <span style={{ display: "inline-block", transform: `rotate(${-i * 30}deg)` }}>{romans[i]}</span> : null}
      </div>
    );
  }

  return (
    <div className="hero-watch-wrap">
      {/* floating gears */}
      <div className="gear-float gear-1">
        <Icon.Gear width="90" height="90" style={{ color: "var(--brass-dark)", opacity: 0.25 }} />
      </div>
      <div className="gear-float gear-2">
        <Icon.Gear width="120" height="120" style={{ color: "var(--burgundy)", opacity: 0.15 }} />
      </div>
      <div className="gear-float gear-3">
        <Icon.Gear width="200" height="200" style={{ color: "var(--ink)", opacity: 0.05 }} />
      </div>

      <div className="watch-plate" ref={plateRef}>
        <div className="watch-case">
          <div className="watch-bezel" />
          <div className="watch-dial">
            {markers}
            <div className="watch-brand-label">
              <div className="name">HOROLOGE</div>
              <div className="sub">ATELIER · EST. 1987</div>
            </div>

            {/* sub-dial with balance wheel */}
            <div className="watch-subdial">
              {[...Array(12)].map((_, i) => (
                <div key={i} className="mark" style={{ transform: `translate(-50%, -50%) rotate(${i * 30}deg)` }} />
              ))}
              <div className="balance-wheel">
                <div className="spoke" />
                <div className="spoke" />
              </div>
              <div className="hairspring">
                <svg viewBox="0 0 40 40" fill="none" stroke="var(--ink-soft)" strokeWidth="0.8">
                  <circle cx="20" cy="20" r="4" />
                  <circle cx="20" cy="20" r="7" />
                  <circle cx="20" cy="20" r="10" />
                  <circle cx="20" cy="20" r="13" />
                  <circle cx="20" cy="20" r="16" />
                  <circle cx="20" cy="20" r="2" fill="var(--ink)" stroke="none" />
                </svg>
              </div>
            </div>

            {/* hands */}
            <div className="watch-hands">
              <div ref={hourRef} className="hand hand-hour" />
              <div ref={minRef} className="hand hand-minute" />
              <div ref={secRef} className="hand hand-second" />
              <div className="watch-center-cap" />
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ---------- Counter animation ----------
function Counter({ end, suffix = "", duration = 2000, delay = 0 }) {
  const ref = useRef(null);
  const triggeredRef = useRef(false);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !triggeredRef.current) {
          triggeredRef.current = true;
          animate();
          observer.disconnect();
        }
      });
    }, { threshold: 0.3 });
    observer.observe(el);

    const animate = () => {
      if (prefersReducedMotion()) {
        el.textContent = end + suffix;
        return;
      }
      const start = performance.now();
      const step = (now) => {
        const t = Math.min((now - start - delay) / duration, 1);
        if (t < 0) { requestAnimationFrame(step); return; }
        // easeOutCubic
        const eased = 1 - Math.pow(1 - t, 3);
        const val = Math.round(eased * end);
        el.textContent = val + suffix;
        if (t < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    };

    return () => observer.disconnect();
  }, [end, suffix, duration, delay]);

  return <span ref={ref}>0{suffix}</span>;
}

// ---------- Scroll Reveal wrapper ----------
function Reveal({ children, delay = 0, as = "div" }) {
  const ref = useRef(null);
  const Tag = as;

  useEffect(() => {
    if (prefersReducedMotion()) return;
    const el = ref.current;
    if (!el) return;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          setTimeout(() => el.classList.add("in-view"), delay);
          observer.disconnect();
        }
      });
    }, { threshold: 0.15 });
    observer.observe(el);

    return () => observer.disconnect();
  }, [delay]);

  return (
    <Tag ref={ref} className="reveal">
      {children}
    </Tag>
  );
}

// ---------- Tilt card (direct DOM transform) ----------
function TiltCard({ children, className = "" }) {
  const ref = useRef(null);

  useEffect(() => {
    if (prefersReducedMotion()) return;
    const card = ref.current;
    if (!card) return;

    let targetX = 0, targetY = 0;
    let curX = 0, curY = 0;
    let raf = null;
    let active = false;

    const lerp = (a, b, t) => a + (b - a) * t;
    const tick = () => {
      curX = lerp(curX, targetX, 0.1);
      curY = lerp(curY, targetY, 0.1);
      card.style.transform = `perspective(800px) rotateX(${curX}deg) rotateY(${curY}deg)`;
      raf = requestAnimationFrame(tick);
    };

    const onEnter = () => {
      active = true;
      if (!raf) raf = requestAnimationFrame(tick);
    };
    const onMove = (e) => {
      if (!active) return;
      const rect = card.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      targetX = -y * 8;
      targetY = x * 8;
      card.style.setProperty("--mx", ((e.clientX - rect.left) / rect.width * 100) + "%");
      card.style.setProperty("--my", ((e.clientY - rect.top) / rect.height * 100) + "%");
    };
    const onLeave = () => {
      active = false;
      targetX = 0; targetY = 0;
    };

    card.addEventListener("mouseenter", onEnter);
    card.addEventListener("mousemove", onMove);
    card.addEventListener("mouseleave", onLeave);

    return () => {
      cancelAnimationFrame(raf);
      card.removeEventListener("mouseenter", onEnter);
      card.removeEventListener("mousemove", onMove);
      card.removeEventListener("mouseleave", onLeave);
    };
  }, []);

  return (
    <div ref={ref} className={`watch-card ${className}`}>
      {children}
    </div>
  );
}

// ---------- Magnetic button ----------
function Magnetic({ children, strength = 0.3 }) {
  const ref = useRef(null);

  useEffect(() => {
    if (prefersReducedMotion()) return;
    const el = ref.current;
    if (!el) return;

    let tx = 0, ty = 0, cx = 0, cy = 0;
    let raf = null;

    const lerp = (a, b, t) => a + (b - a) * t;
    const tick = () => {
      cx = lerp(cx, tx, 0.2);
      cy = lerp(cy, ty, 0.2);
      el.style.transform = `translate(${cx}px, ${cy}px)`;
      raf = requestAnimationFrame(tick);
    };

    const onMove = (e) => {
      const rect = el.getBoundingClientRect();
      const dx = e.clientX - (rect.left + rect.width / 2);
      const dy = e.clientY - (rect.top + rect.height / 2);
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 120) {
        tx = dx * strength;
        ty = dy * strength;
      } else {
        tx = 0; ty = 0;
      }
    };
    const onEnter = () => { if (!raf) raf = requestAnimationFrame(tick); };
    const onLeave = () => { tx = 0; ty = 0; };

    el.addEventListener("mouseenter", onEnter);
    window.addEventListener("mousemove", onMove);
    el.addEventListener("mouseleave", onLeave);

    return () => {
      cancelAnimationFrame(raf);
      el.removeEventListener("mouseenter", onEnter);
      window.removeEventListener("mousemove", onMove);
      el.removeEventListener("mouseleave", onLeave);
    };
  }, [strength]);

  return <div ref={ref} className="magnetic">{children}</div>;
}

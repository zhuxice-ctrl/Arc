<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>斫琴录 · 古琴工坊</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" />
<style>
/* ========== 基础与变量 ========== */
:root {
  --lacquer: #0D0B09;
  --lacquer-2: #14110E;
  --lacquer-3: #1C1713;
  --wood-dark: #2A221B;
  --wood-mid: #3D342C;
  --wood-light: #6B5A47;
  --paulownia: #C9A66B;
  --cinnabar: #B4331F;
  --cinnabar-light: #D94A30;
  --gold: #D4A24A;
  --gold-light: #E8C06E;
  --gold-pale: #F5E4B8;
  --ink: #EAE0CC;
  --ink-dim: #9C8F78;
  --ink-faint: #5E5344;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: var(--lacquer);
  color: var(--ink);
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-weight: 400;
  line-height: 1.7;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  cursor: none;
}

::selection { background: var(--cinnabar); color: var(--gold-pale); }

a { color: inherit; text-decoration: none; cursor: none; }
button { cursor: none; font-family: inherit; border: none; background: none; color: inherit; }

/* 大漆纹理背景 */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%, rgba(180,51,31,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 80%, rgba(212,162,74,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 100% 100% at 50% 50%, var(--lacquer) 0%, #070604 100%);
  z-index: -2;
  pointer-events: none;
}

/* 金箔微粒噪点 */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 0.83 0 0 0 0 0.64 0 0 0 0 0.29 0 0 0 0.04 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  opacity: 0.6;
  mix-blend-mode: screen;
  z-index: -1;
  pointer-events: none;
  animation: goldShimmer 18s ease-in-out infinite alternate;
}

@keyframes goldShimmer {
  0% { opacity: 0.3; transform: scale(1); }
  100% { opacity: 0.7; transform: scale(1.05); }
}

/* ========== 自定义光标 ========== */
.cursor-outer {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 36px;
  height: 36px;
  border: 2px solid rgba(234,224,204,0.85);
  border-radius: 50%;
  pointer-events: none;
  z-index: 99999;
  transform: translate(-50%, -50%);
  transition: width 0.3s cubic-bezier(0.2,0.9,0.3,1), height 0.3s cubic-bezier(0.2,0.9,0.3,1), border-color 0.3s, background 0.3s;
  box-shadow:
    0 0 12px rgba(212,162,74,0.3),
    0 0 24px rgba(212,162,74,0.15),
    inset 0 0 8px rgba(212,162,74,0.1);
  will-change: transform;
}

.cursor-inner {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 6px;
  height: 6px;
  background: var(--gold);
  border-radius: 50%;
  pointer-events: none;
  z-index: 100000;
  transform: translate(-50%, -50%);
  box-shadow:
    0 0 6px var(--gold),
    0 0 12px rgba(212,162,74,0.6);
  transition: width 0.2s, height 0.2s, background 0.2s, box-shadow 0.2s;
  will-change: transform;
}

.cursor-outer.hover {
  width: 56px;
  height: 56px;
  border-color: var(--gold-light);
  background: rgba(212,162,74,0.08);
}

.cursor-inner.hover {
  width: 8px;
  height: 8px;
  background: var(--cinnabar-light);
  box-shadow: 0 0 8px var(--cinnabar-light), 0 0 16px rgba(217,74,48,0.6);
}

.cursor-outer.click {
  animation: cursorClick 0.4s ease-out forwards;
}

@keyframes cursorClick {
  0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  50% { transform: translate(-50%, -50%) scale(1.6); opacity: 0.6; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

.cursor-ripple {
  position: fixed;
  width: 10px;
  height: 10px;
  border: 1px solid var(--gold-light);
  border-radius: 50%;
  pointer-events: none;
  z-index: 99998;
  transform: translate(-50%, -50%);
  animation: rippleOut 0.8s ease-out forwards;
}

@keyframes rippleOut {
  0% { width: 10px; height: 10px; opacity: 0.8; }
  100% { width: 80px; height: 80px; opacity: 0; }
}

/* ========== 导航 ========== */
.nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  padding: 24px 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: background 0.4s, backdrop-filter 0.4s, padding 0.4s;
}

.nav.scrolled {
  background: rgba(13,11,9,0.85);
  backdrop-filter: blur(12px);
  padding: 16px 48px;
  border-bottom: 1px solid rgba(212,162,74,0.12);
}

.nav-logo {
  font-family: "Noto Serif SC", serif;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 4px;
  color: var(--gold-light);
  display: flex;
  align-items: center;
  gap: 10px;
}

.nav-logo-seal {
  width: 32px;
  height: 32px;
  background: var(--cinnabar);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gold-pale);
  font-size: 14px;
  font-weight: 700;
  font-family: "Noto Serif SC", serif;
  border-radius: 2px;
  letter-spacing: 0;
  writing-mode: vertical-rl;
  line-height: 1;
  padding: 2px 0;
  box-shadow: 0 0 12px rgba(180,51,31,0.4);
}

.nav-links {
  display: flex;
  gap: 36px;
  list-style: none;
}

.nav-link {
  font-size: 14px;
  color: var(--ink-dim);
  position: relative;
  padding: 4px 0;
  transition: color 0.3s;
  letter-spacing: 2px;
}

.nav-link::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 0;
  width: 0;
  height: 1px;
  background: var(--gold);
  transition: width 0.3s, left 0.3s;
}

.nav-link:hover {
  color: var(--gold-light);
}

.nav-link:hover::after {
  width: 100%;
  left: 0;
}

.nav-cta {
  padding: 10px 24px;
  border: 1px solid var(--gold);
  color: var(--gold-light);
  font-size: 13px;
  letter-spacing: 2px;
  position: relative;
  overflow: hidden;
  transition: color 0.4s;
}

.nav-cta::before {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: var(--cinnabar);
  transition: left 0.4s cubic-bezier(0.2,0.8,0.2,1);
  z-index: -1;
}

.nav-cta:hover {
  color: var(--gold-pale);
  border-color: var(--cinnabar);
}

.nav-cta:hover::before {
  left: 0;
}

/* ========== Hero ========== */
.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 120px 48px 80px;
  position: relative;
  overflow: hidden;
}

.hero-title {
  font-family: "Noto Serif SC", serif;
  font-size: clamp(64px, 12vw, 180px);
  font-weight: 900;
  letter-spacing: 16px;
  text-align: center;
  background: linear-gradient(180deg, var(--gold-pale) 0%, var(--gold) 40%, var(--wood-light) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1;
  margin-bottom: 24px;
  position: relative;
  text-shadow: 0 0 60px rgba(212,162,74,0.15);
}

.hero-subtitle {
  font-family: "Noto Serif SC", serif;
  font-size: 18px;
  color: var(--ink-dim);
  letter-spacing: 8px;
  margin-bottom: 60px;
  text-align: center;
}

.hero-desc {
  max-width: 640px;
  text-align: center;
  color: var(--ink-dim);
  font-size: 15px;
  line-height: 2;
  letter-spacing: 1px;
  margin-bottom: 60px;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 1s 0.8s forwards;
}

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

/* 古琴造型 */
.guqin-wrapper {
  width: 100%;
  max-width: 900px;
  margin: 0 auto 40px;
  position: relative;
  opacity: 0;
  transform: translateY(30px);
  animation: fadeUp 1.2s 0.4s cubic-bezier(0.2,0.8,0.2,1) forwards;
}

.guqin-svg {
  width: 100%;
  height: auto;
  display: block;
  filter: drop-shadow(0 20px 60px rgba(0,0,0,0.5)) drop-shadow(0 0 40px rgba(212,162,74,0.1));
}

/* 琴弦振动 */
.qin-string {
  stroke: var(--gold-pale);
  stroke-width: 1.2;
  fill: none;
  opacity: 0.8;
  stroke-linecap: round;
}

.qin-string.vibrating {
  animation: stringVibrate 0.15s ease-in-out infinite alternate;
}

@keyframes stringVibrate {
  0% { d: path("M 50 0 Q 50.5 10 50 20"); }
  100% { d: path("M 50 0 Q 49.5 -10 50 20"); }
}

/* Hero CTA */
.hero-cta-row {
  display: flex;
  gap: 24px;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 1s 1s forwards;
}

.btn-primary {
  padding: 16px 40px;
  background: linear-gradient(135deg, var(--cinnabar) 0%, #8a2616 100%);
  color: var(--gold-pale);
  font-size: 14px;
  letter-spacing: 3px;
  font-family: "Noto Serif SC", serif;
  position: relative;
  overflow: hidden;
  transition: transform 0.3s, box-shadow 0.3s;
  box-shadow: 0 4px 20px rgba(180,51,31,0.3);
}

.btn-primary::after {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 50%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(245,228,184,0.3), transparent);
  transform: skewX(-20deg);
  transition: left 0.6s;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(180,51,31,0.5);
}

.btn-primary:hover::after {
  left: 150%;
}

.btn-outline {
  padding: 16px 40px;
  border: 1px solid var(--wood-light);
  color: var(--ink);
  font-size: 14px;
  letter-spacing: 3px;
  font-family: "Noto Serif SC", serif;
  transition: border-color 0.3s, color 0.3s, background 0.3s;
}

.btn-outline:hover {
  border-color: var(--gold);
  color: var(--gold-light);
  background: rgba(212,162,74,0.05);
}

/* 滚动提示 */
.scroll-hint {
  position: absolute;
  bottom: 36px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: var(--ink-faint);
  font-size: 12px;
  letter-spacing: 3px;
  opacity: 0;
  animation: fadeUp 1s 1.5s forwards;
}

.scroll-hint-line {
  width: 1px;
  height: 40px;
  background: linear-gradient(180deg, var(--gold) 0%, transparent 100%);
  animation: scrollLine 2s ease-in-out infinite;
}

@keyframes scrollLine {
  0%, 100% { transform: scaleY(0.3); transform-origin: top; opacity: 0.3; }
  50% { transform: scaleY(1); transform-origin: top; opacity: 1; }
}

/* ========== Section 通用 ========== */
.section {
  padding: 140px 48px;
  position: relative;
  overflow: hidden;
}

.section-label {
  font-family: "Noto Serif SC", serif;
  font-size: 13px;
  letter-spacing: 6px;
  color: var(--cinnabar);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 16px;
}

.section-label::before {
  content: "";
  width: 32px;
  height: 1px;
  background: var(--cinnabar);
}

.section-title {
  font-family: "Noto Serif SC", serif;
  font-size: clamp(32px, 5vw, 56px);
  font-weight: 700;
  letter-spacing: 4px;
  color: var(--ink);
  margin-bottom: 24px;
  line-height: 1.3;
}

.section-desc {
  max-width: 600px;
  color: var(--ink-dim);
  font-size: 15px;
  line-height: 2;
  letter-spacing: 1px;
}

/* 滚动渐入 */
.reveal {
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 1s cubic-bezier(0.2,0.8,0.2,1), transform 1s cubic-bezier(0.2,0.8,0.2,1);
}

.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

/* ========== 琴制样式 ========== */
.styles-section {
  background: linear-gradient(180deg, transparent 0%, rgba(42,34,27,0.3) 50%, transparent 100%);
}

.styles-header {
  text-align: center;
  margin-bottom: 80px;
}

.styles-header .section-label {
  justify-content: center;
}

.styles-header .section-label::after {
  content: "";
  width: 32px;
  height: 1px;
  background: var(--cinnabar);
}

.styles-header .section-title,
.styles-header .section-desc {
  margin-left: auto;
  margin-right: auto;
}

.styles-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px;
  max-width: 1200px;
  margin: 0 auto;
}

.style-card {
  background: linear-gradient(180deg, var(--lacquer-3) 0%, var(--lacquer-2) 100%);
  border: 1px solid rgba(212,162,74,0.12);
  padding: 40px 32px;
  position: relative;
  overflow: hidden;
  transition: transform 0.5s cubic-bezier(0.2,0.8,0.2,1), border-color 0.4s;
  transform-style: preserve-3d;
  will-change: transform;
}

.style-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--cinnabar), transparent);
  transform: translateX(-100%);
  transition: transform 0.6s cubic-bezier(0.2,0.8,0.2,1);
}

.style-card:hover {
  border-color: rgba(212,162,74,0.3);
}

.style-card:hover::before {
  transform: translateX(100%);
}

.style-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}

.style-num {
  font-family: "Noto Serif SC", serif;
  font-size: 64px;
  font-weight: 300;
  color: var(--wood-light);
  opacity: 0.3;
  line-height: 1;
}

.style-name-en {
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--ink-faint);
  writing-mode: vertical-rl;
}

.style-name {
  font-family: "Noto Serif SC", serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--gold-light);
  letter-spacing: 6px;
  margin-bottom: 20px;
  line-height: 1;
}

.style-dynasty {
  font-size: 12px;
  color: var(--cinnabar);
  letter-spacing: 2px;
  margin-bottom: 20px;
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(212,162,74,0.1);
}

.style-desc {
  font-size: 14px;
  color: var(--ink-dim);
  line-height: 1.9;
  letter-spacing: 0.5px;
  margin-bottom: 24px;
}

.style-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.style-tag {
  padding: 4px 12px;
  font-size: 12px;
  color: var(--wood-light);
  border: 1px solid rgba(107,90,71,0.3);
  letter-spacing: 1px;
  transition: color 0.3s, border-color 0.3s;
}

.style-card:hover .style-tag {
  color: var(--gold);
  border-color: rgba(212,162,74,0.3);
}

/* 3D 倾斜光泽 */
.style-card-shine {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(212,162,74,0.08) 0%, transparent 60%);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.4s;
}

.style-card:hover .style-card-shine {
  opacity: 1;
}

/* ========== 斫琴工序 ========== */
.process-section {
  position: relative;
}

.process-container {
  max-width: 1200px;
  margin: 0 auto;
}

.process-header {
  margin-bottom: 80px;
  max-width: 600px;
}

.process-timeline {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0;
  position: relative;
}

.process-timeline::before {
  content: "";
  position: absolute;
  top: 60px;
  left: 60px;
  right: 60px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--wood-mid) 20%, var(--wood-mid) 80%, transparent);
}

.process-step {
  text-align: center;
  position: relative;
  padding: 0 12px;
}

.process-icon {
  width: 120px;
  height: 120px;
  margin: 0 auto 24px;
  border-radius: 50%;
  background: var(--lacquer-3);
  border: 1px solid rgba(212,162,74,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: border-color 0.4s, transform 0.4s cubic-bezier(0.2,0.8,0.2,1), box-shadow 0.4s;
  cursor: pointer;
}

.process-icon:hover {
  border-color: var(--cinnabar);
  transform: scale(1.08);
  box-shadow: 0 0 30px rgba(180,51,31,0.2);
}

.process-icon svg {
  width: 48px;
  height: 48px;
  color: var(--gold);
  transition: color 0.4s;
}

.process-icon:hover svg {
  color: var(--cinnabar-light);
}

.process-num {
  position: absolute;
  top: -10px;
  right: -10px;
  width: 32px;
  height: 32px;
  background: var(--cinnabar);
  color: var(--gold-pale);
  font-size: 12px;
  font-weight: 700;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Noto Serif SC", serif;
}

.process-name {
  font-family: "Noto Serif SC", serif;
  font-size: 20px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: 4px;
  margin-bottom: 12px;
}

.process-desc {
  font-size: 13px;
  color: var(--ink-dim);
  line-height: 1.8;
  letter-spacing: 0.5px;
}

/* ========== 匠人介绍 ========== */
.master-section {
  background: linear-gradient(180deg, transparent 0%, rgba(180,51,31,0.04) 50%, transparent 100%);
}

.master-container {
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
  align-items: center;
}

.master-portrait {
  position: relative;
  aspect-ratio: 3 / 4;
  background: linear-gradient(180deg, var(--wood-mid) 0%, var(--lacquer-3) 100%);
  border: 1px solid rgba(212,162,74,0.2);
  overflow: hidden;
}

.master-portrait::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 50% 30%, rgba(201,166,107,0.3) 0%, transparent 70%),
    linear-gradient(180deg, transparent 50%, rgba(13,11,9,0.6) 100%);
}

.master-portrait-illustration {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.master-seal {
  position: absolute;
  bottom: 24px;
  right: 24px;
  width: 64px;
  height: 64px;
  background: var(--cinnabar);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gold-pale);
  font-family: "Noto Serif SC", serif;
  font-size: 18px;
  font-weight: 700;
  writing-mode: vertical-rl;
  letter-spacing: 4px;
  box-shadow: 0 0 20px rgba(180,51,31,0.5);
  animation: sealPulse 4s ease-in-out infinite;
}

@keyframes sealPulse {
  0%, 100% { box-shadow: 0 0 20px rgba(180,51,31,0.5); }
  50% { box-shadow: 0 0 35px rgba(180,51,31,0.8), 0 0 60px rgba(180,51,31,0.3); }
}

.master-info .section-label {
  margin-bottom: 20px;
}

.master-name {
  font-family: "Noto Serif SC", serif;
  font-size: 48px;
  font-weight: 700;
  color: var(--gold-light);
  letter-spacing: 8px;
  margin-bottom: 8px;
}

.master-title {
  font-size: 14px;
  color: var(--cinnabar);
  letter-spacing: 3px;
  margin-bottom: 32px;
  padding-bottom: 32px;
  border-bottom: 1px solid rgba(212,162,74,0.15);
}

.master-bio {
  font-size: 15px;
  color: var(--ink-dim);
  line-height: 2;
  letter-spacing: 0.5px;
  margin-bottom: 32px;
}

.master-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);

<body>

<!-- 自定义光标 -->
<div class="cursor-outer" id="cursorOuter"></div>
<div class="cursor-inner" id="cursorInner"></div>

<!-- 粒子画布 -->
<canvas class="particles-canvas" id="particlesCanvas"></canvas>

<div id="root"></div>

<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ========== 全局动画控制 ========== */
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let pageVisible = !document.hidden;
const rafIds = new Set();
const timers = new Set();

function safeRAF(fn) {
  if (!pageVisible || reducedMotion) return -1;
  const id = requestAnimationFrame(fn);
  rafIds.add(id);
  return id;
}

function safeSetTimeout(fn, ms) {
  const id = setTimeout(() => {
    timers.delete(id);
    fn();
  }, ms);
  timers.add(id);
  return id;
}

document.addEventListener('visibilitychange', () => {
  pageVisible = !document.hidden;
  if (!pageVisible) {
    rafIds.forEach(id => cancelAnimationFrame(id));
    rafIds.clear();
  }
});

window.addEventListener('beforeunload', () => {
  rafIds.forEach(id => cancelAnimationFrame(id));
  timers.forEach(id => clearTimeout(id));
  rafIds.clear();
  timers.clear();
});

/* ========== 粒子系统 ========== */
function initParticles() {
  if (reducedMotion) return;
  const canvas = document.getElementById('particlesCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let w, h, particles;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }

  function createParticles() {
    const count = Math.floor((w * h) / 25000);
    particles = [];
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.5 + 0.5,
        vx: (Math.random() - 0.5) * 0.15,
        vy: -Math.random() * 0.3 - 0.1,
        opacity: Math.random() * 0.5 + 0.2,
        hue: Math.random() > 0.6 ? 42 : 12, // 金色或朱砂
        life: Math.random() * 100 + 100,
        maxLife: 200,
      });
    }
  }

  let rafId = null;
  function animate() {
    if (!pageVisible || reducedMotion) { rafId = null; return; }
    ctx.clearRect(0, 0, w, h);
    particles.forEach((p, i) => {
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
      if (p.life <= 0 || p.y < -10) {
        p.x = Math.random() * w;
        p.y = h + 10;
        p.life = p.maxLife;
        p.vy = -Math.random() * 0.3 - 0.1;
      }
      const alpha = Math.min(p.opacity, p.life / 50);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      if (p.hue === 42) {
        ctx.fillStyle = `rgba(212, 162, 74, ${alpha})`;
      } else {
        ctx.fillStyle = `rgba(180, 51, 31, ${alpha * 0.6})`;
      }
      ctx.fill();
    });
    rafId = safeRAF(animate);
  }

  resize();
  createParticles();
  animate();

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      resize();
      createParticles();
    }, 200);
  });
}

/* ========== 自定义光标 ========== */
function initCursor() {
  if (reducedMotion || 'ontouchstart' in window) return;
  const outer = document.getElementById('cursorOuter');
  const inner = document.getElementById('cursorInner');
  if (!outer || !inner) return;

  let mx = window.innerWidth / 2;
  let my = window.innerHeight / 2;
  let ox = mx, oy = my;
  let ix = mx, iy = my;
  let rafId = null;

  function animate() {
    if (!pageVisible) { rafId = null; return; }
    // 外环：带阻尼缓动
    ox += (mx - ox) * 0.15;
    oy += (my - oy) * 0.15;
    outer.style.transform = `translate(${ox}px, ${oy}px) translate(-50%, -50%)`;
    outer.style.top = '0';
    outer.style.left = '0';
    // 内点：紧跟
    ix += (mx - ix) * 0.35;
    iy += (my - iy) * 0.35;
    inner.style.transform = `translate(${ix}px, ${iy}px) translate(-50%, -50%)`;
    inner.style.top = '0';
    inner.style.left = '0';
    rafId = safeRAF(animate);
  }

  document.addEventListener('mousemove', (e) => {
    mx = e.clientX;
    my = e.clientY;
  }, { passive: true });

  // 悬停交互元素
  const hoverSelectors = 'a, button, .style-card, .process-icon, .music-item, .music-tab, .form-input, .form-select, .form-textarea, .nav-link, .nav-cta';
  document.addEventListener('mouseover', (e) => {
    if (e.target.closest(hoverSelectors)) {
      outer.classList.add('hover');
      inner.classList.add('hover');
    }
  });
  document.addEventListener('mouseout', (e) => {
    if (e.target.closest(hoverSelectors)) {
      outer.classList.remove('hover');
      inner.classList.remove('hover');
    }
  });

  // 点击涟漪
  document.addEventListener('mousedown', (e) => {
    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    document.body.appendChild(ripple);
    outer.classList.add('click');
    setTimeout(() => outer.classList.remove('click'), 400);
    setTimeout(() => ripple.remove(), 800);
  });

  animate();
}

/* ========== 滚动渐入 ========== */
function initReveal() {
  if (reducedMotion) {
    document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
    return;
  }
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if (entry.isIntersecting) {
        setTimeout(() => entry.target.classList.add('visible'), i * 80);
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -50px 0px' });

  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
}

/* ========== 3D 卡片倾斜 ========== */
function initCardTilt() {
  if (reducedMotion) return;
  document.querySelectorAll('.style-card').forEach(card => {
    let rafId = null;
    let tx = 0, ty = 0;
    let cx = 0, cy = 0;

    function update() {
      cx += (tx - cx) * 0.1;
      cy += (ty - cy) * 0.1;
      card.style.transform = `perspective(1000px) rotateX(${cy}deg) rotateY(${cx}deg) translateY(-4px)`;
      if (Math.abs(tx - cx) > 0.01 || Math.abs(ty - cy) > 0.01) {
        rafId = safeRAF(update);
      } else {
        rafId = null;
      }
    }

    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      tx = x * 10;
      ty = -y * 8;
      card.style.setProperty('--mx', `${(x + 0.5) * 100}%`);
      card.style.setProperty('--my', `${(y + 0.5) * 100}%`);
      if (!rafId) rafId = safeRAF(update);
    });

    card.addEventListener('mouseleave', () => {
      tx = 0; ty = 0;
      if (!rafId) rafId = safeRAF(update);
      card.style.transform = '';
    });
  });
}

/* ========== 导航滚动 ========== */
function initNavScroll() {
  const nav = document.querySelector('.nav');
  if (!nav) return;
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (!ticking) {
      requestAnimationFrame(() => {
        if (window.scrollY > 60) {
          nav.classList.add('scrolled');
        } else {
          nav.classList.remove('scrolled');
        }
        ticking = false;
      });
      ticking = true;
    }
  }, { passive: true });
}

/* ========== 数字计数 ========== */
function initCounter() {
  const counters = document.querySelectorAll('[data-count]');
  if (!counters.length) return;
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const el = entry.target;
        const target = parseFloat(el.dataset.count);
        const duration = 1800;
        const start = performance.now();
        const decimals = (el.dataset.decimals || 0) | 0;
        const suffix = el.dataset.suffix || '';

        function tick(now) {
          const t = Math.min(1, (now - start) / duration);
          // easeOutCubic
          const eased = 1 - Math.pow(1 - t, 3);
          const val = target * eased;
          el.textContent = val.toFixed(decimals) + suffix;
          if (t < 1) safeRAF(tick);
        }
        safeRAF(tick);
        observer.unobserve(el);
      }
    });
  }, { threshold: 0.5 });
  counters.forEach(el => observer.observe(el));
}

/* ========== 打字机效果 ========== */
function Typewriter({ texts, speed = 80, pause = 2000 }) {
  const [text, setText] = useState('');
  const [index, setIndex] = useState(0);
  const [deleting, setDeleting] = useState(false);

  useEffect(() => {
    if (reducedMotion) { setText(texts[0]); return; }
    let timeout;
    const current = texts[index % texts.length];

    if (!deleting && text.length < current.length) {
      timeout = safeSetTimeout(() => {
        setText(current.slice(0, text.length + 1));
      }, speed);
    } else if (!deleting && text.length === current.length) {
      timeout = safeSetTimeout(() => setDeleting(true), pause);
    } else if (deleting && text.length > 0) {
      timeout = safeSetTimeout(() => {
        setText(current.slice(0, text.length - 1));
      }, speed / 2);
    } else if (deleting && text.length === 0) {
      setDeleting(false);
      setIndex(i => i + 1);
    }

    return () => { if (timeout) clearTimeout(timeout); };
  }, [text, deleting, index, texts, speed, pause]);

  return <span className="typewriter">{text}</span>;
}

                  onClick={() => setActiveTab(key)}
                >
                  {label}
                </button>
              ))}
            </div>
          </div>
          <div className="music-list">
            {musicData[activeTab].map((m, i) => {
              const isPlaying = playingId === `${activeTab}-${i}`;
              return (
                <div
                  key={i}
                  className={`music-item reveal ${isPlaying ? 'playing' : ''}`}
                  style={{ transitionDelay: `${i * 0.05}s` }}
                  onClick={() => togglePlay(`${activeTab}-${i}`)}
                >
                  <div className="music-play">
                    {isPlaying ? <Icons.Pause /> : <Icons.Play />}
                  </div>
                  <div className="music-info">
                    <div className="music-name">{m.name}</div>
                    <div className="music-meta">
                      <span>{m.meta}</span>
                    </div>
                  </div>
                  {isPlaying ? (
                    <div className="spectrum-bar">
                      <span></span><span></span><span></span><span></span><span></span>
                    </div>
                  ) : (
                    <div className="music-duration">{m.duration}</div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      </section>

      {/* 预约 */}
      <section className="section reserve-section" id="reserve">
        <div className="reserve-container">
          <div className="reserve-info reveal">
            <div className="section-label">预约品鉴</div>
            <h2>亲赴工坊 · 听琴论道</h2>
            <p>
              欢迎预约造访斫琴录工坊，亲睹斫琴工序，品鉴不同制式之琴音，
              与匠人共话琴道。亦可定制专属之琴，从选材、制式到髹漆成色，
              皆可依君所好。一张好琴，是一生的知己。
            </p>
            <div className="reserve-features">
              <div className="reserve-feature">
                <div className="reserve-feature-icon"><Icons.Leaf /></div>
                <span>工坊参观，亲见斫琴全过程</span>
              </div>
              <div className="reserve-feature">
                <div className="reserve-feature-icon"><Icons.Tea /></div>
                <span>品茗听琴，多制式音色对比</span>
              </div>
              <div className="reserve-feature">
                <div className="reserve-feature-icon"><Icons.Compass /></div>
                <span>定制专属，一琴一故事</span>
              </div>
            </div>
          </div>
          <div className="reserve-form reveal">
            {formSubmitted ? (
              <div className="form-success">
                <div className="form-success-icon"><Icons.Check /></div>
                <h3>预约成功</h3>
                <p>我们已收到您的预约申请<br/>将在一个工作日内与您联系<br/>静候佳音，共赴琴约</p>
              </div>
            ) : (
              <form onSubmit={handleSubmit}>
                <div className="form-title">预约品鉴</div>
                <div className="form-row">
                  <label className="form-label">您的姓名</label>
                  <input type="text" className="form-input" name="name"
                    value={formData.name} onChange={handleInputChange}
                    placeholder="请输入您的姓名" />
                </div>
                <div className="form-row">
                  <label className="form-label">联系电话</label>
                  <input type="tel" className="form-input" name="phone"
                    value={formData.phone} onChange={handleInputChange}
                    placeholder="请输入您的联系方式" />
                </div>
                <div className="form-row">
                  <label className="form-label">感兴趣的琴制</label>
                  <select className="form-select" name="style"
                    value={formData.style} onChange={handleInputChange}>
                    <option value="">请选择琴制</option>
                    <option value="伏羲式">伏羲式</option>
                    <option value="仲尼式">仲尼式</option>
                    <option value="蕉叶式">蕉叶式</option>
                    <option value="其他">其他 / 定制</option>
                  </select>
                </div>
                <div className="form-row">
                  <label className="form-label">留言（选填）</label>
                  <textarea className="form-textarea" name="message"
                    value={formData.message} onChange={handleInputChange}
                    placeholder="请描述您的需求或疑问..." />
                </div>
                <button type="submit" className="form-submit">提交预约</button>
              </form>
            )}
          </div>
        </div>
      </section>

      {/* Footer */}
      <footer className="footer">
        <div className="footer-content">
          <div className="footer-brand">
            <div className="nav-logo">
              <div className="nav-logo-seal">斫</div>
              <span>斫琴录</span>

            <p>
              传承古法斫琴技艺，以百道工序、百遍大漆，<br/>

            </p>
          </div>
          <div className="footer-col">
            <h4>琴制</h4>
            <ul>
              <li><a href="#styles">伏羲式</a></li>
              <li><a href="#styles">仲尼式</a></li>
              <li><a href="#styles">蕉叶式</a></li>
              <li><a href="#styles">定制琴制</a></li>
            </ul>
          </div>
          <div className="footer-col">
            <h4>了解</h4>
            <ul>
              <li><a href="#process">斫琴工序</a></li>
              <li><a href="#master">匠人故事</a></li>
              <li><a href="#music">琴曲欣赏</a></li>
              <li><a href="#reserve">预约品鉴</a></li>
            </ul>
          </div>
          <div className="footer-col">
            <h4>联系</h4>
            <ul>
              <li>苏州 · 平江路</li>

              <li>zhuoqinlu@guqin.cn</li>

          </div>
        </div>
        <div className="footer-bottom">
          <span>© 2026 斫琴录 Zhuoqinlu · 古法斫琴传承工坊</span>
          <span>苏ICP备2026000000号</span>
        </div>
      </footer>
    </>
  );
}

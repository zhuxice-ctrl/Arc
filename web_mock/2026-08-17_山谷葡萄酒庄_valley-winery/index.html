<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>山谷葡萄酒庄 · 木桶与藤蔓</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" />
  <style>
    /* ========== 基础重置与变量 ========== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Noto Sans SC", "PingFang SC", sans-serif;
      background: var(--parchment);
      color: var(--ink);
      overflow-x: hidden;
      cursor: none;
      -webkit-font-smoothing: antialiased;
    }
    @media (max-width: 768px) { body { cursor: auto; } }
    :root {
      --burgundy: #5C1A24;
      --burgundy-dark: #3E0F17;
      --burgundy-light: #7A2632;
      --vine: #3E5C3A;
      --vine-light: #5A7A56;
      --vine-dark: #2A4028;
      --oak: #C89B5A;
      --oak-light: #E0B87A;
      --oak-dark: #A67D42;
      --parchment: #F5EDDC;
      --parchment-dark: #E8DDC5;
      --ink: #2A1A12;
      --ink-soft: #5A4A3A;
    }
    .serif { font-family: "Noto Serif SC", "Songti SC", serif; }
    a, button { cursor: none; color: inherit; text-decoration: none; }
    @media (max-width: 768px) { a, button { cursor: pointer; } }
    img { display: block; max-width: 100%; }
    button { border: none; background: none; font-family: inherit; }

    /* ========== 自定义光标 ========== */
    .cursor-outer {
      position: fixed;
      top: 50%; left: 50%;
      width: 36px; height: 36px;
      border: 2px solid var(--burgundy);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 9999;
      transition: width 0.25s cubic-bezier(.25,1.5,.5,1),
                  height 0.25s cubic-bezier(.25,1.5,.5,1),
                  border-color 0.3s,
                  background 0.3s;
      mix-blend-mode: difference;
      box-shadow: 0 0 12px rgba(92,26,36,0.3);
    }
    .cursor-inner {
      position: fixed;
      top: 50%; left: 50%;
      width: 6px; height: 6px;
      background: var(--oak);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10000;
      transition: transform 0.15s ease-out, background 0.3s;
      box-shadow: 0 0 8px var(--oak), 0 0 16px rgba(200,155,90,0.6);
    }
    .cursor-glow {
      position: fixed;
      top: 50%; left: 50%;
      width: 80px; height: 80px;
      background: radial-gradient(circle, rgba(200,155,90,0.15) 0%, transparent 70%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 9998;
      transition: transform 0.35s cubic-bezier(.25,.8,.3,1), opacity 0.3s;
    }
    .cursor-outer.hover { width: 60px; height: 60px; border-color: var(--oak); background: rgba(200,155,90,0.1); }
    .cursor-outer.click { transform: translate(-50%, -50%) scale(0.7); }
    .cursor-inner.hover { transform: translate(-50%, -50%) scale(1.8); background: var(--burgundy); }
    @media (max-width: 768px) { .cursor-outer, .cursor-inner, .cursor-glow { display: none; } }

    /* 涟漪 */
    .ripple {
      position: fixed;
      border: 2px solid var(--oak);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9997;
      animation: ripple-expand 0.8s cubic-bezier(.2,.8,.2,1) forwards;
    }
    @keyframes ripple-expand {
      0% { width: 0; height: 0; opacity: 1; }
      100% { width: 120px; height: 120px; opacity: 0; margin-left: -60px; margin-top: -60px; }
    }

    /* ========== 浮尘粒子 ========== */
    .dust-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.4;
    }

    /* ========== 导航 ========== */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 20px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.4s, backdrop-filter 0.4s, padding 0.4s;
    }
    .nav.scrolled {
      background: rgba(245,237,220,0.85);
      backdrop-filter: blur(12px);
      padding: 14px 48px;
      border-bottom: 1px solid rgba(92,26,36,0.1);
    }
    .nav-logo {
      font-family: "Noto Serif SC", serif;
      font-weight: 700;
      font-size: 22px;
      color: var(--burgundy);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-logo-mark {
      width: 32px; height: 32px;
      position: relative;
    }
    .nav-links {
      display: flex;
      gap: 36px;
      list-style: none;
    }
    .nav-links a {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-soft);
      position: relative;
      padding: 4px 0;
      transition: color 0.3s;
    }
    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0; bottom: 0;
      width: 0; height: 1px;
      background: var(--burgundy);
      transition: width 0.3s cubic-bezier(.6,.2,.1,1);
    }
    .nav-links a:hover { color: var(--burgundy); }
    .nav-links a:hover::after { width: 100%; }
    .nav-cta {
      padding: 10px 22px;
      background: var(--burgundy);
      color: var(--parchment) !important;
      font-size: 13px;
      font-weight: 500;
      border-radius: 2px;
      transition: background 0.3s, transform 0.2s;
    }
    .nav-cta:hover { background: var(--burgundy-light); }
    .hamburger { display: none; }
    @media (max-width: 768px) {
      .nav { padding: 16px 20px; }
      .nav.scrolled { padding: 12px 20px; }
      .nav-links { display: none; }
      .nav-cta { display: none; }
      .hamburger { display: block; }
    }

    /* ========== Hero ========== */
    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(200,155,90,0.2) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(92,26,36,0.15) 0%, transparent 50%),
        linear-gradient(180deg, var(--parchment) 0%, var(--parchment-dark) 100%);
    }
    .hero-bg-img {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .hero-bg-img svg { width: 100%; height: 100%; }
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 0 24px;
      max-width: 900px;
    }
    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      letter-spacing: 0.3em;
      color: var(--vine);
      text-transform: uppercase;
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeDown 1s 0.3s ease-out forwards;
    }
    .hero-eyebrow::before,
    .hero-eyebrow::after {
      content: "";
      width: 40px; height: 1px;
      background: var(--oak);
    }
    .hero-title {
      font-family: "Noto Serif SC", serif;
      font-size: clamp(42px, 7vw, 96px);
      font-weight: 900;
      line-height: 1.1;
      color: var(--burgundy);
      margin-bottom: 24px;
      letter-spacing: 0.05em;
    }
    .hero-title-line {
      display: block;
      overflow: hidden;
    }
    .hero-title-line span {
      display: inline-block;
      opacity: 0;
      transform: translateY(100%);
      animation: slideUp 1s cubic-bezier(.2,.8,.2,1) forwards;
    }
    .hero-title-line:nth-child(1) span { animation-delay: 0.4s; }
    .hero-title-line:nth-child(2) span { animation-delay: 0.55s; }
    .hero-subtitle {
      font-size: clamp(14px, 1.6vw, 18px);
      color: var(--ink-soft);
      line-height: 1.8;
      margin-bottom: 48px;
      max-width: 560px;
      margin-left: auto;
      margin-right: auto;
      opacity: 0;
      animation: fadeUp 1s 0.8s ease-out forwards;
    }
    .hero-ctas {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeUp 1s 1s ease-out forwards;
    }
    .btn-primary {
      padding: 16px 36px;
      background: var(--burgundy);
      color: var(--parchment);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.1em;
      border-radius: 2px;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(.25,1.5,.5,1), box-shadow 0.3s;
      box-shadow: 0 4px 20px rgba(92,26,36,0.3);
    }
    .btn-primary::before {
      content: "";
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.6s;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(92,26,36,0.4); }
    .btn-primary:hover::before { left: 150%; }
    .btn-secondary {
      padding: 16px 36px;
      border: 1px solid var(--burgundy);
      color: var(--burgundy);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.1em;
      border-radius: 2px;
      transition: background 0.3s, color 0.3s, transform 0.2s;
    }
    .btn-secondary:hover { background: var(--burgundy); color: var(--parchment); }

    .hero-scroll-hint {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--ink-soft);
      font-size: 12px;
      letter-spacing: 0.2em;
      opacity: 0;
      animation: fadeUp 1s 1.5s ease-out forwards;
    }
    .hero-scroll-line {
      width: 1px; height: 48px;
      background: linear-gradient(180deg, var(--burgundy), transparent);
      position: relative;
      overflow: hidden;
    }
    .hero-scroll-line::after {
      content: "";
      position: absolute;
      top: -50%;
      left: 0;
      width: 100%; height: 50%;
      background: var(--oak);
      animation: scrollDown 2s ease-in-out infinite;
    }
    @keyframes scrollDown {
      0% { top: -50%; }
      100% { top: 100%; }
    }

    /* ========== 通用区块 ========== */
    .section {
      padding: 120px 48px;
      position: relative;
    }
    .section-inner {
      max-width: 1280px;
      margin: 0 auto;
    }
    .section-head {
      margin-bottom: 64px;
    }
    .section-eyebrow {
      font-size: 13px;
      letter-spacing: 0.3em;
      color: var(--oak-dark);
      margin-bottom: 16px;
      font-weight: 500;
    }
    .section-title {
      font-family: "Noto Serif SC", serif;
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 700;
      color: var(--burgundy);
      line-height: 1.3;
    }
    .section-desc {
      color: var(--ink-soft);
      font-size: 15px;
      line-height: 1.9;
      max-width: 600px;
      margin-top: 16px;
    }
    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.8s cubic-bezier(.2,.8,.2,1), transform 0.8s cubic-bezier(.2,.8,.2,1);
    }
    .reveal.in { opacity: 1; transform: translateY(0); }
    .reveal-stagger > * {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.7s cubic-bezier(.2,.8,.2,1), transform 0.7s cubic-bezier(.2,.8,.2,1);
    }
    .reveal-stagger.in > *:nth-child(1) { transition-delay: 0.05s; }
    .reveal-stagger.in > *:nth-child(2) { transition-delay: 0.15s; }
    .reveal-stagger.in > *:nth-child(3) { transition-delay: 0.25s; }
    .reveal-stagger.in > *:nth-child(4) { transition-delay: 0.35s; }
    .reveal-stagger.in > *:nth-child(5) { transition-delay: 0.45s; }
    .reveal-stagger.in > *:nth-child(6) { transition-delay: 0.55s; }
    .reveal-stagger.in > * { opacity: 1; transform: translateY(0); }

    @media (max-width: 768px) {
      .section { padding: 80px 20px; }
    }

    /* ========== 酒庄故事 ========== */
    .story {
      background: var(--parchment);
    }
    .story-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: center;
    }
    .story-visual {
      position: relative;
      aspect-ratio: 4/5;
      overflow: hidden;
      border-radius: 2px;
    }
    .story-visual-inner {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--vine-dark) 0%, var(--vine) 50%, var(--oak-dark) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .story-visual-decor {
      position: absolute;
      top: 24px; left: 24px; right: 24px; bottom: 24px;
      border: 1px solid rgba(200,155,90,0.4);
      pointer-events: none;
    }
    .story-text p {
      color: var(--ink-soft);
      line-height: 2;
      font-size: 15px;
      margin-bottom: 20px;
    }
    .story-text p:first-of-type::first-letter {
      font-family: "Noto Serif SC", serif;
      font-size: 64px;
      font-weight: 700;
      color: var(--burgundy);
      float: left;
      line-height: 1;
      padding-right: 12px;
      padding-top: 8px;
    }
    .story-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid rgba(92,26,36,0.15);
    }
    .stat-number {
      font-family: "Noto Serif SC", serif;
      font-size: 42px;
      font-weight: 700;
      color: var(--burgundy);
      line-height: 1;
      margin-bottom: 8px;
    }
    .stat-number .unit {
      font-size: 18px;
      font-weight: 500;
      color: var(--oak-dark);
      margin-left: 4px;
    }
    .stat-label {
      font-size: 13px;
      color: var(--ink-soft);
      letter-spacing: 0.1em;
    }
    @media (max-width: 768px) {
      .story-grid { grid-template-columns: 1fr; gap: 40px; }
      .story-stats { grid-template-columns: repeat(3, 1fr); gap: 16px; }
      .stat-number { font-size: 28px; }
    }

    /* ========== 葡萄园风土 ========== */
    .terroir {
      background: var(--vine-dark);
      color: var(--parchment);
      position: relative;
      overflow: hidden;
    }
    .terroir::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--oak), transparent);
    }
    .terroir .section-title { color: var(--parchment); }
    .terroir .section-desc { color: rgba(245,237,220,0.7); }
    .terroir .section-eyebrow { color: var(--oak-light); }
    .terroir-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
    }
    .terroir-card {
      padding: 40px 32px;
      background: rgba(245,237,220,0.05);
      border: 1px solid rgba(200,155,90,0.2);
      border-radius: 2px;
      position: relative;
      transition: transform 0.4s cubic-bezier(.2,.8,.2,1), border-color 0.3s, background 0.3s;
      transform-style: preserve-3d;
      perspective: 1000px;
    }
    .terroir-card:hover {
      transform: translateY(-8px);
      border-color: var(--oak);
      background: rgba(245,237,220,0.08);
    }
    .terroir-card-icon {
      width: 56px; height: 56px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--oak);
    }
    .terroir-card-title {
      font-family: "Noto Serif SC", serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--parchment);
      margin-bottom: 14px;
    }
    .terroir-card-desc {
      font-size: 14px;
      line-height: 1.9;
      color: rgba(245,237,220,0.65);
    }
    .terroir-card-num {
      position: absolute;
      top: 24px; right: 24px;
      font-family: "Noto Serif SC", serif;
      font-size: 64px;
      font-weight: 700;
      color: rgba(200,155,90,0.08);
      line-height: 1;
    }
    @media (max-width: 768px) {
      .terroir-grid { grid-template-columns: 1fr; }
    }

    /* ========== 酒款典藏 ========== */
    .wines {
      background: var(--parchment);
    }
    .wines-filter {
      display: flex;
      gap: 12px;
      margin-bottom: 48px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 10px 24px;
      border: 1px solid rgba(92,26,36,0.2);
      color: var(--ink-soft);
      font-size: 14px;
      border-radius: 99px;
      transition: all 0.3s;
      background: transparent;
    }
    .filter-btn:hover { border-color: var(--burgundy); color: var(--burgundy); }
    .filter-btn.active {
      background: var(--burgundy);
      color: var(--parchment);
      border-color: var(--burgundy);
    }
    .wines-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
    }
    .wine-card {
      background: var(--parchment-dark);
      border-radius: 2px;
      overflow: hidden;
      transition: transform 0.4s cubic-bezier(.2,.8,.2,1), box-shadow 0.4s;
      position: relative;
      transform-style: preserve-3d;
      perspective: 800px;
    }
    .wine-card:hover {
      transform: translateY(-12px);
      box-shadow: 0 20px 60px rgba(92,26,36,0.15);
    }
    .wine-bottle-wrap {
      height: 320px;
      background: linear-gradient(180deg, var(--parchment-dark) 0%, var(--oak-dark) 30%, var(--burgundy-dark) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .wine-bottle-wrap::before {
      content: "";
      position: absolute;
      top: 0; left: -50%;
      width: 30%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transform: skewX(-15deg);
      transition: left 0.8s ease;
    }
    .wine-card:hover .wine-bottle-wrap::before { left: 150%; }
    .wine-bottle {
      width: 80px; height: 240px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.3s ease-out;
      z-index: 2;
    }
    .wine-info {
      padding: 24px 28px 28px;
    }
    .wine-vintage {
      font-size: 12px;
      color: var(--oak-dark);
      letter-spacing: 0.2em;
      margin-bottom: 8px;
    }
    .wine-name {
      font-family: "Noto Serif SC", serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--burgundy);
      margin-bottom: 8px;
    }
    .wine-varietal {
      font-size: 13px;
      color: var(--ink-soft);
      margin-bottom: 16px;
    }
    .wine-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid rgba(92,26,36,0.1);
    }
    .wine-price {
      font-family: "Noto Serif SC", serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--burgundy);
    }
    .wine-detail-btn {
      font-size: 13px;
      color: var(--oak-dark);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.3s, gap 0.3s;
    }
    .wine-card:hover .wine-detail-btn { color: var(--burgundy); gap: 12px; }
    @media (max-width: 768px) {
      .wines-grid { grid-template-columns: 1fr; }
    }

    /* ========== 工艺传承 ========== */
    .craft {
      background:
        radial-gradient(ellipse at top, rgba(200,155,90,0.1) 0%, transparent 60%),
        var(--parchment-dark);
      position: relative;
    }
    .craft-timeline {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      position: relative;
    }
    .craft-timeline::before {
      content: "";
      position: absolute;
      top: 32px;
      left: 5%;
      right: 5%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--oak-dark), var(--oak-dark), transparent);
      z-index: 0;
    }
    .craft-step {
      text-align: center;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }
    .craft-step-dot {
      width: 16px; height: 16px;
      background: var(--parchment);
      border: 2px solid var(--burgundy);
      border-radius: 50%;
      margin: 24px auto 32px;
      position: relative;
      transition: transform 0.3s, background 0.3s;
    }
    .craft-step:hover .craft-step-dot {
      transform: scale(1.4);
      background: var(--burgundy);
      box-shadow: 0 0 0 8px rgba(92,26,36,0.15);
    }
    .craft-step-num {
      font-family: "Noto Serif SC", serif;
      font-size: 14px;
      color: var(--oak-dark);
      letter-spacing: 0.2em;
      margin-bottom: 12px;
    }
    .craft-step-title {
      font-family: "Noto Serif SC", serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--burgundy);
      margin-bottom: 10px;
    }
    .craft-step-desc {
      font-size: 13px;
      line-height: 1.8;

    /* ========== 模态窗 ========== */

    /* reduced motion */
    @media (prefers-reduced-motion: reduce) {

  </style>
</head>
<body>

<div id="root"></div>

<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ===== 全局动画控制器 ===== */
const rafIds = new Set();
const timers = new Set();
function safeRAF(cb) {
  let id;
  const wrapped = (t) => {
    rafIds.delete(id);
    cb(t);
  };
  id = requestAnimationFrame(wrapped);
  rafIds.add(id);
  return id;
}
function safeTimeout(cb, ms) {
  const id = setTimeout(() => {
    timers.delete(id);
    cb();
  }, ms);
  timers.add(id);
  return id;
}
function cancelAllTimers() {
  rafIds.forEach(id => cancelAnimationFrame(id));
  rafIds.clear();
  timers.forEach(id => clearTimeout(id));
  timers.clear();
}

// 页面可见性暂停动画循环
let paused = false;
document.addEventListener('visibilitychange', () => {
  paused = document.hidden;
  if (paused) {
    rafIds.forEach(id => cancelAnimationFrame(id));
    rafIds.clear();
  }
});

/* ===== 自定义光标 ===== */
function CustomCursor() {
  const outerRef = useRef(null);
  const innerRef = useRef(null);
  const glowRef = useRef(null);
  const pos = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const target = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const glowPos = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const rafRef = useRef(null);
  const reducedMotion = useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  useEffect(() => {
    if (reducedMotion.current) return;
    const onMove = (e) => {
      target.current.x = e.clientX;
      target.current.y = e.clientY;
    };
    const loop = () => {
      if (paused) { rafRef.current = safeRAF(loop); return; }
      // 内点快速跟随
      pos.current.x += (target.current.x - pos.current.x) * 0.25;
      pos.current.y += (target.current.y - pos.current.y) * 0.25;
      // 外环带惯性阻尼
      glowPos.current.x += (target.current.x - glowPos.current.x) * 0.08;
      glowPos.current.y += (target.current.y - glowPos.current.y) * 0.08;

      if (innerRef.current) {
        innerRef.current.style.left = pos.current.x + 'px';
        innerRef.current.style.top = pos.current.y + 'px';
      }
      if (outerRef.current) {
        outerRef.current.style.left = pos.current.x + 'px';
        outerRef.current.style.top = pos.current.y + 'px';
      }
      if (glowRef.current) {
        glowRef.current.style.left = glowPos.current.x + 'px';
        glowRef.current.style.top = glowPos.current.y + 'px';
      }
      rafRef.current = safeRAF(loop);
    };
    rafRef.current = safeRAF(loop);
    window.addEventListener('mousemove', onMove);

    // 悬停可交互元素
    const interactive = 'a, button, .wine-card, .terroir-card, .craft-step, .filter-btn, .reserve-info-item, .form-input, .form-select, .form-textarea';
    const onOver = (e) => {
      if (e.target.closest(interactive)) {
        outerRef.current?.classList.add('hover');
        innerRef.current?.classList.add('hover');
      }
    };
    const onOut = (e) => {
      if (e.target.closest(interactive)) {
        outerRef.current?.classList.remove('hover');
        innerRef.current?.classList.remove('hover');
      }
    };
    const onClick = (e) => {
      if (outerRef.current) {
        outerRef.current.classList.add('click');
        safeTimeout(() => outerRef.current?.classList.remove('click'), 200);
      }
      // 涟漪
      const r = document.createElement('div');
      r.className = 'ripple';
      r.style.left = e.clientX + 'px';
      r.style.top = e.clientY + 'px';
      document.body.appendChild(r);
      safeTimeout(() => r.remove(), 800);
    };
    document.addEventListener('mouseover', onOver);
    document.addEventListener('mouseout', onOut);
    document.addEventListener('click', onClick);

    return () => {
      window.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseover', onOver);
      document.removeEventListener('mouseout', onOut);
      document.removeEventListener('click', onClick);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, []);

  if (reducedMotion.current) return null;
  return (
    <>
      <div ref={glowRef} className="cursor-glow" />
      <div ref={outerRef} className="cursor-outer" />
      <div ref={innerRef} className="cursor-inner" />
    </>
  );
}

/* ===== 浮尘粒子 ===== */
function DustParticles() {
  const canvasRef = useRef(null);
  const reducedMotion = useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  useEffect(() => {
    if (reducedMotion.current) return;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    let w, h;
    const resize = () => {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    };
    resize();
    window.addEventListener('resize', resize);

    const particles = [];
    const count = 40;
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 2 + 0.5,
        vx: (Math.random() - 0.5) * 0.3,
        vy: -Math.random() * 0.5 - 0.1,
        o: Math.random() * 0.5 + 0.2,
        s: Math.random() * 0.02 + 0.01,
        a: Math.random() * Math.PI * 2
      });
    }
    let rafId;
    const draw = () => {
      if (paused) { rafId = safeRAF(draw); return; }
      ctx.clearRect(0, 0, w, h);
      particles.forEach(p => {
        p.a += p.s;
        p.x += p.vx + Math.sin(p.a) * 0.2;
        p.y += p.vy;
        if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
        if (p.x < -10) p.x = w + 10;
        if (p.x > w + 10) p.x = -10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200,155,90,${p.o})`;
        ctx.fill();
      });
      rafId = safeRAF(draw);
    };
    rafId = safeRAF(draw);

    return () => {
      window.removeEventListener('resize', resize);
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, []);

  if (reducedMotion.current) return null;
  return <canvas ref={canvasRef} className="dust-canvas" />;
}

/* ===== 打字机 ===== */
function Typewriter({ text, speed = 120, delay = 500, className }) {
  const [display, setDisplay] = useState('');
  const [done, setDone] = useState(false);
  const idxRef = useRef(0);
  const timerRef = useRef(null);

  useEffect(() => {
    idxRef.current = 0;
    setDisplay('');
    setDone(false);
    const start = safeTimeout(() => {
      const type = () => {
        if (idxRef.current < text.length) {
          setDisplay(text.slice(0, idxRef.current + 1));
          idxRef.current++;
          timerRef.current = safeTimeout(type, speed + Math.random() * 60);
        } else {
          setDone(true);
        }
      };
      type();
    }, delay);
    timerRef.current = start;
    return () => { if (timerRef.current) clearTimeout(timerRef.current); };
  }, [text, speed, delay]);

  return (
    <span className={className}>
      {display}
      {!done && <span className="typewriter-cursor" />}
    </span>
  );
}

/* ===== 数字计数 ===== */
function CountUp({ end, duration = 2000, suffix = '', prefix = '' }) {
  const [val, setVal] = useState(0);
  const ref = useRef(null);
  const started = useRef(false);
  const startTime = useRef(0);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !started.current) {
          started.current = true;
          startTime.current = performance.now();
          const step = (now) => {
            const p = Math.min((now - startTime.current) / duration, 1);
            // easeOutCubic
            const eased = 1 - Math.pow(1 - p, 3);
            setVal(Math.floor(eased * end));
            if (p < 1) safeRAF(step);
          };
          safeRAF(step);
        }
      });
    }, { threshold: 0.3 });
    obs.observe(el);
    return () => obs.disconnect();
  }, [end, duration]);

  return (
    <span ref={ref}>{prefix}{val}{suffix}</span>
  );
}

/* ===== 滚动渐入观察者 ===== */
function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal, .reveal-stagger');
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in');
          obs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    els.forEach(el => obs.observe(el));
    return () => obs.disconnect();
  }, []);
}

/* ===== 3D 倾斜卡片 Hook（直接操作 DOM，不走 state） ===== */
function useTilt(selector, strength = 15) {
  useEffect(() => {
    const cards = document.querySelectorAll(selector);
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reducedMotion) return;

    const onMove = (e) => {
      const card = e.currentTarget;
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      const rx = (y - cy) / cy * -strength;
      const ry = (x - cx) / cx * strength;
      card.style.transform = `perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-8px)`;
      card.style.transition = 'transform 0.1s ease-out';
    };
    const onLeave = (e) => {
      const card = e.currentTarget;
      card.style.transform = '';
      card.style.transition = 'transform 0.6s cubic-bezier(.2,.8,.2,1)';
    };
    cards.forEach(card => {
      card.addEventListener('mousemove', onMove);
      card.addEventListener('mouseleave', onLeave);
    });
    return () => {
      cards.forEach(card => {
        card.removeEventListener('mousemove', onMove);
        card.removeEventListener('mouseleave', onLeave);
      });
    };
  }, [selector, strength]);
}

/* ===== 视差 Hook ===== */
function useParallax(selector, speed = 0.3) {
  useEffect(() => {
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reducedMotion) return;
    const els = document.querySelectorAll(selector);
    let ticking = false;
    const onScroll = () => {
      if (!ticking) {
        safeRAF(() => {
          els.forEach(el => {
            const rect = el.getBoundingClientRect();
            if (rect.top < window.innerHeight && rect.bottom > 0) {
              const offset = (window.innerHeight - rect.top) / window.innerHeight - 0.5;
              el.style.transform = `translateY(${offset * speed * 60}px)`;
            }
          });
          ticking = false;
        });
        ticking = true;
      }
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, [selector, speed]);
}

/* ===== 磁性按钮 ===== */
function MagneticButton({ children, className, onClick, strength = 0.4 }) {
  const ref = useRef(null);
  useEffect(() => {
    const btn = ref.current;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!btn || reducedMotion) return;

    const onMove = (e) => {
      const rect = btn.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const maxDist = Math.max(rect.width, rect.height) * 0.8;
      if (dist < maxDist) {
        btn.style.transform = `translate(${dx * strength}px, ${dy * strength}px)`;
      }
    };
    const onLeave = () => {
      btn.style.transform = '';
      btn.style.transition = 'transform 0.5s cubic-bezier(.25,1.5,.5,1)';
      safeTimeout(() => { if (btn) btn.style.transition = ''; }, 500);
    };
    btn.addEventListener('mousemove', onMove);
    btn.addEventListener('mouseleave', onLeave);
    return () => {
      btn.removeEventListener('mousemove', onMove);
      btn.removeEventListener('mouseleave', onLeave);
    };
  }, [strength]);

  return (
    <button ref={ref} className={className} onClick={onClick} style={{ transition: 'transform 0.1s ease-out' }}>
      {children}
    </button>
  );
}

/* ===== 酒款详情模态窗 ===== */
function WineModal({ wine, onClose }) {
  const open = !!wine;
  useEffect(() => {
    if (open) {
      document.body.style.overflow = 'hidden';
    } else {
      document.body.style.overflow = '';
    }
    return () => { document.body.style.overflow = ''; };
  }, [open]);

  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    if (open) document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [open, onClose]);

  if (!wine) return null;

  return (
    <div className={`modal-backdrop ${open ? 'open' : ''}`} onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <button className="modal-close" onClick={onClose} aria-label="关闭">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <path d="M6 6l12 12M6 18L18 6"/>
          </svg>
        </button>
        <div className="modal-header">
          <div className="modal-vintage">{wine.vintage} VINTAGE</div>
          <div className="modal-name">{wine.name}</div>
          <div className="modal-varietal">{wine.varietal}</div>
        </div>
        <div className="modal-body">
          <p>{wine.desc}</p>
          <p>这款酒是山谷风土的典型表达。酿酒师在最佳采收期手工采摘，经严格粒选后进入发酵工序，随后转入法国橡木桶缓慢陈酿。装瓶后继续在瓶中熟成，直至达到最佳状态才与爱酒人见面。</p>
          <div className="modal-specs">
            {Object.entries(wine.specs).map(([k, v]) => (
              <div key={k}>
                <div className="modal-spec-label">{k}</div>
                <div className="modal-spec-value">{v}</div>
              </div>
            ))}
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn-primary" style={{ flex: 1 }} onClick={onClose}>
            立即预约品鉴
          </button>
          <button className="btn-secondary" onClick={onClose}>关闭</button>
        </div>
      </div>
    </div>
  );
}

/* ===== 主应用 ===== */
function App() {
  const [activeWine, setActiveWine] = useState(null);

  useReveal();
  useTilt('.wine-card', 10);
  useTilt('.terroir-card', 8);
  useParallax('.story-visual', 0.2);

  useEffect(() => {
    // 升级为全栈应用宣告
    const announce = () => {
      window.parent?.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    };
    announce();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announce, { once: true });
    }
    return () => {
      // 清理所有定时器
      cancelAllTimers();
    };
  }, []);

  return (
    <>
      <CustomCursor />
      <DustParticles />
      <Navbar />
      <main>
        <Hero />
        <Story />
        <Terroir />
        <Wines onWineClick={setActiveWine} />
        <Craft />
        <Reserve />
      </main>
      <Footer />
      <WineModal wine={activeWine} onClose={() => setActiveWine(null)} />
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

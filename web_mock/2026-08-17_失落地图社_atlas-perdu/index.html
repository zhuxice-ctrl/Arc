<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atlas Perdu · 失落地图社</title>
<meta name="creative-medium" content="interactive-prototype" />
<meta name="description" content="Atlas Perdu — 失落地图社，古董制图与探险地图收藏品牌。收罗散佚的大航海时代海图、铜版印刷的内陆勘测图、探险家的手绘草图与测绘笔记。" />
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IM+Fell+English:ital@0;1&display=swap" />

<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<style>
:root {
  --parchment: #E8DCC3;
  --parchment-dark: #D9CCAE;
  --parchment-light: #F1E8D3;
  --ink: #3B2A1E;
  --ink-soft: #5a4332;
  --ink-faint: #8c755e;
  --rust: #A8402F;
  --rust-dark: #7d2e21;
  --patina: #5F7A61;
  --patina-dark: #455a47;
  --gold: #C19A49;
  --gold-light: #D9B56A;
  --gold-dark: #9c7a32;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--parchment);
  color: var(--ink);
  font-family: 'Lora', Georgia, serif;
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
  cursor: none;
}

@media (max-width: 900px) {
  html, body { cursor: auto; }
}

::selection { background: var(--rust); color: var(--parchment); }

/* Parchment texture overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(168, 64, 47, 0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(95, 122, 97, 0.05) 0%, transparent 50%),
    url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix type='matrix' values='0 0 0 0 0.23 0 0 0 0 0.16 0 0 0 0 0.12 0 0 0 0.08 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  mix-blend-mode: multiply;
  opacity: 0.6;
}

/* Page plate border */
body::after {
  content: '';
  position: fixed;
  inset: 14px;
  border: 1px solid var(--gold);
  pointer-events: none;
  z-index: 100;
  box-shadow:
    inset 0 0 0 4px var(--parchment),
    inset 0 0 0 5px var(--gold-dark);
  opacity: 0.55;
}

@media (max-width: 600px) {
  body::after { inset: 6px; }
}

/* Custom cursor */
.cursor-outer {
  position: fixed;
  width: 36px;
  height: 36px;
  border: 2px solid #fff;
  border-radius: 50%;
  pointer-events: none;
  z-index: 99999;
  transform: translate(-50%, -50%);
  transition: width 0.25s cubic-bezier(.2,.8,.2,1), height 0.25s cubic-bezier(.2,.8,.2,1),
              border-color 0.25s, opacity 0.2s;
  mix-blend-mode: difference;
  box-shadow:
    0 0 12px rgba(193, 154, 73, 0.6),
    0 0 24px rgba(168, 64, 47, 0.3);
  will-change: transform, width, height;
}
.cursor-outer.hover {
  width: 64px;
  height: 64px;
  border-color: var(--gold-light);
  box-shadow:
    0 0 20px rgba(193, 154, 73, 0.8),
    0 0 40px rgba(168, 64, 47, 0.4);
}
.cursor-outer.clicking {
  width: 20px;
  height: 20px;
  border-color: var(--rust);
}
.cursor-inner {
  position: fixed;
  width: 6px;
  height: 6px;
  background: var(--rust);
  border-radius: 50%;
  pointer-events: none;
  z-index: 99999;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 8px var(--rust), 0 0 16px var(--gold);
  transition: background 0.2s, transform 0.1s;
}
.cursor-inner.hover {
  background: var(--gold-light);
  box-shadow: 0 0 10px var(--gold-light), 0 0 20px var(--rust);
}

/* Cursor ripple */
.cursor-ripple {
  position: fixed;
  border: 2px solid var(--gold);
  border-radius: 50%;
  pointer-events: none;
  z-index: 99998;
  transform: translate(-50%, -50%) scale(0);
  opacity: 0.7;
  animation: rippleOut 0.7s ease-out forwards;
}
@keyframes rippleOut {
  0% { width: 0; height: 0; opacity: 0.8; border-width: 3px; }
  100% { width: 120px; height: 120px; opacity: 0; border-width: 1px; }
}

@media (max-width: 900px) {
  .cursor-outer, .cursor-inner, .cursor-ripple { display: none; }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

.app {
  position: relative;
  z-index: 2;
}

/* ===== NAV ===== */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 50;
  padding: 22px 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(to bottom, rgba(232, 220, 195, 0.95), rgba(232, 220, 195, 0.7) 80%, transparent);
  backdrop-filter: blur(4px);
}
.nav.scrolled {
  background: rgba(232, 220, 195, 0.97);
  box-shadow: 0 1px 0 rgba(193, 154, 73, 0.3);
}
.nav-brand {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav-brand em {
  font-style: italic;
  font-weight: 400;
  color: var(--rust);
}
.nav-mark {
  width: 28px;
  height: 28px;
  border: 1.5px solid var(--gold-dark);
  border-radius: 50%;
  position: relative;
  display: inline-block;
}
.nav-mark::before, .nav-mark::after {
  content: '';
  position: absolute;
  background: var(--rust);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
}
.nav-mark::before { width: 1px; height: 20px; }
.nav-mark::after { width: 20px; height: 1px; }
.nav-links {
  display: flex;
  gap: 36px;
  list-style: none;
}
.nav-links a {
  font-family: 'IM Fell English', serif;
  font-size: 14px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-soft);
  text-decoration: none;
  position: relative;
  padding: 4px 0;
  transition: color 0.3s;
}
.nav-links a::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0;
  width: 0;
  height: 1px;
  background: var(--rust);
  transition: width 0.3s ease;
}
.nav-links a:hover { color: var(--rust); }
.nav-links a:hover::after { width: 100%; }

.nav-cta {
  font-family: 'IM Fell English', serif;
  font-size: 13px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 10px 22px;
  background: transparent;
  border: 1px solid var(--ink);
  color: var(--ink);
  cursor: none;
  position: relative;
  overflow: hidden;
  transition: color 0.4s, border-color 0.4s;
}
.nav-cta::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: var(--ink);
  transition: left 0.4s cubic-bezier(.7,0,.3,1);
  z-index: -1;
}
.nav-cta:hover { color: var(--parchment); border-color: var(--ink); }
.nav-cta:hover::before { left: 0; }

@media (max-width: 900px) {
  .nav { padding: 16px 20px; }
  .nav-links { display: none; }
  .nav-cta { display: none; }
}

/* ===== HERO ===== */
.hero {
  min-height: 100vh;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 120px 48px 80px;
}

.hero-map-layer {
  position: absolute;
  inset: -5%;
  pointer-events: none;
  will-change: transform;
}
.hero-map-layer img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.35;
  filter: sepia(0.4) contrast(0.95) brightness(1.05);
}
.hero-map-layer.back img { opacity: 0.15; filter: sepia(0.6) blur(1px); }
.hero-map-layer.mid img { opacity: 0.25; }
.hero-map-layer.front img { opacity: 0.35; }

.hero-vignette {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at center, transparent 30%, rgba(59, 42, 30, 0.2) 100%),
    linear-gradient(to bottom, var(--parchment) 0%, transparent 15%, transparent 85%, var(--parchment) 100%);
  pointer-events: none;
}

.hero-content {
  position: relative;
  z-index: 3;
  text-align: center;
  max-width: 900px;
}

.hero-eyebrow {
  font-family: 'IM Fell English', serif;
  font-size: 13px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--rust);
  margin-bottom: 28px;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 1s 0.3s ease forwards;
}
.hero-eyebrow::before, .hero-eyebrow::after {
  content: '—';
  margin: 0 14px;
  color: var(--gold-dark);
}

.hero-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(48px, 9vw, 128px);
  font-weight: 300;
  line-height: 0.95;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin-bottom: 20px;
  opacity: 0;
  transform: translateY(30px);
  animation: fadeUp 1.2s 0.5s cubic-bezier(.2,.8,.2,1) forwards;
}
.hero-title em {
  font-style: italic;
  font-weight: 400;
  color: var(--rust);
  position: relative;
}
.hero-title .amp {
  font-style: italic;
  font-weight: 300;
  color: var(--gold-dark);
  font-size: 0.7em;
  vertical-align: middle;
}

.hero-subtitle {
  font-family: 'Lora', serif;
  font-size: clamp(16px, 2vw, 20px);
  font-style: italic;
  color: var(--ink-soft);
  max-width: 560px;
  margin: 0 auto 40px;
  line-height: 1.7;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 1s 0.8s ease forwards;
}

.hero-typewriter {
  font-family: 'IM Fell English', serif;
  font-size: 15px;
  color: var(--ink-soft);
  letter-spacing: 0.05em;
  min-height: 24px;
  margin-bottom: 48px;
  opacity: 0;
  animation: fadeIn 0.8s 1.1s ease forwards;
}
.hero-typewriter .caret {
  display: inline-block;
  width: 8px;
  height: 16px;
  background: var(--rust);
  margin-left: 2px;
  vertical-align: middle;
  animation: blink 1.1s steps(1) infinite;
}

@keyframes blink { 50% { opacity: 0; } }

.hero-cta-row {
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 1s 1.3s ease forwards;
}

.btn-primary, .btn-secondary {
  font-family: 'IM Fell English', serif;
  font-size: 14px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 16px 36px;
  cursor: none;
  position: relative;
  overflow: hidden;
  transition: all 0.4s cubic-bezier(.2,.8,.2,1);
  border: 1px solid var(--ink);
}
.btn-primary {
  background: var(--ink);
  color: var(--parchment);
}
.btn-primary:hover {
  background: var(--rust);
  border-color: var(--rust);
  box-shadow: 0 8px 30px rgba(168, 64, 47, 0.35);
  transform: translateY(-2px);
}
.btn-secondary {
  background: transparent;
  color: var(--ink);
}
.btn-secondary:hover {
  background: rgba(193, 154, 73, 0.15);
  border-color: var(--gold-dark);
  transform: translateY(-2px);
}

/* Compass rose */
.compass-rose {
  position: absolute;
  width: 180px;
  height: 180px;
  bottom: 60px;
  right: 80px;
  z-index: 4;
  opacity: 0.7;
  pointer-events: none;
}
.compass-rose svg {
  width: 100%;
  height: 100%;
  animation: compassSpin 60s linear infinite;
  filter: drop-shadow(0 2px 8px rgba(59, 42, 30, 0.3));
}
@keyframes compassSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.hero-scroll-hint {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'IM Fell English', serif;
  font-size: 12px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ink-faint);
  z-index: 4;
  opacity: 0;
  animation: fadeIn 1s 1.8s ease forwards;
}
.hero-scroll-hint::after {
  content: '';
  display: block;
  width: 1px;
  height: 40px;
  background: var(--gold-dark);
  margin: 10px auto 0;
  animation: scrollLine 2s ease-in-out infinite;
}
@keyframes scrollLine {
  0%, 100% { transform: scaleY(1); transform-origin: top; }
  50% { transform: scaleY(0.3); transform-origin: top; }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@media (max-width: 768px) {
  .hero { padding: 100px 24px 60px; }
  .compass-rose { width: 100px; height: 100px; bottom: 30px; right: 30px; opacity: 0.4; }
}

/* ===== SECTION COMMON ===== */
.section {
  padding: 140px 48px;
  position: relative;
}
.section-header {
  text-align: center;
  margin-bottom: 80px;
}
.section-number {
  font-family: 'IM Fell English', serif;
  font-size: 13px;
  letter-spacing: 0.4em;
  color: var(--rust);
  text-transform: uppercase;
  margin-bottom: 16px;
}
.section-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(36px, 5vw, 64px);
  font-weight: 400;
  color: var(--ink);
  line-height: 1.1;
  margin-bottom: 20px;
}
.section-title em { font-style: italic; color: var(--rust); font-weight: 300; }
.section-desc {
  font-family: 'Lora', serif;
  font-style: italic;
  font-size: 17px;
  color: var(--ink-soft);
  max-width: 560px;
  margin: 0 auto;
  line-height: 1.7;
}
.section-rule {
  width: 60px;
  height: 1px;
  background: var(--gold);
  margin: 24px auto;
  position: relative;
}
.section-rule::before, .section-rule::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 6px; height: 6px;
  border: 1px solid var(--gold);
  transform: translateY(-50%) rotate(45deg);
}
.section-rule::before { left: -16px; }
.section-rule::after { right: -16px; }

/* Reveal on scroll */
.reveal {
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 1s cubic-bezier(.2,.8,.2,1), transform 1s cubic-bezier(.2,.8,.2,1);
}
.reveal.in {
  opacity: 1;
  transform: translateY(0);
}

@media (max-width: 768px) {
  .section { padding: 80px 24px; }
  .section-header { margin-bottom: 50px; }
}

/* ===== COLLECTION ===== */
.collection-filters {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 60px;
}
.filter-chip {
  font-family: 'IM Fell English', serif;
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 10px 22px;
  background: transparent;
  border: 1px solid var(--ink-faint);
  color: var(--ink-soft);
  cursor: none;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}
.filter-chip:hover {
  border-color: var(--gold-dark);
  color: var(--ink);
}
.filter-chip.active {
  background: var(--ink);
  color: var(--parchment);
  border-color: var(--ink);
}

.collection-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 32px;
  max-width: 1300px;
  margin: 0 auto;
}

.map-card {
  background: var(--parchment-light);
  border: 1px solid var(--gold-dark);
  cursor: none;
  position: relative;
  overflow: hidden;
  transition: box-shadow 0.4s ease;
  transform-style: preserve-3d;
  perspective: 1000px;
}
.map-card:hover {
  box-shadow:
    0 20px 50px rgba(59, 42, 30, 0.25),
    0 0 0 1px var(--gold);
}
.map-card-image {
  position: relative;
  aspect-ratio: 4 / 3;
  overflow: hidden;
  background: var(--parchment-dark);
}
.map-card-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: sepia(0.3) contrast(1.05);
  transition: transform 0.6s cubic-bezier(.2,.8,.2,1), filter 0.4s;
}
.map-card:hover .map-card-image img {
  transform: scale(1.06);
  filter: sepia(0.15) contrast(1.1);
}
.map-card-badge {
  position: absolute;
  top: 14px;
  left: 14px;
  font-family: 'IM Fell English', serif;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 5px 12px;
  background: var(--rust);
  color: var(--parchment);
  z-index: 2;
}
.map-card-badge.rare {
  background: var(--gold-dark);
  color: var(--parchment);
}
.map-card-badge.patina {
  background: var(--patina-dark);
  color: var(--parchment);
}
.map-card-shine {
  position: absolute;
  top: 0; left: -100%;
  width: 50%; height: 100%;
  background: linear-gradient(to right, transparent, rgba(255, 235, 180, 0.3), transparent);
  transform: skewX(-15deg);
  transition: left 0.8s ease;
  pointer-events: none;
}
.map-card:hover .map-card-shine { left: 150%; }

.map-card-body {
  padding: 24px 22px 26px;
  border-top: 1px solid rgba(193, 154, 73, 0.4);
}
.map-card-year {
  font-family: 'IM Fell English', serif;
  font-size: 11px;
  letter-spacing: 0.25em;
  color: var(--rust);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.map-card-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.25;
  margin-bottom: 8px;
}
.map-card-title em { font-style: italic; font-weight: 400; }
.map-card-region {
  font-family: 'Lora', serif;
  font-size: 14px;
  font-style: italic;
  color: var(--ink-faint);
  margin-bottom: 16px;
}
.map-card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 14px;
  border-top: 1px dotted var(--ink-faint);
}
.map-card-price {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 500;
  color: var(--gold-dark);
}
.map-card-view {
  font-family: 'IM Fell English', serif;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  gap: 6px;
  transition: color 0.3s;
}
.map-card:hover .map-card-view { color: var(--rust); }

/* ===== STATS ===== */
.stats-section {
  background: var(--ink);
  color: var(--parchment);
  position: relative;
  overflow: hidden;
}
.stats-section::before {
  content: '';
  position: absolute;
  inset: 0;
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='2'/%3E%3CfeColorMatrix type='matrix' values='0 0 0 0 0.76 0 0 0 0 0.6 0 0 0 0 0.29 0 0 0 0.04 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity: 0.5;
  pointer-events: none;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 40px;
  max-width: 1200px;
  margin: 0 auto;
  position: relative;
  z-index: 2;
}
.stat-item {
  text-align: center;
}
.stat-number {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(40px, 5vw, 72px);
  font-weight: 300;
  color: var(--gold);
  line-height: 1;
  margin-bottom: 12px;
  font-variant-numeric: oldstyle-nums;
}
.stat-label {
  font-family: 'IM Fell English', serif;
  font-size: 12px;

const reducedMotion = typeof window !== 'undefined'
  ? window.matchMedia('(prefers-reduced-motion: reduce)').matches
  : false;

// ============ CUSTOM CURSOR ============
function useCustomCursor() {
  const outerRef = useRef(null);
  const innerRef = useRef(null);
  const posRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const targetRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const rafRef = useRef(null);
  const hoverRef = useRef(false);
  const clickingRef = useRef(false);

  useEffect(() => {
    if (reducedMotion) return;
    if (window.innerWidth <= 900) return;

    const outer = document.createElement('div');
    outer.className = 'cursor-outer';
    outerRef.current = outer;
    const inner = document.createElement('div');
    inner.className = 'cursor-inner';
    innerRef.current = inner;
    document.body.appendChild(outer);
    document.body.appendChild(inner);

    // Initial center position
    posRef.current = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    targetRef.current = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    updateCursor();

    function updateCursor() {
      if (!outerRef.current || !innerRef.current) return;
      // Ease outer toward target
      posRef.current.x += (targetRef.current.x - posRef.current.x) * 0.18;
      posRef.current.y += (targetRef.current.y - posRef.current.y) * 0.18;

      outerRef.current.style.left = posRef.current.x + 'px';
      outerRef.current.style.top = posRef.current.y + 'px';
      innerRef.current.style.left = targetRef.current.x + 'px';
      innerRef.current.style.top = targetRef.current.y + 'px';

      rafRef.current = requestAnimationFrame(updateCursor);
    }

    function onMouseMove(e) {
      targetRef.current.x = e.clientX;
      targetRef.current.y = e.clientY;
    }

    function onMouseOver(e) {
      const target = e.target.closest('a, button, [data-cursor-hover]');
      if (target) {
        hoverRef.current = true;
        outerRef.current?.classList.add('hover');
        innerRef.current?.classList.add('hover');
      }
    }

    function onMouseOut(e) {
      const target = e.target.closest('a, button, [data-cursor-hover]');
      if (target) {
        hoverRef.current = false;
        outerRef.current?.classList.remove('hover');
        innerRef.current?.classList.remove('hover');
      }
    }

    function onMouseDown() {
      clickingRef.current = true;
      outerRef.current?.classList.add('clicking');
      // Ripple
      const ripple = document.createElement('div');
      ripple.className = 'cursor-ripple';
      ripple.style.left = targetRef.current.x + 'px';
      ripple.style.top = targetRef.current.y + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 700);
    }

    function onMouseUp() {
      clickingRef.current = false;
      outerRef.current?.classList.remove('clicking');
    }

    function onVisibility() {
      if (document.hidden) {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      } else {
        updateCursor();
      }
    }

    window.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseover', onMouseOver);
    document.addEventListener('mouseout', onMouseOut);
    document.addEventListener('mousedown', onMouseDown);
    document.addEventListener('mouseup', onMouseUp);
    document.addEventListener('visibilitychange', onVisibility);

    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      window.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseover', onMouseOver);
      document.removeEventListener('mouseout', onMouseOut);
      document.removeEventListener('mousedown', onMouseDown);
      document.removeEventListener('mouseup', onMouseUp);
      document.removeEventListener('visibilitychange', onVisibility);
      outer.remove();
      inner.remove();
    };
  }, []);
}

// ============ SCROLL REVEAL ============
function useScrollReveal() {
  useEffect(() => {
    if (reducedMotion) {
      document.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
      return;
    }
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          const delay = entry.target.dataset.delay
            ? parseInt(entry.target.dataset.delay)
            : 0;
          setTimeout(() => entry.target.classList.add('in'), delay);
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    return () => observer.disconnect();
  }, []);
}

// ============ NUMBER COUNTER ============
function useCounter(elementRef, target, duration = 2000) {
  const rafRef = useRef(null);
  const startedRef = useRef(false);

  useEffect(() => {
    if (!elementRef.current) return;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !startedRef.current) {
          startedRef.current = true;
          animate();
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.5 });

    observer.observe(elementRef.current);

    function animate() {
      if (reducedMotion) {
        elementRef.current.textContent = target;
        return;
      }
      const start = performance.now();
      const num = parseInt(String(target).replace(/,/g, ''));

      function step(now) {
        const progress = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3); // ease-out cubic
        const current = Math.floor(num * eased);
        elementRef.current.textContent = current.toLocaleString();
        if (progress < 1) {
          rafRef.current = requestAnimationFrame(step);
        } else {
          elementRef.current.textContent = target;
        }
      }
      rafRef.current = requestAnimationFrame(step);
    }

    return () => {
      observer.disconnect();
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [target, duration, elementRef]);
}

// ============ TYPEWRITER ============
function Typewriter({ texts, speed = 70, pause = 2000 }) {
  const [text, setText] = useState('');
  const [index, setIndex] = useState(0);
  const [deleting, setDeleting] = useState(false);
  const timerRef = useRef(null);

  useEffect(() => {
    if (reducedMotion) {
      setText(texts[0]);
      return;
    }
    schedule();
    return () => { if (timerRef.current) clearTimeout(timerRef.current); };

    function schedule() {
      const current = texts[index];
      if (!deleting) {
        if (text.length < current.length) {
          timerRef.current = setTimeout(() => {
            setText(current.slice(0, text.length + 1));
          }, speed + Math.random() * 30);
        } else {
          timerRef.current = setTimeout(() => setDeleting(true), pause);
        }
      } else {
        if (text.length > 0) {
          timerRef.current = setTimeout(() => {
            setText(current.slice(0, text.length - 1));
          }, speed / 2);
        } else {
          setDeleting(false);
          setIndex((index + 1) % texts.length);
        }
      }
    }
  }, [text, deleting, index, texts, speed, pause]);

  return (
    <div className="hero-typewriter">
      <span>{text}</span>
      <span className="caret"></span>
    </div>
  );
}

// ============ DUST PARTICLES ============
function useDustParticles() {
  const rafRef = useRef(null);
  const particlesRef = useRef([]);

  useEffect(() => {
    if (reducedMotion) return;
    if (window.innerWidth <= 900) return;

    // Create 25 particles
    const count = 25;
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'dust-particle';
      document.body.appendChild(el);
      particlesRef.current.push({
        el,
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - 0.5) * 0.3,
        vy: -0.15 - Math.random() * 0.2,
        size: 1 + Math.random() * 2,
        opacity: 0.1 + Math.random() * 0.4,
        phase: Math.random() * Math.PI * 2,
      });
    }

    let t = 0;
    function animate() {
      t += 0.01;
      particlesRef.current.forEach(p => {
        p.x += p.vx + Math.sin(t + p.phase) * 0.15;
        p.y += p.vy;
        if (p.y < -10) {
          p.y = window.innerHeight + 10;
          p.x = Math.random() * window.innerWidth;
        }
        if (p.x < -10) p.x = window.innerWidth + 10;
        if (p.x > window.innerWidth + 10) p.x = -10;
        p.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
        p.el.style.opacity = p.opacity * (0.5 + 0.5 * Math.sin(t * 2 + p.phase));
        p.el.style.width = p.size + 'px';
        p.el.style.height = p.size + 'px';
      });
      rafRef.current = requestAnimationFrame(animate);
    }
    rafRef.current = requestAnimationFrame(animate);

    function onVisibility() {
      if (document.hidden) {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      } else {
        rafRef.current = requestAnimationFrame(animate);
      }
    }
    document.addEventListener('visibilitychange', onVisibility);

    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      document.removeEventListener('visibilitychange', onVisibility);
      particlesRef.current.forEach(p => p.el.remove());
      particlesRef.current = [];
    };
  }, []);
}

// ============ HERO PARALLAX (direct DOM) ============
function useHeroParallax() {
  const backRef = useRef(null);
  const midRef = useRef(null);
  const frontRef = useRef(null);
  const scrollRef = useRef(null);
  const rafRef = useRef(null);
  const mouseRef = useRef({ x: 0, y: 0 });
  const targetMouseRef = useRef({ x: 0, y: 0 });

  useEffect(() => {
    if (reducedMotion) return;

    const back = document.querySelector('.hero-map-layer.back');
    const mid = document.querySelector('.hero-map-layer.mid');
    const front = document.querySelector('.hero-map-layer.front');
    const hero = document.querySelector('.hero');
    backRef.current = back;
    midRef.current = mid;
    frontRef.current = front;
    scrollRef.current = hero;

    function onMouseMove(e) {
      const cx = (e.clientX / window.innerWidth - 0.5) * 2;
      const cy = (e.clientY / window.innerHeight - 0.5) * 2;
      targetMouseRef.current = { x: cx, y: cy };
    }

    function onScroll() {
      // no setState; RAF handles it
    }

    function animate() {
      mouseRef.current.x += (targetMouseRef.current.x - mouseRef.current.x) * 0.06;
      mouseRef.current.y += (targetMouseRef.current.y - mouseRef.current.y) * 0.06;

      const mx = mouseRef.current.x;
      const my = mouseRef.current.y;
      const scrollY = window.scrollY;

      if (backRef.current) {
        backRef.current.style.transform = `translate(${mx * 8}px, ${my * 5 + scrollY * 0.15}px) scale(1.05)`;
      }
      if (midRef.current) {
        midRef.current.style.transform = `translate(${mx * 16}px, ${my * 10 + scrollY * 0.25}px) scale(1.08)`;
      }
      if (frontRef.current) {
        frontRef.current.style.transform = `translate(${mx * 28}px, ${my * 16 + scrollY * 0.4}px) scale(1.12)`;
      }

      rafRef.current = requestAnimationFrame(animate);
    }

    rafRef.current = requestAnimationFrame(animate);
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('scroll', onScroll, { passive: true });

    function onVisibility() {
      if (document.hidden) {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      } else {
        rafRef.current = requestAnimationFrame(animate);
      }
    }
    document.addEventListener('visibilitychange', onVisibility);

    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('scroll', onScroll);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, []);
}

// ============ CARD TILT (direct DOM) ============
function useCardTilt() {
  useEffect(() => {
    if (reducedMotion) return;
    if (window.innerWidth <= 900) return;

    const cards = document.querySelectorAll('.map-card');

    function onMove(e) {
      const card = e.currentTarget;
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      const rx = ((y - cy) / cy) * -5;
      const ry = ((x - cx) / cx) * 5;
      card.style.transform = `perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg) translateZ(0)`;
    }
    function onLeave(e) {
      e.currentTarget.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) translateZ(0)';
    }

    cards.forEach(card => {
      card.addEventListener('mousemove', onMove);
      card.addEventListener('mouseleave', onLeave);
    });

    return () => {
      cards.forEach(card => {
        card.removeEventListener('mousemove', onMove);
        card.removeEventListener('mouseleave', onLeave);
      });
    };
  }, []);
}

function Modal({ item, onClose }) {
  useEffect(() => {
    if (item) {
      document.body.style.overflow = 'hidden';
    } else {
      document.body.style.overflow = '';
    }
    return () => { document.body.style.overflow = ''; };
  }, [item]);

  useEffect(() => {
    function onKey(e) { if (e.key === 'Escape') onClose(); }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);

  if (!item) return null;

  return (
    <div
      className={`modal-overlay ${item ? 'open' : ''}`}
      onClick={onClose}
    >
      <div className="modal" onClick={e => e.stopPropagation()}>
        <button className="modal-close" onClick={onClose} aria-label="关闭">×</button>
        <div className="modal-image">
          <img
            src="/spark/app/app_17c8mct5mab/runtime/api/v1/storage/object/bucket_aadkqi7sjhmli_static/static%2Faadkqihvhyulq_ve_miaoda"
            alt={item.title}
          />
        </div>
        <div className="modal-body">
          <div className="modal-year">{item.year}年 · {item.badge}</div>
          <h2 className="modal-title">
            {item.title}<br/>
            <em>{item.titleEn}</em>
          </h2>
          <div className="modal-meta">
            <div className="modal-meta-item">
              <label>制图师</label>
              <span>{item.explorer}</span>
            </div>
            <div className="modal-meta-item">
              <label>工艺</label>
              <span>{item.technique}</span>
            </div>
            <div className="modal-meta-item">
              <label>尺寸</label>
              <span>{item.size}</span>
            </div>
            <div className="modal-meta-item">
              <label>品相</label>
              <span>{item.condition}</span>
            </div>
          </div>
          <div className="modal-desc">
            <p>{item.desc}</p>
          </div>
          <div className="modal-footer">
            <div className="modal-price">
              {item.price}
              <small>含定制装裱与保真证书</small>
            </div>
            <button className="btn-primary" data-cursor-hover>预约私人鉴赏</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function RoutesSection() {
  const [activeId, setActiveId] = useState(1);
  const [drawn, setDrawn] = useState(false);
  const sectionRef = useRef(null);

  useEffect(() => {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          setDrawn(true);
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.3 });
    if (sectionRef.current) observer.observe(sectionRef.current);
    return () => observer.disconnect();
  }, []);

  return (
    <section className="section routes-section" ref={sectionRef} id="routes">
      <div className="section-header reveal">
        <div className="section-number">探险航线</div>
        <h2 className="section-title">伟大航路的<em>坐标</em></h2>
        <div className="section-rule"></div>
        <p className="section-desc">
          从伊比利亚半岛出发的大航海时代，每一条航线都是人类认知边界的拓展。<br/>
          点击右侧航线，在古地图上追踪探险家的足迹。
        </p>
      </div>
      <div className="routes-container">
        <div className="routes-map-wrap reveal" data-cursor-hover>
          <img
            src="/spark/app/app_17c8mct5mab/runtime/api/v1/storage/object/bucket_aadkqi7sjhmli_static/static%2Faadkqihvhyulq_ve_miaoda"
            alt="古世界地图"
          />
          <svg className="routes-svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice">
            {ROUTES.map(route => (
              <path
                key={route.id}
                d={route.path}
                className={`route-path ${activeId === route.id && drawn ? 'drawn' : ''} ${activeId === route.id ? '' : 'dashed'}`}
                style={{
                  stroke: activeId === route.id ? 'var(--rust)' : 'var(--gold-dark)',
                  strokeWidth: activeId === route.id ? 2.5 : 1.2,
                  opacity: activeId === route.id ? 1 : 0.4,
                }}
              />
            ))}
            {/* Route end points */}
            {ROUTES.map(route => {
              const parts = route.path.match(/[\d.]+/g);
              const lastX = parts ? parts[parts.length - 2] : 0;
              const lastY = parts ? parts[parts.length - 1] : 0;
              const firstX = parts ? parts[0] : 0;
              const firstY = parts ? parts[1] : 0;
              return (
                <g key={'pts-' + route.id}>
                  <circle
                    cx={firstX}
                    cy={firstY}
                    r={activeId === route.id ? 5 : 3}
                    fill="#5F7A61"
                    opacity={activeId === route.id ? 1 : 0.5}
                    style={{ filter: activeId === route.id ? 'drop-shadow(0 0 4px rgba(95,122,97,0.8))' : 'none' }}
                  />
                  <circle
                    cx={lastX}
                    cy={lastY}
                    r={activeId === route.id ? 6 : 3}
                    fill="#A8402F"
                    opacity={activeId === route.id ? 1 : 0.5}
                    style={{ filter: activeId === route.id ? 'drop-shadow(0 0 6px rgba(168,64,47,0.8))' : 'none' }}
                  />
                </g>
              );
            })}
          </svg>
        </div>
        <div className="routes-list">
          {ROUTES.map((route, i) => (
            <div
              key={route.id}
              className={`route-item reveal ${activeId === route.id ? 'active' : ''}`}
              data-delay={i * 80}
              data-cursor-hover
              onClick={() => setActiveId(route.id)}
            >
              <div className="route-item-year">{route.year}</div>
              <div className="route-item-name">{route.name}</div>
              <div className="route-item-explorer">— {route.explorer}</div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>MYCELIA — The Bioluminescent Fungi Archive</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;500&display=swap" />
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  :root {
    --bg-0: #0a0d07;
    --bg-1: #12170e;
    --bg-2: #1a2114;
    --ink: #f2f0e6;
    --ink-dim: #a8a490;
    --ink-faint: #5c5a4a;
    --glow: #c8ff4a;
    --glow-deep: #6ab023;
    --amber: #e8a445;
    --coral: #ff7a3c;
    --earth: #3d3222;
    --line: rgba(242, 240, 230, 0.08);
    --font-serif: 'DM Serif Display', Georgia, serif;
    --font-sans: 'DM Sans', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg-0);
    color: var(--ink);
    font-family: var(--font-sans);
    font-weight: 300;
    line-height: 1.6;
    overflow-x: hidden;
    cursor: none;
  }
  @media (prefers-reduced-motion: reduce) {
    body { cursor: auto; }
    html { scroll-behavior: auto; }
  }

  img { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; cursor: none; }
  button { font-family: inherit; cursor: none; border: none; background: none; color: inherit; }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 48px;
  }

  /* ========== CUSTOM CURSOR ========== */
  .cursor-ring {
    position: fixed;
    top: 0; left: 0;
    width: 36px; height: 36px;
    border: 1.5px solid var(--ink);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                height 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.25s ease,
                background 0.25s ease,
                opacity 0.2s ease;
    mix-blend-mode: difference;
    opacity: 0;
  }
  .cursor-ring.visible { opacity: 1; }
  .cursor-ring.hover {
    width: 64px; height: 64px;
    border-color: var(--glow);
    background: rgba(200, 255, 74, 0.06);
  }
  .cursor-ring.click {
    width: 20px; height: 20px;
    background: var(--glow);
  }
  .cursor-dot {
    position: fixed;
    top: 0; left: 0;
    width: 6px; height: 6px;
    background: var(--glow);
    border-radius: 50%;
    pointer-events: none;
    z-index: 10000;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px var(--glow), 0 0 20px rgba(200, 255, 74, 0.5);
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .cursor-dot.visible { opacity: 1; }
  .cursor-ripple {
    position: fixed;
    top: 0; left: 0;
    width: 10px; height: 10px;
    border: 1px solid var(--glow);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    opacity: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    .cursor-ring, .cursor-dot, .cursor-ripple { display: none !important; }
    body { cursor: auto; }
    a, button { cursor: pointer; }
  }

  /* ========== NAV ========== */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 24px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.4s ease, backdrop-filter 0.4s ease, padding 0.4s ease;
  }
  nav.scrolled {
    background: rgba(10, 13, 7, 0.85);
    backdrop-filter: blur(12px);
    padding: 16px 48px;
    border-bottom: 1px solid var(--line);
  }
  .nav-logo {
    font-family: var(--font-serif);
    font-size: 22px;
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-logo-mark {
    width: 28px; height: 28px;
    position: relative;
  }
  .nav-links {
    display: flex;
    gap: 36px;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .nav-links a {
    position: relative;
    transition: color 0.3s ease;
  }
  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -4px; left: 0;
    width: 0; height: 1px;
    background: var(--glow);
    transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .nav-links a:hover { color: var(--glow); }
  .nav-links a:hover::after { width: 100%; }
  .nav-cta {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 12px 24px;
    border: 1px solid var(--ink-dim);
    border-radius: 100px;
    color: var(--ink);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .nav-cta::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--glow);
    transform: translateY(101%);
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: -1;
  }
  .nav-cta:hover {
    color: var(--bg-0);
    border-color: var(--glow);
  }
  .nav-cta:hover::before { transform: translateY(0); }

  /* ========== HERO ========== */
  .hero {
    position: relative;
    height: 100vh;
    min-height: 700px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .hero-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0.35;
    filter: saturate(0.7) brightness(0.6);
    will-change: transform;
  }
  .hero-vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, var(--bg-0) 85%);
    pointer-events: none;
  }
  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 900px;
    padding: 0 48px;
  }
  .hero-eyebrow {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--glow);
    margin-bottom: 32px;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 1s 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .hero-title {
    font-family: var(--font-serif);
    font-size: clamp(56px, 10vw, 140px);
    line-height: 0.95;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin-bottom: 32px;
  }
  .hero-title .italic { font-style: italic; color: var(--glow); }
  .hero-subtitle {
    font-size: 17px;
    color: var(--ink-dim);
    max-width: 520px;
    margin: 0 auto 48px;
    line-height: 1.7;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 1s 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .hero-scroll {
    position: absolute;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ink-faint);
    opacity: 0;
    animation: fadeUp 1s 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .hero-scroll-line {
    width: 1px; height: 60px;
    background: linear-gradient(to bottom, var(--glow), transparent);
    position: relative;
    overflow: hidden;
  }
  .hero-scroll-line::after {
    content: '';
    position: absolute;
    top: -20px; left: 0;
    width: 100%; height: 20px;
    background: var(--glow);
    animation: scrollHint 2.5s cubic-bezier(0.22, 1, 0.36, 1) infinite;
  }
  @keyframes scrollHint {
    0% { top: -20px; }
    100% { top: 100%; }
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Typewriter cursor */
  .type-caret {
    display: inline-block;
    width: 2px;
    height: 0.85em;
    background: var(--glow);
    margin-left: 4px;
    vertical-align: baseline;
    animation: blink 1.1s step-end infinite;
    box-shadow: 0 0 8px var(--glow);
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  /* ========== SECTION BASE ========== */
  section {
    padding: 160px 0;
    position: relative;
  }
  .section-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--glow);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .section-label::before {
    content: '';
    width: 32px; height: 1px;
    background: var(--glow);
  }
  .section-title {
    font-family: var(--font-serif);
    font-size: clamp(36px, 5vw, 64px);
    font-weight: 400;
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin-bottom: 24px;
    max-width: 700px;
  }
  .section-title em {
    font-style: italic;
    color: var(--amber);
  }

  /* ========== ARCHIVE INTRO ========== */
  .archive {
    background: linear-gradient(to bottom, var(--bg-0), var(--bg-1));
  }
  .archive-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: start;
    margin-top: 64px;
  }
  .archive-text p {
    color: var(--ink-dim);
    font-size: 16px;
    line-height: 1.8;
    margin-bottom: 20px;
    max-width: 480px;
  }
  .archive-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  .stat-cell {
    background: var(--bg-1);
    padding: 40px 32px;
    position: relative;
    overflow: hidden;
    transition: background 0.4s ease;
  }
  .stat-cell:hover { background: var(--bg-2); }
  .stat-cell::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 1px;
    background: linear-gradient(to right, var(--glow-deep), transparent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .stat-cell:hover::before { transform: scaleX(1); }
  .stat-number {
    font-family: var(--font-serif);
    font-size: 48px;
    line-height: 1;
    color: var(--ink);
    margin-bottom: 12px;
    font-variant-numeric: tabular-nums;
  }
  .stat-number .unit {
    font-size: 20px;
    color: var(--glow);
    font-family: var(--font-sans);
    font-weight: 300;
    margin-left: 4px;
  }
  .stat-label {
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  /* ========== SPECIMENS ========== */
  .specimens {
    background: var(--bg-1);
  }
  .specimens-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 80px;
  }
  .specimens-header p {
    color: var(--ink-dim);
    max-width: 400px;
    font-size: 15px;
    line-height: 1.7;
  }
  .specimen-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
    perspective: 1200px;
  }
  .specimen-card {
    position: relative;
    border: 1px solid var(--line);
    background: var(--bg-0);
    overflow: hidden;
    transform-style: preserve-3d;
    transition: border-color 0.4s ease;
    will-change: transform;
  }
  .specimen-card:hover { border-color: rgba(200, 255, 74, 0.3); }
  .specimen-image-wrap {
    position: relative;
    aspect-ratio: 4/5;
    overflow: hidden;
  }
  .specimen-image {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1), filter 0.6s ease;
    filter: saturate(0.85) brightness(0.9);
  }
  .specimen-card:hover .specimen-image {
    transform: scale(1.06);
    filter: saturate(1.1) brightness(1);
  }
  .specimen-glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 60%, rgba(200, 255, 74, 0.25), transparent 60%);
    opacity: 0;
    transition: opacity 0.6s ease;
    mix-blend-mode: screen;
    pointer-events: none;
  }
  .specimen-card:hover .specimen-glow { opacity: 1; animation: glowPulse 3s ease-in-out infinite; }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
  }
  .specimen-sheen {
    position: absolute;
    top: 0; left: -80%;
    width: 50%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.08), transparent);
    transform: skewX(-20deg);
    pointer-events: none;
    transition: none;
  }
  .specimen-card:hover .specimen-sheen {
    animation: sheen 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes sheen {
    to { left: 140%; }
  }
  .specimen-index {
    position: absolute;
    top: 16px; left: 20px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.1em;
    z-index: 2;
  }
  .specimen-info {
    padding: 24px 20px 28px;
    position: relative;
    z-index: 2;
  }
  .specimen-name {
    font-family: var(--font-serif);
    font-size: 22px;
    margin-bottom: 4px;
    transition: color 0.3s ease;
  }
  .specimen-card:hover .specimen-name { color: var(--glow); }
  .specimen-latin {
    font-style: italic;
    font-size: 12px;
    color: var(--ink-faint);
    margin-bottom: 16px;
    font-family: var(--font-serif);
  }
  .specimen-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--ink-dim);
    font-family: var(--font-mono);
    letter-spacing: 0.05em;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .specimen-meta .toxicity-safe { color: var(--glow-deep); }
  .specimen-meta .toxicity-psyc { color: var(--coral); }
  .specimen-meta .toxicity-med { color: var(--amber); }

  /* ========== NETWORK / MYCELIUM ========== */
  .network {
    background: linear-gradient(to bottom, var(--bg-1), var(--bg-0));
    overflow: hidden;
  }
  .network-wrap {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 80px;
    align-items: center;
  }
  .network-text p {
    color: var(--ink-dim);
    font-size: 16px;
    line-height: 1.8;
    margin-bottom: 20px;
    max-width: 500px;
  }
  .network-facts {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .network-fact {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    padding: 20px 0;
    border-top: 1px solid var(--line);
  }
  .network-fact:last-child { border-bottom: 1px solid var(--line); }
  .fact-num {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--glow);
    letter-spacing: 0.1em;
    min-width: 32px;
  }
  .fact-content h4 {
    font-family: var(--font-serif);
    font-size: 20px;
    font-weight: 400;
    margin-bottom: 6px;
  }
  .fact-content p {
    font-size: 14px;
    color: var(--ink-faint);
    line-height: 1.6;
    margin: 0;
  }

  .mycelium-canvas {
    position: relative;
    aspect-ratio: 1;
    max-width: 520px;
    margin: 0 auto;
  }
  .mycelium-svg {
    width: 100%; height: 100%;
  }
  .mycelium-svg .fiber {
    stroke: var(--glow-deep);
    stroke-width: 0.8;
    fill: none;
    opacity: 0.4;
    filter: drop-shadow(0 0 2px rgba(106, 176, 35, 0.6));
    transition: stroke 0.3s ease, opacity 0.3s ease;
  }
  .mycelium-svg .node {
    fill: var(--glow);
    filter: drop-shadow(0 0 4px var(--glow));
  }
  .mycelium-svg .fiber.active {
    stroke: var(--glow);
    opacity: 1;
    stroke-width: 1.2;
  }

  /* ========== PHILOSOPHY ========== */
  .philosophy {
    background: var(--bg-0);
    position: relative;
  }
  .philosophy-quote {
    max-width: 900px;
    margin: 0 auto;
    text-align: center;
  }
  .philosophy-quote blockquote {
    font-family: var(--font-serif);
    font-size: clamp(28px, 4vw, 52px);
    line-height: 1.3;
    font-weight: 400;
    letter-spacing: -0.01em;
    margin-bottom: 32px;
  }
  .philosophy-quote blockquote em {
    color: var(--amber);
    font-style: italic;
  }
  .philosophy-quote cite {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-style: normal;
  }

  /* ========== EVENTS ========== */
  .events {
    background: var(--bg-1);
  }
  .events-list {
    margin-top: 64px;
    border-top: 1px solid var(--line);
  }
  .event-item {
    display: grid;
    grid-template-columns: 120px 1fr auto 140px;
    gap: 40px;
    align-items: center;
    padding: 32px 0;
    border-bottom: 1px solid var(--line);
    position: relative;
    transition: padding 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .event-item::before {
    content: '';
    position: absolute;
    left: -48px; right: -48px; top: 0; bottom: 0;
    background: rgba(200, 255, 74, 0.03);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  .event-item:hover { padding-left: 16px; padding-right: 16px; }
  .event-item:hover::before { opacity: 1; }
  .event-date {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--glow);
    letter-spacing: 0.1em;
  }
  .event-title {
    font-family: var(--font-serif);
    font-size: 24px;
    font-weight: 400;
  }
  .event-venue {
    font-size: 13px;
    color: var(--ink-faint);
    font-family: var(--font-mono);
    letter-spacing: 0.05em;
  }
  .event-arrow {
    justify-self: end;
    width: 36px; height: 36px;
    border: 1px solid var(--line);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .event-item:hover .event-arrow {
    border-color: var(--glow);
    background: var(--glow);
    color: var(--bg-0);
    transform: translateX(4px);
  }

  /* ========== SPECTRUM / BIOLUMINESCENCE VISUALIZER ========== */
  .spectrum {
    background: var(--bg-0);
    padding: 120px 0;
    overflow: hidden;
  }
  .spectrum-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }
  .spectrum-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .spectrum-bars {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 160px;
    padding: 0 20px;
  }
  .spectrum-bar {
    width: 3px;
    background: linear-gradient(to top, var(--glow-deep), var(--glow));
    border-radius: 2px;
    box-shadow: 0 0 6px rgba(200, 255, 74, 0.5);
    transform-origin: bottom;
    transition: height 0.1s ease-out;
  }
  .spectrum-legend {
    display: flex;
    gap: 40px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.1em;
  }
  .spectrum-legend span b {
    color: var(--glow);
    font-weight: 500;
  }

  /* ========== FOOTER ========== */
  footer {
    background: var(--bg-0);
    border-top: 1px solid var(--line);
    padding: 80px 0 40px;
  }
  .footer-top {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 60px;
    margin-bottom: 80px;
  }
  .footer-brand p {
    color: var(--ink-faint);
    font-size: 14px;
    line-height: 1.7;
    margin-top: 16px;
    max-width: 320px;
  }

/* ========== CUSTOM CURSOR (direct DOM, physics easing) ========== */
function useCustomCursor() {
  const ringRef = useRef(null);
  const dotRef = useRef(null);
  const rippleWrapRef = useRef(null);

  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;

    const ring = ringRef.current;
    const dot = dotRef.current;
    if (!ring || !dot) return;

    // Target & current positions (lerp for spring-like follow)
    let targetX = window.innerWidth / 2;
    let targetY = window.innerHeight / 2;
    let ringX = targetX;
    let ringY = targetY;
    let dotX = targetX;
    let dotY = targetY;

    // Spring constants (ring lags more than dot)
    const RING_EASE = 0.12;
    const DOT_EASE = 0.35;

    let rafId = null;
    let visible = false;
    let hovered = false;

    function loop() {
      if (!ring || !dot) return;
      // Damped linear interpolation toward target
      ringX += (targetX - ringX) * RING_EASE;
      ringY += (targetY - ringY) * RING_EASE;
      dotX += (targetX - dotX) * DOT_EASE;
      dotY += (targetY - dotY) * DOT_EASE;

      ring.style.transform = `translate(${ringX}px, ${ringY}px) translate(-50%, -50%)`;
      dot.style.transform = `translate(${dotX}px, ${dotY}px) translate(-50%, -50%)`;

      rafId = requestAnimationFrame(loop);
    }

    function onMove(e) {
      targetX = e.clientX;
      targetY = e.clientY;
      if (!visible) {
        visible = true;
        ring.classList.add('visible');
        dot.classList.add('visible');
      }
    }

    function onEnter() {
      if (!visible) {
        visible = true;
        ring.classList.add('visible');
        dot.classList.add('visible');
      }
    }

    function onLeave() {
      visible = false;
      ring.classList.remove('visible');
      dot.classList.remove('visible');
    }

    // Hover detection
    function addHoverListeners() {
      const interactives = document.querySelectorAll('a, button, .specimen-card, .event-item, .stat-cell, .network-fact');
      interactives.forEach(el => {
        el.addEventListener('mouseenter', onHoverEnter);
        el.addEventListener('mouseleave', onHoverLeave);
      });
      return interactives;
    }

    function onHoverEnter() {
      hovered = true;
      ring.classList.add('hover');
    }
    function onHoverLeave() {
      hovered = false;
      ring.classList.remove('hover');
    }

    // Click ripple
    function onClick(e) {
      if (!rippleWrapRef.current) return;
      const ripple = document.createElement('div');
      ripple.className = 'cursor-ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      rippleWrapRef.current.appendChild(ripple);

      // Animate ripple with Web Animations API (no timer leak per ripple)
      const anim = ripple.animate([
        { opacity: 0.8, width: '10px', height: '10px', borderColor: 'var(--glow)' },
        { opacity: 0, width: '80px', height: '80px', borderColor: 'rgba(200, 255, 74, 0)' }
      ], { duration: 700, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });

      anim.onfinish = () => { ripple.remove(); };

      // Click pulse on ring
      ring.classList.add('click');
      setTimeout(() => ring.classList.remove('click'), 150);
    }

    // Visibility pause
    function onVisibility() {
      if (document.hidden) {
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      } else {
        if (!rafId) rafId = requestAnimationFrame(loop);
      }
    }

    window.addEventListener('mousemove', onMove);
    document.addEventListener('mouseenter', onEnter);
    document.addEventListener('mouseleave', onLeave);
    window.addEventListener('click', onClick);
    document.addEventListener('visibilitychange', onVisibility);

    const interactives = addHoverListeners();

    // Initial position at center
    ring.style.transform = `translate(${targetX}px, ${targetY}px) translate(-50%, -50%)`;
    dot.style.transform = `translate(${targetX}px, ${targetY}px) translate(-50%, -50%)`;
    ring.classList.add('visible');
    dot.classList.add('visible');
    visible = true;

    rafId = requestAnimationFrame(loop);

    return () => {
      if (rafId) cancelAnimationFrame(rafId);
      window.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseenter', onEnter);
      document.removeEventListener('mouseleave', onLeave);
      window.removeEventListener('click', onClick);
      document.removeEventListener('visibilitychange', onVisibility);
      interactives.forEach(el => {
        el.removeEventListener('mouseenter', onHoverEnter);
        el.removeEventListener('mouseleave', onHoverLeave);
      });
    };
  }, []);

  return { ringRef, dotRef, rippleWrapRef };
}

/* ========== SPORE PARTICLE SYSTEM (canvas, physics) ========== */
function SporeCanvas() {
  const canvasRef = useRef(null);

  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;

    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;

    // Particle model: gravity + horizontal drift + brownian noise + size-dependent rise
    const SPORE_COUNT = Math.min(80, Math.floor(w * h / 25000));
    const spores = [];

    function rand(min, max) { return Math.random() * (max - min) + min; }

    for (let i = 0; i < SPORE_COUNT; i++) {
      spores.push({
        x: rand(0, w),
        y: rand(0, h),
        vx: rand(-0.1, 0.1),
        vy: rand(-0.3, 0.1),
        r: rand(0.8, 2.5),
        alpha: rand(0.2, 0.6),
        driftPhase: rand(0, Math.PI * 2),
        driftSpeed: rand(0.002, 0.01),
        driftAmp: rand(0.2, 0.8),
        brownian: rand(0.02, 0.08),
        // smaller spores rise (buoyancy), larger fall slightly (gravity)
        buoyancy: rand(-0.02, 0.01),
      });
    }

    let rafId = null;
    let time = 0;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }

    function loop() {
      // Trail effect - semi-transparent clear
      ctx.fillStyle = 'rgba(10, 13, 7, 0.08)';
      ctx.fillRect(0, 0, w, h);

      time += 0.016;

      for (let i = 0; i < spores.length; i++) {
        const s = spores[i];

        // Brownian motion (random walk)
        s.vx += (Math.random() - 0.5) * s.brownian;
        s.vy += (Math.random() - 0.5) * s.brownian;

        // Sinusoidal horizontal drift (air current)
        s.vx += Math.sin(time * s.driftSpeed + s.driftPhase) * s.driftAmp * 0.02;

        // Buoyancy / gravity
        s.vy += s.buoyancy;

        // Damping / friction
        s.vx *= 0.98;
        s.vy *= 0.98;

        // Integrate
        s.x += s.vx;
        s.y += s.vy;

        // Wrap around edges
        if (s.x < -10) s.x = w + 10;
        if (s.x > w + 10) s.x = -10;
        if (s.y < -10) s.y = h + 10;
        if (s.y > h + 10) s.y = -10;

        // Draw with soft glow
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200, 255, 74, ${s.alpha})`;
        ctx.fill();

        // Glow halo for larger spores
        if (s.r > 1.5) {
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(200, 255, 74, ${s.alpha * 0.1})`;
          ctx.fill();
        }
      }

      rafId = requestAnimationFrame(loop);
    }

    function onVisibility() {
      if (document.hidden) {
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      } else {
        if (!rafId) rafId = requestAnimationFrame(loop);
      }
    }

    window.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', onVisibility);
    rafId = requestAnimationFrame(loop);

    return () => {
      if (rafId) cancelAnimationFrame(rafId);
      window.removeEventListener('resize', resize);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, []);

  return <canvas id="sporeCanvas" ref={canvasRef} />;
}

/* ========== TYPEWRITER ========== */
function Typewriter({ text, delay = 0, speed = 80 }) {
  const [displayed, setDisplayed] = useState('');
  const [done, setDone] = useState(false);
  const timeoutRef = useRef(null);

  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) { setDisplayed(text); setDone(true); return; }

    let i = 0;
    setDisplayed('');
    setDone(false);

    function type() {
      if (i < text.length) {
        setDisplayed(text.slice(0, i + 1));
        i++;
        // Variable speed for natural typing rhythm
        const charSpeed = text[i - 1] === ' ' ? speed * 0.6 : speed + Math.random() * 40 - 20;
        timeoutRef.current = setTimeout(type, charSpeed);
      } else {
        setDone(true);
      }
    }

    timeoutRef.current = setTimeout(type, delay);

    return () => {
      if (timeoutRef.current) clearTimeout(timeoutRef.current);
    };
  }, [text, delay, speed]);

  return (
    <span>
      {displayed}
      {!done && <span className="type-caret" />}
    </span>
  );
}

/* ========== NUMBER COUNTER (spring easing) ========== */
function Counter({ end, duration = 2000, suffix = '', decimals = 0 }) {
  const [value, setValue] = useState(0);
  const ref = useRef(null);
  const startedRef = useRef(false);
  const rafRef = useRef(null);

  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) { setValue(end); return; }

    const el = ref.current;
    if (!el) return;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !startedRef.current) {
          startedRef.current = true;
          animate();
        }
      });
    }, { threshold: 0.3 });

    observer.observe(el);

    function animate() {
      const startTime = performance.now();

      function step(now) {
        const t = Math.min((now - startTime) / duration, 1);
        // Ease out cubic
        const eased = 1 - Math.pow(1 - t, 3);
        const current = end * eased;
        setValue(current);
        if (t < 1) {
          rafRef.current = requestAnimationFrame(step);
        } else {
          setValue(end);
        }
      }
      rafRef.current = requestAnimationFrame(step);
    }

    return () => {
      observer.disconnect();
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [end, duration]);

  return (
    <span ref={ref}>
      {value.toFixed(decimals)}
      {suffix && <span className="unit">{suffix}</span>}
    </span>
  );
}

/* ========== SPECIMEN CARD (3D tilt + magnetic, direct DOM) ========== */
function SpecimenCard({ index, img, name, latin, location, toxicity, toxicityLabel }) {
  const cardRef = useRef(null);
  const sheenRef = useRef(null);

  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;

    const card = cardRef.current;
    const sheen = sheenRef.current;
    if (!card) return;

    let rafId = null;
    let targetRx = 0, targetRy = 0;
    let currentRx = 0, currentRy = 0;
    const EASE = 0.12;

    function render() {
      currentRx += (targetRx - currentRx) * EASE;
      currentRy += (targetRy - currentRy) * EASE;

      card.style.transform = `perspective(1000px) rotateX(${currentRx}deg) rotateY(${currentRy}deg) translateZ(0)`;

      // Sheen position follows mouse
      if (sheen) {
        const rect = card.getBoundingClientRect();
        const normX = (currentRy / 15 + 0.5) * 100;
        sheen.style.left = `${normX - 25}%`;
      }

      rafId = requestAnimationFrame(render);
    }

    function onMove(e) {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;

      // Magnetic attraction: stronger at edges, weaker in center (inverse-ish)
      const rotX = ((y - centerY) / centerY) * -12;
      const rotY = ((x - centerX) / centerX) * 12;

      targetRx = rotX;
      targetRy = rotY;
    }

    function onEnter() {
      if (!rafId) rafId = requestAnimationFrame(render);
    }

    function onLeave() {
      targetRx = 0;
      targetRy = 0;
      // Let ease bring it back, then cancel
      setTimeout(() => {
        if (targetRx === 0 && targetRy === 0 && Math.abs(currentRx) < 0.1 && Math.abs(currentRy) < 0.1) {
          if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
          card.style.transform = '';
        }
      }, 500);
    }

    card.addEventListener('mousemove', onMove);
    card.addEventListener('mouseenter', onEnter);
    card.addEventListener('mouseleave', onLeave);

    return () => {
      if (rafId) cancelAnimationFrame(rafId);
      card.removeEventListener('mousemove', onMove);
      card.removeEventListener('mouseenter', onEnter);
      card.removeEventListener('mouseleave', onLeave);
    };
  }, []);

  return (
    <div className="specimen-card" ref={cardRef}>
      <div className="specimen-image-wrap">
        <span className="specimen-index">{String(index).padStart(3, '0')}</span>
        <img className="specimen-image" src={img} alt={name} />
        <div className="specimen-glow" />
        <div className="specimen-sheen" ref={sheenRef} />
      </div>
      <div className="specimen-info">
        <div className="specimen-name">{name}</div>
        <div className="specimen-latin">{latin}</div>
        <div className="specimen-meta">
          <span>{location}</span>
          <span className={`toxicity-${toxicity}`}>{toxicityLabel}</span>
        </div>
      </div>
    </div>
  );
}

/* ========== MYCELIUM NETWORK SVG (animated signal propagation) ========== */
function MyceliumNetwork() {
  const svgRef = useRef(null);
  const rafRef = useRef(null);

  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const svg = svgRef.current;
    if (!svg) return;

    const fibers = svg.querySelectorAll('.fiber');
    const nodes = svg.querySelectorAll('.node');

    // Signal pulse system: periodic waves travel from center outward
    let time = 0;
    let active = true;

    function loop() {
      if (!active) return;
      time += 0.016;

      fibers.forEach((fiber, i) => {
        // Each fiber has a phase offset — activation ripples outward
        const len = fiber.getTotalLength ? fiber.getTotalLength() : 100;
        const phase = (time * 0.5 + i * 0.3) % 3;
        // Wave passes through 0->1->0 as it travels
        const intensity = Math.max(0, 1 - Math.abs(phase - 1) * 2);
        if (intensity > 0.2) {
          fiber.classList.add('active');
          fiber.style.opacity = 0.4 + intensity * 0.6;
        } else {
          fiber.classList.remove('active');
          fiber.style.opacity = 0.3 + intensity * 0.3;
        }
      });

      // Nodes pulse at different rates
      nodes.forEach((node, i) => {
        const pulse = 0.5 + 0.5 * Math.sin(time * 1.5 + i * 0.8);
        const r = 2 + pulse * 1.5;
        node.setAttribute('r', r);
        node.style.opacity = 0.6 + pulse * 0.4;
      });

      rafRef.current = requestAnimationFrame(loop);
    }

    function onVisibility() {
      if (document.hidden) {
        active = false;
        if (rafRef.current) { cancelAnimationFrame(rafRef.current); rafRef.current = null; }
      } else {
        active = true;
        if (!rafRef.current) rafRef.current = requestAnimationFrame(loop);
      }
    }

    if (!reduced) {
      rafRef.current = requestAnimationFrame(loop);
      document.addEventListener('visibilitychange', onVisibility);
    }

    return () => {
      active = false;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, []);

  // Generate a mycelium-like network with branching paths
  const fibers = [];
  const nodes = [];
  const center = { x: 200, y: 200 };

  // Branching algorithm: start from center, split at various angles
  function branch(x, y, angle, length, depth, pathArr) {
    if (depth <= 0 || length < 5) return;
    const endX = x + Math.cos(angle) * length;
    const endY = y + Math.sin(angle) * length;
    pathArr.push({ x1: x, y1: y, x2: endX, y2: endY });

    // Add node at end occasionally
    if (depth <= 2 || Math.random() < 0.3) {
      nodes.push({ x: endX, y: endY });
    }

    // Split 0-3 times
    const splits = Math.floor(Math.random() * 3);
    for (let i = 0; i < splits; i++) {
      const newAngle = angle + (Math.random() - 0.5) * 1.8;
      const newLength = length * (0.5 + Math.random() * 0.4);
      branch(endX, endY, newAngle, newLength, depth - 1, pathArr);
    }
    // Continue in roughly same direction
    if (depth > 1) {
      const continueAngle = angle + (Math.random() - 0.5) * 0.6;
      branch(endX, endY, continueAngle, length * 0.7, depth - 1, pathArr);
    }
  }

  // Generate 6 primary branches from center
  for (let i = 0; i < 7; i++) {
    const angle = (i / 7) * Math.PI * 2 + Math.random() * 0.3;
    branch(center.x, center.y, angle, 50 + Math.random() * 20, 4, fibers);
  }

  // Central node
  nodes.push({ x: center.x, y: center.y });

  return (
    <div className="mycelium-canvas">
      <svg className="mycelium-svg" ref={svgRef} viewBox="0 0 400 400">
        {fibers.map((f, i) => (
          <line
            key={i}
            className="fiber"
            x1={f.x1} y1={f.y1}
            x2={f.x2} y2={f.y2}
          />
        ))}
        {nodes.map((n, i) => (
          <circle key={i} className="node" cx={n.x} cy={n.y} r="2.5" />
        ))}
      </svg>
    </div>
  );
}

/* ========== SPECTRUM VISUALIZER (simulated bioluminescence frequency) ========== */
function SpectrumBars() {
  const containerRef = useRef(null);
  const rafRef = useRef(null);

  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const container = containerRef.current;
    if (!container || reduced) return;

    const bars = container.querySelectorAll('.spectrum-bar');
    const barCount = bars.length;

    // Each bar has its own oscillation frequency + phase for natural look
    const barState = [];
    for (let i = 0; i < barCount; i++) {
      barState.push({
        base: 20 + Math.random() * 30,
        amp: 15 + Math.random() * 40,
        freq: 0.5 + Math.random() * 2.5,
        phase: Math.random() * Math.PI * 2,
        noise: 0,
        noiseSpeed: 0.02 + Math.random() * 0.05,
      });
    }

    let time = 0;
    let active = true;

    function loop() {
      if (!active) return;
      time += 0.016;

      // Center-weighted envelope (Gaussian-like) — middle bars taller
      for (let i = 0; i < barCount; i++) {
        const s = barState[i];
        // Distance from center (normalized -1 to 1)
        const dist = Math.abs((i / (barCount - 1)) * 2 - 1);
        const envelope = Math.exp(-dist * dist * 3); // Gaussian falloff

        // Multiple sine layers for organic feel
        const v1 = Math.sin(time * s.freq + s.phase) * s.amp;
        const v2 = Math.sin(time * s.freq * 2.3 + s.phase * 1.7) * s.amp * 0.3;

        // Perlin-like noise (accumulated random walk)
        s.noise += (Math.random() - 0.5) * s.noiseSpeed * 10;
        s.noise *= 0.95; // damping

        const height = Math.max(4, (s.base + v1 + v2 + s.noise) * envelope);
        bars[i].style.height = height + 'px';
      }

      rafRef.current = requestAnimationFrame(loop);
    }

    function onVisibility() {
      if (document.hidden) {
        active = false;
        if (rafRef.current) { cancelAnimationFrame(rafRef.current); rafRef.current = null; }
      } else {
        active = true;
        if (!rafRef.current) rafRef.current = requestAnimationFrame(loop);
      }
    }

    rafRef.current = requestAnimationFrame(loop);
    document.addEventListener('visibilitychange', onVisibility);

    return () => {
      active = false;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, []);

  // Generate 48 bars
  const bars = Array.from({ length: 48 }, (_, i) => i);

  return (
    <div className="spectrum-wrap">

/* ========== SCROLL REVEAL (IntersectionObserver) ========== */
function useScrollReveal() {
  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) {
      document.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
      return;
    }

    const els = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });

    els.forEach(el => observer.observe(el));
    return () => observer.disconnect();
  }, []);
}

/* ========== NAV SCROLL STATE ========== */
function useNavScroll() {
  const [scrolled, setScrolled] = useState(false);

  useEffect(() => {
    let ticking = false;
    function onScroll() {
      if (!ticking) {
        requestAnimationFrame(() => {
          setScrolled(window.scrollY > 60);
          ticking = false;
        });
        ticking = true;
      }
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  return scrolled;
}

/* ========== HERO PARALLAX (direct DOM) ========== */
function HeroParallax() {
  const bgRef = useRef(null);

  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;

    const bg = bgRef.current;
    if (!bg) return;

    let ticking = false;
    let targetY = 0;
    let currentY = 0;
    let rafId = null;

    function onScroll() {
      targetY = window.scrollY * 0.35;
      if (!ticking) {
        rafId = requestAnimationFrame(update);
        ticking = true;
      }
    }

    function update() {
      currentY += (targetY - currentY) * 0.1;
      bg.style.transform = `translateY(${currentY}px) scale(1.05)`;
      if (Math.abs(targetY - currentY) > 0.5) {
        rafId = requestAnimationFrame(update);
      } else {
        ticking = false;
      }
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    return () => {
      window.removeEventListener('scroll', onScroll);
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, []);

  return (
    <div
      className="hero-bg"
      ref={bgRef}
      style={{ backgroundImage: `url(${IMG.hero})` }}
    />
  );
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>铸字局 IronPress · 当代活字铸造所</title>
  <meta name="creative-medium" content="interactive-prototype" />
  <meta name="description" content="铸字局 IronPress — 一间当代活字铸造所，传承千年活字印刷技艺，以铅与火铸就每一个汉字。" />
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&display=swap" />
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    /* ========== 设计令牌 ========== */
    :root {
      --ink: #1B1712;
      --ink-900: #0F0D0A;
      --ink-800: #1B1712;
      --ink-700: #2A241D;
      --ink-600: #3A332A;
      --cinnabar: #C0392B;
      --cinnabar-light: #D95242;
      --cinnabar-dark: #922C22;
      --paper: #F4EDDE;
      --paper-2: #EAE0CC;
      --paper-3: #DED1B5;
      --copper: #B08D57;
      --copper-light: #CCA96E;
      --copper-dark: #8A6D40;
      --warm-gray: #6E6558;
      --warm-gray-light: #9A8F7E;
      --warm-gray-dark: #4A4338;
      --serif: 'Noto Serif SC', 'Songti SC', serif;
      --sans: 'Noto Sans SC', 'PingFang SC', sans-serif;
      --display: 'Ma Shan Zheng', 'Noto Serif SC', serif;
      --display-2: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--ink);
      color: var(--paper);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.7;
      overflow-x: hidden;
      cursor: none;
    }
    @media (max-width: 768px) {
      body { cursor: auto; }
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: none; border: none; background: none; color: inherit; }
    @media (max-width: 768px) { button { cursor: pointer; } }

    /* ========== 自定义光标 ========== */
    .cursor-outer, .cursor-inner, .cursor-glow {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 99999;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      will-change: transform, width, height, opacity;
    }
    .cursor-outer {
      width: 36px;
      height: 36px;
      border: 2px solid var(--paper);
      transition: width 0.25s cubic-bezier(0.23,1,0.32,1), height 0.25s cubic-bezier(0.23,1,0.32,1), border-color 0.25s, opacity 0.2s;
      mix-blend-mode: difference;
    }
    .cursor-inner {
      width: 6px;
      height: 6px;
      background: var(--cinnabar);
      transition: width 0.2s cubic-bezier(0.23,1,0.32,1), height 0.2s cubic-bezier(0.23,1,0.32,1), background 0.2s;
      box-shadow: 0 0 12px var(--cinnabar), 0 0 24px rgba(192,57,43,0.5);
    }
    .cursor-glow {
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, rgba(192,57,43,0.18) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    body.cursor-hover .cursor-outer {
      width: 56px;
      height: 56px;
      border-color: var(--copper);
    }
    body.cursor-hover .cursor-inner {
      width: 10px;
      height: 10px;
      background: var(--copper);
      box-shadow: 0 0 16px var(--copper), 0 0 32px rgba(176,141,87,0.6);
    }
    body.cursor-hover .cursor-glow { opacity: 1; }
    body.cursor-click .cursor-outer {
      width: 24px;
      height: 24px;
      border-color: var(--cinnabar-light);
    }
    body.cursor-click .cursor-inner {
      width: 14px;
      height: 14px;
    }
    .cursor-ripple {
      position: fixed;
      width: 10px; height: 10px;
      border-radius: 50%;
      border: 2px solid var(--cinnabar);
      pointer-events: none;
      z-index: 99998;
      transform: translate(-50%, -50%);
      animation: cursorRipple 0.6s cubic-bezier(0.23,1,0.32,1) forwards;
    }
    @keyframes cursorRipple {
      0% { width: 10px; height: 10px; opacity: 0.9; border-width: 2px; }
      100% { width: 80px; height: 80px; opacity: 0; border-width: 1px; }
    }
    @media (max-width: 768px) {
      .cursor-outer, .cursor-inner, .cursor-glow, .cursor-ripple { display: none; }
    }

    /* ========== 导航栏 ========== */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 24px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.4s, backdrop-filter 0.4s, padding 0.4s;
    }
    .nav.scrolled {
      background: rgba(27,23,18,0.85);
      backdrop-filter: blur(12px);
      padding: 16px 48px;
      border-bottom: 1px solid rgba(176,141,87,0.2);
    }
    .nav-logo {
      font-family: var(--serif);
      font-weight: 900;
      font-size: 22px;
      letter-spacing: 0.15em;
      color: var(--paper);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-logo-mark {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: var(--cinnabar);
      color: var(--paper);
      font-family: var(--display);
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 0;
      position: relative;
      box-shadow: inset 0 -3px 6px rgba(0,0,0,0.4), inset 0 2px 3px rgba(255,255,255,0.15), 0 4px 12px rgba(192,57,43,0.4);
    }
    .nav-logo-mark::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 40%);
      pointer-events: none;
    }
    .nav-menu {
      display: flex;
      gap: 40px;
      list-style: none;
    }
    .nav-menu a {
      font-size: 14px;
      letter-spacing: 0.1em;
      color: var(--paper);
      opacity: 0.7;
      transition: opacity 0.3s, color 0.3s;
      position: relative;
      padding: 4px 0;
    }
    .nav-menu a::after {
      content: '';
      position: absolute;
      left: 0; bottom: 0;
      width: 0; height: 1px;
      background: var(--copper);
      transition: width 0.3s cubic-bezier(0.23,1,0.32,1);
    }
    .nav-menu a:hover { opacity: 1; }
    .nav-menu a:hover::after { width: 100%; }
    .nav-cta {
      padding: 10px 22px;
      border: 1px solid var(--copper);
      color: var(--copper);
      font-size: 13px;
      letter-spacing: 0.1em;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }
    .nav-cta::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: var(--copper);
      transition: left 0.4s cubic-bezier(0.23,1,0.32,1);
      z-index: -1;
    }
    .nav-cta:hover { color: var(--ink); }
    .nav-cta:hover::before { left: 0; }

    .hamburger { display: none; flex-direction: column; gap: 5px; background: none; border: none; padding: 8px; }
    .hamburger span { display: block; width: 22px; height: 1.5px; background: var(--paper); transition: all 0.3s; }
    .mobile-menu { display: none; }

    @media (max-width: 768px) {
      .nav { padding: 16px 20px; }
      .nav.scrolled { padding: 12px 20px; }
      .nav-menu, .nav-cta { display: none; }
      .hamburger { display: flex; }
      .mobile-menu.open {
        display: flex;
        position: fixed;
        top: 0; right: 0; bottom: 0;
        width: 75%;
        max-width: 320px;
        background: var(--ink-900);
        flex-direction: column;
        padding: 80px 32px 32px;
        gap: 24px;
        z-index: 99;
        border-left: 1px solid rgba(176,141,87,0.2);
      }
      .mobile-menu a { font-size: 18px; letter-spacing: 0.1em; color: var(--paper); opacity: 0.8; }
      .mobile-menu-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.6);
        z-index: 98;
      }
      .mobile-menu-overlay.open { display: block; }
    }

    /* ========== Hero ========== */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--ink);
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .hero-bg img {
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0.25;
      filter: sepia(0.3) contrast(1.1) brightness(0.7);
    }
    .hero-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 0%, var(--ink) 75%);
    }
    .particles-canvas {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 0 24px;
      max-width: 1000px;
    }
    .hero-eyebrow {
      font-size: 13px;
      letter-spacing: 0.4em;
      color: var(--copper);
      margin-bottom: 32px;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s 0.2s cubic-bezier(0.23,1,0.32,1) forwards;
    }
    .hero-title {
      font-family: var(--display);
      font-size: clamp(60px, 12vw, 180px);
      font-weight: 400;
      line-height: 1;
      color: var(--paper);
      letter-spacing: 0.05em;
      margin-bottom: 24px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 1.2s 0.4s cubic-bezier(0.23,1,0.32,1) forwards;
    }
    .hero-title .char {
      display: inline-block;
      position: relative;
      text-shadow:
        1px 1px 0 rgba(0,0,0,0.8),
        2px 2px 0 rgba(0,0,0,0.4),
        0 0 40px rgba(244,237,222,0.15);
    }
    .hero-subtitle {
      font-family: var(--serif);
      font-size: clamp(18px, 2.5vw, 28px);
      font-weight: 400;
      color: var(--paper-2);
      letter-spacing: 0.3em;
      margin-bottom: 48px;
      opacity: 0.85;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s 0.7s cubic-bezier(0.23,1,0.32,1) forwards;
    }
    .hero-desc {
      font-size: 16px;
      max-width: 560px;
      margin: 0 auto 56px;
      color: var(--warm-gray-light);
      line-height: 2;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s 0.9s cubic-bezier(0.23,1,0.32,1) forwards;
    }
    .hero-actions {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s 1.1s cubic-bezier(0.23,1,0.32,1) forwards;
    }
    .btn-primary {
      padding: 16px 40px;
      background: var(--cinnabar);
      color: var(--paper);
      font-size: 14px;
      letter-spacing: 0.2em;
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.23,1,0.32,1);
      box-shadow: 0 8px 32px rgba(192,57,43,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
      font-weight: 500;
    }
    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      transition: left 0.6s;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(192,57,43,0.5), inset 0 1px 0 rgba(255,255,255,0.25);
      background: var(--cinnabar-light);
    }
    .btn-primary:hover::before { left: 100%; }
    .btn-ghost {
      padding: 16px 40px;
      border: 1px solid var(--copper);
      color: var(--copper-light);
      font-size: 14px;
      letter-spacing: 0.2em;
      transition: all 0.3s;
      position: relative;
    }
    .btn-ghost:hover {
      background: rgba(176,141,87,0.1);
      color: var(--paper);
      border-color: var(--copper-light);
    }
    .hero-scroll {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--warm-gray-light);
      font-size: 11px;
      letter-spacing: 0.3em;
      animation: bounceDown 2s 2s infinite;
    }
    .hero-scroll-line {
      width: 1px; height: 48px;
      background: linear-gradient(to bottom, var(--copper), transparent);
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounceDown {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(10px); }
    }

    /* ========== 通用 Section ========== */
    .section {
      padding: 140px 48px;
      position: relative;
    }
    .section-dark { background: var(--ink); }
    .section-paper { background: var(--paper); color: var(--ink); }
    .section-inner {
      max-width: 1280px;
      margin: 0 auto;
    }
    .section-label {
      font-size: 12px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--copper);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .section-paper .section-label { color: var(--cinnabar-dark); }
    .section-label::before {
      content: '';
      display: block;
      width: 40px; height: 1px;
      background: currentColor;
    }
    .section-title {
      font-family: var(--serif);
      font-size: clamp(36px, 5vw, 56px);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 24px;
      letter-spacing: 0.02em;
    }
    .section-desc {
      font-size: 16px;
      max-width: 600px;
      line-height: 2;
      color: var(--warm-gray-light);
    }
    .section-paper .section-desc { color: var(--warm-gray-dark); }

    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.8s cubic-bezier(0.23,1,0.32,1), transform 0.8s cubic-bezier(0.23,1,0.32,1);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }

    /* ========== 铸字工艺 ========== */
    .craft-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      margin-top: 64px;
      background: rgba(176,141,87,0.15);
    }
    .craft-card {
      background: var(--ink-900);
      padding: 48px 36px;
      position: relative;
      overflow: hidden;
      transition: all 0.5s cubic-bezier(0.23,1,0.32,1);
    }
    .craft-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 3px;
      background: var(--cinnabar);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.5s cubic-bezier(0.23,1,0.32,1);
    }
    .craft-card:hover {
      background: var(--ink-800);
      transform: translateY(-4px);
    }
    .craft-card:hover::before { transform: scaleX(1); }
    .craft-num {
      font-family: var(--serif);
      font-size: 72px;
      font-weight: 900;
      color: var(--copper);
      opacity: 0.25;
      line-height: 1;
      margin-bottom: 24px;
      transition: all 0.5s;
    }
    .craft-card:hover .craft-num {
      opacity: 0.5;
      transform: translateX(4px);
    }
    .craft-name {
      font-family: var(--serif);
      font-size: 26px;
      font-weight: 700;
      color: var(--paper);
      margin-bottom: 16px;
      letter-spacing: 0.05em;
    }
    .craft-en {
      font-size: 11px;
      letter-spacing: 0.3em;
      color: var(--copper);
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .craft-desc {
      font-size: 14px;
      line-height: 2;
      color: var(--warm-gray-light);
    }
    .craft-icon {
      width: 48px; height: 48px;
      margin-bottom: 20px;
      stroke: var(--copper);
      transition: stroke 0.3s, transform 0.4s;
    }
    .craft-card:hover .craft-icon {
      stroke: var(--cinnabar-light);
      transform: scale(1.1) rotate(-5deg);
    }
    @media (max-width: 900px) {
      .craft-grid { grid-template-columns: 1fr; }
      .craft-card { padding: 36px 28px; }
    }

    /* ========== 在线铸字机 ========== */
    .typecaster-section {
      background: var(--paper);
      color: var(--ink);
      padding: 140px 48px;
      position: relative;
      overflow: hidden;
    }
    .typecaster-section::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--copper), transparent);
    }
    .typecaster-section::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--copper), transparent);
    }
    .typecaster-wrap {
      max-width: 1000px;
      margin: 0 auto;
    }
    .typecaster-header {
      text-align: center;
      margin-bottom: 56px;
    }
    .typecaster-title {
      font-family: var(--serif);
      font-size: clamp(36px, 5vw, 52px);
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--ink);
    }
    .typecaster-subtitle {
      font-size: 15px;
      color: var(--warm-gray-dark);
      letter-spacing: 0.1em;
    }
    .typecaster-input-row {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      align-items: center;
      flex-wrap: wrap;
    }
    .typecaster-input {
      flex: 1;
      min-width: 200px;
      padding: 16px 20px;
      font-family: var(--serif);
      font-size: 18px;
      background: var(--paper-2);
      border: 1px solid var(--paper-3);
      color: var(--ink);
      outline: none;
      transition: all 0.3s;
      letter-spacing: 0.1em;
    }
    .typecaster-input:focus {
      border-color: var(--cinnabar);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(192,57,43,0.1);
    }
    .typecaster-controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 36px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .control-label {
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--warm-gray-dark);
      text-transform: uppercase;
    }
    .control-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: var(--paper-3);
      border-radius: 2px;
      outline: none;
    }
    .control-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--cinnabar);
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(192,57,43,0.4);
      transition: transform 0.2s;
    }
    .control-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
    .control-value {
      font-family: var(--serif);
      font-size: 14px;
      color: var(--cinnabar);
      font-weight: 700;
    }
    .typecaster-display {
      background: var(--ink);
      padding: 64px 40px;
      min-height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.6);
    }
    .typecaster-display::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h60v60H0z' fill='none'/%3E%3Cpath d='M30 0v60M0 30h60' stroke='rgba(176,141,87,0.06)' stroke-width='1'/%3E%3C/svg%3E");
      pointer-events: none;
    }
    .lead-type {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--size, 80px);
      height: var(--size, 80px);
      font-family: var(--serif);
      font-weight: var(--weight, 700);
      font-size: calc(var(--size, 80px) * 0.55);
      color: var(--paper);
      background: linear-gradient(145deg, #5a544a 0%, #2e2a24 40%, #1a1814 60%, #0a0908 100%);
      position: relative;
      box-shadow:

    /* ========== 减少动效 ========== */

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ========== 减少动效检测 ==========
    const prefersReducedMotion = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ========== 公共 hooks ==========
    function useVisibilityChange(onHide, onShow) {
      useEffect(() => {
        const handler = () => {
          if (document.hidden) onHide && onHide();
          else onShow && onShow();
        };
        document.addEventListener('visibilitychange', handler);
        return () => document.removeEventListener('visibilitychange', handler);
      }, [onHide, onShow]);
    }

    // ========== 自定义光标 ==========
    function CustomCursor() {
      const outerRef = useRef(null);
      const innerRef = useRef(null);
      const glowRef = useRef(null);
      const rafRef = useRef(null);
      const mouseRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
      const posRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
      const innerPosRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });

      useEffect(() => {
        if (prefersReducedMotion) return;
        if (window.innerWidth <= 768) return;

        // 初始化在屏幕中央
        posRef.current = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        innerPosRef.current = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        const onMove = (e) => {
          mouseRef.current = { x: e.clientX, y: e.clientY };
        };

        const onClick = (e) => {
          const ripple = document.createElement('div');
          ripple.className = 'cursor-ripple';
          ripple.style.left = e.clientX + 'px';
          ripple.style.top = e.clientY + 'px';
          document.body.appendChild(ripple);
          setTimeout(() => ripple.remove(), 600);

          document.body.classList.add('cursor-click');
          setTimeout(() => document.body.classList.remove('cursor-click'), 150);
        };

        const onMouseOver = (e) => {
          const target = e.target.closest('a, button, .type-cell, .craft-card, .equipment-card, .compositor-slot.filled, .lead-type, input, .library-tab, .reset-btn');
          if (target) {
            document.body.classList.add('cursor-hover');
          }
        };
        const onMouseOut = (e) => {
          const target = e.target.closest('a, button, .type-cell, .craft-card, .equipment-card, .compositor-slot.filled, .lead-type, input, .library-tab, .reset-btn');
          if (target) {
            document.body.classList.remove('cursor-hover');
          }
        };

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mousedown', onClick);
        document.addEventListener('mouseover', onMouseOver);
        document.addEventListener('mouseout', onMouseOut);

        // RAF 积分器 - 弹簧阻尼模型
        const springStiffness = 0.15; // 外环柔和
        const damping = 0.85;
        const innerStiffness = 0.35; // 内点灵敏
        let velX = 0, velY = 0;
        let innerVelX = 0, innerVelY = 0;

        let running = true;
        const animate = () => {
          if (!running) return;
          const target = mouseRef.current;

          // 外环 - 弹簧阻尼
          const dx = target.x - posRef.current.x;
          const dy = target.y - posRef.current.y;
          velX = (velX + dx * springStiffness) * damping;
          velY = (velY + dy * springStiffness) * damping;
          posRef.current.x += velX;
          posRef.current.y += velY;

          if (outerRef.current) {
            outerRef.current.style.transform = `translate(${posRef.current.x}px, ${posRef.current.y}px) translate(-50%, -50%)`;
          }

          // 内点 - 更灵敏
          const idx = target.x - innerPosRef.current.x;
          const idy = target.y - innerPosRef.current.y;
          innerVelX = (innerVelX + idx * innerStiffness) * 0.8;
          innerVelY = (innerVelY + idy * innerStiffness) * 0.8;
          innerPosRef.current.x += innerVelX;
          innerPosRef.current.y += innerVelY;

          if (innerRef.current) {
            innerRef.current.style.transform = `translate(${innerPosRef.current.x}px, ${innerPosRef.current.y}px) translate(-50%, -50%)`;
          }

          // 外发光 - 滞后更多
          if (glowRef.current) {
            const gx = posRef.current.x + (target.x - posRef.current.x) * 0.3;
            const gy = posRef.current.y + (target.y - posRef.current.y) * 0.3;
            glowRef.current.style.transform = `translate(${gx}px, ${gy}px) translate(-50%, -50%)`;
          }

          rafRef.current = requestAnimationFrame(animate);
        };
        rafRef.current = requestAnimationFrame(animate);

        const onHide = () => { running = false; if (rafRef.current) cancelAnimationFrame(rafRef.current); };
        const onShow = () => { running = true; if (!rafRef.current) rafRef.current = requestAnimationFrame(animate); };
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) onHide();
          else onShow();
        });

        return () => {
          running = false;
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mousedown', onClick);
          document.removeEventListener('mouseover', onMouseOver);
          document.removeEventListener('mouseout', onMouseOut);
        };
      }, []);

      if (prefersReducedMotion || typeof window !== 'undefined' && window.innerWidth <= 768) return null;

      return (
        <>
          <div ref={glowRef} className="cursor-glow" />
          <div ref={outerRef} className="cursor-outer" style={{ left: '50%', top: '50%' }} />
          <div ref={innerRef} className="cursor-inner" style={{ left: '50%', top: '50%' }} />
        </>
      );
    }

    // ========== 粒子系统 ==========
    function ParticleCanvas() {
      const canvasRef = useRef(null);
      const rafRef = useRef(null);
      const mouseRef = useRef({ x: 0, y: 0 });
      const particlesRef = useRef([]);
      const runningRef = useRef(true);

      useEffect(() => {
        if (prefersReducedMotion) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const resize = () => {
          canvas.width = canvas.offsetWidth * window.devicePixelRatio;
          canvas.height = canvas.offsetHeight * window.devicePixelRatio;
          ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        };
        resize();
        window.addEventListener('resize', resize);

        // 初始化粒子 - 模拟灰尘/墨粉
        const PARTICLE_COUNT = 80;
        const w = () => canvas.offsetWidth;
        const h = () => canvas.offsetHeight;
        particlesRef.current = Array.from({ length: PARTICLE_COUNT }, () => ({
          x: Math.random() * w(),
          y: Math.random() * h(),
          vx: (Math.random() - 0.5) * 0.3,
          vy: -Math.random() * 0.4 - 0.1, // 缓慢上升
          size: Math.random() * 2 + 0.5,
          opacity: Math.random() * 0.5 + 0.2,
          drift: Math.random() * 0.02 + 0.01,
          phase: Math.random() * Math.PI * 2,
          color: Math.random() > 0.7 ? '#C0392B' : (Math.random() > 0.5 ? '#B08D57' : '#F4EDDE')
        }));

        const onMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          mouseRef.current = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        };
        canvas.addEventListener('mousemove', onMove);

        let time = 0;
        const animate = () => {
          if (!runningRef.current) return;
          time += 0.016;
          ctx.clearRect(0, 0, w(), h());

          particlesRef.current.forEach((p, i) => {
            // 位置更新
            p.x += p.vx + Math.sin(time * p.drift + p.phase) * 0.3;
            p.y += p.vy;

            // 鼠标反平方引力（轻微吸引）
            const dx = mouseRef.current.x - p.x;
            const dy = mouseRef.current.y - p.y;
            const distSq = dx * dx + dy * dy;
            if (distSq < 20000 && distSq > 1) {
              const dist = Math.sqrt(distSq);
              const force = 200 / distSq;
              p.x += (dx / dist) * force;
              p.y += (dy / dist) * force;
            }

            // 边界回收
            if (p.y < -10) { p.y = h() + 10; p.x = Math.random() * w(); }
            if (p.x < -10) p.x = w() + 10;
            if (p.x > w() + 10) p.x = -10;

            // 绘制
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.opacity * (0.6 + Math.sin(time + p.phase) * 0.4);
            ctx.fill();
          });
          ctx.globalAlpha = 1;

          rafRef.current = requestAnimationFrame(animate);
        };
        rafRef.current = requestAnimationFrame(animate);

        const onVisibility = () => {
          if (document.hidden) {
            runningRef.current = false;
            if (rafRef.current) cancelAnimationFrame(rafRef.current);
          } else {
            runningRef.current = true;
            rafRef.current = requestAnimationFrame(animate);
          }
        };
        document.addEventListener('visibilitychange', onVisibility);

        return () => {
          runningRef.current = false;
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          window.removeEventListener('resize', resize);
          canvas.removeEventListener('mousemove', onMove);
          document.removeEventListener('visibilitychange', onVisibility);
        };
      }, []);

      return <canvas ref={canvasRef} className="particles-canvas" />;
    }

    // ========== 滚动渐入 ==========
    function useReveal() {
      useEffect(() => {
        if (prefersReducedMotion) {
          document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
          return;
        }
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        return () => observer.disconnect();
      }, []);
    }

    // ========== 滚动进度条 ==========
    function ScrollProgress() {
      const ref = useRef(null);
      const rafRef = useRef(null);

      useEffect(() => {
        let ticking = false;
        const update = () => {
          const scrolled = window.scrollY;
          const total = document.documentElement.scrollHeight - window.innerHeight;
          const pct = total > 0 ? scrolled / total : 0;
          if (ref.current) {
            ref.current.style.transform = `scaleX(${pct})`;
          }
          ticking = false;
        };
        const onScroll = () => {
          if (!ticking) {
            rafRef.current = requestAnimationFrame(update);
            ticking = true;
          }
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        update();
        return () => {
          window.removeEventListener('scroll', onScroll);
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
        };
      }, []);

      return <div ref={ref} className="scroll-progress" style={{ width: '100%' }} />;
    }

    // ========== 数字计数 ==========
    function CountUp({ end, duration = 2000, suffix = '' }) {
      const ref = useRef(null);
      const [val, setVal] = useState(0);
      const startedRef = useRef(false);
      const rafRef = useRef(null);
      const startTimeRef = useRef(0);

      useEffect(() => {
        const el = ref.current;
        if (!el) return;

        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting && !startedRef.current) {
              startedRef.current = true;
              if (prefersReducedMotion) {
                setVal(end);
                return;
              }
              startTimeRef.current = performance.now();
              const step = (now) => {
                const elapsed = now - startTimeRef.current;
                const t = Math.min(elapsed / duration, 1);
                // easeOutCubic
                const eased = 1 - Math.pow(1 - t, 3);
                setVal(Math.floor(eased * end));
                if (t < 1) rafRef.current = requestAnimationFrame(step);
              };
              rafRef.current = requestAnimationFrame(step);
            }
          });
        }, { threshold: 0.5 });

        observer.observe(el);
        return () => {
          observer.disconnect();
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
        };
      }, [end, duration]);

      return <span ref={ref}>{val}{suffix}</span>;
    }

    // ========== 打字机效果 ==========
    function Typewriter({ text, speed = 120, delay = 500 }) {
      const [displayed, setDisplayed] = useState('');
      const timeoutRef = useRef(null);

      useEffect(() => {
        let i = 0;
        const type = () => {
          if (i < text.length) {
            setDisplayed(text.slice(0, i + 1));
            i++;
            timeoutRef.current = setTimeout(type, speed + Math.random() * 60);
          }
        };
        timeoutRef.current = setTimeout(type, delay);
        return () => { if (timeoutRef.current) clearTimeout(timeoutRef.current); };
      }, [text, speed, delay]);

      return (
        <span>
          {displayed}
          <span className="typewriter-cursor" />
        </span>
      );
    }

    // ========== 拣字盘 ==========
    function CompositorCase() {
      const commonChars = '之乎者也以而为其在有是人我此来将如自子所可道得云天日月光华山水风金木火土王大中小上下前后左右东西南北春秋冬夏';
      const totalSlots = 75; // 15 * 5
      const [filledSlots, setFilledSlots] = useState(() => {
        const arr = new Array(totalSlots).fill(null);
        // 预置一些字
        for (let i = 0; i < 30; i++) {
          arr[i] = commonChars[i % commonChars.length];
        }
        return arr;
      });

      const handleSlotClick = (index) => {
        const newSlots = [...filledSlots];
        if (newSlots[index]) {
          newSlots[index] = null;
        } else {
          newSlots[index] = commonChars[Math.floor(Math.random() * commonChars.length)];
        }
        setFilledSlots(newSlots);
      };

      const handleReset = () => {
        const arr = new Array(totalSlots).fill(null);
        for (let i = 0; i < 30; i++) {
          arr[i] = commonChars[i % commonChars.length];
        }
        setFilledSlots(arr);
      };

      const filledCount = filledSlots.filter(s => s !== null).length;

      // 5 行 15 列
      const rows = [];
      for (let r = 0; r < 5; r++) {
        rows.push(filledSlots.slice(r * 15, (r + 1) * 15));
      }

      return (
        <section className="compositor-section">
          <div className="section-inner">
            <div className="reveal" style={{ textAlign: 'center', marginBottom: '16px' }}>
              <div className="section-label" style={{ justifyContent: 'center', display: 'flex' }}>COMPOSITOR · 拣字体验</div>
              <h2 className="section-title">手拣铅字，排活版</h2>
              <p className="section-desc" style={{ margin: '0 auto' }}>
                点击空格置入铅字，点击已填充的铅字取出。体验古代排版工人的日常。
              </p>
            </div>
            <div className="compositor-case reveal">
              {rows.map((row, ri) => (
                <div key={ri} className="compositor-rack">
                  {row.map((ch, ci) => {
                    const idx = ri * 15 + ci;
                    return (
                      <div
                        key={ci}
                        className={`compositor-slot ${ch ? 'filled' : ''}`}
                        onClick={() => handleSlotClick(idx)}
                      >
                        {ch || <span className="compositor-empty">·</span>}
                      </div>
                    );
                  })}
                </div>
              ))}
              <div className="compositor-controls">
                <span className="compositor-hint">
                  已拣 <span className="compositor-count">{filledCount}</span> / {totalSlots} 枚铅字
                </span>
                <button className="reset-btn" onClick={handleReset}>重 新 拣 字</button>
              </div>
            </div>
          </div>
        </section>
      );
    }

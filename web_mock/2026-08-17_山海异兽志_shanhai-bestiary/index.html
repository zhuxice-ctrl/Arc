<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>山海异兽志 · 东方神兽沉浸图鉴展</title>
<meta name="creative-medium" content="interactive-prototype" />
<meta name="description" content="山海异兽志——一场跨越时空的东方神兽沉浸图鉴展。应龙、白泽、九尾狐、烛阴、帝江、毕方，从《山海经》古卷中苏醒。" />
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" />
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
:root{
  --ink: #140e0a;        /* 玄墨黑 */
  --ink-2: #1e1712;
  --ink-3: #2a2119;
  --paper: #f2ead6;      /* 宣纸米白 */
  --paper-2: #e8dfc8;
  --paper-3: #d9cea9;
  --cinnabar: #b8342a;   /* 朱砂红 */
  --cinnabar-light: #d94e3e;
  --cinnabar-deep: #8a2319;
  --ochre: #c89a3c;      /* 赭石金 */
  --ochre-light: #e2b858;
  --ochre-deep: #8c6a20;
  --jade: #4a7a5a;       /* 石青辅色 */
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ width:100%; overflow-x:hidden; background:var(--ink); color:var(--paper); font-family:"Noto Serif SC","Songti SC",serif; }
body{ cursor:none; }
::selection{ background:var(--cinnabar); color:var(--paper); }

img{ max-width:100%; display:block; }
button{ font-family:inherit; border:none; background:none; cursor:none; color:inherit; }
a{ color:inherit; text-decoration:none; cursor:none; }
ul,ol{ list-style:none; }

/* ------- Paper texture base ------- */
body::before{
  content:"";
  position:fixed; inset:0;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(200,154,60,0.06), transparent 55%),
    radial-gradient(ellipse at 80% 70%, rgba(184,52,42,0.05), transparent 60%),
    var(--ink);
  pointer-events:none; z-index:0;
}
body::after{
  content:"";
  position:fixed; inset:0;
  background-image:
    repeating-linear-gradient(90deg, rgba(242,234,214,0.015) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(0deg, rgba(242,234,214,0.012) 0 1px, transparent 1px 3px);
  pointer-events:none; z-index:0;
  mix-blend-mode:screen;
}

/* ------- Custom cursor ------- */
.cursor-ring{
  position:fixed; pointer-events:none; z-index:9999;
  width:36px; height:36px; border:1.5px solid var(--paper);
  border-radius:50%; left:0; top:0;
  transform:translate(-50%,-50%);
  transition: width .35s cubic-bezier(.2,.9,.2,1), height .35s cubic-bezier(.2,.9,.2,1),
              border-color .3s, background-color .3s, opacity .4s;
  mix-blend-mode:difference;
  opacity:.9;
}
.cursor-dot{
  position:fixed; pointer-events:none; z-index:10000;
  width:8px; height:8px; border-radius:50%;
  background:var(--ochre-light);
  left:0; top:0; transform:translate(-50%,-50%);
  box-shadow:0 0 12px var(--ochre), 0 0 24px rgba(200,154,60,.5);
  transition: background-color .25s, box-shadow .25s, width .25s, height .25s;
}
.cursor-trail{
  position:fixed; pointer-events:none; z-index:9998;
  width:6px; height:6px; border-radius:50%;
  background:var(--cinnabar);
  left:0; top:0; transform:translate(-50%,-50%);
  opacity:.6;
  mix-blend-mode:screen;
}
.cursor-hover .cursor-ring{
  width:58px; height:58px;
  border-color:var(--ochre-light);
  background:rgba(200,154,60,.08);
}
.cursor-hover .cursor-dot{
  width:5px; height:5px;
  background:var(--cinnabar-light);
  box-shadow:0 0 8px var(--cinnabar-light), 0 0 20px rgba(184,52,42,.6);
}
.cursor-click .cursor-ring{
  width:64px; height:64px;
  border-color:var(--cinnabar-light);
}

/* click ripple */
.ripple{
  position:fixed; pointer-events:none; z-index:9997;
  border-radius:50%;
  border:1.5px solid var(--cinnabar-light);
  transform:translate(-50%,-50%) scale(0);
  opacity:1;
  animation: rippleOut .9s cubic-bezier(.2,.9,.2,1) forwards;
  mix-blend-mode:screen;
}
@keyframes rippleOut{
  0%{ transform:translate(-50%,-50%) scale(0); opacity:1; border-width:2px; }
  100%{ transform:translate(-50%,-50%) scale(5); opacity:0; border-width:.5px; }
}

/* ------- Nav ------- */
.nav{
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:22px 48px;
  transition: background .4s, backdrop-filter .4s, padding .4s;
}
.nav.scrolled{
  background:rgba(20,14,10,.82);
  backdrop-filter:blur(16px) saturate(1.4);
  padding:14px 48px;
  border-bottom:1px solid rgba(200,154,60,.18);
}
.nav-logo{
  display:flex; align-items:center; gap:14px;
  font-family:"Ma Shan Zheng",cursive;
  font-size:26px; letter-spacing:4px;
  color:var(--paper);
}
.nav-logo-seal{
  width:36px; height:36px;
  background:var(--cinnabar);
  display:grid; place-items:center;
  color:var(--paper);
  font-family:"Ma Shan Zheng",cursive;
  font-size:16px;
  transform:rotate(-3deg);
  box-shadow:0 2px 12px rgba(184,52,42,.4);
  position:relative;
}
.nav-logo-seal::after{
  content:""; position:absolute; inset:-2px;
  border:1px solid var(--cinnabar-light);
  opacity:.6;
}
.nav-links{
  display:flex; gap:42px;
  font-size:15px; letter-spacing:3px;
  color:var(--paper-2);
}
.nav-links a{
  position:relative; padding:6px 2px;
  transition: color .3s;
}
.nav-links a::after{
  content:""; position:absolute; bottom:0; left:0; right:0;
  height:1px; background:var(--ochre);
  transform:scaleX(0); transform-origin:center;
  transition: transform .4s cubic-bezier(.2,.9,.2,1);
}
.nav-links a:hover{ color:var(--ochre-light); }
.nav-links a:hover::after{ transform:scaleX(1); }
.nav-cta{
  padding:10px 22px;
  border:1px solid var(--ochre);
  color:var(--ochre-light);
  font-size:14px; letter-spacing:3px;
  position:relative; overflow:hidden;
  transition: color .35s;
}
.nav-cta::before{
  content:""; position:absolute; inset:0;
  background:var(--cinnabar);
  transform:translateX(-101%);
  transition: transform .5s cubic-bezier(.6,.2,.1,1);
  z-index:-1;
}
.nav-cta:hover{ color:var(--paper); border-color:var(--cinnabar-light); }
.nav-cta:hover::before{ transform:translateX(0); }

.hamburger{ display:none; }

/* ------- Hero ------- */
.hero{
  position:relative; width:100%; height:100vh; min-height:720px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  overflow:hidden;
}
.hero-canvas{
  position:absolute; inset:0;
  width:100%; height:100%;
  pointer-events:none;
}
.hero-ink-bg{
  position:absolute; inset:-10%;
  background:
    radial-gradient(ellipse 60% 50% at 50% 45%, rgba(184,52,42,.12), transparent 70%),
    radial-gradient(ellipse 40% 60% at 70% 60%, rgba(200,154,60,.08), transparent 70%),
    radial-gradient(ellipse 50% 40% at 30% 70%, rgba(74,122,90,.06), transparent 65%);
  filter:blur(40px);
  animation: inkDrift 18s ease-in-out infinite alternate;
}
@keyframes inkDrift{
  0%{ transform:translate(0,0) scale(1); }
  100%{ transform:translate(3%, -2%) scale(1.05); }
}

.hero-content{
  position:relative; z-index:2;
  text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:28px;
}
.hero-title{
  font-family:"Ma Shan Zheng",cursive;
  font-size:clamp(68px, 11vw, 168px);
  line-height:.95;
  color:var(--paper);
  letter-spacing:12px;
  text-indent:12px;
  text-shadow:0 0 60px rgba(200,154,60,.3);
  position:relative;
}
.hero-title span{
  display:inline-block;
  opacity:0; transform:translateY(40px);
  animation: titleRise 1.2s cubic-bezier(.2,.8,.2,1) forwards;
}
.hero-title span:nth-child(1){ animation-delay:.2s; }
.hero-title span:nth-child(2){ animation-delay:.35s; }
.hero-title span:nth-child(3){ animation-delay:.5s; }
.hero-title span:nth-child(4){ animation-delay:.65s; }
.hero-title span:nth-child(5){ animation-delay:.8s; }
@keyframes titleRise{
  to{ opacity:1; transform:translateY(0); }
}

.hero-title::before, .hero-title::after{
  content:"";
  position:absolute; top:50%;
  width:80px; height:1px;
  background:linear-gradient(90deg, transparent, var(--ochre), transparent);
}
.hero-title::before{ left:-120px; }
.hero-title::after{ right:-120px; }

.hero-subtitle{
  font-family:"ZCOOL XiaoWei",serif;
  font-size:clamp(16px, 1.6vw, 22px);
  letter-spacing:14px;
  text-indent:14px;
  color:var(--ochre-light);
  opacity:0;
  animation: fadeIn .8s ease forwards;
  animation-delay:1.4s;
}
@keyframes fadeIn{ to{ opacity:1; } }

.hero-en{
  font-size:12px; letter-spacing:8px;
  color:var(--paper-3);
  text-transform:uppercase;
  opacity:0;
  animation: fadeIn .8s ease forwards;
  animation-delay:1.6s;
}

.hero-desc{
  max-width:560px;
  font-size:15px; line-height:2;
  color:var(--paper-2);
  letter-spacing:2px;
  text-align:center;
  opacity:0;
  animation: fadeInUp .9s ease forwards;
  animation-delay:1.8s;
}
@keyframes fadeInUp{
  from{ opacity:0; transform:translateY(20px); }
  to{ opacity:1; transform:translateY(0); }
}

.hero-scroll{
  position:absolute; bottom:40px; left:50%;
  transform:translateX(-50%);
  z-index:2;
  display:flex; flex-direction:column; align-items:center; gap:12px;
  opacity:0;
  animation: fadeIn .8s ease forwards;
  animation-delay:2.2s;
}
.hero-scroll-text{
  font-size:11px; letter-spacing:5px;
  color:var(--paper-3);
}
.hero-scroll-line{
  width:1px; height:48px;
  background:linear-gradient(to bottom, var(--ochre), transparent);
  position:relative; overflow:hidden;
}
.hero-scroll-line::after{
  content:""; position:absolute; top:-48px; left:0; width:1px; height:48px;
  background:var(--cinnabar-light);
  animation: scrollDown 2.2s cubic-bezier(.6,.2,.1,1) infinite;
}
@keyframes scrollDown{
  0%{ top:-48px; }
  100%{ top:48px; }
}

/* floating beasts in hero */
.hero-beast{
  position:absolute;
  opacity:.06;
  font-family:"Ma Shan Zheng",cursive;
  font-size:clamp(80px, 14vw, 200px);
  color:var(--ochre);
  pointer-events:none;
  user-select:none;
  will-change:transform;
}

/* ------- Section common ------- */
.section{
  position:relative;
  padding:160px 8%;
  z-index:2;
}
.section-label{
  display:flex; align-items:center; gap:16px;
  font-size:13px; letter-spacing:6px;
  color:var(--ochre-light);
  margin-bottom:20px;
}
.section-label-num{
  font-family:"ZCOOL XiaoWei",serif;
  font-size:15px;
  color:var(--cinnabar-light);
}
.section-label-line{
  flex:0 0 48px; height:1px;
  background:var(--ochre);
  opacity:.5;
}
.section-title{
  font-family:"Ma Shan Zheng",cursive;
  font-size:clamp(40px, 5vw, 72px);
  color:var(--paper);
  letter-spacing:8px;
  margin-bottom:16px;
  line-height:1.1;
}
.section-en{
  font-size:13px; letter-spacing:5px;
  color:var(--paper-3);
  margin-bottom:56px;
  text-transform:uppercase;
}

/* ------- Prologue ------- */
.prologue{
  background:linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
  position:relative;
}
.prologue-grid{
  display:grid;
  grid-template-columns: 1fr 1.2fr;
  gap:80px;
  align-items:start;
}
.prologue-left{
  position:sticky; top:120px;
}
.prologue-scroll{
  position:relative;
  background:linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
  padding:60px 48px;
  color:var(--ink);
  box-shadow:
    0 30px 60px rgba(0,0,0,.5),
    inset 0 0 80px rgba(184,52,42,.08);
  transform:rotate(-1.5deg);
}
.prologue-scroll::before, .prologue-scroll::after{
  content:""; position:absolute; left:-12px; right:-12px;
  height:24px;
  background:linear-gradient(180deg, var(--ochre-deep), var(--ochre) 50%, var(--ochre-deep));
  border-radius:3px;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}
.prologue-scroll::before{ top:-12px; }
.prologue-scroll::after{ bottom:-12px; }
.prologue-scroll-title{
  font-family:"Ma Shan Zheng",cursive;
  font-size:36px; text-align:center;
  margin-bottom:8px;
  color:var(--ink);
  letter-spacing:6px;
}
.prologue-scroll-sub{
  text-align:center; font-size:12px; letter-spacing:4px;
  color:var(--cinnabar-deep);
  margin-bottom:28px;
  padding-bottom:20px;
  border-bottom:1px solid rgba(20,14,10,.15);
}
.prologue-scroll p{
  font-size:15px; line-height:2.2;
  color:var(--ink-2);
  letter-spacing:1.5px;
  text-indent:2em;
  margin-bottom:16px;
}
.prologue-seal{
  width:56px; height:56px;
  margin:20px auto 0;
  background:var(--cinnabar);
  display:grid; place-items:center;
  color:var(--paper);
  font-family:"Ma Shan Zheng",cursive;
  font-size:18px;
  transform:rotate(4deg);
  box-shadow:0 4px 12px rgba(138,35,25,.3);
  letter-spacing:0;
  line-height:1.1;
  text-align:center;
}

.prologue-right{
  display:flex; flex-direction:column; gap:80px;
  padding-top:20px;
}
.prologue-item{
  display:grid;
  grid-template-columns: auto 1fr;
  gap:32px;
  padding-left:24px;
  border-left:1px solid rgba(200,154,60,.2);
}
.prologue-item-num{
  font-family:"Ma Shan Zheng",cursive;
  font-size:52px;
  color:var(--cinnabar);
  line-height:1;
  opacity:.7;
}
.prologue-item-title{
  font-family:"ZCOOL XiaoWei",serif;
  font-size:24px;
  color:var(--paper);
  letter-spacing:4px;
  margin-bottom:12px;
}
.prologue-item-text{
  font-size:14px; line-height:2;
  color:var(--paper-2);
  letter-spacing:1px;
}

/* ------- Compendium ------- */
.compendium{
  background:var(--ink);
  position:relative;
}
.compendium-header{
  display:flex; justify-content:space-between; align-items:flex-end;
  margin-bottom:60px;
  flex-wrap:wrap; gap:24px;
}
.compendium-filters{
  display:flex; gap:12px; flex-wrap:wrap;
}
.chip{
  padding:8px 20px;
  border:1px solid rgba(200,154,60,.3);
  border-radius:0;
  font-size:13px; letter-spacing:3px;
  color:var(--paper-2);
  transition: all .35s cubic-bezier(.2,.9,.2,1);
  position:relative;
}
.chip:hover{
  border-color:var(--ochre);
  color:var(--ochre-light);
}
.chip.active{
  background:var(--cinnabar);
  border-color:var(--cinnabar);
  color:var(--paper);
  box-shadow:0 4px 16px rgba(184,52,42,.4);
}

.beast-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));
  gap:28px;
}
.beast-card{
  position:relative;
  background:linear-gradient(160deg, var(--ink-2), var(--ink-3));
  border:1px solid rgba(200,154,60,.15);
  padding:0;
  overflow:hidden;
  transition: transform .6s cubic-bezier(.2,.9,.2,1), border-color .4s, box-shadow .5s;
  transform-style:preserve-3d;
  will-change:transform;
}
.beast-card:hover{
  border-color:rgba(200,154,60,.5);
  box-shadow:
    0 20px 50px rgba(0,0,0,.5),
    0 0 40px rgba(200,154,60,.08);
}
.beast-card-top{
  position:relative;
  height:220px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 60%, rgba(184,52,42,.2), transparent 70%),
    linear-gradient(180deg, var(--ink-3), var(--ink-2));
  display:flex; align-items:center; justify-content:center;
}
.beast-char{
  font-family:"Ma Shan Zheng",cursive;
  font-size:140px;
  color:var(--paper);
  opacity:.08;
  position:absolute;
  user-select:none;
  transition: transform 1s cubic-bezier(.2,.9,.2,1), opacity .5s;
}
.beast-card:hover .beast-char{
  transform:scale(1.1) rotate(3deg);
  opacity:.15;
}
.beast-particle{
  position:absolute; inset:0;
  pointer-events:none;
}
.beast-glow{
  position:absolute; inset:0;
  background:radial-gradient(circle at 50% 50%, rgba(200,154,60,.15), transparent 60%);
  opacity:0;
  transition: opacity .5s;
}
.beast-card:hover .beast-glow{ opacity:1; }

.beast-card-body{
  padding:28px 28px 32px;
}
.beast-row{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:16px;
}
.beast-name{
  font-family:"Ma Shan Zheng",cursive;
  font-size:36px;
  color:var(--paper);
  letter-spacing:4px;
}
.beast-tag{
  font-size:11px; letter-spacing:3px;
  padding:4px 10px;
  border:1px solid var(--cinnabar);
  color:var(--cinnabar-light);
}
.beast-origin{
  font-size:12px; letter-spacing:3px;
  color:var(--ochre-light);
  margin-bottom:14px;
}
.beast-desc{
  font-size:13px; line-height:1.9;
  color:var(--paper-2);
  letter-spacing:.8px;
  margin-bottom:20px;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.beast-stats{
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding-top:16px;
  border-top:1px solid rgba(242,234,214,.08);
}
.beast-stat{
  text-align:center;
}
.beast-stat-label{
  font-size:10px; letter-spacing:2px;
  color:var(--paper-3);
  margin-bottom:4px;
}
.beast-stat-bar{
  height:3px; background:rgba(242,234,214,.1);
  position:relative; overflow:hidden;
}
.beast-stat-bar::after{
  content:""; position:absolute; left:0; top:0; bottom:0;
  background:linear-gradient(90deg, var(--cinnabar), var(--ochre));
  width:0;
  transition: width 1.2s cubic-bezier(.2,.9,.2,1);
}
.beast-card.visible .beast-stat-bar::after{ width:var(--val, 60%); }

/* scale shimmer sweep */
.beast-shimmer{
  position:absolute; inset:0;
  background:linear-gradient(
    105deg,
    transparent 40%,
    rgba(200,154,60,.12) 50%,
    transparent 60%
  );
  transform:translateX(-100%);
  transition: none;
  pointer-events:none;
}
.beast-card:hover .beast-shimmer{
  animation: shimmerSweep 1.4s cubic-bezier(.2,.9,.2,1) forwards;
}
@keyframes shimmerSweep{
  0%{ transform:translateX(-100%); }
  100%{ transform:translateX(100%); }
}

/* ------- Modal ------- */
.modal-backdrop{
  position:fixed; inset:0; z-index:200;
  background:rgba(10,7,5,.85);
  backdrop-filter:blur(12px);
  display:flex; align-items:center; justify-content:center;
  padding:40px;
  opacity:0;
  animation: modalIn .4s cubic-bezier(.2,.9,.2,1) forwards;
}
@keyframes modalIn{ to{ opacity:1; } }
.modal{
  position:relative;
  max-width:720px; width:100%;
  max-height:85vh; overflow-y:auto;
  background:linear-gradient(180deg, var(--ink-2), var(--ink-3));
  border:1px solid rgba(200,154,60,.3);
  padding:48px;
  transform:translateY(30px) scale(.96);
  animation: modalRise .5s cubic-bezier(.2,.9,.2,1) forwards;
}
@keyframes modalRise{
  to{ transform:translateY(0) scale(1); }
}
.modal-close{
  position:absolute; top:20px; right:20px;
  width:40px; height:40px;
  border:1px solid rgba(242,234,214,.2);
  color:var(--paper-2);
  display:grid; place-items:center;
  font-size:20px;
  transition: all .3s;
}
.modal-close:hover{
  background:var(--cinnabar);
  border-color:var(--cinnabar);
  color:var(--paper);
}
.modal-header{
  display:flex; align-items:flex-end; gap:24px;
  margin-bottom:24px;
  padding-bottom:24px;

.modal-stat-num{

.modal-stat-label{
  font-size:11px; letter-spacing:2px;

/* ------- Immersive Hall ------- */
.hall{
  background:linear-gradient(180deg, var(--ink-2) 0%, var(--ink) 50%, var(--ink-2) 100%);
  position:relative; overflow:hidden;
}
.hall::before{
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(200,154,60,.08), transparent 50%),
    radial-gradient(ellipse at 50% 100%, rgba(184,52,42,.06), transparent 50%);
  pointer-events:none;
}
.hall-header{ text-align:center; margin-bottom:80px; }
.hall-header .section-title{ letter-spacing:16px; }

.hall-stage{
  position:relative;
  width:100%;
  height:520px;
  perspective:1400px;
  margin-bottom:60px;
}
.hall-platform{
  position:absolute; left:50%; top:50%;
  width:70%; height:280px;
  transform:translate(-50%,-50%) rotateX(65deg);
  background:
    repeating-conic-gradient(
      from 0deg at 50% 50%,
      rgba(200,154,60,.12) 0deg 2deg,
      transparent 2deg 30deg
    ),
    radial-gradient(circle at 50% 50%, rgba(184,52,42,.15), transparent 60%);
  border:1px solid rgba(200,154,60,.3);
  border-radius:50%;
  box-shadow:
    inset 0 0 80px rgba(200,154,60,.1),
    0 0 60px rgba(184,52,42,.15);
}
.hall-beast-display{
  position:absolute; left:50%; top:50%;
  transform:translate(-50%, -70%);
  text-align:center;
  z-index:2;
  transition: all .8s cubic-bezier(.2,.9,.2,1);
}
.hall-beast-char{
  font-family:"Ma Shan Zheng",cursive;
  font-size:160px;
  color:var(--paper);
  text-shadow:
    0 0 40px rgba(200,154,60,.4),
    0 0 80px rgba(184,52,42,.3);
  line-height:1;
  animation: beastFloat 6s ease-in-out infinite;
}
@keyframes beastFloat{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-14px); }
}
.hall-beast-ring{
  width:240px; height:10px;
  margin:-6px auto 0;
  background:radial-gradient(ellipse at center, rgba(200,154,60,.4), transparent 70%);
  border-radius:50%;
  animation: ringPulse 3s ease-in-out infinite;
}
@keyframes ringPulse{
  0%,100%{ transform:scaleX(1); opacity:.4; }
  50%{ transform:scaleX(.7); opacity:.7; }
}

.hall-thumbs{
  display:flex; justify-content:center; gap:20px;
  flex-wrap:wrap;
}
.hall-thumb{
  width:100px; height:100px;
  display:grid; place-items:center;
  background:var(--ink-2);
  border:1px solid rgba(200,154,60,.2);
  font-family:"Ma Shan Zheng",cursive;
  font-size:48px;
  color:var(--paper-3);
  transition: all .4s cubic-bezier(.2,.9,.2,1);
  position:relative;
}
.hall-thumb::before{
  content:""; position:absolute; inset:0;
  background:radial-gradient(circle at 50% 50%, rgba(200,154,60,.15), transparent 70%);
  opacity:0;
  transition: opacity .4s;
}
.hall-thumb:hover{
  border-color:var(--ochre);
  color:var(--paper);
  transform:translateY(-4px);
}
.hall-thumb:hover::before{ opacity:1; }
.hall-thumb.active{
  border-color:var(--cinnabar);
  color:var(--ochre-light);
  background:rgba(184,52,42,.12);
  box-shadow:
    0 0 20px rgba(184,52,42,.3),
    inset 0 0 20px rgba(184,52,42,.1);
}
.hall-thumb.active::before{ opacity:1; }

.hall-info{
  text-align:center;
  max-width:600px;
  margin:0 auto;
  padding-top:32px;
}
.hall-info-name{
  font-family:"ZCOOL XiaoWei",serif;
  font-size:28px; letter-spacing:8px;
  color:var(--paper);
  margin-bottom:12px;
}
.hall-info-text{
  font-size:14px; line-height:2;
  color:var(--paper-2);
  letter-spacing:1px;
}

/* ------- Typewriter section ------- */
.typewriter-block{
  text-align:center;
  padding:60px 0;
  font-family:"ZCOOL XiaoWei",serif;
  font-size:clamp(20px, 2.5vw, 32px);
  color:var(--paper);
  letter-spacing:6px;
  line-height:1.8;
  min-height:180px;
  display:grid; place-items:center;
}
.typewriter-cursor{
  display:inline-block;
  width:2px; height:1.1em;
  background:var(--cinnabar-light);
  margin-left:4px;
  vertical-align:text-bottom;
  animation: blink 1s step-end infinite;
}
@keyframes blink{ 50%{ opacity:0; } }

/* ------- Booking ------- */
.booking{
  background:linear-gradient(180deg, var(--ink-2), var(--ink));
  position:relative;
}
.booking-inner{
  max-width:1100px; margin:0 auto;
  display:grid;
  grid-template-columns: 1.2fr 1fr;
  gap:80px;
  align-items:center;
}
.booking-text h2{
  font-family:"Ma Shan Zheng",cursive;
  font-size:clamp(48px, 6vw, 76px);
  line-height:1.1;
  color:var(--paper);
  letter-spacing:8px;
  margin-bottom:20px;
}
.booking-text p{
  font-size:15px; line-height:2;
  color:var(--paper-2);
  letter-spacing:1.5px;
  margin-bottom:28px;
  max-width:480px;
}
.booking-meta{
  display:flex; gap:32px; flex-wrap:wrap;
  margin-bottom:32px;
}
.booking-meta-item{
  display:flex; flex-direction:column; gap:4px;
}
.booking-meta-label{
  font-size:11px; letter-spacing:3px;
  color:var(--paper-3);
}
.booking-meta-value{
  font-family:"ZCOOL XiaoWei",serif;
  font-size:22px;
  color:var(--ochre-light);
  letter-spacing:2px;
}

.counter-row{
  display:flex; gap:24px;
  margin-bottom:36px;
  flex-wrap:wrap;
}
.counter{
  padding:16px 24px;
  background:rgba(20,14,10,.6);
  border:1px solid rgba(200,154,60,.2);
  text-align:center;
  min-width:100px;
}
.counter-num{
  font-family:"Ma Shan Zheng",cursive;
  font-size:36px;
  color:var(--cinnabar-light);
  line-height:1;
  margin-bottom:6px;
}
.counter-label{
  font-size:11px; letter-spacing:2px;
  color:var(--paper-3);
}

.booking-form{
  background:linear-gradient(180deg, var(--ink-3), var(--ink-2));
  border:1px solid rgba(200,154,60,.25);
  padding:40px 36px;
  position:relative;
}
.booking-form::before{
  content:"观展预约";
  position:absolute; top:-14px; left:24px;
  background:var(--ink);
  padding:0 14px;
  font-family:"ZCOOL XiaoWei",serif;
  font-size:18px; letter-spacing:6px;
  color:var(--ochre-light);
}
.form-group{
  margin-bottom:20px;
}
.form-label{
  display:block;
  font-size:12px; letter-spacing:3px;
  color:var(--paper-3);
  margin-bottom:8px;
}
.form-input, .form-select{
  width:100%;
  padding:12px 16px;
  background:rgba(20,14,10,.5);
  border:1px solid rgba(200,154,60,.25);
  color:var(--paper);
  font-family:inherit;
  font-size:14px;
  letter-spacing:1px;
  transition: all .3s;
}
.form-input:focus, .form-select:focus{
  outline:none;
  border-color:var(--ochre);
  box-shadow:0 0 0 3px rgba(200,154,60,.1);
}
.form-select{
  appearance:none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%23c89a3c' stroke-width='1.5' fill='none'/></svg>");
  background-repeat:no-repeat;
  background-position:right 16px center;
  padding-right:40px;
}
.form-row{
  display:grid; grid-template-columns:1fr 1fr; gap:16px;
}
.form-submit{
  width:100%;
  padding:16px;
  background:var(--cinnabar);
  color:var(--paper);
  font-size:15px; letter-spacing:6px;
  transition: all .35s;
  position:relative; overflow:hidden;
}
.form-submit::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.15), transparent);
  transform:translateX(-100%);
  transition: transform .6s;
}
.form-submit:hover{
  background:var(--cinnabar-light);
  box-shadow:0 8px 24px rgba(184,52,42,.4);
}
.form-submit:hover::after{ transform:translateX(100%); }

.form-success{
  text-align:center;
  padding:32px 16px;
  color:var(--ochre-light);
}
.form-success-icon{
  width:56px; height:56px;
  margin:0 auto 16px;
  border:2px solid var(--ochre);
  border-radius:50%;
  display:grid; place-items:center;
  font-size:28px;
  animation: successPulse 1.5s ease;
}
@keyframes successPulse{
  0%{ transform:scale(0); opacity:0; }
  60%{ transform:scale(1.2); }
  100%{ transform:scale(1); opacity:1; }
}
.form-success h3{
  font-family:"ZCOOL XiaoWei",serif;
  font-size:22px; letter-spacing:4px;
  margin-bottom:8px;
  color:var(--paper);
}
.form-success p{
  font-size:13px; letter-spacing:1px;
  color:var(--paper-2);
}

/* ------- Footer ------- */
.footer{
  background:var(--ink);
  border-top:1px solid rgba(200,154,60,.15);
  padding:80px 8% 40px;
  position:relative; z-index:2;
}
.footer-grid{
  display:grid;
  grid-template-columns: 1.5fr 1fr 1fr 1fr;
  gap:60px;
  margin-bottom:60px;
}
.footer-brand h3{
  font-family:"Ma Shan Zheng",cursive;
  font-size:36px; letter-spacing:6px;
  color:var(--paper);
  margin-bottom:16px;
}
.footer-brand p{
  font-size:13px; line-height:2;
  color:var(--paper-3);
  letter-spacing:1px;
  max-width:320px;
}
.footer-col h4{
  font-family:"ZCOOL XiaoWei",serif;
  font-size:16px; letter-spacing:4px;
  color:var(--ochre-light);
  margin-bottom:20px;
}
.footer-col ul li{
  margin-bottom:10px;
}
.footer-col a{
  font-size:13px;
  color:var(--paper-2);
  letter-spacing:1.5px;
  transition: color .3s;
}
.footer-col a:hover{ color:var(--cinnabar-light); }

.footer-bottom{
  display:flex; justify-content:space-between; align-items:center;
  padding-top:28px;
  border-top:1px solid rgba(242,234,214,.06);
  font-size:12px; letter-spacing:2px;
  color:var(--paper-3);
  flex-wrap:wrap; gap:16px;
}

/* ------- Reveal on scroll ------- */
.reveal{
  opacity:0;
  transform:translateY(40px);
  transition: opacity 1s cubic-bezier(.2,.9,.2,1), transform 1s cubic-bezier(.2,.9,.2,1);
}
.reveal.visible{
  opacity:1;
  transform:translateY(0);
}
.reveal-delay-1{ transition-delay:.1s; }
.reveal-delay-2{ transition-delay:.2s; }
.reveal-delay-3{ transition-delay:.3s; }
.reveal-delay-4{ transition-delay:.4s; }

/* ------- Back to top ------- */
.back-top{
  position:fixed; right:32px; bottom:32px; z-index:90;
  width:48px; height:48px;
  border:1px solid rgba(200,154,60,.3);
  background:rgba(20,14,10,.8);
  backdrop-filter:blur(8px);
  color:var(--ochre-light);
  display:grid; place-items:center;
  font-size:18px;
  opacity:0; pointer-events:none;
  transform:translateY(20px);
  transition: all .4s cubic-bezier(.2,.9,.2,1);
}
.back-top.visible{
  opacity:1; pointer-events:auto;
  transform:translateY(0);
}
.back-top:hover{
  background:var(--cinnabar);
  border-color:var(--cinnabar);
  color:var(--paper);
}

/* ------- Responsive ------- */
@media (max-width: 1024px){
  .prologue-grid{ grid-template-columns:1fr; gap:60px; }
  .prologue-left{ position:static; }
  .booking-inner{ grid-template-columns:1fr; gap:60px; }
  .footer-grid{ grid-template-columns:1fr 1fr; }
}
@media (max-width: 768px){
  .nav{ padding:16px 20px; }
  .nav-links{ display:none; }
  .hamburger{ display:grid; place-items:center; width:40px; height:40px; }
  .hero-title::before, .hero-title::after{ display:none; }
  .section{ padding:100px 6%; }
  .beast-grid{ grid-template-columns:1fr; }
  .modal{ padding:28px 20px; }
  .modal-name{ font-size:44px; }
  .modal-stats{ grid-template-columns:repeat(2,1fr); }
  .footer-grid{ grid-template-columns:1fr; gap:40px; }
  .form-row{ grid-template-columns:1fr; }
  .hall-stage{ height:380px; }
  .hall-beast-char{ font-size:110px; }
  .hall-thumb{ width:72px; height:72px; font-size:32px; }
  .section-title{ letter-spacing:4px; }
  .cursor-ring, .cursor-dot, .cursor-trail{ display:none; }
  body{ cursor:auto; }
  a, button{ cursor:pointer; }
}
@media (max-width: 480px){
  .counter-row{ gap:12px; }
  .counter{ padding:12px 16px; min-width:76px; }
  .counter-num{ font-size:26px; }
  .hero-beast{ display:none; }
}

/* reduced motion */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
  .reveal{ opacity:1; transform:none; }
  .hero-title span{ opacity:1; transform:none; }
  .hero-subtitle, .hero-en, .hero-desc, .hero-scroll{ opacity:1; animation:none; }
}

/* =========================================================
   UTILITY: animation cleanup helpers
   ========================================================= */
function useRafLoop(callback) {
  const rafRef = useRef(null);
  const pausedRef = useRef(false);

  const start = useCallback(() => {
    if (rafRef.current) return;
    let last = performance.now();
    const tick = (now) => {
      if (!pausedRef.current) {
        const dt = Math.min(now - last, 50) / 1000;
        last = now;
        callback(dt);
      } else {
        last = now;
      }
      rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);
  }, [callback]);

  const stop = useCallback(() => {
    if (rafRef.current) {
      cancelAnimationFrame(rafRef.current);
      rafRef.current = null;
    }
  }, []);

  useEffect(() => {
    const onVis = () => {
      if (document.hidden) {
        pausedRef.current = true;
      } else {
        pausedRef.current = false;
      }
    };
    document.addEventListener('visibilitychange', onVis);
    return () => {
      document.removeEventListener('visibilitychange', onVis);
      stop();
    };
  }, [stop]);

  return { start, stop, setPaused: (p) => { pausedRef.current = p; } };
}

// ---- Custom Cursor ----
function CustomCursor() {
  const ringRef = useRef(null);
  const dotRef = useRef(null);
  const trailRefs = useRef([]);
  const mouse = useRef({ x: window.innerWidth/2, y: window.innerHeight/2 });
  const posRing = useRef({ x: window.innerWidth/2, y: window.innerHeight/2 });
  const posDots = useRef([...Array(6)].map(() => ({ x: window.innerWidth/2, y: window.innerHeight/2 })));
  const reducedMotion = useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  useEffect(() => {
    if (reducedMotion.current) return;

    const onMove = (e) => {
      mouse.current.x = e.clientX;
      mouse.current.y = e.clientY;
      // dot follows instantly
      if (dotRef.current) {
        dotRef.current.style.left = e.clientX + 'px';
        dotRef.current.style.top = e.clientY + 'px';
      }
    };
    window.addEventListener('mousemove', onMove);

    // hover detection via delegation
    const onOver = (e) => {
      const el = e.target.closest('a, button, [data-cursor-hover], .beast-card, .hall-thumb, .chip, .form-input, .form-select, .nav-cta, .prologue-scroll');
      if (el) {
        document.body.classList.add('cursor-hover');
      }
    };
    const onOut = (e) => {
      const el = e.target.closest('a, button, [data-cursor-hover], .beast-card, .hall-thumb, .chip, .form-input, .form-select, .nav-cta, .prologue-scroll');
      if (el) {
        document.body.classList.remove('cursor-hover');
      }
    };
    document.addEventListener('mouseover', onOver);
    document.addEventListener('mouseout', onOut);

    // click ripple
    const onClick = (e) => {
      const ripple = document.createElement('div');
      ripple.className = 'ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      ripple.style.width = '30px';
      ripple.style.height = '30px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 900);

      document.body.classList.add('cursor-click');
      setTimeout(() => document.body.classList.remove('cursor-click'), 200);
    };
    window.addEventListener('mousedown', onClick);

    // RAF loop for ring + trail
    let raf = null;
    let paused = false;
    const onVis = () => { paused = document.hidden; };
    document.addEventListener('visibilitychange', onVis);

    const tick = () => {
      if (!paused) {
        // Ring: spring/damped follow
        const dx = mouse.current.x - posRing.current.x;
        const dy = mouse.current.y - posRing.current.y;
        posRing.current.x += dx * 0.15;
        posRing.current.y += dy * 0.15;
        if (ringRef.current) {
          ringRef.current.style.left = posRing.current.x + 'px';
          ringRef.current.style.top = posRing.current.y + 'px';
        }

        // Trails: staggered follow with friction
        for (let i = 0; i < 6; i++) {
          const prev = i === 0 ? mouse.current : posDots.current[i - 1];
          const p = posDots.current[i];
          const factor = 0.28 - i * 0.035;
          p.x += (prev.x - p.x) * factor;
          p.y += (prev.y - p.y) * factor;
          if (trailRefs.current[i]) {
            trailRefs.current[i].style.left = p.x + 'px';
            trailRefs.current[i].style.top = p.y + 'px';
            const scale = 1 - i * 0.12;
            trailRefs.current[i].style.transform = `translate(-50%,-50%) scale(${scale})`;
            trailRefs.current[i].style.opacity = 0.55 - i * 0.07;
          }
        }
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);

    return () => {
      window.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseover', onOver);
      document.removeEventListener('mouseout', onOut);
      window.removeEventListener('mousedown', onClick);
      document.removeEventListener('visibilitychange', onVis);
      if (raf) cancelAnimationFrame(raf);
    };
  }, []);

  return (
    <React.Fragment>
      <div className="cursor-ring" ref={ringRef} />
      <div className="cursor-dot" ref={dotRef} />
      {[...Array(6)].map((_, i) => (
        <div
          key={i}
          className="cursor-trail"
          ref={el => trailRefs.current[i] = el}
        />
      ))}
    </React.Fragment>
  );
}

// ---- Nav ----
function Nav({ onBookClick }) {
  const [scrolled, setScrolled] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);

  useEffect(() => {
    let ticking = false;
    const onScroll = () => {
      if (!ticking) {
        requestAnimationFrame(() => {
          setScrolled(window.scrollY > 60);
          ticking = false;
        });
        ticking = true;
      }
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  const scrollTo = (id) => (e) => {
    e.preventDefault();
    const el = document.getElementById(id);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    setMenuOpen(false);
  };

  return (
    <nav className={`nav ${scrolled ? 'scrolled' : ''}`}>
      <a href="#" className="nav-logo" onClick={scrollTo('top')}>
        <span className="nav-logo-seal">山</span>
        <span>山海异兽志</span>
      </a>
      <div className="nav-links">
        <a href="#prologue" onClick={scrollTo('prologue')}>序章</a>
        <a href="#compendium" onClick={scrollTo('compendium')}>神兽图鉴</a>
        <a href="#hall" onClick={scrollTo('hall')}>沉浸展厅</a>

  );
}

// ---- Hero with particle canvas + floating beasts ----
function Hero() {
  const canvasRef = useRef(null);
  const beastsRef = useRef([
    { char: "龍", x: 12, y: 28, scale: 1, speed: 0.3 },
    { char: "鳳", x: 82, y: 22, scale: 0.7, speed: 0.2 },
    { char: "狐", x: 18, y: 68, scale: 0.8, speed: 0.25 },
    { char: "麒麟", x: 75, y: 72, scale: 0.6, speed: 0.18 }
  ]);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let raf = null;
    let paused = false;

    const resize = () => {
      canvas.width = canvas.offsetWidth * devicePixelRatio;
      canvas.height = canvas.offsetHeight * devicePixelRatio;
      ctx.scale(devicePixelRatio, devicePixelRatio);
    };
    resize();
    window.addEventListener('resize', resize);

    // Ink particles
    const particles = [];
    const count = 60;
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * canvas.offsetWidth,
        y: Math.random() * canvas.offsetHeight,
        r: Math.random() * 2.5 + 0.5,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        life: Math.random() * 200 + 100,
        maxLife: 200,
        type: Math.random() > 0.7 ? 'gold' : 'cinnabar'
      });
    }

    const onVis = () => { paused = document.hidden; };
    document.addEventListener('visibilitychange', onVis);

    const draw = () => {
      if (!paused) {
        ctx.clearRect(0, 0, canvas.offsetWidth, canvas.offsetHeight);

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.life--;

          if (p.life <= 0) {
            p.x = Math.random() * canvas.offsetWidth;
            p.y = Math.random() * canvas.offsetHeight;
            p.life = p.maxLife;
            p.vx = (Math.random() - 0.5) * 0.3;
            p.vy = (Math.random() - 0.5) * 0.3;
          }

          const alpha = Math.sin((p.life / p.maxLife) * Math.PI) * 0.5;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.type === 'gold'
            ? `rgba(200, 154, 60, ${alpha})`
            : `rgba(184, 52, 42, ${alpha})`;
          ctx.shadowBlur = 8;
          ctx.shadowColor = p.type === 'gold' ? 'rgba(200,154,60,0.5)' : 'rgba(184,52,42,0.5)';
          ctx.fill();
        });

        // Draw connecting lines for nearby particles (spectrum/network)
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 80) {
              const alpha = (1 - dist/80) * 0.15;
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(200, 154, 60, ${alpha})`;
              ctx.lineWidth = 0.5;
              ctx.shadowBlur = 0;
              ctx.stroke();
            }
          }
        }
      }
      raf = requestAnimationFrame(draw);
    };
    raf = requestAnimationFrame(draw);

    return () => {
      window.removeEventListener('resize', resize);
      document.removeEventListener('visibilitychange', onVis);
      if (raf) cancelAnimationFrame(raf);
    };
  }, []);

  // Parallax floating characters
  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;

    let raf = null;
    let paused = false;
    const t0 = performance.now();

    const onVis = () => { paused = document.hidden; };
    document.addEventListener('visibilitychange', onVis);

    const tick = (now) => {
      if (!paused) {
        const t = (now - t0) / 1000;
        const els = document.querySelectorAll('.hero-beast');
        els.forEach((el, i) => {
          const b = beastsRef.current[i];
          if (!b) return;
          const dx = Math.sin(t * b.speed + i) * 12;
          const dy = Math.cos(t * b.speed * 0.7 + i * 1.3) * 8;
          el.style.transform = `translate(${dx}px, ${dy}px)`;
        });
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);

    return () => {
      document.removeEventListener('visibilitychange', onVis);
      if (raf) cancelAnimationFrame(raf);
    };
  }, []);

  // Mouse parallax for hero content
  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;

    const hero = document.querySelector('.hero');

    let curX = 0, curY = 0;

      targetY = (e.clientY - rect.top - rect.height/2) / rect.height;
    };

    const onVis = () => { paused = document.hidden; };
    document.addEventListener('visibilitychange', onVis);

    const tick = () => {

        curX += (targetX - curX) * 0.05;

      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);

    window.addEventListener('mousemove', onMove);
    return () => {
      window.removeEventListener('mousemove', onMove);

// ---- Beast Card with 3D tilt ----
function BeastCard({ beast, onOpen }) {
  const cardRef = useRef(null);
  const mouse = useRef({ x: 0, y: 0 });
  const curTilt = useRef({ x: 0, y: 0 });
  const rafRef = useRef(null);

  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;

    const card = cardRef.current;
    if (!card) return;

    let inside = false;

    const onEnter = () => {
      inside = true;
    };
    const onMove = (e) => {
      const rect = card.getBoundingClientRect();
      mouse.current.x = (e.clientX - rect.left) / rect.width - 0.5;
      mouse.current.y = (e.clientY - rect.top) / rect.height - 0.5;
    };
    const onLeave = () => {
      inside = false;
      mouse.current.x = 0;
      mouse.current.y = 0;
    };

    const tick = () => {
      // spring damping toward target
      const targetX = inside ? -mouse.current.y * 10 : 0;
      const targetY = inside ? mouse.current.x * 12 : 0;
      curTilt.current.x += (targetX - curTilt.current.x) * 0.12;
      curTilt.current.y += (targetY - curTilt.current.y) * 0.12;

      if (card) {
        card.style.transform =
          `perspective(1000px) rotateX(${curTilt.current.x}deg) rotateY(${curTilt.current.y}deg) translateZ(0)`;
      }
      rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);

    card.addEventListener('mouseenter', onEnter);
    card.addEventListener('mousemove', onMove);
    card.addEventListener('mouseleave', onLeave);

    return () => {
      card.removeEventListener('mouseenter', onEnter);
      card.removeEventListener('mousemove', onMove);
      card.removeEventListener('mouseleave', onLeave);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, []);

  // Intersection observer for stat bar animation
  useEffect(() => {
    const card = cardRef.current;
    if (!card) return;

    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          card.classList.add('visible');
        }
      });
    }, { threshold: 0.2 });
    obs.observe(card);
    return () => obs.disconnect();
  }, []);

  const catLabel = CATEGORIES.find(c => c.key === beast.category)?.label || '';

  return (
    <div
      className="beast-card"
      ref={cardRef}
      onClick={() => onOpen(beast)}
    >
      <div className="beast-card-top">
        <div className="beast-char">{beast.char}</div>
        <div className="beast-glow" />
        <div className="beast-shimmer" />
      </div>
      <div className="beast-card-body">
        <div className="beast-row">
          <span className="beast-name">{beast.name}</span>
          <span className="beast-tag">{beast.tag}</span>
        </div>
        <div className="beast-origin">{beast.origin}</div>
        <p className="beast-desc">{beast.desc}</p>
        <div className="beast-stats">
          <div className="beast-stat">
            <div className="beast-stat-label">神力</div>
            <div className="beast-stat-bar" style={{ '--val': beast.power + '%' }} />
          </div>
          <div className="beast-stat">
            <div className="beast-stat-label">智慧</div>
            <div className="beast-stat-bar" style={{ '--val': beast.wisdom + '%' }} />
          </div>
          <div className="beast-stat">
            <div className="beast-stat-label">仁德</div>

// ---- Typewriter ----
function TypewriterSection() {
  const [text, setText] = useState('');
  const [lineIdx, setLineIdx] = useState(0);
  const timeoutRef = useRef(null);
  const sectionRef = useRef(null);
  const startedRef = useRef(false);

  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting && !startedRef.current) {
          startedRef.current = true;
          if (reduced) {
            setText(TYPEWRITER_LINES.join('\n'));
          } else {
            startTyping();
          }
        }
      });
    }, { threshold: 0.4 });

    if (sectionRef.current) obs.observe(sectionRef.current);

    function startTyping() {
      let charIdx = 0;
      let currentLine = 0;
      let fullText = '';
      setText('');

      const typeNext = () => {
        if (currentLine >= TYPEWRITER_LINES.length) {
          // restart after pause
          timeoutRef.current = setTimeout(() => {
            currentLine = 0;
            charIdx = 0;
            fullText = '';
            setText('');
            typeNext();
          }, 3500);
          return;
        }

        const line = TYPEWRITER_LINES[currentLine];
        if (charIdx < line.length) {
          fullText += line[charIdx];
          setText(fullText);
          charIdx++;
          const delay = 120 + Math.random() * 120;
          timeoutRef.current = setTimeout(typeNext, delay);
        } else {
          if (currentLine < TYPEWRITER_LINES.length - 1) {
            fullText += '\n';
            setText(fullText);
          }
          currentLine++;
          charIdx = 0;
          timeoutRef.current = setTimeout(typeNext, 800);
        }
      };

      timeoutRef.current = setTimeout(typeNext, 500);
    }

    return () => {
      obs.disconnect();
      if (timeoutRef.current) clearTimeout(timeoutRef.current);
    };
  }, []);

  useEffect(() => {
    const onVis = () => {
      if (document.hidden && timeoutRef.current) {
        clearTimeout(timeoutRef.current);
        timeoutRef.current = null;
      }
    };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, []);

  const lines = text.split('\n');

  return (
    <section className="section" ref={sectionRef} style={{padding:'60px 8%', background:'var(--ink-2)'}}>
      <div className="typewriter-block">
        <div>
          {lines.map((line, i) => (
            <div key={i}>{line}</div>
          ))}
          <span className="typewriter-cursor" />
        </div>
      </div>
    </section>
  );
}

// ---- Counters ----
function useCounter(target, duration = 2000) {
  const [value, setValue] = useState(0);
  const ref = useRef(null);
  const startedRef = useRef(false);

  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) { setValue(target); return; }

    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting && !startedRef.current) {
          startedRef.current = true;
          animate();
        }
      });
    }, { threshold: 0.4 });
    if (ref.current) obs.observe(ref.current);

    function animate() {
      let raf = null;
      let paused = false;
      const start = performance.now();

      const ease = (t) => 1 - Math.pow(1 - t, 3);
      const onVis = () => { paused = document.hidden; };
      document.addEventListener('visibilitychange', onVis);

      const tick = (now) => {
        if (paused) { raf = requestAnimationFrame(tick); return; }
        const t = Math.min((now - start) / duration, 1);
        setValue(Math.floor(ease(t) * target));
        if (t < 1) raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
    }

    return () => obs.disconnect();
  }, [target, duration]);

  return { value, ref };
}

// ---- Back to top ----
function BackToTop() {
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    let ticking = false;
    const onScroll = () => {
      if (!ticking) {
        requestAnimationFrame(() => {
          setVisible(window.scrollY > 800);
          ticking = false;
        });
        ticking = true;
      }
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <button
      className={`back-top ${visible ? 'visible' : ''}`}
      onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
      title="回到顶部"
    >
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="1.5">
        <polyline points="3,11 9,5 15,11" />
      </svg>
    </button>
  );
}

// ---- Scroll reveal observer ----
function useScrollReveal() {
  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) {
      document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
      return;
    }

    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          obs.unobserve(e.target);
        }
      });
    }, { threshold: 0.15 });

    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
    return () => obs.disconnect();
  }, []);
}

function App() {
  const [selectedBeast, setSelectedBeast] = useState(null);

}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>活字铸造所 HAAS TYPE FOUNDRY — 瑞士国际主义排版</title>
<link rel="preconnect" href="https://miaoda.feishu.cn" />
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Archivo+Black&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
/* ============ RESET & BASE ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
body {
  background: #FAFAF7;
  color: #141414;
  font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-weight: 400;
  line-height: 1.5;
  overflow-x: hidden;
  cursor: none;
}
@media (max-width: 768px) {
  body { cursor: auto; }
}
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; background: none; border: none; color: inherit; cursor: none; }
@media (max-width: 768px) { button { cursor: pointer; } }
ul, ol { list-style: none; }

/* ============ CUSTOM CURSOR ============ */
.cursor-ring, .cursor-dot, .cursor-ripple {
  position: fixed;
  top: 0;
  left: 0;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  will-change: transform;
}
.cursor-ring {
  width: 32px;
  height: 32px;
  border: 2px solid #141414;
  border-radius: 50%;
  transition: width 0.25s cubic-bezier(0.23, 1, 0.32, 1),
              height 0.25s cubic-bezier(0.23, 1, 0.32, 1),
              border-color 0.25s ease,
              background-color 0.25s ease,
              opacity 0.2s ease;
  mix-blend-mode: difference;
  border-color: #FAFAF7;
}
.cursor-ring.hover {
  width: 56px;
  height: 56px;
  border-color: #E4002B;
  background: rgba(228, 0, 43, 0.12);
}
.cursor-ring.drag {
  width: 20px;
  height: 20px;
  border-color: #E4002B;
}
.cursor-dot {
  width: 6px;
  height: 6px;
  background: #E4002B;
  border-radius: 50%;
  box-shadow: 0 0 8px rgba(228, 0, 43, 0.6),
              0 0 16px rgba(228, 0, 43, 0.3);
  transition: width 0.2s ease, height 0.2s ease, background 0.2s ease;
}
.cursor-dot.hover {
  width: 10px;
  height: 10px;
  background: #141414;
}
.cursor-ripple {
  width: 0;
  height: 0;
  border: 2px solid #E4002B;
  border-radius: 50%;
  opacity: 0;
}
.cursor-ripple.active {
  animation: cursorRipple 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
}
@keyframes cursorRipple {
  0% { width: 0; height: 0; opacity: 0.8; border-width: 3px; }
  100% { width: 80px; height: 80px; opacity: 0; border-width: 1px; }
}
@media (max-width: 768px) {
  .cursor-ring, .cursor-dot, .cursor-ripple { display: none; }
}

/* ============ GRID OVERLAY ============ */
.grid-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 50;
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 24px;
  padding: 0 48px;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.grid-overlay.visible { opacity: 1; }
.grid-overlay span {
  border-left: 1px solid rgba(228, 0, 43, 0.15);
  border-right: 1px solid rgba(228, 0, 43, 0.15);
  background: rgba(228, 0, 43, 0.03);
}

/* ============ NAVIGATION ============ */
.nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 100;
  padding: 24px 48px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(250, 250, 247, 0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(20, 20, 20, 0.08);
}
.nav-logo {
  font-family: 'Archivo Black', sans-serif;
  font-size: 20px;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav-logo .dot {
  width: 10px;
  height: 10px;
  background: #E4002B;
  border-radius: 50%;
  animation: pulseDot 2s ease-in-out infinite;
}
@keyframes pulseDot {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.4); opacity: 0.7; }
}
.nav-links {
  display: flex;
  gap: 36px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.nav-links a {
  position: relative;
  padding: 4px 0;
  transition: color 0.2s ease;
}
.nav-links a::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 0;
  height: 2px;
  background: #E4002B;
  transition: width 0.3s cubic-bezier(0.23, 1, 0.32, 1);
}
.nav-links a:hover { color: #E4002B; }
.nav-links a:hover::after { width: 100%; }
.nav-tools {
  display: flex;
  gap: 16px;
  align-items: center;
}
.grid-toggle {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 8px 14px;
  border: 1px solid #141414;
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
}
.grid-toggle::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: #141414;
  transition: left 0.3s cubic-bezier(0.23, 1, 0.32, 1);
  z-index: -1;
}
.grid-toggle:hover::before { left: 0; }
.grid-toggle:hover { color: #FAFAF7; }
.grid-toggle.active { background: #141414; color: #FAFAF7; }

/* ============ HERO ============ */
.hero {
  min-height: 100vh;
  padding: 120px 48px 60px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
}
.hero-meta {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 24px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #8A8A82;
  margin-bottom: 40px;
}
.hero-meta .col { grid-column: span 3; }
.hero-meta .col strong { color: #141414; font-weight: 500; }

.hero-title {
  font-family: 'Archivo Black', sans-serif;
  font-size: clamp(60px, 12vw, 200px);
  line-height: 0.9;
  letter-spacing: -0.04em;
  color: #141414;
  text-transform: uppercase;
}
.hero-title .line {
  display: block;
  overflow: hidden;
}
.hero-title .line-inner {
  display: block;
  transform: translateY(110%);
  animation: slideUp 1s cubic-bezier(0.23, 1, 0.32, 1) forwards;
}
.hero-title .line:nth-child(1) .line-inner { animation-delay: 0.1s; }
.hero-title .line:nth-child(2) .line-inner { animation-delay: 0.25s; }
.hero-title .line:nth-child(3) .line-inner { animation-delay: 0.4s; }
@keyframes slideUp {
  to { transform: translateY(0); }
}
.hero-title .accent { color: #E4002B; }
.hero-title .typewriter-cursor {
  display: inline-block;
  width: 0.08em;
  height: 0.85em;
  background: #E4002B;
  vertical-align: baseline;
  margin-left: 0.02em;
  animation: blink 1.1s step-end infinite;
}
@keyframes blink {
  50% { opacity: 0; }
}

.hero-bottom {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 24px;
  margin-top: 60px;
  align-items: end;
}
.hero-desc {
  grid-column: span 5;
  font-size: 16px;
  line-height: 1.7;
  color: #141414;
  max-width: 480px;
}
.hero-desc strong { font-weight: 700; }
.hero-scroll {
  grid-column: span 2;
  grid-column-start: 11;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #8A8A82;
}
.scroll-line {
  width: 1px;
  height: 60px;
  background: #141414;
  position: relative;
  overflow: hidden;
}
.scroll-line::after {
  content: '';
  position: absolute;
  top: -100%;
  left: 0;
  width: 100%;
  height: 100%;
  background: #E4002B;
  animation: scrollDown 2s ease-in-out infinite;
}
@keyframes scrollDown {
  0% { top: -100%; }
  50%, 100% { top: 100%; }
}

/* ============ SECTION COMMON ============ */
.section {
  padding: 120px 48px;
  position: relative;
}
.section-head {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 24px;
  margin-bottom: 64px;
  align-items: end;
}
.section-number {
  grid-column: span 1;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: #8A8A82;
  letter-spacing: 0.08em;
}
.section-title {
  grid-column: span 6;
  font-family: 'Archivo Black', sans-serif;
  font-size: clamp(32px, 5vw, 64px);
  line-height: 1;
  letter-spacing: -0.02em;
  text-transform: uppercase;
}
.section-desc {
  grid-column: span 4;
  grid-column-start: 9;
  font-size: 14px;
  line-height: 1.7;
  color: #141414;
}
.section-rule {
  grid-column: 1 / -1;
  height: 1px;
  background: #E8E6DF;
  margin-top: 40px;
}

/* ============ TYPE TESTER ============ */
.tester {
  background: #141414;
  color: #FAFAF7;
  border-radius: 0;
}
.tester .section-number { color: #8A8A82; }
.tester .section-title { color: #FAFAF7; }
.tester .section-desc { color: #E8E6DF; }
.tester .section-rule { background: rgba(250, 250, 247, 0.1); }

.tester-workspace {
  background: #FAFAF7;
  color: #141414;
  padding: 60px 48px;
  margin: 0 -48px;
  min-height: 420px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.tester-preview {
  font-size: 96px;
  line-height: 1;
  font-weight: 900;
  letter-spacing: -0.02em;
  word-break: break-word;
  transition: font-size 0.3s cubic-bezier(0.23, 1, 0.32, 1),
              letter-spacing 0.3s cubic-bezier(0.23, 1, 0.32, 1),
              font-weight 0.3s cubic-bezier(0.23, 1, 0.32, 1),
              text-align 0.3s ease;
}
.tester-preview .caret {
  display: inline-block;
  width: 4px;
  height: 0.9em;
  background: #E4002B;
  vertical-align: -0.1em;
  margin-left: 2px;
  animation: blink 1s step-end infinite;
}

.tester-controls {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 24px;
  margin-top: 48px;
  padding-top: 32px;
  border-top: 1px solid #E8E6DF;
}
.tester-control {
  grid-column: span 3;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.tester-control label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #8A8A82;
}
.tester-input {
  background: transparent;
  border: none;
  border-bottom: 1px solid #141414;
  padding: 8px 0;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  color: #141414;
  outline: none;
  transition: border-color 0.2s ease;
}
.tester-input:focus { border-bottom-color: #E4002B; }

.tester-range-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
}
.tester-range {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 2px;
  background: #E8E6DF;
  outline: none;
}
.tester-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #E4002B;
  cursor: none;
  transition: transform 0.2s ease;
}
.tester-range::-webkit-slider-thumb:hover { transform: scale(1.3); }
.tester-range-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: #141414;
  min-width: 48px;
  text-align: right;
}

.tester-buttons {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.tester-btn {
  padding: 6px 12px;
  border: 1px solid #141414;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  transition: all 0.2s ease;
}
.tester-btn:hover { background: #141414; color: #FAFAF7; }
.tester-btn.active { background: #E4002B; border-color: #E4002B; color: #FAFAF7; }

.tester-font-family {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.tester-font-btn {
  padding: 6px 12px;
  border: 1px solid #141414;
  font-size: 12px;
  transition: all 0.2s ease;
}
.tester-font-btn:hover { background: #141414; color: #FAFAF7; }
.tester-font-btn.active { background: #E4002B; border-color: #E4002B; color: #FAFAF7; }
.tester-font-btn:nth-child(2) { font-family: Georgia, serif; }
.tester-font-btn:nth-child(3) { font-family: 'Courier New', monospace; font-weight: 700; }

/* ============ FONT FAMILY CARDS ============ */
.fonts-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 24px;
}
.font-card {
  grid-column: span 4;
  background: #FAFAF7;
  border: 1px solid #E8E6DF;
  padding: 32px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.3s ease;
  transform-style: preserve-3d;
  perspective: 1000px;
  cursor: none;
}
@media (max-width: 768px) { .font-card { cursor: pointer; } }
.font-card:hover { border-color: #E4002B; }
.font-card-inner {
  transition: transform 0.1s ease-out;
  transform-style: preserve-3d;
}
.font-card-index {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: #8A8A82;
  letter-spacing: 0.08em;
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.font-card-index .badge {
  padding: 2px 8px;
  background: #E4002B;
  color: #FAFAF7;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.font-card-display {
  font-size: 64px;
  line-height: 1;
  font-weight: 900;
  letter-spacing: -0.03em;
  margin-bottom: 24px;
  color: #141414;
  transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1);
  transform: translateZ(20px);
}
.font-card:hover .font-card-display { transform: translateZ(40px); }
.font-card-name {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 4px;
}
.font-card-styles {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: #8A8A82;
  letter-spacing: 0.04em;
  margin-bottom: 20px;
}
.weight-spectrum {
  display: flex;
  gap: 2px;
  height: 24px;
  align-items: flex-end;
  margin-bottom: 20px;
  padding-top: 8px;
}
.weight-bar {
  flex: 1;
  background: #E8E6DF;
  transition: background 0.3s ease, height 0.3s ease;
}
.font-card:hover .weight-bar { background: #E4002B; }
.weight-bar.active { background: #E4002B; }
.font-card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 16px;
  border-top: 1px solid #E8E6DF;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: #8A8A82;
  letter-spacing: 0.04em;
}
.font-card-footer .arrow {
  color: #141414;
  transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1);
}
.font-card:hover .font-card-footer .arrow { transform: translateX(6px); color: #E4002B; }

/* ============ TIMELINE ============ */
.timeline-section {
  background: #E8E6DF;
  overflow: hidden;
}
.timeline-wrap {
  overflow-x: auto;
  overflow-y: hidden;
  padding-bottom: 40px;
  margin: 0 -48px;
  padding-left: 48px;
  scrollbar-width: thin;
  scrollbar-color: #E4002B #E8E6DF;
}
.timeline-wrap::-webkit-scrollbar { height: 4px; }
.timeline-wrap::-webkit-scrollbar-track { background: #E8E6DF; }
.timeline-wrap::-webkit-scrollbar-thumb { background: #E4002B; }

.timeline-track {
  display: flex;
  gap: 0;
  min-width: max-content;
  padding-right: 48px;
  position: relative;
}
.timeline-track::before {
  content: '';
  position: absolute;
  top: 80px;
  left: 0;
  right: 0;
  height: 2px;
  background: #141414;
}
.timeline-item {
  width: 280px;
  flex-shrink: 0;
  padding-right: 40px;
  position: relative;
}
.timeline-item::before {
  content: '';
  position: absolute;
  top: 74px;
  left: 0;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #FAFAF7;
  border: 3px solid #E4002B;
  z-index: 1;
  transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1);
}
.timeline-item:hover::before { transform: scale(1.4); background: #E4002B; }
.timeline-year {
  font-family: 'Archivo Black', sans-serif;
  font-size: 48px;
  line-height: 1;
  color: #E4002B;
  margin-bottom: 60px;
  letter-spacing: -0.02em;
}
.timeline-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 8px;
}
.timeline-desc {
  font-size: 13px;
  line-height: 1.6;
  color: #141414;
  opacity: 0.8;
}
.timeline-tag {
  display: inline-block;
  margin-top: 12px;
  padding: 3px 10px;
  background: #141414;
  color: #FAFAF7;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

/* ============ POSTER GALLERY ============ */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 24px;
}
.poster {
  position: relative;
  overflow: hidden;
  background: #E8E6DF;
  cursor: none;
}
@media (max-width: 768px) { .poster { cursor: pointer; } }
.poster-1 { grid-column: span 5; aspect-ratio: 3/4; }
.poster-2 { grid-column: span 4; aspect-ratio: 4/5; margin-top: 80px; }
.poster-3 { grid-column: span 3; aspect-ratio: 2/3; margin-top: 40px; }

.poster-inner {
  position: absolute;
  inset: -20px;
  background-size: cover;
  background-position: center;
  transition: transform 0.1s ease-out;
  will-change: transform;
}
.poster-overlay {
  position: absolute;
  inset: 0;
  padding: 24px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: linear-gradient(to bottom, rgba(20,20,20,0.4) 0%, transparent 30%, transparent 70%, rgba(20,20,20,0.6) 100%);
  color: #FAFAF7;
  transition: opacity 0.3s ease;
}
.poster-top {
  display: flex;
  justify-content: space-between;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.poster-bottom {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}
.poster-title {
  font-family: 'Archivo Black', sans-serif;
  font-size: 24px;
  line-height: 1.1;
  text-transform: uppercase;
  letter-spacing: -0.02em;
  max-width: 70%;
}
.poster-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
}

/* ============ COUNTER SECTION ============ */
.stats {
  background: #141414;
  color: #FAFAF7;
  padding: 80px 48px;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 24px;
}
.stat-item {
  grid-column: span 3;
  text-align: left;
}
.stat-number {
  font-family: 'Archivo Black', sans-serif;
  font-size: clamp(48px, 6vw, 96px);
  line-height: 1;
  letter-spacing: -0.03em;
  color: #FAFAF7;
}
.stat-number .red { color: #E4002B; }
.stat-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #8A8A82;
  margin-top: 12px;
}
.stat-desc {
  font-size: 13px;
  color: #E8E6DF;
  margin-top: 8px;
  line-height: 1.5;
}

/* ============ CTA SECTION ============ */
.cta-section {
  padding: 160px 48px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.cta-title {
  font-family: 'Archivo Black', sans-serif;
  font-size: clamp(48px, 8vw, 120px);

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ============ CUSTOM CURSOR (vanilla JS, direct DOM for perf) ============ */
(function initCursor() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced || window.innerWidth <= 768) return;

  const ring = document.getElementById('cursorRing');
  const dot = document.getElementById('cursorDot');
  const ripple = document.getElementById('cursorRipple');

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let ringX = mouseX;
  let ringY = mouseY;
  let rafId = null;
  let visible = true;

  // Spring physics for ring (smoother follow)
  const spring = { x: 0, y: 0, vx: 0, vy: 0 };
  const stiffness = 0.15;
  const damping = 0.75;

  function animate() {
    if (!visible) { rafId = requestAnimationFrame(animate); return; }

    // Ring with spring
    const dx = mouseX - ringX;
    const dy = mouseY - ringY;
    spring.vx = (spring.vx + dx * stiffness) * damping;
    spring.vy = (spring.vy + dy * stiffness) * damping;
    ringX += spring.vx;
    ringY += spring.vy;

    ring.style.transform = `translate(${ringX}px, ${ringY}px) translate(-50%, -50%)`;
    dot.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;

    rafId = requestAnimationFrame(animate);
  }

  function onMove(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
  }

  function onEnter() {
    ring.style.opacity = '1';
    dot.style.opacity = '1';
  }
  function onLeave() {
    ring.style.opacity = '0';
    dot.style.opacity = '0';
  }

  function onOver(e) {
    const target = e.target.closest('a, button, [data-hover], input, textarea, select, .font-card, .poster, .tester-btn, .tester-font-btn, .magnetic, .timeline-item');
    if (target) {
      ring.classList.add('hover');
      dot.classList.add('hover');
    }
  }
  function onOut(e) {
    const target = e.target.closest('a, button, [data-hover], input, textarea, select, .font-card, .poster, .tester-btn, .tester-font-btn, .magnetic, .timeline-item');
    if (target) {
      ring.classList.remove('hover');
      dot.classList.remove('hover');
    }
  }

  function onClick(e) {
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    ripple.classList.remove('active');
    // Force reflow
    void ripple.offsetWidth;
    ripple.classList.add('active');
  }

  function onVisibility() {
    visible = !document.hidden;
  }

  window.addEventListener('mousemove', onMove, { passive: true });
  window.addEventListener('mouseenter', onEnter);
  window.addEventListener('mouseleave', onLeave);
  document.addEventListener('mouseover', onOver);
  document.addEventListener('mouseout', onOut);
  window.addEventListener('click', onClick);
  document.addEventListener('visibilitychange', onVisibility);

  // Initial position
  ring.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
  dot.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
  ring.style.opacity = '1';
  dot.style.opacity = '1';

  rafId = requestAnimationFrame(animate);

  // Cleanup
  window.addEventListener('beforeunload', () => {
    cancelAnimationFrame(rafId);
  });
})();

/* ============ 3D TILT for font cards (vanilla JS, direct DOM) ============ */
(function initTilt() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) return;

  let activeCard = null;
  let rafId = null;
  let targetRotX = 0, targetRotY = 0;
  let currentRotX = 0, currentRotY = 0;

  function animate() {
    if (activeCard) {
      currentRotX += (targetRotX - currentRotX) * 0.1;
      currentRotY += (targetRotY - currentRotY) * 0.1;
      const inner = activeCard.querySelector('.font-card-inner');
      if (inner) {
        inner.style.transform = `perspective(1000px) rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
      }
    }
    rafId = requestAnimationFrame(animate);
  }

  document.addEventListener('mouseover', (e) => {
    const card = e.target.closest('.font-card');
    if (card && !activeCard) {
      activeCard = card;
    }
  });

  document.addEventListener('mousemove', (e) => {
    if (!activeCard) return;
    const rect = activeCard.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;
    targetRotY = ((x - centerX) / centerX) * 8;
    targetRotX = -((y - centerY) / centerY) * 8;
  });

  document.addEventListener('mouseout', (e) => {
    const card = e.target.closest('.font-card');
    if (card && card === activeCard && !e.relatedTarget?.closest('.font-card')) {
      const inner = activeCard.querySelector('.font-card-inner');
      if (inner) inner.style.transform = '';
      activeCard = null;
      targetRotX = 0; targetRotY = 0;
      currentRotX = 0; currentRotY = 0;
    }
  });

  rafId = requestAnimationFrame(animate);
})();

/* ============ PARALLAX for posters (vanilla JS, direct DOM) ============ */
(function initParallax() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) return;

  let activePoster = null;
  let rafId = null;
  let targetX = 0, targetY = 0;
  let currentX = 0, currentY = 0;
  let strength = 0;

  function animate() {
    if (activePoster) {
      currentX += (targetX - currentX) * 0.08;
      currentY += (targetY - currentY) * 0.08;
      const inner = activePoster.querySelector('.poster-inner');
      if (inner) {
        inner.style.transform = `translate(${currentX}px, ${currentY}px) scale(${1 + strength})`;
      }
    }
    rafId = requestAnimationFrame(animate);
  }

  document.addEventListener('mouseover', (e) => {
    const poster = e.target.closest('.poster');
    if (poster && !activePoster) {
      activePoster = poster;
      strength = poster.classList.contains('poster-1') ? 0.08 : poster.classList.contains('poster-2') ? 0.06 : 0.05;
    }
  });

  document.addEventListener('mousemove', (e) => {
    if (!activePoster) return;
    const rect = activePoster.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const centerX = rect.width / 2;
    const centerY = rect.height / 2;
    targetX = ((x - centerX) / centerX) * -15;
    targetY = ((y - centerY) / centerY) * -15;
  });

  document.addEventListener('mouseout', (e) => {
    const poster = e.target.closest('.poster');
    if (poster && poster === activePoster && !e.relatedTarget?.closest('.poster')) {
      const inner = activePoster.querySelector('.poster-inner');
      if (inner) inner.style.transform = '';
      activePoster = null;
      targetX = 0; targetY = 0;
      currentX = 0; currentY = 0;
    }
  });

  rafId = requestAnimationFrame(animate);
})();

/* ============ SCROLL REVEAL (IntersectionObserver) ============ */
(function initReveal() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) return;

  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -60px 0px' });

  document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));
})();

/* ============ NUMBER COUNTER with easing ============ */
function animateCounter(el, target, duration = 2000) {
  const start = 0;
  const startTime = performance.now();
  let rafId = null;

  function easeOutExpo(t) {
    return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
  }

  function tick(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = easeOutExpo(progress);
    const value = Math.floor(start + (target - start) * eased);
    el.textContent = value.toLocaleString();
    if (progress < 1) {
      rafId = requestAnimationFrame(tick);
    }
  }

  rafId = requestAnimationFrame(tick);

  return () => cancelAnimationFrame(rafId);
}

(function initCounters() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const counters = document.querySelectorAll('[data-count]');
  if (!counters.length) return;

  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        const target = parseInt(entry.target.dataset.count, 10);
        if (reduced) {
          entry.target.textContent = target.toLocaleString();
        } else {
          animateCounter(entry.target, target);
        }
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.5 });

  counters.forEach((el) => observer.observe(el));
})();

/* ============ MAGNETIC BUTTONS ============ */
(function initMagnetic() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) return;

  let activeBtn = null;
  let rafId = null;
  let targetX = 0, targetY = 0;
  let currentX = 0, currentY = 0;
  let radius = 100;
  let strength = 0.3;

  function animate() {
    if (activeBtn) {
      currentX += (targetX - currentX) * 0.15;
      currentY += (targetY - currentY) * 0.15;
      activeBtn.style.transform = `translate(${currentX}px, ${currentY}px)`;
    }
    rafId = requestAnimationFrame(animate);
  }

  function handleMove(e) {
    const btn = e.target.closest('.magnetic');
    if (btn) {
      if (!activeBtn) activeBtn = btn;
      if (btn === activeBtn) {
        const rect = btn.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = e.clientX - cx;
        const dy = e.clientY - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < radius) {
          const force = (1 - dist / radius) * strength;
          targetX = dx * force;
          targetY = dy * force;
        } else {
          targetX = 0;
          targetY = 0;
        }
      }
    } else if (activeBtn) {
      targetX = 0;
      targetY = 0;
      // Check if near zero
      if (Math.abs(currentX) < 0.5 && Math.abs(currentY) < 0.5) {
        activeBtn.style.transform = '';
        activeBtn = null;
        currentX = 0; currentY = 0;
      }
    }
  }

  window.addEventListener('mousemove', handleMove, { passive: true });
  rafId = requestAnimationFrame(animate);
})();

/* ============ TYPEWRITER HERO ============ */
function TypewriterHero() {
  const [text, setText] = useState('');
  const [wordIndex, setWordIndex] = useState(0);
  const [phase, setPhase] = useState('typing'); // typing, pause, deleting
  const words = ['铸字', '排版', '设计', '传播', '创造'];
  const fullPhrase = 'HAAS 活字铸造所';

  // Initial typewriter for the whole phrase
  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) { setText(fullPhrase); return; }

    let charIndex = 0;
    let timer = null;

    function type() {
      if (charIndex <= fullPhrase.length) {
        setText(fullPhrase.slice(0, charIndex));
        charIndex++;
        timer = setTimeout(type, 120 + Math.random() * 80);
      }
    }
    timer = setTimeout(type, 800);

    return () => clearTimeout(timer);
  }, []);

  return (
    <>
      {text}
      <span className="typewriter-cursor"></span>
    </>
  );
}

/* ============ TYPE TESTER ============ */
function TypeTester() {
  const [sampleText, setSampleText] = useState('Typography');

  const previewStyle = {
    fontSize: `${fontSize}px`,

    letterSpacing: `${letterSpacing}px`,

    fontFamily: getFontFamily(),
  };

  return (

          <label>输入文字 Input</label>

          />
        </div>

        <div className="tester-control">
          <label>字体家族 Family</label>
          <div className="tester-font-family">
            <button
              className={`tester-font-btn ${fontFamily === 'inter' ? 'active' : ''}`}
              onClick={() => setFontFamily('inter')}
            >Sans</button>
            <button
              className={`tester-font-btn ${fontFamily === 'serif' ? 'active' : ''}`}
              onClick={() => setFontFamily('serif')}
            >Serif</button>
            <button
              className={`tester-font-btn ${fontFamily === 'mono' ? 'active' : ''}`}
              onClick={() => setFontFamily('mono')}
            >Mono</button>
          </div>
        </div>

        <div className="tester-control">
          <label>字号 Size — {fontSize}px</label>
          <div className="tester-range-wrap">
            <input
              type="range"
              className="tester-range"
              min="24"
              max="200"
              value={fontSize}
              onChange={(e) => setFontSize(Number(e.target.value))}
            />
            <span className="tester-range-value">{fontSize}</span>
          </div>
        </div>

        <div className="tester-control">
          <label>字重 Weight</label>
          <div className="tester-buttons">
            {weightOptions.map((w) => (
              <button
                key={w}
                className={`tester-btn ${fontWeight === w ? 'active' : ''}`}
                onClick={() => setFontWeight(w)}

                {w}
              </button>
            ))}
          </div>
        </div>

        <div className="tester-control">
          <label>字距 Tracking — {letterSpacing}px</label>
          <div className="tester-range-wrap">
            <input
              type="range"
              className="tester-range"
              min="-10"
              max="20"
              value={letterSpacing}
              onChange={(e) => setLetterSpacing(Number(e.target.value))}
            />
            <span className="tester-range-value">{letterSpacing}</span>
          </div>
        </div>

        <div className="tester-control">
          <label>对齐 Align</label>
          <div className="tester-buttons">
            <button
              className={`tester-btn ${align === 'left' ? 'active' : ''}`}
              onClick={() => setAlign('left')}
            >左</button>
            <button
              className={`tester-btn ${align === 'center' ? 'active' : ''}`}
              onClick={() => setAlign('center')}
            >中</button>
            <button
              className={`tester-btn ${align === 'right' ? 'active' : ''}`}
              onClick={() => setAlign('right')}
            >右</button>
          </div>
        </div>

        <div className="tester-control">
          <label>预设 Presets</label>
          <div className="tester-buttons">
            <button className="tester-btn" onClick={() => {
              setFontSize(120); setFontWeight(900); setLetterSpacing(-4);
            }}>海报</button>
            <button className="tester-btn" onClick={() => {
              setFontSize(48); setFontWeight(600); setLetterSpacing(0);

            setAlign('left');
            setFontFamily('inter');
          }}>↺ 恢复默认</button>
        </div>
      </div>
    </div>
  );

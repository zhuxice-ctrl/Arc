<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>Obsidian Field Station — Volcano Observatory</title>
<link rel="preconnect" href="https://miaoda.feishu.cn" />
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />
<style>
/* ─── Design Tokens ─── */
:root {
  --basalt-950: #0d0a07;
  --basalt-900: #1a1510;
  --basalt-800: #26201a;
  --basalt-700: #3a322a;
  --basalt-600: #54493d;
  --ash-50: #ede5d8;
  --ash-100: #d9cfbe;
  --ash-200: #b8ac97;
  --lava: #e85d26;
  --lava-glow: #ff7a3d;
  --copper: #c9853a;
  --copper-light: #d9a35a;
  --sulfur: #e8c84a;
  --obsidian: #0a0806;
  --danger: #d9352a;
  --safe: #5a8a4a;

  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: var(--basalt-900);
  color: var(--ash-50);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
  cursor: none;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  html, body { cursor: auto; }
}

::selection { background: var(--lava); color: var(--basalt-950); }

/* ─── Custom Cursor ─── */
.cursor-outer, .cursor-inner, .cursor-glow {
  position: fixed;
  top: 0; left: 0;
  pointer-events: none;
  z-index: 99999;
  will-change: transform;
}
.cursor-outer {
  width: 36px; height: 36px;
  border: 2px solid var(--ash-50);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: width 0.25s cubic-bezier(.2,.9,.3,1.3), height 0.25s cubic-bezier(.2,.9,.3,1.3), border-color 0.2s, background 0.2s;
  mix-blend-mode: difference;
}
.cursor-inner {
  width: 6px; height: 6px;
  background: var(--lava);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 12px var(--lava), 0 0 4px var(--lava-glow);
}
.cursor-glow {
  width: 120px; height: 120px;
  background: radial-gradient(circle, rgba(232,93,38,0.15) 0%, transparent 70%);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: opacity 0.3s;
}
.cursor-hover .cursor-outer {
  width: 56px; height: 56px;
  border-color: var(--lava);
  background: rgba(232,93,38,0.08);
}
.cursor-click .cursor-outer {
  width: 24px; height: 24px;
  background: rgba(232,93,38,0.3);
}
.cursor-ripple {
  position: fixed;
  pointer-events: none;
  z-index: 99998;
  border: 1.5px solid var(--lava);
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(0);
  animation: rippleExpand 0.6s cubic-bezier(.16,.84,.44,1) forwards;
  opacity: 1;
}
@keyframes rippleExpand {
  to { transform: translate(-50%, -50%) scale(3.5); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .cursor-outer, .cursor-inner, .cursor-glow, .cursor-ripple { display: none; }
}

/* ─── Navigation ─── */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 20px 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  backdrop-filter: blur(12px);
  background: rgba(13,10,7,0.4);
  border-bottom: 1px solid rgba(201,133,58,0.15);
  transition: background 0.3s, padding 0.3s;
}
.nav.scrolled {
  padding: 14px 40px;
  background: rgba(13,10,7,0.85);
}
.nav-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 18px;
  letter-spacing: 0.02em;
}
.nav-brand-mark {
  width: 32px; height: 32px;
  position: relative;
}
.nav-brand-mark svg { width: 100%; height: 100%; }
.nav-brand-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ash-200);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-top: 2px;
}
.nav-links {
  display: flex;
  gap: 36px;
  list-style: none;
}
.nav-link {
  font-size: 13px;
  font-weight: 500;
  color: var(--ash-100);
  text-decoration: none;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  position: relative;
  padding: 6px 0;
  transition: color 0.25s;
}
.nav-link::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0;
  width: 0; height: 1px;
  background: var(--lava);
  transition: width 0.3s cubic-bezier(.2,.9,.3,1);
}
.nav-link:hover { color: var(--ash-50); }
.nav-link:hover::after { width: 100%; }
.nav-status {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ash-200);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--safe);
  box-shadow: 0 0 8px var(--safe);
  animation: pulseDot 2s ease-in-out infinite;
}
.status-dot.warn { background: var(--sulfur); box-shadow: 0 0 8px var(--sulfur); }
.status-dot.danger { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.4); }
}

/* ─── Hero ─── */
.hero {
  position: relative;
  height: 100vh;
  min-height: 700px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.hero-bg {
  position: absolute;
  inset: 0;
  background-image: url('/spark/app/app_17c86xpnrsu/runtime/api/v1/storage/object/bucket_aadkqhfnrvypo_static/static%2Faadkqg5bivydg_ve_miaoda');
  background-size: cover;
  background-position: center;
  filter: brightness(0.55) contrast(1.1) saturate(0.9);
  will-change: transform;
}
.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(13,10,7,0.3) 0%, rgba(13,10,7,0.1) 40%, rgba(13,10,7,0.7) 80%, var(--basalt-900) 100%);
}
.hero-vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(10,8,6,0.7) 100%);
}
.hero-content {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 0 40px;
  max-width: 1000px;
}
.hero-eyebrow {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--copper-light);
  margin-bottom: 24px;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 1s ease 0.3s forwards;
}
.hero-title {
  font-family: var(--font-display);
  font-size: clamp(48px, 9vw, 128px);
  font-weight: 300;
  line-height: 0.95;
  letter-spacing: -0.02em;
  margin-bottom: 28px;
  opacity: 0;
  transform: translateY(30px);
  animation: fadeUp 1.2s cubic-bezier(.2,.8,.2,1) 0.5s forwards;
}
.hero-title em {
  font-style: italic;
  font-weight: 600;
  color: var(--lava);
  text-shadow: 0 0 40px rgba(232,93,38,0.4);
}
.hero-subtitle {
  font-size: 18px;
  font-weight: 300;
  color: var(--ash-100);
  max-width: 600px;
  margin: 0 auto 40px;
  line-height: 1.7;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 1s ease 0.8s forwards;
}
.hero-cta {
  display: flex;
  gap: 16px;
  justify-content: center;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 1s ease 1s forwards;
}
.btn {
  padding: 14px 28px;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.04em;
  border: 1px solid transparent;
  border-radius: 0;
  cursor: none;
  transition: all 0.3s cubic-bezier(.2,.9,.3,1);
  position: relative;
  overflow: hidden;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.btn-primary {
  background: var(--lava);
  color: var(--basalt-950);
  border-color: var(--lava);
  font-weight: 600;
}
.btn-primary:hover {
  background: var(--lava-glow);
  border-color: var(--lava-glow);
  box-shadow: 0 0 30px rgba(232,93,38,0.5);
  transform: translateY(-2px);
}
.btn-ghost {
  background: transparent;
  color: var(--ash-50);
  border-color: rgba(237,229,216,0.3);
}
.btn-ghost:hover {
  border-color: var(--ash-50);
  background: rgba(237,229,216,0.05);
  transform: translateY(-2px);
}
.btn-shine {
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transition: left 0.6s ease;
}
.btn:hover .btn-shine { left: 100%; }

.hero-scroll-indicator {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  opacity: 0;
  animation: fadeUp 1s ease 1.4s forwards;
}
.hero-scroll-indicator span {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--ash-200);
}
.scroll-line {
  width: 1px; height: 48px;
  background: linear-gradient(180deg, var(--copper), transparent);
  position: relative;
  overflow: hidden;
}
.scroll-line::after {
  content: '';
  position: absolute;
  top: -50%;
  left: 0;
  width: 100%; height: 50%;
  background: var(--lava);
  animation: scrollDown 2s cubic-bezier(.6,.05,.4,1) infinite;
}
@keyframes scrollDown {
  0% { top: -50%; }
  100% { top: 100%; }
}
@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

/* ─── Data Ticker ─── */
.ticker {
  background: var(--basalt-950);
  border-top: 1px solid rgba(201,133,58,0.2);
  border-bottom: 1px solid rgba(201,133,58,0.2);
  padding: 14px 0;
  overflow: hidden;
  position: relative;
}
.ticker-track {
  display: flex;
  gap: 60px;
  white-space: nowrap;
  animation: tickerScroll 40s linear infinite;
  will-change: transform;
}
.ticker-item {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ash-200);
}
.ticker-item strong {
  color: var(--copper-light);
  font-size: 14px;
}
@keyframes tickerScroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* ─── Section Base ─── */
.section {
  padding: 120px 40px;
  max-width: 1400px;
  margin: 0 auto;
}
.section-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 60px;
  gap: 40px;
  flex-wrap: wrap;
}
.section-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--copper);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.section-eyebrow::before {
  content: '';
  width: 24px; height: 1px;
  background: var(--copper);
}
.section-title {
  font-family: var(--font-display);
  font-size: clamp(36px, 5vw, 64px);
  font-weight: 400;
  line-height: 1.05;
  letter-spacing: -0.02em;
  max-width: 600px;
}
.section-title em { font-style: italic; color: var(--lava); }
.section-desc {
  max-width: 400px;
  font-size: 15px;
  color: var(--ash-200);
  line-height: 1.7;
}

.reveal {
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 0.8s cubic-bezier(.2,.8,.2,1), transform 0.8s cubic-bezier(.2,.8,.2,1);
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

/* ─── Live Monitoring Section ─── */
.monitor-section {
  background: var(--basalt-950);
  position: relative;
  overflow: hidden;
}
.monitor-section::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--copper), transparent);
}
.monitor-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 24px;
}
@media (max-width: 900px) {
  .monitor-grid { grid-template-columns: 1fr; }
}

.panel {
  background: var(--basalt-800);
  border: 1px solid rgba(201,133,58,0.15);
  padding: 24px;
  position: relative;
  transition: border-color 0.3s, transform 0.3s;
  will-change: transform;
}
.panel:hover {
  border-color: rgba(201,133,58,0.4);
}
.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid rgba(201,133,58,0.1);
}
.panel-title {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ash-200);
  display: flex;
  align-items: center;
  gap: 10px;
}
.panel-title .live-dot {
  width: 6px; height: 6px;
  background: var(--lava);
  border-radius: 50%;
  box-shadow: 0 0 6px var(--lava);
  animation: pulseDot 1.5s ease-in-out infinite;
}
.panel-time {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ash-200);
}

/* Seismograph */
.seismo-canvas-wrap {
  position: relative;
  height: 280px;
  background: var(--basalt-900);
  border: 1px solid rgba(201,133,58,0.1);
  overflow: hidden;
}
.seismo-canvas-wrap canvas {
  width: 100%; height: 100%;
  display: block;
}
.seismo-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(201,133,58,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(201,133,58,0.05) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}
.seismo-label {
  position: absolute;
  top: 12px; left: 16px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--copper);
  letter-spacing: 0.1em;
}
.seismo-value {
  position: absolute;
  top: 12px; right: 16px;
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--lava);
  letter-spacing: 0.05em;
}
.seismo-baseline {
  position: absolute;
  left: 0; right: 0;
  top: 50%;
  height: 1px;
  background: rgba(201,133,58,0.2);
  pointer-events: none;
}

/* Stats Grid */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}
.stat-card {
  background: var(--basalt-900);
  border: 1px solid rgba(201,133,58,0.1);
  padding: 20px;
  transition: all 0.3s cubic-bezier(.2,.9,.3,1);
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px; height: 0;
  background: var(--lava);
  transition: height 0.4s cubic-bezier(.2,.9,.3,1);
}
.stat-card:hover {
  border-color: rgba(232,93,38,0.4);
  transform: translateY(-3px);
  background: rgba(232,93,38,0.03);
}
.stat-card:hover::before { height: 100%; }
.stat-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ash-200);
  margin-bottom: 8px;
}
.stat-value {
  font-family: var(--font-display);
  font-size: 36px;
  font-weight: 600;
  color: var(--ash-50);
  line-height: 1;
  margin-bottom: 4px;
}
.stat-unit {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--copper-light);
}
.stat-trend {
  font-family: var(--font-mono);
  font-size: 10px;
  margin-top: 8px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.stat-trend.up { color: var(--danger); }
.stat-trend.down { color: var(--safe); }
.stat-trend svg { width: 10px; height: 10px; }

/* Right column vertical panels */
.side-panels {
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.tilt-meter {
  height: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.tilt-circle {
  width: 120px; height: 120px;
  border: 1px solid rgba(201,133,58,0.2);
  border-radius: 50%;
  position: relative;
  background: radial-gradient(circle, rgba(201,133,58,0.05), transparent 70%);
}
.tilt-bubble {
  position: absolute;
  width: 14px; height: 14px;
  background: var(--lava);
  border-radius: 50%;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 15px var(--lava), 0 0 4px var(--lava-glow) inset;
  will-change: transform;
  transition: transform 0.1s ease-out;
}
.tilt-cross-h, .tilt-cross-v {
  position: absolute;
  background: rgba(201,133,58,0.15);
}
.tilt-cross-h {
  top: 50%; left: 10%; right: 10%;
  height: 1px;
}
.tilt-cross-v {
  left: 50%; top: 10%; bottom: 10%;
  width: 1px;
}
.tilt-label-x, .tilt-label-y {
  position: absolute;
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--ash-200);
}
.tilt-label-x { bottom: 4px; right: 8px; }
.tilt-label-y { top: 4px; left: 8px; }

/* Gas spectrum bars */
.gas-bars {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  height: 120px;
  gap: 6px;
  padding-top: 20px;
}
.gas-bar {
  flex: 1;
  background: linear-gradient(180deg, var(--lava), var(--copper));
  border-radius: 2px 2px 0 0;
  position: relative;
  min-height: 4px;
  transition: height 0.3s ease;
  will-change: height;
}
.gas-bar::after {
  content: attr(data-gas);
  position: absolute;
  bottom: -18px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-mono);
  font-size: 8px;
  color: var(--ash-200);
  white-space: nowrap;
}

/* ─── Eruption Archive Timeline ─── */
.timeline-section {
  background: var(--basalt-900);
  position: relative;
}
.timeline {
  position: relative;
  padding: 40px 0;
}
.timeline::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 0; bottom: 0;
  width: 1px;
  background: linear-gradient(180deg, transparent, var(--copper) 10%, var(--copper) 90%, transparent);
  transform: translateX(-50%);
}
.timeline-item {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 60px;
  margin-bottom: 80px;
  position: relative;
}
.timeline-item:nth-child(even) { flex-direction: row-reverse; }
.timeline-item:last-child { margin-bottom: 0; }

.timeline-card {
  width: calc(50% - 60px);
  background: var(--basalt-800);
  border: 1px solid rgba(201,133,58,0.15);
  padding: 28px;
  position: relative;
  transition: all 0.4s cubic-bezier(.2,.9,.3,1);
  cursor: none;
}
.timeline-card:hover {
  border-color: rgba(232,93,38,0.5);
  transform: translateY(-4px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}
.timeline-card:hover .timeline-magnitude {
  text-shadow: 0 0 20px var(--lava);
}

.timeline-node {
  position: absolute;
  width: 20px; height: 20px;
  background: var(--basalt-900);
  border: 2px solid var(--copper);
  border-radius: 50%;
  top: 40px;
  z-index: 2;
  transition: all 0.3s;
}
.timeline-item:nth-child(odd) .timeline-node { right: -70px; }
.timeline-item:nth-child(even) .timeline-node { left: -70px; }
.timeline-card:hover + .timeline-node,
.timeline-item:hover .timeline-node {
  border-color: var(--lava);
  box-shadow: 0 0 20px var(--lava);
  background: var(--lava);
}
.timeline-year {
  font-family: var(--font-display);
  font-size: 48px;

<body>

<!-- Custom Cursor -->
<div class="cursor-glow" id="cursorGlow"></div>
<div class="cursor-outer" id="cursorOuter"></div>
<div class="cursor-inner" id="cursorInner"></div>

<div id="root"></div>

<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ─── Reduced motion detection ─── */
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ─── Global animation frame registry for visibility pausing ─── */
const animRegistry = new Set();
let isVisible = !document.hidden;

document.addEventListener('visibilitychange', () => {
  isVisible = !document.hidden;
  animRegistry.forEach(fn => {
    if (typeof fn.toggle === 'function') fn.toggle(isVisible);
  });
});

function registerAnim(ctrl) {
  animRegistry.add(ctrl);
  return () => animRegistry.delete(ctrl);
}

/* ================================================
   CUSTOM CURSOR
   ================================================ */
function initCursor() {
  if (reducedMotion) return;
  const outer = document.getElementById('cursorOuter');
  const inner = document.getElementById('cursorInner');
  const glow = document.getElementById('cursorGlow');
  if (!outer || !inner || !glow) return;

  // Start at screen center
  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let outerX = mouseX;
  let outerY = mouseY;
  let glowX = mouseX;
  let glowY = mouseY;

  // Spring physics for outer ring (smoother follow)
  const spring = { stiffness: 0.18, damping: 0.7 };
  let velX = 0, velY = 0;
  let glowVelX = 0, glowVelY = 0;

  let rafId = null;
  let running = true;

  function tick() {
    if (!running) return;
    // Outer ring with spring
    const dx = mouseX - outerX;
    const dy = mouseY - outerY;
    const ax = dx * spring.stiffness;
    const ay = dy * spring.stiffness;
    velX = (velX + ax) * spring.damping;
    velY = (velY + ay) * spring.damping;
    outerX += velX;
    outerY += velY;
    outer.style.transform = `translate(${outerX}px, ${outerY}px) translate(-50%, -50%)`;

    // Inner dot direct
    inner.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;

    // Glow with heavier damping
    const gdx = mouseX - glowX;
    const gdy = mouseY - glowY;
    glowVelX = (glowVelX + gdx * 0.05) * 0.85;
    glowVelY = (glowVelY + gdy * 0.05) * 0.85;
    glowX += glowVelX;
    glowY += glowVelY;
    glow.style.transform = `translate(${glowX}px, ${glowY}px) translate(-50%, -50%)`;

    rafId = requestAnimationFrame(tick);
  }
  tick();

  function onMove(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
  }

  // Hover state
  function onOver(e) {
    const target = e.target.closest('a, button, .log-card, .specimen-card, .timeline-card, .stat-card, .control-chip, input, textarea');
    if (target) {
      document.body.classList.add('cursor-hover');
    }
  }
  function onOut(e) {
    const target = e.target.closest('a, button, .log-card, .specimen-card, .timeline-card, .stat-card, .control-chip, input, textarea');
    if (target) {
      document.body.classList.remove('cursor-hover');
    }
  }
  function onClick(e) {
    document.body.classList.add('cursor-click');
    setTimeout(() => document.body.classList.remove('cursor-click'), 200);
    // Ripple
    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    ripple.style.width = '30px';
    ripple.style.height = '30px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  }

  window.addEventListener('mousemove', onMove);
  document.addEventListener('mouseover', onOver);
  document.addEventListener('mouseout', onOut);
  document.addEventListener('click', onClick);

  const ctrl = {
    toggle(v) {
      running = v;
      if (v && !rafId) tick();
    }
  };
  registerAnim(ctrl);

  return () => {
    running = false;
    cancelAnimationFrame(rafId);
    window.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseover', onOver);
    document.removeEventListener('mouseout', onOut);
    document.removeEventListener('click', onClick);
    animRegistry.delete(ctrl);
  };
}

/* ================================================
   SEISMOGRAPH COMPONENT (Canvas waveform)
   ================================================ */
function Seismograph() {
  const canvasRef = useRef(null);
  const [magnitude, setMagnitude] = useState(0.0);
  const [time, setTime] = useState('');
  const rafRef = useRef(null);
  const dataRef = useRef([]);
  const maxPoints = 500;

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    let w, h;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      w = rect.width;
      h = rect.height;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.scale(dpr, dpr);
    }
    resize();
    window.addEventListener('resize', resize);

    // Generate initial data
    for (let i = 0; i < maxPoints; i++) {
      dataRef.current.push(0);
    }

    let phase = 0;
    let tremorPhase = 0;
    let spikeTimer = 0;
    let spikeAmp = 0;
    let running = true;

    function draw() {
      if (!running) return;
      ctx.clearRect(0, 0, w, h);

      // Advance phase
      phase += 0.02;
      tremorPhase += 0.08;

      // Occasional micro-quake spike
      spikeTimer--;
      if (spikeTimer <= 0) {
        spikeAmp = Math.random() * 0.8 + 0.2;
        spikeTimer = Math.floor(Math.random() * 120) + 60;
      }
      spikeAmp *= 0.94;

      // Generate new data point with multiple frequencies + noise
      const baseFreq = Math.sin(phase) * 0.15;
      const midFreq = Math.sin(tremorPhase * 2.3) * 0.1;
      const highFreq = Math.sin(phase * 7.1) * 0.05;
      const noise = (Math.random() - 0.5) * 0.08;
      const spike = (Math.random() - 0.5) * spikeAmp * 2;
      let val = baseFreq + midFreq + highFreq + noise + spike;

      // Clamp
      val = Math.max(-1, Math.min(1, val));
      dataRef.current.push(val);
      if (dataRef.current.length > maxPoints) dataRef.current.shift();

      // Calculate current magnitude
      const recent = dataRef.current.slice(-50);
      const rms = Math.sqrt(recent.reduce((s, v) => s + v * v, 0) / recent.length);
      const mag = Math.round(rms * 50 * 10) / 10;
      setMagnitude(mag);

      // Draw waveform
      ctx.beginPath();
      const centerY = h / 2;
      const amp = h * 0.4;
      const step = w / maxPoints;

      // Glow trail
      ctx.strokeStyle = 'rgba(232, 93, 38, 0.15)';
      ctx.lineWidth = 8;
      for (let i = 0; i < dataRef.current.length; i++) {
        const x = i * step;
        const y = centerY + dataRef.current[i] * amp;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // Main line
      ctx.beginPath();
      ctx.strokeStyle = '#e85d26';
      ctx.lineWidth = 1.5;
      ctx.shadowColor = '#e85d26';
      ctx.shadowBlur = 6;
      for (let i = 0; i < dataRef.current.length; i++) {
        const x = i * step;
        const y = centerY + dataRef.current[i] * amp;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;

      rafRef.current = requestAnimationFrame(draw);
    }
    draw();

    const ctrl = { toggle(v) { running = v; if (v && !rafRef.current) draw(); } };
    registerAnim(ctrl);

    return () => {
      running = false;
      cancelAnimationFrame(rafRef.current);
      window.removeEventListener('resize', resize);
      animRegistry.delete(ctrl);
    };
  }, []);

  // Clock
  useEffect(() => {
    const update = () => {
      const d = new Date();
      setTime(d.toLocaleTimeString('en-US', { hour12: false }));
    };
    update();
    const id = setInterval(update, 1000);
    return () => clearInterval(id);
  }, []);

  return (
    <div className="panel">
      <div className="panel-header">
        <div className="panel-title">
          <span className="live-dot"></span>
          Seismic Waveform — Station OBS-07
        </div>
        <div className="panel-time">{time} UTC</div>
      </div>
      <div className="seismo-canvas-wrap">
        <div className="seismo-grid"></div>
        <div className="seismo-label">VERTICAL COMPONENT · BHZ · 40 Hz</div>
        <div className="seismo-value">M {magnitude.toFixed(1)}</div>
        <div className="seismo-baseline"></div>
        <canvas ref={canvasRef}></canvas>
      </div>
    </div>
  );
}

/* ================================================
   TILT METER (magnetic bubble follows mouse)
   ================================================ */
function TiltMeter() {
  const bubbleRef = useRef(null);
  const containerRef = useRef(null);
  const posRef = useRef({ x: 0, y: 0 });
  const targetRef = useRef({ x: 0, y: 0 });
  const rafRef = useRef(null);

  useEffect(() => {
    let velX = 0, velY = 0;
    let running = true;

    function tick() {
      if (!running) return;
      const pos = posRef.current;
      const target = targetRef.current;
      // Spring
      const ax = (target.x - pos.x) * 0.08;
      const ay = (target.y - pos.y) * 0.08;
      velX = (velX + ax) * 0.75;
      velY = (velY + ay) * 0.75;
      pos.x += velX;
      pos.y += velY;

      if (bubbleRef.current) {
        bubbleRef.current.style.transform = `translate(calc(-50% + ${pos.x}px), calc(-50% + ${pos.y}px))`;
      }
      rafRef.current = requestAnimationFrame(tick);
    }
    tick();

    const ctrl = { toggle(v) { running = v; if (v && !rafRef.current) tick(); } };
    registerAnim(ctrl);

    return () => {
      running = false;
      cancelAnimationFrame(rafRef.current);
      animRegistry.delete(ctrl);
    };
  }, []);

  useEffect(() => {
    function onMove(e) {
      if (!containerRef.current) return;
      const rect = containerRef.current.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      // Inverse square falloff: bubble moves with mouse but clamped
      const maxDist = 40;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const scale = Math.min(1, maxDist / Math.max(dist, 1)) * 0.6;
      targetRef.current.x = dx * scale;
      targetRef.current.y = dy * scale;
    }
    window.addEventListener('mousemove', onMove);
    return () => window.removeEventListener('mousemove', onMove);
  }, []);

  return (
    <div className="panel">
      <div className="panel-header">
        <div className="panel-title">Tiltmeter · Ground Deformation</div>
      </div>
      <div className="tilt-meter" ref={containerRef}>
        <div className="tilt-circle">
          <div className="tilt-cross-h"></div>
          <div className="tilt-cross-v"></div>
          <div className="tilt-bubble" ref={bubbleRef}></div>
          <div className="tilt-label-x">X ± 0.4 µrad</div>
          <div className="tilt-label-y">Y ± 0.2 µrad</div>
        </div>
      </div>
    </div>
  );
}

function GasSpectrum() {
  const barsRef = useRef([]);
  const gases = ['SO₂', 'CO₂', 'H₂S', 'HCl', 'HF', 'He', 'CH₄', 'N₂'];
  const baseHeights = [85, 92, 40, 28, 15, 22, 18, 65];

  useEffect(() => {
    let running = true;
    let rafId = null;

    function tick() {
      if (!running) return;
      barsRef.current.forEach((bar, i) => {
        if (!bar) return;
        const base = baseHeights[i];
        const wobble = Math.sin(Date.now() * 0.002 + i * 1.3) * 10;
        const noise = (Math.random() - 0.5) * 4;
        const h = Math.max(4, base + wobble + noise);
        bar.style.height = h + '%';
      });
      rafId = requestAnimationFrame(tick);
    }
    if (!reducedMotion) tick();

    const ctrl = { toggle(v) { running = v; if (v && !reducedMotion && !rafId) tick(); } };
    registerAnim(ctrl);

    return () => {
      running = false;
      cancelAnimationFrame(rafId);
      animRegistry.delete(ctrl);
    };
  }, []);

  return (
    <div className="panel">
      <div className="panel-header">
        <div className="panel-title">
          <span className="live-dot"></span>
          Fumarole Gas Analysis
        </div>
      </div>

          <div
            key={g}
            className="gas-bar"
            data-gas={g}
            ref={el => barsRef.current[i] = el}
            style={{ height: baseHeights[i] + '%' }}
          ></div>
        ))}
      </div>
    </div>
  );
}

/* ================================================
   ASH PARTICLE FIELD
   ================================================ */
function AshObservatory() {
  const [intensity, setIntensity] = useState('moderate');
  const [count, setCount] = useState(120);
  const containerRef = useRef(null);
  const particlesRef = useRef([]);
  const rafRef = useRef(null);
  const windRef = useRef(0.6);

  const intensities = [
    { id: 'calm', label: 'Calm', count: 30, wind: 0.2 },
    { id: 'moderate', label: 'Moderate', count: 120, wind: 0.6 },
    { id: 'heavy', label: 'Heavy Ash', count: 300, wind: 1.2 },
    { id: 'plume', label: 'Eruption Plume', count: 500, wind: 2.0 },
  ];

  useEffect(() => {
    const cfg = intensities.find(i => i.id === intensity);
    if (!cfg) return;
    setCount(cfg.count);
    windRef.current = cfg.wind;
  }, [intensity]);

  useEffect(() => {
    if (reducedMotion) return;
    const container = containerRef.current;
    if (!container) return;
    let W = container.offsetWidth;
    let H = container.offsetHeight;

    function createParticle() {
      const p = document.createElement('div');
      p.className = 'ash-particle';
      const size = Math.random() * 3 + 1;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.opacity = Math.random() * 0.5 + 0.2;
      const x = Math.random() * W;
      const y = Math.random() * H;
      const speed = Math.random() * 0.5 + 0.2;
      const drift = Math.random() * 0.4 - 0.2;
      const wobbleFreq = Math.random() * 0.02 + 0.005;
      const wobbleAmp = Math.random() * 20 + 10;
      container.appendChild(p);
      return { el: p, x, y, speed, drift, wobbleFreq, wobbleAmp, phase: Math.random() * Math.PI * 2, size };
    }

    function resize() {
      W = container.offsetWidth;
      H = container.offsetHeight;
    }
    window.addEventListener('resize', resize);

    // Initialize particles
    let particles = [];
    for (let i = 0; i < count; i++) {
      particles.push(createParticle());
    }
    particlesRef.current = particles;

    let running = true;
    let frame = 0;

    function tick() {
      if (!running) return;
      frame++;
      const wind = windRef.current;
      particles.forEach(p => {
        p.y += p.speed;
        p.x += wind + p.drift + Math.sin(frame * p.wobbleFreq + p.phase) * 0.3;
        p.phase += 0.005;

        if (p.y > H + 10) {
          p.y = -10;
          p.x = Math.random() * W;
        }
        if (p.x > W + 20) p.x = -20;
        if (p.x < -20) p.x = W + 20;

        p.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
      });
      rafRef.current = requestAnimationFrame(tick);
    }
    tick();

    const ctrl = { toggle(v) { running = v; if (v && !rafRef.current) tick(); } };
    registerAnim(ctrl);

    return () => {
      running = false;
      cancelAnimationFrame(rafRef.current);
      window.removeEventListener('resize', resize);
      particles.forEach(p => p.el.remove());
      animRegistry.delete(ctrl);
    };
  }, [count]);

  const stats = [
    { val: '2.3 km', label: 'Plume Height' },
    { val: '14 kt/d', label: 'SO₂ Emission' },
    { val: '32 km', label: 'Drift Range' },
    { val: 'Fine Ash', label: 'Dominant Type' },
  ];

  return (
    <div>
      <div className="ash-visual" ref={containerRef}></div>
      <div className="ash-controls">
        {intensities.map(i => (
          <button
            key={i.id}
            className={`control-chip ${intensity === i.id ? 'active' : ''}`}
            onClick={() => setIntensity(i.id)}
          >
            {i.label}
          </button>
        ))}
      </div>
      <div className="ash-stats">
        {stats.map(s => (
          <div key={s.label} className="ash-stat">
            <div className="ash-stat-val">{s.val}</div>
            <div className="ash-stat-label">{s.label}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ================================================
   TYPEWRITER EFFECT
   ================================================ */
function Typewriter({ text, speed = 50, delay = 0 }) {
  const [shown, setShown] = useState('');
  const [done, setDone] = useState(false);

  useEffect(() => {
    let i = 0;
    let timeoutId;
    const start = setTimeout(() => {
      function type() {
        if (i < text.length) {
          setShown(text.slice(0, i + 1));
          i++;
          timeoutId = setTimeout(type, speed + Math.random() * 30);
        } else {
          setDone(true);
        }
      }
      type();
    }, delay);

    return () => {
      clearTimeout(start);
      clearTimeout(timeoutId);
    };
  }, [text, speed, delay]);

  return (
    <span>
      {shown}
      {!done && <span className="typewriter-cursor"></span>}
    </span>
  );
}

/* ================================================
   COUNTER ANIMATION (scroll-triggered)
   ================================================ */
function Counter({ target, suffix = '', duration = 2000, decimals = 0 }) {
  const [val, setVal] = useState(0);
  const ref = useRef(null);
  const startedRef = useRef(false);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting && !startedRef.current) {
          startedRef.current = true;
          const startTime = performance.now();
          const startVal = 0;

          function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

          function step(now) {
            const elapsed = now - startTime;
            const t = Math.min(1, elapsed / duration);
            const eased = easeOutCubic(t);
            const current = startVal + (target - startVal) * eased;
            setVal(decimals > 0 ? parseFloat(current.toFixed(decimals)) : Math.floor(current));
            if (t < 1) requestAnimationFrame(step);
          }
          requestAnimationFrame(step);
        }
      });
    }, { threshold: 0.3 });
    observer.observe(el);
    return () => observer.disconnect();
  }, [target, duration, decimals]);

  return <span ref={ref}>{val}{suffix}</span>;
}

/* ================================================
   MAGNETIC CARD HOOK (3D tilt + magnetic pull)
   ================================================ */
function useMagneticTilt(ref, strength = 15) {
  useEffect(() => {
    const el = ref.current;
    if (!el || reducedMotion) return;

    let rafId = null;
    let targetRx = 0, targetRy = 0;
    let currentRx = 0, currentRy = 0;
    let targetTx = 0, targetTy = 0;
    let currentTx = 0, currentTy = 0;
    let hovering = false;
    let running = true;

    function tick() {
      if (!running) return;
      // Damped spring
      currentRx += (targetRx - currentRx) * 0.1;
      currentRy += (targetRy - currentRy) * 0.1;
      currentTx += (targetTx - currentTx) * 0.1;
      currentTy += (targetTy - currentTy) * 0.1;

      el.style.transform = `perspective(800px) rotateX(${currentRx}deg) rotateY(${currentRy}deg) translate(${currentTx}px, ${currentTy}px)`;
      rafId = requestAnimationFrame(tick);
    }

    function onMove(e) {
      const rect = el.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const px = (e.clientX - cx) / (rect.width / 2);
      const py = (e.clientY - cy) / (rect.height / 2);
      // Magnetic pull: inverse square-ish
      const dist = Math.sqrt(px * px + py * py);
      const pull = Math.min(1, 1 / Math.max(dist, 0.3)) * 0.3;
      targetRy = px * strength * pull;
      targetRx = -py * strength * pull;
      targetTx = px * strength * 0.5 * pull;
      targetTy = py * strength * 0.5 * pull;
    }

    function onEnter() {
      hovering = true;
      if (!rafId) tick();
    }
    function onLeave() {
      hovering = false;
      targetRx = 0; targetRy = 0;
      targetTx = 0; targetTy = 0;
    }

    el.addEventListener('mousemove', onMove);
    el.addEventListener('mouseenter', onEnter);
    el.addEventListener('mouseleave', onLeave);

    // Start ticking to allow reset animation
    tick();

    const ctrl = { toggle(v) { running = v; if (v && !rafId) tick(); } };
    registerAnim(ctrl);

    return () => {
      running = false;
      cancelAnimationFrame(rafId);
      el.removeEventListener('mousemove', onMove);
      el.removeEventListener('mouseenter', onEnter);
      el.removeEventListener('mouseleave', onLeave);
      animRegistry.delete(ctrl);
    };
  }, [ref, strength]);
}

/* ================================================
   REVEAL ON SCROLL
   ================================================ */
function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          observer.unobserve(e.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -60px 0px' });
    els.forEach(el => observer.observe(el));
    return () => observer.disconnect();
  }, []);
}

/* ================================================
   PARALLAX HERO
   ================================================ */
function useHeroParallax() {
  useEffect(() => {
    if (reducedMotion) return;
    const bg = document.querySelector('.hero-bg');
    if (!bg) return;

    let targetY = 0;
    let currentY = 0;
    let rafId = null;
    let running = true;

    function tick() {
      if (!running) return;
      currentY += (targetY - currentY) * 0.08;
      bg.style.transform = `translateY(${currentY}px) scale(1.05)`;
      rafId = requestAnimationFrame(tick);
    }
    tick();

    function onScroll() {
      targetY = window.scrollY * 0.3;
    }
    window.addEventListener('scroll', onScroll, { passive: true });

    const ctrl = { toggle(v) { running = v; if (v && !rafId) tick(); } };
    registerAnim(ctrl);

    return () => {
      running = false;
      cancelAnimationFrame(rafId);
      window.removeEventListener('scroll', onScroll);
      animRegistry.delete(ctrl);
    };
  }, []);
}

/* ================================================
   NAV SCROLL STATE
   ================================================ */
function useNavScroll() {
  useEffect(() => {
    const nav = document.querySelector('.nav');
    if (!nav) return;
    function onScroll() {
      if (window.scrollY > 50) nav.classList.add('scrolled');
      else nav.classList.remove('scrolled');
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
}

              </div>
            ))}
          </div>
        </div>
      </section>

      {/* Eruption Archive Timeline */}
      <section className="section timeline-section" id="archive" style={{maxWidth: 'none', paddingLeft: 0, paddingRight: 0}}>
        <div className="section">
          <div className="section-header reveal">
            <div>
              <div className="section-eyebrow">Eruption Archive</div>
              <h2 className="section-title">Four centuries of <em>fire</em> and ash.</h2>
            </div>
            <p className="section-desc">
              Written records and geologic evidence tell the story of Obsidian Caldera's
              temperamental history — from gentle effusive flows to cataclysmic blasts.
            </p>
          </div>
          <div className="timeline">
            {eruptions.map((e, i) => (
              <div key={e.year} className="timeline-item reveal" style={{transitionDelay: `${i * 0.15}s`}}>
                <div className="timeline-card">
                  <div className="timeline-year">{e.year}</div>
                  <div className="timeline-name">{e.name}</div>
                  <div className="timeline-desc">{e.desc}</div>
                  <div className="timeline-meta">
                    <div><strong>{e.vei}</strong>Explosivity</div>
                    <div><strong>{e.volume}</strong>Ejecta Volume</div>
                    <div><strong>{e.fatalities}</strong>Fatalities</div>
                  </div>
                </div>
                <div className="timeline-node"></div>
                <div className="timeline-magnitude">{e.vei.split(' ')[1]}</div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* Ash Cloud Observatory */}
      <section className="section ash-section" id="ashlab" style={{maxWidth: 'none', paddingLeft: 0, paddingRight: 0}}>
        <div className="section">
          <div className="section-header reveal">
            <div>
              <div className="section-eyebrow">Ash Dispersion Lab</div>
              <h2 className="section-title">Tracking the <em>plume</em><br/>in real time.</h2>
            </div>
            <p className="section-desc">
              Our ceilometers, lidar arrays, and satellite data feed into dispersion models
              that forecast where ash will travel — essential for aviation and public safety.
            </p>
          </div>
          <div className="reveal">
            <AshObservatory />
          </div>
        </div>
      </section>

      {/* Field Logs */}
      <section className="section logs-section" id="fieldlogs" style={{maxWidth: 'none', paddingLeft: 0, paddingRight: 0}}>
        <div className="section">
          <div className="section-header reveal">
            <div>
              <div className="section-eyebrow">Field Logs</div>
              <h2 className="section-title">Dispatches from<br/>the <em>caldera rim</em>.</h2>
            </div>
            <p className="section-desc">
              Daily observations from our team of volcanologists, geochemists, and field
              technicians who live and work on the mountain.
            </p>
          </div>
          <div className="logs-grid">
            {logs.map((log, i) => (
              <LogCard key={log.title} log={log} index={i} />
            ))}
          </div>
        </div>
      </section>

      {/* Rock Specimens */}
      <section className="section specimens-section" id="specimens" style={{maxWidth: 'none', paddingLeft: 0, paddingRight: 0}}>
        <div className="section">
          <div className="section-header reveal">
            <div>
              <div className="section-eyebrow">Rock & Mineral Collection</div>
              <h2 className="section-title">Stones forged in <em>fire</em>.</h2>
            </div>
            <p className="section-desc">
              Over 4,000 specimens from Obsidian Caldera and volcanic formations worldwide —
              our reference library tells the geologic story of this planet.
            </p>
          </div>
          <div className="specimens-grid">
            {specimens.map((s, i) => (
              <SpecimenCard key={s.name} specimen={s} index={i} />
            ))}
          </div>
        </div>
      </section>

      {/* Footer */}
      <footer className="footer">
        <div className="footer-inner">
          <div className="footer-cta reveal">
            <h2>Join the <em>observation network.</em></h2>
            <p>Subscribe to eruption alerts, field notes, and monthly volcanic activity reports from our observatory team.</p>
            <a href="#" className="btn btn-primary">
              Subscribe to Bulletin
              <span className="btn-shine"></span>
            </a>
          </div>
          <div className="footer-grid">
            <div>
              <div className="footer-brand">
                <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
                  <path d="M6 26 L16 6 L22 20 L26 12 L28 26 Z" fill="#E85D26" />
                </svg>
                Obsidian Field Station
              </div>
              <p className="footer-tagline">
                A volcanic research observatory dedicated to understanding Earth's most
                powerful geologic forces — and keeping communities safe.
              </p>
            </div>
            <div className="footer-col">
              <h4>Research</h4>
              <ul>
                <li><a href="#">Seismic Network</a></li>
                <li><a href="#">Gas Monitoring</a></li>
                <li><a href="#">Geodetic Survey</a></li>
                <li><a href="#">Petrology Lab</a></li>
              </ul>
            </div>
            <div className="footer-col">
              <h4>Resources</h4>
              <ul>
                <li><a href="#">Eruption Archive</a></li>
                <li><a href="#">Data Portal</a></li>
                <li><a href="#">Publications</a></li>
                <li><a href="#">Press Kit</a></li>
              </ul>
            </div>
            <div className="footer-col">
              <h4>Station</h4>
              <ul>
                <li><a href="#">About Us</a></li>
                <li><a href="#">The Team</a></li>
                <li><a href="#">Visit</a></li>
                <li><a href="#">Contact</a></li>
              </ul>
            </div>
          </div>
          <div className="footer-bottom">
            <div>© 2024 Obsidian Field Station · Caldera Rim Road · Volcano National Park</div>
            <div>Elev. 2,847 m · Lat 19.48°N · Long 155.62°W</div>
          </div>
        </div>
      </footer>
    </>
  );
}

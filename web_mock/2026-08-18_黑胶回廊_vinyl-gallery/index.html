<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>黑胶回廊 · 声音艺术馆</title>
<link rel="preconnect" href="https://miaoda.feishu.cn" />
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" />

<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<style>
/* ========== Reset & Base ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: #1A1614;
  color: #F5EFE6;
  overflow-x: hidden;
  cursor: none;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: none; border: none; background: none; color: inherit; }
a { color: inherit; text-decoration: none; cursor: none; }
::selection { background: #D97706; color: #1A1614; }

/* ========== Custom Cursor ========== */
.cursor-outer {
  position: fixed;
  top: 0; left: 0;
  width: 38px; height: 38px;
  border: 2px solid #F5EFE6;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  transition: width 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
              height 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
              border-color 0.25s ease,
              background 0.25s ease,
              opacity 0.2s ease;
  box-shadow: 0 0 12px rgba(217, 119, 6, 0.3);
}
.cursor-inner {
  position: fixed;
  top: 0; left: 0;
  width: 6px; height: 6px;
  background: #D97706;
  border-radius: 50%;
  pointer-events: none;
  z-index: 10000;
  transform: translate(-50%, -50%);
  transition: width 0.2s ease, height 0.2s ease, background 0.2s ease;
  box-shadow: 0 0 8px rgba(217, 119, 6, 0.8);
}
.cursor-outer.hover {
  width: 56px; height: 56px;
  border-color: #D97706;
  background: rgba(217, 119, 6, 0.08);
  box-shadow: 0 0 24px rgba(217, 119, 6, 0.5);
}
.cursor-inner.hover {
  width: 4px; height: 4px;
  background: #F5EFE6;
}
.cursor-ripple {
  position: fixed;
  top: 0; left: 0;
  width: 10px; height: 10px;
  border: 2px solid #D97706;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%, -50%);
  opacity: 1;
  animation: rippleExpand 0.7s ease-out forwards;
}
@keyframes rippleExpand {
  0% { width: 10px; height: 10px; opacity: 1; border-width: 3px; }
  100% { width: 80px; height: 80px; opacity: 0; border-width: 1px; }
}

/* ========== Layout ========== */
.container { max-width: 1280px; margin: 0 auto; padding: 0 32px; }

/* ========== Nav ========== */
.nav {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 20px 0;
  transition: background 0.4s ease, backdrop-filter 0.4s ease, padding 0.4s ease;
}
.nav.scrolled {
  background: rgba(26, 22, 20, 0.85);
  backdrop-filter: blur(12px);
  padding: 14px 0;
  border-bottom: 1px solid rgba(217, 119, 6, 0.15);
}
.nav-inner {
  display: flex; align-items: center; justify-content: space-between;
  max-width: 1280px; margin: 0 auto; padding: 0 32px;
}
.nav-logo {
  font-family: 'Playfair Display', 'Noto Serif SC', serif;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 0.08em;
  color: #F5EFE6;
}
.nav-logo span { color: #D97706; }
.nav-links {
  display: flex; align-items: center; gap: 36px;
  list-style: none;
}
.nav-links a {
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 0.05em;
  color: rgba(245, 239, 230, 0.75);
  transition: color 0.3s ease;
  position: relative;
}
.nav-links a::after {
  content: '';
  position: absolute;
  bottom: -6px; left: 0;
  width: 0; height: 1px;
  background: #D97706;
  transition: width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.nav-links a:hover { color: #F5EFE6; }
.nav-links a:hover::after { width: 100%; }
.nav-ticket {
  padding: 10px 22px;
  border: 1px solid #D97706;
  color: #D97706;
  font-size: 13px;
  letter-spacing: 0.08em;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}
.nav-ticket::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: #D97706;
  transition: left 0.35s ease;
  z-index: -1;
}
.nav-ticket:hover { color: #1A1614; }
.nav-ticket:hover::before { left: 0; }

/* ========== Hero ========== */
.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  position: relative;
  overflow: hidden;
  padding-top: 80px;
}
.hero-bg {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 70% 50%, rgba(217, 119, 6, 0.08) 0%, transparent 60%),
              radial-gradient(ellipse at 20% 80%, rgba(159, 43, 43, 0.06) 0%, transparent 50%);
}
.hero-vinyl-wrap {
  position: absolute;
  right: -80px; top: 50%;
  transform: translateY(-50%);
  width: 680px; height: 680px;
}
.hero-vinyl {
  width: 100%; height: 100%;
  border-radius: 50%;
  background: #0A0908;
  position: relative;
  animation: vinylSpin 24s linear infinite;
  box-shadow: 0 0 80px rgba(0, 0, 0, 0.6),
              inset 0 0 30px rgba(0, 0, 0, 0.8);
}
.hero-vinyl::before {
  content: '';
  position: absolute;
  inset: 20px;
  border-radius: 50%;
  background: repeating-radial-gradient(circle,
    #0A0908 0px,
    #1a1614 1px,
    #0A0908 2px,
    #15110f 3px,
    #0A0908 4px);
}
.hero-vinyl::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 180px; height: 180px;
  border-radius: 50%;
  background: linear-gradient(135deg, #D97706, #9F2B2B);
  box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
}
.hero-vinyl-label {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 180px; height: 180px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
  z-index: 2;
  text-align: center;
}
.hero-vinyl-label-title {
  font-family: 'Playfair Display', serif;
  font-size: 14px;
  font-weight: 700;
  color: #1A1614;
  letter-spacing: 0.1em;
}
.hero-vinyl-label-sub {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 10px;
  color: #1A1614;
  opacity: 0.7;
  margin-top: 4px;
  letter-spacing: 0.15em;
}
.hero-vinyl-hole {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #1A1614;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.8);
  z-index: 3;
}
@keyframes vinylSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.vinyl-shine {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  border-radius: 50%;
  background: linear-gradient(135deg,
    rgba(255, 255, 255, 0.08) 0%,
    transparent 30%,
    transparent 70%,
    rgba(217, 119, 6, 0.04) 100%);
  pointer-events: none;
  animation: shineSweep 6s ease-in-out infinite;
}
@keyframes shineSweep {
  0%, 100% { background-position: 0% 0%; }
  50% { background-position: 100% 100%; }
}

.hero-content {
  position: relative; z-index: 5;
  max-width: 560px;
}
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 12px;
  font-size: 12px;
  letter-spacing: 0.3em;
  color: #D97706;
  margin-bottom: 28px;
  text-transform: uppercase;
}
.hero-eyebrow-line {
  width: 32px; height: 1px;
  background: #D97706;
}
.hero-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 72px;
  font-weight: 900;
  line-height: 1.1;
  color: #F5EFE6;
  margin-bottom: 28px;
}
.hero-title em {
  font-style: normal;
  color: #D97706;
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-size: 80px;
}
.hero-subtitle {
  font-size: 17px;
  line-height: 1.8;
  color: rgba(245, 239, 230, 0.7);
  margin-bottom: 40px;
  max-width: 480px;
}
.hero-cta {
  display: flex; align-items: center; gap: 20px;
}
.btn-primary {
  padding: 16px 36px;
  background: #D97706;
  color: #1A1614;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.1em;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s ease;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(217, 119, 6, 0.3); }
.btn-ghost {
  padding: 16px 36px;
  border: 1px solid rgba(245, 239, 230, 0.25);
  color: #F5EFE6;
  font-size: 14px;
  letter-spacing: 0.1em;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}
.btn-ghost:hover {
  border-color: #D97706;
  color: #D97706;
}
.hero-scroll {
  position: absolute;
  bottom: 40px; left: 50%;
  transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  font-size: 11px;
  letter-spacing: 0.25em;
  color: rgba(245, 239, 230, 0.5);
}
.hero-scroll-line {
  width: 1px; height: 60px;
  background: linear-gradient(to bottom, rgba(217, 119, 6, 0), rgba(217, 119, 6, 0.6));
  position: relative;
  overflow: hidden;
}
.hero-scroll-line::after {
  content: '';
  position: absolute;
  top: -100%;
  width: 100%; height: 40%;
  background: #D97706;
  animation: scrollDot 2.5s ease-in-out infinite;
}
@keyframes scrollDot {
  0% { top: -40%; }
  100% { top: 100%; }
}

/* ========== Section Common ========== */
.section {
  padding: 140px 0;
  position: relative;
}
.section-eyebrow {
  font-size: 12px;
  letter-spacing: 0.3em;
  color: #D97706;
  margin-bottom: 16px;
  text-transform: uppercase;
}
.section-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 48px;
  font-weight: 700;
  color: #F5EFE6;
  margin-bottom: 16px;
}
.section-desc {
  font-size: 15px;
  line-height: 1.8;
  color: rgba(245, 239, 230, 0.6);
  max-width: 520px;
}
.section-header { margin-bottom: 60px; }

/* ========== Featured / About ========== */
.about {
  background: linear-gradient(180deg, #1A1614 0%, #201916 50%, #1A1614 100%);
}
.about-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
  align-items: center;
}
.about-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  margin-top: 48px;
}
.stat-item {
  padding: 24px 0;
  border-top: 1px solid rgba(217, 119, 6, 0.2);
}
.stat-num {
  font-family: 'Playfair Display', serif;
  font-size: 42px;
  font-weight: 900;
  color: #D97706;
  line-height: 1;
  margin-bottom: 8px;
}
.stat-label {
  font-size: 13px;
  color: rgba(245, 239, 230, 0.6);
  letter-spacing: 0.05em;
}

.about-img-wrap {
  position: relative;
  aspect-ratio: 4/5;
  overflow: hidden;
}
.about-img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform 0.6s ease;
}
.about-img-wrap:hover .about-img { transform: scale(1.03); }
.about-img-frame {
  position: absolute;
  top: -16px; left: -16px;
  right: 16px; bottom: 16px;
  border: 1px solid rgba(217, 119, 6, 0.3);
  z-index: -1;
}
.typewriter-text {
  font-size: 15px;
  line-height: 2;
  color: rgba(245, 239, 230, 0.7);
  margin-top: 16px;
  min-height: 100px;
}
.typewriter-caret {
  display: inline-block;
  width: 2px;
  height: 18px;
  background: #D97706;
  margin-left: 2px;
  vertical-align: -3px;
  animation: caretBlink 0.9s step-end infinite;
}
@keyframes caretBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* ========== Collection ========== */
.collection {
  background: #1A1614;
}
.collection-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
}
.record-card {
  position: relative;
  aspect-ratio: 1;
  perspective: 1200px;
  transform-style: preserve-3d;
}
.record-card-inner {
  width: 100%; height: 100%;
  position: relative;
  transition: transform 0.15s ease-out;
  transform-style: preserve-3d;
}
.record-cover {
  width: 100%; height: 100%;
  object-fit: cover;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}
.record-sleeve {
  position: absolute;
  top: 0; left: 0;
  right: 0; bottom: 0;
  background: linear-gradient(135deg, #f5e6d3, #d4c4a8);
  z-index: -1;
  transform: translate(12px, 12px);
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.record-card:hover .record-sleeve {
  transform: translate(24px, 24px);
}
.record-vinyl-disc {
  position: absolute;
  top: 0; right: 0;
  width: 85%; height: 85%;
  border-radius: 50%;
  background: #0A0908;
  z-index: -2;
  transform: translateX(10%);
  opacity: 0;
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  overflow: hidden;
}
.record-card:hover .record-vinyl-disc {
  opacity: 1;
  transform: translateX(40%);
  animation: vinylSpin 16s linear infinite;
}
.record-vinyl-disc::before {
  content: '';
  position: absolute;
  inset: 8px;
  border-radius: 50%;
  background: repeating-radial-gradient(circle,
    #0A0908 0px,
    #1a1614 1px,
    #0A0908 2px,
    #15110f 3px,
    #0A0908 4px);
}
.record-vinyl-disc::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 30%; height: 30%;
  border-radius: 50%;
  background: linear-gradient(135deg, #D97706, #9F2B2B);
}
.record-info {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 24px;
  background: linear-gradient(to top, rgba(10, 9, 8, 0.9), transparent);
  transform: translateY(10px);
  opacity: 0;
  transition: all 0.4s ease;
  z-index: 2;
}
.record-card:hover .record-info {
  transform: translateY(0);
  opacity: 1;
}
.record-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 18px;
  font-weight: 700;
  color: #F5EFE6;
  margin-bottom: 4px;
}
.record-artist {
  font-size: 13px;
  color: #D97706;
  letter-spacing: 0.05em;
}
.record-year {
  position: absolute;
  top: 16px; right: 16px;
  font-family: 'Playfair Display', serif;
  font-size: 14px;
  color: rgba(245, 239, 230, 0.5);
  z-index: 2;
  transition: color 0.3s ease;
}
.record-card:hover .record-year { color: #D97706; }

/* ========== Sound Section / Audio Visualizer ========== */
.sound-section {
  background: linear-gradient(180deg, #1A1614 0%, #251510 50%, #1A1614 100%);
  overflow: hidden;
}
.sound-visualizer {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 4px;
  height: 200px;
  margin: 60px 0;
}
.sound-bar {
  width: 6px;
  background: linear-gradient(to top, #D97706, #F5B548);
  border-radius: 3px;
  transition: height 0.12s ease-out;
  box-shadow: 0 0 10px rgba(217, 119, 6, 0.3);
}
.sound-section-content {
  text-align: center;
  max-width: 700px;
  margin: 0 auto;
}
.sound-play-btn {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: #D97706;
  display: inline-flex; align-items: center; justify-content: center;
  margin: 30px auto;
  transition: all 0.3s ease;
  position: relative;
}
.sound-play-btn::before {
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  border: 1px solid rgba(217, 119, 6, 0.4);
  animation: pulseRing 2.5s ease-out infinite;
}
@keyframes pulseRing {
  0% { transform: scale(1); opacity: 0.6; }
  100% { transform: scale(1.5); opacity: 0; }
}
.sound-play-btn:hover {
  transform: scale(1.08);
  box-shadow: 0 0 40px rgba(217, 119, 6, 0.5);
}
.sound-play-btn svg { fill: #1A1614; margin-left: 4px; }
.sound-play-btn.playing svg { margin-left: 0; }

/* ========== Exhibition Section ========== */
.exhibition {
  background: #1A1614;
}
.exhibit-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr 1fr;
  grid-template-rows: 220px 220px;
  gap: 20px;
}
.exhibit-card {
  position: relative;
  overflow: hidden;
  padding: 28px;
  display: flex; flex-direction: column;
  justify-content: flex-end;
  transition: transform 0.4s ease;
}
.exhibit-card:hover { transform: translateY(-4px); }
.exhibit-card.big { grid-row: span 2; }
.exhibit-num {
  font-family: 'Playfair Display', serif;
  font-size: 13px;
  color: #D97706;
  letter-spacing: 0.1em;
  margin-bottom: auto;
}
.exhibit-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 22px;
  font-weight: 700;
  color: #F5EFE6;
  margin-bottom: 8px;
}
.exhibit-card.big .exhibit-title { font-size: 28px; }
.exhibit-desc {
  font-size: 13px;
  color: rgba(245, 239, 230, 0.65);
  line-height: 1.6;
}
.exhibit-bg-1 { background: linear-gradient(135deg, #2a1f18 0%, #1a120e 100%); border: 1px solid rgba(217, 119, 6, 0.15); }
.exhibit-bg-2 { background: linear-gradient(135deg, #251a1a 0%, #1a1010 100%); border: 1px solid rgba(159, 43, 43, 0.2); }
.exhibit-bg-3 { background: linear-gradient(135deg, #1f1d1a 0%, #141310 100%); border: 1px solid rgba(245, 239, 230, 0.08); }
.exhibit-bg-4 { background: linear-gradient(135deg, #271e18 0%, #181410 100%); border: 1px solid rgba(217, 119, 6, 0.1); }

/* glow sweep on hover */
.exhibit-card::after {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: linear-gradient(
    to bottom right,
    transparent 30%,
    rgba(217, 119, 6, 0.08) 50%,
    transparent 70%
  );
  transform: translate(-100%, -100%) rotate(25deg);
  transition: transform 0.8s ease;
  pointer-events: none;
}
.exhibit-card:hover::after {
  transform: translate(100%, 100%) rotate(25deg);
}

/* ========== Visit Section ========== */
.visit {
  background: linear-gradient(180deg, #1A1614 0%, #1e1814 100%);
  position: relative;
}
.visit-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
  align-items: center;
}
.visit-info-block { margin-bottom: 32px; }
.visit-info-label {
  font-size: 12px;
  letter-spacing: 0.25em;
  color: #D97706;
  margin-bottom: 8px;
  text-transform: uppercase;
}
.visit-info-value {
  font-size: 18px;
  color: #F5EFE6;
  line-height: 1.6;
}
.ticket-card {
  background: linear-gradient(135deg, #2a1f16 0%, #1a120c 100%);
  border: 1px solid rgba(217, 119, 6, 0.2);
  padding: 48px 40px;
  position: relative;
  overflow: hidden;
}
.ticket-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, #D97706, #9F2B2B, #D97706);
}
.ticket-card h3 {
  font-family: 'Noto Serif SC', serif;
  font-size: 28px;
  font-weight: 700;
  color: #F5EFE6;
  margin-bottom: 32px;
}
.ticket-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 0;
  border-bottom: 1px solid rgba(245, 239, 230, 0.08);
}
.ticket-type { font-size: 15px; color: rgba(245, 239, 230, 0.85); }
.ticket-price {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  font-weight: 700;
  color: #D97706;
}
.ticket-buy {

// ============ Custom Cursor ============
function CustomCursor() {
  const outerRef = useRef(null);
  const innerRef = useRef(null);
  const posRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const targetRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const rafRef = useRef(null);
  const reducedMotion = useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  useEffect(() => {
    if (reducedMotion.current) return;
    const onMove = (e) => {
      targetRef.current.x = e.clientX;
      targetRef.current.y = e.clientY;
    };
    window.addEventListener('mousemove', onMove);

    // Spring physics for outer ring
    const spring = { x: posRef.current.x, y: posRef.current.y, vx: 0, vy: 0 };
    const stiffness = 0.18;
    const damping = 0.75;

    const animate = () => {
      // Inner dot: direct follow
      innerRef.current.style.left = targetRef.current.x + 'px';
      innerRef.current.style.top = targetRef.current.y + 'px';

      // Outer ring: spring-damper
      const dx = targetRef.current.x - spring.x;
      const dy = targetRef.current.y - spring.y;
      spring.vx = (spring.vx + dx * stiffness) * damping;
      spring.vy = (spring.vy + dy * stiffness) * damping;
      spring.x += spring.vx;
      spring.y += spring.vy;
      outerRef.current.style.left = spring.x + 'px';
      outerRef.current.style.top = spring.y + 'px';

      rafRef.current = requestAnimationFrame(animate);
    };
    rafRef.current = requestAnimationFrame(animate);

    // Hover detection
    const addHover = () => {
      outerRef.current.classList.add('hover');
      innerRef.current.classList.add('hover');
    };
    const removeHover = () => {
      outerRef.current.classList.remove('hover');
      innerRef.current.classList.remove('hover');
    };

    const addInteractiveListeners = () => {
      document.querySelectorAll('a, button, .record-card, .exhibit-card, .sound-play-btn').forEach(el => {
        el.addEventListener('mouseenter', addHover);
        el.addEventListener('mouseleave', removeHover);
      });
    };
    // Wait for mount
    setTimeout(addInteractiveListeners, 100);

    // Click ripple
    const onClick = (e) => {
      const ripple = document.createElement('div');
      ripple.className = 'cursor-ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 700);
    };
    window.addEventListener('click', onClick);

    // Visibility change pause
    const onVis = () => {
      if (document.hidden) {
        cancelAnimationFrame(rafRef.current);
      } else {
        rafRef.current = requestAnimationFrame(animate);
      }
    };
    document.addEventListener('visibilitychange', onVis);

    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('click', onClick);
      document.removeEventListener('visibilitychange', onVis);
      cancelAnimationFrame(rafRef.current);
    };
  }, []);

  return (
    <>
      <div ref={outerRef} className="cursor-outer"></div>
      <div ref={innerRef} className="cursor-inner"></div>
    </>
  );
}

// ============ Dust Particles ============
function DustParticles() {
  const containerRef = useRef(null);
  const rafRef = useRef(null);
  const particlesRef = useRef([]);

  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;

    const container = containerRef.current;
    const particleCount = 30;
    const particles = [];

    for (let i = 0; i < particleCount; i++) {
      const el = document.createElement('div');
      el.className = 'dust-particle';
      const size = Math.random() * 3 + 1;
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      container.appendChild(el);
      particles.push({
        el,
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - 0.5) * 0.3,
        vy: -Math.random() * 0.2 - 0.05,
        phase: Math.random() * Math.PI * 2,
        sway: Math.random() * 0.5 + 0.2,
        size
      });
    }
    particlesRef.current = particles;

    let t = 0;
    const animate = () => {
      t += 0.016;
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx + Math.sin(t + p.phase) * p.sway * 0.3;
        p.y += p.vy;
        if (p.y < -10) {
          p.y = window.innerHeight + 10;
          p.x = Math.random() * window.innerWidth;
        }
        if (p.x < -10) p.x = window.innerWidth + 10;
        if (p.x > window.innerWidth + 10) p.x = -10;
        p.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
      }
      rafRef.current = requestAnimationFrame(animate);
    };
    rafRef.current = requestAnimationFrame(animate);

    const onVis = () => {
      if (document.hidden) cancelAnimationFrame(rafRef.current);
      else rafRef.current = requestAnimationFrame(animate);
    };
    document.addEventListener('visibilitychange', onVis);

    return () => {
      document.removeEventListener('visibilitychange', onVis);
      cancelAnimationFrame(rafRef.current);
      particles.forEach(p => p.el.remove());
    };
  }, []);

  return <div ref={containerRef} style={{ position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 1, overflow: 'hidden' }} />;
}

// ============ Scroll Reveal ============
function useScrollReveal() {
  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) {
      document.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
      return;
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -60px 0px' });

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    return () => observer.disconnect();
  }, []);
}

// ============ About with Typewriter & Counter ============
function About() {
  const typeRef = useRef(null);
  const [typed, setTyped] = useState('');
  const timerRef = useRef(null);
  const statsRef = useRef(null);
  const [counters, setCounters] = useState([0, 0, 0]);
  const startedRef = useRef({ type: false, count: false });
  const fullText = '黑胶回廊始建于 1987 年，由资深唱片收藏家何松年先生创办。三十余年来，我们从一家巷弄里的二手唱片店，成长为集收藏、修复、展览与现场聆听于一体的声音艺术空间。馆藏涵盖爵士、古典、摇滚、民谣、电子等多个流派，许多头版唱片已成为孤品。';

  // Typewriter
  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) { setTyped(fullText); setCounters([42000, 38, 120]); return; }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !startedRef.current.type) {
          startedRef.current.type = true;
          let i = 0;
          const typeNext = () => {
            if (i <= fullText.length) {
              setTyped(fullText.slice(0, i));
              i++;
              timerRef.current = setTimeout(typeNext, 28 + Math.random() * 20);
            }
          };
          typeNext();
        }
      });
    }, { threshold: 0.3 });
    if (typeRef.current) observer.observe(typeRef.current);

    return () => {
      observer.disconnect();
      clearTimeout(timerRef.current);
    };
  }, []);

  // Number counters with easing
  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !startedRef.current.count) {
          startedRef.current.count = true;
          const targets = [42000, 38, 120];
          const duration = 2200;
          const start = performance.now();

          const easeOutExpo = (t) => t === 1 ? 1 : 1 - Math.pow(2, -10 * t);

          const step = (now) => {
            const t = Math.min((now - start) / duration, 1);
            const eased = easeOutExpo(t);
            setCounters([
              Math.floor(targets[0] * eased),
              Math.floor(targets[1] * eased),
              Math.floor(targets[2] * eased),
            ]);
            if (t < 1) requestAnimationFrame(step);
          };
          requestAnimationFrame(step);
        }
      });
    }, { threshold: 0.3 });
    if (statsRef.current) observer.observe(statsRef.current);
    return () => observer.disconnect();
  }, []);

  const formatNum = (n) => n.toLocaleString('zh-CN');

  return (
    <section id="about" className="section about">
      <div className="container">
        <div className="about-grid">
          <div className="reveal">
            <div className="about-img-wrap">
              <img src={HERO_BG} alt="聆听室" className="about-img" />
              <div className="about-img-frame"></div>
            </div>
          </div>
          <div>
            <div className="section-eyebrow reveal reveal-delay-1">ABOUT US</div>
            <h2 className="section-title reveal reveal-delay-2">回廊里的<br />声音考古学</h2>
            <div className="typewriter-text reveal reveal-delay-3" ref={typeRef}>
              {typed}
              {typed.length < fullText.length && <span className="typewriter-caret"></span>}
            </div>
            <div className="about-stats" ref={statsRef}>
              <div className="stat-item reveal reveal-delay-1">
                <div className="stat-num">{formatNum(counters[0])}</div>
                <div className="stat-label">馆藏唱片</div>
              </div>
              <div className="stat-item reveal reveal-delay-2">
                <div className="stat-num">{counters[1]}</div>
                <div className="stat-label">年历史</div>
              </div>
              <div className="stat-item reveal reveal-delay-3">
                <div className="stat-num">{counters[2]}</div>
                <div className="stat-label">珍贵孤品</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

// ============ 3D Tilt Record Card ============
function RecordCard({ record, index }) {
  const cardRef = useRef(null);

  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;
    const card = cardRef.current;
    if (!card) return;
    const inner = card.querySelector('.record-card-inner');

    const onMove = (e) => {
      const rect = card.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      // Direct DOM transform, no setState
      inner.style.transform = `perspective(1000px) rotateY(${x * 12}deg) rotateX(${-y * 12}deg) translateZ(10px)`;
      inner.style.transition = 'transform 0.05s ease-out';
    };
    const onLeave = () => {
      inner.style.transform = 'perspective(1000px) rotateY(0) rotateX(0) translateZ(0)';
      inner.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
    };

    card.addEventListener('mousemove', onMove);
    card.addEventListener('mouseleave', onLeave);
    return () => {
      card.removeEventListener('mousemove', onMove);
      card.removeEventListener('mouseleave', onLeave);
    };
  }, []);

  return (
    <div className={`record-card reveal reveal-delay-${(index % 3) + 1}`} ref={cardRef}>
      <div className="record-card-inner">
        <span className="record-year">{record.year}</span>

  );
}

// ============ Sound Visualizer ============
function SoundVisualizer() {
  const [playing, setPlaying] = useState(false);
  const barsRef = useRef(null);
  const rafRef = useRef(null);
  const playingRef = useRef(false);

  // Use ref to track playing state for RAF
  useEffect(() => {
    playingRef.current = playing;
  }, [playing]);

  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;
    if (!barsRef.current) return;
    const bars = barsRef.current.querySelectorAll('.sound-bar');
    const BAR_COUNT = bars.length;

    // Each bar has its own physics: sinusoidal base + noise
    const barState = Array.from({ length: BAR_COUNT }, () => ({
      base: 20 + Math.random() * 30,
      amp: 15 + Math.random() * 40,
      freq: 0.02 + Math.random() * 0.06,
      phase: Math.random() * Math.PI * 2,
      target: 30,
      current: 30,
      velocity: 0,
    }));

    const springK = 0.2;
    const damping = 0.7;
    let t = 0;

    const animate = () => {
      t++;
      for (let i = 0; i < BAR_COUNT; i++) {
        const s = barState[i];
        if (playingRef.current) {
          // Target driven by sine + random modulation
          const noise = (Math.sin(t * s.freq * 3 + s.phase) * 0.5 + Math.sin(t * s.freq * 7 + s.phase * 1.3) * 0.3 + Math.random() * 0.2) * s.amp;
          s.target = Math.max(10, s.base + noise);
        } else {
          // Decay to rest with spring
          s.target = 15 + Math.sin(t * 0.05 + s.phase) * 3;
        }
        // Spring physics
        const dx = s.target - s.current;
        s.velocity = (s.velocity + dx * springK) * damping;
        s.current += s.velocity;
        bars[i].style.height = Math.max(4, s.current) + 'px';
      }
      rafRef.current = requestAnimationFrame(animate);
    };
    rafRef.current = requestAnimationFrame(animate);

    const onVis = () => {
      if (document.hidden) cancelAnimationFrame(rafRef.current);
      else rafRef.current = requestAnimationFrame(animate);
    };
    document.addEventListener('visibilitychange', onVis);

    return () => {
      document.removeEventListener('visibilitychange', onVis);
      cancelAnimationFrame(rafRef.current);
    };
  }, []);

  const barCount = 42;
  const bars = Array.from({ length: barCount });

  return (
    <section className="section sound-section">
      <div className="container">
        <div className="sound-section-content">
          <div className="section-eyebrow reveal">LISTENING ROOM</div>
          <h2 className="section-title reveal reveal-delay-1">聆听室现场</h2>
          <p className="section-desc reveal reveal-delay-2" style={{ margin: '0 auto' }}>
            点击下方播放按钮，感受黑胶唱针落入沟槽的瞬间——
            那些被封存了几十年的声波，将重新在这间屋子里回荡。
          </p>
          <div className="sound-visualizer reveal reveal-delay-3" ref={barsRef}>
            {bars.map((_, i) => (
              <div key={i} className="sound-bar" style={{
                height: (15 + Math.sin(i * 0.5) * 10) + 'px',
                opacity: 0.5 + Math.sin(i * 0.3) * 0.3,
              }}></div>
            ))}
          </div>
          <button
            className={`sound-play-btn ${playing ? 'playing' : ''} reveal reveal-delay-4`}
            onClick={() => setPlaying(p => !p)}
            aria-label={playing ? '暂停' : '播放'}
          >
            {playing ? (
              <svg width="24" height="24" viewBox="0 0 24 24">
                <rect x="6" y="4" width="4" height="16" fill="#1A1614" />
                <rect x="14" y="4" width="4" height="16" fill="#1A1614" />
              </svg>
            ) : (
              <svg width="24" height="24" viewBox="0 0 24 24">
                <polygon points="8,5 19,12 8,19" fill="#1A1614" />
              </svg>
            )}
          </button>
        </div>
      </div>
    </section>
  );
}

    { num: '03', title: '唱针修复工坊', desc: '现场展示钻石唱针打磨、唱头调校与唱片清洁修复的完整工艺流程。', bg: 'exhibit-bg-3' },
    { num: '04', title: '地下噪音档案', desc: '90 年代实验音乐与噪音艺术私压盘，来自地下场景的稀有声音标本。', bg: 'exhibit-bg-4' },

          ))}

      </div>

              </div>
              <div className="visit-info-block">

              <div className="visit-info-block">
                <div className="visit-info-label">联系方式</div>

              </div>
            </div>
          </div>
          <div className="reveal reveal-delay-2">
            <div className="ticket-card">
              <h3>预约参观</h3>

// ============ App ============
function App() {
  useScrollReveal();

  useEffect(() => {
    // Announce upgrade capability
    const announce = () => {
      try {
        window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
      } catch (e) {}
    };
    announce();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announce, { once: true });
    }
  }, []);

  return (
    <>
      <CustomCursor />
      <DustParticles />
      <Nav />
      <Hero />
      <About />
      <Collection />
      <SoundVisualizer />
      <Exhibition />
      <Visit />
      <Footer />
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

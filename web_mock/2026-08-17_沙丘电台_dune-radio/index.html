<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>沙丘电台 · Desert Radio — 沙漠腹地的短波之声</title>
<meta name="creative-medium" content="interactive-prototype" />
<meta name="description" content="沙丘电台，一座建在塔克拉玛干腹地的独立短波电台。24 小时播音，沙暴不中断。" />
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" />

<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<style>
/* ============ DESIGN TOKENS ============ */
:root {
  --sand-gold: #C9973F;
  --ochre-red: #A6482E;
  --ink-black: #1E1B16;
  --rice-white: #F5EDE0;
  --sand-gold-light: #E0B562;
  --sand-gold-deep: #A87A28;
  --ochre-red-light: #C4623A;
  --ink-black-2: #2A2620;
  --ink-black-3: #3A352D;
  --rice-white-dim: #D9D0C0;
  --sand-dust: rgba(201, 151, 63, 0.12);

  --font-display: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
  --font-body: 'Noto Sans SC', system-ui, sans-serif;
  --font-serif: 'Noto Serif SC', serif;
  --font-mono: 'JetBrains Mono', monospace;

  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: var(--ink-black);
  color: var(--rice-white);
  overflow-x: hidden;
  cursor: none;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* hide native cursor on interactive elements */
a, button, [role="button"], .tilt-card, .freq-band, .tab-btn,
.signal-wave, .letter-card, .host-card, .schedule-item, .dial-knob,
.tune-bar, .station-chip {
  cursor: none;
}

@media (max-width: 768px) {
  body { cursor: auto; }
  a, button, [role="button"], .tilt-card, .freq-band, .tab-btn,
  .signal-wave, .letter-card, .host-card, .schedule-item, .dial-knob,
  .tune-bar, .station-chip { cursor: pointer; }
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; border: none; background: none; color: inherit; }
ul, ol { list-style: none; }

/* ============ CUSTOM CURSOR ============ */
.cursor-ring, .cursor-dot, .cursor-glow {
  position: fixed;
  top: 0; left: 0;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  will-change: transform;
}

.cursor-ring {
  width: 32px; height: 32px;
  border: 2px solid var(--rice-white);
  border-radius: 50%;
  transition: width 0.25s var(--ease-spring),
              height 0.25s var(--ease-spring),
              border-color 0.25s ease,
              border-width 0.2s ease;
  mix-blend-mode: difference;
}

.cursor-dot {
  width: 6px; height: 6px;
  background: var(--sand-gold);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--sand-gold),
              0 0 16px rgba(201, 151, 63, 0.5);
}

.cursor-glow {
  width: 80px; height: 80px;
  background: radial-gradient(circle, rgba(201, 151, 63, 0.18) 0%, transparent 70%);
  border-radius: 50%;
  transition: width 0.3s ease, height 0.3s ease, opacity 0.3s ease;
  opacity: 0.6;
}

.cursor-ring.hover {
  width: 52px; height: 52px;
  border-color: var(--sand-gold-light);
  border-width: 1.5px;
}

.cursor-ring.clicking {
  width: 24px; height: 24px;
  border-color: var(--ochre-red-light);
}

.cursor-dot.hover {
  background: var(--ochre-red-light);
  box-shadow: 0 0 10px var(--ochre-red-light),
              0 0 20px rgba(196, 98, 58, 0.6);
}

.cursor-ripple {
  position: fixed;
  pointer-events: none;
  z-index: 9998;
  border: 2px solid var(--sand-gold);
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(0);
  opacity: 1;
  animation: cursorRipple 0.6s ease-out forwards;
}

@keyframes cursorRipple {
  0% { transform: translate(-50%, -50%) scale(0); opacity: 1; border-width: 3px; }
  100% { transform: translate(-50%, -50%) scale(3); opacity: 0; border-width: 1px; }
}

@media (max-width: 768px) {
  .cursor-ring, .cursor-dot, .cursor-glow, .cursor-ripple { display: none; }
}

/* ============ NAV ============ */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 48px;
  transition: background 0.4s ease, backdrop-filter 0.4s ease, padding 0.4s ease;
}

.nav.scrolled {
  background: rgba(30, 27, 22, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 12px 48px;
  border-bottom: 1px solid rgba(201, 151, 63, 0.15);
}

.nav-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--font-display);
  font-size: 22px;
  letter-spacing: 4px;
  color: var(--sand-gold-light);
}

.nav-logo-mark {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--sand-gold);
  border-radius: 50%;
  position: relative;
}

.nav-logo-mark::before {
  content: '';
  position: absolute;
  width: 6px; height: 6px;
  background: var(--sand-gold);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--sand-gold);
  animation: pulseDot 2s ease-in-out infinite;
}

@keyframes pulseDot {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(0.7); opacity: 0.6; }
}

.nav-links {
  display: flex;
  gap: 36px;
}

.nav-link {
  position: relative;
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--rice-white-dim);
  transition: color 0.3s ease;
  padding: 6px 0;
}

.nav-link:hover { color: var(--sand-gold-light); }

.nav-link::after {
  content: '';
  position: absolute;
  left: 0; bottom: 0;
  width: 0; height: 1px;
  background: var(--sand-gold);
  transition: width 0.4s var(--ease-out);
}

.nav-link:hover::after { width: 100%; }

.nav-live {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 18px;
  border: 1px solid var(--ochre-red);
  border-radius: 999px;
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--rice-white);
  transition: all 0.3s ease;
}

.nav-live:hover {
  background: var(--ochre-red);
  box-shadow: 0 0 20px rgba(166, 72, 46, 0.4);
}

.nav-live-dot {
  width: 8px; height: 8px;
  background: var(--ochre-red-light);
  border-radius: 50%;
  animation: livePulse 1.5s ease-in-out infinite;
}

@keyframes livePulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(196, 98, 58, 0.6); }
  50% { box-shadow: 0 0 0 6px rgba(196, 98, 58, 0); }
}

@media (max-width: 768px) {
  .nav { padding: 14px 20px; }
  .nav-links { display: none; }
  .nav-logo { font-size: 18px; letter-spacing: 2px; }
  .nav-live { padding: 6px 12px; font-size: 11px; }
}

/* ============ HERO ============ */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 30%, rgba(201, 151, 63, 0.08) 0%, transparent 60%),
    linear-gradient(180deg, var(--ink-black) 0%, #252018 100%);
}

.sand-particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.hero-content {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 0 24px;
  max-width: 900px;
}

.hero-subtitle {
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 8px;
  color: var(--sand-gold);
  margin-bottom: 24px;
  text-transform: uppercase;
  opacity: 0;
  animation: fadeUp 1s var(--ease-out) 0.3s forwards;
}

.hero-title {
  font-family: var(--font-display);
  font-size: clamp(48px, 10vw, 120px);
  line-height: 1.1;
  color: var(--rice-white);
  margin-bottom: 24px;
  letter-spacing: 8px;
  opacity: 0;
  animation: fadeUp 1.2s var(--ease-out) 0.5s forwards;
}

.hero-title .accent {
  color: var(--sand-gold);
  display: block;
  font-size: 0.55em;
  letter-spacing: 16px;
  margin-top: 12px;
}

.hero-tagline {
  font-size: 17px;
  color: var(--rice-white-dim);
  max-width: 520px;
  margin: 0 auto 40px;
  opacity: 0;
  animation: fadeUp 1s var(--ease-out) 0.8s forwards;
  line-height: 1.8;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.hero-cta-row {
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
  opacity: 0;
  animation: fadeUp 1s var(--ease-out) 1s forwards;
}

.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 32px;
  font-size: 14px;
  letter-spacing: 3px;
  border-radius: 2px;
  transition: all 0.3s var(--ease-out);
  overflow: hidden;
}

.btn-primary {
  background: var(--sand-gold);
  color: var(--ink-black);
  font-weight: 500;
}

.btn-primary::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transition: left 0.6s ease;
}

.btn-primary:hover::before { left: 100%; }

.btn-primary:hover {
  background: var(--sand-gold-light);
  box-shadow: 0 4px 30px rgba(201, 151, 63, 0.35);
  transform: translateY(-2px);
}

.btn-ghost {
  border: 1px solid var(--rice-white-dim);
  color: var(--rice-white-dim);
}

.btn-ghost:hover {
  border-color: var(--sand-gold);
  color: var(--sand-gold-light);
}

/* dial visual */
.radio-dial-wrap {
  margin-top: 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  opacity: 0;
  animation: fadeUp 1.2s var(--ease-out) 1.2s forwards;
}

.dial-label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--sand-gold);
  text-transform: uppercase;
}

.radio-dial {
  width: min(600px, 90vw);
  height: 120px;
  position: relative;
  background: linear-gradient(180deg, #151210 0%, #1e1b16 100%);
  border: 1px solid var(--ink-black-3);
  border-radius: 60px;
  overflow: hidden;
}

.dial-scale {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 40px;
  pointer-events: none;
}

.dial-tick {
  width: 1px;
  background: var(--ink-black-3);
}

.dial-tick.major {
  height: 24px;
  background: var(--sand-gold-deep);
}
.dial-tick.minor { height: 12px; }

.dial-freq-text {
  position: absolute;
  bottom: 18px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--rice-white-dim);
  letter-spacing: 1px;
}
.dial-freq-text.left { left: 24px; }
.dial-freq-text.right { right: 24px; }

.dial-needle {
  position: absolute;
  top: 10px;
  bottom: 30px;
  width: 2px;
  background: linear-gradient(180deg, var(--ochre-red-light) 0%, var(--ochre-red) 100%);
  left: 50%;
  transform: translateX(-50%);
  box-shadow: 0 0 12px var(--ochre-red-light);
  transition: left 1.5s var(--ease-spring);
  z-index: 2;
}

.dial-needle::before {
  content: '';
  position: absolute;
  top: -4px; left: -3px;
  width: 8px; height: 8px;
  background: var(--ochre-red-light);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--ochre-red-light);
}

.dial-glow {
  position: absolute;
  top: 50%;
  width: 80px; height: 80px;
  background: radial-gradient(circle, rgba(201, 151, 63, 0.15) 0%, transparent 70%);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: left 1.5s var(--ease-spring);
  left: 50%;
  pointer-events: none;
}

.tune-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 4px;
  background: var(--ink-black-3);
}
.tune-bar-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, var(--sand-gold-deep), var(--sand-gold), var(--sand-gold-light));
  width: 50%;
  transition: width 1.5s var(--ease-spring);
}

.dial-freq-display {
  font-family: var(--font-mono);
  font-size: 36px;
  color: var(--sand-gold-light);
  letter-spacing: 4px;
  text-shadow: 0 0 20px rgba(201, 151, 63, 0.4);
  transition: color 0.3s ease;
}

.dial-freq-display .unit {
  font-size: 16px;
  color: var(--sand-gold-deep);
  margin-left: 6px;
}

.hero-stats {
  display: flex;
  gap: 48px;
  margin-top: 20px;
  flex-wrap: wrap;
  justify-content: center;
}

.hero-stat {
  text-align: center;
}

.hero-stat-num {
  font-family: var(--font-mono);
  font-size: 22px;
  color: var(--sand-gold-light);
  font-weight: 500;
}

.hero-stat-label {
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--rice-white-dim);
  margin-top: 4px;
  text-transform: uppercase;
}

.scroll-hint {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--rice-white-dim);
  opacity: 0;
  animation: fadeUp 1s ease 2s forwards;
}

.scroll-hint-line {
  width: 1px; height: 40px;
  background: linear-gradient(180deg, var(--sand-gold) 0%, transparent 100%);
  animation: scrollLine 2s ease-in-out infinite;
}

@keyframes scrollLine {
  0%, 100% { opacity: 0.3; transform: scaleY(0.5); transform-origin: top; }
  50% { opacity: 1; transform: scaleY(1); }
}

/* ============ SECTION BASICS ============ */
.section {
  position: relative;
  padding: 120px 48px;
}

.section-inner {
  max-width: 1280px;
  margin: 0 auto;
}

.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 60px;
  gap: 24px;
  flex-wrap: wrap;
}

.section-label {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 6px;
  color: var(--sand-gold);
  text-transform: uppercase;
  margin-bottom: 16px;
}

.section-title {
  font-family: var(--font-display);
  font-size: clamp(32px, 5vw, 56px);
  color: var(--rice-white);
  letter-spacing: 4px;
  line-height: 1.2;
}

.section-desc {
  font-size: 15px;
  color: var(--rice-white-dim);
  max-width: 380px;
  line-height: 1.8;
}

.reveal {
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 0.9s var(--ease-out), transform 0.9s var(--ease-out);
}

.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

@media (max-width: 768px) {
  .section { padding: 72px 20px; }
  .section-head { flex-direction: column; align-items: flex-start; }
}

/* ============ SCHEDULE ============ */
.schedule-section {
  background:
    linear-gradient(180deg, #1a1712 0%, var(--ink-black) 100%);
}

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 40px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--ink-black-3);
  padding-bottom: 1px;
}

.tab-btn {
  padding: 14px 28px;
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--rice-white-dim);
  position: relative;
  transition: color 0.3s ease;
}

.tab-btn::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: -1px;
  height: 2px;
  background: var(--sand-gold);
  transform: scaleX(0);
  transition: transform 0.3s var(--ease-out);
}

.tab-btn.active {
  color: var(--sand-gold-light);
}

.tab-btn.active::after { transform: scaleX(1); }

.tab-btn:hover { color: var(--sand-gold-light); }

.schedule-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}

.schedule-item {
  background: var(--ink-black-2);
  border: 1px solid var(--ink-black-3);
  border-radius: 4px;
  padding: 24px;
  transition: all 0.4s var(--ease-out);
  position: relative;
  overflow: hidden;
}

.schedule-item::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px; height: 0;
  background: var(--sand-gold);
  transition: height 0.4s var(--ease-out);
}

.schedule-item:hover {
  border-color: rgba(201, 151, 63, 0.3);
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
}

.schedule-item:hover::before { height: 100%; }

.schedule-time {
  font-family: var(--font-mono);
  font-size: 24px;
  color: var(--sand-gold-light);
  letter-spacing: 2px;
  margin-bottom: 4px;
}

.schedule-time .ampm {
  font-size: 12px;
  color: var(--sand-gold-deep);
  margin-left: 4px;
}

.schedule-name {
  font-family: var(--font-display);
  font-size: 20px;
  color: var(--rice-white);
  margin-bottom: 10px;
  letter-spacing: 2px;
}

.schedule-host {
  font-size: 12px;
  color: var(--rice-white-dim);
  letter-spacing: 2px;
  margin-bottom: 14px;
}

.schedule-desc {
  font-size: 13px;
  color: var(--rice-white-dim);
  line-height: 1.7;
  margin-bottom: 16px;
}

.schedule-freq {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ochre-red-light);
  padding: 4px 10px;
  border: 1px solid rgba(166, 72, 46, 0.4);
  border-radius: 2px;
  letter-spacing: 1px;
}

.schedule-freq .dot {
  width: 5px; height: 5px;
  background: var(--ochre-red-light);
  border-radius: 50%;
  animation: livePulse 1.5s ease-in-out infinite;
}

.schedule-live-tag {
  position: absolute;
  top: 16px; right: 16px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ochre-red-light);
  padding: 3px 8px;
  border: 1px solid var(--ochre-red);
  border-radius: 2px;
  letter-spacing: 2px;
}

/* ============ HOSTS ============ */
.hosts-section {
  background: var(--ink-black);
  position: relative;
  overflow: hidden;
}

.hosts-section::before {
  content: '';
  position: absolute;
  top: 20%; right: -10%;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(201, 151, 63, 0.06) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}

.hosts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 32px;
  perspective: 1200px;
}

.host-card {
  position: relative;
  background: var(--ink-black-2);
  border: 1px solid var(--ink-black-3);
  border-radius: 6px;
  padding: 28px;
  transform-style: preserve-3d;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
  will-change: transform;
}

.host-card:hover {
  border-color: rgba(201, 151, 63, 0.4);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}

.host-avatar-wrap {
  position: relative;
  width: 100px; height: 100px;
  margin-bottom: 20px;
  transform: translateZ(30px);
}

.host-avatar {
  width: 100px; height: 100px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--sand-gold-deep), var(--ochre-red));
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 36px;
  color: var(--rice-white);
  position: relative;
  z-index: 1;
}

.host-avatar-ring {
  position: absolute;
  inset: -6px;
  border: 1px dashed var(--sand-gold-deep);

/* ============ REDUCED MOTION ============ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .sand-particles, .cursor-glow, .signal-ripple { display: none; }
  .reveal { opacity: 1; transform: none; }

</style>
</head>
<body>

<div id="cursor-ring" class="cursor-ring"></div>
<div id="cursor-dot" class="cursor-dot"></div>
<div id="cursor-glow" class="cursor-glow"></div>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ============ UTILS ============
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const isMobile = window.innerWidth <= 768;

// ============ CUSTOM CURSOR ============
function initCursor() {
  if (isMobile || prefersReducedMotion) return;
  const ring = document.getElementById('cursor-ring');
  const dot = document.getElementById('cursor-dot');
  const glow = document.getElementById('cursor-glow');
  if (!ring || !dot || !glow) return;

  // Initialize at screen center
  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let ringX = mouseX;
  let ringY = mouseY;
  let glowX = mouseX;
  let glowY = mouseY;

  // Set initial position so cursor is visible immediately
  ring.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
  dot.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
  glow.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;

  let rafId = null;
  let visible = true;

  function animate() {
    if (!visible) return;
    // Spring physics for ring
    ringX += (mouseX - ringX) * 0.18;
    ringY += (mouseY - ringY) * 0.18;
    // More inertia for glow
    glowX += (mouseX - glowX) * 0.06;
    glowY += (mouseY - glowY) * 0.06;

    ring.style.transform = `translate(${ringX}px, ${ringY}px) translate(-50%, -50%)`;
    dot.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
    glow.style.transform = `translate(${glowX}px, ${glowY}px) translate(-50%, -50%)`;

    rafId = requestAnimationFrame(animate);
  }

  function onMove(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
  }

  function onEnter() {
    visible = true;
    ring.style.opacity = '1';
    dot.style.opacity = '1';
    glow.style.opacity = '0.6';
    if (!rafId) animate();
  }

  function onLeave() {
    visible = false;
    ring.style.opacity = '0';
    dot.style.opacity = '0';
    glow.style.opacity = '0';
    if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  }

  function onVisibilityChange() {
    if (document.hidden) {
      visible = false;
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    } else {
      visible = true;
      if (!rafId) animate();
    }
  }

  // hover state
  function onOver(e) {
    const target = e.target.closest('a, button, [role="button"], .tilt-card, .freq-band, .tab-btn, .signal-wave, .letter-card, .host-card, .schedule-item, .dial-knob, .tune-bar, .station-chip');
    if (target) {
      ring.classList.add('hover');
      dot.classList.add('hover');
    }
  }

  function onOut(e) {
    const target = e.target.closest('a, button, [role="button"], .tilt-card, .freq-band, .tab-btn, .signal-wave, .letter-card, .host-card, .schedule-item, .dial-knob, .tune-bar, .station-chip');
    if (target) {
      ring.classList.remove('hover');
      dot.classList.remove('hover');
    }
  }

  function onDown() {
    ring.classList.add('clicking');
    // ripple
    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = mouseX + 'px';
    ripple.style.top = mouseY + 'px';
    ripple.style.width = '32px';
    ripple.style.height = '32px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  }

  function onUp() {
    ring.classList.remove('clicking');
  }

  window.addEventListener('mousemove', onMove, { passive: true });
  document.addEventListener('mouseenter', onEnter);
  document.addEventListener('mouseleave', onLeave);
  document.addEventListener('mouseover', onOver);
  document.addEventListener('mouseout', onOut);
  document.addEventListener('mousedown', onDown);
  document.addEventListener('mouseup', onUp);
  document.addEventListener('visibilitychange', onVisibilityChange);

  animate();

  return () => {
    window.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseenter', onEnter);
    document.removeEventListener('mouseleave', onLeave);
    document.removeEventListener('mouseover', onOver);
    document.removeEventListener('mouseout', onOut);
    document.removeEventListener('mousedown', onDown);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('visibilitychange', onVisibilityChange);
    if (rafId) cancelAnimationFrame(rafId);
  };
}

// ============ SAND PARTICLES ============
function initSandParticles(containerId) {
  const container = document.getElementById(containerId);
  if (!container || prefersReducedMotion) return null;

  const canvas = document.createElement('canvas');
  canvas.style.position = 'absolute';
  canvas.style.inset = '0';
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  container.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  let particles = [];
  let rafId = null;
  let running = true;
  const count = 80;

  function resize() {
    canvas.width = container.offsetWidth;
    canvas.height = container.offsetHeight;
  }

  function createParticles() {
    particles = [];
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: 0.3 + Math.random() * 0.8,
        vy: -0.1 + Math.random() * 0.2,
        size: 0.5 + Math.random() * 2,
        opacity: 0.1 + Math.random() * 0.4,
        drift: Math.random() * Math.PI * 2,
        driftSpeed: 0.002 + Math.random() * 0.004,
      });
    }
  }

  function step() {
    if (!running) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (const p of particles) {
      p.drift += p.driftSpeed;
      p.x += p.vx + Math.sin(p.drift) * 0.3;
      p.y += p.vy;

      if (p.x > canvas.width + 10) {
        p.x = -10;
        p.y = Math.random() * canvas.height;
      }
      if (p.y < -10) {
        p.y = canvas.height + 10;
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(201, 151, 63, ${p.opacity})`;
      ctx.fill();
    }

    rafId = requestAnimationFrame(step);
  }

  function onVisibility() {
    if (document.hidden) {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
    } else {
      running = true;
      if (!rafId) step();
    }
  }

  resize();
  createParticles();
  window.addEventListener('resize', () => { resize(); createParticles(); });
  document.addEventListener('visibilitychange', onVisibility);
  step();

  return () => {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    document.removeEventListener('visibilitychange', onVisibility);
  };
}

// ============ SIGNAL WAVE (SVG path) ============
function SignalWave() {
  const svgRef = useRef(null);
  const rafRef = useRef(null);
  const tRef = useRef(0);

  useEffect(() => {
    if (prefersReducedMotion) return;
    const svg = svgRef.current;
    if (!svg) return;

    let running = true;

    function animate() {
      if (!running) return;
      tRef.current += 0.025;
      const w = svg.clientWidth || 400;
      const h = svg.clientHeight || 180;
      const mid = h / 2;

      let d = '';
      const points = 200;
      for (let i = 0; i <= points; i++) {
        const x = (i / points) * w;
        const prog = i / points;
        // multiple sine waves for organic feel
        const y = mid
          + Math.sin(prog * 8 + tRef.current) * 18
          + Math.sin(prog * 13 + tRef.current * 1.7) * 10
          + Math.sin(prog * 5 + tRef.current * 0.6) * 25
          + Math.sin(prog * 21 + tRef.current * 2.3) * 4;
        d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
      }

      // build path string with filter for glow
      const pathEl = svg.querySelector('.signal-path-main');
      const pathEl2 = svg.querySelector('.signal-path-sub');
      if (pathEl) pathEl.setAttribute('d', d);

      // secondary, lower amplitude
      let d2 = '';
      for (let i = 0; i <= points; i++) {
        const x = (i / points) * w;
        const prog = i / points;
        const y = mid
          + Math.sin(prog * 6 + tRef.current * 0.8 + 1) * 12
          + Math.sin(prog * 17 + tRef.current * 1.2 + 2) * 6;
        d2 += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
      }
      if (pathEl2) pathEl2.setAttribute('d', d2);

      rafRef.current = requestAnimationFrame(animate);
    }

    function onVisibility() {
      if (document.hidden) {
        running = false;
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        rafRef.current = null;
      } else {
        running = true;
        if (!rafRef.current) animate();
      }
    }

    document.addEventListener('visibilitychange', onVisibility);
    animate();

    return () => {
      running = false;
      document.removeEventListener('visibilitychange', onVisibility);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, []);

  return (
    <svg ref={svgRef} viewBox="0 0 800 180" preserveAspectRatio="none">
      <defs>
        <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stopColor="#C9973F" stopOpacity="0.2" />
          <stop offset="50%" stopColor="#E0B562" stopOpacity="0.9" />
          <stop offset="100%" stopColor="#C9973F" stopOpacity="0.2" />
        </linearGradient>
        <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stopColor="#A6482E" stopOpacity="0.1" />
          <stop offset="50%" stopColor="#C4623A" stopOpacity="0.5" />
          <stop offset="100%" stopColor="#A6482E" stopOpacity="0.1" />
        </linearGradient>
      </defs>
      <path className="signal-path-sub" d="" fill="none" stroke="url(#waveGrad2)" strokeWidth="1.5" opacity="0.6" />
      <path className="signal-path-main" d="" fill="none" stroke="url(#waveGrad1)" strokeWidth="2" />
    </svg>
  );
}

// ============ TYPEWRITER ============
function Typewriter({ texts, speed = 60, pause = 2500 }) {
  const [display, setDisplay] = useState('');
  const [idx, setIdx] = useState(0);
  const [charIdx, setCharIdx] = useState(0);
  const [deleting, setDeleting] = useState(false);
  const timers = useRef([]);

  useEffect(() => {
    if (prefersReducedMotion) {
      setDisplay(texts[0]);
      return;
    }

    function clearTimers() {
      timers.current.forEach(t => clearTimeout(t));
      timers.current = [];
    }

    function step() {
      const current = texts[idx];

      if (!deleting) {
        if (charIdx < current.length) {
          setDisplay(current.slice(0, charIdx + 1));
          setCharIdx(charIdx + 1);
          const t = setTimeout(step, speed + Math.random() * 40);
          timers.current.push(t);
        } else {
          const t = setTimeout(() => { setDeleting(true); step(); }, pause);
          timers.current.push(t);
        }
      } else {
        if (charIdx > 0) {
          setDisplay(current.slice(0, charIdx - 1));
          setCharIdx(charIdx - 1);
          const t = setTimeout(step, speed * 0.4);
          timers.current.push(t);
        } else {
          setDeleting(false);
          setIdx((idx + 1) % texts.length);
          const t = setTimeout(step, 500);
          timers.current.push(t);
        }
      }
    }

    const t = setTimeout(step, 800);
    timers.current.push(t);

    function onVisibility() {
      if (document.hidden) clearTimers();
    }
    document.addEventListener('visibilitychange', onVisibility);

    return () => {
      clearTimers();
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, [idx, charIdx, deleting, texts, speed, pause]);

  return (
    <span>
      {display}
      <span className="typewriter-cursor"></span>
    </span>
  );
}

// ============ COUNTER ============
function Counter({ end, duration = 2000, suffix = '' }) {
  const [val, setVal] = useState(0);
  const ref = useRef(null);
  const startedRef = useRef(false);
  const rafRef = useRef(null);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !startedRef.current) {
          startedRef.current = true;
          animateCount();
        }
      });
    }, { threshold: 0.3 });

    observer.observe(el);

    function animateCount() {
      if (prefersReducedMotion) {
        setVal(end);
        return;
      }
      const start = 0;
      const startTime = performance.now();

      function tick(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        // easeOutCubic
        const eased = 1 - Math.pow(1 - progress, 3);
        setVal(Math.floor(start + (end - start) * eased));
        if (progress < 1) {
          rafRef.current = requestAnimationFrame(tick);
        }
      }
      rafRef.current = requestAnimationFrame(tick);
    }

    return () => {
      observer.disconnect();
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [end, duration]);

  return <span ref={ref}>{val}{suffix}</span>;
}

// ============ HOST CARD (3D TILT) ============
function HostCard({ host, delay = 0 }) {
  const cardRef = useRef(null);

  useEffect(() => {
    const card = cardRef.current;
    if (!card || isMobile || prefersReducedMotion) return;

    let rafId = null;
    let targetX = 0, targetY = 0;
    let currentX = 0, currentY = 0;

    function onMove(e) {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      targetY = ((x - cx) / cx) * 8;  // rotateY
      targetX = -((y - cy) / cy) * 8; // rotateX
    }

    function onLeave() {
      targetX = 0;
      targetY = 0;
    }

    function animate() {
      currentX += (targetX - currentX) * 0.1;
      currentY += (targetY - currentY) * 0.1;
      card.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;
      rafId = requestAnimationFrame(animate);
    }

    card.addEventListener('mousemove', onMove);
    card.addEventListener('mouseleave', onLeave);
    rafId = requestAnimationFrame(animate);

    return () => {
      card.removeEventListener('mousemove', onMove);
      card.removeEventListener('mouseleave', onLeave);
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, []);

  return (
    <div className="host-card tilt-card" ref={cardRef} style={{ transitionDelay: delay + 'ms' }}>
      <div className="host-avatar-wrap">
        <div className="host-avatar-ring"></div>
        <div className="host-pulse-ring"></div>
        <div className="host-avatar">{host.initial}</div>
      </div>
      <div className="host-name">{host.name}</div>
      <div className="host-role">{host.role}</div>
      <div className="host-bio">{host.bio}</div>
      <div className="host-show">
        <span className="host-show-name">{host.show}</span>
        <span className="host-show-time">{host.time}</span>
      </div>
    </div>
  );
}

// ============ SCROLL REVEAL ============
function useScrollReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });

    els.forEach(el => observer.observe(el));
    return () => observer.disconnect();
  }, []);
}

// ============ NAV SCROLL ============
function useNavScroll() {
  useEffect(() => {
    const nav = document.querySelector('.nav');
    if (!nav) return;
    function onScroll() {
      if (window.scrollY > 60) {
        nav.classList.add('scrolled');
      } else {
        nav.classList.remove('scrolled');
      }
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
}

// ============ PARALLAX (hero only, mouse-driven) ============
function useParallax() {
  useEffect(() => {
    if (isMobile || prefersReducedMotion) return;
    const hero = document.querySelector('.hero-content');
    if (!hero) return;

    let rafId = null;
    let targetX = 0, targetY = 0;
    let currentX = 0, currentY = 0;

    function onMove(e) {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      targetX = (e.clientX - cx) / cx * 12;
      targetY = (e.clientY - cy) / cy * 8;
    }

    function animate() {
      currentX += (targetX - currentX) * 0.05;
      currentY += (targetY - currentY) * 0.05;
      hero.style.transform = `translate(${currentX}px, ${currentY}px)`;
      rafId = requestAnimationFrame(animate);
    }

    window.addEventListener('mousemove', onMove, { passive: true });
    rafId = requestAnimationFrame(animate);

    function onVisibility() {
      if (document.hidden) {
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      } else {
        if (!rafId) rafId = requestAnimationFrame(animate);
      }
    }
    document.addEventListener('visibilitychange', onVisibility);

    return () => {
      window.removeEventListener('mousemove', onMove);
      document.removeEventListener('visibilitychange', onVisibility);
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, []);
}

// sand progress bar animation via IntersectionObserver
(function initSandProgress() {
  const bars = document.querySelectorAll('.sand-progress-fill');
  if (!bars.length) return;
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const target = entry.target.getAttribute('data-target') || '50';
        entry.target.style.width = target + '%';
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.3 });
  bars.forEach(b => observer.observe(b));
})();

// announce upgrade availability
(function announceUpgrade() {
  window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
})();
if (document.readyState !== 'complete') {
  window.addEventListener('load', () => {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  }, { once: true });
}

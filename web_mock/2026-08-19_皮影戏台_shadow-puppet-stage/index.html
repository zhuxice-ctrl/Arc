<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="creative-medium" content="interactive-prototype">
<title>皮影戏·白蛇传</title>
<style>
/* =========================================================
   皮影戏·白蛇传 — 单文件 HTML
   ========================================================= */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --parchment-center: #E8B45A;
  --parchment-edge: #C98A3E;
  --wood-dark: #3A2418;
  --wood-mid: #5A3826;
  --wood-light: #7A5030;
  --ink: #0A0806;
  --ink-soft: #1a1410;
  --vermilion: #B23A2E;
  --vermilion-dark: #8A2A20;
  --rice-paper: #F0E6D2;
  --rice-paper-dark: #E0D4B8;
  --lamp-glow: #FFD88A;
  --gold-trim: #D4A056;
  --glow-warm: rgba(255, 200, 100, 0.6);
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: "Songti SC", "SimSun", "STSong", "Noto Serif SC", serif;
  background: #1a0f08;
  color: var(--ink);
  user-select: none;
  -webkit-user-select: none;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: none;
}

/* -----------------------------------------------------------
   自定义光标 — 竹签操纵杆
   ----------------------------------------------------------- */
.cursor-rod {
  position: fixed;
  top: 0;
  left: 0;
  width: 4px;
  height: 120px;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -100%);
  transition: transform 0.12s ease, opacity 0.3s ease;
  will-change: transform;
}

.cursor-rod .rod-line {
  position: absolute;
  left: 50%;
  top: 0;
  width: 2px;
  height: 100%;
  background: linear-gradient(to bottom, var(--ink) 0%, var(--wood-dark) 40%, var(--parchment-center) 100%);
  transform: translateX(-50%);
  border-radius: 2px;
  box-shadow: 0 0 4px var(--glow-warm);
}

.cursor-rod .rod-tip {
  position: absolute;
  bottom: -3px;
  left: 50%;
  width: 8px;
  height: 8px;
  background: var(--parchment-center);
  border: 2px solid var(--ink);
  border-radius: 50%;
  transform: translateX(-50%);
  box-shadow: 0 0 6px var(--glow-warm);
}

.cursor-rod.dragging .rod-tip {
  background: var(--lamp-glow);
  box-shadow: 0 0 12px var(--lamp-glow), 0 0 20px var(--glow-warm);
  width: 10px;
  height: 10px;
}

.cursor-rod.dragging {
  transform: translate(-50%, -100%) rotate(-8deg);
}

/* -----------------------------------------------------------
   戏台主容器
   ----------------------------------------------------------- */
.theater-wrap {
  position: relative;
  width: min(95vw, 1440px);
  aspect-ratio: 16 / 9;
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* 戏台木框 */
.theater-frame {
  position: relative;
  flex: 1;
  background: var(--wood-dark);
  border-radius: 6px;
  padding: 22px;
  box-shadow:
    inset 0 0 0 2px var(--wood-mid),
    inset 0 0 0 4px var(--wood-dark),
    inset 0 0 0 6px var(--wood-mid),
    0 8px 40px rgba(0, 0, 0, 0.6),
    0 2px 8px rgba(0, 0, 0, 0.4);
  overflow: hidden;
}

/* 木纹质感 */
.theater-frame::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    repeating-linear-gradient(
      90deg,
      transparent 0px,
      transparent 3px,
      rgba(0, 0, 0, 0.08) 3px,
      rgba(0, 0, 0, 0.08) 4px
    ),
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 40px,
      rgba(90, 56, 38, 0.3) 40px,
      rgba(90, 56, 38, 0.3) 42px
    );
  pointer-events: none;
  z-index: 1;
}

/* 回纹雕花 — 四边 */
.frame-carving {
  position: absolute;
  pointer-events: none;
  z-index: 2;
}

.frame-carving.top,
.frame-carving.bottom {
  left: 8px;
  right: 8px;
  height: 14px;
}
.frame-carving.top { top: 4px; }
.frame-carving.bottom { bottom: 4px; transform: scaleY(-1); }

.frame-carving.left,
.frame-carving.right {
  top: 8px;
  bottom: 8px;
  width: 14px;
}
.frame-carving.left { left: 4px; }
.frame-carving.right { right: 4px; transform: scaleX(-1); }

.frame-carving svg {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: var(--gold-trim);
  stroke-width: 1.2;
  opacity: 0.55;
  transition: opacity 0.3s ease, filter 0.3s ease;
}

.theater-frame:hover .frame-carving svg {
  opacity: 0.8;
  filter: drop-shadow(0 0 3px var(--glow-warm));
}

/* 幕布 */
.curtain-stage {
  position: relative;
  width: 100%;
  height: 100%;
  background:
    radial-gradient(ellipse at 50% 55%, var(--parchment-center) 0%, var(--parchment-edge) 75%, #9a6828 100%);
  border-radius: 2px;
  overflow: hidden;
  box-shadow:
    inset 0 0 60px rgba(0, 0, 0, 0.3),
    inset 0 0 120px rgba(90, 40, 10, 0.2);
  z-index: 3;
}

/* 幕布噪点纹理 */
.curtain-noise {
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.2  0 0 0 0 0.12  0 0 0 0 0.06  0 0 0 0.08 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  opacity: 0.5;
  mix-blend-mode: multiply;
  pointer-events: none;
  animation: noiseDrift 8s steps(6) infinite;
  z-index: 2;
}

@keyframes noiseDrift {
  0%   { transform: translate(0, 0); }
  20%  { transform: translate(-10px, 5px); }
  40%  { transform: translate(8px, -6px); }
  60%  { transform: translate(-5px, 8px); }
  80%  { transform: translate(6px, 3px); }
  100% { transform: translate(0, 0); }
}

/* 油灯光 */
.lamp-glow {
  position: absolute;
  bottom: -15%;
  left: 50%;
  transform: translateX(-50%);
  width: 70%;
  height: 70%;
  background: radial-gradient(ellipse at center, rgba(255, 220, 140, 0.5) 0%, rgba(255, 180, 80, 0.2) 30%, transparent 70%);
  pointer-events: none;
  z-index: 1;
  will-change: opacity, transform;
}

/* 舞台上层 — 皮影层 */
.puppet-layer {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
}

/* 皮影人物 */
.puppet {
  position: absolute;
  pointer-events: auto;
  cursor: none;
  transition: filter 0.3s ease;
  will-change: transform, left, top;
  filter: drop-shadow(0 0 2px var(--glow-warm)) drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}

.puppet svg {
  display: block;
  fill: var(--ink);
  stroke: var(--parchment-center);
  stroke-width: 0.8;
}

.puppet.dragging {
  filter: drop-shadow(0 0 8px var(--lamp-glow)) drop-shadow(0 4px 12px rgba(0,0,0,0.4));
  animation: puppetWobble 0.4s ease-in-out infinite alternate;
}

@keyframes puppetWobble {
  0%   { transform: translateX(var(--px, 0)) translateY(var(--py, 0)) rotate(-1.5deg); }
  100% { transform: translateX(var(--px, 0)) translateY(var(--py, 0)) rotate(1.5deg); }
}

.puppet.fading-out { opacity: 0; transition: opacity 0.5s ease; }
.puppet.fading-in  { opacity: 0; animation: fadeInPuppet 0.6s ease forwards; }

@keyframes fadeInPuppet {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* 操纵杆连线 */
.rod-line-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 4;
}

.rod-line-svg line {
  stroke: var(--ink);
  stroke-width: 1.5;
  opacity: 0.7;
  stroke-dasharray: 3 4;
}

.rod-line-svg line.active {
  opacity: 1;
  stroke: var(--parchment-center);
  stroke-width: 1.8;
  stroke-dasharray: none;
  filter: drop-shadow(0 0 2px var(--glow-warm));
}

/* 折目标记光圈 */
.act-marker {
  position: absolute;
  width: 70px;
  height: 70px;
  pointer-events: none;
  z-index: 6;
  transform: translate(-50%, -50%);
}

.act-marker::before,
.act-marker::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid var(--vermilion);
}

.act-marker::before {
  animation: markerBreath 2.5s ease-in-out infinite;
  box-shadow: 0 0 15px rgba(178, 58, 46, 0.5), inset 0 0 10px rgba(178, 58, 46, 0.3);
}

.act-marker::after {
  border-style: dashed;
  animation: markerSpin 12s linear infinite;
  opacity: 0.5;
}

@keyframes markerBreath {
  0%, 100% { transform: scale(1); opacity: 0.8; }
  50%      { transform: scale(1.15); opacity: 1; }
}

@keyframes markerSpin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

.act-marker .marker-seal {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: "Songti SC", "SimSun", serif;
  font-size: 14px;
  color: var(--vermilion);
  font-weight: bold;
  letter-spacing: 1px;
  writing-mode: vertical-rl;
  text-orientation: upright;
  opacity: 0.9;
}

/* 换场过渡层 */
.scene-overlay {
  position: absolute;
  inset: 0;
  background: rgba(10, 8, 6, 0);
  pointer-events: none;
  z-index: 10;
  transition: background 0.6s ease;
}

.scene-overlay.dimming {
  background: rgba(10, 8, 6, 0.85);
}

/* 尘光粒子 */
.dust-particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 9;
  overflow: hidden;
}

.dust-particle {
  position: absolute;
  width: 3px;
  height: 3px;
  background: var(--lamp-glow);
  border-radius: 50%;
  opacity: 0;
  box-shadow: 0 0 4px var(--glow-warm);
}

/* -----------------------------------------------------------
   旁白字幕区
   ----------------------------------------------------------- */
.narration-panel {
  position: absolute;
  top: 40px;
  right: 40px;
  width: 110px;
  bottom: 40px;
  background: var(--rice-paper);
  border: 1px solid var(--rice-paper-dark);
  z-index: 7;
  padding: 16px 10px;
  box-shadow:
    2px 2px 8px rgba(0, 0, 0, 0.2),
    inset 0 0 30px rgba(200, 170, 120, 0.2);
  display: flex;
  flex-direction: column;
  align-items: center;
  writing-mode: vertical-rl;
  text-orientation: upright;
  font-family: "Songti SC", "SimSun", "STSong", serif;
  color: var(--ink);
}

.narration-panel::before {
  content: "";
  position: absolute;
  inset: 4px;
  border: 1px solid rgba(180, 150, 100, 0.4);
  pointer-events: none;
}

.narration-title {
  font-size: 18px;
  font-weight: bold;
  color: var(--vermilion);
  letter-spacing: 4px;
  margin-bottom: 12px;
  font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
}

.narration-act {
  font-size: 14px;
  color: var(--ink-soft);
  letter-spacing: 2px;
  margin-bottom: 16px;
}

.narration-text {
  flex: 1;
  font-size: 13px;
  line-height: 1.9;
  letter-spacing: 1.5px;
  color: var(--ink-soft);
  overflow: hidden;
}

.narration-text .char {
  display: inline;
  opacity: 0;
  animation: charReveal 0.4s ease forwards;
}

@keyframes charReveal {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* 印章 */
.title-seal {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) scale(0);
  width: 36px;
  height: 36px;
  z-index: 8;
  animation: sealStamp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  animation-delay: 0.3s;
}

.title-seal svg {
  width: 100%;
  height: 100%;
}

@keyframes sealStamp {
  0%   { transform: translateX(-50%) scale(2) rotate(-10deg); opacity: 0; }
  60%  { transform: translateX(-50%) scale(0.9) rotate(2deg); opacity: 1; }
  80%  { transform: translateX(-50%) scale(1.05) rotate(-1deg); }
  100% { transform: translateX(-50%) scale(1) rotate(0deg); opacity: 1; }
}

/* -----------------------------------------------------------
   底部进度条
   ----------------------------------------------------------- */
.progress-bar {
  position: relative;
  height: 50px;
  background: var(--wood-dark);
  border-radius: 6px;
  padding: 8px 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  box-shadow:
    inset 0 0 0 1px var(--wood-mid),
    0 4px 16px rgba(0, 0, 0, 0.4);
}

.progress-bar::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    repeating-linear-gradient(
      90deg,
      transparent 0px,
      transparent 3px,
      rgba(0, 0, 0, 0.08) 3px,
      rgba(0, 0, 0, 0.08) 4px
    );
  border-radius: 6px;
  pointer-events: none;
}

.progress-segment {
  flex: 1;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid var(--wood-mid);
  border-radius: 3px;
  cursor: pointer;
  position: relative;
  transition: all 0.3s ease;
  z-index: 1;
  overflow: hidden;
}

.progress-segment:hover {
  background: rgba(90, 56, 38, 0.6);
  border-color: var(--gold-trim);
}

.progress-segment .seg-name {
  font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
  font-size: 13px;
  color: var(--rice-paper-dark);
  letter-spacing: 2px;
  z-index: 2;
  transition: color 0.3s ease;
}

.progress-segment .seg-fill {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 0%;
  background: linear-gradient(90deg, var(--vermilion-dark), var(--vermilion));
  transition: width 0.6s ease;
  z-index: 1;
}

.progress-segment.active .seg-fill { width: 100%; }
.progress-segment.active .seg-name { color: #fff; }

.progress-segment.completed .seg-fill { width: 100%; }
.progress-segment.completed .seg-name { color: var(--rice-paper); }

.progress-segment .seg-seal {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%) scale(0);
  width: 20px;
  height: 20px;
  z-index: 3;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.progress-segment.completed .seg-seal {
  transform: translateY(-50%) scale(1);
}

/* -----------------------------------------------------------
   底部署名
   ----------------------------------------------------------- */
.signature {
  position: absolute;
  bottom: 6px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  color: var(--rice-paper-dark);
  letter-spacing: 3px;
  font-family: "Kaiti SC", "STKaiti", serif;
  opacity: 0.6;
  z-index: 2;
  pointer-events: none;
  white-space: nowrap;
}

/* -----------------------------------------------------------
   响应式
   ----------------------------------------------------------- */
@media (max-width: 1024px) {
  .narration-panel {
    width: 90px;
    top: 30px;
    right: 30px;
    bottom: 30px;
    padding: 12px 8px;
  }
  .narration-title { font-size: 15px; }
  .narration-act { font-size: 12px; }
  .narration-text { font-size: 11px; }
  .progress-segment .seg-name { font-size: 11px; letter-spacing: 1px; }
}

@media (max-width: 768px) {
  .theater-wrap {
    width: 98vw;
    aspect-ratio: 4 / 3;
    gap: 6px;
  }
  .theater-frame { padding: 12px; }
  .narration-panel {
    width: 70px;
    top: 20px;
    right: 20px;
    bottom: 20px;
    padding: 8px 6px;
  }
  .narration-title { font-size: 13px; letter-spacing: 2px; }
  .narration-act { font-size: 10px; }
  .narration-text { font-size: 10px; line-height: 1.7; }
  .progress-bar { height: 40px; padding: 6px 15px; }
  .progress-segment { height: 26px; }
  .progress-segment .seg-name { font-size: 10px; letter-spacing: 0; }
  .progress-segment .seg-seal { width: 16px; height: 16px; }
  .cursor-rod { height: 80px; }
  .act-marker { width: 50px; height: 50px; }
  .act-marker .marker-seal { font-size: 11px; }
  .title-seal { width: 28px; height: 28px; }
}

@media (max-width: 480px) {
  .theater-wrap {
    width: 98vw;
    aspect-ratio: 3 / 4;
    max-height: 95vh;
  }
  .narration-panel {
    width: 56px;
    top: 14px;
    right: 14px;
    bottom: 14px;
    padding: 6px 4px;
  }
  .narration-title { font-size: 11px; letter-spacing: 1px; }
  .narration-act { font-size: 9px; margin-bottom: 8px; }
  .narration-text { font-size: 9px; line-height: 1.6; }
  .progress-bar { height: 34px; padding: 4px 8px; gap: 4px; }
  .progress-segment { height: 24px; gap: 4px; }
  .progress-segment .seg-name { font-size: 8px; }
  .progress-segment .seg-seal { display: none; }
  .cursor-rod { display: none; }
  body { cursor: default; }
  .signature { font-size: 8px; letter-spacing: 1px; }
}

/* -----------------------------------------------------------
   减弱动画
   ----------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .curtain-noise { animation: none; }
  .cursor-rod { display: none; }
  body { cursor: default; }
  .puppet.dragging { animation: none; }
  .lamp-glow { opacity: 0.6 !important; }
}
</style>
</head>
<body>

<!-- 自定义光标 -->
<div class="cursor-rod" id="cursorRod">
  <div class="rod-line"></div>
  <div class="rod-tip"></div>
</div>

<!-- 戏台主容器 -->
<div class="theater-wrap">
  <!-- 戏台木框 + 幕布 -->
  <div class="theater-frame" id="theaterFrame">

    <!-- 回纹雕花 -->
    <div class="frame-carving top">
      <svg viewBox="0 0 400 14" preserveAspectRatio="none">
        <path d="M0,7 L20,7 L20,2 L35,2 L35,12 L20,12 L20,7 M40,7 L60,7 L60,2 L75,2 L75,12 L60,12 L60,7 M80,7 L100,7 L100,2 L115,2 L115,12 L100,12 L100,7 M120,7 L140,7 L140,2 L155,2 L155,12 L140,12 L140,7 M160,7 L180,7 L180,2 L195,2 L195,12 L180,12 L180,7 M200,7 L220,7 L220,2 L235,2 L235,12 L220,12 L220,7 M240,7 L260,7 L260,2 L275,2 L275,12 L260,12 L260,7 M280,7 L300,7 L300,2 L315,2 L315,12 L300,12 L300,7 M320,7 L340,7 L340,2 L355,2 L355,12 L340,12 L340,7 M360,7 L380,7 L380,2 L395,2 L395,12 L380,12 L380,7" />
      </svg>
    </div>
    <div class="frame-carving bottom">
      <svg viewBox="0 0 400 14" preserveAspectRatio="none">
        <path d="M0,7 L20,7 L20,2 L35,2 L35,12 L20,12 L20,7 M40,7 L60,7 L60,2 L75,2 L75,12 L60,12 L60,7 M80,7 L100,7 L100,2 L115,2 L115,12 L100,12 L100,7 M120,7 L140,7 L140,2 L155,2 L155,12 L140,12 L140,7 M160,7 L180,7 L180,2 L195,2 L195,12 L180,12 L180,7 M200,7 L220,7 L220,2 L235,2 L235,12 L220,12 L220,7 M240,7 L260,7 L260,2 L275,2 L275,12 L260,12 L260,7 M280,7 L300,7 L300,2 L315,2 L315,12 L300,12 L300,7 M320,7 L340,7 L340,2 L355,2 L355,12 L340,12 L340,7 M360,7 L380,7 L380,2 L395,2 L395,12 L380,12 L380,7" />
      </svg>
    </div>
    <div class="frame-carving left">
      <svg viewBox="0 0 14 300" preserveAspectRatio="none">
        <path d="M7,0 L7,20 L2,20 L2,35 L12,35 L12,20 L7,20 M7,40 L7,60 L2,60 L2,75 L12,75 L12,60 L7,60 M7,80 L7,100 L2,100 L2,115 L12,115 L12,100 L7,100 M7,120 L7,140 L2,140 L2,155 L12,155 L12,140 L7,140 M7,160 L7,180 L2,180 L2,195 L12,195 L12,180 L7,180 M7,200 L7,220 L2,220 L2,235 L12,235 L12,220 L7,220 M7,240 L7,260 L2,260 L2,275 L12,275 L12,260 L7,260 M7,280 L7,300 L2,300" />
      </svg>
    </div>

    state.mouse.x = x;
    state.mouse.y = y;
    if (!REDUCED_MOTION) {
      cursorRod.style.transform = 'translate(' + x + 'px, ' + y + 'px) translate(-50%, -100%)' +
        (state.dragging ? ' rotate(-8deg)' : '');
    }
    // 更新操纵杆连线
    updateRodLine();
  }

  function updateRodLine() {
    if (!state.dragging) {
      rodLine.setAttribute('x1', 0);
      rodLine.setAttribute('y1', 0);
      rodLine.setAttribute('x2', 0);
      rodLine.setAttribute('y2', 0);
      rodLine.classList.remove('active');
      return;
    }
    var puppet = state.puppets[state.dragging];
    if (!puppet) return;
    var rect = getStageRect();
    var px = puppet.x * rect.width + puppet.w / 2;
    var py = puppet.y * rect.height + 10; // 从头顶出发
    var mx = state.mouse.x - rect.left;
    var my = state.mouse.y - rect.top;
    rodLine.setAttribute('x1', px);
    rodLine.setAttribute('y1', py);
    rodLine.setAttribute('x2', mx);
    rodLine.setAttribute('y2', my);
    rodLine.classList.add('active');
  }

  function createPuppets(actData) {

      el.style.top = (p.y * 100) + '%';
      el.style.width = p.w + 'px';
      el.style.height = p.h + 'px';
      el.style.animationDelay = (i * 0.15) + 's';
      el.dataset.id = p.id;
      el.dataset.hero = p.isHero ? '1' : '0';
      el.innerHTML = PUPPET_SVGS[p.shape] || PUPPET_SVGS.bai;
      puppetLayer.appendChild(el);

        x: p.x,
        y: p.y,
        w: p.w,
        h: p.h,
        isHero: p.isHero,
        name: p.name
      };

      // 拖拽事件
      el.addEventListener('mousedown', startDrag);
      el.addEventListener('touchstart', startDrag, { passive: false });
    });

    var rect = getStageRect();
    var clientX = e.clientX || (e.touches && e.touches[0].clientX);
    var clientY = e.clientY || (e.touches && e.touches[0].clientY);

    var puppet = state.puppets[id];
    state.dragging = id;
    state.dragOffset.x = clientX - rect.left - puppet.x * rect.width - puppet.w / 2;
    state.dragOffset.y = clientY - rect.top - puppet.y * rect.height - puppet.h / 2;

    target.classList.add('dragging');
    if (!REDUCED_MOTION) {
      cursorRod.classList.add('dragging');
    }

    document.addEventListener('mousemove', onDrag);
    document.addEventListener('mouseup', endDrag);
    document.addEventListener('touchmove', onDragTouch, { passive: false });
    document.addEventListener('touchend', endDrag);
  }

  function onDrag(e) {
    if (!state.dragging) return;
    var rect = getStageRect();
    var puppet = state.puppets[state.dragging];
    var px = (e.clientX - rect.left - state.dragOffset.x - puppet.w / 2) / rect.width;
    var py = (e.clientY - rect.top - state.dragOffset.y - puppet.h / 2) / rect.height;

    // 限制在舞台内（留出边距）
    px = clamp(px, 0.02, 0.95);
    py = clamp(py, 0.05, 0.82);

    puppet.x = px;
    puppet.y = py;
    puppet.el.style.left = (px * 100) + '%';
    puppet.el.style.top = (py * 100) + '%';

    updateRodLine();

    // 检查主角是否到达折目标记
    checkActMarker();
  }

  function onDragTouch(e) {
    if (!state.dragging) return;
    e.preventDefault();
    if (e.touches[0]) {
      onDrag(e.touches[0]);
    }
  }

  function endDrag() {
    if (state.dragging && state.puppets[state.dragging]) {
      state.puppets[state.dragging].el.classList.remove('dragging');
    }
    state.dragging = null;
    if (!REDUCED_MOTION) {
      cursorRod.classList.remove('dragging');
    }
    updateRodLine();
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('mouseup', endDrag);
    document.removeEventListener('touchmove', onDragTouch);
    document.removeEventListener('touchend', endDrag);
  }

  // ============================================================
  // 折目标记
  // ============================================================
  function updateMarkerPosition() {
    var act = ACTS[state.currentAct];
    actMarker.style.left = (act.markerX * 100) + '%';
    actMarker.style.top = (act.markerY * 100) + '%';
    if (state.currentAct < ACTS.length - 1) {
      markerSeal.textContent = '下一折';
      actMarker.style.display = 'block';
    } else {
      markerSeal.textContent = '终';
      actMarker.style.display = 'block';
    }
  }

  function checkActMarker() {
    if (state.isTransitioning) return;
    var act = ACTS[state.currentAct];
    var heroPuppet = null;

    for (var id in state.puppets) {
      if (state.puppets[id].isHero) {
        heroPuppet = state.puppets[id];
        break;
      }
    }
    if (!heroPuppet) return;

    var rect = getStageRect();
    var hx = heroPuppet.x * rect.width + heroPuppet.w / 2;
    var hy = heroPuppet.y * rect.height + heroPuppet.h / 2;
    var mx = act.markerX * rect.width;
    var my = act.markerY * rect.height;
    var dist = Math.sqrt((hx - mx) * (hx - mx) + (hy - my) * (hy - my));
    var threshold = 45; // 触发半径

    if (dist < threshold) {
      triggerNextAct();
    }
  }

  // ============================================================
  // 换场
  // ============================================================
  function triggerNextAct() {
    if (state.isTransitioning) return;
    if (state.currentAct >= ACTS.length - 1) return;
    state.isTransitioning = true;
    state.completed[state.currentAct] = true;
    updateProgressBar();

    // 1. 灯光暗下
    sceneOverlay.classList.add('dimming');
    // 2. 尘光粒子
    spawnDustParticles();

    // 3. 300ms 后切换内容
    setTimeout(function () {
      state.currentAct++;
      // 清空旧皮影
      puppetLayer.innerHTML = '';
      state.puppets = {};

      // 更新旁白
      updateNarration();
      // 更新折目标记
      updateMarkerPosition();

      // 4. 再 200ms 后亮起 + 新皮影淡入
      setTimeout(function () {
        createPuppets(ACTS[state.currentAct]);
        sceneOverlay.classList.remove('dimming');
        updateProgressBar();

        setTimeout(function () {
          state.isTransitioning = false;
        }, 600);
      }, 200);
    }, 300);
  }

  function jumpToAct(actIndex) {
    if (state.isTransitioning || actIndex === state.currentAct) return;
    state.isTransitioning = true;

    // 标记之前的为已完成
    for (var i = 0; i < actIndex; i++) {
      state.completed[i] = true;
    }

    sceneOverlay.classList.add('dimming');
    spawnDustParticles();

    setTimeout(function () {
      state.currentAct = actIndex;
      puppetLayer.innerHTML = '';
      state.puppets = {};
      updateNarration();
      updateMarkerPosition();

      setTimeout(function () {
        createPuppets(ACTS[state.currentAct]);
        sceneOverlay.classList.remove('dimming');
        updateProgressBar();

        setTimeout(function () {
          state.isTransitioning = false;
        }, 600);
      }, 200);
    }, 300);
  }

  // ============================================================
  // 尘光粒子
  // ============================================================
  var dustTimeouts = [];
  function spawnDustParticles() {
    if (REDUCED_MOTION) return;
    // 清理旧的
    dustTimeouts.forEach(function (t) { clearTimeout(t); });
    dustTimeouts = [];
    dustBox.innerHTML = '';

    var count = 18;
    var rect = getStageRect();

    for (var i = 0; i < count; i++) {
      var p = document.createElement('div');
      p.className = 'dust-particle';
      var startX = Math.random() * rect.width;
      var startY = rect.height * 0.3 + Math.random() * rect.height * 0.6;
      var size = 1.5 + Math.random() * 3;
      p.style.left = startX + 'px';
      p.style.top = startY + 'px';
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      dustBox.appendChild(p);

      var delay = Math.random() * 300;
      var duration = 1500 + Math.random() * 1200;
      var driftX = (Math.random() - 0.5) * 80;
      var driftY = -30 - Math.random() * 60;

      (function (el, d, dur, dx, dy) {
        var t = setTimeout(function () {
          el.style.transition = 'opacity ' + dur + 'ms ease, transform ' + dur + 'ms ease-out';
          el.style.opacity = '0.7';
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              el.style.opacity = '0';
              el.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
            });
          });
        }, d);
        dustTimeouts.push(t);
      })(p, delay, duration, driftX, driftY);
    }

    // 清理
    var cleanup = setTimeout(function () {
      dustBox.innerHTML = '';
    }, 2000);
    dustTimeouts.push(cleanup);
  }

  // ============================================================
  // 旁白字幕（逐字浮现）
  // ============================================================
  function updateNarration() {
    var act = ACTS[state.currentAct];
    narrTitle.textContent = '白蛇传';
    narrAct.textContent = act.title + ' · ' + act.name;

    narrText.innerHTML = '';
    var chars = act.narration.split('');
    chars.forEach(function (ch, i) {
      var span = document.createElement('span');
      span.className = 'char';
      span.textContent = ch;
      span.style.animationDelay = (i * 0.05) + 's';
      narrText.appendChild(span);
    });
  }

  // ============================================================
  // 进度条
  // ============================================================
  function updateProgressBar() {
    var segments = progressBar.querySelectorAll('.progress-segment');
    segments.forEach(function (seg, i) {
      seg.classList.remove('active', 'completed');
      if (i < state.currentAct || state.completed[i]) {
        seg.classList.add('completed');
      }
      if (i === state.currentAct) {
        seg.classList.add('active');
      }
    });
  }

  // 点击进度条跳折
  progressBar.addEventListener('click', function (e) {
    var seg = e.target.closest('.progress-segment');
    if (!seg) return;
    var idx = parseInt(seg.dataset.act, 10);
    if (!isNaN(idx)) {
      jumpToAct(idx);
    }
  });

  // ============================================================
  // 油灯光摇曳 (RAF)
  // ============================================================
  var lampTime = 0;
  function animateLamp() {
    if (REDUCED_MOTION) return;
    if (state.visibility !== 'visible') {
      state.rafId = requestAnimationFrame(animateLamp);
      return;
    }
    lampTime += 0.05 + Math.random() * 0.03;
    var flicker = 0.75 + Math.sin(lampTime) * 0.08 + Math.sin(lampTime * 2.3) * 0.05 + (Math.random() - 0.5) * 0.06;
    flicker = clamp(flicker, 0.55, 0.95);
    lampGlow.style.opacity = flicker.toFixed(3);

    // 位置微抖
    var offsetX = Math.sin(lampTime * 0.8) * 4;
    var offsetY = Math.sin(lampTime * 1.3) * 2;
    lampGlow.style.transform = 'translateX(calc(-50% + ' + offsetX.toFixed(1) + 'px)) translateY(' + offsetY.toFixed(1) + 'px)';

    state.rafId = requestAnimationFrame(animateLamp);
  }

  // ============================================================
  // 可见性变化时暂停
  // ============================================================
  document.addEventListener('visibilitychange', function () {
    state.visibility = document.visibilityState;
  });

  // ============================================================
  // 窗口 resize 时重算
  // ============================================================
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      updateRodLine();
    }, 100);
  });

  // ============================================================
  // 卸载清理
  // ============================================================
  window.addEventListener('beforeunload', function () {
    if (state.rafId) cancelAnimationFrame(state.rafId);
    dustTimeouts.forEach(function (t) { clearTimeout(t); });
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('mouseup', endDrag);
    document.removeEventListener('touchmove', onDragTouch);
    document.removeEventListener('touchend', endDrag);
  });

  // ============================================================
  // 初始化
  // ============================================================
  function init() {
    createPuppets(ACTS[0]);
    updateNarration();
    updateMarkerPosition();
    updateProgressBar();
    if (!REDUCED_MOTION) {
      animateLamp();
    } else {
      lampGlow.style.opacity = '0.6';
      cursorRod.style.display = 'none';
      document.body.style.cursor = 'default';
    }
  }

  // 等待字体加载后初始化
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>

</body>

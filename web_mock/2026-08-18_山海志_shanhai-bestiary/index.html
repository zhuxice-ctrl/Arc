<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>山海志 · 异兽图鉴数字展</title>
  <meta name="creative-medium" content="interactive-prototype">
  <meta name="description" content="山海志 · 异兽图鉴数字展 —— 一场跨越千年的山海经异兽沉浸式线上展览">
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@300;400;500;600;700;900&family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap">
  <style>
    /* ============ CSS Variables & Reset ============ */
    :root {
      --paper: #F5EFE0;
      --paper-dark: #E8DFC9;
      --paper-warm: #EFE6CE;
      --ink: #2B2620;
      --ink-soft: #4A4238;
      --ink-light: #6B6257;
      --ochre: #9C4A2F;
      --ochre-light: #B86244;
      --stone-green: #4A7A6A;
      --stone-green-light: #6A9A8A;
      --vermilion: #C0392B;
      --vermilion-dark: #A52E22;
      --gold: #B8860B;
      --gold-light: #D4A84B;
      --shadow-soft: 0 4px 20px rgba(43, 38, 32, 0.08);
      --shadow-deep: 0 8px 40px rgba(43, 38, 32, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Noto Serif SC', 'Source Han Serif CN', serif;
      background: var(--paper);
      color: var(--ink);
      overflow-x: hidden;
      cursor: none;
    }

    @media (max-width: 768px) {
      body { cursor: auto; }
    }

    /* ============ Custom Cursor ============ */
    .cursor-outer {
      position: fixed;
      top: 0;
      left: 0;
      width: 44px;
      height: 44px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.3s cubic-bezier(0.23, 1, 0.32, 1),
                  height 0.3s cubic-bezier(0.23, 1, 0.32, 1),
                  border-color 0.3s ease,
                  background 0.3s ease;
      mix-blend-mode: difference;
    }

    .cursor-outer.hover {
      width: 60px;
      height: 60px;
      border-color: var(--ochre);
      background: rgba(156, 74, 47, 0.1);
    }

    .cursor-outer.clicking {
      width: 32px;
      height: 32px;
      background: rgba(192, 57, 43, 0.2);
      border-color: var(--vermilion);
    }

    .cursor-inner {
      position: fixed;
      top: 0;
      left: 0;
      width: 8px;
      height: 8px;
      background: var(--ochre);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 12px var(--ochre), 0 0 24px rgba(156, 74, 47, 0.5);
      transition: width 0.2s ease, height 0.2s ease, background 0.3s ease;
    }

    .cursor-inner.hover {
      width: 4px;
      height: 4px;
      background: var(--vermilion);
      box-shadow: 0 0 8px var(--vermilion);
    }

    .cursor-ripple {
      position: fixed;
      top: 0;
      left: 0;
      width: 10px;
      height: 10px;
      border: 1.5px solid var(--ochre);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    @media (max-width: 768px) {
      .cursor-outer, .cursor-inner, .cursor-ripple { display: none; }
    }

    /* ============ Paper Texture Background ============ */
    .paper-texture {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(156, 74, 47, 0.04) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(74, 122, 106, 0.04) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(184, 134, 11, 0.03) 0%, transparent 60%);
    }

    .paper-grain {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.06;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    /* ============ Navigation ============ */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 24px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(245, 239, 224, 0.9) 0%, rgba(245, 239, 224, 0) 100%);
      backdrop-filter: blur(8px);
      transition: background 0.4s ease, padding 0.4s ease;
    }

    .nav.scrolled {
      background: rgba(245, 239, 224, 0.95);
      padding: 16px 48px;
      box-shadow: 0 2px 20px rgba(43, 38, 32, 0.06);
    }

    .nav-logo {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 28px;
      color: var(--ink);
      letter-spacing: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-logo-seal {
      width: 32px;
      height: 32px;
      background: var(--vermilion);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--paper);
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 18px;
      transform: rotate(-3deg);
    }

    .nav-links {
      display: flex;
      gap: 36px;
      list-style: none;
    }

    .nav-links a {
      font-size: 15px;
      color: var(--ink-soft);
      text-decoration: none;
      position: relative;
      transition: color 0.3s ease;
      font-weight: 500;
      letter-spacing: 2px;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      width: 0;
      height: 2px;
      background: var(--ochre);
      transition: width 0.3s ease, left 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--ochre);
    }

    .nav-links a:hover::after {
      width: 100%;
      left: 0;
    }

    .nav-enter {
      padding: 10px 24px;
      border: 1.5px solid var(--ink);
      background: transparent;
      color: var(--ink);
      font-family: 'Noto Serif SC', serif;
      font-size: 14px;
      letter-spacing: 3px;
      cursor: none;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .nav-enter::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: var(--ink);
      transition: left 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      z-index: -1;
    }

    .nav-enter:hover {
      color: var(--paper);
      border-color: var(--ink);
    }

    .nav-enter:hover::before {
      left: 0;
    }

    .nav-hamburger {
      display: none;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 8px;
    }

    .nav-hamburger span {
      width: 28px;
      height: 2px;
      background: var(--ink);
      transition: all 0.3s ease;
    }

    @media (max-width: 768px) {
      .nav { padding: 16px 20px; }
      .nav-links { display: none; }
      .nav-enter { display: none; }
      .nav-hamburger { display: flex; }
      .nav-logo { font-size: 22px; }
    }

    /* ============ Hero Section ============ */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      padding: 120px 24px 80px;
      overflow: hidden;
    }

    .hero-scroll-top,
    .hero-scroll-bottom {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: min(700px, 90vw);
      height: 48px;
      background: linear-gradient(180deg, var(--ochre) 0%, #7A3A24 100%);
      border-radius: 6px;
      z-index: 5;
      box-shadow: 0 4px 16px rgba(43, 38, 32, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .hero-scroll-top { top: calc(50% - 260px); }
    .hero-scroll-bottom { bottom: calc(50% - 260px); }

    .hero-scroll-top::before,
    .hero-scroll-bottom::before {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      background: var(--gold);
      border-radius: 50%;
      left: 20px;
      box-shadow: 0 0 8px rgba(184, 134, 11, 0.6);
    }

    .hero-scroll-top::after,
    .hero-scroll-bottom::after {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      background: var(--gold);
      border-radius: 50%;
      right: 20px;
      box-shadow: 0 0 8px rgba(184, 134, 11, 0.6);
    }

    .hero-scroll-paper {
      position: relative;
      width: min(700px, 90vw);
      min-height: 480px;
      background: var(--paper);
      border-left: 1px solid var(--paper-dark);
      border-right: 1px solid var(--paper-dark);
      box-shadow: 0 0 60px rgba(43, 38, 32, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 40px;
      overflow: hidden;
      z-index: 4;
    }

    .hero-scroll-paper::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(ellipse at top center, rgba(156, 74, 47, 0.05) 0%, transparent 60%),
        radial-gradient(ellipse at bottom center, rgba(74, 122, 106, 0.05) 0%, transparent 60%);
      pointer-events: none;
    }

    .hero-mountain-bg {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 200px;
      opacity: 0.08;
      pointer-events: none;
    }

    .hero-title {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: clamp(48px, 8vw, 96px);
      color: var(--ink);
      text-align: center;
      letter-spacing: 12px;
      line-height: 1.2;
      position: relative;
      z-index: 2;
      text-shadow: 2px 2px 0 rgba(156, 74, 47, 0.1);
    }

    .hero-title-sub {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: clamp(18px, 2.5vw, 28px);
      color: var(--ink-soft);
      letter-spacing: 8px;
      margin-top: 16px;
      position: relative;
      z-index: 2;
    }

    .hero-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 32px 0;
      position: relative;
      z-index: 2;
    }

    .hero-divider-line {
      width: 60px;
      height: 1px;
      background: var(--ochre);
      opacity: 0.6;
    }

    .hero-divider-diamond {
      width: 8px;
      height: 8px;
      background: var(--ochre);
      transform: rotate(45deg);
    }

    .hero-desc {
      font-size: 16px;
      color: var(--ink-light);
      text-align: center;
      line-height: 2;
      max-width: 480px;
      letter-spacing: 2px;
      position: relative;
      z-index: 2;
    }

    .hero-seal {
      position: absolute;
      top: 30px;
      right: 40px;
      width: 72px;
      height: 72px;
      background: var(--vermilion);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--paper);
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 24px;
      letter-spacing: 2px;
      transform: rotate(8deg);
      z-index: 3;
      box-shadow: 2px 4px 12px rgba(192, 57, 43, 0.3);
      opacity: 0;
      transform: rotate(8deg) scale(2);
    }

    .hero-seal.stamped {
      animation: sealStamp 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }

    @keyframes sealStamp {
      0% { opacity: 0; transform: rotate(8deg) scale(2); }
      50% { opacity: 0.9; transform: rotate(6deg) scale(0.95); }
      70% { opacity: 1; transform: rotate(9deg) scale(1.05); }
      100% { opacity: 0.85; transform: rotate(8deg) scale(1); }
    }

    .hero-scroll-hint {
      position: absolute;
      bottom: -80px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--ink-light);
      font-size: 12px;
      letter-spacing: 4px;
      z-index: 2;
    }

    .hero-scroll-hint-arrow {
      width: 2px;
      height: 40px;
      background: linear-gradient(180deg, var(--ochre), transparent);
      position: relative;
      overflow: hidden;
    }

    .hero-scroll-hint-arrow::after {
      content: '';
      position: absolute;
      top: -40px;
      left: 0;
      width: 100%;
      height: 40px;
      background: linear-gradient(180deg, transparent, var(--ochre), transparent);
      animation: scrollHint 2s ease-in-out infinite;
    }

    @keyframes scrollHint {
      0% { top: -40px; }
      100% { top: 40px; }
    }

    /* Floating cloud decorations */
    .cloud-deco {
      position: absolute;
      pointer-events: none;
      opacity: 0.15;
      z-index: 1;
    }

    .cloud-deco svg {
      fill: var(--stone-green);
    }

    .cloud-1 { top: 15%; left: 5%; animation: cloudFloat1 25s ease-in-out infinite; }
    .cloud-2 { top: 25%; right: 8%; animation: cloudFloat2 35s ease-in-out infinite; }
    .cloud-3 { bottom: 20%; left: 10%; animation: cloudFloat3 30s ease-in-out infinite; }

    @keyframes cloudFloat1 {
      0%, 100% { transform: translateX(0) translateY(0); }
      50% { transform: translateX(30px) translateY(-15px); }
    }

    @keyframes cloudFloat2 {
      0%, 100% { transform: translateX(0) translateY(0); }
      50% { transform: translateX(-25px) translateY(20px); }
    }

    @keyframes cloudFloat3 {
      0%, 100% { transform: translateX(0) translateY(0); }
      50% { transform: translateX(20px) translateY(-10px); }
    }

    /* ============ Section Shared ============ */
    .section {
      position: relative;
      z-index: 1;
      padding: 120px 48px;
    }

    .section-header {
      text-align: center;
      margin-bottom: 80px;
    }

    .section-label {
      display: inline-block;
      font-size: 13px;
      color: var(--ochre);
      letter-spacing: 6px;
      margin-bottom: 20px;
      position: relative;
    }

    .section-label::before,
    .section-label::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 30px;
      height: 1px;
      background: var(--ochre);
      opacity: 0.4;
    }

    .section-label::before { right: calc(100% + 16px); }
    .section-label::after { left: calc(100% + 16px); }

    .section-title {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: clamp(36px, 5vw, 56px);
      color: var(--ink);
      letter-spacing: 8px;
      margin-bottom: 16px;
    }

    .section-subtitle {
      font-size: 15px;
      color: var(--ink-light);
      letter-spacing: 3px;
    }

    @media (max-width: 768px) {
      .section { padding: 80px 20px; }
      .section-header { margin-bottom: 48px; }
    }

    /* ============ Creature Gallery ============ */
    .gallery {
      background: var(--paper-warm);
      position: relative;
    }

    .gallery::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--paper-dark), transparent);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 40px;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (max-width: 1024px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 32px; }
    }

    @media (max-width: 640px) {
      .gallery-grid { grid-template-columns: 1fr; gap: 24px; }
    }

    .creature-card {
      position: relative;
      background: var(--paper);
      border: 1px solid var(--paper-dark);
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow 0.4s ease;
      transform-style: preserve-3d;
      perspective: 1000px;
    }

    .creature-card:hover {
      box-shadow: var(--shadow-deep);
    }

    .creature-card-inner {
      position: relative;
      padding: 0;
      transform-style: preserve-3d;
      transition: transform 0.1s linear;
    }

    .creature-visual {
      position: relative;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: var(--paper-warm);
    }

    .creature-visual-bg {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      opacity: 0.9;
      transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.4s ease;
    }

    .creature-card:hover .creature-visual-bg {
      transform: scale(1.06);
    }

    .creature-visual-ink {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(43, 38, 32, 0.1) 100%);
      pointer-events: none;
    }

    .creature-visual-frame {
      position: absolute;
      top: 16px; left: 16px; right: 16px; bottom: 16px;
      border: 1px solid rgba(156, 74, 47, 0.3);
      pointer-events: none;
    }

    .creature-rank {
      position: absolute;
      top: 28px;
      left: 28px;
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 48px;
      color: rgba(156, 74, 47, 0.12);
      z-index: 2;
      transform: translateZ(30px);
    }

    .creature-name {
      position: absolute;
      bottom: 28px;
      left: 28px;
      z-index: 2;
      transform: translateZ(40px);
    }

    .creature-name h3 {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 36px;
      color: var(--ink);
      letter-spacing: 4px;
      text-shadow: 0 2px 8px rgba(245, 239, 224, 0.8);
    }

    .creature-name span {
      display: block;
      font-size: 13px;
      color: var(--ink-soft);
      letter-spacing: 3px;
      margin-top: 4px;
      font-family: 'ZCOOL XiaoWei', serif;
    }

    .creature-card-seal {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 44px;
      height: 44px;
      background: var(--vermilion);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--paper);
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 14px;
      transform: rotate(-6deg) scale(0);
      z-index: 3;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .creature-card:hover .creature-card-seal {
      transform: rotate(-6deg) scale(1);
    }

    .creature-info {
      padding: 24px 28px 28px;
      border-top: 1px solid var(--paper-dark);
      position: relative;
    }

    .creature-info::before {
      content: '';
      position: absolute;
      top: 0;
      left: 28px;
      width: 40px;
      height: 2px;
      background: var(--ochre);
      transform: translateY(-50%);
    }

    .creature-source {
      font-size: 13px;
      color: var(--stone-green);
      letter-spacing: 2px;
      margin-bottom: 12px;
      font-family: 'ZCOOL XiaoWei', serif;
    }

    .creature-source::before {
      content: '出处 · ';
      color: var(--ink-light);
      font-size: 12px;
    }

    .creature-desc {
      font-size: 14px;
      color: var(--ink-soft);
      line-height: 1.9;
      letter-spacing: 1px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .creature-tags {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .creature-tag {
      font-size: 12px;
      padding: 4px 10px;
      border: 1px solid var(--paper-dark);
      color: var(--ink-light);
      letter-spacing: 1px;
    }

    .creature-tag.sacred { color: var(--gold); border-color: rgba(184, 134, 11, 0.4); background: rgba(184, 134, 11, 0.05); }
    .creature-tag.auspicious { color: var(--stone-green); border-color: rgba(74, 122, 106, 0.4); background: rgba(74, 122, 106, 0.05); }
    .creature-tag.fierce { color: var(--vermilion); border-color: rgba(192, 57, 43, 0.4); background: rgba(192, 57, 43, 0.05); }

    .creature-card-glow {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
      box-shadow: inset 0 0 40px rgba(156, 74, 47, 0.1);
    }

    .creature-card:hover .creature-card-glow {
      opacity: 1;
    }

    /* Ink spread effect on hover */
    .ink-spread {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(43, 38, 32, 0.08) 0%, transparent 70%);
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      transition: transform 0.6s ease-out, opacity 0.6s ease-out;
    }

    /* ============ Detail Modal ============ */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(43, 38, 32, 0.6);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      padding: 24px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

      height: 1.5px;

    .modal-close::after { transform: rotate(-45deg); }

      aspect-ratio: 16 / 7;

      top: 0; left: 0; right: 0; bottom: 0;

    .modal-hero-info {

      right: 40px;

    .modal-hero-name {

      letter-spacing: 8px;
      margin-bottom: 8px;
    }

    .modal-hero-pinyin {

      left: 40px;

      height: 64px;

      align-items: center;
      justify-content: center;
      color: var(--paper);

      margin: 0 auto;
      position: relative;

    @media (max-width: 640px) {
      .zones-grid { grid-template-columns: 1fr; }

      position: relative;
      aspect-ratio: 3 / 4;

      border: 1px solid var(--paper-dark);

      left: 0;

      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
    }

    .footer-bottom p {
      font-size: 12px;
      color: rgba(245, 239, 224, 0.4);
      letter-spacing: 2px;
    }

    .footer-seal {
      width: 40px;
      height: 40px;
      background: var(--vermilion);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--paper);
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 16px;
      transform: rotate(-3deg);
    }

    /* ============ Scroll Reveal ============ */
    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.8s cubic-bezier(0.23, 1, 0.32, 1),
                  transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }
    .reveal-delay-4 { transition-delay: 0.4s; }
    .reveal-delay-5 { transition-delay: 0.5s; }
    .reveal-delay-6 { transition-delay: 0.6s; }

    /* ============ Typing Effect ============ */
    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--ochre);
      margin-left: 4px;
      vertical-align: text-bottom;
      animation: typingBlink 1s steps(2) infinite;
    }

    @keyframes typingBlink {
      50% { opacity: 0; }
    }

    /* ============ Decorative Border Pattern ============ */
    .border-pattern-top,
    .border-pattern-bottom {
      position: absolute;
      left: 0;
      right: 0;
      height: 20px;
      background-repeat: repeat-x;
      background-size: 40px 20px;
      opacity: 0.3;
      pointer-events: none;
    }

    .border-pattern-top { top: 0; }
    .border-pattern-bottom { bottom: 0; }

    /* ============ Counter ============ */
    .counter {
      display: inline-block;
      font-variant-numeric: tabular-nums;
    }

    /* ============ Wave/Ripple Decoration ============ */
    .wave-divider {
      height: 60px;
      position: relative;
      overflow: hidden;
    }

    .wave-divider svg {
      position: absolute;
      bottom: 0;
      width: 200%;
      height: 100%;
      animation: waveMove 20s linear infinite;
    }

    @keyframes waveMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* ============ Reduced Motion ============ */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .cursor-outer, .cursor-inner { display: none; }
      body { cursor: auto; }
      .reveal { opacity: 1; transform: none; }
      .creature-card-inner { transform: none !important; }
    }

    /* ============ Scrollbar ============ */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--paper-warm);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--ochre);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--ochre-light);
    }
  </style>
</head>

    // ============ Custom Cursor ============
    const CustomCursor = () => {
      const outerRef = useRef(null);
      const innerRef = useRef(null);
      const [isHover, setIsHover] = useState(false);
      const [isClicking, setIsClicking] = useState(false);
      const rafRef = useRef(null);
      const mouseRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
      const outerPosRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });

      useEffect(() => {
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduceMotion) return;

        const handleMove = (e) => {
          mouseRef.current = { x: e.clientX, y: e.clientY };
        };

        // Spring physics for outer ring
        const animate = () => {
          const target = mouseRef.current;
          const pos = outerPosRef.current;

          // Spring damping
          const dx = target.x - pos.x;
          const dy = target.y - pos.y;

          pos.x += dx * 0.15;
          pos.y += dy * 0.15;

          if (outerRef.current) {
            outerRef.current.style.transform = `translate(${pos.x}px, ${pos.y}px) translate(-50%, -50%)`;
          }
          if (innerRef.current) {
            innerRef.current.style.transform = `translate(${target.x}px, ${target.y}px) translate(-50%, -50%)`;
          }

          rafRef.current = requestAnimationFrame(animate);
        };

        rafRef.current = requestAnimationFrame(animate);
        window.addEventListener('mousemove', handleMove);

        // Hover detection
        const handleOver = (e) => {
          const target = e.target.closest('a, button, .creature-card, .zone-card, .modal-close, input, textarea, [role="button"]');
          if (target) setIsHover(true);
        };

        const handleOut = (e) => {
          const target = e.target.closest('a, button, .creature-card, .zone-card, .modal-close, input, textarea, [role="button"]');
          if (target) setIsHover(false);
        };

        window.addEventListener('mouseover', handleOver);
        window.addEventListener('mouseout', handleOut);

        // Click ripple
        const handleDown = () => setIsClicking(true);
        const handleUp = () => setIsClicking(false);
        window.addEventListener('mousedown', handleDown);
        window.addEventListener('mouseup', handleUp);

        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          window.removeEventListener('mousemove', handleMove);
          window.removeEventListener('mouseover', handleOver);
          window.removeEventListener('mouseout', handleOut);
          window.removeEventListener('mousedown', handleDown);
          window.removeEventListener('mouseup', handleUp);
        };
      }, []);

      return (
        <>
          <div
            ref={outerRef}
            className={`cursor-outer ${isHover ? 'hover' : ''} ${isClicking ? 'clicking' : ''}`}
          />
          <div ref={innerRef} className={`cursor-inner ${isHover ? 'hover' : ''}`} />
          <ClickRipples />
        </>
      );
    };

      const [ripples, setRipples] = useState([]);

      useEffect(() => {
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduceMotion) return;

        const handleClick = (e) => {
          const id = ++idRef.current;
          setRipples(prev => [...prev, { id, x: e.clientX, y: e.clientY }]);

          setTimeout(() => {
            setRipples(prev => prev.filter(r => r.id !== id));
          }, 600);
        };

        window.addEventListener('click', handleClick);
        return () => window.removeEventListener('click', handleClick);
      }, []);

      return (
        <>
          {ripples.map(r => (
            <div
              key={r.id}
              className="cursor-ripple"
              style={{
                left: r.x,
                top: r.y,
                animation: 'rippleExpand 0.6s ease-out forwards',

              const docHeight = document.documentElement.scrollHeight - window.innerHeight;
              setWidth(docHeight > 0 ? (scrollTop / docHeight) * 100 : 0);
              ticking = false;

            ticking = true;

        window.addEventListener('scroll', handleScroll, { passive: true });

    // ============ Creature Card with 3D tilt ============
    const CreatureCard = ({ creature, onOpen, delay }) => {
      const cardRef = useRef(null);
      const innerRef = useRef(null);
      const rafRef = useRef(null);
      const mouseRef = useRef({ x: 0.5, y: 0.5 });
      const targetRef = useRef({ x: 0.5, y: 0.5 });

      const handleMouseMove = useCallback((e) => {
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduceMotion) return;

        const rect = cardRef.current.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        const y = (e.clientY - rect.top) / rect.height;
        targetRef.current = { x, y };

        if (!rafRef.current) {
          rafRef.current = requestAnimationFrame(updateTilt);
        }
      }, []);

      const updateTilt = () => {
        const m = mouseRef.current;
        const t = targetRef.current;

        // Spring physics
        m.x += (t.x - m.x) * 0.12;
        m.y += (t.y - m.y) * 0.12;

        const rotateY = (m.x - 0.5) * 12;
        const rotateX = (0.5 - m.y) * 12;

        if (innerRef.current) {
          innerRef.current.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        }

        // Continue if there's significant movement
        const dx = Math.abs(t.x - m.x);
        const dy = Math.abs(t.y - m.y);
        if (dx > 0.001 || dy > 0.001) {
          rafRef.current = requestAnimationFrame(updateTilt);
        } else {
          rafRef.current = null;
        }
      };

      const handleMouseLeave = useCallback(() => {
        targetRef.current = { x: 0.5, y: 0.5 };
        if (!rafRef.current) {
          rafRef.current = requestAnimationFrame(updateTilt);
        }
      }, []);

        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
        };
      }, []);

    // Counter component with spring animation
    const CounterCard = ({ stat, delay }) => {
      const [count, setCount] = useState(0);
      const ref = useRef(null);
      const rafRef = useRef(null);
      const startTimeRef = useRef(null);

      useEffect(() => {
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting && !startTimeRef.current) {
                animateCount();
              }
            });
          },
          { threshold: 0.3 }
        );

        if (ref.current) observer.observe(ref.current);
        return () => observer.disconnect();
      }, []);

      const animateCount = () => {
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduceMotion) {
          setCount(stat.value);
          return;
        }

        const duration = 2000 + delay * 300;
        const start = 0;
        const end = stat.value;

        const step = (timestamp) => {
          if (!startTimeRef.current) startTimeRef.current = timestamp;
          const elapsed = timestamp - startTimeRef.current;
          const progress = Math.min(elapsed / duration, 1);

          // Ease out cubic
          const eased = 1 - Math.pow(1 - progress, 3);
          setCount(Math.floor(start + (end - start) * eased));

          if (progress < 1) {
            rafRef.current = requestAnimationFrame(step);
          }
        };

        rafRef.current = requestAnimationFrame(step);
      };

      useEffect(() => {
        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
        };
      }, []);

      return (
        <div
          ref={ref}
          className={`reveal reveal-delay-${delay + 1}`}
          style={{
            textAlign: 'center',
            padding: '32px 16px',
            background: 'var(--paper)',
            border: '1px solid var(--paper-dark)',

            letterSpacing: 3,
          }}>
            {stat.label}
          </div>
        </div>
      );
    };

    // ============ Scroll Reveal Hook ============
    const useScrollReveal = () => {
      useEffect(() => {
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduceMotion) {
          document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
          return;
        }

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add('visible');
              }
            });
          },
          { threshold: 0.1, rootMargin: '0px 0px -50px 0px' }
        );

        const elements = document.querySelectorAll('.reveal');
        elements.forEach(el => observer.observe(el));

        return () => observer.disconnect();
      }, []);
    };

    // ============ Main App ============
    const App = () => {
      const [selectedCreature, setSelectedCreature] = useState(null);
      const [isVisible, setIsVisible] = useState(true);

      useScrollReveal();

      // Handle visibility change for animation pausing
      useEffect(() => {
        const handleVisibility = () => {
          setIsVisible(!document.hidden);
        };
        document.addEventListener('visibilitychange', handleVisibility);
        return () => document.removeEventListener('visibilitychange', handleVisibility);
      }, []);

      const openCreature = useCallback((creature) => {

      return (

    // ============ Render ============
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Announce upgrade capability
    function announceUpgrade() {
      window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    }
    announceUpgrade();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announceUpgrade, { once: true });
    }
  </script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="creative-medium" content="interactive-prototype">
<title>古琴·七弦十三徽志</title>
<style>
/* =========================================================
   七弦十三徽志 · 古琴文化纪元
   漆黑金徽配色 · 漆器色系
   ========================================================= */

:root {
  --lacquer-black: #0E0F12;
  --lacquer-black-2: #14151a;
  --gold-hui: #C9A84C;
  --gold-hui-soft: #b89a44;
  --mother-of-pearl: #5B7A8F;
  --jade: #8FA68E;
  --cinnabar: #B23A2E;
  --cinnabar-soft: #8f2f25;
  --silk-white: #E8DFD0;
  --silk-white-dim: #a8a090;
  --string-silk: #C4B89A;
  --crack-line: #1A1B20;
  --panel-bg: rgba(20, 21, 26, 0.88);
  --panel-border: rgba(201, 168, 76, 0.2);
}

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  min-height: 100%;
  background: var(--lacquer-black);
  color: var(--silk-white);
  font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  position: relative;
  min-height: 100vh;
  cursor: none;
}

/* 触屏设备回落系统光标 */
@media (hover: none) and (pointer: coarse) {
  body { cursor: auto; }
  .custom-cursor { display: none !important; }
}

/* ========== 断纹底纹（漆面质感） ========== */
.crackle-bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    repeating-linear-gradient(
      115deg,
      transparent 0px,
      transparent 38px,
      var(--crack-line) 38px,
      var(--crack-line) 38.6px
    ),
    repeating-linear-gradient(
      65deg,
      transparent 0px,
      transparent 72px,
      rgba(26, 27, 32, 0.6) 72px,
      rgba(26, 27, 32, 0.6) 72.4px
    ),
    radial-gradient(
      ellipse at 50% 40%,
      #17181d 0%,
      var(--lacquer-black) 55%,
      #0a0b0d 100%
    );
  opacity: 0.9;
}

/* ========== 自定义光标 ========== */
.custom-cursor {
  position: fixed;
  top: 0;
  left: 0;
  width: 26px;
  height: 26px;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  transition: width 0.25s ease, height 0.25s ease,
              border-color 0.25s ease;
  will-change: transform;
}

.custom-cursor .ring {
  position: absolute;
  inset: 0;
  border: 1.2px solid var(--gold-hui);
  border-radius: 50%;
  box-shadow: 0 0 6px rgba(201, 168, 76, 0.35),
              inset 0 0 4px rgba(201, 168, 76, 0.15);
}

.custom-cursor .dot {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 3px;
  height: 3px;
  background: var(--gold-hui);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 4px rgba(201, 168, 76, 0.8);
}

.custom-cursor.is-hover {
  width: 44px;
  height: 44px;
}

.custom-cursor.is-hover .ring {
  border-color: var(--gold-hui);
  box-shadow: 0 0 12px rgba(201, 168, 76, 0.5),
              inset 0 0 6px rgba(201, 168, 76, 0.2);
}

/* ========== 顶部标题条 ========== */
.top-bar {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 48px 12px;
}

.title-group {
  display: flex;
  align-items: baseline;
  gap: 18px;
}

.main-title {
  font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
  font-size: 30px;
  font-weight: 600;
  letter-spacing: 0.25em;
  color: var(--silk-white);
  position: relative;
}

.main-title::before {
  content: "印";
  position: absolute;
  right: -44px;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  background: var(--cinnabar);
  color: #f5e6d0;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 3px;
  font-family: "Noto Serif SC", serif;
  box-shadow: 0 0 0 1px rgba(178, 58, 46, 0.3),
              inset 0 0 0 1px rgba(245, 230, 208, 0.2);
}

.sub-title {
  font-size: 14px;
  color: var(--gold-hui-soft);
  letter-spacing: 0.5em;
  margin-left: 10px;
}

.top-note {
  font-size: 12px;
  color: var(--silk-white-dim);
  letter-spacing: 0.1em;
  text-align: right;
  line-height: 1.7;
}

.top-note .sep {
  color: var(--gold-hui-soft);
  margin: 0 8px;
}

/* ========== 主舞台 ========== */
.stage {
  position: relative;
  z-index: 5;
  padding: 20px 48px 10px;
}

/* 弦板容器 */
.string-board {
  position: relative;
  width: 100%;
  height: 420px;
  border-top: 1px solid rgba(201, 168, 76, 0.12);
  border-bottom: 1px solid rgba(201, 168, 76, 0.12);
  background:
    linear-gradient(180deg,
      rgba(91, 122, 143, 0.04) 0%,
      transparent 30%,
      transparent 70%,
      rgba(201, 168, 76, 0.03) 100%);
  overflow: hidden;
}

/* 弦板上的断纹 */
.string-board::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(
      110deg,
      transparent 0px,
      transparent 56px,
      rgba(26, 27, 32, 0.7) 56px,
      rgba(26, 27, 32, 0.7) 56.6px
    );
  pointer-events: none;
  opacity: 0.8;
  transition: transform 0.4s ease-out;
}

/* 弦（左侧标签区 + 弦身） */
.string-row {
  position: absolute;
  left: 120px;
  right: 40px;
  display: flex;
  align-items: center;
  pointer-events: none;
}

.string-line {
  position: relative;
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    var(--string-silk) 5%,
    var(--string-silk) 95%,
    transparent 100%);
  pointer-events: none;
  opacity: 0;
  transform: scaleX(0);
  transform-origin: center;
}

/* 丝弦质感 — 细微双线 */
.string-line::before {
  content: "";
  position: absolute;
  top: -0.5px;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(196, 184, 154, 0.6) 5%,
    rgba(196, 184, 154, 0.6) 95%,
    transparent 100%);
  filter: blur(0.3px);
}

/* 弦切面标签 */
.string-label {
  position: absolute;
  left: -110px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 15px;
  letter-spacing: 0.4em;
  color: var(--silk-white-dim);
  writing-mode: horizontal-tb;
  padding: 6px 10px 6px 0;
  cursor: pointer;
  pointer-events: auto;
  transition: color 0.3s ease, text-shadow 0.3s ease;
  border-right: 1px solid transparent;
  user-select: none;
  white-space: nowrap;
}

.string-label::before {
  content: "";
  display: inline-block;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--silk-white-dim);
  margin-right: 10px;
  vertical-align: middle;
  transition: all 0.3s ease;
}

.string-label:hover {
  color: var(--silk-white);
}

.string-label.active {
  color: var(--cinnabar);
  text-shadow: 0 0 8px rgba(178, 58, 46, 0.4);
}

.string-label.active::before {
  background: var(--cinnabar);
  box-shadow: 0 0 6px rgba(178, 58, 46, 0.6);
}

/* 弦振动（鸣弦） */
.string-line.vibrating {
  animation: stringVibrate 0.15s ease-in-out infinite;
}

@keyframes stringVibrate {
  0%, 100% { transform: translateY(0); }
  25% { transform: translateY(-1.2px); }
  75% { transform: translateY(1.2px); }
}

/* ========== 徽位 ========== */
.hui {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%,
    #e8d48a 0%,
    var(--gold-hui) 45%,
    #8a7130 100%);
  box-shadow:
    0 0 6px rgba(201, 168, 76, 0.4),
    inset 0 0 3px rgba(255, 240, 200, 0.5);
  cursor: pointer;
  z-index: 3;
  transform: translate(-50%, -50%) scale(0);
  transition: box-shadow 0.3s ease;
  pointer-events: auto;
}

.hui.visible {
  transform: translate(-50%, -50%) scale(1);
}

.hui:hover {
  box-shadow:
    0 0 14px rgba(201, 168, 76, 0.7),
    0 0 2px var(--gold-hui),
    inset 0 0 4px rgba(255, 240, 200, 0.7);
}

/* 中央七徽略大 */
.hui.center {
  width: 14px;
  height: 14px;
}

/* 徽位 tooltip（悬停预览纪元名） */
.hui-tooltip {
  position: absolute;
  bottom: calc(100% + 10px);
  left: 50%;
  transform: translateX(-50%);
  font-size: 13px;
  color: var(--silk-white);
  white-space: nowrap;
  padding: 4px 10px;
  background: rgba(20, 21, 26, 0.9);
  border: 1px solid rgba(201, 168, 76, 0.3);
  border-radius: 3px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  letter-spacing: 0.2em;
  font-family: "Noto Serif SC", serif;
}

.hui-tooltip::after {
  content: "";
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 4px solid transparent;
  border-top-color: rgba(201, 168, 76, 0.3);
}

.hui:hover .hui-tooltip {
  opacity: 1;
}

/* ========== 游徽（当前纪元指示器） ========== */
.roaming-hui {
  position: absolute;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1.5px solid var(--gold-hui);
  pointer-events: none;
  z-index: 5;
  transform: translate(-50%, -50%);
  box-shadow:
    0 0 12px rgba(201, 168, 76, 0.35),
    inset 0 0 6px rgba(201, 168, 76, 0.15);
  will-change: left, top;
}

.roaming-hui::before {
  content: "";
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  border: 1px solid rgba(201, 168, 76, 0.4);
  animation: huiBreath 3s ease-in-out infinite;
}

.roaming-hui .hui-num {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 11px;
  color: var(--gold-hui);
  font-weight: 600;
  font-family: "Noto Serif SC", serif;
  letter-spacing: 0;
}

@keyframes huiBreath {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50% { opacity: 0.8; transform: scale(1.08); }
}

/* ========== 泛音涟漪 ========== */
.ripple-container {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 4;
}

.ripple {
  position: absolute;
  border-radius: 50%;
  border: 1px solid var(--gold-hui);
  transform: translate(-50%, -50%) scale(0);
  opacity: 0;
  pointer-events: none;
}

@keyframes rippleExpand {
  0% {
    transform: translate(-50%, -50%) scale(0.2);
    opacity: 0.8;
    border-width: 1.5px;
  }
  100% {
    transform: translate(-50%, -50%) scale(1);
    opacity: 0;
    border-width: 0.5px;
  }
}

/* ========== 底部时间轴 ========== */
.timeline {
  position: relative;
  margin: 14px 160px 0 160px;
  height: 40px;
  border-top: 1px solid rgba(201, 168, 76, 0.15);
}

.timeline-track {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: transparent;
}

.timeline-marker {
  position: absolute;
  top: -3px;
  width: 1px;
  height: 7px;
  background: var(--gold-hui-soft);
  transform: translateX(-50%);
  opacity: 0.5;
}

.timeline-marker.active {
  height: 12px;
  top: -5px;
  background: var(--gold-hui);
  opacity: 1;
  box-shadow: 0 0 6px rgba(201, 168, 76, 0.5);
}

.timeline-label {
  position: absolute;
  top: 12px;
  font-size: 11px;
  color: var(--silk-white-dim);
  letter-spacing: 0.1em;
  transform: translateX(-50%);
  white-space: nowrap;
}

.timeline-label.active {
  color: var(--gold-hui);
}

/* ========== 内容面板 ========== */
.content-panel {
  position: relative;
  z-index: 6;
  margin: 30px 48px 20px;
  padding: 32px 40px;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 2px;
  min-height: 200px;
  opacity: 0;
  transform: translateY(16px);
  transition: opacity 0.5s ease, transform 0.5s ease;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.content-panel.visible {
  opacity: 1;
  transform: translateY(0);
}

.content-header {
  display: flex;
  align-items: baseline;
  gap: 20px;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid rgba(201, 168, 76, 0.15);
}

.era-name {
  font-size: 36px;
  font-weight: 600;
  color: var(--silk-white);
  letter-spacing: 0.3em;
  font-family: "Noto Serif SC", "Songti SC", serif;
  position: relative;
  display: inline-block;
  /* 笔锋绘入用 mask */
}

.era-draw-path {
  display: inline-block;
  position: relative;
  overflow: hidden;
}

.era-draw-path::after {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  background: var(--panel-bg);
  animation: drawReveal 1.2s cubic-bezier(0.65, 0, 0.35, 1) forwards;
}

@keyframes drawReveal {
  from { width: 100%; }
  to { width: 0%; }
}

.era-year {
  font-size: 14px;
  color: var(--gold-hui-soft);
  letter-spacing: 0.2em;
  font-variant-numeric: tabular-nums;
}

.era-year .num {
  display: inline-block;
  opacity: 0;
  transform: translateY(10px);
}

.era-year .num.in {
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.3s ease, transform 0.3s ease;
}

.era-section-tag {
  margin-left: auto;
  font-size: 13px;
  color: var(--cinnabar);
  letter-spacing: 0.3em;
  padding: 4px 12px;
  border: 1px solid var(--cinnabar);
  border-radius: 2px;
  opacity: 0;
  transition: opacity 0.4s ease;
}

.era-section-tag.visible {
  opacity: 1;
}

.era-narrative {
  font-size: 15px;
  line-height: 2;
  color: var(--silk-white);
  letter-spacing: 0.06em;
  margin-bottom: 20px;
  text-indent: 2em;
}

.era-narrative .highlight {
  color: var(--cinnabar);
  font-weight: 500;
}

/* callout */
.callout-group {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}

.callout {
  flex: 1;
  min-width: 200px;
  padding: 16px 20px;
  border-left: 2px solid var(--gold-hui);
  background: rgba(201, 168, 76, 0.04);
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}

.callout.in {
  opacity: 1;
  transform: translateY(0);
}

.callout-label {
  font-size: 12px;
  color: var(--gold-hui-soft);
  letter-spacing: 0.3em;
  margin-bottom: 6px;
}

.callout-text {
  font-size: 15px;
  color: var(--silk-white);
  letter-spacing: 0.1em;
}

.callout-sub {
  font-size: 12px;
  color: var(--silk-white-dim);
  margin-top: 4px;
  letter-spacing: 0.1em;
}

/* ========== 底部指引 ========== */
.bottom-guide {
  position: relative;
  z-index: 5;
  padding: 12px 48px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--silk-white-dim);
  letter-spacing: 0.15em;
}

.guide-keys {
  display: flex;
  gap: 12px;
  align-items: center;
}

.key-cap {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border: 1px solid var(--gold-hui-soft);
  border-radius: 3px;
  font-size: 11px;
  color: var(--gold-hui-soft);
  margin: 0 2px;
}

.guide-hint {
  opacity: 0.7;
}

/* ========== 入场动画：弦板从两端向中央绘制 ========== */
@keyframes stringDrawIn {
  from {
    transform: scaleX(0);
    opacity: 0;
  }
  to {
    transform: scaleX(1);
    opacity: 1;
  }
}

.string-line.drawn {
  animation: stringDrawIn 1.4s cubic-bezier(0.65, 0, 0.35, 1) forwards;
}

/* 徽位依次点亮 */
@keyframes huiLight {
  from {
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
  }
  60% {
    transform: translate(-50%, -50%) scale(1.2);
    opacity: 1;
  }
  to {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
}

.hui.lit {
  animation: huiLight 0.5s ease-out forwards;
}

/* ========== 响应式 ========== */
@media (max-width: 1024px) {
  .top-bar { padding: 18px 32px 8px; }
  .stage { padding: 16px 32px 8px; }
  .string-board { height: 360px; }
  .string-row { left: 100px; right: 30px; }
  .string-label {
    left: -90px;
    font-size: 13px;
    letter-spacing: 0.3em;
  }
  .timeline { margin: 14px 120px 0 120px; }
  .content-panel { margin: 24px 32px 16px; padding: 24px 28px; }
  .era-name { font-size: 28px; }
  .bottom-guide { padding: 10px 32px 24px; }
}

@media (max-width: 768px) {
  .top-bar {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    padding: 16px 20px 8px;
  }
  .top-note { text-align: left; font-size: 11px; }
  .stage { padding: 12px 20px 6px; }
  .string-board {
    height: 320px;
    overflow-x: auto;
  }
  .string-board-inner {
    min-width: 680px;
    height: 100%;
    position: relative;
  }
  .string-row { left: 80px; right: 20px; }
  .string-label {
    left: -70px;
    font-size: 12px;
    letter-spacing: 0.2em;
  }
  .main-title { font-size: 22px; letter-spacing: 0.2em; }
  .main-title::before { display: none; }
  .sub-title { font-size: 12px; letter-spacing: 0.4em; }
  .timeline { margin: 12px 90px 0 90px; }
  .timeline-label { font-size: 10px; }
  .content-panel {
    margin: 20px 20px 12px;
    padding: 20px;
  }
  .era-name { font-size: 22px; letter-spacing: 0.2em; }
  .era-narrative { font-size: 14px; line-height: 1.9; }
  .bottom-guide {
    flex-direction: column;
    gap: 8px;
    padding: 8px 20px 20px;
    text-align: center;
  }
}

@media (max-width: 480px) {
  .string-board { height: 300px; }
  .string-board-inner { min-width: 560px; }
  .string-row { left: 65px; right: 15px; }
  .string-label {
    left: -55px;
    font-size: 11px;
    letter-spacing: 0.15em;
  }
  .hui { width: 8px; height: 8px; }
  .hui.center { width: 11px; height: 11px; }
  .roaming-hui { width: 26px; height: 26px; }
  .timeline { margin: 10px 65px 0 65px; }
  .content-panel { padding: 16px; }
  .era-name { font-size: 18px; }
  .callout-group { flex-direction: column; gap: 12px; }
}

/* ========== prefers-reduced-motion ========== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .string-line.vibrating { animation: none; }
  .ripple { display: none; }
  .roaming-hui::before { animation: none; opacity: 0.5; }
  .era-draw-path::after { animation: none; display: none; }
  .custom-cursor { transition: none; }
}
</style>
</head>
<body>

<!-- 断纹背景 -->
<div class="crackle-bg" id="crackleBg"></div>

<!-- 自定义光标 -->
<div class="custom-cursor" id="cursor">
  <div class="ring"></div>
  <div class="dot"></div>
</div>

<!-- 顶部标题条 -->
<header class="top-bar">
  <div class="title-group">
    <h1 class="main-title">七弦十三徽志</h1>
    <span class="sub-title">古琴文化纪元</span>
  </div>
  <div class="top-note">
    十三徽 · 十三纪元<span class="sep">｜</span>七弦 · 七切面<br>
    击徽以观史 · 拨弦以察器
  </div>
</header>

<!-- 主舞台：弦板 -->
<section class="stage">
  <div class="string-board" id="stringBoard">
    <div class="string-board-inner" id="boardInner">

  const STRINGS = [
    { name: '琴器', anchorEra: 4, desc: '古琴形制与斫琴工艺' },    // 汉

  // ============ 初始化 ============
  function init() {

    // 入场动画：先亮弦，再亮徽，最后落定游徽

  // ============ 构建弦板 ============
  function buildBoard() {
    var boardInner = document.getElementById('boardInner');
    var board = document.getElementById('stringBoard');
    var isMobile = window.innerWidth <= 768;
    var leftPad = isMobile ? window.innerWidth <= 480 ? 65 : 80 : 120;
    var rightPad = isMobile ? window.innerWidth <= 480 ? 15 : 20 : 40;
    var boardHeight = board.offsetHeight;
    var stringCount = STRINGS.length;
    var stringGap = boardHeight / (stringCount + 1);

    // 清除旧内容（保留 ripple container）
    var rippleContainer = document.getElementById('rippleContainer');
    boardInner.innerHTML = '';
    boardInner.appendChild(rippleContainer);

    // 创建 7 根弦
    STRINGS.forEach(function (str, i) {
      var y = stringGap * (i + 1);

      var row = document.createElement('div');
      row.className = 'string-row';
      row.style.top = y + 'px';
      row.setAttribute('data-string-index', i);

      // 弦身
      var line = document.createElement('div');
      line.className = 'string-line';
      line.setAttribute('data-string-line', i);

      // 标签
      var label = document.createElement('div');
      label.className = 'string-label';
      label.textContent = str.name;
      label.setAttribute('data-string-label', i);
      label.addEventListener('click', function (e) {
        e.stopPropagation();
        pluckString(i);
      });
      label.addEventListener('mouseenter', function () { cursorHover(true); });
      label.addEventListener('mouseleave', function () { cursorHover(false); });

      row.appendChild(label);
      row.appendChild(line);
      boardInner.appendChild(row);
    });

    // 创建 13 个徽位（放在每根弦的交叉点，但视觉上主要在弦上体现；
    // 简化：13 徽各一个，位于第 4 弦（中间弦）高度 —— 不，用户要求是二维矩阵
    // 实际上应该是每根弦上都有 13 个徽位，即 7×13=91 个交点
    // 但视觉上徽位在弦上，所以每根弦上都有 13 颗金徽
    // 为避免视觉过密，我们把徽位做在板上，每一列一个徽（13列）
    // 不对，重审需求："7 根丝弦横贯画面，13 颗螺钿金徽按真实古琴分数位置精确嵌布于弦上"
    // 理解：13 个徽位（列）× 7 根弦（行）= 91 个交点。每根弦上有 13 颗徽
    // 但真实古琴上徽位是在琴面上的，一根弦经过所有徽位。
    // 所以应该是：7 条横线（弦），13 列金徽，每列 7 个？不对。
    // 再读："13 徽 = 13 个历史纪元（横轴），7 弦 = 7 个文化切面（纵轴），构成二维矩阵"
    // 结论：视觉上是 7 弦（横线）× 13 徽（纵列标记），交点即节点
    // 金徽出现在每根弦上（即每根弦上有 13 个点），共 91 个点
    // 但这样视觉上太密。合理做法：13 列位置，每列有一个金色徽标贯穿（或只在第一根弦显著位置）
    // 重新理解：古琴上徽是嵌在琴面上的标记点，弦从上方经过。
    // 所以视觉上 13 个徽位（纵列），每列一个圆点（金徽），7 根弦横贯经过这些点。
    // 不对，应该每根弦上都有徽位标记——其实徽是在琴面上，不是在弦上。
    // 最还原的做法：13 个金徽（琴面标记），7 根弦从徽位上方经过。
    // 但需求说"二维矩阵"，意味着每个交点都可点击。
    //
    // 折中方案：13 个金徽（每列一个，位于中间弦或第四弦高度，视觉突出）
    // + 每根弦上的徽位位置有细小光点，点击任何一个都可
    // 这样既还原古琴形制，又实现矩阵交互。
    //
    // 实际上，再读需求："用户点击徽位 → 游徽磁吸落定"
    // "点击左侧某弦的切面标签 → 当前游徽跳转至该切面的标志纪元"
    // 所以交互单元是：横轴 = 纪元（徽位），纵轴 = 切面（弦标签）
    // 游徽是一个在弦板上移动的圆环，标记当前纪元
    // 内容面板显示的是当前纪元 × 切面 的内容
    //
    // 最终理解：13 个金徽（13 列，分布在整个弦板宽度上）
    // 每个徽位是一列，上下贯穿所有弦
    // 游徽是一个圆环，在当前徽位列的位置（可以在任意弦高，或固定在某位置）
    // 简化：徽位是 13 个金色圆点，排列在第 4 弦（中间弦）上，点击切换纪元
    // 弦标签在左侧，点击切换切面 + 跳转到该切面标志纪元

    // 计算有效弦长区域
    var leftOffset = leftPad;
    var rightOffset = isMobile ? window.innerWidth <= 480 ? 15 : 20 : 40;
    var boardWidth = board.offsetWidth;
    var stringStartX = leftOffset;
    var stringEndX = boardWidth - rightOffset;
    var stringLength = stringEndX - stringStartX;

    // 为每根弦创建 13 个徽位（弦上的小光点），第四弦（中间）的徽最大最亮
    STRINGS.forEach(function (str, si) {
      var y = stringGap * (si + 1);
      var isMiddle = si === 3; // 第4弦（0-indexed = 3）

      FRACTIONS.forEach(function (frac, fi) {
        var x = stringStartX + stringLength * frac;
        var hui = document.createElement('div');
        hui.className = 'hui';
        if (isMiddle && fi === 6) hui.classList.add('center'); // 七徽居中最大
        if (!isMiddle) hui.style.opacity = '0.35';
        hui.style.left = x + 'px';
        hui.style.top = y + 'px';
        hui.style.width = isMiddle ? (fi === 6 ? '14px' : '10px') : '6px';
        hui.style.height = isMiddle ? (fi === 6 ? '14px' : '10px') : '6px';
        hui.setAttribute('data-hui-index', fi);
        hui.setAttribute('data-string-index', si);

        var tooltip = document.createElement('div');
        tooltip.className = 'hui-tooltip';
        tooltip.textContent = ERAS[fi].name;
        if (isMiddle) hui.appendChild(tooltip);

        hui.addEventListener('click', function (e) {
          e.stopPropagation();
          selectHui(fi, { animate: true, fromString: si });
        });
        hui.addEventListener('mouseenter', function () { cursorHover(true); });
        hui.addEventListener('mouseleave', function () { cursorHover(false); });

        boardInner.appendChild(hui);
      });
    });

    // 创建游徽
    var roaming = document.createElement('div');
    roaming.className = 'roaming-hui';
    roaming.id = 'roamingHui';
    var numSpan = document.createElement('span');
    numSpan.className = 'hui-num';
    numSpan.textContent = '';
    roaming.appendChild(numSpan);
    boardInner.appendChild(roaming);

    // 初始化游徽位置到中央七徽
    var midY = stringGap * 4; // 第四弦高度
    var midX = stringStartX + stringLength * FRACTIONS[6];
    roamingLeft = midX;
    roamingTop = midY;
    roamingTargetLeft = midX;
    roamingTargetTop = midY;
    roaming.style.left = midX + 'px';
    roaming.style.top = midY + 'px';
  }

  // ============ 构建时间轴 ============
  function buildTimeline() {
    var track = document.getElementById('timelineTrack');
    track.innerHTML = '';

    FRACTIONS.forEach(function (frac, i) {
      var marker = document.createElement('div');
      marker.className = 'timeline-marker';
      marker.style.left = (frac * 100) + '%';
      marker.setAttribute('data-tl-index', i);
      track.appendChild(marker);

      var label = document.createElement('div');
      label.className = 'timeline-label';
      label.style.left = (frac * 100) + '%';
      label.textContent = ERAS[i].name;
      label.setAttribute('data-tl-label', i);
      track.appendChild(label);
    });
  }

  // ============ 入场动画 ============
  function enterStrings() {
    var lines = document.querySelectorAll('[data-string-line]');
    lines.forEach(function (line, i) {
      setTimeout(function () {
        line.classList.add('drawn');
      }, i * 80);
    });
  }

  function enterHuis() {
    var huis = document.querySelectorAll('.hui');
    // 按徽位（列）依次点亮，从中间向两端
    var order = [6, 5, 7, 4, 8, 3, 9, 2, 10, 1, 11, 0, 12];
    order.forEach(function (huiIdx, delayOrder) {
      var huisInCol = document.querySelectorAll('[data-hui-index="' + huiIdx + '"]');
      huisInCol.forEach(function (h) {
        setTimeout(function () {
          h.classList.add('lit');
        }, delayOrder * 60);
      });
    });
  }

  // ============ 选择徽位 ============
  var moveTimeout = null;

  function selectHui(index, opts) {
    opts = opts || {};
    currentHuiIndex = index;

    var boardInner = document.getElementById('boardInner');
    var board = document.getElementById('stringBoard');
    var isMobile = window.innerWidth <= 768;
    var leftPad = isMobile ? window.innerWidth <= 480 ? 65 : 80 : 120;
    var rightPad = isMobile ? window.innerWidth <= 480 ? 15 : 20 : 40;
    var boardHeight = board.offsetHeight;
    var stringGap = boardHeight / (STRINGS.length + 1);

    var stringStartX = leftPad;
    var stringEndX = board.offsetWidth - rightPad;
    var stringLength = stringEndX - stringStartX;

    // 游徽目标位置
    var targetX = stringStartX + stringLength * FRACTIONS[index];
    var targetY;
    if (currentStringIndex >= 0) {
      targetY = stringGap * (currentStringIndex + 1);
    } else if (opts.fromString !== undefined) {
      targetY = stringGap * (opts.fromString + 1);
      currentStringIndex = opts.fromString;
    } else {
      targetY = stringGap * 4; // 默认第四弦
    }

    roamingTargetLeft = targetX;
    roamingTargetTop = targetY;

    // 更新游徽序号
    var numEl = document.querySelector('.roaming-hui .hui-num');
    if (numEl) numEl.textContent = (index + 1);

    // 泛音涟漪
    if (!reducedMotion && !opts.initial) {
      createRipple(targetX, targetY);
    }

    // 时间轴同步
    updateTimeline(index);

    // 切面标签高亮
    updateStringLabels();

    // 内容面板更新（微延迟等待磁吸动画开始）
    if (opts.initial) {
      setTimeout(updateContent, 300);
    } else {
      setTimeout(updateContent, 150);
    }
  }

  // ============ 拨弦 ============
  function pluckString(strIndex) {
    var str = STRINGS[strIndex];
    currentStringIndex = strIndex;

    // 弦振动
    var line = document.querySelector('[data-string-line="' + strIndex + '"]');
    if (line && !reducedMotion) {
      line.classList.remove('vibrating');
      // 强制 reflow 重启动画
      void line.offsetWidth;
      line.classList.add('vibrating');
      // 2 秒后停止
      clearTimeout(pluckString._stopTimer);
      pluckString._stopTimer = setTimeout(function () {
        line.classList.remove('vibrating');
      }, 2000);
    }

    // 跳转到标志纪元
    selectHui(str.anchorEra, { animate: true, fromString: strIndex });
  }

  // ============ 更新时间轴 ============
  function updateTimeline(index) {
    var markers = document.querySelectorAll('.timeline-marker');
    var labels = document.querySelectorAll('.timeline-label');
    markers.forEach(function (m, i) {
      m.classList.toggle('active', i === index);
    });
    labels.forEach(function (l, i) {
      l.classList.toggle('active', i === index);
    });
  }

  // ============ 更新弦标签状态 ============
  function updateStringLabels() {
    var labels = document.querySelectorAll('.string-label');
    labels.forEach(function (l, i) {
      l.classList.toggle('active', i === currentStringIndex);
    });
  }

  // ============ 更新内容面板 ============
  function updateContent() {
    var era = ERAS[currentHuiIndex];
    var panel = document.getElementById('contentPanel');
    var eraNameEl = document.getElementById('eraName');
    var eraYearEl = document.getElementById('eraYear');
    var narrativeEl = document.getElementById('eraNarrative');
    var calloutGroup = document.getElementById('calloutGroup');
    var sectionTag = document.getElementById('sectionTag');

    // 淡出
    panel.classList.remove('visible');

    setTimeout(function () {
      // 标题（笔锋绘入效果）
      eraNameEl.innerHTML = '<span class="era-draw-path">' + era.name + '</span>';

      // 年份数字翻入
      eraYearEl.innerHTML = '';
      var yearText = era.year;
      for (var i = 0; i < yearText.length; i++) {
        var span = document.createElement('span');
        span.className = 'num';
        span.textContent = yearText[i] === ' ' ? '\u00A0' : yearText[i];
        eraYearEl.appendChild(span);
      }

      // 切面标签
      if (currentStringIndex >= 0) {
        sectionTag.textContent = '弦' + (currentStringIndex + 1) + ' · ' + STRINGS[currentStringIndex].name;
        sectionTag.classList.add('visible');
      } else {
        sectionTag.classList.remove('visible');
      }

      // 叙述（含高亮）
      var narrativeHTML = era.narrative;
      if (era.highlight && currentStringIndex >= 0) {
        era.highlight.forEach(function (word) {
          var escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          narrativeHTML = narrativeHTML.replace(
            new RegExp(escaped, 'g'),
            '<span class="highlight">' + word + '</span>'
          );
        });
      }
      narrativeEl.innerHTML = narrativeHTML;

      // Callouts
      calloutGroup.innerHTML = '';
      era.callouts.forEach(function (c, ci) {
        var callout = document.createElement('div');
        callout.className = 'callout';
        callout.innerHTML =
          '<div class="callout-label">' + c.label + '</div>' +
          '<div class="callout-text">' + c.text + '</div>' +
          (c.sub ? '<div class="callout-sub">' + c.sub + '</div>' : '');
        calloutGroup.appendChild(callout);

        setTimeout(function () {
          callout.classList.add('in');
        }, 150 + ci * 120);
      });

      // 淡入
      panel.classList.add('visible');

      // 年份数字依次翻入
      var numSpans = eraYearEl.querySelectorAll('.num');
      numSpans.forEach(function (s, i) {
        setTimeout(function () { s.classList.add('in'); }, 200 + i * 25);
      });
    }, 200);
  }

  // ============ 泛音涟漪 ============
  function createRipple(x, y) {
    if (reducedMotion) return;
    var container = document.getElementById('rippleContainer');
    var ringCount = 4;
    var maxSize = 180;

    for (var i = 0; i < ringCount; i++) {
      (function (idx) {
        setTimeout(function () {
          var ripple = document.createElement('div');
          ripple.className = 'ripple';
          ripple.style.left = x + 'px';
          ripple.style.top = y + 'px';
          ripple.style.width = maxSize + 'px';
          ripple.style.height = maxSize + 'px';
          ripple.style.animation = 'rippleExpand ' + (1.2 + idx * 0.2) + 's ease-out forwards';
          ripple.style.animationDelay = '0s';
          container.appendChild(ripple);

          setTimeout(function () {
            if (ripple.parentNode) ripple.parentNode.removeChild(ripple);
          }, 1800 + idx * 200);
        }, idx * 180);
      })(i);
    }
  }

  // ============ 光标 ============
  function cursorHover(isHover) {
    var cursor = document.getElementById('cursor');
    if (isHover) {
      cursor.classList.add('is-hover');
    } else {
      cursor.classList.remove('is-hover');
    }
  }

  // ============ 动画主循环 ============
  function startAnimationLoop() {
    if (rafId) return;

    function tick() {
      if (document.hidden) {
        rafId = null;
        return;
      }

      // 自定义光标：平滑跟随（轻微拖尾）
      var cursor = document.getElementById('cursor');
      if (cursor && cursor.style.display !== 'none') {
        cursorX += (cursorTargetX - cursorX) * 0.25;
        cursorY += (cursorTargetY - cursorY) * 0.25;
        cursor.style.transform = 'translate(' + cursorX + 'px, ' + cursorY + 'px) translate(-50%, -50%)';
      }

      // 游徽磁吸（弹簧阻尼）
      var roaming = document.getElementById('roamingHui');
      if (roaming) {
        roamingLeft += (roamingTargetLeft - roamingLeft) * 0.12;
        roamingTop += (roamingTargetTop - roamingTop) * 0.12;
        roaming.style.left = roamingLeft + 'px';
        roaming.style.top = roamingTop + 'px';
      }

      rafId = requestAnimationFrame(tick);
    }

    rafId = requestAnimationFrame(tick);
  }

  function stopAnimationLoop() {
    if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  }

  // ============ 事件绑定 ============
  function bindEvents() {
    // 鼠标移动 — 直接操作 style
    document.addEventListener('mousemove', function (e) {
      cursorTargetX = e.clientX;
      cursorTargetY = e.clientY;

      // 断纹随光标微微反光位移
      var crackle = document.getElementById('crackleBg');
      if (crackle && !reducedMotion) {
        var dx = (e.clientX / window.innerWidth - 0.5) * 6;
        crackle.style.backgroundPosition = dx + 'px 0, ' + (-dx) + 'px 0, 0 0';
      }

      // 弦板上的断纹也微动
      var board = document.getElementById('stringBoard');
      if (board && !reducedMotion) {
        var bdx = (e.clientX / window.innerWidth - 0.5) * 4;
        board.style.setProperty('--crackle-offset', bdx + 'px');
      }
    });

    // 可交互元素悬停光标状态
    var interactives = '.hui, .string-label, .callout, .key-cap';
    document.querySelectorAll(interactives).forEach(function (el) {
      el.addEventListener('mouseenter', function () { cursorHover(true); });
      el.addEventListener('mouseleave', function () { cursorHover(false); });
    });

    // 键盘导航
    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        if (currentHuiIndex > 0) {
          selectHui(currentHuiIndex - 1, { animate: true });
        }
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        if (currentHuiIndex < FRACTIONS.length - 1) {
          selectHui(currentHuiIndex + 1, { animate: true });
        }
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (currentStringIndex > 0) {
          pluckString(currentStringIndex - 1);
        }
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (currentStringIndex < STRINGS.length - 1) {
          pluckString(currentStringIndex + 1);
        }
      }
    });

    // 页面可见性变化
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        stopAnimationLoop();
      } else {
        startAnimationLoop();
      }
    });

    // 页面卸载 — 清理
    window.addEventListener('pagehide', function () {
      stopAnimationLoop();
    });
    window.addEventListener('beforeunload', function () {
      stopAnimationLoop();
    });

    // 窗口 resize — 重新布局
    var resizeTimer = null;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        rebuildAll();
      }, 150);
    });

    // 触屏设备显示系统光标
    if ('ontouchstart' in window) {
      var cursor = document.getElementById('cursor');
      if (cursor) cursor.style.display = 'none';
      document.body.style.cursor = 'auto';
    }
  }

  // ============ 重建（响应式） ============
  function rebuildAll() {
    var prevIndex = currentHuiIndex;
    var prevString = currentStringIndex;

    buildBoard();
    buildTimeline();
    updateTimeline(prevIndex);
    updateStringLabels();

    // 重设游徽目标位置
    var board = document.getElementById('stringBoard');
    var boardInner = document.getElementById('boardInner');
    var isMobile = window.innerWidth <= 768;
    var leftPad = isMobile ? window.innerWidth <= 480 ? 65 : 80 : 120;
    var rightPad = isMobile ? window.innerWidth <= 480 ? 15 : 20 : 40;
    var boardHeight = board.offsetHeight;
    var stringGap = boardHeight / (STRINGS.length + 1);
    var stringStartX = leftPad;
    var stringEndX = board.offsetWidth - rightPad;
    var stringLength = stringEndX - stringStartX;

    var targetX = stringStartX + stringLength * FRACTIONS[prevIndex];
    var targetY = prevString >= 0
      ? stringGap * (prevString + 1)
      : stringGap * 4;

    roamingLeft = targetX;
    roamingTop = targetY;
    roamingTargetLeft = targetX;
    roamingTargetTop = targetY;

    var roaming = document.getElementById('roamingHui');
    if (roaming) {
      roaming.style.left = targetX + 'px';
      roaming.style.top = targetY + 'px';
      var numEl = roaming.querySelector('.hui-num');
      if (numEl) numEl.textContent = (prevIndex + 1);
    }

    // 重新绑定可交互元素的悬停
    document.querySelectorAll('.hui, .string-label').forEach(function (el) {
      el.addEventListener('mouseenter', function () { cursorHover(true); });
      el.addEventListener('mouseleave', function () { cursorHover(false); });
    });
  }

  // ============ 启动 ============
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="creative-medium" content="interactive-prototype">
<title>茶马古道 · 马帮驿站图鉴</title>
<style>
  /* ===== CSS Variables ===== */
  :root {
    --ochre: #A0522D;
    --ochre-light: #C97B52;
    --ochre-dark: #7A3E22;
    --tea-brown: #6B4423;
    --tea-brown-dark: #4A2E18;
    --pine-smoke: #3A4A3A;
    --pine-smoke-light: #556B55;
    --pine-deep: #243024;
    --mist-gray: #C8B89A;
    --mist-light: #DBCDBA;
    --rice-paper: #EDE3D0;
    --rice-warm: #F5EDDC;
    --ink: #2A1F14;
    --ink-soft: #4A3B2A;

    --trail-width: 6400px;
    --stage-h: 620px;
    --trail-y: 58%;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
    color: var(--ink);
    background: var(--rice-paper);
    cursor: none;
  }

  @media (prefers-reduced-motion: reduce) {
    html, body { cursor: auto; }
    #custom-cursor, .cursor-trail { display: none !important; }
  }

  /* ===== Paper Texture Background ===== */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(160,82,45,0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(107,68,35,0.05) 0%, transparent 50%),
      var(--rice-paper);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.42 0 0 0 0 0.27 0 0 0 0 0.14 0 0 0 0.06 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
    mix-blend-mode: multiply;
  }

  /* ===== Custom Cursor ===== */
  #custom-cursor {
    position: fixed;
    top: 0;
    left: 0;
    width: 20px;
    height: 20px;
    border: 2px solid var(--ochre);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.2s ease, height 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    mix-blend-mode: difference;
  }
  #custom-cursor.hover {
    width: 44px;
    height: 44px;
    border-color: var(--ochre-light);
    background: rgba(160, 82, 45, 0.15);
  }
  #custom-cursor.clicking {
    width: 14px;
    height: 14px;
    background: var(--ochre);
  }
  .cursor-trail {
    position: fixed;
    top: 0;
    left: 0;
    width: 6px;
    height: 6px;
    background: var(--ochre-light);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    opacity: 0.5;
    transition: opacity 0.3s ease;
  }

  /* ===== Ripple effect ===== */
  .ripple {
    position: fixed;
    border: 2px solid var(--ochre);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9997;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
    animation: rippleExpand 0.7s ease-out forwards;
  }
  @keyframes rippleExpand {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0.8; border-width: 3px; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0; border-width: 1px; }
  }

  /* ===== Title / Header ===== */
  .page-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding: 20px 32px 12px;
    background: linear-gradient(to bottom, var(--rice-paper) 0%, rgba(237,227,208,0.8) 70%, rgba(237,227,208,0) 100%);
    pointer-events: none;
  }
  .page-header-inner {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    max-width: 100%;
  }
  .page-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--tea-brown-dark);
    letter-spacing: 4px;
  }
  .page-title em {
    font-style: normal;
    color: var(--ochre);
    font-size: 14px;
    margin-left: 12px;
    letter-spacing: 2px;
    font-weight: 400;
  }
  .page-subtitle {
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 3px;
    margin-top: 4px;
    opacity: 0.7;
  }

  /* ===== Mileage Ruler ===== */
  .mileage-ruler {
    position: fixed;
    top: 90px;
    left: 32px;
    right: 32px;
    height: 28px;
    z-index: 90;
    pointer-events: none;
  }
  .ruler-track {
    position: relative;
    height: 1px;
    background: var(--mist-gray);
    top: 50%;
  }
  .ruler-track::before,
  .ruler-track::after {
    content: "";
    position: absolute;
    top: -3px;
    width: 1px;
    height: 7px;
    background: var(--tea-brown);
  }
  .ruler-track::before { left: 0; }
  .ruler-track::after { right: 0; }
  .ruler-marks {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: space-between;
    top: 50%;
  }
  .ruler-mark {
    position: relative;
    height: 1px;
    width: 1px;
  }
  .ruler-mark::before {
    content: "";
    position: absolute;
    left: 0;
    top: -2px;
    width: 1px;
    height: 5px;
    background: var(--mist-gray);
  }
  .ruler-mark.major::before {
    top: -4px;
    height: 9px;
    background: var(--tea-brown);
  }
  .ruler-mark span {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: var(--ink-soft);
    white-space: nowrap;
    letter-spacing: 1px;
    opacity: 0.6;
  }
  .ruler-cursor {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    left: 0;
    width: 12px;
    height: 12px;
    z-index: 2;
  }
  .ruler-cursor::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--ochre);
    border-radius: 50%;
    box-shadow: 0 0 0 3px rgba(160, 82, 45, 0.2);
    animation: rulerPulse 2s ease-in-out infinite;
  }
  @keyframes rulerPulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(160,82,45,0.2); }
    50% { box-shadow: 0 0 0 7px rgba(160,82,45,0.05); }
  }
  .ruler-cursor span {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 600;
    color: var(--ochre);
    white-space: nowrap;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }

  /* ===== Stage / Horizontal Scroll ===== */
  .stage-wrap {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow-x: auto;
    overflow-y: hidden;
    z-index: 1;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    cursor: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .stage-wrap { cursor: auto; }
  }
  .stage-wrap::-webkit-scrollbar {
    height: 6px;
  }
  .stage-wrap::-webkit-scrollbar-track {
    background: var(--mist-light);
  }
  .stage-wrap::-webkit-scrollbar-thumb {
    background: var(--ochre);
    border-radius: 3px;
  }

  .stage {
    position: relative;
    width: var(--trail-width);
    height: 100vh;
    min-height: 700px;
  }

  /* ===== SVG Layers ===== */
  .mountain-svg {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--trail-width);
    height: 100%;
    pointer-events: none;
  }
  .layer-far { z-index: 5; opacity: 0.35; }
  .layer-mid { z-index: 6; opacity: 0.55; }
  .layer-near { z-index: 7; opacity: 0.75; }
  .layer-trail { z-index: 8; }
  .layer-mist { z-index: 9; pointer-events: none; }

  /* Mist drifts */
  .mist-drift {
    animation: mistDrift 20s ease-in-out infinite alternate;
  }
  .mist-drift-2 {
    animation: mistDrift2 25s ease-in-out infinite alternate;
  }
  @keyframes mistDrift {
    0% { transform: translateX(0); }
    100% { transform: translateX(30px); }
  }
  @keyframes mistDrift2 {
    0% { transform: translateX(0); }
    100% { transform: translateX(-40px); }
  }

  /* Trail breathing */
  .trail-path {
    stroke-dasharray: 6 8;
    animation: trailBreath 4s ease-in-out infinite;
  }
  @keyframes trailBreath {
    0%, 100% { stroke-dashoffset: 0; }
    50% { stroke-dashoffset: 14; }
  }

  /* ===== Station Nodes ===== */
  .stations-layer {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--trail-width);
    height: 100%;
    z-index: 20;
    pointer-events: none;
  }
  .station-node {
    position: absolute;
    transform: translate(-50%, -50%);
    pointer-events: auto;
    cursor: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .station-node { cursor: pointer; }
  }
  .station-dot {
    width: 20px;
    height: 20px;
    background: var(--ochre);
    border-radius: 50%;
    position: relative;
    box-shadow: 0 0 0 4px rgba(160, 82, 45, 0.2);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .station-dot::before {
    content: "";
    position: absolute;
    inset: -10px;
    border: 1px solid var(--ochre);
    border-radius: 50%;
    opacity: 0;
    animation: stationPulse 2.5s ease-out infinite;
  }
  @keyframes stationPulse {
    0% { transform: scale(0.8); opacity: 0.8; }
    100% { transform: scale(2); opacity: 0; }
  }
  .station-node.near .station-dot {
    transform: scale(1.35);
    box-shadow: 0 0 0 8px rgba(160, 82, 45, 0.15), 0 0 20px rgba(160, 82, 45, 0.4);
  }
  .station-node.near .station-dot::before {
    animation-duration: 1.5s;
  }
  .station-label {
    position: absolute;
    top: -44px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    text-align: center;
  }
  .station-label .name {
    font-size: 15px;
    font-weight: 700;
    color: var(--tea-brown-dark);
    letter-spacing: 2px;
  }
  .station-label .tag {
    font-size: 11px;
    color: var(--ochre);
    letter-spacing: 1.5px;
    margin-top: 2px;
    opacity: 0.8;
  }
  .station-node.near .station-label .name {
    color: var(--ochre-dark);
  }
  .station-mile {
    position: absolute;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 1px;
    opacity: 0.6;
    white-space: nowrap;
  }

  /* ===== Caravan ===== */
  .caravan {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 30;
    pointer-events: none;
    transform: translate(-50%, -50%);
    will-change: transform;
  }
  .caravan-svg {
    width: 90px;
    height: 60px;
    overflow: visible;
  }
  .horse-body { transition: transform 0.15s ease; }
  .caravan.walking .horse-bob-1 { animation: horseBob 0.6s ease-in-out infinite; }
  .caravan.walking .horse-bob-2 { animation: horseBob 0.6s ease-in-out 0.3s infinite; }
  .caravan.walking .horse-bob-3 { animation: horseBob 0.6s ease-in-out 0.15s infinite; }
  @keyframes horseBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
  }
  .caravan-shadow {
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 6px;
    background: radial-gradient(ellipse, rgba(42,31,20,0.25) 0%, transparent 70%);
    border-radius: 50%;
  }

  /* ===== Danger sections ===== */
  .danger-section {
    position: absolute;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 15;
    text-align: center;
  }
  .danger-icon {
    width: 32px;
    height: 32px;
    margin: 0 auto 4px;
    opacity: 0.7;
    animation: dangerBlink 2s ease-in-out infinite;
  }
  @keyframes dangerBlink {
    0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 2px rgba(160,82,45,0.3)); }
    50% { opacity: 0.9; filter: drop-shadow(0 0 8px rgba(160,82,45,0.6)); }
  }
  .danger-label {
    font-size: 10px;
    color: var(--ochre-dark);
    letter-spacing: 1px;
    writing-mode: vertical-rl;
    margin: 0 auto;
    opacity: 0.8;
  }

  /* ===== Detail Panel ===== */
  .detail-overlay {
    position: fixed;
    top: 0;
    right: 0;
    width: 420px;
    max-width: 90vw;
    height: 100vh;
    background: rgba(237, 227, 208, 0.97);
    backdrop-filter: blur(10px);
    z-index: 500;
    transform: translateX(100%);
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-left: 1px solid var(--mist-gray);
    box-shadow: -8px 0 30px rgba(42, 31, 20, 0.1);
    cursor: none;
    overflow-y: auto;
  }
  @media (prefers-reduced-motion: reduce) {
    .detail-overlay { cursor: auto; }
  }
  .detail-overlay.open {
    transform: translateX(0);
  }
  .detail-close {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 36px;
    height: 36px;
    border: 1px solid var(--mist-gray);
    border-radius: 50%;
    background: transparent;
    cursor: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    font-size: 18px;
    transition: all 0.3s ease;
    z-index: 10;
  }
  @media (prefers-reduced-motion: reduce) {
    .detail-close { cursor: pointer; }
  }
  .detail-close:hover {
    background: var(--ochre);
    color: var(--rice-paper);
    border-color: var(--ochre);
  }
  .detail-content {
    padding: 60px 36px 40px;
  }
  .detail-header {
    border-bottom: 1px solid var(--mist-gray);
    padding-bottom: 20px;
    margin-bottom: 24px;
  }
  .detail-station-num {
    font-size: 11px;
    color: var(--ochre);
    letter-spacing: 3px;
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
  }
  .detail-station-name {
    font-size: 32px;
    font-weight: 700;
    color: var(--tea-brown-dark);
    letter-spacing: 4px;
    margin-bottom: 6px;
  }
  .detail-station-sub {
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 2px;
  }
  .detail-mileage {
    display: flex;
    gap: 16px;
    margin-top: 16px;
  }
  .detail-mileage div {
    flex: 1;
    padding: 10px 12px;
    background: var(--rice-warm);
    border: 1px solid var(--mist-gray);
    border-radius: 4px;
  }
  .detail-mileage .label {
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 1.5px;
    opacity: 0.7;
    margin-bottom: 4px;
  }
  .detail-mileage .value {
    font-size: 18px;
    font-weight: 600;
    color: var(--ochre-dark);
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }
  .detail-mileage .value small {
    font-size: 11px;
    font-weight: 400;
    color: var(--ink-soft);
    margin-left: 2px;
  }

  .detail-section {
    margin-bottom: 24px;
  }
  .detail-section-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--tea-brown);
    letter-spacing: 3px;
    margin-bottom: 12px;
    padding-left: 12px;
    border-left: 3px solid var(--ochre);
  }
  .caravan-scale-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .scale-item {
    text-align: center;
    padding: 12px 6px;
    background: var(--rice-warm);
    border: 1px solid var(--mist-light);
    border-radius: 4px;
  }
  .scale-item .num {
    font-size: 20px;
    font-weight: 700;
    color: var(--ochre-dark);
    font-variant-numeric: tabular-nums;
  }
  .scale-item .unit {
    font-size: 10px;
    color: var(--ink-soft);
    margin-top: 2px;
    letter-spacing: 1px;
  }

  .goods-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .goods-tag {
    padding: 6px 14px;
    background: var(--rice-warm);
    border: 1px solid var(--mist-gray);
    border-radius: 20px;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 1px;
    transition: all 0.3s ease;
  }
  .goods-tag:hover {
    background: var(--ochre);
    color: var(--rice-paper);
    border-color: var(--ochre);
  }

  .inn-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--tea-brown-dark);
    margin-bottom: 6px;
    letter-spacing: 2px;
  }
  .inn-desc {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.8;
    letter-spacing: 0.5px;
  }

  .danger-box {
    padding: 14px 16px;
    background: rgba(160, 82, 45, 0.08);
    border: 1px solid rgba(160, 82, 45, 0.3);
    border-radius: 4px;
    border-left: 4px solid var(--ochre);
  }
  .danger-box .danger-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--ochre-dark);
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .danger-box .danger-desc {
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.7;
  }

  .diary-box {
    padding: 18px 20px;
    background: var(--rice-warm);
    border: 1px solid var(--mist-gray);
    border-radius: 4px;
    position: relative;
    font-style: italic;
  }
  .diary-box::before,
  .diary-box::after {
    content: """;
    position: absolute;
    font-size: 48px;
    color: var(--ochre);
    opacity: 0.2;
    font-family: Georgia, serif;
    font-style: normal;
  }
  .diary-box::before {
    top: 0px;
    left: 8px;
    content: "\201C";
  }
  .diary-box::after {
    bottom: -20px;
    right: 12px;
    content: "\201D";
  }
  .diary-text {
    font-size: 13px;
    color: var(--ink);
    line-height: 2;
    letter-spacing: 0.5px;
    text-indent: 2em;
  }
  .diary-author {
    text-align: right;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 10px;
    font-style: normal;
    letter-spacing: 1px;
    opacity: 0.7;
  }

  /* ===== Scroll hint ===== */
  .scroll-hint {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--ink-soft);
    font-size: 12px;
    letter-spacing: 3px;
    opacity: 0.7;
    pointer-events: none;
    animation: hintFade 2s ease-in-out infinite alternate;
  }
  @keyframes hintFade {
    0% { opacity: 0.4; }
    100% { opacity: 0.85; }
  }
  .scroll-hint .arrow {
    width: 24px;
    height: 1px;
    background: var(--ochre);
    position: relative;
  }
  .scroll-hint .arrow::after {
    content: "";
    position: absolute;
    right: 0;
    top: -3px;
    width: 8px;
    height: 8px;
    border-top: 1px solid var(--ochre);
    border-right: 1px solid var(--ochre);
    transform: rotate(45deg);
  }
  .scroll-hint .arrow.left {
    transform: rotate(180deg);
  }

  /* ===== Intro screen ===== */
  .intro-screen {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: var(--rice-paper);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.8s ease, visibility 0.8s ease;
    cursor: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .intro-screen { cursor: auto; }
  }
  .intro-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .intro-seal {
    width: 80px;
    height: 80px;
    background: var(--ochre);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--rice-paper);
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 40px;
    animation: sealAppear 1s ease-out;
    box-shadow: 0 4px 20px rgba(160, 82, 45, 0.3);
  }
  @keyframes sealAppear {
    0% { transform: scale(0) rotate(-10deg); opacity: 0; }
    70% { transform: scale(1.1) rotate(2deg); }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  .intro-title {
    font-size: 48px;
    font-weight: 700;
    color: var(--tea-brown-dark);
    letter-spacing: 16px;
    margin-bottom: 16px;

      innDesc: '原为清军驻防营寨，后改为驿馆。寨墙高厚，四角有碉楼，可避匪患。巴塘产苹果与核桃，马帮常在此补充鲜果。',
      danger: '澜沧江峡谷，两岸绝壁千仞，溜索渡江为唯一通路。人马货物皆悬于溜索，凭一根竹索滑过江面。失手坠落者尸骨无存。',
      dangerLevel: 'high',
      diary: '至巴塘，休整三日。闻前路澜沧江溜索甚险，已有数人堕江。马锅头决定将货物分两批过江，人货分批以保安全。余先随索夫探路，立崖边望对岸，江声如雷，两股战栗。'
    },
    {
      id: 'qamdo',
      name: '昌都',
      subtitle: '茶马交会',
      mile: 1450,
      mileIndex: 1450,
      caravan: { horses: 18, people: 5, days: 62 },
      goods: ['金尖茶', '茯砖茶', '珠宝', '藏香', '皮毛', '药材'],
      inn: '昌都会馆',
      innDesc: '滇藏与川藏两路马帮在此会合，会馆规模宏大，分云南院、四川院、藏商院三进。院内有交易所，每日茶市交易甚盛。',
      danger: '念青唐古拉山余脉，山高路险，且多藏北羌塘游牧部落出没。马队需结伴而行，单身商旅有被劫之虞。',
      dangerLevel: 'medium',
      diary: '抵昌都，恰遇云南马帮亦至。两路马帮各数十人，聚于会馆茶市。川茶滇茶各有买家，以茶易马、易麝香、易鹿茸。余购得藏香百支，欲带往拉萨供大昭寺。'
    },
    {
      id: 'lhasa',
      name: '拉萨',
      subtitle: '圣城终点',
      mile: 1800,
      mileIndex: 1800,
      caravan: { horses: 16, people: 5, days: 78 },
      goods: ['上等砖茶', '金尖茶', '丝绸锦缎', '瓷器玉器', '铜佛造像', '汉地药材'],
      inn: '拉萨驮帮会馆',
      innDesc: '位于大昭寺东侧，是川藏马帮的终点。会馆有三层，顶楼可供瞻望布达拉宫。马帮抵达此日，会馆必设宴款待，众兄弟酩酊大醉，一洗七十余日风尘。',
      danger: '终点已至。唯入城需经关卡查验，茶税繁重，多有偷运私茶者。',
      dangerLevel: 'low',
      diary: '历七十八日，行一千八百里，终至圣城拉萨。遥见布达拉宫金顶熠熠生辉，众皆跪拜流泪。马匹瘦骨嶙峋，人亦黧黑憔悴。卸茶于大昭寺前，藏民争先购买，皆呼"汉地茶好"。此行艰险，唯茶味不变也。'
    }
  ];

  // Danger sections between stations
  const dangers = [
    { id: 'erlang', name: '二郎山', xRatio: 0.12, yOffset: -30, type: 'mountain' },
    { id: 'dadu', name: '大渡河', xRatio: 0.178, yOffset: -20, type: 'river' },
    { id: 'zhedou', name: '折多山', xRatio: 0.32, yOffset: -35, type: 'pass' },
    { id: 'haizi', name: '海子山', xRatio: 0.5, yOffset: -30, type: 'mountain' },
    { id: 'lancang', name: '澜沧江', xRatio: 0.61, yOffset: -25, type: 'river' },
    { id: 'nianqing', name: '念青唐古拉', xRatio: 0.82, yOffset: -35, type: 'pass' }
  ];

  // ===== DOM References =====
  const stageWrap = document.getElementById('stageWrap');
  const stage = document.getElementById('stage');
  const stationsLayer = document.getElementById('stationsLayer');
  const dangerLayer = document.getElementById('dangerLayer');
  const caravan = document.getElementById('caravan');
  const trailPath = document.getElementById('trailPath');
  const detailOverlay = document.getElementById('detailOverlay');
  const detailContent = document.getElementById('detailContent');
  const detailClose = document.getElementById('detailClose');
  const introScreen = document.getElementById('introScreen');
  const enterBtn = document.getElementById('enterBtn');
  const scrollHint = document.getElementById('scrollHint');
  const cursor = document.getElementById('custom-cursor');
  const rulerCursor = document.getElementById('rulerCursor');
  const rulerValue = document.getElementById('rulerValue');
  const rulerMarks = document.getElementById('rulerMarks');

  const isMobile = window.innerWidth <= 768;
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ===== Custom Cursor =====
  let cursorX = window.innerWidth / 2;
  let cursorY = window.innerHeight / 2;
  let targetCursorX = cursorX;
  let targetCursorY = cursorY;
  let cursorTrailDots = [];
  const TRAIL_COUNT = 5;
  let trailPositions = Array(TRAIL_COUNT).fill({ x: cursorX, y: cursorY });

  if (!prefersReducedMotion) {
    // Create trail dots
    for (let i = 0; i < TRAIL_COUNT; i++) {
      const dot = document.createElement('div');
      dot.className = 'cursor-trail';
      dot.style.opacity = (0.5 - i * 0.08).toString();
      dot.style.transform = `translate(-50%, -50%) scale(${1 - i * 0.12})`;
      document.body.appendChild(dot);
      cursorTrailDots.push(dot);
    }

    document.addEventListener('pointermove', function(e) {
      targetCursorX = e.clientX;
      targetCursorY = e.clientY;
    }, { passive: true });

    document.addEventListener('mousedown', function() {
      cursor.classList.add('clicking');
      // Create ripple
      const ripple = document.createElement('div');
      ripple.className = 'ripple';
      ripple.style.left = targetCursorX + 'px';
      ripple.style.top = targetCursorY + 'px';
      ripple.style.width = '60px';
      ripple.style.height = '60px';
      document.body.appendChild(ripple);
      setTimeout(function() { ripple.remove(); }, 700);
    });

    document.addEventListener('mouseup', function() {
      cursor.classList.remove('clicking');
    });

    // Hover detection
    document.addEventListener('mouseover', function(e) {
      const target = e.target;
      if (target.closest && target.closest('button, .station-node, .goods-tag, .detail-close, .intro-btn')) {
        cursor.classList.add('hover');
      }
    });
    document.addEventListener('mouseout', function(e) {
      const target = e.target;
      if (target.closest && target.closest('button, .station-node, .goods-tag, .detail-close, .intro-btn')) {
        cursor.classList.remove('hover');
      }
    });
  }

  // ===== Ruler Marks =====
  function buildRuler() {
    const marks = [];
    for (let i = 0; i <= 9; i++) {
      const mile = i * 200;
      const mark = document.createElement('div');
      mark.className = 'ruler-mark major';
      mark.style.left = (i * 11.11) + '%';
      mark.innerHTML = '<span>' + mile + ' 里</span>';
      rulerMarks.appendChild(mark);
    }
  }
  buildRuler();

  // ===== Build Station Nodes =====
  function buildStations() {
    const trailLength = trailPath.getTotalLength();

    stations.forEach(function(station, idx) {
      const progress = station.mile / 1800;
      const point = trailPath.getPointAtLength(trailLength * progress);

      const node = document.createElement('div');
      node.className = 'station-node';
      node.dataset.id = station.id;
      node.dataset.index = idx;
      node.style.left = point.x + 'px';
      node.style.top = (point.y - 30) + 'px';

      node.innerHTML =
        '<div class="station-label">' +
          '<div class="name">' + station.name + '</div>' +
          '<div class="tag">' + station.subtitle + '</div>' +
        '</div>' +
        '<div class="station-dot"></div>' +
        '<div class="station-mile">' + station.mile + ' 里</div>';

      node.addEventListener('click', function() {
        openDetail(idx);
      });

      stationsLayer.appendChild(node);
    });
  }

  // ===== Build Danger Sections =====
  function buildDangers() {
    const trailLength = trailPath.getTotalLength();

    dangers.forEach(function(danger) {
      const point = trailPath.getPointAtLength(trailLength * danger.xRatio);

      const el = document.createElement('div');
      el.className = 'danger-section';
      el.style.left = point.x + 'px';
      el.style.top = (point.y + danger.yOffset) + 'px';

      let iconSvg = '';
      if (danger.type === 'river') {
        iconSvg = '<svg viewBox="0 0 32 32" fill="none" stroke="#A0522D" stroke-width="1.5" stroke-linecap="round">' +
          '<path d="M6,14 Q10,10 16,14 T26,14"/>' +
          '<path d="M6,18 Q10,14 16,18 T26,18"/>' +
          '<path d="M6,22 Q10,18 16,22 T26,22"/>' +
          '</svg>';
      } else if (danger.type === 'mountain' || danger.type === 'pass') {
        iconSvg = '<svg viewBox="0 0 32 32" fill="none" stroke="#A0522D" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">' +
          '<path d="M4,24 L12,10 L18,18 L22,13 L28,24 Z"/>' +
          '<path d="M10,24 L12,20 L14,24" fill="#A0522D" opacity="0.3"/>' +
          '</svg>';
      }

      el.innerHTML =
        '<div class="danger-icon">' + iconSvg + '</div>' +
        '<div class="danger-label">' + danger.name + '</div>';

      dangerLayer.appendChild(el);
    });
  }

  // ===== Detail Panel =====
  function openDetail(index) {
    const s = stations[index];
    detailContent.innerHTML =
      '<div class="detail-header">' +
        '<div class="detail-station-num">第 ' + (index + 1) + ' 站 · ' + s.mile + ' 里处</div>' +
        '<div class="detail-station-name">' + s.name + '</div>' +
        '<div class="detail-station-sub">' + s.subtitle + '</div>' +
        '<div class="detail-mileage">' +
          '<div><div class="label">已行</div><div class="value">' + s.mile + '<small>里</small></div></div>' +
          '<div><div class="label">已走</div><div class="value">' + s.caravan.days + '<small>天</small></div></div>' +
          '<div><div class="label">马队</div><div class="value">' + s.caravan.horses + '<small>匹</small></div></div>' +
        '</div>' +
      '</div>' +

      '<div class="detail-section">' +
        '<div class="detail-section-title">马帮规模</div>' +
        '<div class="caravan-scale-list">' +
          '<div class="scale-item"><div class="num">' + s.caravan.horses + '</div><div class="unit">骡马</div></div>' +
          '<div class="scale-item"><div class="num">' + s.caravan.people + '</div><div class="unit">脚夫</div></div>' +
          '<div class="scale-item"><div class="num">' + s.caravan.days + '</div><div class="unit">行程日</div></div>' +
        '</div>' +
      '</div>' +

      '<div class="detail-section">' +
        '<div class="detail-section-title">驮运货物</div>' +
        '<div class="goods-list">' +
          s.goods.map(function(g) { return '<span class="goods-tag">' + g + '</span>'; }).join('') +
        '</div>' +
      '</div>' +

      '<div class="detail-section">' +
        '<div class="detail-section-title">住宿客栈</div>' +
        '<div class="inn-name">' + s.inn + '</div>' +
        '<div class="inn-desc">' + s.innDesc + '</div>' +
      '</div>' +

      '<div class="detail-section">' +
        '<div class="detail-section-title">前方险段</div>' +
        '<div class="danger-box">' +
          '<div class="danger-title">' + s.danger.split('。')[0] + '</div>' +
          '<div class="danger-desc">' + s.danger + '</div>' +
        '</div>' +
      '</div>' +

      '<div class="detail-section">' +
        '<div class="detail-section-title">马帮行记</div>' +
        '<div class="diary-box">' +
          '<div class="diary-text">' + s.diary + '</div>' +
          '<div class="diary-author">—— 马锅头行记</div>' +
        '</div>' +
      '</div>';

    detailOverlay.classList.add('open');
  }

  function closeDetail() {
    detailOverlay.classList.remove('open');
  }

  detailClose.addEventListener('click', closeDetail);

  // ===== Scroll Handling =====
  let scrollX = 0;
  let maxScroll = 0;
  let isDragging = false;
  let dragStartX = 0;
  let dragStartScroll = 0;

  function updateMaxScroll() {
    maxScroll = stageWrap.scrollWidth - stageWrap.clientWidth;
  }

  // Horizontal scroll from vertical wheel
  stageWrap.addEventListener('wheel', function(e) {
    e.preventDefault();
    const delta = e.deltaY || e.deltaX;
    stageWrap.scrollLeft += delta;
  }, { passive: false });

  // Drag to scroll
  stageWrap.addEventListener('mousedown', function(e) {
    if (e.target.closest('.station-node') || e.target.closest('button')) return;
    isDragging = true;
    dragStartX = e.clientX;
    dragStartScroll = stageWrap.scrollLeft;
    stageWrap.style.cursor = 'grabbing';
  });

  document.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    const dx = e.clientX - dragStartX;
    stageWrap.scrollLeft = dragStartScroll - dx;
  });

  document.addEventListener('mouseup', function() {
    if (isDragging) {
      isDragging = false;
      stageWrap.style.cursor = '';
    }
  });

  // Keyboard navigation
  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault();
      const dir = e.key === 'ArrowRight' ? 1 : -1;
      stageWrap.scrollLeft += dir * 120;
    }
    if (e.key === 'Escape') {
      closeDetail();
    }
  });

  // ===== RAF Animation Loop =====
  let rafId = null;
  let isPaused = false;
  let lastTime = 0;

  function updateCaravanPosition() {
    const scrollRatio = maxScroll > 0 ? stageWrap.scrollLeft / maxScroll : 0;
    const trailLength = trailPath.getTotalLength();
    const caravanProgress = Math.min(1, scrollRatio);
    const point = trailPath.getPointAtLength(trailLength * caravanProgress);

    // Get tangent for rotation
    const pointAhead = trailPath.getPointAtLength(Math.min(trailLength, trailLength * caravanProgress + 5));
    const angle = Math.atan2(pointAhead.y - point.y, pointAhead.x - point.x) * 180 / Math.PI;

    caravan.style.left = point.x + 'px';
    caravan.style.top = (point.y - 20) + 'px';
    caravan.style.transform = `translate(-50%, -50%) rotate(${angle * 0.3}deg)`;

    // Update mileage ruler
    const currentMile = Math.round(caravanProgress * 1800);
    rulerCursor.style.left = (caravanProgress * 100) + '%';
    rulerValue.textContent = currentMile + ' 里';

    // Check station proximity for highlighting
    const stationNodes = document.querySelectorAll('.station-node');
    stationNodes.forEach(function(node, idx) {
      const nodeX = parseFloat(node.style.left);
      const viewLeft = stageWrap.scrollLeft;
      const viewCenter = viewLeft + stageWrap.clientWidth / 2;
      const dist = Math.abs(nodeX - viewCenter);

      if (dist < 200) {
        node.classList.add('near');
      } else {
        node.classList.remove('near');
      }

      // Auto-open if very close and not already open
      if (dist < 60 && !detailOverlay.classList.contains('open') && isScrolling) {
        // Light highlight only
      }
    });

    // Parallax mountain layers
    const scrollPct = scrollRatio;
    const far = document.getElementById('mountainsFar');
    const mid = document.getElementById('mountainsMid');
    const nearM = document.getElementById('mountainsNear');
    const mist = document.getElementById('mistLayer');

    if (far) far.style.transform = `translateX(${-scrollPct * 150}px)`;
    if (mid) mid.style.transform = `translateX(${-scrollPct * 80}px)`;
    if (nearM) nearM.style.transform = `translateX(${-scrollPct * 30}px)`;
    if (mist) mist.style.transform = `translateX(${-scrollPct * 100}px)`;

    // Hide scroll hint after some scrolling
    if (stageWrap.scrollLeft > 200) {
      scrollHint.style.opacity = '0';
    } else {
      scrollHint.style.opacity = '';
    }
  }

  let isScrolling = false;
  let scrollTimeout = null;

  stageWrap.addEventListener('scroll', function() {
    isScrolling = true;
    if (scrollTimeout) clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(function() {
      isScrolling = false;
      caravan.classList.remove('walking');
      setTimeout(function() {
        if (!isScrolling) caravan.classList.add('walking'); // keep walking for atmosphere
      }, 500);
    }, 150);
  }, { passive: true });

  function animate(time) {
    if (isPaused) return;

    const dt = time - lastTime;
    lastTime = time;

    // Smooth cursor follow
    cursorX += (targetCursorX - cursorX) * 0.2;
    cursorY += (targetCursorY - cursorY) * 0.2;
    cursor.style.transform = `translate(${cursorX}px, ${cursorY}px) translate(-50%, -50%)`;

    // Cursor trail
    if (!prefersReducedMotion) {
      trailPositions.unshift({ x: cursorX, y: cursorY });
      trailPositions.pop();
      for (let i = 0; i < TRAIL_COUNT; i++) {
        const pos = trailPositions[i] || trailPositions[trailPositions.length - 1];
        if (cursorTrailDots[i]) {
          cursorTrailDots[i].style.transform =
            `translate(${pos.x}px, ${pos.y}px) translate(-50%, -50%) scale(${1 - i * 0.12})`;
        }
      }
    }

    updateCaravanPosition();

    rafId = requestAnimationFrame(animate);
  }

  // Visibility change - pause RAF
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      isPaused = true;
      if (rafId) cancelAnimationFrame(rafId);
    } else {
      isPaused = false;
      lastTime = performance.now();
      rafId = requestAnimationFrame(animate);
    }
  });

  // ===== Init =====
  function init() {
    updateMaxScroll();
    buildStations();
    buildDangers();
    lastTime = performance.now();
    rafId = requestAnimationFrame(animate);
  }

  // Handle resize
  let resizeTimeout;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(function() {
      updateMaxScroll();
      // Rebuild stations on resize for mobile
      stationsLayer.innerHTML = '';
      dangerLayer.innerHTML = '';
      buildStations();
      buildDangers();
    }, 200);
  });

  // Enter button
  enterBtn.addEventListener('click', function() {
    introScreen.classList.add('hidden');
    // Set initial scroll to beginning
    setTimeout(function() {
      init();
      stageWrap.scrollLeft = 0;
    }, 300);
  });

  // Start cursor animation immediately (even on intro screen)
  if (!prefersReducedMotion) {
    rafId = requestAnimationFrame(function initialAnim(time) {
      if (isPaused) return;
      const dt = time - lastTime;
      lastTime = time;
      cursorX += (targetCursorX - cursorX) * 0.2;
      cursorY += (targetCursorY - cursorY) * 0.2;
      cursor.style.transform = `translate(${cursorX}px, ${cursorY}px) translate(-50%, -50%)`;

      if (!prefersReducedMotion) {
        trailPositions.unshift({ x: cursorX, y: cursorY });
        trailPositions.pop();
        for (let i = 0; i < TRAIL_COUNT; i++) {
          const pos = trailPositions[i] || trailPositions[trailPositions.length - 1];
          if (cursorTrailDots[i]) {
            cursorTrailDots[i].style.transform =
              `translate(${pos.x}px, ${pos.y}px) translate(-50%, -50%) scale(${1 - i * 0.12})`;
          }
        }
      }

      rafId = requestAnimationFrame(initialAnim);
    });
  }

  // If reduced motion, auto-init and skip intro cursor anim
  if (prefersReducedMotion) {
    // Just init normally on enter
  }

  // Cleanup on unload
  window.addEventListener('beforeunload', function() {
    if (rafId) cancelAnimationFrame(rafId);
    if (scrollTimeout) clearTimeout(scrollTimeout);
    if (resizeTimeout) clearTimeout(resizeTimeout);
  });

})();
</script>
</body>
</html>

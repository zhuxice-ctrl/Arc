<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="creative-medium" string="true">interactive-prototype">
<title>七十二候物候环</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --paper: #F2EDE2;
  --paper-dark: #E8E1D0;
  --ink: #2A2622;
  --ink-soft: #5A5048;
  --ink-light: #8A7F73;
  --vermilion: #C0392B;
  --vermilion-dark: #A02A1E;
  --seal: #B23126;
  --gold: #C9923A;
  --ring-outer: 380;
  --ring-band-outer: 370;
  --ring-band-inner: 340;
  --ring-segment-outer: 340;
  --ring-segment-inner: 260;
  --ring-inner: 250;
  --ring-center: 240;
  --wheel-size: min(82vh, 82vw, 780px);
}

/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", "STSong", serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  cursor: none;
  user-select: none;
  -webkit-user-select: none;
}

@media (prefers-reduced-motion: reduce) {
  html, body { cursor: auto; }
}

/* ===== Paper Texture Background ===== */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image:
    radial-gradient(ellipse at 20% 30%, rgba(200, 190, 170, 0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(180, 165, 140, 0.12) 0%, transparent 45%),
    radial-gradient(circle at 50% 50%, transparent 0%, rgba(100, 85, 60, 0.06) 100%);
  animation: paperDrift 60s ease-in-out infinite alternate;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='400' height='400' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 300px 300px;
  mix-blend-mode: multiply;
}

@keyframes paperDrift {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(-1%, -0.5%) scale(1.02); }
}

@media (prefers-reduced-motion: reduce) {
  body::before { animation: none; }
}

/* ===== Particle Canvas ===== */
#particles {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

/* ===== Main Container ===== */
.stage {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}

/* ===== Title Header ===== */
.site-header {
  position: fixed;
  top: 28px;
  left: 0;
  right: 0;
  z-index: 10;
  text-align: center;
  pointer-events: none;
}

.site-header h1 {
  font-size: 18px;
  font-weight: 500;
  letter-spacing: 8px;
  color: var(--ink);
  opacity: 0.8;
  padding-left: 8px;
}

.site-header h1 em {
  font-style: normal;
  color: var(--vermilion);
  margin: 0 6px;
}

.site-header .subtitle {
  font-size: 12px;
  color: var(--ink-light);
  letter-spacing: 4px;
  margin-top: 6px;
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
}

/* ===== Wheel Container ===== */
.wheel-container {
  position: relative;
  width: var(--wheel-size);
  height: var(--wheel-size);
  flex-shrink: 0;
}

.wheel-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* Seasonal color band - conic gradient background */
.color-band {
  position: absolute;
  top: 2.5%;
  left: 2.5%;
  width: 95%;
  height: 95%;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    #8CB369 0%,
    #9DB86E 8%,
    #B4BE7C 15%,
    #D4A88E 22%,
    #E8B4B8 25%,
    #D87B66 30%,
    #C73E1D 40%,
    #C9923A 49%,
    #D4A24A 52%,
    #C8822A 60%,
    #B5482A 70%,
    #8A3A2A 75%,
    #5C4F56 78%,
    #4A5D6B 85%,
    #6B7E8C 92%,
    #C8CDD0 98%,
    #8CB369 100%
  );
  filter: saturate(0.85) brightness(0.97);
  mask: radial-gradient(circle, transparent 60%, black 60.5%, black 96.5%, transparent 97%);
  -webkit-mask: radial-gradient(circle, transparent 60%, black 60.5%, black 96.5%, transparent 97%);
  pointer-events: none;
  will-change: transform;
}

/* Rotating wheel group */
.wheel-rotate {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  will-change: transform;
  pointer-events: none;
}

.wheel-rotate .wheel-svg {
  pointer-events: auto;
  cursor: none;
}

/* ===== Center Panel ===== */
.center-panel {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 58%;
  height: 58%;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 45%, var(--paper) 0%, var(--paper-dark) 100%);
  box-shadow:
    inset 0 2px 12px rgba(80, 60, 30, 0.08),
    0 4px 20px rgba(60, 40, 20, 0.06);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10% 8%;
  text-align: center;
  pointer-events: none;
  z-index: 5;
  overflow: hidden;
}

.center-panel::before {
  content: "";
  position: absolute;
  inset: 6%;
  border-radius: 50%;
  border: 1px solid rgba(42, 38, 34, 0.15);
  pointer-events: none;
}

.center-panel::after {
  content: "";
  position: absolute;
  inset: 10%;
  border-radius: 50%;
  border: 1px solid rgba(42, 38, 34, 0.06);
  pointer-events: none;
}

/* Inner texture */
.center-panel .panel-texture {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)'/%3E%3C/svg%3E");
  mix-blend-mode: multiply;
  pointer-events: none;
}

.term-label {
  font-size: 11px;
  color: var(--ink-light);
  letter-spacing: 4px;
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  margin-bottom: 4px;
  position: relative;
  z-index: 2;
  opacity: 0;
  animation: fadeUpIn 0.6s ease 0.1s forwards;
}

.term-name {
  font-size: clamp(20px, 4vw, 36px);
  font-weight: 600;
  letter-spacing: 6px;
  color: var(--ink);
  margin-bottom: 2px;
  position: relative;
  z-index: 2;
  padding-left: 6px;
  opacity: 0;
  animation: inkReveal 0.8s ease 0.15s forwards;
}

.term-season {
  font-size: 11px;
  color: var(--vermilion);
  letter-spacing: 3px;
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  margin-bottom: 16px;
  position: relative;
  z-index: 2;
  opacity: 0;
  animation: fadeUpIn 0.6s ease 0.25s forwards;
}

.phenology-list {
  list-style: none;
  width: 100%;
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 0 4%;
}

.phenology-item {
  display: flex;
  align-items: baseline;
  gap: 10px;
  text-align: left;
  opacity: 0;
  transform: translateY(6px);
}

.phenology-item:nth-child(1) { animation: inkReveal 0.7s ease 0.35s forwards; }
.phenology-item:nth-child(2) { animation: inkReveal 0.7s ease 0.5s forwards; }
.phenology-item:nth-child(3) { animation: inkReveal 0.7s ease 0.65s forwards; }

.phenology-num {
  font-size: 10px;
  color: var(--vermilion);
  font-family: "SF Mono", "Monaco", "Consolas", "Courier New", monospace;
  font-weight: 500;
  flex-shrink: 0;
  width: 18px;
  letter-spacing: 0.5px;
}

.phenology-text {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.phenology-title {
  font-size: clamp(12px, 1.8vw, 16px);
  color: var(--ink);
  font-weight: 500;
  letter-spacing: 1px;
}

.phenology-desc {
  font-size: clamp(10px, 1.3vw, 12px);
  color: var(--ink-soft);
  letter-spacing: 0.5px;
  font-family: "KaiTi", "STKaiti", "Kaiti SC", "Noto Serif SC", serif;
  font-style: normal;
  line-height: 1.4;
}

.panel-source {
  position: absolute;
  bottom: 14%;
  font-size: 10px;
  color: var(--ink-light);
  letter-spacing: 2px;
  font-family: "KaiTi", "STKaiti", "Kaiti SC", serif;
  z-index: 2;
  opacity: 0;
  animation: sourceReveal 1s ease 0.9s forwards;
}

/* Seal stamp */
.seal-stamp {
  position: absolute;
  top: 12%;
  right: 10%;
  width: 32px;
  height: 32px;
  border: 2px solid var(--seal);
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--seal);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0;
  font-family: "Noto Serif SC", serif;
  transform: rotate(-8deg) scale(0);
  opacity: 0;
  z-index: 3;
  animation: sealStamp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.8s forwards;
  writing-mode: vertical-rl;
  padding: 2px 0;
  line-height: 1.1;
}

.seal-stamp span {
  display: block;
}

/* ===== Pointer (fixed at top) ===== */
.pointer-indicator {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  z-index: 6;
  pointer-events: none;
  animation: pointerBreath 3s ease-in-out infinite;
}

.pointer-indicator svg {
  display: block;
  filter: drop-shadow(0 2px 4px rgba(192, 57, 43, 0.2));
}

@keyframes pointerBreath {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(4px); }
}

@media (prefers-reduced-motion: reduce) {
  .pointer-indicator { animation: none; }
}

/* ===== Custom Cursor ===== */
.custom-cursor {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 24px;
  height: 24px;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  mix-blend-mode: multiply;
}

.cursor-dot {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 5px;
  height: 5px;
  background: var(--vermilion);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: width 0.2s ease, height 0.2s ease, opacity 0.2s ease;
}

.cursor-ring {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 24px;
  height: 24px;
  border: 1.5px solid var(--vermilion);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: width 0.25s cubic-bezier(0.23, 1, 0.32, 1),
              height 0.25s cubic-bezier(0.23, 1, 0.32, 1),
              border-color 0.2s ease,
              opacity 0.2s ease;
}

.cursor-ring::before {
  content: "";
  position: absolute;
  top: -5px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 3px solid transparent;
  border-right: 3px solid transparent;
  border-bottom: 5px solid var(--vermilion);
}

.custom-cursor.is-grabbing .cursor-ring {
  width: 36px;
  height: 36px;
  border-style: dashed;
  animation: cursorSpin 2s linear infinite;
}

.custom-cursor.is-grabbing .cursor-dot {
  width: 3px;
  height: 3px;
}

.custom-cursor.is-hover .cursor-ring {
  width: 40px;
  height: 40px;
  border-color: var(--ink);
}

.custom-cursor.is-hover .cursor-ring::before {
  border-bottom-color: var(--ink);
}

@keyframes cursorSpin {
  from { transform: translate(-50%, -50%) rotate(0deg); }
  to { transform: translate(-50%, -50%) rotate(360deg); }
}

@media (prefers-reduced-motion: reduce) {
  .custom-cursor { display: none; }
}

/* Cursor trail dots */
.cursor-trail {
  position: fixed;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--vermilion);
  pointer-events: none;
  z-index: 9998;
  opacity: 0.4;
}

/* ===== Footer / Instructions ===== */
.instruction {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  gap: 24px;
  font-size: 12px;
  color: var(--ink-soft);
  letter-spacing: 1px;
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  pointer-events: none;
}

.instruction-item {
  display: flex;
  align-items: center;
  gap: 6px;
  opacity: 0.6;
}

.instruction-item .key {
  display: inline-block;
  padding: 2px 6px;
  border: 1px solid var(--ink-light);
  border-radius: 3px;
  font-size: 10px;
  font-family: "SF Mono", monospace;
  color: var(--ink-soft);
}

/* Season indicator corner */
.season-indicator {
  position: fixed;
  bottom: 28px;
  right: 36px;
  z-index: 10;
  text-align: right;
  pointer-events: none;
}

.season-name {
  font-size: 14px;
  color: var(--ink);
  letter-spacing: 4px;
  font-weight: 500;
  margin-bottom: 4px;
  transition: color 0.8s ease;
}

.season-sub {
  font-size: 10px;
  color: var(--ink-light);
  letter-spacing: 2px;
  font-family: "Noto Sans SC", "PingFang SC", sans-serif;
}

/* Top-left corner info */
.corner-info {
  position: fixed;
  top: 28px;
  left: 36px;
  z-index: 10;
  pointer-events: none;
}

.corner-info .dynasty {
  font-size: 11px;
  color: var(--ink-soft);
  letter-spacing: 2px;
  font-family: "KaiTi", "STKaiti", serif;
}

.corner-info .source {
  font-size: 10px;
  color: var(--ink-light);
  letter-spacing: 1.5px;
  font-family: "Noto Sans SC", sans-serif;
  margin-top: 4px;
}

/* ===== Animations ===== */
@keyframes inkReveal {
  0% {
    opacity: 0;
    transform: translateY(6px) scale(0.98);
    filter: blur(4px);
  }
  40% {
    opacity: 0.6;
    filter: blur(2px);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }
}

@keyframes fadeUpIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes sourceReveal {
  from { opacity: 0; letter-spacing: 0; }
  to { opacity: 0.7; letter-spacing: 2px; }
}

@keyframes sealStamp {
  0% {
    transform: rotate(-8deg) scale(0);
    opacity: 0;
  }
  60% {
    transform: rotate(-8deg) scale(1.15);
    opacity: 1;
  }
  100% {
    transform: rotate(-8deg) scale(1);
    opacity: 0.85;
  }
}

/* Content change transition helper */
.content-transition {
  animation: contentSwap 0.5s ease;
}

@keyframes contentSwap {
  0% { opacity: 1; transform: scale(1); }
  30% { opacity: 0; transform: scale(0.97); filter: blur(2px); }
  70% { opacity: 0; transform: scale(1.02); filter: blur(2px); }
  100% { opacity: 1; transform: scale(1); filter: blur(0); }
}

/* ===== Hover effects on segments (via SVG classes) ===== */
.segment-group {
  transition: transform 0.25s cubic-bezier(0.23, 1, 0.32, 1), filter 0.25s ease;
  transform-origin: 400px 400px;
  cursor: grab;
}

.segment-group:hover {
  filter: drop-shadow(0 0 6px rgba(192, 57, 43, 0.25));
}

.segment-group:active {
  cursor: grabbing;
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .site-header { top: 16px; }
  .site-header h1 { font-size: 15px; letter-spacing: 6px; }
  .site-header .subtitle { font-size: 10px; }
  .corner-info { top: 16px; left: 20px; }
  .corner-info .dynasty { font-size: 10px; }
  .season-indicator { bottom: 20px; right: 20px; }
  .season-name { font-size: 12px; }
  .instruction { bottom: 20px; font-size: 10px; gap: 14px; }
  .instruction-item { gap: 4px; }
  .wheel-container { --wheel-size: 92vw; }
  .phenology-list { gap: 6px; }
  .seal-stamp { width: 26px; height: 26px; font-size: 9px; }
}

@media (max-width: 480px) {
  .instruction { display: none; }
  .corner-info { display: none; }
  .season-indicator { display: none; }
}

/* Grayscale test support */
.grayscale-test .site-header,
.grayscale-test .wheel-container,
.grayscale-test .center-panel,
.grayscale-test .color-band {
  filter: grayscale(1);
}
</style>
</head>
<body>

<!-- Particle canvas for seasonal atmosphere -->
<canvas id="particles"></canvas>

<!-- Header -->
<header class="site-header">
  <h1>七<em>·</em>十<em>·</em>二<em>·</em>候</h1>
  <div class="subtitle">物 候 环 · 节 气 轮 盘</div>
</header>

<!-- Corner info -->
<div class="corner-info">
  <div class="dynasty">逸周书·时训解</div>
  <div class="source">二十四节气 · 七十二候</div>
</div>

<!-- Season indicator -->
<div class="season-indicator">
  <div class="season-name" id="seasonName">春季</div>
  <div class="season-sub">SPRING</div>
</div>

<!-- Main stage -->
<div class="stage">
  <div class="wheel-container" id="wheelContainer">
    <!-- Color band (conic gradient) -->
    <div class="color-band" id="colorBand"></div>

    <!-- Rotating wheel with SVG segments -->
    <div class="wheel-rotate" id="wheelRotate">
      <svg class="wheel-svg" viewBox="0 0 800 800" id="wheelSvg">
        <!-- Decorative outer ring -->
        <circle cx="400" cy="400" r="378" fill="none" stroke="#2A2622" stroke-width="0.8" opacity="0.4"/>
        <circle cx="400" cy="400" r="372" fill="none" stroke="#2A2622" stroke-width="0.5" opacity="0.25"/>
        
        <!-- Inner decorative ring -->
        <circle cx="400" cy="400" r="252" fill="none" stroke="#2A2622" stroke-width="0.6" opacity="0.3"/>
        <circle cx="400" cy="400" r="248" fill="none" stroke="#2A2622" stroke-width="0.4" opacity="0.2"/>

        <!-- Segment dividers -->
        <g id="segmentDividers" opacity="0.35"></g>

        <!-- Term labels -->
        <g id="termLabels"></g>

        <!-- Phenology marks (72 small dots) -->
        <g id="phenologyMarks"></g>

        <!-- Click targets (invisible larger segments) -->
        <g id="clickTargets"></g>
      </svg>
    </div>

    <!-- Center panel -->
    <div class="center-panel" id="centerPanel">
      <div class="panel-texture"></div>
      <div class="term-label" id="termLabel">节 气</div>
      <div class="term-name" id="termName">立春</div>
      <div class="term-season" id="termSeason">孟春·正月节</div>
      <ul class="phenology-list" id="phenologyList">
        <li class="phenology-item">
          <span class="phenology-num">初候</span>
          <div class="phenology-text">
            <span class="phenology-title">东风解冻</span>
            <span class="phenology-desc">东风送暖，河冰始融</span>
          </div>
        </li>
        <li class="phenology-item">
          <span class="phenology-num">二候</span>
          <div class="phenology-text">
            <span class="phenology-title">蛰虫始振</span>
            <span class="phenology-desc">冬眠虫类，渐次苏醒</span>
          </div>
        </li>
        <li class="phenology-item">
          <span class="phenology-num">三候</span>
          <div class="phenology-text">
            <span class="phenology-title">鱼陟负冰</span>
            <span class="phenology-desc">鱼游向上，背负碎冰</span>
          </div>
        </li>
      </ul>
      <div class="panel-source" id="panelSource">《逸周书·时训解》</div>
      <div class="seal-stamp" id="sealStamp">立春</div>
    </div>

    <!-- Fixed pointer at top -->
    <div class="pointer-indicator">
      <svg width="20" height="32" viewBox="0 0 20 32">
        <path d="M10 0 L20 14 L10 32 L0 14 Z" fill="#C0392B"/>
        <circle cx="10" cy="14" r="3" fill="#F2EDE2"/>
      </svg>
    </div>
  </div>
</div>

<!-- Instruction -->
<div class="instruction">
  <span class="instruction-item"><span class="key">拖动</span>旋转轮盘</span>
  <span class="instruction-item"><span class="key">滚轮</span>微调</span>
  <span class="instruction-item"><span class="key">点击</span>吸附节气</span>
</div>

<!-- Custom cursor -->
<div class="custom-cursor" id="customCursor">
  <div class="cursor-ring"></div>
  <div class="cursor-dot"></div>
</div>

<script>
(function() {

  // ===== Build the Wheel =====
  function buildWheel() {
    var outerR = 340;
    var innerR = 260;
    var labelR = 300;
    var markRadii = [280, 290, 300]; // three rings for three phenology marks

    for (var i = 0; i < 24; i++) {
      var angle = i * SEGMENT_ANGLE;
      var rad = (angle - 90) * Math.PI / 180; // start at top (-90deg)

      // Segment divider line
      var divider = document.createElementNS(SVG_NS, "line");
      var x1 = CENTER + innerR * Math.cos(rad);
      var y1 = CENTER + innerR * Math.sin(rad);
      var x2 = CENTER + outerR * Math.cos(rad);
      var y2 = CENTER + outerR * Math.sin(rad);
      divider.setAttribute("x1", x1);
      divider.setAttribute("y1", y1);
      divider.setAttribute("x2", x2);
      divider.setAttribute("y2", y2);
      divider.setAttribute("stroke", "#2A2622");
      divider.setAttribute("stroke-width", i % 6 === 0 ? "1.5" : "0.6");
      divider.setAttribute("opacity", i % 6 === 0 ? "0.6" : "0.3");
      segmentDividersGroup.appendChild(divider);

      // Tick marks at major divisions
      if (i % 6 === 0) {
        var tickOuter = document.createElementNS(SVG_NS, "circle");
        tickOuter.setAttribute("cx", CENTER + outerR * Math.cos(rad));
        tickOuter.setAttribute("cy", CENTER + outerR * Math.sin(rad));
        tickOuter.setAttribute("r", "3");
        tickOuter.setAttribute("fill", "#C0392B");
        tickOuter.setAttribute("opacity", "0.6");
        segmentDividersGroup.appendChild(tickOuter);
      }

      // Term label (positioned at segment midpoint)
      var midAngle = angle + SEGMENT_ANGLE / 2;
      var midRad = (midAngle - 90) * Math.PI / 180;
      var labelX = CENTER + labelR * Math.cos(midRad);
      var labelY = CENTER + labelR * Math.sin(midRad);

      var labelGroup = document.createElementNS(SVG_NS, "g");
      labelGroup.setAttribute("transform", "translate(" + labelX + "," + labelY + ") rotate(" + midAngle + ")");

      var labelText = document.createElementNS(SVG_NS, "text");
      labelText.textContent = SOLAR_TERMS[i].name;
      labelText.setAttribute("text-anchor", "middle");
      labelText.setAttribute("dominant-baseline", "middle");
      labelText.setAttribute("font-size", i % 6 === 0 ? "14" : "11");
      labelText.setAttribute("font-weight", i % 6 === 0 ? "600" : "400");
      labelText.setAttribute("fill", "#2A2622");
      labelText.setAttribute("opacity", i % 6 === 0 ? "0.85" : "0.6");
      labelText.setAttribute("font-family", '"Noto Serif SC", "Songti SC", "SimSun", serif');
      labelText.setAttribute("letter-spacing", "1");
      labelGroup.appendChild(labelText);
      termLabelsGroup.appendChild(labelGroup);

      // Phenology marks (3 per term)
      for (var j = 0; j < 3; j++) {
        var markOffset = (j - 1) * 4; // spread marks within segment
        var markAngle = midAngle + markOffset;
        var markRad = (markAngle - 90) * Math.PI / 180;
        var markR = markRadii[j];
        var mx = CENTER + markR * Math.cos(markRad);
        var my = CENTER + markR * Math.sin(markRad);

        var mark = document.createElementNS(SVG_NS, "circle");
        mark.setAttribute("cx", mx);
        mark.setAttribute("cy", my);
        mark.setAttribute("r", j === 1 ? "2.5" : "2");
        mark.setAttribute("fill", i % 6 === 0 && j === 0 ? "#C0392B" : "#2A2622");
        mark.setAttribute("opacity", "0.5");
        phenologyMarksGroup.appendChild(mark);
      }

      // Click target (invisible arc segment)
      var clickTarget = document.createElementNS(SVG_NS, "path");
      var startRad = (angle - 90) * Math.PI / 180;
      var endRad = (angle + SEGMENT_ANGLE - 90) * Math.PI / 180;
      var outerX1 = CENTER + outerR * Math.cos(startRad);
      var outerY1 = CENTER + outerR * Math.sin(startRad);
      var outerX2 = CENTER + outerR * Math.cos(endRad);
      var outerY2 = CENTER + outerR * Math.sin(endRad);
      var innerX1 = CENTER + innerR * Math.cos(startRad);
      var innerY1 = CENTER + innerR * Math.sin(startRad);
      var innerX2 = CENTER + innerR * Math.cos(endRad);
      var innerY2 = CENTER + innerR * Math.sin(endRad);

      var pathD = [
        "M", innerX1, innerY1,
        "L", outerX1, outerY1,
        "A", outerR, outerR, 0, 0, 1, outerX2, outerY2,
        "L", innerX2, innerY2,
        "A", innerR, innerR, 0, 0, 0, innerX1, innerY1,
        "Z"
      ].join(" ");

      clickTarget.setAttribute("d", pathD);
      clickTarget.setAttribute("fill", "transparent");
      clickTarget.setAttribute("stroke", "none");
      clickTarget.setAttribute("class", "segment-group");
      clickTarget.setAttribute("data-index", i);
      clickTarget.style.cursor = "grab";
      clickTargetsGroup.appendChild(clickTarget);
    }

  // ===== Wheel Rotation & Rendering =====
  function applyRotation() {
    // Normalize rotation to 0-360
    var rot = state.rotation % 360;
    if (rot < 0) rot += 360;
    state.rotation = rot;

    // Apply transform directly to DOM (high-frequency path)
    var transform = "rotate(" + rot + "deg)";
    wheelRotate.style.transform = transform;
    colorBand.style.transform = transform;

    // Determine current term (the one at the top pointer)
    // Top = 0 degrees. Each term is 15 degrees.
    // The wheel is rotated by `rot` degrees clockwise.
    // Term i is at position (i * 15 + 7.5) degrees from top originally.
    // After rotation, term i is at (i * 15 + 7.5 + rot) mod 360.
    // We want the term closest to 0 (top), i.e., (i*15 + 7.5 + rot) mod 360 closest to 0.
    // Equivalent: find i where rot is closest to (-i*15 - 7.5) mod 360.
    // Simplest: compute effective angle of top pointer in wheel space.
    // Top pointer in world = 0deg (top). In wheel space (rotated by rot),
    // the top pointer points to angle (-rot) mod 360 of the wheel.
    // Term i occupies [i*15, (i+1)*15) in wheel space (starting at top=0).
    // So current term index = floor((-rot mod 360) / 15)
    
    var wheelTopAngle = (360 - rot) % 360;
    var newIndex = Math.floor(wheelTopAngle / SEGMENT_ANGLE) % 24;
    if (newIndex < 0) newIndex += 24;

    if (newIndex !== state.currentIndex) {
      state.currentIndex = newIndex;
      updateCenterPanel(newIndex);
    }

    // Update season indicator color smoothly
    var term = SOLAR_TERMS[newIndex];
    if (term.season !== state.currentSeason) {
      state.currentSeason = term.season;
      updateSeasonIndicator(term.season);
    }
  }

  function updateCenterPanel(index) {
    var term = SOLAR_TERMS[index];

    // Add transition class
    centerPanel.classList.remove("content-transition");
    // Force reflow
    void centerPanel.offsetWidth;
    centerPanel.classList.add("content-transition");

    // Update text after short delay to sync with transition
    setTimeout(function() {
      termNameEl.textContent = term.name;
      termSeasonEl.textContent = term.month;
      seasonNameEl.textContent = term.seasonName;

      // Update phenology list
      var items = phenologyListEl.querySelectorAll(".phenology-item");
      var labels = ["初候", "二候", "三候"];
      for (var i = 0; i < 3 && i < items.length; i++) {
        var item = items[i];
        var numEl = item.querySelector(".phenology-num");
        var titleEl = item.querySelector(".phenology-title");
        var descEl = item.querySelector(".phenology-desc");
        numEl.textContent = labels[i];
        titleEl.textContent = term.phenology[i].title;
        descEl.textContent = term.phenology[i].desc;

        // Restart animation
        item.style.animation = "none";
        void item.offsetWidth;
        item.style.animation = "";
      }

      // Update seal
      sealStampEl.textContent = term.name;
      sealStampEl.style.animation = "none";
      void sealStampEl.offsetWidth;
      sealStampEl.style.animation = "sealStamp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s forwards";

      // Restart term animations
      termNameEl.style.animation = "none";
      termSeasonEl.style.animation = "none";
      void termNameEl.offsetWidth;
      termNameEl.style.animation = "inkReveal 0.8s ease 0.05s forwards";
      termSeasonEl.style.animation = "fadeUpIn 0.6s ease 0.15s forwards";
    }, 150);

    var seasonColors = {
      "春": "#7BA05B",
      "夏": "#C73E1D",
      "秋": "#C9923A",
      "冬": "#4A5D6B"
    };
    seasonNameEl.style.color = seasonColors[season] || "#2A2622";

    // Update particle system for new season
    if (!prefersReducedMotion) {
      setParticleSeason(season);
    }
  }

  // ===== Drag Interaction =====
  function getAngleFromPointer(clientX, clientY) {
    var rect = wheelContainer.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var dx = clientX - cx;
    var dy = clientY - cy;
    var angle = Math.atan2(dy, dx) * 180 / Math.PI + 90; // adjust so top = 0
    if (angle < 0) angle += 360;
    return angle;
  }

  function onPointerDown(e) {
    // Only left button or touch
    if (e.button !== undefined && e.button !== 0) return;

    state.isDragging = true;
    state.velocity = 0;
    state.isSnapping = false;
    state.snapTarget = null;

    var angle = getAngleFromPointer(e.clientX, e.clientY);
    state.lastPointerAngle = angle;
    state.lastDragAngle = angle;
    state.dragStartAngle = angle;
    state.dragStartRotation = state.rotation;
    state.lastTime = performance.now();

    customCursor.classList.add("is-grabbing");

    wheelSvg.setPointerCapture && wheelSvg.setPointerCapture(e.pointerId);
    e.preventDefault();
  }

  function onPointerMove(e) {
    // Custom cursor tracking
    updateCursor(e.clientX, e.clientY);

    // Cursor trail
    if (!prefersReducedMotion && state.isDragging) {
      addCursorTrail(e.clientX, e.clientY);
    }

    if (!state.isDragging) return;

    var angle = getAngleFromPointer(e.clientX, e.clientY);
    var now = performance.now();
    var dt = now - state.lastTime;

    // Calculate delta angle (handle 0/360 wrap)
    var delta = angle - state.lastPointerAngle;
    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;

    // Rotate wheel opposite to drag direction (dragging clockwise → wheel rotates clockwise)
    state.rotation += delta;

    // Calculate velocity for inertia (deg per ms)
    if (dt > 0) {
      state.velocity = delta / dt * 16.67; // normalize to ~60fps frame
    }

    state.lastPointerAngle = angle;
    state.lastTime = now;

    applyRotation();
  }

    if (totalDrag < 2) {
      // Treat as click — find clicked segment and snap to it
      handleSegmentClick(e);
      return;
    }

    // Start inertia animation
    startInertia();
  }

  function handleSegmentClick(e) {
    var angle = getAngleFromPointer(e.clientX, e.clientY);
    // The angle is in world space. The wheel has been rotated by state.rotation.
    // The segment at wheel angle `wheelAngle` is at world angle `wheelAngle + rotation`.
    // So wheelAngle = (angle - rotation) mod 360.
    var wheelAngle = (angle - state.rotation + 360) % 360;
    var segmentIndex = Math.floor(wheelAngle / SEGMENT_ANGLE) % 24;
    
    // Snap to this term at the top (pointer position)
    // Term index should end up at top (wheel angle 0 means top pointer)
    // Current: term at wheelAngle is at the pointer.
    // We want segmentIndex to be at the top (wheel angle near 0).
    // We need to rotate so that segmentIndex's center is at top.
    // segmentIndex center wheel angle = segmentIndex * 15 + 7.5
    // After rotation change `delta`, segmentIndex will be at wheelAngle + delta.
    // We want that to equal 0 (top): delta = -(segmentIndex * 15 + 7.5 - wheelAngle)? No...
    
    // Actually: current top shows term at wheel angle (360 - rot) mod 360.
    // The clicked segment is at wheel angle = (angle - rotation) mod 360.
    // Wait, I'm confusing myself. Let me think clearly.
    
    // The wheel has a rotation R (clockwise).
    // Point at angle A on the wheel appears at angle (A + R) mod 360 in the world.
    // The pointer is at world angle 0 (top).
    // Current term at pointer: find i where (i*15 + 7.5 + R) mod 360 is closest to 0.
    //   → i where (i*15 + 7.5) ≈ -R mod 360 → i ≈ (-R - 7.5)/15 mod 24
    //   → i = floor((-R mod 360) / 15)  (since segment is [i*15, (i+1)*15))
    
    // Clicked point world angle = angle.
    // Clicked point wheel angle = (angle - R) mod 360.
    // Clicked segment index = floor((angle - R) mod 360 / 15).
    
    // To snap segmentIndex to pointer (top):
    // We need (segmentIndex * 15 + 7.5 + R_new) mod 360 = 0
    // R_new = (-segmentIndex * 15 - 7.5) mod 360
    // delta = R_new - R
    
    var targetRot = (-segmentIndex * SEGMENT_ANGLE - SEGMENT_ANGLE / 2) % 360;
    if (targetRot < 0) targetRot += 360;
    
    // Find shortest path
    var diff = targetRot - state.rotation;
    if (diff > 180) diff -= 360;
    if (diff < -180) diff += 360;
    
    state.snapTarget = state.rotation + diff;
    state.isSnapping = true;
    state.snapVelocity = 0;
  }

  // ===== Inertia / Animation Loop =====
  function startInertia() {
    // Velocity is already set from drag
    if (Math.abs(state.velocity) < 0.05) {
      state.velocity = 0;
      return;
    }
  }

  function animationLoop(timestamp) {
    if (!state.isVisible) return;

    if (!state.isDragging) {
      if (state.isSnapping && state.snapTarget !== null) {
        // Snap animation — spring-like ease
        var diff = state.snapTarget - state.rotation;
        // Handle wrap around shortest path
        if (diff > 180) diff -= 360;
        if (diff < -180) diff += 360;

        if (Math.abs(diff) < 0.1) {
          state.rotation = state.snapTarget;
          state.isSnapping = false;
          state.snapTarget = null;
          state.velocity = 0;
        } else {
          // Ease toward target
          state.rotation += diff * 0.12;
        }
        applyRotation();
      } else if (Math.abs(state.velocity) > 0.01) {
        // Inertia with damping
        state.rotation += state.velocity;
        state.velocity *= 0.985; // damping factor per frame

        if (Math.abs(state.velocity) < 0.01) {
          state.velocity = 0;
        }
        applyRotation();
      }
    }

    // Update particles
    if (!prefersReducedMotion) {
      updateParticles();
    }

    // Update cursor trail
    updateCursorTrail();

    state.animFrameId = requestAnimationFrame(animationLoop);
  }

  // ===== Wheel (scroll to fine-tune) =====
  function onWheel(e) {
    e.preventDefault();
    var delta = e.deltaY * 0.1; // fine adjustment
    state.rotation += delta;
    state.velocity = delta * 0.3;
    state.isSnapping = false;
    state.snapTarget = null;
    applyRotation();
  }

  // ===== Custom Cursor =====
  var cursorX = window.innerWidth / 2;
  var cursorY = window.innerHeight / 2;
  var cursorTargetX = cursorX;
  var cursorTargetY = cursorY;

  function updateCursor(x, y) {
    cursorTargetX = x;
    cursorTargetY = y;
  }

  function animateCursor() {
    if (prefersReducedMotion) return;
    // Smooth follow
    cursorX += (cursorTargetX - cursorX) * 0.35;
    cursorY += (cursorTargetY - cursorY) * 0.35;
    customCursor.style.left = cursorX + "px";
    customCursor.style.top = cursorY + "px";
    requestAnimationFrame(animateCursor);
  }

  function addCursorTrail(x, y) {
    state.trailCounter++;
    if (state.trailCounter % 2 !== 0) return; // every other move

    if (state.trailParticles.length >= state.maxTrail) {
      var old = state.trailParticles.shift();
      old.element.style.left = x + "px";
      old.element.style.top = y + "px";
      old.element.style.opacity = "0.35";
      old.age = 0;
      state.trailParticles.push(old);
    } else {
      var dot = document.createElement("div");
      dot.className = "cursor-trail";
      dot.style.left = x + "px";
      dot.style.top = y + "px";
      document.body.appendChild(dot);
      state.trailParticles.push({ element: dot, age: 0 });
    }
  }

  function updateCursorTrail() {
    if (prefersReducedMotion) return;
    for (var i = state.trailParticles.length - 1; i >= 0; i--) {
      var p = state.trailParticles[i];
      p.age++;
      var opacity = Math.max(0, 0.35 - p.age * 0.04);
      var scale = Math.max(0.3, 1 - p.age * 0.05);
      p.element.style.opacity = opacity;
      p.element.style.transform = "scale(" + scale + ")";
      if (opacity <= 0 && !state.isDragging) {
        p.element.remove();
        state.trailParticles.splice(i, 1);
      }
    }
  }

  // ===== Seasonal Particles =====
  var particles = [];
  var particleSeason = "春";
  var ctx = particleCanvas.getContext("2d");
  var particleMax = 30;

  function resizeCanvas() {
    particleCanvas.width = window.innerWidth;
    particleCanvas.height = window.innerHeight;
  }

  function setParticleSeason(season) {
    particleSeason = season;
    // Gradually replace particles
  }

  function createParticle() {
    var w = particleCanvas.width;
    var h = particleCanvas.height;
    var p = {};

    switch (particleSeason) {
      case "春": // pink petals
        p.x = Math.random() * w;
        p.y = -20 - Math.random() * h * 0.3;
        p.size = 4 + Math.random() * 6;
        p.speedY = 0.5 + Math.random() * 0.8;
        p.speedX = (Math.random() - 0.5) * 0.8;
        p.rotation = Math.random() * Math.PI * 2;
        p.rotSpeed = (Math.random() - 0.5) * 0.03;
        p.opacity = 0.3 + Math.random() * 0.3;
        p.color = "rgba(232, 160, 160, ";
        p.type = "petal";
        p.sway = Math.random() * Math.PI * 2;
        p.swaySpeed = 0.01 + Math.random() * 0.01;
        break;
      case "夏": // cicada shadows / firefly-like specks
        p.x = Math.random() * w;
        p.y = Math.random() * h;
        p.size = 1 + Math.random() * 2;
        p.speedY = (Math.random() - 0.5) * 0.3;
        p.speedX = (Math.random() - 0.5) * 0.5;
        p.rotation = 0;
        p.rotSpeed = 0;
        p.opacity = 0.15 + Math.random() * 0.25;
        p.color = "rgba(120, 100, 60, ";
        p.type = "speck";
        p.pulse = Math.random() * Math.PI * 2;
        p.pulseSpeed = 0.02 + Math.random() * 0.02;
        break;
      case "秋": // falling leaves
        p.x = Math.random() * w;
        p.y = -20 - Math.random() * h * 0.3;
        p.size = 5 + Math.random() * 7;
        p.speedY = 0.6 + Math.random() * 0.7;
        p.speedX = (Math.random() - 0.5) * 1.2;
        p.rotation = Math.random() * Math.PI * 2;
        p.rotSpeed = (Math.random() - 0.5) * 0.04;
        p.opacity = 0.3 + Math.random() * 0.3;
        p.color = Math.random() > 0.5 ? "rgba(201, 146, 58, " : "rgba(181, 72, 42, ";
        p.type = "leaf";
        p.sway = Math.random() * Math.PI * 2;
        p.swaySpeed = 0.015 + Math.random() * 0.015;
        break;
      case "冬": // snow flakes
        p.x = Math.random() * w;
        p.y = -10 - Math.random() * h * 0.2;
        p.size = 1.5 + Math.random() * 3;
        p.speedY = 0.4 + Math.random() * 0.6;
        p.speedX = (Math.random() - 0.5) * 0.4;
        p.rotation = 0;
        p.rotSpeed = 0;
        p.opacity = 0.4 + Math.random() * 0.3;
        p.color = "rgba(200, 205, 210, ";
        p.type = "snow";
        p.sway = Math.random() * Math.PI * 2;
        p.swaySpeed = 0.01 + Math.random() * 0.01;
        break;
    }
    return p;
  }

  function initParticles() {
    particles = [];
    for (var i = 0; i < particleMax; i++) {
      var p = createParticle();
      // Scatter randomly on screen initially
      p.y = Math.random() * particleCanvas.height;
      p.x = Math.random() * particleCanvas.width;
      particles.push(p);
    }
  }

  function updateParticles() {
    var w = particleCanvas.width;
    var h = particleCanvas.height;
    ctx.clearRect(0, 0, w, h);

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];

      // Update position
      p.sway += p.swaySpeed;
      var swayOffset = Math.sin(p.sway) * 0.5;
      p.x += p.speedX + swayOffset;
      p.y += p.speedY;
      p.rotation += p.rotSpeed;

      if (p.type === "speck") {
        p.pulse += p.pulseSpeed;
        p.currentOpacity = p.opacity * (0.6 + Math.sin(p.pulse) * 0.4);
      } else {
        p.currentOpacity = p.opacity;
      }

      // Reset if off screen
      if (p.y > h + 20 || p.x < -30 || p.x > w + 30) {
        particles[i] = createParticle();
        continue;
      }

      // Draw
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.globalAlpha = p.currentOpacity;

      switch (p.type) {
        case "petal":
          ctx.fillStyle = p.color + "1)";
          ctx.beginPath();
          ctx.ellipse(0, 0, p.size * 0.6, p.size * 0.35, 0, 0, Math.PI * 2);
          ctx.fill();
          break;
        case "speck":
          ctx.fillStyle = p.color + "1)";
          ctx.beginPath();
          ctx.arc(0, 0, p.size, 0, Math.PI * 2);
          ctx.fill();
          break;
        case "leaf":
          ctx.fillStyle = p.color + "1)";
          ctx.beginPath();
          ctx.ellipse(0, 0, p.size * 0.5, p.size * 0.25, 0, 0, Math.PI * 2);
          ctx.fill();
          // small stem
          ctx.strokeStyle = p.color + "0.5)";
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(-p.size * 0.5, 0);
          ctx.lineTo(p.size * 0.5, 0);
          ctx.stroke();
          break;
        case "snow":
          ctx.fillStyle = p.color + "1)";
          ctx.beginPath();
          ctx.arc(0, 0, p.size, 0, Math.PI * 2);
          ctx.fill();
          break;
      }

      ctx.restore();
    }
  }

  // ===== Visibility Handling =====
  function onVisibilityChange() {
    if (document.hidden) {
      state.isVisible = false;
      if (state.animFrameId) {
        cancelAnimationFrame(state.animFrameId);
        state.animFrameId = null;
      }
    } else {
      state.isVisible = true;
      state.lastTime = performance.now();
      if (!state.animFrameId) {
        state.animFrameId = requestAnimationFrame(animationLoop);
      }
    }
  }

  // ===== Hover Detection on Segments =====
  function setupHoverDetection() {
    var targets = clickTargetsGroup.querySelectorAll("path");
    targets.forEach(function(target) {
      target.addEventListener("mouseenter", function() {
        customCursor.classList.add("is-hover");
        // Highlight segment — scale slightly outward
        var index = parseInt(target.getAttribute("data-index"));
        highlightSegment(index, true);
      });
      target.addEventListener("mouseleave", function() {
        customCursor.classList.remove("is-hover");
        var index = parseInt(target.getAttribute("data-index"));
        highlightSegment(index, false);
      });
    });
  }

  function highlightSegment(index, isHover) {
    var targets = clickTargetsGroup.querySelectorAll("path");
    var target = targets[index];
    if (!target) return;

    // Calculate push-out direction (from center to segment midpoint)
    var midAngle = index * SEGMENT_ANGLE + SEGMENT_ANGLE / 2;
    var rad = (midAngle - 90) * Math.PI / 180;
    var pushAmount = isHover ? 4 : 0;
    var dx = Math.cos(rad) * pushAmount;
    var dy = Math.sin(rad) * pushAmount;

    target.style.transform = "translate(" + dx + "px, " + dy + "px)";
    target.style.fill = isHover ? "rgba(192, 57, 43, 0.06)" : "transparent";
    target.style.transition = "transform 0.25s cubic-bezier(0.23, 1, 0.32, 1), fill 0.25s ease";
  }

  // ===== Init =====
  function init() {
    buildWheel();
    resizeCanvas();
    initParticles();
    setupHoverDetection();
    applyRotation();

    // Event listeners
    wheelSvg.addEventListener("pointerdown", onPointerDown);
    window.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", onPointerUp);
    wheelContainer.addEventListener("wheel", onWheel, { passive: false });

    window.addEventListener("resize", function() {
      resizeCanvas();
    });

    document.addEventListener("visibilitychange", onVisibilityChange);

    // Start animation loops
    state.animFrameId = requestAnimationFrame(animationLoop);
    if (!prefersReducedMotion) {
      animateCursor();
    } else {
      customCursor.style.display = "none";
      document.body.style.cursor = "auto";
    }

    // Initial cursor position (center of screen)
    cursorTargetX = window.innerWidth / 2;
    cursorTargetY = window.innerHeight / 2;
    cursorX = cursorTargetX;
    cursorY = cursorTargetY;

    // Announce upgrade capability
    try {
      window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    } catch(e) {}
  }

  // Cleanup
  window.addEventListener("beforeunload", function() {
    if (state.animFrameId) {
      cancelAnimationFrame(state.animFrameId);
    }
  });

  // Start
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

  // Also announce on load (in case iframe load fired earlier)
  window.addEventListener("load", function() {
    try {
      window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    } catch(e) {}
  });

})();
</script>
</body>

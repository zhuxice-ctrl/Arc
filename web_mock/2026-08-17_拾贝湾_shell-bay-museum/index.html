<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>拾贝湾 · 贝壳标本博物馆</title>
<meta name="creative-medium" content="interactive-prototype" />
<meta name="description" content="拾贝湾贝壳标本博物馆 —— 一座收藏全球珍稀贝壳与海洋标本的沉浸式博物馆" />
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Ma+Shan+Zheng&display=swap" />
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  /* ========== CSS Variables & Reset ========== */
  :root {
    --sand-gold: #C8A972;
    --sand-gold-dark: #A88B5A;
    --sand-gold-light: #E8D9B8;
    --coral: #E8855E;
    --coral-dark: #C96A45;
    --coral-light: #F4B89A;
    --pearl: #FAF6EE;
    --pearl-warm: #F5EDE0;
    --seaweed: #3A6B5A;
    --seaweed-dark: #2A4F42;
    --seaweed-light: #5A8B7A;
    --ink: #2D2822;
    --ink-soft: #5A5248;
    --ink-light: #8A8072;
    --line: rgba(45, 40, 34, 0.12);
    --shadow-soft: 0 2px 24px rgba(45, 40, 34, 0.06);
    --shadow-deep: 0 8px 48px rgba(45, 40, 34, 0.12);
    --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
    --ease-out: cubic-bezier(.22, 1, .36, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--pearl);
    color: var(--ink);
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.7;
    overflow-x: hidden;
    cursor: none;
  }
  @media (max-width: 768px) {
    html, body { cursor: auto; }
  }
  img { max-width: 100%; display: block; }
  button { font-family: inherit; cursor: none; border: none; background: none; }
  @media (max-width: 768px) { button { cursor: pointer; } }
  a { color: inherit; text-decoration: none; cursor: none; }
  @media (max-width: 768px) { a { cursor: pointer; } }
  ul { list-style: none; }

  /* ========== Custom Cursor ========== */
  .cursor-outer {
    position: fixed;
    top: 0; left: 0;
    width: 36px; height: 36px;
    border: 2px solid var(--ink);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.35s var(--ease-spring),
                height 0.35s var(--ease-spring),
                border-color 0.3s ease,
                background 0.3s ease,
                opacity 0.2s ease;
    mix-blend-mode: difference;
    border-color: rgba(255,255,255,0.9);
  }
  .cursor-outer.is-hover {
    width: 64px; height: 64px;
    border-color: var(--coral);
    background: rgba(232, 133, 94, 0.1);
  }
  .cursor-inner {
    position: fixed;
    top: 0; left: 0;
    width: 6px; height: 6px;
    background: var(--coral);
    border-radius: 50%;
    pointer-events: none;
    z-index: 10000;
    transform: translate(-50%, -50%);
    box-shadow:
      0 0 8px var(--coral),
      0 0 20px rgba(232, 133, 94, 0.5),
      0 0 40px rgba(232, 133, 94, 0.3);
    transition: transform 0.15s ease-out,
                width 0.2s ease,
                height 0.2s ease,
                background 0.2s ease;
  }
  .cursor-inner.is-hover {
    width: 10px; height: 10px;
    background: var(--sand-gold);
    box-shadow:
      0 0 12px var(--sand-gold),
      0 0 24px rgba(200, 169, 114, 0.6);
  }
  .cursor-ripple {
    position: fixed;
    width: 10px; height: 10px;
    border: 2px solid var(--coral);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    animation: rippleExpand 0.8s ease-out forwards;
  }
  @keyframes rippleExpand {
    0% { width: 10px; height: 10px; opacity: 1; border-width: 3px; }
    100% { width: 120px; height: 120px; opacity: 0; border-width: 1px; }
  }
  @media (max-width: 768px) {
    .cursor-outer, .cursor-inner, .cursor-ripple { display: none; }
  }

  /* ========== Sand Particles Canvas ========== */
  #sandCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
    opacity: 0.6;
  }

  /* ========== Navigation ========== */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 20px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.4s ease, padding 0.4s ease, backdrop-filter 0.4s ease;
  }
  .nav.scrolled {
    background: rgba(250, 246, 238, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 14px 48px;
    border-bottom: 1px solid var(--line);
  }
  @media (max-width: 768px) {
    .nav { padding: 16px 20px; }
    .nav.scrolled { padding: 12px 20px; }
  }
  .nav-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: "Ma Shan Zheng", "Noto Serif SC", serif;
    font-size: 22px;
    color: var(--ink);
    letter-spacing: 2px;
  }
  .nav-brand-mark {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--coral) 0%, var(--sand-gold) 100%);
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .nav-brand-mark::after {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1.5px solid var(--pearl);
    border-radius: 50% 50% 50% 0;
    opacity: 0.7;
  }
  .nav-links {
    display: flex;
    align-items: center;
    gap: 36px;
  }
  .nav-link {
    font-size: 14px;
    color: var(--ink-soft);
    position: relative;
    padding: 4px 0;
    transition: color 0.3s ease;
    letter-spacing: 1px;
  }
  .nav-link::after {
    content: "";
    position: absolute;
    left: 50%; bottom: 0;
    width: 0; height: 2px;
    background: var(--coral);
    transition: width 0.3s var(--ease-out), left 0.3s var(--ease-out);
  }
  .nav-link:hover { color: var(--ink); }
  .nav-link:hover::after { width: 100%; left: 0; }
  .nav-cta {
    padding: 10px 24px;
    background: var(--ink);
    color: var(--pearl);
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 1px;
    transition: all 0.3s var(--ease-spring);
    position: relative;
    overflow: hidden;
  }
  .nav-cta::before {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.6s ease;
  }
  .nav-cta:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(45,40,34,0.2); }
  .nav-cta:hover::before { left: 100%; }
  @media (max-width: 768px) {
    .nav-links { display: none; }
  }

  /* ========== Hero ========== */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: linear-gradient(180deg, var(--pearl-warm) 0%, var(--pearl) 60%, var(--pearl-warm) 100%);
  }
  .hero-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0.15;
    filter: sepia(0.3) saturate(0.8);
  }
  .hero-inner {
    position: relative;
    z-index: 5;
    max-width: 1400px;
    width: 100%;
    padding: 120px 48px 80px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
  }
  @media (max-width: 1024px) {
    .hero-inner { grid-template-columns: 1fr; padding: 120px 24px 60px; gap: 40px; }
  }
  .hero-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    background: rgba(232, 133, 94, 0.1);
    border: 1px solid rgba(232, 133, 94, 0.3);
    border-radius: 999px;
    font-size: 12px;
    color: var(--coral-dark);
    letter-spacing: 3px;
    margin-bottom: 28px;
    text-transform: uppercase;
  }
  .hero-tag-dot {
    width: 6px; height: 6px;
    background: var(--coral);
    border-radius: 50%;
    animation: pulseDot 2s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.7); }
  }
  .hero-title {
    font-family: "Noto Serif SC", serif;
    font-size: clamp(42px, 5.5vw, 72px);
    font-weight: 900;
    line-height: 1.15;
    color: var(--ink);
    letter-spacing: 4px;
    margin-bottom: 28px;
  }
  .hero-title .accent {
    font-family: "Ma Shan Zheng", serif;
    color: var(--coral);
    font-weight: 400;
    font-size: 1.2em;
    letter-spacing: 6px;
    display: block;
  }
  .hero-subtitle {
    font-size: 17px;
    color: var(--ink-soft);
    line-height: 2;
    max-width: 520px;
    margin-bottom: 40px;
  }
  .hero-subtitle .caret {
    display: inline-block;
    width: 2px; height: 18px;
    background: var(--coral);
    margin-left: 4px;
    vertical-align: middle;
    animation: blinkCaret 1s step-end infinite;
  }
  @keyframes blinkCaret {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  .hero-actions {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .btn-primary {
    padding: 16px 36px;
    background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%);
    color: white;
    border-radius: 999px;
    font-size: 14px;
    letter-spacing: 2px;
    font-weight: 500;
    transition: all 0.4s var(--ease-spring);
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(232, 133, 94, 0.35);
  }
  .btn-primary::before {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transform: skewX(-20deg);
    transition: left 0.8s ease;
  }
  .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 10px 32px rgba(232, 133, 94, 0.45); }
  .btn-primary:hover::before { left: 150%; }
  .btn-secondary {
    padding: 16px 36px;
    background: transparent;
    color: var(--ink);
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    font-size: 14px;
    letter-spacing: 2px;
    font-weight: 500;
    transition: all 0.4s var(--ease-spring);
  }
  .btn-secondary:hover { background: var(--ink); color: var(--pearl); transform: translateY(-3px); }

  .hero-visual {
    position: relative;
    width: 100%;
    aspect-ratio: 5/4;
  }
  .hero-shell-main {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 75%;
    aspect-ratio: 1;
    border-radius: 50% 50% 50% 0;
    background: linear-gradient(135deg, var(--coral-light) 0%, var(--sand-gold) 50%, var(--coral-dark) 100%);
    transform: translate(-50%, -50%) rotate(-45deg);
    box-shadow:
      0 30px 80px rgba(232, 133, 94, 0.3),
      inset -20px -20px 60px rgba(201, 106, 69, 0.3),
      inset 20px 20px 60px rgba(250, 246, 238, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: transform 0.2s ease-out;
    will-change: transform;
  }
  .hero-shell-main::before {
    content: "";
    position: absolute;
    inset: 15%;
    border: 2px solid rgba(250, 246, 238, 0.4);
    border-radius: 50% 50% 50% 0;
  }
  .hero-shell-main::after {
    content: "";
    position: absolute;
    inset: 30%;
    border: 1.5px solid rgba(250, 246, 238, 0.3);
    border-radius: 50% 50% 50% 0;
  }
  .hero-shell-img {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(45deg);
    width: 65%;
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(45, 40, 34, 0.25);
  }
  .hero-float-card {
    position: absolute;
    background: rgba(250, 246, 238, 0.9);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 20px;
    box-shadow: var(--shadow-deep);
    font-size: 13px;
    transition: transform 0.6s var(--ease-out);
  }
  .hero-float-card.top-right {
    top: 8%; right: -2%;
    animation: floatCard1 6s ease-in-out infinite;
  }
  .hero-float-card.bottom-left {
    bottom: 10%; left: -4%;
    animation: floatCard2 8s ease-in-out infinite 1s;
  }
  .hero-float-card.bottom-right {
    bottom: -4%; right: 10%;
    animation: floatCard3 7s ease-in-out infinite 2s;
  }
  @keyframes floatCard1 {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-15px) rotate(1deg); }
  }
  @keyframes floatCard2 {
    0%, 100% { transform: translateY(0) rotate(1deg); }
    50% { transform: translateY(-12px) rotate(-1.5deg); }
  }
  @keyframes floatCard3 {
    0%, 100% { transform: translateY(0) rotate(2deg); }
    50% { transform: translateY(-18px) rotate(-1deg); }
  }
  .float-card-num {
    font-family: "Noto Serif SC", serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--coral-dark);
    line-height: 1;
    margin-bottom: 4px;
  }
  .float-card-label {
    font-size: 11px;
    color: var(--ink-light);
    letter-spacing: 1px;
  }

  /* Scroll indicator */
  .scroll-hint {
    position: absolute;
    bottom: 32px; left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    color: var(--ink-light);
    font-size: 11px;
    letter-spacing: 3px;
  }
  .scroll-hint-line {
    width: 1px; height: 48px;
    background: linear-gradient(180deg, transparent, var(--sand-gold), transparent);
    position: relative;
    overflow: hidden;
  }
  .scroll-hint-line::after {
    content: "";
    position: absolute;
    top: -100%; left: 0;
    width: 100%; height: 50%;
    background: var(--coral);
    animation: scrollDown 2s ease-in-out infinite;
  }
  @keyframes scrollDown {
    0% { top: -50%; }
    100% { top: 100%; }
  }

  /* ========== Wave Divider ========== */
  .wave-divider {
    position: relative;
    width: 100%;
    height: 80px;
    overflow: hidden;
  }
  .wave-divider svg {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 100%;
  }

  /* ========== Section Base ========== */
  .section {
    position: relative;
    padding: 120px 48px;
  }
  @media (max-width: 768px) {
    .section { padding: 72px 20px; }
  }
  .section-label {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    letter-spacing: 4px;
    color: var(--coral-dark);
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .section-label-line {
    width: 32px; height: 1px;
    background: var(--coral);
  }
  .section-title {
    font-family: "Noto Serif SC", serif;
    font-size: clamp(28px, 3.5vw, 44px);
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 3px;
    margin-bottom: 16px;
    line-height: 1.3;
  }
  .section-desc {
    font-size: 15px;
    color: var(--ink-soft);
    max-width: 560px;
    line-height: 1.9;
    margin-bottom: 48px;
  }

  /* Scroll reveal */
  .reveal {
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 0.8s var(--ease-out), transform 0.8s var(--ease-out);
  }
  .reveal.visible { opacity: 1; transform: translateY(0); }
  .reveal-delay-1 { transition-delay: 0.1s; }
  .reveal-delay-2 { transition-delay: 0.2s; }
  .reveal-delay-3 { transition-delay: 0.3s; }
  .reveal-delay-4 { transition-delay: 0.4s; }

  /* ========== Collection Section ========== */
  .collection-section {
    background: var(--pearl-warm);
    position: relative;
  }
  .collection-header {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 56px;
    flex-wrap: wrap;
    gap: 24px;
  }
  .collection-tabs {
    display: flex;
    gap: 8px;
    background: rgba(255, 255, 255, 0.6);
    padding: 6px;
    border-radius: 999px;
    border: 1px solid var(--line);
  }
  .tab-btn {
    padding: 10px 22px;
    font-size: 13px;
    color: var(--ink-soft);
    border-radius: 999px;
    transition: all 0.3s ease;
    letter-spacing: 1px;
  }
  .tab-btn.active {
    background: var(--ink);
    color: var(--pearl);
  }
  .tab-btn:not(.active):hover { color: var(--ink); }

  .collection-grid {
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
  }
  @media (max-width: 1024px) { .collection-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .collection-grid { grid-template-columns: 1fr; } }

  .shell-card {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    transition: all 0.5s var(--ease-spring);
    box-shadow: var(--shadow-soft);
    cursor: none;
    position: relative;
    transform-style: preserve-3d;
    perspective: 1000px;
  }
  @media (max-width: 768px) { .shell-card { cursor: pointer; } }
  .shell-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 50px rgba(45, 40, 34, 0.12);
  }
  .shell-card-img-wrap {
    position: relative;
    aspect-ratio: 4/3;
    overflow: hidden;
    background: var(--pearl-warm);
  }
  .shell-card-img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.6s var(--ease-out);
  }
  .shell-card:hover .shell-card-img { transform: scale(1.08); }
  .shell-card-glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at var(--glow-x, 50%) var(--glow-y, 50%),
                rgba(232, 133, 94, 0.15) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  .shell-card:hover .shell-card-glow { opacity: 1; }
  .shell-card-tag {
    position: absolute;
    top: 16px; left: 16px;
    padding: 4px 12px;
    background: rgba(250, 246, 238, 0.9);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 999px;
    font-size: 11px;
    color: var(--coral-dark);
    letter-spacing: 1px;
  }
  .shell-card-body { padding: 20px 22px 24px; }
  .shell-card-name {
    font-family: "Noto Serif SC", serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .shell-card-latin {
    font-size: 11px;
    font-style: italic;
    color: var(--ink-light);
    margin-bottom: 12px;
    letter-spacing: 1px;
  }
  .shell-card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--ink-light);
  }
  .shell-card-origin { display: flex; align-items: center; gap: 6px; }
  .shell-card-origin-dot {
    width: 6px; height: 6px;
    background: var(--seaweed);
    border-radius: 50%;
  }

  /* ========== Exhibition Section ========== */
  .exhibition-section {
    background: var(--ink);
    color: var(--pearl);
    position: relative;
    overflow: hidden;
  }
  .exhibition-section .section-label { color: var(--coral-light); }
  .exhibition-section .section-label-line { background: var(--coral-light); }
  .exhibition-section .section-title { color: var(--pearl); }
  .exhibition-section .section-desc { color: rgba(250, 246, 238, 0.7); }

  .exhibition-bg-texture {
    position: absolute;
    inset: 0;

        innerRef.current.style.transform =
          `translate(${targetRef.current.x}px, ${targetRef.current.y}px) translate(-50%, -50%)`;
      }
      rafRef.current = requestAnimationFrame(animate);
    };
    rafRef.current = requestAnimationFrame(animate);

    const onMove = (e) => {
      targetRef.current.x = e.clientX;
      targetRef.current.y = e.clientY;
    };

    // Hover detection via event delegation
    const onOver = (e) => {
      const el = e.target.closest("button, a, .shell-card, .exhibition-item, .ticket-option, .faq-question, .tab-btn, input, textarea");
      if (el) setHover(true);
    };
    const onOut = (e) => {
      const el = e.target.closest("button, a, .shell-card, .exhibition-item, .ticket-option, .faq-question, .tab-btn, input, textarea");
      if (el) setHover(false);
    };

    // Ripple on click
    const onClick = (e) => {
      const ripple = document.createElement("div");
      ripple.className = "cursor-ripple";
      ripple.style.left = e.clientX + "px";
      ripple.style.top = e.clientY + "px";
      document.body.appendChild(ripple);
      setTimeout(() => { ripple.remove(); }, 800);
    };

    // Visibility change
    const onVisibility = () => {
      if (document.hidden) {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      } else {
        rafRef.current = requestAnimationFrame(animate);
      }
    };

    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseover", onOver);
    window.addEventListener("mouseout", onOut);
    window.addEventListener("click", onClick);
    document.addEventListener("visibilitychange", onVisibility);

    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseover", onOver);
      window.removeEventListener("mouseout", onOut);
      window.removeEventListener("click", onClick);
      document.removeEventListener("visibilitychange", onVisibility);
    };
  }, []);

  if (prefersReducedMotion) return null;

  return (
    <>
      <div ref={outerRef} className={"cursor-outer" + (hover ? " is-hover" : "")} />
      <div ref={innerRef} className={"cursor-inner" + (hover ? " is-hover" : "")} />
    </>
  );
}

// ========== Sand Particles ==========
function SandParticles() {
  const canvasRef = useRef(null);
  const rafRef = useRef(null);
  const particlesRef = useRef([]);

  useEffect(() => {
    if (prefersReducedMotion) return;
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;

    // Create sand particles with drift
    const count = Math.min(80, Math.floor(w / 20));
    const particles = [];
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        size: Math.random() * 2.5 + 0.5,
        speedX: (Math.random() - 0.5) * 0.3,
        speedY: -Math.random() * 0.4 - 0.1,
        opacity: Math.random() * 0.5 + 0.2,
        phase: Math.random() * Math.PI * 2,
        period: Math.random() * 3 + 2,
      });
    }
    particlesRef.current = particles;

    let time = 0;
    const animate = () => {
      ctx.clearRect(0, 0, w, h);
      time += 0.016;
      for (const p of particles) {
        p.x += p.speedX + Math.sin(time * p.period + p.phase) * 0.3;
        p.y += p.speedY;
        if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
        if (p.x < -10) p.x = w + 10;
        if (p.x > w + 10) p.x = -10;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200, 169, 114, ${p.opacity})`;
        ctx.fill();
      }
      rafRef.current = requestAnimationFrame(animate);
    };
    rafRef.current = requestAnimationFrame(animate);

    const onResize = () => {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    };
    const onVisibility = () => {
      if (document.hidden) {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      } else {
        rafRef.current = requestAnimationFrame(animate);
      }
    };

    window.addEventListener("resize", onResize);
    document.addEventListener("visibilitychange", onVisibility);

    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      window.removeEventListener("resize", onResize);
      document.removeEventListener("visibilitychange", onVisibility);
    };
  }, []);

  if (prefersReducedMotion) return null;
  return <canvas id="sandCanvas" ref={canvasRef} />;
}

// ========== Scroll Reveal Hook ==========
function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll(".reveal");
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add("visible");
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
    els.forEach((el) => observer.observe(el));
    return () => observer.disconnect();
  }, []);
}

// ========== Typewriter ==========
function useTypewriter(text, speed = 60, startDelay = 500) {
  const [displayed, setDisplayed] = useState("");
  const timeoutRef = useRef(null);

  useEffect(() => {
    if (prefersReducedMotion) {
      setDisplayed(text);
      return;
    }
    let i = 0;
    setDisplayed("");
    const startT = setTimeout(() => {
      const type = () => {
        if (i < text.length) {
          setDisplayed(text.slice(0, i + 1));
          i++;
          timeoutRef.current = setTimeout(type, speed + Math.random() * 30);
        }
      };
      type();
    }, startDelay);
    return () => {
      clearTimeout(startT);
      if (timeoutRef.current) clearTimeout(timeoutRef.current);
    };
  }, [text, speed, startDelay]);

  return displayed;
}

// ========== Counter Animation ==========
function useCounter(target, duration = 2000, start = false) {
  const [value, setValue] = useState(0);
  const rafRef = useRef(null);
  const startTimeRef = useRef(null);

  useEffect(() => {
    if (!start) return;
    if (prefersReducedMotion) { setValue(target); return; }

    const easeOutExpo = (t) => t === 1 ? 1 : 1 - Math.pow(2, -10 * t);

    const animate = (timestamp) => {
      if (!startTimeRef.current) startTimeRef.current = timestamp;
      const elapsed = timestamp - startTimeRef.current;
      const progress = Math.min(elapsed / duration, 1);
      const eased = easeOutExpo(progress);
      setValue(Math.floor(eased * target));
      if (progress < 1) {
        rafRef.current = requestAnimationFrame(animate);
      }
    };
    rafRef.current = requestAnimationFrame(animate);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      startTimeRef.current = null;
    };
  }, [target, duration, start]);

  return value;
}

function ShellCard({ shell, index }) {
  const cardRef = useRef(null);
  const imgWrapRef = useRef(null);

  // Hover glow position tracking (direct DOM, no React state)
  useEffect(() => {
    if (prefersReducedMotion) return;
    const wrap = imgWrapRef.current;
    if (!wrap) return;
    const onMove = (e) => {
      const rect = wrap.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 100;
      wrap.style.setProperty("--glow-x", x + "%");
      wrap.style.setProperty("--glow-y", y + "%");
    };
    wrap.addEventListener("mousemove", onMove);
    return () => wrap.removeEventListener("mousemove", onMove);
  }, []);

  // 3D tilt
  useEffect(() => {
    if (prefersReducedMotion) return;
    const card = cardRef.current;
    if (!card) return;
    let rafId = null;
    let tx = 0, ty = 0, cx = 0, cy = 0;

    const onMove = (e) => {
      const rect = card.getBoundingClientRect();
      tx = ((e.clientX - rect.left) / rect.width - 0.5) * 8;
      ty = ((e.clientY - rect.top) / rect.height - 0.5) * -8;
    };
    const onLeave = () => { tx = 0; ty = 0; };

    const animate = () => {
      cx += (tx - cx) * 0.12;
      cy += (ty - cy) * 0.12;
      card.style.transform = `translateY(-8px) rotateX(${cy}deg) rotateY(${cx}deg)`;
      rafId = requestAnimationFrame(animate);
    };
    rafId = requestAnimationFrame(animate);

    card.addEventListener("mousemove", onMove);
    card.addEventListener("mouseleave", onLeave);
    const onVisibility = () => {
      if (document.hidden) { if (rafId) cancelAnimationFrame(rafId); }
      else { rafId = requestAnimationFrame(animate); }
    };
    document.addEventListener("visibilitychange", onVisibility);

    return () => {
      if (rafId) cancelAnimationFrame(rafId);
      card.removeEventListener("mousemove", onMove);
      card.removeEventListener("mouseleave", onLeave);
      document.removeEventListener("visibilitychange", onVisibility);
    };
  }, []);

  return (
    <div
      className={"shell-card reveal reveal-delay-" + ((index % 4) + 1)}
      ref={cardRef}
      style={{ transitionDelay: `${index * 0.08}s` }}
    >
      <div className="shell-card-img-wrap" ref={imgWrapRef}>
        <img src={shell.img} alt={shell.name} className="shell-card-img" />
        <div className="shell-card-glow"></div>
        <span className="shell-card-tag">{shell.tag}</span>
      </div>
      <div className="shell-card-body">
        <div className="shell-card-name">{shell.name}</div>
        <div className="shell-card-latin">{shell.latin}</div>
        <div className="shell-card-meta">
          <span className="shell-card-origin">
            <span className="shell-card-origin-dot"></span>
            {shell.origin}
          </span>
          <span>馆藏编号 · {String(index + 1).padStart(4, "0")}</span>
        </div>
      </div>
    </div>
  );
}

function StatItem({ target, label, sub, suffix = "" }) {
  const [start, setStart] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) { setStart(true); obs.unobserve(e.target); }
      });
    }, { threshold: 0.3 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);

  return (
    <div className="stat-item reveal" ref={ref}>
      <div className="stat-number">
        {value.toLocaleString()}{suffix}
      </div>
      <div className="stat-label">{label}</div>
      <div className="stat-sub">{sub}</div>
    </div>
  );
}

// ========== Back to Top ==========
function BackToTop() {
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const onScroll = () => setVisible(window.scrollY > 500);
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  return (
    <button
      className={"back-to-top" + (visible ? " visible" : "")}
      onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}
      aria-label="返回顶部"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    </button>
  );
}

      window.parent.postMessage({ type: "miaoda:upgrade:available", kind: "interactive-prototype" }, "*");

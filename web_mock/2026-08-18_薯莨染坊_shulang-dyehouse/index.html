<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="creative-medium" content="interactive-prototype">
<title>薯莨染坊 · 天然草木染工艺</title>
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=ZCOOL+XiaoWei&display=swap">
<style>
/* ============================================
   薯莨染坊 - 天然草木染工坊官网
   配色: 薯莨红棕 #8B3A2F / 栀子金黄 #D4A017 / 茶褐 #6B4423 / 生坯米白 #F5E6D3 / 炭黑 #1A1612
   ============================================ */

/* === CSS 变量 === */
:root {
  --dye-red: #8B3A2F;
  --dye-red-light: #A84B3D;
  --dye-red-dark: #6B2A22;
  --gardenia-gold: #D4A017;
  --gardenia-gold-light: #E8B830;
  --tea-brown: #6B4423;
  --raw-cloth: #F5E6D3;
  --raw-cloth-dark: #E8D4BC;
  --charcoal: #1A1612;
  --ink-light: rgba(26, 22, 18, 0.6);
  --ink-lighter: rgba(26, 22, 18, 0.3);
  --dye-glow: rgba(139, 58, 47, 0.35);
  --gold-glow: rgba(212, 160, 23, 0.3);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--raw-cloth);
  color: var(--charcoal);
  overflow-x: hidden;
  line-height: 1.6;
  cursor: none;
}

::selection {
  background: var(--dye-red);
  color: var(--raw-cloth);
}

/* 自定义光标 - 高优先级 */
.cursor-ring {
  position: fixed;
  top: 0;
  left: 0;
  width: 40px;
  height: 40px;
  border: 2.5px solid #ffffff;
  border-radius: 50%;
  pointer-events: none;
  z-index: 99999;
  transform: translate(-50%, -50%);
  transition: width 0.25s cubic-bezier(0.23, 1, 0.32, 1),
              height 0.25s cubic-bezier(0.23, 1, 0.32, 1),
              border-color 0.25s ease,
              opacity 0.3s ease;
  box-shadow:
    0 0 20px var(--dye-glow),
    0 0 40px rgba(139, 58, 47, 0.15),
    inset 0 0 10px rgba(255, 255, 255, 0.1);
  will-change: transform, width, height;
}

.cursor-dot {
  position: fixed;
  top: 0;
  left: 0;
  width: 8px;
  height: 8px;
  background: var(--dye-red);
  border-radius: 50%;
  pointer-events: none;
  z-index: 100000;
  transform: translate(-50%, -50%);
  box-shadow:
    0 0 10px var(--dye-glow),
    0 0 20px var(--dye-glow);
  transition: background 0.25s ease,
              width 0.2s ease,
              height 0.2s ease;
  will-change: transform;
}

.cursor-ring.hover {
  width: 60px;
  height: 60px;
  border-color: var(--gardenia-gold);
  box-shadow:
    0 0 30px var(--gold-glow),
    0 0 60px rgba(212, 160, 23, 0.2),
    inset 0 0 15px rgba(212, 160, 23, 0.15);
}

.cursor-dot.hover {
  width: 12px;
  height: 12px;
  background: var(--gardenia-gold);
  box-shadow:
    0 0 15px var(--gold-glow),
    0 0 30px var(--gold-glow);
}

.cursor-click-ripple {
  position: fixed;
  top: 0;
  left: 0;
  width: 10px;
  height: 10px;
  border: 2px solid var(--dye-red);
  border-radius: 50%;
  pointer-events: none;
  z-index: 99998;
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
  animation: cursorRipple 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
}

@keyframes cursorRipple {
  0% {
    width: 10px;
    height: 10px;
    opacity: 1;
    border-width: 3px;
  }
  100% {
    width: 80px;
    height: 80px;
    opacity: 0;
    border-width: 1px;
  }
}

/* 隐藏默认光标 */
a, button, input, textarea, select, label, .clickable {
  cursor: none;
}

/* === 导航栏 === */
.navbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  padding: 24px 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(to bottom, rgba(245, 230, 211, 0.95), rgba(245, 230, 211, 0));
  backdrop-filter: blur(0);
  transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
}

.navbar.scrolled {
  padding: 16px 48px;
  background: rgba(245, 230, 211, 0.92);
  backdrop-filter: blur(12px);
  box-shadow: 0 1px 30px rgba(107, 68, 35, 0.08);
}

.logo {
  font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
  font-size: 24px;
  font-weight: 400;
  color: var(--dye-red);
  letter-spacing: 4px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-seal {
  width: 32px;
  height: 32px;
  background: var(--dye-red);
  color: var(--raw-cloth);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  border-radius: 2px;
  transform: rotate(-3deg);
  box-shadow: 2px 2px 0 var(--tea-brown);
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 40px;
  list-style: none;
}

.nav-link {
  font-size: 15px;
  font-weight: 400;
  color: var(--charcoal);
  text-decoration: none;
  position: relative;
  padding: 4px 0;
  letter-spacing: 2px;
  transition: color 0.3s ease;
}

.nav-link::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 0;
  height: 2px;
  background: var(--dye-red);
  transition: width 0.4s cubic-bezier(0.23, 1, 0.32, 1);
  border-radius: 1px;
}

.nav-link:hover {
  color: var(--dye-red);
}

.nav-link:hover::after {
  width: 100%;
}

.nav-cta {
  padding: 10px 24px;
  background: var(--dye-red);
  color: var(--raw-cloth) !important;
  border: none;
  font-size: 14px;
  letter-spacing: 2px;
  position: relative;
  overflow: hidden;
  transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
}

.nav-cta::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 60%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
  transition: left 0.6s ease;
}

.nav-cta:hover::before {
  left: 150%;
}

.nav-cta:hover {
  background: var(--dye-red-dark);
  transform: translateY(-1px);
  box-shadow: 0 4px 20px var(--dye-glow);
}

/* 移动端菜单按钮 */
.nav-toggle {
  display: none;
  width: 32px;
  height: 32px;
  background: none;
  border: none;
  flex-direction: column;
  justify-content: center;
  gap: 6px;
  align-items: center;
}

.nav-toggle span {
  display: block;
  width: 24px;
  height: 2px;
  background: var(--charcoal);
  transition: all 0.3s ease;
}

/* === Hero 区 === */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: var(--raw-cloth);
}

/* 布料纹理背景 */
.hero-fabric {
  position: absolute;
  inset: 0;
  background-image:
    repeating-linear-gradient(0deg,
      transparent,
      transparent 2px,
      rgba(107, 68, 35, 0.03) 2px,
      rgba(107, 68, 35, 0.03) 3px
    ),
    repeating-linear-gradient(90deg,
      transparent,
      transparent 2px,
      rgba(107, 68, 35, 0.02) 2px,
      rgba(107, 68, 35, 0.02) 3px
    );
  pointer-events: none;
  z-index: 1;
}

/* 染料晕染背景 */
.hero-dye-blobs {
  position: absolute;
  inset: 0;
  z-index: 2;
  overflow: hidden;
  pointer-events: none;
}

.dye-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.4;
  animation: dyeFloat 20s ease-in-out infinite;
}

.dye-blob:nth-child(1) {
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, var(--dye-red), transparent 70%);
  top: -10%;
  left: -5%;
  animation-delay: 0s;
  animation-duration: 25s;
}

.dye-blob:nth-child(2) {
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, var(--gardenia-gold), transparent 70%);
  bottom: -15%;
  right: -5%;
  animation-delay: -8s;
  animation-duration: 22s;
}

.dye-blob:nth-child(3) {
  width: 350px;
  height: 350px;
  background: radial-gradient(circle, var(--tea-brown), transparent 70%);
  top: 40%;
  right: 20%;
  animation-delay: -12s;
  animation-duration: 28s;
  opacity: 0.25;
}

@keyframes dyeFloat {
  0%, 100% {
    transform: translate(0, 0) scale(1);
  }
  25% {
    transform: translate(30px, -20px) scale(1.05);
  }
  50% {
    transform: translate(-20px, 30px) scale(0.95);
  }
  75% {
    transform: translate(20px, 20px) scale(1.02);
  }
}

/* Hero 内容 */
.hero-content {
  position: relative;
  z-index: 10;
  text-align: center;
  max-width: 900px;
  padding: 0 40px;
}

.hero-eyebrow {
  font-size: 14px;
  letter-spacing: 8px;
  color: var(--tea-brown);
  margin-bottom: 24px;
  font-weight: 400;
  text-transform: none;
  opacity: 0;
  animation: fadeInUp 1s 0.2s forwards;
}

.hero-title {
  font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
  font-size: clamp(48px, 8vw, 100px);
  font-weight: 400;
  line-height: 1.1;
  color: var(--charcoal);
  margin-bottom: 32px;
  letter-spacing: 12px;
  opacity: 0;
  animation: fadeInUp 1s 0.5s forwards;
}

.hero-title .dye-word {
  position: relative;
  display: inline-block;
  color: var(--dye-red);
}

.hero-title .dye-word::after {
  content: '';
  position: absolute;
  bottom: 5%;
  left: -5%;
  right: -5%;
  height: 30%;
  background: linear-gradient(180deg, transparent, rgba(212, 160, 23, 0.25));
  z-index: -1;
  border-radius: 50%;
  filter: blur(8px);
  animation: dyeBleed 4s ease-in-out infinite;
}

@keyframes dyeBleed {
  0%, 100% {
    opacity: 0.5;
    transform: scaleX(1) scaleY(1);
  }
  50% {
    opacity: 0.8;
    transform: scaleX(1.1) scaleY(1.3);
  }
}

.hero-subtitle {
  font-size: 18px;
  line-height: 1.9;
  color: var(--ink-light);
  max-width: 560px;
  margin: 0 auto 48px;
  letter-spacing: 2px;
  opacity: 0;
  animation: fadeInUp 1s 0.8s forwards;
}

.hero-actions {
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
  opacity: 0;
  animation: fadeInUp 1s 1.1s forwards;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* 按钮样式 */
.btn {
  padding: 16px 36px;
  font-size: 15px;
  letter-spacing: 4px;
  font-family: 'Noto Sans SC', sans-serif;
  border: none;
  position: relative;
  overflow: hidden;
  transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

.btn-primary {
  background: var(--dye-red);
  color: var(--raw-cloth);
  box-shadow: 0 4px 20px rgba(139, 58, 47, 0.2);
}

.btn-primary:hover {
  background: var(--dye-red-dark);
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(139, 58, 47, 0.35);
}

.btn-secondary {
  background: transparent;
  color: var(--charcoal);
  border: 1.5px solid var(--tea-brown);
}

.btn-secondary:hover {
  background: var(--tea-brown);
  color: var(--raw-cloth);
  transform: translateY(-2px);
}

.btn-arrow {
  display: inline-block;
  transition: transform 0.3s ease;
}

.btn-primary:hover .btn-arrow {
  transform: translateX(4px);
}

/* Hero 底部波浪 - 布料飘动 */
.hero-wave {
  position: absolute;
  bottom: -2px;
  left: 0;
  width: 100%;
  height: 120px;
  z-index: 5;
}

.hero-wave svg {
  width: 100%;
  height: 100%;
}

/* 滚动提示 */
.scroll-hint {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  color: var(--tea-brown);
  font-size: 12px;
  letter-spacing: 4px;
  animation: scrollHintBounce 2s ease-in-out infinite;
}

.scroll-hint-line {
  width: 1px;
  height: 40px;
  background: linear-gradient(to bottom, var(--tea-brown), transparent);
  position: relative;
  overflow: hidden;
}

.scroll-hint-line::after {
  content: '';
  position: absolute;
  top: -100%;
  left: 0;
  width: 100%;
  height: 50%;
  background: var(--dye-red);
  animation: scrollHintDrop 2s ease-in-out infinite;
}

@keyframes scrollHintBounce {
  0%, 100% {
    transform: translateX(-50%) translateY(0);
  }
  50% {
    transform: translateX(-50%) translateY(6px);
  }
}

@keyframes scrollHintDrop {
  0% {
    top: -50%;
  }
  100% {
    top: 120%;
  }
}

/* === 通用节样式 === */
.section {
  position: relative;
  padding: 120px 48px;
  max-width: 1400px;
  margin: 0 auto;
}

.section-header {
  text-align: center;
  margin-bottom: 80px;
}

.section-eyebrow {
  font-size: 13px;
  letter-spacing: 6px;
  color: var(--dye-red);
  margin-bottom: 16px;
  font-weight: 500;
}

.section-title {
  font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
  font-size: clamp(32px, 5vw, 52px);
  font-weight: 400;
  color: var(--charcoal);
  letter-spacing: 6px;
  margin-bottom: 20px;
}

.section-desc {
  font-size: 16px;
  color: var(--ink-light);
  max-width: 600px;
  margin: 0 auto;
  line-height: 1.9;
  letter-spacing: 1px;
}

/* 滚动渐入 */
.reveal {
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 0.8s cubic-bezier(0.23, 1, 0.32, 1),
              transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
}

.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

/* === 工艺介绍区 === */
.craft-section {
  background: var(--raw-cloth);
  position: relative;
}

.craft-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
  align-items: center;
}

.craft-text h3 {
  font-family: 'Noto Serif SC', serif;
  font-size: 32px;
  font-weight: 600;
  color: var(--charcoal);
  margin-bottom: 24px;
  letter-spacing: 4px;
  line-height: 1.4;
}

.craft-text p {
  font-size: 16px;
  color: var(--ink-light);
  line-height: 2;
  margin-bottom: 20px;
  letter-spacing: 1px;
}

.craft-features {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-top: 32px;
}

.craft-feature {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 20px;
  background: rgba(232, 212, 188, 0.4);
  border-left: 3px solid var(--dye-red);
  transition: all 0.4s ease;
}

.craft-feature:hover {
  background: rgba(232, 212, 188, 0.7);
  transform: translateX(6px);
  box-shadow: 4px 4px 20px rgba(107, 68, 35, 0.1);
}

.craft-feature-icon {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--dye-red);
  color: var(--raw-cloth);
  font-size: 16px;
  font-weight: 700;
  border-radius: 50%;
}

.craft-feature-content h4 {
  font-size: 17px;
  font-weight: 600;
  color: var(--charcoal);
  margin-bottom: 6px;
  letter-spacing: 2px;
}

.craft-feature-content p {
  font-size: 14px;
  color: var(--ink-light);
  line-height: 1.7;
  margin: 0;
}

/* 工艺展示 - 布料悬停染透效果 */
.craft-visual {
  position: relative;
  height: 500px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.fabric-piece {
  position: relative;
  width: 380px;
  height: 420px;
  background: linear-gradient(180deg, #E8D4BC 0%, #F5E6D3 100%);
  box-shadow:
    0 20px 60px rgba(107, 68, 35, 0.2),
    inset 0 0 80px rgba(107, 68, 35, 0.08);
  overflow: hidden;
  transform: rotate(-2deg);
  transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
}

.fabric-piece:hover {
  transform: rotate(0deg) scale(1.02);
}

/* 布料纹理 */
.fabric-piece::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    repeating-linear-gradient(45deg,
      transparent,
      transparent 3px,
      rgba(107, 68, 35, 0.04) 3px,
      rgba(107, 68, 35, 0.04) 4px
    );
  pointer-events: none;
}

/* 染色渐变 - 从底部浸透 */
.fabric-dye {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 0;
  background: linear-gradient(
    180deg,
    rgba(139, 58, 47, 0.1) 0%,
    rgba(139, 58, 47, 0.5) 40%,
    var(--dye-red) 100%
  );
  transition: height 2.5s cubic-bezier(0.23, 1, 0.32, 1);
}

.fabric-piece:hover .fabric-dye {
  height: 75%;
}

/* 金色点缀 */
.fabric-gold {
  position: absolute;
  bottom: 20%;
  left: 20%;
  width: 40%;
  height: 40%;
  background: radial-gradient(circle, rgba(212, 160, 23, 0.4), transparent 70%);
  opacity: 0;
  transition: opacity 2s 0.5s ease;
  filter: blur(20px);
}

.fabric-piece:hover .fabric-gold {
  opacity: 1;
}

/* 布料上的文字 */
.fabric-label {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
  font-size: 48px;
  color: var(--tea-brown);
  letter-spacing: 16px;
  writing-mode: vertical-rl;
  z-index: 5;
  transition: color 1.5s ease;
  pointer-events: none;
}

.fabric-piece:hover .fabric-label {
  color: rgba(245, 230, 211, 0.9);
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
}

/* === 工艺流程区 === */
.process-section {
  background: var(--charcoal);
  color: var(--raw-cloth);
  position: relative;
  overflow: hidden;
}

.process-section .section-title {
  color: var(--raw-cloth);
}

.process-section .section-desc {
  color: rgba(245, 230, 211, 0.6);
}

/* 数字统计条 */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 40px;
  padding: 60px 40px;
  margin-bottom: 100px;
  border: 1px solid rgba(245, 230, 211, 0.15);
  background: rgba(245, 230, 211, 0.03);
}

.stat-item {
  text-align: center;
  position: relative;
}

.stat-item:not(:last-child)::after {
  content: '';
  position: absolute;
  right: -20px;
  top: 50%;
  transform: translateY(-50%);
  width: 1px;
  height: 60%;
  background: rgba(245, 230, 211, 0.1);
}

.stat-number {
  font-family: 'Noto Serif SC', serif;
  font-size: 48px;
  font-weight: 700;
  color: var(--gardenia-gold);
  line-height: 1;
  margin-bottom: 12px;
  letter-spacing: 2px;
}

.stat-number .unit {
  font-size: 20px;
  color: var(--dye-red-light);
  margin-left: 4px;
}

.stat-label {
  font-size: 14px;
  color: rgba(245, 230, 211, 0.6);
  letter-spacing: 3px;
}

/* 流程步骤 */
.process-steps {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 30px;
}

.process-step {
  position: relative;
  padding: 40px 32px;
  background: rgba(245, 230, 211, 0.04);
  border: 1px solid rgba(245, 230, 211, 0.1);
  transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
  transform-style: preserve-3d;
  perspective: 1000px;
}

.process-step:hover {
  background: rgba(245, 230, 211, 0.08);

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ============================================
   工具函数
   ============================================ */

// 防抖
function debounce(fn, delay) {
  let timer = null;
  return function(...args) {
    if (timer) clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), delay);
  };
}

// 节流
function throttle(fn, limit) {
  let inThrottle = false;
  return function(...args) {
    if (!inThrottle) {
      fn.apply(this, args);
      inThrottle = true;
      setTimeout(() => { inThrottle = false; }, limit);
    }
  };
}

// 数字计数动画
function animateNumber(element, target, duration = 2000, suffix = '') {
  const start = 0;
  const startTime = performance.now();

  function update(currentTime) {
    const elapsed = currentTime - startTime;
    const progress = Math.min(elapsed / duration, 1);
    // easeOutQuart
    const eased = 1 - Math.pow(1 - progress, 4);
    const value = Math.floor(start + (target - start) * eased);
    element.textContent = value + suffix;
    if (progress < 1) {
      requestAnimationFrame(update);
    }
  }
  requestAnimationFrame(update);
}

/* ============================================
   自定义光标
   ============================================ */
function initCustomCursor() {
  const ring = document.getElementById('cursorRing');
  const dot = document.getElementById('cursorDot');
  if (!ring || !dot) return;

  // 减少动画偏好检测
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isMobile = window.innerWidth <= 768;
  if (prefersReducedMotion || isMobile) {
    ring.style.display = 'none';
    dot.style.display = 'none';
    document.body.style.cursor = 'auto';
    return;
  }

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let ringX = mouseX;
  let ringY = mouseY;
  let dotX = mouseX;
  let dotY = mouseY;
  let animId = null;
  let isVisible = true;

  // 初始化位置在屏幕中央
  ring.style.left = mouseX + 'px';
  ring.style.top = mouseY + 'px';
  dot.style.left = mouseX + 'px';
  dot.style.top = mouseY + 'px';

  function animateCursor() {
    if (!isVisible) return;
    // 环形光标带延迟
    ringX += (mouseX - ringX) * 0.15;
    ringY += (mouseY - ringY) * 0.15;
    ring.style.left = ringX + 'px';
    ring.style.top = ringY + 'px';

    // 内点跟得紧一些
    dotX += (mouseX - dotX) * 0.4;
    dotY += (mouseY - dotY) * 0.4;
    dot.style.left = dotX + 'px';
    dot.style.top = dotY + 'px';

    animId = requestAnimationFrame(animateCursor);

  animateCursor();

  function handleMouseMove(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;

    const ripple = document.createElement('div');
    ripple.className = 'cursor-click-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    document.body.appendChild(ripple);
    setTimeout(() => {
      if (ripple.parentNode) ripple.parentNode.removeChild(ripple);
    }, 600);
  }

  // 悬停交互元素形态变化
  const interactiveSelectors = 'a, button, input, textarea, select, label, .clickable, .gallery-item, .process-step, .craft-feature, .booking-detail, .filter-btn, .social-icon';

  function handleMouseOver(e) {
    if (e.target.closest(interactiveSelectors)) {
      ring.classList.add('hover');
      dot.classList.add('hover');
    }
  }

  function handleMouseOut(e) {
    if (e.target.closest(interactiveSelectors)) {
      ring.classList.remove('hover');
      dot.classList.remove('hover');
    }
  }

  function handleMouseEnter() {
    isVisible = true;
    ring.style.opacity = '1';
    dot.style.opacity = '1';
    if (!animId) animateCursor();
  }

  function handleMouseLeave() {
    isVisible = false;
    ring.style.opacity = '0';
    dot.style.opacity = '0';
    if (animId) {
      cancelAnimationFrame(animId);
      animId = null;
    }
  }

  document.addEventListener('mousemove', handleMouseMove);
  document.addEventListener('click', handleClick);
  document.addEventListener('mouseover', handleMouseOver);
  document.addEventListener('mouseout', handleMouseOut);
  document.addEventListener('mouseenter', handleMouseEnter);
  document.addEventListener('mouseleave', handleMouseLeave);

  // 页面可见性变化
  function handleVisibilityChange() {
    if (document.hidden) {
      isVisible = false;
      if (animId) {
        cancelAnimationFrame(animId);
        animId = null;
      }
    } else {
      isVisible = true;
      if (!animId) animateCursor();
    }
  }
  document.addEventListener('visibilitychange', handleVisibilityChange);

  // 清理函数存储
  window._cursorCleanup = function() {
    document.removeEventListener('mousemove', handleMouseMove);
    document.removeEventListener('click', handleClick);
    document.removeEventListener('mouseover', handleMouseOver);
    document.removeEventListener('mouseout', handleMouseOut);
    document.removeEventListener('mouseenter', handleMouseEnter);
    document.removeEventListener('mouseleave', handleMouseLeave);
    document.removeEventListener('visibilitychange', handleVisibilityChange);
    if (animId) cancelAnimationFrame(animId);
  };
}

      setTypewriterText(fullText);
      return;
    }

    let index = 0;
    let timer = null;
    let isPaused = false;

    function type() {
      if (isPaused) return;
      if (index <= fullText.length) {
        setTypewriterText(fullText.slice(0, index));
        index++;
        timer = setTimeout(type, 120 + Math.random() * 80);
      }

    const startTimer = setTimeout(type, 1500);

    function handleVisibility() {
      if (document.hidden) {
        isPaused = true;
        if (timer) clearTimeout(timer);
      } else {
        isPaused = false;
        if (index <= fullText.length) type();
      }
    }
    document.addEventListener('visibilitychange', handleVisibility);

    return () => {
      clearTimeout(startTimer);

/* ============================================
   工艺流程区 - 数字计数 + 3D倾斜
   ============================================ */
function ProcessSection() {
  const statsRef = useRef(null);
  const countedRef = useRef(false);

  useEffect(() => {
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReducedMotion) {
      // 直接设置最终值
      const statEls = statsRef.current?.querySelectorAll('.stat-number-value');
      if (statEls) {
        const values = [30, 15, 12, 100];
        const units = ['道', '天', '种', '%'];
        statEls.forEach((el, i) => {
          el.textContent = values[i] + units[i];
        });
      }
      return;
    }

    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting && !countedRef.current) {
            countedRef.current = true;
            const statEls = statsRef.current.querySelectorAll('.stat-number-value');
            const values = [30, 15, 12, 100];
            statEls.forEach((el, i) => {
              animateNumber(el, values[i], 2000);
            });
          }
        });
      },
      { threshold: 0.3 }
    );

    if (statsRef.current) observer.observe(statsRef.current);
    return () => observer.disconnect();
  }, []);

  const steps = [
    { num: '壹', icon: '选', title: '选料备料', desc: '精选岭南野生薯莨，经清洗、切片、晒干，研磨成细粉。栀子、苏木等辅材亦需按节气采摘，保证染料活性。' },
    { num: '贰', icon: '煎', title: '煎煮取汁', desc: '将薯莨片置入大铁锅，以桑柴火慢熬三昼夜，取其上清汁液，过滤三次，方得纯净染料原液。' },
    { num: '叁', icon: '浸', title: '布料浸染', desc: '将生坯绸布浸入温热的染料中，反复挤压揉搓，使染料均匀渗透进每一根纤维。每次浸染后需在阴凉处晾干。' },
    { num: '肆', icon: '晒', title: '日晒氧化', desc: '浸染后的布料平摊于草地上，借日光氧化固色。阳光的温度与角度，决定了最终色泽的深浅与层次。' },
    { num: '伍', icon: '封', title: '河泥封涂', desc: '将富含铁离子的河塘泥均匀涂于布面，与薯莨单宁发生化学反应，生成深邃的黑褐色。这一步是薯莨染独有的秘技。' },
    { num: '陆', icon: '洗', title: '漂洗成品', desc: '封泥后再次浸染、晾晒，最后以清水反复漂洗，去除浮色与杂质。一匹真正的薯莨布，至此方得大成。' },
  ];

  // 3D 倾斜效果
  const stepRefs = useRef([]);

  useEffect(() => {
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReducedMotion) return;

    function handleTilt(e) {
      const step = e.currentTarget;
      const rect = step.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotateY = ((x - centerX) / centerX) * 8;
      const rotateX = ((centerY - y) / centerY) * 8;

      step.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(10px)`;
    }

    function handleTiltEnd(e) {
      e.currentTarget.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) translateZ(0)';
    }

    stepRefs.current.forEach((step) => {
      if (step) {
        step.addEventListener('mousemove', handleTilt);
        step.addEventListener('mouseleave', handleTiltEnd);
      }
    });

    return () => {
      stepRefs.current.forEach((step) => {
        if (step) {
          step.removeEventListener('mousemove', handleTilt);
          step.removeEventListener('mouseleave', handleTiltEnd);
        }
      });
    };
  }, []);

  const stats = [
    { value: 30, unit: '道', label: '传统工序' },
    { value: 15, unit: '天', label: '制作周期' },
    { value: 12, unit: '种', label: '天然染料' },
    { value: 100, unit: '%', label: '草木原料' },
  ];

  return (
    <section className="section process-section" id="process">
      <div className="section-header reveal">
        <div className="section-eyebrow" style={{ color: 'var(--gardenia-gold)' }}>染 艺 流 程</div>
        <h2 className="section-title">六道工序，织就时光</h2>
        <p className="section-desc">
          每一匹薯莨布的诞生，都要经过漫长的等待与反复的锤炼。
          从选料到成品，六道核心工序环环相扣，缺一不可。
        </p>
      </div>

      <div className="stats-bar reveal" ref={statsRef}>
        {stats.map((stat, i) => (
          <div className="stat-item" key={i}>
            <div className="stat-number">
              <span className="stat-number-value">0</span>
            </div>
            <div className="stat-label">{stat.label}</div>
          </div>
        ))}
      </div>

      <div className="process-steps">
        {steps.map((step, index) => (
          <div
            key={index}
            className="process-step reveal"
            ref={(el) => (stepRefs.current[index] = el)}
            style={{ transitionDelay: `${index * 0.1}s` }}
          >
            <div className="step-num">{step.num}</div>
            <div className="step-icon">{step.icon}</div>
            <h3 className="step-title">{step.title}</h3>
            <p className="step-desc">{step.desc}</p>
          </div>
        ))}
      </div>
    </section>
  );
}

/* ============================================
   滚动渐入观察者
   ============================================ */
function useScrollReveal() {
  useEffect(() => {
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReducedMotion) {
      document.querySelectorAll('.reveal').forEach((el) => el.classList.add('visible'));
      return;
    }

    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      },
      { threshold: 0.12, rootMargin: '0px 0px -50px 0px' }
    );

    const elements = document.querySelectorAll('.reveal');
    elements.forEach((el) => observer.observe(el));

    return () => observer.disconnect();
  }, []);
}

/* ============================================
   视差滚动 - Hero 染料晕染
   ============================================ */
function useParallax() {
  useEffect(() => {
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReducedMotion) return;

    const blobs = document.querySelectorAll('.dye-blob');
    let ticking = false;
    let isVisible = true;

    function updateParallax() {
      if (!isVisible) return;
      const scrollY = window.scrollY;
      const windowH = window.innerHeight;

      blobs.forEach((blob, index) => {
        const speed = (index + 1) * 0.08;
        const offset = scrollY * speed;
        blob.style.transform = `translateY(${offset}px)`;
      });

      ticking = false;
    }

    function handleScroll() {
      if (!ticking) {
        requestAnimationFrame(updateParallax);
        ticking = true;
      }
    }

    function handleVisibility() {
      isVisible = !document.hidden;
    }

    window.addEventListener('scroll', handleScroll, { passive: true });
    document.addEventListener('visibilitychange', handleVisibility);

    return () => {
      window.removeEventListener('scroll', handleScroll);
      document.removeEventListener('visibilitychange', handleVisibility);
    };
  }, []);
}

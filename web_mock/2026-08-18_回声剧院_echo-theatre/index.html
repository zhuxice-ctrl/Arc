<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>回声剧院 · 声音艺术现场</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@300;400;500;700&family=ZCOOL+XiaoWei&display=swap" />
<style>
  /* ===== 基础重置 ===== */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
    background: var(--bg-cream);
    color: var(--text-deep);
    overflow-x: hidden;
    cursor: none;
  }
  @media (max-width: 768px) {
    body { cursor: auto; }
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; border: none; background: none; cursor: none; }
  @media (max-width: 768px) { button { cursor: pointer; } }
  img { display: block; max-width: 100%; }
  ul { list-style: none; }

  /* ===== 设计令牌 ===== */
  :root {
    --bg-cream: #F6EFE0;
    --bg-warm: #EDE1C9;
    --bg-deep: #2A1F1A;
    --text-deep: #2A1F1A;
    --text-soft: #5C4A3D;
    --text-mute: #8B7860;
    --accent-red: #B83B2C;
    --accent-red-light: #D96B5A;
    --accent-ochre: #D4983B;
    --accent-ochre-light: #E8B96B;
    --accent-moss: #6B8E5A;
    --accent-moss-light: #8EAF7D;
    --accent-bronze: #8B6914;
    --border-line: rgba(42, 31, 26, 0.12);
    --border-strong: rgba(42, 31, 26, 0.35);
    --shadow-soft: 0 4px 24px rgba(42, 31, 26, 0.08);
    --shadow-deep: 0 12px 48px rgba(42, 31, 26, 0.18);
    --font-display: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
    --font-serif: 'Noto Serif SC', serif;
    --font-sans: 'Noto Sans SC', sans-serif;
  }

  /* ===== 自定义光标 ===== */
  .cursor-ring {
    position: fixed;
    top: 0;
    left: 0;
    width: 36px;
    height: 36px;
    border: 2px solid var(--text-deep);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                height 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                border-color 0.3s ease,
                background 0.3s ease;
    mix-blend-mode: difference;
  }
  .cursor-dot {
    position: fixed;
    top: 0;
    left: 0;
    width: 6px;
    height: 6px;
    background: var(--accent-red);
    border-radius: 50%;
    pointer-events: none;
    z-index: 10000;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px var(--accent-red), 0 0 16px rgba(184, 59, 44, 0.5);
  }
  .cursor-glow {
    position: fixed;
    top: 0;
    left: 0;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(212, 152, 59, 0.18) 0%, transparent 70%);
    filter: blur(8px);
    transition: opacity 0.3s ease;
  }
  .cursor-ring.hover {
    width: 60px;
    height: 60px;
    border-color: var(--accent-red);
    background: rgba(184, 59, 44, 0.08);
  }
  .cursor-ring.click {
    width: 28px;
    height: 28px;
  }
  .cursor-ripple {
    position: fixed;
    border: 1.5px solid var(--accent-ochre);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9997;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0.8;
    animation: rippleOut 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }
  @keyframes rippleOut {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0.8; }
    100% { transform: translate(-50%, -50%) scale(4); opacity: 0; }
  }
  @media (max-width: 768px) {
    .cursor-ring, .cursor-dot, .cursor-glow, .cursor-ripple { display: none; }
  }

  /* ===== 顶部导航 ===== */
  .nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding: 24px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.4s ease, padding 0.4s ease, box-shadow 0.4s ease;
  }
  .nav.scrolled {
    background: rgba(246, 239, 224, 0.92);
    backdrop-filter: blur(12px);
    padding: 14px 48px;
    box-shadow: 0 1px 0 var(--border-line);
  }
  .nav-logo {
    font-family: var(--font-display);
    font-size: 22px;
    letter-spacing: 4px;
    color: var(--text-deep);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-logo-mark {
    width: 28px;
    height: 28px;
    position: relative;
  }
  .nav-logo-mark svg {
    width: 100%;
    height: 100%;
  }
  .nav-links {
    display: flex;
    align-items: center;
    gap: 40px;
  }
  .nav-link {
    font-size: 14px;
    letter-spacing: 1px;
    color: var(--text-soft);
    position: relative;
    padding: 6px 0;
    transition: color 0.3s ease;
  }
  .nav-link::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 0;
    height: 1px;
    background: var(--accent-red);
    transition: width 0.3s ease, left 0.3s ease;
  }
  .nav-link:hover { color: var(--accent-red); }
  .nav-link:hover::after { width: 100%; left: 0; }
  .nav-cta {
    padding: 10px 22px;
    border: 1px solid var(--text-deep);
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--text-deep);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .nav-cta::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: var(--text-deep);
    transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: -1;
  }
  .nav-cta:hover { color: var(--bg-cream); border-color: var(--text-deep); }
  .nav-cta:hover::before { left: 0; }
  .nav-hamburger { display: none; width: 32px; height: 24px; position: relative; }
  .nav-hamburger span {
    position: absolute;
    left: 0;
    width: 100%;
    height: 2px;
    background: var(--text-deep);
    transition: all 0.3s ease;
  }
  .nav-hamburger span:nth-child(1) { top: 2px; }
  .nav-hamburger span:nth-child(2) { top: 11px; }
  .nav-hamburger span:nth-child(3) { top: 20px; }

  @media (max-width: 768px) {
    .nav { padding: 16px 20px; }
    .nav.scrolled { padding: 12px 20px; }
    .nav-links { display: none; }
    .nav-hamburger { display: block; }
  }

  /* ===== Hero ===== */
  .hero {
    min-height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 120px 48px 80px;
    overflow: hidden;
    background: var(--bg-cream);
  }
  .hero-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 900px;
  }
  .hero-eyebrow {
    font-size: 13px;
    letter-spacing: 6px;
    color: var(--accent-red);
    margin-bottom: 28px;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 1s ease 0.3s forwards;
  }
  .hero-title {
    font-family: var(--font-display);
    font-size: clamp(48px, 8vw, 120px);
    line-height: 1.1;
    color: var(--text-deep);
    letter-spacing: 8px;
    margin-bottom: 32px;
    font-weight: 400;
  }
  .hero-title-line {
    display: block;
    opacity: 0;
    transform: translateY(40px);
  }
  .hero-title-line:nth-child(1) { animation: fadeUp 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.5s forwards; }
  .hero-title-line:nth-child(2) { animation: fadeUp 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.7s forwards; }

  .hero-subtitle {
    font-size: 17px;
    line-height: 1.9;
    color: var(--text-soft);
    max-width: 560px;
    margin: 0 auto 48px;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 1s ease 1s forwards;
    min-height: 3.8em;
  }
  .hero-actions {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 1s ease 1.2s forwards;
  }
  .btn-primary {
    padding: 16px 38px;
    background: var(--accent-red);
    color: #fff;
    border-radius: 999px;
    font-size: 14px;
    letter-spacing: 3px;
    position: relative;
    overflow: hidden;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
    box-shadow: 0 4px 16px rgba(184, 59, 44, 0.3);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(184, 59, 44, 0.4);
  }
  .btn-primary::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transform: skewX(-20deg);
    animation: shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer {
    0% { left: -100%; }
    60%, 100% { left: 150%; }
  }
  .btn-ghost {
    padding: 16px 38px;
    border: 1px solid var(--border-strong);
    color: var(--text-deep);
    border-radius: 999px;
    font-size: 14px;
    letter-spacing: 3px;
    transition: all 0.3s ease;
  }
  .btn-ghost:hover {
    border-color: var(--accent-red);
    color: var(--accent-red);
  }
  .hero-scroll-hint {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    opacity: 0;
    animation: fadeUp 1s ease 1.8s forwards;
  }
  .hero-scroll-hint span {
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--text-mute);
  }
  .scroll-line {
    width: 1px;
    height: 48px;
    background: linear-gradient(to bottom, var(--accent-ochre), transparent);
    position: relative;
    overflow: hidden;
  }
  .scroll-line::after {
    content: '';
    position: absolute;
    top: -48px;
    left: 0;
    width: 100%;
    height: 48px;
    background: linear-gradient(to bottom, transparent, var(--accent-red), transparent);
    animation: scrollDown 2s ease-in-out infinite;
  }
  @keyframes scrollDown {
    0% { top: -48px; }
    100% { top: 48px; }
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 768px) {
    .hero { padding: 100px 20px 60px; }
    .hero-actions { gap: 12px; }
    .btn-primary, .btn-ghost { padding: 14px 28px; font-size: 13px; letter-spacing: 2px; }
  }

  /* ===== 通用区块 ===== */
  .section {
    padding: 120px 48px;
    position: relative;
  }
  .section-inner {
    max-width: 1280px;
    margin: 0 auto;
  }
  .section-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 64px;
    gap: 32px;
    flex-wrap: wrap;
  }
  .section-label {
    font-size: 12px;
    letter-spacing: 6px;
    color: var(--accent-red);
    margin-bottom: 16px;
  }
  .section-title {
    font-family: var(--font-display);
    font-size: clamp(32px, 4.5vw, 56px);
    color: var(--text-deep);
    letter-spacing: 4px;
    font-weight: 400;
  }
  .section-desc {
    font-size: 15px;
    line-height: 1.9;
    color: var(--text-soft);
    max-width: 420px;
  }
  @media (max-width: 768px) {
    .section { padding: 72px 20px; }
    .section-header { margin-bottom: 40px; }
  }

  /* ===== 滚动渐入 ===== */
  .reveal {
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                transform 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  .reveal.visible { opacity: 1; transform: translateY(0); }
  .reveal-delay-1 { transition-delay: 0.1s; }
  .reveal-delay-2 { transition-delay: 0.2s; }
  .reveal-delay-3 { transition-delay: 0.3s; }
  .reveal-delay-4 { transition-delay: 0.4s; }
  .reveal-delay-5 { transition-delay: 0.5s; }

  /* ===== 关于剧院 ===== */
  .about {
    background: var(--bg-warm);
    position: relative;
    overflow: hidden;
  }
  .about-grid {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 80px;
    align-items: center;
  }
  .about-text p {
    font-size: 16px;
    line-height: 2;
    color: var(--text-soft);
    margin-bottom: 20px;
  }
  .about-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    margin-top: 48px;
    padding-top: 32px;
    border-top: 1px solid var(--border-line);
  }
  .about-stat-num {
    font-family: var(--font-display);
    font-size: 44px;
    color: var(--accent-red);
    line-height: 1;
    margin-bottom: 8px;
  }
  .about-stat-label {
    font-size: 12px;
    color: var(--text-mute);
    letter-spacing: 2px;
  }
  .about-visual {
    position: relative;
    aspect-ratio: 3/4;
    border-radius: 4px;
    overflow: hidden;
    background: var(--bg-deep);
    box-shadow: var(--shadow-deep);
  }
  .about-visual img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.85;
  }
  .about-visual-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(184, 59, 44, 0.3) 0%, transparent 50%),
                linear-gradient(to top, rgba(42, 31, 26, 0.6) 0%, transparent 40%);
  }
  .about-visual-caption {
    position: absolute;
    bottom: 24px;
    left: 24px;
    right: 24px;
    color: #fff;
  }
  .about-visual-caption h4 {
    font-family: var(--font-display);
    font-size: 22px;
    letter-spacing: 2px;
    margin-bottom: 4px;
    font-weight: 400;
  }
  .about-visual-caption p {
    font-size: 12px;
    opacity: 0.7;
    letter-spacing: 1px;
  }
  @media (max-width: 768px) {
    .about-grid { grid-template-columns: 1fr; gap: 40px; }
    .about-stats { grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .about-stat-num { font-size: 28px; }
  }

  /* ===== 本季演出 ===== */
  .shows {
    background: var(--bg-cream);
  }
  .shows-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
  }
  .show-card {
    background: #fff;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: var(--shadow-soft);
    transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.5s ease;
    transform-style: preserve-3d;
    perspective: 1000px;
    position: relative;
    cursor: none;
  }
  @media (max-width: 768px) { .show-card { cursor: pointer; } }
  .show-card:hover {
    box-shadow: var(--shadow-deep);
  }
  .show-card-image {
    position: relative;
    aspect-ratio: 4/3;
    overflow: hidden;
    background: var(--bg-deep);
  }
  .show-card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  .show-card:hover .show-card-image img {
    transform: scale(1.06);
  }
  .show-card-tag {
    position: absolute;
    top: 16px;
    left: 16px;
    padding: 5px 12px;
    background: var(--accent-red);
    color: #fff;
    font-size: 11px;
    letter-spacing: 2px;
    border-radius: 999px;
  }
  .show-card-tag.ochre { background: var(--accent-ochre); }
  .show-card-tag.moss { background: var(--accent-moss); }
  .show-card-body {
    padding: 24px 24px 28px;
  }
  .show-card-date {
    font-size: 12px;
    color: var(--text-mute);
    letter-spacing: 2px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .show-card-date .dot {
    width: 4px; height: 4px;
    background: var(--accent-ochre);
    border-radius: 50%;
  }
  .show-card-title {
    font-family: var(--font-display);
    font-size: 22px;
    color: var(--text-deep);
    letter-spacing: 2px;
    margin-bottom: 10px;
    font-weight: 400;
  }
  .show-card-desc {
    font-size: 13px;
    color: var(--text-soft);
    line-height: 1.8;
    margin-bottom: 20px;
  }
  .show-card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 16px;
    border-top: 1px solid var(--border-line);
  }
  .show-card-price {
    font-size: 13px;
    color: var(--text-mute);
  }
  .show-card-price strong {
    color: var(--accent-red);
    font-size: 18px;
    font-weight: 500;
    margin-right: 2px;
  }
  .show-card-btn {
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--accent-red);
    display: flex;
    align-items: center;
    gap: 6px;
    transition: gap 0.3s ease;
  }
  .show-card:hover .show-card-btn { gap: 12px; }
  .show-card-btn svg { width: 14px; height: 14px; }

  @media (max-width: 1024px) {
    .shows-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 640px) {
    .shows-grid { grid-template-columns: 1fr; }
  }

  /* ===== 频谱条（声音可视化） ===== */
  .spectrum-bar {
    display: inline-flex;
    align-items: flex-end;
    gap: 2px;
    height: 16px;
  }
  .spectrum-bar span {
    width: 2px;
    background: currentColor;
    border-radius: 1px;
  }

  /* ===== 艺术家区块 ===== */
  .artists {
    background: var(--bg-deep);
    color: var(--bg-cream);
    position: relative;
    overflow: hidden;
  }
  .artists .section-title { color: var(--bg-cream); }
  .artists .section-desc { color: rgba(246, 239, 224, 0.6); }
  .artists-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
  }
  .artist-card {
    text-align: center;
    position: relative;
  }
  .artist-avatar {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    margin: 0 auto 20px;
    position: relative;
    overflow: hidden;
    background: rgba(246, 239, 224, 0.1);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .artist-avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .artist-avatar::after {
    content: '';
    position: absolute;
    inset: -4px;
    border: 2px solid var(--accent-ochre);
    border-radius: 50%;
    opacity: 0;
    transform: scale(0.8);
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .artist-card:hover .artist-avatar { transform: scale(1.05); }
  .artist-card:hover .artist-avatar::after {
    opacity: 1;
    transform: scale(1);
    animation: pulseRing 2s ease-out infinite;
  }
  @keyframes pulseRing {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.15); opacity: 0; }
  }
  .artist-name {
    font-family: var(--font-display);
    font-size: 20px;
    letter-spacing: 3px;
    margin-bottom: 6px;
    font-weight: 400;
  }
  .artist-role {
    font-size: 12px;
    color: var(--accent-ochre-light);
    letter-spacing: 2px;
  }
  .artist-bio {
    font-size: 13px;
    color: rgba(246, 239, 224, 0.5);
    line-height: 1.8;
    margin-top: 14px;
    max-width: 200px;
    margin-left: auto;
    margin-right: auto;
  }
  @media (max-width: 1024px) {
    .artists-grid { grid-template-columns: repeat(2, 1fr); gap: 40px 24px; }
  }
  @media (max-width: 480px) {
    .artists-grid { grid-template-columns: 1fr; }
  }

  /* ===== 声音档案 ===== */
  .archive {
    background: var(--bg-cream);
  }
  .archive-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .archive-item {
    display: grid;
    grid-template-columns: 80px 1fr 160px 100px;
    align-items: center;

<body>

<!-- 自定义光标 -->
<div class="cursor-ring" id="cursorRing"></div>
<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-glow" id="cursorGlow"></div>

<div id="root"></div>

<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ============================================================
   全局工具与动效状态
   ============================================================ */

// RAF 动画循环管理
const rafLoops = new Set();
const timers = new Set();

function addRaf(cb) {
  let rafId = null;
  const tick = (t) => {
    cb(t);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
  const entry = { stop: () => cancelAnimationFrame(rafId) };
  rafLoops.add(entry);
  return entry;
}

function addTimer(fn, delay) {
  const id = setTimeout(fn, delay);
  timers.add(id);
  return id;
}

// 页面可见性切换
let isPaused = false;
const pausedRafs = [];
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    isPaused = true;
    rafLoops.forEach(e => { e.stop(); pausedRafs.push(e); });
    rafLoops.clear();
  } else {
    isPaused = false;
    // 通知 React 组件重启
    window.dispatchEvent(new CustomEvent('raf:resume'));
  }
});

// 卸载清理
window.addEventListener('beforeunload', () => {
  rafLoops.forEach(e => e.stop());
  rafLoops.clear();
  timers.forEach(id => clearTimeout(id));
  timers.clear();
});

const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============================================================
   自定义光标（纯 DOM，零 React state）
   ============================================================ */

function initCursor() {
  if (prefersReducedMotion || window.innerWidth <= 768) return;

  const ring = document.getElementById('cursorRing');
  const dot = document.getElementById('cursorDot');
  const glow = document.getElementById('cursorGlow');
  if (!ring || !dot || !glow) return;

  // 初始位置：屏幕中央
  const centerX = window.innerWidth / 2;
  const centerY = window.innerHeight / 2;
  ring.style.transform = `translate(${centerX}px, ${centerY}px) translate(-50%, -50%)`;
  dot.style.transform = `translate(${centerX}px, ${centerY}px) translate(-50%, -50%)`;
  glow.style.transform = `translate(${centerX}px, ${centerY}px) translate(-50%, -50%)`;

  // 鼠标位置（目标）
  let mx = centerX, my = centerY;
  // 实际渲染位置（带阻尼）
  let rx = centerX, ry = centerY;
  let gx = centerX, gy = centerY;

  // 弹簧系数
  const RING_DAMPING = 0.15;   // 环跟得稍慢
  const DOT_DAMPING = 0.4;     // 点跟得快
  const GLOW_DAMPING = 0.06;   // 光晕最慢

  const handleMove = (e) => {
    mx = e.clientX;
    my = e.clientY;
  };

  let rafEntry = null;
  const startLoop = () => {
    if (rafEntry) return;
    rafEntry = addRaf(() => {
      // ring: 阻尼跟随
      rx += (mx - rx) * RING_DAMPING;
      ry += (my - ry) * RING_DAMPING;
      ring.style.transform = `translate(${rx}px, ${ry}px) translate(-50%, -50%)`;

      // dot: 几乎即时
      rx += (mx - rx) * 0; // noop
      // 用独立变量
      // 重新计算 dot
      dot.style.transform = `translate(${mx - (mx - rx) * 0.5}px, ${my - (my - ry) * 0.5}px) translate(-50%, -50%)`;
      // 简化：dot 直接跟随鼠标
      dot.style.transform = `translate(${mx}px, ${my}px) translate(-50%, -50%)`;

      // glow: 大阻尼
      gx += (mx - gx) * GLOW_DAMPING;
      gy += (my - gy) * GLOW_DAMPING;
      glow.style.transform = `translate(${gx}px, ${gy}px) translate(-50%, -50%)`;
    });
  };

  // 悬停交互
  const handleOver = (e) => {
    const target = e.target.closest('a, button, [role="button"], .show-card, .archive-item, .artist-card, .workshop-tab');
    if (target) {
      ring.classList.add('hover');
    } else {
      ring.classList.remove('hover');
    }
  };

  // 点击涟漪
  const handleClick = (e) => {
    ring.classList.add('click');
    setTimeout(() => ring.classList.remove('click'), 200);

    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 800);
  };

  window.addEventListener('mousemove', handleMove);
  window.addEventListener('mouseover', handleOver);
  window.addEventListener('click', handleClick);

  startLoop();

  // 可见性恢复时重启
  window.addEventListener('raf:resume', () => {
    rafEntry = null;
    startLoop();
  });
}

/* ============================================================
   Hero 粒子声场（Canvas）
   ============================================================ */

function SoundParticles() {
  const canvasRef = useRef(null);

  useEffect(() => {
    if (prefersReducedMotion) return;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    let w, h;
    let particles = [];
    let mouseX = 0, mouseY = 0;
    let rafEntry = null;
    let time = 0;

    const resize = () => {
      const rect = canvas.parentElement.getBoundingClientRect();
      w = canvas.width = rect.width * window.devicePixelRatio;
      h = canvas.height = rect.height * window.devicePixelRatio;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      initParticles();
    };

    const initParticles = () => {
      particles = [];
      const count = Math.floor((w * h) / 18000);
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * (w / window.devicePixelRatio),
          y: Math.random() * (h / window.devicePixelRatio),
          baseRadius: 1 + Math.random() * 2,
          radius: 1 + Math.random() * 2,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          opacity: 0.2 + Math.random() * 0.4,
          phase: Math.random() * Math.PI * 2,
          freq: 0.5 + Math.random() * 1.5, // 每个粒子独立频率
        });
      }
    };

    const handleMouse = (e) => {
      const rect = canvas.getBoundingClientRect();
      mouseX = e.clientX - rect.left;
      mouseY = e.clientY - rect.top;
    };

    const tick = () => {
      time += 0.016;
      const W = w / window.devicePixelRatio;
      const H = h / window.devicePixelRatio;
      ctx.clearRect(0, 0, W, H);

      // 绘制连接线
      ctx.lineWidth = 0.5;

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];

        // 鼠标引力（反平方）
        const dx = mouseX - p.x;
        const dy = mouseY - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const maxDist = 150;

        if (dist < maxDist && dist > 1) {
          const force = (1 - dist / maxDist) * 0.8;
          p.vx += (dx / dist) * force * 0.05;
          p.vy += (dy / dist) * force * 0.05;
        }

        // 声波呼吸
        p.radius = p.baseRadius + Math.sin(time * p.freq + p.phase) * p.baseRadius * 0.8;

        // 速度阻尼（摩擦）
        p.vx *= 0.98;
        p.vy *= 0.98;

        p.x += p.vx;
        p.y += p.vy;

        // 边界反弹
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;
        p.x = Math.max(0, Math.min(W, p.x));
        p.y = Math.max(0, Math.min(H, p.y));

        // 绘制粒子
        const opacity = p.opacity + Math.sin(time * p.freq + p.phase) * 0.15;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(184, 59, 44, ${Math.max(0.1, Math.min(0.7, opacity))})`;
        ctx.fill();
      }

      // 临近粒子连线（声音传播感）
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const p1 = particles[i];
          const p2 = particles[j];
          const dx = p1.x - p2.x;
          const dy = p1.y - p2.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 90) {
            const alpha = (1 - dist / 90) * 0.15;
            ctx.strokeStyle = `rgba(212, 152, 59, ${alpha})`;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          }
        }
      }
    };

    const startLoop = () => {
      if (rafEntry) return;
      rafEntry = addRaf(tick);
    };

    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', handleMouse);
    startLoop();

    window.addEventListener('raf:resume', () => {
      rafEntry = null;
      startLoop();
    });

    return () => {
      window.removeEventListener('resize', resize);
      window.removeEventListener('mousemove', handleMouse);
      if (rafEntry) { rafEntry.stop(); rafLoops.delete(rafEntry); }
    };
  }, []);

  return <canvas ref={canvasRef} className="hero-canvas" />;
}

/* ============================================================
   打字机效果
   ============================================================ */

function Typewriter({ text, speed = 60, delay = 1000, className = '' }) {
  const [displayed, setDisplayed] = useState('');
  const [showCursor, setShowCursor] = useState(true);
  const textRef = useRef(text);
  const charIndexRef = useRef(0);
  const timerRef = useRef(null);

  useEffect(() => {
    if (prefersReducedMotion) {
      setDisplayed(text);
      return;
    }
    let startTimer = null;
    startTimer = setTimeout(() => {
      const typeNext = () => {
        if (charIndexRef.current < text.length) {
          charIndexRef.current++;
          setDisplayed(text.slice(0, charIndexRef.current));
          // 每个字符随机速度（模拟真实打字节奏）
          const randomSpeed = speed * (0.6 + Math.random() * 0.8);
          timerRef.current = setTimeout(typeNext, randomSpeed);
          timers.add(timerRef.current);
        }
      };
      typeNext();
    }, delay);
    timers.add(startTimer);

    // 光标闪烁
    const cursorInterval = setInterval(() => {
      setShowCursor(s => !s);
    }, 530);

    return () => {
      clearTimeout(startTimer);
      clearTimeout(timerRef.current);
      clearInterval(cursorInterval);
      timers.delete(startTimer);
      timers.delete(timerRef.current);
    };
  }, [text, speed, delay]);

  return (
    <span className={className}>
      {displayed}
      <span style={{
        opacity: showCursor ? 1 : 0,
        transition: 'opacity 0.1s ease',
        color: 'var(--accent-red)',
        fontWeight: '300',
        marginLeft: '2px',
      }}>|</span>
    </span>
  );
}

/* ============================================================
   数字计数
   ============================================================ */

function CountUp({ end, duration = 2000, suffix = '', prefix = '', className = '' }) {
  const ref = useRef(null);
  const [count, setCount] = useState(0);
  const startedRef = useRef(false);

  useEffect(() => {
    if (prefersReducedMotion) {
      setCount(end);
      return;
    }
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !startedRef.current) {
          startedRef.current = true;
          const startTime = performance.now();
          const startVal = 0;
          const animate = (now) => {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            // 缓出效果
            const eased = 1 - Math.pow(1 - progress, 3);
            setCount(Math.floor(startVal + (end - startVal) * eased));
            if (progress < 1) {
              const id = requestAnimationFrame(animate);
              timers.add(id);
            }
          };
          const id = requestAnimationFrame(animate);
          timers.add(id);
        }
      });
    }, { threshold: 0.5 });

    if (ref.current) observer.observe(ref.current);
    return () => observer.disconnect();
  }, [end, duration]);

  return (
    <span ref={ref} className={className}>
      {prefix}{count}{suffix}
    </span>
  );
}

/* ============================================================
   3D 倾斜卡片（纯 DOM 操作，零 setState）
   ============================================================ */

function TiltCard({ children, className = '', maxTilt = 8 }) {
  const cardRef = useRef(null);

  useEffect(() => {
    if (prefersReducedMotion || window.innerWidth <= 768) return;
    const card = cardRef.current;
    if (!card) return;

    let rafId = null;
    let targetX = 0, targetY = 0;
    let currentX = 0, currentY = 0;
    let isHovering = false;

    const handleMove = (e) => {
      if (!isHovering) return;
      const rect = card.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      targetX = y * -maxTilt;
      targetY = x * maxTilt;
    };

    const handleEnter = () => {
      isHovering = true;
    };

    const handleLeave = () => {
      isHovering = false;
      targetX = 0;
      targetY = 0;
    };

    const tick = () => {
      // 弹簧阻尼
      const damping = 0.12;
      currentX += (targetX - currentX) * damping;
      currentY += (targetY - currentY) * damping;

      card.style.transform = `perspective(1000px) rotateX(${currentX}deg) rotateY(${currentY}deg) translateY(${isHovering ? -6 : 0}px)`;
      card.style.transition = 'box-shadow 0.5s ease';

      rafId = requestAnimationFrame(tick);
    };

    card.addEventListener('mousemove', handleMove);
    card.addEventListener('mouseenter', handleEnter);
    card.addEventListener('mouseleave', handleLeave);

    rafId = requestAnimationFrame(tick);
    timers.add(rafId);

    return () => {
      card.removeEventListener('mousemove', handleMove);
      card.removeEventListener('mouseenter', handleEnter);
      card.removeEventListener('mouseleave', handleLeave);
      cancelAnimationFrame(rafId);
      timers.delete(rafId);
    };
  }, [maxTilt]);

  return (
    <div ref={cardRef} className={className} style={{ transformStyle: 'preserve-3d' }}>
      {children}
    </div>
  );
}

/* ============================================================
   滚动渐入 Hook
   ============================================================ */

function useReveal() {
  useEffect(() => {
    const elements = document.querySelectorAll('.reveal:not(.visible)');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });

    elements.forEach(el => observer.observe(el));
    return () => observer.disconnect();
  }, []);
}

/* ============================================================
   视差滚动（纯 DOM）
   ============================================================ */

function useParallax() {
  useEffect(() => {
    if (prefersReducedMotion) return;
    const elements = document.querySelectorAll('[data-parallax]');
    let ticking = false;

    const update = () => {
      const scrollY = window.scrollY;
      elements.forEach(el => {
        const speed = parseFloat(el.dataset.parallax) || 0.3;
        const rect = el.getBoundingClientRect();
        const offset = (rect.top + scrollY) - scrollY;
        const translateY = (scrollY - offset + window.innerHeight) * speed * 0.1;
        el.style.transform = `translateY(${translateY}px)`;
      });
      ticking = false;
    };

    const onScroll = () => {
      if (!ticking) {
        requestAnimationFrame(update);
        ticking = true;
      }
    };

    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
}

/* ============================================================
   导航栏滚动状态
   ============================================================ */

function useNavScroll() {
  useEffect(() => {
    const nav = document.querySelector('.nav');
    if (!nav) return;
    let ticking = false;

    const onScroll = () => {
      if (!ticking) {
        requestAnimationFrame(() => {
          if (window.scrollY > 60) {
            nav.classList.add('scrolled');
          } else {
            nav.classList.remove('scrolled');
          }
          ticking = false;
        });
        ticking = true;
      }
    };

    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
}

/* ============================================================
   涟漪按钮点击（事件委托）
   ============================================================ */

function useRippleEffect() {
  useEffect(() => {
    if (prefersReducedMotion) return;
    const handleClick = (e) => {
      const btn = e.target.closest('.btn-primary, .btn-ghost, .nav-cta, .visit-btn, .show-card-btn');
      if (!btn) return;

      const rect = btn.getBoundingClientRect();
      const ripple = document.createElement('span');
      const size = Math.max(rect.width, rect.height);
      const x = e.clientX - rect.left - size / 2;
      const y = e.clientY - rect.top - size / 2;

      ripple.style.cssText = `
        position: absolute;
        width: ${size}px;
        height: ${size}px;
        left: ${x}px;
        top: ${y}px;
        background: rgba(255, 255, 255, 0.4);
        border-radius: 50%;
        transform: scale(0);
        pointer-events: none;
        animation: rippleScale 0.6s ease-out forwards;
        z-index: 1;
      `;

      const oldPos = getComputedStyle(btn).position;
      if (oldPos === 'static') btn.style.position = 'relative';
      btn.style.overflow = 'hidden';
      btn.appendChild(ripple);

      setTimeout(() => ripple.remove(), 600);
    };

    // 添加全局 keyframes
    if (!document.getElementById('ripple-kf')) {
      const style = document.createElement('style');
      style.id = 'ripple-kf';
      style.textContent = `
        @keyframes rippleScale {
          to { transform: scale(2.5); opacity: 0; }
        }
      `;
      document.head.appendChild(style);
    }

    document.addEventListener('click', handleClick);
    return () => document.removeEventListener('click', handleClick);
  }, []);
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>潮间带·潮汐生物图鉴</title>
<meta name="creative-medium" content="interactive-prototype">
<style>
/* ============================================================
   潮间带·潮汐生物图鉴 — Design DNA
   核心概念：垂直潮位水尺为全站唯一导航轴，拖动水位线逐层显露潮间带生物
   视觉来源：礁石海岸剖面 · 潮汐水位尺 · 田野调查档案
   色彩逻辑：礁石褐 / 海藻绿 / 海水青 / 沙黄 — 源自真实潮间带材质
   空间逻辑：剖面式，上为海岸高处，下为潮下深水
   ============================================================ */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  /* 礁石褐 — 岩石基底 */
  --reef-900: #2D1F14;
  --reef-800: #3D2B1C;
  --reef-700: #4A3728;
  --reef-600: #6B5344;
  --reef-500: #8B7355;
  --reef-400: #A89070;

  /* 海藻绿 — 植被色 */
  --kelp-900: #2A3A1F;
  --kelp-800: #3D5A3F;
  --kelp-700: #537050;
  --kelp-600: #6B8B5C;
  --kelp-500: #86A068;

  /* 海水青 — 水体色 */
  --sea-900: #1A302F;
  --sea-800: #2D5A5C;
  --sea-700: #3E7370;
  --sea-600: #4A8B8A;
  --sea-500: #6BA3A0;
  --sea-400: #8EBCBA;
  --sea-300: #B5D5D4;

  /* 沙黄 — 滩涂/干燥区 */
  --sand-700: #8B7D4A;
  --sand-600: #A8965A;
  --sand-500: #C4B170;
  --sand-400: #D9C98A;
  --sand-300: #E8DCAB;

  /* 墨水 */
  --ink: #1A1410;
  --ink-soft: #3A2F24;
  --paper: #F2EBDC;
  --paper-dark: #E8DDC7;

  --gauge-width: 72px;
  --panel-width: 340px;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  color: var(--ink);
  background: var(--paper);
  user-select: none;
  -webkit-user-select: none;
}

body { cursor: none; }

/* 自定义光标 */
.cursor {
  position: fixed;
  width: 18px;
  height: 22px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 9999;
  transition: transform 0.18s cubic-bezier(0.23, 1, 0.32, 1), width 0.25s ease, height 0.25s ease;
}
.cursor::before {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--ink);
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  transform: rotate(180deg);
  transition: background 0.2s ease;
}
.cursor::after {
  content: "";
  position: absolute;
  top: 40%;
  left: 50%;
  width: 5px;
  height: 5px;
  transform: translateX(-50%);
  background: var(--paper);
  border-radius: 50%;
}
.cursor.drag {
  width: 22px;
  height: 28px;
  transform: translate(-50%, -50%) scale(1.1);
}
.cursor.drag::before {
  background: var(--sea-600);
}
.cursor.click {
  width: 14px;
  height: 16px;
}

/* 舞台 */
.stage {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: linear-gradient(180deg, var(--sand-300) 0%, var(--sand-400) 15%, var(--reef-400) 40%, var(--reef-600) 65%, var(--reef-700) 80%, var(--sea-800) 100%);
}

/* ————— 背景礁石剖面 ————— */
.reef-profile {
  position: absolute;
  right: 0;
  top: 0;
  width: calc(100% - var(--gauge-width) - 180px);
  height: 100%;
  pointer-events: none;
  z-index: 1;
}
.reef-profile svg {
  width: 100%;
  height: 100%;
}

/* ————— 水体 ————— */
.water-body {
  position: absolute;
  left: var(--gauge-width);
  right: 0;
  bottom: 0;
  height: 65%;
  background: linear-gradient(180deg,
    rgba(107, 163, 160, 0.55) 0%,
    rgba(74, 139, 138, 0.7) 15%,
    rgba(45, 90, 92, 0.85) 45%,
    rgba(26, 48, 47, 0.95) 100%);
  z-index: 5;
  pointer-events: none;
  transition: height 0.35s cubic-bezier(0.23, 1, 0.32, 1), background 0.6s ease;
}
.water-body::before {
  content: "";
  position: absolute;
  top: -3px;
  left: 0;
  right: 0;
  height: 8px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(181, 213, 212, 0.6) 20%,
    rgba(181, 213, 212, 0.8) 50%,
    rgba(181, 213, 212, 0.6) 80%,
    transparent 100%);
  animation: waterRipple 3.5s ease-in-out infinite;
}
@keyframes waterRipple {
  0%, 100% { opacity: 0.5; transform: translateX(0); }
  50% { opacity: 1; transform: translateX(20px); }
}

/* 水面波纹（装饰条） */
.water-sheen {
  position: absolute;
  width: 100%;
  height: 30px;
  top: 0;
  left: 0;
  pointer-events: none;
}
.water-sheen span {
  position: absolute;
  height: 1px;
  background: rgba(255,255,255,0.3);
  top: 8px;
  animation: sheenDrift 6s linear infinite;
}

@keyframes sheenDrift {
  0% { transform: translateX(-30px); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateX(60px); opacity: 0; }
}

/* ————— 水位尺（左侧） ————— */
.gauge {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--gauge-width);
  height: 100%;
  background: var(--paper);
  border-right: 1px solid var(--reef-400);
  z-index: 20;
  box-shadow: 2px 0 12px rgba(45, 31, 20, 0.08);
}
.gauge-title {
  position: absolute;
  top: 28px;
  left: 50%;
  transform: translateX(-50%) rotate(180deg);
  writing-mode: vertical-rl;
  font-size: 12px;
  letter-spacing: 4px;
  color: var(--reef-600);
  font-weight: 500;
  white-space: nowrap;
}
.gauge-ruler {
  position: absolute;
  left: 20px;
  top: 60px;
  bottom: 30px;
  width: 1px;
  background: var(--reef-500);
}
.gauge-tick {
  position: absolute;
  left: 0;
  width: 8px;
  height: 1px;
  background: var(--reef-500);
  font-size: 9px;
  color: var(--reef-600);
  line-height: 1;
}
.gauge-tick.major {
  width: 14px;
  left: -6px;
  height: 1px;
}
.gauge-tick.major span {
  position: absolute;
  right: 18px;
  top: -5px;
  font-size: 10px;
  color: var(--reef-600);
  font-family: "SFMono-Regular", "Consolas", monospace;
  width: 30px;
  text-align: right;
}

/* 潮带分区标签 */
.zone-markers {
  position: absolute;
  left: var(--gauge-width);
  top: 0;
  width: 140px;
  height: 100%;
  z-index: 15;
  pointer-events: none;
}
.zone-marker {
  position: absolute;
  left: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--ink-soft);
  writing-mode: vertical-rl;
  letter-spacing: 2px;
  font-weight: 500;
  opacity: 0.6;
  transition: opacity 0.4s ease, color 0.4s ease;
}
.zone-marker::before {
  content: "";
  width: 36px;
  height: 1px;
  background: currentColor;
}
.zone-marker.active { opacity: 1; }
.zone-marker.high-zone { top: 12%; color: var(--sand-700); }
.zone-marker.mid-zone { top: 35%; color: var(--kelp-800); }
.zone-marker.low-zone { top: 58%; color: var(--sea-700); }
.zone-marker.sub-zone { top: 82%; color: var(--sea-800); }

/* ————— 水位线（可拖拽） ————— */
.water-line {
  position: absolute;
  left: 0;
  width: 100%;
  height: 3px;
  top: 35%;
  z-index: 50;
  pointer-events: none;
}
.water-line-track {
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 1px;
  background: var(--sea-600);
  opacity: 0.5;
  transform: translateY(-50%);
}
.water-line-handle {
  position: absolute;
  left: calc(var(--gauge-width) - 4px);
  top: 50%;
  transform: translateY(-50%);
  width: 180px;
  height: 42px;
  background: var(--sea-600);
  color: var(--paper);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 13px;
  letter-spacing: 3px;
  font-weight: 500;
  pointer-events: auto;
  cursor: none;
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%);
  transition: background 0.2s ease, width 0.2s ease;
}
.water-line-handle:hover {
  background: var(--sea-700);
  width: 200px;
}
.water-line-handle.dragging {
  background: var(--sea-800);
  width: 200px;
}
.water-line-handle .drag-hint {
  font-size: 10px;
  opacity: 0.8;
  letter-spacing: 1px;
}
.water-line-handle .level-num {
  font-family: "SFMono-Regular", "Consolas", monospace;
  font-size: 12px;
  letter-spacing: 1px;
  background: rgba(255,255,255,0.2);
  padding: 2px 8px;
  border-radius: 2px;
}

/* ————— 潮带区域 & 生物 ————— */
.creatures-layer {
  position: absolute;
  left: calc(var(--gauge-width) + 160px);
  right: 60px;
  top: 0;
  bottom: 0;
  z-index: 10;
}
.creature {
  position: absolute;
  cursor: none;
  pointer-events: auto;
  transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), filter 0.8s ease;
  transform-origin: center bottom;
  z-index: 2;
}
.creature svg {
  display: block;
  transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1);
}
.creature:hover svg {
  transform: scale(1.08);
}
.creature-label {
  position: absolute;
  bottom: -22px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: var(--ink-soft);
  white-space: nowrap;
  letter-spacing: 0.5px;
  opacity: 0;
  transition: opacity 0.3s ease, transform 0.3s ease;
  background: rgba(242, 235, 220, 0.9);
  padding: 3px 8px;
  border-radius: 3px;
}
.creature:hover .creature-label {
  opacity: 1;
  transform: translateX(-50%) translateY(-2px);
}

/* 被淹没状态 */
.creature.submerged {
  opacity: 0 !important;
  transform: translateY(12px) scale(0.95);
  pointer-events: none;
}

/* 生物浮现动画 */
@keyframes emerge {
  0% { opacity: 0; transform: translateY(16px) scale(0.92); }
  60% { opacity: 1; transform: translateY(-2px) scale(1.02); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
.creature.visible-anim {
  animation: emerge 0.8s cubic-bezier(0.23, 1, 0.32, 1) both;
}

/* ——— 各生物独立动效 ——— */
/* 海葵触手摆动 */
.creature.anemone svg .tentacle {
  transform-origin: bottom center;
  animation: tentacleSway 4s ease-in-out infinite;
}
.creature.anemone svg .tentacle:nth-child(2) { animation-delay: 0.4s; }
.creature.anemone svg .tentacle:nth-child(3) { animation-delay: 0.8s; }
.creature.anemone svg .tentacle:nth-child(4) { animation-delay: 1.2s; }
.creature.anemone svg .tentacle:nth-child(5) { animation-delay: 1.6s; }
@keyframes tentacleSway {
  0%, 100% { transform: rotate(-4deg); }
  50% { transform: rotate(4deg); }
}

/* 海藻摆动 */
.creature.kelp svg .frond {
  transform-origin: bottom center;
  animation: kelpSway 5s ease-in-out infinite;
}
.creature.kelp svg .frond:nth-child(2) { animation-delay: -1s; }
.creature.kelp svg .frond:nth-child(3) { animation-delay: -2s; }
.creature.kelp svg .frond:nth-child(4) { animation-delay: -3s; }
@keyframes kelpSway {
  0%, 100% { transform: skewX(-3deg); }
  50% { transform: skewX(5deg); }
}

/* 海星缓慢旋转漂浮 */
.creature.seastar svg {
  animation: seastarPulse 6s ease-in-out infinite;
}
@keyframes seastarPulse {
  0%, 100% { transform: rotate(-3deg) scale(1); }
  50% { transform: rotate(3deg) scale(1.04); }
}

/* 海胆刺微动 */
.creature.urchin svg .spine {
  transform-origin: center;
  animation: spineWiggle 2.5s ease-in-out infinite;
}
.creature.urchin svg .spine:nth-child(odd) { animation-delay: -0.5s; }
@keyframes spineWiggle {
  0%, 100% { transform: scaleY(1); }
  50% { transform: scaleY(1.1); }
}

/* 螺缓慢爬动 */
.creature.snail svg {
  animation: snailCrawl 8s ease-in-out infinite;
}
@keyframes snailCrawl {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(8px); }
}

/* 珊瑚藻闪烁 */
.creature.coralline svg {
  animation: corallineGlimmer 5s ease-in-out infinite;
}
@keyframes corallineGlimmer {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.75; }
}

/* 海参缓慢伸缩 */
.creature.seacuke svg {
  animation: seacukeBreathe 7s ease-in-out infinite;
  transform-origin: center;
}
@keyframes seacukeBreathe {
  0%, 100% { transform: scaleX(1) scaleY(1); }
  50% { transform: scaleX(1.05) scaleY(0.95); }
}

/* 鱼游动 */
.creature.fish svg {
  animation: fishSwim 10s ease-in-out infinite;
}
@keyframes fishSwim {
  0%, 100% { transform: translateX(0) scaleX(1); }
  49% { transform: translateX(40px) scaleX(1); }
  50% { transform: translateX(40px) scaleX(-1); }
  99% { transform: translateX(0) scaleX(-1); }
  100% { transform: translateX(0) scaleX(1); }
}

/* 藤壶开合 */
.creature.barnacle svg .operculum {
  transform-origin: center;
  animation: barnacleOpen 4s ease-in-out infinite;
}
@keyframes barnacleOpen {
  0%, 40%, 100% { transform: scaleY(1); }
  50%, 90% { transform: scaleY(0.3); }
}

/* 牡蛎开合 */
.creature.oyster svg .valve {
  transform-origin: bottom left;
  animation: oysterOpen 5s ease-in-out infinite;
}
@keyframes oysterOpen {
  0%, 30%, 100% { transform: rotate(0deg); }
  50%, 80% { transform: rotate(-8deg); }
}

/* 石鳖缓慢移动 */
.creature.chiton svg {
  animation: chitonGlide 9s ease-in-out infinite;
}
@keyframes chitonGlide {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(6px); }
}

/* 海蟑螂疾走 */
.creature.ligia svg {
  animation: ligiaScurry 3s steps(2) infinite;
}
@keyframes ligiaScurry {
  0%, 100% { transform: translateX(0) rotate(0); }
  25% { transform: translateX(4px) rotate(-2deg); }
  50% { transform: translateX(8px) rotate(0); }
  75% { transform: translateX(4px) rotate(2deg); }
}

/* 石花菜摆动 */
.creature.gelidium svg .blade {
  transform-origin: bottom center;
  animation: gelidiumWave 4.5s ease-in-out infinite;
}
.creature.gelidium svg .blade:nth-child(2) { animation-delay: -1.5s; }
.creature.gelidium svg .blade:nth-child(3) { animation-delay: -3s; }
@keyframes gelidiumWave {
  0%, 100% { transform: rotate(-5deg); }
  50% { transform: rotate(5deg); }
}

/* ————— 标题区 ————— */
.site-title {
  position: absolute;
  right: 40px;
  top: 32px;
  z-index: 30;
  text-align: right;
  pointer-events: none;
}
.site-title h1 {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 6px;
  color: var(--reef-900);
  margin-bottom: 6px;
}
.site-title .subtitle {
  font-size: 12px;
  color: var(--reef-600);
  letter-spacing: 2px;
}
.site-title .tide-now {
  margin-top: 12px;
  font-size: 11px;
  color: var(--sea-800);
  letter-spacing: 1.5px;
  font-family: "SFMono-Regular", "Consolas", monospace;
}

/* ————— 底部信息 ————— */
.site-foot {
  position: absolute;
  left: calc(var(--gauge-width) + 20px);
  bottom: 20px;
  z-index: 30;
  font-size: 10px;
  color: var(--reef-500);
  letter-spacing: 1px;
  pointer-events: none;
}
.site-foot .creature-count {
  font-family: "SFMono-Regular", "Consolas", monospace;
  color: var(--kelp-800);
  font-weight: 600;
}

/* ————— 详情面板 ————— */
.detail-panel {
  position: absolute;
  right: 0;
  top: 0;
  width: var(--panel-width);
  height: 100%;
  background: var(--paper);
  border-left: 1px solid var(--reef-400);
  z-index: 60;
  transform: translateX(100%);
  transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
  padding: 48px 32px 32px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  box-shadow: -6px 0 24px rgba(45, 31, 20, 0.1);
}
.detail-panel.open {
  transform: translateX(0);
}
.detail-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 32px;
  height: 32px;
  border: 1px solid var(--reef-400);
  background: transparent;
  color: var(--reef-700);
  font-size: 18px;
  cursor: none;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s ease, color 0.2s ease;
}
.detail-close:hover {
  background: var(--reef-700);
  color: var(--paper);
}

.detail-illustration {
  width: 100%;
  aspect-ratio: 1;
  background: var(--paper-dark);
  border: 1px solid var(--reef-400);
  display: flex;
  align-items: center;
  justify-content: center;
}
.detail-illustration svg {
  width: 70%;
  height: 70%;
}

.detail-name {
  font-size: 20px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: 2px;
  margin-bottom: 2px;
}
.detail-latin {
  font-size: 12px;
  font-style: italic;
  color: var(--reef-600);
  letter-spacing: 0.5px;
}
.detail-zone-badge {
  display: inline-block;
  padding: 4px 12px;
  font-size: 11px;
  letter-spacing: 2px;
  border: 1px solid var(--kelp-700);
  color: var(--kelp-800);
  width: fit-content;
}

.detail-section {
  border-top: 1px solid var(--reef-400);
  padding-top: 16px;
}
.detail-section-title {
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--reef-600);
  margin-bottom: 8px;
}
.detail-section p {
  font-size: 13px;
  line-height: 1.7;
  color: var(--ink-soft);
}
.detail-facts {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 6px 14px;
  font-size: 12px;
}
.detail-facts dt {
  color: var(--reef-600);
}
.detail-facts dd {
  color: var(--ink-soft);
}

/* ————— 顶部图例 ————— */
.legend {
  position: absolute;
  left: calc(var(--gauge-width) + 160px);
  top: 28px;
  z-index: 30;
  display: flex;
  gap: 18px;
  pointer-events: none;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--ink-soft);
  letter-spacing: 1px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}
.legend-dot.high { background: var(--sand-600); }
.legend-dot.mid { background: var(--kelp-700); }
.legend-dot.low { background: var(--sea-600); }
.legend-dot.sub { background: var(--sea-800); }

/* ————— 潮水高度计（水位尺上的指示） ————— */
.tide-indicator {
  position: absolute;
  left: 18px;
  top: 35%;
  width: 28px;
  height: 2px;
  background: var(--sea-600);
  transform: translateY(-50%);
  z-index: 25;
  pointer-events: none;
  transition: top 0.35s cubic-bezier(0.23, 1, 0.32, 1);
}
.tide-indicator::before {
  content: "";
  position: absolute;
  right: -4px;
  top: 50%;
  transform: translateY(-50%);
  width: 0;
  height: 0;
  border-top: 5px solid transparent;
  border-bottom: 5px solid transparent;
  border-left: 5px solid var(--sea-600);
}

/* ————— 气泡粒子 ————— */
.bubbles {
  position: absolute;
  left: var(--gauge-width);
  right: 0;
  bottom: 0;
  height: 100%;
  pointer-events: none;
  z-index: 6;
  overflow: hidden;
}
.bubble {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.4);

  let targetPct = 35;
  let currentPct = 35;
  let discovered = new Set();

  // 潮位高度映射：0% 顶部 = 4m，100% 底部 = 0m
  function pctToMeters(pct) {
    return Math.round((4 - (pct / 100) * 4) * 10) / 10;
  }

  // ——— 构建水位尺刻度 ———
  function buildGauge() {
    const marks = [
      { m: 4.0, major: true },
      { m: 3.5, major: false },
      { m: 3.0, major: true },
      { m: 2.5, major: false },
      { m: 2.0, major: true },
      { m: 1.5, major: false },
      { m: 1.0, major: true },
      { m: 0.5, major: false },
      { m: 0.0, major: true },
    ];
    marks.forEach(m => {
      const pct = (4 - m.m) / 4 * 100;
      const tick = document.createElement('div');
      tick.className = 'gauge-tick' + (m.major ? ' major' : '');
      tick.style.top = pct + '%';
      if (m.major) {
        tick.innerHTML = '<span>' + m.m.toFixed(1) + '</span>';
      }
      gaugeRuler.appendChild(tick);
    });
  }

  // ——— 构建生物 ———
  function buildCreatures() {
    const layerRect = { top: 0, height: 1 }; // 相对值

    creatures.forEach((c, i) => {
      const el = document.createElement('div');
      el.className = 'creature ' + c.id + ' submerged';
      el.dataset.id = c.id;
      el.dataset.zonePct = c.zonePct;
      el.dataset.zone = c.zone;

      // 水平位置：散布在不同位置（基于 id 哈希）
      const seed = i / creatures.length;
      const xPct = 10 + (seed * 70) + (i % 3) * 5; // 10% - 85% 散布

      el.style.top = c.zonePct + '%';
      el.style.left = xPct + '%';
      el.style.transform = 'translateX(-50%)';

      const size = c.size || 40;
      el.innerHTML = `
        <div style="width:${size}px;height:${size}px;display:flex;align-items:center;justify-content:center;">
          ${creatureSVGs[c.id] || ''}
        </div>
        <div class="creature-label">${c.name}</div>
      `;

      el.addEventListener('click', (e) => {
        e.stopPropagation();
        openDetail(c);
        discovered.add(c.id);
        creatureCount.textContent = discovered.size;
      });

      creaturesLayer.appendChild(el);
    });
  }

  // ——— 构建水面反光条 ———
  function buildSheen() {
    for (let i = 0; i < 5; i++) {
      const span = document.createElement('span');
      span.style.left = (i * 25) + '%';
      span.style.width = (30 + Math.random() * 40) + 'px';
      span.style.animationDelay = (i * 1.2) + 's';
      span.style.animationDuration = (5 + Math.random() * 3) + 's';
      waterSheen.appendChild(span);
    }
  }

  // ——— 构建气泡 ———
  function buildBubbles() {
    for (let i = 0; i < 12; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      b.style.left = (5 + Math.random() * 90) + '%';
      b.style.bottom = (Math.random() * 30) + '%';
      const size = 2 + Math.random() * 5;
      b.style.width = size + 'px';
      b.style.height = size + 'px';
      b.style.animationDuration = (8 + Math.random() * 12) + 's';
      b.style.animationDelay = (Math.random() * 10) + 's';
      bubbles.appendChild(b);
    }
  }

  // ——— 水位更新 ———
  function updateWater(pct) {
    waterPct = pct;
    // 水位线位置
    waterLine.style.top = pct + '%';
    tideIndicator.style.top = pct + '%';

    // 水体高度：从底部到水位线
    const waterHeight = 100 - pct;
    waterBody.style.height = waterHeight + '%';

    // 水位数值
    const meters = pctToMeters(pct);
    levelNum.textContent = meters.toFixed(1) + ' m';
    tideNow.textContent = '水位 ' + meters.toFixed(1) + ' m';

    // 水体颜色深浅随水位变化：水位低（退潮）水更深，水位高（涨潮）水更浅
    const depth = waterHeight / 100; // 0-1
    const deepness = Math.floor(depth * 100);

    // 更新生物可见性：水位高于生物所在带 → 淹没不可见
    const creatureEls = creaturesLayer.querySelectorAll('.creature');
    creatureEls.forEach(el => {
      const zonePct = parseFloat(el.dataset.zonePct);
      // 生物在水位线以下（被淹没） → 隐藏
      // 生物在水位线以上（露出） → 显示
      // 实际上：潮带生物是被水淹没时才"生活"在那里，退潮时暴露
      // 但用户体验：水位高时生物躲在水里看不见，水位低时生物露出来可看
      // 所以：当水位 pct > zonePct（水在生物上方）→ 生物被淹没隐藏
      //       当水位 pct < zonePct（水在生物下方）→ 生物露出可见
      if (pct < zonePct) {
        // 水位线在生物上方（生物在水下）→ 隐藏
        if (!el.classList.contains('submerged')) {
          el.classList.add('submerged');
          el.classList.remove('visible-anim');
        }
      } else {
        // 水位线降到生物以下，生物露出
        if (el.classList.contains('submerged')) {
          el.classList.remove('submerged');
          // 只在首次露出时播放浮现动画
          el.classList.add('visible-anim');
        }
      }
    });

    // 更新分区标记激活状态
    zoneMarkers.forEach(m => {
      m.classList.remove('active');
    });
    // 当前水位所处的带
    if (pct < 20) {
      document.querySelector('.zone-marker.high-zone').classList.add('active');
    } else if (pct < 45) {
      document.querySelector('.zone-marker.mid-zone').classList.add('active');
    } else if (pct < 70) {
      document.querySelector('.zone-marker.low-zone').classList.add('active');
    } else {
      document.querySelector('.zone-marker.sub-zone').classList.add('active');
    }
  }

  // ——— 动画循环（阻尼跟随） ———
  function animate() {
    // 阻尼插值
    const diff = targetPct - currentPct;
    if (Math.abs(diff) > 0.1) {
      currentPct += diff * 0.12;
      updateWater(currentPct);
    }
    requestAnimationFrame(animate);
  }

  // ——— 拖拽交互 ———
  let dragStartY = 0;
  let dragStartPct = 0;

  function onDragStart(e) {
    isDragging = true;
    cursor.classList.add('drag');
    waterHandle.classList.add('dragging');

    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    dragStartY = clientY;
    dragStartPct = currentPct;
    e.preventDefault();
  }

  function onDragMove(e) {
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    // 自定义光标跟随
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    cursor.style.left = clientX + 'px';
    cursor.style.top = clientY + 'px';

    if (!isDragging) return;

    const stageHeight = stage.clientHeight;
    const deltaY = clientY - dragStartY;
    const deltaPct = (deltaY / stageHeight) * 100;

    let newPct = dragStartPct + deltaPct;
    newPct = Math.max(5, Math.min(95, newPct));
    targetPct = newPct;
  }

  function onDragEnd() {
    isDragging = false;
    cursor.classList.remove('drag');
    waterHandle.classList.remove('dragging');
  }

  // ——— 详情面板 ———
  function openDetail(c) {
    detailIllus.innerHTML = `<div style="width:70%;height:70%;">${creatureSVGs[c.id] || ''}</div>`;
    detailIllus.querySelector('div').style.display = 'flex';
    detailIllus.querySelector('div').style.alignItems = 'center';
    detailIllus.querySelector('div').style.justifyContent = 'center';

    detailName.textContent = c.name;
    detailLatin.textContent = c.latin;

    const zoneNames = { high: '高潮带', mid: '中潮带', low: '低潮带', sub: '潮下带' };
    detailZone.textContent = zoneNames[c.zone];

    detailMorph.textContent = c.morph;
    detailHabit.textContent = c.habit;
    detailPhylum.textContent = c.phylum;

    const tideRange = {
      high: '大潮高潮线附近',
      mid: '平均中潮位带',
      low: '低潮线附近',
      sub: '低潮线以下'
    };
    detailTide.textContent = tideRange[c.zone];
    detailDiet.textContent = c.diet;

    detailPanel.classList.add('open');
  }

  function closeDetail() {
    detailPanel.classList.remove('open');
  }

  // ——— 初始化 ———
  function init() {
    buildGauge();
    buildCreatures();
    buildSheen();
    buildBubbles();

    // 设置初始水位（中潮位）
    targetPct = 45;
    currentPct = 45;
    updateWater(currentPct);

    // 拖拽事件
    waterHandle.addEventListener('mousedown', onDragStart);
    waterHandle.addEventListener('touchstart', onDragStart, { passive: false });
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('touchmove', onDragMove, { passive: false });
    document.addEventListener('mouseup', onDragEnd);
    document.addEventListener('touchend', onDragEnd);

    // 点击关闭详情
    detailClose.addEventListener('click', closeDetail);

    // 自定义光标
    document.addEventListener('mousemove', (e) => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });

    // 点击效果
    document.addEventListener('mousedown', () => cursor.classList.add('click'));
    document.addEventListener('mouseup', () => cursor.classList.remove('click'));

    // 可点击元素 hover 态
    document.querySelectorAll('.creature, .detail-close, .water-line-handle').forEach(el => {
      el.addEventListener('mouseenter', () => cursor.classList.add('click'));
      el.addEventListener('mouseleave', () => {
        if (!isDragging) cursor.classList.remove('click');
      });
    });

    // 开始动画循环
    animate();

    // 已发现生物计数
    creatureCount.textContent = '0';
  }

  // 启动
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>

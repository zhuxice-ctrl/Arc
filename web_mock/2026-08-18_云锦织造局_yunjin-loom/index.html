<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="creative-medium" content="interactive-prototype">
  <title>云锦织造局 · 寸锦寸金</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=ZCOOL+XiaoWei&display=swap">
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --cinnabar: #C8392B;
      --vermilion: #A62A1F;
      --gilt: #D4A843;
      --gilt-light: #E8C978;
      --gilt-deep: #B08730;
      --ink-green: #2D5A3D;
      --paper: #F5F0E6;
      --paper-deep: #E8DFCD;
      --ink: #1A1A1A;
      --ink-soft: #2B2B2B;
      --ink-mute: #6B6B6B;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: "Noto Serif SC", "STSong", serif;
      background: var(--paper);
      color: var(--ink);
      overflow-x: hidden;
      cursor: none;
    }

    @media (max-width: 768px) { body { cursor: auto; } }

    /* ============ CUSTOM CURSOR ============ */
    .cursor {
      position: fixed;
      top: 50%; left: 50%;
      width: 38px; height: 38px;
      margin: -19px 0 0 -19px;
      border: 2px solid #fff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transition: width 0.25s cubic-bezier(.2,.8,.2,1),
                  height 0.25s cubic-bezier(.2,.8,.2,1),
                  margin 0.25s cubic-bezier(.2,.8,.2,1),
                  border-color 0.25s ease,
                  background 0.25s ease;
      mix-blend-mode: difference;
      filter: drop-shadow(0 0 6px rgba(255,255,255,.6));
    }
    .cursor::before {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      width: 6px; height: 6px;
      margin: -3px 0 0 -3px;
      background: var(--gilt);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--gilt), 0 0 16px var(--gilt-light);
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .cursor.hover {
      width: 58px; height: 58px;
      margin: -29px 0 0 -29px;
      border-color: var(--gilt-light);
    }
    .cursor.hover::before {
      background: var(--cinnabar);
      box-shadow: 0 0 10px var(--cinnabar), 0 0 20px var(--vermilion);
    }
    .cursor.click {
      transform: scale(0.85);
    }
    .cursor-click {
      position: fixed;
      width: 6px; height: 6px;
      border-radius: 50%;
      border: 2px solid var(--gilt-light);
      pointer-events: none;
      z-index: 9998;
      opacity: 0;
      animation: cursorRipple 0.7s ease-out forwards;
    }
    @keyframes cursorRipple {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 1; border-width: 2px; }
      100% { transform: translate(-50%, -50%) scale(5); opacity: 0; border-width: 1px; }
    }
    @media (max-width: 768px) {
      .cursor { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cursor { display: none; }
      body { cursor: auto; }
    }

    /* ============ NAVIGATION ============ */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 20px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(26,26,26,.7), transparent);
      color: var(--paper);
      transition: background 0.4s ease, padding 0.4s ease, color 0.3s ease;
    }
    .nav.scrolled {
      background: rgba(245,240,230,.92);
      backdrop-filter: blur(10px);
      color: var(--ink);
      padding: 14px 48px;
      box-shadow: 0 1px 0 rgba(212,168,67,.3);
    }
    .nav-logo {
      font-family: "ZCOOL XiaoWei", "Noto Serif SC", serif;
      font-size: 22px;
      letter-spacing: 4px;
      color: var(--gilt-light);
      transition: color 0.3s ease;
    }
    .nav.scrolled .nav-logo { color: var(--cinnabar); }
    .nav-logo-seal {
      display: inline-block;
      width: 32px; height: 32px;
      line-height: 32px;
      text-align: center;
      background: var(--cinnabar);
      color: var(--paper);
      font-size: 14px;
      margin-right: 12px;
      vertical-align: middle;
      border-radius: 3px;
      font-family: "ZCOOL XiaoWei", serif;
      letter-spacing: 0;
    }
    .nav-links {
      display: flex;
      gap: 36px;
      list-style: none;
    }
    .nav-links a {
      color: inherit;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 2px;
      position: relative;
      padding: 4px 0;
      font-weight: 500;
    }
    .nav-links a::after {
      content: "";
      position: absolute;
      bottom: 0; left: 0;
      width: 0; height: 1.5px;
      background: var(--gilt);
      transition: width 0.35s ease;
    }
    .nav-links a:hover::after { width: 100%; }
    .nav-cta {
      padding: 10px 22px;
      border: 1px solid var(--gilt);
      color: var(--gilt-light);
      background: transparent;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 2px;
      cursor: none;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .nav.scrolled .nav-cta {
      background: var(--cinnabar);
      border-color: var(--cinnabar);
      color: var(--paper);
    }
    .nav-cta:hover {
      background: var(--gilt);
      color: var(--ink);
    }
    .nav.scrolled .nav-cta:hover {
      background: var(--vermilion);
      border-color: var(--vermilion);
      color: var(--paper);
    }
    .nav-hamburger {
      display: none;
      width: 28px; height: 20px;
      position: relative;
      background: none;
      border: none;
      cursor: none;
    }
    .nav-hamburger span {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: currentColor;
      transition: all 0.3s ease;
    }
    .nav-hamburger span:nth-child(1) { top: 0; }
    .nav-hamburger span:nth-child(2) { top: 9px; }
    .nav-hamburger span:nth-child(3) { top: 18px; }
    .nav-mobile-menu {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--ink);
      z-index: 99;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 32px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .nav-mobile-menu.open {
      opacity: 1;
      pointer-events: auto;
    }
    .nav-mobile-menu a {
      color: var(--paper);
      font-size: 24px;
      letter-spacing: 6px;
      text-decoration: none;
      font-family: "ZCOOL XiaoWei", serif;
    }
    @media (max-width: 768px) {
      .nav { padding: 16px 20px; }
      .nav-links { display: none; }
      .nav-cta { display: none; }
      .nav-hamburger { display: block; }
      .nav-mobile-menu { display: flex; }
    }

    /* ============ HERO ============ */
    .hero {
      position: relative;
      height: 100vh;
      min-height: 680px;
      background: var(--ink);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--paper);
    }
    .hero-canvas {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
    }
    .hero-gold-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 900px;
      padding: 0 24px;
    }
    .hero-seal {
      display: inline-block;
      width: 64px; height: 64px;
      line-height: 64px;
      text-align: center;
      background: var(--cinnabar);
      color: var(--paper);
      font-family: "ZCOOL XiaoWei", serif;
      font-size: 22px;
      letter-spacing: 2px;
      margin-bottom: 32px;
      border-radius: 4px;
      box-shadow: 0 0 0 2px var(--cinnabar), 0 0 0 4px rgba(200,57,43,.3);
      animation: sealPulse 3s ease-in-out infinite;
    }
    @keyframes sealPulse {
      0%, 100% { box-shadow: 0 0 0 2px var(--cinnabar), 0 0 0 4px rgba(200,57,43,.3); }
      50% { box-shadow: 0 0 0 2px var(--cinnabar), 0 0 0 10px rgba(200,57,43,0); }
    }
    @media (prefers-reduced-motion: reduce) { .hero-seal { animation: none; } }

    .hero-title {
      font-family: "ZCOOL XiaoWei", "Noto Serif SC", serif;
      font-size: clamp(48px, 9vw, 120px);
      letter-spacing: 16px;
      line-height: 1.1;
      font-weight: 400;
      margin-bottom: 24px;
      background: linear-gradient(180deg, var(--gilt-light) 0%, var(--gilt) 45%, var(--gilt-deep) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      position: relative;
    }
    .hero-title::after {
      content: attr(data-text);
      position: absolute;
      left: 0; top: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,240,200,.8) 50%, transparent 70%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes shimmer {
      0%, 100% { background-position: 120% 0; }
      50% { background-position: -20% 0; }
    }
    @media (prefers-reduced-motion: reduce) { .hero-title::after { animation: none; } }

    .hero-subtitle {
      font-size: clamp(14px, 1.6vw, 18px);
      letter-spacing: 8px;
      color: rgba(245,240,230,.7);
      margin-bottom: 18px;
      font-weight: 300;
    }
    .hero-tagline {
      font-size: clamp(13px, 1.3vw, 15px);
      letter-spacing: 4px;
      color: var(--gilt);
      margin-bottom: 48px;
      font-family: "Noto Sans SC", sans-serif;
    }
    .hero-cta-row {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      font-family: "Noto Serif SC", serif;
      padding: 14px 36px;
      font-size: 14px;
      letter-spacing: 3px;
      cursor: none;
      border: 1px solid var(--gilt);
      background: transparent;
      color: var(--gilt-light);
      position: relative;
      overflow: hidden;
      transition: all 0.4s ease;
    }
    .btn::before {
      content: "";
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(212,168,67,.3), transparent);
      transition: left 0.6s ease;
    }
    .btn:hover::before { left: 100%; }
    .btn:hover {
      background: var(--gilt);
      color: var(--ink);
      box-shadow: 0 0 20px rgba(212,168,67,.4);
    }
    .btn.primary {
      background: var(--cinnabar);
      border-color: var(--cinnabar);
      color: var(--paper);
    }
    .btn.primary:hover {
      background: var(--vermilion);
      border-color: var(--vermilion);
      color: var(--paper);
      box-shadow: 0 0 20px rgba(200,57,43,.5);
    }
    .hero-scroll {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      color: rgba(245,240,230,.5);
      font-size: 12px;
      letter-spacing: 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .hero-scroll-line {
      width: 1px;
      height: 40px;
      background: linear-gradient(to bottom, transparent, var(--gilt));
      animation: scrollLine 2s ease-in-out infinite;
    }
    @keyframes scrollLine {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* ============ SECTION COMMON ============ */
    .section {
      padding: 120px 48px;
      position: relative;
    }
    .section-header {
      text-align: center;
      margin-bottom: 72px;
    }
    .section-eyebrow {
      font-family: "ZCOOL XiaoWei", serif;
      font-size: 14px;
      letter-spacing: 6px;
      color: var(--cinnabar);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .section-eyebrow::before,
    .section-eyebrow::after {
      content: "";
      width: 40px; height: 1px;
      background: var(--gilt);
    }
    .section-title {
      font-family: "ZCOOL XiaoWei", "Noto Serif SC", serif;
      font-size: clamp(32px, 4.5vw, 52px);
      letter-spacing: 8px;
      color: var(--ink);
      font-weight: 400;
      margin-bottom: 16px;
    }
    .section-desc {
      font-size: 15px;
      line-height: 1.8;
      color: var(--ink-mute);
      max-width: 560px;
      margin: 0 auto;
      letter-spacing: 1px;
    }

    @media (max-width: 768px) {
      .section { padding: 72px 20px; }
      .section-header { margin-bottom: 48px; }
    }

    /* ============ PATTERNS (纹样图谱) ============ */
    .patterns {
      background: var(--paper);
    }
    .patterns-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .pattern-card {
      position: relative;
      aspect-ratio: 3/4;
      background: var(--paper-deep);
      overflow: hidden;
      cursor: none;
      border: 1px solid rgba(212,168,67,.2);
      transition: transform 0.5s cubic-bezier(.2,.8,.2,1), box-shadow 0.5s ease;
    }
    .pattern-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(26,26,26,.15);
    }
    .pattern-card-svg {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      transition: transform 0.8s cubic-bezier(.2,.8,.2,1);
    }
    .pattern-card:hover .pattern-card-svg {
      transform: scale(1.12);
    }
    .pattern-card-shimmer {
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(115deg, transparent 30%, rgba(255,240,200,.6) 50%, transparent 70%);
      transform: skewX(-20deg);
      transition: left 0.8s ease;
      pointer-events: none;
    }
    .pattern-card:hover .pattern-card-shimmer {
      left: 150%;
    }
    .pattern-card-info {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 24px;
      background: linear-gradient(to top, rgba(26,26,26,.85), transparent);
      color: var(--paper);
      transform: translateY(20px);
      opacity: 0;
      transition: all 0.4s ease;
    }
    .pattern-card:hover .pattern-card-info {
      transform: translateY(0);
      opacity: 1;
    }
    .pattern-card-name {
      font-family: "ZCOOL XiaoWei", serif;
      font-size: 22px;
      letter-spacing: 4px;
      margin-bottom: 6px;
    }
    .pattern-card-sub {
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--gilt-light);
    }
    .pattern-card-tag {
      position: absolute;
      top: 16px; right: 16px;
      width: 36px; height: 36px;
      border: 1px solid var(--gilt);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "ZCOOL XiaoWei", serif;
      font-size: 14px;
      color: var(--gilt);
      background: rgba(26,26,26,.4);
    }

    /* ============ CRAFT PROCESS (织造工艺) ============ */
    .craft {
      background: var(--ink);
      color: var(--paper);
      position: relative;
      overflow: hidden;
    }
    .craft .section-title { color: var(--paper); }
    .craft .section-desc { color: rgba(245,240,230,.6); }

    .craft-steps {
      max-width: 1100px;
      margin: 0 auto;
      position: relative;
    }
    .craft-step {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
      padding: 60px 0;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .craft-step.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .craft-step:nth-child(even) .craft-step-visual { order: 2; }
    .craft-step:nth-child(even) .craft-step-text { order: 1; }

    .craft-step-number {
      font-family: "ZCOOL XiaoWei", serif;
      font-size: 120px;
      color: var(--gilt);
      line-height: 1;
      font-weight: 400;
      margin-bottom: 24px;
      letter-spacing: -2px;
      background: linear-gradient(180deg, var(--gilt-light), var(--gilt-deep));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .craft-step-title {
      font-family: "ZCOOL XiaoWei", serif;
      font-size: 36px;
      letter-spacing: 8px;
      margin-bottom: 20px;
      color: var(--paper);
    }
    .craft-step-desc {
      font-size: 15px;
      line-height: 2;
      color: rgba(245,240,230,.65);
      letter-spacing: 1px;
      margin-bottom: 24px;
    }
    .craft-step-stats {
      display: flex;
      gap: 32px;
    }
    .craft-stat {
      text-align: center;
    }
    .craft-stat-num {
      font-family: "ZCOOL XiaoWei", serif;
      font-size: 36px;
      color: var(--gilt-light);
      line-height: 1;
    }
    .craft-stat-label {
      font-size: 12px;
      letter-spacing: 2px;
      color: rgba(245,240,230,.5);
      margin-top: 6px;
    }

    .craft-step-visual {
      position: relative;
      aspect-ratio: 4/3;
      background: rgba(245,240,230,.04);
      border: 1px solid rgba(212,168,67,.2);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .craft-step-visual svg {
      width: 70%; height: 70%;
    }

    @media (max-width: 768px) {
      .craft-step {
        grid-template-columns: 1fr;
        gap: 32px;
      }
      .craft-step:nth-child(even) .craft-step-visual { order: 1; }
      .craft-step:nth-child(even) .craft-step-text { order: 2; }
      .craft-step-number { font-size: 80px; }
      .craft-step-title { font-size: 28px; }
    }

    /* ============ ARTISANS (匠人故事) ============ */
    .artisans {
      background: var(--paper);
    }
    .artisans-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 32px;
      max-width: 1200px;
      margin: 0 auto;
      perspective: 1200px;
    }
    .artisan-card {
      position: relative;
      background: var(--paper-deep);
      padding: 40px 28px 32px;
      text-align: center;
      border: 1px solid rgba(212,168,67,.25);
      cursor: none;
      transform-style: preserve-3d;
      transition: transform 0.3s ease, box-shadow 0.4s ease;
      will-change: transform;
    }
    .artisan-card:hover {
      box-shadow: 0 20px 50px rgba(26,26,26,.12);
    }
    .artisan-avatar-wrap {
      position: relative;
      width: 100px; height: 100px;
      margin: 0 auto 24px;
    }
    .artisan-avatar {
      width: 100px; height: 100px;
      border-radius: 50%;
      background: var(--gilt-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "ZCOOL XiaoWei", serif;
      font-size: 40px;
      color: var(--paper);
      border: 3px solid var(--gilt);
      position: relative;
      z-index: 2;
      transform: translateZ(30px);
    }
    .artisan-pulse {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid var(--gilt);
      animation: artisanPulse 2.5s ease-in-out infinite;
    }
    .artisan-pulse:nth-child(2) { animation-delay: 0.8s; }
    .artisan-pulse:nth-child(3) { animation-delay: 1.6s; }
    @keyframes artisanPulse {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .artisan-pulse { animation: none; } }

    .artisan-name {
      font-family: "ZCOOL XiaoWei", serif;
      font-size: 24px;
      letter-spacing: 4px;
      margin-bottom: 6px;
      color: var(--ink);
      transform: translateZ(20px);
    }
    .artisan-title {
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--cinnabar);
      margin-bottom: 16px;
      transform: translateZ(15px);
    }
    .artisan-divider {
      width: 40px; height: 1px;
      background: var(--gilt);
      margin: 0 auto 16px;
      transform: translateZ(10px);
    }
    .artisan-desc {
      font-size: 13px;
      line-height: 1.8;
      color: var(--ink-mute);
      letter-spacing: 0.5px;
      transform: translateZ(10px);
    }
    .artisan-years {
      margin-top: 20px;
      font-family: "ZCOOL XiaoWei", serif;
      font-size: 28px;
      color: var(--gilt-deep);
      transform: translateZ(25px);
    }
    .artisan-years span {
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--ink-mute);
      margin-left: 4px;
    }

    .events {
      background: var(--paper-deep);
      position: relative;
    }
    .events-list {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .event-item {
      background: var(--paper);
      border: 1px solid rgba(212,168,67,.2);
      cursor: none;
      overflow: hidden;
      transition: all 0.4s ease;
    }
    .event-item:hover {
      border-color: var(--gilt);
      box-shadow: 0 8px 24px rgba(26,26,26,.08);
    }
    .event-header {
      display: flex;
      align-items: center;
      padding: 24px 28px;
      gap: 24px;
    }
    .event-date {
      text-align: center;
      min-width: 72px;
      border-right: 1px solid rgba(212,168,67,.3);
      padding-right: 24px;
    }
    .event-date-day {
      font-family: "ZCOOL XiaoWei", serif;
      font-size: 36px;
      color: var(--cinnabar);
      line-height: 1;
    }
    .event-date-month {
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--ink-mute);
      margin-top: 4px;
    }
    .event-info {
      flex: 1;
    }
    .event-name {
      font-family: "ZCOOL XiaoWei", serif;
      font-size: 20px;
      letter-spacing: 3px;
      color: var(--ink);
      margin-bottom: 4px;
    }
    .event-meta {
      font-size: 13px;
      color: var(--ink-mute);
      letter-spacing: 1px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

      content: "·";
      margin-right: 6px;
      color: var(--gilt);
    }

      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1px solid var(--gilt);
      background: transparent;
      color: var(--gilt-deep);
      font-size: 18px;
      cursor: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }
    .event-item.open .event-toggle {
      background: var(--cinnabar);
      border-color: var(--cinnabar);
      color: var(--paper);
      transform: rotate(45deg);
    }
    .event-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s ease;
    }
    .event-item.open .event-body {
      max-height: 400px;
    }
    .event-body-inner {
      padding: 0 28px 28px 124px;
      border-top: 1px solid rgba(212,168,67,.15);
      padding-top: 20px;
    }
    .event-body-inner p {
      font-size: 14px;
      line-height: 1.9;
      color: var(--ink-soft);
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }
    .event-body-inner .event-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .event-body-inner .event-tag {
      padding: 4px 12px;
      font-size: 12px;
      background: rgba(200,57,43,.08);
      color: var(--cinnabar);
      letter-spacing: 1px;
      border-radius: 2px;
    }

    @media (max-width: 768px) {
      .event-header { padding: 18px 20px; gap: 16px; }
      .event-date { min-width: 56px; padding-right: 16px; }
      .event-date-day { font-size: 28px; }
      .event-name { font-size: 16px; letter-spacing: 2px; }
      .event-body-inner { padding: 16px 20px 20px; }
    }

    /* ============ FOOTER ============ */
    .footer {
      background: var(--ink);
      color: var(--paper);
      padding: 80px 48px 32px;
    }
    .footer-top {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 48px;
      max-width: 1200px;
      margin: 0 auto 60px;
    }
    .footer-brand-name {
      font-family: "ZCOOL XiaoWei", serif;
      font-size: 28px;
      letter-spacing: 6px;
      color: var(--gilt-light);
      margin-bottom: 16px;
    }
    .footer-brand-desc {
      font-size: 13px;
      line-height: 1.9;
      color: rgba(245,240,230,.5);
      letter-spacing: 1px;
      max-width: 320px;
    }
    .footer-col h4 {
      font-size: 14px;
      letter-spacing: 3px;
      color: var(--gilt);
      margin-bottom: 20px;
      font-weight: 500;
    }
    .footer-col ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .footer-col a {
      color: rgba(245,240,230,.6);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 1px;
      transition: color 0.3s ease;
      cursor: none;
    }
    .footer-col a:hover { color: var(--gilt-light); }
    .footer-bottom {
      border-top: 1px solid rgba(245,240,230,.1);
      padding-top: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      font-size: 12px;
      color: rgba(245,240,230,.3);
      letter-spacing: 1px;
    }

    @media (max-width: 768px) {
      .footer { padding: 60px 20px 24px; }
      .footer-top {
        grid-template-columns: 1fr 1fr;
        gap: 32px;
      }
      .footer-bottom {
        flex-direction: column;
        gap: 12px;
        text-align: center;
      }
    }

    /* ============ REVEAL ANIMATION ============ */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
    }

    /* ============ TYPEWRITER ============ */
    .typewriter-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--gilt);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>

    // ==================== CUSTOM CURSOR ====================
    function CustomCursor() {
      const cursorRef = useRef(null);
      const [hover, setHover] = useState(false);
      const [click, setClick] = useState(false);
      const rafRef = useRef(null);
      const targetRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
      const currentRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
      const reducedMotion = useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);

      useEffect(() => {
        if (reducedMotion.current) return;
        if ('ontouchstart' in window) return;

        const el = cursorRef.current;
        if (!el) return;

        const animate = () => {
          if (document.hidden) {
            rafRef.current = requestAnimationFrame(animate);
            return;
          }
          currentRef.current.x += (targetRef.current.x - currentRef.current.x) * 0.18;
          currentRef.current.y += (targetRef.current.y - currentRef.current.y) * 0.18;
          el.style.transform = `translate3d(${currentRef.current.x}px, ${currentRef.current.y}px, 0) translate(-50%, -50%)`;
          rafRef.current = requestAnimationFrame(animate);
        };

        const onMove = (e) => {
          targetRef.current.x = e.clientX;
          targetRef.current.y = e.clientY;
        };

        const onOver = (e) => {
          const t = e.target.closest('a, button, .pattern-card, .artisan-card, .event-item, input, textarea, [data-cursor-hover]');
          setHover(!!t);
        };

        const onDown = () => {
          setClick(true);
          setTimeout(() => setClick(false), 200);
          // Create ripple at click position
          const ripple = document.createElement('div');
          ripple.className = 'cursor-click';
          ripple.style.left = targetRef.current.x + 'px';
          ripple.style.top = targetRef.current.y + 'px';
          document.body.appendChild(ripple);
          setTimeout(() => ripple.remove(), 700);
        };

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseover', onOver);
        window.addEventListener('mousedown', onDown);
        rafRef.current = requestAnimationFrame(animate);

        const onVisibility = () => {
          if (document.hidden && rafRef.current) {
            cancelAnimationFrame(rafRef.current);
          } else if (!document.hidden) {
            rafRef.current = requestAnimationFrame(animate);
          }
        };
        document.addEventListener('visibilitychange', onVisibility);

        return () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseover', onOver);
          window.removeEventListener('mousedown', onDown);
          document.removeEventListener('visibilitychange', onVisibility);
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
        };
      }, []);

      if (reducedMotion.current) return null;

      return (
        <div
          ref={cursorRef}
          className={`cursor ${hover ? 'hover' : ''} ${click ? 'click' : ''}`}
        />
      );
    }

    // ==================== HERO LOOM ANIMATION (Canvas) ====================
    function HeroLoom() {
      const canvasRef = useRef(null);
      const rafRef = useRef(null);
      const particlesRef = useRef([]);
      const reducedMotion = useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let w, h;

        const resize = () => {
          w = canvas.width = canvas.offsetWidth * window.devicePixelRatio;
          h = canvas.height = canvas.offsetHeight * window.devicePixelRatio;
        };
        resize();
        window.addEventListener('resize', resize);

        // Initialize gold particles
        const particleCount = reducedMotion.current ? 15 : 45;
        particlesRef.current = [];
        for (let i = 0; i < particleCount; i++) {
          particlesRef.current.push({
            x: Math.random() * w,
            y: Math.random() * h,
            vx: (Math.random() - 0.5) * 0.3 * window.devicePixelRatio,
            vy: (Math.random() - 0.5) * 0.2 * window.devicePixelRatio,
            r: (Math.random() * 2 + 0.8) * window.devicePixelRatio,
            alpha: Math.random() * 0.5 + 0.3,
            phase: Math.random() * Math.PI * 2
          });
        }

        let t = 0;
        const threadCount = 28;
        const threadSpacing = w / (threadCount + 1);

        const draw = () => {
          if (document.hidden) {
            rafRef.current = requestAnimationFrame(draw);
            return;
          }
          ctx.clearRect(0, 0, w, h);
          t += 0.008;

          // Vertical warp threads (经)
          for (let i = 1; i <= threadCount; i++) {
            const x = i * threadSpacing;
            ctx.beginPath();
            ctx.moveTo(x, 0);
            for (let y = 0; y < h; y += 6 * window.devicePixelRatio) {
              const wave = Math.sin(t + y * 0.006 + i * 0.3) * (6 * window.devicePixelRatio);
              ctx.lineTo(x + wave, y);
            }
            const grad = ctx.createLinearGradient(x - 1, 0, x + 1, 0);
            grad.addColorStop(0, 'rgba(212, 168, 67, 0)');
            grad.addColorStop(0.5, 'rgba(212, 168, 67, 0.25)');
            grad.addColorStop(1, 'rgba(212, 168, 67, 0)');
            ctx.strokeStyle = grad;
            ctx.lineWidth = 1.5 * window.devicePixelRatio;
            ctx.stroke();
          }

          // Horizontal weft threads (纬) - animated shuttle
          const weftCount = 18;
          for (let j = 0; j < weftCount; j++) {
            const y = (j + 1) * (h / (weftCount + 1));
            const progress = ((t * 0.5 + j * 0.1) % 1);
            const weftX = progress * w;
            const waveAmp = reducedMotion.current ? 2 : 4;

            ctx.beginPath();
            for (let x = 0; x <= weftX; x += 4 * window.devicePixelRatio) {
              const wave = Math.sin(t * 2 + x * 0.008 + j * 0.5) * (waveAmp * window.devicePixelRatio);
              if (x === 0) ctx.moveTo(x, y + wave);
              else ctx.lineTo(x, y + wave);
            }
            const grad = ctx.createLinearGradient(0, y, weftX, y);
            grad.addColorStop(0, 'rgba(200, 57, 43, 0.1)');
            grad.addColorStop(0.7, 'rgba(200, 57, 43, 0.3)');
            grad.addColorStop(1, 'rgba(200, 57, 43, 0.6)');
            ctx.strokeStyle = grad;
            ctx.lineWidth = 1.2 * window.devicePixelRatio;
            ctx.stroke();
          }

          // Gold particles
          particlesRef.current.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.phase += 0.02;
            if (p.x < 0) p.x = w;
            if (p.x > w) p.x = 0;
            if (p.y < 0) p.y = h;
            if (p.y > h) p.y = 0;

            const pulse = 0.7 + Math.sin(p.phase) * 0.3;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(232, 201, 120, ${p.alpha * pulse})`;
            ctx.fill();
            // Glow
            const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
            glow.addColorStop(0, `rgba(232, 201, 120, ${p.alpha * pulse * 0.4})`);
            glow.addColorStop(1, 'rgba(232, 201, 120, 0)');
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * 4, 0, Math.PI * 2);
            ctx.fillStyle = glow;
            ctx.fill();
          });

          rafRef.current = requestAnimationFrame(draw);
        };
        rafRef.current = requestAnimationFrame(draw);

        const onVisibility = () => {
          if (document.hidden && rafRef.current) {
            cancelAnimationFrame(rafRef.current);
          } else if (!document.hidden) {
            rafRef.current = requestAnimationFrame(draw);
          }
        };
        document.addEventListener('visibilitychange', onVisibility);

        return () => {
          window.removeEventListener('resize', resize);
          document.removeEventListener('visibilitychange', onVisibility);
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
        };
      }, []);

      return <canvas ref={canvasRef} className="hero-canvas" />;
    }

    // ==================== TYPEWRITER EFFECT ====================
    function Typewriter({ text, speed = 80, delay = 300, className }) {
      const [displayed, setDisplayed] = useState('');
      const [done, setDone] = useState(false);
      const timeoutRef = useRef(null);
      const reducedMotion = useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);

      useEffect(() => {
        if (reducedMotion.current) {
          setDisplayed(text);
          setDone(true);
          return;
        }

        let i = 0;
        const startDelay = setTimeout(() => {
          const type = () => {
            if (document.hidden) {
              timeoutRef.current = setTimeout(type, 200);
              return;
            }
            if (i < text.length) {
              setDisplayed(text.slice(0, i + 1));
              i++;
              timeoutRef.current = setTimeout(type, speed + Math.random() * 40);
            } else {
              setDone(true);
            }
          };
          type();
        }, delay);

        const onVisibility = () => {
          if (document.hidden && timeoutRef.current) {
            clearTimeout(timeoutRef.current);
          }
        };
        document.addEventListener('visibilitychange', onVisibility);

        return () => {
          clearTimeout(startDelay);
          if (timeoutRef.current) clearTimeout(timeoutRef.current);
          document.removeEventListener('visibilitychange', onVisibility);
        };
      }, [text, speed, delay]);

      return (
        <span className={className}>
          {displayed}
          {!done && !reducedMotion.current && <span className="typewriter-cursor" />}
        </span>
      );
    }

    // ==================== COUNTUP ANIMATION ====================
    function CountUp({ end, duration = 2000, suffix = '' }) {
      const [val, setVal] = useState(0);
      const ref = useRef(null);
      const startedRef = useRef(false);
      const rafRef = useRef(null);
      const startTimeRef = useRef(0);
      const reducedMotion = useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);

      useEffect(() => {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting && !startedRef.current) {
              startedRef.current = true;
              animate();
            }
          });
        }, { threshold: 0.3 });

        if (ref.current) observer.observe(ref.current);

        const animate = () => {
          if (reducedMotion.current) {
            setVal(end);
            return;
          }
          startTimeRef.current = performance.now();
          const step = (now) => {
            if (document.hidden) {
              rafRef.current = requestAnimationFrame(step);
              return;
            }
            const elapsed = now - startTimeRef.current;
            const progress = Math.min(elapsed / duration, 1);
            // easeOutCubic
            const eased = 1 - Math.pow(1 - progress, 3);
            setVal(Math.floor(eased * end));
            if (progress < 1) {
              rafRef.current = requestAnimationFrame(step);
            }
          };
          rafRef.current = requestAnimationFrame(step);
        };

        const onVisibility = () => {
          if (document.hidden && rafRef.current) {
            cancelAnimationFrame(rafRef.current);
          }
        };
        document.addEventListener('visibilitychange', onVisibility);

        return () => {
          observer.disconnect();
          document.removeEventListener('visibilitychange', onVisibility);
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
        };
      }, [end, duration]);

      return <span ref={ref}>{val}{suffix}</span>;
    }

    // ==================== 3D TILT CARD (Artisans) ====================
    function TiltCard({ artisan }) {
      const cardRef = useRef(null);

      useEffect(() => {
        const card = cardRef.current;
        if (!card) return;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        let rafId = null;
        let targetX = 0, targetY = 0;
        let currentX = 0, currentY = 0;

        const animate = () => {
          currentX += (targetX - currentX) * 0.12;
          currentY += (targetY - currentY) * 0.12;
          card.style.transform = `rotateX(${currentY}deg) rotateY(${currentX}deg)`;
          rafId = requestAnimationFrame(animate);
        };

        const onMove = (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          targetX = ((x - centerX) / centerX) * 8;
          targetY = -((y - centerY) / centerY) * 8;
        };

        const onLeave = () => {
          targetX = 0;
          targetY = 0;
        };

        card.addEventListener('mousemove', onMove);
        card.addEventListener('mouseleave', onLeave);
        rafId = requestAnimationFrame(animate);

        const onVisibility = () => {
          if (document.hidden && rafId) {
            cancelAnimationFrame(rafId);
          } else if (!document.hidden) {
            rafId = requestAnimationFrame(animate);
          }
        };
        document.addEventListener('visibilitychange', onVisibility);

        return () => {
          card.removeEventListener('mousemove', onMove);
          card.removeEventListener('mouseleave', onLeave);
          document.removeEventListener('visibilitychange', onVisibility);
          if (rafId) cancelAnimationFrame(rafId);
        };
      }, []);

      return (
        <div className="artisan-card" ref={cardRef}>
          <div className="artisan-avatar-wrap">
            <div className="artisan-pulse" />
            <div className="artisan-pulse" />
            <div className="artisan-pulse" />
            <div className="artisan-avatar">{artisan.char}</div>
          </div>
          <div className="artisan-name">{artisan.name}</div>
          <div className="artisan-title">{artisan.title}</div>
          <div className="artisan-divider" />
          <p className="artisan-desc">{artisan.desc}</p>
          <div className="artisan-years">
            <CountUp end={artisan.years} duration={2000} />
            <span>年从艺</span>
          </div>
        </div>
      );
    }

    // ==================== EVENT ACCORDION ====================

    // ==================== SCROLL REVEAL HOOK ====================
    function useReveal() {
      useEffect(() => {
        const elements = document.querySelectorAll('.reveal');
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.12, rootMargin: '0px 0px -50px 0px' });

        elements.forEach(el => observer.observe(el));
        return () => observer.disconnect();
      }, []);
    }

    // ==================== NAV ====================
    function Navigation({ onMobileMenu, mobileOpen }) {
      const [scrolled, setScrolled] = useState(false);

      useEffect(() => {
        let ticking = false;
        const onScroll = () => {
          if (!ticking) {
            requestAnimationFrame(() => {
              setScrolled(window.scrollY > 80);
              ticking = false;
            });
            ticking = true;
          }
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      const links = [
        { href: '#patterns', label: '纹样图谱' },
        { href: '#craft', label: '织造工艺' },
        { href: '#artisans', label: '匠人故事' },

        </>

          {/* PATTERNS */}

              <p className="section-desc">

          {/* FOOTER */}
          <footer className="footer" id="footer">
            <div className="footer-top">
              <div>
                <div className="footer-brand-name">云锦织造局</div>

              </div>
              <div className="footer-col">
                <h4>探索</h4>

                  <li><a href="#">025-8888-0000</a></li>
                  <li><a href="#">info@yunjin.art</a></li>
                  <li><a href="#">微信公众号</a></li>
                </ul>
              </div>
            </div>
            <div className="footer-bottom">
              <span>© 2026 云锦织造局 · 传承千年织锦技艺</span>
              <span>国家级非物质文化遗产</span>
            </div>
          </footer>
        </>
      );
    }

    // Craft step with reveal on scroll
    function CraftStep({ step, index }) {
      const ref = useRef(null);

      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              el.classList.add('visible');
            }
          });
        }, { threshold: 0.25 });
        observer.observe(el);
        return () => observer.disconnect();
      }, []);

      return (
        <div className="craft-step" ref={ref} style={{ transitionDelay: `${index * 0.1}s` }}>
          <div className="craft-step-visual">
            {craftVisuals[step.visual]}
          </div>
          <div className="craft-step-text">
            <div className="craft-step-number">{step.num}</div>
            <h3 className="craft-step-title">{step.title}</h3>
            <p className="craft-step-desc">{step.desc}</p>
            <div className="craft-step-stats">
              {step.stats.map((s, i) => (
                <div key={i} className="craft-stat">
                  <div className="craft-stat-num">
                    <CountUp end={s.num} duration={2200} />
                  </div>
                  <div className="craft-stat-label">{s.label}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

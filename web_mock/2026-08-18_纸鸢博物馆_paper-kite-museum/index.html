<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>纸鸢博物馆 · 中国风筝艺术数字馆</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" />
<style>
/* ========== RESET & BASE ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: "Noto Sans SC", system-ui, -apple-system, sans-serif;
  background: #F7F2E7;
  color: #26221C;
  overflow-x: hidden;
  cursor: none;
  line-height: 1.6;
}
@media (max-width: 900px) { body { cursor: auto; } .cursor-layer { display: none; } }
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: none; border: none; background: none; }
@media (max-width: 900px) { button { cursor: pointer; } }
ul, ol { list-style: none; }

/* ========== COLOR TOKENS ========== */
:root {
  --paper: #F7F2E7;
  --paper-2: #EFE7D6;
  --vermilion: #C73E2E;
  --vermilion-dark: #A02E20;
  --dai-green: #2F5D50;
  --dai-green-dark: #1E4036;
  --rattan: #E8B54A;
  --rattan-light: #F4D58D;
  --ink: #26221C;
  --ink-soft: #5A5248;
  --ink-light: #8A8278;
}

/* ========== CUSTOM CURSOR ========== */
.cursor-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
}
.cursor-ring {
  position: absolute;
  width: 36px;
  height: 36px;
  border: 2px solid #fff;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow:
    0 0 12px rgba(199, 62, 46, 0.6),
    0 0 24px rgba(199, 62, 46, 0.3),
    inset 0 0 8px rgba(255,255,255,0.3);
  transition: width .28s cubic-bezier(.25,1.4,.5,1),
              height .28s cubic-bezier(.25,1.4,.5,1),
              border-color .25s ease,
              background-color .25s ease,
              box-shadow .25s ease;
  will-change: transform;
}
.cursor-dot {
  position: absolute;
  width: 6px;
  height: 6px;
  background: var(--vermilion);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 8px var(--vermilion), 0 0 16px rgba(199,62,46,0.5);
  transition: width .2s, height .2s, background-color .2s;
}
.cursor-ring.is-hover {
  width: 56px;
  height: 56px;
  border-color: var(--vermilion);
  background: rgba(199, 62, 46, 0.08);
}
.cursor-ring.is-hover .cursor-dot {
  width: 10px;
  height: 10px;
}
.cursor-ring.is-click {
  width: 28px;
  height: 28px;
}
.ripple {
  position: absolute;
  border-radius: 50%;
  border: 2px solid var(--vermilion);
  transform: translate(-50%, -50%) scale(0.3);
  opacity: 0.7;
  animation: ripple-anim .6s ease-out forwards;
}
@keyframes ripple-anim {
  to { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
}

/* ========== WIND PARTICLES ========== */
.particles-layer {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 2;
}
.wind-particle {
  position: absolute;
  opacity: 0;
  will-change: transform, opacity;
}

/* ========== SCROLL REVEAL ========== */
.reveal {
  opacity: 0;
  transform: translateY(40px);
  transition: opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1);
}
.reveal.is-visible {
  opacity: 1;
  transform: translateY(0);
}
.reveal-delay-1 { transition-delay: .1s; }
.reveal-delay-2 { transition-delay: .2s; }
.reveal-delay-3 { transition-delay: .3s; }
.reveal-delay-4 { transition-delay: .4s; }

/* ========== NAV ========== */
.nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  padding: 18px 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: background-color .4s, padding .3s, box-shadow .3s;
}
.nav.scrolled {
  background: rgba(247, 242, 231, 0.92);
  backdrop-filter: blur(12px);
  padding: 12px 48px;
  box-shadow: 0 1px 0 rgba(38,34,28,0.08);
}
.nav-logo {
  font-family: "Noto Serif SC", serif;
  font-weight: 900;
  font-size: 22px;
  letter-spacing: 4px;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav-logo .seal {
  width: 28px;
  height: 28px;
  background: var(--vermilion);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 2px;
  letter-spacing: 0;
  transform: rotate(-4deg);
  font-family: "Noto Serif SC", serif;
}
.nav-links {
  display: flex;
  gap: 36px;
  font-size: 15px;
  color: var(--ink-soft);
}
.nav-links a {
  position: relative;
  padding: 6px 2px;
  transition: color .3s;
}
.nav-links a:hover { color: var(--vermilion); }
.nav-links a::after {
  content: "";
  position: absolute;
  left: 0; bottom: 0;
  width: 0;
  height: 2px;
  background: var(--vermilion);
  transition: width .3s cubic-bezier(.25,1,.3,1);
}
.nav-links a:hover::after { width: 100%; }
.nav-cta {
  background: var(--vermilion);
  color: #fff;
  padding: 10px 22px;
  border-radius: 2px;
  font-size: 14px;
  font-weight: 500;
  position: relative;
  overflow: hidden;
  transition: background-color .3s;
}
.nav-cta:hover { background: var(--vermilion-dark); }
.nav-cta .shine {
  position: absolute;
  top: 0; left: -100%;
  width: 60%; height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
  transform: skewX(-20deg);
  animation: shine-sweep 3.5s ease-in-out infinite;
}
@keyframes shine-sweep {
  0%, 70% { left: -100%; }
  100% { left: 140%; }
}

@media (max-width: 900px) {
  .nav { padding: 14px 20px; }
  .nav-links { display: none; }
}

/* ========== HERO ========== */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 120px 48px 80px;
  overflow: hidden;
}
.hero-bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 50% 30%, rgba(232,181,74,0.12) 0%, transparent 70%),
    radial-gradient(ellipse 80% 60% at 20% 80%, rgba(47,93,80,0.06) 0%, transparent 60%),
    var(--paper);
}
.hero-kite-string {
  position: absolute;
  top: 0;
  left: 50%;
  width: 1px;
  height: 55%;
  background: linear-gradient(to bottom, transparent, rgba(38,34,28,0.3), rgba(38,34,28,0.5));
  transform-origin: top center;
  z-index: 3;
  pointer-events: none;
}
.hero-kite-wrap {
  position: absolute;
  top: 8%;
  left: 50%;
  transform-origin: top center;
  z-index: 4;
  pointer-events: none;
}
.hero-kite {
  width: 180px;
  height: auto;
  transform: translateX(-50%);
  filter: drop-shadow(0 20px 40px rgba(38,34,28,0.15));
}
.hero-content {
  position: relative;
  z-index: 5;
  text-align: center;
  max-width: 900px;
  margin-top: 120px;
}
.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  letter-spacing: 6px;
  color: var(--dai-green);
  margin-bottom: 28px;
  font-weight: 500;
}
.hero-eyebrow::before, .hero-eyebrow::after {
  content: "";
  width: 40px;
  height: 1px;
  background: var(--dai-green);
  opacity: 0.5;
}
.hero-title {
  font-family: "Noto Serif SC", serif;
  font-size: clamp(48px, 8vw, 110px);
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: 12px;
  color: var(--ink);
  margin-bottom: 24px;
  text-indent: 12px;
}
.hero-title .accent {
  color: var(--vermilion);
  position: relative;
  display: inline-block;
}
.hero-typewriter {
  font-size: 18px;
  color: var(--ink-soft);
  margin-bottom: 48px;
  min-height: 28px;
  letter-spacing: 2px;
}
.hero-typewriter .caret {
  display: inline-block;
  width: 2px;
  height: 20px;
  background: var(--vermilion);
  margin-left: 2px;
  vertical-align: middle;
  animation: caret-blink 1s step-end infinite;
}
@keyframes caret-blink {
  50% { opacity: 0; }
}
.hero-buttons {
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
}
.btn-primary, .btn-secondary {
  padding: 16px 36px;
  font-size: 15px;
  font-weight: 500;
  border-radius: 2px;
  transition: transform .3s cubic-bezier(.25,1.4,.5,1), box-shadow .3s;
  position: relative;
  overflow: hidden;
  letter-spacing: 2px;
}
.btn-primary {
  background: var(--vermilion);
  color: #fff;
  box-shadow: 0 6px 24px rgba(199,62,46,0.25);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 32px rgba(199,62,46,0.35);
}
.btn-secondary {
  background: transparent;
  color: var(--ink);
  border: 1.5px solid var(--ink);
}
.btn-secondary:hover {
  background: var(--ink);
  color: var(--paper);
  transform: translateY(-2px);
}
.hero-scroll-hint {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  letter-spacing: 4px;
  color: var(--ink-light);
}
.hero-scroll-hint .scroll-line {
  width: 1px;
  height: 48px;
  background: linear-gradient(to bottom, var(--ink-light), transparent);
  animation: scroll-line 2s ease-in-out infinite;
}
@keyframes scroll-line {
  0%, 100% { transform: scaleY(1); transform-origin: top; }
  50% { transform: scaleY(0.4); transform-origin: top; }
}

/* ========== PAPER TEXTURE ========== */
.paper-texture {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: 0.04;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(38,34,28,0.03) 2px, rgba(38,34,28,0.03) 3px),
    repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(38,34,28,0.02) 3px, rgba(38,34,28,0.02) 4px);
}

/* ========== SECTION COMMON ========== */
.section {
  position: relative;
  padding: 120px 48px;
  z-index: 3;
}
.section-inner {
  max-width: 1280px;
  margin: 0 auto;
}
.section-head {
  text-align: center;
  margin-bottom: 72px;
}
.section-eyebrow {
  display: inline-block;
  font-size: 13px;
  letter-spacing: 6px;
  color: var(--vermilion);
  margin-bottom: 16px;
  font-weight: 500;
}
.section-title {
  font-family: "Noto Serif SC", serif;
  font-size: clamp(32px, 4vw, 48px);
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 4px;
  margin-bottom: 16px;
}
.section-subtitle {
  font-size: 15px;
  color: var(--ink-soft);
  max-width: 520px;
  margin: 0 auto;
  line-height: 1.8;
}

/* ========== STATS SECTION ========== */
.stats {
  background: var(--paper-2);
  padding: 80px 48px;
  position: relative;
  z-index: 3;
}
.stats-grid {
  max-width: 1280px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 32px;
  text-align: center;
}
.stat-item {
  padding: 32px 16px;
  border-right: 1px solid rgba(38,34,28,0.1);
}
.stat-item:last-child { border-right: none; }
.stat-number {
  font-family: "Noto Serif SC", serif;
  font-size: clamp(36px, 5vw, 56px);
  font-weight: 900;
  color: var(--vermilion);
  line-height: 1;
  margin-bottom: 12px;
  letter-spacing: 2px;
}
.stat-number .unit {
  font-size: 0.4em;
  color: var(--ink-soft);
  margin-left: 4px;
  font-weight: 500;
}
.stat-label {
  font-size: 14px;
  color: var(--ink-soft);
  letter-spacing: 3px;
}
@media (max-width: 768px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .stat-item { border-right: none; border-bottom: 1px solid rgba(38,34,28,0.1); }
}

/* ========== COLLECTION SECTION ========== */
.collection-filters {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 56px;
  flex-wrap: wrap;
}
.filter-chip {
  padding: 10px 24px;
  border: 1px solid rgba(38,34,28,0.15);
  border-radius: 30px;
  font-size: 14px;
  color: var(--ink-soft);
  transition: all .3s;
  background: transparent;
  letter-spacing: 2px;
}
.filter-chip:hover {
  border-color: var(--vermilion);
  color: var(--vermilion);
}
.filter-chip.active {
  background: var(--vermilion);
  color: #fff;
  border-color: var(--vermilion);
  box-shadow: 0 4px 16px rgba(199,62,46,0.25);
}
.collection-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px;
}
.kite-card {
  position: relative;
  background: #fff;
  border-radius: 4px;
  overflow: hidden;
  transition: transform .5s cubic-bezier(.2,.7,.2,1), box-shadow .5s;
  transform-style: preserve-3d;
  box-shadow: 0 4px 20px rgba(38,34,28,0.06);
  will-change: transform;
}
.kite-card:hover {
  box-shadow: 0 20px 50px rgba(38,34,28,0.15);
}
.kite-card-img {
  position: relative;
  aspect-ratio: 4/3;
  overflow: hidden;
  background: var(--paper-2);
}
.kite-card-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .7s cubic-bezier(.2,.7,.2,1);
}
.kite-card:hover .kite-card-img img {
  transform: scale(1.06);
}
.kite-card-tag {
  position: absolute;
  top: 16px;
  left: 16px;
  background: rgba(247,242,231,0.9);
  backdrop-filter: blur(6px);
  padding: 6px 14px;
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--dai-green);
  border-radius: 2px;
  font-weight: 500;
}
.kite-card-body {
  padding: 24px 28px 28px;
}
.kite-card-dynasty {
  font-size: 12px;
  color: var(--ink-light);
  letter-spacing: 3px;
  margin-bottom: 8px;
}
.kite-card-name {
  font-family: "Noto Serif SC", serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 10px;
  letter-spacing: 2px;
}
.kite-card-desc {
  font-size: 14px;
  color: var(--ink-soft);
  line-height: 1.7;
  margin-bottom: 16px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.kite-card-link {
  font-size: 13px;
  color: var(--vermilion);
  letter-spacing: 2px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: gap .3s;
}
.kite-card:hover .kite-card-link {
  gap: 12px;
}
@media (max-width: 900px) {
  .collection-grid { grid-template-columns: 1fr; }
}

/* ========== ARTISANS SECTION ========== */
.artisans {
  background: var(--dai-green-dark);
  color: var(--paper);
  position: relative;
  overflow: hidden;
}
.artisans .section-title { color: var(--paper); }
.artisans .section-subtitle { color: rgba(247,242,231,0.7); }
.artisans .section-eyebrow { color: var(--rattan); }
.artisans-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 40px;
}
.artisan-card {
  text-align: center;
}
.artisan-avatar-wrap {
  position: relative;
  width: 160px;
  height: 160px;
  margin: 0 auto 24px;
}
.artisan-avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--rattan);
  transition: transform .4s;
}
.artisan-card:hover .artisan-avatar {
  transform: scale(1.04);
}
.artisan-pulse {
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  border: 2px solid var(--rattan);
  opacity: 0;
  animation: pulse-ring 3s ease-out infinite;
}
.artisan-card:nth-child(2) .artisan-pulse { animation-delay: 1s; }
.artisan-card:nth-child(3) .artisan-pulse { animation-delay: 2s; }
@keyframes pulse-ring {
  0% { transform: scale(0.9); opacity: 0.6; }
  100% { transform: scale(1.2); opacity: 0; }
}
.artisan-name {
  font-family: "Noto Serif SC", serif;
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 6px;
  letter-spacing: 3px;
}
.artisan-title {
  font-size: 13px;
  color: var(--rattan);
  letter-spacing: 4px;
  margin-bottom: 16px;
}
.artisan-bio {
  font-size: 14px;
  color: rgba(247,242,231,0.7);
  line-height: 1.8;
  max-width: 280px;
  margin: 0 auto;
}
.artisan-deco {
  position: absolute;
  font-size: 300px;
  font-family: "Noto Serif SC", serif;
  font-weight: 900;
  color: rgba(247,242,231,0.03);
  pointer-events: none;
  line-height: 1;
}
.artisan-deco.left { top: 10%; left: -40px; }
.artisan-deco.right { bottom: 5%; right: -40px; }
@media (max-width: 900px) {
  .artisans-grid { grid-template-columns: 1fr; gap: 48px; }
}

/* ========== EXHIBITION SECTION ========== */
.exhibition {
  background: var(--paper);
}
.exhibition-featured {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 60px;
  align-items: center;
  margin-bottom: 80px;
}
.exhibition-img {
  position: relative;
  aspect-ratio: 4/3;
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(38,34,28,0.15);
}
.exhibition-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.exhibition-img::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background: linear-gradient(135deg, rgba(199,62,46,0.1) 0%, transparent 50%);
}
.exhibition-badge {
  position: absolute;
  top: 24px;
  left: 24px;
  z-index: 3;
  background: var(--vermilion);
  color: #fff;
  padding: 8px 20px;
  font-size: 13px;
  letter-spacing: 3px;
  border-radius: 2px;
  font-weight: 500;
}
.exhibition-info h3 {
  font-family: "Noto Serif SC", serif;
  font-size: 36px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 20px;
  letter-spacing: 3px;
  line-height: 1.4;
}
.exhibition-meta {
  display: flex;
  gap: 28px;
  margin-bottom: 24px;
  font-size: 14px;
  color: var(--ink-soft);
  flex-wrap: wrap;
}
.exhibition-meta-item {
  display: flex;
  align-items: center;
  gap: 8px;
}
.exhibition-meta-item .dot {
  width: 6px;
  height: 6px;
  background: var(--vermilion);
  border-radius: 50%;
}
.exhibition-desc {
  font-size: 15px;
  color: var(--ink-soft);
  line-height: 1.9;
  margin-bottom: 28px;
}
.exhibition-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
}
.exh-item {
  display: flex;
  gap: 20px;
  padding: 24px;
  background: #fff;
  border-radius: 4px;
  transition: transform .4s cubic-bezier(.2,.7,.2,1), box-shadow .4s;
  box-shadow: 0 4px 20px rgba(38,34,28,0.05);
  cursor: none;
  position: relative;
  overflow: hidden;
}
.exh-item::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--vermilion);
  transform: scaleY(0);
  transform-origin: top;
  transition: transform .4s cubic-bezier(.2,.7,.2,1);
}
.exh-item:hover {
  transform: translateY(-4px);
  box-shadow: 0 16px 40px rgba(38,34,28,0.1);
}
.exh-item:hover::before {
  transform: scaleY(1);
}
.exh-item-img {
  width: 80px;
  height: 80px;
  border-radius: 2px;
  object-fit: cover;
  flex-shrink: 0;
}
.exh-item-info h4 {
  font-family: "Noto Serif SC", serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 6px;
  letter-spacing: 1px;
}
.exh-item-date {
  font-size: 12px;

/* ============ REDUCED MOTION CHECK ============ */
const prefersReducedMotion = typeof window !== 'undefined'

/* ============ CUSTOM CURSOR COMPONENT ============ */
function CustomCursor() {
  const ringRef = useRef(null);
  const dotRef = useRef(null);
  const layerRef = useRef(null);
  const rafIdRef = useRef(null);
  const mouseRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const ringPosRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const isHoverRef = useRef(false);

  useEffect(() => {
    if (prefersReducedMotion) return;

    const onMouseMove = (e) => {
      mouseRef.current.x = e.clientX;
      mouseRef.current.y = e.clientY;
      // dot follows instantly (direct DOM)
      if (dotRef.current) {
        dotRef.current.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%, -50%)`;
      }
    };

    // Ring follows with spring-like damping using RAF
    let lastTime = performance.now();
    const animate = (now) => {
      const dt = Math.min((now - lastTime) / 16.67, 3);
      lastTime = now;

      const ease = 0.15 * dt;
      ringPosRef.current.x += (mouseRef.current.x - ringPosRef.current.x) * ease;
      ringPosRef.current.y += (mouseRef.current.y - ringPosRef.current.y) * ease;

      if (ringRef.current) {
        ringRef.current.style.transform =
          `translate(${ringPosRef.current.x}px, ${ringPosRef.current.y}px) translate(-50%, -50%)`;
      }
      rafIdRef.current = requestAnimationFrame(animate);
    };
    rafIdRef.current = requestAnimationFrame(animate);

    const onMouseOver = (e) => {
      const target = e.target.closest('a, button, [data-hoverable], input, .kite-card, .exh-item, .filter-chip, .event-item');
      if (target && ringRef.current) {
        ringRef.current.classList.add('is-hover');
        isHoverRef.current = true;
      }
    };
    const onMouseOut = (e) => {
      const target = e.target.closest('a, button, [data-hoverable], input, .kite-card, .exh-item, .filter-chip, .event-item');
      if (target && ringRef.current) {
        ringRef.current.classList.remove('is-hover');
        isHoverRef.current = false;
      }
    };

    const onClick = (e) => {
      if (!layerRef.current) return;
      const ripple = document.createElement('div');
      ripple.className = 'ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      layerRef.current.appendChild(ripple);
      if (ringRef.current) {
        ringRef.current.classList.add('is-click');
        setTimeout(() => ringRef.current && ringRef.current.classList.remove('is-click'), 150);
      }
      setTimeout(() => ripple.remove(), 700);
    };

    const onVisibility = () => {
      if (document.hidden) {
        if (rafIdRef.current) cancelAnimationFrame(rafIdRef.current);
      } else {
        lastTime = performance.now();
        rafIdRef.current = requestAnimationFrame(animate);
      }
    };

    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mouseover', onMouseOver);
    window.addEventListener('mouseout', onMouseOut);
    window.addEventListener('click', onClick);
    document.addEventListener('visibilitychange', onVisibility);

    return () => {
      if (rafIdRef.current) cancelAnimationFrame(rafIdRef.current);
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('mouseover', onMouseOver);
      window.removeEventListener('mouseout', onMouseOut);
      window.removeEventListener('click', onClick);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, []);

  if (prefersReducedMotion) return null;

  return (
    <div className="cursor-layer" ref={layerRef}>
      <div className="cursor-ring" ref={ringRef} style={{
        transform: `translate(${window.innerWidth/2}px, ${window.innerHeight/2}px) translate(-50%, -50%)`
      }}>
        <div className="cursor-dot" ref={dotRef} style={{
          transform: `translate(${window.innerWidth/2}px, ${window.innerHeight/2}px) translate(-50%, -50%)`
        }}></div>
      </div>
    </div>
  );
}

/* ============ WIND PARTICLES ============ */
function WindParticles() {
  const layerRef = useRef(null);
  const rafIdRef = useRef(null);
  const particlesRef = useRef([]);

  useEffect(() => {
    if (prefersReducedMotion) return;
    const layer = layerRef.current;
    if (!layer) return;

    const PARTICLE_COUNT = 25;
    const particles = [];

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const el = document.createElement('div');
      el.className = 'wind-particle';
      const size = Math.random() * 3 + 1;
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.background = `rgba(47, 93, 80, ${Math.random() * 0.3 + 0.1})`;
      el.style.borderRadius = '50%';
      layer.appendChild(el);
      particles.push({
        el,
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: Math.random() * 0.8 + 0.2,
        vy: (Math.random() - 0.5) * 0.3,
        size,
        baseOpacity: Math.random() * 0.5 + 0.2,
        wiggleSpeed: Math.random() * 0.02 + 0.01,
        wiggleOffset: Math.random() * Math.PI * 2,
        phase: Math.random() * Math.PI * 2,
      });
    }
    particlesRef.current = particles;

    let time = 0;
    const animate = () => {
      time += 1;
      particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy + Math.sin(time * p.wiggleSpeed + p.wiggleOffset) * 0.3;

        if (p.x > window.innerWidth + 20) {
          p.x = -20;
          p.y = Math.random() * window.innerHeight;
        }
        if (p.y < -20) p.y = window.innerHeight + 20;
        if (p.y > window.innerHeight + 20) p.y = -20;

        const opacity = p.baseOpacity * (0.6 + 0.4 * Math.sin(time * 0.03 + p.phase));
        p.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
        p.el.style.opacity = opacity;
      });
      rafIdRef.current = requestAnimationFrame(animate);
    };
    rafIdRef.current = requestAnimationFrame(animate);

    const onVisibility = () => {
      if (document.hidden) {
        if (rafIdRef.current) cancelAnimationFrame(rafIdRef.current);
      } else {
        rafIdRef.current = requestAnimationFrame(animate);
      }
    };
    document.addEventListener('visibilitychange', onVisibility);

    return () => {
      if (rafIdRef.current) cancelAnimationFrame(rafIdRef.current);
      document.removeEventListener('visibilitychange', onVisibility);
      particles.forEach(p => p.el.remove());
    };
  }, []);

  return <div className="particles-layer" ref={layerRef}></div>;
}

/* ============ KITE HERO SWAY (physics pendulum) ============ */
function HeroKite() {
  const kiteWrapRef = useRef(null);
  const stringRef = useRef(null);
  const rafIdRef = useRef(null);

  useEffect(() => {
    if (prefersReducedMotion) return;
    const wrap = kiteWrapRef.current;
    const string = stringRef.current;
    if (!wrap || !string) return;

    // Pendulum physics
    let angle = 0.08; // radians, initial offset
    let angleVel = 0;
    const gravity = 0.0012;
    const damping = 0.998;
    let windForce = 0;
    let windTimer = 0;
    let nextWind = 120;

    const animate = () => {
      windTimer++;
      if (windTimer >= nextWind) {
        windForce = (Math.random() - 0.3) * 0.003;
        windTimer = 0;
        nextWind = 80 + Math.random() * 160;
      }

      // Wind dies down
      windForce *= 0.99;

      // Pendulum equation: angular accel = -(g/l) * sin(angle) + wind
      const angleAcc = -gravity * Math.sin(angle) + windForce;
      angleVel += angleAcc;
      angleVel *= damping;
      angle += angleVel;

      const deg = angle * 180 / Math.PI;
      wrap.style.transform = `rotate(${deg}deg) translateX(-50%)`;
      string.style.transform = `rotate(${deg}deg)`;

      rafIdRef.current = requestAnimationFrame(animate);
    };
    rafIdRef.current = requestAnimationFrame(animate);

    const onVisibility = () => {
      if (document.hidden) {
        if (rafIdRef.current) cancelAnimationFrame(rafIdRef.current);
      } else {
        rafIdRef.current = requestAnimationFrame(animate);
      }
    };
    document.addEventListener('visibilitychange', onVisibility);

    return () => {
      if (rafIdRef.current) cancelAnimationFrame(rafIdRef.current);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, []);

  return (
    <>
      <div className="hero-kite-string" ref={stringRef}></div>
      <div className="hero-kite-wrap" ref={kiteWrapRef} style={{ transform: 'rotate(0deg) translateX(-50%)' }}>
        <img className="hero-kite" src={IMG.swallowKite} alt="沙燕风筝" />
      </div>
    </>
  );
}

/* ============ TYPEWRITER ============ */
function Typewriter({ texts, speed = 80, pause = 2000 }) {
  const [displayText, setDisplayText] = useState('');
  const [textIdx, setTextIdx] = useState(0);
  const [charIdx, setCharIdx] = useState(0);
  const [isDeleting, setIsDeleting] = useState(false);
  const timeoutRef = useRef(null);

  useEffect(() => {
    if (prefersReducedMotion) {
      setDisplayText(texts[0]);
      return;
    }

    const currentText = texts[textIdx];
    let delay = isDeleting ? speed / 2 : speed;

    if (!isDeleting && charIdx === currentText.length) {
      delay = pause;
      timeoutRef.current = setTimeout(() => {
        setIsDeleting(true);
      }, delay);
      return;
    }

    if (isDeleting && charIdx === 0) {
      setIsDeleting(false);
      setTextIdx((i) => (i + 1) % texts.length);
      return;
    }

    timeoutRef.current = setTimeout(() => {
      setDisplayText(currentText.substring(0, isDeleting ? charIdx - 1 : charIdx + 1));
      setCharIdx(isDeleting ? charIdx - 1 : charIdx + 1);
    }, delay);

    return () => {
      if (timeoutRef.current) clearTimeout(timeoutRef.current);
    };
  }, [charIdx, isDeleting, textIdx, texts, speed, pause]);

  return (
    <span className="hero-typewriter">
      {displayText}
      <span className="caret"></span>
    </span>
  );
}

/* ============ NUMBER COUNTER ============ */
function NumberCounter({ end, suffix = '', duration = 2000, start = 0 }) {
  const [value, setValue] = useState(start);
  const ref = useRef(null);
  const startTimeRef = useRef(null);
  const rafRef = useRef(null);
  const hasAnimatedRef = useRef(false);

  useEffect(() => {
    if (prefersReducedMotion) {
      setValue(end);
      return;
    }
    const el = ref.current;
    if (!el) return;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting && !hasAnimatedRef.current) {
          hasAnimatedRef.current = true;
          startTimeRef.current = performance.now();

          const easeOutExpo = (t) => t === 1 ? 1 : 1 - Math.pow(2, -10 * t);

          const tick = (now) => {
            const progress = Math.min((now - startTimeRef.current) / duration, 1);
            const eased = easeOutExpo(progress);
            setValue(Math.floor(start + (end - start) * eased));
            if (progress < 1) {
              rafRef.current = requestAnimationFrame(tick);
            }
          };
          rafRef.current = requestAnimationFrame(tick);
        }
      });
    }, { threshold: 0.3 });

    observer.observe(el);

    return () => {
      observer.disconnect();
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [end, start, duration]);

  return <span ref={ref}>{value}{suffix}</span>;
}

/* ============ SCROLL REVEAL HOOK ============ */
function useScrollReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    if (!els.length) return;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });

    els.forEach((el) => observer.observe(el));
    return () => observer.disconnect();
  }, []);
}

/* ============ 3D TILT CARD ============ */
function TiltCard({ children, className = '' }) {
  const cardRef = useRef(null);

  useEffect(() => {
    if (prefersReducedMotion) return;
    const card = cardRef.current;
    if (!card) return;

    let rafId = null;
    let targetRotX = 0, targetRotY = 0;
    let curRotX = 0, curRotY = 0;

    const onMouseMove = (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      targetRotY = ((x - centerX) / centerX) * 6;
      targetRotX = -((y - centerY) / centerY) * 6;
    };

    const onMouseLeave = () => {
      targetRotX = 0;
      targetRotY = 0;
    };

    const animate = () => {
      curRotX += (targetRotX - curRotX) * 0.12;
      curRotY += (targetRotY - curRotY) * 0.12;
      card.style.transform = `perspective(1000px) rotateX(${curRotX}deg) rotateY(${curRotY}deg)`;
      rafId = requestAnimationFrame(animate);
    };

    card.addEventListener('mousemove', onMouseMove);
    card.addEventListener('mouseleave', onMouseLeave);
    rafId = requestAnimationFrame(animate);

    return () => {
      card.removeEventListener('mousemove', onMouseMove);
      card.removeEventListener('mouseleave', onMouseLeave);
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, []);

  return (
    <div ref={cardRef} className={className}>
      {children}
    </div>
  );
}

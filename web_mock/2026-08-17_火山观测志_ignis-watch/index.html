<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>Ignis Watch · 火山观测志</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,800;9..144,900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />
<style>
  /* ===== RESET & BASE ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #1A1714;
    color: #EFE7DA;
    overflow-x: hidden;
    cursor: none;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  @media (max-width: 768px) { body { cursor: auto; } }

  img { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; cursor: none; }
  button { font-family: inherit; cursor: none; border: none; background: none; color: inherit; }
  @media (max-width: 768px) { a, button { cursor: auto; } }

  /* ===== COLOR TOKENS ===== */
  :root {
    --basalt: #1A1714;
    --basalt-light: #2A2520;
    --basalt-lighter: #3A332C;
    --lava: #E8502F;
    --lava-dark: #C23A1E;
    --sulfur: #F2B33D;
    --sulfur-dark: #D99A25;
    --ash: #EFE7DA;
    --ash-dim: #B8AE9E;
    --ash-dark: #6B6358;
  }

  /* ===== CUSTOM CURSOR ===== */
  .cursor-ring, .cursor-dot {
    position: fixed;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 9999;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    will-change: transform;
    mix-blend-mode: difference;
  }
  .cursor-ring {
    width: 36px; height: 36px;
    border: 2px solid #fff;
    box-shadow:
      0 0 12px rgba(232, 80, 47, 0.8),
      0 0 24px rgba(242, 179, 61, 0.4),
      inset 0 0 6px rgba(255,255,255,0.1);
    transition: width 0.25s cubic-bezier(.25,1.5,.5,1), height 0.25s cubic-bezier(.25,1.5,.5,1),
                border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .cursor-dot {
    width: 8px; height: 8px;
    background: var(--lava);
    box-shadow: 0 0 8px var(--lava), 0 0 16px var(--sulfur);
    transition: width 0.15s ease, height 0.15s ease, background 0.2s ease;
  }
  .cursor-ring.hover {
    width: 56px; height: 56px;
    border-color: var(--sulfur);
    box-shadow:
      0 0 20px rgba(242, 179, 61, 0.9),
      0 0 40px rgba(232, 80, 47, 0.5),
      inset 0 0 10px rgba(242, 179, 61, 0.2);
  }
  .cursor-dot.hover { width: 4px; height: 4px; background: var(--sulfur); }
  .cursor-ring.click {
    width: 20px; height: 20px;
    transition: width 0.08s ease, height 0.08s ease;
  }
  .cursor-dot.click { width: 12px; height: 12px; }
  .cursor-ripple {
    position: fixed;
    pointer-events: none;
    z-index: 9998;
    border: 1.5px solid var(--sulfur);
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0.8;
    animation: rippleOut 0.6s cubic-bezier(.2,.8,.2,1) forwards;
    mix-blend-mode: screen;
  }
  @keyframes rippleOut {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0.8; border-width: 2px; }
    100% { transform: translate(-50%, -50%) scale(4); opacity: 0; border-width: 0.5px; }
  }
  @media (max-width: 768px) {
    .cursor-ring, .cursor-dot { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cursor-ring, .cursor-dot { display: none; }
    body { cursor: auto; }
  }

  /* ===== NAVIGATION ===== */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 20px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.3s ease, backdrop-filter 0.3s ease, padding 0.3s ease;
  }
  .nav.scrolled {
    background: rgba(26, 23, 20, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 12px 40px;
    border-bottom: 1px solid rgba(232, 80, 47, 0.15);
  }
  .nav-logo {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-logo-mark {
    width: 28px; height: 28px;
    position: relative;
  }
  .nav-logo-mark svg { width: 100%; height: 100%; }
  .nav-links {
    display: flex;
    gap: 36px;
    list-style: none;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .nav-links a {
    position: relative;
    padding: 4px 0;
    transition: color 0.3s ease;
  }
  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 0; height: 1px;
    background: var(--lava);
    transition: width 0.4s cubic-bezier(.2,.8,.2,1);
  }
  .nav-links a:hover { color: var(--lava); }
  .nav-links a:hover::after { width: 100%; }
  .nav-cta {
    padding: 10px 22px;
    border: 1px solid var(--ash-dim);
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.02em;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .nav-cta::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(242, 179, 61, 0.3), transparent);
    transition: left 0.6s ease;
  }
  .nav-cta:hover {
    border-color: var(--sulfur);
    color: var(--sulfur);
    box-shadow: 0 0 20px rgba(242, 179, 61, 0.2);
  }
  .nav-cta:hover::before { left: 100%; }
  @media (max-width: 768px) {
    .nav { padding: 16px 20px; }
    .nav-links { display: none; }
  }

  /* ===== HERO ===== */
  .hero {
    position: relative;
    height: 100vh;
    min-height: 700px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hero-bg {
    position: absolute;
    inset: 0;
    background-image: url('/spark/app/app_17c8cuqa67a/runtime/api/v1/storage/object/bucket_aadkqhtrqqqiu_static/static%2Faadkqhknglces_ve_miaoda');
    background-size: cover;
    background-position: center;
    filter: brightness(0.55) contrast(1.1);
    will-change: transform;
  }
  .hero-overlay {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(26,23,20,0.3) 0%, rgba(26,23,20,0.6) 50%, rgba(26,23,20,1) 100%),
      radial-gradient(ellipse at center bottom, rgba(232,80,47,0.2) 0%, transparent 60%);
  }
  .hero-particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    will-change: transform, opacity;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 900px;
    padding: 0 24px;
  }
  .hero-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--sulfur);
    margin-bottom: 24px;
    opacity: 0;
    animation: fadeUp 1s 0.2s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .hero-title {
    font-family: 'Fraunces', serif;
    font-size: clamp(48px, 9vw, 120px);
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.03em;
    margin-bottom: 28px;
    opacity: 0;
    animation: fadeUp 1s 0.4s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .hero-title .line { display: block; overflow: hidden; }
  .hero-title .line span {
    display: inline-block;
    background: linear-gradient(180deg, var(--ash) 0%, var(--ash-dim) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero-title .accent {
    color: var(--lava);
    font-style: italic;
    font-weight: 600;
    background: linear-gradient(180deg, var(--lava) 0%, var(--sulfur) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero-sub {
    font-size: clamp(14px, 1.4vw, 18px);
    color: var(--ash-dim);
    max-width: 560px;
    margin: 0 auto 40px;
    line-height: 1.7;
    opacity: 0;
    animation: fadeUp 1s 0.6s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .hero-actions {
    display: flex;
    gap: 16px;
    justify-content: center;
    opacity: 0;
    animation: fadeUp 1s 0.8s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .btn-primary {
    padding: 16px 32px;
    background: var(--lava);
    color: #fff;
    border-radius: 100px;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.01em;
    transition: all 0.3s cubic-bezier(.2,.8,.2,1);
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(232, 80, 47, 0.4);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(232, 80, 47, 0.5);
    background: #F0623F;
  }
  .btn-secondary {
    padding: 16px 32px;
    border: 1px solid var(--ash-dim);
    border-radius: 100px;
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 0.01em;
    transition: all 0.3s ease;
  }
  .btn-secondary:hover {
    border-color: var(--sulfur);
    color: var(--sulfur);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== SEISMOGRAPH (hero bottom) ===== */
  .seismo-wrap {
    position: absolute;
    bottom: 40px;
    left: 40px;
    right: 40px;
    display: flex;
    align-items: center;
    gap: 20px;
    z-index: 3;
    opacity: 0;
    animation: fadeUp 1s 1.2s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .seismo-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ash-dark);
    flex-shrink: 0;
  }
  .seismo-canvas {
    flex: 1;
    height: 60px;
    position: relative;
    overflow: hidden;
  }
  .seismo-canvas canvas { width: 100%; height: 100%; display: block; }
  .seismo-data {
    display: flex;
    gap: 24px;
    flex-shrink: 0;
  }
  .seismo-datum {
    text-align: right;
  }
  .seismo-datum .val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    color: var(--sulfur);
    font-variant-numeric: tabular-nums;
  }
  .seismo-datum .lbl {
    font-size: 10px;
    color: var(--ash-dark);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  @media (max-width: 768px) {
    .seismo-wrap { flex-direction: column; left: 20px; right: 20px; bottom: 20px; }
    .seismo-data { justify-content: center; }
  }

  /* ===== SCROLL INDICATOR ===== */
  .scroll-indicator {
    position: absolute;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    opacity: 0;
    animation: fadeUp 1s 1.4s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .scroll-indicator span {
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ash-dark);
  }
  .scroll-line {
    width: 1px; height: 40px;
    background: linear-gradient(180deg, var(--ash-dark), transparent);
    position: relative;
    overflow: hidden;
  }
  .scroll-line::after {
    content: '';
    position: absolute;
    top: -20px; left: 0;
    width: 1px; height: 20px;
    background: var(--lava);
    animation: scrollDown 2s cubic-bezier(.6,.1,.3,1) infinite;
  }
  @keyframes scrollDown {
    0% { top: -20px; }
    100% { top: 100%; }
  }
  @media (max-width: 768px) {
    .scroll-indicator { bottom: 140px; }
  }

  /* ===== SECTIONS BASE ===== */
  .section {
    padding: 120px 40px;
    position: relative;
  }
  .section-inner {
    max-width: 1280px;
    margin: 0 auto;
  }
  .section-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--lava);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-label::before {
    content: '';
    width: 24px; height: 1px;
    background: var(--lava);
  }
  .section-title {
    font-family: 'Fraunces', serif;
    font-size: clamp(32px, 5vw, 56px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin-bottom: 20px;
    max-width: 700px;
  }
  .section-desc {
    color: var(--ash-dim);
    max-width: 560px;
    font-size: 16px;
    line-height: 1.7;
  }
  @media (max-width: 768px) {
    .section { padding: 80px 20px; }
  }

  /* ===== REVEAL ON SCROLL ===== */
  .reveal {
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 0.8s cubic-bezier(.2,.8,.2,1), transform 0.8s cubic-bezier(.2,.8,.2,1);
  }
  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* ===== TICKER ===== */
  .ticker {
    padding: 24px 0;
    border-top: 1px solid rgba(239, 231, 218, 0.08);
    border-bottom: 1px solid rgba(239, 231, 218, 0.08);
    overflow: hidden;
    background: var(--basalt-light);
  }
  .ticker-track {
    display: flex;
    gap: 60px;
    animation: tickerScroll 40s linear infinite;
    white-space: nowrap;
  }
  .ticker-item {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.1em;
    color: var(--ash-dim);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .ticker-item .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--lava);
    box-shadow: 0 0 8px var(--lava);
    animation: pulse 2s ease-in-out infinite;
  }
  .ticker-item .dot.warn { background: var(--sulfur); box-shadow: 0 0 8px var(--sulfur); }
  .ticker-item .dot.calm { background: #4A7A55; box-shadow: 0 0 6px #4A7A55; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.7; }
  }
  @keyframes tickerScroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ticker-track { animation: none; }
  }

  /* ===== VOLCANO PROFILES ===== */
  .profiles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    margin-top: 60px;
  }
  .profile-card {
    position: relative;
    background: var(--basalt-light);
    border: 1px solid rgba(239, 231, 218, 0.06);
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.4s cubic-bezier(.2,.8,.2,1), border-color 0.3s ease, box-shadow 0.4s ease;
    transform-style: preserve-3d;
    perspective: 1000px;
  }
  .profile-card:hover {
    border-color: rgba(232, 80, 47, 0.3);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 40px rgba(232, 80, 47, 0.1);
  }
  .profile-img {
    width: 100%;
    aspect-ratio: 4/3;
    overflow: hidden;
    position: relative;
  }
  .profile-img img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.8s cubic-bezier(.2,.8,.2,1), filter 0.4s ease;
    filter: brightness(0.8) saturate(0.9);
  }
  .profile-card:hover .profile-img img {
    transform: scale(1.06);
    filter: brightness(0.9) saturate(1);
  }
  .profile-badge {
    position: absolute;
    top: 12px; right: 12px;
    padding: 6px 12px;
    background: rgba(26, 23, 20, 0.8);
    backdrop-filter: blur(8px);
    border-radius: 100px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .profile-badge.alert { color: var(--lava); }
  .profile-badge.warn { color: var(--sulfur); }
  .profile-badge.calm { color: #7BC48A; }
  .profile-badge .led {
    width: 6px; height: 6px;
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }
  .profile-badge.alert .led { background: var(--lava); box-shadow: 0 0 6px var(--lava); }
  .profile-badge.warn .led { background: var(--sulfur); box-shadow: 0 0 6px var(--sulfur); }
  .profile-badge.calm .led { background: #7BC48A; box-shadow: 0 0 6px #7BC48A; }

  .profile-body { padding: 24px; }
  .profile-name {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: -0.01em;
  }
  .profile-loc {
    font-size: 13px;
    color: var(--ash-dark);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .profile-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding-top: 16px;
    border-top: 1px solid rgba(239, 231, 218, 0.06);
  }
  .profile-stat .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--sulfur);
    font-variant-numeric: tabular-nums;
  }
  .profile-stat .lbl {
    font-size: 11px;
    color: var(--ash-dark);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* ===== ERUPTION TIMELINE ===== */
  .timeline-section {
    background: linear-gradient(180deg, var(--basalt) 0%, var(--basalt-light) 50%, var(--basalt) 100%);
    overflow: hidden;
  }
  .timeline-container {
    position: relative;
    margin-top: 80px;
  }
  .timeline-line {
    position: absolute;
    top: 50%; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--ash-dark) 10%, var(--ash-dark) 90%, transparent);
  }
  .timeline-events {
    display: flex;
    justify-content: space-between;
    position: relative;
    overflow-x: auto;
    gap: 40px;
    padding: 20px 0;
    scrollbar-width: none;
  }
  .timeline-events::-webkit-scrollbar { display: none; }
  .timeline-event {
    flex: 0 0 200px;
    text-align: center;
    position: relative;
    cursor: pointer;
  }
  .timeline-dot {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--basalt);
    border: 2px solid var(--ash-dark);
    margin: 0 auto;
    transition: all 0.3s ease;
    position: relative;
    z-index: 2;
  }
  .timeline-event.major .timeline-dot {
    width: 24px; height: 24px;
    border-color: var(--lava);
    background: var(--lava);
    box-shadow: 0 0 16px var(--lava), 0 0 32px rgba(232, 80, 47, 0.4);
  }
  .timeline-event:hover .timeline-dot {
    transform: scale(1.3);
    border-color: var(--sulfur);
    box-shadow: 0 0 20px var(--sulfur);
  }
  .timeline-year {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 8px;
    transition: color 0.3s ease;
  }
  .timeline-event:nth-child(odd) .timeline-year { margin-top: 60px; }
  .timeline-event:nth-child(even) .timeline-year { margin-bottom: 60px; }
  .timeline-name {
    font-size: 13px;
    color: var(--ash-dim);
    margin-bottom: 6px;
  }
  .timeline-desc {
    font-size: 12px;
    color: var(--ash-dark);
    line-height: 1.5;
    max-width: 180px;
    margin: 0 auto;
  }
  .timeline-event:hover .timeline-year { color: var(--sulfur); }

  /* ===== INSTRUMENT ARRAY ===== */
  .instruments-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-top: 60px;
  }
  .instrument-card {
    background: var(--basalt-light);
    border: 1px solid rgba(239, 231, 218, 0.06);
    border-radius: 12px;
    padding: 28px 24px;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
  }
  .instrument-card:hover {
    border-color: rgba(242, 179, 61, 0.3);
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  }

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ============================================================
   UTILITY HOOKS
============================================================ */

// Detect reduced motion
const useReducedMotion = () => {
  const [reduced, setReduced] = useState(false);
  useEffect(() => {
    const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    setReduced(mq.matches);
    const handler = (e) => setReduced(e.matches);
    mq.addEventListener('change', handler);
    return () => mq.removeEventListener('change', handler);
  }, []);
  return reduced;
};

// Intersection observer reveal
const useReveal = () => {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          obs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return ref;
};

/* ============================================================
   CUSTOM CURSOR (vanilla DOM — no React re-render per mouse move)
============================================================ */
const initCursor = () => {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced || window.innerWidth < 768) return { destroy: () => {} };

  const ring = document.getElementById('cursor-ring');
  const dot = document.getElementById('cursor-dot');
  if (!ring || !dot) return { destroy: () => {} };

  // Initialize at center
  ring.style.transform = `translate(${window.innerWidth/2}px, ${window.innerHeight/2}px) translate(-50%, -50%)`;
  dot.style.transform = `translate(${window.innerWidth/2}px, ${window.innerHeight/2}px) translate(-50%, -50%)`;

  let targetX = window.innerWidth / 2;
  let targetY = window.innerHeight / 2;
  let ringX = targetX;
  let ringY = targetY;
  let dotX = targetX;
  let dotY = targetY;
  let rafId = null;
  let running = true;

  const lerp = (a, b, t) => a + (b - a) * t;

  const animate = () => {
    if (!running) return;
    // Ring follows with damping (slower, springy)
    ringX = lerp(ringX, targetX, 0.12);
    ringY = lerp(ringY, targetY, 0.12);
    // Dot follows faster
    dotX = lerp(dotX, targetX, 0.35);
    dotY = lerp(dotY, targetY, 0.35);

    ring.style.transform = `translate(${ringX}px, ${ringY}px) translate(-50%, -50%)`;
    dot.style.transform = `translate(${dotX}px, ${dotY}px) translate(-50%, -50%)`;

    rafId = requestAnimationFrame(animate);
  };
  rafId = requestAnimationFrame(animate);

  const onMove = (e) => {
    targetX = e.clientX;
    targetY = e.clientY;
  };

  const addHover = (e) => {
    const target = e.target.closest('a, button, .hoverable, [role="button"], input, textarea, select, label');
    if (target) {
      ring.classList.add('hover');
      dot.classList.add('hover');
    } else {
      ring.classList.remove('hover');
      dot.classList.remove('hover');
    }
  };

  const spawnRipple = (e) => {
    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    ripple.style.width = '36px';
    ripple.style.height = '36px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);

    ring.classList.add('click');
    dot.classList.add('click');
    setTimeout(() => {
      ring.classList.remove('click');
      dot.classList.remove('click');
    }, 100);
  };

  const onVisibility = () => {
    if (document.hidden) {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
    } else {
      running = true;
      rafId = requestAnimationFrame(animate);
    }
  };

  document.addEventListener('mousemove', onMove, { passive: true });
  document.addEventListener('mouseover', addHover, { passive: true });
  document.addEventListener('click', spawnRipple);
  document.addEventListener('visibilitychange', onVisibility);

  return {
    destroy: () => {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseover', addHover);
      document.removeEventListener('click', spawnRipple);
      document.removeEventListener('visibilitychange', onVisibility);
    }
  };
};

/* ============================================================
   THERMAL PARTICLES (hero geothermal particles rising)
============================================================ */
const initParticles = (container) => {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced || !container) return { destroy: () => {} };

  const particles = [];
  const COUNT = 35;
  let rafId = null;
  let running = true;

  const createParticle = () => {
    const el = document.createElement('div');
    el.className = 'particle';
    const size = 2 + Math.random() * 5;
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    const hue = 20 + Math.random() * 20; // orange-yellow range
    el.style.background = `hsl(${hue}, 85%, ${55 + Math.random() * 20}%)`;
    el.style.boxShadow = `0 0 ${size * 2}px hsl(${hue}, 90%, 60%)`;
    el.style.opacity = '0';
    container.appendChild(el);
    return {
      el,
      x: Math.random() * window.innerWidth,
      y: window.innerHeight + Math.random() * 100,
      vy: -(0.3 + Math.random() * 0.8),
      vx: (Math.random() - 0.5) * 0.3,
      life: 0,
      maxLife: 200 + Math.random() * 300,
      size,
      driftPhase: Math.random() * Math.PI * 2,
      driftSpeed: 0.01 + Math.random() * 0.02
    };
  };

  for (let i = 0; i < COUNT; i++) {
    const p = createParticle();
    p.y = Math.random() * window.innerHeight;
    p.life = Math.random() * p.maxLife;
    particles.push(p);
  }

  const animate = () => {
    if (!running) return;
    particles.forEach(p => {
      p.life++;
      if (p.life > p.maxLife || p.y < -20) {
        // reset
        p.x = Math.random() * window.innerWidth;
        p.y = window.innerHeight + 10;
        p.vy = -(0.3 + Math.random() * 0.8);
        p.life = 0;
        p.maxLife = 200 + Math.random() * 300;
      }
      p.y += p.vy;
      p.driftPhase += p.driftSpeed;
      p.x += Math.sin(p.driftPhase) * 0.4;

      const lifeRatio = p.life / p.maxLife;
      const opacity = lifeRatio < 0.1 ? lifeRatio * 10 : (lifeRatio > 0.8 ? (1 - lifeRatio) * 5 : 1);
      p.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
      p.el.style.opacity = Math.min(1, Math.max(0, opacity)) * 0.8;
    });
    rafId = requestAnimationFrame(animate);
  };
  rafId = requestAnimationFrame(animate);

  const onVisibility = () => {
    if (document.hidden) {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
    } else {
      running = true;
      rafId = requestAnimationFrame(animate);
    }
  };
  document.addEventListener('visibilitychange', onVisibility);

  return {
    destroy: () => {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
      document.removeEventListener('visibilitychange', onVisibility);
      particles.forEach(p => p.el.remove());
    }
  };
};

/* ============================================================
   SEISMOGRAPH (real-time waveform)
============================================================ */
const Seismograph = () => {
  const canvasRef = useRef(null);
  const [temp, setTemp] = useState(1287);
  const [mag, setMag] = useState(2.4);
  const reduced = useReducedMotion();

  useEffect(() => {
    if (reduced) return;
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let rafId = null;
    let running = true;

    const resize = () => {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = canvas.offsetWidth * dpr;
      canvas.height = canvas.offsetHeight * dpr;
      ctx.scale(dpr, dpr);
    };
    resize();
    window.addEventListener('resize', resize);

    // Waveform data
    const W = () => canvas.offsetWidth;
    const H = () => canvas.offsetHeight;
    const points = [];
    const MAX_POINTS = 300;
    let t = 0;

    // Generate realistic seismic-like noise
    const noise = (phase) => {
      // Multiple sine waves + occasional spike = volcanic tremor
      const base = Math.sin(phase * 0.05) * 8;
      const mid = Math.sin(phase * 0.15) * 4;
      const fine = Math.sin(phase * 0.4) * 2;
      // Occasional micro-quake spike
      const spike = Math.random() > 0.985 ? (Math.random() - 0.5) * 30 : 0;
      // Harmonic tremor component
      const harmonic = Math.sin(phase * 0.02) * Math.sin(phase * 0.08) * 6;
      return base + mid + fine + spike + harmonic;
    };

    const draw = () => {
      if (!running) return;
      const w = W();
      const h = H();
      ctx.clearRect(0, 0, w, h);

      t += 1;
      const val = noise(t);
      points.push(val);
      if (points.length > MAX_POINTS) points.shift();

      // Grid lines
      ctx.strokeStyle = 'rgba(239, 231, 218, 0.06)';
      ctx.lineWidth = 0.5;
      for (let i = 1; i < 4; i++) {
        const y = (h / 4) * i;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      // Waveform
      ctx.beginPath();
      ctx.strokeStyle = '#E8502F';
      ctx.lineWidth = 1.5;
      ctx.shadowColor = '#E8502F';
      ctx.shadowBlur = 8;

      const step = w / MAX_POINTS;
      points.forEach((v, i) => {
        const x = i * step;
        const y = h / 2 + v;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Leading dot
      const lastX = (points.length - 1) * step;
      const lastY = h / 2 + points[points.length - 1];
      ctx.beginPath();
      ctx.fillStyle = '#F2B33D';
      ctx.shadowColor = '#F2B33D';
      ctx.shadowBlur = 12;
      ctx.arc(lastX, lastY, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      rafId = requestAnimationFrame(draw);
    };
    rafId = requestAnimationFrame(draw);

    const onVisibility = () => {
      if (document.hidden) {
        running = false;
        if (rafId) cancelAnimationFrame(rafId);
      } else {
        running = true;
        rafId = requestAnimationFrame(draw);
      }
    };
    document.addEventListener('visibilitychange', onVisibility);

    return () => {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
      window.removeEventListener('resize', resize);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, [reduced]);

  // Number roll for temp & mag
  useEffect(() => {
    if (reduced) return;
    let timer;
    const tick = () => {
      // Magma temperature fluctuates around 1250-1300°C
      setTemp(prev => {
        const target = 1250 + Math.random() * 60;
        return prev + (target - prev) * 0.1;
      });
      // Magnitude
      setMag(prev => {
        const target = 1.5 + Math.random() * 2;
        return prev + (target - prev) * 0.08;
      });
      timer = setTimeout(tick, 2000 + Math.random() * 1000);
    };
    tick();
    return () => clearTimeout(timer);
  }, [reduced]);

  return (
    <div className="seismo-wrap">
      <div className="seismo-label">实时地脉动监测</div>
      <div className="seismo-canvas">
        <canvas ref={canvasRef}></canvas>
      </div>
      <div className="seismo-data">
        <div className="seismo-datum">
          <div className="val">{Math.round(temp)}°C</div>
          <div className="lbl">岩浆温度</div>
        </div>
        <div className="seismo-datum">
          <div className="val">{mag.toFixed(1)}</div>
          <div className="lbl">震级 M</div>
        </div>
      </div>
    </div>
  );
};

/* ============================================================
   TYPEWRITER
============================================================ */
const Typewriter = ({ text, speed = 60, delay = 0 }) => {
  const [display, setDisplay] = useState('');
  const [done, setDone] = useState(false);
  const reduced = useReducedMotion();
  const ref = useReveal();

  useEffect(() => {
    if (reduced) { setDisplay(text); setDone(true); return; }
    let timeout;
    let i = 0;
    const startDelay = setTimeout(() => {
      const type = () => {
        if (i < text.length) {
          setDisplay(text.slice(0, i + 1));
          i++;
          timeout = setTimeout(type, speed + Math.random() * 40);
        } else {
          setDone(true);
        }
      };
      type();
    }, delay);
    return () => {
      clearTimeout(startDelay);
      clearTimeout(timeout);
    };
  }, [text, speed, delay, reduced]);

  return (
    <span ref={ref} className={done ? '' : 'typewriter'}>{display}</span>
  );
};

/* ============================================================
   COUNTER (spring-like digit roll)
============================================================ */
const CountUp = ({ target, duration = 2000, decimals = 0, suffix = '' }) => {
  const [val, setVal] = useState(0);
  const ref = useRef(null);
  const started = useRef(false);
  const reduced = useReducedMotion();

  useEffect(() => {
    if (reduced) { setVal(target); return; }
    const el = ref.current;
    if (!el) return;

    const obs = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !started.current) {
          started.current = true;
          const startTime = performance.now();
          const startVal = 0;

          // Ease out cubic
          const ease = (t) => 1 - Math.pow(1 - t, 3);

          const tick = (now) => {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const eased = ease(progress);
            setVal(startVal + (target - startVal) * eased);
            if (progress < 1) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        }
      });
    }, { threshold: 0.5 });
    obs.observe(el);
    return () => obs.disconnect();
  }, [target, duration, decimals, reduced]);

  return (
    <span ref={ref}>
      {decimals > 0 ? val.toFixed(decimals) : Math.round(val)}{suffix}
    </span>
  );
};

/* ============================================================
   3D TILT CARD (magnetic tilt via mousemove, direct DOM)
============================================================ */
const TiltCard = ({ children, className = '', maxTilt = 8 }) => {
  const cardRef = useRef(null);

  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const card = cardRef.current;
    if (!card || reduced) return;

    let rafId = null;
    let targetX = 0, targetY = 0;
    let curX = 0, curY = 0;
    let active = false;

    const animate = () => {
      curX += (targetX - curX) * 0.12;
      curY += (targetY - curY) * 0.12;
      card.style.transform = `perspective(1000px) rotateX(${curY}deg) rotateY(${curX}deg) translateY(-2px)`;
      if (Math.abs(targetX - curX) > 0.05 || Math.abs(targetY - curY) > 0.05 || active) {
        rafId = requestAnimationFrame(animate);
      } else {
        rafId = null;
      }
    };

    const onMove = (e) => {
      const rect = card.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      targetX = x * maxTilt * 2;
      targetY = -y * maxTilt * 2;
      if (!rafId) rafId = requestAnimationFrame(animate);
    };

    const onEnter = () => { active = true; };
    const onLeave = () => {
      active = false;
      targetX = 0; targetY = 0;
      if (!rafId) rafId = requestAnimationFrame(animate);
    };

    card.addEventListener('mousemove', onMove);
    card.addEventListener('mouseenter', onEnter);
    card.addEventListener('mouseleave', onLeave);

    return () => {
      card.removeEventListener('mousemove', onMove);
      card.removeEventListener('mouseenter', onEnter);
      card.removeEventListener('mouseleave', onLeave);
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, [maxTilt]);

  return (
    <div ref={cardRef} className={className} style={{ willChange: 'transform' }}>
      {children}
    </div>
  );
};

const Stratigraphy = () => {
  const sectionRef = useRef(null);

  const layers = [
    { name: '表层浮石层', period: '公元 79 年喷发', color: '#C8A878', depth: 0, thick: 40, desc: '维苏威火山碎屑流沉积' },

    { name: '玄武质熔岩', period: '中新世', color: '#3D3228', depth: 180, thick: 90, desc: '盾状火山基底' },
    { name: '深成岩基', period: '白垩纪', color: '#2A2318', depth: 275, thick: 120, desc: '岩浆房固化残余' },
  ];

  useEffect(() => {
    if (reduced) return;
    const section = sectionRef.current;

    let rafId = null;
    let running = true;
    let scrollY = 0;

    const onScroll = () => {
      scrollY = window.scrollY;
      if (!rafId) rafId = requestAnimationFrame(update);
    };

    const update = () => {
      if (!running) { rafId = null; return; }
      const rect = section.getBoundingClientRect();
      const viewportH = window.innerHeight;
      const progress = Math.max(0, Math.min(1, (viewportH - rect.top) / (viewportH + rect.height)));

      // Background parallax
      const bgOffset = (progress - 0.5) * 60;
      bg.style.transform = `translateY(${bgOffset}px) scale(1.1)`;

      // Layer parallax — each moves at different rate
      layersRef.current.forEach((layer, i) => {
        if (layer) {
          const rate = 0.2 + i * 0.15;
          const yOffset = (progress - 0.5) * 40 * rate;
          layer.style.transform = `translateY(${yOffset}px)`;
        }
      });

      rafId = requestAnimationFrame(update);
    };

    const onVisibility = () => {
      if (document.hidden) running = false;
      else running = true;
    };

    window.addEventListener('scroll', onScroll, { passive: true });
    document.addEventListener('visibilitychange', onVisibility);
    rafId = requestAnimationFrame(update);

    return () => {
      running = false;
      window.removeEventListener('scroll', onScroll);
      document.removeEventListener('visibilitychange', onVisibility);
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, [reduced]);

  const setLayerRef = (i) => (el) => { layersRef.current[i] = el; };

  return (
    <section ref={sectionRef} className="strat-section" id="stratigraphy">
      <div ref={bgRef} className="strat-bg"></div>

          <p>地质学家通过钻孔取样与放射性定年，逐层还原这座火山的喷发历史——也为未来的喷发预测提供关键依据。</p>
          <div className="strat-facts">

              <div className="num"><CountUp target={25} suffix="+" /></div>
              <div className="lbl">大型喷发记录</div>

              <div className="lbl">火山年龄</div>

          ))}

  );
};

// Helper: lighten/darken hex color
const adjustColor = (hex, amount) => {
  const num = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, (num >> 16) + amount));
  const g = Math.max(0, Math.min(255, ((num >> 8) & 0xFF) + amount));
  const b = Math.max(0, Math.min(255, (num & 0xFF) + amount));
  return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}`;
};

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>影戏人间 · 第四届木偶皮影戏剧节</title>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn-static.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn-static.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;500;600;700;900&family=ZCOOL+XiaoWei&display=swap" />
<style>
  :root {
    --paper: #F5EFE0;
    --paper-deep: #EBE3CF;
    --ink: #1a1410;
    --ink-soft: #3a2e24;
    --cinnabar: #C23B22;
    --cinnabar-deep: #8E2612;
    --gold: #C9A227;
    --gold-light: #E6C456;
    --warm-glow: #FFD180;
    --warm-glow-strong: #FFA940;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; overflow-x: hidden; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
    font-weight: 400;
    cursor: none;
    -webkit-font-smoothing: antialiased;
    text-wrap: pretty;
  }
  @media (prefers-reduced-motion: reduce) {
    body { cursor: auto; }
  }
  /* Paper texture overlay */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(194,59,34,0.03) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(201,162,39,0.04) 0%, transparent 50%);
    pointer-events: none; z-index: 1;
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(rgba(26,20,16,0.04) 1px, transparent 1px),
      radial-gradient(rgba(26,20,16,0.02) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 2px;
    pointer-events: none; z-index: 1;
    mix-blend-mode: multiply;
  }

  /* Custom cursor */
  .cursor-ring, .cursor-dot, .cursor-glow {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    will-change: transform, left, top;
  }
  .cursor-ring {
    width: 38px; height: 38px;
    border: 2px solid var(--cinnabar);
    transition: width .25s cubic-bezier(.34,1.56,.64,1),
                height .25s cubic-bezier(.34,1.56,.64,1),
                border-color .25s ease,
                background .25s ease;
    mix-blend-mode: difference;
  }
  .cursor-dot {
    width: 6px; height: 6px;
    background: var(--gold-light);
    box-shadow: 0 0 8px var(--gold-light), 0 0 16px rgba(230,196,86,0.5);
  }
  .cursor-glow {
    width: 80px; height: 80px;
    background: radial-gradient(circle, rgba(255,209,128,0.18) 0%, transparent 70%);
    pointer-events: none;
  }
  .cursor-ring.cursor-hover {
    width: 60px; height: 60px;
    border-color: var(--gold-light);
    background: rgba(230,196,86,0.1);
  }
  .cursor-ring.cursor-click {
    width: 28px; height: 28px;
    border-color: var(--warm-glow-strong);
  }
  @media (prefers-reduced-motion: reduce) {
    .cursor-ring, .cursor-dot, .cursor-glow { display: none; }
  }

  /* Ripple effect */
  .ripple {
    position: fixed;
    width: 0; height: 0;
    border: 2px solid var(--cinnabar);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 9998;
    animation: rippleExpand .7s cubic-bezier(.22,.61,.36,1) forwards;
  }
  @keyframes rippleExpand {
    0% { width: 0; height: 0; opacity: .6; border-width: 3px; }
    100% { width: 140px; height: 140px; opacity: 0; border-width: 1px; }
  }
  @media (prefers-reduced-motion: reduce) { .ripple { display: none; } }

  /* ===== HERO / Stage ===== */
  .hero {
    position: relative;
    width: 100%;
    min-height: 100vh;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    perspective: 1200px;
  }
  .hero-bg {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #E8DCC0 0%, var(--paper) 60%, var(--paper-deep) 100%);
  }
  /* Curtain */
  .curtain {
    position: absolute; inset: 0;
    display: flex; z-index: 20;
    pointer-events: none;
    transition: transform 1.8s cubic-bezier(.77,0,.18,1);
  }
  .curtain.hidden { pointer-events: none; }
  .curtain-left, .curtain-right {
    flex: 1;
    background: linear-gradient(90deg, var(--cinnabar-deep) 0%, var(--cinnabar) 30%, #D4482E 50%, var(--cinnabar) 70%, var(--cinnabar-deep) 100%);
    position: relative;
    box-shadow: inset 0 0 80px rgba(0,0,0,0.3);
  }
  .curtain-left {
    transform-origin: left;
    border-right: 1px solid rgba(0,0,0,0.2);
  }
  .curtain-right {
    transform-origin: right;
    border-left: 1px solid rgba(0,0,0,0.2);
  }
  .curtain.open .curtain-left { transform: translateX(-85%) skewY(-2deg); }
  .curtain.open .curtain-right { transform: translateX(85%) skewY(2deg); }
  /* Curtain folds */
  .curtain-left::before, .curtain-right::before {
    content: ''; position: absolute; top: 0; bottom: 0; width: 4px;
    background: linear-gradient(90deg, transparent, rgba(0,0,0,0.25), transparent);
  }
  .curtain-left::before { right: 15%; }
  .curtain-right::before { left: 15%; }
  /* Gold trim on curtain edge */
  .curtain-left::after {
    content: ''; position: absolute; top: 0; bottom: 0; right: 0;
    width: 8px;
    background: linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
    box-shadow: 2px 0 20px rgba(201,162,39,0.6);
  }
  .curtain-right::after {
    content: ''; position: absolute; top: 0; bottom: 0; left: 0;
    width: 8px;
    background: linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
    box-shadow: -2px 0 20px rgba(201,162,39,0.6);
  }
  /* Curtain top bar */
  .curtain-top {
    position: absolute; top: 0; left: 0; right: 0; height: 48px;
    background: linear-gradient(180deg, var(--ink) 0%, #2a2118 100%);
    z-index: 25;
    display: flex; align-items: center; justify-content: space-around;
  }
  .curtain-top::after {
    content: '';
    position: absolute; left: 10%; right: 10%; top: 100%;
    height: 6px;
    background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold), var(--gold-light), var(--gold));
    box-shadow: 0 4px 12px rgba(201,162,39,0.5);
  }
  .curtain-ornament {
    width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--gold-light), var(--gold));
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }

  /* Back screen / shadow play surface */
  .screen {
    position: absolute;
    top: 8%; bottom: 12%;
    left: 50%;
    transform: translateX(-50%);
    width: 62%;
    max-width: 900px;
    background: linear-gradient(180deg, #FAF3E0 0%, #F0E4C8 100%);
    border: 3px solid var(--ink-soft);
    box-shadow:
      inset 0 0 60px rgba(194,59,34,0.08),
      inset 0 0 120px rgba(26,20,16,0.05),
      0 20px 60px rgba(26,20,16,0.2),
      0 0 100px rgba(255,209,128,0.3);
    overflow: hidden;
    z-index: 5;
    border-radius: 4px;
  }
  .screen::before {
    content: '';
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(90deg, transparent 0, transparent 28px, rgba(194,59,34,0.025) 28px, rgba(194,59,34,0.025) 29px),
      repeating-linear-gradient(0deg, transparent 0, transparent 40px, rgba(26,20,16,0.02) 40px, rgba(26,20,16,0.02) 41px);
    pointer-events: none;
  }
  /* Light beam from behind */
  .lantern-glow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 140%; height: 140%;
    background: radial-gradient(ellipse at center, rgba(255,209,128,0.35) 0%, rgba(255,209,128,0.1) 30%, transparent 60%);
    pointer-events: none; z-index: 3;
    animation: glowPulse 6s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { opacity: .7; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
  }
  @media (prefers-reduced-motion: reduce) { .lantern-glow { animation: none; } }

  /* Shadow puppets / silhouettes layers */
  .silhouette {
    position: absolute;
    will-change: transform;
    pointer-events: none;
  }
  .silhouette svg { width: 100%; height: 100%; fill: var(--ink); }

  .shadow-layer-1 { bottom: 10%; left: 15%; width: 140px; height: 200px; z-index: 8;
    animation: sway1 4.2s ease-in-out infinite; transform-origin: top center; }
  .shadow-layer-2 { bottom: 8%; left: 45%; width: 120px; height: 180px; z-index: 7;
    animation: sway2 5.3s ease-in-out infinite; transform-origin: top center; }
  .shadow-layer-3 { bottom: 5%; right: 12%; width: 160px; height: 220px; z-index: 6;
    animation: sway3 3.8s ease-in-out infinite; transform-origin: top center; }
  .shadow-mountain {
    position: absolute; bottom: 0; left: 0; right: 0; height: 30%;
    z-index: 4; pointer-events: none;
  }
  .shadow-mountain svg { width: 100%; height: 100%; fill: var(--ink-soft); opacity: 0.7; }

  @keyframes sway1 {
    0%, 100% { transform: rotate(-2deg) translateY(0); }
    50% { transform: rotate(1.5deg) translateY(-4px); }
  }
  @keyframes sway2 {
    0%, 100% { transform: rotate(1deg) translateY(2px); }
    50% { transform: rotate(-1.8deg) translateY(-3px); }
  }
  @keyframes sway3 {
    0%, 100% { transform: rotate(-1.2deg) translateY(1px); }
    50% { transform: rotate(2deg) translateY(-5px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .shadow-layer-1, .shadow-layer-2, .shadow-layer-3 { animation: none; }
  }

  /* Hero title */
  .hero-title-wrap {
    position: relative; z-index: 30;
    text-align: center;
    pointer-events: none;
  }
  .hero-eyebrow {
    font-family: "ZCOOL XiaoWei", serif;
    font-size: 18px;
    letter-spacing: 0.6em;
    color: var(--cinnabar);
    margin-bottom: 24px;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 1s ease .6s forwards;
  }
  .hero-title {
    font-family: "Ma Shan Zheng", "ZCOOL XiaoWei", cursive;
    font-size: clamp(72px, 12vw, 180px);
    font-weight: 400;
    line-height: 1;
    color: var(--ink);
    text-shadow: 0 4px 20px rgba(255,209,128,0.3);
    letter-spacing: 0.05em;
    position: relative;
  }
  .hero-title .char {
    display: inline-block;
    opacity: 0;
    transform: translateY(40px);
    animation: charIn .8s cubic-bezier(.2,.9,.3,1.3) forwards;
  }
  .hero-title .char:nth-child(1) { animation-delay: .8s; }
  .hero-title .char:nth-child(2) { animation-delay: .95s; }
  .hero-title .char:nth-child(3) { animation-delay: 1.1s; }
  .hero-title .char:nth-child(4) { animation-delay: 1.25s; }
  @keyframes charIn {
    0% { opacity: 0; transform: translateY(40px) rotate(-5deg); }
    100% { opacity: 1; transform: translateY(0) rotate(0); }
  }
  .hero-subtitle {
    margin-top: 28px;
    font-size: 18px;
    letter-spacing: 0.4em;
    color: var(--ink-soft);
    opacity: 0;
    animation: fadeUp 1s ease 1.6s forwards;
  }
  .hero-meta {
    margin-top: 40px;
    display: flex;
    gap: 40px;
    justify-content: center;
    opacity: 0;
    animation: fadeUp 1s ease 1.9s forwards;
    pointer-events: auto;
  }
  .hero-meta-item {
    text-align: center;
  }
  .hero-meta-label {
    font-size: 12px;
    letter-spacing: 0.3em;
    color: var(--cinnabar);
    margin-bottom: 6px;
  }
  .hero-meta-value {
    font-size: 16px;
    font-weight: 500;
    color: var(--ink);
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero-eyebrow, .hero-subtitle, .hero-meta, .hero-title .char {
      opacity: 1; transform: none; animation: none;
    }
  }

  /* Scroll hint */
  .scroll-hint {
    position: absolute;
    bottom: 32px; left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    display: flex; flex-direction: column; align-items: center;
    gap: 8px;
    color: var(--ink-soft);
    font-size: 12px;
    letter-spacing: 0.3em;
  }
  .scroll-hint-line {
    width: 1px; height: 40px;
    background: linear-gradient(180deg, var(--cinnabar) 0%, transparent 100%);
    animation: scrollLine 2s ease-in-out infinite;
  }
  @keyframes scrollLine {
    0%, 100% { transform: scaleY(1); opacity: .5; }
    50% { transform: scaleY(1.3); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .scroll-hint-line { animation: none; } }

  /* ===== NAV ===== */
  .nav {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 0 48px;
    height: 64px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(245,239,224,0.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(26,20,16,0.08);
    transition: background .4s ease, box-shadow .4s ease;
  }
  .nav.scrolled {
    background: rgba(245,239,224,0.95);
    box-shadow: 0 4px 20px rgba(26,20,16,0.08);
  }
  .nav-logo {
    font-family: "Ma Shan Zheng", cursive;
    font-size: 28px;
    color: var(--cinnabar);
    cursor: none;
    user-select: none;
  }
  .nav-logo span { color: var(--ink); }
  .nav-links {
    display: flex; gap: 36px;
    list-style: none;
  }
  .nav-links li {
    position: relative;
    font-size: 14px;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
    cursor: none;
    padding: 4px 0;
    transition: color .3s ease;
  }
  .nav-links li::after {
    content: '';
    position: absolute; bottom: 0; left: 50%;
    width: 0; height: 2px;
    background: var(--cinnabar);
    transition: width .3s ease, left .3s ease;
  }
  .nav-links li:hover { color: var(--cinnabar); }
  .nav-links li:hover::after { width: 100%; left: 0; }
  .nav-cta {
    padding: 10px 24px;
    background: var(--cinnabar);
    color: var(--paper);
    border: none;
    font-size: 13px;
    letter-spacing: 0.2em;
    cursor: none;
    font-family: inherit;
    position: relative;
    overflow: hidden;
    transition: background .3s ease;
  }
  .nav-cta:hover { background: var(--cinnabar-deep); }
  .nav-cta::before {
    content: '';
    position: absolute; top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left .5s ease;
  }
  .nav-cta:hover::before { left: 100%; }

  /* Hamburger for mobile */
  .nav-burger { display: none; }

  @media (max-width: 768px) {
    .nav { padding: 0 20px; }
    .nav-links { display: none; }
    .nav-cta { display: none; }
    .nav-burger {
      display: block;
      width: 28px; height: 20px;
      position: relative;
      cursor: pointer;
    }
    .nav-burger span {
      position: absolute; left: 0; width: 100%; height: 2px;
      background: var(--ink);
      transition: .3s;
    }
    .nav-burger span:nth-child(1) { top: 0; }
    .nav-burger span:nth-child(2) { top: 50%; transform: translateY(-50%); }
    .nav-burger span:nth-child(3) { bottom: 0; }
  }

  /* ===== SECTIONS ===== */
  .section {
    position: relative;
    padding: 120px 48px;
    z-index: 2;
  }
  .section-inner {
    max-width: 1200px;
    margin: 0 auto;
  }
  .section-header {
    display: flex; align-items: center; gap: 24px;
    margin-bottom: 64px;
  }
  .section-zh {
    font-family: "Ma Shan Zheng", cursive;
    font-size: clamp(36px, 5vw, 56px);
    color: var(--ink);
    line-height: 1.1;
  }
  .section-en {
    font-size: 12px;
    letter-spacing: 0.4em;
    color: var(--cinnabar);
    text-transform: uppercase;
    padding-top: 4px;
  }
  .section-divider {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--gold) 0%, transparent 100%);
  }
  .section-num {
    font-family: "Ma Shan Zheng", cursive;
    font-size: 64px;
    color: rgba(194,59,34,0.15);
    line-height: 1;
  }

  /* Repertoire / Shows */
  .shows-tabs {
    display: flex; gap: 8px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }
  .show-tab {
    padding: 12px 28px;
    border: 1px solid rgba(26,20,16,0.2);
    background: transparent;
    color: var(--ink-soft);
    font-size: 14px;
    letter-spacing: 0.1em;
    cursor: none;
    font-family: inherit;
    position: relative;
    transition: all .3s ease;
    overflow: hidden;
  }
  .show-tab.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .show-tab:hover:not(.active) {
    border-color: var(--cinnabar);
    color: var(--cinnabar);
  }
  .shows-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 32px;
  }
  .show-card {
    position: relative;
    background: var(--paper);
    border: 1px solid rgba(26,20,16,0.12);
    padding: 0;
    cursor: none;
    transition: transform .4s cubic-bezier(.2,.9,.3,1.2), box-shadow .4s ease;
    transform-style: preserve-3d;
    overflow: hidden;
  }
  .show-card:hover {
    box-shadow: 0 20px 50px rgba(26,20,16,0.18), 0 0 30px rgba(255,209,128,0.3);
  }
  .show-card-poster {
    height: 220px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, var(--paper-deep) 0%, var(--paper) 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .show-card-poster::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 30%, rgba(255,209,128,0.4) 0%, transparent 60%);
    opacity: .8;
  }
  .show-card-poster svg {
    width: 70%; height: 70%;
    z-index: 2;
    position: relative;
  }
  .show-card-poster .silhouette-puppet {
    fill: var(--ink);
    transition: transform .5s ease;
  }
  .show-card:hover .show-card-poster .silhouette-puppet {
    transform: translateY(-6px) rotate(2deg);
  }
  /* Light sweep on card */
  .show-card::before {
    content: '';
    position: absolute; top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,209,128,0.3), transparent);
    transition: left .8s ease;
    z-index: 10;
    pointer-events: none;
  }
  .show-card:hover::before { left: 100%; }

  .show-card-body {
    padding: 20px 24px 24px;
    position: relative;
    z-index: 2;
  }
  .show-card-type {
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--cinnabar);
    margin-bottom: 8px;
  }
  .show-card-title {
    font-family: "Ma Shan Zheng", cursive;
    font-size: 24px;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .show-card-desc {
    font-size: 13px;
    line-height: 1.7;
    color: var(--ink-soft);
    margin-bottom: 16px;
  }
  .show-card-meta {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 14px;
    border-top: 1px dashed rgba(26,20,16,0.15);
    font-size: 12px;
    color: var(--ink-soft);
  }
  .show-card-time {
    display: flex; align-items: center; gap: 6px;
  }
  .show-card-time::before {
    content: '';
    width: 8px; height: 8px;
    background: var(--gold);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--gold);
  }

  /* ===== Troupes section ===== */
  .troupes-section {
    background: var(--ink);
    color: var(--paper);
    position: relative;
    overflow: hidden;
  }
  .troupes-section::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse at 20% 80%, rgba(194,59,34,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(201,162,39,0.1) 0%, transparent 50%);
    pointer-events: none;
  }
  .troupes-section .section-zh { color: var(--paper); }
  .troupes-section .section-divider {
    background: linear-gradient(90deg, var(--gold) 0%, transparent 100%);
  }
  .troupes-section .section-num { color: rgba(201,162,39,0.2); }

  .troupes-grid {
    display: grid;

// ============ CUSTOM CURSOR HOOK ============
function useCustomCursor() {
  const ringRef = useRef(null);
  const dotRef = useRef(null);
  const glowRef = useRef(null);
  const rafRef = useRef(null);
  const targetRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const currentRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const hoverRef = useRef(false);
  const clickRef = useRef(false);
  const reducedMotion = useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  useEffect(() => {
    if (reducedMotion.current) return;

    const handleMove = (e) => {
      targetRef.current.x = e.clientX;
      targetRef.current.y = e.clientY;
      // dot follows directly
      if (dotRef.current) {
        dotRef.current.style.left = e.clientX + 'px';
        dotRef.current.style.top = e.clientY + 'px';
      }
    };

    const animate = () => {
      const dx = targetRef.current.x - currentRef.current.x;
      const dy = targetRef.current.y - currentRef.current.y;
      currentRef.current.x += dx * 0.18; // eased
      currentRef.current.y += dy * 0.18;

      if (ringRef.current) {
        ringRef.current.style.left = currentRef.current.x + 'px';
        ringRef.current.style.top = currentRef.current.y + 'px';
      }
      if (glowRef.current) {
        glowRef.current.style.left = targetRef.current.x + 'px';
        glowRef.current.style.top = targetRef.current.y + 'px';
      }

      rafRef.current = requestAnimationFrame(animate);
    };

    const handleOver = (e) => {
      if (e.target.closest('button, a, .show-card, .troupe-card, .ticket-card, .workshop-list li, .nav-links li, .nav-logo, .footer-col li, .nav-burger')) {
        hoverRef.current = true;
        if (ringRef.current) ringRef.current.classList.add('cursor-hover');
      }
    };
    const handleOut = (e) => {
      if (e.target.closest('button, a, .show-card, .troupe-card, .ticket-card, .workshop-list li, .nav-links li, .nav-logo, .footer-col li, .nav-burger')) {
        hoverRef.current = false;
        if (ringRef.current) ringRef.current.classList.remove('cursor-hover');
      }
    };

    const handleDown = () => {
      clickRef.current = true;
      if (ringRef.current) ringRef.current.classList.add('cursor-click');
    };
    const handleUp = () => {
      clickRef.current = false;
      if (ringRef.current) ringRef.current.classList.remove('cursor-click');
    };

    const handleVisibility = () => {
      if (document.hidden) {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        rafRef.current = null;
      } else {
        if (!rafRef.current) rafRef.current = requestAnimationFrame(animate);
      }
    };

    document.addEventListener('mousemove', handleMove);
    document.addEventListener('mouseover', handleOver);
    document.addEventListener('mouseout', handleOut);
    document.addEventListener('mousedown', handleDown);
    document.addEventListener('mouseup', handleUp);
    document.addEventListener('visibilitychange', handleVisibility);

    rafRef.current = requestAnimationFrame(animate);

    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      document.removeEventListener('mousemove', handleMove);
      document.removeEventListener('mouseover', handleOver);
      document.removeEventListener('mouseout', handleOut);
      document.removeEventListener('mousedown', handleDown);
      document.removeEventListener('mouseup', handleUp);
      document.removeEventListener('visibilitychange', handleVisibility);
    };
  }, []);

  return { ringRef, dotRef, glowRef };
}

// ============ RIPPLE ============
function useRipple() {
  useEffect(() => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    const handleClick = (e) => {
      const ripple = document.createElement('div');
      ripple.className = 'ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 700);
    };

    document.addEventListener('click', handleClick);
    return () => document.removeEventListener('click', handleClick);
  }, []);
}

// ============ SCROLL REVEAL ============
function useScrollReveal() {
  useEffect(() => {
    const reveals = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          setTimeout(() => entry.target.classList.add('visible'), i * 60);
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });

    reveals.forEach((el) => observer.observe(el));
    return () => observer.disconnect();
  }, []);
}

// ============ NAV SCROLL EFFECT ============
function useNavScroll() {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    let ticking = false;
    const onScroll = () => {
      if (!ticking) {
        requestAnimationFrame(() => {
          setScrolled(window.scrollY > 50);
          ticking = false;
        });
        ticking = true;
      }
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return scrolled;
}

// ============ NUMBER COUNTER ============
function Counter({ end, duration = 2000, label }) {
  const [value, setValue] = useState(0);
  const ref = useRef(null);
  const startedRef = useRef(false);
  const rafRef = useRef(null);

  useEffect(() => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      setValue(end);
      return;
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting && !startedRef.current) {
          startedRef.current = true;
          const startTime = performance.now();

          const tick = (now) => {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            // easeOutCubic
            const eased = 1 - Math.pow(1 - progress, 3);
            setValue(Math.floor(eased * end));
            if (progress < 1) {
              rafRef.current = requestAnimationFrame(tick);
            }
          };
          rafRef.current = requestAnimationFrame(tick);
        }
      });
    }, { threshold: 0.5 });

    if (ref.current) observer.observe(ref.current);
    return () => {
      observer.disconnect();
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [end, duration]);

  useEffect(() => {
    const handleVis = () => {
      if (document.hidden && rafRef.current) {
        cancelAnimationFrame(rafRef.current);
        rafRef.current = null;
      }
    };
    document.addEventListener('visibilitychange', handleVis);
    return () => document.removeEventListener('visibilitychange', handleVis);
  }, []);

  return (
    <div ref={ref}>
      <div className="stat-num">{value}</div>
      <div className="stat-label">{label}</div>
    </div>
  );
}

// ============ TYPEWRITER ============
function Typewriter({ texts, speed = 120, pause = 2000 }) {
  const [text, setText] = useState('');
  const [index, setIndex] = useState(0);
  const [deleting, setDeleting] = useState(false);
  const timeoutRef = useRef(null);
  const reducedMotion = useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  useEffect(() => {
    if (reducedMotion.current) {
      setText(texts[0]);
      return;
    }

    const current = texts[index % texts.length];
    const isComplete = text === current;
    const isEmpty = text === '';

    let delay = deleting ? speed / 2 : speed;
    if (!deleting && isComplete) delay = pause;
    if (deleting && isEmpty) {
      delay = 300;
      setDeleting(false);
      setIndex((i) => i + 1);
      return;
    }

    timeoutRef.current = setTimeout(() => {
      if (deleting) {
        setText(current.substring(0, text.length - 1));
      } else if (!isComplete) {
        setText(current.substring(0, text.length + 1));
      } else {
        setDeleting(true);
      }
    }, delay);

    return () => {
      if (timeoutRef.current) clearTimeout(timeoutRef.current);
    };
  }, [text, deleting, index, texts, speed, pause]);

  useEffect(() => {
    const handleVis = () => {
      if (document.hidden && timeoutRef.current) {
        clearTimeout(timeoutRef.current);
        timeoutRef.current = null;
      }
    };
    document.addEventListener('visibilitychange', handleVis);
    return () => document.removeEventListener('visibilitychange', handleVis);
  }, []);

  return (
    <span>
      {text}
      <span className="typewriter-cursor" />
    </span>
  );
}

// ============ SHOW CARD 3D TILT ============
function ShowCard({ show, delay = 0 }) {
  const cardRef = useRef(null);
  const reducedMotion = useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  useEffect(() => {
    if (reducedMotion.current) return;
    const card = cardRef.current;
    if (!card) return;

    const handleMove = (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const xPercent = (x / rect.width - 0.5) * 2;
      const yPercent = (y / rect.height - 0.5) * 2;
      const rotateY = xPercent * 8;
      const rotateX = -yPercent * 6;
      card.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-4px)`;
    };
    const handleLeave = () => {
      card.style.transform = 'perspective(800px) rotateX(0) rotateY(0) translateY(0)';
    };

    card.addEventListener('mousemove', handleMove);
    card.addEventListener('mouseleave', handleLeave);
    return () => {
      card.removeEventListener('mousemove', handleMove);
      card.removeEventListener('mouseleave', handleLeave);
    };
  }, []);

  const PuppetComp = useMemo(() => {
    const types = {
      '皮影戏': ShadowPuppetDragon,
      '提线木偶': ShadowPuppetWarrior,
      '布袋戏': ShadowPuppetScholar,
      '杖头木偶': ShadowPuppetFemale,
    };
    return types[show.type] || ShadowPuppetFemale;
  }, [show.type]);

  return (
    <div className="show-card reveal" ref={cardRef} style={{ transitionDelay: delay + 'ms' }}>
      <div className="show-card-poster">
        <div className="lantern-glow" style={{ position: 'absolute', animationDuration: '5s' }} />
        <PuppetComp className="silhouette-puppet" style={{ fill: 'var(--ink)', width: '55%', height: '55%' }} />
      </div>
      <div className="show-card-body">
        <div className="show-card-type">{show.type}</div>
        <h3 className="show-card-title">{show.title}</h3>
        <p className="show-card-desc">{show.desc}</p>
        <div className="show-card-meta">
          <div className="show-card-time">{show.time}</div>
          <div>{show.duration}</div>
        </div>
      </div>
    </div>
  );
}

// ============ SPARKLE PARTICLES ============
function Sparkles({ count = 12 }) {
  const containerRef = useRef(null);
  const particlesRef = useRef([]);
  const rafRef = useRef(null);
  const reducedMotion = useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  useEffect(() => {
    if (reducedMotion.current) return;
    const container = containerRef.current;
    if (!container) return;

    // create particles
    const particles = [];
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'sparkle';
      container.appendChild(el);
      particles.push({
        el,
        x: Math.random() * container.offsetWidth,
        y: Math.random() * container.offsetHeight,
        vx: (Math.random() - 0.5) * 0.4,
        vy: -Math.random() * 0.5 - 0.1,
        size: Math.random() * 3 + 2,
        phase: Math.random() * Math.PI * 2,
        speed: 0.02 + Math.random() * 0.02,
      });
    }
    particlesRef.current = particles;

    let visible = true;
    const handleVis = () => {
      visible = !document.hidden;
      if (visible && !rafRef.current) rafRef.current = requestAnimationFrame(tick);
      if (!visible && rafRef.current) {
        cancelAnimationFrame(rafRef.current);
        rafRef.current = null;
      }
    };

    const tick = () => {
      const w = container.offsetWidth;
      const h = container.offsetHeight;
      particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.phase += p.speed;
        if (p.y < -10) p.y = h + 10;
        if (p.x < -10) p.x = w + 10;
        if (p.x > w + 10) p.x = -10;
        const opacity = 0.4 + Math.sin(p.phase) * 0.3;
        p.el.style.left = p.x + 'px';
        p.el.style.top = p.y + 'px';
        p.el.style.opacity = opacity;
        p.el.style.width = p.size + 'px';
        p.el.style.height = p.size + 'px';
      });
      rafRef.current = requestAnimationFrame(tick);
    };

    document.addEventListener('visibilitychange', handleVis);
    rafRef.current = requestAnimationFrame(tick);

    return () => {
      document.removeEventListener('visibilitychange', handleVis);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      particles.forEach((p) => p.el.remove());
      particlesRef.current = [];
    };
  }, [count]);

  return <div ref={containerRef} style={{ position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'hidden' }} />;
}

// ============ HERO PARALLAX (mousemove on silhouettes) ============
function useHeroParallax() {
  useEffect(() => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const layers = [
      { selector: '.shadow-layer-1', speed: 0.02 },
      { selector: '.shadow-layer-2', speed: 0.035 },
      { selector: '.shadow-layer-3', speed: 0.05 },
      { selector: '.shadow-mountain', speed: 0.008 },
    ];

    let rafId = null;
    let targetX = 0, targetY = 0;
    let currentX = 0, currentY = 0;

    const handleMove = (e) => {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      targetX = (e.clientX - cx) / cx;
      targetY = (e.clientY - cy) / cy;
    };

    const animate = () => {
      currentX += (targetX - currentX) * 0.06;
      currentY += (targetY - currentY) * 0.06;

      layers.forEach(({ selector, speed }) => {
        const el = document.querySelector(selector);
        if (el) {
          const x = currentX * speed * 100;
          const y = currentY * speed * 100;
          el.style.transform = `translate(${x}px, ${y}px)`;
        }
      });
      rafId = requestAnimationFrame(animate);
    };

    const handleVis = () => {
      if (document.hidden && rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      } else if (!document.hidden && !rafId) {
        rafId = requestAnimationFrame(animate);
      }
    };

    window.addEventListener('mousemove', handleMove);
    document.addEventListener('visibilitychange', handleVis);
    rafId = requestAnimationFrame(animate);

    return () => {
      if (rafId) cancelAnimationFrame(rafId);
      window.removeEventListener('mousemove', handleMove);
      document.removeEventListener('visibilitychange', handleVis);
    };
  }, []);
}

            <span className="section-num">贰</span>
            <div>
              <h2 className="section-zh">班社艺人</h2>
              <div className="section-en" style={{ color: 'var(--gold)' }}>PARTICIPATING TROUPES</div>
            </div>
            <div className="section-divider" />
          </div>

          <div className="troupes-grid">
            {TROUPES_DATA.map((troupe, i) => (
              <div className="troupe-card reveal" key={troupe.name} style={{ transitionDelay: i * 60 + 'ms' }}>
                <div className="troupe-avatar">{troupe.abbr}</div>
                <div className="troupe-name">{troupe.name}</div>
                <div className="troupe-origin">{troupe.origin}</div>
                <p className="troupe-desc">{troupe.desc}</p>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* Tickets */}
      <section className="section tickets-section" id="tickets">
        <div className="section-inner">
          <div className="section-header reveal">
            <span className="section-num">叁</span>
            <div>
              <h2 className="section-zh">票务信息</h2>
              <div className="section-en">TICKETS</div>
            </div>
            <div className="section-divider" />
          </div>

          <div className="ticket-cards">
            {TICKETS_DATA.map((ticket, i) => (
              <div
                key={ticket.type}
                className={`ticket-card reveal ${ticket.featured ? 'featured' : ''}`}
                style={{ transitionDelay: i * 100 + 'ms' }}
              >
                <div className="ticket-type">{ticket.type}</div>
                <div className="ticket-sub">{ticket.sub}</div>
                <div className="ticket-price">
                  <span className="ticket-price-num">¥{ticket.price}</span>
                  <span className="ticket-price-unit">起</span>
                </div>
                <ul className="ticket-perks">
                  {ticket.perks.map((perk) => (
                    <li key={perk}>{perk}</li>
                  ))}
                </ul>
                <button className="ticket-btn">立即选购</button>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* Workshop */}
      <section className="section workshop-section" id="workshop">
        <div className="section-inner">
          <div className="section-header reveal">
            <span className="section-num">肆</span>
            <div>
              <h2 className="section-zh">幕后工坊</h2>
              <div className="section-en">BACKSTAGE WORKSHOPS</div>
            </div>
            <div className="section-divider" />
          </div>

          <div className="workshop-grid">
            <div className="workshop-visual reveal">
              <div className="workshop-visual-inner">
                <div className="workshop-stage">
                  <div className="lantern-glow" style={{ position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%, -50%)' }} />
                  <div className="workshop-figure">
                    <ShadowPuppetScholar style={{ fill: 'var(--ink)', width: '100%', height: '100%' }} />
                  </div>
                </div>
              </div>
              <Sparkles count={6} />
            </div>
            <div className="workshop-content reveal">
              <h3>亲手操一回影偶</h3>
              <p>
                戏剧节期间，每日开设幕后工坊体验。由国家级非遗传承人亲授，从皮影雕刻到提线操耍，
                从布袋戏掌中功到杖头木偶翎子功，让您亲手触摸千年技艺的温度。
              </p>
              <p>
                每场工坊限 20 人，凭票预约，先到先得。工坊结束可带走自己亲手雕刻的皮影作品。
              </p>
              <ul className="workshop-list">
                {WORKSHOPS_DATA.map((ws) => (
                  <li key={ws.name}>
                    <span>{ws.name}</span>
                    <span>{ws.time}</span>
                  </li>
                ))}
              </ul>
              <button className="ticket-btn" style={{ width: 'auto', padding: '14px 40px' }}>
                预约工坊
              </button>
            </div>
          </div>
        </div>
      </section>

      {/* Venue */}
      <section className="section venue-section" id="venue">
        <div className="section-inner">
          <div className="section-header reveal">
            <span className="section-num">伍</span>
            <div>
              <h2 className="section-zh">场地交通</h2>
              <div className="section-en">VENUE & TRANSPORT</div>
            </div>
            <div className="section-divider" />
          </div>

          <div className="venue-layout">
            <div className="venue-map reveal">
              <div className="venue-map-inner" />
              <svg className="venue-map-svg" viewBox="0 0 500 400" preserveAspectRatio="none">
                {/* Roads */}
                <path d="M0 200 L500 200" stroke="rgba(26,20,16,0.2)" strokeWidth="8" fill="none" />
                <path d="M250 0 L250 400" stroke="rgba(26,20,16,0.2)" strokeWidth="6" fill="none" />
                <path d="M100 0 L100 400" stroke="rgba(26,20,16,0.1)" strokeWidth="3" fill="none" />
                <path d="M400 0 L400 400" stroke="rgba(26,20,16,0.1)" strokeWidth="3" fill="none" />
                <path d="M0 100 L500 100" stroke="rgba(26,20,16,0.1)" strokeWidth="3" fill="none" />
                <path d="M0 300 L500 300" stroke="rgba(26,20,16,0.1)" strokeWidth="3" fill="none" />
                {/* Venue building */}
                <rect x="180" y="130" width="140" height="100" fill="var(--cinnabar)" opacity="0.85" />
                <rect x="180" y="130" width="140" height="20" fill="var(--ink)" opacity="0.3" />
                <text x="250" y="190" textAnchor="middle" fill="var(--paper)" fontSize="14" fontFamily="Noto Serif SC">演艺中心</text>
                {/* Venue marker / pulse */}
                <circle cx="250" cy="180" r="8" fill="var(--gold)">
                  <animate attributeName="r" values="8;16;8" dur="2s" repeatCount="indefinite" />
                  <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
                </circle>
                <circle cx="250" cy="180" r="4" fill="var(--gold-light)" />
                {/* Trees / parks */}
                <circle cx="80" cy="80" r="25" fill="rgba(26,20,16,0.1)" />
                <circle cx="420" cy="320" r="35" fill="rgba(26,20,16,0.1)" />
                <circle cx="350" cy="60" r="18" fill="rgba(26,20,16,0.08)" />
                {/* River */}
                <path d="M0 340 Q150 320 300 350 Q400 370 500 340" stroke="rgba(194,59,34,0.2)" strokeWidth="20" fill="none" strokeLinecap="round" />
                {/* Metro station */}
                <rect x="130" y="220" width="20" height="20" fill="var(--cinnabar)" rx="2" />
                <text x="140" y="235" textAnchor="middle" fill="var(--paper)" fontSize="12" fontWeight="bold">M</text>
                <text x="140" y="260" textAnchor="middle" fill="var(--ink-soft)" fontSize="10">东郊记忆站</text>
              </svg>
            </div>
            <div className="venue-info reveal">
              <h3>东郊记忆演艺中心</h3>
              <ul className="venue-info-items">
                <li>
                  <span className="venue-info-label">地址</span>
                  <span className="venue-info-value">四川省成都市成华区建设南支路 4 号 东郊记忆园区内</span>
                </li>
                <li>
                  <span className="venue-info-label">地铁</span>
                  <span className="venue-info-value">地铁 8 号线「东郊记忆」站 B 出口，步行约 3 分钟</span>
                </li>
                <li>
                  <span className="venue-info-label">公交</span>
                  <span className="venue-info-value">180 路 / 342 路 / 1013 路 东郊记忆北大门站</span>
                </li>
                <li>
                  <span className="venue-info-label">自驾</span>
                  <span className="venue-info-value">园区内设有地下停车场，车位约 500 个。建议绿色出行。</span>
                </li>
                <li>
                  <span className="venue-info-label">开放</span>
                  <span className="venue-info-value">每日 09:00 开放入场，22:00 闭园。<br />具体演出时间以剧目单为准。</span>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </section>

      {/* Footer */}
      <footer className="footer">
        <div className="footer-inner">
          <div className="footer-top">
            <div>
              <div className="footer-brand">影戏人间</div>
              <div className="footer-brand-sub">SHADOW PLAY FESTIVAL</div>
              <p className="footer-desc">
                第四届全国木偶皮影戏剧节<br />
                一盏灯，一张布，一出戏，千年非遗焕新登场。<br />
                以影为媒，以戏会友，共赴一场光影传奇之约。
              </p>
            </div>
            <div className="footer-col">
              <h4>剧目</h4>
              <ul>
                <li>皮影戏</li>
                <li>提线木偶</li>
                <li>布袋戏</li>
                <li>杖头木偶</li>
              </ul>
            </div>
            <div className="footer-col">
              <h4>参与</h4>
              <ul>
                <li>购票指南</li>
                <li>工坊预约</li>
                <li>志愿者招募</li>
                <li>媒体合作</li>
              </ul>
            </div>
            <div className="footer-col">
              <h4>关于</h4>
              <ul>
                <li>节展简介</li>
                <li>组织委员会</li>
                <li>历届回顾</li>
                <li>联系我们</li>
              </ul>
            </div>
          </div>
          <div className="footer-bottom">
            <span>© 2026 影戏人间戏剧节组委会 保留所有权利</span>
            <span>指导单位：中国非物质文化遗产保护中心</span>
          </div>
        </div>
      </footer>
    </>
  );
}

root.render(<App />);

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>潮汐标本馆 · Tide Specimen Museum</title>
<meta name="creative-medium" content="interactive-prototype" />
<meta name="description" content="潮汐标本馆 —— 收藏潮间带生物与海洋标本的自然博物馆" />
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@300;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Mono:wght@400;500&display=swap" />
<style>
  :root {
    --ink: #0E3B33;
    --ink-2: #0A2C26;
    --ink-3: #061E1A;
    --coral: #FF6B4A;
    --seafoam: #7FB69E;
    --shell: #F7F2E9;
    --sand: #D9A441;
    --sand-soft: #E8C36E;
    --ease-spring: cubic-bezier(.175,.885,.32,1.275);
    --ease-out: cubic-bezier(.16,1,.3,1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    background: var(--ink-2);
    color: var(--shell);
    line-height: 1.6;
    overflow-x: hidden;
    cursor: none;
  }
  @media (max-width: 900px) { body { cursor: auto; } .cursor-ring, .cursor-dot { display: none; } }
  ::selection { background: var(--coral); color: var(--shell); }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; border: none; background: none; color: inherit; cursor: pointer; }
  img { max-width: 100%; display: block; }

  /* ========== Custom Cursor ========== */
  .cursor-ring {
    position: fixed;
    top: 0; left: 0;
    width: 38px; height: 38px;
    border: 2px solid var(--shell);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width .25s var(--ease-spring), height .25s var(--ease-spring), border-color .25s;
    mix-blend-mode: difference;
    box-shadow: 0 0 20px rgba(255,107,74,.4);
  }
  .cursor-ring.cursor-hover {
    width: 62px; height: 62px;
    border-color: var(--coral);
    box-shadow: 0 0 30px rgba(255,107,74,.7);
  }
  .cursor-ring.cursor-click {
    width: 20px; height: 20px;
  }
  .cursor-dot {
    position: fixed;
    top: 0; left: 0;
    width: 8px; height: 8px;
    background: var(--coral);
    border-radius: 50%;
    pointer-events: none;
    z-index: 10000;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 12px var(--coral), 0 0 24px rgba(255,107,74,.5);
    transition: background .25s, box-shadow .25s;
  }
  .cursor-dot.cursor-hover {
    background: var(--sand);
    box-shadow: 0 0 12px var(--sand), 0 0 24px rgba(217,164,65,.5);
  }
  .cursor-ripple {
    position: fixed;
    top: 0; left: 0;
    width: 10px; height: 10px;
    border: 2px solid var(--coral);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    opacity: 0;
  }
  @keyframes ripple-expand {
    0% { width: 10px; height: 10px; opacity: .8; }
    100% { width: 80px; height: 80px; opacity: 0; }
  }

  /* ========== Nav ========== */
  .nav {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 22px 48px;
    display: flex; align-items: center; justify-content: space-between;
    z-index: 100;
    transition: background .4s, backdrop-filter .4s, padding .4s;
  }
  .nav.scrolled {
    background: rgba(14,59,51,.85);
    backdrop-filter: blur(16px);
    padding: 14px 48px;
    border-bottom: 1px solid rgba(127,182,158,.15);
  }
  .nav-logo {
    font-family: "Noto Serif SC", serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .08em;
    display: flex; align-items: center; gap: 10px;
  }
  .nav-logo-mark {
    width: 32px; height: 32px;
    border: 1.5px solid var(--sand);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .nav-logo-mark::before {
    content: '';
    width: 14px; height: 14px;
    background: var(--coral);
    border-radius: 50%;
    opacity: .8;
  }
  .nav-links {
    display: flex; gap: 36px;
    list-style: none;
  }
  .nav-links a {
    font-size: 14px;
    font-weight: 400;
    letter-spacing: .05em;
    position: relative;
    padding: 4px 0;
    transition: color .3s;
  }
  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 0; height: 1px;
    background: var(--coral);
    transition: width .4s var(--ease-out);
  }
  .nav-links a:hover { color: var(--coral); }
  .nav-links a:hover::after { width: 100%; }
  .nav-ticket {
    padding: 10px 22px;
    border: 1px solid var(--sand);
    border-radius: 2px;
    font-size: 13px;
    letter-spacing: .08em;
    transition: all .35s var(--ease-out);
    position: relative; overflow: hidden;
  }
  .nav-ticket::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: var(--coral);
    transition: left .4s var(--ease-out);
    z-index: -1;
  }
  .nav-ticket:hover { border-color: var(--coral); color: var(--shell); }
  .nav-ticket:hover::before { left: 0; }
  .nav-burger { display: none; }
  @media (max-width: 900px) {
    .nav { padding: 16px 20px; }
    .nav-links { display: none; }
    .nav-ticket { display: none; }
    .nav-burger { display: block; }
  }

  /* ========== Hero ========== */
  .hero {
    min-height: 100vh;
    position: relative;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 8vw;
    overflow: hidden;
  }
  .hero-bg {
    position: absolute; inset: 0;
    z-index: 0;
  }
  .hero-bg img {
    width: 100%; height: 100%;
    object-fit: cover;
    filter: brightness(.55) saturate(1.1) hue-rotate(-10deg);
  }
  .hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(14,59,51,.4) 0%, rgba(10,44,38,.7) 50%, rgba(6,30,26,.95) 100%);
    z-index: 1;
  }
  .hero-content {
    position: relative; z-index: 2;
    max-width: 900px;
  }
  .hero-eyebrow {
    display: flex; align-items: center; gap: 14px;
    font-family: "Noto Mono", monospace;
    font-size: 12px;
    letter-spacing: .3em;
    color: var(--seafoam);
    margin-bottom: 28px;
    opacity: 0;
    animation: fadeUp 1s .2s var(--ease-out) forwards;
  }
  .hero-eyebrow-line {
    width: 40px; height: 1px;
    background: var(--seafoam);
  }
  .hero-title {
    font-family: "Noto Serif SC", serif;
    font-size: clamp(48px, 7vw, 96px);
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -.02em;
    margin-bottom: 28px;
    opacity: 0;
    animation: fadeUp 1.1s .4s var(--ease-out) forwards;
  }
  .hero-title em {
    font-style: normal;
    color: var(--coral);
    position: relative;
  }
  .hero-subtitle {
    font-size: 18px;
    font-weight: 300;
    max-width: 560px;
    line-height: 1.8;
    color: rgba(247,242,233,.85);
    margin-bottom: 44px;
    opacity: 0;
    animation: fadeUp 1s .6s var(--ease-out) forwards;
  }
  .hero-actions {
    display: flex; gap: 20px; align-items: center;
    opacity: 0;
    animation: fadeUp 1s .8s var(--ease-out) forwards;
  }
  .btn-primary {
    padding: 16px 36px;
    background: var(--coral);
    color: var(--shell);
    font-size: 14px;
    letter-spacing: .1em;
    font-weight: 500;
    border-radius: 2px;
    transition: all .35s var(--ease-out);
    position: relative; overflow: hidden;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(255,107,74,.35);
  }
  .btn-ghost {
    padding: 16px 36px;
    border: 1px solid rgba(247,242,233,.4);
    color: var(--shell);
    font-size: 14px;
    letter-spacing: .1em;
    font-weight: 400;
    border-radius: 2px;
    transition: all .35s var(--ease-out);
    display: inline-flex; align-items: center; gap: 10px;
  }
  .btn-ghost:hover {
    border-color: var(--sand);
    color: var(--sand);
  }
  .btn-ghost svg { transition: transform .3s; }
  .btn-ghost:hover svg { transform: translateX(4px); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Hero wave spectrum */
  .hero-wave {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 120px;
    z-index: 3;
    pointer-events: none;
  }
  .hero-wave svg { width: 100%; height: 100%; }

  /* Hero scroll indicator */
  .hero-scroll {
    position: absolute;
    bottom: 40px; left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    font-size: 11px;
    letter-spacing: .3em;
    color: rgba(247,242,233,.5);
    opacity: 0;
    animation: fadeUp 1s 1.2s var(--ease-out) forwards;
  }
  .hero-scroll-line {
    width: 1px; height: 40px;
    background: linear-gradient(180deg, var(--coral), transparent);
    animation: scrollPulse 2s infinite;
  }
  @keyframes scrollPulse {
    0%, 100% { transform: scaleY(1); transform-origin: top; }
    50% { transform: scaleY(.5); transform-origin: top; }
  }

  /* ========== Floating particles (tide bubbles) ========== */
  .bubbles {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 2;
    overflow: hidden;
  }
  .bubble {
    position: absolute;
    bottom: -20px;
    border-radius: 50%;
    background: rgba(127,182,158,.2);
    border: 1px solid rgba(127,182,158,.3);
    animation: bubbleRise linear infinite;
  }
  @keyframes bubbleRise {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-100vh) translateX(30px); opacity: 0; }
  }

  /* ========== Section base ========== */
  .section {
    padding: 120px 8vw;
    position: relative;
  }
  .section-head {
    margin-bottom: 72px;
    display: flex; align-items: flex-end; justify-content: space-between;
    flex-wrap: wrap; gap: 24px;
  }
  .section-label {
    font-family: "Noto Mono", monospace;
    font-size: 12px;
    letter-spacing: .3em;
    color: var(--coral);
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .section-label::before {
    content: '';
    width: 24px; height: 1px;
    background: var(--coral);
  }
  .section-title {
    font-family: "Noto Serif SC", serif;
    font-size: clamp(32px, 4.5vw, 56px);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -.01em;
    max-width: 600px;
  }
  .section-desc {
    max-width: 400px;
    font-size: 15px;
    line-height: 1.9;
    color: rgba(247,242,233,.7);
  }

  /* Reveal animation */
  .reveal {
    opacity: 0;
    transform: translateY(40px);
    transition: opacity .9s var(--ease-out), transform .9s var(--ease-out);
  }
  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* ========== Specimens section ========== */
  .specimens {
    background: var(--ink-2);
  }
  .specimens-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
  }
  @media (max-width: 1024px) {
    .specimens-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 640px) {
    .specimens-grid { grid-template-columns: 1fr; }
  }
  .specimen-card {
    position: relative;
    background: var(--ink);
    border: 1px solid rgba(127,182,158,.15);
    border-radius: 4px;
    overflow: hidden;
    transition: border-color .4s;
    transform-style: preserve-3d;
    perspective: 1000px;
  }
  .specimen-card:hover {
    border-color: rgba(255,107,74,.4);
  }
  .specimen-img-wrap {
    position: relative;
    overflow: hidden;
    aspect-ratio: 3/4;
  }
  .specimen-img-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform .6s var(--ease-out);
  }
  .specimen-card:hover .specimen-img-wrap img {
    transform: scale(1.04);
  }
  .specimen-shine {
    position: absolute; inset: 0;
    background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.12) 50%, transparent 60%);
    transform: translateX(-100%);
    transition: transform .8s var(--ease-out);
    pointer-events: none;
  }
  .specimen-card:hover .specimen-shine {
    transform: translateX(100%);
  }
  .specimen-tag {
    position: absolute;
    top: 16px; left: 16px;
    padding: 5px 12px;
    background: rgba(14,59,51,.85);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(127,182,158,.3);
    border-radius: 2px;
    font-size: 11px;
    letter-spacing: .15em;
    color: var(--seafoam);
    font-family: "Noto Mono", monospace;
  }
  .specimen-body {
    padding: 24px;
  }
  .specimen-sci {
    font-family: "Noto Mono", monospace;
    font-size: 11px;
    letter-spacing: .1em;
    color: var(--sand);
    font-style: italic;
    margin-bottom: 8px;
  }
  .specimen-name {
    font-family: "Noto Serif SC", serif;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .specimen-desc {
    font-size: 13px;
    line-height: 1.8;
    color: rgba(247,242,233,.65);
    margin-bottom: 20px;
  }
  .specimen-meta {
    display: flex; gap: 20px;
    padding-top: 16px;
    border-top: 1px solid rgba(127,182,158,.12);
    font-size: 11px;
    color: rgba(247,242,233,.5);
    letter-spacing: .05em;
  }
  .specimen-meta span strong {
    color: var(--shell);
    font-weight: 500;
    margin-left: 4px;
  }

  /* ========== Stats bar ========== */
  .stats-bar {
    background: var(--ink-3);
    padding: 60px 8vw;
    border-top: 1px solid rgba(127,182,158,.15);
    border-bottom: 1px solid rgba(127,182,158,.15);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 40px;
  }
  @media (max-width: 768px) {
    .stats-bar { grid-template-columns: repeat(2, 1fr); padding: 40px 6vw; }
  }
  .stat-item {
    text-align: center;
  }
  .stat-number {
    font-family: "Noto Serif SC", serif;
    font-size: clamp(36px, 5vw, 56px);
    font-weight: 900;
    color: var(--coral);
    line-height: 1;
    margin-bottom: 10px;
    font-variant-numeric: tabular-nums;
  }
  .stat-number .stat-unit {
    font-size: .5em;
    color: var(--sand);
    font-weight: 500;
    margin-left: 4px;
  }
  .stat-label {
    font-size: 13px;
    color: rgba(247,242,233,.6);
    letter-spacing: .05em;
  }

  /* ========== Exhibits section ========== */
  .exhibits {
    background: var(--ink-2);
  }
  .exhibit-tabs {
    display: flex; gap: 8px;
    margin-bottom: 48px;
    border-bottom: 1px solid rgba(127,182,158,.15);
    padding-bottom: 0;
    flex-wrap: wrap;
  }
  .exhibit-tab {
    padding: 14px 24px;
    font-size: 14px;
    letter-spacing: .05em;
    color: rgba(247,242,233,.5);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all .3s;
    font-weight: 400;
  }
  .exhibit-tab:hover { color: var(--shell); }
  .exhibit-tab.active {
    color: var(--coral);
    border-bottom-color: var(--coral);
  }
  .exhibit-panel {
    display: none;
    animation: fadeIn .5s var(--ease-out);
  }
  .exhibit-panel.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .exhibit-feature {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 48px;
    align-items: center;
  }
  @media (max-width: 900px) {
    .exhibit-feature { grid-template-columns: 1fr; }
  }
  .exhibit-img {
    position: relative;
    border-radius: 4px;
    overflow: hidden;
    aspect-ratio: 4/3;
  }
  .exhibit-img img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .exhibit-img::after {
    content: '';
    position: absolute; inset: 0;
    border: 1px solid rgba(255,107,74,.3);
    border-radius: 4px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .4s;
  }
  .exhibit-img:hover::after { opacity: 1; }
  .exhibit-info h3 {
    font-family: "Noto Serif SC", serif;
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 16px;
    line-height: 1.3;
  }
  .exhibit-info p {
    font-size: 15px;
    line-height: 1.9;
    color: rgba(247,242,233,.7);
    margin-bottom: 24px;
  }
  .exhibit-meta-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-bottom: 32px;
  }
  .exhibit-meta-item dt {
    font-size: 11px;
    letter-spacing: .2em;
    color: var(--seafoam);
    margin-bottom: 6px;
    font-family: "Noto Mono", monospace;
  }
  .exhibit-meta-item dd {
    font-size: 14px;
    color: var(--shell);
  }

  /* ========== Visit section ========== */
  .visit {
    background: var(--ink-3);
    position: relative;
    overflow: hidden;
  }
  .visit::before {
    content: '';
    position: absolute;
    top: -200px; right: -200px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(255,107,74,.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .visit-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .visit-grid { grid-template-columns: 1fr; gap: 48px; }
  }
  .visit-info h3 {
    font-family: "Noto Serif SC", serif;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 28px;
  }
  .visit-item {
    display: flex; gap: 20px;
    padding: 20px 0;
    border-bottom: 1px solid rgba(127,182,158,.15);
  }
  .visit-item-icon {
    flex-shrink: 0;
    width: 44px; height: 44px;
    border: 1px solid rgba(217,164,65,.3);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--sand);
  }
  .visit-item-body dt {
    font-size: 12px;
    letter-spacing: .15em;
    color: var(--seafoam);
    margin-bottom: 6px;
    font-family: "Noto Mono", monospace;
  }
  .visit-item-body dd {
    font-size: 15px;
    color: var(--shell);
    line-height: 1.6;
  }
  .visit-item-body dd small {
    display: block;
    margin-top: 4px;
    font-size: 12px;
    color: rgba(247,242,233,.5);
  }

  .ticket-card {
    background: var(--ink);
    border: 1px solid rgba(127,182,158,.2);
    border-radius: 6px;
    padding: 40px;
    position: relative;
    overflow: hidden;
  }
  .ticket-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--coral), var(--sand));
  }
  .ticket-card h4 {
    font-family: "Noto Serif SC", serif;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .ticket-card p.sub {
    font-size: 13px;
    color: rgba(247,242,233,.55);
    margin-bottom: 32px;
  }
  .ticket-types { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; }
  .ticket-type {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    background: rgba(127,182,158,.05);
    border: 1px solid rgba(127,182,158,.15);
    border-radius: 3px;
    transition: all .3s;
  }
  .ticket-type:hover {
    border-color: var(--coral);
    background: rgba(255,107,74,.05);
  }
  .ticket-type-name {
    font-size: 14px;
  }
  .ticket-type-name small {
    display: block;
    margin-top: 3px;
    font-size: 11px;
    color: rgba(247,242,233,.5);
  }
  .ticket-type-price {
    font-family: "Noto Serif SC", serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--sand);
  }

  /* ========== Research section ========== */
  .research {
    background: var(--ink-2);
  }
  .research-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }
  @media (max-width: 900px) {
    .research-grid { grid-template-columns: 1fr; }
  }
  .research-card {
    background: var(--ink);
    border: 1px solid rgba(127,182,158,.12);
    border-radius: 4px;
    padding: 36px 30px;
    position: relative;

/* ========= Custom Cursor ========= */
function CustomCursor({ reduced }) {
  const ringRef = useRef(null);
  const dotRef = useRef(null);
  const rafRef = useRef(null);
  const posRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const targetRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const [hover, setHover] = useState(false);
  const [clicking, setClicking] = useState(false);
  const ripplesRef = useRef([]);
  const [, force] = useState(0);

  useEffect(() => {
    if (reduced) return;

    const spring = () => {
      const dx = targetRef.current.x - posRef.current.x;
      const dy = targetRef.current.y - posRef.current.y;
      posRef.current.x += dx * 0.18;
      posRef.current.y += dy * 0.18;
      if (ringRef.current) {
        ringRef.current.style.transform = `translate(${posRef.current.x}px, ${posRef.current.y}px) translate(-50%, -50%)`;
      }
      if (dotRef.current) {
        dotRef.current.style.left = targetRef.current.x + 'px';
        dotRef.current.style.top = targetRef.current.y + 'px';
      }
      rafRef.current = requestAnimationFrame(spring);
    };
    rafRef.current = requestAnimationFrame(spring);

    const onMove = (e) => {
      targetRef.current.x = e.clientX;
      targetRef.current.y = e.clientY;
    };
    const onOver = (e) => {
      const t = e.target;
      if (t.closest && t.closest('a, button, .specimen-card, .ticket-type, .exhibit-tab, input')) {
        setHover(true);
      } else {
        setHover(false);
      }
    };
    const onDown = () => setClicking(true);
    const onUp = () => setClicking(false);
    const onClick = (e) => {
      const id = Date.now();
      ripplesRef.current.push({ id, x: e.clientX, y: e.clientY });
      force((n) => n + 1);
      setTimeout(() => {
        ripplesRef.current = ripplesRef.current.filter((r) => r.id !== id);
        force((n) => n + 1);
      }, 600);
    };

    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseover', onOver);
    window.addEventListener('mousedown', onDown);
    window.addEventListener('mouseup', onUp);
    window.addEventListener('click', onClick);

    const onVis = () => {
      if (document.hidden) {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      } else {
        rafRef.current = requestAnimationFrame(spring);
      }
    };
    document.addEventListener('visibilitychange', onVis);

    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseover', onOver);
      window.removeEventListener('mousedown', onDown);
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('click', onClick);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, [reduced]);

  if (reduced) return null;

  const ringClass = 'cursor-ring' + (hover ? ' cursor-hover' : '') + (clicking ? ' cursor-click' : '');
  const dotClass = 'cursor-dot' + (hover ? ' cursor-hover' : '');

  return (
    <>
      <div ref={ringRef} className={ringClass} />
      <div ref={dotRef} className={dotClass} />

/* ========= Typewriter ========= */
function Typewriter({ texts, speed = 80, pause = 1800 }) {
  const [text, setText] = useState('');
  const [idx, setIdx] = useState(0);
  const [phase, setPhase] = useState('type'); // type, pause, erase
  const timerRef = useRef(null);

  useEffect(() => {
    const current = texts[idx % texts.length];
    if (phase === 'type') {
      if (text.length < current.length) {
        timerRef.current = setTimeout(() => {
          setText(current.slice(0, text.length + 1));
        }, speed + Math.random() * 40);
      } else {
        timerRef.current = setTimeout(() => setPhase('erase'), pause);
      }
    } else if (phase === 'erase') {
      if (text.length > 0) {
        timerRef.current = setTimeout(() => {
          setText(current.slice(0, text.length - 1));
        }, 40);
      } else {
        setIdx((i) => (i + 1) % texts.length);
        setPhase('type');
      }
    }
    return () => {
      if (timerRef.current) clearTimeout(timerRef.current);
    };
  }, [text, phase, idx, texts, speed, pause]);

  useEffect(() => {
    const onVis = () => {
      if (document.hidden && timerRef.current) {
        clearTimeout(timerRef.current);
      }
    };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, []);

  return (
    <span>
      {text}
      <span className="typewriter-caret" />
    </span>
  );
}

/* ========= Counter ========= */
function Counter({ target, suffix = '', duration = 2000, inView }) {
  const [val, setVal] = useState(0);
  const rafRef = useRef(null);
  const startedRef = useRef(false);

  useEffect(() => {
    if (!inView || startedRef.current) return;
    startedRef.current = true;
    const start = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      setVal(Math.floor(eased * target));
      if (t < 1) {
        rafRef.current = requestAnimationFrame(tick);
      } else {
        setVal(target);
      }
    };
    rafRef.current = requestAnimationFrame(tick);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [inView, target, duration]);

  return (
    <span>
      {val.toLocaleString()}
      {suffix}
    </span>
  );
}

/* ========= Reveal on scroll ========= */
function useReveal(ref) {
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            setVisible(true);
            obs.unobserve(e.target);
          }
        });
      },
      { threshold: 0.15 }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, [ref]);
  return visible;
}

/* ========= Tilt Card (DOM direct) ========= */
function SpecimenCard({ item, index, reduced }) {
  const cardRef = useRef(null);
  const imgRef = useRef(null);
  const shineRef = useRef(null);

  useEffect(() => {
    if (reduced) return;
    const el = cardRef.current;
    const img = imgRef.current;
    const shine = shineRef.current;
    if (!el) return;

    let rafId = null;
    let targetX = 0, targetY = 0;
    let curX = 0, curY = 0;
    let targetShine = -100;
    let curShine = -100;
    let hovering = false;

    const render = () => {
      curX += (targetX - curX) * 0.12;
      curY += (targetY - curY) * 0.12;
      curShine += (targetShine - curShine) * 0.1;
      if (img) img.style.transform = `scale(${hovering ? 1.04 : 1}) rotateX(${-curY * 0.6}deg) rotateY(${curX * 0.6}deg)`;
      if (shine) shine.style.transform = `translateX(${curShine}%)`;
      el.style.transform = `perspective(1000px) rotateX(${-curY * 0.5}deg) rotateY(${curX * 0.5}deg) translateZ(0)`;
      if (hovering || Math.abs(targetX - curX) > 0.1 || Math.abs(targetY - curY) > 0.1) {
        rafId = requestAnimationFrame(render);
      }
    };

    const onMove = (e) => {
      const rect = el.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      targetX = x * 12;
      targetY = y * 12;
      targetShine = (e.clientX - rect.left) / rect.width * 200 - 50;
      if (!rafId) rafId = requestAnimationFrame(render);
    };
    const onEnter = () => {
      hovering = true;
      if (!rafId) rafId = requestAnimationFrame(render);
    };
    const onLeave = () => {
      hovering = false;
      targetX = 0;
      targetY = 0;
      targetShine = 200;
      if (!rafId) rafId = requestAnimationFrame(render);
    };

    el.addEventListener('mousemove', onMove);
    el.addEventListener('mouseenter', onEnter);
    el.addEventListener('mouseleave', onLeave);

    return () => {
      if (rafId) cancelAnimationFrame(rafId);
      el.removeEventListener('mousemove', onMove);
      el.removeEventListener('mouseenter', onEnter);
      el.removeEventListener('mouseleave', onLeave);
    };
  }, [reduced]);

  return (
    <article className="specimen-card" ref={cardRef} style={{ transitionDelay: `${index * 0.1}s` }}>
      <div className="specimen-img-wrap">
        <img ref={imgRef} src={item.img} alt={item.name} loading="lazy" />
        <div ref={shineRef} className="specimen-shine" />
        <span className="specimen-tag">{item.tag}</span>
      </div>
      <div className="specimen-body">
        <div className="specimen-sci">{item.sci}</div>
        <h3 className="specimen-name">{item.name}</h3>
        <p className="specimen-desc">{item.desc}</p>
        <div className="specimen-meta">
          <span>采集地<strong>{item.collected}</strong></span>
          <span>来源<strong>{item.donor}</strong></span>
        </div>
      </div>
    </article>
  );
}

/* ========= Hero wave (animated SVG path) ========= */
function HeroWave({ reduced }) {
  const pathRef = useRef(null);
  const rafRef = useRef(null);
  const tRef = useRef(0);

  useEffect(() => {
    if (reduced) return;
    const path = pathRef.current;
    if (!path) return;

    const animate = () => {
      tRef.current += 0.008;
      const t = tRef.current;
      const w = 1440;
      const h = 120;
      const y1 = h * 0.6 + Math.sin(t) * 8 + Math.sin(t * 0.7) * 5;
      const y2 = h * 0.7 + Math.sin(t * 1.3 + 1) * 6 + Math.cos(t * 0.5) * 4;
      const y3 = h * 0.8 + Math.cos(t * 0.9) * 7;
      const d = `M 0 ${y1} Q ${w * 0.25} ${y2} ${w * 0.5} ${y1} T ${w} ${y3} L ${w} ${h} L 0 ${h} Z`;
      path.setAttribute('d', d);
      rafRef.current = requestAnimationFrame(animate);
    };
    rafRef.current = requestAnimationFrame(animate);

    const onVis = () => {
      if (document.hidden) {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      } else {
        rafRef.current = requestAnimationFrame(animate);
      }
    };
    document.addEventListener('visibilitychange', onVis);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, [reduced]);

  return (
    <div className="hero-wave">
      <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
        <defs>
          <linearGradient id="waveGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#0E3B33" stopOpacity="0.3" />
            <stop offset="100%" stopColor="#061E1A" stopOpacity="1" />
          </linearGradient>
        </defs>
        <path ref={pathRef} fill="url(#waveGrad)" />
      </svg>
    </div>
  );
}

/* ========= Spectrum / pulse bars (tidal rhythm visual) ========= */
function TidalSpectrum({ reduced }) {
  const barsRef = useRef([]);
  const rafRef = useRef(null);
  const tRef = useRef(0);

  useEffect(() => {
    if (reduced) return;
    const animate = () => {
      tRef.current += 0.05;

          bar.style.height = h + 'px';
        }
      });
      rafRef.current = requestAnimationFrame(animate);
    };
    rafRef.current = requestAnimationFrame(animate);

    const onVis = () => {
      if (document.hidden) {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      } else {
        rafRef.current = requestAnimationFrame(animate);
      }
    };
    document.addEventListener('visibilitychange', onVis);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, [reduced]);

/* ========= Magnetic button effect ========= */
function MagneticButton({ children, className, reduced, onClick, style }) {
  const btnRef = useRef(null);
  const rafRef = useRef(null);

  useEffect(() => {
    if (reduced) return;
    const btn = btnRef.current;
    if (!btn) return;

    let tx = 0, ty = 0, cx = 0, cy = 0;
    let active = false;

    const render = () => {
      cx += (tx - cx) * 0.2;
      cy += (ty - cy) * 0.2;
      btn.style.transform = `translate(${cx}px, ${cy}px)`;
      if (active || Math.abs(tx - cx) > 0.3 || Math.abs(ty - cy) > 0.3) {
        rafRef.current = requestAnimationFrame(render);
      }
    };

    const onMove = (e) => {
      const rect = btn.getBoundingClientRect();
      const cx2 = rect.left + rect.width / 2;
      const cy2 = rect.top + rect.height / 2;
      const dx = e.clientX - cx2;
      const dy = e.clientY - cy2;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 120) {
        const strength = (1 - dist / 120) * 14;
        tx = (dx / dist) * strength;
        ty = (dy / dist) * strength;
        if (!rafRef.current) rafRef.current = requestAnimationFrame(render);
      } else {
        tx = 0; ty = 0;
      }
    };
    const onEnter = () => { active = true; };
    const onLeave = () => {
      active = false;
      tx = 0; ty = 0;
      if (!rafRef.current) rafRef.current = requestAnimationFrame(render);
    };

    window.addEventListener('mousemove', onMove);
    btn.addEventListener('mouseenter', onEnter);
    btn.addEventListener('mouseleave', onLeave);

    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      window.removeEventListener('mousemove', onMove);
      btn.removeEventListener('mouseenter', onEnter);
      btn.removeEventListener('mouseleave', onLeave);
    };
  }, [reduced]);

  return (
    <button ref={btnRef} className={className} onClick={onClick} style={style}>
      {children}
    </button>
  );
}

/* ========= Parallax hero image ========= */
function useParallax(ref, speed = 0.3, reduced) {
  useEffect(() => {
    if (reduced) return;
    const el = ref.current;
    if (!el) return;
    let rafId = null;
    let targetY = 0;
    let curY = 0;

    const onScroll = () => {
      targetY = window.scrollY * speed;
      if (!rafId) rafId = requestAnimationFrame(render);
    };
    const render = () => {
      curY += (targetY - curY) * 0.1;
      el.style.transform = `translateY(${curY}px)`;
      if (Math.abs(targetY - curY) > 0.1) {
        rafId = requestAnimationFrame(render);
      } else {
        rafId = null;
      }
    };

    window.addEventListener('scroll', onScroll, { passive: true });
    return () => {
      window.removeEventListener('scroll', onScroll);
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, [ref, speed, reduced]);
}

/* ========= Newsletter ========= */
function Newsletter() {
  const [email, setEmail] = useState('');
  const [sent, setSent] = useState(false);

  const handleSubmit = (e) => {
    e.preventDefault();
    if (email && email.includes('@')) {
      setSent(true);
      setEmail('');
      setTimeout(() => setSent(false), 4000);
    }
  };

  return (
    <section className="newsletter">
      <div className="newsletter-inner">
        <div className="section-label" style={{ justifyContent: 'center', marginBottom: '16px' }}>
          订阅通讯
        </div>
        <h2>不错过每一次潮汐的秘密</h2>
        <p>每月一封，带来新入藏标本、研究进展与专属活动资讯。我们尊重你的时间，也绝不转售邮箱。</p>
        <form className="newsletter-form" onSubmit={handleSubmit}>
          <input
            type="email"
            placeholder="输入你的邮箱地址"
            value={email}
            onChange={(e) => setEmail(e.target.value)}
          />
          <button type="submit">订阅</button>
        </form>
        <div className="newsletter-success" style={{ opacity: sent ? 1 : 0 }}>
          感谢订阅 —— 下一封潮汐通讯将在月初送达。
        </div>
      </div>
    </section>
  );
}

/* ========= App ========= */
function App() {
  const [reduced, setReduced] = useState(false);

  useEffect(() => {
    const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    setReduced(mq.matches);
    const onChange = (e) => setReduced(e.matches);
    mq.addEventListener('change', onChange);
    return () => mq.removeEventListener('change', onChange);
  }, []);

  // Announce upgrade capability
  useEffect(() => {
    const announce = () => {
      window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    };
    announce();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announce, { once: true });
    }
  }, []);

  return (
    <>
      <CustomCursor reduced={reduced} />
      <Nav reduced={reduced} />
      <main>
        <Hero reduced={reduced} />
        <Ticker />
        <SpecimensSection reduced={reduced} />
        <StatsBar reduced={reduced} />
        <ExhibitsSection reduced={reduced} />
        <ResearchSection reduced={reduced} />
        <VisitSection reduced={reduced} />
        <Newsletter />
      </main>
      <Footer />
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

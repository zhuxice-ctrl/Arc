<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>盐风琴 Salt Organ — 海岸盐田声光装置</title>
<script src="./_lib/react.production.min.js" crossorigin="anonymous"></script>
<script src="./_lib/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="./_lib/babel.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@300;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=ZCOOL+XiaoWei&display=swap" />
<style>
  :root{
    --sand:#F5F0E6;         /* 沙白 */
    --sand-2:#ECE4D3;       /* 次沙白 */
    --mist:#8BA89F;         /* 海雾青 */
    --mist-dark:#5F7C74;    /* 深海雾 */
    --ochre:#C75B39;        /* 赭石红 */
    --ochre-dark:#9A3E22;   /* 深赭 */
    --deep:#2D3A3A;         /* 深海墨 */
    --deep-2:#1F2929;       /* 更深 */
    --crystal:#E8D5A3;      /* 盐晶金 */
    --salt:#FAF7EF;         /* 盐白 */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;overflow-x:hidden}
  body{
    font-family:"Noto Sans SC","PingFang SC",sans-serif;
    background:var(--sand);
    color:var(--deep);
    cursor:none;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    body{cursor:auto}
  }
  ::selection{background:var(--ochre);color:var(--salt)}

  /* ─── 自定义光标 ─── */
  .cursor-ring{
    position:fixed;top:0;left:0;pointer-events:none;z-index:9999;
    width:36px;height:36px;border:2px solid var(--deep);border-radius:50%;
    transform:translate(-50%,-50%);
    transition:width .25s cubic-bezier(.2,.8,.2,1),height .25s cubic-bezier(.2,.8,.2,1),
                border-color .25s,background-color .25s;
    will-change:transform;
    mix-blend-mode:difference;
  }
  .cursor-ring.hover{width:64px;height:64px;border-color:var(--ochre);background:rgba(199,91,57,.1)}
  .cursor-ring.click{width:24px;height:24px}
  .cursor-dot{
    position:fixed;top:0;left:0;pointer-events:none;z-index:10000;
    width:8px;height:8px;border-radius:50%;
    background:var(--ochre);
    box-shadow:0 0 8px var(--ochre),0 0 20px rgba(199,91,57,.4);
    transform:translate(-50%,-50%);
    will-change:transform;
  }
  .cursor-dot.hover{background:var(--mist);box-shadow:0 0 10px var(--mist),0 0 30px rgba(139,168,159,.6)}
  @media (prefers-reduced-motion: reduce){
    .cursor-ring,.cursor-dot{display:none}
  }

  /* ─── 涟漪 ─── */
  .ripple{
    position:fixed;pointer-events:none;z-index:9998;
    border:2px solid var(--ochre);border-radius:50%;
    transform:translate(-50%,-50%) scale(0);
    opacity:.8;
    animation:rippleOut .6s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes rippleOut{
    to{transform:translate(-50%,-50%) scale(8);opacity:0}
  }

  /* ─── 导航 ─── */
  .nav{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    padding:24px 48px;
    transition:background .4s, backdrop-filter .4s, padding .4s;
  }
  .nav.scrolled{
    background:rgba(245,240,230,.85);
    backdrop-filter:blur(12px);
    padding:14px 48px;
    border-bottom:1px solid rgba(45,58,58,.08);
  }
  .nav-logo{
    font-family:"ZCOOL XiaoWei","Noto Serif SC",serif;
    font-size:22px;letter-spacing:4px;color:var(--deep);
    display:flex;align-items:center;gap:12px;
  }
  .nav-logo .mark{
    width:28px;height:28px;position:relative;
  }
  .nav-logo .mark::before,
  .nav-logo .mark::after{
    content:"";position:absolute;left:50%;transform:translateX(-50%);
    border-left:1px solid var(--deep);border-right:1px solid var(--deep);
  }
  .nav-logo .mark::before{top:0;height:60%;border-top:2px solid var(--deep)}
  .nav-logo .mark::after{bottom:0;height:40%;border-bottom:2px solid var(--ochre)}
  .nav-links{display:flex;gap:36px;list-style:none}
  .nav-links a{
    color:var(--deep);text-decoration:none;font-size:14px;font-weight:400;
    position:relative;padding:6px 0;letter-spacing:1px;
  }
  .nav-links a::after{
    content:"";position:absolute;left:0;bottom:0;height:1px;width:0;
    background:var(--ochre);transition:width .4s cubic-bezier(.2,.8,.2,1);
  }
  .nav-links a:hover::after{width:100%}
  .nav-cta{
    padding:10px 22px;border:1px solid var(--deep);
    color:var(--deep);text-decoration:none;font-size:13px;letter-spacing:2px;
    position:relative;overflow:hidden;transition:color .4s;
  }
  .nav-cta::before{
    content:"";position:absolute;inset:0;background:var(--deep);
    transform:translateY(101%);transition:transform .4s cubic-bezier(.77,0,.175,1);
  }
  .nav-cta:hover{color:var(--sand)}
  .nav-cta:hover::before{transform:translateY(0)}
  .nav-cta span{position:relative;z-index:1}

  .nav-burger{display:none;width:32px;height:24px;position:relative;cursor:pointer}
  .nav-burger span{position:absolute;left:0;right:0;height:1.5px;background:var(--deep);transition:.3s}
  .nav-burger span:nth-child(1){top:0}
  .nav-burger span:nth-child(2){top:50%}
  .nav-burger span:nth-child(3){bottom:0}

  @media (max-width:768px){
    .nav{padding:18px 20px}
    .nav-links{display:none}
    .nav-burger{display:block}
    .nav-cta{display:none}
  }

  /* ─── Hero ─── */
  .hero{
    position:relative;height:100vh;min-height:680px;
    background:linear-gradient(180deg,var(--sand) 0%,var(--sand-2) 50%,var(--mist) 100%);
    overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .hero-canvas{position:absolute;inset:0;width:100%;height:100%}

  .hero-content{
    position:relative;z-index:2;
    text-align:center;color:var(--deep);
    padding:0 24px;
    pointer-events:none;
  }
  .hero-eyebrow{
    font-size:13px;letter-spacing:8px;color:var(--ochre);
    margin-bottom:28px;opacity:0;transform:translateY(20px);
    animation:fadeUp 1s .3s cubic-bezier(.2,.8,.2,1) forwards;
    font-weight:500;
  }
  .hero-title{
    font-family:"ZCOOL XiaoWei","Noto Serif SC",serif;
    font-size:clamp(48px,9vw,140px);
    font-weight:400;letter-spacing:16px;line-height:1;
    margin-bottom:24px;
    opacity:0;transform:translateY(30px);
    animation:fadeUp 1.2s .5s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .hero-title em{
    font-style:normal;color:var(--ochre);
    font-family:"Noto Serif SC",serif;font-weight:300;
  }
  .hero-subtitle{
    font-size:15px;letter-spacing:3px;color:var(--mist-dark);
    max-width:520px;margin:0 auto 48px;line-height:1.9;
    opacity:0;transform:translateY(20px);
    animation:fadeUp 1s .8s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .hero-meta{
    display:flex;gap:48px;justify-content:center;
    font-size:12px;letter-spacing:2px;color:var(--deep);
    opacity:.7;
    opacity:0;transform:translateY(20px);
    animation:fadeUp 1s 1.1s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .hero-meta div{display:flex;flex-direction:column;gap:6px}
  .hero-meta .v{font-size:22px;font-family:"Noto Serif SC",serif;color:var(--ochre);letter-spacing:1px}
  .hero-meta .k{font-size:11px;color:var(--mist-dark);letter-spacing:3px}

  @keyframes fadeUp{to{opacity:1;transform:translateY(0)}}

  .hero-scroll{
    position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
    z-index:3;display:flex;flex-direction:column;align-items:center;gap:10px;
    font-size:11px;letter-spacing:3px;color:var(--deep);opacity:.6;
    animation:fadeUp 1s 1.4s cubic-bezier(.2,.8,.2,1) both;
  }
  .hero-scroll .line{
    width:1px;height:40px;background:var(--deep);position:relative;overflow:hidden;
  }
  .hero-scroll .line::after{
    content:"";position:absolute;top:-40px;left:0;width:100%;height:40px;
    background:var(--ochre);animation:scrollDown 2s cubic-bezier(.6,.05,.4,1) infinite;
  }
  @keyframes scrollDown{
    0%{top:-40px}100%{top:100%}
  }

  /* ─── 通用 section ─── */
  section{position:relative;padding:140px 48px;overflow:hidden}
  .section-inner{max-width:1280px;margin:0 auto}
  .section-label{
    font-size:12px;letter-spacing:6px;color:var(--ochre);
    margin-bottom:16px;font-weight:500;
    display:flex;align-items:center;gap:12px;
  }
  .section-label::before{content:"";width:32px;height:1px;background:var(--ochre)}
  .section-title{
    font-family:"ZCOOL XiaoWei","Noto Serif SC",serif;
    font-size:clamp(32px,5vw,64px);font-weight:400;
    line-height:1.2;margin-bottom:20px;letter-spacing:4px;
    color:var(--deep);
  }
  .section-desc{
    font-size:15px;line-height:2;color:var(--mist-dark);
    max-width:640px;letter-spacing:.5px;
  }

  .reveal{opacity:0;transform:translateY(40px);transition:opacity 1s cubic-bezier(.2,.8,.2,1),transform 1s cubic-bezier(.2,.8,.2,1)}
  .reveal.in{opacity:1;transform:translateY(0)}
  .reveal-delay-1{transition-delay:.1s}
  .reveal-delay-2{transition-delay:.2s}
  .reveal-delay-3{transition-delay:.3s}
  .reveal-delay-4{transition-delay:.4s}

  @media (max-width:768px){
    section{padding:80px 24px}
  }

  /* ─── 装置介绍 ─── */
  .intro{background:var(--sand)}
  .intro-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:80px;
    align-items:center;margin-top:80px;
  }
  .intro-visual{
    position:relative;aspect-ratio:4/5;border-radius:4px;overflow:hidden;
    background:linear-gradient(160deg,var(--crystal) 0%,var(--mist) 40%,var(--deep) 100%);
  }
  .intro-visual::before{
    content:"";position:absolute;inset:0;
    background-image:
      radial-gradient(circle at 30% 20%, rgba(250,247,239,.6) 0%, transparent 40%),
      radial-gradient(circle at 70% 60%, rgba(199,91,57,.4) 0%, transparent 50%);
  }
  .salt-texture{
    position:absolute;inset:0;
    background-image:
      radial-gradient(1px 1px at 10% 30%, var(--salt), transparent),
      radial-gradient(1px 1px at 40% 70%, var(--salt), transparent),
      radial-gradient(1.5px 1.5px at 80% 20%, var(--crystal), transparent),
      radial-gradient(1px 1px at 60% 85%, var(--salt), transparent),
      radial-gradient(1px 1px at 20% 90%, var(--salt), transparent),
      radial-gradient(1.5px 1.5px at 90% 50%, var(--crystal), transparent);
    background-size:200% 200%;
    animation:crystalDrift 20s ease-in-out infinite alternate;
    opacity:.7;
  }
  @keyframes crystalDrift{
    0%{background-position:0% 0%}
    100%{background-position:100% 100%}
  }

  .intro-stats{
    display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:48px;
  }
  .intro-stat .num{
    font-family:"Noto Serif SC",serif;
    font-size:48px;font-weight:300;color:var(--ochre);
    line-height:1;margin-bottom:8px;letter-spacing:1px;
  }
  .intro-stat .num sup{font-size:20px;vertical-align:super;color:var(--mist-dark)}
  .intro-stat .lbl{
    font-size:13px;color:var(--mist-dark);letter-spacing:2px;
  }
  .intro-stat{
    padding:24px 0;border-top:1px solid rgba(45,58,58,.12);
  }
  .intro-list{margin-top:40px;list-style:none;display:flex;flex-direction:column;gap:20px}
  .intro-list li{
    display:flex;gap:16px;align-items:flex-start;
    font-size:14px;line-height:1.9;color:var(--deep);
    padding-left:20px;position:relative;
  }
  .intro-list li::before{
    content:"";position:absolute;left:0;top:12px;
    width:6px;height:6px;border-radius:50%;
    background:var(--ochre);transform:scale(1);
    transition:transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .intro-list li:hover::before{transform:scale(1.8)}

  @media (max-width:768px){
    .intro-grid{grid-template-columns:1fr;gap:48px}
  }

  /* ─── 盐田色卡 ─── */
  .palette{
    background:var(--deep);
    color:var(--sand);
  }
  .palette .section-title{color:var(--sand)}
  .palette .section-label{color:var(--crystal)}
  .palette .section-label::before{background:var(--crystal)}
  .palette .section-desc{color:var(--mist)}

  .palette-grid{
    display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
    margin-top:80px;height:480px;border-radius:4px;overflow:hidden;
  }
  .palette-item{
    position:relative;cursor:pointer;
    transition:flex-grow .6s cubic-bezier(.2,.8,.2,1);
    flex-grow:1;overflow:hidden;
  }
  .palette-item .swatch{
    position:absolute;inset:0;
    transition:filter .5s;
  }
  .palette-item:hover .swatch{filter:brightness(1.1) saturate(1.1)}
  .palette-item .p-info{
    position:absolute;bottom:0;left:0;right:0;
    padding:24px;transform:translateY(20px);opacity:0;
    transition:transform .5s cubic-bezier(.2,.8,.2,1) .1s, opacity .5s;
    color:var(--deep);
  }
  .palette-item.dark .p-info{color:var(--salt)}
  .palette-item:hover .p-info{transform:translateY(0);opacity:1}
  .palette-item .p-name{font-family:"Noto Serif SC",serif;font-size:20px;letter-spacing:2px;margin-bottom:6px}
  .palette-item .p-code{font-size:12px;letter-spacing:2px;opacity:.7}
  .palette-item .p-index{
    position:absolute;top:24px;left:24px;
    font-size:11px;letter-spacing:2px;opacity:.6;
  }
  .palette-item.dark .p-index{color:var(--salt)}

  @media (max-width:768px){
    .palette-grid{grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,120px);height:auto}
  }

  /* ─── 声学原理 ─── */
  .acoustics{background:var(--sand-2)}
  .acoustics-grid{
    display:grid;grid-template-columns:1.2fr 1fr;gap:80px;
    align-items:center;margin-top:80px;
  }
  .acoustics-visual{
    position:relative;height:400px;border-radius:4px;
    background:var(--salt);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .wave-canvas{position:absolute;inset:0;width:100%;height:100%}

  .freq-bars{
    display:flex;flex-direction:column;gap:20px;
  }
  .freq-bar{
    display:flex;align-items:center;gap:16px;
    padding:20px 24px;background:var(--salt);border-radius:4px;
    position:relative;overflow:hidden;
    transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s;
  }
  .freq-bar:hover{
    transform:translateX(8px);
    box-shadow:-4px 0 0 var(--ochre), 0 10px 30px rgba(45,58,58,.1);
  }
  .freq-bar .f-note{
    font-family:"Noto Serif SC",serif;
    font-size:32px;font-weight:300;color:var(--ochre);
    min-width:50px;letter-spacing:1px;
  }
  .freq-bar .f-info{flex:1}
  .freq-bar .f-name{font-size:15px;color:var(--deep);margin-bottom:4px;letter-spacing:1px}
  .freq-bar .f-desc{font-size:12px;color:var(--mist-dark);letter-spacing:1px}
  .freq-bar .f-hz{
    font-size:13px;color:var(--mist-dark);letter-spacing:1px;
    font-variant-numeric:tabular-nums;
  }

  @media (max-width:768px){
    .acoustics-grid{grid-template-columns:1fr;gap:48px}
  }

  /* ─── 展演日程 ─── */
  .schedule{background:var(--sand)}
  .schedule-header{
    display:flex;justify-content:space-between;align-items:flex-end;
    flex-wrap:wrap;gap:24px;
  }
  .schedule-tabs{
    display:flex;gap:0;border:1px solid var(--mist-dark);border-radius:2px;overflow:hidden;
  }
  .schedule-tab{
    padding:10px 24px;font-size:13px;letter-spacing:2px;
    background:transparent;color:var(--mist-dark);cursor:pointer;
    border:none;border-right:1px solid var(--mist-dark);
    transition:all .3s;font-family:inherit;
  }
  .schedule-tab:last-child{border-right:none}
  .schedule-tab.active{background:var(--deep);color:var(--salt)}
  .schedule-tab:hover:not(.active){background:rgba(45,58,58,.05)}

  .schedule-list{
    margin-top:60px;display:flex;flex-direction:column;gap:1px;
    background:rgba(45,58,58,.1);border-radius:4px;overflow:hidden;
  }
  .schedule-item{
    background:var(--salt);
    padding:32px 40px;
    display:grid;grid-template-columns:120px 1fr auto;gap:40px;
    align-items:center;
    transition:background .3s, padding-left .4s cubic-bezier(.2,.8,.2,1);
    cursor:pointer;position:relative;
  }
  .schedule-item::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--ochre);transform:scaleY(0);transform-origin:bottom;
    transition:transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .schedule-item:hover{background:var(--sand);padding-left:52px}
  .schedule-item:hover::before{transform:scaleY(1)}
  .s-date{
    font-family:"Noto Serif SC",serif;
    display:flex;flex-direction:column;align-items:flex-start;
  }
  .s-date .day{font-size:42px;font-weight:300;color:var(--ochre);line-height:1}
  .s-date .month{font-size:13px;letter-spacing:3px;color:var(--mist-dark);margin-top:4px}
  .s-info .s-title{
    font-size:18px;color:var(--deep);margin-bottom:8px;letter-spacing:1px;font-weight:500;
  }
  .s-info .s-meta{
    display:flex;gap:24px;font-size:12px;color:var(--mist-dark);letter-spacing:1px;
  }
  .s-info .s-meta span{display:flex;align-items:center;gap:6px}
  .s-info .s-meta i{
    width:3px;height:3px;border-radius:50%;background:var(--ochre);
    display:inline-block;
  }
  .s-btn{
    padding:10px 20px;border:1px solid var(--deep);
    font-size:12px;letter-spacing:2px;color:var(--deep);
    background:transparent;cursor:pointer;font-family:inherit;
    transition:all .3s;position:relative;overflow:hidden;
  }
  .s-btn:hover{background:var(--deep);color:var(--salt)}

  @media (max-width:768px){
    .schedule-item{grid-template-columns:80px 1fr;gap:20px;padding:24px}
    .s-btn{grid-column:1/-1;justify-self:start}
  }

  /* ─── 艺术家 ─── */
  .artists{background:var(--deep);color:var(--sand)}
  .artists .section-title{color:var(--sand)}
  .artists .section-label{color:var(--crystal)}
  .artists .section-label::before{background:var(--crystal)}
  .artists .section-desc{color:var(--mist)}

  .artists-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:32px;
    margin-top:80px;
  }
  .artist-card{
    position:relative;cursor:pointer;
    transition:transform .5s cubic-bezier(.2,.8,.2,1);
    transform-style:preserve-3d;perspective:1000px;
  }
  .artist-card:hover{transform:translateY(-8px)}
  .artist-avatar{
    width:100%;aspect-ratio:3/4;position:relative;
    border-radius:4px;overflow:hidden;margin-bottom:24px;
    background:linear-gradient(160deg,var(--mist-dark),var(--deep-2));
  }
  .artist-avatar::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 30%, rgba(232,213,163,.3), transparent 60%);
  }
  .artist-pulse{
    position:absolute;top:50%;left:50%;
    width:100px;height:100px;border-radius:50%;
    border:1px solid var(--crystal);
    transform:translate(-50%,-50%) scale(1);
    animation:pulseRing 3s cubic-bezier(.2,.8,.2,1) infinite;
  }
  .artist-card:nth-child(2) .artist-pulse{animation-delay:.5s}
  .artist-card:nth-child(3) .artist-pulse{animation-delay:1s}
  .artist-pulse:nth-child(2){animation-delay:1.5s}
  .artist-card:nth-child(2) .artist-pulse:nth-child(2){animation-delay:1s}
  .artist-card:nth-child(3) .artist-pulse:nth-child(2){animation-delay:1.5s}
  @keyframes pulseRing{
    0%{transform:translate(-50%,-50%) scale(.5);opacity:.8}
    100%{transform:translate(-50%,-50%) scale(2);opacity:0}
  }
  .artist-initial{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    font-family:"ZCOOL XiaoWei","Noto Serif SC",serif;
    font-size:80px;color:var(--crystal);opacity:.8;letter-spacing:0;
  }
  .artist-name{
    font-family:"Noto Serif SC",serif;
    font-size:24px;color:var(--sand);margin-bottom:6px;letter-spacing:2px;
  }
  .artist-role{
    font-size:12px;color:var(--crystal);letter-spacing:3px;margin-bottom:14px;
  }
  .artist-bio{
    font-size:13px;line-height:1.9;color:var(--mist);letter-spacing:.3px;
  }

  /* 光泽扫过 */
  .shimmer{
    position:relative;overflow:hidden;
  }

<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ============================================================
   自定义光标 + 涟漪
   ============================================================ */
function CustomCursor() {
  const ringRef = useRef(null);
  const dotRef = useRef(null);
  const rafRef = useRef(null);
  const targetRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const currentRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const [hover, setHover] = useState(false);

  useEffect(() => {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;

    // 初始位置：屏幕中央
    currentRef.current = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    targetRef.current = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    updateDom();

    let running = true;
    function loop() {
      if (!running) return;
      // 惯性阻尼：ring 有延迟，dot 更跟手
      const cx = currentRef.current;
      const tx = targetRef.current;
      // dot: 直接跟随
      if (dotRef.current) {
        dotRef.current.style.transform = `translate(${tx.x}px, ${tx.y}px) translate(-50%,-50%)`;
      }
      // ring: 弹簧阻尼
      const dx = tx.x - cx.x;
      const dy = tx.y - cx.y;
      cx.x += dx * 0.18;
      cx.y += dy * 0.18;
      if (ringRef.current) {
        ringRef.current.style.transform = `translate(${cx.x}px, ${cx.y}px) translate(-50%,-50%)`;
      }
      rafRef.current = requestAnimationFrame(loop);
    }
    function updateDom() {
      if (dotRef.current) {
        dotRef.current.style.transform = `translate(${targetRef.current.x}px, ${targetRef.current.y}px) translate(-50%,-50%)`;
      }
      if (ringRef.current) {
        ringRef.current.style.transform = `translate(${currentRef.current.x}px, ${currentRef.current.y}px) translate(-50%,-50%)`;
      }
    }

    rafRef.current = requestAnimationFrame(loop);

    function onMove(e) {
      targetRef.current.x = e.clientX;
      targetRef.current.y = e.clientY;
    }
    function onDown() {
      if (ringRef.current) ringRef.current.classList.add('click');
    }
    function onUp() {
      if (ringRef.current) ringRef.current.classList.remove('click');
    }

    // 可交互元素悬停检测
    function onOver(e) {
      const t = e.target.closest('a,button,[data-cursor="hover"],input,textarea,select');
      if (t) {
        setHover(true);
      }
    }
    function onOut(e) {
      const t = e.target.closest('a,button,[data-cursor="hover"],input,textarea,select');
      if (t) {
        setHover(false);
      }
    }

    window.addEventListener('mousemove', onMove);
    window.addEventListener('mousedown', onDown);
    window.addEventListener('mouseup', onUp);
    window.addEventListener('mouseover', onOver);
    window.addEventListener('mouseout', onOut);

    // 可见性切换
    function onVis() {
      if (document.hidden) {
        running = false;
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      } else {
        running = true;
        rafRef.current = requestAnimationFrame(loop);
      }
    }
    document.addEventListener('visibilitychange', onVis);

    return () => {
      running = false;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mousedown', onDown);
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('mouseover', onOver);
      window.removeEventListener('mouseout', onOut);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, []);

  // 涟漪
  useEffect(() => {
    function onClick(e) {
      const r = document.createElement('div');
      r.className = 'ripple';
      r.style.left = e.clientX + 'px';
      r.style.top = e.clientY + 'px';
      document.body.appendChild(r);
      setTimeout(() => r.remove(), 600);
    }
    window.addEventListener('click', onClick);
    return () => window.removeEventListener('click', onClick);
  }, []);

  return (
    <>
      <div ref={ringRef} className={'cursor-ring' + (hover ? ' hover' : '')} />
      <div ref={dotRef} className={'cursor-dot' + (hover ? ' hover' : '')} />
    </>
  );
}

/* ============================================================
   滚动进度条
   ============================================================ */
function ScrollProgress() {
  const ref = useRef(null);
  useEffect(() => {
    function onScroll() {
      const h = document.documentElement;
      const p = (h.scrollTop / (h.scrollHeight - h.clientHeight)) * 100;
      if (ref.current) ref.current.style.width = p + '%';
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return <div ref={ref} className="scroll-progress" />;
}

/* ============================================================
   盐晶粒子 + 风琴管阵 Canvas (Hero)
   ============================================================ */
function HeroCanvas() {
  const canvasRef = useRef(null);
  const mouseRef = useRef({ x: -9999, y: -9999 });

  useEffect(() => {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let w, h, dpr;
    let particles = [];
    let pipes = [];
    let raf = null;
    let running = true;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = canvas.width = canvas.offsetWidth * dpr;
      h = canvas.height = canvas.offsetHeight * dpr;
      init();
    }

    function init() {
      // 盐晶粒子
      particles = [];
      const count = Math.floor(w * h / 18000);
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          size: (Math.random() * 2 + 0.5) * dpr,
          vx: (Math.random() - 0.5) * 0.3 * dpr,
          vy: -(Math.random() * 0.4 + 0.1) * dpr,
          alpha: Math.random() * 0.5 + 0.2,
          phase: Math.random() * Math.PI * 2,
          speed: Math.random() * 0.02 + 0.005,
        });
      }
      // 风琴管阵
      pipes = [];
      const pipeCount = 11;
      const spacing = w / (pipeCount + 1);
      for (let i = 0; i < pipeCount; i++) {
        const baseHeight = h * (0.25 + Math.sin(i * 0.8) * 0.15 + i * 0.03);
        pipes.push({
          x: spacing * (i + 1),
          baseY: h * 0.85,
          height: baseHeight,
          width: (14 + i * 1.2) * dpr,
          freq: 110 + i * 18,
          phase: Math.random() * Math.PI * 2,
          glow: 0,
          targetGlow: 0,
          index: i,
        });
      }
    }

    function draw() {
      if (!running) return;
      ctx.clearRect(0, 0, w, h);

      // 渐变底色
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, 'rgba(245,240,230,0)');
      grad.addColorStop(1, 'rgba(139,168,159,0.15)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // 盐晶粒子
      const mx = mouseRef.current.x * dpr;
      const my = mouseRef.current.y * dpr;
      particles.forEach(p => {
        // 鼠标吸引 (反平方引力，距离内有吸引)
        const dx = mx - p.x;
        const dy = my - p.y;
        const distSq = dx * dx + dy * dy;
        const maxDist = 180 * dpr;
        if (distSq < maxDist * maxDist && distSq > 1) {
          const dist = Math.sqrt(distSq);
          const force = (1 - dist / maxDist) * 0.15;
          p.vx += (dx / dist) * force;
          p.vy += (dy / dist) * force;
        }
        // 阻尼
        p.vx *= 0.96;
        p.vy *= 0.96;
        // 自然向上飘
        p.vy -= 0.02 * dpr;
        // 正弦摆动
        p.phase += p.speed;
        p.vx += Math.sin(p.phase) * 0.02 * dpr;

        p.x += p.vx;
        p.y += p.vy;

        // 边界循环
        if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
        if (p.x < -10) p.x = w + 10;
        if (p.x > w + 10) p.x = -10;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(232,213,163,${p.alpha})`;
        ctx.fill();
      });

      // 风琴管
      const time = performance.now() * 0.001;
      pipes.forEach(pipe => {
        // 鼠标距离影响发光
        const pdx = mx - pipe.x;
        const pdy = my - (pipe.baseY - pipe.height / 2);
        const pdist = Math.sqrt(pdx * pdx + pdy * pdy);
        const influenceR = 200 * dpr;
        pipe.targetGlow = Math.max(0, 1 - pdist / influenceR);
        pipe.glow += (pipe.targetGlow - pipe.glow) * 0.08;

        const topY = pipe.baseY - pipe.height;
        const g = pipe.glow;

        // 管身
        const pipeGrad = ctx.createLinearGradient(pipe.x - pipe.width / 2, 0, pipe.x + pipe.width / 2, 0);
        pipeGrad.addColorStop(0, `rgba(45,58,58,${0.7 + g * 0.3})`);
        pipeGrad.addColorStop(0.5, `rgba(139,168,159,${0.3 + g * 0.5})`);
        pipeGrad.addColorStop(1, `rgba(45,58,58,${0.7 + g * 0.3})`);
        ctx.fillStyle = pipeGrad;
        ctx.fillRect(pipe.x - pipe.width / 2, topY, pipe.width, pipe.height);

        // 管顶发光
        if (g > 0.05) {
          const glowIntensity = g * 0.8;
          ctx.beginPath();
          ctx.arc(pipe.x, topY, pipe.width * (0.8 + g * 1.5), 0, Math.PI * 2);
          const glowGrad = ctx.createRadialGradient(pipe.x, topY, 0, pipe.x, topY, pipe.width * 3);
          glowGrad.addColorStop(0, `rgba(199,91,57,${glowIntensity * 0.6})`);
          glowGrad.addColorStop(0.5, `rgba(232,213,163,${glowIntensity * 0.3})`);
          glowGrad.addColorStop(1, 'rgba(232,213,163,0)');
          ctx.fillStyle = glowGrad;
          ctx.fill();
        }

        // 频谱波纹 (从管顶向上扩散)
        const waveCount = 3;
        for (let w2 = 0; w2 < waveCount; w2++) {
          const wt = (time * (0.8 + pipe.index * 0.1) + w2 * 0.33) % 1;
          const waveY = topY - wt * pipe.height * 0.8;
          const waveAlpha = (1 - wt) * g * 0.4;
          if (waveAlpha > 0.01) {
            ctx.beginPath();
            ctx.ellipse(pipe.x, waveY, pipe.width * (0.6 + wt * 1.2), 3 * dpr, 0, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(199,91,57,${waveAlpha})`;
            ctx.lineWidth = 1.5 * dpr;
            ctx.stroke();
          }
        }

        // 管口
        ctx.beginPath();
        ctx.ellipse(pipe.x, topY, pipe.width / 2, pipe.width * 0.25, 0, 0, Math.PI * 2);
        ctx.fillStyle = g > 0.1 ? `rgba(232,213,163,${0.3 + g * 0.5})` : 'rgba(45,58,58,0.8)';
        ctx.fill();
      });

      // 底部盐田地平线
      const horizonGrad = ctx.createLinearGradient(0, h * 0.8, 0, h);
      horizonGrad.addColorStop(0, 'rgba(199,91,57,0.1)');
      horizonGrad.addColorStop(0.5, 'rgba(199,91,57,0.2)');
      horizonGrad.addColorStop(1, 'rgba(154,62,34,0.3)');
      ctx.fillStyle = horizonGrad;
      ctx.fillRect(0, h * 0.82, w, h * 0.18);

      // 盐田池埂横线
      ctx.strokeStyle = 'rgba(199,91,57,0.2)';
      ctx.lineWidth = 1 * dpr;
      for (let i = 0; i < 4; i++) {
        const y = h * (0.85 + i * 0.04);
        ctx.beginPath();
        ctx.moveTo(0, y);
        for (let x = 0; x < w; x += 20 * dpr) {
          ctx.lineTo(x, y + Math.sin(x * 0.01 / dpr + i) * 2 * dpr);
        }
        ctx.stroke();
      }

      raf = requestAnimationFrame(draw);
    }

    function onMove(e) {
      const rect = canvas.getBoundingClientRect();
      mouseRef.current.x = e.clientX - rect.left;
      mouseRef.current.y = e.clientY - rect.top;
    }
    function onLeave() {
      mouseRef.current = { x: -9999, y: -9999 };
    }

    function onVis() {
      if (document.hidden) {
        running = false;
        if (raf) cancelAnimationFrame(raf);
      } else {
        running = true;
        raf = requestAnimationFrame(draw);
      }
    }

    resize();
    if (!reduce) {
      raf = requestAnimationFrame(draw);
    } else {
      // 静态模式：画一帧
      draw();
      running = false;
    }

    window.addEventListener('resize', resize);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseleave', onLeave);
    document.addEventListener('visibilitychange', onVis);

    return () => {
      running = false;
      if (raf) cancelAnimationFrame(raf);
      window.removeEventListener('resize', resize);
      canvas.removeEventListener('mousemove', onMove);
      canvas.removeEventListener('mouseleave', onLeave);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, []);

  return <canvas ref={canvasRef} className="hero-canvas" />;
}

/* ============================================================
   声波可视化 Canvas
   ============================================================ */
function WaveCanvas() {
  const ref = useRef(null);
  useEffect(() => {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let w, h, dpr;
    let raf = null;
    let running = true;
    let t = 0;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = canvas.width = canvas.offsetWidth * dpr;
      h = canvas.height = canvas.offsetHeight * dpr;
    }

    function draw() {
      if (!running) return;
      ctx.clearRect(0, 0, w, h);

      t += 0.015;

      // 4 层不同频率的正弦波叠加
      const layers = [
        { freq: 0.008, amp: 0.08, color: 'rgba(139,168,159,0.3)', speed: 1, y: 0.35 },
        { freq: 0.015, amp: 0.06, color: 'rgba(199,91,57,0.4)', speed: 1.5, y: 0.5 },
        { freq: 0.025, amp: 0.04, color: 'rgba(232,213,163,0.5)', speed: 2, y: 0.6 },
        { freq: 0.04, amp: 0.03, color: 'rgba(45,58,58,0.2)', speed: 0.8, y: 0.7 },
      ];

      layers.forEach(layer => {
        ctx.beginPath();
        ctx.moveTo(0, h * layer.y);
        for (let x = 0; x <= w; x += 2) {
          const y = h * layer.y + Math.sin(x * layer.freq + t * layer.speed) * h * layer.amp
            + Math.sin(x * layer.freq * 2.3 + t * layer.speed * 0.7) * h * layer.amp * 0.4;
          ctx.lineTo(x, y);
        }
        ctx.strokeStyle = layer.color;
        ctx.lineWidth = 1.5 * dpr;
        ctx.stroke();

        // 下方阴影填充
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        const fill = ctx.createLinearGradient(0, h * layer.y, 0, h);
        fill.addColorStop(0, layer.color.replace(/[\d.]+\)$/, '0.08)'));
        fill.addColorStop(1, 'rgba(250,247,239,0)');
        ctx.fillStyle = fill;
        ctx.fill();
      });

      // 中心参考线
      ctx.strokeStyle = 'rgba(45,58,58,0.08)';
      ctx.lineWidth = 1 * dpr;
      ctx.setLineDash([4 * dpr, 8 * dpr]);
      ctx.beginPath();
      ctx.moveTo(0, h * 0.5);
      ctx.lineTo(w, h * 0.5);
      ctx.stroke();
      ctx.setLineDash([]);

      raf = requestAnimationFrame(draw);
    }

    resize();
    if (!reduce) {
      raf = requestAnimationFrame(draw);
    } else {
      draw();
      running = false;
    }

    window.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', onVis);
    function onVis() {
      if (document.hidden) {
        running = false;
        if (raf) cancelAnimationFrame(raf);
      } else {
        running = true;
        raf = requestAnimationFrame(draw);
      }
    }

    return () => {
      running = false;
      if (raf) cancelAnimationFrame(raf);
      window.removeEventListener('resize', resize);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, []);
  return <canvas ref={ref} className="wave-canvas" />;
}

/* ============================================================
   数字计数动画
   ============================================================ */
function CountUp({ target, suffix = '', duration = 2000, decimals = 0 }) {
  const ref = useRef(null);
  const [display, setDisplay] = useState(0);
  const started = useRef(false);

  useEffect(() => {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { setDisplay(target); return; }

    const el = ref.current;
    if (!el) return;

    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !started.current) {
          started.current = true;
          const startTime = performance.now();
          const startVal = 0;
          function tick(now) {
            const elapsed = now - startTime;
            const p = Math.min(elapsed / duration, 1);
            // 缓动：easeOutCubic
            const eased = 1 - Math.pow(1 - p, 3);
            const val = startVal + (target - startVal) * eased;
            setDisplay(val);
            if (p < 1) requestAnimationFrame(tick);
          }
          requestAnimationFrame(tick);
        }
      });
    }, { threshold: 0.3 });

    io.observe(el);
    return () => io.disconnect();
  }, [target, duration]);

  return (
    <span ref={ref}>
      {decimals > 0 ? display.toFixed(decimals) : Math.floor(display)}
      {suffix}
    </span>
  );
}

/* ============================================================
   打字机效果
   ============================================================ */
function Typewriter({ text, speed = 80, delay = 0 }) {
  const [shown, setShown] = useState('');
  const [done, setDone] = useState(false);
  const ref = useRef(null);
  const timerRef = useRef(null);
  const started = useRef(false);

  useEffect(() => {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { setShown(text); setDone(true); return; }

    const el = ref.current;
    if (!el) return;

    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !started.current) {
          started.current = true;
          let i = 0;
          function type() {
            if (i <= text.length) {
              setShown(text.slice(0, i));
              i++;
              timerRef.current = setTimeout(type, speed + Math.random() * 40);
            } else {
              setDone(true);
            }
          }
          timerRef.current = setTimeout(type, delay);
        }
      });
    }, { threshold: 0.5 });

    io.observe(el);
    return () => {
      io.disconnect();
      if (timerRef.current) clearTimeout(timerRef.current);
    };
  }, [text, speed, delay]);

  return (
    <span ref={ref}>
      {shown}
      {!done && <span className="type-cursor" />}
    </span>
  );
}

/* ============================================================
   滚动渐入包装器
   ============================================================ */
function Reveal({ children, className = '', delay = 0 }) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);

  useEffect(() => {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { setInView(true); return; }
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          setTimeout(() => setInView(true), delay);
          io.unobserve(el);
        }
      });
    }, { threshold: 0.15 });
    io.observe(el);
    return () => io.disconnect();
  }, [delay]);

  return (
    <div ref={ref} className={`reveal ${inView ? 'in' : ''} ${className}`}>
      {children}
    </div>
  );
}

/* ============================================================
   3D 倾斜卡片
   ============================================================ */
function TiltCard({ children, className = '', intensity = 10 }) {
  const ref = useRef(null);
  const rafRef = useRef(null);
  const targetRef = useRef({ rx: 0, ry: 0 });
  const currentRef = useRef({ rx: 0, ry: 0 });

  useEffect(() => {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;
    const el = ref.current;
    if (!el) return;

    let running = false;

    function loop() {
      if (!running) return;
      const c = currentRef.current;
      const t = targetRef.current;
      c.rx += (t.rx - c.rx) * 0.1;
      c.ry += (t.ry - c.ry) * 0.1;
      el.style.transform = `perspective(1000px) rotateX(${c.rx}deg) rotateY(${c.ry}deg)`;
      rafRef.current = requestAnimationFrame(loop);
    }

    function onMove(e) {
      const rect = el.getBoundingClientRect();
      const cx = (e.clientX - rect.left) / rect.width - 0.5;
      const cy = (e.clientY - rect.top) / rect.height - 0.5;
      targetRef.current.ry = cx * intensity;
      targetRef.current.rx = -cy * intensity;
    }
    function onEnter() {
      running = true;
      rafRef.current = requestAnimationFrame(loop);
    }
    function onLeave() {
      targetRef.current = { rx: 0, ry: 0 };
      setTimeout(() => {
        running = false;
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        el.style.transform = '';
      }, 400);
    }

    el.addEventListener('mousemove', onMove);
    el.addEventListener('mouseenter', onEnter);
    el.addEventListener('mouseleave', onLeave);

    return () => {
      running = false;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      el.removeEventListener('mousemove', onMove);
      el.removeEventListener('mouseenter', onEnter);
      el.removeEventListener('mouseleave', onLeave);
    };
  }, [intensity]);

  return (
    <div ref={ref} className={className} style={{ transformStyle: 'preserve-3d' }}>
      {children}
    </div>
  );
}

/* ============================================================
   磁性按钮
   ============================================================ */
function MagneticButton({ children, className = '', onClick, strength = 0.3 }) {
  const ref = useRef(null);
  const rafRef = useRef(null);
  const targetRef = useRef({ x: 0, y: 0 });
  const currentRef = useRef({ x: 0, y: 0 });
  const activeRef = useRef(false);

  useEffect(() => {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;
    const el = ref.current;
    if (!el) return;

    function loop() {
      if (!activeRef.current) return;
      const c = currentRef.current;
      const t = targetRef.current;
      c.x += (t.x - c.x) * 0.2;
      c.y += (t.y - c.y) * 0.2;
      el.style.transform = `translate(${c.x}px, ${c.y}px)`;
      rafRef.current = requestAnimationFrame(loop);
    }

    function onMove(e) {
      const rect = el.getBoundingClientRect();
      const dx = e.clientX - (rect.left + rect.width / 2);
      const dy = e.clientY - (rect.top + rect.height / 2);
      const dist = Math.sqrt(dx * dx + dy * dy);
      const maxDist = Math.max(rect.width, rect.height) * 0.8;
      if (dist < maxDist) {
        targetRef.current.x = dx * strength;
        targetRef.current.y = dy * strength;
      } else {
        targetRef.current.x = 0;
        targetRef.current.y = 0;
      }
    }
    function onEnter() {
      activeRef.current = true;
      rafRef.current = requestAnimationFrame(loop);
    }
    function onLeave() {
      activeRef.current = false;
      targetRef.current = { x: 0, y: 0 };
      // 弹簧回到原位
      const snap = () => {
        const c = currentRef.current;
        c.x *= 0.85;
        c.y *= 0.85;
        el.style.transform = `translate(${c.x}px, ${c.y}px)`;
        if (Math.abs(c.x) > 0.1 || Math.abs(c.y) > 0.1) {
          requestAnimationFrame(snap);
        } else {
          el.style.transform = '';
        }
      };
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      requestAnimationFrame(snap);
    }

    el.addEventListener('mousemove', onMove);
    el.addEventListener('mouseenter', onEnter);
    el.addEventListener('mouseleave', onLeave);

    return () => {
      activeRef.current = false;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      el.removeEventListener('mousemove', onMove);
      el.removeEventListener('mouseenter', onEnter);
      el.removeEventListener('mouseleave', onLeave);
    };
  }, [strength]);

  return (
    <button ref={ref} className={'magnetic-btn ' + className} onClick={onClick}>
      {children}
    </button>
  );
}

/* ============================================================
   视差背景
   ============================================================ */
function ParallaxBg({ speed = 0.3, children, className = '' }) {
  const ref = useRef(null);
  const rafRef = useRef(null);
  const scrollY = useRef(0);
  const targetY = useRef(0);

  useEffect(() => {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;
    const el = ref.current;
    if (!el) return;

    let running = true;
    function loop() {
      if (!running) return;
      scrollY.current += (targetY.current - scrollY.current) * 0.08;
      el.style.transform = `translateY(${scrollY.current}px)`;
      rafRef.current = requestAnimationFrame(loop);
    }

    function onScroll() {
      const rect = el.getBoundingClientRect();
      const center = rect.top + rect.height / 2;
      const offset = (center - window.innerHeight / 2) * speed;
      targetY.current = -offset;
    }

    rafRef.current = requestAnimationFrame(loop);
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    document.addEventListener('visibilitychange', onVis);
    function onVis() {
      if (document.hidden) {
        running = false;
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      } else {
        running = true;
        rafRef.current = requestAnimationFrame(loop);
      }
    }

    return () => {
      running = false;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      window.removeEventListener('scroll', onScroll);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, [speed]);

  return (
    <div ref={ref} className={className}>
      {children}
    </div>
  );
}

                <Reveal key={i} delay={200 + i * 100}>
                  <div className="freq-bar shimmer" data-cursor="hover">
                    <div className="f-note">{f.note}</div>
                    <div className="f-info">
                      <div className="f-name">{f.name}</div>
                      <div className="f-desc">{f.desc}</div>
                    </div>
                    <div className="f-hz">{f.hz}</div>
                  </div>
                </Reveal>
              ))}
            </div>
          </div>
        </div>
      </section>

      {/* 展演日程 */}
      <section className="schedule" id="schedule">
        <div className="section-inner">
          <div className="schedule-header">
            <div>
              <Reveal>
                <div className="section-label">04 · 展 演 日 程</div>
              </Reveal>
              <Reveal delay={100}>
                <h2 className="section-title">当季展演</h2>
              </Reveal>
            </div>
            <Reveal delay={200}>
              <div className="schedule-tabs">
                {[
                  { key: 'august', label: '八月' },
                  { key: 'september', label: '九月' },
                  { key: 'october', label: '十月' },
                ].map(tab => (
                  <button
                    key={tab.key}
                    className={'schedule-tab ' + (activeTab === tab.key ? 'active' : '')}
                    onClick={() => setActiveTab(tab.key)}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>
            </Reveal>
          </div>

          <Reveal delay={300}>
            <div className="schedule-list" key={activeTab}>
              {scheduleItems.map((item, i) => (
                <div
                  key={i}
                  className="schedule-item"
                  data-cursor="hover"
                  style={{ animation: `fadeUp .6s ${i * 0.08}s cubic-bezier(.2,.8,.2,1) both` }}
                >
                  <div className="s-date">
                    <span className="day">{item.day}</span>
                    <span className="month">{item.month}</span>
                  </div>
                  <div className="s-info">
                    <div className="s-title">{item.title}</div>
                    <div className="s-meta">
                      <span><i></i>{item.venue}</span>
                      <span><i></i>{item.time}</span>
                      <span><i></i>{item.note}</span>
                    </div>
                  </div>
                  <button className="s-btn">预约</button>
                </div>
              ))}
            </div>
          </Reveal>
        </div>
      </section>

      {/* 艺术家 */}
      <section className="artists" id="artists">
        <div className="section-inner">
          <Reveal>
            <div className="section-label">05 · 创 作 团 队</div>
          </Reveal>
          <Reveal delay={100}>
            <h2 className="section-title">三位创作者<br />六年盐田时光</h2>
          </Reveal>

          <div className="artists-grid">
            {artistsData.map((a, i) => (
              <Reveal key={i} delay={200 + i * 150}>
                <TiltCard intensity={8}>
                  <div className="artist-card shimmer">
                    <div className="artist-avatar">
                      <div className="artist-pulse"></div>
                      <div className="artist-pulse" style={{animationDelay:'1s'}}></div>
                      <div className="artist-initial">{a.initial}</div>
                    </div>
                    <div className="artist-name">{a.name}</div>
                    <div className="artist-role">{a.role}</div>
                    <p className="artist-bio">{a.bio}</p>
                  </div>
                </TiltCard>
              </Reveal>
            ))}
          </div>
        </div>
      </section>

      {/* 预约参观 */}
      <section className="booking" id="booking">
        <div className="section-inner booking-inner">
          <div className="booking-info">
            <Reveal>
              <div className="section-label">06 · 预 约 参 观</div>
            </Reveal>
            <Reveal delay={100}>
              <h3>走入盐田<br />听风从管阵穿过</h3>
            </Reveal>
            <Reveal delay={200}>
              <p>
                每日限流六十人，沿盐田步道逐一走过八个管阵，
                全程约九十分钟。建议穿便于行走的软底鞋，携带防风外套——海边的风比城市里诚实。
              </p>
            </Reveal>
            <Reveal delay={300}>
              <ul className="booking-details">
                <li>
                  <div className="b-ico">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
                      <path d="M12 22s-8-7.5-8-13a8 8 0 1116 0c0 5.5-8 13-8 13z" />
                      <circle cx="12" cy="9" r="3" />
                    </svg>
                  </div>
                  <div className="b-text">
                    <h4>盐田位置</h4>
                    <p>雷州半岛西海岸 · 角尾盐场四工区<br />距徐闻县城 38 公里，建议自驾</p>
                  </div>
                </li>
                <li>
                  <div className="b-ico">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
                      <circle cx="12" cy="12" r="9" />
                      <path d="M12 7v5l3 2" />
                    </svg>
                  </div>
                  <div className="b-text">
                    <h4>开放时段</h4>
                    <p>周三至周日 · 分上午 / 黄昏 / 夜间三场<br />周一、周二闭馆维护</p>
                  </div>
                </li>
                <li>
                  <div className="b-ico">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
                      <path d="M12 2L2 7l10 5 10-5-10-5z" />
                      <path d="M2 17l10 5 10-5" />
                      <path d="M2 12l10 5 10-5" />
                    </svg>
                  </div>
                  <div className="b-text">
                    <h4>参观须知</h4>
                    <p>全程静音模式 · 禁止使用扩音设备<br />盐晶路滑，请穿防滑鞋</p>
                  </div>
                </li>
              </ul>
            </Reveal>
          </div>

          <Reveal delay={200}>
            <TiltCard intensity={5}>
              <form className="booking-form" onSubmit={handleSubmit}>
                <div className="form-row">
                  <div className="form-group">
                    <label>姓 名</label>
                    <input
                      type="text" name="name" value={formData.name}
                      onChange={handleInput} placeholder="请输入您的姓名"
                      required
                    />
                  </div>
                  <div className="form-group">
                    <label>联 系 电 话</label>
                    <input
                      type="tel" name="phone" value={formData.phone}
                      onChange={handleInput} placeholder="手机号码"
                      required
                    />
                  </div>
                </div>
                <div className="form-row">
                  <div className="form-group">
                    <label>参 观 日 期</label>
                    <input
                      type="date" name="date" value={formData.date}
                      onChange={handleInput} required
                    />
                  </div>
                  <div className="form-group">
                    <label>人 数</label>
                    <select name="people" value={formData.people} onChange={handleInput}>
                      <option value="1">1 人</option>
                      <option value="2">2 人</option>
                      <option value="3">3 人</option>
                      <option value="4">4 人</option>
                      <option value="5">5 人及以上</option>
                    </select>
                  </div>
                </div>
                <div className="form-group">
                  <label>留 言（选 填）</label>
                  <textarea
                    name="note" value={formData.note}
                    onChange={handleInput}
                    placeholder="有任何想告诉我们的，比如想看的特定场次……"
                  />
                </div>
                <MagneticButton type="submit" strength={0.25}>
                  {submitted ? '✓ 已提交，我们会尽快与您联系' : '提 交 预 约'}
                </MagneticButton>
              </form>
            </TiltCard>
          </Reveal>
        </div>
      </section>

      {/* 页脚 */}
      <footer className="footer">
        <div className="footer-inner">
          <div className="footer-top">
            <div className="footer-brand">
              <h2>盐风琴 Salt Organ</h2>
              <p>
                一座位于雷州半岛西海岸的盐田风动声光装置。
                风穿过铜制音管，盐结晶在光里发声——
                自然以它自己的节奏，演奏它自己的音乐。
              </p>
            </div>
            <div className="footer-col">
              <h4>导 览</h4>
              <ul>
                <li>装置介绍</li>
                <li>盐田色阶</li>
                <li>声学原理</li>
                <li>展演日程</li>
              </ul>
            </div>
            <div className="footer-col">
              <h4>访 问</h4>
              <ul>
                <li>预约参观</li>
                <li>交通指南</li>
                <li>周边住宿</li>
                <li>常见问题</li>
              </ul>
            </div>
            <div className="footer-col">
              <h4>联 系</h4>
              <ul>
                <li>hello@saltorgan.art</li>
                <li>+86 759 4682 031</li>
                <li>媒体合作</li>
                <li>艺术驻留</li>
              </ul>
            </div>
          </div>
          <div className="footer-bottom">
            <span>© 2025 盐风琴 Salt Organ · 角尾盐场四工区</span>
            <span>粤ICP备 2025003182 号</span>
          </div>
        </div>
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// 宣告可升级
function announceUpgrade() {
  window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
}
announceUpgrade();
if (document.readyState !== 'complete') window.addEventListener('load', announceUpgrade, { once: true });
</script>
</body>
</html>

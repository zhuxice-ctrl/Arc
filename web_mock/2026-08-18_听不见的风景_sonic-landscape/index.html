<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="creative-medium" content="interactive-prototype">
  <title>听不见的风景 · 声音艺术展 2026</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@300;400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap">
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0D0B09;
      color: #F2EDE4;
      overflow-x: hidden;
      cursor: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body.no-cursor { cursor: auto; }
    body.no-cursor .custom-cursor { display: none; }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; cursor: none; }
    button { font-family: inherit; cursor: none; border: none; background: none; color: inherit; }

    /* ===== Design Tokens ===== */
    :root {
      --ink: #0D0B09;
      --ink-2: #1A1612;
      --ink-3: #2A241E;
      --ink-4: #3A3229;
      --cream: #F2EDE4;
      --cream-dim: #BFB5A6;
      --warm-gray: #7A7062;
      --cinnabar: #C9452B;
      --cinnabar-light: #E86A4A;
      --sage: #A8B85A;
      --sage-light: #C4D47A;
      --amber: #D4A84B;
      --amber-light: #E8C46E;
    }

    /* ===== Custom Cursor ===== */
    .custom-cursor {
      position: fixed;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 9999;
      mix-blend-mode: difference;
    }
    .cursor-ring {
      position: absolute;
      width: 36px;
      height: 36px;
      border: 2px solid #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.25s cubic-bezier(.25,.46,.45,.94),
                  height 0.25s cubic-bezier(.25,.46,.45,.94),
                  border-color 0.25s ease,
                  border-width 0.25s ease;
      box-shadow: 0 0 12px rgba(255,255,255,0.3),
                  0 0 24px rgba(201,69,43,0.2);
    }
    .cursor-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      background: var(--cinnabar);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px var(--cinnabar),
                  0 0 16px rgba(201,69,43,0.6);
      transition: background 0.2s ease, width 0.2s ease, height 0.2s ease;
    }
    .cursor-trail {
      position: absolute;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
    }
    .custom-cursor.hovering .cursor-ring {
      width: 56px;
      height: 56px;
      border-color: var(--cinnabar-light);
      border-width: 1.5px;
    }
    .custom-cursor.hovering .cursor-dot {
      width: 4px;
      height: 4px;
      background: #fff;
    }
    .custom-cursor.clicking .cursor-ring {
      width: 28px;
      height: 28px;
    }
    .custom-cursor.clicking .cursor-dot {
      width: 10px;
      height: 10px;
    }
    .cursor-ripple {
      position: absolute;
      width: 10px;
      height: 10px;
      border: 1.5px solid var(--cinnabar-light);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: cursorRipple 0.6s cubic-bezier(.25,.46,.45,.94) forwards;
    }
    @keyframes cursorRipple {
      0% { width: 10px; height: 10px; opacity: 0.8; }
      100% { width: 80px; height: 80px; opacity: 0; }
    }

    /* ===== Navigation ===== */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      padding: 24px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.4s ease, backdrop-filter 0.4s ease, padding 0.4s ease;
    }
    .nav.scrolled {
      background: rgba(13,11,9,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 16px 48px;
      border-bottom: 1px solid rgba(42,36,30,0.8);
    }
    .nav-logo {
      font-family: 'Noto Serif SC', serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.1em;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-logo-mark {
      width: 32px; height: 32px;
      position: relative;
    }
    .nav-logo-mark svg { width: 100%; height: 100%; }
    .nav-links {
      display: flex;
      gap: 40px;
      list-style: none;
    }
    .nav-links a {
      font-size: 14px;
      font-weight: 400;
      color: var(--cream-dim);
      position: relative;
      padding: 4px 0;
      transition: color 0.3s ease;
      letter-spacing: 0.05em;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 0;
      height: 1px;
      background: var(--cinnabar);
      transition: width 0.3s cubic-bezier(.25,.46,.45,.94);
    }
    .nav-links a:hover {
      color: var(--cream);
    }
    .nav-links a:hover::after {
      width: 100%;
    }
    .nav-ticket-btn {
      padding: 10px 24px;
      border: 1px solid var(--cream);
      font-size: 13px;
      letter-spacing: 0.1em;
      position: relative;
      overflow: hidden;
      transition: color 0.3s ease, border-color 0.3s ease;
      z-index: 1;
    }
    .nav-ticket-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: var(--cinnabar);
      transition: left 0.35s cubic-bezier(.25,.46,.45,.94);
      z-index: -1;
    }
    .nav-ticket-btn:hover {
      color: #fff;
      border-color: var(--cinnabar);
    }
    .nav-ticket-btn:hover::before {
      left: 0;
    }

    /* ===== Hero Section ===== */
    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 120px 48px 80px;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .hero-bg-gradient {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 30% 40%, rgba(201,69,43,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 60%, rgba(168,184,90,0.06) 0%, transparent 50%),
        linear-gradient(180deg, #0D0B09 0%, #12100D 50%, #0D0B09 100%);
    }
    .hero-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .hero-waveform {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 40%;
      pointer-events: none;
      opacity: 0.6;
    }
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 900px;
    }
    .hero-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.3em;
      color: var(--cinnabar);
      margin-bottom: 32px;
      text-transform: uppercase;
    }
    .hero-title {
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(48px, 8vw, 100px);
      font-weight: 300;
      line-height: 1.15;
      letter-spacing: 0.08em;
      margin-bottom: 32px;
      color: var(--cream);
    }
    .hero-title em {
      font-style: normal;
      color: var(--cinnabar);
      font-weight: 500;
    }
    .hero-subtitle {
      font-size: 18px;
      line-height: 1.8;
      color: var(--cream-dim);
      max-width: 560px;
      margin: 0 auto 48px;
      font-weight: 300;
    }
    .hero-meta {
      display: flex;
      justify-content: center;
      gap: 48px;
      margin-bottom: 56px;
      font-size: 13px;
      color: var(--warm-gray);
      flex-wrap: wrap;
    }
    .hero-meta-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .hero-meta-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--warm-gray);
    }
    .hero-meta-value {
      font-family: 'Noto Serif SC', serif;
      font-size: 15px;
      color: var(--cream);
      letter-spacing: 0.05em;
    }
    .hero-cta {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-primary {
      padding: 16px 40px;
      background: var(--cinnabar);
      color: #fff;
      font-size: 14px;
      letter-spacing: 0.15em;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(201,69,43,0.3);
    }
    .btn-primary:active {
      transform: translateY(0);
    }
    .btn-secondary {
      padding: 16px 40px;
      border: 1px solid var(--ink-4);
      color: var(--cream);
      font-size: 14px;
      letter-spacing: 0.15em;
      transition: border-color 0.3s ease, color 0.3s ease;
    }
    .btn-secondary:hover {
      border-color: var(--cream);
      color: #fff;
    }
    .btn-gloss {
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: linear-gradient(
        120deg,
        transparent 0%,
        rgba(255,255,255,0.3) 50%,
        transparent 100%
      );
      transform: skewX(-20deg);
      pointer-events: none;
    }
    .btn-primary:hover .btn-gloss {
      animation: glossSweep 0.6s ease-out forwards;
    }
    @keyframes glossSweep {
      0% { left: -75%; }
      100% { left: 125%; }
    }
    .hero-scroll-indicator {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--warm-gray);
      font-size: 11px;
      letter-spacing: 0.2em;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
    }
    .scroll-line {
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, var(--warm-gray), transparent);
      position: relative;
      overflow: hidden;
    }
    .scroll-line::after {
      content: '';
      position: absolute;
      top: -16px;
      left: 0;
      width: 100%;
      height: 16px;
      background: var(--cinnabar);
      animation: scrollDot 2s ease-in-out infinite;
    }
    @keyframes scrollDot {
      0% { top: -16px; }
      100% { top: 100%; }
    }

    /* ===== Section Base ===== */
    .section {
      padding: 120px 48px;
      position: relative;
    }
    .section-inner {
      max-width: 1280px;
      margin: 0 auto;
    }
    .section-header {
      margin-bottom: 80px;
    }
    .section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.3em;
      color: var(--cinnabar);
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .section-title {
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(32px, 4vw, 48px);
      font-weight: 400;
      line-height: 1.3;
      color: var(--cream);
      letter-spacing: 0.05em;
    }
    .section-desc {
      font-size: 16px;
      line-height: 1.8;
      color: var(--cream-dim);
      max-width: 560px;
      margin-top: 20px;
      font-weight: 300;
    }

    /* ===== About Section ===== */
    .about {
      background: var(--ink);
      position: relative;
    }
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: center;
    }
    .about-visual {
      position: relative;
      aspect-ratio: 4/5;
      overflow: hidden;
    }
    .cymatics-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #1A1612 0%, #0D0B09 70%);
    }
    .cymatics-pattern {
      width: 80%;
      height: 80%;
      position: relative;
    }
    .cymatics-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      border: 1px solid var(--cinnabar);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.6;
    }
    .about-text p {
      font-size: 16px;
      line-height: 2;
      color: var(--cream-dim);
      margin-bottom: 24px;
      font-weight: 300;
    }
    .about-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
      margin-top: 48px;
      padding-top: 48px;
      border-top: 1px solid var(--ink-3);
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .stat-number {
      font-family: 'Noto Serif SC', serif;
      font-size: 40px;
      font-weight: 500;
      color: var(--cinnabar);
      line-height: 1;
    }
    .stat-number sup {
      font-size: 18px;
      color: var(--amber);
      margin-left: 2px;
    }
    .stat-label {
      font-size: 12px;
      color: var(--warm-gray);
      letter-spacing: 0.1em;
    }

    /* ===== Artists Section ===== */
    .artists {
      background: var(--ink-2);
    }
    .artists-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }
    .artist-card {
      position: relative;
      padding: 32px 24px;
      background: var(--ink);
      border: 1px solid var(--ink-3);
      transition: border-color 0.3s ease, transform 0.3s ease;
      transform-style: preserve-3d;
      perspective: 1000px;
      will-change: transform;
    }
    .artist-card:hover {
      border-color: var(--cinnabar);
    }
    .artist-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--ink-3);
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Serif SC', serif;
      font-size: 24px;
      font-weight: 500;
      color: var(--cream);
    }
    .artist-avatar::before {
      content: '';
      position: absolute;
      inset: -2px;
      border: 2px solid var(--cinnabar);
      border-radius: 50%;
      opacity: 0;
      animation: none;
    }
    .artist-card:hover .artist-avatar::before {
      animation: avatarPulse 1.5s ease-out infinite;
    }
    @keyframes avatarPulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    .artist-name {
      font-family: 'Noto Serif SC', serif;
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--cream);
    }
    .artist-origin {
      font-size: 12px;
      color: var(--warm-gray);
      margin-bottom: 16px;
      letter-spacing: 0.1em;
    }
    .artist-work {
      font-size: 13px;
      line-height: 1.7;
      color: var(--cream-dim);
      font-weight: 300;
    }
    .artist-num {
      position: absolute;
      top: 20px;
      right: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--ink-4);
      letter-spacing: 0.1em;
    }

    /* ===== Exhibits Section ===== */
    .exhibits {
      background: var(--ink);
    }
    .exhibits-filter {
      display: flex;
      gap: 12px;
      margin-bottom: 48px;
      flex-wrap: wrap;
    }
    .filter-chip {
      padding: 8px 20px;
      border: 1px solid var(--ink-4);
      font-size: 13px;
      color: var(--cream-dim);
      transition: all 0.3s ease;
      letter-spacing: 0.05em;
    }
    .filter-chip:hover {
      border-color: var(--cream-dim);
      color: var(--cream);
    }
    .filter-chip.active {
      background: var(--cinnabar);
      border-color: var(--cinnabar);
      color: #fff;
    }
    .exhibits-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    .exhibit-card {
      position: relative;
      background: var(--ink-2);
      border: 1px solid var(--ink-3);
      overflow: hidden;
      transition: border-color 0.3s ease;
    }
    .exhibit-card:hover {
      border-color: var(--sage);
    }
    .exhibit-visual {
      height: 200px;
      position: relative;
      overflow: hidden;
      background: var(--ink-3);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .spectrum-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 120px;
      padding: 0 20px;
      width: 100%;
      justify-content: center;
    }
    .spectrum-bar {
      width: 6px;
      background: linear-gradient(to top, var(--cinnabar), var(--amber));
      border-radius: 3px;
      transition: height 0.1s ease;
    }
    .exhibit-info {
      padding: 24px;
    }
    .exhibit-category {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--sage);
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .exhibit-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 12px;
      color: var(--cream);
    }
    .exhibit-desc {
      font-size: 13px;
      line-height: 1.7;
      color: var(--cream-dim);
      font-weight: 300;
    }
    .exhibit-artist {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--ink-3);
      font-size: 12px;
      color: var(--warm-gray);
      display: flex;
      justify-content: space-between;
    }

    /* ===== Experience / Schedule Section ===== */
    .experience {
      background: var(--ink-2);
    }
    .timeline {
      position: relative;
      padding-left: 40px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 10px;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--ink-4);
    }
    .timeline-item {
      position: relative;
      padding: 24px 0;
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 48px;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -34px;
      top: 32px;
      width: 10px;
      height: 10px;
      background: var(--ink-2);
      border: 2px solid var(--cinnabar);
      border-radius: 50%;
      transition: all 0.3s ease;
    }
    .timeline-item:hover::before {
      background: var(--cinnabar);
      box-shadow: 0 0 12px rgba(201,69,43,0.6);
    }
    .timeline-date {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--amber);
      letter-spacing: 0.1em;
    }
    .timeline-time {
      font-size: 12px;
      color: var(--warm-gray);
      margin-top: 4px;
    }
    .timeline-content h4 {
      font-family: 'Noto Serif SC', serif;
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--cream);
    }
    .timeline-content p {
      font-size: 14px;
      line-height: 1.7;
      color: var(--cream-dim);
      font-weight: 300;
    }
    .timeline-venue {
      margin-top: 8px;
      font-size: 12px;
      color: var(--sage);
      letter-spacing: 0.05em;
    }

    /* ===== Tickets Section ===== */
    .tickets {
      background: var(--ink);
      position: relative;
      overflow: hidden;
    }
    .tickets-bg {
      position: absolute;
      inset: 0;
      opacity: 0.3;
      pointer-events: none;
    }
    .tickets-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      position: relative;
      z-index: 1;
    }
    .ticket-card {
      position: relative;
      background: var(--ink-2);
      border: 1px solid var(--ink-3);
      padding: 40px 32px;
      transition: border-color 0.3s ease, transform 0.3s ease;
      overflow: hidden;
    }
    .ticket-card:hover {
      transform: translateY(-4px);
      border-color: var(--cinnabar);
    }
    .ticket-card.featured {
      border-color: var(--cinnabar);
      background: linear-gradient(180deg, rgba(201,69,43,0.08) 0%, var(--ink-2) 60%);
    }
    .ticket-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 4px 12px;
      background: var(--cinnabar);
      color: #fff;
      font-size: 10px;

    /* ===== Scroll Reveal ===== */
    .reveal {

      transform: translateY(0);

    .reveal-delay-1 { transition-delay: 0.1s; }

    /* ===== Ripple Effect for Buttons ===== */

      overflow: hidden;

    }
    @keyframes typewriterBlink {

      50% { opacity: 0; }
    }

    /* ===== Responsive ===== */
    @media (max-width: 1024px) {
      .artists-grid { grid-template-columns: repeat(2, 1fr); }
      .exhibits-grid { grid-template-columns: repeat(2, 1fr); }
      .tickets-grid { grid-template-columns: 1fr; max-width: 420px; margin: 0 auto; }
      .about-grid { grid-template-columns: 1fr; gap: 48px; }
      .footer-top { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 768px) {
      .section { padding: 80px 24px; }
      .nav { padding: 16px 24px; }
      .nav-links { display: none; }
      .hero { padding: 100px 24px 60px; }
      .hero-meta { gap: 24px; }
      .artists-grid { grid-template-columns: 1fr; }

      .stat-number { font-size: 28px; }
      body { cursor: auto; }
      .custom-cursor { display: none; }
      a, button { cursor: pointer; }
    }

    /* ===== Reduced motion ===== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .reveal {
        opacity: 1;
        transform: none;
      }
      .hero-waveform,
      .hero-particles,
      .cymatics-ring {
        animation: none !important;
      }
      .spectrum-bar {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ==========================================
    // Utility: RAF manager with visibility pause
    // ==========================================
    function createRAFLoop(callback) {
      let rafId = null;
      let isRunning = false;
      let lastTime = 0;

      function loop(timestamp) {
        if (!isRunning) return;
        const dt = timestamp - lastTime;
        lastTime = timestamp;
        callback(dt, timestamp);
        rafId = requestAnimationFrame(loop);
      }

      function start() {
        if (isRunning) return;
        isRunning = true;
        lastTime = performance.now();
        rafId = requestAnimationFrame(loop);
      }

      function stop() {
        isRunning = false;
        if (rafId !== null) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
      }

      function handleVisibility() {
        if (document.hidden) {
          stop();
        } else {
          start();
        }
      }

      document.addEventListener('visibilitychange', handleVisibility);

      return {
        start,
        stop,
        destroy: () => {
          stop();
          document.removeEventListener('visibilitychange', handleVisibility);
        }
      };
    }

    // Check reduced motion
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ==========================================
    // Custom Cursor Component
    // ==========================================
    function CustomCursor() {
      const cursorRef = useRef(null);
      const ringRef = useRef(null);
      const dotRef = useRef(null);
      const trailRef = useRef(null);
      const rafLoopRef = useRef(null);

      // State refs for physics (no React state in mousemove)
      const stateRef = useRef({
        targetX: window.innerWidth / 2,
        targetY: window.innerHeight / 2,
        ringX: window.innerWidth / 2,
        ringY: window.innerHeight / 2,
        dotX: window.innerWidth / 2,
        dotY: window.innerHeight / 2,
        trailX: window.innerWidth / 2,
        trailY: window.innerHeight / 2,
        isHovering: false,
        isClicking: false
      });

      useEffect(() => {
        if (prefersReducedMotion) return;

        const state = stateRef.current;
        const cursor = cursorRef.current;
        const ring = ringRef.current;
        const dot = dotRef.current;
        const trail = trailRef.current;

        // Spring physics constants
        const ringSpring = 0.12;
        const dotSpring = 0.25;
        const trailSpring = 0.06;
        const damping = 0.85;

        let ringVelX = 0, ringVelY = 0;
        let dotVelX = 0, dotVelY = 0;
        let trailVelX = 0, trailVelY = 0;

        // Mouse handlers
        const handleMouseMove = (e) => {
          state.targetX = e.clientX;
          state.targetY = e.clientY;
        };

        const handleMouseOver = (e) => {
          const target = e.target;
          if (target.closest('a, button, [data-hoverable], input, textarea, select')) {
            state.isHovering = true;
            cursor.classList.add('hovering');
          }
        };

        const handleMouseOut = (e) => {
          const target = e.target;
          if (target.closest('a, button, [data-hoverable], input, textarea, select')) {
            state.isHovering = false;
            cursor.classList.remove('hovering');
          }
        };

        const handleMouseDown = () => {
          state.isClicking = true;
          cursor.classList.add('clicking');
        };

        const handleMouseUp = () => {
          state.isClicking = false;
          cursor.classList.remove('clicking');
        };

        const handleClick = (e) => {
          const ripple = document.createElement('div');
          ripple.className = 'cursor-ripple';
          ripple.style.left = e.clientX + 'px';
          ripple.style.top = e.clientY + 'px';
          cursor.appendChild(ripple);
          setTimeout(() => ripple.remove(), 600);
        };

        // Physics loop
        const loop = createRAFLoop((dt) => {
          const targetX = state.targetX;
          const targetY = state.targetY;

          // Ring — slower, springy
          ringVelX += (targetX - state.ringX) * ringSpring;
          ringVelY += (targetY - state.ringY) * ringSpring;
          ringVelX *= damping;
          ringVelY *= damping;
          state.ringX += ringVelX;
          state.ringY += ringVelY;

          // Dot — faster, tighter follow
          dotVelX += (targetX - state.dotX) * dotSpring;
          dotVelY += (targetY - state.dotY) * dotSpring;
          dotVelX *= damping;
          dotVelY *= damping;
          state.dotX += dotVelX;
          state.dotY += dotVelY;

          // Trail — slowest, inertial
          trailVelX += (targetX - state.trailX) * trailSpring;
          trailVelY += (targetY - state.trailY) * trailSpring;
          trailVelX *= damping;
          trailVelY *= damping;
          state.trailX += trailVelX;
          state.trailY += trailVelY;

          // Direct DOM transforms
          ring.style.transform = `translate(${state.ringX}px, ${state.ringY}px) translate(-50%, -50%)`;
          dot.style.transform = `translate(${state.dotX}px, ${state.dotY}px) translate(-50%, -50%)`;
          trail.style.transform = `translate(${state.trailX}px, ${state.trailY}px) translate(-50%, -50%)`;
          trail.style.opacity = 0.3;
        });

        window.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseover', handleMouseOver);
        document.addEventListener('mouseout', handleMouseOut);
        window.addEventListener('mousedown', handleMouseDown);
        window.addEventListener('mouseup', handleMouseUp);
        window.addEventListener('click', handleClick);

        rafLoopRef.current = loop;
        loop.start();

        // Initialize position immediately to center
        state.ringX = window.innerWidth / 2;
        state.ringY = window.innerHeight / 2;
        state.dotX = window.innerWidth / 2;
        state.dotY = window.innerHeight / 2;
        state.trailX = window.innerWidth / 2;
        state.trailY = window.innerHeight / 2;

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseover', handleMouseOver);
          document.removeEventListener('mouseout', handleMouseOut);
          window.removeEventListener('mousedown', handleMouseDown);
          window.removeEventListener('mouseup', handleMouseUp);
          window.removeEventListener('click', handleClick);
          if (rafLoopRef.current) rafLoopRef.current.destroy();
        };
      }, []);

      if (prefersReducedMotion) return null;

      return (
        <div className="custom-cursor" ref={cursorRef}>
          <div className="cursor-trail" ref={trailRef}></div>
          <div className="cursor-ring" ref={ringRef}></div>
          <div className="cursor-dot" ref={dotRef}></div>
        </div>
      );
    }

    // ==========================================
    // Navigation
    // ==========================================
    function Navigation() {
      const [scrolled, setScrolled] = useState(false);
      const navRef = useRef(null);

      useEffect(() => {
        const handleScroll = () => {
          setScrolled(window.scrollY > 50);
        };
        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const scrollTo = (id) => (e) => {
        e.preventDefault();
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };

      return (
        <nav className={`nav ${scrolled ? 'scrolled' : ''}`} ref={navRef}>
          <a href="#" className="nav-logo" onClick={(e) => { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); }}>
            <span className="nav-logo-mark">
              <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M16 4C16 4 8 10 8 18C8 22.4183 11.5817 26 16 26C20.4183 26 24 22.4183 24 18C24 10 16 4 16 4Z" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
                <circle cx="16" cy="18" r="2" fill="#C9452B"/>
                <path d="M4 20V26" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
                <path d="M28 20V26" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
              </svg>
            </span>
            听不见的风景
          </a>
          <ul className="nav-links">
            <li><a href="#about" onClick={scrollTo('about')}>展览前言</a></li>
            <li><a href="#artists" onClick={scrollTo('artists')}>参展艺术家</a></li>
            <li><a href="#exhibits" onClick={scrollTo('exhibits')}>作品展区</a></li>
            <li><a href="#experience" onClick={scrollTo('experience')}>现场活动</a></li>
            <li><a href="#tickets" onClick={scrollTo('tickets')}>票务</a></li>
          </ul>
          <button className="nav-ticket-btn" onClick={scrollTo('tickets')}>
            立即购票
          </button>
        </nav>
      );
    }

    // ==========================================
    // Hero Particles
    // ==========================================
    function HeroParticles() {
      const canvasRef = useRef(null);
      const rafLoopRef = useRef(null);

      useEffect(() => {
        if (prefersReducedMotion) return;

        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let particles = [];
        let width, height;

        const resize = () => {
          width = canvas.width = canvas.offsetWidth * window.devicePixelRatio;
          height = canvas.height = canvas.offsetHeight * window.devicePixelRatio;
          ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        };

        const initParticles = () => {
          particles = [];
          const count = Math.min(60, Math.floor(window.innerWidth / 20));
          for (let i = 0; i < count; i++) {
            particles.push({
              x: Math.random() * canvas.offsetWidth,
              y: Math.random() * canvas.offsetHeight,
              vx: (Math.random() - 0.5) * 0.3,
              vy: -0.2 - Math.random() * 0.5,
              size: 1 + Math.random() * 2,
              opacity: 0.2 + Math.random() * 0.5,
              hue: Math.random() > 0.5 ? '#C9452B' : '#A8B85A',
              phase: Math.random() * Math.PI * 2,
              freq: 0.002 + Math.random() * 0.003
            });
          }
        };

        const loop = createRAFLoop((dt, time) => {
          ctx.clearRect(0, 0, canvas.offsetWidth, canvas.offsetHeight);

          particles.forEach((p) => {
            // Inertial movement
            p.x += p.vx + Math.sin(time * p.freq + p.phase) * 0.3;
            p.y += p.vy;

            // Wrap around
            if (p.y < -10) {
              p.y = canvas.offsetHeight + 10;
              p.x = Math.random() * canvas.offsetWidth;
            }
            if (p.x < -10) p.x = canvas.offsetWidth + 10;
            if (p.x > canvas.offsetWidth + 10) p.x = -10;

            // Draw particle with glow
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = p.hue;
            ctx.globalAlpha = p.opacity;
            ctx.fill();

            // Glow
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2);
            const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 3);
            gradient.addColorStop(0, p.hue + '40');
            gradient.addColorStop(1, 'transparent');
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.globalAlpha = 1;
          });

          // Connect nearby particles with lines
          for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
              const dx = particles[i].x - particles[j].x;
              const dy = particles[i].y - particles[j].y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < 80) {
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.strokeStyle = `rgba(201,69,43,${0.1 * (1 - dist / 80)})`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
              }
            }
          }
        });

        resize();
        initParticles();
        rafLoopRef.current = loop;
        loop.start();

        window.addEventListener('resize', resize);

        return () => {
          window.removeEventListener('resize', resize);
          if (rafLoopRef.current) rafLoopRef.current.destroy();
        };
      }, []);

      return <canvas className="hero-particles" ref={canvasRef} />;
    }

    // ==========================================
    // Hero Waveform (interactive, follows mouse)
    // ==========================================
    function HeroWaveform() {
      const canvasRef = useRef(null);
      const rafLoopRef = useRef(null);
      const mouseRef = useRef({ x: 0.5, y: 0.5 });

      useEffect(() => {
        if (prefersReducedMotion) return;

        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let width, height;

        const resize = () => {
          width = canvas.width = canvas.offsetWidth * window.devicePixelRatio;
          height = canvas.height = canvas.offsetHeight * window.devicePixelRatio;
          ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        };

        const handleMouseMove = (e) => {
          mouseRef.current.x = e.clientX / window.innerWidth;
          mouseRef.current.y = e.clientY / window.innerHeight;
        };

        // Wave physics
        const numWaves = 3;
        const waves = [];
        for (let i = 0; i < numWaves; i++) {
          waves.push({
            amplitude: 30 + i * 15,
            frequency: 0.01 + i * 0.003,
            speed: 0.002 + i * 0.001,
            phase: Math.random() * Math.PI * 2,
            color: i === 0 ? 'rgba(201,69,43,0.6)' : i === 1 ? 'rgba(168,184,90,0.4)' : 'rgba(212,168,75,0.3)'
          });
        }

        const loop = createRAFLoop((dt, time) => {
          ctx.clearRect(0, 0, canvas.offsetWidth, canvas.offsetHeight);

          const w = canvas.offsetWidth;
          const h = canvas.offsetHeight;
          const centerY = h * 0.6;

          // Mouse influence (magnetic-like inverse distance)
          const mouseX = mouseRef.current.x * w;
          const mouseInfluenceStrength = 0.4;

          waves.forEach((wave, waveIdx) => {
            ctx.beginPath();
            ctx.moveTo(0, centerY);

            for (let x = 0; x <= w; x += 2) {
              // Base sine wave with multiple harmonics
              let y = centerY;
              y += Math.sin(x * wave.frequency + time * wave.speed + wave.phase) * wave.amplitude;
              y += Math.sin(x * wave.frequency * 2.3 + time * wave.speed * 1.7 + wave.phase) * wave.amplitude * 0.3;
              y += Math.sin(x * wave.frequency * 0.7 + time * wave.speed * 0.5 + wave.phase) * wave.amplitude * 0.5;

              // Mouse influence — push wave away from mouse (inverse square)
              const dx = x - mouseX;
              const distSq = dx * dx + 1;
              const influence = (mouseInfluenceStrength * 20000) / distSq;
              const direction = dx > 0 ? 1 : -1;
              y += Math.sin(time * 0.003 + x * 0.01) * influence * 0.5;

              ctx.lineTo(x, y);
            }

            ctx.strokeStyle = wave.color;
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Fill below wave
            ctx.lineTo(w, h);
            ctx.lineTo(0, h);
            ctx.closePath();
            const gradient = ctx.createLinearGradient(0, centerY - 80, 0, h);
            const baseColor = waveIdx === 0 ? '201,69,43' : waveIdx === 1 ? '168,184,90' : '212,168,75';
            gradient.addColorStop(0, `rgba(${baseColor},0.15)`);
            gradient.addColorStop(1, `rgba(${baseColor},0)`);
            ctx.fillStyle = gradient;
            ctx.fill();
          });
        });

        resize();
        rafLoopRef.current = loop;
        loop.start();

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', handleMouseMove);

        return () => {
          window.removeEventListener('resize', resize);
          window.removeEventListener('mousemove', handleMouseMove);
          if (rafLoopRef.current) rafLoopRef.current.destroy();
        };
      }, []);

      return <canvas className="hero-waveform" ref={canvasRef} />;
    }

    // ==========================================
    // Typewriter Effect
    // ==========================================
    function TypewriterText({ text, delay = 0, speed = 80 }) {
      const [displayed, setDisplayed] = useState('');
      const [done, setDone] = useState(false);

      useEffect(() => {
        if (prefersReducedMotion) {
          setDisplayed(text);
          setDone(true);
          return;
        }

        let charIndex = 0;
        let timeoutId = null;
        let startTimeoutId = null;

        startTimeoutId = setTimeout(() => {
          function type() {
            if (charIndex < text.length) {
              setDisplayed(text.slice(0, charIndex + 1));
              charIndex++;
              // Variable speed for more natural feel
              const charDelay = speed + (Math.random() - 0.5) * 40;
              timeoutId = setTimeout(type, charDelay);
            } else {
              setDone(true);
            }
          }
          type();
        }, delay);

        return () => {
          if (timeoutId) clearTimeout(timeoutId);
          if (startTimeoutId) clearTimeout(startTimeoutId);
        };
      }, [text, delay, speed]);

      return (
        <span>
          {displayed}
          {!done && <span className="typewriter-cursor"></span>}
        </span>
      );
    }

    // ==========================================
    // Counter Animation
    // ==========================================
    function AnimatedCounter({ target, suffix = '', duration = 2000, decimals = 0 }) {
      const [value, setValue] = useState(0);
      const ref = useRef(null);
      const startedRef = useRef(false);

      useEffect(() => {
        if (prefersReducedMotion) {
          setValue(target);
          return;
        }

        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting && !startedRef.current) {
              startedRef.current = true;
              animateValue(0, target, duration);
            }
          });
        }, { threshold: 0.3 });

        if (ref.current) observer.observe(ref.current);

        let rafId = null;
        function animateValue(start, end, dur) {
          const startTime = performance.now();
          function step(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / dur, 1);
            // Ease out cubic
            const eased = 1 - Math.pow(1 - progress, 3);
            const current = start + (end - start) * eased;
            setValue(Number(current.toFixed(decimals)));
            if (progress < 1) {
              rafId = requestAnimationFrame(step);
            }
          }
          rafId = requestAnimationFrame(step);
        }

        return () => {
          observer.disconnect();
          if (rafId) cancelAnimationFrame(rafId);
        };
      }, [target, duration, decimals]);

      return <span ref={ref}>{value}{suffix}</span>;
    }

    // ==========================================
    // Button with ripple effect
    // ==========================================
    function RippleButton({ className = '', children, onClick, ...props }) {
      const handleClick = (e) => {
        const btn = e.currentTarget;
        const rect = btn.getBoundingClientRect();
        const ripple = document.createElement('span');
        const size = Math.max(rect.width, rect.height);
        const x = e.clientX - rect.left - size / 2;
        const y = e.clientY - rect.top - size / 2;

        ripple.className = 'ripple-effect';
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';

        btn.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);

        if (onClick) onClick(e);
      };

      return (
        <button className={`ripple-container ${className}`} onClick={handleClick} {...props}>
          {children}
          <span className="btn-gloss"></span>
        </button>
      );
    }

    // ==========================================
    // Cymatics Pattern (physics-based sound visualization)
    // ==========================================
    function CymaticsPattern() {
      const containerRef = useRef(null);
      const rafLoopRef = useRef(null);

      useEffect(() => {
        if (prefersReducedMotion) return;

        const container = containerRef.current;
        const rings = container.querySelectorAll('.cymatics-ring');
        const mouseRef = { x: 0.5, y: 0.5 };

        const handleMouseMove = (e) => {
          const rect = container.getBoundingClientRect();
          mouseRef.x = (e.clientX - rect.left) / rect.width;
          mouseRef.y = (e.clientY - rect.top) / rect.height;
        };

        const loop = createRAFLoop((dt, time) => {
          rings.forEach((ring, i) => {
            // Each ring has its own frequency and phase
            const freq = 0.001 + i * 0.0005;
            const phase = i * 0.7;
            const baseSize = 30 + i * 28;
            const amplitude = 8 + i * 3;

            // Oscillating size based on sine wave (simulates vibration)
            const sizePulse = Math.sin(time * freq + phase) * amplitude;
            const size = baseSize + sizePulse;

            // Mouse influence — warp position slightly (magnetic pull)
            const centerX = 50;
            const centerY = 50;
            const mouseWarpX = (mouseRef.x - 0.5) * (5 - i) * 2;
            const mouseWarpY = (mouseRef.y - 0.5) * (5 - i) * 2;

            ring.style.width = size + '%';
            ring.style.height = size + '%';
            ring.style.left = `calc(${centerX + mouseWarpX}%)`;
            ring.style.top = `calc(${centerY + mouseWarpY}%)`;

            // Rotate slowly
            ring.style.transform = `translate(-50%, -50%) rotate(${time * 0.01 + i * 15}deg)`;

            // Opacity pulse
            const opac = 0.3 + Math.sin(time * freq * 1.5 + phase) * 0.3;
            ring.style.opacity = opac;

            // Alternating colors
            const colors = ['#C9452B', '#A8B85A', '#D4A84B', '#C9452B', '#A8B85A'];
            ring.style.borderColor = colors[i % colors.length];
          });
        });

        container.addEventListener('mousemove', handleMouseMove);
        rafLoopRef.current = loop;
        loop.start();

        return () => {
          container.removeEventListener('mousemove', handleMouseMove);
          if (rafLoopRef.current) rafLoopRef.current.destroy();
        };
      }, []);

      return (
        <div className="cymatics-container" ref={containerRef}>
          <div className="cymatics-pattern">
            {[0, 1, 2, 3, 4, 5].map((i) => (
              <div key={i} className="cymatics-ring" style={{
                width: `${30 + i * 28}%`,
                height: `${30 + i * 28}%`,
                left: '50%',
                top: '50%'
              }}></div>
            ))}
          </div>
        </div>
      );
    }

    // ==========================================
    // Artist Card with 3D tilt
    // ==========================================
    function ArtistCard({ artist, index }) {
      const cardRef = useRef(null);

      useEffect(() => {
        if (prefersReducedMotion) return;
        const card = cardRef.current;
        if (!card) return;

        let rafId = null;
        let targetRotX = 0, targetRotY = 0;
        let currentRotX = 0, currentRotY = 0;
        const spring = 0.1;
        const damping = 0.85;
        let velX = 0, velY = 0;

        const handleMouseMove = (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;

          targetRotY = ((x - centerX) / centerX) * 8;
          targetRotX = -((y - centerY) / centerY) * 8;
        };

        const handleMouseLeave = () => {
          targetRotX = 0;
          targetRotY = 0;
        };

        function animate() {
          velX += (targetRotX - currentRotX) * spring;
          velY += (targetRotY - currentRotY) * spring;
          velX *= damping;
          velY *= damping;
          currentRotX += velX;
          currentRotY += velY;

          card.style.transform = `perspective(1000px) rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;

          rafId = requestAnimationFrame(animate);
        }

        card.addEventListener('mousemove', handleMouseMove);
        card.addEventListener('mouseleave', handleMouseLeave);
        rafId = requestAnimationFrame(animate);

        return () => {
          card.removeEventListener('mousemove', handleMouseMove);
          card.removeEventListener('mouseleave', handleMouseLeave);
          if (rafId) cancelAnimationFrame(rafId);
        };
      }, []);

      return (
        <div className="artist-card" ref={cardRef}>
          <span className="artist-num">0{index + 1}</span>
          <div className="artist-avatar" style={{
            background: `linear-gradient(135deg, ${artist.gradient[0]}, ${artist.gradient[1]})`
          }}>
            {artist.name.charAt(0)}
          </div>
          <h3 className="artist-name">{artist.name}</h3>
          <div className="artist-origin">{artist.origin}</div>
          <p className="artist-work">{artist.work}</p>
        </div>
      );
    }

    // ==========================================
    // Spectrum Bars (physics-based sound visualization)
    // ==========================================
    function SpectrumBars({ seed = 0 }) {
      const barsRef = useRef(null);
      const rafLoopRef = useRef(null);

      useEffect(() => {
        if (prefersReducedMotion) return;
        const container = barsRef.current;
        if (!container) return;
        const bars = container.querySelectorAll('.spectrum-bar');
        const numBars = bars.length;

        // Each bar has its own spring physics
        const barData = [];
        for (let i = 0; i < numBars; i++) {
          barData.push({
            target: 20 + Math.random() * 30,
            current: 20,
            velocity: 0,
            spring: 0.05 + Math.random() * 0.05,
            damping: 0.75 + Math.random() * 0.1,
            freq: 0.002 + Math.random() * 0.003,
            phase: Math.random() * Math.PI * 2 + seed,
            amplitude: 30 + Math.random() * 50
          });
        }

        const loop = createRAFLoop((dt, time) => {
          barData.forEach((bar, i) => {
            // Target oscillates like an audio spectrum
            const wave1 = Math.sin(time * bar.freq + bar.phase) * 0.5 + 0.5;
            const wave2 = Math.sin(time * bar.freq * 2.7 + bar.phase * 1.3) * 0.3 + 0.3;
            const wave3 = Math.sin(time * bar.freq * 0.6 + bar.phase * 0.7) * 0.2 + 0.2;
            bar.target = 10 + (wave1 * 0.5 + wave2 * 0.3 + wave3 * 0.2) * bar.amplitude;

            // Spring physics
            bar.velocity += (bar.target - bar.current) * bar.spring;
            bar.velocity *= bar.damping;
            bar.current += bar.velocity;

            bars[i].style.height = bar.current + 'px';
          });
        });

        rafLoopRef.current = loop;
        loop.start();

        return () => {
          if (rafLoopRef.current) rafLoopRef.current.destroy();
        };
      }, [seed]);

      const barCount = 24;
      return (
        <div className="spectrum-bars" ref={barsRef}>
          {Array.from({ length: barCount }).map((_, i) => (
            <div key={i} className="spectrum-bar" style={{ height: '20px' }}></div>
          ))}
        </div>
      );
    }

    // ==========================================
    // Scroll Reveal Hook
    // ==========================================
    function useScrollReveal() {
      useEffect(() => {
        const elements = document.querySelectorAll('.reveal');
        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

        elements.forEach((el) => observer.observe(el));
        return () => observer.disconnect();
      }, []);
    }

    // ==========================================
    // Parallax on Scroll
    // ==========================================
    function useParallax() {
      useEffect(() => {
        if (prefersReducedMotion) return;

        const elements = document.querySelectorAll('.parallax-element');
        let ticking = false;

        const handleScroll = () => {
          if (!ticking) {
            requestAnimationFrame(() => {
              const scrollY = window.scrollY;
              elements.forEach((el) => {
                const speed = parseFloat(el.dataset.speed || '0.2');
                el.style.transform = `translateY(${scrollY * speed}px)`;
              });
              ticking = false;
            });
            ticking = true;
          }
        };

        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);
    }

    // ==========================================
    // Main App
    // ==========================================
    function App() {
      useScrollReveal();
      useParallax();

      // Announce upgrade availability
      useEffect(() => {
        function announceUpgrade() {
          try {
            window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
          } catch (e) {}
        }
        announceUpgrade();
        if (document.readyState !== 'complete') {
          window.addEventListener('load', announceUpgrade, { once: true });
        }
      }, []);

      return (

          <Navigation />
          <main>

            <About />
            <Artists />
            <Exhibits />
            <Experience />
            <Tickets />
          </main>
          <Footer />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>长夜书店 · 24 小时不打烊</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" />
  <style>
    /* ====== CSS Variables ====== */
    :root {
      --ink-900: #060E1C;
      --ink-800: #0A1628;
      --ink-700: #122240;
      --ink-600: #1A2E52;
      --ink-500: #243B5C;
      --ink-400: #3B5278;
      --ink-300: #5A7399;
      --ink-200: #8BA0BE;
      --ink-100: #BFCBDD;

      --gold-600: #B8892E;
      --gold-500: #D4A84B;
      --gold-400: #E8C26A;
      --gold-300: #F0D68A;
      --gold-200: #F6E5AE;

      --paper-100: #F9F4E8;
      --paper-200: #F5EFE0;
      --paper-300: #EDE4CD;
      --paper-400: #DDD0AE;

      --font-serif: "Noto Serif SC", "Songti SC", serif;
      --font-sans: "Noto Sans SC", -apple-system, sans-serif;

      --lamp-glow: radial-gradient(circle at 50% 0%, rgba(232, 194, 106, 0.35) 0%, rgba(212, 168, 75, 0.12) 25%, rgba(10, 22, 40, 0) 60%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--ink-900);
      color: var(--paper-200);
      font-family: var(--font-sans);
      font-weight: 400;
      line-height: 1.7;
      overflow-x: hidden;
      cursor: none;
    }
    body, button, a { cursor: none !important; }

    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; border: none; background: none; color: inherit; }

    /* ====== Custom Cursor ====== */
    .cursor-outer {
      position: fixed;
      top: 0;
      left: 0;
      width: 36px;
      height: 36px;
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%);
      transition: width 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  height 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  border-color 0.25s ease,
                  background-color 0.25s ease;
      mix-blend-mode: difference;
      will-change: transform;
    }
    .cursor-inner {
      position: fixed;
      top: 0;
      left: 0;
      width: 6px;
      height: 6px;
      background: var(--gold-400);
      border-radius: 50%;
      pointer-events: none;
      z-index: 100000;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px var(--gold-400), 0 0 20px rgba(232, 194, 106, 0.5);
      transition: width 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                  height 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                  background-color 0.2s ease;
      will-change: transform;
    }
    .cursor-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(232, 194, 106, 0.12) 0%, rgba(232, 194, 106, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99998;
      transform: translate(-50%, -50%);
      transition: width 0.4s ease, height 0.4s ease, opacity 0.4s ease;
      will-change: transform;
    }
    .cursor-outer.hover {
      width: 56px;
      height: 56px;
      border-color: var(--gold-400);
      background: rgba(232, 194, 106, 0.08);
    }
    .cursor-inner.hover {
      width: 4px;
      height: 4px;
    }
    .cursor-glow.hover {
      width: 160px;
      height: 160px;
      opacity: 1.4;
    }
    .cursor-outer.click {
      width: 24px;
      height: 24px;
      transition: width 0.08s ease, height 0.08s ease;
    }
    .cursor-inner.click {
      width: 10px;
      height: 10px;
      transition: width 0.08s ease, height 0.08s ease;
    }

    .ripple-el {
      position: fixed;
      border: 1.5px solid rgba(232, 194, 106, 0.7);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99997;
      transform: translate(-50%, -50%);
      animation: rippleExpand 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes rippleExpand {
      0% { width: 0; height: 0; opacity: 1; }
      100% { width: 120px; height: 120px; opacity: 0; }
    }

    /* ====== Navigation ====== */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 24px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background-color 0.4s ease, padding 0.4s ease, backdrop-filter 0.4s ease;
    }
    .nav.scrolled {
      background: rgba(6, 14, 28, 0.85);
      backdrop-filter: blur(12px);
      padding: 14px 48px;
      border-bottom: 1px solid rgba(232, 194, 106, 0.1);
    }
    .nav-logo {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--paper-100);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-logo-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold-400);
      box-shadow: 0 0 10px var(--gold-400), 0 0 20px rgba(232, 194, 106, 0.5);
      animation: lampBreath 3.2s ease-in-out infinite;
    }
    @keyframes lampBreath {
      0%, 100% { opacity: 0.7; box-shadow: 0 0 8px var(--gold-400), 0 0 16px rgba(232, 194, 106, 0.4); }
      50% { opacity: 1; box-shadow: 0 0 14px var(--gold-400), 0 0 28px rgba(232, 194, 106, 0.6); }
    }
    .nav-links {
      display: flex;
      gap: 36px;
      list-style: none;
    }
    .nav-links li {
      position: relative;
      font-size: 14px;
      letter-spacing: 2px;
      color: var(--ink-200);
      transition: color 0.3s ease;
    }
    .nav-links li:hover { color: var(--gold-400); }
    .nav-links li::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--gold-400);
      transition: width 0.3s ease;
    }
    .nav-links li:hover::after { width: 100%; }
    .nav-cta {
      font-size: 13px;
      letter-spacing: 2px;
      padding: 10px 22px;
      border: 1px solid var(--gold-500);
      color: var(--gold-400);
      border-radius: 2px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .nav-cta:hover {
      background: var(--gold-500);
      color: var(--ink-900);
      box-shadow: 0 0 24px rgba(212, 168, 75, 0.35);
    }

    /* ====== Hero Section ====== */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(232, 194, 106, 0.08) 0%, transparent 55%),
        linear-gradient(180deg, var(--ink-900) 0%, var(--ink-800) 100%);
    }
    .hero-lamp {
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 600px;
      background: var(--lamp-glow);
      pointer-events: none;
      opacity: 0.8;
      animation: lampSway 6s ease-in-out infinite;
    }
    @keyframes lampSway {
      0%, 100% { transform: translateX(-50%) rotate(-0.5deg); opacity: 0.75; }
      50% { transform: translateX(-50%) rotate(0.5deg); opacity: 0.9; }
    }
    .dust-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .dust {
      position: absolute;
      width: 3px;
      height: 3px;
      background: var(--gold-300);
      border-radius: 50%;
      opacity: 0;
      box-shadow: 0 0 4px var(--gold-300);
    }
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 0 24px;
      max-width: 900px;
    }
    .hero-eyebrow {
      font-size: 13px;
      letter-spacing: 8px;
      color: var(--gold-400);
      margin-bottom: 28px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s ease 0.4s forwards;
    }
    .hero-title {
      font-family: var(--font-serif);
      font-size: clamp(48px, 7vw, 96px);
      font-weight: 700;
      color: var(--paper-100);
      letter-spacing: 12px;
      line-height: 1.2;
      margin-bottom: 28px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.7s forwards;
    }
    .hero-title .gold { color: var(--gold-400); }
    .hero-subtitle {
      font-size: 17px;
      color: var(--ink-200);
      line-height: 2;
      letter-spacing: 2px;
      max-width: 600px;
      margin: 0 auto 44px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s ease 1.1s forwards;
    }
    .hero-meta {
      display: flex;
      justify-content: center;
      gap: 48px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s ease 1.4s forwards;
    }
    .hero-meta-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .hero-meta-num {
      font-family: var(--font-serif);
      font-size: 32px;
      font-weight: 600;
      color: var(--gold-400);
    }
    .hero-meta-label {
      font-size: 12px;
      letter-spacing: 3px;
      color: var(--ink-300);
    }
    .hero-scroll {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--ink-300);
      font-size: 11px;
      letter-spacing: 4px;
      opacity: 0;
      animation: fadeIn 1s ease 2s forwards;
    }
    .hero-scroll-line {
      width: 1px;
      height: 48px;
      background: linear-gradient(180deg, var(--gold-400), transparent);
      position: relative;
      overflow: hidden;
    }
    .hero-scroll-line::after {
      content: "";
      position: absolute;
      top: -100%;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--gold-400);
      animation: scrollDown 2.2s ease-in-out infinite;
    }
    @keyframes scrollDown {
      0% { top: -100%; }
      100% { top: 100%; }
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* ====== Typewriter ====== */
    .typewriter-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--gold-400);
      margin-left: 4px;
      vertical-align: text-bottom;
      animation: blink 1.1s step-end infinite;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    /* ====== Section Common ====== */
    .section {
      padding: 140px 48px;
      position: relative;
    }
    .section-inner {
      max-width: 1280px;
      margin: 0 auto;
    }
    .section-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 64px;
      gap: 32px;
      flex-wrap: wrap;
    }
    .section-tag {
      font-size: 12px;
      letter-spacing: 6px;
      color: var(--gold-500);
      margin-bottom: 16px;
      display: block;
    }
    .section-title {
      font-family: var(--font-serif);
      font-size: clamp(32px, 4vw, 48px);
      font-weight: 600;
      color: var(--paper-100);
      letter-spacing: 4px;
      line-height: 1.3;
    }
    .section-desc {
      font-size: 15px;
      color: var(--ink-200);
      max-width: 420px;
      line-height: 1.9;
      letter-spacing: 1px;
    }

    /* ====== Reveal on scroll ====== */
    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .reveal.in {
      opacity: 1;
      transform: translateY(0);
    }

    /* ====== Book Recommendation Section ====== */
    .books {
      background: linear-gradient(180deg, var(--ink-800) 0%, var(--ink-900) 100%);
      position: relative;
    }
    .books::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(232, 194, 106, 0.2), transparent);
    }

    .book-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 48px;
      flex-wrap: wrap;
    }
    .book-tab {
      padding: 10px 24px;
      font-size: 14px;
      letter-spacing: 2px;
      color: var(--ink-200);
      border: 1px solid transparent;
      border-radius: 2px;
      transition: all 0.3s ease;
      position: relative;
    }
    .book-tab:hover {
      color: var(--gold-400);
      border-color: rgba(232, 194, 106, 0.3);
    }
    .book-tab.active {
      color: var(--gold-400);
      border-color: var(--gold-500);
      background: rgba(232, 194, 106, 0.06);
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 32px;
    }
    .book-card {
      position: relative;
      perspective: 1000px;
      cursor: pointer;
    }
    .book-inner {
      position: relative;
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }
    .book-card:hover .book-inner {
      transform: rotateY(-12deg) translateY(-6px);
    }
    .book-spine {
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: 2px 4px 4px 2px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 20px;
      position: relative;
      overflow: hidden;
      box-shadow:
        inset -8px 0 12px rgba(0,0,0,0.25),
        0 10px 30px rgba(0,0,0,0.4);
      transition: box-shadow 0.4s ease;
    }
    .book-card:hover .book-spine {
      box-shadow:
        inset -8px 0 12px rgba(0,0,0,0.2),
        0 16px 40px rgba(232, 194, 106, 0.15),
        0 10px 30px rgba(0,0,0,0.5);
    }
    .book-spine::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: rgba(0,0,0,0.15);
    }
    .book-title-v {
      writing-mode: vertical-rl;
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 4px;
      align-self: center;
    }
    .book-author-v {
      writing-mode: vertical-rl;
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 2px;
    }
    .book-info {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .book-name {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 500;
      color: var(--paper-100);
      letter-spacing: 1px;
    }
    .book-author {
      font-size: 13px;
      color: var(--ink-300);
      letter-spacing: 1px;
    }
    .book-tag {
      display: inline-block;
      font-size: 11px;
      color: var(--gold-400);
      letter-spacing: 2px;
      margin-top: 4px;
    }
    /* Book color variants */
    .book-c1 { background: linear-gradient(135deg, #4A2545 0%, #2E1530 100%); }
    .book-c2 { background: linear-gradient(135deg, #1E4D5C 0%, #0F2D38 100%); }
    .book-c3 { background: linear-gradient(135deg, #6B3A1F 0%, #3E1F0E 100%); }
    .book-c4 { background: linear-gradient(135deg, #2C4A2E 0%, #172A19 100%); }
    .book-c5 { background: linear-gradient(135deg, #5C3D5A 0%, #342038 100%); }
    .book-c6 { background: linear-gradient(135deg, #3D3D5C 0%, #1E1E3A 100%); }
    .book-c7 { background: linear-gradient(135deg, #5C4A2D 0%, #3A2E18 100%); }
    .book-c8 { background: linear-gradient(135deg, #7A2E2E 0%, #4A1818 100%); }

    /* Shine sweep on book hover */
    .book-spine::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
      transform: skewX(-15deg);
      transition: left 0.6s ease;
    }
    .book-card:hover .book-spine::after {
      left: 120%;
    }

    /* ====== Events Section ====== */
    .events {
      background: var(--ink-900);
      position: relative;
    }
    .events-bg {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(232, 194, 106, 0.04) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(232, 194, 106, 0.03) 0%, transparent 40%);
      pointer-events: none;
    }
    .events-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .event-item {
      display: grid;
      grid-template-columns: 140px 1fr auto;
      gap: 40px;
      align-items: center;
      padding: 32px 24px;
      border-bottom: 1px solid rgba(90, 115, 153, 0.15);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: background-color 0.4s ease;
    }
    .event-item::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 2px;
      height: 100%;
      background: var(--gold-500);
      transform: scaleY(0);
      transform-origin: top;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .event-item:hover {
      background: rgba(232, 194, 106, 0.03);
    }
    .event-item:hover::before {
      transform: scaleY(1);
    }
    .event-date {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .event-day {
      font-family: var(--font-serif);
      font-size: 36px;
      font-weight: 600;
      color: var(--gold-400);
      line-height: 1;
    }
    .event-month {
      font-size: 12px;
      letter-spacing: 3px;
      color: var(--ink-300);
    }
    .event-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .event-name {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 500;
      color: var(--paper-100);
      letter-spacing: 2px;
    }
    .event-desc {
      font-size: 14px;
      color: var(--ink-200);
      line-height: 1.8;
      letter-spacing: 0.5px;
    }
    .event-meta {
      display: flex;
      gap: 20px;
      font-size: 12px;
      color: var(--ink-300);
      letter-spacing: 1px;
    }
    .event-meta span { display: flex; align-items: center; gap: 6px; }
    .event-meta .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gold-500); }
    .event-arrow {
      width: 44px;
      height: 44px;
      border: 1px solid var(--ink-400);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-200);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .event-item:hover .event-arrow {
      border-color: var(--gold-500);
      color: var(--gold-400);
      transform: translateX(4px);
    }

    /* ====== Journal Section ====== */
    .journal {
      background: linear-gradient(180deg, var(--ink-800) 0%, var(--ink-700) 100%);
    }
    .journal-grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 24px;
    }
    .journal-card {
      background: var(--ink-800);
      border: 1px solid rgba(90, 115, 153, 0.15);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
    }
    .journal-card:hover {
      transform: translateY(-4px);
      border-color: rgba(232, 194, 106, 0.3);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3), 0 0 30px rgba(232, 194, 106, 0.05);
    }
    .journal-card.featured {
      grid-row: span 2;
    }
    .journal-img {
      width: 100%;
      aspect-ratio: 16 / 10;
      position: relative;
      overflow: hidden;
    }
    .journal-card.featured .journal-img { aspect-ratio: 4 / 5; }
    .journal-img-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      color: rgba(255,255,255,0.15);
      font-size: 60px;
      letter-spacing: 8px;
      transition: transform 0.6s ease;
    }
    .journal-card:hover .journal-img-inner {
      transform: scale(1.05);
    }
    .journal-j1 { background: linear-gradient(135deg, #1A2E52 0%, #0A1628 100%); }
    .journal-j2 { background: linear-gradient(135deg, #2C4A2E 0%, #0F1A10 100%); }
    .journal-j3 { background: linear-gradient(135deg, #4A2545 0%, #1A0D1E 100%); }
    .journal-j4 { background: linear-gradient(135deg, #6B3A1F 0%, #2A1708 100%); }
    .journal-j5 { background: linear-gradient(135deg, #3D3D5C 0%, #14142A 100%); }

    .journal-body {
      padding: 24px;
    }
    .journal-date {
      font-size: 12px;
      color: var(--gold-500);
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .journal-title {
      font-family: var(--font-serif);
      font-size: 19px;
      font-weight: 500;
      color: var(--paper-100);
      line-height: 1.5;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .journal-card.featured .journal-title {
      font-size: 24px;
    }
    .journal-excerpt {
      font-size: 13px;
      color: var(--ink-200);
      line-height: 1.8;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .journal-card.featured .journal-excerpt {
      -webkit-line-clamp: 6;
    }

    /* ====== Visit / Guide Section ====== */
    .visit {
      background: var(--ink-900);
      position: relative;
      overflow: hidden;
    }
    .visit-bg-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--font-serif);
      font-size: 280px;
      font-weight: 900;
      color: rgba(232, 194, 106, 0.02);
      letter-spacing: 20px;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }
    .visit-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: start;
    }
    .visit-info {
      display: flex;
      flex-direction: column;
      gap: 40px;
    }
    .visit-item {
      display: flex;
      gap: 24px;
      padding-bottom: 36px;
      border-bottom: 1px solid rgba(90, 115, 153, 0.15);
    }
    .visit-icon {
      width: 48px;
      height: 48px;
      border: 1px solid var(--gold-500);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-400);
      flex-shrink: 0;
      font-size: 20px;
    }
    .visit-content h4 {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 500;
      color: var(--paper-100);
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .visit-content p {
      font-size: 14px;
      color: var(--ink-200);
      line-height: 1.9;
      letter-spacing: 0.5px;
    }
    .visit-content .hours-list {
      list-style: none;
      margin-top: 8px;
    }
    .visit-content .hours-list li {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 13px;
      color: var(--ink-200);
      border-bottom: 1px dashed rgba(90, 115, 153, 0.1);
    }
    .visit-content .hours-list li strong {
      color: var(--gold-400);
      font-weight: 400;
    }

    /* Map card */
    .map-card {
      background: var(--ink-800);
      border: 1px solid rgba(90, 115, 153, 0.15);
      border-radius: 4px;
      overflow: hidden;
      position: sticky;
      top: 100px;
    }
    .map-visual {
      aspect-ratio: 4 / 3;
      background:
        linear-gradient(135deg, var(--ink-700) 0%, var(--ink-800) 100%);
      position: relative;
      overflow: hidden;
    }
    .map-street {
      position: absolute;
      background: rgba(90, 115, 153, 0.2);
    }
    .map-street-h { width: 100%; height: 2px; }
    .map-street-v { width: 2px; height: 100%; }
    .map-pulse {
      position: absolute;
      top: 55%;
      left: 48%;
      width: 12px;
      height: 12px;
      background: var(--gold-500);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 0 rgba(232, 194, 106, 0.6);
      animation: pulse 2.4s ease-out infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(232, 194, 106, 0.6); }
      70% { box-shadow: 0 0 0 30px rgba(232, 194, 106, 0); }
      100% { box-shadow: 0 0 0 0 rgba(232, 194, 106, 0); }
    }
    .map-label {
      position: absolute;
      top: 48%;
      left: 55%;
      font-family: var(--font-serif);
      font-size: 14px;
      color: var(--gold-400);
      letter-spacing: 2px;
      white-space: nowrap;
    }
    .map-info {
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(90, 115, 153, 0.15);
    }
    .map-address {
      font-size: 14px;
      color: var(--ink-200);
      letter-spacing: 1px;
    }
    .map-btn {
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--gold-400);
      padding: 8px 16px;
      border: 1px solid var(--gold-500);
      border-radius: 2px;
      transition: all 0.3s ease;
    }
    .map-btn:hover {
      background: var(--gold-500);
      color: var(--ink-900);
    }

    /* ====== Footer ====== */
    .footer {
      background: var(--ink-900);
      padding: 80px 48px 40px;
      border-top: 1px solid rgba(90, 115, 153, 0.1);
    }
    .footer-inner {
      max-width: 1280px;
      margin: 0 auto;
    }
    .footer-top {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 60px;
      margin-bottom: 60px;
    }
    .footer-brand h3 {
      font-family: var(--font-serif);
      font-size: 26px;
      font-weight: 700;
      color: var(--paper-100);
      letter-spacing: 4px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .footer-brand p {
      font-size: 14px;
      color: var(--ink-200);
      line-height: 1.9;
      max-width: 360px;
      letter-spacing: 0.5px;
    }
    .footer-col h5 {
      font-size: 14px;
      font-weight: 500;
      color: var(--paper-100);
      letter-spacing: 2px;
      margin-bottom: 20px;
    }
    .footer-col ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .footer-col ul li {
      font-size: 13px;
      color: var(--ink-200);
      letter-spacing: 1px;
      transition: color 0.3s ease;
    }
    .footer-col ul li:hover { color: var(--gold-400); }
    .footer-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 32px;
      border-top: 1px solid rgba(90, 115, 153, 0.1);
      font-size: 12px;
      color: var(--ink-300);
      letter-spacing: 1px;
    }
    .footer-social {
      display: flex;
      gap: 16px;
    }
    .footer-social a {
      width: 36px;
      height: 36px;
      border: 1px solid var(--ink-500);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--ink-200);
      transition: all 0.3s ease;
    }
    .footer-social a:hover {
      border-color: var(--gold-500);
      color: var(--gold-400);
      transform: translateY(-2px);
    }

    /* ====== Back to top ====== */
    .back-top {
      position: fixed;
      bottom: 32px;
      right: 32px;
      width: 48px;
      height: 48px;
      background: var(--ink-700);
      border: 1px solid var(--gold-500);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-400);
      z-index: 500;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.3s ease;
    }
    .back-top.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .back-top:hover {
      background: var(--gold-500);
      color: var(--ink-900);
    }

    /* ====== Modal ====== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(6, 14, 28, 0.9);
      backdrop-filter: blur(8px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: var(--ink-800);
      border: 1px solid rgba(232, 194, 106, 0.2);
      border-radius: 4px;
      max-width: 640px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      transform: translateY(20px) scale(0.96);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
    }
    .modal-overlay.open .modal-card {
      transform: translateY(0) scale(1);
    }
    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(90, 115, 153, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--paper-200);
      font-size: 18px;
      transition: all 0.3s ease;
      z-index: 10;
    }
    .modal-close:hover {
      background: rgba(232, 194, 106, 0.15);
      color: var(--gold-400);
    }
    .modal-header {
      padding: 40px 40px 0;
    }
    .modal-tag {
      font-size: 12px;
      letter-spacing: 4px;
      color: var(--gold-500);
      margin-bottom: 12px;
    }
    .modal-title {
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 600;
      color: var(--paper-100);
      letter-spacing: 2px;
      line-height: 1.4;
    }
    .modal-body {
      padding: 24px 40px 40px;
    }
    .modal-body p {
      font-size: 15px;
      color: var(--ink-200);
      line-height: 2;
      margin-bottom: 16px;
    }
    .modal-meta {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(90, 115, 153, 0.15);
      flex-wrap: wrap;
    }
    .modal-meta-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .modal-meta-label {
      font-size: 11px;
      color: var(--ink-300);
      letter-spacing: 2px;
    }
    .modal-meta-value {
      font-size: 14px;
      color: var(--paper-100);
      font-family: var(--font-serif);
    }

    /* ====== Stats counter ====== */
    .stats-row {
      display: flex;
      justify-content: space-around;
      padding: 60px 40px;
      margin-top: 100px;
      border-top: 1px solid rgba(90, 115, 153, 0.15);
      border-bottom: 1px solid rgba(90, 115, 153, 0.15);
    }
    .stat-item {
      text-align: center;
    }
    .stat-num {
      font-family: var(--font-serif);
      font-size: 48px;
      font-weight: 700;
      color: var(--gold-400);
      line-height: 1;
      margin-bottom: 8px;
      text-shadow: 0 0 30px rgba(232, 194, 106, 0.3);
    }
    .stat-label {
      font-size: 13px;
      color: var(--ink-200);
      letter-spacing: 3px;
    }

    /* ====== Parallax book shelf ====== */
    .shelf-visual {
      height: 420px;
      position: relative;
      margin: 80px 0;
      perspective: 1200px;
    }
    .shelf-row {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 180px;
      background:
        linear-gradient(180deg, transparent 0%, rgba(90, 115, 153, 0.06) 100%);
      border-bottom: 4px solid rgba(90, 115, 153, 0.15);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 6px;
      padding: 0 20px;
      transform-style: preserve-3d;
    }
    .shelf-book {
      width: 36px;
      border-radius: 1px 1px 0 0;
      position: relative;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.5s ease;
      cursor: pointer;
      box-shadow: inset -4px 0 8px rgba(0,0,0,0.3);
    }
    .shelf-book:hover {
      transform: translateY(-20px);
      box-shadow:
        inset -4px 0 8px rgba(0,0,0,0.2),
        0 -10px 20px rgba(232, 194, 106, 0.15);
    }
    .shelf-book .sb-title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-90deg);
      writing-mode: vertical-rl;
      font-family: var(--font-serif);
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      white-space: nowrap;
      letter-spacing: 1px;
    }

    /* ====== Newsletter ====== */
    .newsletter {
      padding: 100px 48px;
      background:
        radial-gradient(ellipse at center, rgba(232, 194, 106, 0.08) 0%, transparent 70%),
        var(--ink-900);
    }
    .newsletter-inner {
      max-width: 720px;
      margin: 0 auto;
      text-align: center;
    }
    .newsletter h3 {
      font-family: var(--font-serif);
      font-size: 36px;
      font-weight: 600;
      color: var(--paper-100);
      letter-spacing: 4px;
      margin-bottom: 16px;
    }
    .newsletter p {
      font-size: 15px;
      color: var(--ink-200);
      letter-spacing: 1px;
      margin-bottom: 36px;
      line-height: 1.9;
    }
    .newsletter-form {
      display: flex;
      gap: 12px;
      max-width: 480px;
      margin: 0 auto;
    }
    .newsletter-input {
      flex: 1;
      padding: 14px 20px;
      background: rgba(90, 115, 153, 0.1);
      border: 1px solid var(--ink-500);
      border-radius: 2px;
      color: var(--paper-100);
      font-size: 14px;
      font-family: inherit;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      outline: none;
    }
    .newsletter-input:focus {
      border-color: var(--gold-500);
      background: rgba(232, 194, 106, 0.04);
      box-shadow: 0 0 0 3px rgba(232, 194, 106, 0.1);
    }
    .newsletter-input::placeholder { color: var(--ink-300); }
    .newsletter-btn {
      padding: 14px 28px;
      background: var(--gold-500);
      color: var(--ink-900);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 2px;
      border-radius: 2px;
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    .newsletter-btn:hover {
      background: var(--gold-400);
      box-shadow: 0 0 24px rgba(232, 194, 106, 0.4);
    }
    .newsletter-success {
      color: var(--gold-400);
      font-size: 14px;
      margin-top: 16px;
      letter-spacing: 2px;
    }

    /* ====== Reduced motion ====== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .cursor-outer, .cursor-inner, .cursor-glow { display: none; }
      body, button, a { cursor: auto !important; }
      .dust { display: none; }
      .reveal { opacity: 1; transform: none; }
    }

    /* ====== Responsive ====== */
    @media (max-width: 1024px) {
      .book-grid { grid-template-columns: repeat(2, 1fr); }
      .journal-grid { grid-template-columns: 1fr 1fr; }
      .journal-card.featured { grid-column: span 2; grid-row: auto; }
      .journal-card.featured .journal-img { aspect-ratio: 16 / 9; }
      .visit-layout { grid-template-columns: 1fr; gap: 48px; }
      .map-card { position: relative; top: 0; }
      .footer-top { grid-template-columns: 1fr 1fr; gap: 40px; }
      .section { padding: 100px 24px; }
      .nav { padding: 20px 24px; }
      .nav.scrolled { padding: 14px 24px; }
    }
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .book-grid { grid-template-columns: 1fr; }
      .journal-grid { grid-template-columns: 1fr; }
      .journal-card.featured { grid-column: auto; }
      .event-item { grid-template-columns: 90px 1fr; gap: 20px; }
      .event-arrow { display: none; }
      .footer-top { grid-template-columns: 1fr; gap: 32px; }
      .footer-bottom { flex-direction: column; gap: 16px; text-align: center; }
      .stats-row { flex-wrap: wrap; gap: 32px; }
      .stat-item { flex: 1 1 40%; }
      .stat-num { font-size: 36px; }
      .hero-title { letter-spacing: 6px; }
      .hero-meta { flex-wrap: wrap; gap: 24px; }
      .newsletter-form { flex-direction: column; }
      .cursor-outer, .cursor-inner, .cursor-glow { display: none; }
      body, button, a { cursor: auto !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ============================================================
    // DATA
    // ============================================================
    const BOOKS_DATA = {
      深夜推荐: [
        { id: 1, title: "深夜便利店", author: "乙一", color: "book-c1", tag: "日本短篇", desc: "十二个发生在深夜的故事，像便利店冷柜里的饭团，每一个都有不同的温度。" },
        { id: 2, title: "月亮与六便士", author: "毛姆", color: "book-c2", tag: "经典文学", desc: "满地都是六便士，他却抬头看见了月亮。一本写给所有深夜仰望星空的人。" },
        { id: 3, title: "瓦尔登湖", author: "梭罗", color: "book-c3", tag: "自然哲思", desc: "我步入丛林，因为我希望活得有意义。在最深的夜里，读最静的书。" },
        { id: 4, title: "百年孤独", author: "马尔克斯", color: "book-c4", tag: "魔幻现实", desc: "生命中曾经有过的所有灿烂，终究都需要用寂寞来偿还。" },
      ],
      文学经典: [
        { id: 5, title: "卡拉马佐夫兄弟", author: "陀思妥耶夫斯基", color: "book-c5", tag: "俄国文学", desc: "如果上帝不存在，一切都是允许的。关于信仰与怀疑的终极诘问。" },
        { id: 6, title: "追忆似水年华", author: "普鲁斯特", color: "book-c6", tag: "意识流", desc: "唯一真实的乐园是人们失去的乐园。在回忆中寻找时间的形状。" },
        { id: 7, title: "霍乱时期的爱情", author: "马尔克斯", color: "book-c7", tag: "拉美文学", desc: "我对死亡唯一的遗憾，就是没能为爱而死。跨越半个世纪的爱情史诗。" },
        { id: 8, title: "局外人", author: "加缪", color: "book-c8", tag: "存在主义", desc: "我常常想，如果让我住在一棵枯树干里，什么都不能做，我也能适应。" },
      ],
      人文思想: [
        { id: 9, title: "存在与时间", author: "海德格尔", color: "book-c1", tag: "哲学", desc: "向死而生。只有直面死亡的必然性，才能真正理解存在的意义。" },
        { id: 10, title: "人类简史", author: "尤瓦尔·赫拉利", color: "book-c2", tag: "历史", desc: "从动物到上帝，智人如何凭借虚构的故事统治了这个星球。" },
        { id: 11, title: "规训与惩罚", author: "福柯", color: "book-c3", tag: "社会学", desc: "权力不是自上而下的，而是弥散在社会的每一个毛细血管中。" },
        { id: 12, title: "忧郁的热带", author: "列维-斯特劳斯", color: "book-c4", tag: "人类学", desc: "旅行的意义在于消解自我，在异乡重新认识自己原本的世界。" },
      ],
      诗歌散文: [
        { id: 13, title: "荒原", author: "T.S.艾略特", color: "book-c5", tag: "现代诗", desc: "四月是最残忍的月份。现代诗歌的里程碑，破碎世界的镜像。" },
        { id: 14, title: "小王子", author: "圣埃克苏佩里", color: "book-c6", tag: "童话", desc: "真正重要的东西，用眼睛是看不见的。只有用心才能看得清。" },
        { id: 15, title: "瓦尔登湖", author: "梭罗", color: "book-c7", tag: "散文", desc: "时间决定你会在生命中遇见谁，你的心决定你想要谁出现在你的生命里。" },
        { id: 16, title: "飞鸟集", author: "泰戈尔", color: "book-c8", tag: "诗集", desc: "生如夏花之绚烂，死如秋叶之静美。三百余首小诗，点亮每一个夜晚。" },
      ],

    // ============================================================
    // CUSTOM CURSOR (vanilla JS, direct DOM, no React re-render)
    // ============================================================
    function initCursor(reducedMotion) {
      if (reducedMotion) return { destroy: () => {} };

      // Create cursor elements
      const outer = document.createElement('div');
      outer.className = 'cursor-outer';
      const inner = document.createElement('div');
      inner.className = 'cursor-inner';
      const glow = document.createElement('div');
      glow.className = 'cursor-glow';
      document.body.appendChild(outer);
      document.body.appendChild(inner);
      document.body.appendChild(glow);

      // Positions with different easing for layered feel
      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      let outerX = mouseX;
      let outerY = mouseY;
      let innerX = mouseX;
      let innerY = mouseY;
      let glowX = mouseX;
      let glowY = mouseY;

      let rafId = null;
      let visible = true;

      function onMouseMove(e) {
        mouseX = e.clientX;
        mouseY = e.clientY;
      }

      function tick() {
        if (!visible) { rafId = requestAnimationFrame(tick); return; }

        // Spring physics: inner follows fastest, outer slightly delayed, glow slowest
        innerX += (mouseX - innerX) * 0.45;
        innerY += (mouseY - innerY) * 0.45;
        outerX += (mouseX - outerX) * 0.25;
        outerY += (mouseY - outerY) * 0.25;
        glowX += (mouseX - glowX) * 0.08;
        glowY += (mouseY - glowY) * 0.08;

        inner.style.transform = `translate(${innerX}px, ${innerY}px) translate(-50%, -50%)`;
        outer.style.transform = `translate(${outerX}px, ${outerY}px) translate(-50%, -50%)`;
        glow.style.transform = `translate(${glowX}px, ${glowY}px) translate(-50%, -50%)`;

        rafId = requestAnimationFrame(tick);
      }
      rafId = requestAnimationFrame(tick);

      // Hover detection
      const interactiveSelector = 'a, button, .book-card, .event-item, .journal-card, .shelf-book, .map-btn, .back-top, input, .nav-links li, .book-tab, .footer-social a, .modal-close';
      
      function onMouseOver(e) {
        if (e.target.closest(interactiveSelector)) {
          outer.classList.add('hover');
          inner.classList.add('hover');
          glow.classList.add('hover');
        }
      }
      function onMouseOut(e) {
        if (e.target.closest(interactiveSelector)) {
          outer.classList.remove('hover');
          inner.classList.remove('hover');
          glow.classList.remove('hover');
        }
      }

      // Click ripple
      function onClick(e) {
        const ripple = document.createElement('div');
        ripple.className = 'ripple-el';
        ripple.style.left = e.clientX + 'px';
        ripple.style.top = e.clientY + 'px';
        document.body.appendChild(ripple);
        // Click compression
        outer.classList.add('click');
        inner.classList.add('click');
        setTimeout(() => {
          outer.classList.remove('click');
          inner.classList.remove('click');
        }, 120);
        setTimeout(() => ripple.remove(), 800);
      }

      function onVisibility() {
        visible = !document.hidden;
      }

      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseover', onMouseOver);
      window.addEventListener('mouseout', onMouseOut);
      window.addEventListener('mousedown', onClick);
      document.addEventListener('visibilitychange', onVisibility);

      return {
        destroy() {
          if (rafId) cancelAnimationFrame(rafId);
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseover', onMouseOver);
          window.removeEventListener('mouseout', onMouseOut);
          window.removeEventListener('mousedown', onClick);
          document.removeEventListener('visibilitychange', onVisibility);
          outer.remove();
          inner.remove();
          glow.remove();
        }
      };
    }

    // ============================================================
    // DUST MOTES (vanilla JS, direct DOM)
    // ============================================================
    function initDust(container, reducedMotion) {
      if (reducedMotion) return { destroy: () => {} };

      const COUNT = 28;
      const motes = [];
      let rafId = null;
      let visible = true;

      for (let i = 0; i < COUNT; i++) {
        const d = document.createElement('div');
        d.className = 'dust';
        const size = 1 + Math.random() * 3;
        d.style.width = size + 'px';
        d.style.height = size + 'px';
        container.appendChild(d);

        const rect = container.getBoundingClientRect();
        motes.push({
          el: d,
          x: Math.random() * rect.width,
          y: Math.random() * rect.height,
          vx: (Math.random() - 0.5) * 0.3,
          vy: -0.1 - Math.random() * 0.3, // drift upward
          opacity: 0,
          targetOpacity: 0.2 + Math.random() * 0.5,
          phase: Math.random() * Math.PI * 2,
          speed: 0.003 + Math.random() * 0.007,
          amplitude: 10 + Math.random() * 25,
        });
      }

      let lastTime = 0;
      function tick(t) {
        if (!visible) { rafId = requestAnimationFrame(tick); return; }
        const dt = Math.min((t - lastTime) / 16, 3) || 1; // cap dt
        lastTime = t;

        const rect = container.getBoundingClientRect();
        const width = rect.width;
        const height = rect.height;

        for (const m of motes) {
          m.phase += m.speed * dt;
          m.x += m.vx * dt + Math.sin(m.phase) * 0.3 * dt;
          m.y += m.vy * dt;

          // Wrap around
          if (m.y < -10) {
            m.y = height + 10;
            m.x = Math.random() * width;
          }
          if (m.x < -10) m.x = width + 10;
          if (m.x > width + 10) m.x = -10;

          // Fade in/out based on y position (more visible in middle)
          const midRatio = 1 - Math.abs(m.y / height - 0.5) * 2;
          m.opacity = m.targetOpacity * Math.max(0, midRatio);

          m.el.style.transform = `translate3d(${m.x}px, ${m.y}px, 0)`;
          m.el.style.opacity = m.opacity;
        }

        rafId = requestAnimationFrame(tick);
      }
      rafId = requestAnimationFrame(tick);

      function onVisibility() {
        visible = !document.hidden;
      }
      document.addEventListener('visibilitychange', onVisibility);

      return {
        destroy() {
          if (rafId) cancelAnimationFrame(rafId);
          document.removeEventListener('visibilitychange', onVisibility);
          motes.forEach(m => m.el.remove());
        }
      };
    }

    // ============================================================
    // SCROLL REVEAL
    // ============================================================
    function useScrollReveal() {
      const ref = useRef(null);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const elements = el.querySelectorAll('.reveal');
        if (!elements.length) return;

        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('in');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });

        elements.forEach(el => observer.observe(el));
        return () => observer.disconnect();
      }, []);
      return ref;
    }

    // ============================================================
    // TYPEWRITER HOOK
    // ============================================================
    function useTypewriter(text, speed = 80, delay = 0) {
      const [displayed, setDisplayed] = useState('');
      const [done, setDone] = useState(false);
      useEffect(() => {
        let idx = 0;
        let timer = null;
        let startTimer = null;
        setDisplayed('');
        setDone(false);

        function start() {
          timer = setInterval(() => {
            idx++;
            setDisplayed(text.slice(0, idx));
            if (idx >= text.length) {
              clearInterval(timer);
              setDone(true);
            }
          }, speed + Math.random() * 40 - 20); // variable speed for natural feel
        }
        startTimer = setTimeout(start, delay);

        return () => {
          if (timer) clearInterval(timer);
          if (startTimer) clearTimeout(startTimer);
        };
      }, [text, speed, delay]);
      return { displayed, done };
    }

    // ============================================================
    // NUMBER COUNTER (spring/damped)
    // ============================================================
    function useCountUp(target, duration = 2000, startTriggered = true) {
      const ref = useRef(null);
      const [value, setValue] = useState(0);
      const triggeredRef = useRef(false);

      useEffect(() => {
        if (!startTriggered) return;
        const el = ref.current;
        if (!el) return;

        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting && !triggeredRef.current) {
              triggeredRef.current = true;
              // Ease-out cubic
              const startTime = performance.now();
              function step(t) {
                const elapsed = t - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                setValue(Math.floor(eased * target));
                if (progress < 1) requestAnimationFrame(step);
              }
              requestAnimationFrame(step);
            }
          });
        }, { threshold: 0.3 });

        observer.observe(el);
        return () => observer.disconnect();
      }, [target, duration, startTriggered]);

      return { ref, value };
    }

    function ShelfVisual() {

          const y = (e.clientY - rect.top) / rect.height - 0.5;
          tiltRef.current = { x, y };
        }

        function tick() {
          const { x, y } = tiltRef.current;
          const books = shelf.querySelectorAll('.shelf-book');
          books.forEach((b, i) => {
            // Each row of books has slightly different parallax depth
            const depth = 0.3 + (i % 5) * 0.12;
            const tx = x * 20 * depth;
            const ty = y * 10 * depth;
            b.style.transform = `translate(${tx}px, ${ty}px)`;
          });
          rafRef.current = requestAnimationFrame(tick);
        }
        rafRef.current = requestAnimationFrame(tick);

        shelf.addEventListener('mousemove', onMouseMove);
        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          shelf.removeEventListener('mousemove', onMouseMove);
        };
      }, []);

    function Newsletter() {

          setSubscribed(true);
          setEmail('');
        }
      }

      return (
        <section className="newsletter">
          <div className="newsletter-inner reveal">
            <h3>长夜来信</h3>
            <p>每周一封深夜邮件，新书上架、活动预告、店长随笔。<br/>不打扰，只在你恰好失眠的夜里抵达。</p>
            <form className="newsletter-form" onSubmit={handleSubmit}>
              <input
                type="email"
                className="newsletter-input"
                placeholder="你的邮箱地址"
                value={email}
                onChange={(e) => setEmail(e.target.value)}
              />
              <button type="submit" className="newsletter-btn">订阅</button>
            </form>
            {subscribed && <div className="newsletter-success">✓ 订阅成功，深夜见。</div>}

    function BackToTop({ show, onClick }) {
      return (
        <button className={`back-top ${show ? 'show' : ''}`} onClick={onClick} aria-label="回到顶部">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
            <path d="M12 19V5M5 12l7-7 7 7" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </button>
      );
    }

    function Modal({ open, onClose, title, tag, meta, children }) {
      useEffect(() => {
        function onKey(e) {
          if (e.key === 'Escape') onClose();
        }
        if (open) {
          document.addEventListener('keydown', onKey);
          document.body.style.overflow = 'hidden';
        }
        return () => {
          document.removeEventListener('keydown', onKey);
          document.body.style.overflow = '';
        };
      }, [open, onClose]);

      return (
        <div className={`modal-overlay ${open ? 'open' : ''}`} onClick={onClose}>
          <div className="modal-card" onClick={(e) => e.stopPropagation()}>
            <button className="modal-close" onClick={onClose} aria-label="关闭">×</button>
            <div className="modal-header">
              <div className="modal-tag">{tag}</div>
              <h3 className="modal-title">{title}</h3>
            </div>
            <div className="modal-body">
              {meta && (
                <div className="modal-meta">
                  {meta.map((m, i) => (
                    <div key={i} className="modal-meta-item">
                      <span className="modal-meta-label">{m.label}</span>
                      <span className="modal-meta-value">{m.value}</span>
                    </div>
                  ))}
                </div>
              )}
              {children}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // APP
    // ============================================================
    function App() {
      const [scrolled, setScrolled] = useState(false);
      const [showBackTop, setShowBackTop] = useState(false);
      const [reducedMotion, setReducedMotion] = useState(false);
      const [bookModal, setBookModal] = useState(null);
      const [eventModal, setEventModal] = useState(null);
      const [journalModal, setJournalModal] = useState(null);
      const rootRef = useScrollReveal();

      // Reduced motion check
      useEffect(() => {
        const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
        setReducedMotion(mq.matches);
        const handler = (e) => setReducedMotion(e.matches);
        mq.addEventListener('change', handler);
        return () => mq.removeEventListener('change', handler);
      }, []);

      // Custom cursor init
      useEffect(() => {
        const cursor = initCursor(reducedMotion);
        return () => cursor.destroy();
      }, [reducedMotion]);

      // Scroll listener
      useEffect(() => {
        let ticking = false;
        function onScroll() {
          if (!ticking) {
            requestAnimationFrame(() => {
              const y = window.scrollY;
              setScrolled(y > 40);
              setShowBackTop(y > 600);
              ticking = false;
            });
            ticking = true;
          }
        }
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      const scrollTo = useCallback((hash) => {
        const id = hash.replace('#', '');
        const el = document.getElementById(id);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth' });
        }
      }, []);

      const backToTop = useCallback(() => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, []);

      return (
        <div ref={rootRef}>
          <Navigation scrolled={scrolled} onNavClick={scrollTo} />
          <Hero reducedMotion={reducedMotion} />
          <BooksSection onOpenBook={setBookModal} />
          <EventsSection onOpenEvent={setEventModal} />
          <JournalSection onOpenJournal={setJournalModal} />
          <VisitSection />
          <Newsletter />
          <Footer onNavClick={scrollTo} />
          <BackToTop show={showBackTop} onClick={backToTop} />

          {/* Book modal */}
          <Modal
            open={!!bookModal}
            onClose={() => setBookModal(null)}
            title={bookModal?.title}
            tag={bookModal?.tag}
            meta={bookModal ? [
              { label: '作者', value: bookModal.author },
              { label: '分类', value: bookModal.tag },
              { label: '馆藏位置', value: '二楼文学区 · A-14' },
              { label: '可借阅', value: '是' },
            ] : null}
          >
            <p>{bookModal?.desc}</p>
            <p style={{ color: 'var(--ink-300)', fontSize: '13px' }}>
              「深夜选书」栏目每周更新，由店长和资深店员共同挑选。本书适合在万籁俱寂的凌晨翻阅，建议搭配一杯热牛奶。
            </p>
            <div style={{ display: 'flex', gap: '12px', marginTop: '24px' }}>
              <button className="newsletter-btn" style={{ padding: '12px 24px', fontSize: '13px' }}>预约借阅</button>
              <button className="nav-cta" style={{ padding: '12px 24px', fontSize: '13px' }}>加入书单</button>
            </div>
          </Modal>

          {/* Event modal */}
          <Modal
            open={!!eventModal}
            onClose={() => setEventModal(null)}
            title={eventModal?.title}
            tag={eventModal?.type}
            meta={eventModal ? [
              { label: '日期', value: `${eventModal.month} ${eventModal.day} 日` },
              { label: '时间', value: eventModal.time },
              { label: '地点', value: eventModal.location },
              { label: '名额', value: `${eventModal.seats} 席` },
            ] : null}
          >
            <p>{eventModal?.desc}</p>
            <p style={{ color: 'var(--ink-300)', fontSize: '13px' }}>
              报名方式：请发送邮件至 hello@changnight.book，标题注明活动名称。名额有限，先到先得。深夜活动不设年龄限制，但请确保可以自行返程。
            </p>
            <div style={{ display: 'flex', gap: '12px', marginTop: '24px' }}>
              <button className="newsletter-btn" style={{ padding: '12px 24px', fontSize: '13px' }}>立即报名</button>
              <button className="nav-cta" style={{ padding: '12px 24px', fontSize: '13px' }}>加入提醒</button>
            </div>
          </Modal>

          {/* Journal modal */}
          <Modal
            open={!!journalModal}
            onClose={() => setJournalModal(null)}
            title={journalModal?.title}
            tag="书店日志"
            meta={journalModal ? [
              { label: '日期', value: journalModal.date },
              { label: '作者', value: '店长' },
              { label: '栏目', value: '手札' },
            ] : null}
          >
            <p>{journalModal?.excerpt}</p>
            <p>
              有一位先生，每天凌晨三点准时出现，坐在同一个角落，点一杯美式，读同一本书。他从不和人说话，读的是一本《追忆似水年华》。我问过他一次，他说这本书是他妻子生前最爱的书，妻子走后，他就把每个失眠的夜晚都交给了普鲁斯特。
            </p>
            <p>
              深夜的书店，从来不缺故事。每个推门进来的人，都带着一点白天无法消化的东西。而我们能做的，就是留一盏灯，留一把椅子，留一本书。
            </p>
            <p style={{ color: 'var(--ink-300)', fontSize: '13px' }}>
              ——全文刊登于长夜书店周报第 187 期，订阅「长夜来信」可获取完整内容。
            </p>
            <div style={{ display: 'flex', gap: '12px', marginTop: '24px' }}>
              <button className="newsletter-btn" style={{ padding: '12px 24px', fontSize: '13px' }}>阅读全文</button>
              <button className="nav-cta" style={{ padding: '12px 24px', fontSize: '13px' }}>收藏本文</button>
            </div>
          </Modal>
        </div>
      );
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Announce upgrade capability
    function announceUpgrade() {
      window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    }
    announceUpgrade();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announceUpgrade, { once: true });
    }
  </script>
</body>

// ===================== TOAST =====================
function Toast({ message, onDone }) {
  useEffect(() => {
    const t = setTimeout(onDone, 1800);
    return () => clearTimeout(t);
  }, [onDone]);
  return <div className="toast">{message}</div>;
}

function HomePage({ onNavigate, showToast }) {
  const [filter, setFilter] = useState('推荐');
  const [pullActive, setPullActive] = useState(false);
  const [liked, setLiked] = useState({});
  const [skeleton, setSkeleton] = useState(true);
  const pageRef = useRef(null);
  const startYRef = useRef(0);
  const pullDistRef = useRef(0);
  const visibleRef = useRef(true);
  const [animKey, setAnimKey] = useState(0);

  useEffect(() => {
    setSkeleton(true);
    const t = setTimeout(() => setSkeleton(false), 900);
    return () => clearTimeout(t);
  }, [filter]);

  useEffect(() => { setAnimKey(k => k + 1); }, [filter]);

  useEffect(() => {
    const onVis = () => { visibleRef.current = !document.hidden; };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, []);

  const handleTouchStart = (e) => {
    if (pageRef.current?.scrollTop <= 0) {
      startYRef.current = e.touches ? e.touches[0].clientY : e.clientY;
    }
  };
  const handleTouchMove = (e) => {
    if (pageRef.current?.scrollTop <= 0 && startYRef.current) {
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      const diff = y - startYRef.current;
      if (diff > 0) {
        pullDistRef.current = Math.min(diff * 0.5, 80);
        setPullActive(pullDistRef.current > 40);
      }
    }
  };
  const handleTouchEnd = () => {
    if (pullDistRef.current > 50) {
      setTimeout(() => { setPullActive(false); showToast('已刷新'); }, 1200);
    } else {
      setPullActive(false);
    }
    pullDistRef.current = 0;
    startYRef.current = 0;
  };

  const toggleLike = (id) => {
    setLiked(prev => ({ ...prev, [id]: !prev[id] }));

      onTouchMove={handleTouchMove}
      onTouchEnd={handleTouchEnd}

// ===================== ENCYCLOPEDIA PAGE =====================
function EncyclopediaPage({ onNavigate, showToast }) {
  const [scrollY, setScrollY] = useState(0);
  const pageRef = useRef(null);
  const rafRef = useRef(null);
  const visibleRef = useRef(true);

  useEffect(() => {
    const page = pageRef.current;
    if (!page) return;
    const onScroll = () => {
      if (!visibleRef.current) return;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      rafRef.current = requestAnimationFrame(() => {
        setScrollY(page.scrollTop);
      });
    };
    page.addEventListener('scroll', onScroll, { passive: true });
    return () => {
      page.removeEventListener('scroll', onScroll);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, []);

  useEffect(() => {
    const onVis = () => {
      visibleRef.current = !document.hidden;
      if (!visibleRef.current && rafRef.current) cancelAnimationFrame(rafRef.current);
    };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, []);

  const parallaxOffset = scrollY * 0.3;

  return (
    <div className="page with-tabbar" ref={pageRef}>
      <div style={{
        height: 280,
        position: 'relative', overflow: 'hidden',
        marginBottom: -60
      }}>
        <div style={{

// ===================== APP ROOT =====================
function useMediaQuery(query) {
  const [matches, setMatches] = useState(() => {
    if (typeof window === 'undefined') return false;
    return window.matchMedia(query).matches;
  });
  useEffect(() => {
    const mq = window.matchMedia(query);
    const handler = (e) => setMatches(e.matches);
    mq.addEventListener('change', handler);
    return () => mq.removeEventListener('change', handler);
  }, [query]);
  return matches;
}

function App() {
  const [pageStack, setPageStack] = useState([{ key: 'home' }]);
  const [actionSheet, setActionSheet] = useState(null);
  const [toast, setToast] = useState(null);
  const reducedMotion = useMediaQuery('(prefers-reduced-motion: reduce)');

  const currentPage = pageStack[pageStack.length - 1];
  const isTabPage = ['home', 'discover', 'activities', 'encyclopedia', 'profile'].includes(currentPage.key);

  const navigate = useCallback((key, data = null) => {
    if (key === 'petProfile') {
      setPageStack(prev => [...prev, { key: 'petProfile', data, direction: 'push' }]);
    } else if (key === 'specs' || key === 'api') {
      setPageStack(prev => [...prev, { key, data, direction: 'push' }]);
    } else {
      setPageStack([{ key, data, direction: 'initial' }]);
    }
  }, []);

  const goBack = useCallback(() => {
    if (pageStack.length > 1) {
      setPageStack(prev => prev.slice(0, -1));
    }
  }, [pageStack.length]);

  const handleTabChange = useCallback((t) => {
    setPageStack([{ key: t, direction: 'switch' }]);
  }, []);

  const showToast = useCallback((message) => {
    setToast({ message, id: Date.now() });
  }, []);

  const tabKey = pageStack[0]?.key || 'home';

  useEffect(() => {
    function announce() {
      window.parent?.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    }
    announce();
    if (document.readyState !== 'complete') window.addEventListener('load', announce, { once: true });
  }, []);

  const renderPage = (page) => {
    switch(page.key) {
      case 'home':
        return <HomePage onNavigate={navigate} showToast={showToast} />;
      case 'discover':
        return <DiscoverPage onNavigate={navigate} showToast={showToast} />;
      case 'activities':
        return <ActivitiesPage onNavigate={navigate} showToast={showToast} />;
      case 'encyclopedia':
        return <EncyclopediaPage onNavigate={navigate} showToast={showToast} />;
      case 'profile':
        return <ProfilePage onNavigate={navigate} showToast={showToast} />;
      case 'petProfile':
        return <PetProfilePage pet={page.data || PETS[0]} onBack={goBack} showToast={showToast} />;
      case 'specs':
        return <DesignSpecsPage onBack={goBack} showToast={showToast} />;
      case 'api':
        return <ApiDocsPage onBack={goBack} showToast={showToast} />;
      default:
        return <HomePage onNavigate={navigate} showToast={showToast} />;
    }
  };

  const isPushPage = pageStack.length > 1;

  return (
    <div className="ios-device">
      <div className="ios-screen">
        <StatusBar dark={false} />
        <CapsuleButton />

        <div className="page-stack">
          {/* Current page */}
          <div className={`page ${isPushPage ? 'entering-right' : ''}`} style={{ zIndex: isPushPage ? 10 : 1 }}>
            {renderPage(currentPage)}
          </div>

          {isTabPage && <TabBar active={tabKey} onChange={handleTabChange} />}
        </div>

        <div className="ios-home-indicator"></div>

        {actionSheet && (
          <ActionSheet items={actionSheet} onClose={() => setActionSheet(null)} onSelect={(item) => { showToast(item.label); }} />
        )}

        {toast && <Toast key={toast.id} message={toast.message} onDone={() => setToast(null)} />}
      </div>
    </div>
  );
}

// ===================== RENDER =====================
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

    function usePrefersReducedMotion() {
      const [reduced, setReduced] = useState(false);
      useEffect(() => {
        const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
        setReduced(mq.matches);
        const handler = e => setReduced(e.matches);
        mq.addEventListener('change', handler);
        return () => mq.removeEventListener('change', handler);
      }, []);
      return reduced;
    }

    /* 安全的 RAF / 定时器管理器 */
    function useAnimationFrame(callback, active = true) {
      const rafRef = useRef(null);
      const visibleRef = useRef(true);
      const cbRef = useRef(callback);
      cbRef.current = callback;

      useEffect(() => {
        const loop = () => {
          cbRef.current();
          rafRef.current = requestAnimationFrame(loop);
        };
        if (active && visibleRef.current) {
          rafRef.current = requestAnimationFrame(loop);
        }
        return () => {
          if (rafRef.current) {
            cancelAnimationFrame(rafRef.current);
            rafRef.current = null;
          }
        };
      }, [active]);

      useEffect(() => {
        const handleVis = () => {

      }, []);

      const clearTimers = () => {
        timersRef.current.forEach(t => clearTimeout(t));
        timersRef.current = [];
      };

      useEffect(() => () => clearTimers(), []);

      const handleTouchStart = (e) => {
        if (scrollRef.current?.scrollTop <= 0) {
          startYRef.current = e.touches[0].clientY;
          pullingRef.current = true;
        }
      };

      const handleTouchMove = (e) => {
        if (!pullingRef.current) return;
        const dy = e.touches[0].clientY - startYRef.current;
        if (dy > 0 && scrollRef.current?.scrollTop <= 0) {
          e.preventDefault();
          const d = Math.min(dy * 0.5, 90);
          setPullDist(d);
        }

      const handleTouchEnd = () => {
        if (!pullingRef.current) return;
        pullingRef.current = false;
        if (pullDist > 60) {
          setRefreshing(true);
          setPullDist(60);
          clearTimers();
          const t = setTimeout(() => {
            setRefreshing(false);
            setPullDist(0);

          timersRef.current.push(t);

            paddingTop: 'var(--ios-safe-top, 62px)',
            background: TOKEN.ink, color: '#fff',
            flexShrink: 0,
          }}>
            <div style={{
              display: 'flex', alignItems: 'center', height: 44,
              padding: '0 16px',
            }}>
              <div onClick={onBack} style={{
                width: 36, height: 36, borderRadius: 18,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                color: '#fff', cursor: 'pointer', marginRight: 4,
              }}>
                {Icon.back('#fff')}
              </div>
              <div style={{ fontFamily: TOKEN.fontSerif, fontSize: 17, fontWeight: 600, flex: 1, textAlign: 'center', marginRight: 40 }}>
                接口文档
              </div>
            </div>
            <div style={{ padding: '4px 20px 16px' }}>
              <div style={{ fontSize: 11, opacity: 0.6, letterSpacing: 1 }}>API REFERENCE</div>
              <div style={{ fontFamily: TOKEN.fontSerif, fontSize: 20, fontWeight: 700, marginTop: 2 }}>
                羽踪开放 API v1.0
              </div>
              <div style={{ fontSize: 12, opacity: 0.7, marginTop: 4 }}>
                共 28 个接口 · RESTful · JSON 格式
              </div>
            </div>
          </div>

          {/* 左右分栏 — 左侧列表 右侧详情 */}
          <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
            {/* 左栏：接口列表 */}
            <div style={{
              width: 140, flexShrink: 0, overflowY: 'auto',
              background: `${TOKEN.ink}05`,
              borderRight: `1px solid ${TOKEN.divider}`,
              padding: '12px 0',
            }}>
              {apis.map(api => (
                <div
                  key={api.id}
                  onClick={() => setActiveApi(api.id)}
                  style={{
                    padding: '10px 12px', cursor: 'pointer',
                    borderLeft: activeApi === api.id ? `3px solid ${TOKEN.amber}` : '3px solid transparent',
                    background: activeApi === api.id ? '#fff' : 'transparent',
                    marginBottom: 2,
                    transition: 'background 0.15s',
                  }}
                >
                  <div style={{
                    fontSize: 10, fontWeight: 700, color: methodColor(api.method),
                    fontFamily: 'monospace', letterSpacing: 0.5,
                  }}>
                    {api.method}
                  </div>
                  <div style={{
                    fontSize: 12, color: TOKEN.ink,
                    fontWeight: activeApi === api.id ? 600 : 400,
                    marginTop: 3, lineHeight: 1.3,
                  }}>
                    {api.name}
                  </div>
                </div>
              ))}
            </div>

            {/* 右栏：详情 */}
            <div style={{ flex: 1, overflowY: 'auto', padding: '16px 14px 100px' }}>
              {(() => {
                const api = apis.find(a => a.id === activeApi);
                return (
                  <div>
                    <div style={{
                      display: 'flex', alignItems: 'center', gap: 8,
                      marginBottom: 10,
                    }}>
                      <span style={{
                        padding: '3px 8px', borderRadius: 6,
                        background: `${methodColor(api.method)}15`,
                        color: methodColor(api.method),
                        fontSize: 11, fontWeight: 700, fontFamily: 'monospace',
                      }}>{api.method}</span>
                      <span style={{
                        fontFamily: 'monospace', fontSize: 12,
                        color: TOKEN.ink, fontWeight: 500,
                        wordBreak: 'break-all',
                      }}>{api.path}</span>
                    </div>
                    <div style={{ fontFamily: TOKEN.fontSerif, fontSize: 16, fontWeight: 600, color: TOKEN.ink }}>
                      {api.name}
                    </div>
                    <p style={{
                      fontSize: 12, color: TOKEN.textSecondary,
                      marginTop: 6, lineHeight: 1.6,
                    }}>
                      {api.method === 'GET' ? '根据查询参数获取对应数据，支持分页与筛选。' : '提交数据创建新记录，返回创建后的完整资源。'}
                    </p>

                    {/* Tab */}
                    <div style={{
                      display: 'flex', gap: 4, marginTop: 16,
                      padding: 3, borderRadius: 10,
                      background: `${TOKEN.ink}08`,
                    }}>
                      {['request', 'response', 'params'].map(tab => (
                        <div
                          key={tab}
                          onClick={() => setActiveTab(tab)}
                          style={{
                            flex: 1, padding: '6px 0', textAlign: 'center',
                            fontSize: 12, fontWeight: 500, borderRadius: 7,
                            cursor: 'pointer',
                            background: activeTab === tab ? '#fff' : 'transparent',
                            color: activeTab === tab ? TOKEN.ink : TOKEN.textSecondary,
                            boxShadow: activeTab === tab ? '0 1px 3px rgba(0,0,0,0.06)' : 'none',
                            transition: 'all 0.15s',
                          }}
                        >
                          {tab === 'request' ? '请求' : tab === 'response' ? '响应' : '参数'}
                        </div>
                      ))}
                    </div>

                    {/* 代码块 */}
                    <div style={{
                      marginTop: 12, borderRadius: 14, overflow: 'hidden',
                      background: '#1E2A24',
                      boxShadow: '0 2px 12px rgba(0,0,0,0.12)',
                    }}>
                      <div style={{
                        padding: '8px 14px', fontSize: 11,
                        color: 'rgba(255,255,255,0.5)',
                        borderBottom: '1px solid rgba(255,255,255,0.08)',
                        fontFamily: 'monospace',
                        display: 'flex', alignItems: 'center', gap: 6,
                      }}>
                        <span style={{ width: 8, height: 8, borderRadius: 4, background: '#FF6058' }} />
                        <span style={{ width: 8, height: 8, borderRadius: 4, background: '#FFBD2E' }} />
                        <span style={{ width: 8, height: 8, borderRadius: 4, background: '#28CA41' }} />
                        <span style={{ marginLeft: 8 }}>
                          {activeTab === 'request' ? 'request.json' : activeTab === 'response' ? 'response.json' : 'params'}
                        </span>
                      </div>
                      <pre style={{
                        margin: 0, padding: '14px', fontSize: 11,
                        lineHeight: 1.6, color: '#E8E6E1',
                        fontFamily: 'SF Mono, Monaco, monospace',
                        overflowX: 'auto',
                      }}>
                        {activeTab === 'params' ? (
`name      string  可选   鸟种名称模糊搜索
category  string  可选   分类：鸣禽/涉禽/游禽等
rarity    string  可选   稀有度过滤
page      number  可选   页码，默认 1
limit     number  可选   每页数量，默认 20
sort      string  可选   排序字段`
                        ) : activeTab === 'request' ? sampleRequest : sampleResponse}
                      </pre>
                    </div>

                    {/* 错误码 */}
                    <div style={{ marginTop: 16 }}>
                      <div style={{
                        fontSize: 13, fontWeight: 600, color: TOKEN.ink,
                        marginBottom: 8,
                      }}>错误码</div>
                      <div style={{
                        background: '#fff', borderRadius: 12,
                        overflow: 'hidden', boxShadow: TOKEN.shadowCard,
                      }}>
                        {[
                          { code: '0', desc: '请求成功' },
                          { code: '40001', desc: '参数错误' },
                          { code: '40101', desc: '未授权 / token 失效' },
                          { code: '40401', desc: '资源不存在' },
                        ].map((e, i, arr) => (
                          <div key={e.code} style={{
                            display: 'flex', padding: '8px 14px',
                            borderBottom: i < arr.length - 1 ? `1px solid ${TOKEN.divider}` : 'none',
                            fontSize: 12,
                          }}>
                            <span style={{
                              fontFamily: 'monospace', color: TOKEN.amberDeep,
                              fontWeight: 600, width: 60,
                            }}>{e.code}</span>
                            <span style={{ color: TOKEN.textSecondary }}>{e.desc}</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* 在线调试按钮 */}
                    <button style={{
                      width: '100%', marginTop: 20, height: 44,
                      borderRadius: 14, border: 'none',
                      background: TOKEN.amber, color: '#fff',
                      fontSize: 14, fontWeight: 500, cursor: 'pointer',
                      boxShadow: '0 4px 12px rgba(224,138,60,0.3)',
                    }}>
                      在线调试
                    </button>
                  </div>
                );
              })()}
            </div>
          </div>
        </div>
      );
    }

    /* ════════════════════════════════════════════════
       TabBar
       ════════════════════════════════════════════════ */
    function TabBar({ active, onChange }) {
      const tabs = [
        { key: 'home', label: '首页', icon: 'home' },
        { key: 'guide', label: '图鉴', icon: 'book' },
        { key: 'records', label: '记录', icon: 'feather' },
        { key: 'spots', label: '观测点', icon: 'pin' },
        { key: 'me', label: '我的', icon: 'user' },
      ];

      return (
        <div style={{
          position: 'absolute', left: 0, right: 0, bottom: 0, zIndex: 30,
          background: 'rgba(255,255,255,0.93)',
          backdropFilter: 'blur(20px)',
          WebkitBackdropFilter: 'blur(20px)',
          borderTop: `1px solid ${TOKEN.divider}`,
          paddingBottom: 'var(--ios-safe-bottom, 34px)',
        }}>
          <div style={{
            display: 'flex', height: 56,
          }}>
            {tabs.map(t => {
              const isActive = active === t.key;
              return (
                <div
                  key={t.key}
                  onClick={() => onChange(t.key)}
                  style={{
                    flex: 1, display: 'flex', flexDirection: 'column',
                    alignItems: 'center', justifyContent: 'center',
                    gap: 2, cursor: 'pointer',
                    color: isActive ? TOKEN.ink : TOKEN.textMuted,
                  }}
                >
                  <div style={{
                    transition: 'transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1)',
                    transform: isActive ? 'scale(1.1) translateY(-1px)' : 'scale(1)',
                  }}>
                    {Icon[t.icon]()}
                  </div>
                  <span style={{
                    fontSize: 10, fontWeight: isActive ? 600 : 400,
                    transition: 'all 0.2s',
                  }}>{t.label}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    /* ════════════════════════════════════════════════
       主应用：导航栈 + TabBar 管理
       ════════════════════════════════════════════════ */
    function App() {
      const reduced = usePrefersReducedMotion();
      const [tab, setTab] = useState('home');
      // 每个 tab 的导航栈
      const [stacks, setStacks] = useState({
        home: [], guide: [], records: [], spots: [], me: [],
      });
      const [transitionDir, setTransitionDir] = useState('forward');
      const [isTransitioning, setIsTransitioning] = useState(false);

      const currentStack = stacks[tab];

      const push = (pageKey, data) => {
        if (isTransitioning) return;
        setTransitionDir('forward');
        setIsTransitioning(true);
        setStacks(prev => ({
          ...prev,
          [tab]: [...prev[tab], { key: pageKey, data }],
        }));
        const t = setTimeout(() => setIsTransitioning(false), 350);
        return () => clearTimeout(t);
      };

      const pop = () => {
        if (isTransitioning || currentStack.length === 0) return;
        setTransitionDir('back');
        setIsTransitioning(true);
        setTimeout(() => {
          setStacks(prev => ({
            ...prev,
            [tab]: prev[tab].slice(0, -1),
          }));
          setIsTransitioning(false);
        }, 300);
      };

      const switchTab = (newTab) => {
        if (newTab === tab) return;
        setTab(newTab);
      };

      // 鸟种详情
      const openBirdDetail = (bird) => push('birdDetail', { bird });
      // 设计规范
      const openDesignSpec = () => push('design', {});
      // 接口文档
      const openApiDoc = () => push('api', {});

      const currentPage = currentStack[currentStack.length - 1];

      const renderPage = (pageKey, data) => {
        switch (pageKey) {
          case 'birdDetail':
            return <BirdDetailPage bird={data.bird} onBack={pop} />;
          case 'design':
            return <DesignSpecPage onBack={pop} />;
          case 'api':
            return <ApiDocPage onBack={pop} />;
          default:
            return null;
        }
      };

      const renderTabRoot = () => {
        switch (tab) {
          case 'home':
            return <HomePage onOpenBird={openBirdDetail} onOpenSheet={() => {}} />;
          case 'guide':
            return <GuidePage onOpenBird={openBirdDetail} />;
          case 'records':
            return <RecordsPage />;
          case 'spots':
            return <SpotsPage />;
          case 'me':
            return <MePage onDesign={openDesignSpec} onApi={openApiDoc} />;
          default:
            return null;
        }
      };

      // 页面切换样式
      const getPageStyle = (index) => {
        if (!currentPage) return {};
        if (index === currentStack.length - 1) {
          // 顶页
          return {
            transform: 'translateX(0)',
            opacity: 1,
            transition: isTransitioning
              ? `transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s`
              : 'none',
          };
        }
        if (index === currentStack.length - 2 && transitionDir === 'back') {
          return {
            transform: 'translateX(0)',
            opacity: 1,
            transition: isTransitioning
              ? `transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s`
              : 'none',
          };
        }
        return { display: 'none' };
      };

      return (
        <div style={{ position: 'relative', width: '100%', height: '100%' }}>
          {/* 根 tab 页 */}
          <div style={{
            position: 'absolute', inset: 0,
            opacity: currentPage ? 0.6 : 1,
            transform: currentPage ? 'translateX(-20%)' : 'translateX(0)',
            filter: currentPage ? 'brightness(0.8)' : 'none',
            transition: isTransitioning
              ? `transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s, filter 0.3s`
              : 'none',
          }}>
            {renderTabRoot()}
          </div>

          {/* 栈中页面 */}
          {currentStack.map((page, i) => (
            <div key={`${page.key}-${i}`} style={{
              position: 'absolute', inset: 0, zIndex: 10 + i,
              ...getPageStyle(i),
              transform: isTransitioning && i === currentStack.length - 1 && transitionDir === 'forward'
                ? 'translateX(0)'
                : (i === currentStack.length - 1 ? 'translateX(0)' : 'translateX(100%)'),
              opacity: i === currentStack.length - 1 ? 1 : 0,
            }}>
              {renderPage(page.key, page.data)}
            </div>
          ))}

          {/* TabBar — 当有栈页面时隐藏 */}
          {currentStack.length === 0 && (
            <TabBar active={tab} onChange={switchTab} />
          )}
        </div>
      );
    }

    /* ════════════════════════════════════════════════
       渲染
       ════════════════════════════════════════════════ */
    function announceUpgrade() {
      try {
        window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
      } catch (e) {}
    }
    announceUpgrade();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announceUpgrade, { once: true });
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <div className="scene-bg">
        <div style={{ position: 'relative', zIndex: 1 }}>
          <IOSDevice>
            <App />
          </IOSDevice>
          <div className="device-label">
            羽踪 <span>V2</span> · 原生 App Mock
          </div>
        </div>
      </div>
    );
  </script>
</body>
</html>

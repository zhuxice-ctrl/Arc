<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="creative-medium" content="interactive-prototype" />
<title>Miel · 城市养蜂 App</title>

<!-- React + ReactDOM + Babel standalone (locked versions) -->
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<!-- Fonts: Display serif + humanist sans pairing, honey-toned warmth -->
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Inter:wght@400;500;600;700;800&display=swap" />

<style>
  /* ============================================================
     Miel — 城市养蜂 iOS App Mock
     形态：原生 App
     配色：蜂蜜金 + 蜂蜡橙 + 深琥珀 + 奶油白 + 墨绿点缀
     ============================================================ */
  :root {
    --honey-50:  #FFF7E6;
    --honey-100: #FFEAB8;
    --honey-200: #FFD778;
    --honey-300: #FFC145;
    --honey-400: #F5A623;
    --honey-500: #D98E1C;
    --honey-600: #B07115;
    --honey-700: #8A5810;
    --honey-800: #5C3A0B;
    --honey-900: #3A2407;

    --beeswax: #FFF1C9;
    --amber:    #E67E22;
    --cream:    #FFFBF0;
    --deep-amber: #7A4A0E;
    --dark-wood: #2A1A08;
    --ink:      #2A1A08;
    --olive:    #6B7F3E;
    --olive-dk: #3D4A22;

    --shadow-soft: 0 2px 8px rgba(90,55,10,0.08), 0 12px 32px rgba(90,55,10,0.10);
    --shadow-glow: 0 0 24px rgba(245,166,35,0.35), 0 0 48px rgba(245,166,35,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #1a0f04 0%, #2a1a08 50%, #1a0f04 100%);
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ambient honeycomb pattern behind phone */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(245,166,35,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(180,110,20,0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .stage {
    position: relative;
    width: 100%; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    gap: 48px;
    padding: 40px;
    z-index: 1;
  }

  .page-label {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 220, 150, 0.55);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    z-index: 10;
    pointer-events: none;
  }

  /* custom cursor */
  .custom-cursor {
    position: fixed;
    width: 36px; height: 36px;
    border: 2px solid rgba(255, 220, 150, 0.9);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.25s cubic-bezier(.2,.8,.2,1),
                height 0.25s cubic-bezier(.2,.8,.2,1),
                border-color 0.25s,
                background 0.25s;
    mix-blend-mode: difference;
    box-shadow: 0 0 12px rgba(245,166,35,0.4);
  }
  .custom-cursor::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 6px; height: 6px;
    background: #FFC145;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px #FFC145, 0 0 16px rgba(255,193,69,0.6);
    transition: width 0.2s, height 0.2s;
  }
  .custom-cursor.hover {
    width: 52px; height: 52px;
    border-color: #FFD778;
    background: rgba(255, 215, 120, 0.15);
  }
  .custom-cursor.click {
    width: 24px; height: 24px;
    border-color: #FFC145;
  }
  .cursor-ripple {
    position: fixed;
    width: 10px; height: 10px;
    border: 2px solid rgba(255, 215, 120, 0.8);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    animation: rippleExpand 0.7s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes rippleExpand {
    0%   { width: 10px; height: 10px; opacity: 1; }
    100% { width: 80px; height: 80px; opacity: 0; }
  }

  /* ===== App Screen Shared ===== */
  .app-screen {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
    background: var(--cream);
    font-family: 'Inter', system-ui, sans-serif;
  }

  .screen-enter {
    animation: screenEnter 0.5s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes screenEnter {
    from { opacity: 0; transform: translateX(30px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* top nav area sits below status bar */
  .nav-bar {
    position: relative;
    padding: 8px 20px 12px;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .nav-title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: -0.5px;
    color: var(--dark-wood);
  }
  .nav-subtitle {
    font-size: 12px;
    font-weight: 500;
    color: var(--honey-600);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .nav-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 251, 240, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 0.5px solid rgba(138, 88, 16, 0.15);
    color: var(--deep-amber);
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
  }
  .nav-btn:active { transform: scale(0.92); }
  .nav-btn.primary {
    background: linear-gradient(135deg, var(--honey-400), var(--honey-500));
    color: white;
    border: none;
    box-shadow: 0 4px 12px rgba(217, 142, 28, 0.35);
  }

  /* scroll container */
  .scroll-area {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 110px;
  }
  .scroll-area::-webkit-scrollbar { display: none; }

  /* bottom tab bar */
  .tab-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 84px;
    background: rgba(255, 251, 240, 0.85);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-top: 0.5px solid rgba(138, 88, 16, 0.12);
    display: flex;
    align-items: flex-start;
    justify-content: space-around;
    padding: 8px 8px 0;
    z-index: 20;
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px 0;
    cursor: pointer;
    transition: transform 0.2s;
    position: relative;
  }
  .tab-item:active { transform: scale(0.9); }
  .tab-icon {
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(138, 88, 16, 0.4);
    transition: color 0.3s;
  }
  .tab-item.active .tab-icon {
    color: var(--honey-500);
  }
  .tab-label {
    font-size: 10px;
    font-weight: 500;
    color: rgba(138, 88, 16, 0.5);
    letter-spacing: 0.2px;
    transition: color 0.3s;
  }
  .tab-item.active .tab-label {
    color: var(--honey-600);
    font-weight: 600;
  }
  .tab-indicator {
    position: absolute;
    top: 2px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--honey-400);
    opacity: 0;
    transform: translateY(-4px);
    transition: all 0.35s cubic-bezier(.2,.8,.2,1);
  }
  .tab-item.active .tab-indicator {
    opacity: 1;
    transform: translateY(0);
  }

  /* ===== Shared components ===== */
  .honey-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px;
    border-radius: 100px;
    background: linear-gradient(135deg, var(--honey-200), var(--honey-300));
    color: var(--deep-amber);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
    box-shadow: 0 2px 6px rgba(217, 142, 28, 0.2);
  }
  .honey-chip.olive {
    background: linear-gradient(135deg, #B8C98D, #8FA85E);
    color: var(--olive-dk);
  }
  .honey-chip.cream {
    background: var(--beeswax);
    color: var(--deep-amber);
    box-shadow: none;
    border: 1px solid rgba(138, 88, 16, 0.15);
  }

  .card-honey {
    background: white;
    border-radius: 20px;
    box-shadow: var(--shadow-soft);
    border: 0.5px solid rgba(138, 88, 16, 0.08);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(.2,.8,.2,1), box-shadow 0.3s;
  }
  .card-honey:active {
    transform: scale(0.97);
  }

  /* honeycomb decorative SVG */
  .honeycomb-bg {
    position: absolute;
    opacity: 0.06;
    pointer-events: none;
  }

  /* floating action button */
  .fab {
    position: absolute;
    right: 20px;
    bottom: 100px;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--honey-300), var(--honey-500));
    color: white;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(217, 142, 28, 0.45), 0 2px 6px rgba(217, 142, 28, 0.3);
    cursor: pointer;
    z-index: 15;
    transition: transform 0.25s cubic-bezier(.2,.8,.2,1);
  }
  .fab:active { transform: scale(0.9) rotate(90deg); }
  .fab::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: rgba(245, 166, 35, 0.25);
    z-index: -1;
    animation: fabPulse 2.5s ease-in-out infinite;
  }
  @keyframes fabPulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50%      { transform: scale(1.2); opacity: 0; }
  }

  /* progress ring */
  .ring-progress {
    transform: rotate(-90deg);
  }
  .ring-bg { stroke: rgba(138, 88, 16, 0.1); }
  .ring-fill {
    stroke: url(#honeyGradient);
    stroke-linecap: round;
    transition: stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1);
  }

  /* shimmer / gloss sweep */
  .shimmer {
    position: relative;
    overflow: hidden;
  }
  .shimmer::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    animation: shimmer 3s ease-in-out infinite;
    animation-delay: 0.5s;
  }
  @keyframes shimmer {
    0%   { left: -100%; }
    60%  { left: 150%; }
    100% { left: 150%; }
  }

  /* number counter */
  .count-num {
    font-variant-numeric: tabular-nums;
    font-feature-settings: 'tnum';
  }

  /* section header */
  .section-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 4px 20px 12px;
  }
  .section-title {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--dark-wood);
    letter-spacing: -0.3px;
  }
  .section-more {
    font-size: 13px;
    font-weight: 500;
    color: var(--honey-600);
    cursor: pointer;
  }

  /* modal / bottom sheet */
  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(42, 26, 8, 0.45);
    backdrop-filter: blur(4px);
    z-index: 30;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    animation: fadeIn 0.3s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .bottom-sheet {
    width: 100%;
    background: var(--cream);
    border-radius: 24px 24px 0 0;
    padding: 10px 0 30px;
    animation: slideUp 0.45s cubic-bezier(.2,.8,.2,1);
    max-height: 75%;
    overflow-y: auto;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  .sheet-handle {
    width: 36px; height: 5px;
    border-radius: 3px;
    background: rgba(138, 88, 16, 0.2);
    margin: 0 auto 14px;
  }

  /* long-press context menu */
  .context-menu {
    position: absolute;
    background: rgba(255, 251, 240, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 14px;
    padding: 6px;
    box-shadow: 0 12px 32px rgba(42, 26, 8, 0.2), 0 2px 6px rgba(42, 26, 8, 0.1);
    border: 0.5px solid rgba(138, 88, 16, 0.15);
    z-index: 40;
    min-width: 160px;
    animation: menuPop 0.25s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes menuPop {
    from { opacity: 0; transform: scale(0.9) translateY(-8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .context-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    color: var(--dark-wood);
    cursor: pointer;
    transition: background 0.2s;
  }
  .context-item:hover, .context-item:active {
    background: var(--honey-100);
  }
  .context-item + .context-item {
    border-top: 0.5px solid rgba(138, 88, 16, 0.08);
  }
  .context-item svg { width: 16px; height: 16px; color: var(--honey-500); }

  /* ===== Page 1: Home (feed / discovery) ===== */
  .home-hero {
    position: relative;
    padding: 8px 20px 24px;
    overflow: hidden;
  }
  .hero-gradient {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 280px;
    background: linear-gradient(180deg, var(--honey-100) 0%, var(--beeswax) 40%, var(--cream) 100%);
    pointer-events: none;
  }
  .hero-greeting {
    font-size: 13px;
    color: var(--honey-700);
    font-weight: 500;
    margin-bottom: 2px;
    opacity: 0;
    animation: fadeUp 0.6s 0.1s forwards;
  }
  .hero-name {
    font-family: 'Fraunces', serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--dark-wood);
    line-height: 1.2;
    letter-spacing: -0.8px;
    opacity: 0;
    animation: fadeUp 0.6s 0.15s forwards;
  }
  .hero-tag {
    margin-top: 10px;
    display: flex; gap: 8px; flex-wrap: wrap;
    opacity: 0;
    animation: fadeUp 0.6s 0.25s forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* featured hive card (hero) */
  .featured-hive {
    position: relative;
    margin: 20px 20px 0;
    height: 200px;
    border-radius: 24px;
    overflow: hidden;
    background: linear-gradient(135deg, var(--honey-500) 0%, var(--honey-700) 100%);
    box-shadow: 0 16px 40px rgba(138, 88, 16, 0.35);
    cursor: pointer;
    opacity: 0;
    animation: fadeUp 0.7s 0.35s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .featured-hive:active { transform: scale(0.98); }
  .featured-hive .hive-art {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 20% 80%, rgba(255, 215, 120, 0.5) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(255, 193, 69, 0.3) 0%, transparent 60%);
  }
  .featured-hive .hive-content {
    position: relative;
    padding: 20px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: white;
  }
  .featured-hive .hive-id {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    opacity: 0.8;
  }
  .featured-hive .hive-name {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .featured-hive .hive-meta {
    display: flex; gap: 14px;
    font-size: 12px;
    opacity: 0.9;
  }
  .featured-hive .hive-meta span {
    display: flex; align-items: center; gap: 4px;
  }

  /* tiny bee animation in hero */
  .bee-float {
    position: absolute;
    width: 20px; height: 20px;
    animation: beeFloat 4s ease-in-out infinite;
  }
  @keyframes beeFloat {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    25%      { transform: translate(12px, -8px) rotate(5deg); }
    50%      { transform: translate(-6px, -14px) rotate(-3deg); }
    75%      { transform: translate(-10px, -4px) rotate(3deg); }
  }

  /* horizontal scroll section */
  .h-scroll {
    display: flex;
    gap: 14px;
    padding: 4px 20px 8px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .h-scroll::-webkit-scrollbar { display: none; }

  .mini-hive-card {
    flex: 0 0 160px;
    scroll-snap-align: start;
    background: white;
    border-radius: 18px;
    padding: 14px;
    box-shadow: var(--shadow-soft);
    border: 0.5px solid rgba(138, 88, 16, 0.08);
    cursor: pointer;
    transition: transform 0.3s;
    opacity: 0;
    animation: fadeUp 0.6s forwards;
  }
  .mini-hive-card:nth-child(1) { animation-delay: 0.4s; }
  .mini-hive-card:nth-child(2) { animation-delay: 0.45s; }
  .mini-hive-card:nth-child(3) { animation-delay: 0.5s; }
  .mini-hive-card:nth-child(4) { animation-delay: 0.55s; }
  .mini-hive-card:active { transform: scale(0.96); }

  .mini-hive-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--honey-200), var(--honey-400));
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 10px;
    color: var(--deep-amber);
  }
  .mini-hive-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--dark-wood);
    margin-bottom: 3px;
  }
  .mini-hive-status {
    font-size: 11px;
    color: var(--honey-600);
    font-weight: 500;
  }

  /* activity feed items */
  .activity-list {
    padding: 0 20px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .activity-item {
    display: flex; gap: 12px;
    padding: 12px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 1px 3px rgba(42, 26, 8, 0.04);
    border: 0.5px solid rgba(138, 88, 16, 0.06);
    opacity: 0;
    animation: fadeUp 0.5s forwards;
  }
  .activity-item:nth-child(1) { animation-delay: 0.5s; }
  .activity-item:nth-child(2) { animation-delay: 0.55s; }
  .activity-item:nth-child(3) { animation-delay: 0.6s; }
  .activity-item:nth-child(4) { animation-delay: 0.65s; }
  .activity-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--honey-200), var(--honey-400));
    display: flex; align-items: center; justify-content: center;
    color: var(--deep-amber);
    font-weight: 700;
    font-size: 13px;
    flex-shrink: 0;
  }
  .activity-body { flex: 1; min-width: 0; }
  .activity-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--dark-wood);
    margin-bottom: 2px;
  }
  .activity-text {
    font-size: 12px;
    color: #6b5636;
    line-height: 1.4;
  }
  .activity-time {
    font-size: 11px;
    color: #a89675;
    margin-top: 4px;
  }

  /* ===== Page 2: Hive Detail (full-screen, parallax) ===== */
  .detail-header {
    position: relative;
    height: 320px;
    overflow: hidden;
  }
  .detail-hero-img {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 30% 70%, var(--honey-400) 0%, var(--honey-700) 70%);
  }
  .detail-hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(42,26,8,0) 50%, rgba(42,26,8,0.6) 100%);
  }
  .detail-back {
    position: absolute;
    top: calc(var(--ios-safe-top) + 8px);
    left: 16px;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255, 251, 240, 0.25);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    color: white;
    cursor: pointer;
    z-index: 5;
    border: 0.5px solid rgba(255, 255, 255, 0.2);
  }
  .detail-actions {
    position: absolute;
    top: calc(var(--ios-safe-top) + 8px);
    right: 16px;
    display: flex; gap: 8px;
    z-index: 5;
  }
  .detail-title-wrap {
    position: absolute;
    bottom: 20px;
    left: 20px; right: 20px;
    color: white;
    z-index: 4;
  }
  .detail-hive-tag {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.75;
    margin-bottom: 6px;
  }
  .detail-hive-name {
    font-family: 'Fraunces', serif;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.8px;
    line-height: 1.1;
    text-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }

  .detail-stats {
    position: relative;
    margin: -30px 20px 0;
    background: white;
    border-radius: 20px;
    padding: 18px;
    box-shadow: var(--shadow-soft);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    z-index: 5;
  }
  .stat-box {
    text-align: center;
    padding: 8px 4px;
  }
  .stat-num {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--dark-wood);
    letter-spacing: -0.5px;
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-num .unit {
    font-size: 13px;
    font-weight: 500;
    color: var(--honey-600);
    margin-left: 2px;
  }
  .stat-label {
    font-size: 11px;
    color: #8a7556;
    font-weight: 500;
  }

  .detail-body {
    padding: 20px;
    display: flex; flex-direction: column; gap: 18px;
  }

  /* environment gauge */
  .env-gauge {
    background: white;
    border-radius: 20px;
    padding: 16px;
    box-shadow: var(--shadow-soft);
    border: 0.5px solid rgba(138, 88, 16, 0.08);
  }
  .gauge-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--dark-wood);
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 6px;
  }
  .gauge-row {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 12px;
  }
  .gauge-row:last-child { margin-bottom: 0; }
  .gauge-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--honey-100);
    display: flex; align-items: center; justify-content: center;
    color: var(--honey-600);
    flex-shrink: 0;
  }
  .gauge-info { flex: 1; min-width: 0; }
  .gauge-label {
    font-size: 12px;
    color: #6b5636;
    margin-bottom: 4px;
    display: flex; justify-content: space-between;
  }
  .gauge-bar {
    height: 6px;
    border-radius: 3px;
    background: rgba(138, 88, 16, 0.1);
    overflow: hidden;
  }
  .gauge-fill {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--honey-300), var(--honey-500));
    width: 0;
    transition: width 1.2s cubic-bezier(.2,.8,.2,1);
  }
  .gauge-fill.olive {
    background: linear-gradient(90deg, #B8C98D, #6B7F3E);
  }
  .gauge-fill.cool {
    background: linear-gradient(90deg, #7FD1DC, #3A8994);
  }

  /* daily record timeline */
  .timeline-section {
    background: white;
    border-radius: 20px;
    padding: 18px;
    box-shadow: var(--shadow-soft);
    border: 0.5px solid rgba(138, 88, 16, 0.08);
  }
  .timeline-item {
    display: flex; gap: 12px;
    position: relative;
    padding-bottom: 14px;
  }
  .timeline-item:last-child { padding-bottom: 0; }
  .timeline-item::before {
    content: '';
    position: absolute;
    left: 7px; top: 22px;
    width: 2px;
    bottom: 0;
    background: rgba(138, 88, 16, 0.12);
  }
  .timeline-item:last-child::before { display: none; }
  .timeline-dot {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--honey-300), var(--honey-500));
    border: 3px solid white;
    box-shadow: 0 0 0 1px rgba(138, 88, 16, 0.15);
    flex-shrink: 0;
    z-index: 1;
    margin-top: 2px;
  }
  .timeline-content { flex: 1; }
  .timeline-time {
    font-size: 11px;
    color: #a89675;
    font-weight: 500;
    margin-bottom: 2px;
  }
  .timeline-text {
    font-size: 13px;
    color: var(--dark-wood);
    line-height: 1.4;
  }

  /* ===== Page 3: Community (cards / grid) ===== */
  .community-header {
    padding: 8px 20px 16px;
    position: relative;
  }
  .community-tabs {
    display: flex;
    gap: 18px;
    margin-top: 14px;
    position: relative;
  }
  .community-tab {
    font-size: 15px;
    font-weight: 500;
    color: rgba(138, 88, 16, 0.4);
    cursor: pointer;
    padding-bottom: 8px;
    position: relative;
    transition: color 0.3s;
  }
  .community-tab.active {
    color: var(--dark-wood);
    font-weight: 700;
    font-family: 'Fraunces', serif;
    font-size: 20px;
    padding-bottom: 4px;
  }
  .community-tab-indicator {
    position: absolute;
    bottom: 0;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--honey-300), var(--honey-500));
    transition: all 0.4s cubic-bezier(.2,.8,.2,1);
  }

  .post-grid {
    padding: 4px 20px 20px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .post-card {
    border-radius: 16px;
    overflow: hidden;
    background: white;
    box-shadow: 0 2px 8px rgba(42, 26, 8, 0.06);
    cursor: pointer;
    transition: transform 0.3s;
  }
  .post-card:active { transform: scale(0.97); }
  .post-thumb {
    height: 120px;
    position: relative;
  }
  .post-info {
    padding: 10px 12px;
  }
  .post-user {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 6px;
  }
  .post-avatar {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--honey-200), var(--honey-400));
    color: var(--deep-amber);
    font-size: 10px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .post-username {
    font-size: 11px;
    font-weight: 600;
    color: var(--dark-wood);
  }
  .post-title {
    font-size: 12px;
    color: #6b5636;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .post-stats {
    display: flex; gap: 10px;
    margin-top: 8px;
    font-size: 10px;
    color: #a89675;
  }
  .post-stats span {
    display: flex; align-items: center; gap: 3px;
  }

  /* featured user banner */
  .beekeeper-spotlight {
    margin: 4px 20px 16px;
    height: 140px;
    border-radius: 20px;
    background: linear-gradient(135deg, #8FA85E 0%, #5C7530 100%);
    position: relative;
    overflow: hidden;
    padding: 18px;
    color: white;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(93, 117, 48, 0.3);
  }
  .beekeeper-spotlight::before {
    content: '';
    position: absolute;
    right: -30px; top: -30px;
    width: 140px; height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
  }
  .spotlight-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.85;
    margin-bottom: 6px;
  }
  .spotlight-name {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin-bottom: 4px;
  }
  .spotlight-bio {
    font-size: 12px;
    opacity: 0.85;
    max-width: 70%;
    line-height: 1.4;
  }
  .spotlight-follow {
    position: absolute;
    right: 16px; bottom: 16px;
    padding: 6px 14px;
    border-radius: 100px;
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.3);
    font-size: 12px;
    font-weight: 600;
    color: white;
    cursor: pointer;
  }

  /* ===== Page 4: Profile (ring progress + honeycomb stats) ===== */
  .profile-hero {
    position: relative;
    padding: 8px 20px 30px;
    background: linear-gradient(180deg, var(--beeswax) 0%, var(--cream) 100%);
    overflow: hidden;
  }
  .profile-avatar-wrap {
    display: flex;
    gap: 16px;
    align-items: center;
    margin-top: 10px;
  }
  .profile-avatar {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--honey-300), var(--honey-600));
    display: flex; align-items: center; justify-content: center;
    color: white;
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 700;
    box-shadow: 0 8px 20px rgba(217, 142, 28, 0.35);
    position: relative;
    flex-shrink: 0;
  }
  .profile-avatar::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2px solid var(--honey-300);
    opacity: 0.5;
    animation: avatarPulse 3s ease-in-out infinite;
  }
  @keyframes avatarPulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50%      { transform: scale(1.08); opacity: 0; }
  }
  .profile-info { flex: 1; min-width: 0; }
  .profile-name {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--dark-wood);
    letter-spacing: -0.5px;
    margin-bottom: 2px;
  }
  .profile-handle {
    font-size: 13px;
    color: var(--honey-700);
    margin-bottom: 6px;
  }
  .profile-bio {
    font-size: 12px;
    color: #6b5636;
    line-height: 1.4;
  }

  /* honeycomb progress rings */
  .achievements-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 0 20px;
    margin-top: -20px;
    position: relative;
    z-index: 3;
  }
  .ach-ring {
    flex: 1;
    background: white;
    border-radius: 18px;
    padding: 14px 8px;
    text-align: center;
    box-shadow: var(--shadow-soft);
    border: 0.5px solid rgba(138, 88, 16, 0.08);
  }
  .ach-ring svg { margin: 0 auto 6px; display: block; }
  .ach-label {
    font-size: 11px;
    color: #6b5636;
    font-weight: 500;
  }
  .ach-value {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--dark-wood);
    margin-bottom: 2px;
  }

  /* settings / menu grid */
  .profile-menu-grid {
    padding: 18px 20px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px 10px;
  }
  .menu-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .menu-tile:active { transform: scale(0.92); }
  .menu-icon {
    width: 46px; height: 46px;
    border-radius: 14px;
    background: white;
    display: flex; align-items: center; justify-content: center;
    color: var(--honey-500);
    box-shadow: 0 2px 8px rgba(42, 26, 8, 0.06);
    border: 0.5px solid rgba(138, 88, 16, 0.08);
  }
  .menu-tile:nth-child(2) .menu-icon { color: var(--olive); background: #F3F7E8; }
  .menu-tile:nth-child(3) .menu-icon { color: #C27A2C; background: #FFF3D9; }
  .menu-tile:nth-child(4) .menu-icon { color: #7A4A0E; background: #FFEAB8; }
  .menu-tile:nth-child(5) .menu-icon { color: #A0522D; background: #FFE4CC; }
  .menu-tile:nth-child(6) .menu-icon { color: #556B2F; background: #E8EED8; }
  .menu-tile:nth-child(7) .menu-icon { color: #8B4513; background: #FCE8D0; }
  .menu-tile:nth-child(8) .menu-icon { color: #B8860B; background: #FFF0B3; }
  .menu-label {
    font-size: 11px;
    color: var(--dark-wood);
    font-weight: 500;
    text-align: center;
  }

  /* ===== Page 5: Explore / Map (olive green theme) ===== */
  .explore-header {
    padding: 8px 20px 14px;
    background: linear-gradient(180deg, #E8EED8 0%, var(--cream) 100%);
  }
  .search-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(42, 26, 8, 0.06);
    margin-top: 12px;
    border: 0.5px solid rgba(138, 88, 16, 0.08);
  }
  .search-bar svg { color: #a89675; flex-shrink: 0; }
  .search-bar input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 14px;
    color: var(--dark-wood);
    font-family: inherit;
  }
  .search-bar input::placeholder { color: #c4b89c; }

  /* map area */
  .map-area {
    position: relative;
    height: 260px;
    margin: 0 20px;
    border-radius: 20px;
    overflow: hidden;
    background:
      radial-gradient(circle at 30% 40%, #D8E4B8 0%, #B8C98D 30%, #9DB26A 70%);
    box-shadow: var(--shadow-soft);
  }
  .map-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.15) 1px, transparent 1px);
    background-size: 30px 30px;
    opacity: 0.5;
  }
  .map-pin {
    position: absolute;
    width: 28px; height: 28px;
    transform: translate(-50%, -100%);
    cursor: pointer;
    animation: pinBounce 2.5s ease-in-out infinite;
  }
  .map-pin:nth-child(2) { animation-delay: 0.4s; }
  .map-pin:nth-child(3) { animation-delay: 0.8s; }
  .map-pin:nth-child(4) { animation-delay: 1.2s; }
  @keyframes pinBounce {
    0%, 100% { transform: translate(-50%, -100%); }
    50%      { transform: translate(-50%, calc(-100% - 6px)); }
  }
  .pin-dot {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, var(--honey-300), var(--honey-500));
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 3px solid white;
    box-shadow: 0 4px 12px rgba(138, 88, 16, 0.35);
    display: flex; align-items: center; justify-content: center;
  }
  .pin-inner {
    transform: rotate(45deg);
    font-size: 10px;
    font-weight: 700;
    color: white;
  }
  .pin-pulse {
    position: absolute;
    bottom: -4px; left: 50%;
    transform: translateX(-50%);
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--honey-400);
    opacity: 0.4;
    animation: pinPulseAnim 2s ease-out infinite;
  }
  @keyframes pinPulseAnim {
    0%   { transform: translateX(-50%) scale(1); opacity: 0.4; }
    100% { transform: translateX(-50%) scale(4); opacity: 0; }
  }

  /* nearby list */
  .nearby-section {
    padding: 20px 20px 0;
  }
  .nearby-item {
    display: flex; gap: 12px;
    padding: 12px;
    background: white;
    border-radius: 14px;
    margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(42, 26, 8, 0.05);
    border: 0.5px solid rgba(138, 88, 16, 0.06);
    cursor: pointer;
    transition: transform 0.2s;
  }
  .nearby-item:active { transform: scale(0.98); }
  .nearby-icon {
    width: 46px; height: 46px;
    border-radius: 12px;
    background: linear-gradient(135deg, #E8EED8, #B8C98D);
    display: flex; align-items: center; justify-content: center;
    color: var(--olive-dk);
    flex-shrink: 0;
  }
  .nearby-info { flex: 1; min-width: 0; }
  .nearby-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--dark-wood);
    margin-bottom: 2px;
  }
  .nearby-desc {
    font-size: 12px;
    color: #8a7556;
    margin-bottom: 4px;
  }
  .nearby-meta {
    display: flex; gap: 10px;
    font-size: 11px;
    color: var(--honey-600);
  }

  /* filter chips */
  .filter-chips {
    display: flex;
    gap: 8px;
    padding: 12px 20px 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filter-chips::-webkit-scrollbar { display: none; }
  .filter-chip {
    flex-shrink: 0;
    padding: 7px 14px;
    border-radius: 100px;
    background: white;
    border: 1px solid rgba(138, 88, 16, 0.12);
    font-size: 12px;
    font-weight: 500;
    color: #6b5636;
    cursor: pointer;
    transition: all 0.25s;
    white-space: nowrap;
  }
  .filter-chip.active {
    background: linear-gradient(135deg, var(--honey-400), var(--honey-500));
    color: white;
    border-color: transparent;
    box-shadow: 0 3px 10px rgba(217, 142, 28, 0.3);
  }

  /* ===== Page 6: Honey Shop (ecommerce / product) ===== */
  .shop-hero {
    margin: 12px 20px 18px;
    height: 150px;
    border-radius: 22px;
    background: linear-gradient(135deg, var(--honey-500) 0%, var(--honey-700) 100%);
    position: relative;
    overflow: hidden;
    padding: 22px;
    color: white;
    cursor: pointer;
    box-shadow: 0 12px 32px rgba(138, 88, 16, 0.3);
  }
  .shop-hero::before {
    content: '';
    position: absolute;
    right: -40px; bottom: -40px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,215,120,0.35) 0%, transparent 70%);
  }
  .shop-hero-tag {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.8;
    margin-bottom: 6px;
  }
  .shop-hero-title {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.15;
    margin-bottom: 8px;
    max-width: 70%;
  }
  .shop-hero-cta {
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(255, 251, 240, 0.25);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 6px 14px;
    border-radius: 100px;
    border: 1px solid rgba(255, 255, 255, 0.3);
  }

  .product-grid {
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .product-card {
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: var(--shadow-soft);
    border: 0.5px solid rgba(138, 88, 16, 0.08);
    cursor: pointer;
    transition: transform 0.25s;
  }
  .product-card:active { transform: scale(0.97); }
  .product-img {
    height: 110px;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .product-img svg {
    width: 50px; height: 50px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
  }
  .product-badge {
    position: absolute;
    top: 10px; left: 10px;
    padding: 3px 8px;
    border-radius: 100px;
    background: rgba(255, 251, 240, 0.9);
    font-size: 10px;
    font-weight: 600;
    color: var(--honey-600);
  }
  .product-info {
    padding: 10px 12px 12px;
  }
  .product-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--dark-wood);
    margin-bottom: 2px;
    line-height: 1.3;
  }
  .product-var {
    font-size: 10px;
    color: #a89675;
    margin-bottom: 6px;
  }
  .product-price-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .product-price {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--honey-600);
  }
  .product-price .cur {
    font-size: 10px;
    font-weight: 600;
    margin-right: 1px;
  }
  .product-add {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--honey-400);
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    font-weight: 500;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .product-add:active { transform: scale(0.85); }

  /* ===== Page 7: Design Spec ===== */
  .spec-page {
    padding-bottom: 40px;
  }
  .spec-hero {
    padding: 16px 20px 24px;
    background: linear-gradient(135deg, var(--honey-600), var(--honey-800));
    color: white;
    position: relative;
    overflow: hidden;
  }
  .spec-hero::before {
    content: '';
    position: absolute;
    right: -60px; top: -40px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,193,69,0.3) 0%, transparent 70%);
  }

/* ===== Utility: Animated Number ===== */
function AnimatedNumber({ value, duration = 1200, suffix = '', prefix = '', decimals = 0 }) {
  const [display, setDisplay] = useState(0);
  const rafRef = useRef(null);
  const startRef = useRef(null);

  useEffect(() => {
    startRef.current = null;
    const startVal = display;
    const endVal = value;

    const step = (ts) => {
      if (!startRef.current) startRef.current = ts;
      const progress = Math.min((ts - startRef.current) / duration, 1);
      // easeOutCubic
      const eased = 1 - Math.pow(1 - progress, 3);
      const current = startVal + (endVal - startVal) * eased;
      setDisplay(current);
      if (progress < 1) rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => cancelAnimationFrame(rafRef.current);
  }, [value, duration]);

  return (
    <span className="count-num">
      {prefix}{display.toFixed(decimals)}{suffix}
    </span>
  );
}

/* ===== Animated Progress Bar ===== */
function AnimatedGauge({ value, label, unit, color = 'honey', icon }) {
  const [width, setWidth] = useState(0);
  useEffect(() => {
    const t = setTimeout(() => setWidth(value), 200);
    return () => clearTimeout(t);
  }, [value]);

  return (
    <div className="gauge-row">
      <div className="gauge-icon" style={{
        background: color === 'olive' ? '#E8EED8' : color === 'cool' ? '#DFF2F5' : 'var(--honey-100)',
        color: color === 'olive' ? '#6B7F3E' : color === 'cool' ? '#3A8994' : 'var(--honey-600)',
      }}>
        {icon}
      </div>
      <div className="gauge-info">
        <div className="gauge-label">
          <span>{label}</span>
          <span style={{ color: 'var(--dark-wood)', fontWeight: 600 }}>
            {value}{unit}
          </span>
        </div>
        <div className="gauge-bar">
          <div
            className={`gauge-fill ${color === 'olive' ? 'olive' : color === 'cool' ? 'cool' : ''}`}
            style={{ width: `${width}%` }}
          />
        </div>
      </div>
    </div>
  );
}

/* ===== Ring Progress ===== */
function RingProgress({ value, max = 100, size = 56, stroke = 5, label, subtitle, colorStart, colorEnd }) {
  const [offset, setOffset] = useState(1);
  const radius = (size - stroke) / 2;
  const circumference = 2 * Math.PI * radius;
  const progress = value / max;
  const dashOffset = circumference * (1 - progress);

  useEffect(() => {
    const t = setTimeout(() => setOffset(dashOffset), 300);
    return () => clearTimeout(t);
  }, [dashOffset]);

  const gradId = `ring-grad-${Math.random().toString(36).slice(2, 8)}`;

  return (
    <div style={{ position: 'relative' }}>
      <svg width={size} height={size} className="ring-progress">
        <defs>
          <linearGradient id={gradId} x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor={colorStart || '#FFC145'} />
            <stop offset="100%" stopColor={colorEnd || '#B07115'} />
          </linearGradient>
        </defs>
        <circle
          cx={size/2} cy={size/2} r={radius}
          fill="none" strokeWidth={stroke}
          className="ring-bg"
        />
        <circle
          cx={size/2} cy={size/2} r={radius}
          fill="none" strokeWidth={stroke}
          stroke={`url(#${gradId})`}
          strokeLinecap="round"
          strokeDasharray={circumference}
          strokeDashoffset={offset}
          style={{ transition: 'stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)' }}
        />
      </svg>
      <div style={{
        position: 'absolute',
        inset: 0,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        flexDirection: 'column',
        pointerEvents: 'none',
      }}>
        {label && <div style={{
          fontFamily: "'Fraunces', serif",
          fontSize: Math.floor(size * 0.26),
          fontWeight: 700,
          color: 'var(--dark-wood)',
          lineHeight: 1,
        }}>{label}</div>}
        {subtitle && <div style={{
          fontSize: Math.max(8, Math.floor(size * 0.13)),
          color: '#8a7556',
          marginTop: 1,
        }}>{subtitle}</div>}
      </div>
    </div>
  );
}

/* ===== Honeycomb SVG decoration ===== */
function HoneycombPattern({ count = 5, color = '#D98E1C' }) {
  const cells = [];
  for (let i = 0; i < count; i++) {
    cells.push(
      <polygon
        key={i}
        points="25,5 45,17 45,39 25,51 5,39 5,17"
        stroke={color}
        strokeWidth="1.5"
        fill="none"
        opacity="0.4"
        style={{
          transformOrigin: 'center',
          animation: `combPulse ${3 + i * 0.4}s ease-in-out ${i * 0.2}s infinite`,
        }}
      />
    );
  }
  return (
    <svg width="100" height="100" viewBox="0 0 50 50" className="honeycomb-bg">
      {cells}
    </svg>
  );
}

  const [scrollY, setScrollY] = useState(0);

  useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    const handleScroll = () => {
      if (rafRef.current) return;
      rafRef.current = requestAnimationFrame(() => {
        setScrollY(el.scrollTop);
        rafRef.current = null;
      });
    };
    el.addEventListener('scroll', handleScroll, { passive: true });
    return () => el.removeEventListener('scroll', handleScroll);

  const headerScale = Math.max(1, 1 + scrollY / -300 * 0.15);

/* ===== Context Menu (long press) ===== */
function ContextMenu({ x, y, items, onClose }) {
  const menuRef = useRef(null);

  useEffect(() => {
    const handler = (e) => {
      if (menuRef.current && !menuRef.current.contains(e.target)) onClose();
    };
    setTimeout(() => document.addEventListener('click', handler), 0);
    return () => document.removeEventListener('click', handler);
  }, [onClose]);

  return (
    <div
      ref={menuRef}
      className="context-menu"
      style={{ left: x, top: y }}
    >
      {items.map((item, i) => (
        <div key={i} className="context-item" onClick={() => { item.onClick?.(); onClose(); }}>
          {item.icon}
          {item.label}
        </div>
      ))}
    </div>
  );
}

function MielApp() {
  const [page, setPage] = useState('home');
  const [selectedHive, setSelectedHive] = useState(null);
  const [contextMenu, setContextMenu] = useState(null);
  const [toast, setToast] = useState({ show: false, msg: '' });
  const [pageKey, setPageKey] = useState(0);
  const visibilityRef = useRef(true);

  const showToast = useCallback((msg) => {
    setToast({ show: true, msg });
    setTimeout(() => setToast(t => ({ ...t, show: false })), 2200);
  }, []);

  // visibility change handling
  useEffect(() => {
    const handleVisibility = () => {
      visibilityRef.current = !document.hidden;
    };
    document.addEventListener('visibilitychange', handleVisibility);
    return () => document.removeEventListener('visibilitychange', handleVisibility);
  }, []);

  // announce upgrade
  useEffect(() => {
    function announceUpgrade() {
      window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    }
    announceUpgrade();
    if (document.readyState !== 'complete')
      window.addEventListener('load', announceUpgrade, { once: true });
  }, []);

  const switchPage = (p) => {
    setPage(p);
    setSelectedHive(null);
    setPageKey(k => k + 1);
    setContextMenu(null);
  };

  const openHive = (hive) => {
    setSelectedHive(hive);
    setPage('detail');
    setPageKey(k => k + 1);
  };

  const handleLongPress = (e, hive) => {
    setContextMenu({
      x: e.clientX - e.currentTarget.getBoundingClientRect().left + e.currentTarget.offsetLeft,
      y: e.clientY - e.currentTarget.getBoundingClientRect().top + e.currentTarget.offsetTop,
      items: [
        { icon: Icon.eye, label: '查看详情', onClick: () => openHive(hive) },
        { icon: Icon.award, label: '查看报告', onClick: () => showToast('正在生成健康报告...') },
        { icon: Icon.camera, label: '添加照片', onClick: () => showToast('相机已启动') },
        { icon: Icon.settings, label: '蜂箱设置', onClick: () => showToast('打开设置...') },
      ],
    });
  };

  const tabChange = (key) => {
    if (key === 'home' || key === 'explore' || key === 'community' || key === 'shop' || key === 'profile') {
      switchPage(key);
    }
  };

  // Pages list for page dots
  const pages = [
    { key: 'home', label: '首页' },
    { key: 'explore', label: '探索' },
    { key: 'community', label: '社区' },
    { key: 'shop', label: '商城' },
    { key: 'profile', label: '我的' },
    { key: 'detail', label: '详情' },
    { key: 'spec', label: '设计规范' },
    { key: 'api', label: '接口文档' },
  ];

  const currentPageIdx = pages.findIndex(p => p.key === page);

  const renderPage = () => {
    switch (page) {
      case 'home':
        return <HomePage key={pageKey} onOpenHive={openHive} onLongPress={handleLongPress} />;
      case 'explore':
        return <ExplorePage key={pageKey} />;
      case 'community':
        return <CommunityPage key={pageKey} />;
      case 'shop':
        return <ShopPage key={pageKey} />;
      case 'profile':
        return <ProfilePage key={pageKey} />;
      case 'detail':
        return <HiveDetailPage key={pageKey} hive={selectedHive || HIVES[0]} onBack={() => switchPage('home')} />;
      case 'spec':
        return <DesignSpecPage key={pageKey} />;
      case 'api':
        return <ApiDocsPage key={pageKey} />;
      default:
        return <HomePage key={pageKey} onOpenHive={openHive} onLongPress={handleLongPress} />;
    }
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 20, position: 'relative' }}>
      {/* Page switcher (above phone) */}
      <div style={{
        display: 'flex', gap: 6, flexWrap: 'wrap',
        justifyContent: 'center',
        maxWidth: 450,
      }}>
        {pages.map((p, i) => (
          <button
            key={p.key}
            onClick={() => switchPage(p.key)}
            style={{
              padding: '6px 14px',
              borderRadius: 100,
              border: '1px solid',
              borderColor: currentPageIdx === i ? 'var(--honey-400)' : 'rgba(255, 220, 150, 0.2)',
              background: currentPageIdx === i
                ? 'linear-gradient(135deg, #F5A623, #D98E1C)'
                : 'rgba(255, 251, 240, 0.06)',
              color: currentPageIdx === i ? 'white' : 'rgba(255, 220, 150, 0.6)',
              fontSize: 12,
              fontWeight: currentPageIdx === i ? 600 : 500,
              cursor: 'pointer',
              transition: 'all 0.25s',
              fontFamily: 'inherit',
            }}
          >
            {i + 1}. {p.label}
          </button>
        ))}
      </div>

      {/* Phone frame */}
      <div style={{ position: 'relative' }}>
        <IOSDevice width={390} height={844}>
          <div style={{ position: 'relative', width: '100%', height: '100%' }}>
            {renderPage()}

            {/* Context menu */}
            {contextMenu && (
              <ContextMenu
                x={contextMenu.x}
                y={contextMenu.y}
                items={contextMenu.items}
                onClose={() => setContextMenu(null)}
              />
            )}

            {/* Toast */}
            <Toast message={toast.msg} show={toast.show} />
          </div>
        </IOSDevice>
      </div>

      {/* Bottom label */}
      <div style={{
        fontSize: 11,
        color: 'rgba(255, 220, 150, 0.4)',
        letterSpacing: 2,
        textTransform: 'uppercase',
        fontWeight: 500,
      }}>
        形态：原生 App · iOS 26 · 蜂蜜金配色
      </div>
    </div>
  );
}

// ===== Render =====
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<MielApp />);

/* ===== Custom Cursor ===== */
(function initCursor() {
  const cursor = document.getElementById('cursor');
  if (!cursor) return;

  let mx = window.innerWidth / 2;
  let my = window.innerHeight / 2;
  let cx = mx, cy = my;
  let raf = null;
  let visible = true;

  // start in center
  cursor.style.left = mx + 'px';
  cursor.style.top = my + 'px';

  const animate = () => {
    if (!visible) { raf = null; return; }
    // ease towards target
    cx += (mx - cx) * 0.2;
    cy += (my - cy) * 0.2;
    cursor.style.left = cx + 'px';
    cursor.style.top = cy + 'px';
    raf = requestAnimationFrame(animate);
  };

  const startAnim = () => {
    if (!raf) raf = requestAnimationFrame(animate);
  };

  document.addEventListener('mousemove', (e) => {
    mx = e.clientX;
    my = e.clientY;
    startAnim();
  });

  // hover on interactive elements
  document.addEventListener('mouseover', (e) => {
    const el = e.target.closest('button, .nav-btn, .tab-item, .card-honey, .mini-hive-card, .activity-item, .post-card, .nearby-item, .product-card, .filter-chip, .menu-tile, .community-tab, .fab, .detail-back, .section-more, .honey-chip, .product-add, .api-endpoint-header, .spotlight-follow, .shop-hero, .beekeeper-spotlight');
    if (el) cursor.classList.add('hover');
  });
  document.addEventListener('mouseout', (e) => {
    const el = e.target.closest('button, .nav-btn, .tab-item, .card-honey, .mini-hive-card, .activity-item, .post-card, .nearby-item, .product-card, .filter-chip, .menu-tile, .community-tab, .fab, .detail-back, .section-more, .honey-chip, .product-add, .api-endpoint-header, .spotlight-follow, .shop-hero, .beekeeper-spotlight');
    if (el) cursor.classList.remove('hover');
  });

  // click ripple
  document.addEventListener('mousedown', (e) => {
    cursor.classList.add('click');
    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 700);
  });
  document.addEventListener('mouseup', () => {
    cursor.classList.remove('click');
  });

  // visibilitychange: pause animation
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      visible = false;
      if (raf) { cancelAnimationFrame(raf); raf = null; }
    } else {
      visible = true;
      startAnim();
    }
  });

  startAnim();
})();

/* ===== Global keyframes (honeycomb pulse) ===== */
const extraStyles = document.createElement('style');
extraStyles.textContent = `
  @keyframes combPulse {
    0%, 100% { transform: scale(1); opacity: 0.4; }
    50% { transform: scale(1.08); opacity: 0.6; }
  }
`;
document.head.appendChild(extraStyles);

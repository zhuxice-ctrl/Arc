  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {

    color: #1F2937;
  }
  #root { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }

  /* ── Custom cursor ── */
  .cursor-outer {
    position: fixed; width: 36px; height: 36px;
    border: 2px solid #fff; border-radius: 50%;
    pointer-events: none; z-index: 2147483647;
    transform: translate(-50%, -50%);
    transition: width 0.25s cubic-bezier(.3,.7,.4,1), height 0.25s cubic-bezier(.3,.7,.4,1),
                border-color 0.25s, background 0.25s;
    mix-blend-mode: difference;
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.4));
  }
  .cursor-inner {
    position: fixed; width: 6px; height: 6px;
    background: #E8873B; border-radius: 50%;
    pointer-events: none; z-index: 2147483647;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 12px #E8873B, 0 0 24px rgba(232,135,59,0.5);
  }
  .cursor-hover .cursor-outer {
    width: 56px; height: 56px;
    border-color: #E8873B;
    background: rgba(232,135,59,0.08);
  }
  .cursor-ripple {
    position: fixed; width: 10px; height: 10px;
    border: 2px solid #fff; border-radius: 50%;
    pointer-events: none; z-index: 2147483646;
    transform: translate(-50%, -50%);
    animation: rippleOut 0.6s cubic-bezier(.2,.7,.3,1) forwards;
    mix-blend-mode: difference;
  }
  @keyframes rippleOut {
    0% { width: 10px; height: 10px; opacity: 0.8; }
    100% { width: 80px; height: 80px; opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cursor-outer, .cursor-inner, .cursor-ripple { display: none; }
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* ── Stage ── */
  .stage {
    position: relative;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 24px;
    padding: 40px;
    width: 100%; height: 100%;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(232,135,59,0.08), transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(31,77,61,0.4), transparent 60%),
      #0d1a15;
    overflow: auto;
  }
  .stage-title {
    color: #F7F2E8;
    font-family: 'Noto Serif SC', serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-align: center;
    opacity: 0.9;
  }
  .stage-sub {
    color: #9CA3AF;
    font-size: 13px;
    text-align: center;
    margin-top: -16px;
    letter-spacing: 0.05em;
  }
  .page-nav {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    max-width: 560px;
  }
  .page-nav button {
    padding: 7px 14px;
    font-size: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.04);
    color: #d1d5db;
    border-radius: 999px;
    cursor: pointer;
    font-family: 'Noto Sans SC', sans-serif;
    transition: all 0.2s;
    backdrop-filter: blur(8px);
  }
  .page-nav button.active {
    background: #E8873B;
    border-color: #E8873B;
    color: #fff;
    box-shadow: 0 4px 12px rgba(232,135,59,0.3);
  }
  .page-nav button:hover { background: rgba(255,255,255,0.08); }
  .page-nav button.active:hover { background: #F2944D; }

  /* ── Feather particles (signature) ── */
  .feather-particle {
    position: absolute;
    width: 14px; height: 14px;
    pointer-events: none;
    opacity: 0.4;
    animation: featherFloat linear infinite;
  }
  @keyframes featherFloat {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
    10% { opacity: 0.5; }
    90% { opacity: 0.3; }
    100% { transform: translateY(calc(100vh + 40px)) rotate(360deg); opacity: 0; }
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 0; height: 0; }

  /* ── Animation utilities ── */
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes slideInRight {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }
  @keyframes slideOutRight {
    from { transform: translateX(0); }
    to { transform: translateX(100%); }
  }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

  @keyframes pulseGlow {

  }

const springEase = (t) => {
  const c4 = (2 * Math.PI) / 3;
  return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
};

// ── Custom Cursor ──
function CustomCursor() {
  const outerRef = useRef(null);
  const innerRef = useRef(null);
  const posRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const targetRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const rafRef = useRef(null);
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  useEffect(() => {
    if (reduced) return;
    const move = (e) => {
      targetRef.current = { x: e.clientX, y: e.clientY };
    };
    const hover = (e) => {
      const t = e.target.closest('button, a, [role="button"], .clickable, input, textarea, select');
      if (t) document.body.classList.add('cursor-hover');
    };
    const leave = (e) => {
      if (!e.target.closest('button, a, [role="button"], .clickable, input, textarea, select')) return;
      document.body.classList.remove('cursor-hover');
    };
    const click = (e) => {
      const r = document.createElement('div');
      r.className = 'cursor-ripple';
      r.style.left = e.clientX + 'px';
      r.style.top = e.clientY + 'px';
      document.body.appendChild(r);
      setTimeout(() => r.remove(), 600);
    };

    const animate = () => {
      const p = posRef.current;
      const t = targetRef.current;
      // lerp with damping (smoother follow)
      p.x += (t.x - p.x) * 0.18;
      p.y += (t.y - p.y) * 0.18;
      if (outerRef.current) {
        outerRef.current.style.left = p.x + 'px';
        outerRef.current.style.top = p.y + 'px';
      }
      if (innerRef.current) {
        innerRef.current.style.left = t.x + 'px';
        innerRef.current.style.top = t.y + 'px';
      }
      rafRef.current = requestAnimationFrame(animate);
    };
    rafRef.current = requestAnimationFrame(animate);

    window.addEventListener('mousemove', move);
    document.addEventListener('mouseover', hover);
    document.addEventListener('mouseout', leave);
    document.addEventListener('click', click);

    const vis = () => {
      if (document.hidden) {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      } else {
        rafRef.current = requestAnimationFrame(animate);
      }
    };
    document.addEventListener('visibilitychange', vis);

    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      window.removeEventListener('mousemove', move);
      document.removeEventListener('mouseover', hover);
      document.removeEventListener('mouseout', leave);
      document.removeEventListener('click', click);
      document.removeEventListener('visibilitychange', vis);
    };
  }, [reduced]);

  if (reduced) return null;
  return (
    <>
      <div ref={outerRef} className="cursor-outer" />
      <div ref={innerRef} className="cursor-inner" />
    </>
  );
}

// ── Feather Particles (signature ambient) ──
function FeatherParticles({ count = 12, show = true }) {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!show || reduced) return null;
  return (
    <div style={{ position: 'absolute', inset: 0, overflow: 'hidden', pointerEvents: 'none' }}>
      {Array.from({ length: count }).map((_, i) => {
        const left = Math.random() * 100;
        const duration = 12 + Math.random() * 18;
        const delay = -Math.random() * 20;
        const size = 8 + Math.random() * 10;
        const opacity = 0.15 + Math.random() * 0.25;
        return (
          <div key={i} className="feather-particle"
            style={{
              left: left + '%',
              width: size, height: size,
              animationDuration: duration + 's',
              animationDelay: delay + 's',
              opacity,
            }}>
            <svg viewBox="0 0 24 24" width={size} height={size} fill="none">
              <path d="M20 4c-3 0-7 2-9 6s-4 8-6 9l3 3c1-2 3-5 6-7s6-6 6-9z"
                    stroke={i % 2 ? '#E8873B' : '#F7F2E8'} strokeWidth="1.5" strokeLinejoin="round" opacity="0.6"/>
            </svg>
          </div>
        );
      })}
    </div>
  );
}

// ── Animated Number (count-up) ──
function AnimatedNumber({ value, duration = 1200, suffix = '', prefix = '', decimals = 0 }) {
  const [display, setDisplay] = useState(0);
  const rafRef = useRef(null);
  const startTimeRef = useRef(null);
  const startValRef = useRef(0);

  useEffect(() => {
    startValRef.current = display;
    startTimeRef.current = null;
    const step = (ts) => {
      if (!startTimeRef.current) startTimeRef.current = ts;
      const t = Math.min(1, (ts - startTimeRef.current) / duration);
      const eased = springEase(t);
      const v = startValRef.current + (value - startValRef.current) * eased;
      setDisplay(v);
      if (t < 1) rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    const vis = () => {
      if (document.hidden && rafRef.current) cancelAnimationFrame(rafRef.current);
      else if (!document.hidden) rafRef.current = requestAnimationFrame(step);
    };
    document.addEventListener('visibilitychange', vis);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      document.removeEventListener('visibilitychange', vis);
    };
  }, [value, duration]);

  return <span>{prefix}{display.toFixed(decimals)}{suffix}</span>;
}

// ── Circular Progress Ring ──
function CircularRing({ value = 70, max = 100, size = 120, stroke = 8, color = '#E8873B', bg = '#E5E7EB', label, sub }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const [progress, setProgress] = useState(0);
  const rafRef = useRef(null);

  useEffect(() => {
    const target = value / max;
    let start = null;
    const step = (ts) => {
      if (!start) start = ts;
      const t = Math.min(1, (ts - start) / 1400);
      const eased = springEase(t);
      setProgress(target * eased);
      if (t < 1) rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [value, max]);

  const offset = c * (1 - progress);
  return (
    <div style={{ position: 'relative', width: size, height: size, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} stroke={bg} strokeWidth={stroke} fill="none" />
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
                strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
                style={{ filter: `drop-shadow(0 0 6px ${color}80)` }}/>
      </svg>
      <div style={{ position: 'absolute', textAlign: 'center' }}>
        {label && <div style={{ fontSize: size * 0.28, fontWeight: 700, color: '#1F2937', lineHeight: 1 }}>{label}</div>}
        {sub && <div style={{ fontSize: 11, color: '#6B7280', marginTop: 2 }}>{sub}</div>}
      </div>
    </div>
  );
}

  useEffect(() => { setMounted(true); }, []);

  // Pull-to-refresh (signature: elastic bounce)
  const onTouchStart = (e) => {
    if (scrollRef.current?.scrollTop === 0) startY.current = e.touches[0].clientY;
  };
  const onTouchMove = (e) => {
    if (scrollRef.current?.scrollTop === 0 && startY.current) {
      const delta = e.touches[0].clientY - startY.current;
      if (delta > 0) {
        // resistance (damping curve)
        const resisted = Math.min(80, delta * 0.45);
        setPullY(resisted);
      }
    }

  const onTouchEnd = () => {
    if (pullY > 60 && !refreshing) {
      setRefreshing(true);
      setPullY(50);
      setTimeout(() => {
        setRefreshing(false);
        setPullY(0);

// ── Main App ──
function App() {
  const [activeTab, setActiveTab] = useState('home');
  const [stack, setStack] = useState([]); // navigation stack
  const [currentPage, setCurrentPage] = useState('home');
  const [pageData, setPageData] = useState(null);
  const [showToast, setShowToast] = useState(null);
  const [pageTransition, setPageTransition] = useState('fade');

  const navigate = useCallback((page, data = null) => {
    // Pages that push to stack (with back button)
    const stackPages = ['bird-detail', 'add', 'spec', 'api'];
    if (stackPages.includes(page)) {
      setStack(prev => [...prev, { page: currentPage, data: pageData }]);
      setPageTransition('slideRight');
    } else {
      setPageTransition('fade');
    }
    setCurrentPage(page);
    setPageData(data);
  }, [currentPage, pageData]);

  const goBack = useCallback(() => {
    if (stack.length > 0) {
      const prev = stack[stack.length - 1];
      setStack(s => s.slice(0, -1));
      setCurrentPage(prev.page);
      setPageData(prev.data);
      setPageTransition('slideLeft');
    }
  }, [stack]);

  const handleTabChange = useCallback((tab) => {
    if (tab === 'add') {
      navigate('add');
    } else {
      setStack([]);
      setActiveTab(tab);
      setCurrentPage(tab);
      setPageData(null);
      setPageTransition('fade');
    }
  }, [navigate]);

  const showToastMsg = (msg) => {
    setShowToast(msg);
    setTimeout(() => setShowToast(null), 2000);
  };

  const handleAddComplete = () => {
    showToastMsg('记录已保存 ✓');
    setStack([]);
    setActiveTab('home');
    setCurrentPage('home');
    setPageData(null);
  };

  // Determine which content to show
  const renderPage = () => {
    switch (currentPage) {
      case 'home':
        return <HomePage key="home" onNavigate={navigate} />;
      case 'guide':
        return <GuidePage key="guide" onNavigate={navigate} />;
      case 'map':
        return <MapPage key="map" onNavigate={navigate} />;
      case 'profile':
        return <ProfilePage key="profile" onNavigate={navigate} />;
      case 'bird-detail':
        return <BirdDetailPage key="bird-detail" bird={pageData || BIRDS[0]} onBack={goBack} />;
      case 'add':
        return <AddRecordPage key="add" onBack={goBack} onComplete={handleAddComplete} />;
      case 'spec':
        return <SpecPage key="spec" onBack={goBack} />;
      case 'api':
        return <ApiPage key="api" onBack={goBack} />;
      default:
        return <HomePage onNavigate={navigate} />;
    }
  };

  const showTabBar = ['home', 'guide', 'map', 'profile'].includes(currentPage);

  return (
    <div className="stage">
      <FeatherParticles count={8} show={true} />

      <div className="stage-title">羽踪</div>
      <div className="stage-sub">观鸟记录 Native App · V2 手机 UI</div>

      {/* Page nav */}
      <div className="page-nav">
        {[
          { k: 'home', l: '首页' },
          { k: 'guide', l: '图鉴' },
          { k: 'bird-detail', l: '详情', data: BIRDS[0] },
          { k: 'add', l: '新增记录' },
          { k: 'map', l: '地点' },
          { k: 'profile', l: '我的' },
          { k: 'spec', l: '设计规范' },
          { k: 'api', l: '接口文档' },
        ].map(p => (
          <button key={p.k}
            className={`clickable ${currentPage === p.k ? 'active' : ''}`}
            onClick={() => {
              setStack([]);
              if (['home','guide','map','profile'].includes(p.k)) setActiveTab(p.k);
              setCurrentPage(p.k);
              setPageData(p.data || null);
            }}>
            {p.l}
          </button>
        ))}
      </div>

      {/* Phone */}
      <div style={{
        position: 'relative',
        filter: 'drop-shadow(0 30px 60px rgba(0,0,0,0.4))',
      }}>
        <div style={{
          width: 390, height: 844, borderRadius: 48, overflow: 'hidden',
          position: 'relative', background: C.surface,
          border: '1px solid rgba(255,255,255,0.1)',
          fontFamily: "'Noto Sans SC', -apple-system, system-ui, sans-serif",
          WebkitFontSmoothing: 'antialiased',
          '--ios-safe-top': '62px',
          '--ios-safe-bottom': '34px',
        }}>
          {/* Dynamic Island */}
          <div style={{
            position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
            width: 120, height: 35, borderRadius: 22, background: '#000', zIndex: 200,
          }} />

          {/* Status bar */}
          <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 100, pointerEvents: 'none' }}>
            <div style={{
              display: 'flex', justifyContent: 'space-between', alignItems: 'center',
              padding: '18px 28px 16px', fontSize: 15, fontWeight: 600,
              color: currentPage === 'bird-detail' ? '#fff' : C.text,
              fontFamily: '-apple-system, system-ui',
            }}>
              <span>9:41</span>
              <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                <svg width="17" height="11" viewBox="0 0 17 11">
                  <rect x="0" y="7" width="3" height="4" rx="0.5" fill="currentColor"/>
                  <rect x="4.7" y="5" width="3" height="6" rx="0.5" fill="currentColor"/>
                  <rect x="9.4" y="2.5" width="3" height="8.5" rx="0.5" fill="currentColor"/>
                  <rect x="14" y="0" width="3" height="11" rx="0.5" fill="currentColor"/>
                </svg>
                <svg width="25" height="12" viewBox="0 0 25 12">
                  <rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" strokeOpacity="0.4" fill="none"/>
                  <rect x="2" y="2" width="18" height="8" rx="1.5" fill="currentColor"/>
                  <path d="M23 4V8c0.8-0.3 1.5-1.2 1.5-2s-0.7-1.7-1.5-2z" fill="currentColor" opacity="0.4"/>
                </svg>
              </div>
            </div>
          </div>

          {/* Screen content */}
          <div style={{
            height: '100%', display: 'flex', flexDirection: 'column',
            position: 'relative', isolation: 'isolate',
            animation: pageTransition === 'slideRight' ? 'slideInRight 0.35s cubic-bezier(.3,.7,.4,1)' :
                       pageTransition === 'slideLeft' ? 'slideOutLeft 0.35s cubic-bezier(.3,.7,.4,1)' :
                       'fadeIn 0.3s',
          }}>
            <style>{`@keyframes slideOutLeft { from { transform: translateX(-30%); opacity: 0.3; } to { transform: translateX(0); opacity: 1; } }`}</style>
            {renderPage()}
            {showTabBar && (
              <TabBar active={activeTab} onChange={handleTabChange} dark={false} />
            )}
          </div>

          {/* Home indicator */}
          <div style={{
            position: 'absolute', bottom: 8, left: '50%', transform: 'translateX(-50%)',
            width: 134, height: 5, borderRadius: 100,
            background: currentPage === 'bird-detail' ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.2)',
            zIndex: 300, pointerEvents: 'none',
          }} />

          {/* Toast */}
          {showToast && (
            <div style={{
              position: 'absolute', top: 100, left: '50%', transform: 'translateX(-50%)',
              zIndex: 500,
              animation: 'bounceIn 0.4s cubic-bezier(.3,.7,.4,1)',
            }}>
              <div style={{
                background: 'rgba(15,25,20,0.9)', backdropFilter: 'blur(12px)',
                color: '#fff', padding: '10px 20px', borderRadius: 999,
                fontSize: 14, fontWeight: 500,
                boxShadow: '0 4px 20px rgba(0,0,0,0.2)',
                display: 'flex', alignItems: 'center', gap: 8,
              }}>
                {Icon.Check(16, C.accentSoft)} {showToast}
              </div>
            </div>
          )}
        </div>
      </div>

      <CustomCursor />
    </div>
  );
}

// ── Render ──

root.render(<App />);

function announceUpgrade() {
  try {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  } catch (e) { /* ignore */ }
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>纹枰 — 围棋打谱 App</title>

  <!-- 字体 -->
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" />

  <!-- React & Babel -->
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #2C1810;
      overflow: hidden;
      font-family: "LXGW WenKai", "KaiTi", "STKaiti", serif;
      cursor: none;
    }
    #root {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at center, #3d2817 0%, #1a0f08 100%);
      padding: 20px;
    }
    /* 隐藏原生滚动条但保留功能 */
    ::-webkit-scrollbar {
      width: 0;
      height: 0;
    }
    /* 全局动画关键帧 */
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes tabFadeIn {
      0% { opacity: 0; transform: translateY(4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes toastIn {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes collectFly {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -120px) scale(0.4); opacity: 0; }
    }
    @keyframes brilliantPulse {
      0% { opacity: 0; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0; transform: scale(1.2); }
    }
    @keyframes brilliantFade {
      0% { opacity: 0; }
      30% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    /* 适配 reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
    /* 设备容器 */
    .device-wrapper {
      position: relative;
      width: 390px;
      height: 844px;
      max-width: 100%;
      max-height: 100%;
    }
    /* 尺寸信息 */
    .size-label {
      position: absolute;
      top: -32px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(245,241,232,0.4);
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      white-space: nowrap;
    }
    /* 360px 邻尺寸不破版测试：.device-wrapper 可缩放到 360px */
    @media (max-width: 420px) {
      #root {
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- 数据层 -->
  <script src="data/games.js"></script>

  <!-- 组件 -->
  <script type="text/babel" src="components/ios-frame.jsx"></script>
  <script type="text/babel" src="components/GoBoard.jsx"></script>
  <script type="text/babel" src="components/AppShell.jsx"></script>

  <!-- 页面 -->
  <script type="text/babel" src="pages/Tabs.jsx"></script>
  <script type="text/babel" src="pages/GameView.jsx"></script>
  <script type="text/babel" src="pages/SpecPages.jsx"></script>

  <!-- 主应用 -->
  <script type="text/babel" src="App.jsx"></script>

  <!-- 入口 -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // 可选：360px 邻近尺寸模式（默认 390）
      const [deviceWidth, setDeviceWidth] = useState(390);

      useEffect(() => {
        // 宣告可升级
        function announceUpgrade() {
          window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
        }
        announceUpgrade();
        if (document.readyState !== 'complete') {
          window.addEventListener('load', announceUpgrade, { once: true });
        }
      }, []);

      return (
        <div style={{ position: 'relative' }}>
          <div className="size-label">纹枰 v2.0 · {deviceWidth} × 844</div>
          <div className="device-wrapper" style={{ width: deviceWidth, height: 844 }}>
            <window.IOSDevice width={deviceWidth} height={844}>
              <WenPingApp />
            </window.IOSDevice>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

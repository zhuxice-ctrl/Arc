  /* ─── reduced motion ─── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ─── hide scrollbar but allow scroll ─── */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* ─── page transition ─── */
  .page-enter {
    animation: pageSlideIn 320ms cubic-bezier(0.32, 0.72, 0, 1);
  }
  .page-enter-back {
    animation: pageSlideBack 320ms cubic-bezier(0.32, 0.72, 0, 1);
  }
  @keyframes pageSlideIn {
    from { transform: translateX(30%); opacity: 0.5; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes pageSlideBack {
    from { transform: translateX(-20%); opacity: 0.6; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* ─── marquee scroll (film strip titles) ─── */
  @keyframes marqueeScroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .marquee-track {
    animation: marqueeScroll 40s linear infinite;
  }

  /* ─── ticket stub flip ─── */
  .ticket-card {
    transform-style: preserve-3d;
    transition: transform 800ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .ticket-face {
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .ticket-back {
    transform: rotateY(180deg);
  }
  .ticket-flipped {
    transform: rotateY(180deg);
  }

  /* ─── fade in stagger ─── */
  @keyframes fadeUpIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fadeUpIn 600ms cubic-bezier(0.2, 0, 0, 1) both; }

  /* ─── projector beam ─── */
  @keyframes beamPulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 0.9; }
  }
  @keyframes dustFloat {
    0% { transform: translate(0, 0) scale(1); opacity: 0; }
    10% { opacity: 0.6; }
    100% { transform: translate(30px, -80px) scale(0.4); opacity: 0; }
  }
  .projector-beam {
    animation: beamPulse 4s ease-in-out infinite;
  }
  .dust-particle {
    animation: dustFloat 6s ease-out infinite;
  }

  /* ─── film reel spin ─── */
  @keyframes reelSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .reel-spin {
    animation: reelSpin 20s linear infinite;
  }

  /* ─── parallax hero shadow ─── */
  .hero-parallax-img {
    will-change: transform;
  }

  /* ─── modal sheet ─── */
  .sheet-enter {
    animation: sheetSlideUp 380ms cubic-bezier(0.32, 0.72, 0, 1);
  }
  @keyframes sheetSlideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .sheet-backdrop-enter {
    animation: fadeIn 280ms ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* ─── tab switch ─── */
  .tab-content {
    animation: tabFadeIn 300ms ease-out;
  }
  @keyframes tabFadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ─── ticket tear perforation ─── */
  .ticket-perf {
    background-image: radial-gradient(circle, #1A1512 3px, transparent 3.5px);
    background-size: 10px 10px;
    background-repeat: repeat-x;
    background-position: center;
  }

  /* ─── pulsing gold dot (live indicator) ─── */
  @keyframes livePulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(212,162,78,0.6); }
    50% { box-shadow: 0 0 0 6px rgba(212,162,78,0); }
  }
  .live-dot {
    animation: livePulse 2s ease-in-out infinite;
  }

  /* ─── long-press hint ─── */
  .pressable:active {
    transform: scale(0.97);
    transition: transform 120ms ease-out;
  }
</style>

  const rafRef = useRef(null);
  const visibleRef = useRef(true);
  const [showSearch, setShowSearch] = useState(false);

  // 放映机光束尘埃粒子动画
  useEffect(() => {
    if (reducedMotion) return;
    visibleRef.current = true;
    let particles = [];
    const container = beamRef.current;
    if (!container) return;

    function spawnParticle() {
      if (!visibleRef.current) return;
      if (particles.length > 8) return;
      const el = document.createElement('div');
      const left = 20 + Math.random() * 60;
      const delay = Math.random() * 2;
      const size = 2 + Math.random() * 3;
      el.style.cssText = `
        position: absolute;
        left: ${left}%;
        bottom: 0;
        width: ${size}px;
        height: ${size}px;
        border-radius: 50%;
        background: rgba(212,162,78,0.6);
        animation: dustFloat ${5 + Math.random() * 3}s ease-out ${delay}s forwards;
      `;
      container.appendChild(el);
      particles.push(el);
      setTimeout(() => {
        if (el.parentNode) el.parentNode.removeChild(el);
        particles = particles.filter(p => p !== el);
      }, 8000);
    }

    const interval = setInterval(spawnParticle, 800);

    const handleVisibility = () => {
      visibleRef.current = !document.hidden;
    };
    document.addEventListener('visibilitychange', handleVisibility);

    return () => {
      visibleRef.current = false;
      clearInterval(interval);
      document.removeEventListener('visibilitychange', handleVisibility);
      particles.forEach(p => p.parentNode && p.parentNode.removeChild(p));
    };
  }, [reducedMotion]);

  const marqueeFilms = [...FILMS, ...FILMS];

   布局：Hero 大图视差 + 信息 + 导演手记 + 场次选择 + 悬浮购票按钮
   签名动效：海报视差滚动
   ================================================================ */
function FilmDetailPage({ film, onBack, reducedMotion, onBuyTicket }) {
  const scrollRef = useRef(null);
  const [scrollY, setScrollY] = useState(0);
  const rafRef = useRef(null);
  const visibleRef = useRef(true);
  const [activeTime, setActiveTime] = useState(null);
  const [showConfirm, setShowConfirm] = useState(false);
  const showtimes = SHOWTIMES[film.id] || [];

  // 视差滚动 — 直接操作 DOM transform
  useEffect(() => {
    if (reducedMotion) return;
    visibleRef.current = true;
    const el = scrollRef.current;
    if (!el) return;

    let ticking = false;
    function onScroll() {
      if (!visibleRef.current) return;
      if (!ticking) {
        rafRef.current = requestAnimationFrame(() => {
          const y = el.scrollTop;
          setScrollY(y);
          // 直接操作海报 transform
          const poster = document.getElementById('hero-poster');
          const header = document.getElementById('detail-header');
          if (poster) {
            const scale = Math.max(1, 1 + y * -0.001);
            const translateY = Math.min(0, y * 0.3);
            poster.style.transform = `translateY(${-translateY}px) scale(${scale})`;
          }
          if (header) {
            const opacity = Math.min(1, Math.max(0, (y - 120) / 80));
            header.style.opacity = opacity;
          }
          ticking = false;
        });
        ticking = true;
      }
    }
    el.addEventListener('scroll', onScroll, { passive: true });

    const handleVisibility = () => {
      visibleRef.current = !document.hidden;
    };
    document.addEventListener('visibilitychange', handleVisibility);

    return () => {
      visibleRef.current = false;
      el.removeEventListener('scroll', onScroll);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      document.removeEventListener('visibilitychange', handleVisibility);
    };
  }, [reducedMotion, film.id]);

  const [flipped, setFlipped] = useState({});

  const displayed = selectedTab === 'all'

      ? tickets.filter(t => t.isUsed)
      : tickets.filter(t => !t.isUsed);

    setFlipped(prev => ({ ...prev, [id]: !prev[id] }));
  };

  // 长按快捷菜单 — 通过长按模拟
  const longPressRef = useRef(null);
  const [contextMenu, setContextMenu] = useState(null);

  const handleLongPressStart = (e, ticket) => {
    longPressRef.current = setTimeout(() => {
      setContextMenu(ticket.id);
    }, 500);
  };
  const handleLongPressEnd = () => {
    if (longPressRef.current) {
      clearTimeout(longPressRef.current);
      longPressRef.current = null;
    }
  };

  return (
    <div style={{
      flex: 1, display: 'flex', flexDirection: 'column',
      background: COLORS.deepBlack,

          display: 'flex', gap: 4,
          padding: '0 16px 12px',
        }}>
          {[
            { id: 'all', label: '全部', count: tickets.length },
            { id: 'unused', label: '待入场', count: tickets.filter(t => !t.isUsed).length },
            { id: 'used', label: '已收藏', count: tickets.filter(t => t.isUsed).length },

            <button
              key={tab.id}
              onClick={() => setSelectedTab(tab.id)}
              className="pressable"
              style={{
                flex: 1,
                padding: '8px 0',
                borderRadius: 10,
                fontFamily: FONTS.body, fontSize: 13,

            key={ticket.id}

/* ================================================================
   页面 5：迷影社区
   布局：卡片式信息流 + 顶部轮播画廊 + 悬浮操作球 FAB
   ================================================================ */
function CommunityPage({ onFilmTap, onFilmmakerTap, reducedMotion }) {
  const [activeSlide, setActiveSlide] = useState(0);
  const intervalRef = useRef(null);
  const visibleRef = useRef(true);

  // 轮播画廊
  useEffect(() => {
    if (reducedMotion) return;
    visibleRef.current = true;
    intervalRef.current = setInterval(() => {
      if (!visibleRef.current) return;
      setActiveSlide(prev => (prev + 1) % FILMMAKERS.length);
    }, 5000);

    const handleVisibility = () => {
      visibleRef.current = !document.hidden;
    };
    document.addEventListener('visibilitychange', handleVisibility);

    return () => {
      visibleRef.current = false;
      if (intervalRef.current) clearInterval(intervalRef.current);
      document.removeEventListener('visibilitychange', handleVisibility);
    };
  }, [reducedMotion]);

  return (
    <div style={{
      flex: 1,
      display: 'flex', flexDirection: 'column',
      background: COLORS.cream,
    }}>
      {/* 自定义导航栏（奶油色） */}

              <path d="M10 2a6 6 0 016 6c0 3.5-3 5.5-6 9-3-3.5-6-5.5-6-9a6 6 0 016-6z" stroke="currentColor" strokeWidth="1.8"/>
              <circle cx="10" cy="8" r="2" stroke="currentColor" strokeWidth="1.8"/>

function IOSListRowCustom({ title, detail, icon, onClick, isLast = false, dark = false, chevron = true }) {

  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <button
      onClick={onClick}
      className="pressable"
      style={{
        width: '100%',
        display: 'flex', alignItems: 'center', minHeight: 52,
        padding: '0 16px', position: 'relative',

        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>

      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </button>
  );
}

/* ================================================================
   主应用 — 路由与导航栈
   ================================================================ */
function App() {
  const [tab, setTab] = useState('calendar');
  const [stack, setStack] = useState([]); // 导航栈
  const [direction, setDirection] = useState('forward');
  const [tickets, setTickets] = useState(TICKETS);
  const [toast, setToast] = useState(null);
  const toastTimerRef = useRef(null);

  // reduced motion
  const [reducedMotion, setReducedMotion] = useState(false);
  useEffect(() => {
    const mql = window.matchMedia('(prefers-reduced-motion: reduce)');
    setReducedMotion(mql.matches);
    const handler = (e) => setReducedMotion(e.matches);
    mql.addEventListener('change', handler);
    return () => mql.removeEventListener('change', handler);
  }, []);

  const showToast = useCallback((msg) => {
    setToast(msg);
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    toastTimerRef.current = setTimeout(() => setToast(null), 2000);
  }, []);

  const pushPage = useCallback((page, data = {}) => {
    setDirection('forward');
    setStack(prev => [...prev, { page, data }]);
  }, []);

  const popPage = useCallback(() => {
    setDirection('back');
    setStack(prev => prev.slice(0, -1));
  }, []);

  const handleTabChange = useCallback((newTab) => {
    if (newTab === tab) return;
    setTab(newTab);
    setStack([]); // 切换 Tab 清空栈
  }, [tab]);

  const handleFilmTap = useCallback((film) => {
    pushPage('filmDetail', { film });
  }, [pushPage]);

  const handleFilmmakerTap = useCallback((filmmaker) => {
    pushPage('filmmaker', { filmmaker });
  }, [pushPage]);

  const handleBuyTicket = useCallback((film, showtime) => {
    const newTicket = {
      id: `t${Date.now()}`,
      film,
      seat: 'J 排 08 座',
      date: '12月17日 周日',
      time: showtime.time,
      hall: film.hall,
      type: showtime.type,
      code: `INT-2024-1217-${Math.floor(Math.random() * 9000 + 1000)}`,
      stamp: '待入场',
      isUsed: false,
    };
    setTickets(prev => [newTicket, ...prev]);
    showToast('购票成功！票根已加入收藏夹');
    // 跳到票根 Tab
    setTimeout(() => {
      setTab('tickets');
      setStack([]);
    }, 800);
  }, [showToast]);

  const handleNavTo = useCallback((target) => {
    setTab(target);
    setStack([]);
  }, []);

  const handleSpecsTap = useCallback(() => {
    pushPage('specs');
  }, [pushPage]);

  const handleApiTap = useCallback(() => {
    pushPage('api');
  }, [pushPage]);

  // 渲染当前页面
  const currentPage = stack.length > 0 ? stack[stack.length - 1] : { page: tab, data: {} };

  const renderPage = () => {
    const pageKey = currentPage.page;
    const animClass = stack.length > 0
      ? (direction === 'forward' ? 'page-enter' : 'page-enter-back')
      : 'tab-content';

    // 根 Tab 页
    if (pageKey === 'calendar') {
      return (
        <div key={pageKey} className={stack.length === 0 ? animClass : ''}>
          <CalendarPage onFilmTap={handleFilmTap} reducedMotion={reducedMotion} />
        </div>
      );
    }
    if (pageKey === 'tickets') {
      return (
        <div key={pageKey} className={stack.length === 0 ? animClass : ''}>
          <TicketsPage tickets={tickets} onFilmTap={handleFilmTap} reducedMotion={reducedMotion} />
        </div>
      );
    }
    if (pageKey === 'community') {
      return (
        <div key={pageKey} className={stack.length === 0 ? animClass : ''}>
          <CommunityPage onFilmTap={handleFilmTap} onFilmmakerTap={handleFilmmakerTap} reducedMotion={reducedMotion} />
        </div>
      );
    }
    if (pageKey === 'profile') {
      return (
        <div key={pageKey} className={stack.length === 0 ? animClass : ''}>
          <ProfilePage
            onNavTo={handleNavTo}
            onFilmmakerTap={handleFilmmakerTap}
            reducedMotion={reducedMotion}
          />
        </div>
      );
    }

    // 栈内页面
    if (pageKey === 'filmDetail') {
      return (
        <div key={`film-${currentPage.data.film.id}`} className={animClass} style={{ height: '100%' }}>
          <FilmDetailPage
            film={currentPage.data.film}
            onBack={popPage}
            reducedMotion={reducedMotion}
            onBuyTicket={handleBuyTicket}
          />
        </div>
      );
    }
    if (pageKey === 'filmmaker') {
      return (
        <div key={`fm-${currentPage.data.filmmaker.id}`} className={animClass} style={{ height: '100%' }}>
          <FilmmakerPage
            filmmaker={currentPage.data.filmmaker}
            onBack={popPage}
            onFilmTap={handleFilmTap}
            reducedMotion={reducedMotion}
          />
        </div>
      );
    }
    if (pageKey === 'specs') {
      return (
        <div key="specs" className={animClass} style={{ height: '100%' }}>
          <DesignSpecsPage onBack={popPage} reducedMotion={reducedMotion} />
        </div>
      );
    }
    if (pageKey === 'api') {
      return (
        <div key="api" className={animClass} style={{ height: '100%' }}>
          <ApiDocPage onBack={popPage} reducedMotion={reducedMotion} />
        </div>
      );
    }

    return null;
  };

  // 只有根 Tab 页显示 TabBar
  const showTabBar = stack.length === 0;
  const isDarkTab = tab !== 'community';

  return (
    <div className="app-stage">
      <div className="device-wrap">
        <div className="device-label">
          <strong>INTERMISSION</strong> · 银幕之间 · V2
        </div>
        <IOSDevice dark width={402} height={874}>
          <div style={{
            width: '100%', height: '100%',
            display: 'flex', flexDirection: 'column',
            position: 'relative',
          }}>
            {renderPage()}
            {showTabBar && <TabBar active={tab} onChange={handleTabChange} dark={isDarkTab} />}
          </div>

          {/* Toast */}
          {toast && (
            <div className="sheet-backdrop-enter" style={{
              position: 'absolute',
              top: 'calc(var(--ios-safe-top) + 60px)',
              left: '50%',
              transform: 'translateX(-50%)',
              padding: '10px 20px',
              background: 'rgba(26,21,18,0.9)',
              color: COLORS.cream,
              borderRadius: 20,
              fontFamily: FONTS.body, fontSize: 13,
              zIndex: 200,
              border: `1px solid ${COLORS.gold}`,
              backdropFilter: 'blur(10px)',
              WebkitBackdropFilter: 'blur(10px)',
              boxShadow: '0 4px 20px rgba(0,0,0,0.3)',
            }}>
              {toast}
            </div>
          )}
        </IOSDevice>
      </div>
    </div>
  );
}

// ─── 升级全栈应用宣告 ───
function announceUpgrade() {
  try {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  } catch (e) {}
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}

// ─── 渲染 ───
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="creative-medium" content="interactive-prototype" />
<title>鞋盒志 Sneaker Archive · 微信小程序</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Playfair+Display:wght@600;700;900&family=Inter:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" />
<style>
/* ============ RESET & BASE ============ */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  background: #EDE9DF;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  color: #1E1E22;
  overflow: hidden;
  user-select: none;
}

/* ============ STAGE LAYOUT ============ */
.stage {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(255, 90, 31, 0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(30, 30, 34, 0.06) 0%, transparent 50%),
    #EDE9DF;
}
.stage-bg-texture {
  position: absolute;
  inset: 0;
  background-image:
    repeating-linear-gradient(0deg, transparent 0, transparent 39px, rgba(30,30,34,0.03) 40px),
    repeating-linear-gradient(90deg, transparent 0, transparent 39px, rgba(30,30,34,0.03) 40px);
  pointer-events: none;
}

/* ============ CUSTOM CURSOR ============ */
.custom-cursor {
  position: fixed;
  top: 50%; left: 50%;
  width: 36px; height: 36px;
  border: 2px solid #1E1E22;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 99999;
  mix-blend-mode: difference;
  transition: width 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
              height 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
              border-color 0.2s ease,
              background-color 0.2s ease;
}
.custom-cursor::before {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 6px; height: 6px;
  background: #FF5A1F;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: width 0.2s ease, height 0.2s ease;
}
.custom-cursor.hover {
  width: 56px; height: 56px;
  border-color: #FF5A1F;
}
.custom-cursor.hover::before {
  width: 10px; height: 10px;
}
.custom-cursor.click {
  width: 24px; height: 24px;
  background: rgba(255, 90, 31, 0.3);
}
.cursor-ripple {
  position: fixed;
  top: 0; left: 0;
  width: 0; height: 0;
  border-radius: 50%;
  border: 2px solid #FF5A1F;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 99998;
  opacity: 0;
  animation: cursorRipple 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
}
@keyframes cursorRipple {
  0% { width: 0; height: 0; opacity: 0.8; border-width: 4px; }
  100% { width: 80px; height: 80px; opacity: 0; border-width: 1px; }
}
.cursor-glow {
  position: fixed;
  top: 50%; left: 50%;
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(255, 90, 31, 0.15) 0%, transparent 70%);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 99997;
  transition: opacity 0.3s ease;
}

@media (pointer: coarse) {
  .custom-cursor, .cursor-glow { display: none; }
}

/* ============ LABELS ============ */
.stage-label {
  position: fixed;
  top: 32px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 100;
  pointer-events: none;
}
.stage-label-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: #1E1E22;
  color: #F5F1E8;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.5px;
  border-radius: 100px;
  font-family: 'Space Mono', monospace;
}
.stage-label-badge.orange {
  background: #FF5A1F;
  color: #fff;
}
.stage-label-title {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  font-weight: 700;
  color: #1E1E22;
  letter-spacing: 0.5px;
}

.stage-caption {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  pointer-events: none;
  z-index: 100;
}
.stage-caption h2 {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  font-weight: 700;
  color: #1E1E22;
  letter-spacing: 1px;
}
.stage-caption p {
  font-size: 13px;
  color: #8E8E93;
  margin-top: 6px;
  font-weight: 400;
}

/* ============ SIDE CONTROLS ============ */
.side-pages {
  position: fixed;
  right: 48px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 100;
}
.side-page-item {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  cursor: pointer;
  transition: all 0.3s ease;
}
.side-page-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #8E8E93;
  transition: all 0.3s ease;
}
.side-page-item.active .side-page-dot {
  background: #FF5A1F;
  width: 24px;
  border-radius: 4px;
}
.side-page-label {
  font-size: 11px;
  font-weight: 500;
  color: #8E8E93;
  opacity: 0;
  transform: translateX(10px);
  transition: all 0.3s ease;
  white-space: nowrap;
  font-family: 'Space Mono', monospace;
}
.side-page-item:hover .side-page-label,
.side-page-item.active .side-page-label {
  opacity: 1;
  transform: translateX(0);
  color: #1E1E22;
}
.side-page-item.active .side-page-label {
  color: #FF5A1F;
}

/* ============ DEVICE WRAPPER ============ */
.device-wrapper {
  position: relative;
  filter: drop-shadow(0 40px 80px rgba(30, 30, 34, 0.15));
}

/* ============ MINI PROGRAM CAPSULE ============ */
.mp-capsule {
  position: absolute;
  top: calc(var(--ios-safe-top, 54px) - 6px);
  right: 12px;
  width: 87px; height: 32px;
  background: rgba(245, 241, 232, 0.72);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  z-index: 100;
  border: 0.5px solid rgba(30, 30, 34, 0.08);
}
.mp-capsule.dark {
  background: rgba(30, 30, 34, 0.72);
  border-color: rgba(245, 241, 232, 0.1);
}
.mp-capsule-btn {
  flex: 1;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
}
.mp-capsule-btn:first-child { border-radius: 100px 0 0 100px; }
.mp-capsule-btn:last-child { border-radius: 0 100px 100px 0; }
.mp-capsule-divider {
  width: 0.5px;
  height: 16px;
  background: rgba(30, 30, 34, 0.12);
}
.mp-capsule.dark .mp-capsule-divider {
  background: rgba(245, 241, 232, 0.15);
}
.mp-capsule-btn:hover { background: rgba(30, 30, 34, 0.06); }
.mp-capsule.dark .mp-capsule-btn:hover { background: rgba(245, 241, 232, 0.1); }

/* ============ MP SCREEN CONTAINER ============ */
.mp-screen {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #F5F1E8;
}

/* Pages slide */
.mp-pages {
  position: absolute;
  inset: 0;
  display: flex;
  transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
  will-change: transform;
}
.mp-page {
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
  background: #F5F1E8;
  -webkit-overflow-scrolling: touch;
}
.mp-page::-webkit-scrollbar { display: none; }

/* Push animation overlay */
.page-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: #F5F1E8;
  transform: translateX(100%);
  z-index: 50;
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  overflow: hidden;
  pointer-events: none;
}
.page-overlay.active {
  transform: translateX(0);
  pointer-events: auto;
}
.page-overlay-back {
  position: absolute;
  top: 0; left: 0;
  width: 30%; height: 100%;
  background: rgba(0,0,0,0);
  transition: background 0.35s ease;
  z-index: 51;
  pointer-events: none;
}
.page-overlay.active .page-overlay-back {
  background: rgba(0,0,0,0.2);
  pointer-events: auto;
}

/* ============ TABBAR ============ */
.mp-tabbar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: calc(56px + var(--ios-safe-bottom, 34px));
  padding-bottom: var(--ios-safe-bottom, 34px);
  background: rgba(245, 241, 232, 0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 0.5px solid rgba(30, 30, 34, 0.08);
  display: flex;
  z-index: 40;
}
.mp-tabbar-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
}
.mp-tabbar-icon {
  width: 24px; height: 24px;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  color: #8E8E93;
}
.mp-tabbar-item.active .mp-tabbar-icon {
  color: #FF5A1F;
  transform: translateY(-2px) scale(1.1);
}
.mp-tabbar-label {
  font-size: 10px;
  font-weight: 500;
  color: #8E8E93;
  transition: all 0.3s ease;
}
.mp-tabbar-item.active .mp-tabbar-label {
  color: #FF5A1F;
  font-weight: 600;
}
.mp-tabbar-dot {
  position: absolute;
  bottom: 6px;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: #FF5A1F;
  opacity: 0;
  transform: scale(0);
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.mp-tabbar-item.active .mp-tabbar-dot {
  opacity: 1;
  transform: scale(1);
}

/* ============ MP NAVBAR ============ */
.mp-navbar {
  position: sticky;
  top: 0;
  left: 0; right: 0;
  height: calc(var(--ios-safe-top, 54px) + 44px);
  padding-top: var(--ios-safe-top, 54px);
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(245, 241, 232, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 0.5px solid rgba(30, 30, 34, 0.06);
  transition: all 0.3s ease;
}
.mp-navbar.transparent {
  background: transparent;
  backdrop-filter: none;
  border-bottom: none;
}
.mp-navbar-title {
  font-size: 17px;
  font-weight: 600;
  color: #1E1E22;
}
.mp-navbar-back {
  position: absolute;
  left: 16px;
  bottom: 12px;
  width: 32px; height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  cursor: pointer;
  transition: all 0.2s ease;
}
.mp-navbar-back:hover {
  background: rgba(30, 30, 34, 0.08);
}

/* ============ HOME PAGE ============ */
.home-header {
  padding: 0 20px 16px;
  padding-top: calc(var(--ios-safe-top, 54px) + 10px);
}
.home-header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
.home-logo {
  display: flex;
  flex-direction: column;
}
.home-logo-title {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  font-weight: 900;
  color: #1E1E22;
  letter-spacing: 0.5px;
  line-height: 1;
}
.home-logo-sub {
  font-size: 10px;
  color: #8E8E93;
  font-weight: 500;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-top: 4px;
  font-family: 'Space Mono', monospace;
}
.home-search {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: rgba(30, 30, 34, 0.05);
  border-radius: 12px;
  margin-bottom: 18px;
}
.home-search-input {
  flex: 1;
  font-size: 14px;
  color: #1E1E22;
  background: transparent;
  border: none;
  outline: none;
  font-weight: 400;
}
.home-search-input::placeholder { color: #8E8E93; }

.home-categories {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  overflow-x: auto;
  padding-bottom: 4px;
  -webkit-overflow-scrolling: touch;
}
.home-categories::-webkit-scrollbar { display: none; }
.home-cat-item {
  flex-shrink: 0;
  padding: 7px 16px;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 500;
  color: #8E8E93;
  background: rgba(30, 30, 34, 0.04);
  cursor: pointer;
  transition: all 0.3s ease;
  border: 1px solid transparent;
}
.home-cat-item.active {
  background: #1E1E22;
  color: #F5F1E8;
}
.home-cat-item:hover { transform: translateY(-1px); }

/* Shoe box hero card - signature animation */
.shoe-box-hero {
  margin: 0 20px 28px;
  position: relative;
  perspective: 1200px;
  cursor: pointer;
}
.shoe-box-lid {
  position: relative;
  background: linear-gradient(145deg, #FF5A1F 0%, #E04A10 100%);
  border-radius: 14px;
  padding: 24px;
  transform-origin: top;
  transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  transform-style: preserve-3d;
  z-index: 2;
  backface-visibility: hidden;
  box-shadow: 0 8px 24px rgba(255, 90, 31, 0.3);
}
.shoe-box-hero:hover .shoe-box-lid {
  transform: rotateX(-25deg) translateY(-4px);
}
.shoe-box-lid-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 20px;
}
.shoe-box-label {
  color: rgba(255, 255, 255, 0.9);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 2px;
  font-family: 'Space Mono', monospace;
}
.shoe-box-badge {
  background: rgba(255,255,255,0.2);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 100px;
  backdrop-filter: blur(4px);
}
.shoe-box-title {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  font-weight: 900;
  color: #fff;
  line-height: 1.1;
  margin-bottom: 6px;
}
.shoe-box-desc {
  font-size: 13px;
  color: rgba(255,255,255,0.85);
  line-height: 1.5;
  margin-bottom: 18px;
}
.shoe-box-meta {
  display: flex;
  gap: 20px;
  padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,0.2);
}
.shoe-box-meta-item {
  display: flex;
  flex-direction: column;
}
.shoe-box-meta-num {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  font-weight: 700;
  color: #fff;
}
.shoe-box-meta-label {
  font-size: 10px;
  color: rgba(255,255,255,0.7);
  letter-spacing: 1px;
  font-family: 'Space Mono', monospace;
}

.shoe-box-body {
  position: absolute;
  bottom: -6px;
  left: 6px; right: 6px;
  height: 40px;
  background: #1E1E22;
  border-radius: 0 0 12px 12px;
  z-index: 1;
}

/* Featured sneakers grid */
.section-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 0 20px;
  margin-bottom: 16px;
}
.section-title {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  font-weight: 700;
  color: #1E1E22;
}
.section-more {
  font-size: 12px;
  color: #FF5A1F;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
}

.sneaker-grid {
  padding: 0 20px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding-bottom: 100px;
}
.sneaker-card {
  background: #fff;
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  box-shadow: 0 2px 12px rgba(30, 30, 34, 0.06);
}
.sneaker-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 32px rgba(30, 30, 34, 0.12);
}
.sneaker-card-img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  background: #F5F1E8;
  transition: transform 0.5s ease;
}
.sneaker-card:hover .sneaker-card-img {
  transform: scale(1.05);
}
.sneaker-card-tag {
  position: absolute;
  top: 10px; left: 10px;
  padding: 4px 10px;
  background: rgba(245, 241, 232, 0.9);
  backdrop-filter: blur(8px);
  border-radius: 100px;
  font-size: 10px;
  font-weight: 600;
  color: #FF5A1F;
  font-family: 'Space Mono', monospace;
}
.sneaker-card-body {
  padding: 10px 12px 12px;
}
.sneaker-card-name {
  font-size: 13px;
  font-weight: 600;
  color: #1E1E22;
  line-height: 1.3;
  margin-bottom: 4px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.sneaker-card-brand {
  font-size: 10px;
  color: #8E8E93;
  margin-bottom: 8px;
  font-weight: 500;
}
.sneaker-card-price {
  font-family: 'Playfair Display', serif;
  font-size: 16px;
  font-weight: 700;
  color: #FF5A1F;
}

/* Tread pattern decoration */
.tread-pattern {
  position: absolute;
  bottom: 0; right: 0;
  width: 60px; height: 60px;
  opacity: 0.06;
  pointer-events: none;
}

/* ============ CATEGORY PAGE ============ */
.cat-page {
  background: #F5F1E8;
}
.cat-hero {
  padding: 0 20px;
  padding-top: calc(var(--ios-safe-top, 54px) + 20px);
  padding-bottom: 24px;
  background: linear-gradient(180deg, #1E1E22 0%, #2A2A30 100%);
  color: #F5F1E8;
  position: relative;
  overflow: hidden;
}
.cat-hero::before {
  content: '';
  position: absolute;
  top: -50%; right: -20%;
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(255, 90, 31, 0.3) 0%, transparent 60%);
  border-radius: 50%;
}
.cat-hero-title {
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  font-weight: 900;
  line-height: 1.1;
  margin-bottom: 8px;
  position: relative;
}
.cat-hero-sub {
  font-size: 13px;
  color: rgba(245, 241, 232, 0.7);
  margin-bottom: 20px;
  position: relative;
}
.cat-stats {
  display: flex;
  gap: 24px;
  position: relative;
}
.cat-stat {
  display: flex;
  flex-direction: column;
}
.cat-stat-num {
  font-family: 'Playfair Display', serif;
  font-size: 24px;
  font-weight: 700;
  color: #FF5A1F;
}
.cat-stat-label {
  font-size: 10px;
  color: rgba(245, 241, 232, 0.5);
  letter-spacing: 1px;
  font-family: 'Space Mono', monospace;
}

/* Sticky filter tabs */
.cat-sticky-tabs {
  position: sticky;
  top: calc(var(--ios-safe-top, 54px) + 44px);
  z-index: 20;
  background: rgba(245, 241, 232, 0.95);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  padding: 12px 20px;
  border-bottom: 0.5px solid rgba(30, 30, 34, 0.06);
  display: flex;
  gap: 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.cat-sticky-tabs::-webkit-scrollbar { display: none; }
.cat-filter-chip {
  flex-shrink: 0;
  padding: 7px 14px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 500;
  color: #1E1E22;
  background: #fff;
  border: 1px solid rgba(30, 30, 34, 0.1);
  cursor: pointer;
  transition: all 0.25s ease;
  display: flex;
  align-items: center;
  gap: 5px;
}
.cat-filter-chip.active {
  background: #1E1E22;
  color: #F5F1E8;
  border-color: #1E1E22;
}
.cat-filter-chip:hover { transform: translateY(-1px); }

.cat-waterfall {
  padding: 16px 20px 100px;
  columns: 2;
  column-gap: 12px;
}
.cat-waterfall-item {
  break-inside: avoid;
  margin-bottom: 12px;
  background: #fff;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.3s ease;
}
.cat-waterfall-item:hover {
  transform: translateY(-2px);

  margin: -20px 20px 0;

.auth-page {
  background: #F5F1E8;

}
.auth-hero {
  padding: 0 20px;

  padding-bottom: 20px;
  background: #1E1E22;
  position: relative;
  overflow: hidden;
}
.auth-hero::before {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 200px; height: 200px;
  background:
    repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(255, 90, 31, 0.08) 8px, rgba(255, 90, 31, 0.08) 9px),
    repeating-linear-gradient(-45deg, transparent, transparent 8px, rgba(255, 90, 31, 0.08) 8px, rgba(255, 90, 31, 0.08) 9px);
  opacity: 0.5;
  transform: rotate(15deg);
  top: -50px; right: -50px;
}
.auth-hero-title {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  font-weight: 900;
  color: #F5F1E8;
  margin-bottom: 6px;
  position: relative;
}
.auth-hero-sub {

  position: relative;
}
.auth-step-fill {
  position: absolute;
  top: 0; left: 0;

  transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);

.auth-step-tabs {
  display: flex;

  margin-top: -1px;

  content: '';
  position: absolute;

.auth-content {

  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;

.auth-form-group {

const HomePage = ({ onOpenDetail, onShare }) => {
  const [cat, setCat] = useState('热门');
  const [search, setSearch] = useState('');
  const [counts, setCounts] = useState({ shoes: 0, auths: 0, value: 0 });

  useEffect(() => {
    // Number count-up animation
    let rafId;
    const startTime = performance.now();
    const duration = 1500;
    const targets = { shoes: 2847, auths: 1256, value: 168 };
    const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

    const tick = (now) => {
      const t = Math.min(1, (now - startTime) / duration);
      const e = easeOutCubic(t);
      setCounts({
        shoes: Math.floor(targets.shoes * e),
        auths: Math.floor(targets.auths * e),
        value: Math.floor(targets.value * e),
      });
      if (t < 1) rafId = requestAnimationFrame(tick);
    };
    rafId = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafId);
  }, []);

  // Parallax effect on scroll (direct DOM manipulation)
  useEffect(() => {
    const el = scrollRef.current;
    const hero = heroRef.current;
    if (!el || !hero) return;
    let rafId = null;
    let scrollY = 0;

    const onScroll = () => {
      scrollY = el.scrollTop;
      if (!rafId) {
        rafId = requestAnimationFrame(() => {
          hero.style.transform = `translateY(${scrollY * 0.4}px) scale(${1 + scrollY * 0.0005})`;
          hero.style.filter = `brightness(${1 - Math.min(0.3, scrollY * 0.001)})`;
          rafId = null;
        });
      }
    };
    el.addEventListener('scroll', onScroll, { passive: true });
    return () => {
      el.removeEventListener('scroll', onScroll);
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, []);

  if (!sneaker) return null;

  return (

const CollectionPage = () => {
  const [items, setItems] = useState(SNEAKERS.slice(0, 4).map((s, i) => ({
    ...s,
    size: ['42', '43', '41', '42.5'][i],
    condition: ['全新', '99新', '95新', '9成新'][i],
    swiped: false,
  })));
  const [refreshing, setRefreshing] = useState(false);
  const [skeleton, setSkeleton] = useState(false);
  const pageRef = useRef(null);
  const startY = useRef(0);
  const pullDist = useRef(0);
  const [pullOffset, setPullOffset] = useState(0);

  const toggleSwipe = (idx) => {
    setItems(items.map((item, i) => ({
      ...item,
      swiped: i === idx ? !item.swiped : false,
    })));
  };

  const deleteItem = (idx) => {
    setItems(items.filter((_, i) => i !== idx));
  };

  // Pull to refresh
  const handleTouchStart = (e) => {
    if (pageRef.current?.scrollTop === 0) {
      startY.current = e.touches[0].clientY;
    }
  };

  const handleTouchMove = (e) => {
    if (pageRef.current?.scrollTop === 0 && startY.current) {
      const diff = e.touches[0].clientY - startY.current;
      if (diff > 0) {
        pullDist.current = Math.min(diff * 0.5, 80);
        setPullOffset(pullDist.current);
      }
    }
  };

  const handleTouchEnd = () => {
    if (pullDist.current > 50) {
      setRefreshing(true);
      setPullOffset(50);
      setSkeleton(true);
      setTimeout(() => {
        setRefreshing(false);
        setPullOffset(0);
        setSkeleton(false);
        pullDist.current = 0;
      }, 1500);
    } else {
      setPullOffset(0);
      pullDist.current = 0;
    }
    startY.current = 0;
  };

  return (
    <div
      className="mp-page collection-page"
      ref={pageRef}
      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}
      onTouchEnd={handleTouchEnd}
      data-screen-label="06"
    >
      <div style={{
        height: pullOffset,
        display: 'flex',
        alignItems: 'flex-end',
        justifyContent: 'center',
        paddingBottom: 8,
        overflow: 'hidden',
        transition: refreshing ? 'none' : 'height 0.3s ease',
      }}>
        {refreshing ? (
          <div className="pull-refresh-spinner"></div>
        ) : pullOffset > 0 ? (
          <span style={{ fontSize: 12, color: '#8E8E93' }}>
            {pullOffset > 50 ? '松开刷新' : '下拉刷新'}
          </span>
        ) : null}
      </div>

      <div className="collection-header">
        <h2 className="collection-title">我的收藏</h2>
        <span className="collection-sort">
          按价值排序 <Icon name="chevron" size={12} />
        </span>
      </div>

      <div className="collection-list">
        {skeleton ? (
          [1, 2, 3, 4].map(i => (
            <div key={i} className="skeleton-card">
              <div className="skeleton-img"></div>
              <div className="skeleton-text">
                <div className="skeleton-line"></div>
                <div className="skeleton-line short"></div>
                <div className="skeleton-line shorter"></div>
              </div>
            </div>
          ))
        ) : (
          items.map((item, i) => (
            <div key={item.id} className="swipe-item">
              <div className="swipe-actions">
                <div className="swipe-action edit" onClick={() => toggleSwipe(i)}>
                  编辑
                </div>
                <div className="swipe-action delete" onClick={() => deleteItem(i)}>
                  删除
                </div>
              </div>
              <div
                className={`swipe-content ${item.swiped ? 'swiped' : ''}`}
                onClick={() => item.swiped && toggleSwipe(i)}
              >
                <img className="swipe-img" src={item.img} alt={item.name} />
                <div className="swipe-info">
                  <div className="swipe-name">{item.name}</div>
                  <div className="swipe-meta">
                    <span className="swipe-size">US {item.size}</span>
                    <span className="swipe-condition">{item.condition}</span>
                  </div>
                  <div className="swipe-value">¥{item.price.toLocaleString()}</div>
                </div>
                <div className="swipe-arrow">
                  <Icon name="chevron" size={16} />
                </div>
              </div>
            </div>
          ))
        )}
      </div>

      {!skeleton && items.length > 0 && (
        <div style={{ textAlign: 'center', padding: '20px 20px 0', fontSize: 12, color: '#8E8E93' }}>
          左滑卡片可编辑或删除
        </div>
      )}
    </div>
  );
};

// ============ MAIN APP ============
const App = () => {
  const [activePage, setActivePage] = useState('home');
  const [tabActive, setTabActive] = useState('home');
  const [detailSneaker, setDetailSneaker] = useState(null);
  const [detailOpen, setDetailOpen] = useState(false);
  const [shareVisible, setShareVisible] = useState(false);
  const [darkCapsule, setDarkCapsule] = useState(false);

  // Pages that need dark capsule
  useEffect(() => {
    setDarkCapsule(activePage === 'detail' || activePage === 'spec');
  }, [activePage]);

  // Handle tab change
  const handleTabChange = (key) => {
    setTabActive(key);
    setActivePage(key);
    setDetailOpen(false);
  };

  // Open detail from home/category (page stack push)
  const handleOpenDetail = (sneaker) => {
    setDetailSneaker(sneaker);
    setDetailOpen(true);
  };

  const handleCloseDetail = () => {
    setDetailOpen(false);
  };

  // Side page navigation
  const goToPage = (key) => {
    setActivePage(key);
    if (['home', 'category', 'auth', 'profile'].includes(key)) {
      setTabActive(key);
    }
    setDetailOpen(false);
  };

  // Render the main content
  const renderPage = () => {
    switch (activePage) {
      case 'home':
        return <HomePage onOpenDetail={handleOpenDetail} onShare={() => setShareVisible(true)} />;
      case 'category':
        return <CategoryPage onOpenDetail={handleOpenDetail} />;
      case 'profile':
        return <ProfilePage />;
      case 'auth':
        return <AuthPage onShare={() => setShareVisible(true)} />;
      case 'collection':
        return <CollectionPage />;
      case 'spec':
        return <SpecPage />;
      case 'api':
        return <ApiPage />;
      case 'detail':
        return (
          <DetailPage
            sneaker={SNEAKERS[0]}
            onBack={() => setActivePage('home')}
            onShare={() => setShareVisible(true)}
          />
        );
      default:
        return <HomePage onOpenDetail={handleOpenDetail} onShare={() => setShareVisible(true)} />;
    }
  };

  const showTabBar = ['home', 'category', 'profile', 'auth'].includes(activePage);

  return (
    <>
      {/* Side nav */}
      <SideNav active={activePage} onChange={goToPage} />

      <div style={{ position: 'relative' }}>
        <IOSDevice width={390} height={844}>
          <div className="mp-screen">
            {renderPage()}

            {/* Detail page overlay (page stack push) */}
            <div className={`page-overlay ${detailOpen ? 'active' : ''}`}>
              {detailSneaker && (
                <DetailPage
                  sneaker={detailSneaker}
                  onBack={handleCloseDetail}
                  onShare={() => setShareVisible(true)}
                />
              )}
            </div>

            {/* Tab bar */}
            {showTabBar && !detailOpen && (
              <MPTabBar active={tabActive} onChange={handleTabChange} />
            )}

            {/* Capsule button */}
            <MPCapsule
              dark={darkCapsule || (detailOpen && activePage !== 'detail')}
              onShare={() => setShareVisible(true)}
              onMore={() => setShareVisible(true)}
            />

            {/* Share bottom sheet */}
            <ShareSheet visible={shareVisible} onClose={() => setShareVisible(false)} />
          </div>
        </IOSDevice>
      </div>
    </>
  );
};

// ============ CUSTOM CURSOR (Vanilla JS) ============
function initCustomCursor() {
  const cursor = document.getElementById('customCursor');
  const glow = document.getElementById('cursorGlow');
  if (!cursor || !glow) return;

  // Respect reduced motion
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) {
    cursor.style.display = 'none';
    glow.style.display = 'none';
    return;
  }

  // Touch device check
  if (window.matchMedia('(pointer: coarse)').matches) return;

  let cx = window.innerWidth / 2;
  let cy = window.innerHeight / 2;
  let tx = cx, ty = cy;
  let gx = cx, gy = cy;
  let rafId = null;
  let visible = true;

  // Start centered
  cursor.style.left = cx + 'px';
  cursor.style.top = cy + 'px';
  glow.style.left = gx + 'px';
  glow.style.top = gy + 'px';

  const onMove = (e) => {
    tx = e.clientX;
    ty = e.clientY;
    if (!rafId) {
      rafId = requestAnimationFrame(animate);
    }
  };

  const animate = () => {
    // Smooth follow - cursor (fast), glow (slow)
    cx += (tx - cx) * 0.25;
    cy += (ty - cy) * 0.25;
    gx += (tx - gx) * 0.08;
    gy += (ty - gy) * 0.08;

    cursor.style.left = cx + 'px';
    cursor.style.top = cy + 'px';
    glow.style.left = gx + 'px';
    glow.style.top = gy + 'px';

    if (Math.abs(tx - cx) > 0.5 || Math.abs(ty - cy) > 0.5) {
      rafId = requestAnimationFrame(animate);
    } else {
      rafId = null;
    }
  };

  // Click ripple
  const onClick = (e) => {
    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);

    cursor.classList.add('click');
    setTimeout(() => cursor.classList.remove('click'), 200);
  };

  // Hover detection
  const onMouseOver = (e) => {
    const target = e.target;
    const interactive = target.closest('button, a, .mp-tabbar-item, .sneaker-card, .home-cat-item, .cat-filter-chip, .detail-size, .floating-btn, .swipe-content, .profile-grid-item, .auth-upload-box, .auth-form-option, .share-option, .api-endpoint-header, .bottom-sheet-close, .mp-capsule-btn, .side-page-item, .cat-waterfall-item, .detail-action-main, .detail-action-icon, .detail-hero-btn');
    if (interactive) {
      cursor.classList.add('hover');
    }
  };

  const onMouseOut = (e) => {
    const target = e.target;
    const interactive = target.closest('button, a, .mp-tabbar-item, .sneaker-card, .home-cat-item, .cat-filter-chip, .detail-size, .floating-btn, .swipe-content, .profile-grid-item, .auth-upload-box, .auth-form-option, .share-option, .api-endpoint-header, .bottom-sheet-close, .mp-capsule-btn, .side-page-item, .cat-waterfall-item, .detail-action-main, .detail-action-icon, .detail-hero-btn');
    if (interactive) {
      cursor.classList.remove('hover');
    }
  };

  // Visibility change handling
  const onVisibilityChange = () => {
    if (document.hidden) {
      visible = false;
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      cursor.style.display = 'none';
      glow.style.display = 'none';
    } else {
      visible = true;
      cursor.style.display = 'block';
      glow.style.display = 'block';
    }
  };

  window.addEventListener('mousemove', onMove);
  window.addEventListener('click', onClick);
  document.addEventListener('mouseover', onMouseOver);
  document.addEventListener('mouseout', onMouseOut);
  document.addEventListener('visibilitychange', onVisibilityChange);

  // Cleanup helper
  window._cleanupCursor = () => {
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('click', onClick);
    document.removeEventListener('mouseover', onMouseOver);
    document.removeEventListener('mouseout', onMouseOut);
    document.removeEventListener('visibilitychange', onVisibilityChange);
    if (rafId) cancelAnimationFrame(rafId);
  };
}

// Initialize cursor after DOM ready
document.addEventListener('DOMContentLoaded', initCustomCursor);

// ============ SCROLL REVEAL ============
function initScrollReveal() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) {
    document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
    return;
  }

  // Observe pages that have .reveal elements
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1, root: null });

  const observePage = () => {
    document.querySelectorAll('.mp-page .reveal').forEach(el => {
      if (!el.classList.contains('visible')) {
        observer.observe(el);
      }
    });
  };

  // Initial observe
  setTimeout(observePage, 500);

  // Re-observe on page switch
  const mutObserver = new MutationObserver(() => {
    observePage();
  });
  mutObserver.observe(document.body, { childList: true, subtree: true });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      observer.disconnect();
    }
  });
}
document.addEventListener('DOMContentLoaded', initScrollReveal);

root.render(<App />);

  window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
}

if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });

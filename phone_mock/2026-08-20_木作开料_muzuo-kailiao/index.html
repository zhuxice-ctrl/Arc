<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="creative-medium" content="interactive-prototype" />
<title>木作开料 · 套裁工坊</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
  /* === Design Tokens === */
  :root {
    --pine:       #e8d5a3;   /* 松木浅黄 - 板材/工作面 */
    --pine-deep:  #d4bc82;   /* 松木深 */
    --walnut:     #3d2b1f;   /* 深胡桃墨线 - 文字/锯缝 */
    --walnut-2:   #5a4231;
    --walnut-3:   #8a6d54;
    --steel:      #6b7280;   /* 角尺钢灰 - 辅助 */
    --steel-2:    #9ca3af;
    --steel-3:    #d1d5db;
    --safety:     #e85d2b;   /* 安全橙 - 操作/警示 */
    --safety-2:   #f2994a;
    --paper:      #faf7f0;   /* 纸白底 */
    --paper-2:    #f0ebe0;
    --beech:      #c9a875;   /* 榉木 */
    --black-walnut: #2a1810;/* 黑胡桃 */
    
    --saw-kerf: 4px;
    
    --font-serif: "Noto Serif SC", "Source Han Serif SC", serif;
    --font-sans:  "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono:  "JetBrains Mono", "SF Mono", monospace;
    
    --ios-safe-top: 54px;
    --ios-safe-bottom: 34px;
    
    --tabbar-height: 84px;
    --nav-height: 44px;
  }
  
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: var(--font-sans);
    background: #2a2620;
    color: var(--walnut);
    overflow: hidden;
    height: 100%;
    user-select: none;
    -webkit-user-select: none;
  }
  
  /* === App Shell === */
  .app-stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #1a1612 0%, #2a2620 100%);
  }
  
  .app-frame {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 100%;
    max-height: 900px;
    background: var(--paper);
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  }
  
  @media (max-width: 500px) {
    .app-frame { max-width: 100%; max-height: 100%; }
  }
  
  /* === Status Bar (iOS style) === */
  .status-bar {
    position: absolute; top: 0; left: 0; right: 0;
    height: var(--ios-safe-top);
    display: flex; align-items: flex-end;
    justify-content: space-between;
    padding: 0 24px 8px;
    font-size: 15px; font-weight: 600;
    color: var(--walnut);
    z-index: 100;
    pointer-events: none;
    font-family: var(--font-sans);
  }
  .status-bar .status-right {
    display: flex; align-items: center; gap: 6px;
  }
  .status-bar .battery {
    width: 25px; height: 12px;
    border: 1.5px solid var(--walnut);
    border-radius: 3px;
    position: relative;
    opacity: 0.8;
  }
  .status-bar .battery::after {
    content: ''; position: absolute;
    right: -3px; top: 3px;
    width: 2px; height: 4px;
    background: var(--walnut);
    border-radius: 0 1px 1px 0;
    opacity: 0.6;
  }
  .status-bar .battery-fill {
    position: absolute; left: 1px; top: 1px; bottom: 1px;
    width: 75%;
    background: var(--walnut);
    border-radius: 1px;
  }
  .status-bar .signal {
    display: flex; align-items: flex-end; gap: 2px; height: 12px;
  }
  .status-bar .signal span {
    width: 3px; background: var(--walnut); border-radius: 1px;
  }
  .status-bar .signal span:nth-child(1) { height: 4px; }
  .status-bar .signal span:nth-child(2) { height: 6px; }
  .status-bar .signal span:nth-child(3) { height: 8px; }
  .status-bar .signal span:nth-child(4) { height: 11px; }
  
  /* === Nav Bar === */
  .nav-bar {
    position: absolute;
    top: var(--ios-safe-top);
    left: 0; right: 0;
    height: var(--nav-height);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 8px;
    z-index: 50;
    background: transparent;
  }
  .nav-btn {
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    border: none; background: transparent;
    cursor: pointer; color: var(--walnut);
  }
  .nav-btn:active { opacity: 0.5; }
  .nav-title {
    font-size: 17px; font-weight: 600;
    color: var(--walnut);
    font-family: var(--font-serif);
  }
  
  /* === Tab Bar === */
  .tab-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: var(--tabbar-height);
    padding-bottom: var(--ios-safe-bottom);
    display: flex;
    background: rgba(250, 247, 240, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 0.5px solid rgba(61, 43, 31, 0.15);
    z-index: 50;
  }
  .tab-item {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3px;
    color: var(--steel-2);
    font-size: 11px;
    cursor: pointer;
    transition: color 0.2s;
  }
  .tab-item.active { color: var(--safety); }
  .tab-item svg { width: 24px; height: 24px; }
  .tab-item:active { opacity: 0.6; }
  
  /* === Page Container === */
  .page-container {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden;
  }
  .page {
    position: absolute;
    inset: 0;
    background: var(--paper);
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }
  .page.has-tabbar { padding-bottom: var(--tabbar-height); }
  .page.has-nav { padding-top: calc(var(--ios-safe-top) + var(--nav-height)); }
  .page.has-status { padding-top: var(--ios-safe-top); }
  
  .page-enter-from-right {
    animation: slideInRight 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }
  .page-exit-to-right {
    animation: slideOutRight 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }
  @keyframes slideInRight {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }
  @keyframes slideOutRight {
    from { transform: translateX(0); }
    to { transform: translateX(100%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .page-enter-from-right, .page-exit-to-right { animation: none; }
  }
  
  /* === Workbench Page === */
  .workbench-header {
    padding: 8px 20px 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .workbench-title {
    font-family: var(--font-serif);
    font-size: 28px; font-weight: 700;
    color: var(--walnut);
    margin: 0;
    line-height: 1.2;
  }
  .workbench-subtitle {
    font-size: 12px; color: var(--steel);
    margin-top: 2px;
  }
  
  .board-info-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 20px;
    background: var(--paper-2);
    margin: 0 16px;
    border-radius: 12px;
    font-size: 13px;
  }
  .board-info-bar .board-label {
    color: var(--steel);
    font-size: 12px;
  }
  .board-info-bar .board-value {
    color: var(--walnut);
    font-weight: 600;
    font-family: var(--font-mono);
  }
  .board-change-btn {
    margin-left: auto;
    font-size: 12px;
    color: var(--safety);
    border: none;
    background: none;
    cursor: pointer;
    font-weight: 500;
  }
  
  /* Board Canvas */
  .board-wrap {
    position: relative;
    margin: 16px;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(61,43,31,0.15), inset 0 1px 2px rgba(255,255,255,0.5);
  }
  .board-canvas {
    position: relative;
    width: 100%;
    aspect-ratio: 1220 / 2440;
    background: var(--pine);
    background-image: 
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 28px,
        rgba(139, 115, 85, 0.08) 28px,
        rgba(139, 115, 85, 0.08) 32px
      ),
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 80px,
        rgba(101, 79, 53, 0.06) 80px,
        rgba(101, 79, 53, 0.06) 120px
      );
    cursor: default;
  }
  .board-grid-overlay {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(61,43,31,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(61,43,31,0.06) 1px, transparent 1px);
    background-size: calc(100% / 12.2) calc(100% / 24.4);
    pointer-events: none;
  }
  .board-edge-marks {
    position: absolute;
    inset: 0;
    pointer-events: none;
    border: 1.5px solid var(--walnut);
    box-sizing: border-box;
  }
  .board-ruler-h, .board-ruler-v {
    position: absolute;
    display: flex;
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--walnut);
    opacity: 0.6;
  }
  .board-ruler-h {
    bottom: -18px; left: 0; right: 0;
    height: 16px;
    justify-content: space-between;
    padding: 0 2px;
  }
  .board-ruler-v {
    left: -28px; top: 0; bottom: 0;
    width: 26px;
    flex-direction: column;
    align-items: flex-end;
    justify-content: space-between;
    padding: 2px 0;
  }
  
  .piece {
    position: absolute;
    background: var(--beech);
    background-image:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 6px,
        rgba(90, 60, 30, 0.12) 6px,
        rgba(90, 60, 30, 0.12) 8px
      );
    border: 1.5px solid var(--walnut);
    border-radius: 1px;
    cursor: grab;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    font-family: var(--font-mono);
    color: var(--walnut);
    transition: box-shadow 0.15s, transform 0.1s;
    touch-action: none;
    box-sizing: border-box;
  }
  .piece.dragging {
    cursor: grabbing;
    z-index: 1000;
    box-shadow: 0 8px 24px rgba(61,43,31,0.35);
    transition: none;
  }
  .piece .piece-label {
    background: rgba(250,247,240,0.9);
    padding: 2px 4px;
    border-radius: 2px;
    font-size: 9px;
    white-space: nowrap;
    pointer-events: none;
    font-weight: 500;
  }
  .piece .grain-arrow {
    position: absolute;
    top: 3px; left: 3px;
    font-size: 8px;
    color: var(--walnut);
    opacity: 0.7;
    pointer-events: none;
  }
  .piece.snapped {
    box-shadow: 0 0 0 2px var(--safety), 0 4px 12px rgba(61,43,31,0.2);
  }
  .piece.selected::after {
    content: '';
    position: absolute;
    inset: -3px;
    border: 2px dashed var(--safety);
    border-radius: 2px;
    pointer-events: none;
    animation: dashmove 0.8s linear infinite;
  }
  @keyframes dashmove {
    to { stroke-dashoffset: -10; }
  }
  
  /* Wood chip particles */
  .wood-chip {
    position: absolute;
    width: 4px; height: 4px;
    background: var(--pine-deep);
    border-radius: 50%;
    pointer-events: none;
    z-index: 999;
  }
  
  /* Utilization Bar */
  .util-bar {
    margin: 0 16px;
    padding: 12px 16px;
    background: var(--walnut);
    border-radius: 12px;
    color: var(--paper);
    display: flex; align-items: center; gap: 16px;
  }
  .util-value {
    font-family: var(--font-mono);
    font-size: 28px;
    font-weight: 700;
    color: var(--pine);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .util-label {
    font-size: 12px;
    opacity: 0.7;
    margin-top: 4px;
  }
  .util-stats {
    flex: 1;
    display: flex; flex-direction: column; gap: 6px;
  }
  .util-stat-row {
    display: flex; justify-content: space-between;
    font-size: 12px;
    opacity: 0.85;
  }
  .util-stat-row span:last-child {
    font-family: var(--font-mono);
    font-weight: 500;
  }
  
  /* Parts Tray */
  .parts-tray-section {
    padding: 16px;
  }
  .section-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .section-title {
    font-family: var(--font-serif);
    font-size: 18px;
    font-weight: 700;
    color: var(--walnut);
    margin: 0;
  }
  .section-action {
    font-size: 13px;
    color: var(--safety);
    background: none;
    border: none;
    cursor: pointer;
    font-weight: 500;
  }
  
  .parts-tray {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .part-card {
    background: var(--paper-2);
    border-radius: 10px;
    padding: 10px;
    display: flex; flex-direction: column; align-items: center;
    gap: 6px;
    cursor: grab;
    transition: transform 0.15s, box-shadow 0.15s;
    touch-action: none;
    border: 1px solid rgba(61,43,31,0.08);
  }
  .part-card:active {
    transform: scale(0.96);
  }
  .part-card.placed {
    opacity: 0.4;
    cursor: default;
  }
  .part-thumb {
    width: 100%;
    aspect-ratio: 1;
    background: var(--pine);
    border: 1px solid var(--walnut);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--walnut);
    position: relative;
    overflow: hidden;
  }
  .part-thumb::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 4px,
      rgba(90, 60, 30, 0.1) 4px,
      rgba(90, 60, 30, 0.1) 5px
    );
  }
  .part-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--walnut);
    text-align: center;
  }
  .part-dim {
    font-size: 10px;
    color: var(--steel);
    font-family: var(--font-mono);
  }
  .part-count {
    position: absolute;
    top: 4px; right: 4px;
    background: var(--safety);
    color: white;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 8px;
    font-weight: 600;
    z-index: 1;
  }
  
  /* === Floating Action Buttons === */
  .fab-group {
    position: absolute;
    right: 16px;
    bottom: calc(var(--tabbar-height) + 16px);
    display: flex; flex-direction: column; gap: 10px;
    z-index: 30;
  }
  .fab {
    width: 48px; height: 48px;
    border-radius: 14px;
    background: var(--safety);
    color: white;
    border: none;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(232,93,43,0.4);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .fab:active { transform: scale(0.92); }
  .fab.secondary {
    background: var(--paper);
    color: var(--walnut);
    box-shadow: 0 4px 12px rgba(61,43,31,0.15);
  }
  .fab svg { width: 22px; height: 22px; }
  
  /* === Bottom Sheet / Modal === */
  .sheet-backdrop {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200;
    opacity: 0;
    animation: fadeIn 0.25s forwards;
  }
  .sheet {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--paper);
    border-radius: 20px 20px 0 0;
    z-index: 201;
    max-height: 85%;
    overflow-y: auto;
    animation: slideUp 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    padding-bottom: var(--ios-safe-bottom);
  }
  .sheet-handle {
    width: 36px; height: 5px;
    background: var(--steel-3);
    border-radius: 3px;
    margin: 10px auto 16px;
  }
  .sheet-title {
    font-family: var(--font-serif);
    font-size: 20px;
    font-weight: 700;
    color: var(--walnut);
    padding: 0 20px 12px;
    margin: 0;
  }
  .sheet-body {
    padding: 0 20px 24px;
  }
  
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sheet { animation: none; }
    .sheet-backdrop { animation: none; opacity: 1; }
  }
  
  /* === Form Elements === */
  .form-group {
    margin-bottom: 16px;
  }
  .form-label {
    font-size: 13px;
    color: var(--steel);
    margin-bottom: 6px;
    display: block;
    font-weight: 500;
  }
  .form-input {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid var(--steel-3);
    border-radius: 10px;
    background: var(--paper-2);
    color: var(--walnut);
    font-family: var(--font-sans);
  }
  .form-input:focus {
    outline: none;
    border-color: var(--safety);
    background: var(--paper);
  }
  .form-row {
    display: flex; gap: 10px;
  }
  .form-row .form-group { flex: 1; }
  
  .btn-primary {
    width: 100%;
    padding: 14px;
    background: var(--safety);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
    font-family: var(--font-sans);
  }
  .btn-primary:active { opacity: 0.8; }
  .btn-secondary {
    width: 100%;
    padding: 14px;
    background: var(--paper-2);
    color: var(--walnut);
    border: 1px solid var(--steel-3);
    border-radius: 12px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--font-sans);
  }
  .btn-secondary:active { opacity: 0.7; }
  
  /* === List Items === */
  .list-item {
    display: flex; align-items: center;
    padding: 14px 16px;
    border-bottom: 0.5px solid rgba(61,43,31,0.08);
    gap: 12px;
    cursor: pointer;
  }
  .list-item:active { background: var(--paper-2); }
  .list-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: var(--pine);
    color: var(--walnut);
    flex-shrink: 0;
  }
  .list-content {
    flex: 1; min-width: 0;
  }
  .list-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--walnut);
    margin-bottom: 2px;
  }
  .list-subtitle {
    font-size: 12px;
    color: var(--steel);
    font-family: var(--font-mono);
  }
  .list-arrow {
    color: var(--steel-2);
    flex-shrink: 0;
  }
  
  /* === Plans Library === */
  .plans-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 16px;
  }
  .plan-card {
    background: var(--paper-2);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    border: 1px solid rgba(61,43,31,0.08);
    transition: transform 0.15s;
  }
  .plan-card:active { transform: scale(0.97); }
  .plan-thumb {
    width: 100%;
    aspect-ratio: 1220 / 2440;
    background: var(--pine);
    position: relative;
    overflow: hidden;
  }
  .plan-info {
    padding: 10px 12px;
  }
  .plan-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--walnut);
    margin-bottom: 2px;
  }
  .plan-meta {
    font-size: 11px;
    color: var(--steel);
    display: flex; justify-content: space-between;
    font-family: var(--font-mono);
  }
  .plan-util {
    color: var(--safety);
    font-weight: 600;
  }
  
  /* === Settings / Profile Page === */
  .settings-group {
    background: var(--paper-2);
    margin: 16px;
    border-radius: 14px;
    overflow: hidden;
  }
  .settings-item {
    display: flex; align-items: center;
    padding: 14px 16px;
    border-bottom: 0.5px solid rgba(61,43,31,0.08);
    gap: 12px;
    cursor: pointer;
  }
  .settings-item:last-child { border-bottom: none; }
  .settings-item:active { background: rgba(61,43,31,0.05); }
  .settings-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 14px;
  }
  .settings-label { flex: 1; font-size: 15px; color: var(--walnut); }
  .settings-value { font-size: 14px; color: var(--steel); }
  .settings-arrow { color: var(--steel-2); font-size: 14px; }
  
  /* === Design Specs Page === */
  .spec-page {
    padding: 20px;
    line-height: 1.6;
  }
  .spec-section {
    margin-bottom: 28px;
  }
  .spec-section h3 {
    font-family: var(--font-serif);

// ========== UTILIZATION COUNTER (with rolling number) ==========
function UtilCounter({ value }) {
  const [display, setDisplay] = useState(value);
  const rafRef = useRef(null);
  const prevRef = useRef(value);
  const reducedMotion = useRef(false);
  
  useEffect(() => {
    const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    reducedMotion.current = mq.matches;
    const handler = (e) => { reducedMotion.current = e.matches; };
    mq.addEventListener ? mq.addEventListener('change', handler) : mq.addListener(handler);
    return () => mq.removeEventListener ? mq.removeEventListener('change', handler) : mq.removeListener(handler);
  }, []);
  
  useEffect(() => {
    const start = prevRef.current;
    const end = value;
    if (start === end || reducedMotion.current) {
      setDisplay(end);
      prevRef.current = end;
      return;
    }
    
    const duration = 400;
    const startTime = performance.now();
    
    const tick = (now) => {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      const current = start + (end - start) * eased;
      setDisplay(current);
      if (progress < 1) {
        rafRef.current = requestAnimationFrame(tick);
      } else {
        prevRef.current = end;
      }
    };
    
    rafRef.current = requestAnimationFrame(tick);
    
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [value]);
  
  useEffect(() => {
    const handleVisibility = () => {
      if (document.hidden && rafRef.current) {
        cancelAnimationFrame(rafRef.current);
        rafRef.current = null;
        setDisplay(value);
        prevRef.current = value;
      }
    };
    document.addEventListener('visibilitychange', handleVisibility);
    return () => document.removeEventListener('visibilitychange', handleVisibility);
  }, [value]);
  
  return (
    <span className="util-value util-rolling">{display.toFixed(1)}</span>
  );
}

// ========== WOOD CHIP EFFECT ==========
function spawnWoodChips(containerEl, x, y) {
  if (!containerEl) return;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) return;
  
  const count = 5 + Math.floor(Math.random() * 4);
  for (let i = 0; i < count; i++) {
    const chip = document.createElement('div');
    chip.className = 'wood-chip';
    const angle = Math.random() * Math.PI * 2;
    const dist = 20 + Math.random() * 30;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;
    chip.style.left = x + 'px';
    chip.style.top = y + 'px';
    chip.style.opacity = '0.9';
    chip.style.transform = 'scale(1)';
    containerEl.appendChild(chip);
    
    const startTime = performance.now();
    const duration = 500 + Math.random() * 300;
    const startX = x, startY = y;
    const endX = x + dx, endY = y + dy;
    
    const animate = (now) => {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 2);
      const curX = startX + (endX - startX) * eased;
      const curY = startY + (endY - startY) * eased + (progress * progress * 10);
      chip.style.left = curX + 'px';
      chip.style.top = curY + 'px';
      chip.style.opacity = (1 - progress) * 0.9;
      chip.style.transform = `scale(${1 - progress * 0.5}) rotate(${progress * 180}deg)`;
      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        if (chip.parentNode) chip.parentNode.removeChild(chip);
      }
    };
    requestAnimationFrame(animate);
  }
}

  const utilization = useMemo(() => {
    const boardArea = board.width * board.height;
    const pieceArea = placedPieces.reduce((sum, p) => sum + p.width * p.height, 0);
    if (boardArea === 0) return 0;
    return (pieceArea / boardArea) * 100;
  }, [placedPieces, board]);
  
  const totalPieceArea = useMemo(() => 
    placedPieces.reduce((sum, p) => sum + p.width * p.height, 0),
  [placedPieces]);
  
  const remainingPieces = useMemo(() => {
    const placedCounts = {};
    placedPieces.forEach(p => {
      placedCounts[p.partId] = (placedCounts[p.partId] || 0) + 1;
    });
    return parts.map(p => ({
      ...p,
      remaining: p.count - (placedCounts[p.id] || 0)
    }));
  }, [parts, placedPieces]);
  
  // Convert mm to board pixel percentage
  const mmToPct = useCallback((mmW, mmH) => {
    return {
      wPct: (mmW / board.width) * 100,
      hPct: (mmH / board.height) * 100,
    };
  }, [board]);
  
  // Snap to grid and edges (with saw kerf)
  const snapPosition = useCallback((xPct, yPct, wPct, hPct, selfId) => {
    const snapThreshold = 1.5; // percentage
    let newX = xPct;
    let newY = yPct;
    let snapped = false;
    
    // Kerf in percentage
    const kerfXPct = (SAW_KERF_MM / board.width) * 100;
    const kerfYPct = (SAW_KERF_MM / board.height) * 100;
    
    // Snap to board edges
    if (Math.abs(xPct) < snapThreshold) { newX = 0; snapped = true; }
    if (Math.abs(yPct) < snapThreshold) { newY = 0; snapped = true; }
    if (Math.abs(xPct + wPct - 100) < snapThreshold) { newX = 100 - wPct; snapped = true; }
    if (Math.abs(yPct + hPct - 100) < snapThreshold) { newY = 100 - hPct; snapped = true; }
    
    // Snap to other pieces
    placedPieces.forEach(p => {
      if (p.id === selfId) return;
      const { wPct: pwPct, hPct: phPct } = mmToPct(p.width, p.height);
      const pLeft = p.xPct;
      const pRight = p.xPct + pwPct;
      const pTop = p.yPct;
      const pBottom = p.yPct + phPct;
      
      // Left edge to piece right + kerf
      if (Math.abs(xPct - (pRight + kerfXPct)) < snapThreshold) {
        newX = pRight + kerfXPct;
        snapped = true;
      }
      // Right edge to piece left - kerf
      if (Math.abs((xPct + wPct) - (pLeft - kerfXPct)) < snapThreshold) {
        newX = pLeft - kerfXPct - wPct;
        snapped = true;
      }
      // Top edge to piece bottom + kerf
      if (Math.abs(yPct - (pBottom + kerfYPct)) < snapThreshold) {
        newY = pBottom + kerfYPct;
        snapped = true;
      }
      // Bottom edge to piece top - kerf
      if (Math.abs((yPct + hPct) - (pTop - kerfYPct)) < snapThreshold) {
        newY = pTop - kerfYPct - hPct;
        snapped = true;
      }
    });
    
    // Also snap piece edges aligned (same x / same y lines)
    placedPieces.forEach(p => {
      if (p.id === selfId) return;
      const { wPct: pwPct, hPct: phPct } = mmToPct(p.width, p.height);
      
      // Left to left
      if (Math.abs(xPct - p.xPct) < snapThreshold) { newX = p.xPct; snapped = true; }
      // Right to right
      if (Math.abs((xPct + wPct) - (p.xPct + pwPct)) < snapThreshold) {
        newX = p.xPct + pwPct - wPct;
        snapped = true;
      }
      // Top to top
      if (Math.abs(yPct - p.yPct) < snapThreshold) { newY = p.yPct; snapped = true; }
      // Bottom to bottom
      if (Math.abs((yPct + hPct) - (p.yPct + phPct)) < snapThreshold) {
        newY = p.yPct + phPct - hPct;
        snapped = true;
      }
    });
    
    return { xPct: newX, yPct: newY, snapped };
  }, [placedPieces, mmToPct, board]);
  
  // Drag from part card (new piece)
  const handlePartCardDragStart = useCallback((e, part) => {
    if (e.type === 'touchstart') {
      e.preventDefault();
    }
    
    const remaining = part.count - placedPieces.filter(p => p.partId === part.id).length;
    if (remaining <= 0) return;
    
    const touch = e.touches ? e.touches[0] : e;
    const boardRect = boardRef.current.getBoundingClientRect();
    
    dragRef.current = {
      isDragging: true,
      pieceId: generateId(),
      offsetX: 30,
      offsetY: 30,
      startX: touch.clientX,
      startY: touch.clientY,
      pieceWidth: part.width,
      pieceHeight: part.height,
      isNew: true,
      partId: part.id,
      moved: false,
      partName: part.name,
    };
    
    // Create phantom element at cursor
    const phantom = document.createElement('div');
    phantom.className = 'piece dragging';
    phantom.id = 'drag-phantom';
    phantom.style.position = 'fixed';
    phantom.style.zIndex = '9999';
    phantom.style.pointerEvents = 'none';
    
    // Size based on board scale
    const scale = boardRect.width / board.width;
    phantom.style.width = (part.width * scale) + 'px';
    phantom.style.height = (part.height * scale) + 'px';
    phantom.style.left = (touch.clientX - 30) + 'px';
    phantom.style.top = (touch.clientY - 30) + 'px';
    phantom.innerHTML = `<span class="piece-label">${part.name}</span><div class="grain-hint"></div>`;
    document.body.appendChild(phantom);
    
    onSelectPiece(null);
  }, [board, placedPieces, onSelectPiece]);
  
  // Dragging on board (existing piece)
  const handlePiecePointerDown = useCallback((e, piece) => {
    e.stopPropagation();
    if (e.type === 'touchstart') e.preventDefault();
    
    const touch = e.touches ? e.touches[0] : e;
    const boardRect = boardRef.current.getBoundingClientRect();
    const { wPct, hPct } = mmToPct(piece.width, piece.height);
    
    const pieceLeftPx = (piece.xPct / 100) * boardRect.width;
    const pieceTopPx = (piece.yPct / 100) * boardRect.height;
    
    dragRef.current = {
      isDragging: true,
      pieceId: piece.id,
      offsetX: touch.clientX - boardRect.left - pieceLeftPx,
      offsetY: touch.clientY - boardRect.top - pieceTopPx,
      startX: touch.clientX,
      startY: touch.clientY,
      pieceWidth: piece.width,
      pieceHeight: piece.height,
      isNew: false,
      partId: piece.partId,
      moved: false,
      partName: piece.name,
      rotation: piece.rotation || 0,
    };
    
    onSelectPiece(piece.id);
  }, [mmToPct, onSelectPiece]);
  
  // Global mouse/touch move handler
  useEffect(() => {
    const handleMove = (e) => {
      if (!dragRef.current.isDragging) return;
      
      const touch = e.touches ? e.touches[0] : e;
      const boardRect = boardRef.current.getBoundingClientRect();
      const drag = dragRef.current;
      
      drag.moved = true;
      
      // Update phantom position
      const phantom = document.getElementById('drag-phantom');
      if (phantom && drag.isNew) {
        phantom.style.left = (touch.clientX - drag.offsetX) + 'px';
        phantom.style.top = (touch.clientY - drag.offsetY) + 'px';
      }
      
      // Update existing piece position on board
      if (!drag.isNew) {
        const { wPct, hPct } = mmToPct(drag.pieceWidth, drag.pieceHeight);
        let xPx = touch.clientX - boardRect.left - drag.offsetX;
        let yPx = touch.clientY - boardRect.top - drag.offsetY;
        
        // Boundary clamp
        xPx = Math.max(0, Math.min(boardRect.width - (drag.pieceWidth / board.width) * boardRect.width, xPx));
        yPx = Math.max(0, Math.min(boardRect.height - (drag.pieceHeight / board.height) * boardRect.height, yPx));
        
        const xPct = (xPx / boardRect.width) * 100;
        const yPct = (yPx / boardRect.height) * 100;
        
        // Update piece position directly (bypass React for perf)
        const pieceEl = document.querySelector(`.piece[data-id="${drag.pieceId}"]`);
        if (pieceEl) {
          pieceEl.style.left = xPct + '%';
          pieceEl.style.top = yPct + '%';
        }
        
        // Throttled snap check
        if (snapRafRef.current) cancelAnimationFrame(snapRafRef.current);
        snapRafRef.current = requestAnimationFrame(() => {
          const { xPct: sx, yPct: sy, snapped } = snapPosition(xPct, yPct, wPct, hPct, drag.pieceId);
          setSnapFeedback(snapped);
          if (pieceEl) {
            if (snapped) {
              pieceEl.style.left = sx + '%';
              pieceEl.style.top = sy + '%';
              pieceEl.classList.add('snapped');
            } else {
              pieceEl.classList.remove('snapped');
            }
          }
        });
      }
    };
    
    const handleEnd = (e) => {
      if (!dragRef.current.isDragging) return;
      
      const drag = dragRef.current;
      const touch = e.changedTouches ? e.changedTouches[0] : e;
      const boardRect = boardRef.current.getBoundingClientRect();
      const boardWrapRect = boardWrapRef.current.getBoundingClientRect();
      
      const inBoard = 
        touch.clientX >= boardWrapRect.left &&
        touch.clientX <= boardWrapRect.right &&
        touch.clientY >= boardWrapRect.top &&
        touch.clientY <= boardWrapRect.bottom;
      
      const { wPct, hPct } = mmToPct(drag.pieceWidth, drag.pieceHeight);
      
      if (drag.isNew) {
        // Remove phantom
        const phantom = document.getElementById('drag-phantom');
        if (phantom && phantom.parentNode) phantom.parentNode.removeChild(phantom);
        
        if (inBoard) {
          let xPx = touch.clientX - boardRect.left - drag.offsetX;
          let yPx = touch.clientY - boardRect.top - drag.offsetY;
          xPx = Math.max(0, Math.min(boardRect.width - wPct/100*boardRect.width, xPx));
          yPx = Math.max(0, Math.min(boardRect.height - hPct/100*boardRect.height, yPx));
          
          let xPct = (xPx / boardRect.width) * 100;
          let yPct = (yPx / boardRect.height) * 100;
          
          const snap = snapPosition(xPct, yPct, wPct, hPct, drag.pieceId);
          xPct = snap.xPct;
          yPct = snap.yPct;
          
          // Wood chip effect at drop point
          const dropX = touch.clientX - boardWrapRect.left;
          const dropY = touch.clientY - boardWrapRect.top;
          spawnWoodChips(boardWrapRef.current, dropX, dropY);
          
          const newPiece = {
            id: drag.pieceId,
            partId: drag.partId,
            name: drag.partName,
            width: drag.pieceWidth,
            height: drag.pieceHeight,
            xPct,
            yPct,
            rotation: 0,
          };
          onPlacedChange([...placedPieces, newPiece]);
        }
      } else {
        // Existing piece: commit final position
        const pieceEl = document.querySelector(`.piece[data-id="${drag.pieceId}"]`);
        let xPct, yPct;
        if (pieceEl) {
          xPct = parseFloat(pieceEl.style.left);
          yPct = parseFloat(pieceEl.style.top);
          pieceEl.classList.remove('snapped', 'dragging');
        } else {
          xPct = 0; yPct = 0;
        }
        
        if (!drag.moved) {
          // Click without drag - select piece
          onSelectPiece(drag.pieceId);
        } else {
          // Wood chip at drop
          const dropX = touch.clientX - boardWrapRect.left;
          const dropY = touch.clientY - boardWrapRect.top;
          spawnWoodChips(boardWrapRef.current, dropX, dropY);
          
          onPlacedChange(placedPieces.map(p => 
            p.id === drag.pieceId ? { ...p, xPct, yPct } : p
          ));
        }
      }
      
      if (snapRafRef.current) {
        cancelAnimationFrame(snapRafRef.current);
        snapRafRef.current = null;
      }
      setSnapFeedback(false);
      dragRef.current = { isDragging: false };
    };
    
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);
    window.addEventListener('touchmove', handleMove, { passive: false });
    window.addEventListener('touchend', handleEnd);
    
    return () => {
      window.removeEventListener('mousemove', handleMove);
      window.removeEventListener('mouseup', handleEnd);
      window.removeEventListener('touchmove', handleMove);
      window.removeEventListener('touchend', handleEnd);
    };
  }, [placedPieces, onPlacedChange, mmToPct, snapPosition, onSelectPiece]);
  
  // Board click - deselect
  const handleBoardClick = useCallback((e) => {
    if (e.target === boardRef.current || e.target.classList.contains('board-grid-overlay') || e.target.classList.contains('board-edge-marks')) {
      onSelectPiece(null);
    }
  }, [onSelectPiece]);
  
  // Render ruler ticks
  const renderRulers = () => {
    const hTicks = [];
    const vTicks = [];
    for (let i = 0; i <= 12; i += 2) {
      hTicks.push(<span key={i}>{i * 100}</span>);
    }
    for (let i = 0; i <= 24; i += 4) {
      vTicks.push(<span key={i}>{i * 100}</span>);
    }
    return (
      <>
        <div className="board-ruler-h">{hTicks}</div>
        <div className="board-ruler-v">{vTicks}</div>
      </>
    );
  };
  
  return (
    <div className="page has-tabbar has-status" style={{paddingTop:0}}>
      <StatusBar />
      
      <div style={{paddingTop: 'var(--ios-safe-top)'}}>
        <div className="workbench-header">
          <div>
            <h1 className="workbench-title">开料台</h1>
            <div className="workbench-subtitle">{currentPlan ? currentPlan.name : '新建方案'}</div>
          </div>
          <button className="board-change-btn" style={{fontSize:12}} onClick={onOpenAddPart}>
            ＋ 添加零件
          </button>
        </div>
        
        <div className="board-info-bar">
          <Icon.Ruler style={{width:16, height:16, color:'var(--steel)'}} />
          <span className="board-label">当前板材</span>
          <span className="board-value">{board.name}</span>
          <span className="board-label" style={{marginLeft:'auto'}}>{board.width}×{board.height}</span>
          <button className="board-change-btn" onClick={onSelectBoard}>更换</button>
        </div>
        
        <div className="board-wrap" ref={boardWrapRef} style={{marginLeft: 44, marginRight: 16}}>
          <div 
            className="board-canvas" 
            ref={boardRef}
            onClick={handleBoardClick}
            style={{backgroundColor: getBoardColor(board.type)}}
          >
            <div className="board-grid-overlay" />
            <div className="board-edge-marks" />
            
            {/* Placed pieces */}
            {placedPieces.map(piece => {
              const { wPct, hPct } = mmToPct(piece.width, piece.height);
              const isSelected = selectedPieceId === piece.id;
              return (
                <div
                  key={piece.id}
                  data-id={piece.id}
                  className={`piece ${isSelected ? 'selected' : ''} ${piece.rotation ? 'rotated' : ''}`}
                  style={{
                    left: piece.xPct + '%',
                    top: piece.yPct + '%',
                    width: wPct + '%',
                    height: hPct + '%',
                  }}
                  onMouseDown={(e) => handlePiecePointerDown(e, piece)}
                  onTouchStart={(e) => handlePiecePointerDown(e, piece)}
                >
                  <span className="piece-label">{piece.name}</span>
                  <div className="grain-hint" />
                  {isSelected && (
                    <div className="piece-controls" style={{top: -38, left: '50%', transform: 'translateX(-50%)'}}>
                      <button className="piece-control-btn" 
                        onClick={(e) => { e.stopPropagation(); onRotatePiece(piece.id); }}
                        onMouseDown={(e) => e.stopPropagation()}
                        onTouchStart={(e) => e.stopPropagation()}
                      >
                        <Icon.Rotate style={{width:16, height:16}} />
                      </button>
                      <button className="piece-control-btn"
                        style={{color:'var(--safety)'}}
                        onClick={(e) => { e.stopPropagation(); onRemovePiece(piece.id); }}
                        onMouseDown={(e) => e.stopPropagation()}
                        onTouchStart={(e) => e.stopPropagation()}
                      >
                        <Icon.Trash style={{width:16, height:16}} />
                      </button>
                    </div>
                  )}
                </div>
              );
            })}
            
            {renderRulers()}
          </div>
        </div>
        
        <div className="util-bar" style={{marginTop: 20}}>
          <div>
            <UtilCounter value={utilization} />
            <div className="util-label">板材利用率</div>
          </div>
          <div className="util-stats">
            <div className="util-stat-row">
              <span>零件总面积</span>
              <span>{(totalPieceArea / 1000000).toFixed(3)} m²</span>
            </div>
            <div className="util-stat-row">
              <span>板材面积</span>
              <span>{(board.width * board.height / 1000000).toFixed(3)} m²</span>
            </div>
            <div className="util-stat-row">
              <span>锯缝宽度</span>
              <span>{SAW_KERF_MM} mm</span>
            </div>
          </div>
        </div>
        
        {utilization < 40 && placedPieces.length > 0 && (
          <div className="util-warning" style={{marginTop: 12}}>
            <Icon.Percent style={{width:16, height:16, flexShrink:0}} />
            <span>利用率偏低，尝试调整零件排布方向或拼接更紧凑</span>
          </div>
        )}
        
        <div className="parts-tray-section">
          <div className="section-header">
            <h2 className="section-title">零件库</h2>
            <button className="section-action" onClick={onOpenAddPart}>管理</button>
          </div>
          <div className="parts-tray">
            {remainingPieces.map(part => {
              const allPlaced = part.remaining <= 0;
              return (
                <div 
                  key={part.id}
                  className={`part-card ${allPlaced ? 'placed' : ''}`}
                  onMouseDown={(e) => !allPlaced && handlePartCardDragStart(e, part)}
                  onTouchStart={(e) => !allPlaced && handlePartCardDragStart(e, part)}
                >
                  <div className="part-thumb" style={{aspectRatio: `${part.width}/${part.height}`}}>
                    {part.remaining > 0 && (
                      <span className="part-count">{part.remaining}</span>
                    )}
                    <span style={{fontSize: 9, position: 'relative', zIndex: 1}}>
                      {part.width}×{part.height}
                    </span>
                  </div>
                  <div className="part-name">{part.name}</div>
                  <div className="part-dim">{part.width}×{part.height} mm</div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
      
      {/* FAB Group */}
      <div className="fab-group">
        <button className="fab secondary" onClick={onClearBoard} title="清空">
          <Icon.Refresh />
        </button>
        <button className="fab" onClick={onSavePlan} title="保存">
          <Icon.Save />
        </button>
      </div>
    </div>
  );
}

// ========== PARTS PAGE ==========
function PartsPage({ parts, onUpdateParts, placedPieces }) {
  const [showAdd, setShowAdd] = useState(false);
  const [newPart, setNewPart] = useState({ name: '', width: '', height: '', count: 1 });
  
  const placedCounts = useMemo(() => {
    const counts = {};
    placedPieces.forEach(p => {
      counts[p.partId] = (counts[p.partId] || 0) + 1;
    });
    return counts;
  }, [placedPieces]);
  
  const handleAdd = () => {
    if (!newPart.name || !newPart.width || !newPart.height) return;
    const part = {
      id: generateId(),
      name: newPart.name,
      width: parseInt(newPart.width),
      height: parseInt(newPart.height),
      count: parseInt(newPart.count) || 1,
      placed: 0,
    };
    onUpdateParts([...parts, part]);
    setNewPart({ name: '', width: '', height: '', count: 1 });
    setShowAdd(false);
  };
  
  const handleRemove = (id) => {
    onUpdateParts(parts.filter(p => p.id !== id));
  };
  
  return (
    <div className="page has-tabbar has-status" style={{paddingTop:0}}>
      <StatusBar />
      <div style={{paddingTop: 'var(--ios-safe-top)'}}>
        <div className="workbench-header">
          <div>
            <h1 className="workbench-title">零件清单</h1>
            <div className="workbench-subtitle">共 {parts.length} 种零件</div>
          </div>
          <button className="board-change-btn" onClick={() => setShowAdd(true)}>
            ＋ 新增
          </button>
        </div>
        
        <div style={{padding: '0 16px'}}>
          {parts.map(part => (
            <div key={part.id} className="list-item" style={{paddingLeft: 0, paddingRight: 0}}>
              <div className="list-icon">
                <Icon.Wood style={{width:20, height:20}} />
              </div>
              <div className="list-content">
                <div className="list-title">{part.name}</div>
                <div className="list-subtitle">
                  {part.width}×{part.height} mm · 数量 {part.count} · 已下料 {placedCounts[part.id] || 0}
                </div>
              </div>
              <button 
                className="nav-btn" 
                style={{width: 36, height: 36, color: 'var(--safety)'}}
                onClick={() => handleRemove(part.id)}
              >
                <Icon.Trash style={{width:18, height:18}} />
              </button>
            </div>
          ))}
        </div>
        
        {parts.length === 0 && (
          <div className="empty-state">
            <div className="empty-icon">
              <Icon.Wood style={{width:48, height:48}} />
            </div>
            <div className="empty-title">暂无零件</div>
            <div className="empty-desc">点击右上角「新增」添加家具零件</div>
          </div>
        )}
      </div>
      
      {/* Add Part Sheet */}
      {showAdd && (
        <>
          <div className="sheet-backdrop" onClick={() => setShowAdd(false)} />
          <div className="sheet">
            <div className="sheet-handle" />
            <h3 className="sheet-title">添加零件</h3>
            <div className="sheet-body">
              <div className="form-group">
                <label className="form-label">零件名称</label>
                <input 
                  className="form-input" 
                  placeholder="如：顶板、侧板"
                  value={newPart.name}
                  onChange={(e) => setNewPart({...newPart, name: e.target.value})}
                />
              </div>
              <div className="form-row">
                <div className="form-group">
                  <label className="form-label">宽度 (mm)</label>
                  <input 
                    className="form-input" 
                    type="number"
                    placeholder="600"
                    value={newPart.width}
                    onChange={(e) => setNewPart({...newPart, width: e.target.value})}
                  />
                </div>
                <div className="form-group">
                  <label className="form-label">高度 (mm)</label>
                  <input 
                    className="form-input" 
                    type="number"
                    placeholder="200"
                    value={newPart.height}
                    onChange={(e) => setNewPart({...newPart, height: e.target.value})}
                  />
                </div>
              </div>
              <div className="form-group">
                <label className="form-label">数量</label>
                <input 
                  className="form-input" 
                  type="number"
                  value={newPart.count}
                  onChange={(e) => setNewPart({...newPart, count: e.target.value})}
                />
              </div>
              <button className="btn-primary" onClick={handleAdd} style={{marginTop: 8}}>
                添加零件
              </button>
              <button className="btn-secondary" onClick={() => setShowAdd(false)} style={{marginTop: 10}}>
                取消
              </button>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

// ========== PLANS LIBRARY PAGE ==========
function PlansLibraryPage({ plans, onLoadPlan, onDeletePlan, onNewPlan }) {
  return (
    <div className="page has-tabbar has-status" style={{paddingTop:0}}>
      <StatusBar />
      <div style={{paddingTop: 'var(--ios-safe-top)'}}>
        <div className="workbench-header">
          <div>
            <h1 className="workbench-title">方案库</h1>
            <div className="workbench-subtitle">已保存 {plans.length} 个套裁方案</div>
          </div>
          <button className="board-change-btn" onClick={onNewPlan}>
            ＋ 新建
          </button>
        </div>
        
        {plans.length === 0 ? (
          <div className="empty-state">
            <div className="empty-icon">
              <Icon.Library style={{width:48, height:48}} />
            </div>
            <div className="empty-title">暂无保存的方案</div>
            <div className="empty-desc">在开料台完成套裁后点击保存<br/>方案会自动存储到本地</div>
          </div>
        ) : (
          <div className="plans-grid">
            {plans.map(plan => {
              const utilization = plan.placedPieces.reduce((s, p) => s + p.width * p.height, 0) / 
                (plan.board.width * plan.board.height) * 100;
              return (
                <div key={plan.id} className="plan-card" onClick={() => onLoadPlan(plan)}>
                  <div className="plan-thumb" style={{backgroundColor: getBoardColor(plan.board.type)}}>
                    {/* Mini pieces preview */}
                    {plan.placedPieces.map((p, i) => (
                      <div key={i} style={{
                        position: 'absolute',
                        left: p.xPct + '%',
                        top: p.yPct + '%',
                        width: (p.width / plan.board.width * 100) + '%',
                        height: (p.height / plan.board.height * 100) + '%',
                        background: 'rgba(201, 168, 117, 0.8)',
                        border: '0.5px solid var(--walnut)',
                      }} />
                    ))}
                  </div>
                  <div className="plan-info">
                    <div className="plan-name">{plan.name}</div>
                    <div className="plan-meta">
                      <span>{plan.placedPieces.length}件</span>
                      <span className="plan-util">{utilization.toFixed(1)}%</span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

// ========== MAIN APP ==========
function App() {
  // Tab state
  const [activeTab, setActiveTab] = useState('workbench');
  
  // Page stack for navigation
  const [pageStack, setPageStack] = useState([]);
  
  // Board state
  const [board, setBoard] = useState(BOARD_SPECS[0]);
  const [showBoardSelect, setShowBoardSelect] = useState(false);
  
  // Parts state
  const [parts, setParts] = useState(DEFAULT_PARTS);
  
  // Placed pieces on the board
  const [placedPieces, setPlacedPieces] = useState([]);
  
  // Selected piece
  const [selectedPieceId, setSelectedPieceId] = useState(null);
  
  // Plans
  const [plans, setPlans] = useState([]);
  const [currentPlan, setCurrentPlan] = useState(null);
  const [showSaveSheet, setShowSaveSheet] = useState(false);
  
  // Toast
  const [toast, setToast] = useState({ show: false, message: '' });
  const toastTimerRef = useRef(null);
  
  // localStorage key
  const STORAGE_KEY = 'muzuo_workshop_data';
  
  // Load from localStorage
  useEffect(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const data = JSON.parse(saved);
        if (data.plans) setPlans(data.plans);
        if (data.parts) setParts(data.parts);
      }
    } catch (e) {
      console.warn('Failed to load from localStorage:', e);
    }
  }, []);
  
  // Save to localStorage
  useEffect(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ plans, parts }));
    } catch (e) {
      console.warn('Failed to save to localStorage:', e);
    }
  }, [plans, parts]);
  
  const showToast = useCallback((message) => {
    setToast({ show: true, message });
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    toastTimerRef.current = setTimeout(() => {
      setToast(t => ({ ...t, show: false }));
    }, 2000);
  }, []);
  
  // Rotate piece 90 degrees
  const handleRotatePiece = useCallback((pieceId) => {
    setPlacedPieces(prev => prev.map(p => {
      if (p.id !== pieceId) return p;
      // Swap width and height, adjust position to stay within bounds
      const newWidth = p.height;
      const newHeight = p.width;
      
      // Check if rotation would cause overflow
      let newXPct = p.xPct;
      let newYPct = p.yPct;
      
      const wPctAfter = (newWidth / board.width) * 100;
      const hPctAfter = (newHeight / board.height) * 100;
      
      if (newXPct + wPctAfter > 100) newXPct = 100 - wPctAfter;
      if (newYPct + hPctAfter > 100) newYPct = 100 - hPctAfter;
      if (newXPct < 0) newXPct = 0;
      if (newYPct < 0) newYPct = 0;
      
      return {
        ...p,
        width: newWidth,
        height: newHeight,
        xPct: newXPct,
        yPct: newYPct,
        rotation: p.rotation ? 0 : 90,
      };
    }));
  }, [board]);
  
  // Remove piece
  const handleRemovePiece = useCallback((pieceId) => {
    setPlacedPieces(prev => prev.filter(p => p.id !== pieceId));
    setSelectedPieceId(null);
  }, []);
  
  // Save plan
  const handleSavePlan = useCallback((name) => {
    const plan = {
      id: generateId(),
      name,
      board,
      parts: JSON.parse(JSON.stringify(parts)),
      placedPieces: JSON.parse(JSON.stringify(placedPieces)),
      createdAt: Date.now(),
    };
    setPlans(prev => [plan, ...prev]);
    setCurrentPlan(plan);
    setShowSaveSheet(false);
    showToast('方案已保存');
  }, [board, parts, placedPieces, showToast]);
  
  // Load plan
  const handleLoadPlan = useCallback((plan) => {
    setBoard(plan.board);
    setParts(plan.parts);
    setPlacedPieces(plan.placedPieces);
    setCurrentPlan(plan);
    setActiveTab('workbench');
    setSelectedPieceId(null);
    showToast(`已载入「${plan.name}」`);
  }, [showToast]);
  
  // New plan
  const handleNewPlan = useCallback(() => {
    setBoard(BOARD_SPECS[0]);
    setParts(DEFAULT_PARTS);
    setPlacedPieces([]);
    setCurrentPlan(null);
    setSelectedPieceId(null);
    setActiveTab('workbench');
    showToast('新建方案');
  }, [showToast]);
  
  // Clear board
  const handleClearBoard = useCallback(() => {
    setPlacedPieces([]);
    setSelectedPieceId(null);
    showToast('已清空板材');
  }, [showToast]);
  
  // Reset all data
  const handleResetData = useCallback(() => {
    setPlans([]);
    setParts(DEFAULT_PARTS);
    setPlacedPieces([]);
    setCurrentPlan(null);
    localStorage.removeItem(STORAGE_KEY);
    showToast('数据已清除');
  }, [showToast]);
  
  // Navigation helpers
  const pushPage = useCallback((pageKey) => {
    setPageStack(prev => [...prev, pageKey]);
  }, []);
  
  const popPage = useCallback(() => {
    setPageStack(prev => prev.slice(0, -1));
  }, []);
  
  // Handle tab change - deselect piece
  const handleTabChange = useCallback((tab) => {
    setActiveTab(tab);
    setSelectedPieceId(null);
  }, []);
  
  const topPage = pageStack[pageStack.length - 1];
  
  return (
    <div className="app-stage">
      <div className="app-frame">
        {/* Main pages (tab bar pages) */}
        <div className="page-container">
          {activeTab === 'workbench' && (
            <WorkbenchPage
              board={board}
              parts={parts}
              placedPieces={placedPieces}
              onPlacedChange={setPlacedPieces}
              onSelectBoard={() => setShowBoardSelect(true)}
              onOpenAddPart={() => setActiveTab('parts')}
              currentPlan={currentPlan}
              onSavePlan={() => setShowSaveSheet(true)}
              onClearBoard={handleClearBoard}
              selectedPieceId={selectedPieceId}
              onSelectPiece={setSelectedPieceId}
              onRotatePiece={handleRotatePiece}
              onRemovePiece={handleRemovePiece}
            />
          )}
          {activeTab === 'parts' && (
            <PartsPage 
              parts={parts} 
              onUpdateParts={setParts}
              placedPieces={placedPieces}
            />
          )}
          {activeTab === 'library' && (
            <PlansLibraryPage 
              plans={plans}
              onLoadPlan={handleLoadPlan}
              onNewPlan={handleNewPlan}
            />
          )}
          {activeTab === 'settings' && (
            <SettingsPage
              onOpenSpecs={() => pushPage('specs')}
              onOpenApi={() => pushPage('api')}
              onResetData={handleResetData}
            />
          )}
        </div>
        
        {/* Tab bar */}
        <TabBar activeTab={activeTab} onTabChange={handleTabChange} />
        
        {/* Pushed pages (stack) */}
        {topPage === 'specs' && (
          <DesignSpecPage onBack={popPage} />
        )}
        {topPage === 'api' && (
          <ApiDocsPage onBack={popPage} />
        )}
        
        {/* Board select sheet */}
        {showBoardSelect && (
          <BoardSelectSheet
            currentBoard={board}
            onSelect={(b) => {
              setBoard(b);
              // Recalculate positions if pieces are out of bounds
              setPlacedPieces(prev => prev.map(p => {
                const wPct = (p.width / b.width) * 100;
                const hPct = (p.height / b.height) * 100;
                let x = Math.min(p.xPct, 100 - wPct);
                let y = Math.min(p.yPct, 100 - hPct);
                if (x < 0) x = 0;
                if (y < 0) y = 0;
                return { ...p, xPct: x, yPct: y };
              }));
              showToast(`已切换至 ${b.name}`);
            }}
            onClose={() => setShowBoardSelect(false)}
          />
        )}
        
        {/* Save plan sheet */}
        {showSaveSheet && (
          <SavePlanSheet
            defaultName={currentPlan ? currentPlan.name : '三层小书架方案'}
            onSave={handleSavePlan}
            onClose={() => setShowSaveSheet(false)}
          />
        )}
        
        {/* Toast */}
        <Toast message={toast.message} show={toast.show} />
      </div>
    </div>
  );
}

// Render
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// Announce upgrade capability
function announceUpgrade() {
  if (window.parent) {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  }
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}
</script>

</body>
</html>

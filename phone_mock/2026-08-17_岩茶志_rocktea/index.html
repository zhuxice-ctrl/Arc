<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>岩茶志 RockTea — 武夷岩茶品鉴记录</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" />
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --rock-brown: #3D2817;
      --tea-green: #6B8E4E;
      --ink-green: #2E4033;
      --terracotta: #C65D3C;
      --milk-white: #F5F0E6;
      --rice-yellow: #EDE4D0;
      --warm-gray: #8A7B6E;
      --cream: #FDF8EE;
      --deep-rock: #2A1B10;
      --light-rock: #5C3F28;
      --pale-tea: #A8C08A;
      --shadow-soft: 0 2px 12px rgba(61, 40, 23, 0.08);
      --shadow-medium: 0 6px 24px rgba(61, 40, 23, 0.12);
      --shadow-strong: 0 12px 40px rgba(61, 40, 23, 0.18);
      --font-serif: 'Noto Serif SC', 'Songti SC', serif;
      --font-sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #E8DFCD 0%, #D4C4A8 100%);
      font-family: var(--font-sans);
      color: var(--rock-brown);
      overflow: hidden;
      user-select: none;
    }
    #root { width: 100%; height: 100%; }
    
    /* ===== App Shell ===== */
    .app-shell {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    .app-shell::before {
      content: '';
      position: absolute;
      inset: -50%;
      background: radial-gradient(ellipse at 30% 20%, rgba(107, 142, 78, 0.15), transparent 50%),
                  radial-gradient(ellipse at 70% 80%, rgba(198, 93, 60, 0.1), transparent 50%);
      pointer-events: none;
    }
    .app-title {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 700;
      color: var(--rock-brown);
      letter-spacing: 2px;
      z-index: 10;
    }
    .app-title span { color: var(--tea-green); font-weight: 400; font-size: 12px; margin-left: 8px; letter-spacing: 1px; }
    
    /* ===== iOS Device Frame (custom) ===== */
    .ios-device {
      position: relative;
      width: 390px;
      height: 844px;
      background: #1a1a1a;
      border-radius: 52px;
      padding: 10px;
      box-shadow: 0 25px 80px rgba(61, 40, 23, 0.35), 0 0 0 1px rgba(0,0,0,0.2);
      flex-shrink: 0;
      z-index: 5;
    }
    .ios-device::before {
      content: '';
      position: absolute;
      inset: 3px;
      border-radius: 46px;
      background: linear-gradient(145deg, #3a3a3a, #1a1a1a);
      z-index: -1;
    }
    .ios-screen {
      width: 100%;
      height: 100%;
      border-radius: 42px;
      overflow: hidden;
      position: relative;
      background: var(--milk-white);
    }
    
    /* Status bar */
    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      padding-top: 16px;
      font-size: 15px;
      font-weight: 600;
      color: var(--rock-brown);
      z-index: 100;
      pointer-events: none;
    }
    .status-bar.dark { color: var(--cream); }
    .status-bar-right { display: flex; align-items: center; gap: 6px; }
    .status-bar svg { display: block; }
    
    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 34px;
      background: #000;
      border-radius: 20px;
      z-index: 200;
    }
    
    /* Home indicator */
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: currentColor;
      border-radius: 3px;
      opacity: 0.3;
      z-index: 100;
      pointer-events: none;
    }
    
    /* App content area */
    .app-content {
      position: absolute;
      inset: 0;
      padding-top: 54px;
      padding-bottom: 0;
      overflow: hidden;
    }
    .page {
      position: absolute;
      inset: 0;
      padding-top: 54px;
      overflow: hidden;
    }
    .page-scroll {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .page-scroll::-webkit-scrollbar { display: none; }
    
    /* ===== Large Title Nav Bar ===== */
    .nav-large {
      padding: 8px 20px 16px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      position: relative;
    }
    .nav-large-title {
      font-family: var(--font-serif);
      font-size: 34px;
      font-weight: 900;
      color: var(--rock-brown);
      line-height: 1.1;
      letter-spacing: -0.5px;
    }
    .nav-large-sub {
      font-size: 13px;
      color: var(--warm-gray);
      margin-top: 4px;
      letter-spacing: 0.5px;
    }
    .nav-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(61, 40, 23, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }
    .nav-btn:hover { background: rgba(61, 40, 23, 0.12); transform: scale(1.05); }
    .nav-btn:active { transform: scale(0.95); }
    
    /* ===== TabBar ===== */
    .tab-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 83px;
      padding-bottom: 28px;
      background: rgba(245, 240, 230, 0.85);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-top: 0.5px solid rgba(61, 40, 23, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding-top: 8px;
      z-index: 50;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      transition: all 0.2s;
      padding: 4px 12px;
      border-radius: 10px;
      color: var(--warm-gray);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    .tab-item.active { color: var(--tea-green); }
    .tab-item:hover { opacity: 0.8; }
    .tab-item-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tab-item-icon svg { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .tab-item.active .tab-item-icon svg { transform: scale(1.1); }
    
    /* ===== Pull to Refresh ===== */
    .pull-indicator {
      position: absolute;
      top: 54px;
      left: 0;
      right: 0;
      height: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
      overflow: hidden;
      transition: none;
      z-index: 5;
    }
    .pull-spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(107, 142, 78, 0.3);
      border-top-color: var(--tea-green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* ===== Card Styles ===== */
    .tea-card {
      background: var(--cream);
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--shadow-soft);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      overflow: hidden;
    }
    .tea-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-medium);
    }
    .tea-card:active { transform: translateY(-2px) scale(0.98); }
    .tea-card-img {
      width: 100%;
      aspect-ratio: 16/10;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--rice-yellow), var(--milk-white));
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tea-card-img::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transform: skewX(-20deg);
      animation: shimmer 3.5s infinite;
    }
    @keyframes shimmer {
      0% { left: -100%; }
      60% { left: 150%; }
      100% { left: 150%; }
    }
    .tea-card-title {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 700;
      color: var(--rock-brown);
      margin-bottom: 4px;
    }
    .tea-card-meta {
      font-size: 12px;
      color: var(--warm-gray);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tea-card-tags {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .tea-tag {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(107, 142, 78, 0.12);
      color: var(--tea-green);
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    .tea-tag.fire { background: rgba(198, 93, 60, 0.15); color: var(--terracotta); }
    .tea-tag.mountain { background: rgba(46, 64, 51, 0.12); color: var(--ink-green); }
    
    /* ===== Hero Section ===== */
    .hero-section {
      position: relative;
      height: 320px;
      margin: 0 20px;
      border-radius: 28px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, var(--ink-green) 0%, var(--rock-brown) 100%);
    }
    .hero-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 70% 30%, rgba(107, 142, 78, 0.4), transparent 60%);
    }
    .hero-tea-leaf {
      position: absolute;
      width: 180px;
      height: 180px;
      right: -30px;
      top: -20px;
      opacity: 0.15;
    }
    .hero-content {
      position: relative;
      z-index: 2;
      padding: 28px 24px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: var(--cream);
    }
    .hero-label {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--pale-tea);
      font-weight: 500;
    }
    .hero-title {
      font-family: var(--font-serif);
      font-size: 32px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 8px;
    }
    .hero-desc {
      font-size: 13px;
      color: rgba(253, 248, 238, 0.7);
      line-height: 1.6;
    }
    .hero-meta {
      display: flex;
      gap: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(253, 248, 238, 0.15);
    }
    .hero-meta-item { display: flex; flex-direction: column; gap: 2px; }
    .hero-meta-val { font-family: var(--font-serif); font-size: 20px; font-weight: 700; }
    .hero-meta-lbl { font-size: 11px; color: rgba(253, 248, 238, 0.5); letter-spacing: 0.5px; }
    
    /* ===== Section Header ===== */
    .section-header {
      padding: 0 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .section-title {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 700;
      color: var(--rock-brown);
    }
    .section-more {
      font-size: 13px;
      color: var(--tea-green);
      font-weight: 500;
      cursor: pointer;
    }
    .section-more:hover { opacity: 0.7; }
    
    /* ===== Horizontal Scroll ===== */
    .h-scroll {
      display: flex;
      gap: 14px;
      padding: 0 20px 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .h-scroll::-webkit-scrollbar { display: none; }
    .h-card {
      flex-shrink: 0;
      width: 200px;
      background: var(--cream);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow-soft);
      cursor: pointer;
      transition: all 0.3s;
    }
    .h-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-medium); }
    .h-card-img {
      width: 100%;
      height: 120px;
      background: linear-gradient(135deg, var(--pale-tea), var(--tea-green));
      position: relative;
      overflow: hidden;
    }
    .h-card-body { padding: 12px 14px; }
    .h-card-title {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 700;
      color: var(--rock-brown);
      margin-bottom: 4px;
    }
    .h-card-sub { font-size: 11px; color: var(--warm-gray); }
    
    /* ===== Tea Cabinet (Masonry Grid) ===== */
    .cabinet-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 20px 24px;
    }
    .cabinet-item {
      background: var(--cream);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow-soft);
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
    }
    .cabinet-item:nth-child(3n+1) { grid-row: span 2; }
    .cabinet-item:hover { transform: translateY(-3px); box-shadow: var(--shadow-medium); }
    .cabinet-item-img {
      width: 100%;
      aspect-ratio: 1;
      background: linear-gradient(135deg, var(--rice-yellow), var(--milk-white));
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .cabinet-item-body {
      padding: 10px 12px 12px;
    }
    .cabinet-item-title {
      font-family: var(--font-serif);
      font-size: 14px;
      font-weight: 700;
      color: var(--rock-brown);
      margin-bottom: 3px;
    }
    .cabinet-item-sub { font-size: 11px; color: var(--warm-gray); }
    .cabinet-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(253, 248, 238, 0.9);
      color: var(--rock-brown);
      font-size: 9px;
      padding: 3px 7px;
      border-radius: 10px;
      font-weight: 600;
      backdrop-filter: blur(8px);
    }
    
    /* ===== FAB ===== */
    .fab {
      position: absolute;
      right: 20px;
      bottom: 100px;
      width: 56px;
      height: 56px;
      border-radius: 20px;
      background: linear-gradient(145deg, var(--terracotta), #a84828);
      box-shadow: 0 8px 24px rgba(198, 93, 60, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 60;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: var(--cream);
      border: none;
    }
    .fab:hover { transform: scale(1.08) rotate(90deg); box-shadow: 0 12px 32px rgba(198, 93, 60, 0.5); }
    .fab:active { transform: scale(0.95); }
    .fab-menu {
      position: absolute;
      right: 20px;
      bottom: 168px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 59;
      pointer-events: none;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .fab-menu.open { opacity: 1; transform: translateY(0); pointer-events: all; }
    .fab-menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: flex-end;
      cursor: pointer;
    }
    .fab-menu-label {
      background: var(--cream);
      color: var(--rock-brown);
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 12px;
      font-weight: 500;
      box-shadow: var(--shadow-medium);
      white-space: nowrap;
    }
    .fab-menu-icon {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      background: var(--cream);
      box-shadow: var(--shadow-medium);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--rock-brown);
    }
    
    /* ===== Modal / Bottom Sheet ===== */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(42, 27, 16, 0.5);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      backdrop-filter: blur(4px);
    }
    .modal-backdrop.open { opacity: 1; pointer-events: all; }
    .bottom-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--milk-white);
      border-radius: 24px 24px 0 0;
      z-index: 210;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
      max-height: 85%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .bottom-sheet.open { transform: translateY(0); }
    .sheet-handle {
      width: 100%;
      padding: 12px 0 8px;
      display: flex;
      justify-content: center;
      cursor: grab;
    }
    .sheet-handle-bar {
      width: 36px;
      height: 5px;
      background: rgba(61, 40, 23, 0.2);
      border-radius: 3px;
    }
    .sheet-header {
      padding: 4px 24px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 0.5px solid rgba(61, 40, 23, 0.08);
    }
    .sheet-title {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 700;
      color: var(--rock-brown);
    }
    .sheet-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px 40px;
    }
    .sheet-body::-webkit-scrollbar { display: none; }
    
    /* ===== Detail Page Transition ===== */
    .detail-page {
      position: absolute;
      inset: 0;
      background: var(--milk-white);
      z-index: 150;
      transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
      overflow: hidden;
    }
    .detail-page.open { transform: translateX(0); }
    
    /* ===== Detail Hero ===== */
    .detail-hero {
      position: relative;
      height: 380px;
      overflow: hidden;
    }
    .detail-hero-img {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, var(--ink-green) 0%, var(--rock-brown) 60%, var(--light-rock) 100%);
    }
    .detail-hero-img::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 30%, rgba(107, 142, 78, 0.3), transparent 70%);
    }
    .detail-back-btn {
      position: absolute;
      top: 64px;
      left: 16px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(253, 248, 238, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      color: var(--cream);
      border: none;
      transition: all 0.2s;
    }
    .detail-back-btn:hover { background: rgba(253, 248, 238, 0.3); }
    .detail-hero-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px;
      background: linear-gradient(180deg, transparent, rgba(42, 27, 16, 0.8));
      color: var(--cream);
    }
    .detail-hero-title {
      font-family: var(--font-serif);
      font-size: 36px;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 6px;
    }
    .detail-hero-sub {
      font-size: 14px;
      color: rgba(253, 248, 238, 0.7);
      display: flex;
      gap: 12px;
    }
    .detail-hero-rating {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
    }
    .detail-hero-rating svg { fill: var(--terracotta); }
    .detail-hero-rating span { font-weight: 600; font-size: 14px; }
    
    .detail-body {
      padding: 0 0 100px;
      margin-top: -20px;
      border-radius: 24px 24px 0 0;
      background: var(--milk-white);
      position: relative;
      z-index: 2;
      transform: translateY(0);
    }
    .detail-section {
      padding: 20px 24px;
    }
    .detail-section-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 700;
      color: var(--rock-brown);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .detail-section-title::before {
      content: '';
      width: 3px;
      height: 18px;
      background: var(--tea-green);
      border-radius: 2px;
    }
    
    /* ===== Flavor Wheel ===== */
    .flavor-wheel {
      width: 200px;
      height: 200px;
      margin: 0 auto 20px;
      position: relative;
    }
    .flavor-wheel svg { width: 100%; height: 100%; }
    .flavor-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .flavor-center-val {
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 900;
      color: var(--rock-brown);
    }
    .flavor-center-lbl {
      font-size: 11px;
      color: var(--warm-gray);
      letter-spacing: 1px;
    }
    .flavor-legend {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .flavor-legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--rock-brown);
    }
    .flavor-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    
    /* ===== Brew Params ===== */
    .brew-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .brew-item {
      background: var(--cream);
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
    }
    .brew-val {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 900;
      color: var(--rock-brown);
      margin-bottom: 4px;
    }
    .brew-val small { font-size: 12px; font-weight: 500; color: var(--warm-gray); }
    .brew-lbl { font-size: 11px; color: var(--warm-gray); letter-spacing: 0.5px; }
    
    /* ===== Mountain Map ===== */
    .map-container {
      position: relative;
      height: 360px;
      margin: 0 20px;
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(180deg, #c8d4a8 0%, #9eb080 50%, #6B8E4E 100%);
    }
    .map-mountain {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70%;
    }
    .map-mountain svg { width: 100%; height: 100%; display: block; }
    .map-pin {
      position: absolute;
      width: 36px;
      height: 36px;
      transform: translate(-50%, -100%);
      cursor: pointer;
      transition: all 0.3s;
      z-index: 5;
    }
    .map-pin:hover { transform: translate(-50%, -100%) scale(1.15); }
    .map-pin.active { transform: translate(-50%, -100%) scale(1.2); }
    .map-pin-head {
      width: 24px;
      height: 24px;
      border-radius: 50% 50% 50% 0;
      background: var(--terracotta);
      transform: rotate(-45deg);
      margin: 0 auto;
      box-shadow: 0 4px 12px rgba(198, 93, 60, 0.4);
      position: relative;
    }
    .map-pin-head::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--cream);
    }
    .map-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--cream);
      border-radius: 20px 20px 0 0;
      padding: 16px 20px;
      box-shadow: 0 -8px 24px rgba(61, 40, 23, 0.1);
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
      z-index: 10;
    }
    .map-panel.open { transform: translateY(0); }
    .map-panel-handle {
      width: 36px;
      height: 5px;
      background: rgba(61, 40, 23, 0.15);
      border-radius: 3px;
      margin: 0 auto 12px;
    }
    .map-panel-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 700;
      color: var(--rock-brown);
      margin-bottom: 4px;
    }
    .map-panel-desc {
      font-size: 12px;
      color: var(--warm-gray);
      line-height: 1.6;
      margin-bottom: 12px;
    }
    .map-panel-stats {
      display: flex;
      gap: 16px;
    }
    .map-stat { display: flex; flex-direction: column; }
    .map-stat-val { font-family: var(--font-serif); font-size: 16px; font-weight: 700; color: var(--rock-brown); }
    .map-stat-lbl { font-size: 10px; color: var(--warm-gray); }
    
    /* ===== Tasting Notes Timeline ===== */
    .timeline {
      padding: 0 20px 24px;
      position: relative;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 36px;
      top: 8px;
      bottom: 24px;
      width: 2px;
      background: linear-gradient(180deg, var(--tea-green), transparent);
      opacity: 0.3;
    }
    .timeline-item {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      position: relative;
    }
    .timeline-date {
      width: 52px;
      flex-shrink: 0;
      text-align: center;
      padding-top: 4px;
    }
    .timeline-day {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 900;
      color: var(--rock-brown);
      line-height: 1;
    }
    .timeline-month {
      font-size: 10px;
      color: var(--warm-gray);
      margin-top: 4px;
      letter-spacing: 0.5px;
    }
    .timeline-card {
      flex: 1;
      background: var(--cream);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: var(--shadow-soft);
      cursor: pointer;
      transition: all 0.3s;
    }
    .timeline-card:hover { box-shadow: var(--shadow-medium); transform: translateX(2px); }
    .timeline-card-title {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 700;
      color: var(--rock-brown);
      margin-bottom: 6px;
    }
    .timeline-card-desc {
      font-size: 12px;
      color: var(--warm-gray);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .timeline-card-tags {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .timeline-card-tag {
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 8px;
      background: rgba(107, 142, 78, 0.1);
      color: var(--tea-green);
      font-weight: 500;
    }
    
    /* ===== Profile Page ===== */
    .profile-header {
      position: relative;
      padding: 20px 24px 30px;
      background: linear-gradient(180deg, var(--ink-green), var(--rock-brown));
      color: var(--cream);
      overflow: hidden;
    }
    .profile-header::before {
      content: '';
      position: absolute;
      top: -50px;
      right: -50px;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(107, 142, 78, 0.3), transparent 70%);
    }
    .profile-user {
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 2;
    }
    .profile-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--tea-green), var(--pale-tea));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 900;
      color: var(--ink-green);
      border: 3px solid rgba(253, 248, 238, 0.3);
    }
    .profile-name {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .profile-level {
      font-size: 12px;
      color: var(--pale-tea);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .profile-stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 24px;
      position: relative;
      z-index: 2;
    }
    .profile-stat { text-align: center; }
    .profile-stat-val {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 900;
    }
    .profile-stat-lbl {
      font-size: 11px;
      color: rgba(253, 248, 238, 0.6);
      margin-top: 2px;
    }
    
    .ring-progress {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto;
    }
    .ring-progress svg { transform: rotate(-90deg); }
    .ring-bg { fill: none; stroke: rgba(253, 248, 238, 0.15); stroke-width: 10; }
    .ring-fill {
      fill: none;
      stroke: url(#ringGradient);
      stroke-width: 10;
      stroke-linecap: round;
      stroke-dasharray: 314;
      stroke-dashoffset: 314;
      transition: stroke-dashoffset 2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .ring-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .ring-val {
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 900;
      color: var(--cream);
    }
    .ring-lbl {
      font-size: 10px;
      color: rgba(253, 248, 238, 0.6);
      letter-spacing: 1px;
    }
    
    .profile-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 20px;
      margin-top: -20px;
      position: relative;
      z-index: 3;
    }
    .profile-tile {
      background: var(--cream);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow-soft);
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .profile-tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-medium); }
    .profile-tile-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(107, 142, 78, 0.12);
      color: var(--tea-green);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .profile-tile:nth-child(2) .profile-tile-icon { background: rgba(198, 93, 60, 0.12); color: var(--terracotta); }
    .profile-tile:nth-child(3) .profile-tile-icon { background: rgba(46, 64, 51, 0.12); color: var(--ink-green); }
    .profile-tile:nth-child(4) .profile-tile-icon { background: rgba(138, 123, 110, 0.12); color: var(--warm-gray); }
    .profile-tile-title {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 700;
      color: var(--rock-brown);
    }
    .profile-tile-sub { font-size: 11px; color: var(--warm-gray); }
    
    /* ===== Design Spec Page ===== */
    .spec-page {
      padding-bottom: 100px;
    }
    .spec-section {
      padding: 24px 20px;
      border-bottom: 1px solid rgba(61, 40, 23, 0.06);
    }
    .spec-section:last-child { border-bottom: none; }
    .spec-title {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 700;
      color: var(--rock-brown);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .spec-title-num {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--tea-green);
      color: var(--cream);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .color-swatches {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .color-swatch {
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s;
    }
    .color-swatch:hover { transform: scale(1.05); }
    .swatch-color {
      height: 64px;
    }
    .swatch-info {
      padding: 8px 10px;
      background: var(--cream);
    }
    .swatch-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--rock-brown);
      margin-bottom: 2px;
    }
    .swatch-hex {
      font-size: 9px;
      color: var(--warm-gray);
      font-family: 'SF Mono', monospace;
    }
    
    .font-sample {
      padding: 20px;
      background: var(--cream);
      border-radius: 16px;
      margin-bottom: 12px;
    }
    .font-sample-name {
      font-size: 11px;
      color: var(--warm-gray);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .font-serif-sample { font-family: var(--font-serif); font-size: 28px; font-weight: 700; color: var(--rock-brown); }
    .font-sans-sample { font-size: 14px; color: var(--rock-brown); line-height: 1.8; }
    
    .component-demo {
      background: var(--cream);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .demo-btn {
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .demo-btn.primary {
      background: var(--tea-green);
      color: var(--cream);
    }
    .demo-btn.primary:hover { background: var(--ink-green); }
    .demo-btn.secondary {
      background: rgba(61, 40, 23, 0.06);
      color: var(--rock-brown);
    }
    .demo-btn.accent {
      background: var(--terracotta);
      color: var(--cream);
    }
    .demo-chip {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      background: rgba(107, 142, 78, 0.12);
      color: var(--tea-green);
    }
    
    /* ===== API Docs Page ===== */
    .api-page { padding-bottom: 100px; }
    .api-endpoint {
      margin: 0 20px 16px;
      background: var(--cream);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-soft);
    }
    .api-endpoint-header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .api-endpoint-header:hover { background: rgba(61, 40, 23, 0.02); }
    .api-method {
      font-size: 10px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .api-method.get { background: rgba(107, 142, 78, 0.15); color: var(--tea-green); }
    .api-method.post { background: rgba(198, 93, 60, 0.15); color: var(--terracotta); }
    .api-method.put { background: rgba(46, 64, 51, 0.15); color: var(--ink-green); }
    .api-method.delete { background: rgba(198, 93, 60, 0.25); color: var(--terracotta); }
    .api-path {
      font-size: 13px;
      font-family: 'SF Mono', 'Courier New', monospace;
      color: var(--rock-brown);
      flex: 1;
      font-weight: 500;
    }
    .api-desc {
      font-size: 12px;
      color: var(--warm-gray);
      padding: 0 16px 14px;
      line-height: 1.6;
    }
    .api-detail {
      padding: 0 16px 16px;
      border-top: 1px solid rgba(61, 40, 23, 0.06);
      display: none;
    }
    .api-endpoint.open .api-detail { display: block; }
    .api-detail-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--rock-brown);
      margin: 12px 0 8px;
      letter-spacing: 0.5px;
    }
    .api-code-block {
      background: var(--deep-rock);
      color: #e8dcc8;
      padding: 12px 14px;
      border-radius: 10px;
      font-family: 'SF Mono', 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.7;
      overflow-x: auto;
    }
    .api-code-block .key { color: var(--pale-tea); }
    .api-code-block .val-str { color: #e8a87c; }
    .api-code-block .val-num { color: #85dcb8; }
    .api-param-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      font-size: 12px;
      border-bottom: 1px solid rgba(61, 40, 23, 0.04);
    }
    .api-param-name {
      font-family: 'SF Mono', monospace;
      color: var(--rock-brown);
      font-weight: 500;
    }
    .api-param-type {
      font-size: 10px;
      color: var(--tea-green);
      font-family: 'SF Mono', monospace;
    }
    .api-param-desc {
      color: var(--warm-gray);
      font-size: 11px;
      margin-left: auto;
      text-align: right;
      max-width: 140px;
    }
    
    /* ===== Long Press Menu ===== */
    .context-menu {
      position: absolute;
      background: var(--cream);
      border-radius: 16px;
      box-shadow: var(--shadow-strong);
      overflow: hidden;
      z-index: 300;
      min-width: 160px;
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .context-menu.open {
      opacity: 1;
      transform: scale(1);
      pointer-events: all;
    }
    .context-menu-item {
      padding: 12px 16px;
      font-size: 14px;
      color: var(--rock-brown);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 0.5px solid rgba(61, 40, 23, 0.06);
      transition: background 0.15s;
    }
    .context-menu-item:last-child { border-bottom: none; }
    .context-menu-item:hover { background: rgba(107, 142, 78, 0.08); }
    .context-menu-item.danger { color: var(--terracotta); }
    .context-menu-item svg { width: 16px; height: 16px; flex-shrink: 0; }
    
    /* ===== Steam Particles ===== */
    .steam-container {
      position: absolute;
      pointer-events: none;
      overflow: visible;
    }
    .steam-particle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(253, 248, 238, 0.6), transparent 70%);
      animation: steam-rise linear infinite;
      opacity: 0;
    }
    @keyframes steam-rise {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.6);
      }
      20% { opacity: 0.6; }
      100% {
        opacity: 0;
        transform: translateY(-80px) scale(1.8);
      }
    }
    
    /* ===== Tea Leaf Particles ===== */
    .leaf-particle {
      position: absolute;
      width: 8px;
      height: 8px;
      pointer-events: none;
      animation: leaf-fall linear infinite;
      opacity: 0.4;
    }
    @keyframes leaf-fall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 0;
      }
      10% { opacity: 0.5; }
      100% {
        transform: translateY(400px) rotate(360deg);
        opacity: 0;
      }
    }
    
    /* ===== Ripple Effect ===== */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(253, 248, 238, 0.5);
      transform: scale(0);
      animation: ripple-expand 0.6s ease-out;
      pointer-events: none;
    }
    @keyframes ripple-expand {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }
    
    /* ===== Custom Cursor ===== */
    .custom-cursor {
      position: fixed;
      width: 24px;
      height: 24px;
      border: 2px solid #fff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s, border-color 0.2s;
      mix-blend-mode: difference;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.4),
                  0 0 40px rgba(255, 255, 255, 0.2);
    }
    .custom-cursor::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background: var(--tea-green);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px rgba(107, 142, 78, 0.8);
      transition: all 0.2s;
    }
    .custom-cursor.hovering {
      width: 40px;
      height: 40px;
      border-color: var(--tea-green);
    }
    .custom-cursor.hovering::after {
      width: 8px;
      height: 8px;
      background: var(--cream);
    }
    .custom-cursor.clicking {
      width: 16px;
      height: 16px;
    }
    .custom-cursor.clicking::after {
      width: 10px;
      height: 10px;
    }
    .cursor-ripple {
      position: fixed;
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%) scale(0);
      animation: cursor-ripple 0.8s ease-out forwards;
      mix-blend-mode: difference;
    }
    @keyframes cursor-ripple {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
    }
    
    @media (pointer: coarse) {
      .custom-cursor, .cursor-ripple { display: none; }
    }
    
    /* ===== Entrance Animation ===== */
    .fade-in-up {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }
    .delay-4 { animation-delay: 0.4s; }
    .delay-5 { animation-delay: 0.5s; }
    
    /* ===== Scroll Fade In ===== */
    .scroll-reveal {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .scroll-reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
    
    /* ===== Number Counter Animation ===== */
    .count-up { font-variant-numeric: tabular-nums; }
    
    /* ===== Tea icon inside cards ===== */

      outline: none;
      font-family: var(--font-sans);

      color: var(--warm-gray);
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;

    .filter-chip.active {
      background: var(--rock-brown);
      color: var(--cream);
    }
    .filter-chip:hover { transform: scale(1.05); }
    
    /* ===== Toast ===== */
    .toast {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--deep-rock);
      color: var(--cream);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      z-index: 500;
      opacity: 0;

      pointer-events: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .detail-scroll {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;

    .detail-scroll::-webkit-scrollbar { display: none; }

    .spec-comp-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;

    .spec-comp-item {
      background: var(--cream);

      padding: 12px;
      text-align: center;
    }
    .spec-comp-item-name {
      font-size: 10px;
      color: var(--warm-gray);
      margin-top: 6px;

    .anim-demo {
      background: var(--cream);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 12px;

    .anim-pulse-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--tea-green);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.7; }
    }
    .anim-bounce {

    // Animated counter
    const CountUp = ({ end = 0, duration = 1500, className = '' }) => {
      const [val, setVal] = useState(0);
      const ref = useRef(null);
      const started = useRef(false);
      
      useEffect(() => {
        const observer = new IntersectionObserver(
          (entries) => {
            if (entries[0].isIntersecting && !started.current) {
              started.current = true;
              const start = performance.now();
              const animate = (now) => {
                const t = Math.min((now - start) / duration, 1);
                const eased = 1 - Math.pow(1 - t, 3);
                setVal(Math.round(end * eased));
                if (t < 1) requestAnimationFrame(animate);
              };
              requestAnimationFrame(animate);
            }
          },
          { threshold: 0.3 }
        );
        if (ref.current) observer.observe(ref.current);
        return () => observer.disconnect();
      }, [end, duration]);
      
      return <span ref={ref} className={`count-up ${className}`}>{val}</span>;

      const scrollRef = useRef(null);
      const startY = useRef(0);
      
      const handleTouchStart = (e) => {
        if (scrollRef.current && scrollRef.current.scrollTop <= 0) {
          startY.current = e.touches[0].clientY;
        }
      };
      
      const handleTouchMove = (e) => {
        if (scrollRef.current && scrollRef.current.scrollTop <= 0 && !refreshing) {
          const delta = e.touches[0].clientY - startY.current;
          if (delta > 0) {
            setPullY(Math.min(delta * 0.5, 60));
          }
        }
      };
      
      const handleTouchEnd = () => {
        if (pullY > 40 && !refreshing) {
          setRefreshing(true);
          setPullY(50);
          setTimeout(() => {
            setRefreshing(false);
            setPullY(0);
          }, 1500);
        } else {
          setPullY(0);
        }
      };
      
      return (
        <div className="page-scroll"
          ref={scrollRef}
          onTouchStart={handleTouchStart}
          onTouchMove={handleTouchMove}
          onTouchEnd={handleTouchEnd}
          style={{ transform: `translateY(${pullY}px)`, transition: refreshing ? 'none' : 'transform 0.3s' }}
        >
          <div className="pull-indicator" style={{ height: pullY }}>
            {refreshing ? <div className="pull-spinner" /> : (
              <div style={{ color: 'var(--tea-green)', fontSize: 12, opacity: pullY / 60 }}>

    // ========== MAIN APP ==========

      const [specOpen, setSpecOpen] = useState(false);
      const [apiOpen, setApiOpen] = useState(false);
      const cursorRef = useRef(null);
      const appRef = useRef(null);
      const timers = useRef([]);
      const rafIds = useRef([]);
      
      // Custom cursor
      useEffect(() => {
        if (window.matchMedia('(pointer: coarse)').matches) return;
        
        const cursor = document.createElement('div');
        cursor.className = 'custom-cursor';
        cursor.style.display = 'none';
        document.body.appendChild(cursor);
        cursorRef.current = cursor;
        
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let cursorX = mouseX;
        let cursorY = mouseY;
        let animating = false;
        
        const animate = () => {
          cursorX += (mouseX - cursorX) * 0.15;
          cursorY += (mouseY - cursorY) * 0.15;
          cursor.style.transform = `translate(${cursorX}px, ${cursorY}px) translate(-50%, -50%)`;
          cursor.style.display = 'block';
          
          if (Math.abs(mouseX - cursorX) > 0.1 || Math.abs(mouseY - cursorY) > 0.1) {
            const id = requestAnimationFrame(animate);
            rafIds.current.push(id);
          } else {
            animating = false;
          }
        };
        
        const onMove = (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
          if (!animating) {
            animating = true;
            const id = requestAnimationFrame(animate);
            rafIds.current.push(id);
          }
          
          // Check hover
          const target = e.target;
          const isInteractive = target.closest('button, .tea-card, .cabinet-item, .h-card, .tab-item, .filter-chip, .timeline-card, .map-pin, .profile-tile, .api-endpoint-header, .nav-btn, .section-more, .fab, .fab-menu-item, .color-swatch');
          if (isInteractive) {
            cursor.classList.add('hovering');
          } else {
            cursor.classList.remove('hovering');
          }
        };
        
        const onDown = (e) => {
          cursor.classList.add('clicking');
          // Create ripple
          const ripple = document.createElement('div');
          ripple.className = 'cursor-ripple';
          ripple.style.left = e.clientX + 'px';
          ripple.style.top = e.clientY + 'px';
          document.body.appendChild(ripple);
          setTimeout(() => ripple.remove(), 800);
        };
        
        const onUp = () => cursor.classList.remove('clicking');
        
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mousedown', onDown);
        document.addEventListener('mouseup', onUp);
        
        return () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mousedown', onDown);
          document.removeEventListener('mouseup', onUp);
          cursor.remove();
          rafIds.current.forEach(id => cancelAnimationFrame(id));
        };
      }, []);
      
      // Visibility change pause
      useEffect(() => {
        const onVisibility = () => {
          if (document.hidden) {
            // Pause all RAF and timers
            rafIds.current.forEach(id => cancelAnimationFrame(id));
            timers.current.forEach(id => clearTimeout(id));
          }
        };
        document.addEventListener('visibilitychange', onVisibility);
        return () => document.removeEventListener('visibilitychange', onVisibility);
      }, []);
      
      // Toast helper
      const showToast = (msg) => {
        setToast(msg);
        const t = setTimeout(() => setToast(null), 2000);
        timers.current.push(t);
      };
      
      // Long press handler
      const handleLongPress = (e, item) => {
        e.preventDefault();
        e.stopPropagation();
        const rect = appRef.current?.getBoundingClientRect();
        const x = e.clientX - (rect?.left || 0);
        const y = e.clientY - (rect?.top || 0);
        setContextMenu({ x, y, item });
      };
      
      // Close context menu on click outside
      useEffect(() => {
        const handler = () => setContextMenu(null);
        if (contextMenu) {
          setTimeout(() => document.addEventListener('click', handler), 0);
        }
        return () => document.removeEventListener('click', handler);
      }, [contextMenu]);

          case 'home':
            return <HomePage onTeaClick={handleTeaClick} onNavigate={(t) => setTab(t)} />;
          case 'cabinet':
            return <CabinetPage onTeaClick={handleTeaClick} />;
          case 'mountain':
            return <MountainPage />;
          case 'notes':
            return <NotesPage onTeaClick={handleTeaClick} />;

          default:
            return <HomePage onTeaClick={handleTeaClick} onNavigate={(t) => setTab(t)} />;
        }

                  </svg>
                  <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" strokeWidth="1.5">
                    <path d="M1 5C1 5 4 1 8 1s7 4 7 4M3 7c0 0 2-2 5-2s5 2 5 2M5 9c0 0 1.5-1.5 3-1.5S11 9 11 9" />
                    <circle cx="8" cy="10.5" r="1" fill="currentColor" />
                  </svg>
                  <svg width="26" height="12" viewBox="0 0 26 12" fill="none" stroke="currentColor" strokeWidth="1">
                    <rect x="0.5" y="0.5" width="22" height="11" rx="2.5" />
                    <rect x="2" y="2" width="18" height="8" rx="1" fill="currentColor" />

              {/* FAB - only on home and notes */}
              {(tab === 'home' || tab === 'notes') && !detailTea && !specOpen && !apiOpen && (

                    <Icons.Bookmark size={16} /> 收藏茶品
                  </div>
                  <div className="context-menu-item" onClick={() => { showToast('已分享'); setContextMenu(null); }}>
                    <Icons.Share size={16} /> 分享给茶友
                  </div>
                  <div className="context-menu-item" onClick={() => { showToast('已添加笔记'); setContextMenu(null); }}>
                    <Icons.Edit size={16} /> 添加品鉴
                  </div>
                  <div className="context-menu-item danger" onClick={() => { showToast('已移除'); setContextMenu(null); }}>
                    <Icons.Delete size={16} /> 从茶仓移除
                  </div>
                </div>
              )}
              
              {/* Toast */}
              <div className={`toast ${toast ? 'show' : ''}`}>{toast}</div>
            </div>
          </div>
        </div>
      );
    };
    
    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    
    // Announce upgrade availability
    function announceUpgrade() {
      window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    }
    announceUpgrade();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announceUpgrade, { once: true });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="creative-medium" content="interactive-prototype" />
<title>云宿 · 山居民宿</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" />
<style>
/* ============================================
   云宿 · 山居民宿 原生 App UI Mock
   配色：竹青#5B8C5A / 山岩灰#6B6963 / 暖米白#F7F3EC / 暮霞橙#E8915A / 深林绿#2D4A2B
   ============================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bamboo: #5B8C5A;
  --bamboo-light: #7AA87A;
  --bamboo-dark: #3E6B3D;
  --stone: #6B6963;
  --stone-light: #9B9992;
  --stone-dark: #4A4945;
  --cream: #F7F3EC;
  --cream-dark: #EDE8DC;
  --cream-darker: #E0D9C8;
  --sunset: #E8915A;
  --sunset-light: #F2B186;
  --sunset-dark: #D17A42;
  --forest: #2D4A2B;
  --forest-light: #4A6B48;
  --white: #FFFFFF;
  --text-primary: #2D2B26;
  --text-secondary: #6B6963;
  --text-tertiary: #9B9992;
  --shadow-sm: 0 2px 8px rgba(45, 74, 43, 0.06);
  --shadow-md: 0 8px 24px rgba(45, 74, 43, 0.1);
  --shadow-lg: 0 16px 48px rgba(45, 74, 43, 0.15);
}

html, body {
  height: 100%;
  overflow: hidden;
  background: #E8E4DB;
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  cursor: none;
}

/* ===== Custom Cursor ===== */
.cursor-outer, .cursor-inner, .cursor-glow {
  position: fixed;
  pointer-events: none;
  z-index: 99999;
  transform: translate(-50%, -50%);
  transition: width 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
              height 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
              opacity 0.2s ease,
              border-color 0.25s ease;
}
.cursor-outer {
  width: 32px;
  height: 32px;
  border: 2px solid rgba(255,255,255,0.9);
  border-radius: 50%;
  box-shadow: 0 0 12px rgba(0,0,0,0.2), inset 0 0 6px rgba(255,255,255,0.3);
  mix-blend-mode: difference;
}
.cursor-inner {
  width: 6px;
  height: 6px;
  background: var(--sunset);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--sunset);
}
.cursor-glow {
  width: 60px;
  height: 60px;
  background: radial-gradient(circle, rgba(91,140,90,0.15) 0%, transparent 70%);
  border-radius: 50%;
  transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
              height 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
              opacity 0.3s ease,
              background 0.3s ease;
}
.cursor-outer.hover {
  width: 52px;
  height: 52px;
  border-color: var(--sunset);
}
.cursor-inner.hover {
  width: 4px;
  height: 4px;
}
.cursor-glow.hover {
  width: 90px;
  height: 90px;
  background: radial-gradient(circle, rgba(232,145,90,0.2) 0%, transparent 70%);
}
.cursor-outer.clicking {
  width: 20px;
  height: 20px;
  border-color: var(--bamboo);
}
.cursor-ripple {
  position: fixed;
  pointer-events: none;
  z-index: 99998;
  width: 10px;
  height: 10px;
  border: 2px solid var(--bamboo);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  animation: rippleExpand 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
}
@keyframes rippleExpand {
  0% { width: 10px; height: 10px; opacity: 0.8; }
  100% { width: 80px; height: 80px; opacity: 0; }
}

/* ===== Stage Layout ===== */
.stage {
  width: 100%;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #E0D9C8 0%, #D4CDBC 50%, #C8C0AC 100%);
  position: relative;
  overflow: hidden;
}
.stage::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at 30% 20%, rgba(91,140,90,0.08) 0%, transparent 50%),
              radial-gradient(circle at 70% 80%, rgba(232,145,90,0.08) 0%, transparent 50%);
  pointer-events: none;
}

/* ===== Phone Frame (iOS style) ===== */
.phone-frame {
  width: 390px;
  height: 844px;
  background: #1a1a1a;
  border-radius: 54px;
  padding: 12px;
  box-shadow: 0 50px 100px rgba(0,0,0,0.3), 0 0 0 2px #2a2a2a, inset 0 0 0 1px #0a0a0a;
  position: relative;
  z-index: 2;
}
.phone-screen {
  width: 100%;
  height: 100%;
  background: var(--cream);
  border-radius: 42px;
  overflow: hidden;
  position: relative;
}
.phone-notch {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 34px;
  background: #1a1a1a;
  border-radius: 0 0 20px 20px;
  z-index: 100;
}
.phone-status-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 54px;
  padding: 18px 32px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  z-index: 99;
  pointer-events: none;
}
.status-right { display: flex; gap: 6px; align-items: center; }

/* ===== Page Container ===== */
.page-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
.page {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  background: var(--cream);
  transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.3s ease;
  scrollbar-width: none;
}
.page::-webkit-scrollbar { display: none; }
.page.hidden-left { transform: translateX(-30%); opacity: 0; pointer-events: none; }
.page.hidden-right { transform: translateX(30%); opacity: 0; pointer-events: none; }

/* ===== Tab Bar ===== */
.tab-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 88px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid rgba(0,0,0,0.06);
  display: flex;
  align-items: flex-start;
  justify-content: space-around;
  padding-top: 8px;
  padding-bottom: 28px;
  z-index: 50;
}
.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 4px 16px;
  cursor: none;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
}
.tab-item:active { transform: scale(0.92); }
.tab-icon {
  width: 24px;
  height: 24px;
  color: var(--stone-light);
  transition: color 0.3s ease;
}
.tab-item.active .tab-icon { color: var(--bamboo); }
.tab-label {
  font-size: 10px;
  color: var(--stone-light);
  transition: color 0.3s ease;
}
.tab-item.active .tab-label { color: var(--bamboo); font-weight: 600; }

/* ===== Page: Home (Discovery) ===== */
.home-hero {
  position: relative;
  height: 420px;
  overflow: hidden;
}
.home-hero-img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 120%;
  object-fit: cover;
  will-change: transform;
  transition: transform 0.1s linear;
}
.home-hero-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 60%;
  background: linear-gradient(to top, var(--cream) 0%, rgba(247,243,236,0.7) 40%, transparent 100%);
}
.home-hero-content {
  position: absolute;
  bottom: 20px;
  left: 20px;
  right: 20px;
  z-index: 2;
}
.home-greeting {
  font-size: 13px;
  color: var(--forest);
  font-weight: 500;
  letter-spacing: 2px;
  margin-bottom: 8px;
  opacity: 0;
  transform: translateY(20px);
  animation: slideUp 0.8s ease forwards;
  animation-delay: 0.2s;
}
.home-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 32px;
  font-weight: 700;
  color: var(--forest);
  line-height: 1.3;
  margin-bottom: 6px;
  opacity: 0;
  transform: translateY(20px);
  animation: slideUp 0.8s ease forwards;
  animation-delay: 0.35s;
}
.home-subtitle {
  font-size: 13px;
  color: var(--stone);
  opacity: 0;
  transform: translateY(20px);
  animation: slideUp 0.8s ease forwards;
  animation-delay: 0.5s;
}

@keyframes slideUp {
  to { opacity: 1; transform: translateY(0); }
}

/* Search bar */
.search-bar {
  margin: 16px 20px 0;
  background: var(--white);
  border-radius: 16px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: var(--shadow-sm);
  cursor: none;
  opacity: 0;
  transform: translateY(20px);
  animation: slideUp 0.8s ease forwards;
  animation-delay: 0.65s;
  transition: box-shadow 0.3s ease, transform 0.3s ease;
}
.search-bar:hover { box-shadow: var(--shadow-md); }
.search-bar svg { flex-shrink: 0; color: var(--stone); }
.search-text {
  font-size: 14px;
  color: var(--text-tertiary);
  flex: 1;
}

/* Category Pills */
.category-section {
  padding: 20px 20px 8px;
  opacity: 0;
  transform: translateY(20px);
  animation: slideUp 0.8s ease forwards;
  animation-delay: 0.8s;
}
.category-row {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 4px;
}
.category-row::-webkit-scrollbar { display: none; }
.category-pill {
  flex-shrink: 0;
  padding: 8px 16px;
  border-radius: 20px;
  background: var(--white);
  font-size: 13px;
  color: var(--stone);
  font-weight: 500;
  cursor: none;
  transition: all 0.3s ease;
  border: 1px solid transparent;
  white-space: nowrap;
}
.category-pill:hover { border-color: var(--bamboo-light); }
.category-pill.active {
  background: var(--bamboo);
  color: var(--white);
  box-shadow: 0 4px 12px rgba(91,140,90,0.3);
}

/* Homestay List */
.homestay-list {
  padding: 12px 20px 100px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.section-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 16px 0 4px;
  opacity: 0;
  transform: translateY(20px);
  animation: slideUp 0.8s ease forwards;
  animation-delay: 0.9s;
}
.section-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
}
.section-more {
  font-size: 12px;
  color: var(--bamboo);
  cursor: none;
}

.homestay-card {
  background: var(--white);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  cursor: none;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
  position: relative;
  opacity: 0;
  transform: translateY(30px);
  animation: cardIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
.homestay-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-md);
}
@keyframes cardIn {
  to { opacity: 1; transform: translateY(0); }
}
.homestay-card:nth-child(1) { animation-delay: 1s; }
.homestay-card:nth-child(2) { animation-delay: 1.1s; }
.homestay-card:nth-child(3) { animation-delay: 1.2s; }

.card-img-wrap {
  position: relative;
  height: 180px;
  overflow: hidden;
}
.card-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
.homestay-card:hover .card-img { transform: scale(1.08); }
.card-tag {
  position: absolute;
  top: 12px;
  left: 12px;
  background: rgba(45,74,43,0.85);
  backdrop-filter: blur(8px);
  color: var(--white);
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 500;
}
.card-fav {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 32px;
  height: 32px;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(8px);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: none;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.card-fav:hover { transform: scale(1.1); }
.card-fav svg { width: 16px; height: 16px; color: var(--stone); transition: color 0.3s ease; }
.card-fav.liked svg { color: var(--sunset); fill: var(--sunset); }
.card-fav.pulse svg { animation: heartPulse 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes heartPulse {
  0% { transform: scale(1); }
  30% { transform: scale(1.4); }
  60% { transform: scale(0.9); }
  100% { transform: scale(1); }
}

.card-body {
  padding: 14px 16px 16px;
}
.card-row1 {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 6px;
}
.card-name {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  flex: 1;
}
.card-rating {
  display: flex;
  align-items: center;
  gap: 3px;
  font-size: 13px;
  font-weight: 600;
  color: var(--sunset-dark);
  flex-shrink: 0;
}
.card-location {
  font-size: 12px;
  color: var(--stone);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.card-tags {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.card-tag-sm {
  padding: 2px 8px;
  background: var(--cream-dark);
  border-radius: 6px;
  font-size: 11px;
  color: var(--stone);
}
.card-price-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}
.card-price {
  font-size: 18px;
  font-weight: 700;
  color: var(--sunset-dark);
}
.card-price span {
  font-size: 12px;
  font-weight: 400;
  color: var(--stone);
}
.card-book-btn {
  padding: 6px 14px;
  background: var(--bamboo);
  color: var(--white);
  border-radius: 12px;
  font-size: 12px;
  font-weight: 500;
  cursor: none;
  transition: all 0.3s ease;
}
.card-book-btn:hover {
  background: var(--bamboo-dark);
  transform: translateY(-1px);
}

/* Pull to refresh indicator */
.pull-indicator {
  position: absolute;
  top: 54px;
  left: 50%;
  transform: translateX(-50%) translateY(-60px);
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--white);
  border-radius: 50%;
  box-shadow: var(--shadow-sm);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 5;
}
.pull-indicator.visible { transform: translateX(-50%) translateY(8px); }
.pull-indicator.spinning svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Page: Room Detail ===== */
.detail-hero {
  position: relative;
  height: 380px;
  overflow: hidden;
}
.detail-hero-img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 130%;
  object-fit: cover;
  will-change: transform;
}
.detail-nav {
  position: absolute;
  top: 54px;
  left: 16px;
  right: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
}
.detail-nav-btn {
  width: 40px;
  height: 40px;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(10px);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: none;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.detail-nav-btn:hover { transform: scale(1.08); }
.detail-nav-btn svg { width: 18px; height: 18px; color: var(--text-primary); }

.detail-content {
  position: relative;
  background: var(--cream);
  border-radius: 28px 28px 0 0;
  margin-top: -28px;
  padding: 24px 20px 120px;
  z-index: 5;
}
.detail-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.detail-location {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--stone);
  margin-bottom: 16px;
}
.detail-rating-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-top: 1px solid var(--cream-darker);
  border-bottom: 1px solid var(--cream-darker);
  margin-bottom: 20px;
}
.rating-score {
  font-size: 28px;
  font-weight: 700;
  color: var(--sunset-dark);
}
.rating-info { flex: 1; }
.rating-label {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 2px;
}
.rating-count {
  font-size: 12px;
  color: var(--stone);
}

.detail-section-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 17px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 12px;
}
.detail-desc {
  font-size: 13px;
  line-height: 1.8;
  color: var(--stone);
  margin-bottom: 24px;
}
.amenities-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
.amenity-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 4px;
  background: var(--white);
  border-radius: 14px;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  cursor: none;
}
.amenity-item:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-sm);
}
.amenity-icon {
  width: 28px;
  height: 28px;
  background: var(--cream-dark);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--bamboo);
}
.amenity-item:hover .amenity-icon {
  background: var(--bamboo);
  color: var(--white);
  transition: all 0.3s ease;
}
.amenity-name {
  font-size: 11px;
  color: var(--stone);
}

/* Floating bottom book bar */
.detail-book-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(20px);
  border-top: 1px solid rgba(0,0,0,0.06);
  padding: 14px 20px 34px;
  display: flex;
  align-items: center;
  gap: 16px;
  z-index: 20;
}
.detail-book-price {
  flex: 1;
}
.detail-book-price .big {
  font-size: 22px;
  font-weight: 700;
  color: var(--sunset-dark);
}
.detail-book-price .unit {
  font-size: 12px;
  color: var(--stone);
}
.book-now-btn {
  padding: 14px 32px;
  background: var(--bamboo);
  color: var(--white);
  border-radius: 16px;
  font-size: 15px;
  font-weight: 600;
  cursor: none;
  position: relative;
  overflow: hidden;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
  box-shadow: 0 4px 16px rgba(91,140,90,0.3);
}
.book-now-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(91,140,90,0.4);
}
.book-now-btn:active { transform: translateY(0) scale(0.98); }
.book-now-btn::after {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 60%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transition: left 0.8s ease;
}
.book-now-btn:hover::after { left: 140%; }

/* ===== Page: Experience (Horizontal Gallery) ===== */
.exp-header {
  padding: 64px 20px 16px;
  background: var(--forest);
  position: relative;
  overflow: hidden;
}
.exp-header::before {
  content: '';
  position: absolute;
  top: -100px;
  right: -100px;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(91,140,90,0.4) 0%, transparent 70%);
  border-radius: 50%;
}
.exp-page-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--white);
  margin-bottom: 6px;
  position: relative;
}
.exp-page-sub {
  font-size: 13px;
  color: rgba(255,255,255,0.7);
  margin-bottom: 20px;
  position: relative;
}
.exp-filters {
  display: flex;
  gap: 8px;
  position: relative;
}
.exp-filter {
  padding: 6px 14px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 16px;
  font-size: 12px;
  color: rgba(255,255,255,0.8);
  cursor: none;
  transition: all 0.3s ease;
}
.exp-filter.active {
  background: var(--sunset);
  border-color: var(--sunset);
  color: var(--white);
}

.exp-gallery {
  padding: 20px 0 100px;
  background: var(--forest);
}
.exp-track {
  display: flex;
  gap: 16px;
  padding: 0 20px;
  overflow-x: auto;
  scrollbar-width: none;
  scroll-snap-type: x mandatory;
}
.exp-track::-webkit-scrollbar { display: none; }
.exp-card {
  flex-shrink: 0;
  width: 260px;
  background: var(--white);
  border-radius: 20px;
  overflow: hidden;
  cursor: none;
  scroll-snap-align: start;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.exp-card:hover { transform: translateY(-4px) scale(1.02); }
.exp-card-img {
  height: 200px;
  background-size: cover;
  background-position: center;
  position: relative;
}
.exp-card-body { padding: 14px 16px 18px; }
.exp-card-tag {
  display: inline-block;
  padding: 2px 8px;
  background: rgba(232,145,90,0.15);
  color: var(--sunset-dark);
  border-radius: 6px;
  font-size: 11px;
  font-weight: 500;
  margin-bottom: 8px;
}
.exp-card-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 6px;
}
.exp-card-desc {
  font-size: 12px;
  color: var(--stone);
  line-height: 1.6;
  margin-bottom: 12px;
}
.exp-card-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.exp-card-host {
  display: flex;
  align-items: center;
  gap: 6px;
}
.exp-host-avatar {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--cream-darker);
  background-size: cover;
  background-position: center;
}
.exp-host-name {
  font-size: 11px;
  color: var(--stone);
}
.exp-card-price {
  font-size: 15px;
  font-weight: 700;
  color: var(--sunset-dark);
}
.exp-card-price span {
  font-size: 11px;
  font-weight: 400;
  color: var(--stone);
}

/* ===== Page: Host Story (Diagonal Split) ===== */
.host-page {
  background: var(--cream);
}
.host-hero {
  position: relative;
  height: 300px;
  overflow: hidden;
}
.host-hero-img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.7);
}
.host-hero-split {
  position: absolute;
  bottom: -2px;
  left: 0;
  right: 0;
  height: 80px;
  background: var(--cream);
  clip-path: polygon(0 100%, 100% 0, 100% 100%);
}
.host-avatar-card {
  position: absolute;
  bottom: -40px;
  left: 20px;
  display: flex;
  align-items: flex-end;
  gap: 14px;
  z-index: 5;
}
.host-avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 3px solid var(--cream);
  background: var(--stone-light);
  background-size: cover;
  background-position: center;
  box-shadow: var(--shadow-md);
}
.host-info h3 {
  font-family: 'Noto Serif SC', serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.host-info p {
  font-size: 12px;
  color: var(--stone);
}

.host-body {
  padding: 60px 20px 100px;
}
.host-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
.host-stat {
  background: var(--white);
  border-radius: 14px;
  padding: 14px 8px;
  text-align: center;
  transition: transform 0.3s ease;
}
.host-stat:hover { transform: translateY(-2px); }
.host-stat-num {
  font-size: 20px;
  font-weight: 700;
  color: var(--bamboo);
  margin-bottom: 2px;
}
.host-stat-label {
  font-size: 11px;
  color: var(--stone);
}

.host-bio-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 10px;
  color: var(--text-primary);
}
.host-bio {
  font-size: 13px;
  line-height: 1.9;
  color: var(--stone);
  margin-bottom: 24px;
  padding: 16px;
  background: var(--white);
  border-radius: 14px;
  border-left: 3px solid var(--bamboo);
}

.host-listings-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 12px;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.host-listing-mini {
  display: flex;
  gap: 12px;
  padding: 12px;
  background: var(--white);
  border-radius: 14px;
  margin-bottom: 10px;
  cursor: none;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.host-listing-mini:hover {
  transform: translateX(4px);
  box-shadow: var(--shadow-sm);
}
.listing-mini-img {
  width: 72px;
  height: 72px;
  border-radius: 10px;
  background-size: cover;
  background-position: center;
  flex-shrink: 0;
}
.listing-mini-info { flex: 1; }
.listing-mini-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.listing-mini-loc {
  font-size: 11px;
  color: var(--stone);
  margin-bottom: 6px;
}
.listing-mini-price {
  font-size: 13px;
  font-weight: 600;
  color: var(--sunset-dark);
}

/* ===== Page: Itinerary / Favorites ===== */
.trip-page {
  background: linear-gradient(180deg, var(--forest) 0%, var(--forest) 280px, var(--cream) 280px);
}
.trip-header {
  padding: 64px 20px 24px;
}
.trip-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--white);
  margin-bottom: 4px;
}
.trip-subtitle {
  font-size: 13px;
  color: rgba(255,255,255,0.7);
  margin-bottom: 20px;
}

/* Progress ring */
.progress-ring-container {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 16px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,0.1);
}
.progress-ring {
  position: relative;
  width: 80px;
  height: 80px;
  flex-shrink: 0;
}
.progress-ring svg { transform: rotate(-90deg); }
.progress-ring-bg { stroke: rgba(255,255,255,0.15); }
.progress-ring-fill {
  stroke: var(--sunset);
  stroke-linecap: round;
  transition: stroke-dashoffset 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  filter: drop-shadow(0 0 6px rgba(232,145,90,0.5));
}
.progress-ring-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}
.progress-ring-num {
  font-size: 20px;
  font-weight: 700;
  color: var(--white);
}
.progress-ring-label {
  font-size: 9px;
  color: rgba(255,255,255,0.6);
}
.progress-info { flex: 1; }
.progress-info-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--white);
  margin-bottom: 4px;
}
.progress-info-desc {
  font-size: 11px;
  color: rgba(255,255,255,0.6);
  line-height: 1.5;
}

.trip-tabs {
  display: flex;
  gap: 4px;
  margin: 0 20px;
  padding: 4px;
  background: rgba(255,255,255,0.1);
  border-radius: 12px;
}
.trip-tab {
  flex: 1;
  padding: 10px;
  text-align: center;
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,0.7);
  border-radius: 10px;
  cursor: none;
  transition: all 0.3s ease;
}
.trip-tab.active {
  background: var(--sunset);
  color: var(--white);
  box-shadow: 0 4px 12px rgba(232,145,90,0.3);
}

.trip-content {
  padding: 24px 20px 100px;
}
.trip-card {
  background: var(--white);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
  cursor: none;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  position: relative;
  overflow: hidden;
}
.trip-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
.trip-card::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--bamboo);
}
.trip-card.upcoming::before { background: var(--sunset); }
.trip-card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 10px;
}
.trip-card-status {
  padding: 3px 10px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 500;
  background: rgba(91,140,90,0.12);
  color: var(--bamboo-dark);
}
.trip-card.upcoming .trip-card-status {
  background: rgba(232,145,90,0.15);
  color: var(--sunset-dark);
}
.trip-card-dates {
  font-size: 11px;
  color: var(--stone);
}
.trip-card-name {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.trip-card-loc {
  font-size: 12px;
  color: var(--stone);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.trip-card-row {
  display: flex;
  gap: 10px;
}
.trip-card-img {
  width: 56px;
  height: 56px;
  border-radius: 10px;
  background-size: cover;
  background-position: center;
  flex-shrink: 0;
}
.trip-card-details {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
}
.trip-card-detail-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--stone);
}

/* ===== Page: Profile (Radial / Circular) ===== */
.profile-page {
  background: var(--cream);
}
.profile-hero {
  position: relative;
  padding: 70px 20px 30px;
  background: linear-gradient(135deg, var(--bamboo-dark) 0%, var(--forest) 100%);
  overflow: hidden;
}
.profile-hero::before {
  content: '';
  position: absolute;
  top: -80px;
  right: -80px;
  width: 240px;
  height: 240px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 50%;
}
.profile-hero::after {
  content: '';
  position: absolute;
  bottom: -60px;
  left: -60px;
  width: 180px;
  height: 180px;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 50%;
}
.profile-top {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
  position: relative;
  z-index: 2;
}
.profile-avatar-lg {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--sunset);
  background-size: cover;
  background-position: center;
  border: 2px solid rgba(255,255,255,0.3);
  position: relative;
}
.profile-avatar-lg::after {
  content: '';
  position: absolute;
  top: -4px;
  left: -4px;
  right: -4px;
  bottom: -4px;
  border: 2px solid var(--sunset);
  border-radius: 50%;
  opacity: 0.5;
  animation: avatarPulse 2.5s ease-in-out infinite;
}
@keyframes avatarPulse {
  0%, 100% { transform: scale(1); opacity: 0.5; }
  50% { transform: scale(1.15); opacity: 0; }
}
.profile-name-wrap { flex: 1; }
.profile-name {
  font-size: 20px;
  font-weight: 600;
  color: var(--white);
  margin-bottom: 4px;
}
.profile-id {
  font-size: 12px;
  color: rgba(255,255,255,0.6);
}
.profile-settings-btn {
  width: 36px;
  height: 36px;
  background: rgba(255,255,255,0.15);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: none;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.profile-settings-btn:hover { transform: rotate(45deg); }

.profile-stats-row {
  display: flex;
  justify-content: space-around;
  position: relative;
  z-index: 2;
  padding: 8px 0;
}
.profile-stat {
  text-align: center;
  cursor: none;
  transition: transform 0.3s ease;
}
.profile-stat:hover { transform: translateY(-3px); }
.profile-stat-num {
  font-size: 22px;
  font-weight: 700;
  color: var(--white);
  margin-bottom: 2px;
}
.profile-stat-label {
  font-size: 11px;
  color: rgba(255,255,255,0.7);
}

.profile-menu {
  margin: -20px 20px 0;
  position: relative;
  z-index: 5;
  background: var(--white);
  border-radius: 20px;
  padding: 8px 0;
  box-shadow: var(--shadow-md);
}
.profile-menu-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  cursor: none;
  transition: background 0.2s ease;
  position: relative;
}
.profile-menu-item:hover { background: var(--cream); }
.profile-menu-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(91,140,90,0.1);
  color: var(--bamboo-dark);
  flex-shrink: 0;
}
.profile-menu-item:nth-child(2) .profile-menu-icon {
  background: rgba(232,145,90,0.12);
  color: var(--sunset-dark);
}
.profile-menu-item:nth-child(3) .profile-menu-icon {
  background: rgba(107,105,99,0.1);
  color: var(--stone);
}
.profile-menu-item:nth-child(4) .profile-menu-icon {
  background: rgba(45,74,43,0.1);
  color: var(--forest);
}
.profile-menu-text { flex: 1; }
.profile-menu-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  margin-bottom: 2px;
}
.profile-menu-sub {
  font-size: 11px;
  color: var(--stone);
}
.profile-menu-arrow {
  color: var(--text-tertiary);
}
.profile-divider {
  height: 1px;
  background: var(--cream-dark);
  margin: 0 18px 0 68px;
}

.profile-bottom {
  padding: 20px 20px 100px;
}

/* ===== Page: Design Spec ===== */
.spec-page {
  background: var(--cream);
  padding-bottom: 50px;
}
.spec-hero {
  padding: 60px 20px 24px;
  background: var(--text-primary);
  color: var(--white);
  position: relative;
  overflow: hidden;
}
.spec-hero::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, rgba(91,140,90,0.3) 0%, transparent 70%);
}
.spec-badge {
  display: inline-block;
  padding: 4px 12px;
  background: rgba(91,140,90,0.25);
  border: 1px solid rgba(91,140,90,0.4);
  border-radius: 20px;
  font-size: 11px;
  color: var(--bamboo-light);
  letter-spacing: 1px;
  margin-bottom: 12px;
}
.spec-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 6px;
  position: relative;
}
.spec-sub {
  font-size: 13px;
  color: rgba(255,255,255,0.6);
  position: relative;
}

.spec-section {
  margin: 24px 20px 0;
  background: var(--white);
  border-radius: 18px;
  padding: 20px;
  box-shadow: var(--shadow-sm);
}
.spec-section-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.spec-section-title::before {
  content: '';
  width: 3px;
  height: 14px;
  background: var(--bamboo);
  border-radius: 2px;
}

.color-palette {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}
.color-swatch {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: none;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.color-swatch:hover { transform: scale(1.08) translateY(-3px); }
.color-circle {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  box-shadow: var(--shadow-sm);
  position: relative;
}
.color-circle::after {
  content: '';
  position: absolute;
  top: 4px;
  left: 4px;
  width: 12px;
  height: 12px;
  background: rgba(255,255,255,0.3);
  border-radius: 50%;
}
.color-name {
  font-size: 11px;
  color: var(--stone);
  text-align: center;
}
.color-hex {
  font-size: 10px;
  color: var(--text-tertiary);
  font-family: 'SF Mono', monospace;
}

.typography-sample {
  margin-bottom: 18px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--cream-dark);
}
.typography-sample:last-child {
  margin-bottom: 0;
  padding-bottom: 0;
  border-bottom: none;
}
.type-preview {
  font-family: 'Noto Serif SC', serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.typography-sample:nth-child(2) .type-preview {
  font-family: 'Noto Serif SC', serif;
  font-size: 18px;
  font-weight: 600;
}
.typography-sample:nth-child(3) .type-preview {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 14px;
  font-weight: 500;
}
.typography-sample:nth-child(4) .type-preview {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 12px;
  font-weight: 400;
}
.type-meta {
  display: flex;
  gap: 12px;
  font-size: 11px;
  color: var(--text-tertiary);
}

.component-showcase {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}
.comp-btn-primary {
  padding: 10px 20px;
  background: var(--bamboo);
  color: var(--white);
  border-radius: 12px;
  font-size: 13px;
  font-weight: 500;
}
.comp-btn-secondary {
  padding: 10px 20px;
  background: var(--white);
  color: var(--bamboo);
  border: 1px solid var(--bamboo);
  border-radius: 12px;
  font-size: 13px;
  font-weight: 500;
}
.comp-chip {
  padding: 6px 14px;
  background: var(--cream-dark);
  color: var(--stone);
  border-radius: 20px;
  font-size: 12px;
}
.comp-card {
  width: 100%;
  height: 80px;
  background: var(--cream);
  border-radius: 12px;
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
}
.comp-card-box {
  width: 48px;
  height: 48px;
  background: var(--bamboo-light);
  border-radius: 10px;
}
.comp-card-lines {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.comp-card-line {
  height: 8px;
  background: var(--cream-darker);
  border-radius: 4px;
}
.comp-card-line:nth-child(1) { width: 60%; }
.comp-card-line:nth-child(2) { width: 40%; }

/* ===== Page: API Docs ===== */
.api-page {
  background: #1a1a1a;
  color: #e0e0e0;
  padding-bottom: 50px;
}
.api-hero {
  padding: 60px 20px 24px;
  background: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 100%);
  border-bottom: 1px solid #2a2a2a;
  position: relative;
  overflow: hidden;
}
.api-hero::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent 49%, rgba(91,140,90,0.05) 50%, transparent 51%);
  background-size: 40px 100%;
  animation: gridMove 20s linear infinite;
}
@keyframes gridMove {
  to { background-position: 40px 0; }
}
.api-badge {
  display: inline-block;
  padding: 4px 12px;
  background: rgba(91,140,90,0.15);
  border: 1px solid rgba(91,140,90,0.3);
  border-radius: 6px;
  font-size: 11px;
  color: var(--bamboo-light);
  font-family: 'SF Mono', Menlo, monospace;
  letter-spacing: 1px;
  margin-bottom: 12px;
  position: relative;
}
.api-title {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 24px;
  font-weight: 700;

  // Pull to refresh (simulated touch)
  const handleTouchStart = useCallback((e) => {
    if (pageRef.current && pageRef.current.scrollTop <= 0) {
      startYRef.current = e.touches ? e.touches[0].clientY : e.clientY;
    }
  }, []);

  const handleTouchMove = useCallback((e) => {
    if (!startYRef.current || !pageRef.current) return;
    const currentY = e.touches ? e.touches[0].clientY : e.clientY;
    const diff = currentY - startYRef.current;
    if (diff > 0 && pageRef.current.scrollTop <= 0) {
      pullDistanceRef.current = Math.min(diff * 0.5, 80);
      setPullVisible(true);
      if (pageRef.current) {
        pageRef.current.style.transform = `translateY(${pullDistanceRef.current}px)`;
      }
    }
  }, []);

  const handleTouchEnd = useCallback(() => {
    if (pullDistanceRef.current > 60) {
      setPullSpinning(true);
      setTimeout(() => {
        setPullSpinning(false);
        setPullVisible(false);
        if (pageRef.current) {
          pageRef.current.style.transform = '';
        }
      }, 1200);
    } else {
      setPullVisible(false);
      if (pageRef.current) {
        pageRef.current.style.transform = '';
      }
    }
    startYRef.current = 0;
    pullDistanceRef.current = 0;
  }, []);

  const toggleLike = (id, e) => {
    e.stopPropagation();
    setLiked(prev => ({ ...prev, [id]: !prev[id] }));
  };

  return (
    <div
      ref={pageRef}
      className="page"
      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}
      onTouchEnd={handleTouchEnd}
      data-screen-label="01-首页发现"
    >
      <div className={`pull-indicator ${pullVisible ? 'visible' : ''} ${pullSpinning ? 'spinning' : ''}`}>
        <Icon name="refresh" size={18} color="#5B8C5A" />
      </div>
      
      <div className="home-hero">
        <img ref={heroRef} className="home-hero-img" src={IMG_HOME_HERO} alt="山居" />
        <div className="home-hero-overlay"></div>
        
        <div className="home-hero-content">
          <div className="home-greeting">云 宿 山 居</div>
          <h1 className="home-title">在山野间<br/>寻一处心安</h1>
          <p className="home-subtitle">精选全国 200+ 山居民宿 · 住进风景里</p>
        </div>
      </div>

      <div className="search-bar">
        <Icon name="search" size={18} />
        <span className="search-text">搜索民宿、体验、目的地</span>
      </div>

      <div className="category-section">
        <div className="category-row">
          {categories.map(cat => (
            <div

              onClick={() => setActiveCat(cat)}

      <div className="homestay-list">

function DetailPage({ homestay, onBack, reducedMotion, onShowToast }) {
  const heroRef = useRef(null);

  const animFrameRef = useRef(null);

  useEffect(() => {
    if (reducedMotion) return;
    const page = pageRef.current;
    if (!page) return;
    
    const handleScroll = () => {
      if (animFrameRef.current) return;
      animFrameRef.current = requestAnimationFrame(() => {
        const scrollY = page.scrollTop;
        if (heroRef.current) {
          heroRef.current.style.transform = `translateY(${scrollY * 0.5}px)`;
          heroRef.current.style.filter = `brightness(${Math.max(0.6, 1 - scrollY / 400)})`;
        }
        animFrameRef.current = null;
      });
    };
    
    page.addEventListener('scroll', handleScroll, { passive: true });
    return () => {
      page.removeEventListener('scroll', handleScroll);
      if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);

function TripPage({ reducedMotion }) {
  const [activeTab, setActiveTab] = useState('upcoming');
  const [progress, setProgress] = useState(0);

  useEffect(() => {
    if (reducedMotion) {
      setProgress(65);
      return;
    }
    const timer = setTimeout(() => setProgress(65), 300);
    return () => clearTimeout(timer);
  }, [reducedMotion]);

  const circumference = 2 * Math.PI * 34;
  const offset = circumference - (progress / 100) * circumference;

  const filteredTrips = activeTab === 'upcoming'
    ? trips.filter(t => t.upcoming)
    : trips.filter(t => !t.upcoming);

  return (
    <div className="page trip-page" data-screen-label="05-行程收藏">

/* ============================================
   Bamboo Leaf Particles (Signature Effect)
   ============================================ */
function BambooParticles({ active, reducedMotion }) {
  const leaves = useRef([]);
  
  useEffect(() => {
    if (reducedMotion) return;
    // Generate random leaves
    const newLeaves = [];
    for (let i = 0; i < 8; i++) {
      newLeaves.push({
        id: i,
        left: Math.random() * 100,
        delay: Math.random() * 8,
        duration: 6 + Math.random() * 8,
        size: 6 + Math.random() * 8,
        opacity: 0.2 + Math.random() * 0.3,
      });
    }
    leaves.current = newLeaves;
  }, [active, reducedMotion]);

  if (!active || reducedMotion) return null;

  return (
    <div className="bamboo-particles">
      {leaves.current.map(leaf => (
        <div
          key={leaf.id}
          className="bamboo-leaf"
          style={{
            left: `${leaf.left}%`,
            width: `${leaf.size}px`,
            height: `${leaf.size * 2}px`,
            animationDuration: `${leaf.duration}s`,
            animationDelay: `${leaf.delay}s`,
            opacity: leaf.opacity,
          }}
        />
      ))}
    </div>
  );
}

/* ============================================
   Main App
   ============================================ */
function App() {
  const [currentPage, setCurrentPage] = useState('home');
  const [direction, setDirection] = useState('right');
  const [selectedHomestay, setSelectedHomestay] = useState(null);
  const [showQuickActions, setShowQuickActions] = useState(false);
  const [toast, setToast] = useState({ visible: false, message: '' });
  const [reducedMotion, setReducedMotion] = useState(false);
  const [pageVisible, setPageVisible] = useState(true);
  const toastTimerRef = useRef(null);

  const pageOrder = ['home', 'experience', 'trip', 'profile', 'host', 'detail', 'spec', 'api'];
  const pageLabels = ['首页', '体验', '行程', '我的', '房东', '详情', '规范', '接口'];

  // Check reduced motion
  useEffect(() => {
    const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    setReducedMotion(mq.matches);
    const handler = e => setReducedMotion(e.matches);
    mq.addEventListener('change', handler);
    return () => mq.removeEventListener('change', handler);
  }, []);

  // Visibility change - pause animations
  useEffect(() => {
    const handleVisibility = () => {
      setPageVisible(!document.hidden);
    };
    document.addEventListener('visibilitychange', handleVisibility);
    return () => document.removeEventListener('visibilitychange', handleVisibility);
  }, []);

  const showToast = useCallback((message) => {
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    setToast({ visible: true, message });
    toastTimerRef.current = setTimeout(() => {
      setToast({ visible: false, message: '' });
    }, 2500);
  }, []);

  const switchPage = (page) => {
    if (page === currentPage) return;
    const fromIdx = pageOrder.indexOf(currentPage);
    const toIdx = pageOrder.indexOf(page);
    setDirection(toIdx > fromIdx ? 'right' : 'left');
    setCurrentPage(page);
    setSelectedHomestay(null);
  };

  const openDetail = (homestay) => {
    setSelectedHomestay(homestay);
    setDirection('right');
    setCurrentPage('detail');
  };

  const goBack = () => {
    setDirection('left');
    setCurrentPage('home');
  };

  // Tab bar items
  const tabs = [
    { key: 'home', icon: 'home', label: '发现' },
    { key: 'experience', icon: 'compass', label: '体验' },
    { key: 'trip', icon: 'calendar', label: '行程' },
    { key: 'profile', icon: 'user', label: '我的' },
  ];

  const currentIdx = pageOrder.indexOf(currentPage);

  const renderPage = (key) => {
    const isActive = currentPage === key;
    const isLeft = currentIdx > pageOrder.indexOf(key);
    const cls = isActive ? '' : (isLeft ? 'hidden-left' : 'hidden-right');
    
    let content = null;
    switch (key) {
      case 'home':
        content = <HomePage onOpenDetail={openDetail} reducedMotion={reducedMotion || !pageVisible} />;
        break;
      case 'detail':
        content = <DetailPage homestay={selectedHomestay} onBack={goBack} reducedMotion={reducedMotion || !pageVisible} onShowToast={showToast} />;
        break;
      case 'experience':
        content = <ExperiencePage reducedMotion={reducedMotion || !pageVisible} />;
        break;
      case 'host':
        content = <HostPage />;
        break;
      case 'trip':
        content = <TripPage reducedMotion={reducedMotion || !pageVisible} />;
        break;
      case 'profile':
        content = <ProfilePage />;
        break;
      case 'spec':
        content = <DesignSpecPage />;
        break;
      case 'api':
        content = <ApiDocPage />;
        break;
      default:
        content = null;
    }

    return (
      <div key={key} className={`${cls}`} style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%' }}>
        {content}
      </div>
    );
  };

  return (
    <div className="stage">
      {/* Page picker dots (outside phone) */}
      <div className="page-picker">
        {pageOrder.map((p, i) => (
          <div
            key={p}
            className={`page-dot ${currentPage === p ? 'active' : ''}`}
            onClick={() => switchPage(p)}
            title={pageLabels[i]}
          />
        ))}
      </div>

      <div className="phone-frame">
        <div className="phone-screen">
          <div className="phone-notch"></div>
          <div className="phone-status-bar">
            <span>9:41</span>
            <div className="status-right">
              <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
                <path d="M0 12h16V6l-2-1v7H2V5L0 6v6z"/>
                <path d="M3 8h10V3L8 0 3 3v5z" opacity="0.8"/>
              </svg>
              <svg width="14" height="10" viewBox="0 0 14 10" fill="currentColor">
                <path d="M1 5a6 6 0 0 1 12 0M3.5 7a3 3 0 0 1 7 0M6 9h2v0.5a1 1 0 1 1-2 0V9z" stroke="currentColor" strokeWidth="1" fill="none" strokeLinecap="round"/>
              </svg>
              <svg width="24" height="11" viewBox="0 0 24 11" fill="none">
                <rect x="0.5" y="0.5" width="21" height="10" rx="2" stroke="currentColor" opacity="0.5"/>
                <rect x="2" y="2" width="17" height="7" rx="1" fill="currentColor"/>
                <rect x="22.5" y="3.5" width="1.5" height="4" rx="0.5" fill="currentColor" opacity="0.5"/>
              </svg>
            </div>
          </div>

          <BambooParticles active={pageVisible && currentPage === 'home'} reducedMotion={reducedMotion} />

          <div className="page-container">
            {pageOrder.map(p => renderPage(p))}
          </div>

          {/* FAB - 悬浮操作按钮 */}
          {['home', 'experience'].includes(currentPage) && (
            <div className="fab" onClick={() => setShowQuickActions(true)}>
              <Icon name="plus" size={22} />
            </div>
          )}

          {/* Tab bar - only for main tabs */}
          {['home', 'experience', 'trip', 'profile'].includes(currentPage) && (
            <div className="tab-bar">
              {tabs.map(tab => (
                <div
                  key={tab.key}

/* ============================================
   Custom Cursor Implementation
   ============================================ */
(function() {
  const cursorOuter = document.getElementById('cursorOuter');
  const cursorInner = document.getElementById('cursorInner');
  const cursorGlow = document.getElementById('cursorGlow');
  
  // Check reduced motion
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reducedMotion) return;

  // Start at center of viewport
  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let outerX = mouseX;
  let outerY = mouseY;
  let glowX = mouseX;
  let glowY = mouseY;
  let animFrame = null;
  let visible = false;

  // Set initial position
  cursorOuter.style.left = mouseX + 'px';
  cursorOuter.style.top = mouseY + 'px';
  cursorInner.style.left = mouseX + 'px';
  cursorInner.style.top = mouseY + 'px';
  cursorGlow.style.left = mouseX + 'px';
  cursorGlow.style.top = mouseY + 'px';

  // Visibility handling
  let isVisible = true;
  document.addEventListener('visibilitychange', () => {
    isVisible = !document.hidden;
    if (!isVisible && animFrame) {
      cancelAnimationFrame(animFrame);
      animFrame = null;
    } else if (isVisible) {
      animate();
    }
  });

  function animate() {
    if (!isVisible) return;
    
    // Outer cursor - spring follow
    const dx = mouseX - outerX;
    const dy = mouseY - outerY;
    outerX += dx * 0.15;
    outerY += dy * 0.15;
    
    // Glow - slower follow
    const gdx = mouseX - glowX;
    const gdy = mouseY - glowY;
    glowX += gdx * 0.08;
    glowY += gdy * 0.08;
    
    cursorOuter.style.left = outerX + 'px';
    cursorOuter.style.top = outerY + 'px';
    cursorGlow.style.left = glowX + 'px';
    cursorGlow.style.top = glowY + 'px';
    cursorInner.style.left = mouseX + 'px';
    cursorInner.style.top = mouseY + 'px';
    
    animFrame = requestAnimationFrame(animate);
  }

  document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    if (!animFrame && isVisible) {
      animate();
    }
  }, { passive: true });

  // Hover state
  const hoverSelector = 'button, .tab-item, .category-pill, .homestay-card, .card-fav, .card-book-btn, .amenity-item, .book-now-btn, .fab, .exp-card, .exp-filter, .host-stat, .host-listing-mini, .trip-card, .trip-tab, .profile-stat, .profile-menu-item, .profile-settings-btn, .color-swatch, .api-ep-header, .quick-action, .detail-nav-btn, .search-bar, .section-more, .page-dot, .spec-section, .trip-card, [onclick]';

  document.addEventListener('mouseover', (e) => {
    if (e.target.closest(hoverSelector)) {
      cursorOuter.classList.add('hover');
      cursorInner.classList.add('hover');
      cursorGlow.classList.add('hover');
    }
  });

  document.addEventListener('mouseout', (e) => {
    if (e.target.closest(hoverSelector)) {
      cursorOuter.classList.remove('hover');
      cursorInner.classList.remove('hover');
      cursorGlow.classList.remove('hover');
    }
  });

  // Click ripple
  document.addEventListener('mousedown', (e) => {
    cursorOuter.classList.add('clicking');
    
    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    document.body.appendChild(ripple);
    
    setTimeout(() => ripple.remove(), 600);
  });

  document.addEventListener('mouseup', () => {
    cursorOuter.classList.remove('clicking');
  });

  // Start animation loop
  animate();

  // Cleanup on unload
  window.addEventListener('beforeunload', () => {
    if (animFrame) cancelAnimationFrame(animFrame);
  });
})();
</script>
</body>
</html>

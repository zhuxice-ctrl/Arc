<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>拾光循环 · 社区旧物循环小程序 · V2</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" />
<style>
  :root {
    --vintage-green: #3E5C41;
    --vintage-green-light: #5A7A5D;
    --vintage-green-dark: #2A402D;
    --paper-cream: #F2EBDD;
    --paper-cream-dark: #E5DCC9;
    --paper-dark: #D4C9B0;
    --post-orange: #D96C2C;
    --post-orange-light: #E88B4E;
    --ink-gray: #33352E;
    --ink-light: #6B6D64;
    --ink-faint: #A8A99F;
    --stamp-red: #B9472E;
    --sage: #8AA68A;
    --mustard: #C49A3D;
    --burgundy: #8B3A3A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #1a1a1a;
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    cursor: none;
  }
  #root { width: 100%; height: 100%; }
  .app-wrapper {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #2a2a2a 0%, #0f0f0f 100%);
    position: relative;
  }
  .app-label {
    position: absolute;
    top: 24px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    letter-spacing: 4px;
    font-weight: 300;
    z-index: 10;
  }

  /* Custom Cursor */
  .cursor-dot {
    position: fixed; top: 0; left: 0;
    width: 8px; height: 8px;
    background: var(--post-orange);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.2s ease, height 0.2s ease, background 0.2s ease, opacity 0.2s;
    will-change: transform;
    mix-blend-mode: difference;
  }
  .cursor-ring {
    position: fixed; top: 0; left: 0;
    width: 32px; height: 32px;
    border: 1.5px solid var(--post-orange);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    will-change: transform;
    transition: width 0.3s cubic-bezier(0.23, 1, 0.32, 1),
                height 0.3s cubic-bezier(0.23, 1, 0.32, 1),
                border-color 0.3s, opacity 0.3s;
    mix-blend-mode: difference;
  }
  .cursor-ring.hover { width: 56px; height: 56px; border-color: var(--vintage-green-light); }
  .cursor-dot.hover { width: 4px; height: 4px; }
  .cursor-ripple {
    position: fixed; width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--post-orange);
    pointer-events: none;
    z-index: 9997;
    transform: translate(-50%, -50%);
    opacity: 0;
  }
  @keyframes rippleExpand {
    0% { width: 8px; height: 8px; opacity: 0.6; }
    100% { width: 60px; height: 60px; opacity: 0; }
  }

  /* Device Frame */
  .phone-frame {
    position: relative;
    width: 390px; height: 844px;
    border-radius: 54px;
    background: #1c1c1e;
    padding: 12px;
    box-shadow: 0 0 0 2px #2c2c2e, 0 30px 80px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.05);
  }
  .phone-screen {
    width: 100%; height: 100%;
    border-radius: 42px;
    overflow: hidden;
    position: relative;
    background: var(--paper-cream);
  }
  .dynamic-island {
    position: absolute; top: 11px; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 36px;
    background: #000;
    border-radius: 20px;
    z-index: 1000;
  }
  .home-indicator {
    position: absolute; bottom: 8px; left: 50%;
    transform: translateX(-50%);
    width: 134px; height: 5px;
    background: var(--ink-gray);
    border-radius: 3px;
    z-index: 1000;
    opacity: 0.4;
  }

  /* Status Bar */
  .status-bar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 54px;
    padding: 18px 32px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-gray);
    z-index: 999;
    pointer-events: none;
  }
  .status-bar.light { color: #fff; }
  .status-bar .right { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .status-bar .signal { display: flex; gap: 2px; align-items: flex-end; height: 12px; }
  .status-bar .signal span { width: 3px; background: currentColor; border-radius: 1px; }
  .status-bar .signal span:nth-child(1) { height: 4px; }
  .status-bar .signal span:nth-child(2) { height: 7px; }
  .status-bar .signal span:nth-child(3) { height: 10px; }
  .status-bar .signal span:nth-child(4) { height: 12px; }

  /* Mini Program Nav Bar */
  .mp-navbar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 88px;
    z-index: 500;
    display: flex;
    align-items: flex-end;
    padding: 0 16px 10px;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .mp-navbar.transparent { background: transparent; }
  .mp-navbar.solid { background: var(--paper-cream); box-shadow: 0 1px 0 rgba(0,0,0,0.05); }
  .mp-navbar.gradient { background: linear-gradient(180deg, var(--vintage-green-dark) 0%, transparent 100%); }
  .mp-navbar .nav-title {
    flex: 1; text-align: center;
    font-size: 17px; font-weight: 600;
    color: var(--ink-gray);
    font-family: 'Noto Serif SC', serif;
    letter-spacing: 1px;
  }
  .mp-navbar.light .nav-title { color: #fff; }
  .mp-navbar .nav-left { width: 80px; display: flex; align-items: center; gap: 8px; }
  .back-btn {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: rgba(0,0,0,0.06);
    cursor: none;
  }
  .mp-navbar.light .back-btn { background: rgba(255,255,255,0.2); }
  .capsule-btn {
    position: absolute; top: 54px; right: 16px;
    width: 88px; height: 32px;
    background: rgba(255,255,255,0.85);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    z-index: 600;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .capsule-btn .capsule-icon {
    width: 36px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-gray);
    font-size: 16px;
  }
  .capsule-btn .capsule-divider { width: 1px; height: 16px; background: rgba(0,0,0,0.1); }

  /* TabBar */
  .tabbar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 83px;
    background: rgba(255, 252, 245, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(0,0,0,0.06);
    display: flex;
    z-index: 400;
    padding-bottom: 28px;
  }
  .tabbar-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: none;
    color: var(--ink-faint);
    font-size: 10px;
    transition: color 0.2s;
    position: relative;
  }
  .tabbar-item.active { color: var(--vintage-green); }
  .tabbar-icon {
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .tabbar-item.active .tabbar-icon { animation: tabBounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes tabBounce {
    0% { transform: scale(1); }
    40% { transform: scale(1.25) translateY(-2px); }
    70% { transform: scale(0.92) translateY(1px); }
    100% { transform: scale(1) translateY(0); }
  }
  .tabbar-dot {
    position: absolute; bottom: 22px;
    width: 4px; height: 4px;
    background: var(--post-orange);
    border-radius: 50%;
    opacity: 0; transform: scale(0);
    transition: opacity 0.3s, transform 0.3s;
  }
  .tabbar-item.active .tabbar-dot { opacity: 1; transform: scale(1); }

  /* Page Container */
  .page-container {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden;
  }
  .page {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    overflow-y: auto;
    overflow-x: hidden;
    background: var(--paper-cream);
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .page::-webkit-scrollbar { display: none; }
  .page.page-push-enter { animation: pagePushIn 0.35s cubic-bezier(0.32, 0.72, 0, 1) forwards; }
  @keyframes pagePushIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  .page-content { padding-top: 88px; padding-bottom: 83px; min-height: 100%; }

  /* Home Page */
  .home-hero {
    position: relative;
    margin: 0 16px;
    height: 220px;
    border-radius: 24px;
    overflow: hidden;
    margin-top: -20px;
  }
  .home-hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .home-hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(62,92,65,0.85) 0%, rgba(42,64,45,0.6) 50%, rgba(217,108,44,0.3) 100%);
  }
  .home-hero-content {
    position: absolute; inset: 0;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    color: #fff;
  }
  .home-hero-eyebrow { font-size: 11px; letter-spacing: 3px; opacity: 0.8; margin-bottom: 6px; font-weight: 300; }
  .home-hero-title { font-family: 'Noto Serif SC', serif; font-size: 26px; font-weight: 700; line-height: 1.3; margin-bottom: 8px; }
  .home-hero-sub { font-size: 12px; opacity: 0.85; font-weight: 300; }
  .home-hero-stamp {
    position: absolute; top: 16px; right: 16px;
    width: 60px; height: 60px;
    border: 2px solid rgba(255,255,255,0.6);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Noto Serif SC', serif;
    font-size: 10px;
    color: rgba(255,255,255,0.8);
    text-align: center;
    line-height: 1.3;
    transform: rotate(-12deg);
    animation: stampSpin 20s linear infinite;
  }
  @keyframes stampSpin { from { transform: rotate(-12deg); } to { transform: rotate(348deg); } }

  .home-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 16px; }
  .stat-card {
    background: #fff;
    border-radius: 16px;
    padding: 16px 12px;
    text-align: center;
    box-shadow: 0 2px 12px rgba(62,92,65,0.06);
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: '';
    position: absolute; top: 0; left: 0;
    width: 100%; height: 3px;
    background: var(--vintage-green);
  }
  .stat-card:nth-child(2)::before { background: var(--post-orange); }
  .stat-card:nth-child(3)::before { background: var(--mustard); }
  .stat-num { font-family: 'Noto Serif SC', serif; font-size: 22px; font-weight: 700; color: var(--ink-gray); line-height: 1; }
  .stat-unit { font-size: 11px; color: var(--ink-faint); margin-top: 4px; }
  .stat-label { font-size: 10px; color: var(--ink-light); margin-top: 6px; }

  .section-header { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; margin-bottom: 14px; }
  .section-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 18px; font-weight: 700;
    color: var(--ink-gray);
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::before {
    content: '';
    width: 3px; height: 16px;
    background: var(--post-orange);
    border-radius: 2px;
  }
  .section-more { font-size: 12px; color: var(--ink-faint); cursor: none; display: flex; align-items: center; gap: 2px; }

  .quick-actions {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 8px; padding: 0 16px; margin-bottom: 24px;
  }
  .quick-action {
    display: flex; flex-direction: column; align-items: center;
    gap: 6px; padding: 12px 4px;
    cursor: none; border-radius: 12px;
    transition: background 0.2s;
  }
  .quick-action:active { background: rgba(0,0,0,0.04); }
  .qa-icon {
    width: 48px; height: 48px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    background: var(--paper-dark);
    transition: transform 0.3s;
  }
  .quick-action:hover .qa-icon { transform: translateY(-3px); }
  .quick-action:nth-child(1) .qa-icon { background: #E8E0D0; color: var(--vintage-green); }
  .quick-action:nth-child(2) .qa-icon { background: #F5E0D0; color: var(--post-orange); }
  .quick-action:nth-child(3) .qa-icon { background: #EAE5D8; color: var(--mustard); }
  .quick-action:nth-child(4) .qa-icon { background: #E0E5DA; color: var(--sage); }
  .qa-label { font-size: 11px; color: var(--ink-light); }

  /* Drift list - waterfall */
  .drift-list { padding: 0 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .drift-card {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(62,92,65,0.08);
    cursor: none;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
  }
  .drift-card:hover { transform: translateY(-4px); }
  .drift-card:nth-child(even) { margin-top: 24px; }
  .drift-card-img { width: 100%; aspect-ratio: 1; background-size: cover; background-position: center; position: relative; }
  .drift-card-tag {
    position: absolute; top: 10px; left: 10px;
    padding: 3px 8px;
    background: var(--vintage-green);
    color: #fff;
    font-size: 9px;
    border-radius: 6px;
    font-weight: 500;
  }
  .drift-card-tag.free { background: var(--post-orange); }
  .drift-card-stamp {
    position: absolute; top: 10px; right: 10px;
    width: 36px; height: 36px;
    border: 1.5px solid var(--stamp-red);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; color: var(--stamp-red);
    font-family: 'Noto Serif SC', serif;
    transform: rotate(15deg);
    opacity: 0.85;
    line-height: 1.2; text-align: center;
  }
  .drift-card-body { padding: 10px 12px 12px; }
  .drift-card-title {
    font-size: 13px; font-weight: 600;
    color: var(--ink-gray);
    margin-bottom: 4px;
    font-family: 'Noto Serif SC', serif;
    line-height: 1.3;
  }
  .drift-card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    color: var(--ink-faint);
    margin-top: 6px;
  }
  .drift-card-owner { display: flex; align-items: center; gap: 4px; }
  .owner-avatar {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--paper-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; color: var(--vintage-green);
    font-weight: 600;
  }

  /* Category Page */
  .cat-sticky-tabs {
    position: sticky; top: 88px; z-index: 100;
    background: var(--paper-cream);
    padding: 12px 16px 8px;
    border-bottom: 1px solid rgba(0,0,0,0.05);
  }
  .cat-tabs { display: flex; gap: 20px; overflow-x: auto; scrollbar-width: none; }
  .cat-tabs::-webkit-scrollbar { display: none; }
  .cat-tab {
    flex-shrink: 0;
    font-size: 15px;
    color: var(--ink-faint);
    font-weight: 500;
    padding: 6px 2px;
    cursor: none;
    position: relative;
    font-family: 'Noto Serif SC', serif;
    transition: color 0.2s;
  }
  .cat-tab.active { color: var(--vintage-green); font-weight: 700; font-size: 18px; }
  .cat-tab-indicator {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 3px;
    background: var(--post-orange);
    border-radius: 2px;
    transform: scaleX(0);
    transition: transform 0.3s;
  }
  .cat-tab.active .cat-tab-indicator { transform: scaleX(1); }

  .cat-filter-bar { display: flex; gap: 8px; padding: 10px 16px; flex-wrap: wrap; }
  .filter-chip {
    padding: 5px 12px;
    background: #fff;
    border: 1px solid var(--paper-dark);
    border-radius: 14px;
    font-size: 11px;
    color: var(--ink-light);
    cursor: none;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 4px;
  }
  .filter-chip.active { background: var(--vintage-green); border-color: var(--vintage-green); color: #fff; }

  .cat-grid {
    padding: 4px 16px 16px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .cat-item {
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    cursor: none;
    position: relative;
  }
  .cat-item-img { width: 100%; aspect-ratio: 1; background-size: cover; background-position: center; }
  .cat-item-info { padding: 8px 10px; }
  .cat-item-name {
    font-size: 12px; font-weight: 600;
    color: var(--ink-gray);
    margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cat-item-price { font-size: 11px; color: var(--post-orange); font-weight: 600; }
  .cat-item-price.free { color: var(--vintage-green); }

  .swipe-hint {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    padding: 8px 16px;
    font-size: 10px;
    color: var(--ink-faint);
    animation: swipeHintBounce 2s ease-in-out infinite;
  }
  @keyframes swipeHintBounce {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(-8px); }
  }

  /* Station Page */
  .station-hero {
    position: relative;
    height: 260px;
    margin: 0 16px;
    margin-top: -20px;
    border-radius: 24px;
    overflow: hidden;
  }
  .station-hero-img { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .station-hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 30%, rgba(42,64,45,0.9) 100%);
  }
  .station-hero-content { position: absolute; bottom: 20px; left: 20px; right: 20px; color: #fff; }
  .station-hero-title { font-family: 'Noto Serif SC', serif; font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .station-hero-desc { font-size: 12px; opacity: 0.8; line-height: 1.6; font-weight: 300; }

  .station-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 16px; }
  .station-info-card {
    background: #fff;
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 2px 10px rgba(62,92,65,0.05);
  }
  .info-card-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: var(--paper-dark);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 10px;
    color: var(--vintage-green);
  }
  .info-card-title { font-size: 12px; font-weight: 600; color: var(--ink-gray); margin-bottom: 4px; }
  .info-card-desc { font-size: 10px; color: var(--ink-faint); line-height: 1.5; }

  .station-timeline { padding: 0 16px 16px; }
  .timeline { position: relative; padding-left: 20px; }
  .timeline::before {
    content: '';
    position: absolute; left: 5px; top: 4px; bottom: 4px;
    width: 2px; background: var(--paper-dark);
    border-radius: 1px;
  }
  .timeline-item { position: relative; padding-bottom: 16px; }
  .timeline-dot {
    position: absolute; left: -19px; top: 3px;
    width: 12px; height: 12px;
    background: var(--paper-cream);
    border: 2px solid var(--vintage-green);
    border-radius: 50%;
  }
  .timeline-item:nth-child(2) .timeline-dot { border-color: var(--post-orange); }
  .timeline-item:nth-child(3) .timeline-dot { border-color: var(--mustard); }
  .timeline-time { font-size: 10px; color: var(--ink-faint); margin-bottom: 3px; }
  .timeline-text { font-size: 12px; color: var(--ink-gray); line-height: 1.5; }
  .timeline-user { font-size: 10px; color: var(--vintage-green); margin-top: 2px; }

  .action-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin: 8px 16px 20px;
    padding: 14px;
    background: var(--vintage-green);
    color: #fff;
    border-radius: 14px;
    font-size: 14px; font-weight: 500;
    cursor: none;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 16px rgba(62,92,65,0.3);
  }
  .action-btn:active { transform: scale(0.97); }

  /* Profile Page */
  .profile-hero {
    position: relative;
    height: 280px;
    background: linear-gradient(180deg, var(--vintage-green) 0%, var(--vintage-green-dark) 100%);
    overflow: hidden;
  }
  .profile-hero::before {
    content: '';
    position: absolute; top: -80px; right: -40px;
    width: 240px; height: 240px;
    background: radial-gradient(circle, rgba(217,108,44,0.3) 0%, transparent 70%);
    border-radius: 50%;

// ============ HOME PAGE ============
const HomePage = ({ onItemClick }) => {
  const pageRef = useRef(null);
  const [scrollProgress, setScrollProgress] = useState(0);
  const [pullDistance, setPullDistance] = useState(0);
  const [isRefreshing, setIsRefreshing] = useState(false);
  const startY = useRef(0);
  const isPulling = useRef(false);

  const handleScroll = useCallback((e) => {
    const el = e.target;
    const max = el.scrollHeight - el.clientHeight;
    const pct = max > 0 ? (el.scrollTop / max) * 100 : 0;
    setScrollProgress(pct);
  }, []);

  const handleMouseDown = useCallback((e) => {
    if (pageRef.current?.scrollTop === 0) {
      startY.current = e.clientY;
      isPulling.current = true;
    }
  }, []);

  const handleMouseMove = useCallback((e) => {
    if (!isPulling.current) return;
    const diff = e.clientY - startY.current;
    if (diff > 0 && pageRef.current?.scrollTop === 0) {
      setPullDistance(Math.min(diff * 0.5, 80));
    }
  }, []);

  const handleMouseUp = useCallback(() => {
    if (pullDistance > 60) {
      setIsRefreshing(true);
      setPullDistance(50);
      setTimeout(() => {
        setIsRefreshing(false);
        setPullDistance(0);
      }, 1500);
    } else {
      setPullDistance(0);
    }
    isPulling.current = false;
  }, [pullDistance]);

  useEffect(() => {
    const el = pageRef.current;
    if (!el) return;
    el.addEventListener('scroll', handleScroll, { passive: true });
    el.addEventListener('mousedown', handleMouseDown);
    window.addEventListener('mousemove', handleMouseMove);
    window.addEventListener('mouseup', handleMouseUp);
    return () => {
      el.removeEventListener('scroll', handleScroll);
      el.removeEventListener('mousedown', handleMouseDown);
      window.removeEventListener('mousemove', handleMouseMove);
      window.removeEventListener('mouseup', handleMouseUp);
    };
  }, [handleScroll, handleMouseDown, handleMouseMove, handleMouseUp]);

  return (
    <div className="page" ref={pageRef}>
      <div className="scroll-progress" style={{ width: `${scrollProgress}%` }}></div>
      <StatusBar light />
      <NavBar title="" variant="transparent" light showBack={false} />

      <div className={`pull-indicator ${pullDistance > 10 || isRefreshing ? 'show' : ''}`}
        style={{ top: `${88 + pullDistance * 0.3}px` }}>
        {isRefreshing ? <div className="pull-spinner"></div> : <Icon name="recycle" size={20} color="var(--vintage-green)" />}
        <div className="pull-text">{isRefreshing ? '漂流架更新中…' : pullDistance > 60 ? '松开刷新' : '下拉刷新'}</div>
      </div>

      <div className="page-content" style={{
        paddingTop: 120,
        transform: `translateY(${pullDistance}px)`,
        transition: isRefreshing ? 'transform 0.3s' : 'none',
      }}>
        {/* Hero Card */}
        <div className="home-hero anim-scale delay-1">
          <div className="home-hero-bg" style={{ backgroundImage: `url(${IMG.heroFlatlay})` }}></div>
          <div className="home-hero-overlay"></div>
          <div className="home-hero-stamp">拾光<br/>循环</div>
          <div className="home-hero-content">
            <div className="home-hero-eyebrow">COMMUNITY · RECYCLE</div>
            <div className="home-hero-title">让旧物<br/>再次发光</div>
            <div className="home-hero-sub">邻里之间，以物换物，让故事延续</div>
          </div>
        </div>

        {/* Stats */}
        <div className="home-stats">
          <div className="stat-card anim-fade-up delay-2">
            <div className="stat-num">1,286</div>
            <div className="stat-unit">件</div>
            <div className="stat-label">正在漂流</div>
          </div>
          <div className="stat-card anim-fade-up delay-3">
            <div className="stat-num">327</div>
            <div className="stat-unit">位</div>
            <div className="stat-label">邻居参与</div>
          </div>
          <div className="stat-card anim-fade-up delay-4">
            <div className="stat-num">56</div>
            <div className="stat-unit">个</div>
            <div className="stat-label">社区循环站</div>
          </div>
        </div>

        {/* Quick actions */}
        <div className="section-header anim-fade-up delay-4">
          <div className="section-title">快速入口</div>
        </div>
        <div className="quick-actions">
          <div className="quick-action anim-fade-up delay-4">
            <div className="qa-icon"><Icon name="upload" size={22} /></div>
            <span className="qa-label">挂漂流架</span>
          </div>
          <div className="quick-action anim-fade-up delay-5">
            <div className="qa-icon"><Icon name="hand" size={22} /></div>
            <span className="qa-label">免费领养</span>
          </div>
          <div className="quick-action anim-fade-up delay-6">

const Toast = ({ show, message }) => (
  <div className={`toast ${show ? 'show' : ''}`}>{message}</div>

// ============ MAIN APP ============
const App = () => {
  const [activeTab, setActiveTab] = useState('home');
  const [pageStack, setPageStack] = useState([{ type: 'tab', key: 'home' }]);
  const [showActionSheet, setShowActionSheet] = useState(false);
  const [actionSheetType, setActionSheetType] = useState('donate');
  const [selectedOption, setSelectedOption] = useState('item');
  const [toast, setToast] = useState({ show: false, msg: '' });
  const [isTransitioning, setIsTransitioning] = useState(false);

  const showToast = (msg) => {
    setToast({ show: true, msg });
    setTimeout(() => setToast({ show: false, msg: '' }), 1800);
  };

  const donateOptions = [
    { key: 'item', icon: 'gift', title: '捐赠一件物品', desc: '把闲置旧物挂上漂流架' },
    { key: 'story', icon: 'book', title: '分享旧物故事', desc: '为这件旧物写一段故事' },
    { key: 'volunteer', icon: 'userCheck', title: '报名志愿者', desc: '来站点帮忙整理旧物' },
  ];

  const exchangeOptions = [
    { key: 'item', icon: 'swap', title: '以物换物', desc: '用我的一件旧物来交换' },
    { key: 'story', icon: 'book', title: '写一段故事', desc: '为什么想要这件旧物' },
    { key: 'visit', icon: 'mapPin', title: '预约站点见面', desc: '约在循环站当面交接' },
  ];

  const currentPage = pageStack[pageStack.length - 1];

  const goToTab = (tabKey) => {
    if (isTransitioning) return;
    setIsTransitioning(true);
    setActiveTab(tabKey);
    setPageStack([{ type: 'tab', key: tabKey }]);
    setTimeout(() => setIsTransitioning(false), 350);
  };

  const pushPage = (type, data = {}) => {
    if (isTransitioning) return;
    setIsTransitioning(true);
    setPageStack(prev => [...prev, { type, data, direction: 'push' }]);
    setTimeout(() => setIsTransitioning(false), 350);
  };

  const popPage = () => {
    if (isTransitioning || pageStack.length <= 1) return;
    setIsTransitioning(true);
    setPageStack(prev => prev.slice(0, -1));
    setTimeout(() => setIsTransitioning(false), 350);
  };

  const handleItemClick = (item) => {
    pushPage('detail', { item });
  };

  const handleNavTo = (page) => {
    pushPage(page);
  };

  const handleShowActionSheet = (type = 'donate') => {
    setActionSheetType(type);
    setSelectedOption(type === 'donate' ? 'item' : 'item');
    setShowActionSheet(true);
  };

  const handleActionSubmit = () => {
    setShowActionSheet(false);
    const msgs = {
      donate: {
        item: '已提交捐赠申请，志愿者会尽快联系你',
        story: '故事发布成功，感谢分享',
        volunteer: '报名成功，张阿姨会联系你',
      },
      exchange: {
        item: '置换申请已发送，等待对方回应',
        story: '故事已送达，期待回应',
        visit: '已预约站点见面时间',
      },
    };
    showToast(msgs[actionSheetType]?.[selectedOption] || '操作成功');
  };

  const currentOptions = actionSheetType === 'donate' ? donateOptions : exchangeOptions;
  const actionSheetTitle = actionSheetType === 'donate'
    ? '我要捐赠旧物'
    : '如何置换这件旧物';

  const renderPage = (page, index) => {
    const isTop = index === pageStack.length - 1;
    const isPush = page.direction === 'push' && isTop;
    const key = `${page.type}-${page.data?.item?.id || page.key || index}`;
    const showTabBar = page.type === 'tab';

    let content = null;

    switch (page.type) {
      case 'tab':
        switch (page.key) {
          case 'home':
            content = <HomePage onItemClick={handleItemClick} />;
            break;
          case 'category':
            content = <CategoryPage onItemClick={handleItemClick} />;
            break;
          case 'station':
            content = <StationPage onShowActionSheet={() => handleShowActionSheet('donate')} />;
            break;
          case 'profile':
            content = <ProfilePage onNavTo={handleNavTo} onShowActionSheet={() => handleShowActionSheet('donate')} />;
            break;
        }
        break;
      case 'detail':
        content = (
          <DetailPage
            item={page.data.item}
            onBack={popPage}
            onShowExchange={() => handleShowActionSheet('exchange')}
          />
        );
        break;
      case 'spec':
        content = <SpecPage onBack={popPage} />;
        break;
      case 'api':
        content = <ApiPage onBack={popPage} />;
        break;
    }

    return (
      <div
        key={key}
        className={`page-container ${isPush ? 'page-push-enter' : ''}`}
        style={{ zIndex: index + 1 }}
      >
        {content}
        {showTabBar && <TabBar active={activeTab} onChange={goToTab} />}
      </div>
    );
  };

  return (
    <div className="app-wrapper">
      <div className="app-label">拾光循环 · V2 微信小程序</div>
      <div className="phone-frame">
        <div className="phone-screen">
          <div className="dynamic-island"></div>
          <div className="home-indicator"></div>

          {pageStack.map((page, i) => renderPage(page, i))}

          <ActionSheet
            show={showActionSheet}
            onClose={() => setShowActionSheet(false)}
            onSubmit={handleActionSubmit}
            options={currentOptions}
            title={actionSheetTitle}
            selected={selectedOption}
            setSelected={setSelectedOption}
          />

          <Toast show={toast.show} message={toast.msg} />
        </div>
      </div>
    </div>
  );
};

// ============ CUSTOM CURSOR ============
function initCustomCursor() {
  const dot = document.getElementById('cursorDot');
  const ring = document.getElementById('cursorRing');
  if (!dot || !ring) return;

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let ringX = mouseX;
  let ringY = mouseY;
  let rafId = null;
  let paused = false;

  function animate() {
    if (paused) return;
    ringX += (mouseX - ringX) * 0.15;
    ringY += (mouseY - ringY) * 0.15;

    dot.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
    ring.style.transform = `translate(${ringX}px, ${ringY}px) translate(-50%, -50%)`;

    rafId = requestAnimationFrame(animate);
  }

  function handleMove(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
    if (!rafId && !paused) {
      rafId = requestAnimationFrame(animate);
    }
  }

  function handleClick(e) {
    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    ripple.style.animation = 'rippleExpand 0.5s ease-out forwards';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 500);
  }

  function handleMouseOver(e) {
    const target = e.target.closest(
      'button, .tabbar-item, .drift-card, .quick-action, .cat-item, .cat-tab, .filter-chip, ' +
      '.action-btn, .profile-menu-item, .fab, .bb-icon-btn, .bb-main-btn, .bb-sub-btn, ' +
      '.exchange-option, .exchange-submit, .exchange-cancel, .back-btn, .section-more, ' +
      '.api-endpoint, .comp-item, .stat-card, .gallery-dot'
    );
    if (target) {
      ring.classList.add('hover');
      dot.classList.add('hover');
    } else {
      ring.classList.remove('hover');
      dot.classList.remove('hover');
    }
  }

  function handleVisibility() {
    if (document.hidden) {
      paused = true;
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    } else {
      paused = false;
      rafId = requestAnimationFrame(animate);
    }
  }

  function cleanup() {
    if (rafId) cancelAnimationFrame(rafId);
    document.removeEventListener('mousemove', handleMove);
    document.removeEventListener('click', handleClick);
    document.removeEventListener('mouseover', handleMouseOver);
    document.removeEventListener('visibilitychange', handleVisibility);
    window.removeEventListener('beforeunload', cleanup);
  }

  dot.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
  ring.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;

  document.addEventListener('mousemove', handleMove);
  document.addEventListener('click', handleClick);
  document.addEventListener('mouseover', handleMouseOver);
  document.addEventListener('visibilitychange', handleVisibility);
  window.addEventListener('beforeunload', cleanup);

  rafId = requestAnimationFrame(animate);
}

// Init
window.addEventListener('DOMContentLoaded', () => {
  const root = document.getElementById('root');
  ReactDOM.createRoot(root).render(<App />);
  initCustomCursor();
});
</script>

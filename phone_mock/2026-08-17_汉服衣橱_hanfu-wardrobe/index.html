    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

    /* Custom cursor */
    .custom-cursor {
      position: fixed;
      width: 36px;
      height: 36px;
      border: 2px solid #fff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%);
      transition: width 0.2s cubic-bezier(0.2, 0.8, 0.2, 1),
                  height 0.2s cubic-bezier(0.2, 0.8, 0.2, 1),
                  border-color 0.2s,

      mix-blend-mode: difference;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3),
                  0 0 40px rgba(255, 255, 255, 0.1);
    }
    .custom-cursor::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background: #C24D4D;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: transform 0.15s;
    }
    .custom-cursor.hover {
      width: 56px;
      height: 56px;
      border-color: #E8D5A3;
      background: rgba(232, 213, 163, 0.15);
    }
    .custom-cursor.hover::before {

      background: #E8D5A3;
    }
    .custom-cursor.clicking {
      width: 28px;
      height: 28px;
    }
    .cursor-ripple {
      position: fixed;
      border-radius: 50%;
      border: 2px solid #C24D4D;
      pointer-events: none;
      z-index: 99998;
      transform: translate(-50%, -50%) scale(0);
      animation: cursorRipple 0.6s ease-out forwards;
    }
    @keyframes cursorRipple {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
    }

    /* App inner screen — hide scrollbars */
    .screen-scroll {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
    }
    .screen-scroll::-webkit-scrollbar { display: none; }

    /* Fade transitions for pages */
    .page-enter {
      animation: pageEnter 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes pageEnter {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Silk shimmer effect */
    .silk-shimmer {
      position: relative;
      overflow: hidden;
    }
    .silk-shimmer::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        100deg,
        transparent 0%,
        rgba(255, 255, 255, 0.15) 45%,
        rgba(255, 255, 255, 0.3) 50%,
        rgba(255, 255, 255, 0.15) 55%,
        transparent 100%
      );
      animation: silkShimmer 4s ease-in-out infinite;
    }
    @keyframes silkShimmer {
      0%, 100% { left: -100%; }
      50% { left: 140%; }
    }

    /* Scroll reveal items */

      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s cubic-bezier(0.2, 0.8, 0.2, 1),

    .reveal-item.visible {

      100% { max-height: 500px; opacity: 1; }

    /* Ink spread */

    /* Number count-up pulse */

    .stagger-2 { transition-delay: 0.1s; }
    .stagger-3 { transition-delay: 0.15s; }
    .stagger-4 { transition-delay: 0.2s; }
    .stagger-5 { transition-delay: 0.25s; }
    .stagger-6 { transition-delay: 0.3s; }

    @media (prefers-reduced-motion: reduce) {

        animation-iteration-count: 1 !important;

    }
  </style>

  // ───────────────────────────────────────────────
  // Utility: useReveal — scroll reveal
  // ───────────────────────────────────────────────
  function useReveal(selector, scrollRef) {
    useEffect(() => {
      const el = scrollRef?.current;
      if (!el) return;
      const items = el.querySelectorAll(selector);
      const check = () => {
        const rect = el.getBoundingClientRect();
        items.forEach(item => {
          const r = item.getBoundingClientRect();
          if (r.top < rect.bottom - 50) item.classList.add('visible');
        });
      };
      check();
      el.addEventListener('scroll', check);
      return () => el.removeEventListener('scroll', check);
    }, [selector, scrollRef]);
  }

    const scrollRef = useRef(null);
    const [animatedCount, setAnimatedCount] = useState(0);
    useReveal('.prof-reveal', scrollRef);

    // Number count-up effect
    useEffect(() => {
      const target = 86;
      const duration = 1500;
      const start = Date.now();
      let rafId;
      const tick = () => {
        const elapsed = Date.now() - start;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        setAnimatedCount(Math.floor(eased * target));
        if (progress < 1) rafId = requestAnimationFrame(tick);
      };
      rafId = requestAnimationFrame(tick);
      return () => cancelAnimationFrame(rafId);
    }, []);

    // Ring progress values

  // ───────────────────────────────────────────────
  // Main App
  // ───────────────────────────────────────────────
  function App() {
    const [activeTab, setActiveTab] = useState('home');
    const [showDetail, setShowDetail] = useState(false);
    const [detailItem, setDetailItem] = useState(null);
    const [showSpecs, setShowSpecs] = useState(false);
    const [showApi, setShowApi] = useState(false);

    const openDetail = (item) => {
      setDetailItem(item);
      setShowDetail(true);
    };

    const goBack = () => {
      if (showDetail) { setShowDetail(false); return; }
      if (showSpecs) { setShowSpecs(false); return; }
      if (showApi) { setShowApi(false); return; }
    };

    const currentPage = () => {
      if (showDetail) return <DetailPage item={detailItem} onBack={goBack} />;
      if (showSpecs) return <SpecsPage onBack={goBack} />;
      if (showApi) return <ApiPage onBack={goBack} />;

      switch (activeTab) {
        case 'home': return <HomePage onOpenDetail={openDetail} />;
        case 'category': return <CategoryPage onOpenDetail={openDetail} />;
        case 'wardrobe': return <WardrobePage />;
        case 'community': return <CommunityPage />;
        case 'profile': return <ProfilePage onOpenSpecs={() => setShowSpecs(true)} onOpenApi={() => setShowApi(true)} />;
        default: return <HomePage onOpenDetail={openDetail} />;
      }
    };

    const showTabBar = !showDetail && !showSpecs && !showApi;

    return (
      <div style={{
        width: 390, height: 844, borderRadius: 48, overflow: 'hidden',
        position: 'relative', background: TOKENS.colors.yuebai,
        border: '1px solid #DEE0E3',
        fontFamily: TOKENS.fonts.sans,
        '--ios-safe-top': '62px',
        '--ios-safe-bottom': '34px',
      }}>
        {/* Dynamic Island */}
        <div style={{
          position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
          width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
        }} />

        {/* Status Bar */}
        <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
          <IOSStatusBarInline dark={false} />
        </div>

        {/* Content */}
        <div style={{
          height: '100%', display: 'flex', flexDirection: 'column',
          isolation: 'isolate',
        }}>
          <div style={{ flex: 1, overflow: 'hidden' }}>
            {currentPage()}
          </div>
        </div>

        {/* Tab Bar */}
        {showTabBar && <TabBar active={activeTab} onChange={setActiveTab} />}

        {/* Home Indicator */}
        <div style={{
          position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
          height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
          paddingBottom: 8, pointerEvents: 'none',
        }}>
          <div style={{
            width: 139, height: 5, borderRadius: 100,
            background: 'rgba(0,0,0,0.25)',
          }} />
        </div>
      </div>
    );
  }

      <div className="app-stage">
        <div>
          <div className="app-title">云 裳 阁</div>
          <div className="app-subtitle">HANFU WARDROBE · 汉服衣橱</div>
        </div>
        <App />
        <div style={{
          fontSize: 11, color: '#8B7355', letterSpacing: 1,
          textAlign: 'center', opacity: 0.7,
        }}>
          形态：原生 App · 版本 v2.0 · 2026.08
        </div>
      </div>
    );
  }

  // ───────────────────────────────────────────────
  // Custom cursor
  // ───────────────────────────────────────────────
  function initCursor() {
    const cursor = document.getElementById('customCursor');
    if (!cursor) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      cursor.style.display = 'none';
      return;
    }

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let cursorX = mouseX;
    let cursorY = mouseY;
    let rafId;

    // Initialize at center
    cursor.style.left = mouseX + 'px';
    cursor.style.top = mouseY + 'px';

    const animate = () => {
      cursorX += (mouseX - cursorX) * 0.18;
      cursorY += (mouseY - cursorY) * 0.18;
      cursor.style.left = cursorX + 'px';
      cursor.style.top = cursorY + 'px';
      rafId = requestAnimationFrame(animate);
    };

    const handleMove = (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    };

    const handleOver = (e) => {
      const target = e.target.closest('button, .pressable, a, input, [role="button"]');
      if (target) cursor.classList.add('hover');
      else cursor.classList.remove('hover');
    };

    const handleDown = () => cursor.classList.add('clicking');
    const handleUp = () => cursor.classList.remove('clicking');

    const handleClick = (e) => {
      const ripple = document.createElement('div');
      ripple.className = 'cursor-ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    };

    const handleVisibility = () => {
      if (document.hidden) {
        cancelAnimationFrame(rafId);
      } else {
        rafId = requestAnimationFrame(animate);
      }
    };

    window.addEventListener('mousemove', handleMove);
    document.addEventListener('mouseover', handleOver);
    window.addEventListener('mousedown', handleDown);
    window.addEventListener('mouseup', handleUp);
    window.addEventListener('click', handleClick);
    document.addEventListener('visibilitychange', handleVisibility);

    rafId = requestAnimationFrame(animate);

    // Cleanup on unload
    window.addEventListener('beforeunload', () => {
      cancelAnimationFrame(rafId);
      window.removeEventListener('mousemove', handleMove);
      document.removeEventListener('mouseover', handleOver);
      window.removeEventListener('mousedown', handleDown);
      window.removeEventListener('mouseup', handleUp);
      window.removeEventListener('click', handleClick);
      document.removeEventListener('visibilitychange', handleVisibility);
    });
  }

  // Render
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<Stage />);

  // Init cursor after render
  setTimeout(initCursor, 100);
  </script>
</body>

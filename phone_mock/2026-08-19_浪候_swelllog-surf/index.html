<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>浪候 SWELLLOG · 冲浪 App</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" />
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100vh;
      background: #1a1a1a;
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }
    #root {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Custom cursor */
    .custom-cursor {
      position: fixed;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%);
      transition: width 0.2s ease, height 0.2s ease, background 0.2s ease;
      mix-blend-mode: difference;
      background: #ffffff;
      will-change: transform;
    }
    .custom-cursor.hover {
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.3);
      border: 2px solid #fff;
    }
    .custom-cursor-ring {
      position: fixed;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 99998;
      transform: translate(-50%, -50%);
      border: 1.5px solid rgba(255,255,255,0.4);
      transition: transform 0.15s ease-out, opacity 0.2s ease;
      will-change: transform;
    }
    .custom-cursor-ring.hover {
      transform: translate(-50%, -50%) scale(1.3);
      opacity: 0.6;
    }

    @media (prefers-reduced-motion: reduce) {
      .custom-cursor, .custom-cursor-ring {
        display: none;
      }
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Page stage */
    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
      padding: 40px;
      min-height: 100vh;
      background: radial-gradient(ellipse at center, #2a2a2a 0%, #0f0f0f 100%);
    }
    .stage-label {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.35);
      font-size: 12px;
      letter-spacing: 2px;
      font-family: 'JetBrains Mono', monospace;
      z-index: 10;
    }
    .stage-hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.25);
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      z-index: 10;
    }

    /* App container fills the device frame */
    .app-root {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Custom cursor elements -->
  <div class="custom-cursor" id="customCursor"></div>
  <div class="custom-cursor-ring" id="customCursorRing"></div>

  <script type="text/babel">
    /*EDITMODE-BEGIN*/
    const TWEAK_DEFAULTS = {
      "palette": "deepsea",
      "density": "regular"
    };
    /*EDITMODE-END*/


  </script>

  <script type="text/babel" src="components/ios-frame.jsx"></script>
  <script type="text/babel" src="components/tweaks-panel.jsx"></script>
  <script type="text/babel" src="components/data.jsx"></script>
  <script type="text/babel" src="components/tidal.jsx"></script>
  <script type="text/babel" src="components/pages.jsx"></script>
  <script type="text/babel" src="components/app.jsx"></script>
  <script type="text/babel" src="components/main.jsx"></script>
</body>
</html>

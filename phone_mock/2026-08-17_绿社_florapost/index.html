    /* ── Custom Cursor ── */
    .cursor-outer {
      position: fixed; top: 0; left: 0; width: 36px; height: 36px;
      border-radius: 50%; pointer-events: none; z-index: 99999;
      border: 2.5px solid #fff; transform: translate(-50%, -50%);
      box-shadow: 0 0 12px rgba(232,115,140,0.6), 0 0 24px rgba(92,138,77,0.35), inset 0 0 8px rgba(255,255,255,0.3);
      transition: width 0.2s cubic-bezier(.25,.8,.25,1), height 0.2s cubic-bezier(.25,.8,.25,1),
                  border-color 0.2s, background 0.2s, opacity 0.2s;
      will-change: transform, width, height;
    }
    .cursor-inner {
      position: fixed; top: 0; left: 0; width: 6px; height: 6px;
      border-radius: 50%; pointer-events: none; z-index: 100000;
      background: #E8738C; transform: translate(-50%, -50%);
      box-shadow: 0 0 8px rgba(232,115,140,0.9), 0 0 16px rgba(232,115,140,0.5);
      transition: width 0.15s, height 0.15s, background 0.15s;
      will-change: transform;
    }
    .cursor-hover .cursor-outer { width: 52px; height: 52px; border-color: #5C8A4D; background: rgba(92,138,77,0.12); }
    .cursor-hover .cursor-inner { width: 4px; height: 4px; background: #5C8A4D; }
    .cursor-click .cursor-outer { width: 28px; height: 28px; border-color: #E8738C; }
    .cursor-click .cursor-inner { width: 8px; height: 8px; background: #fff; }
    .cursor-ripple {
      position: fixed; width: 10px; height: 10px; border-radius: 50%;
      border: 2px solid #E8738C; pointer-events: none; z-index: 99998;
      transform: translate(-50%, -50%) scale(1); opacity: 0.8;
      animation: rippleAnim 0.6s cubic-bezier(.2,.8,.2,1) forwards;
    }
    @keyframes rippleAnim {
      0% { width: 10px; height: 10px; opacity: 0.9; border-color: #E8738C; }
      100% { width: 80px; height: 80px; opacity: 0; border-color: #5C8A4D; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cursor-outer, .cursor-inner { transition: none; }
      .cursor-ripple { display: none; }
    }

    /* ── Stage ── */
    .stage-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 18px;
      padding: 20px;
    }
    .stage-title {
      font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px;
      color: #3B2E2A; letter-spacing: -0.5px;
    }
    .stage-sub { font-size: 13px; color: #7A6A5C; margin-top: -12px; letter-spacing: 0.3px; }

    /* Page switcher pills */
    .page-switcher {
      display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
      max-width: 440px; padding: 6px;
      background: rgba(255,255,255,0.5); backdrop-filter: blur(10px);
      border-radius: 14px; border: 1px solid rgba(59,46,42,0.08);
    }
    .page-pill {
      padding: 6px 12px; border-radius: 10px; font-size: 12px;
      color: #3B2E2A; background: transparent; border: none; cursor: pointer;
      font-family: 'DM Sans', sans-serif; font-weight: 500; white-space: nowrap;
      transition: background 0.2s, color 0.2s;
    }
    .page-pill:hover { background: rgba(92,138,77,0.12); }
    .page-pill.active { background: #5C8A4D; color: #fff; }

    /* Screen scroll container */
    .screen-scroll {
      height: 100%; width: 100%; overflow-y: auto; overflow-x: hidden;
      scroll-behavior: smooth;
    }
    .screen-scroll::-webkit-scrollbar { width: 0; }

    /* Tab bar */
    .tab-bar {
      position: absolute; bottom: 0; left: 0; right: 0; height: 83px;
      background: rgba(250,246,239,0.85); backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-top: 0.5px solid rgba(59,46,42,0.12);
      display: flex; align-items: flex-start; justify-content: space-around;
      padding-top: 8px; z-index: 30;
    }
    .tab-item {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      gap: 3px; padding: 4px 0; cursor: pointer;
      transition: transform 0.2s cubic-bezier(.2,.8,.2,1);
    }
    .tab-item:hover { transform: translateY(-1px); }
    .tab-item .tab-icon {
      width: 26px; height: 26px; opacity: 0.45; transition: opacity 0.2s;
    }
    .tab-item.active .tab-icon { opacity: 1; }
    .tab-item.active .tab-label { color: #5C8A4D; font-weight: 600; }
    .tab-label { font-size: 10px; color: #9A8C7E; transition: color 0.2s; }
    .tab-indicator {
      position: absolute; top: 2px; width: 22px; height: 3px;
      background: #5C8A4D; border-radius: 2px;
      transition: left 0.3s cubic-bezier(.25,.8,.25,1);
    }

    /* ── SHARED / UTILITY ── */
    .safe-top { padding-top: 62px; }
    .safe-bottom { padding-bottom: 34px; }
    .scroll-content { padding-bottom: 100px; }

    /* Shared entrance */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes growWidth {
      from { width: 0%; }
      to { width: 100%; }
    }
    @keyframes leafSpin {
      from { opacity: 0; transform: rotate(-30deg) scale(0.7); }
      to { opacity: 1; transform: rotate(0deg) scale(1); }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .animate-fadeup { animation: fadeUp 0.6s cubic-bezier(.2,.8,.2,1) both; }
    .delay-1 { animation-delay: 0.08s; }
    .delay-2 { animation-delay: 0.16s; }
    .delay-3 { animation-delay: 0.24s; }
    .delay-4 { animation-delay: 0.32s; }
    .delay-5 { animation-delay: 0.4s; }
    .delay-6 { animation-delay: 0.48s; }

    @media (prefers-reduced-motion: reduce) {
      .animate-fadeup { animation: none; opacity: 1; transform: none; }
    }

    /* Page transition */
    .page-container {
      position: relative; height: 100%; width: 100%;
      overflow: hidden;
    }
    .page-enter {
      animation: pageSlideIn 0.35s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes pageSlideIn {
      from { opacity: 0; transform: translateX(18px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .page-enter { animation: none; }
    }

    /* Pull to refresh indicator */
    .ptr-indicator {
      position: absolute; top: 62px; left: 50%; transform: translateX(-50%) translateY(-40px);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 5;
    }
    .ptr-indicator.visible { opacity: 1; }
    .ptr-leaf { transition: transform 0.1s; }

    /* FAB */
    .fab {
      position: absolute; right: 16px; bottom: 100px; width: 56px; height: 56px;
      border-radius: 50%; background: linear-gradient(135deg, #E8738C 0%, #D4647C 100%);
      box-shadow: 0 8px 24px rgba(232,115,140,0.4), 0 2px 6px rgba(59,46,42,0.15);
      display: flex; align-items: center; justify-content: center;
      z-index: 25; cursor: pointer;
      transition: transform 0.25s cubic-bezier(.2,.8,.2,1), box-shadow 0.25s;
      animation: fabBounce 2.4s ease-in-out infinite;
    }
    .fab:hover { transform: scale(1.08); box-shadow: 0 12px 32px rgba(232,115,140,0.5); }
    .fab:active { transform: scale(0.92); }
    @keyframes fabBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .fab { animation: none; }
    }

    /* Modal / bottom sheet */
    .modal-overlay {
      position: absolute; inset: 0; background: rgba(59,46,42,0.4);
      z-index: 40; opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .bottom-sheet {
      position: absolute; bottom: 0; left: 0; right: 0; background: #FAF6EF;
      border-radius: 24px 24px 0 0; z-index: 45; transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(.2,.8,.2,1);
      box-shadow: 0 -4px 30px rgba(59,46,42,0.15);
      max-height: 75%; overflow-y: auto;
    }
    .bottom-sheet.open { transform: translateY(0); }
    .sheet-grabber {
      width: 36px; height: 5px; background: rgba(59,46,42,0.2);
      border-radius: 3px; margin: 10px auto 4px;
    }
  </style>

  // ════════════════════════════════════════════════════════
  // PULL-TO-REFRESH HOOK (rAF, visibility-aware)
  // ════════════════════════════════════════════════════════
  function usePullToRefresh(scrollRef, onRefresh) {
    const [pullDist, setPullDist] = useState(0);
    const [refreshing, setRefreshing] = useState(false);
    const startY = useRef(0);
    const pulling = useRef(false);
    const rafId = useRef(null);
    const visible = useRef(true);

    const setDist = useCallback((d) => {
      if (!visible.current) return;
      if (rafId.current) cancelAnimationFrame(rafId.current);
      rafId.current = requestAnimationFrame(() => {
        setPullDist(d);
        rafId.current = null;
      });
    }, []);

    useEffect(() => {
      const onVis = () => { visible.current = !document.hidden; };
      document.addEventListener('visibilitychange', onVis);
      return () => {
        document.removeEventListener('visibilitychange', onVis);
        if (rafId.current) cancelAnimationFrame(rafId.current);
      };
    }, []);

    const onTouchStart = useCallback((e) => {
      if (scrollRef.current && scrollRef.current.scrollTop <= 0) {
        pulling.current = true;
        startY.current = e.touches[0].clientY;
      }
    }, [scrollRef]);

    const onTouchMove = useCallback((e) => {
      if (!pulling.current) return;
      const dy = e.touches[0].clientY - startY.current;
      if (dy > 0 && scrollRef.current && scrollRef.current.scrollTop <= 0) {
        e.preventDefault && e.preventDefault();
        const damped = Math.min(dy * 0.5, 80);
        setDist(damped);
      }
    }, [scrollRef, setDist]);

    const onTouchEnd = useCallback(() => {
      if (!pulling.current) return;
      pulling.current = false;
      if (pullDist > 50 && !refreshing) {
        setRefreshing(true);
        setDist(50);
        onRefresh && onRefresh(() => {
          setRefreshing(false);
          setDist(0);
        });
      } else {
        setDist(0);
      }
    }, [pullDist, refreshing, onRefresh, setDist]);

    return { pullDist, refreshing, onTouchStart, onTouchMove, onTouchEnd };
  }

  function GardenPage({ onTabChange, onGoDetail }) {
    const [progress, setProgress] = useState(0);
    const rafId = useRef(null);
    const visible = useRef(true);
    const startTime = useRef(null);

    useEffect(() => {
      const onVis = () => { visible.current = !document.hidden; };
      document.addEventListener('visibilitychange', onVis);

      const target = 72;
      const duration = 1200;

      const animate = (ts) => {
        if (!visible.current) {
          rafId.current = requestAnimationFrame(animate);
          return;
        }
        if (!startTime.current) startTime.current = ts;
        const elapsed = ts - startTime.current;
        const t = Math.min(elapsed / duration, 1);
        // easeOutCubic
        const eased = 1 - Math.pow(1 - t, 3);
        setProgress(target * eased);
        if (t < 1) rafId.current = requestAnimationFrame(animate);
      };
      rafId.current = requestAnimationFrame(animate);

      return () => {
        document.removeEventListener('visibilitychange', onVis);
        if (rafId.current) cancelAnimationFrame(rafId.current);
      };
    }, []);

    const circumference = 2 * Math.PI * 70;
    const offset = circumference - (progress / 100) * circumference;

    const myPlants = [
      { img: IMG.pilea, name: '小圆', type: '镜面草', health: 95, days: 128, waterDue: '今天' },

                              <span style={{ color: '#7A6A5C', flex: 1 }}>{p.desc}</span>
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* Response */}
                      <div>
                        <div style={{
                          fontSize: 10, color: '#8B7A6A', fontWeight: 600,
                          letterSpacing: 0.5, textTransform: 'uppercase',
                          marginBottom: 6,
                        }}>响应示例</div>
                        <pre style={{
                          background: '#2B211D', color: '#E8DED2',
                          padding: '10px 12px', borderRadius: 8,
                          fontSize: 10.5, lineHeight: 1.6,
                          fontFamily: 'monospace', overflowX: 'auto',
                          margin: 0, whiteSpace: 'pre-wrap',
                        }}>{ep.response}</pre>
                      </div>
                    </div>
                  </div>
                ))}
              </div>

              {/* Status codes */}
              <div className="animate-fadeup delay-4" style={{ marginTop: 18 }}>
                <div style={{
                  fontSize: 12, fontWeight: 600, color: '#3B2E2A',
                  marginBottom: 10,
                }}>状态码</div>
                <div style={{
                  background: '#fff', borderRadius: 12,
                  boxShadow: '0 2px 8px rgba(59,46,42,0.04)',
                  overflow: 'hidden',
                }}>
                  {[
                    { code: 0, label: '成功', color: '#5C8A4D' },
                    { code: 40001, label: '参数错误', color: '#D4876A' },
                    { code: 40101, label: 'Token 失效', color: '#E8738C' },
                    { code: 40301, label: '无权限', color: '#B94A4A' },
                    { code: 50001, label: '服务器错误', color: '#7A6A5C' },
                  ].map((s, i) => (
                    <div key={i} style={{
                      display: 'flex', alignItems: 'center', gap: 10,
                      padding: '8px 14px',
                      borderBottom: i < 4 ? '1px solid rgba(59,46,42,0.06)' : 'none',
                      fontSize: 12,
                    }}>
                      <span style={{
                        fontFamily: 'monospace', fontWeight: 600,
                        color: s.color, width: 60,
                      }}>{s.code}</span>
                      <span style={{ color: '#3B2E2A' }}>{s.label}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>

        <TabBar activeTab="profile" onTabChange={onTabChange} />
      </div>
    );
  }

  // ════════════════════════════════════════════════════════
  // MAIN APP
  // ════════════════════════════════════════════════════════
  function App() {
    const [currentPage, setCurrentPage] = useState('home');
    const [detailOpen, setDetailOpen] = useState(false);
    const [animKey, setAnimKey] = useState(0);

    const handleTabChange = (tab) => {
      if (tab === 'detail') {
        setDetailOpen(true);
        return;
      }
      setDetailOpen(false);
      setCurrentPage(tab);
      setAnimKey(k => k + 1);
    };

    const handleGoDetail = () => {
      setDetailOpen(true);
      setAnimKey(k => k + 1);
    };

    const handleBack = () => {
      setDetailOpen(false);
    };

    const renderPage = () => {
      if (detailOpen) {
        return <DetailPage key={`detail-${animKey}`} onBack={handleBack} />;
      }
      switch (currentPage) {
        case 'home':
          return <HomePage key={`home-${animKey}`} onGoDetail={handleGoDetail} onTabChange={handleTabChange} />;
        case 'community':
          return <CommunityPage key={`community-${animKey}`} onTabChange={handleTabChange} />;
        case 'post':
          return <PostPage key={`post-${animKey}`} onTabChange={handleTabChange} />;
        case 'garden':
          return <GardenPage key={`garden-${animKey}`} onTabChange={handleTabChange} onGoDetail={handleGoDetail} />;
        case 'profile':
          return <ProfilePage key={`profile-${animKey}`} onTabChange={handleTabChange} />;
        case 'design':
          return <DesignSpecPage key={`design-${animKey}`} onTabChange={handleTabChange} />;
        case 'api':
          return <ApiDocPage key={`api-${animKey}`} onTabChange={handleTabChange} />;
        default:
          return <HomePage key={`home-${animKey}`} onGoDetail={handleGoDetail} onTabChange={handleTabChange} />;
      }
    };

    const pageOptions = [
      { key: 'home', label: '首页' },
      { key: 'detail', label: '详情' },
      { key: 'community', label: '花友' },
      { key: 'post', label: '发布' },
      { key: 'garden', label: '花园' },
      { key: 'profile', label: '我的' },
      { key: 'design', label: '设计规范' },
      { key: 'api', label: '接口文档' },
    ];

    const handlePillClick = (key) => {
      if (key === 'detail') {
        setDetailOpen(true);
      } else {
        setDetailOpen(false);
        setCurrentPage(key);
      }
      setAnimKey(k => k + 1);
    };

    const activeKey = detailOpen ? 'detail' : currentPage;

    return (
      <div className="stage-wrap">
        <div style={{ textAlign: 'center' }}>
          <div className="stage-title">绿社 · 园艺植物交换社群</div>
          <div className="stage-sub">原生 App V2 · 春日花园色系 · 8 页交互原型</div>
        </div>

        <div className="page-switcher">
          {pageOptions.map(opt => (
            <button
              key={opt.key}
              className={`page-pill ${activeKey === opt.key ? 'active' : ''}`}
              onClick={() => handlePillClick(opt.key)}
              onMouseEnter={() => document.body.classList.add('cursor-hover')}
              onMouseLeave={() => document.body.classList.remove('cursor-hover')}
            >
              {opt.label}
            </button>
          ))}
        </div>

        <IOSDevice width={390} height={844}>
          {renderPage()}
        </IOSDevice>
      </div>
    );
  }

  // ════════════════════════════════════════════════════════
  // CUSTOM CURSOR
  // ════════════════════════════════════════════════════════
  (function initCursor() {
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const outer = document.getElementById('cursorOuter');
    const inner = document.getElementById('cursorInner');
    if (!outer || !inner) return;

    // Center cursor initially
    outer.style.left = '50%';
    outer.style.top = '50%';
    inner.style.left = '50%';
    inner.style.top = '50%';

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let outerX = mouseX;
    let outerY = mouseY;
    let rafId = null;
    let visible = true;

    function tick() {
      if (!visible) {
        rafId = requestAnimationFrame(tick);
        return;
      }
      // outer follows with smooth lerp
      outerX += (mouseX - outerX) * 0.15;
      outerY += (mouseY - outerY) * 0.15;
      outer.style.transform = `translate(${outerX}px, ${outerY}px) translate(-50%, -50%)`;
      // inner follows directly
      inner.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
      rafId = requestAnimationFrame(tick);
    }

    if (!prefersReduced) {
      rafId = requestAnimationFrame(tick);
    } else {
      // reduced motion: snap cursor
      const snap = () => {
        outer.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
        inner.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
      };
      window.addEventListener('mousemove', snap);
    }

    function onMove(e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
      if (prefersReduced) return; // already handled
    }
    window.addEventListener('mousemove', onMove);

    // Hover detection
    function onOver(e) {
      const target = e.target;
      if (target.closest && (
        target.closest('button') ||
        target.closest('.tab-item') ||
        target.closest('.page-pill') ||
        target.closest('.fab') ||
        target.closest('[style*="cursor: pointer"]') ||
        target.tagName === 'A'
      )) {
        document.body.classList.add('cursor-hover');
      }
    }
    function onOut(e) {
      const target = e.target;
      if (target.closest && (
        target.closest('button') ||
        target.closest('.tab-item') ||
        target.closest('.page-pill') ||
        target.closest('.fab') ||
        target.closest('[style*="cursor: pointer"]') ||
        target.tagName === 'A'
      )) {
        document.body.classList.remove('cursor-hover');
      }
    }
    document.addEventListener('mouseover', onOver);
    document.addEventListener('mouseout', onOut);

    // Click ripple
    function onClick(e) {
      document.body.classList.add('cursor-click');
      setTimeout(() => document.body.classList.remove('cursor-click'), 200);

      if (prefersReduced) return;
      const ripple = document.createElement('div');
      ripple.className = 'cursor-ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    }
    document.addEventListener('mousedown', onClick);

    // Visibility
    function onVis() {
      visible = !document.hidden;
    }
    document.addEventListener('visibilitychange', onVis);

    // Cleanup not needed for prototype
  })();

  // ════════════════════════════════════════════════════════
  // RENDER
  // ════════════════════════════════════════════════════════
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);

  // Upgrade announcement
  function announceUpgrade() {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  }
  announceUpgrade();
  if (document.readyState !== 'complete') {
    window.addEventListener('load', announceUpgrade, { once: true });
  }
  </script>
</body>

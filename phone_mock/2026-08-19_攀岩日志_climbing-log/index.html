<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="creative-medium" content="interactive-prototype" />
<title>岩痕 · 攀岩路线日志</title>
<style>
/* ============================================================
   岩痕 · 攀岩路线日志 — 原生App V2
   形态：原生App
   单文件 vanilla HTML/CSS/JS，iOS 设备框架内嵌完整 user flow
   ============================================================ */

/* ---------- Reset & base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background:
    radial-gradient(1200px 800px at 20% 0%, #e8e2d6 0%, #d9d2c4 35%, #c7bfae 100%);
  font-family: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  color: #1c1a17;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  gap: 40px;
  flex-wrap: wrap;
}

/* ---------- iOS Device Frame ---------- */
.phone {
  --safe-top: 59px;
  --safe-bottom: 34px;
  width: 390px;
  height: 844px;
  border-radius: 52px;
  background: #0a0a0a;
  padding: 12px;
  position: relative;
  box-shadow:
    0 40px 80px rgba(30, 25, 15, 0.35),
    0 10px 30px rgba(30, 25, 15, 0.25),
    inset 0 0 0 1px rgba(255,255,255,0.06);
  flex-shrink: 0;
}
.phone::before {
  content: "";
  position: absolute;
  inset: 14px;
  border-radius: 42px;
  box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.08);
  pointer-events: none;
  z-index: 100;
}
.screen {
  width: 100%;
  height: 100%;
  border-radius: 40px;
  position: relative;
  overflow: hidden;
  background: #f2efe7;
}

/* Dynamic island */
.dynamic-island {
  position: absolute;
  top: 11px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 35px;
  background: #000;
  border-radius: 20px;
  z-index: 200;
}

/* Status bar */
.status-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 28px 0;
  z-index: 150;
  font-size: 15px;
  font-weight: 600;
  color: #1c1a17;
  pointer-events: none;
}
.status-bar.dark { color: #fff; }
.status-icons { display: flex; gap: 6px; align-items: center; }
.status-icons svg { display: block; }

/* Home indicator */
.home-indicator {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 134px;
  height: 5px;
  border-radius: 100px;
  background: rgba(28,26,23,0.35);
  z-index: 200;
  pointer-events: none;
}
.screen.theme-dark .home-indicator { background: rgba(255,255,255,0.5); }

/* ---------- App Content ---------- */
.app {
  position: absolute;
  inset: 0;
  overflow: hidden;
}
.page {
  position: absolute;
  inset: 0;
  background: #f2efe7;
  overflow: hidden;
  will-change: transform, opacity;
}
.page.transitioning {
  transition: transform 360ms cubic-bezier(.22,.61,.36,1), opacity 240ms ease;
}
.page.enter-right { transform: translateX(100%); }
.page.enter-left { transform: translateX(-30%); opacity: 0.3; }
.page.leave-left { transform: translateX(-30%); opacity: 0.3; }
.page.leave-right { transform: translateX(100%); }

/* page content */
.page-content {
  position: absolute;
  inset: 0;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}
.page-content::-webkit-scrollbar { width: 0; display: none; }

/* ---------- Theme: 岩 / Chalk & Rock ---------- */
:root {
  --c-bg: #f2efe7;
  --c-bg-soft: #ebe6da;
  --c-surface: #ffffff;
  --c-ink: #1c1a17;
  --c-ink-2: #4a463f;
  --c-ink-3: #8a8478;
  --c-line: rgba(28,26,23,0.1);
  --c-line-soft: rgba(28,26,23,0.06);
  --c-chalk: #f7f5ef;
  --c-rock: #6b6052;
  --c-moss: #6d7f5c;
  --c-rust: #c85a3a;
  --c-sun: #e8b23a;
  --c-sky: #8ea7b8;
  --c-rust-soft: rgba(200, 90, 58, 0.12);
  --c-moss-soft: rgba(109, 127, 92, 0.14);
  --c-sun-soft: rgba(232, 178, 58, 0.18);
  --shadow-sm: 0 1px 2px rgba(28,26,23,0.06), 0 2px 6px rgba(28,26,23,0.04);
  --shadow-md: 0 4px 14px rgba(28,26,23,0.08), 0 2px 4px rgba(28,26,23,0.04);
  --shadow-lg: 0 12px 32px rgba(28,26,23,0.14), 0 4px 10px rgba(28,26,23,0.08);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 28px;
}

/* ---------- Nav header ---------- */
.nav-header {
  display: flex;
  align-items: center;
  height: 44px;
  padding: 0 10px;
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(242, 239, 231, 0.82);
  backdrop-filter: blur(14px) saturate(180%);
  -webkit-backdrop-filter: blur(14px) saturate(180%);
  border-bottom: 0.5px solid var(--c-line-soft);
}
.nav-btn {
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--c-rust);
  font-size: 17px;
  font-weight: 500;
  padding: 0;
  transition: transform 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.nav-btn:active { transform: scale(0.92); }
.nav-title {
  flex: 1;
  text-align: center;
  font-size: 17px;
  font-weight: 600;
  color: var(--c-ink);
  letter-spacing: -0.2px;
}
.nav-spacer { width: 44px; }

/* ---------- Large title ---------- */
.large-title {
  padding: 8px 20px 16px;
}
.large-title h1 {
  font-size: 34px;
  font-weight: 700;
  color: var(--c-ink);
  letter-spacing: -0.7px;
  margin: 0;
  line-height: 1.15;
}
.large-title .sub {
  margin-top: 6px;
  font-size: 15px;
  color: var(--c-ink-3);
  letter-spacing: -0.1px;
}

/* ---------- Tab bar ---------- */
.tab-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: calc(49px + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: rgba(247, 245, 239, 0.88);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-top: 0.5px solid var(--c-line-soft);
  display: flex;
  z-index: 50;
}
.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--c-ink-3);
  font-size: 10px;
  font-weight: 500;
  padding: 6px 0 0;
  transition: color 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
.tab-item.active { color: var(--c-rust); }
.tab-item svg { transition: transform 0.25s cubic-bezier(.34,1.56,.64,1); }
.tab-item.active svg { transform: scale(1.12); }
.tab-item:active svg { transform: scale(0.88); }

/* ---------- Today page ---------- */
.hero-card {
  margin: 0 16px 18px;
  padding: 22px 20px;
  border-radius: var(--radius-lg);
  background:
    linear-gradient(145deg, #d9c9a8 0%, #c8b48d 55%, #b59c6c 100%);
  position: relative;
  overflow: hidden;
  color: #2d2518;
  box-shadow: var(--shadow-md);
}
.hero-card::before {
  content: "";
  position: absolute;
  top: -40%;
  right: -15%;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, transparent 70%);
}
.hero-card::after {
  content: "";
  position: absolute;
  bottom: -30%;
  left: -10%;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,0,0,0.06) 0%, transparent 70%);
}
.hero-label {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  opacity: 0.7;
  margin-bottom: 6px;
}
.hero-headline {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.5px;
  line-height: 1.2;
  margin-bottom: 14px;
  position: relative;
  z-index: 2;
}
.hero-cta {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 18px;
  background: #2d2518;
  color: #f3e9d0;
  border-radius: 100px;
  font-size: 14px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  position: relative;
  z-index: 2;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  -webkit-tap-highlight-color: transparent;
  box-shadow: 0 4px 12px rgba(45,37,24,0.3);
}
.hero-cta:active { transform: scale(0.94); }
.hero-stats {
  display: flex;
  gap: 18px;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid rgba(45,37,24,0.15);
  position: relative;
  z-index: 2;
}
.hero-stat-num { font-size: 22px; font-weight: 700; }
.hero-stat-label { font-size: 11px; opacity: 0.7; margin-top: 2px; }

/* Section title */
.section-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 4px 20px 10px;
}
.section-title h2 {
  font-size: 20px;
  font-weight: 700;
  color: var(--c-ink);
  margin: 0;
  letter-spacing: -0.4px;
}
.section-title .more {
  font-size: 14px;
  color: var(--c-rust);
  font-weight: 500;
}

/* Crag cards */
.crag-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 0 16px 24px;
}
.crag-card {
  border-radius: var(--radius-md);
  background: var(--c-surface);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  position: relative;
  transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
  -webkit-tap-highlight-color: transparent;
}
.crag-card:active { transform: scale(0.96); }
.crag-card .img {
  height: 100px;
  background-size: cover;
  background-position: center;
  position: relative;
}
.crag-card .img::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.3) 100%);
}
.crag-card .badge {
  position: absolute;
  top: 8px;
  left: 8px;
  padding: 3px 8px;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-radius: 100px;
  font-size: 11px;
  font-weight: 600;
  color: var(--c-ink);
  z-index: 2;
}
.crag-card .info { padding: 10px 12px 12px; }
.crag-card .name {
  font-size: 15px;
  font-weight: 600;
  color: var(--c-ink);
  margin-bottom: 3px;
}
.crag-card .meta {
  font-size: 12px;
  color: var(--c-ink-3);
  display: flex;
  align-items: center;
  gap: 4px;
}

/* recent log strip */
.log-strip {
  margin: 0 16px 24px;
  padding: 14px 16px;
  background: var(--c-surface);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
.log-strip:active { transform: scale(0.98); }
.log-strip .chalk-mark {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--c-rust-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.log-strip .txt { flex: 1; min-width: 0; }
.log-strip .route-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--c-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.log-strip .route-meta {
  font-size: 12px;
  color: var(--c-ink-3);
  margin-top: 2px;
}
.log-strip .chevron { color: var(--c-ink-3); flex-shrink: 0; }

/* ---------- Crag detail page ---------- */
.crag-hero {
  position: relative;
  height: 220px;
  background-size: cover;
  background-position: center;
}
.crag-hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%);
}
.crag-hero-title {
  position: absolute;
  left: 20px;
  bottom: 18px;
  right: 20px;
  color: #fff;
  z-index: 2;
}
.crag-hero-title h1 {
  font-size: 28px;
  font-weight: 700;
  margin: 0 0 4px;
  letter-spacing: -0.5px;
}
.crag-hero-title .sub {
  font-size: 13px;
  opacity: 0.85;
}

.route-list {
  padding: 16px 16px 30px;
}
.route-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: var(--c-surface);
  border-radius: var(--radius-md);
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
.route-item:active {
  transform: scale(0.97);
  box-shadow: var(--shadow-sm);
}
.route-grade {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 700;
  flex-shrink: 0;
  letter-spacing: -0.3px;
}
.grade-5 { background: var(--c-moss-soft); color: #4e5e41; }
.grade-6 { background: var(--c-sun-soft); color: #8a6a1a; }
.grade-7 { background: var(--c-rust-soft); color: #a0462a; }
.grade-8 { background: #f0dce2; color: #b34567; }

.route-body { flex: 1; min-width: 0; }
.route-name {
  font-size: 16px;
  font-weight: 600;
  color: var(--c-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.route-detail {
  font-size: 12px;
  color: var(--c-ink-3);
  margin-top: 3px;
}
.route-status {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.route-status.done {
  background: var(--c-moss-soft);
  color: #4e5e41;
}
.route-status.project {
  background: var(--c-sun-soft);
  color: #8a6a1a;
}
.route-status.todo {
  border: 1.5px dashed var(--c-ink-3);
  color: var(--c-ink-3);
}

/* filter pills */
.filter-row {
  display: flex;
  gap: 8px;
  padding: 12px 16px 4px;
  overflow-x: auto;
  scrollbar-width: none;
}
.filter-row::-webkit-scrollbar { display: none; }
.filter-pill {
  padding: 7px 14px;
  background: var(--c-surface);
  border-radius: 100px;
  font-size: 13px;
  font-weight: 500;
  color: var(--c-ink-2);
  white-space: nowrap;
  cursor: pointer;
  border: 1px solid var(--c-line-soft);
  transition: all 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
.filter-pill.active {
  background: var(--c-ink);
  color: #fff;
  border-color: var(--c-ink);
}
.filter-pill:active { transform: scale(0.95); }

/* ---------- Route detail + climb record ---------- */
.route-hero {
  padding: 16px 20px 20px;
  background:
    linear-gradient(160deg, var(--c-chalk) 0%, #ebe4d4 100%);
  border-bottom: 1px solid var(--c-line-soft);
}
.route-hero .name {
  font-size: 26px;
  font-weight: 700;
  color: var(--c-ink);
  letter-spacing: -0.5px;
  margin-bottom: 8px;
}
.route-hero .meta-row {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}
.route-hero .chip {
  font-size: 12px;
  font-weight: 500;
  color: var(--c-ink-2);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.info-group {
  margin: 16px;
  background: var(--c-surface);
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.info-row {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  border-bottom: 0.5px solid var(--c-line-soft);
  gap: 12px;
}
.info-row:last-child { border-bottom: none; }
.info-row .label {
  font-size: 14px;
  color: var(--c-ink-3);
  flex-shrink: 0;
  width: 80px;
}
.info-row .value {
  font-size: 15px;
  color: var(--c-ink);
  font-weight: 500;
  flex: 1;
}
.info-row .icon-box {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* Climb record sheet */
.record-sheet {
  padding: 0 16px 20px;
}
.record-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--c-ink-3);
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin: 18px 4px 10px;
}

.attempt-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.attempt-opt {
  padding: 14px 12px;
  background: var(--c-surface);
  border-radius: var(--radius-md);
  border: 1.5px solid transparent;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
.attempt-opt:active { transform: scale(0.96); }
.attempt-opt.selected {
  border-color: var(--c-rust);
  background: #fdf4f0;
}
.attempt-opt .emoji { font-size: 24px; margin-bottom: 6px; }
.attempt-opt .title {
  font-size: 14px;
  font-weight: 600;
  color: var(--c-ink);
}
.attempt-opt .desc {
  font-size: 11px;
  color: var(--c-ink-3);
  margin-top: 2px;
}

/* counter */
.counter {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 18px;
  background: var(--c-surface);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
}
.counter button {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: var(--c-bg-soft);
  color: var(--c-ink);
  font-size: 22px;
  font-weight: 300;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s ease, background 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.counter button:active { transform: scale(0.88); background: #ddd7c8; }
.counter .num {
  font-size: 36px;
  font-weight: 700;
  color: var(--c-ink);
  min-width: 80px;
  text-align: center;
  letter-spacing: -1px;
  transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
}
.counter .num.bump { transform: scale(1.15); }

/* star rating */
.star-row {
  display: flex;
  gap: 8px;
  justify-content: center;
  padding: 16px;
  background: var(--c-surface);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
}
.star {
  width: 36px;
  height: 36px;
  cursor: pointer;
  transition: transform 0.2s cubic-bezier(.34,1.56,.64,1);
  -webkit-tap-highlight-color: transparent;
}
.star:active { transform: scale(0.8); }
.star path { fill: none; stroke: var(--c-ink-3); stroke-width: 1.5; transition: all 0.2s ease; }
.star.on path { fill: var(--c-sun); stroke: var(--c-sun); }
.star.pop { animation: starPop 0.4s cubic-bezier(.34,1.56,.64,1); }
@keyframes starPop {
  0% { transform: scale(1); }
  50% { transform: scale(1.4) rotate(-8deg); }
  100% { transform: scale(1) rotate(0); }
}

.notes-input {
  width: 100%;
  min-height: 90px;
  padding: 14px;
  background: var(--c-surface);
  border: 1px solid var(--c-line-soft);
  border-radius: var(--radius-md);
  font-size: 15px;
  color: var(--c-ink);
  font-family: inherit;
  resize: none;
  outline: none;
  box-shadow: var(--shadow-sm);
  line-height: 1.5;
}
.notes-input:focus { border-color: var(--c-rust); }

/* primary button */
.btn-primary {
  width: 100%;
  height: 52px;
  border-radius: 100px;
  background: var(--c-rust);
  color: #fff;
  font-size: 17px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 6px 18px rgba(200,90,58,0.35);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  -webkit-tap-highlight-color: transparent;
  letter-spacing: 0.2px;
}
.btn-primary:active { transform: scale(0.96); box-shadow: 0 3px 10px rgba(200,90,58,0.3); }
.btn-primary.press { animation: btnPress 0.3s ease; }
@keyframes btnPress {
  0% { transform: scale(1); }
  50% { transform: scale(0.94); }
  100% { transform: scale(1); }
}
.btn-secondary {
  width: 100%;
  height: 48px;
  border-radius: 100px;
  background: transparent;
  color: var(--c-ink-2);
  font-size: 15px;
  font-weight: 500;
  border: 1px solid var(--c-line);
  cursor: pointer;
  transition: all 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.btn-secondary:active { transform: scale(0.96); background: var(--c-bg-soft); }

/* ---------- Signature / Stamp Modal ---------- */
.stamp-overlay {
  position: absolute;
  inset: 0;
  background: rgba(20, 18, 14, 0.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.stamp-overlay.show {
  opacity: 1;
  pointer-events: auto;
}
.stamp-card {
  width: 320px;
  background: var(--c-chalk);
  border-radius: var(--radius-xl);
  padding: 24px;
  position: relative;
  box-shadow: var(--shadow-lg);
  transform: scale(0.85) translateY(20px);
  opacity: 0;
  transition: transform 0.45s cubic-bezier(.34,1.56,.64,1), opacity 0.3s ease;
}
.stamp-overlay.show .stamp-card {
  transform: scale(1) translateY(0);
  opacity: 1;
}
.stamp-card h3 {
  font-size: 20px;
  font-weight: 700;
  color: var(--c-ink);
  margin: 0 0 6px;
  text-align: center;
  letter-spacing: -0.3px;
}
.stamp-card .stamp-sub {
  font-size: 13px;
  color: var(--c-ink-3);
  text-align: center;
  margin-bottom: 16px;
}
.signature-pad {
  width: 100%;
  height: 140px;
  background: #fff;
  border: 1.5px dashed var(--c-line);
  border-radius: var(--radius-md);
  position: relative;
  overflow: hidden;
  touch-action: none;
  cursor: crosshair;
}
.signature-pad canvas {
  display: block;
  width: 100%;
  height: 100%;
}
.signature-pad .placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--c-ink-3);
  font-size: 14px;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
.signature-pad.has-sign .placeholder { opacity: 0; }
.stamp-actions {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}
.stamp-actions button {
  flex: 1;
  height: 44px;
  border-radius: 100px;
  border: none;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.stamp-actions button:active { transform: scale(0.95); }
.btn-clear { background: var(--c-bg-soft); color: var(--c-ink-2); }
.btn-stamp {
  background: var(--c-rust);
  color: #fff;
  box-shadow: 0 4px 12px rgba(200,90,58,0.3);
}

/* Stamp mark animation */
.stamp-mark {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(2.5) rotate(-12deg);
  opacity: 0;
  pointer-events: none;
  font-size: 60px;
  font-weight: 900;
  color: #c82a2a;
  text-shadow: 2px 2px 0 rgba(200,42,42,0.2);
  letter-spacing: 4px;
  z-index: 10;
}
.stamp-mark.stamp-in {
  animation: stampIn 0.55s cubic-bezier(.2,1.6,.4,1) forwards;
}
@keyframes stampIn {
  0% { transform: translate(-50%, -50%) scale(2.5) rotate(-12deg); opacity: 0; }
  60% { transform: translate(-50%, -50%) scale(0.9) rotate(-12deg); opacity: 1; }
  80% { transform: translate(-50%, -50%) scale(1.05) rotate(-12deg); }
  100% { transform: translate(-50%, -50%) scale(1) rotate(-12deg); opacity: 1; }
}
.stamp-ink-splash {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 200px;
  height: 200px;
  transform: translate(-50%, -50%);
  pointer-events: none;
  opacity: 0;
  z-index: 9;
}
.stamp-ink-splash.splash-in { animation: inkSplash 0.6s ease-out forwards; }
@keyframes inkSplash {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
  40% { opacity: 0.6; }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.4); }
}

/* ---------- Progress page ---------- */
.progress-header {
  padding: 0 20px 16px;
}
.progress-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 0 16px 20px;
}
.summary-card {
  background: var(--c-surface);
  border-radius: var(--radius-md);
  padding: 14px 12px;
  text-align: center;
  box-shadow: var(--shadow-sm);
}
.summary-card .num {
  font-size: 26px;
  font-weight: 700;
  color: var(--c-ink);
  letter-spacing: -0.8px;
}
.summary-card .lbl {
  font-size: 11px;
  color: var(--c-ink-3);
  margin-top: 2px;
}
.summary-card.highlight .num { color: var(--c-rust); }

/* pyramid chart */
.pyramid-section {
  margin: 0 16px 20px;
  background: var(--c-surface);
  border-radius: var(--radius-md);
  padding: 18px 16px 16px;
  box-shadow: var(--shadow-sm);
}
.pyramid-section h3 {
  font-size: 16px;
  font-weight: 600;
  color: var(--c-ink);
  margin: 0 0 14px;
}
.pyramid-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.pyramid-bar:last-child { margin-bottom: 0; }
.pyramid-grade {
  width: 36px;
  font-size: 13px;
  font-weight: 600;
  color: var(--c-ink-2);
  flex-shrink: 0;
  text-align: right;
}
.pyramid-track {
  flex: 1;
  height: 22px;
  background: var(--c-bg-soft);
  border-radius: 6px;
  overflow: hidden;
  position: relative;
}
.pyramid-fill {
  height: 100%;
  border-radius: 6px;
  width: 0;
  transition: width 0.9s cubic-bezier(.22,.61,.36,1);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 8px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
}
.pyramid-fill.g5 { background: linear-gradient(90deg, #8aa375, #6d7f5c); }
.pyramid-fill.g6 { background: linear-gradient(90deg, #e8c872, #d4a73a); }
.pyramid-fill.g7 { background: linear-gradient(90deg, #e28a6b, #c85a3a); }
.pyramid-fill.g8 { background: linear-gradient(90deg, #d97a95, #b34567); }

/* achievement list */
.achievements {
  padding: 0 16px 30px;
}
.achv-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 14px;
  background: var(--c-surface);
  border-radius: var(--radius-md);
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
}
.achv-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 22px;
  background: var(--c-sun-soft);
}
.achv-body { flex: 1; min-width: 0; }
.achv-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--c-ink);
}
.achv-desc {
  font-size: 12px;
  color: var(--c-ink-3);
  margin-top: 2px;
}
.achv-progress {
  width: 50px;
  text-align: right;
  flex-shrink: 0;
  font-size: 13px;
  font-weight: 600;
  color: var(--c-rust);
}

/* ---------- Settings page ---------- */
.settings-list {
  margin: 12px 16px 20px;
  background: var(--c-surface);
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.settings-row {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  border-bottom: 0.5px solid var(--c-line-soft);
  cursor: pointer;
  gap: 12px;
  transition: background 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.settings-row:last-child { border-bottom: none; }
.settings-row:active { background: var(--c-bg-soft); }
.settings-row .icon-box {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.settings-row .lbl {
  flex: 1;
  font-size: 15px;
  color: var(--c-ink);
}
.settings-row .detail {
  font-size: 14px;
  color: var(--c-ink-3);
}
.settings-row .chev { color: var(--c-ink-3); }

/* profile card */
.profile-card {
  margin: 16px;
  padding: 18px;
  background: var(--c-surface);
  border-radius: var(--radius-lg);
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: var(--shadow-sm);
}
.avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, #c85a3a, #e8b23a);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 22px;
  font-weight: 700;
  flex-shrink: 0;
  position: relative;
}
.avatar::after {
  content: "";
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 2px solid var(--c-rust);
  opacity: 0;
  animation: ringPulse 2s ease-out infinite;
}
@keyframes ringPulse {
  0% { transform: scale(0.9); opacity: 0.5; }
  100% { transform: scale(1.2); opacity: 0; }
}
.profile-info .name {
  font-size: 17px;
  font-weight: 600;
  color: var(--c-ink);
}
.profile-info .sub {
  font-size: 13px;
  color: var(--c-ink-3);
  margin-top: 3px;
}

/* ---------- Design Spec page ---------- */
.spec-section {
  margin: 0 16px 24px;
  padding: 18px;
  background: var(--c-surface);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
}
.spec-section h3 {
  font-size: 16px;
  font-weight: 600;
  color: var(--c-ink);
  margin: 0 0 12px;
  letter-spacing: -0.2px;
}
.spec-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 0.5px solid var(--c-line-soft);
  font-size: 14px;
}
.spec-row:last-child { border-bottom: none; }
.spec-row .k { color: var(--c-ink-3); }
.spec-row .v { color: var(--c-ink); font-weight: 500; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }

.color-swatch {
  display: flex;
  gap: 10px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.swatch {
  flex: 1;
  min-width: 60px;
}
.swatch-dot {
  height: 44px;
  border-radius: 10px;
  margin-bottom: 6px;
  border: 1px solid var(--c-line-soft);
}
.swatch-name { font-size: 11px; color: var(--c-ink-2); font-weight: 500; }
.swatch-hex { font-size: 10px; color: var(--c-ink-3); font-family: ui-monospace, monospace; }

.type-sample {
  padding: 10px 0;
  border-bottom: 0.5px solid var(--c-line-soft);
}
.type-sample:last-child { border-bottom: none; }
.type-sample .demo {
  color: var(--c-ink);
  letter-spacing: -0.5px;
}
.type-sample .info {
  font-size: 11px;
  color: var(--c-ink-3);
  margin-top: 4px;
  font-family: ui-monospace, monospace;
}

/* ---------- API page ---------- */
.api-block {
  margin: 0 16px 18px;
  background: var(--c-surface);
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.api-method {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 5px;
  font-size: 11px;
  font-weight: 700;
  font-family: ui-monospace, monospace;
}
.api-method.get { background: var(--c-moss-soft); color: #4e5e41; }
.api-method.post { background: var(--c-sun-soft); color: #8a6a1a; }
.api-method.put { background: #e0d0e8; color: #6a4a80; }
.api-method.del { background: var(--c-rust-soft); color: #a0462a; }

.api-head {
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 0.5px solid var(--c-line-soft);
}
.api-path {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 13px;
  color: var(--c-ink);
  font-weight: 500;
  flex: 1;
  overflow-wrap: anywhere;
}
.api-body {
  padding: 12px 16px 14px;
  font-size: 13px;
  color: var(--c-ink-2);
  line-height: 1.6;
}
.api-body code {
  background: var(--c-bg-soft);
  padding: 2px 6px;
  border-radius: 5px;
  font-size: 12px;
  font-family: ui-monospace, monospace;
  color: var(--c-rust);
}
.api-body pre {
  margin: 8px 0 0;
  padding: 10px 12px;
  background: #1c1a17;
  color: #e8e2d4;
  border-radius: 8px;
  font-size: 11px;
  line-height: 1.55;
  overflow-x: auto;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}

/* ---------- Fade-in list animation ---------- */
.fade-item {
  opacity: 0;
  transform: translateY(14px);
  transition: opacity 0.5s ease, transform 0.5s cubic-bezier(.22,.61,.36,1);
}
.fade-item.show {
  opacity: 1;
  transform: translateY(0);
}

/* ---------- Floating action button (FAB) ---------- */
.fab {
  position: absolute;
  right: 16px;
  bottom: calc(var(--safe-bottom) + 70px);
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--c-rust);
  color: #fff;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 22px rgba(200,90,58,0.45);
  z-index: 45;
  transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
.fab:active { transform: scale(0.88) rotate(90deg); }
.fab svg { transition: transform 0.3s ease; }
.fab:active svg { transform: rotate(90deg); }

/* ---------- Pull-to-refresh indicator ---------- */
.pull-indicator {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translate(-50%, -100%);
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.2s ease;
  pointer-events: none;
}
.pull-indicator svg {
  animation: spin 1s linear infinite;
}
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* ---------- Route detail image top parallax ---------- */
.parallax-img {
  height: 200px;
  background-size: cover;
  background-position: center;
  transform-origin: center bottom;
  transition: transform 0.1s linear;
}

/* ---------- Route card swipe hint ---------- */
.swipe-hint {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--c-ink-3);
}

/* ---------- Decorative chalk dust texture ---------- */
.chalk-texture {
  position: absolute;
  pointer-events: none;
  opacity: 0.4;
}

/* ---------- Toast ---------- */
.toast {
  position: absolute;
  top: calc(var(--safe-top) + 10px);
  left: 50%;
  transform: translateX(-50%) translateY(-80px);
  padding: 10px 18px;
  background: rgba(28,26,23,0.92);
  color: #fff;
  border-radius: 100px;
  font-size: 14px;
  font-weight: 500;
  z-index: 500;
  pointer-events: none;
  transition: transform 0.4s cubic-bezier(.34,1.56,.64,1);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: var(--shadow-md);
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ---------- Helper ---------- */
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* ---------- prefers-reduced-motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .fade-item { opacity: 1; transform: none; }
  .page.enter-right, .page.enter-left,
  .page.leave-left, .page.leave-right {
    transform: none !important;
    opacity: 1 !important;
  }
}

/* ---------- Responsive ---------- */
@media (max-width: 500px) {
  body { padding: 0; background: #c7bfae; }
  .phone {
    width: 100vw;
    height: 100vh;
    border-radius: 0;
    padding: 0;
    box-shadow: none;
    background: #000;
  }
  .phone::before { display: none; }
  .screen { border-radius: 0; }
}
</style>

/* ---------- Helpers ---------- */
function $(id) { return document.getElementById(id); }
function findCrag(id) { return CRAGS.find(c => c.id === id); }
function findRoute(cragId, routeId) {
  const c = findCrag(cragId);
  return c ? c.routes.find(r => r.id === routeId) : null;
}
function getRouteStatus(routeId) {
  const log = state.logs.find(l => l.routeId === routeId);
  if (!log) return 'todo';
  if (log.result === 'flash' || log.result === 'onsight' || log.result === 'redpoint') return 'done';
  return 'project';
}
function gradeClass(grade) {
  const g = parseInt(grade.match(/\d+/)?.[0] || '5');
  if (g >= 8) return 'grade-8';
  if (g >= 7) return 'grade-7';
  if (g >= 6) return 'grade-6';
  return 'grade-5';
}
function getStats() {
  const total = state.logs.length;
  const crags = new Set(state.logs.map(l => l.cragId)).size;
  const highest = state.logs
    .map(l => {
      const r = findRoute(l.cragId, l.routeId);
      return r ? r.grade : '5.0';
    })
    .sort((a, b) => b.localeCompare(a, undefined, { numeric: true, sensitivity: 'base' }))[0] || '5.8';
  return { total, crags, highest };
}
function getPyramidData() {
  const grades = { '5.8-5.9': 0, '5.10': 0, '5.11': 0, '5.12+': 0 };
  state.logs.forEach(l => {
    const r = findRoute(l.cragId, l.routeId);
    if (!r) return;
    const g = r.grade;
    if (g.startsWith('5.8') || g.startsWith('5.9')) grades['5.8-5.9']++;
    else if (g.startsWith('5.10')) grades['5.10']++;
    else if (g.startsWith('5.11')) grades['5.11']++;
    else grades['5.12+']++;
  });
  return grades;
}

/* ============================================================
   App 1: Main Flow
   ============================================================ */

const App1 = {
  pages: {}, // key: pageId, value: { el, title }
  history: [], // stack of page ids
  current: null,

  init() {
    this.renderHome();
    this.show('home', false);
    this.animateIn();
  },

  animateIn() {
    // trigger fade-in items on first page
    requestAnimationFrame(() => {
      const page = this.pages.home?.el;
      if (!page) return;
      const items = page.querySelectorAll('.fade-item');
      items.forEach((el, i) => {
        setTimeout(() => el.classList.add('show'), 60 + i * 70);
      });
    });
  },

  show(pageId, animate = true) {
    const page = this.pages[pageId];
    if (!page) return;
    const prev = this.current;

    if (animate && prev && prev !== pageId) {
      const prevEl = this.pages[prev].el;
      const newEl = page.el;

      newEl.classList.add('enter-right');
      newEl.style.display = '';
      newEl.style.zIndex = 2;
      prevEl.style.zIndex = 1;

      // force reflow
      void newEl.offsetWidth;

      newEl.classList.add('transitioning');
      prevEl.classList.add('transitioning');

      requestAnimationFrame(() => {
        newEl.classList.remove('enter-right');
        prevEl.classList.add('leave-left');
      });

      const done = () => {
        newEl.classList.remove('transitioning');
        prevEl.classList.remove('transitioning', 'leave-left');
        prevEl.style.display = 'none';
        newEl.style.zIndex = '';
        prevEl.style.zIndex = '';
        newEl.removeEventListener('transitionend', onEnd);
      };
      const onEnd = (e) => {
        if (e.target === newEl && e.propertyName === 'transform') done();
      };
      newEl.addEventListener('transitionend', onEnd);
      // fallback
      setTimeout(done, 450);

      // fade-in items on new page
      const items = newEl.querySelectorAll('.fade-item');
      items.forEach((el, i) => {
        el.classList.remove('show');
        setTimeout(() => el.classList.add('show'), 200 + i * 60);
      });
    } else {
      // initial state
      Object.values(this.pages).forEach(p => { p.el.style.display = 'none'; });
      page.el.style.display = '';
    }

    if (prev !== pageId) this.history.push(pageId);
    this.current = pageId;
  },

  back() {
    if (this.history.length <= 1) return;
    const currentId = this.history.pop();
    const prevId = this.history[this.history.length - 1];
    const currentEl = this.pages[currentId].el;
    const prevEl = this.pages[prevId].el;

    prevEl.style.display = '';
    prevEl.style.zIndex = 1;
    prevEl.classList.add('enter-left');
    currentEl.style.zIndex = 2;

    void prevEl.offsetWidth;

    currentEl.classList.add('transitioning');
    prevEl.classList.add('transitioning');

    requestAnimationFrame(() => {
      currentEl.classList.add('leave-right');
      prevEl.classList.remove('enter-left');
    });

    const done = () => {
      currentEl.classList.remove('transitioning', 'leave-right');
      prevEl.classList.remove('transitioning');
      currentEl.style.display = 'none';
      currentEl.style.zIndex = '';
      prevEl.style.zIndex = '';
      currentEl.removeEventListener('transitionend', onEnd);
    };
    const onEnd = (e) => {
      if (e.target === currentEl && e.propertyName === 'transform') done();
    };
    currentEl.addEventListener('transitionend', onEnd);
    setTimeout(done, 450);

    this.current = prevId;
  },

  switchTab(tab) {
    // update tab states
    const page = this.pages.home?.el;
    if (page) {
      page.querySelectorAll('.tab-item').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tab);
      });
    }
    if (tab === 'home') {
      this.show('home');
      return;
    }
    if (tab === 'crags') {
      if (!this.pages.crags) this.renderCrags();
      this.show('crags');
      return;
    }
    if (tab === 'progress') {
      if (!this.pages.progress) this.renderProgress();
      this.show('progress');
      return;
    }
    if (tab === 'settings') {
      if (!this.pages.settings) this.renderSettings();
      this.show('settings');
      return;
    }
  },

              setTimeout(() => s.classList.remove('pop'), 400);
            }
          });
        });
      });

      // save button -> open stamp
      el.querySelector('#saveBtn_' + route.id).addEventListener('click', () => {
        this.openStamp(route.id);
      });

      // stamp interactions
      const clearBtn = el.querySelector('#sigClear_' + route.id);
      const stampBtn = el.querySelector('#stampBtn_' + route.id);
      const overlay = el.querySelector('#stampOverlay_' + route.id);

      clearBtn.addEventListener('click', () => clearSignature(route.id));
      stampBtn.addEventListener('click', () => this.confirmStamp(route.id, route, crag));
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) this.closeStamp(route.id);
      });

      $('app1').appendChild(el);
      this.pages[pageKey] = { el, title: route.name };
    }

    this.show(pageKey);
    // init signature pad when shown
    setTimeout(() => initSignaturePad(route.id), 100);
  },

  openStamp(routeId) {
    const overlay = $('stampOverlay_' + routeId) || document.querySelector('#stampOverlay_' + routeId);
    if (!overlay) return;
    overlay.classList.add('show');
    // re-init canvas size
    setTimeout(() => initSignaturePad(routeId), 50);
  },

  closeStamp(routeId) {
    const overlay = $('stampOverlay_' + routeId) || document.querySelector('#stampOverlay_' + routeId);
    if (overlay) overlay.classList.remove('show');
  },

  confirmStamp(routeId, route, crag) {
    const sigPad = document.querySelector('#sigPad_' + routeId);
    if (!sigPad?.classList.contains('has-sign')) {
      showToast1('请先签名');
      return;
    }

    const mark = document.querySelector('#stampMark_' + routeId);
    const splash = document.querySelector('#inkSplash_' + routeId);
    const stampBtn = document.querySelector('#stampBtn_' + routeId);

    // play stamp animation
    mark.classList.add('stamp-in');
    splash.classList.add('splash-in');

    // haptic / sound visual: button press
    stampBtn.animate([
      { transform: 'scale(1)' },
      { transform: 'scale(0.9)' },
      { transform: 'scale(1)' }
    ], { duration: 200 });

    // save log after animation
    setTimeout(() => {
      const newLog = {
        id: Date.now(),
        cragId: crag.id,
        routeId: route.id,
        date: new Date().toISOString().slice(0, 10),
        result: state.recordResult,
        attempts: state.recordAttempts,
        stars: state.recordStars,
        notes: state.recordNotes || '',
        signed: true,
      };
      state.logs.unshift(newLog);
      __saveLogs();

      // close modal
      this.closeStamp(routeId);
      showToast1('攀登记录已保存 · 完攀盖章!');

      // go back to progress tab after short delay
      setTimeout(() => {
        // rebuild progress page
        if (this.pages.progress) {
          this.pages.progress.el.remove();
          delete this.pages.progress;
        }
        this.switchTab('progress');
        // clean history stack
        this.history = ['home', 'progress'];
        this.current = 'progress';
      }, 900);
    }, 650);
  },

/* ============================================================
   Signature Pad (canvas)
   ============================================================ */
const sigPads = {}; // routeId -> { canvas, ctx, drawing, hasSign }

function initSignaturePad(routeId) {
  const canvas = document.getElementById('sigCanvas_' + routeId);
  const pad = document.getElementById('sigPad_' + routeId);
  if (!canvas || !pad || sigPads[routeId]) return;

  const dpr = window.devicePixelRatio || 1;
  const rect = pad.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#1c1a17';

  const state = { drawing: false, lastX: 0, lastY: 0, hasSign: false };
  sigPads[routeId] = { canvas, ctx, pad, state };

  const getPos = (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return { x, y };
  };

  const start = (e) => {
    e.preventDefault();
    state.drawing = true;
    const { x, y } = getPos(e);
    state.lastX = x;
    state.lastY = y;
    // draw a dot
    ctx.beginPath();
    ctx.arc(x, y, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = '#1c1a17';
    ctx.fill();
    if (!state.hasSign) {
      state.hasSign = true;
      pad.classList.add('has-sign');
    }
  };

  const move = (e) => {
    if (!state.drawing) return;
    e.preventDefault();
    const { x, y } = getPos(e);
    // variable line width based on speed
    const dist = Math.hypot(x - state.lastX, y - state.lastY);
    const pressure = Math.max(1.2, Math.min(3.5, 3.5 - dist * 0.08));
    ctx.lineWidth = pressure;
    ctx.beginPath();
    ctx.moveTo(state.lastX, state.lastY);
    ctx.lineTo(x, y);
    ctx.stroke();
    state.lastX = x;
    state.lastY = y;
  };

  const end = () => { state.drawing = false; };

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);
}

function clearSignature(routeId) {
  const pad = sigPads[routeId];
  if (!pad) return;
  pad.ctx.clearRect(0, 0, pad.canvas.width, pad.canvas.height);
  pad.state.hasSign = false;
  pad.pad.classList.remove('has-sign');
  // reset stamp mark
  const mark = document.getElementById('stampMark_' + routeId);
  const splash = document.getElementById('inkSplash_' + routeId);
  if (mark) { mark.classList.remove('stamp-in'); void mark.offsetWidth; }
  if (splash) { splash.classList.remove('splash-in'); void splash.offsetWidth; }
}

/* ============================================================

let toastTimer1 = null;
function showToast1(msg) {
  const toast = $('toast1');
  if (!toast) return;
  toast.querySelector('#toastMsg1').textContent = msg;
  toast.classList.add('show');
  if (toastTimer1) clearTimeout(toastTimer1);
  toastTimer1 = setTimeout(() => toast.classList.remove('show'), 2000);
}

/* ============================================================
   Intersection Observer for fade-in items on scroll
   ============================================================ */
let io = null;
function setupIntersectionObserver() {
  if (!('IntersectionObserver' in window)) return;
  io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('show');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });
}

/* ============================================================
   Page visibility handling — pause timers/animations when hidden
   ============================================================ */
let rafIds = [];
function registerRaf(id) { rafIds.push(id); }
function cancelAllRaf() { rafIds.forEach(id => cancelAnimationFrame(id)); rafIds = []; }

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    cancelAllRaf();
  }
});

/* ============================================================
   Init
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  setupIntersectionObserver();
  App1.init();
  App2.init();

  // announce upgrade for interactive prototype
  try {
    const announce = () => {
      window.parent?.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    };
    announce();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announce, { once: true });
    }
  } catch (e) { /* ignore */ }
});

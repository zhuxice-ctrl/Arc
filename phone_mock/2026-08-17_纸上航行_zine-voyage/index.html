<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="creative-medium" content="interactive-prototype" />
<title>纸上航行 · 独立出版小程序</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" />
<style>
  /* ========================================
     纸上航行 · Paper Voyage Mini Program
     Palette: Mustard #E3B23C · Forest #2F4A3E · Paper #F7F3E9 · Coral #E8714A
     ======================================== */

  :root {
    --mustard: #E3B23C;
    --mustard-soft: #EFC96B;
    --mustard-deep: #C99A28;
    --forest: #2F4A3E;
    --forest-soft: #3E5F50;
    --forest-deep: #1E3329;
    --paper: #F7F3E9;
    --paper-warm: #F0E8D5;
    --paper-dark: #E8DFC8;
    --coral: #E8714A;
    --coral-soft: #F09070;
    --coral-deep: #D05A36;
    --ink: #2A251E;
    --ink-soft: #5A5449;
    --ink-muted: #8B8578;
    --hairline: rgba(47,74,62,0.12);
    --shadow-sm: 0 2px 8px rgba(47,74,62,0.08);
    --shadow-md: 0 8px 24px rgba(47,74,62,0.12);
    --shadow-lg: 0 16px 48px rgba(47,74,62,0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; height: 100%;
    background: #1a1814;
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(227,178,60,0.08), transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(232,113,74,0.06), transparent 50%),
      #1a1814;
    z-index: 0;
  }

  /* Phone frame */
  .phone-shell {
    position: relative;
    width: 390px;
    height: 844px;
    background: #0c0a08;
    border-radius: 52px;
    padding: 14px;
    box-shadow:
      0 0 0 2px #2a2722,
      0 30px 80px rgba(0,0,0,0.6),
      0 2px 8px rgba(0,0,0,0.4);
    z-index: 1;
  }

  .phone-side-btn-left, .phone-side-btn-right {
    position: absolute;
    background: #1a1814;
    border-radius: 2px;
  }
  .phone-side-btn-left { left: -2px; width: 3px; }
  .phone-side-btn-right { right: -2px; width: 3px; }
  .btn-silent { top: 120px; height: 30px; }
  .btn-vol-up { top: 170px; height: 50px; }
  .btn-vol-down { top: 230px; height: 50px; }
  .btn-power { top: 190px; height: 80px; }

  .phone-screen {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--paper);
    border-radius: 40px;
    overflow: hidden;
    font-family: 'Noto Sans SC', sans-serif;
  }

  /* Dynamic island */
  .dynamic-island {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 34px;
    background: #000;
    border-radius: 20px;
    z-index: 100;
  }

  /* Status bar */
  .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 54px;
    padding: 18px 32px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 15px;
    font-weight: 600;
    z-index: 90;
    pointer-events: none;
    color: var(--ink);
  }
  .status-bar.light { color: #fff; }
  .status-bar .right-icons { display: flex; gap: 6px; align-items: center; }
  .status-bar .icon-signal, .status-bar .icon-wifi, .status-bar .icon-battery {
    display: inline-block;
  }
  .icon-battery {
    width: 25px; height: 12px;
    border: 1px solid currentColor;
    border-radius: 3px;
    position: relative;
    opacity: 0.9;
  }
  .icon-battery::after {
    content: '';
    position: absolute;
    right: -3px; top: 3px;
    width: 2px; height: 4px;
    background: currentColor;
    border-radius: 0 1px 1px 0;
    opacity: 0.7;
  }
  .icon-battery .battery-fill {
    position: absolute;
    left: 1px; top: 1px;
    width: 18px; height: 8px;
    background: currentColor;
    border-radius: 1.5px;
  }
  .icon-wifi {
    width: 16px; height: 12px;
    position: relative;
  }
  .icon-wifi::before {
    content: '';
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 16px; height: 16px;
    border: 1px solid currentColor;
    border-radius: 50%;
    clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
    opacity: 0;
  }
  .icon-wifi svg { width: 100%; height: 100%; display: block; }

  /* Mini program navigation bar */
  .nav-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 88px;
    z-index: 80;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 10px;
    pointer-events: none;
    transition: background 0.3s ease, color 0.3s ease;
  }
  .nav-title {
    font-size: 17px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .nav-bar.scrolled .nav-title { opacity: 1; }
  .nav-bar.scrolled {
    background: rgba(247,243,233,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 1px 0 var(--hairline);
  }

  /* Capsule button */
  .capsule-btn {
    position: absolute;
    top: 56px;
    right: 12px;
    width: 88px;
    height: 32px;
    background: rgba(42,37,30,0.06);
    border: 1px solid rgba(42,37,30,0.08);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    z-index: 95;
    cursor: pointer;
    transition: background 0.2s;
  }
  .capsule-btn:hover { background: rgba(42,37,30,0.12); }
  .capsule-btn svg {
    width: 16px; height: 16px;
    color: var(--ink);
  }
  .capsule-divider {
    width: 1px; height: 16px;
    background: rgba(42,37,30,0.15);
  }
  .capsule-btn.dark {
    background: rgba(255,255,255,0.15);
    border-color: rgba(255,255,255,0.2);
  }
  .capsule-btn.dark svg { color: #fff; }
  .capsule-btn.dark .capsule-divider { background: rgba(255,255,255,0.25); }

  /* Page container */
  .page-container {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden;
  }

  .page {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--paper);
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    will-change: transform, opacity;
    scrollbar-width: none;
  }
  .page::-webkit-scrollbar { display: none; }

  .page.entering {
    animation: pagePushIn 0.35s cubic-bezier(0.32, 0.72, 0, 1) both;
  }
  .page.exiting {
    animation: pagePushOut 0.35s cubic-bezier(0.32, 0.72, 0, 1) both;
    pointer-events: none;
  }
  .page.popping-out {
    animation: pagePopOut 0.32s cubic-bezier(0.32, 0.72, 0, 1) both;
    pointer-events: none;
  }
  .page.popping-in {
    animation: pagePopIn 0.32s cubic-bezier(0.32, 0.72, 0, 1) both;
  }

  @keyframes pagePushIn {
    from { transform: translateX(100%); opacity: 1; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes pagePushOut {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(-25%); opacity: 0.6; }
  }
  @keyframes pagePopOut {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(100%); opacity: 1; }
  }
  @keyframes pagePopIn {
    from { transform: translateX(-25%); opacity: 0.6; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* Page content wrapper */
  .page-content {
    padding-bottom: 140px; /* tab bar safe area */
    min-height: 100%;
    position: relative;
  }
  .page-content.no-tabbar {
    padding-bottom: 40px;
  }

  /* Back button (for non-tab pages) */
  .back-btn {
    position: absolute;
    top: 56px;
    left: 12px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(42,37,30,0.08);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 95;
    transition: background 0.2s, transform 0.2s;
  }
  .back-btn:hover { background: rgba(42,37,30,0.15); }
  .back-btn:active { transform: scale(0.92); }
  .back-btn svg { width: 18px; height: 18px; color: var(--ink); }
  .back-btn.light {
    background: rgba(255,255,255,0.2);
  }
  .back-btn.light svg { color: #fff; }

  /* ========================================
     TAB BAR
     ======================================== */
  .tabbar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 83px;
    background: rgba(247,243,233,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--hairline);
    display: flex;
    align-items: flex-start;
    padding-top: 6px;
    z-index: 70;
    padding-bottom: 20px;
  }
  .tabbar-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    padding-top: 4px;
    position: relative;
  }
  .tabbar-icon {
    width: 24px; height: 24px;
    color: var(--ink-muted);
    transition: color 0.25s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .tabbar-label {
    font-size: 10px;
    color: var(--ink-muted);
    transition: color 0.25s ease;
    font-weight: 500;
  }
  .tabbar-item.active .tabbar-icon {
    color: var(--forest);
    transform: translateY(-2px) scale(1.08);
  }
  .tabbar-item.active .tabbar-label {
    color: var(--forest);
    font-weight: 600;
  }
  .tabbar-item.active .tabbar-icon::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--mustard);
  }

  /* ========================================
     HOME PAGE
     ======================================== */
  .home-hero {
    position: relative;
    padding: 100px 20px 40px;
    background: linear-gradient(180deg, var(--paper-warm) 0%, var(--paper) 100%);
    overflow: hidden;
  }
  .home-hero::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 200px; height: 200px;
    background: radial-gradient(circle, var(--mustard-soft) 0%, transparent 70%);
    opacity: 0.5;
    border-radius: 50%;
    filter: blur(40px);
  }
  .home-greeting {
    font-size: 13px;
    color: var(--ink-muted);
    margin-bottom: 4px;
    font-weight: 400;
    opacity: 0;
    transform: translateY(10px);
    animation: fadeUp 0.6s 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }
  .home-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 32px;
    font-weight: 900;
    color: var(--forest);
    line-height: 1.2;
    margin-bottom: 8px;
    opacity: 0;
    transform: translateY(12px);
    animation: fadeUp 0.7s 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }
  .home-subtitle {
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 24px;
    opacity: 0;
    transform: translateY(10px);
    animation: fadeUp 0.6s 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .home-search {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: #fff;
    border-radius: 24px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--hairline);
    margin-bottom: 24px;
    cursor: pointer;
    opacity: 0;
    transform: translateY(10px);
    animation: fadeUp 0.6s 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    transition: box-shadow 0.2s;
  }
  .home-search:hover { box-shadow: var(--shadow-md); }
  .home-search svg { width: 18px; height: 18px; color: var(--ink-muted); }
  .home-search span {
    font-size: 14px;
    color: var(--ink-muted);
    flex: 1;
  }
  .home-search-tag {
    font-size: 11px;
    padding: 3px 8px;
    background: var(--mustard);
    color: var(--forest-deep);
    border-radius: 10px;
    font-weight: 600;
  }

  /* Hero zine showcase */
  .hero-zine-showcase {
    position: relative;
    height: 240px;
    margin-bottom: 8px;
    opacity: 0;
    animation: fadeUp 0.8s 0.65s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }
  .hero-zine-stack {
    position: absolute;
    width: 140px;
    height: 200px;
    border-radius: 6px;
    box-shadow: var(--shadow-lg);
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: hidden;
  }
  .hero-zine-stack img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .hero-zine-stack.back {
    top: 20px; left: 20px;
    transform: rotate(-6deg) scale(0.88);
    opacity: 0.7;
    filter: saturate(0.9);
  }
  .hero-zine-stack.mid {
    top: 10px; left: 50%;
    transform: translateX(-50%) rotate(2deg) scale(0.95);
    opacity: 0.9;
  }
  .hero-zine-stack.front {
    top: 0; right: 20px;
    transform: rotate(5deg);
    z-index: 3;
  }
  .hero-zine-showcase:hover .hero-zine-stack.back {
    transform: rotate(-8deg) scale(0.9) translateY(-4px);
  }
  .hero-zine-showcase:hover .hero-zine-stack.mid {
    transform: translateX(-50%) rotate(0deg) scale(0.98) translateY(-6px);
  }
  .hero-zine-showcase:hover .hero-zine-stack.front {
    transform: rotate(3deg) translateY(-8px);
  }

  .hero-zine-badge {
    position: absolute;
    bottom: -10px; left: 20px;
    right: 20px;
    padding: 12px 16px;
    background: var(--forest);
    color: var(--paper);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-md);
    z-index: 5;
    cursor: pointer;
    transition: transform 0.25s, box-shadow 0.25s;
  }
  .hero-zine-badge:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
  }
  .hero-zine-badge-text {
    font-family: 'Noto Serif SC', serif;
    font-size: 15px;
    font-weight: 600;
  }
  .hero-zine-badge-sub {
    font-size: 11px;
    color: rgba(247,243,233,0.7);
    margin-top: 2px;
  }
  .hero-zine-badge-arrow {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--mustard);
    color: var(--forest-deep);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Section headers */
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 28px 20px 14px;
  }
  .section-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--forest-deep);
  }
  .section-title-accent {
    display: inline-block;
    width: 20px; height: 3px;
    background: var(--coral);
    border-radius: 2px;
    margin-right: 8px;
    vertical-align: middle;
    transform: translateY(-2px);
  }
  .section-more {
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 2px;
    transition: color 0.2s;
  }
  .section-more:hover { color: var(--forest); }

  /* Zine card feed (horizontal) */
  .zine-scroll {
    display: flex;
    gap: 14px;
    padding: 0 20px 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .zine-scroll::-webkit-scrollbar { display: none; }

  .zine-card {
    flex-shrink: 0;
    width: 140px;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .zine-card:active { transform: scale(0.96); }
  .zine-card-cover {
    width: 140px;
    height: 200px;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: var(--shadow-md);
    position: relative;
    transition: box-shadow 0.3s, transform 0.3s;
  }
  .zine-card:hover .zine-card-cover {
    box-shadow: var(--shadow-lg);
    transform: translateY(-4px);
  }
  .zine-card-cover img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .zine-card-tag {
    position: absolute;
    top: 8px; left: 8px;
    padding: 2px 8px;
    font-size: 10px;
    font-weight: 600;
    background: var(--mustard);
    color: var(--forest-deep);
    border-radius: 4px;
    font-family: 'Space Mono', monospace;
  }
  .zine-card-tag.coral { background: var(--coral); color: #fff; }
  .zine-card-tag.forest { background: var(--forest); color: var(--paper); }
  .zine-card-info {
    padding: 10px 2px 0;
  }
  .zine-card-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .zine-card-meta {
    font-size: 11px;
    color: var(--ink-muted);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .zine-card-price {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    color: var(--coral-deep);
    margin-top: 4px;
  }

  /* Category chips row */
  .cat-chips {
    display: flex;
    gap: 10px;
    padding: 4px 20px 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .cat-chips::-webkit-scrollbar { display: none; }
  .cat-chip {
    flex-shrink: 0;
    padding: 8px 16px;
    background: #fff;
    border: 1px solid var(--hairline);
    border-radius: 20px;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.25s ease;
    font-weight: 500;
  }
  .cat-chip:hover { border-color: var(--forest); color: var(--forest); }
  .cat-chip.active {
    background: var(--forest);
    color: var(--paper);
    border-color: var(--forest);
  }

  /* Publisher small card */
  .publisher-strip {
    display: flex;
    gap: 16px;
    padding: 4px 20px 16px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .publisher-strip::-webkit-scrollbar { display: none; }
  .publisher-avatar-card {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .publisher-avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid var(--mustard);
    padding: 2px;
    background: var(--paper);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .publisher-avatar:hover { transform: scale(1.1); }
  .publisher-avatar img {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
  }
  .publisher-avatar-name {
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 500;
    max-width: 64px;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Featured event card */
  .event-card-feature {
    margin: 8px 20px 24px;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    height: 160px;
    box-shadow: var(--shadow-md);
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .event-card-feature:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-lg);
  }
  .event-card-feature img {
    width: 100%; height: 100%; object-fit: cover;
    filter: brightness(0.7);
  }
  .event-card-feature-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(47,74,62,0.85) 0%, rgba(47,74,62,0.3) 100%);
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .event-tag {
    display: inline-block;
    padding: 4px 10px;
    background: var(--mustard);
    color: var(--forest-deep);
    font-size: 11px;
    font-weight: 600;
    border-radius: 4px;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.5px;
    align-self: flex-start;
  }
  .event-info h3 {

  /* ========================================
     DISCOVERY PAGE
     ======================================== */
  .discovery-header {
    position: sticky;
    top: 0;
    z-index: 60;
    background: var(--paper);
  }
  .discovery-topbar {
    padding: 60px 20px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--paper);
  }
  .discovery-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 26px;
    font-weight: 900;
    color: var(--forest-deep);
    flex: 1;
  }
  .discovery-filter-btn {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: #fff;
    border: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s;
  }
  .discovery-filter-btn:hover { background: var(--paper-warm); }
  .discovery-filter-btn svg { width: 18px; height: 18px; color: var(--forest); }

  .sticky-tabs {
    position: sticky;
    top: 0;
    display: flex;
    padding: 0 16px;
    gap: 4px;
    background: var(--paper);
    border-bottom: 1px solid var(--hairline);
    z-index: 60;
  }
  .sticky-tab {
    flex-shrink: 0;
    padding: 14px 16px 12px;
    font-size: 15px;
    color: var(--ink-muted);
    cursor: pointer;
    position: relative;
    font-weight: 500;
    transition: color 0.25s;
  }
  .sticky-tab:hover { color: var(--forest-soft); }
  .sticky-tab.active {
    color: var(--forest-deep);
    font-weight: 700;
    font-size: 16px;
  }
  .sticky-tab.active::after {
    content: '';
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 20px; height: 3px;
    background: var(--mustard);
    border-radius: 2px;
    animation: tabIndicator 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes tabIndicator {
    from { width: 0; }
    to { width: 20px; }
  }

  /* Pull to refresh */
  .pull-refresh-indicator {
    position: absolute;
    top: -50px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: var(--ink-muted);
    font-size: 12px;
    z-index: 55;
    pointer-events: none;
  }
  .pull-refresh-spinner {
    width: 24px; height: 24px;
    border: 2px solid var(--hairline);
    border-top-color: var(--mustard);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Masonry grid */
  .masonry-grid {
    padding: 16px;
    column-count: 2;
    column-gap: 12px;
  }
  .masonry-item {
    break-inside: avoid;
    margin-bottom: 12px;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
    position: relative;
  }
  .masonry-item:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
  }
  .masonry-item img {
    width: 100%;
    display: block;
  }
  .masonry-item-body {
    padding: 10px 12px 12px;
  }
  .masonry-item-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.35;
    margin-bottom: 4px;

    align-items: center;
    font-size: 11px;
    color: var(--ink-muted);

  .masonry-item-price {
    color: var(--coral-deep);
    font-weight: 600;
    font-family: 'Space Mono', monospace;
  }

  /* ========================================
     ZINE DETAIL PAGE
     ======================================== */
  .detail-hero {
    position: relative;
    height: 420px;
    background: var(--forest);
    overflow: hidden;
  }
  .detail-hero-img {
    width: 100%; height: 100%;

  .detail-hero-overlay {

    position: absolute;
    bottom: 40px;
    left: 20px;
    right: 20px;

  .detail-badge {

    background: var(--mustard);

    font-weight: 700;

  .detail-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 30px;
    font-weight: 900;
    line-height: 1.2;
    margin-bottom: 8px;
  }
  .detail-subtitle {
    font-size: 14px;
    opacity: 0.85;
  }

  .detail-body {
    padding: 20px;
  }
  .detail-meta-row {
    display: flex;
    gap: 20px;
    padding: 16px 0;
    border-bottom: 1px solid var(--hairline);

  .detail-meta-item {
    flex: 1;
    text-align: center;

    font-weight: 700;

  .detail-meta-label {
    font-size: 11px;

  .detail-section-title {

    align-items: center;

    background: var(--coral);
    border-radius: 2px;
  }
  .detail-text {
    font-size: 14px;
    line-height: 1.75;
    color: var(--ink-soft);
  }
  .detail-text p { margin-bottom: 12px; }
  .detail-text p:last-child { margin-bottom: 0; }

  .detail-gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin: 16px 0;
  }
  .detail-gallery img {
    width: 100%;

  .detail-publisher-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px;

    border-radius: 12px;

    transition: background 0.25s;
  }
  .detail-publisher-card:hover { background: var(--paper-dark); }
  .detail-publisher-avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid var(--mustard);
    padding: 2px;
    background: #fff;
  }
  .detail-publisher-avatar img {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
  }
  .detail-publisher-info {
    flex: 1;
  }
  .detail-publisher-name {
    font-size: 15px;
    font-weight: 600;

  }
  .detail-publisher-desc {
    font-size: 12px;
    color: var(--ink-muted);
    margin-top: 2px;
  }
  .detail-follow-btn {
    padding: 6px 14px;

    color: var(--paper);
    border-radius: 16px;
    font-size: 12px;
    font-weight: 600;

  }
  .detail-follow-btn:hover { background: var(--forest-deep); }
  .detail-follow-btn.following {
    background: transparent;
    color: var(--forest);

  }

  /* Bottom action bar (safe area) */
  .detail-bottom-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 12px 16px 28px;
    background: rgba(247,243,233,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 75;
  }
  .bottom-bar-icon-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: pointer;
    padding: 4px 8px;
    transition: transform 0.2s;
  }
  .bottom-bar-icon-btn:active { transform: scale(0.92); }
  .bottom-bar-icon-btn svg { width: 20px; height: 20px; color: var(--ink-soft); }
  .bottom-bar-icon-btn span {
    font-size: 10px;
    color: var(--ink-muted);
  }
  .bottom-bar-icon-btn.liked svg { color: var(--coral); }

  .bottom-bar-price {
    font-family: 'Space Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--coral-deep);
    margin-left: auto;
  }
  .buy-btn {
    padding: 12px 28px;
    background: var(--forest);
    color: var(--paper);
    border-radius: 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(47,74,62,0.3);
    transition: all 0.25s;

    overflow: hidden;
  }
  .buy-btn:hover {

    box-shadow: 0 6px 16px rgba(47,74,62,0.4);
  }
  .buy-btn:active { transform: translateY(0); }
  .buy-btn::after {
    content: '';
    position: absolute;
    top: -50%; left: -50%;

    transform: translateX(-100%) rotate(25deg);

  }

  .publisher-card.coral::before { background: var(--coral); }

  .publisher-card-avatar {
    width: 64px; height: 64px;

  .publisher-card-body {

  .publisher-card-name {

  .publisher-card-desc {

  .publisher-card-footer {

     EVENTS PAGE
     ======================================== */

     ======================================== */

  /* Swipe list (orders) */

  /* ========================================

  .color-palette {
    display: grid;

  .color-swatch-name {

  }

  .type-samples {
    display: flex;
    flex-direction: column;

  }
  .type-sample {
    padding: 16px;
    background: #fff;
    border-radius: 12px;

  }
  .type-sample-label {
    font-family: 'Space Mono', monospace;

  .icon-grid {

  .icon-spec-item {
    display: flex;

  .icon-spec-item svg { width: 24px; height: 24px; color: var(--forest); }

  .spacing-grid {

  }
  .spacing-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--ink-muted);
    width: 40px;
    flex-shrink: 0;
  }

  /* ========================================
     API DOCS PAGE
     ======================================== */
  .api-header {
    padding: 100px 20px 24px;
    background: var(--ink);
    color: var(--paper);
    position: relative;
    overflow: hidden;
    font-family: 'Space Mono', monospace;
  }
  .api-header::before {
    content: '// paper-voyage-api';
    position: absolute;
    top: 20px; right: 20px;
    font-size: 12px;
    color: rgba(247,243,233,0.2);

  .api-header-title {
    font-size: 24px;
    font-weight: 700;

  .api-header-sub {

  .api-version {
    display: inline-block;

    font-weight: 600;
    border: 1px solid rgba(227,178,60,0.3);
  }

  .api-nav {
    display: flex;
    gap: 4px;
    padding: 12px 16px;
    background: #1a1714;
    overflow-x: auto;
    scrollbar-width: none;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .api-nav::-webkit-scrollbar { display: none; }
  .api-nav-item {
    flex-shrink: 0;
    padding: 6px 12px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;

    transition: all 0.2s;

  .api-nav-item:hover { color: var(--paper); }
  .api-nav-item.active {
    background: rgba(227,178,60,0.15);

  .api-content {
    padding: 20px;
    background: var(--paper);

  .endpoint-block {
    background: #fff;

  }
  .endpoint-block:hover { box-shadow: var(--shadow-md); }
  .endpoint-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--hairline);
  }
  .method-badge {
    padding: 3px 8px;

    font-family: 'Space Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .method-badge.get { background: rgba(47,74,62,0.1); color: var(--forest); }
  .method-badge.post { background: rgba(227,178,60,0.15); color: var(--mustard-deep); }
  .method-badge.put { background: rgba(232,113,74,0.12); color: var(--coral-deep); }
  .endpoint-path {
    flex: 1;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--ink);

  .endpoint-expand {

  .endpoint-block.expanded .endpoint-expand {
    transform: rotate(180deg);

  .endpoint-body {
    padding: 0 16px 16px;
    display: none;
  }
  .endpoint-block.expanded .endpoint-body {
    display: block;
  }
  .endpoint-desc {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 12px;
    padding-top: 12px;
  }
  .endpoint-sub-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    margin-top: 12px;
  }
  .param-row {
    display: grid;
    grid-template-columns: 1fr 80px 1fr;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--hairline);
    font-size: 12px;
  }
  .param-row:last-child { border-bottom: none; }
  .param-name {
    font-family: 'Space Mono', monospace;
    color: var(--coral-deep);
    font-weight: 500;
  }
  .param-type {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--forest);
    background: rgba(47,74,62,0.08);
    padding: 2px 6px;
    border-radius: 3px;
    text-align: center;
    align-self: flex-start;
    justify-self: start;
  }
  .param-desc {
    color: var(--ink-soft);
    font-size: 11px;
  }

  .code-block {

  .code-block .json-key { color: var(--mustard); }

    font-size: 9px;
    color: rgba(247,243,233,0.3);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ========================================
     ACTION SHEET / BOTTOM DRAWER
     ======================================== */
  .drawer-mask {
    position: absolute;
    inset: 0;
    background: rgba(42,37,30,0.4);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .drawer-mask.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .action-sheet {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--paper);
    border-radius: 20px 20px 0 0;
    z-index: 210;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    padding-bottom: 30px;
  }
  .action-sheet.visible {
    transform: translateY(0);
  }
  .action-sheet-handle {
    width: 36px; height: 4px;
    background: var(--paper-dark);
    border-radius: 2px;
    margin: 10px auto 8px;
  }
  .action-sheet-title {
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    padding: 8px 20px 16px;
    border-bottom: 1px solid var(--hairline);
  }
  .action-sheet-item {
    padding: 16px 20px;
    font-size: 15px;
    color: var(--ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--hairline);
    transition: background 0.2s;
  }
  .action-sheet-item:hover { background: var(--paper-warm); }
  .action-sheet-item svg {
    width: 20px; height: 20px;
    color: var(--forest);
  }
  .action-sheet-item.danger { color: var(--coral-deep); }
  .action-sheet-item.danger svg { color: var(--coral-deep); }
  .action-sheet-cancel {
    padding: 16px 20px;
    text-align: center;
    font-size: 15px;
    color: var(--ink-muted);
    cursor: pointer;
    background: var(--paper-warm);
    margin: 8px;
    border-radius: 12px;
    transition: background 0.2s;
  }
  .action-sheet-cancel:hover { background: var(--paper-dark); }

  /* ========================================
     SKELETON LOADING
     ======================================== */
  .skeleton-card {
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .skeleton-img {
    width: 100%;
    height: 160px;
    background: linear-gradient(90deg, var(--paper-warm) 25%, var(--paper-dark) 50%, var(--paper-warm) 75%);
    background-size: 200% 100%;
    animation: shimmerBg 1.5s ease-in-out infinite;
  }
  .skeleton-line {
    height: 12px;
    background: linear-gradient(90deg, var(--paper-warm) 25%, var(--paper-dark) 50%, var(--paper-warm) 75%);
    background-size: 200% 100%;
    animation: shimmerBg 1.5s ease-in-out infinite;
    border-radius: 4px;
    margin: 8px 12px;
  }
  .skeleton-line.short { width: 60%; }
  .skeleton-line.medium { width: 80%; }
  @keyframes shimmerBg {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ========================================
     RIPPLE EFFECT
     ======================================== */
  .ripple-container {
    position: relative;
    overflow: hidden;
  }
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    transform: scale(0);
    animation: rippleAnim 0.6s ease-out;
    pointer-events: none;
  }
  @keyframes rippleAnim {
    to { transform: scale(4); opacity: 0; }
  }

  /* ========================================
     TYPEWRITER EFFECT
     ======================================== */
  .typewriter-cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--mustard);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: cursorBlink 1s step-end infinite;
  }
  @keyframes cursorBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* ========================================
     PAPER TEXTURE OVERLAY
     ======================================== */
  .paper-texture::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1;
    mix-blend-mode: multiply;
  }

  /* ========================================
     SCROLL REVEAL
     ======================================== */
  .reveal-item {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .reveal-item.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* ========================================
     TOAST
     ======================================== */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(42,37,30,0.9);
    color: var(--paper);
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    z-index: 300;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    white-space: nowrap;
  }
  .toast.visible {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .reveal-item { opacity: 1; transform: none; }
  }
</style>
</head>

function createRipple(e, container) {
  if (!container) return;
  const rect = container.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
  ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
  container.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.textContent = msg;
  toast.classList.add('visible');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('visible'), 1800);
}

function openActionSheet(title, items) {
  const mask = document.getElementById('drawerMask');
  const sheet = document.getElementById('actionSheet');
  const titleEl = document.getElementById('actionSheetTitle');
  const itemsEl = document.getElementById('actionSheetItems');
  const cancelEl = document.getElementById('actionSheetCancel');

  titleEl.textContent = title;
  itemsEl.innerHTML = '';
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'action-sheet-item' + (item.danger ? ' danger' : '');
    div.innerHTML = `${item.icon || ''}<span>${item.label}</span>`;
    div.onclick = () => {
      closeActionSheet();
      if (item.onClick) item.onClick();
    };
    itemsEl.appendChild(div);
  });

  mask.classList.add('visible');
  sheet.classList.add('visible');

  const close = () => closeActionSheet();
  mask.onclick = close;
  cancelEl.onclick = close;
}

function closeActionSheet() {
  const mask = document.getElementById('drawerMask');
  const sheet = document.getElementById('actionSheet');
  mask.classList.remove('visible');
  sheet.classList.remove('visible');
}

  const [animating, setAnimating] = useState(false);

  const currentPage = pageStack[pageStack.length - 1];

  // Handle tab switch
  const handleTabSwitch = useCallback((tab) => {
    if (animating) return;
    if (tab === currentTab && pageStack.length === 1) return;
    setCurrentTab(tab);
    setPageStack([{ key: tab, type: 'tab' }]);
  }, [animating, currentTab, pageStack.length]);

  // Navigate to a new page (push)
  const navigateTo = useCallback((pageKey, params = {}) => {
    if (animating) return;
    setAnimating(true);
    setPageStack(prev => [...prev, { key: pageKey, type: 'push', params }]);
    setTimeout(() => setAnimating(false), 350);
  }, [animating]);

  // Go back (pop)
  const goBack = useCallback(() => {
    if (animating || pageStack.length <= 1) return;
    setAnimating(true);
    setPageStack(prev => prev.slice(0, -1));
    // Update current tab if needed
    const newTop = pageStack[pageStack.length - 2];
    if (newTop && newTop.type === 'tab') {
      setCurrentTab(newTop.key);
    }
    setTimeout(() => setAnimating(false), 320);
  }, [animating, pageStack]);

  const handleCapsule = useCallback(() => {
    openActionSheet('更多', [
      { label: '分享给朋友', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>', onClick: () => showToast('已复制分享链接') },
      { label: '收藏小程序', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>', onClick: () => showToast('已收藏') },

      { label: '投诉与反馈', danger: true, icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>', onClick: () => showToast('感谢反馈') },
    ]);
  }, []);

  useEffect(() => {
    const btn = document.getElementById('capsuleBtn');
    if (btn) btn.onclick = handleCapsule;
    return () => { if (btn) btn.onclick = null; };
  }, [handleCapsule]);

  // Tab bar visibility
  const showTabbar = currentPage.type === 'tab';
  useEffect(() => {
    const tabbar = document.getElementById('tabbar');
    if (tabbar) tabbar.style.display = showTabbar ? 'flex' : 'none';
  }, [showTabbar]);

  // Status bar time
  useEffect(() => {
    const updateTime = () => {
      const now = new Date();
      const h = now.getHours().toString().padStart(2, '0');
      const m = now.getMinutes().toString().padStart(2, '0');
      const el = document.getElementById('statusTime');
      if (el) el.textContent = `${h}:${m}`;
    };
    updateTime();
    const timer = setInterval(updateTime, 60000);
    return () => clearInterval(timer);
  }, []);

  // Render page content
  const renderPage = (page, idx, isTop) => {
    const isEntering = isTop && page.type === 'push' && animating;

    switch (page.key) {
      case 'home':
        return <HomePage key="home" navigateTo={navigateTo} isTop={isTop} />;
      case 'discovery':
        return <DiscoveryPage key="discovery" navigateTo={navigateTo} isTop={isTop} />;
      case 'events':
        return <EventsPage key="events" navigateTo={navigateTo} isTop={isTop} />;
      case 'profile':
        return <ProfilePage key="profile" navigateTo={navigateTo} isTop={isTop} />;
      case 'zineDetail':
        return <ZineDetailPage key="detail" zineId={page.params?.id} goBack={goBack} navigateTo={navigateTo} isTop={isTop} />;
      case 'spec':
        return <SpecPage key="spec" goBack={goBack} isTop={isTop} />;
      case 'api':
        return <ApiPage key="api" goBack={goBack} isTop={isTop} />;
      case 'publishers':
        return <PublishersPage key="publishers" goBack={goBack} navigateTo={navigateTo} isTop={isTop} />;
      default:
        return null;
    }
  };

  return (
    <>
      {pageStack.map((page, idx) => {
        const isTop = idx === pageStack.length - 1;
        const isSecond = idx === pageStack.length - 2;
        const pageEl = renderPage(page, idx, isTop);
        if (!pageEl) return null;

        let className = 'page';
        if (isTop && page.type === 'push' && animating) className += ' entering';
        if (isSecond && animating && pageStack[pageStack.length - 1].type === 'push') className += ' exiting';

        return React.cloneElement(pageEl, { pageKey: page.key, className, isSecond });
      })}
    </>
  );
}

// ========== DISCOVERY PAGE ==========
function DiscoveryPage({ navigateTo, className }) {
  const [activeTab, setActiveTab] = useState(0);
  const [isRefreshing, setIsRefreshing] = useState(false);
  const pageRef = useRef(null);
  const pullStartY = useRef(0);
  const pullDistance = useRef(0);
  const isPulling = useRef(false);

  // Pull-to-refresh handling
  useEffect(() => {
    const page = pageRef.current;
    if (!page) return;

    const onTouchStart = (e) => {
      if (page.scrollTop <= 0) {
        pullStartY.current = e.touches[0].clientY;
        isPulling.current = true;
      }
    };

    const onTouchMove = (e) => {
      if (!isPulling.current) return;
      const dy = e.touches[0].clientY - pullStartY.current;
      if (dy > 0 && page.scrollTop <= 0) {
        pullDistance.current = Math.min(dy * 0.5, 80);
        page.style.transform = `translateY(${pullDistance.current}px)`;
        e.preventDefault();
      }
    };

    const onTouchEnd = () => {
      if (!isPulling.current) return;
      isPulling.current = false;
      if (pullDistance.current > 50) {
        // trigger refresh
        setIsRefreshing(true);
        page.style.transform = 'translateY(40px)';
        setTimeout(() => {
          setIsRefreshing(false);
          page.style.transform = '';
          showToast('已为你更新 12 本新刊');
        }, 1500);
      } else {
        page.style.transform = '';
      }
      pullDistance.current = 0;
    };

    page.addEventListener('touchstart', onTouchStart, { passive: true });
    page.addEventListener('touchmove', onTouchMove, { passive: false });
    page.addEventListener('touchend', onTouchEnd);
    page.addEventListener('transitionend', () => {});
    page.style.transition = 'transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';

    return () => {
      page.removeEventListener('touchstart', onTouchStart);
      page.removeEventListener('touchmove', onTouchMove);
      page.removeEventListener('touchend', onTouchEnd);
    };
  }, []);

  // Scroll reveal for masonry items
  useEffect(() => {
    const page = pageRef.current;
    if (!page) return;
    const items = page.querySelectorAll('.masonry-item');
    items.forEach((item, i) => {
      item.style.opacity = '0';
      item.style.transform = 'translateY(20px)';
      setTimeout(() => {
        item.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
        item.style.opacity = '1';
        item.style.transform = 'translateY(0)';
      }, 100 + i * 60);
    });
  }, [activeTab]);

  return (
    <div className={`page ${className}`} data-page="discovery" ref={pageRef}>
      <div className="page-content">
        {/* Pull to refresh indicator */}
        <div className="pull-refresh-indicator" style={{ opacity: isRefreshing ? 1 : 0.5 }}>
          {isRefreshing ? (
            <div className="pull-refresh-spinner"></div>
          ) : (
            <Icons.ChevronDown style={{ width: 20, height: 20 }} />
          )}
          <span>{isRefreshing ? '正在更新...' : '下拉刷新'}</span>
        </div>

        <div className="discovery-header">
          <div className="discovery-topbar">
            <h1 className="discovery-title">发现</h1>
            <div
              className="discovery-filter-btn ripple-container"
              onClick={(e) => { createRipple(e, e.currentTarget); showToast('筛选面板'); }}
            >
              <Icons.Filter />
            </div>
          </div>

          <div className="sticky-tabs">
            {CAT_TABS.map((tab, i) => (
              <div
                key={tab}
                className={`sticky-tab ${activeTab === i ? 'active' : ''}`}
                onClick={() => setActiveTab(i)}
              >
                {tab}
              </div>
            ))}
          </div>
        </div>

        {/* Masonry grid */}
        <div className="masonry-grid">
          {[...ZINES, ...ZINES.slice(0, 4)].map((zine, i) => (
            <div
              key={`${zine.id}-${i}`}
              className="masonry-item"
              onClick={() => navigateTo('zineDetail', { id: zine.id })}
              style={{ transitionDelay: `${(i % 8) * 0.05}s` }}
            >
              <img
                src={zine.img}
                alt={zine.title}
                style={{
                  aspectRatio: i % 3 === 0 ? '3/4' : i % 3 === 1 ? '1/1' : '4/5',
                  objectFit: 'cover',
                }}
              />
              {zine.tag && (
                <span
                  className={`zine-card-tag ${zine.tagType}`}
                  style={{ position: 'absolute', top: 8, left: 8 }}
                >
                  {zine.tag}
                </span>
              )}
              <div className="masonry-item-body">
                <div className="masonry-item-title">{zine.title}</div>
                <div className="masonry-item-meta">
                  <span>{zine.publisher}</span>
                  <span className="masonry-item-price">¥{zine.price}</span>
                </div>
              </div>
            </div>
          ))}
        </div>

        <div style={{ textAlign: 'center', padding: '16px 20px 8px', fontSize: 12, color: 'var(--ink-muted)' }}>
          — 已经到底啦 —
        </div>
      </div>
    </div>
  );
}

function TabBar() {
  // handled by App state via DOM tabbar element
  return null;
}

// ========== MOUNT ==========
const root = ReactDOM.createRoot(document.getElementById('pageContainer'));

// Wrap app to handle tab bar clicks via DOM
const OriginalApp = App;

// Initialize tab bar event listeners
function initTabBar(handleTabSwitch) {
  const items = document.querySelectorAll('.tabbar-item');
  items.forEach(item => {
    item.addEventListener('click', () => {
      const tab = item.dataset.tab;
      items.forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      handleTabSwitch(tab);
    });
  });
}

// Render app with callback
function AppWithTabBar() {
  const appRef = useRef(null);

  useEffect(() => {
    // Pass tab switch function - use custom event
    const handler = (e) => {
      // handled via the closure below
    };
  }, []);

  return <App ref={appRef} />;
}

// Actually, let's just use a global approach since it's simpler
let globalTabSwitch = null;

function GlobalApp() {
  const [currentTab, setCurrentTab] = useState('home');
  const [pageStack, setPageStack] = useState([{ key: 'home', type: 'tab' }]);
  const [animating, setAnimating] = useState(false);
  const [reducedMotion, setReducedMotion] = useState(false);

  // Pause animations when page hidden
  useEffect(() => {
    const handleVisibility = () => {
      if (document.hidden) {
        // We handle per-component but add global flag
      }
    };
    document.addEventListener('visibilitychange', handleVisibility);
    return () => document.removeEventListener('visibilitychange', handleVisibility);
  }, []);

  // Reduced motion
  useEffect(() => {
    const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    setReducedMotion(mq.matches);
    const handler = (e) => setReducedMotion(e.matches);
    mq.addEventListener?.('change', handler);
    return () => mq.removeEventListener?.('change', handler);
  }, []);

  const currentPage = pageStack[pageStack.length - 1];

  const handleTabSwitch = useCallback((tab) => {
    if (animating) return;
    if (tab === currentTab && pageStack.length === 1) return;
    setCurrentTab(tab);
    setPageStack([{ key: tab, type: 'tab' }]);
  }, [animating, currentTab, pageStack.length]);

  const navigateTo = useCallback((pageKey, params = {}) => {
    if (animating) return;
    setAnimating(true);
    setPageStack(prev => [...prev, { key: pageKey, type: 'push', params }]);
    setTimeout(() => setAnimating(false), 350);
  }, [animating]);

  const goBack = useCallback(() => {
    if (animating || pageStack.length <= 1) return;
    setAnimating(true);
    setPageStack(prev => prev.slice(0, -1));
    const newTop = pageStack[pageStack.length - 2];
    if (newTop && newTop.type === 'tab') {
      setCurrentTab(newTop.key);
    }
    setTimeout(() => setAnimating(false), 320);
  }, [animating, pageStack]);

  // Capsule
  const handleCapsule = useCallback(() => {
    openActionSheet('更多', [
      { label: '分享给朋友', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>', onClick: () => showToast('已复制分享链接') },
      { label: '收藏小程序', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>', onClick: () => showToast('已收藏') },
      { label: '设置', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>', onClick: () => showToast('打开设置') },
      { label: '投诉与反馈', danger: true, icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>', onClick: () => showToast('感谢反馈') },
    ]);
  }, []);

  useEffect(() => {
    const btn = document.getElementById('capsuleBtn');
    if (btn) btn.onclick = handleCapsule;
    return () => { if (btn) btn.onclick = null; };
  }, [handleCapsule]);

  // Tab bar
  const showTabbar = currentPage.type === 'tab';
  useEffect(() => {
    const tabbar = document.getElementById('tabbar');
    if (tabbar) tabbar.style.display = showTabbar ? 'flex' : 'none';
  }, [showTabbar]);

  // Time
  useEffect(() => {
    const updateTime = () => {
      const now = new Date();
      const h = now.getHours().toString().padStart(2, '0');
      const m = now.getMinutes().toString().padStart(2, '0');
      const el = document.getElementById('statusTime');
      if (el) el.textContent = `${h}:${m}`;
    };
    updateTime();
    const timer = setInterval(updateTime, 60000);
    return () => clearInterval(timer);
  }, []);

  // Init tab bar listeners
  useEffect(() => {
    const items = document.querySelectorAll('.tabbar-item');
    const clickHandler = (tab) => {
      items.forEach(i => i.classList.remove('active'));
      items.forEach(i => { if (i.dataset.tab === tab) i.classList.add('active'); });
      handleTabSwitch(tab);
    };
    const listeners = [];
    items.forEach(item => {
      const fn = () => clickHandler(item.dataset.tab);
      item.addEventListener('click', fn);
      listeners.push({ item, fn });
    });
    return () => {
      listeners.forEach(({ item, fn }) => item.removeEventListener('click', fn));
    };
  }, [handleTabSwitch]);

  const renderPage = (page, idx, isTop) => {
    switch (page.key) {
      case 'home':
        return <HomePage key="h" navigateTo={navigateTo} isTop={isTop} />;
      case 'discovery':
        return <DiscoveryPage key="d" navigateTo={navigateTo} isTop={isTop} />;
      case 'events':
        return <EventsPage key="e" navigateTo={navigateTo} isTop={isTop} />;
      case 'profile':
        return <ProfilePage key="p" navigateTo={navigateTo} isTop={isTop} />;
      case 'zineDetail':
        return <ZineDetailPage key="z" zineId={page.params?.id} goBack={goBack} navigateTo={navigateTo} isTop={isTop} />;
      case 'spec':
        return <SpecPage key="s" goBack={goBack} isTop={isTop} />;
      case 'api':
        return <ApiPage key="a" goBack={goBack} isTop={isTop} />;
      case 'publishers':
        return <PublishersPage key="pub" goBack={goBack} navigateTo={navigateTo} isTop={isTop} />;
      default:
        return null;
    }
  };

  return (
    <>
      {pageStack.map((page, idx) => {
        const isTop = idx === pageStack.length - 1;
        const isSecond = idx === pageStack.length - 2;
        const pageEl = renderPage(page, idx, isTop);
        if (!pageEl) return null;

        let extraClass = '';
        if (isTop && page.type === 'push' && animating) extraClass = 'entering';
        else if (isSecond && animating && pageStack[pageStack.length - 1].type === 'push') extraClass = 'exiting';

        // Clone with added class
        return React.cloneElement(pageEl, {
          className: (pageEl.props.className || '') + ' ' + extraClass,
        });
      })}
    </>
  );
}

root.render(<GlobalApp />);

    });
  } else {
    document.querySelectorAll('.page').forEach(p => {
      p.style.animationPlayState = 'running';

  }
});

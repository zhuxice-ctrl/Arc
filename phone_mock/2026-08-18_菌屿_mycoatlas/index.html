function GuidePage({ onNavigate }) {
  const [activeCat, setActiveCat] = useState('all');
  const [swipeOpen, setSwipeOpen] = useState(null);
  const scrollRef = useRef(null);
  const [pullDistance, setPullDistance] = useState(0);
  const [isRefreshing, setIsRefreshing] = useState(false);
  const touchStartY = useRef(0);
  const isPulling = useRef(false);

  const categories = [
    { key: 'all', label: '全部' },
    { key: 'edible', label: '可食用' },
    { key: 'toxic', label: '有毒' },
    { key: 'rare', label: '珍稀' },
    { key: 'medicine', label: '药用' },
  ];

  // 下拉刷新 - 签名动效
  const handleTouchStart = (e) => {
    if (scrollRef.current && scrollRef.current.scrollTop <= 0) {
      touchStartY.current = e.touches[0].clientY;
      isPulling.current = true;
    }
  };
  const handleTouchMove = (e) => {
    if (!isPulling.current || isRefreshing) return;
    const diff = e.touches[0].clientY - touchStartY.current;
    if (diff > 0) {
      const damped = Math.min(diff * 0.5, 80);
      setPullDistance(damped);
    }
  };
  const handleTouchEnd = () => {
    if (!isPulling.current) return;
    isPulling.current = false;
    if (pullDistance > 50 && !isRefreshing) {
      setIsRefreshing(true);
      setPullDistance(50);
      setTimeout(() => {
        setIsRefreshing(false);
        setPullDistance(0);
      }, 1500);
    } else {
      setPullDistance(0);
    }
  };

  const filtered = MUSHROOMS.filter(m => {
    if (activeCat === 'all') return true;
    if (activeCat === 'edible') return m.edible;
    if (activeCat === 'toxic') return m.toxic;
    if (activeCat === 'rare') return m.rarity === '珍稀';
    if (activeCat === 'medicine') return m.id === 3;
    return true;
  });

  // 网格拼贴布局 - 错落有致
  const heights = [160, 200, 180, 220, 170, 190];

  return (
    <div className="scroll-page" ref={scrollRef}
      style={{ background: COLORS.cream }}
      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}
      onTouchEnd={handleTouchEnd}>
      <MPNavBar title="菌物图鉴" style="solid" />

      {/* 下拉刷新指示器 */}
      <div className="pull-indicator" style={{
        transform: `translateY(${pullDistance}px)`,
        top: 92,
      }}>
        {isRefreshing ? (
          <>
            <div className="pull-spinner" />
            <span>正在刷新...</span>
          </>
        ) : pullDistance > 50 ? (
          <span>松开刷新</span>
        ) : pullDistance > 0 ? (
          <span>下拉刷新</span>
        ) : null}
      </div>

      {/* 吸顶Tab */}
      <div className="sticky-tabs" style={{ top: 92, marginTop: 92 }}>
        {categories.map(cat => (
          <div key={cat.key}
            className={`sticky-tab ${activeCat === cat.key ? 'active' : ''}`}
            onClick={() => setActiveCat(cat.key)}>
            {cat.label}
          </div>
        ))}
        <div className="sticky-tab-indicator" style={{
          left: `${categories.findIndex(c => c.key === activeCat) * 56 + 20}px`,
          width: categories.find(c => c.key === activeCat)?.label.length * 15 + 'px',
        }} />
      </div>

      {/* 网格拼贴 - 瀑布流 */}
      <div style={{ padding: 16, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
        {filtered.map((m, i) => (
          <div key={m.id}
            className={`swipe-row spring-btn ${swipeOpen === m.id ? 'open' : ''}`}
            style={{ borderRadius: 14, overflow: 'hidden' }}>
            {/* 左滑操作 - 动效 */}
            <div className="swipe-row-actions">
              <div style={{
                width: 70, background: COLORS.moss,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                color: '#fff', fontSize: 12,
              }}>收藏</div>
              <div style={{
                width: 70, background: COLORS.ochre,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                color: '#fff', fontSize: 12,
              }}>分享</div>
            </div>
            <div className="swipe-row-content"
              style={{
                background: '#fff',
                borderRadius: 14,
                overflow: 'hidden',
                boxShadow: '0 2px 12px rgba(34,48,30,0.06)',
                cursor: 'pointer',
              }}
              onClick={() => onNavigate('detail', { id: m.id })}
              onTouchStart={(e) => { e.stopPropagation(); }}>
              <div style={{ height: heights[i % heights.length], overflow: 'hidden', position: 'relative' }}>
                <img src={m.img} alt="" style={{
                  width: '100%', height: '100%', objectFit: 'cover',
                }} />
                <div style={{
                  position: 'absolute', top: 8, right: 8,
                  width: 24, height: 24, borderRadius: '50%',
                  background: m.toxic ? COLORS.red : COLORS.moss,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  fontSize: 12,
                }}>
                  {m.toxic ? '☠' : '✓'}
                </div>
              </div>
              <div style={{ padding: '10px 12px' }}>
                <div style={{ fontSize: 14, fontWeight: 600, color: COLORS.forest, marginBottom: 2 }}>{m.name}</div>
                <div style={{ fontSize: 10, color: COLORS.gray2, fontStyle: 'italic', marginBottom: 8 }}>{m.sci}</div>
                <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                  <span style={{
                    fontSize: 10, color: m.rarity === '珍稀' ? COLORS.ochre : COLORS.gray1,
                    fontWeight: m.rarity === '珍稀' ? 500 : 400,
                  }}>{m.rarity}</span>
                  <span style={{ fontSize: 10, color: COLORS.gray2 }}>{m.season}</span>
                </div>
              </div>
            </div>
          </div>
        ))}
      </div>

      <div style={{ padding: '20px 0 100px', textAlign: 'center', fontSize: 12, color: COLORS.gray2 }}>
        共 {filtered.length} 种菌物

}

// ========== 主应用 ==========
function App() {
  const [currentTab, setCurrentTab] = useState('home');
  const [pageStack, setPageStack] = useState([{ key: 'home', params: {} }]);
  const [transition, setTransition] = useState(null); // 'forward' | 'back' | null
  const animTimerRef = useRef(null);

  const currentPage = pageStack[pageStack.length - 1];

  // 页面导航
  const navigate = useCallback((key, params = {}) => {
    // 清理之前的动画定时器
    if (animTimerRef.current) {
      clearTimeout(animTimerRef.current);
      animTimerRef.current = null;
    }

    // Tab 切换
    const tabKeys = ['home', 'guide', 'calendar', 'community', 'profile'];
    if (tabKeys.includes(key)) {
      setCurrentTab(key);
      setTransition('tab');
      setPageStack([{ key, params }]);
      animTimerRef.current = setTimeout(() => setTransition(null), 300);
      return;
    }

    // Push 新页面
    setTransition('forward');
    setPageStack(prev => [...prev, { key, params }]);
    animTimerRef.current = setTimeout(() => setTransition(null), 350);
  }, []);

  const goBack = useCallback(() => {
    if (animTimerRef.current) {
      clearTimeout(animTimerRef.current);
      animTimerRef.current = null;
    }
    if (pageStack.length <= 1) return;
    setTransition('back');
    animTimerRef.current = setTimeout(() => {
      setPageStack(prev => prev.slice(0, -1));
      setTransition(null);
    }, 300);
  }, [pageStack.length]);

  // Tab 切换
  const handleTabChange = useCallback((tab) => {
    if (tab === currentTab) return;
    navigate(tab);
  }, [currentTab, navigate]);

  // 渲染当前页面
  const renderPage = (page) => {
    switch (page.key) {
      case 'home':
        return <HomePage onNavigate={navigate} />;
      case 'guide':
        return <GuidePage onNavigate={navigate} />;
      case 'detail':
        const mushroom = MUSHROOMS.find(m => m.id === page.params.id);
        return <DetailPage mushroom={mushroom} onBack={goBack} />;
      case 'calendar':
        return <CalendarPage />;
      case 'community':
        return <CommunityPage onNavigate={navigate} />;
      case 'profile':
        return <ProfilePage onNavigate={navigate} />;
      case 'spec':
        return <SpecPage onBack={goBack} />;
      case 'api':
        return <ApiPage onBack={goBack} />;
      default:
        return <HomePage onNavigate={navigate} />;
    }
  };

  const showTabBar = ['home', 'guide', 'calendar', 'community', 'profile'].includes(currentPage.key);

  return (
    <MPhone>
      <div className="screen-container">
        {/* 页面栈 */}
        {pageStack.map((page, i) => {
          const isTop = i === pageStack.length - 1;
          const isSecond = i === pageStack.length - 2;

          let animClass = '';
          if (transition === 'forward' && isTop) animClass = 'enter-right';
          if (transition === 'back' && isSecond) animClass = 'enter-left';
          if (transition === 'back' && isTop) animClass = 'leave-right';
          // tab 切换不加动画（用内容淡入代替）

          return (
            <div key={`${page.key}-${i}`}
              className={`page-wrapper ${animClass}`}
              style={{
                display: isTop || (transition === 'back' && isSecond) ? 'block' : 'none',
                zIndex: i + 1,
              }}>
              {renderPage(page)}
            </div>
          );
        })}

        {/* TabBar */}
        {showTabBar && (
          <MPTabBar activeTab={currentTab} onTabChange={handleTabChange} />
        )}
      </div>
    </MPhone>
  );
}

// ========== 自定义光标 ==========
let cursorEl = null;
let cursorX = window.innerWidth / 2;
let cursorY = window.innerHeight / 2;
let targetX = cursorX;
let targetY = cursorY;
let cursorRaf = null;
let cursorVisible = false;

function initCustomCursor() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) return;

  cursorEl = document.createElement('div');
  cursorEl.className = 'custom-cursor';
  document.body.appendChild(cursorEl);

  // 初始位置：屏幕中央
  cursorX = window.innerWidth / 2;
  cursorY = window.innerHeight / 2;
  updateCursorPosition();
  cursorVisible = true;

  const onMove = (e) => {
    targetX = e.clientX;
    targetY = e.clientY;
    if (!cursorRaf) {
      cursorRaf = requestAnimationFrame(animateCursor);
    }
  };

  const onClick = (e) => {
    if (!cursorEl) return;
    cursorEl.classList.add('click');
    setTimeout(() => cursorEl && cursorEl.classList.remove('click'), 200);

    // 涟漪效果
    createRippleEffect(e.clientX, e.clientY);
  };

  const onMouseOver = (e) => {
    if (!cursorEl) return;
    const target = e.target;
    if (target.closest && (
      target.closest('button') ||
      target.closest('.spring-btn') ||
      target.closest('.tabbar-item') ||
      target.closest('.sticky-tab') ||
      target.closest('.mp-back-btn') ||
      target.closest('.mp-capsule') ||
      target.closest('a')
    )) {
      cursorEl.classList.add('hover');
    } else {
      cursorEl.classList.remove('hover');
    }
  };

  document.addEventListener('mousemove', onMove);
  document.addEventListener('click', onClick);
  document.addEventListener('mouseover', onMouseOver);

  // 页面可见性变化时暂停/恢复
  const onVisibilityChange = () => {
    if (document.hidden && cursorRaf) {
      cancelAnimationFrame(cursorRaf);
      cursorRaf = null;
    } else if (!document.hidden) {
      cursorRaf = requestAnimationFrame(animateCursor);
    }
  };
  document.addEventListener('visibilitychange', onVisibilityChange);
}

function animateCursor() {
  // 弹簧式跟随
  const ease = 0.15;
  cursorX += (targetX - cursorX) * ease;
  cursorY += (targetY - cursorY) * ease;

  updateCursorPosition();

  if (Math.abs(targetX - cursorX) > 0.5 || Math.abs(targetY - cursorY) > 0.5) {
    cursorRaf = requestAnimationFrame(animateCursor);
  } else {
    cursorRaf = null;
  }
}

function updateCursorPosition() {
  if (!cursorEl) return;
  cursorEl.style.left = cursorX + 'px';
  cursorEl.style.top = cursorY + 'px';
}

function createRippleEffect(x, y) {
  const ripple = document.createElement('div');
  ripple.className = 'cursor-ripple';
  ripple.style.left = x + 'px';
  ripple.style.top = y + 'px';
  ripple.style.width = '20px';
  ripple.style.height = '20px';
  document.body.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
}

// 简化版（React 内调用）
function createRipple(e) {
  if (!cursorEl) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const x = rect.left + rect.width / 2;
  const y = rect.top + rect.height / 2;
  createRippleEffect(x, y);
}

// ========== 启动 ==========
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// 初始化自定义光标（DOM 就绪后）
if (document.readyState === 'complete') {
  initCustomCursor();
} else {
  window.addEventListener('load', initCustomCursor);
}

// 宣告可升级
function announceUpgrade() {
  window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
}
announceUpgrade();
if (document.readyState !== 'complete') window.addEventListener('load', announceUpgrade, { once: true });
</script>

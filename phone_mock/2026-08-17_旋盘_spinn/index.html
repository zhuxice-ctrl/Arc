<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>旋盘 SPINN · 极限飞盘社群</title>
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: linear-gradient(135deg, #1A1D23 0%, #14161A 50%, #1E2420 100%);
      font-family: -apple-system, "SF Pro Display", "PingFang SC", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      cursor: none;
    }
    @media (max-height: 960px) { body { padding: 20px; } }
    @media (max-width: 480px) { body { padding: 10px; } }

    /* ===== CUSTOM CURSOR ===== */
    .cursor-ring, .cursor-dot, .cursor-glow {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      will-change: transform;
    }
    .cursor-ring {
      width: 38px;
      height: 38px;
      border: 2.5px solid #fff;
      border-radius: 50%;
      transition: width 0.2s cubic-bezier(.2,.8,.2,1), height 0.2s cubic-bezier(.2,.8,.2,1),
                  border-color 0.2s, background 0.2s, opacity 0.3s;
      mix-blend-mode: difference;
      opacity: 0.95;
    }
    .cursor-ring.hovering {
      width: 54px;
      height: 54px;
      border-color: #C6F24E;
      background: rgba(198, 242, 78, 0.15);
    }
    .cursor-dot {
      width: 6px;
      height: 6px;
      background: #C6F24E;
      border-radius: 50%;
      box-shadow: 0 0 8px #C6F24E, 0 0 16px rgba(198, 242, 78, 0.5);
      transition: transform 0.1s ease-out;
    }
    .cursor-dot.clicking {
      transform: translate(-50%, -50%) scale(0.5);
    }
    .cursor-glow {
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(198,242,78,0.18) 0%, transparent 70%);
      border-radius: 50%;
      transition: opacity 0.3s;
      opacity: 0.6;
    }
    .cursor-ripple {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%) scale(0);
      width: 20px;
      height: 20px;
      border: 2px solid #C6F24E;
      border-radius: 50%;
      opacity: 1;
      animation: rippleExpand 0.6s cubic-bezier(.2,.8,.2,1) forwards;
    }
    @keyframes rippleExpand {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
    }

    /* ===== STAGE ===== */
    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .app-title {
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.7;
    }
    .app-title span {
      color: #C6F24E;
      font-weight: 700;
    }
    .app-tagline {
      color: #8A8F98;
      font-size: 12px;
      margin-top: -8px;
    }

    /* ===== PHONE APP INTERIOR ===== */
    .screen-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .page {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      background: #14161A;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .page::-webkit-scrollbar { display: none; }
    .page.entering {
      animation: pageSlideIn 0.4s cubic-bezier(.2,.8,.2,1) forwards;
    }
    .page.leaving {
      animation: pageSlideOut 0.35s cubic-bezier(.2,.8,.2,1) forwards;
    }
    @keyframes pageSlideIn {
      from { transform: translateX(30%); opacity: 0.5; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes pageSlideOut {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(-30%); opacity: 0.5; }
    }

    /* ===== COLOR TOKENS ===== */
    :root {
      --lime: #C6F24E;
      --lime-dim: #A8D935;
      --charcoal: #14161A;
      --surface-dark: #1C1F24;
      --surface-card: #22252B;
      --warm-white: #FAFAF7;
      --gray-med: #8A8F98;
      --gray-light: #E8EAED;
      --accent-orange: #FF7A45;
      --divider: rgba(255,255,255,0.08);
    }

    /* ===== TAB BAR ===== */
    .tab-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 83px;
      background: rgba(20, 22, 26, 0.85);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-top: 0.5px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: flex-start;
      justify-content: space-around;
      padding-top: 8px;
      z-index: 30;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 60px;
      padding: 4px 0;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s ease;
    }
    .tab-item:active { transform: scale(0.92); }
    .tab-item svg {
      width: 26px;
      height: 26px;
      stroke: #8A8F98;
      fill: none;
      stroke-width: 1.8;
      transition: stroke 0.2s, fill 0.2s;
    }
    .tab-item.active svg {
      stroke: #C6F24E;
    }
    .tab-item.active.tab-disc svg {
      animation: discSpin 2.4s cubic-bezier(.4,0,.2,1) infinite;
    }
    @keyframes discSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .tab-label {
      font-size: 10px;
      color: #8A8F98;
      font-weight: 500;
      transition: color 0.2s;
      letter-spacing: -0.2px;
    }
    .tab-item.active .tab-label { color: #C6F24E; }

    /* ===== NAV BAR (large title) ===== */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 25;
      background: rgba(20, 22, 26, 0.85);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      padding: calc(var(--ios-safe-top) + 8px) 20px 12px;
    }
    .nav-bar.compact {
      padding: calc(var(--ios-safe-top) + 8px) 20px 12px;
    }
    .nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .nav-back-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .nav-back-btn:active { transform: scale(0.9); }
    .nav-back-btn:hover { background: rgba(255,255,255,0.18); }
    .nav-back-btn svg {
      width: 16px; height: 16px;
      stroke: #fff;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav-title-large {
      font-size: 34px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1px;
      padding: 0 20px;
    }
    .nav-title-small {
      font-size: 17px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.4px;
    }
    .nav-actions { display: flex; gap: 12px; }
    .nav-icon-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .nav-icon-btn:active { transform: scale(0.9); }
    .nav-icon-btn:hover { background: rgba(255,255,255,0.18); }
    .nav-icon-btn svg {
      width: 18px; height: 18px;
      stroke: #fff;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ===== HOME / FEED ===== */
    .feed-content {
      padding: 0 16px 100px;
    }
    .hero-orb {
      position: relative;
      height: 280px;
      margin: 12px -16px 0;
      overflow: hidden;
      border-radius: 0 0 32px 32px;
    }
    .hero-bg {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 30% 30%, rgba(198,242,78,0.35) 0%, rgba(20,22,26,0) 60%),
                  linear-gradient(160deg, #1E2815 0%, #14161A 70%);
    }
    .hero-disc {
      position: absolute;
      right: -30px;
      top: 30px;
      width: 200px;
      height: 200px;
      animation: heroDiscFloat 4s ease-in-out infinite;
    }
    @keyframes heroDiscFloat {
      0%, 100% { transform: translateY(0) rotate(-12deg); }
      50% { transform: translateY(-12px) rotate(8deg); }
    }
    .hero-disc-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 20px 40px rgba(198,242,78,0.3));
    }
    .hero-text {
      position: relative;
      padding: 30px 24px 0;
      z-index: 2;
    }
    .hero-tag {
      display: inline-block;
      padding: 5px 12px;
      background: rgba(198, 242, 78, 0.18);
      color: #C6F24E;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      margin-bottom: 10px;
      border: 1px solid rgba(198,242,78,0.3);
    }
    .hero-title {
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.8px;
      line-height: 1.2;
      margin-bottom: 6px;
    }
    .hero-sub {
      font-size: 14px;
      color: #8A8F98;
      line-height: 1.5;
    }
    .hero-stats {
      position: relative;
      display: flex;
      gap: 10px;
      margin: 22px 24px 0;
      z-index: 2;
    }
    .hero-stat {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 12px;
      backdrop-filter: blur(10px);
    }
    .hero-stat-num {
      font-size: 22px;
      font-weight: 800;
      color: #C6F24E;
      letter-spacing: -0.5px;
    }
    .hero-stat-label {
      font-size: 11px;
      color: #8A8F98;
      margin-top: 2px;
    }

    /* Section header */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 4px 12px;
    }
    .section-title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }
    .section-more {
      font-size: 13px;
      color: #C6F24E;
      font-weight: 500;
      cursor: pointer;
    }

    /* Activity card */
    .activity-card {
      background: #1C1F24;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.05);
      transition: transform 0.2s cubic-bezier(.2,.8,.2,1), box-shadow 0.2s, border-color 0.2s;
      position: relative;
      overflow: hidden;
    }
    .activity-card:active { transform: scale(0.98); }
    .activity-card:hover {
      border-color: rgba(198,242,78,0.3);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }
    .activity-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .activity-date-badge {
      width: 52px;
      height: 52px;
      background: rgba(198, 242, 78, 0.12);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(198,242,78,0.2);
    }
    .activity-date-day {
      font-size: 20px;
      font-weight: 800;
      color: #C6F24E;
      line-height: 1;
    }
    .activity-date-month {
      font-size: 10px;
      color: #C6F24E;
      opacity: 0.7;
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .activity-level {
      padding: 4px 10px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
    }
    .level-beginner { background: rgba(198,242,78,0.15); color: #C6F24E; }
    .level-intermediate { background: rgba(255,122,69,0.15); color: #FF7A45; }
    .level-advanced { background: rgba(255,90,90,0.15); color: #ff5a5a; }

    .activity-title {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }
    .activity-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: #8A8F98;
      margin-bottom: 12px;
    }
    .activity-meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .activity-meta-item svg {
      width: 14px; height: 14px;
      stroke: #8A8F98; stroke-width: 1.8;
      fill: none; stroke-linecap: round; stroke-linejoin: round;
    }
    .activity-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid var(--divider);
    }
    .activity-avatars {
      display: flex;
    }
    .activity-avatar {
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 2px solid #1C1F24;
      margin-left: -6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 600;
      color: #fff;
    }
    .activity-avatar:first-child { margin-left: 0; }
    .activity-join-btn {
      padding: 7px 16px;
      background: #C6F24E;
      color: #14161A;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: transform 0.15s, box-shadow 0.2s;
    }
    .activity-join-btn:active { transform: scale(0.92); }
    .activity-join-btn:hover {
      box-shadow: 0 4px 14px rgba(198,242,78,0.4);
    }
    .activity-join-btn.joined {
      background: rgba(198,242,78,0.15);
      color: #C6F24E;
    }

    /* FAB */
    .fab {
      position: absolute;
      right: 20px;
      bottom: 100px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #C6F24E;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      box-shadow: 0 8px 24px rgba(198,242,78,0.4), 0 2px 6px rgba(0,0,0,0.3);
      transition: transform 0.3s cubic-bezier(.2,.8,.2,1), box-shadow 0.3s;
    }
    .fab:active { transform: scale(0.9); }
    .fab:hover {
      transform: scale(1.08) rotate(90deg);
      box-shadow: 0 12px 32px rgba(198,242,78,0.5);
    }
    .fab svg {
      width: 24px; height: 24px;
      stroke: #14161A; stroke-width: 2.5;
      fill: none; stroke-linecap: round; stroke-linejoin: round;
    }
    .fab-menu {
      position: absolute;
      right: 20px;
      bottom: 170px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 20;
    }
    .fab-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: flex-end;
      cursor: pointer;
      animation: fabItemBounce 0.4s cubic-bezier(.2,.8,.2,1) backwards;
    }
    .fab-menu-item:nth-child(1) { animation-delay: 0.05s; }
    .fab-menu-item:nth-child(2) { animation-delay: 0.1s; }
    .fab-menu-item:nth-child(3) { animation-delay: 0.15s; }
    @keyframes fabItemBounce {
      0% { transform: translateY(20px) scale(0.8); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .fab-menu-label {
      padding: 6px 12px;
      background: rgba(28,31,36,0.95);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 100px;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      backdrop-filter: blur(10px);
    }
    .fab-menu-icon {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: #22252B;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .fab-menu-icon svg {
      width: 18px; height: 18px;
      stroke: #C6F24E; stroke-width: 1.8;
      fill: none; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ===== ACTIVITY DETAIL ===== */
    .detail-hero {
      position: relative;
      height: 320px;
      overflow: hidden;
    }
    .detail-hero-bg {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 80%, rgba(198,242,78,0.3) 0%, #14161A 75%),
                  linear-gradient(180deg, #1E2815 0%, #14161A 100%);
    }
    .detail-hero-disc {
      position: absolute;
      left: 50%;
      top: 55%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      animation: detailDiscSpin 18s linear infinite;
    }
    @keyframes detailDiscSpin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    .detail-overlay-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: calc(var(--ios-safe-top) + 8px) 16px 0;
      display: flex;
      justify-content: space-between;
      z-index: 5;
    }
    .detail-back-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .detail-back-btn svg {
      width: 16px; height: 16px;
      stroke: #fff; stroke-width: 2.2; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .detail-body {
      position: relative;
      background: #14161A;
      border-radius: 32px 32px 0 0;
      margin-top: -32px;
      padding: 24px 20px 120px;
      z-index: 3;
    }
    .detail-tag-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .detail-pill {
      padding: 5px 12px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
    }
    .detail-title {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.7px;
      line-height: 1.2;
      margin-bottom: 8px;
    }
    .detail-subtitle {
      font-size: 14px;
      color: #8A8F98;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .detail-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .detail-info-item {
      background: #1C1F24;
      border-radius: 14px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .detail-info-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: rgba(198,242,78,0.15);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 8px;
    }
    .detail-info-icon svg {
      width: 16px; height: 16px;
      stroke: #C6F24E; stroke-width: 1.8; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .detail-info-label {
      font-size: 11px;
      color: #8A8F98;
      margin-bottom: 2px;
    }
    .detail-info-value {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }
    .detail-section-title {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      margin: 20px 0 12px;
    }
    .detail-desc {
      font-size: 14px;
      color: #B0B4BB;
      line-height: 1.7;
    }
    .detail-participants {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .detail-participant {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 52px;
    }
    .detail-part-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700;
      color: #14161A;
    }
    .detail-part-name {
      font-size: 11px;
      color: #B0B4BB;
      text-align: center;
      line-height: 1.2;
      max-width: 52px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .detail-cta-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 90px;
      background: rgba(20,22,26,0.9);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--divider);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      z-index: 4;
    }
    .detail-cta-price {
      flex: 1;
    }
    .detail-cta-price-num {
      font-size: 22px;
      font-weight: 800;
      color: #C6F24E;
      letter-spacing: -0.5px;
    }
    .detail-cta-price-num small {

    /* ===== MAP PAGE ===== */
    .map-container {
      position: relative;
      height: 100%;
      background: #14161A;
    }
    .map-canvas {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 30% 40%, rgba(198,242,78,0.12) 0%, transparent 40%),
        radial-gradient(circle at 70% 60%, rgba(255,122,69,0.1) 0%, transparent 35%),
        linear-gradient(180deg, #181B20 0%, #14161A 100%);
    }
    .map-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .map-pin {
      position: absolute;
      transform: translate(-50%, -100%);
      cursor: pointer;
      animation: pinBounce 2s ease-in-out infinite;
    }
    .map-pin:nth-child(2) { animation-delay: 0.3s; }
    .map-pin:nth-child(3) { animation-delay: 0.6s; }
    .map-pin:nth-child(4) { animation-delay: 0.9s; }
    @keyframes pinBounce {
      0%, 100% { transform: translate(-50%, -100%) translateY(0); }
      50% { transform: translate(-50%, -100%) translateY(-6px); }
    }
    .map-pin-marker {
      width: 36px; height: 36px;
      border-radius: 50% 50% 50% 0;
      background: #C6F24E;
      transform: rotate(-45deg);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(198,242,78,0.5);
      position: relative;
    }
    .map-pin-marker::after {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #14161A;
      transform: rotate(45deg);
    }
    .map-pin.active .map-pin-marker {
      background: #FF7A45;
      box-shadow: 0 4px 20px rgba(255,122,69,0.6);
    }
    .map-bottom-sheet {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: #1C1F24;
      border-radius: 24px 24px 0 0;
      padding: 8px 20px 24px;
      z-index: 10;
      box-shadow: 0 -4px 30px rgba(0,0,0,0.4);
      animation: sheetUp 0.4s cubic-bezier(.2,.8,.2,1);
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sheet-handle {
      width: 40px;
      height: 5px;
      background: rgba(255,255,255,0.2);
      border-radius: 3px;
      margin: 0 auto 12px;
      cursor: grab;

    .sheet-venue-name {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;

    .sheet-venue-addr {

      align-items: center;

    .sheet-venue-addr svg {

      stroke-linecap: round; stroke-linejoin: round;

    .sheet-stats {

    .sheet-stat {

    /* Progress ring for tutorial progress */

    // ──────────────────────────────────────────────
    // CUSTOM CURSOR
    // ──────────────────────────────────────────────
    function CustomCursor() {
      const ringRef = useRef(null);
      const dotRef = useRef(null);
      const glowRef = useRef(null);
      const rafRef = useRef(null);
      const targetRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
      const currentRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
      const reducedMotion = useMemo(() =>
        window.matchMedia('(prefers-reduced-motion: reduce)').matches, []);

      useEffect(() => {
        if (reducedMotion) return;

        const onMove = (e) => {
          targetRef.current = { x: e.clientX, y: e.clientY };
        };

        const animate = () => {
          const t = targetRef.current;
          const c = currentRef.current;
          // Ease toward target (damped follow)
          c.x += (t.x - c.x) * 0.2;
          c.y += (t.y - c.y) * 0.2;

          if (ringRef.current) {
            ringRef.current.style.transform = `translate(${c.x}px, ${c.y}px) translate(-50%, -50%)`;
          }
          if (dotRef.current) {
            dotRef.current.style.transform = `translate(${t.x}px, ${t.y}px) translate(-50%, -50%)`;
          }
          if (glowRef.current) {
            const gx = c.x + (t.x - c.x) * 0.3;
            const gy = c.y + (t.y - c.y) * 0.3;
            glowRef.current.style.transform = `translate(${gx}px, ${gy}px) translate(-50%, -50%)`;
          }

          rafRef.current = requestAnimationFrame(animate);
        };

        rafRef.current = requestAnimationFrame(animate);
        window.addEventListener('mousemove', onMove);

        // Hover detection
        const onOver = (e) => {
          const interactive = e.target.closest('button, .tab-item, .nav-icon-btn, .nav-back-btn, .activity-card, .team-card, .tutorial-card-featured, .tutorial-item, .fab, .fab-menu-item, .profile-list-item, .achievement-item, .rank-item, .api-endpoint, .map-pin, .sheet-btn, .detail-back-btn, .modal-btn');
          if (interactive && ringRef.current) {
            ringRef.current.classList.add('hovering');
            document.body.style.cursor = 'none';
          } else if (ringRef.current) {
            ringRef.current.classList.remove('hovering');
          }
        };

        const onClick = (e) => {
          if (dotRef.current) {
            dotRef.current.classList.add('clicking');
            setTimeout(() => dotRef.current?.classList.remove('clicking'), 150);
          }
          // Ripple
          const ripple = document.createElement('div');
          ripple.className = 'cursor-ripple';
          ripple.style.left = e.clientX + 'px';
          ripple.style.top = e.clientY + 'px';
          document.body.appendChild(ripple);
          setTimeout(() => ripple.remove(), 600);
        };

        document.addEventListener('mouseover', onOver);
        document.addEventListener('click', onClick);

        // Pause on visibility change
        const onVisibility = () => {
          if (document.hidden) {
            if (rafRef.current) cancelAnimationFrame(rafRef.current);
          } else {
            rafRef.current = requestAnimationFrame(animate);
          }
        };
        document.addEventListener('visibilitychange', onVisibility);

        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          window.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseover', onOver);
          document.removeEventListener('click', onClick);
          document.removeEventListener('visibilitychange', onVisibility);
        };
      }, [reducedMotion]);

      if (reducedMotion) return null;

      return (
        <>
          <div ref={glowRef} className="cursor-glow" />
          <div ref={ringRef} className="cursor-ring" />
          <div ref={dotRef} className="cursor-dot" />
        </>
      );
    }

      const [showModal, setShowModal] = useState(false);
      const [pullDistance, setPullDistance] = useState(0);
      const [isRefreshing, setIsRefreshing] = useState(false);
      const pageRef = useRef(null);
      const startYRef = useRef(0);
      const isDraggingRef = useRef(false);

      const toggleJoin = (e, id) => {
        e.stopPropagation();
        setJoinedIds(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id); else next.add(id);
          return next;
        });
      };

      // Pull to refresh
      const onTouchStart = (e) => {
        if (pageRef.current && pageRef.current.scrollTop <= 0) {
          isDraggingRef.current = true;
          startYRef.current = e.touches ? e.touches[0].clientY : e.clientY;
        }
      };
      const onTouchMove = (e) => {
        if (!isDraggingRef.current) return;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        const dy = cy - startYRef.current;
        if (dy > 0) {
          // Damping
          const damped = Math.min(dy * 0.5, 80);
          setPullDistance(damped);
        }
      };
      const onTouchEnd = () => {
        if (!isDraggingRef.current) return;
        isDraggingRef.current = false;
        if (pullDistance > 50) {
          setIsRefreshing(true);
          setTimeout(() => {
            setIsRefreshing(false);
            setPullDistance(0);
          }, 1500);
        } else {
          setPullDistance(0);
        }
      };

      // Mouse drag for desktop demo
      const onMouseDown = (e) => {
        if (pageRef.current && pageRef.current.scrollTop <= 0) {
          isDraggingRef.current = true;
          startYRef.current = e.clientY;
        }
      };

      useEffect(() => {
        const up = () => {
          if (!isDraggingRef.current) return;
          isDraggingRef.current = false;
          if (pullDistance > 50) {
            setIsRefreshing(true);
            setTimeout(() => {
              setIsRefreshing(false);
              setPullDistance(0);
            }, 1500);
          } else {
            setPullDistance(0);
          }
        };
        const move = (e) => {
          if (!isDraggingRef.current) return;
          const dy = e.clientY - startYRef.current;
          if (dy > 0) {
            const damped = Math.min(dy * 0.5, 80);
            setPullDistance(damped);
          }
        };
        window.addEventListener('mouseup', up);
        window.addEventListener('mousemove', move);
        return () => {
          window.removeEventListener('mouseup', up);
          window.removeEventListener('mousemove', move);
        };
      }, [pullDistance]);

    function TeamPage() {
      const [activeTab, setActiveTab] = useState('teams');
      const [following, setFollowing] = useState(new Set([1, 2]));
      const tabRef = useRef(null);
      const indicatorRef = useRef(null);

      const toggleFollow = (e, id) => {
        e.stopPropagation();
        setFollowing(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id); else next.add(id);
          return next;
        });
      };

      useEffect(() => {
        // Update indicator position
        if (tabRef.current && indicatorRef.current) {
          const tabs = tabRef.current.querySelectorAll('.team-tab');
          let targetTab = null;
          tabs.forEach(t => {
            if (t.dataset.tab === activeTab) targetTab = t;
          });
          if (targetTab) {
            const rect = targetTab.getBoundingClientRect();
            const parentRect = tabRef.current.getBoundingClientRect();
            indicatorRef.current.style.left = (rect.left - parentRect.left) + 'px';
            indicatorRef.current.style.width = rect.width + 'px';

      return (

    // ──────────────────────────────────────────────
    // MAIN APP
    // ──────────────────────────────────────────────
    function App() {
      const [currentPage, setCurrentPage] = useState('home');
      const [prevPage, setPrevPage] = useState(null);
      const [direction, setDirection] = useState('forward');
      const [detailActivity, setDetailActivity] = useState(null);
      const [isTransitioning, setIsTransitioning] = useState(false);
      const timerRef = useRef(null);

      const navigate = useCallback((page) => {
        if (page === currentPage || isTransitioning) return;
        if (timerRef.current) clearTimeout(timerRef.current);

        setDirection(currentPage === 'detail' || currentPage === 'spec' || currentPage === 'api' ? 'back' : 'forward');
        setPrevPage(currentPage);
        setIsTransitioning(true);

        // If navigating to detail, we handle differently
        timerRef.current = setTimeout(() => {
          setCurrentPage(page);
          setIsTransitioning(false);
          setPrevPage(null);
        }, 350);
      }, [currentPage, isTransitioning]);

      const openDetail = useCallback((activity) => {
        if (isTransitioning) return;
        if (timerRef.current) clearTimeout(timerRef.current);
        setDetailActivity(activity);
        setDirection('forward');
        setPrevPage(currentPage);
        setIsTransitioning(true);
        timerRef.current = setTimeout(() => {
          setCurrentPage('detail');
          setIsTransitioning(false);
          setPrevPage(null);
        }, 350);
      }, [currentPage, isTransitioning]);

      const goBack = useCallback(() => {
        if (isTransitioning) return;
        if (timerRef.current) clearTimeout(timerRef.current);
        setDirection('back');
        setPrevPage(currentPage);
        setIsTransitioning(true);
        timerRef.current = setTimeout(() => {
          // Determine which tab to go back to
          if (currentPage === 'detail') {
            setCurrentPage('home');
          } else if (currentPage === 'spec' || currentPage === 'api') {
            setCurrentPage('profile');
          } else {
            setCurrentPage('home');
          }
          setIsTransitioning(false);
          setPrevPage(null);
        }, 350);
      }, [currentPage, isTransitioning]);

      // Cleanup on unmount
      useEffect(() => {
        return () => {
          if (timerRef.current) clearTimeout(timerRef.current);
        };
      }, []);

      // Pause animations on visibility change
      useEffect(() => {
        const onVisibility = () => {
          if (document.hidden) {
            if (timerRef.current) clearTimeout(timerRef.current);
          }
        };
        document.addEventListener('visibilitychange', onVisibility);
        return () => document.removeEventListener('visibilitychange', onVisibility);
      }, []);

      const isTabPage = ['home', 'map', 'team', 'tutorial', 'profile'].includes(currentPage);
      const prevIsTabPage = prevPage && ['home', 'map', 'team', 'tutorial', 'profile'].includes(prevPage);

      const renderPage = (pageKey) => {
        switch (pageKey) {
          case 'home':
            return <HomePage key="home" onOpenDetail={openDetail} onNavigate={navigate} />;
          case 'map':
            return <MapPage key="map" />;
          case 'team':
            return <TeamPage key="team" />;
          case 'tutorial':
            return <TutorialPage key="tutorial" />;
          case 'profile':
            return <ProfilePage key="profile" onNavigate={navigate} />;
          case 'detail':
            return detailActivity ? <DetailPage key="detail" activity={detailActivity} onBack={goBack} /> : null;
          case 'spec':
            return <SpecPage key="spec" onBack={goBack} />;
          case 'api':
            return <ApiPage key="api" onBack={goBack} />;
          default:
            return null;
        }
      };

      return (
        <div className="stage">
          <div className="app-title"><span>SPINN</span> · 旋盘</div>
          <div className="app-tagline">极限飞盘社群 · 原生 App 设计</div>

          <div style={{
            width: 402, height: 874, borderRadius: 48, overflow: 'hidden',
            position: 'relative', background: '#000',
            border: '1px solid #DEE0E3',
            fontFamily: '-apple-system, system-ui, sans-serif',
            '--ios-safe-top': '62px',
            '--ios-safe-bottom': '34px',
          }}>
            {/* Dynamic island */}
            <div style={{
              position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
              width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 100,
            }} />
            {/* Status bar */}
            <div style={{
              position: 'absolute', top: 0, left: 0, right: 0, zIndex: 90,
              display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
              padding: '21px 24px 19px', boxSizing: 'border-box',
            }}>
              <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
                <span style={{
                  fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
                  fontSize: 17, lineHeight: '22px', color: '#fff',
                }}>9:41</span>
              </div>
              <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
                <svg width="19" height="12" viewBox="0 0 19 12">
                  <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill="#fff"/>
                  <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill="#fff"/>
                  <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill="#fff"/>
                  <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill="#fff"/>
                </svg>
                <svg width="17" height="12" viewBox="0 0 17 12">
                  <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill="#fff"/>
                  <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill="#fff"/>
                  <circle cx="8.5" cy="10.5" r="1.5" fill="#fff"/>
                </svg>
                <svg width="27" height="13" viewBox="0 0 27 13">
                  <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="rgba(255,255,255,0.35)" fill="none"/>
                  <rect x="2" y="2" width="20" height="9" rx="2" fill="#fff"/>
                  <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill="rgba(255,255,255,0.4)"/>
                </svg>
              </div>
            </div>

            {/* Screen content */}
            <div style={{
              height: '100%',
              position: 'relative',
              isolation: 'isolate',
            }}>
              {/* Current page */}
              <div className="screen-container" style={{
                transform: isTransitioning ? (direction === 'forward' ? 'translateX(0)' : 'translateX(0)') : 'translateX(0)',
                animation: isTransitioning ? (direction === 'forward' ? 'pageSlideIn 0.35s cubic-bezier(.2,.8,.2,1)' : 'pageSlideIn 0.35s cubic-bezier(.2,.8,.2,1) reverse') : 'none',
              }}>
                {renderPage(currentPage)}
              </div>

              {/* Tab bar */}
              {isTabPage && (
                <TabBar active={currentPage} onNavigate={navigate} />
              )}
            </div>

            {/* Home indicator */}
            <div style={{
              position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 110,
              height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
              paddingBottom: 8, pointerEvents: 'none',
            }}>
              <div style={{
                width: 139, height: 5, borderRadius: 100,
                background: 'rgba(255,255,255,0.7)',
              }} />
            </div>
          </div>

          <div style={{
            fontSize: 11, color: '#6B7280', marginTop: 4,
            display: 'flex', gap: 16, flexWrap: 'wrap', justifyContent: 'center',
          }}>
            <span>V2 · 形态：原生 App</span>
            <span>8 页 · 12+ 动效</span>
            <span style={{ color: '#C6F24E' }}>荧光运动系</span>
          </div>
        </div>
      );
    }

    // ──────────────────────────────────────────────
    // RENDER
    // ──────────────────────────────────────────────
    function Root() {
      return (
        <>
          <CustomCursor />
          <App />
        </>
      );
    }

    // Announce upgrade capability
    function announceUpgrade() {
      try {
        window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
      } catch (e) {}
    }
    announceUpgrade();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announceUpgrade, { once: true });
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Root />);
  </script>
</body>

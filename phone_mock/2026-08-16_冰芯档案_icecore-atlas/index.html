<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>冰芯档案 Icecore Atlas · V2 手机应用 UI</title>
  <meta name="creative-medium" content="interactive-prototype" />
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" />
  <style>
    :root {
      --ice-white: #F0F4F6;
      --steel-teal: #33505C;
      --signal-orange: #FF7A1A;
      --deep-ink: #16232B;
      --frost-1: #E3EBEE;
      --frost-2: #CFDADD;
      --frost-3: #A9BDC4;
      --frost-4: #7A98A3;
      --ice-transparent: rgba(240, 244, 246, 0.72);
      --ink-transparent: rgba(22, 35, 43, 0.6);
      --shadow-soft: 0 4px 24px rgba(22, 35, 43, 0.08);
      --shadow-card: 0 8px 32px rgba(22, 35, 43, 0.12);
      --shadow-deep: 0 16px 48px rgba(22, 35, 43, 0.18);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 22px;
      --radius-xl: 28px;
      --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --font-display: 'Space Grotesk', 'Noto Sans SC', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-body: 'Noto Sans SC', 'Space Grotesk', sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0E1A21;
      font-family: var(--font-body);
      color: var(--deep-ink);
      overflow: hidden;
      cursor: none;
    }

    @media (max-width: 600px) {
      html, body { cursor: auto; }
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(51, 80, 92, 0.4) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(255, 122, 26, 0.1) 0%, transparent 50%),
        #0E1A21;
    }

    /* Custom cursor base - global container */
    .cursor-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999999;
      mix-blend-mode: normal;
    }

    .cursor-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 32px;
      height: 32px;
      border: 2px solid #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.25s var(--ease-spring),
                  height 0.25s var(--ease-spring),
                  border-color 0.25s ease,
                  background 0.25s ease,
                  opacity 0.2s ease;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.2),
        0 0 12px rgba(255, 122, 26, 0.35),
        0 0 24px rgba(255, 122, 26, 0.18);
      will-change: transform, width, height;
    }

    .cursor-dot {
      position: absolute;
      top: 0;
      left: 0;
      width: 6px;
      height: 6px;
      background: var(--signal-orange);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.2s var(--ease-spring),
                  height 0.2s var(--ease-spring),
                  background 0.2s ease;
      box-shadow:
        0 0 8px rgba(255, 122, 26, 0.8),
        0 0 16px rgba(255, 122, 26, 0.4);
      will-change: transform;
    }

    .cursor-ring.hover {
      width: 52px;
      height: 52px;
      border-color: var(--signal-orange);
      background: rgba(255, 122, 26, 0.08);
      box-shadow:
        0 0 0 2px rgba(255, 122, 26, 0.15),
        0 0 20px rgba(255, 122, 26, 0.5),
        0 0 40px rgba(255, 122, 26, 0.25);
    }

    .cursor-ring.press {
      width: 24px;
      height: 24px;
      background: rgba(255, 122, 26, 0.2);
    }

    .cursor-dot.hover {
      width: 4px;
      height: 4px;
    }

    .cursor-ripple {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border: 2px solid var(--signal-orange);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.8;
      animation: cursorRipple 0.6s ease-out forwards;
      pointer-events: none;
    }

    @keyframes cursorRipple {
      0% { width: 0; height: 0; opacity: 0.9; }
      100% { width: 60px; height: 60px; opacity: 0; }
    }

    @media (max-width: 600px) {
      .cursor-container { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor-container { display: none; }
      html, body { cursor: auto; }
      * { animation: none !important; transition: none !important; }
    }

    /* Ambient snow particles behind the phone */
    .ambient-snow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .snowflake {
      position: absolute;
      top: -10px;
      background: rgba(240, 244, 246, 0.6);
      border-radius: 50%;
      will-change: transform;
    }

    /* Title */
    .page-title {
      position: fixed;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--frost-3);
      font-family: var(--font-display);
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 500;
      z-index: 10;
      opacity: 0.7;
    }

    .page-title strong {
      color: var(--ice-white);
      font-weight: 600;
      margin-right: 12px;
    }

    .page-subtitle {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--frost-4);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 1.5px;
      z-index: 10;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="ambient-snow" id="ambientSnow"></div>

  <div class="cursor-container" id="cursorContainer">
    <div class="cursor-ring" id="cursorRing"></div>
    <div class="cursor-dot" id="cursorDot"></div>
  </div>

  <div class="page-title">
    <strong>ICECORE ATLAS</strong>V2 · Mobile UI
  </div>

  <div id="root"></div>

  <div class="page-subtitle">冰芯档案 · 极地科考移动工作平台 · v2.0</div>

  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/echarts@5.6.0/dist/echarts.min.js" crossorigin="anonymous"></script>

  <script type="text/babel" src="components/ios-frame.jsx"></script>
  <script type="text/babel" src="components/tweaks-panel.jsx"></script>
  <script type="text/babel" src="components/effects.jsx"></script>
  <script type="text/babel" src="components/app.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "density": "regular",
      "reducedMotion": false,
      "showSpecs": false
    }/*EDITMODE-END*/;

    function announceUpgrade() {
      window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    }
    announceUpgrade();
    if (document.readyState !== 'complete') window.addEventListener('load', announceUpgrade, { once: true });

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<IcecoreApp defaults={TWEAK_DEFAULTS} />);
  </script>

</body>
</html>

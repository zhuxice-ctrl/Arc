<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="creative-medium" content="interactive-prototype" />
<title>Kintsugi · 金缮笔记</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+JP:wght@300;500;700;900&family=Noto+Sans+JP:wght@300;400;500;700&family=Shippori+Mincho:wght@400;700;900&display=swap" />
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  :root {
    --kin-urushi: #0E0E10;
    --kin-urushi-2: #18171a;
    --kin-urushi-3: #20201e;
    --kin-gold: #D4A017;
    --kin-gold-soft: #c89512;
    --kin-gold-deep: #8a6808;
    --kin-gofun: #F5F0E6;
    --kin-gofun-2: #e6e1d6;
    --kin-ink: #2a2926;
    --kin-sabi: #6e6658;
    --kin-beni: #b2422a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #080706;
    color: var(--kin-gofun);
    font-family: 'Noto Sans JP', 'Noto Sans SC', system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(212,160,23,0.08), transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(212,160,23,0.05), transparent 50%),
      #080706;
  }
  .stage {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%;
    padding: 40px 20px;
  }
  .brand-mark {
    position: absolute; left: 32px; top: 28px;
    display: flex; flex-direction: column; gap: 4px;
    color: var(--kin-gofun);
    opacity: 0.7;
    font-family: 'Shippori Mincho', serif;
    letter-spacing: 0.25em;
    font-size: 13px;
  }
  .brand-mark .cn { font-size: 18px; letter-spacing: 0.5em; color: var(--kin-gold); }
  .version-tag {
    position: absolute; right: 32px; top: 28px;
    font-size: 11px; letter-spacing: 0.3em; opacity: 0.5;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .hint {
    position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 0.3em; opacity: 0.4;
    font-family: 'Noto Sans JP', sans-serif;
  }
  /* 自定义光标样式（在 body 上控制可见性） */
  .cursor-layer {
    position: fixed; inset: 0; pointer-events: none; z-index: 9999;
  }
  .cursor-ring {
    position: absolute; left: 0; top: 0;
    width: 34px; height: 34px;
    border: 2px solid #fff;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: width 250ms cubic-bezier(.2,.9,.3,1.2), height 250ms cubic-bezier(.2,.9,.3,1.2),
                border-color 200ms ease, background 200ms ease;
    box-shadow: 0 0 18px rgba(212,160,23,0.45), 0 0 6px rgba(255,255,255,0.6);
    will-change: transform, width, height;
  }
  .cursor-dot {
    position: absolute; left: 0; top: 0;
    width: 6px; height: 6px;
    background: var(--kin-gold);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 12px var(--kin-gold), 0 0 24px var(--kin-gold);
    transition: transform 120ms ease, background 200ms ease;
  }
  .cursor-ring.hover {
    width: 52px; height: 52px;
    border-color: var(--kin-gold);
    background: rgba(212,160,23,0.08);
    box-shadow: 0 0 28px rgba(212,160,23,0.7), 0 0 8px rgba(255,255,255,0.5);
  }
  .cursor-ring.clicking {
    width: 24px; height: 24px;
    border-color: #fff;
    background: rgba(255,255,255,0.1);
  }
  .cursor-dot.clicking { transform: translate(-50%, -50%) scale(1.8); }
  @media (prefers-reduced-motion: reduce) {
    .cursor-ring, .cursor-dot { transition: none; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="brand-mark">
      <span class="cn">金繕</span>
      <span>KINTSUGI · NOTE</span>
    </div>
    <div class="version-tag">V2 · MOCK / 08.16</div>
    <div class="hint">点击器物查看修复进度 · 底部导航切换页面</div>
    <div id="root"></div>
  </div>

  <!-- 自定义光标层 -->
  <div class="cursor-layer" id="cursorLayer" aria-hidden="true">
    <div class="cursor-ring" id="cursorRing"></div>
    <div class="cursor-dot" id="cursorDot"></div>
  </div>

  <!-- 粒子画布 -->
  <canvas id="particleCanvas" style="position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.35;"></canvas>

  <script type="text/babel" src="frames/android-frame.jsx"></script>
  <script type="text/babel" src="app/data.jsx"></script>
  <script type="text/babel" src="app/effects.jsx"></script>
  <script type="text/babel" src="app/components.jsx"></script>
  <script type="text/babel" src="app/pages/home.jsx"></script>
  <script type="text/babel" src="app/pages/detail.jsx"></script>
  <script type="text/babel" src="app/pages/new.jsx"></script>
  <script type="text/babel" src="app/pages/timeline.jsx"></script>
  <script type="text/babel" src="app/pages/spec.jsx"></script>
  <script type="text/babel" src="app/pages/api.jsx"></script>
  <script type="text/babel" src="app/app.jsx"></script>

  <script>
    // 宣告升级入口
    function announceUpgrade() {
      try {
        window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
      } catch(e) {}
    }
    announceUpgrade();
    if (document.readyState !== 'complete') window.addEventListener('load', announceUpgrade, { once: true });
  </script>
</body>
</html>

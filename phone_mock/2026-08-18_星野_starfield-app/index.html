<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #070B0A; font-family: "Noto Sans SC", -apple-system, system-ui, sans-serif; color: #E8EDEA; }
  #root { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }

  /* ── Device stage ── */
  .stage { position: relative; display: flex; align-items: center; justify-content: center; gap: 48px; padding: 40px; }
  .stage-hint { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); font-size: 12px; color: rgba(201,209,200,0.5); letter-spacing: 0.08em; }

  /* ── Scroll ── */
  .scroll { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }

  /* ── Star field (canvas) ── */
  .star-canvas { position: absolute; inset: 0; pointer-events: none; }

  /* ── Typography ── */
  .serif { font-family: "Noto Serif SC", serif; font-weight: 600; }
  .tabular { font-variant-numeric: tabular-nums; }

  /* ── Animations ── */
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.1); }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes pulse-ring {
    0% { transform: scale(0.8); opacity: 0.8; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  @keyframes float-y {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @keyframes shoot {
    0% { transform: translateX(0) translateY(0); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateX(-200px) translateY(120px); opacity: 0; }
  }
  @keyframes spin-slow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes glow {
    0%, 100% { filter: drop-shadow(0 0 4px rgba(242,201,76,0.4)); }
    50% { filter: drop-shadow(0 0 12px rgba(242,201,76,0.8)); }
  }
  @keyframes bounce-in {
    0% { transform: scale(0.3); opacity: 0; }
    50% { transform: scale(1.05); }
    70% { transform: scale(0.95); }
    100% { transform: scale(1); opacity: 1; }
  }

  .anim-fade-up { animation: fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .anim-float { animation: float-y 4s ease-in-out infinite; }
  .anim-glow { animation: glow 3s ease-in-out infinite; }
  .anim-spin-slow { animation: spin-slow 60s linear infinite; }
  .anim-bounce-in { animation: bounce-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

  /* ── Reduced motion ── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ── Tab bar ── */
  .tabbar {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 40;
    height: 83px; padding-bottom: calc(var(--ios-safe-bottom) + 4px);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    background: rgba(14, 21, 19, 0.72);
    border-top: 0.5px solid rgba(201, 209, 200, 0.12);
    display: flex; align-items: flex-start; justify-content: space-around;
    padding-top: 8px;
  }
  .tab-item {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    gap: 3px; cursor: pointer; padding: 4px 0;
    color: rgba(201, 209, 200, 0.5);
    transition: color 0.2s;
  }
  .tab-item.active { color: #F2C94C; }
  .tab-item svg { width: 24px; height: 24px; }
  .tab-item span { font-size: 10px; font-weight: 500; letter-spacing: 0.02em; }

  /* ── Nav bar (large title) ── */
  .nav-large {
    padding: 8px 20px 12px;
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .nav-large h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
  .nav-large .sub { font-size: 13px; color: rgba(201,209,200,0.6); margin-top: 2px; }

  /* ── Card base ── */
  .card {
    border-radius: 20px; overflow: hidden;
    background: rgba(255, 255, 255, 0.04);
    border: 0.5px solid rgba(201, 209, 200, 0.08);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  /* ── FAB ── */
  .fab {
    position: absolute; right: 20px; bottom: 100px; z-index: 35;
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, #F2C94C 0%, #E0A82E 100%);
    box-shadow: 0 4px 20px rgba(242,201,76,0.4), 0 2px 6px rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .fab:active { transform: scale(0.92); }

  /* ── Modal / bottom sheet ── */
  .sheet-mask {
    position: absolute; inset: 0; z-index: 80;
    background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 81;
    background: #0E1513; border-top-left-radius: 24px; border-top-right-radius: 24px;
    border-top: 0.5px solid rgba(201,209,200,0.12);
    padding: 12px 20px 30px;
    animation: slideUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-grabber {
    width: 36px; height: 5px; border-radius: 3px;
    background: rgba(201,209,200,0.25); margin: 0 auto 16px;
  }

  /* ── Page transition ── */
  .page-enter { animation: slideInRight 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .page-back { animation: slideInLeft 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  @keyframes slideInLeft { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

  /* ── Pull to refresh indicator ── */
  .pull-indicator {
    position: absolute; top: 62px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    color: #F2C94C; font-size: 12px; opacity: 0;
    transition: opacity 0.2s;
  }
  .pull-indicator.visible { opacity: 1; }

  /* ── Constellation grid ── */
  .constel-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px 20px;
  }
  .constel-card {
    aspect-ratio: 1; border-radius: 18px; position: relative; overflow: hidden;
    cursor: pointer; transition: transform 0.2s;
  }
  .constel-card:active { transform: scale(0.96); }

  /* ── Community feed ── */
  .feed-item {
    margin: 0 16px 16px; border-radius: 20px; overflow: hidden;
    background: rgba(255,255,255,0.03);
    border: 0.5px solid rgba(201,209,200,0.08);
  }
  .feed-img { width: 100%; aspect-ratio: 4/3; position: relative; }
  .feed-body { padding: 12px 14px 14px; }

  /* ── List rows ── */
  .list-row {
    display: flex; align-items: center; min-height: 52px;
    padding: 0 16px; position: relative;
    border-bottom: 0.5px solid rgba(201,209,200,0.08);
  }
  .list-row:last-child { border-bottom: none; }
  .chevron {
    width: 8px; height: 14px; flex-shrink: 0; opacity: 0.3;
  }

  /* ── Calendar ── */
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
    padding: 0 16px;
  }
  .cal-day {
    aspect-ratio: 1; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 14px; position: relative; cursor: pointer;
  }
  .cal-day.selected {
    background: #F2C94C; color: #0E1513; font-weight: 700;
  }
  .cal-day .dot {
    width: 4px; height: 4px; border-radius: 50%;
    position: absolute; bottom: 6px;
  }

  /* ── Code block (API docs) ── */
  .code-block {
    font-family: "SF Mono", Menlo, monospace; font-size: 11px;
    background: #070B0A; border-radius: 12px; padding: 12px 14px;
    line-height: 1.7; color: #C9D1C8; overflow-x: auto;
    border: 0.5px solid rgba(201,209,200,0.1);
  }
  .code-k { color: #F2C94C; }
  .code-s { color: #7DBE9B; }
  .code-n { color: #D9534F; }
  .code-c { color: rgba(201,209,200,0.4); font-style: italic; }

  /* ── Design token swatch ── */
  .swatch {
    width: 48px; height: 48px; border-radius: 12px;
    border: 0.5px solid rgba(201,209,200,0.15);
  }
</style>
</head>

/* ─────────────────────────────────────────────────────────────
   STAR FIELD (canvas background)
   ───────────────────────────────────────────────────────────── */
function StarField({ intensity = 1, redVision = false }) {
  const canvasRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const starsRef = React.useRef([]);
  const reducedMotion = React.useRef(
    typeof window !== 'undefined' && window.matchMedia('(prefers-reduced-motion: reduce)').matches
  ).current;

  React.useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width = canvas.offsetWidth * 2;
    const h = canvas.height = canvas.offsetHeight * 2;

    // Generate stars
    const count = Math.floor(120 * intensity);
    const stars = [];
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.8 + 0.4,
        baseAlpha: Math.random() * 0.5 + 0.3,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.015 + 0.005,
        twinkle: Math.random() > 0.6,
      });
    }
    starsRef.current = stars;

    if (reducedMotion) {
      // Draw static stars once
      drawFrame(ctx, w, h, stars, 0, redVision);
      return;
    }

    let t = 0;
    let visible = !document.hidden;

    const animate = () => {
      if (!visible) return;
      t += 1;
      drawFrame(ctx, w, h, stars, t, redVision);
      rafRef.current = requestAnimationFrame(animate);
    };

    const onVis = () => {
      visible = !document.hidden;
      if (visible) rafRef.current = requestAnimationFrame(animate);
      else if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
    document.addEventListener('visibilitychange', onVis);

    rafRef.current = requestAnimationFrame(animate);
    return () => {
      document.removeEventListener('visibilitychange', onVis);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [intensity, redVision, reducedMotion]);

  return <canvas ref={canvasRef} className="star-canvas" style={{ width: '100%', height: '100%' }} />;
}

function drawFrame(ctx, w, h, stars, t, redVision) {
  ctx.clearRect(0, 0, w, h);
  const baseColor = redVision ? '217, 83, 79' : '242, 201, 76';
  const dimColor = redVision ? '180, 60, 60' : '201, 209, 200';

  stars.forEach(s => {
    let alpha = s.baseAlpha;
    if (s.twinkle) {
      alpha = s.baseAlpha + Math.sin(t * s.speed + s.phase) * 0.3;
      alpha = Math.max(0.15, Math.min(1, alpha));
    }
    const color = s.twinkle ? baseColor : dimColor;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${color},${alpha})`;
    ctx.fill();

    // Glow for brighter stars
    if (s.r > 1.4 && s.twinkle) {
      const grd = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 3);
      grd.addColorStop(0, `rgba(${color},${alpha * 0.3})`);
      grd.addColorStop(1, `rgba(${color},0)`);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
      ctx.fillStyle = grd;
      ctx.fill();
    }
  });
}

/* ─────────────────────────────────────────────────────────────
   HOME PAGE — 今夜天象 (Hero + parallax + stacked cards)
   ───────────────────────────────────────────────────────────── */
function HomePage({ onNav, accent, redVision }) {
  const scrollRef = React.useRef(null);
  const heroRef = React.useRef(null);
  const [pullDist, setPullDist] = React.useState(0);
  const [refreshing, setRefreshing] = React.useState(false);
  const touchStart = React.useRef(0);
  const pullTimer = React.useRef(null);

  // Parallax on scroll — direct DOM manipulation
  React.useEffect(() => {
    const el = scrollRef.current;
    const hero = heroRef.current;
    if (!el || !hero) return;

    const onScroll = () => {
      const y = el.scrollTop;
      const scale = Math.max(1, 1 + y * -0.003);
      const translateY = Math.max(-30, y * 0.3);
      hero.style.transform = `scale(${scale}) translateY(${translateY}px)`;
      hero.style.opacity = Math.max(0.3, 1 - y / 250);
    };

    el.addEventListener('scroll', onScroll, { passive: true });
    return () => el.removeEventListener('scroll', onScroll);
  }, []);

  // Pull to refresh
  const onTouchStart = (e) => {
    if (scrollRef.current.scrollTop <= 0) {
      touchStart.current = e.touches[0].clientY;
    } else {
      touchStart.current = 0;
    }
  };
  const onTouchMove = (e) => {
    if (!touchStart.current) return;
    const diff = e.touches[0].clientY - touchStart.current;
    if (diff > 0 && scrollRef.current.scrollTop <= 0) {
      setPullDist(Math.min(diff * 0.5, 80));
    }
  };
  const onTouchEnd = () => {
    if (pullDist > 50 && !refreshing) {
      setRefreshing(true);
      if (pullTimer.current) clearTimeout(pullTimer.current);
      pullTimer.current = setTimeout(() => {
        setRefreshing(false);
        setPullDist(0);
      }, 1500);
    } else if (!refreshing) {
      setPullDist(0);
    }
    touchStart.current = 0;
  };

  // Shooting stars
  const [shooters, setShooters] = React.useState([]);
  const shooterTimer = React.useRef(null);

  React.useEffect(() => {
    if (typeof window !== 'undefined' && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    const spawn = () => {
      const id = Date.now() + Math.random();
      setShooters(prev => [...prev, { id, top: 30 + Math.random() * 30, left: 50 + Math.random() * 40 }]);
      setTimeout(() => setShooters(prev => prev.filter(s => s.id !== id)), 1500);
      shooterTimer.current = setTimeout(spawn, 4000 + Math.random() * 4000);
    };

    shooterTimer.current = setTimeout(spawn, 2000);
    const onVis = () => {
      if (document.hidden) {
        if (shooterTimer.current) clearTimeout(shooterTimer.current);
      } else {
        shooterTimer.current = setTimeout(spawn, 2000);
      }
    };
    document.addEventListener('visibilitychange', onVis);

    return () => {
      if (shooterTimer.current) clearTimeout(shooterTimer.current);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, []);

  const mainColor = redVision ? '#D9534F' : accent;

  return (
    <div className="scroll" ref={scrollRef} style={{ flex: 1, position: 'relative' }}
         onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}>

      {/* Pull indicator */}
      <div className={`pull-indicator ${pullDist > 10 ? 'visible' : ''}`}
           style={{ top: 60 + pullDist * 0.5, opacity: pullDist / 80 }}>
        <div style={{ transform: `rotate(${pullDist * 3}deg)`, transition: 'transform 0.1s' }}>
          <Icon.Star c={mainColor} />
        </div>
        <span>{refreshing ? '更新中…' : pullDist > 50 ? '松开更新' : '下拉刷新'}</span>
      </div>

      {/* Hero area */}
      <div style={{ position: 'relative', height: 380, overflow: 'hidden' }}>
        <div ref={heroRef} style={{
          position: 'absolute', inset: 0,
          background: `radial-gradient(ellipse at 60% 30%, ${redVision ? 'rgba(217,83,79,0.15)' : 'rgba(242,201,76,0.12)'} 0%, transparent 60%),
                       linear-gradient(180deg, ${redVision ? '#1a0a0a' : '#0a1510'} 0%, #0E1513 100%)`,
          transformOrigin: 'center top',
        }}>
          <StarField intensity={0.8} redVision={redVision} />

          {/* Shooting stars */}
          {shooters.map(s => (
            <div key={s.id} style={{
              position: 'absolute', top: `${s.top}%`, left: `${s.left}%`,
              width: 80, height: 1.5,
              background: `linear-gradient(90deg, transparent, ${mainColor})`,
              borderRadius: 2,
              animation: 'shoot 1.5s ease-out forwards',
              boxShadow: `0 0 6px ${mainColor}`,
              transform: 'rotate(30deg)',
            }} />
          ))}
        </div>

        {/* Safe area top spacer */}
        <div style={{ height: 'var(--ios-safe-top)' }} />

        {/* Hero content */}
        <div style={{ padding: '12px 20px 0', position: 'relative', zIndex: 2 }} className="anim-fade-up">
          <div style={{
            fontSize: 13, color: mainColor, fontWeight: 500,
            letterSpacing: 0.1, display: 'flex', alignItems: 'center', gap: 6,
          }}>
            <Icon.Moon c={mainColor} />
            <span>12月15日 · 农历廿三</span>
          </div>
          <h1 className="serif" style={{
            fontSize: 42, fontWeight: 700, lineHeight: 1.1,
            marginTop: 6, letterSpacing: -1,

          <p style={{ fontSize: 14, color: 'rgba(201,209,200,0.7)', marginTop: 4, maxWidth: 280 }}>

                      animationDelay: `${j * 0.3}s`,
                    }} />
                  ))}

                      <line x1="50" y1="45" x2="70" y2="25" stroke={mainColor} strokeWidth="0.8" opacity="0.5"/>
                      <line x1="50" y1="45" x2="50" y2="75" stroke={mainColor} strokeWidth="0.8" opacity="0.5"/>
                      <line x1="35" y1="50" x2="65" y2="50" stroke={mainColor} strokeWidth="0.8" opacity="0.5"/>
                      <line x1="50" y1="75" x2="30" y2="85" stroke={mainColor} strokeWidth="0.8" opacity="0.5"/>
                      <line x1="50" y1="75" x2="70" y2="80" stroke={mainColor} strokeWidth="0.8" opacity="0.5"/>
                      {[[30,20],[70,25],[50,45],[40,50],[50,50],[60,50],[50,75],[30,85],[70,80]].map(([x,y],k) => (
                        <circle key={k} cx={x} cy={y} r={k===2?2.5:1.5} fill={mainColor}/>
                      ))}
                    </>
                  )}
                  {c.id === 'ursa' && (
                    <>
                      <line x1="20" y1="35" x2="35" y2="25" stroke={mainColor} strokeWidth="0.8" opacity="0.5"/>
                      <line x1="35" y1="25" x2="55" y2="30" stroke={mainColor} strokeWidth="0.8" opacity="0.5"/>
                      <line x1="55" y1="30" x2="65" y2="45" stroke={mainColor} strokeWidth="0.8" opacity="0.5"/>
                      <line x1="65" y1="45" x2="75" y2="65" stroke={mainColor} strokeWidth="0.8" opacity="0.5"/>
                      <line x1="75" y1="65" x2="55" y2="70" stroke={mainColor} strokeWidth="0.8" opacity="0.5"/>
                      <line x1="55" y1="70" x2="40" y2="55" stroke={mainColor} strokeWidth="0.8" opacity="0.5"/>
                      <line x1="40" y1="55" x2="20" y2="35" stroke={mainColor} strokeWidth="0.8" opacity="0.5"/>
                      {[[20,35],[35,25],[55,30],[65,45],[75,65],[55,70],[40,55]].map(([x,y],k) => (
                        <circle key={k} cx={x} cy={y} r={k===2?2:1.5} fill={mainColor}/>
                      ))}
                    </>
                  )}
                  {c.id !== 'orion' && c.id !== 'ursa' && (
                    <>
                      {[...Array(c.stars)].map((_,k) => {
                        const angle = (k / c.stars) * Math.PI * 2 + 0.3;
                        const r = 25 + (k % 3) * 8;
                        const x = 50 + Math.cos(angle) * r;
                        const y = 50 + Math.sin(angle) * r * 0.7;
                        return (
                          <React.Fragment key={k}>
                            {k > 0 && (() => {
                              const prevAngle = ((k-1) / c.stars) * Math.PI * 2 + 0.3;
                              const prevR = 25 + ((k-1) % 3) * 8;
                              const px = 50 + Math.cos(prevAngle) * prevR;
                              const py = 50 + Math.sin(prevAngle) * prevR * 0.7;
                              return <line x1={px} y1={py} x2={x} y2={y} stroke={mainColor} strokeWidth="0.6" opacity="0.4"/>;
                            })()}
                            <circle cx={x} cy={y} r={k===0?2.5:1.5} fill={mainColor}/>
                          </React.Fragment>
                        );
                      })}
                    </>
                  )}
                </svg>

                {/* Labels */}
                <div style={{
                  position: 'absolute', bottom: 12, left: 12, right: 12,
                }}>
                  <div style={{ fontSize: 15, fontWeight: 600 }}>{c.name}</div>
                  <div style={{ fontSize: 10, color: 'rgba(255,255,255,0.5)', marginTop: 1 }}>
                    {c.en} · {c.stars} 颗主星
                  </div>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────
   CALENDAR PAGE — 天象日历 (calendar + event list split)
   ───────────────────────────────────────────────────────────── */
function CalendarPage({ onBack, accent, redVision }) {
  const mainColor = redVision ? '#D9534F' : accent;
  const [selectedDay, setSelectedDay] = React.useState(15);

  const daysInMonth = 31;
  const firstDayWeekday = 6; // Saturday (Dec 1, 2024 is Sunday actually, let's use 0=Sun)
  const weekdays = ['日','一','二','三','四','五','六'];

  // Generate day cells
  const cells = [];
  for (let i = 0; i < firstDayWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const hasEvent = (day) => CAL_EVENTS.some(e => e.day === day);
  const getEvents = (day) => CAL_EVENTS.filter(e => e.day === day);

  const levelColor = (level) => {
    if (level === '重要') return mainColor;
    if (level === '推荐') return '#7DBE9B';
    return '#6B8E9F';
  };

  const todayEvents = getEvents(selectedDay);

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', background: '#0E1513' }}>
      <div style={{ paddingTop: 'var(--ios-safe-top)' }} />
      <NavBar title="天象日历" subtitle="2024年12月" onBack={onBack} accent={mainColor} />

      {/* Weekday headers */}
      <div style={{
        display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)',
        padding: '8px 16px 4px',
      }}>
        {weekdays.map(d => (
          <div key={d} style={{
            textAlign: 'center', fontSize: 11,
            color: 'rgba(201,209,200,0.4)', paddingBottom: 4,
          }}>{d}</div>
        ))}
      </div>

      {/* Calendar grid */}
      <div className="cal-grid">
        {cells.map((day, i) => {
          if (day === null) return <div key={i} />;
          const selected = day === selectedDay;
          const event = hasEvent(day);
          const ev = getEvents(day)[0];
          return (
            <div key={i} className={`cal-day ${selected ? 'selected' : ''}`}
                 style={{
                   background: selected ? mainColor : 'transparent',
                   color: selected ? '#0E1513' : '#E8EDEA',
                 }}
                 onClick={() => setSelectedDay(day)}>
              <span>{day}</span>
              {event && (
                <div className="dot" style={{
                  background: selected ? '#0E1513' : levelColor(ev?.level),
                }} />
              )}
            </div>
          );
        })}
      </div>

      {/* Event list section */}
      <div style={{ flex: 1, marginTop: 16, padding: '0 16px 30px', overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginBottom: 12 }}>
          <span className="serif" style={{ fontSize: 18, fontWeight: 600 }}>
            12月{selectedDay}日
          </span>
          <span style={{ fontSize: 12, color: 'rgba(201,209,200,0.5)' }}>
            {todayEvents.length > 0 ? `${todayEvents.length} 个天象` : '暂无天象'}
          </span>
        </div>

        <div className="scroll" style={{ flex: 1 }}>
          {todayEvents.length > 0 ? todayEvents.map((ev, i) => (
            <div key={i} className="card anim-fade-up"
                 style={{ padding: 14, marginBottom: 10, animationDelay: `${i * 0.08}s` }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                <div style={{
                  width: 4, height: 40, borderRadius: 2, flexShrink: 0,
                  background: levelColor(ev.level),
                }} />
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 15, fontWeight: 600 }}>{ev.title}</div>
                  <div style={{ display: 'flex', gap: 8, marginTop: 4 }}>
                    <span style={{
                      fontSize: 10, padding: '2px 8px', borderRadius: 999,
                      background: `${levelColor(ev.level)}20`,
                      color: levelColor(ev.level),
                    }}>{ev.type}</span>
                    <span style={{
                      fontSize: 10, padding: '2px 8px', borderRadius: 999,
                      background: 'rgba(201,209,200,0.1)',
                      color: 'rgba(201,209,200,0.6)',
                    }}>{ev.level}</span>
                  </div>
                </div>
                <Icon.Chevron c="rgba(201,209,200,0.3)" />
              </div>
            </div>
          )) : (
            <div style={{
              textAlign: 'center', padding: '40px 20px',
              color: 'rgba(201,209,200,0.4)',
            }}>
              <Icon.Star c="rgba(201,209,200,0.2)" />
              <div style={{ marginTop: 10, fontSize: 13 }}>这天暂无特殊天象</div>
              <div style={{ fontSize: 12, marginTop: 4 }}>适合日常观测练习</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

                <div style={{
                  padding: '0 14px 14px',
                  borderTop: '0.5px solid rgba(201,209,200,0.08)',
                  paddingTop: 12,
                }} className="anim-fade-up">
                  <div style={{ fontSize: 11, color: 'rgba(201,209,200,0.5)', marginBottom: 6, fontWeight: 500 }}>
                    请求参数
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 4, marginBottom: 12 }}>
                    {ep.params.map(p => (
                      <div key={p.k} style={{
                        display: 'flex', alignItems: 'center', gap: 8,
                        fontSize: 11, padding: '6px 8px',
                        background: 'rgba(255,255,255,0.02)', borderRadius: 6,
                      }}>
                        <span style={{ fontFamily: '"SF Mono", monospace', color: mainColor, minWidth: 60 }}>{p.k}</span>
                        <span style={{ color: '#6B8E9F', fontFamily: '"SF Mono", monospace', fontSize: 10 }}>{p.t}</span>
                        <span style={{ color: 'rgba(201,209,200,0.5)', flex: 1, textAlign: 'right' }}>{p.d}</span>
                      </div>
                    ))}
                  </div>

                  <div style={{ fontSize: 11, color: 'rgba(201,209,200,0.5)', marginBottom: 6, fontWeight: 500 }}>
                    返回示例
                  </div>
                  <div className="code-block">
                    <pre style={{ margin: 0, whiteSpace: 'pre-wrap', wordBreak: 'break-all' }}>
                      {ep.response.split('\n').map((line, li) => {
                        // Simple syntax highlighting
                        const highlighted = line
                          .replace(/"(\w+)":/g, `<span class="code-k">"$1"</span>:`)
                          .replace(/: "([^"]+)"/g, `: <span class="code-s">"$1"</span>`)
                          .replace(/: (\d+\.?\d*)/g, `: <span class="code-n">$1</span>`)
                          .replace(/(\/\/.*)/g, `<span class="code-c">$1</span>`);
                        return <div key={li} dangerouslySetInnerHTML={{ __html: highlighted || ' ' }} />;
                      })}
                    </pre>
                  </div>
                </div>
              )}
            </div>
          ))}
        </div>

        {/* Error codes */}
        <div style={{ marginTop: 20, fontSize: 13, fontWeight: 600, marginBottom: 10 }}>错误码</div>
        <div className="card" style={{ overflow: 'hidden' }}>
          {[
            { code: 0, msg: '成功' },
            { code: 40001, msg: '参数错误' },
            { code: 40101, msg: '鉴权失败' },
            { code: 40301, msg: '权限不足' },
            { code: 40401, msg: '资源不存在' },
            { code: 50001, msg: '服务器内部错误' },
          ].map((e, i) => (
            <div key={e.code} className="list-row">
              <span style={{
                fontFamily: '"SF Mono", monospace', fontSize: 12,
                color: e.code === 0 ? '#7DBE9B' : '#D9534F',
                minWidth: 60,
              }}>{e.code}</span>
              <span style={{ fontSize: 13 }}>{e.msg}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────
   CONSTELLATION DETAIL PAGE (modal detail)
   ───────────────────────────────────────────────────────────── */
function ConstellationDetail({ data, onBack, accent, redVision }) {
  const mainColor = redVision ? '#D9534F' : accent;
  const scrollRef = React.useRef(null);
  const headerRef = React.useRef(null);

  React.useEffect(() => {
    const el = scrollRef.current;
    const header = headerRef.current;
    if (!el || !header) return;
    const onScroll = () => {
      const y = el.scrollTop;
      if (y > 100) {
        header.style.background = 'rgba(14,21,19,0.9)';
        header.style.backdropFilter = 'blur(20px)';
      } else {
        header.style.background = 'transparent';
        header.style.backdropFilter = 'none';
      }
    };
    el.addEventListener('scroll', onScroll, { passive: true });
    return () => el.removeEventListener('scroll', onScroll);
  }, []);

  if (!data) return null;

  return (
    <div className="scroll" ref={scrollRef} style={{ flex: 1, position: 'relative' }}>
      {/* Hero */}
      <div style={{
        height: 320, position: 'relative',
        background: `linear-gradient(180deg, ${data.color1} 0%, ${data.color2} 50%, #0E1513 100%)`,
      }}>
        <StarField intensity={1} redVision={redVision} />
        {/* Large constellation */}
        <div style={{
          position: 'absolute', top: '50%', left: '50%',
          transform: 'translate(-50%, -50%)',
          width: 200, height: 200,
        }} className="anim-float">
          <svg viewBox="0 0 100 100" className="anim-spin-slow" style={{ animationDuration: '120s' }}>
            {[...Array(data.stars)].map((_, k) => {
              const angle = (k / data.stars) * Math.PI * 2 + 0.3;
              const r = 30 + (k % 3) * 10;
              const x = 50 + Math.cos(angle) * r;
              const y = 50 + Math.sin(angle) * r * 0.6;
              const prevAngle = ((k - 1 + data.stars) % data.stars / data.stars) * Math.PI * 2 + 0.3;
              const prevR = 30 + ((k - 1 + data.stars) % data.stars % 3) * 10;
              const px = 50 + Math.cos(prevAngle) * prevR;
              const py = 50 + Math.sin(prevAngle) * prevR * 0.6;
              return (
                <g key={k}>
                  {k > 0 && <line x1={px} y1={py} x2={x} y2={y} stroke={mainColor} strokeWidth="0.5" opacity="0.4"/>}
                  <circle cx={x} cy={y} r={k === 0 ? 3 : 2} fill={mainColor} className="anim-glow" style={{ animationDelay: `${k * 0.2}s` }}/>
                </g>
              );
            })}
          </svg>
        </div>
      </div>

      {/* Floating header */}
      <div ref={headerRef} style={{
        position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10,
        paddingTop: 'var(--ios-safe-top)',
        transition: 'all 0.3s',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', padding: '10px 16px', gap: 12 }}>
          <button onClick={onBack} style={{
            width: 36, height: 36, borderRadius: 18,
            background: 'rgba(14,21,19,0.6)', backdropFilter: 'blur(10px)',
            border: '0.5px solid rgba(201,209,200,0.1)',
            color: mainColor,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            cursor: 'pointer',
          }}>
            <Icon.Back c={mainColor} />
          </button>
          <div style={{ flex: 1 }} />
          <button style={{
            width: 36, height: 36, borderRadius: 18,
            background: 'rgba(14,21,19,0.6)', backdropFilter: 'blur(10px)',
            border: '0.5px solid rgba(201,209,200,0.1)',
            color: mainColor,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            cursor: 'pointer',
          }}>
            <Icon.Share c={mainColor} />
          </button>
        </div>
      </div>

      {/* Content */}
      <div style={{ padding: '0 20px 80px', marginTop: -20, position: 'relative', zIndex: 3 }} className="anim-fade-up">
        <div style={{
          display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between',
          marginBottom: 16,
        }}>
          <div>
            <div style={{ fontSize: 12, color: mainColor, fontWeight: 500, letterSpacing: 0.1 }}>
              {data.en} · {data.season}季星座
            </div>
            <h1 className="serif" style={{ fontSize: 36, fontWeight: 700, marginTop: 4 }}>{data.name}</h1>
          </div>
          <div style={{
            padding: '6px 12px', borderRadius: 999,
            background: `${mainColor}20`, color: mainColor,
            fontSize: 12, fontWeight: 500,
          }}>
            视星等 {data.mag}
          </div>
        </div>

        <p style={{ fontSize: 14, color: 'rgba(201,209,200,0.75)', lineHeight: 1.8 }}>
          {data.desc}
        </p>

        {/* Stats grid */}
        <div style={{
          display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 10,
          marginTop: 20, marginBottom: 20,
        }}>
          {[
            { label: '主星数', val: data.stars },
            { label: '最佳季节', val: data.season },
            { label: '最亮星等', val: data.mag },
          ].map(s => (
            <div key={s.label} className="card" style={{ padding: '14px 10px', textAlign: 'center' }}>
              <div className="tabular" style={{ fontSize: 18, fontWeight: 700, color: mainColor }}>{s.val}</div>
              <div style={{ fontSize: 10, color: 'rgba(201,209,200,0.5)', marginTop: 2 }}>{s.label}</div>
            </div>
          ))}

        <div className="serif" style={{ fontSize: 16, fontWeight: 600, marginBottom: 10 }}>观测指南</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {[
            '每年' + data.season + '季为最佳观测时期',
            '裸眼即可识别主要亮星',
            '使用双筒望远镜可观测更多细节',
            '推荐搭配星图 App 定位',
          ].map((tip, i) => (
            <div key={i} style={{
              display: 'flex', gap: 10, alignItems: 'flex-start',
              fontSize: 13, color: 'rgba(201,209,200,0.7)',
            }}>
              <span style={{
                width: 20, height: 20, borderRadius: 10, flexShrink: 0,
                background: `${mainColor}20`, color: mainColor,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontSize: 11, fontWeight: 600,
              }}>{i + 1}</span>
              <span style={{ lineHeight: '20px' }}>{tip}</span>
            </div>
          ))}
        </div>

        <button style={{
          width: '100%', marginTop: 24, padding: '14px 0',
          borderRadius: 14, border: 'none',
          background: mainColor, color: '#0E1513',
          fontSize: 15, fontWeight: 600, cursor: 'pointer',
        }}>加入我的观测清单</button>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────
   TWEAKS PANEL (simplified inline version)
   ───────────────────────────────────────────────────────────── */
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues(prev => ({ ...prev, ...edits }));
    try { window.parent?.postMessage({ type: 'miaoda:tweaks:set-keys', edits }, '*'); } catch(e) {}
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = '风格', children, open, onClose }) {
  if (!open) return null;
  return (
    <div style={{
      position: 'fixed', right: 16, top: 16, zIndex: 2147483646,
      width: 280, maxHeight: 'calc(100vh - 32px)',
      display: 'flex', flexDirection: 'column',
      background: '#fff', color: '#1F2329',
      border: '0.5px solid #DEE0E3', borderRadius: 12,
      boxShadow: '0 8px 24px 8px rgba(0,0,0,.08)',
      fontFamily: 'ui-sans-serif, system-ui, -apple-system, sans-serif',
      fontSize: 12, overflow: 'hidden',
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '12px 12px 12px 16px',
        borderBottom: '0.5px solid #EBECEE',
        cursor: 'move',
      }}>
        <b style={{ fontSize: 14, fontWeight: 600 }}>{title}</b>
        <button onClick={onClose} style={{
          appearance: 'none', border: 0, background: 'transparent',
          color: '#86909C', width: 24, height: 24, borderRadius: 6,
          cursor: 'pointer', fontSize: 13,
        }}>✕</button>
      </div>
      <div style={{
        padding: '14px 16px 16px', display: 'flex', flexDirection: 'column', gap: 14,
        overflowY: 'auto', flex: 1, minHeight: 0,
      }}>
        {children}
      </div>
    </div>
  );
}

function TweakSection({ label }) {
  return <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: '0.06em',
    textTransform: 'uppercase', color: '#86909C', padding: '10px 0 0' }}>{label}</div>;
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
      <span style={{ fontWeight: 500 }}>{label}</span>
      <div onClick={() => onChange(!value)} style={{
        width: 36, height: 20, borderRadius: 999,
        background: value ? '#1F2329' : '#E4E6E8',
        position: 'relative', cursor: 'pointer', transition: 'background 0.15s',
      }}>
        <div style={{
          position: 'absolute', top: 2, left: value ? 18 : 2,
          width: 16, height: 16, borderRadius: '50%', background: '#fff',
          boxShadow: '0 1px 2px rgba(0,0,0,.2)',
          transition: 'left 0.15s cubic-bezier(0.34, 1.56, 0.64, 1)',
        }} />
      </div>
    </div>
  );
}

function TweakSlider({ label, value, min, max, unit, onChange }) {
  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 6 }}>
        <span style={{ fontWeight: 500 }}>{label}</span>
        <span style={{ color: '#646A73', fontVariantNumeric: 'tabular-nums' }}>{value}{unit}</span>
      </div>
      <input type="range" min={min} max={max} step={0.1} value={value}
             onChange={(e) => onChange(parseFloat(e.target.value))}
             style={{ width: '100%', accentColor: '#1F2329' }} />
    </div>
  );
}

function TweakColor({ label, value, options, onChange }) {
  return (
    <div>
      <div style={{ marginBottom: 8, fontWeight: 500 }}>{label}</div>
      <div style={{ display: 'flex', gap: 8 }}>
        {options.map(opt => (
          <button key={opt} onClick={() => onChange(opt)} style={{
            width: 36, height: 24, borderRadius: 6, background: opt,
            border: value === opt ? '2px solid #1F2329' : '0.5px solid #DEE0E3',
            cursor: 'pointer', padding: 0,
          }} />
        ))}
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────
   MAIN APP
   ───────────────────────────────────────────────────────────── */
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [tab, setTab] = React.useState('home');
  const [stack, setStack] = React.useState([]); // secondary pages stack
  const [tweaksOpen, setTweaksOpen] = React.useState(false);
  const [transitionKey, setTransitionKey] = React.useState(0);

  // Listen for host tweak activation
  React.useEffect(() => {
    const onMsg = (e) => {
      if (e?.data?.type === 'miaoda:tweaks:activate') setTweaksOpen(true);
      else if (e?.data?.type === 'miaoda:tweaks:deactivate') setTweaksOpen(false);
    };
    window.addEventListener('message', onMsg);
    try { window.parent?.postMessage({ type: 'miaoda:tweaks:available' }, '*'); } catch(e) {}
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const accent = t.redVision ? '#D9534F' : t.accentColor;

  const handleTabChange = (newTab) => {
    if (newTab === tab) return;
    setStack([]);
    setTab(newTab);
    setTransitionKey(k => k + 1);
  };

  const handleNav = (page, data) => {
    setStack(prev => [...prev, { page, data }]);
    setTransitionKey(k => k + 1);
  };

  const handleBack = () => {
    setStack(prev => prev.slice(0, -1));
    setTransitionKey(k => k + 1);
  };

  const renderPage = () => {
    // If stack has pages, show top of stack
    if (stack.length > 0) {
      const top = stack[stack.length - 1];
      switch (top.page) {
        case 'calendar':
          return <CalendarPage onBack={handleBack} accent={accent} redVision={t.redVision} />;
        case 'design':
          return <DesignSpecPage onBack={handleBack} accent={accent} redVision={t.redVision} />;
        case 'api':
          return <ApiDocPage onBack={handleBack} accent={accent} redVision={t.redVision} />;
        case 'constelDetail':
          return <ConstellationDetail data={top.data} onBack={handleBack} accent={accent} redVision={t.redVision} />;
        case 'spots':
          return <SpotsPage onNav={handleNav} accent={accent} redVision={t.redVision} />;
        case 'params':
        default:
          return <CalendarPage onBack={handleBack} accent={accent} redVision={t.redVision} />;
      }
    }

    // Tab pages
    switch (tab) {
      case 'home': return <HomePage onNav={handleNav} accent={accent} redVision={t.redVision} />;
      case 'stars': return <StarsPage onNav={handleNav} accent={accent} redVision={t.redVision} />;
      case 'spots': return <SpotsPage onNav={handleNav} accent={accent} redVision={t.redVision} />;
      case 'community': return <CommunityPage onNav={handleNav} accent={accent} redVision={t.redVision} />;
      case 'me': return <MePage onNav={handleNav} accent={accent} redVision={t.redVision} />;
      default: return <HomePage onNav={handleNav} accent={accent} redVision={t.redVision} />;
    }
  };

  const showTabBar = stack.length === 0;

  return (
    <div className="stage" style={{
      width: '100%', height: '100%',
      background: `radial-gradient(ellipse at 50% 30%, ${t.redVision ? 'rgba(217,83,79,0.08)' : 'rgba(242,201,76,0.06)'} 0%, #050708 100%)`,
    }}>
      <StarField intensity={0.5} redVision={t.redVision} />

      <div style={{ position: 'relative', zIndex: 2 }} key={transitionKey} className="page-enter">
        <IOSDevice dark width={390} height={844}>
          {/* App background */}
          <div style={{
            position: 'absolute', inset: 0,
            background: t.redVision ? '#0D0808' : '#0E1513',
          }} />
          {renderPage()}
          {showTabBar && (
            <TabBar active={tab} onChange={handleTabChange} accent={accent} />
          )}
        </IOSDevice>
      </div>

      <span className="stage-hint">星野 · 星空观测原生 App · 滑动切换探索</span>

      {/* Tweaks panel */}
      <TweaksPanel open={tweaksOpen} onClose={() => {
        setTweaksOpen(false);
        try { window.parent?.postMessage({ type: 'miaoda:tweaks:dismissed' }, '*'); } catch(e) {}
      }}>
        <TweakSection label="主题" />
        <TweakColor label="主色调" value={t.accentColor}
                    options={['#F2C94C', '#7DBE9B', '#C97D9D', '#6B8E9F']}
                    onChange={(v) => setTweak('accentColor', v)} />
        <TweakToggle label="红光夜视模式" value={t.redVision}
                     onChange={(v) => setTweak('redVision', v)} />
        <TweakSection label="动效" />
        <TweakSlider label="动画强度" value={t.animationIntensity}
                     min={0} max={2} step={0.1} unit="x"
                     onChange={(v) => setTweak('animationIntensity', v)} />
      </TweaksPanel>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

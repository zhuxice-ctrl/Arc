<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="creative-medium" content="interactive-prototype" />
<title>矿脉志 Vein Atlas · V2 小程序原型</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Playfair+Display:wght@500;700;900&family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#111418;font-family:"Noto Sans SC","PingFang SC","Helvetica Neue",sans-serif;color:#1F2430;-webkit-font-smoothing:antialiased;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;padding:20px;min-height:100vh;gap:48px;flex-wrap:wrap}

  /* ---------- Phone frame ---------- */
  .phone{
    position:relative;width:390px;height:844px;
    background:#000;border-radius:54px;
    box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 10px #1a1d22,0 0 0 11px #2a2d33;
    overflow:hidden;flex:none;
  }
  .phone::before{
    content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);
    width:120px;height:32px;background:#000;border-radius:20px;z-index:200;
  }
  .screen{
    position:absolute;inset:0;background:#F7F4EC;overflow:hidden;
    border-radius:44px;margin:10px;
  }

  /* ---------- Mini-program status / nav bar ---------- */
  .statusbar{
    position:absolute;top:0;left:0;right:0;height:44px;z-index:100;
    display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 32px;
    font-size:15px;font-weight:600;color:inherit;pointer-events:none;
  }
  .statusbar .right{display:flex;align-items:center;gap:5px;font-size:12px}
  .statusbar .battery{width:24px;height:11px;border:1px solid currentColor;border-radius:3px;position:relative;padding:1px}
  .statusbar .battery::after{content:"";position:absolute;right:-3px;top:50%;transform:translateY(-50%);width:2px;height:5px;background:currentColor;border-radius:0 1px 1px 0}
  .statusbar .battery i{display:block;height:100%;width:80%;background:currentColor;border-radius:1px}

  .navbar{
    position:absolute;top:0;left:0;right:0;z-index:90;
    height:88px;padding-top:44px;
    display:flex;align-items:center;justify-content:space-between;
    transition:background .35s ease, color .35s ease, box-shadow .35s ease;
  }
  .navbar .nav-title{
    margin-left:16px;font-size:17px;font-weight:600;
    white-space:nowrap;overflow:hidden;max-width:60%;
  }
  .navbar .nav-back{
    width:32px;height:32px;margin-left:8px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;border-radius:50%;
  }
  .navbar .capsule{
    margin-right:12px;display:flex;align-items:center;
    width:88px;height:32px;border-radius:16px;
    background:rgba(0,0,0,.33);backdrop-filter:blur(10px);
    color:#fff;justify-content:space-around;
  }
  .navbar .capsule svg{display:block;opacity:.9}
  .navbar.transparent{color:#fff;background:transparent}
  .navbar.solid{color:#1F2430;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.05)}
  .navbar.solid .capsule{background:rgba(31,36,48,.1);color:#1F2430}

  /* ---------- Tab bar ---------- */
  .tabbar{
    position:absolute;bottom:0;left:0;right:0;height:84px;z-index:90;
    background:rgba(255,255,255,.92);backdrop-filter:blur(20px);
    border-top:1px solid rgba(0,0,0,.06);
    display:flex;padding-bottom:20px;padding-top:6px;
  }
  .tabbar .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;cursor:pointer;position:relative;color:#9aa0aa;font-size:10px;
    transition:color .25s ease;
  }
  .tabbar .tab .ic{width:24px;height:24px;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
  .tabbar .tab .bar{
    position:absolute;top:2px;left:50%;transform:translateX(-50%) scaleX(0);
    width:20px;height:3px;border-radius:2px;background:#0E7C5B;
    transform-origin:center;transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .tabbar .tab.active{color:#0E7C5B;font-weight:600}
  .tabbar .tab.active .ic{transform:translateY(-2px)}
  .tabbar .tab.active .bar{transform:translateX(-50%) scaleX(1)}

  /* ---------- Pages container ---------- */
  .pages{
    position:absolute;inset:0;
    padding-top:0;padding-bottom:84px;
  }
  .page{
    position:absolute;inset:0;padding-top:0;padding-bottom:84px;
    background:#F7F4EC;overflow:hidden;
    will-change:transform;
  }
  .page-inner{height:100%;overflow-y:auto;overflow-x:hidden;position:relative;
    -webkit-overflow-scrolling:touch;scroll-behavior:smooth}
  .page-inner::-webkit-scrollbar{display:none}

  /* slide transition */
  .page.enter-from-right{animation:slideInRight .38s cubic-bezier(.22,.61,.36,1) both}
  .page.exit-to-right{animation:slideOutRight .32s cubic-bezier(.4,0,.2,1) both}
  @keyframes slideInRight{from{transform:translateX(100%);box-shadow:-8px 0 24px rgba(0,0,0,0)} to{transform:translateX(0);box-shadow:-8px 0 24px rgba(0,0,0,.18)}}
  @keyframes slideOutRight{from{transform:translateX(0);box-shadow:-8px 0 24px rgba(0,0,0,.18)} to{transform:translateX(100%);box-shadow:-8px 0 24px rgba(0,0,0,0)}}

  /* ---------- Home page ---------- */
  .home{background:#1F2430;color:#fff}
  .home .hero{
    position:relative;height:420px;padding-top:88px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .home .hero-bg{
    position:absolute;inset:0;
    background:
      radial-gradient(ellipse at 50% 60%, rgba(14,124,91,.35) 0%, transparent 55%),
      radial-gradient(ellipse at 70% 80%, rgba(228,87,76,.18) 0%, transparent 50%),
      linear-gradient(180deg,#1F2430 0%,#181c25 100%);
  }
  .home .crystal-cluster{position:relative;width:240px;height:220px;opacity:0;animation:fadeUp 1s .2s cubic-bezier(.22,.61,.36,1) forwards}
  .home .hero h1{
    font-family:"Playfair Display","Noto Serif SC",serif;font-weight:700;font-size:44px;
    letter-spacing:4px;margin-top:18px;opacity:0;
    animation:fadeUp .8s .5s cubic-bezier(.22,.61,.36,1) forwards;
  }
  .home .hero h1 span{display:inline-block;opacity:0;transform:translateY(12px);animation:charIn .6s cubic-bezier(.22,.61,.36,1) forwards}
  .home .hero h1 span:nth-child(1){animation-delay:.55s}
  .home .hero h1 span:nth-child(2){animation-delay:.65s}
  .home .hero h1 span:nth-child(3){animation-delay:.75s}
  @keyframes charIn{to{opacity:1;transform:translateY(0)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .home .hero .subtitle{
    margin-top:8px;font-size:13px;letter-spacing:6px;color:#A8D5C5;
    opacity:0;animation:fadeUp .8s .9s ease both;
  }
  .home .shimmer{
    position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;
    box-shadow:0 0 12px 2px rgba(168,213,197,.9);
    opacity:0;animation:pulse 2.8s ease-in-out infinite;
  }
  .home .shimmer.s1{top:30%;left:30%;animation-delay:.3s}
  .home .shimmer.s2{top:55%;left:65%;animation-delay:1.1s;width:5px;height:5px}
  .home .shimmer.s3{top:25%;right:28%;animation-delay:1.8s;width:4px;height:4px}
  @keyframes pulse{
    0%,100%{opacity:0;transform:scale(.6)}
    50%{opacity:.9;transform:scale(1.2)}
  }

  .home-section{padding:20px 18px 8px}
  .home-section-head{
    display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;
  }
  .home-section-head h2{font-family:"Playfair Display",serif;font-size:18px;font-weight:700;letter-spacing:1px}
  .home-section-head .more{font-size:12px;color:#A8D5C5;cursor:pointer}

  .h-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;margin:0 -18px;padding-left:18px;padding-right:18px}
  .h-scroll::-webkit-scrollbar{display:none}
  .specimen-card{
    flex:none;width:150px;height:200px;border-radius:16px;
    background:linear-gradient(160deg,#2a3140 0%,#1F2430 100%);
    border:1px solid rgba(168,213,197,.12);
    padding:14px;display:flex;flex-direction:column;justify-content:space-between;
    position:relative;overflow:hidden;cursor:pointer;
    transition:transform .2s ease;
  }
  .specimen-card:active{transform:scale(.97)}
  .specimen-card .crystal{width:100%;height:110px;display:flex;align-items:center;justify-content:center}
  .specimen-card .name{font-family:"Noto Serif SC",serif;font-size:15px;font-weight:600}
  .specimen-card .meta{font-size:11px;color:#9aa0aa;margin-top:2px;display:flex;justify-content:space-between}
  .specimen-card .tag{
    position:absolute;top:10px;right:10px;font-size:9px;padding:2px 6px;border-radius:4px;
    background:rgba(242,193,78,.15);color:#F2C14E;font-weight:500;
  }

  .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .cat-item{
    display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;
    padding:10px 4px;border-radius:12px;transition:background .2s;
  }
  .cat-item:active{background:rgba(255,255,255,.06)}
  .cat-item .ico{
    width:44px;height:44px;border-radius:12px;
    background:rgba(168,213,197,.1);display:flex;align-items:center;justify-content:center;
  }
  .cat-item .lbl{font-size:11px;color:#d5d8dd}

  /* ---------- Catalog list page ---------- */
  .catalog{background:#F7F4EC}
  .catalog .filter-bar{
    position:sticky;top:88px;z-index:10;background:#F7F4EC;
    padding:10px 16px;display:flex;gap:8px;overflow-x:auto;
    border-bottom:1px solid rgba(31,36,48,.06);
  }
  .catalog .filter-bar::-webkit-scrollbar{display:none}
  .chip{
    flex:none;padding:6px 14px;border-radius:20px;font-size:12px;
    background:#fff;border:1px solid rgba(31,36,48,.1);color:#555a63;
    cursor:pointer;transition:all .2s;
  }
  .chip.active{background:#0E7C5B;color:#fff;border-color:#0E7C5B}

  .waterfall{
    padding:14px;columns:2;column-gap:12px;
  }
  .wf-card{
    break-inside:avoid;margin-bottom:12px;border-radius:14px;
    background:#fff;overflow:hidden;cursor:pointer;
    box-shadow:0 2px 10px rgba(31,36,48,.06);
    opacity:0;transform:translateY(16px);
    animation:wfIn .5s cubic-bezier(.22,.61,.36,1) forwards;
  }
  @keyframes wfIn{to{opacity:1;transform:translateY(0)}}
  .wf-card .img{
    width:100%;background:#F0EDE4;display:flex;align-items:center;justify-content:center;padding:10px;
  }
  .wf-card .info{padding:10px 12px 12px}
  .wf-card .nm{font-family:"Noto Serif SC",serif;font-size:14px;font-weight:600;color:#1F2430}
  .wf-card .lc{font-size:10px;color:#888d96;font-family:"Playfair Display",serif;font-style:italic;margin-top:1px}
  .wf-card .row{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:#555a63}
  .wf-card .row .hd{color:#0E7C5B;font-weight:600}

  /* skeleton */
  .skel{background:#ebe7dd;border-radius:8px;animation:skelpulse 1.4s ease-in-out infinite}
  @keyframes skelpulse{0%,100%{opacity:.5}50%{opacity:.9}}
  .skel-wrap .skel-card{margin-bottom:12px;border-radius:14px;background:#fff;overflow:hidden;padding:0}
  .skel-wrap .skel-card .skel-img{width:100%;aspect-ratio:1/1}
  .skel-wrap .skel-card .skel-body{padding:12px;display:flex;flex-direction:column;gap:8px}
  .skel-wrap .skel-card .skel-t{height:14px;width:70%}
  .skel-wrap .skel-card .skel-s{height:10px;width:45%}

  /* ---------- Detail page ---------- */
  .detail{background:#fff}
  .detail-hero{
    position:relative;height:360px;background:linear-gradient(180deg,#1F2430 0%,#2a3140 100%);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .detail-hero .big-crystal{
    width:220px;height:220px;will-change:transform;
    filter:drop-shadow(0 20px 40px rgba(0,0,0,.4));
  }
  .detail-hero::after{
    content:"";position:absolute;bottom:0;left:0;right:0;height:80px;
    background:linear-gradient(180deg,transparent,#fff);
  }
  .detail-body{padding:0 20px 120px;margin-top:-20px;position:relative;z-index:2}
  .detail-name{font-family:"Noto Serif SC",serif;font-size:28px;font-weight:700;color:#1F2430}
  .detail-latin{font-family:"Playfair Display",serif;font-style:italic;font-size:14px;color:#888d96;margin-top:4px}
  .detail-formula{
    margin-top:10px;display:inline-block;padding:4px 10px;border-radius:6px;
    background:#F0EDE4;font-family:"Playfair Display",serif;font-size:13px;color:#555a63;
  }

  .data-row{
    margin-top:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  }
  .data-cell{
    background:#F7F4EC;border-radius:12px;padding:12px 8px;text-align:center;
  }
  .data-cell .v{font-family:"Playfair Display",serif;font-size:18px;font-weight:700;color:#0E7C5B}
  .data-cell .l{font-size:10px;color:#888d96;margin-top:3px}

  .detail-section{margin-top:28px}
  .detail-section h3{
    font-family:"Noto Serif SC",serif;font-size:16px;font-weight:700;color:#1F2430;margin-bottom:12px;
    display:flex;align-items:center;gap:8px;
  }
  .detail-section h3::before{
    content:"";width:3px;height:14px;background:#0E7C5B;border-radius:2px;
  }
  .detail-section p{font-size:13px;line-height:1.8;color:#555a63}

  .lattice-box{
    background:#F7F4EC;border-radius:14px;padding:20px;
    display:flex;align-items:center;justify-content:center;gap:20px;
  }
  .lattice-box svg{flex:none}
  .lattice-box .info{flex:1}
  .lattice-box .info h4{font-family:"Noto Serif SC",serif;font-size:14px;font-weight:600;margin-bottom:6px}
  .lattice-box .info p{font-size:11px;line-height:1.6;color:#888d96}

  .loc-tags{display:flex;flex-wrap:wrap;gap:6px}
  .loc-tag{
    padding:5px 10px;border-radius:6px;font-size:12px;
    background:rgba(14,124,91,.1);color:#0E7C5B;
  }

  .bottom-bar{
    position:absolute;bottom:0;left:0;right:0;height:84px;padding:12px 20px 28px;
    background:#fff;border-top:1px solid rgba(0,0,0,.06);
    display:flex;gap:12px;align-items:center;z-index:95;
  }
  .bottom-bar .btn-icon{
    width:44px;height:44px;border-radius:12px;background:#F7F4EC;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:background .2s;
  }
  .bottom-bar .btn-icon:active{background:#ebe7dd}
  .bottom-bar .btn-primary{
    flex:1;height:44px;border-radius:12px;background:#0E7C5B;color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;
    cursor:pointer;transition:all .2s;
  }
  .bottom-bar .btn-primary:active{transform:scale(.98);background:#0b6348}

  /* action sheet */
  .mask{
    position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:300;
    opacity:0;animation:fadeIn .25s ease forwards;
  }
  @keyframes fadeIn{to{opacity:1}}
  .action-sheet{
    position:absolute;bottom:0;left:0;right:0;z-index:301;
    background:#F7F4EC;border-radius:20px 20px 0 0;padding:8px 0 28px;
    transform:translateY(100%);animation:sheetUp .35s cubic-bezier(.22,.61,.36,1) forwards;
  }
  @keyframes sheetUp{to{transform:translateY(0)}}
  .action-sheet .handle{
    width:36px;height:4px;border-radius:2px;background:#d5d8dd;margin:8px auto 10px;
  }
  .action-sheet .item{
    padding:16px 20px;font-size:15px;color:#1F2430;
    display:flex;align-items:center;gap:14px;border-bottom:1px solid rgba(0,0,0,.04);
    cursor:pointer;
  }
  .action-sheet .item:active{background:#ebe7dd}
  .action-sheet .item .iic{width:22px;height:22px;color:#0E7C5B}
  .action-sheet .cancel{margin-top:8px;padding:16px;text-align:center;color:#888d96;font-size:15px;cursor:pointer;background:#fff}

  /* pull to refresh indicator */
  .ptr-indicator{
    position:absolute;top:88px;left:0;right:0;height:0;overflow:hidden;
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:12px;color:#A8D5C5;
    transition:height .3s ease;
  }
  .ptr-indicator.show{height:44px}
  .ptr-indicator .spinner{
    width:16px;height:16px;border:2px solid rgba(168,213,197,.3);
    border-top-color:#A8D5C5;border-radius:50%;animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- Collection page ---------- */
  .collection{background:#F7F4EC}
  .stat-header{
    background:linear-gradient(160deg,#1F2430 0%,#2a3140 100%);
    padding:100px 20px 30px;color:#fff;position:relative;overflow:hidden;
  }
  .stat-header::before{
    content:"";position:absolute;top:-40px;right:-40px;width:200px;height:200px;
    background:radial-gradient(circle,rgba(14,124,91,.4) 0%,transparent 70%);
  }
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;position:relative;z-index:2}
  .stat-item{text-align:center}
  .stat-item .n{font-family:"Playfair Display",serif;font-size:28px;font-weight:700;color:#A8D5C5}
  .stat-item .l{font-size:11px;color:#9aa0aa;margin-top:2px}

  .ring-box{
    display:flex;align-items:center;gap:14px;margin-top:20px;padding:14px;
    background:rgba(255,255,255,.06);border-radius:14px;backdrop-filter:blur(8px);
    position:relative;z-index:2;
  }
  .ring-box .ring{width:56px;height:56px;flex:none}
  .ring-box .rb-info h4{font-size:13px;font-weight:600}
  .ring-box .rb-info p{font-size:11px;color:#9aa0aa;margin-top:3px}

  .clist{padding:14px;background:#F7F4EC}
  .clist-item{
    display:flex;align-items:center;gap:12px;padding:14px;
    background:#fff;border-radius:14px;margin-bottom:10px;
    box-shadow:0 2px 8px rgba(31,36,48,.04);
    position:relative;cursor:pointer;
    transition:transform .2s ease;
    z-index:2;
  }
  .swipe-wrap{position:relative;overflow:hidden;margin-bottom:10px;border-radius:14px}
  .swipe-actions{
    position:absolute;right:0;top:0;bottom:0;display:flex;z-index:1;
  }
  .swipe-btn{
    width:70px;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:12px;font-weight:500;cursor:pointer;
  }
  .swipe-btn.trade{background:#0E7C5B}
  .swipe-btn.del{background:#E4574C}

  .clist-item .thumb{
    width:56px;height:56px;border-radius:12px;
    background:#F0EDE4;display:flex;align-items:center;justify-content:center;flex:none;
  }
  .clist-item .info{flex:1;min-width:0}
  .clist-item .nm{font-family:"Noto Serif SC",serif;font-size:15px;font-weight:600;color:#1F2430}
  .clist-item .dt{font-size:11px;color:#888d96;margin-top:3px}
  .clist-item .price{font-family:"Playfair Display",serif;font-size:15px;font-weight:700;color:#E4574C}

  /* ---------- Discover page ---------- */
  .discover{background:#F7F4EC}
  .discover .d-hero{
    padding-top:88px;background:linear-gradient(180deg,#F0EDE4 0%,#F7F4EC 100%);
    position:relative;
  }
  .discover .d-hero h2{
    font-family:"Playfair Display","Noto Serif SC",serif;font-size:26px;font-weight:700;
    padding:0 20px 12px;color:#1F2430;letter-spacing:1px;
  }
  .discover-tabs{
    position:sticky;top:88px;z-index:10;
    background:#F7F4EC;padding:0 16px 0;
    display:flex;gap:20px;border-bottom:1px solid rgba(31,36,48,.06);
  }
  .discover-tabs .tab{
    padding:12px 2px;font-size:14px;color:#888d96;font-weight:500;cursor:pointer;
    position:relative;white-space:nowrap;
  }
  .discover-tabs .tab.active{color:#1F2430;font-weight:700}
  .discover-tabs .tab.active::after{
    content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:20px;height:3px;border-radius:2px;background:#0E7C5B;
  }

  .article-list{padding:14px}
  .article-card{
    background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;
    box-shadow:0 2px 10px rgba(31,36,48,.05);cursor:pointer;
    transition:transform .2s;
  }
  .article-card:active{transform:scale(.98)}
  .article-card .cat{
    font-size:10px;color:#E4574C;font-weight:600;letter-spacing:1px;
    display:inline-block;padding:2px 8px;background:rgba(228,87,76,.1);border-radius:4px;margin-bottom:10px;
  }
  .article-card h3{font-family:"Noto Serif SC",serif;font-size:16px;font-weight:700;line-height:1.5;color:#1F2430}
  .article-card .excerpt{font-size:12px;line-height:1.7;color:#888d96;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .article-card .meta{display:flex;justify-content:space-between;margin-top:12px;font-size:11px;color:#aaaeb6}

// Ring progress SVG
const RingProgress = ({ value = 72, max = 100, size = 56, stroke = 6, color = "#0E7C5B", bg = "rgba(255,255,255,.15)" }) => {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (value / max) * c;
  return (
    <svg width={size} height={size} className="ring">
      <circle cx={size/2} cy={size/2} r={r} stroke={bg} strokeWidth={stroke} fill="none"/>
      <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
        strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
        transform={`rotate(-90 ${size/2} ${size/2})`} style={{transition:"stroke-dashoffset 1.2s ease"}}/>
      <text x="50%" y="50%" dominantBaseline="central" textAnchor="middle"
        fill="#A8D5C5" fontSize="14" fontFamily="Playfair Display, serif" fontWeight="700">{value}</text>
    </svg>
  );
};

/* ============================================================
   App Context — page stack management
   ============================================================ */
const AppContext = React.createContext(null);

const useApp = () => React.useContext(AppContext);

const AppProvider = ({ children }) => {
  const [stack, setStack] = useState([{ name: "home", anim: null }]);
  const [tab, setTab] = useState("home"); // home | catalog | discover | profile
  const [actionSheet, setActionSheet] = useState(null);
  const timersRef = useRef([]);

  const push = (name, params = {}) => {
    setStack(s => [...s, { name, params, anim: "in" }]);
  };

  const pop = () => {
    if (stack.length <= 1) return;
    setStack(s => {
      const next = [...s];
      next[next.length - 1] = { ...next[next.length - 1], anim: "out" };
      return next;
    });
    // actually remove after animation
    const t = setTimeout(() => {
      setStack(s => s.slice(0, -1));
    }, 320);
    timersRef.current.push(t);
  };

  const switchTab = (t) => {
    setTab(t);
    setStack([{ name: t, anim: null }]);
  };

  useEffect(() => {
    return () => timersRef.current.forEach(clearTimeout);
  }, []);

  // pause/resume on visibility change
  useEffect(() => {
    const onVis = () => {
      if (document.hidden) {
        timersRef.current.forEach(clearTimeout);
        timersRef.current = [];
      }
    };
    document.addEventListener("visibilitychange", onVis);
    return () => document.removeEventListener("visibilitychange", onVis);
  }, []);

  const value = { stack, push, pop, tab, switchTab, actionSheet, setActionSheet, timersRef };

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
};

/* ============================================================
   Action Sheet
   ============================================================ */
const ActionSheet = ({ items, onClose }) => {
  const wrapRef = useRef(null);
  const startY = useRef(0);

  const onTouchStart = (e) => {
    startY.current = e.touches[0].clientY;
  };
  const onTouchMove = (e) => {
    const dy = e.touches[0].clientY - startY.current;
    if (dy > 0 && wrapRef.current) {
      wrapRef.current.style.transform = `translateY(${dy}px)`;
    }
  };
  const onTouchEnd = (e) => {
    const dy = e.changedTouches[0].clientY - startY.current;
    if (dy > 80) {
      onClose();
    } else if (wrapRef.current) {
      wrapRef.current.style.transform = "";
    }
  };

  return (
    <>
      <div className="mask" onClick={onClose}></div>
      <div
        className="action-sheet"
        ref={wrapRef}
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
      >
        <div className="handle"></div>
        {items.map((it, i) => (
          <div key={i} className="item" onClick={() => { it.onClick && it.onClick(); onClose(); }}>
            <div className="iic"><Icon name={it.icon} size={20} /></div>
            <span>{it.label}</span>
          </div>
        ))}
        <div className="cancel" onClick={onClose}>取消</div>
      </div>
    </>
  );
};

    if (scrollRef.current.scrollTop <= 0) {
      touchStart.current = { y: e.touches[0].clientY, active: true };

      const h = Math.min(dy * 0.5, 60);

const CollectionPage = () => {
  const { push, setActionSheet } = useApp();
  const [items, setItems] = useState(COLLECTION);
  const [swipedId, setSwipedId] = useState(null);
  const touchStart = useRef({ x: 0, active: false });
  const moveRef = useRef(null);
  const [ringVal, setRingVal] = useState(0);

  useEffect(() => {
    const t = setTimeout(() => setRingVal(7.5), 400);
    return () => clearTimeout(t);
  }, []);

  const handleTouchStart = (id, e) => {
    touchStart.current = { x: e.touches[0].clientX, y: e.touches[0].clientY, active: true, id };
    moveRef.current = null;
  };

  const handleTouchMove = (id, e) => {
    if (!touchStart.current.active || touchStart.current.id !== id) return;
    const dx = e.touches[0].clientX - touchStart.current.x;
    const dy = e.touches[0].clientY - touchStart.current.y;
    if (Math.abs(dx) < Math.abs(dy)) return; // vertical scroll takes over

    const target = e.currentTarget.querySelector(".clist-item");
    if (!target) return;
    let offset = dx;
    if (swipedId === id) {
      offset = dx - 140; // already open state
    }
    offset = Math.max(-140, Math.min(0, offset));
    target.style.transform = `translateX(${offset}px)`;
    moveRef.current = offset;
  };

  const handleTouchEnd = (id) => {
    if (!touchStart.current.active || touchStart.current.id !== id) return;
    touchStart.current.active = false;
    const offset = moveRef.current || 0;
    const target = document.querySelector(`.swipe-wrap[data-id="${id}"] .clist-item`);
    if (!target) return;

    if (offset < -70) {
      target.style.transform = "translateX(-140px)";
      target.style.transition = "transform .25s cubic-bezier(.22,.61,.36,1)";
      setSwipedId(id);
    } else {
      target.style.transform = "translateX(0)";
      target.style.transition = "transform .25s cubic-bezier(.22,.61,.36,1)";
      if (swipedId === id) setSwipedId(null);
    }
    setTimeout(() => {
      if (target) target.style.transition = "";
    }, 260);
  };

  const deleteItem = (id) => {
    setItems(prev => prev.filter(it => it.id !== id));
    setSwipedId(null);
  };

  const tradeItem = (id) => {
    setSwipedId(null);
    alert("发布转让中...");
  };

  const handleMore = () => {
    setActionSheet([
      { label: "新增标本", icon: "plus", onClick: () => {} },
      { label: "批量管理", icon: "setting", onClick: () => {} },
      { label: "导出清单", icon: "report", onClick: () => {} },
    ]);
  };

  return (
    <div className="page collection">
      <StatusBar light />
      <NavBar variant="transparent" title="我的标本" onMore={handleMore} />

      <div className="page-inner" style={{paddingTop:0}}>
        <div className="stat-header">
          <div className="stat-row">
            <div className="stat-item">
              <div className="n">{items.length}</div>
              <div className="l">藏品总数</div>
            </div>
            <div className="stat-item">
              <div className="n">2.4<span style={{fontSize:14}}>kg</span></div>
              <div className="l">总重量</div>
            </div>
            <div className="stat-item">
              <div className="n">7.5</div>
              <div className="l">最硬 / 莫氏</div>
            </div>
          </div>

          <div className="ring-box">
            <RingProgress value={ringVal * 10} max={100} size={56} color="#A8D5C5" />
            <div className="rb-info">
              <h4>收藏完整度 · 硅酸盐类</h4>
              <p>已集齐 7.5 / 10 种常见矿物，再收 2.5 种解锁成就徽章</p>
            </div>
          </div>
        </div>

        <div className="clist">
          {items.map(it => (
            <div key={it.id} className="swipe-wrap" data-id={it.id}
              onTouchStart={(e) => handleTouchStart(it.id, e)}
              onTouchMove={(e) => handleTouchMove(it.id, e)}
              onTouchEnd={() => handleTouchEnd(it.id)}
            >
              <div className="swipe-actions">
                <div className="swipe-btn trade" onClick={() => tradeItem(it.id)}>转让</div>
                <div className="swipe-btn del" onClick={() => deleteItem(it.id)}>删除</div>
              </div>
              <div className="clist-item" onClick={() => push("detail", { id: it.id })}>
                <div className="thumb">
                  <CrystalSVG variant={it.variant} color={it.pal} size={40} />
                </div>
                <div className="info">
                  <div className="nm">{it.name}</div>
                  <div className="dt">入手于 {it.date}</div>
                </div>
                <div className="price">{it.price}</div>
              </div>
            </div>
          ))}
          {items.length === 0 && (
            <div style={{textAlign:"center", padding:"60px 20px", color:"#aaaeb6"}}>
              <Icon name="collect" size={40} color="#d5d8dd"/>
              <div style={{marginTop:12, fontSize:13}}>还没有收藏的标本</div>
              <div style={{marginTop:4, fontSize:11}}>去图鉴看看有没有喜欢的吧</div>

      <div className="page-inner" style={{paddingTop:0}}>
        <div className="doc-hero">
          <h1>API Reference</h1>
          <p>基础路径：<code className="inline">/api/miniprogram/v2</code></p>
        </div>

        <div className="doc-section">
          <h2>通用说明</h2>
          <div className="token-row"><span className="k">协议</span><span className="v" style={{fontSize:12}}>HTTPS</span></div>
          <div className="token-row"><span className="k">数据格式</span><span className="v" style={{fontSize:12}}>application/json</span></div>
          <div className="token-row"><span className="k">认证方式</span><span className="v" style={{fontSize:12}}>Header: Authorization: Bearer {`<token>`}</span></div>
          <div className="token-row"><span className="k">统一响应</span><span className="v" style={{fontSize:12}}>{"{ code, data, message }"}</span></div>
          <div className="token-row"><span className="k">分页约定</span><span className="v" style={{fontSize:12}}>page / pageSize / total</span></div>
        </div>

        {apis.map((api, i) => (
          <div key={i} className="doc-section">
            <div className="api-item" style={{marginBottom:0, paddingBottom:0, borderBottom:"none"}}>
              <div className="api-head">
                <span className={`api-method ${methodClass(api.method)}`}>{api.method}</span>
                <span className="api-path">{api.path}</span>
              </div>
              <div className="api-desc">{api.desc}</div>
              <div style={{marginBottom:10, fontSize:12, color:"#555a63", fontWeight:600}}>请求参数</div>
              <table className="api-table">
                <thead>
                  <tr><th>参数</th><th>类型</th><th>说明</th></tr>
                </thead>
                <tbody>
                  {api.params.map(p => (
                    <tr key={p.n}>
                      <td className="name">{p.n}</td>
                      <td>{p.t}</td>
                      <td>{p.d}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div style={{marginTop:12, marginBottom:8, fontSize:12, color:"#555a63", fontWeight:600}}>响应示例</div>
              <pre style={{background:"#F7F4EC", padding:12, borderRadius:8,
                fontSize:10, fontFamily:"monospace", color:"#1F2430",
                overflowX:"auto", whiteSpace:"pre-wrap", wordBreak:"break-all"}}>
{api.resp}
              </pre>
            </div>
          </div>
        ))}

        <div style={{height:40}}></div>
      </div>
    </div>
  );
};

/* ============================================================
   Page router
   ============================================================ */
const PageRouter = () => {
  const { stack, actionSheet, setActionSheet, tab } = useApp();
  const current = stack[stack.length - 1];

  const renderPage = (page) => {
    switch (page.name) {
      case "home": return <HomePage key="home" />;
      case "catalog": return <CatalogPage key="catalog" {...page.params} />;
      case "detail": return <DetailPage key="detail" params={page.params} />;
      case "collection": return <CollectionPage key="collection" />;
      case "discover": return <DiscoverPage key="discover" />;
      case "profile": return <ProfilePage key="profile" />;
      case "design-spec": return <DesignSpecPage key="design-spec" />;
      case "api-doc": return <ApiDocPage key="api-doc" />;
      default: return <HomePage key="home" />;
    }
  };

  // Tab bar shows only on root pages (stack length 1) and not on meta pages
  const showTabBar = stack.length === 1 &&
    ["home","catalog","discover","profile"].includes(current.name);

  return (
    <div className="pages">
      {stack.map((page, i) => {
        const isTop = i === stack.length - 1;
        let animClass = "";
        if (page.anim === "in") animClass = "enter-from-right";
        if (page.anim === "out") animClass = "exit-to-right";
        // z-index: top page highest
        const z = 10 + i;
        return (
          <div key={page.name + i} className={`page ${animClass}`}
            style={{zIndex: z, pointerEvents: isTop ? "auto" : "none",
              display: isTop ? "block" : "none"}}>
            {renderPage(page)}
          </div>
        );
      })}

      {showTabBar && <TabBar />}

      {actionSheet && (
        <ActionSheet items={actionSheet} onClose={() => setActionSheet(null)} />
      )}
    </div>
  );
};

/* ============================================================
   Root
   ============================================================ */
const App = () => {
  return (
    <AppProvider>
      <PageRouter />
    </AppProvider>
  );
};

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

// announce upgrade availability
function announceUpgrade() {
  try {
    window.parent.postMessage({ type: "miaoda:upgrade:available", kind: "interactive-prototype" }, "*");
  } catch(e) {}
}
announceUpgrade();
if (document.readyState !== "complete") {
  window.addEventListener("load", announceUpgrade, { once: true });
}
</script>

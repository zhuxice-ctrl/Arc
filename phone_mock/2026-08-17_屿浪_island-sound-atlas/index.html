<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="creative-medium" content="interactive-prototype" />
<title>屿浪 · 海岛声音图鉴｜微信小程序</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=ZCOOL+XiaoWei&display=swap" />
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #e8dfd3;
    font-family: 'Noto Sans SC', -apple-system, system-ui, sans-serif;
    color: #2c2620;
    overflow: hidden;
    cursor: none;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  /* ─── 自定义光标 ─── */
  .cursor-ring {
    position: fixed;
    top: 50%; left: 50%;
    width: 36px; height: 36px;
    border: 2px solid #fff;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.25s cubic-bezier(.2,.9,.3,1.2), height 0.25s cubic-bezier(.2,.9,.3,1.2), border-color 0.2s;
    mix-blend-mode: difference;
    box-shadow: 0 0 12px rgba(255,255,255,0.4), 0 0 24px rgba(255,255,255,0.2);
  }
  .cursor-dot {
    position: fixed;
    top: 50%; left: 50%;
    width: 8px; height: 8px;
    background: #e88b6e;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.15s, height 0.15s, background 0.15s;
    box-shadow: 0 0 10px #e88b6e, 0 0 20px rgba(232,139,110,0.5);
  }
  .cursor-ring.hover {
    width: 52px; height: 52px;
    border-color: #e88b6e;
  }
  .cursor-dot.hover {
    width: 14px; height: 14px;
    background: #fff;
    box-shadow: 0 0 12px #e88b6e;
  }
  .cursor-ripple {
    position: fixed;
    width: 10px; height: 10px;
    border: 2px solid #e88b6e;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%) scale(0);
    opacity: 1;
    animation: rippleOut 0.6s ease-out forwards;
  }
  @keyframes rippleOut {
    0% { width: 10px; height: 10px; opacity: 0.8; }
    100% { width: 80px; height: 80px; opacity: 0; }
  }

  /* ─── 舞台 ─── */
  .stage {
    width: 100%; height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 20% 30%, #f0e7d9 0%, transparent 50%),
      radial-gradient(ellipse at 80% 70%, #d8ccb8 0%, transparent 50%),
      #e8dfd3;
    padding: 40px;
    position: relative;
  }
  .stage-title {
    position: absolute;
    top: 32px; left: 40px;
    font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
    font-size: 22px;
    color: #5c4a36;
    letter-spacing: 2px;
  }
  .stage-title small {
    display: block;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 3px;
    color: #8a7860;
    margin-top: 4px;
  }
  .stage-tags {
    position: absolute;
    top: 40px; right: 40px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
    max-width: 320px;
  }
  .chip {
    padding: 6px 12px;
    background: rgba(255,255,255,0.5);
    border: 1px solid rgba(92,74,54,0.15);
    border-radius: 100px;
    font-size: 12px;
    color: #5c4a36;
    backdrop-filter: blur(8px);
  }

  /* ─── 手机外壳 ─── */
  .phone {
    width: 390px;
    height: 844px;
    background: #1a1a1a;
    border-radius: 54px;
    padding: 10px;
    box-shadow:
      0 40px 80px rgba(60,40,20,0.25),
      0 10px 30px rgba(60,40,20,0.2),
      inset 0 0 0 1.5px rgba(255,255,255,0.08);
    position: relative;
    flex-shrink: 0;
  }
  .phone-screen {
    width: 100%; height: 100%;
    border-radius: 46px;
    overflow: hidden;
    position: relative;
    background: #f8f3eb;
  }
  .dynamic-island {
    position: absolute;
    top: 11px; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 34px;
    background: #000;
    border-radius: 20px;
    z-index: 100;
  }
  .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 30px 0;
    z-index: 50;
    font-family: -apple-system, system-ui;
    font-size: 16px;
    font-weight: 500;
    color: #2c2620;
    pointer-events: none;
  }
  .status-bar.light { color: #fff; }
  .status-icons { display: flex; gap: 5px; align-items: center; }
  .home-indicator {
    position: absolute;
    bottom: 8px; left: 50%;
    transform: translateX(-50%);
    width: 134px; height: 5px;
    background: #2c2620;
    border-radius: 3px;
    z-index: 100;
  }
  .home-indicator.light { background: #fff; }

  /* ─── 小程序胶囊按钮 ─── */
  .capsule {
    position: absolute;
    top: 22px; right: 12px;
    width: 87px; height: 32px;
    background: rgba(255,255,255,0.7);
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 16px;
    display: flex;
    align-items: center;
    z-index: 60;
    backdrop-filter: blur(10px);
  }
  .capsule.dark {
    background: rgba(0,0,0,0.4);
    border-color: rgba(255,255,255,0.1);
  }
  .capsule-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    position: relative;
  }
  .capsule-btn:first-child::after {
    content: '';
    position: absolute;
    right: 0; top: 6px; bottom: 6px;
    width: 1px;
    background: rgba(0,0,0,0.1);
  }
  .capsule.dark .capsule-btn:first-child::after { background: rgba(255,255,255,0.2); }

  /* ─── 页面容器 ─── */
  .pages {
    width: 100%; height: 100%;
    position: relative;
    overflow: hidden;
  }
  .page {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    background: #f8f3eb;
    transition: transform 0.35s cubic-bezier(.2,.8,.2,1), opacity 0.35s;
    will-change: transform, opacity;
  }
  .page::-webkit-scrollbar { display: none; }
  .page.hidden {
    transform: translateX(100%);
    pointer-events: none;
  }
  .page.behind {
    transform: translateX(-30%);
    opacity: 0.5;
    pointer-events: none;
  }

  /* ─── 底部 TabBar ─── */
  .tabbar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 83px;
    background: rgba(255,253,248,0.92);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(0,0,0,0.05);
    display: flex;
    padding: 8px 0 28px;
    z-index: 40;
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: 10px;
    color: #9a8c7a;
    position: relative;
    transition: transform 0.3s cubic-bezier(.2,.9,.3,1.3);
    cursor: pointer;
  }
  .tab-item.active {
    color: #c67a5c;
  }
  .tab-item.active .tab-icon {
    transform: translateY(-2px) scale(1.08);
    filter: drop-shadow(0 3px 6px rgba(198,122,92,0.3));
  }
  .tab-icon {
    width: 24px; height: 24px;
    transition: transform 0.3s cubic-bezier(.2,.9,.3,1.3), filter 0.3s;
  }
  .tab-dot {
    position: absolute;
    bottom: 4px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #c67a5c;
    transform: scale(0);
    transition: transform 0.3s cubic-bezier(.2,.9,.3,1.3);
  }
  .tab-item.active .tab-dot { transform: scale(1); }

  /* ─── 通用 ─── */
  .safe-top { padding-top: 54px; }
  .safe-bottom { padding-bottom: 83px; }
  .serif { font-family: 'Noto Serif SC', serif; }
  .zcool { font-family: 'ZCOOL XiaoWei', serif; }

  /* ─── 首页 ─── */
  .home-hero {
    position: relative;
    height: 340px;
    overflow: hidden;
  }
  .home-hero-img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .home-hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(44,38,32,0) 30%, rgba(44,38,32,0.7) 100%);
  }
  .home-hero-content {
    position: absolute;
    bottom: 24px; left: 20px; right: 20px;
    color: #fff;
  }
  .home-hero-title {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 36px;
    letter-spacing: 4px;
    margin-bottom: 4px;
  }
  .home-hero-sub {
    font-size: 12px;
    opacity: 0.85;
    letter-spacing: 2px;
  }
  .wave-canvas {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    height: 80px;
    pointer-events: none;
  }

  .home-section {
    padding: 24px 20px 0;
  }
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .section-title {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 20px;
    color: #2c2620;
    letter-spacing: 1px;
  }
  .section-more {
    font-size: 12px;
    color: #9a8c7a;
  }

  /* 岛屿卡片（横向滚动） */
  .island-scroll {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding: 4px 20px 2px;
    margin: 0 -20px;
    scrollbar-width: none;
  }
  .island-scroll::-webkit-scrollbar { display: none; }
  .island-card {
    flex-shrink: 0;
    width: 150px;
    border-radius: 16px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 4px 20px rgba(92,74,54,0.1);
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(.2,.9,.3,1.2);
  }
  .island-card:hover { transform: translateY(-4px); }
  .island-card-img {
    width: 100%; height: 110px;
    object-fit: cover;
  }
  .island-card-body {
    padding: 10px 12px 14px;
  }
  .island-card-name {
    font-family: 'Noto Serif SC', serif;
    font-size: 14px;
    font-weight: 600;
    color: #2c2620;
    margin-bottom: 2px;
  }
  .island-card-meta {
    font-size: 11px;
    color: #9a8c7a;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .sound-dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: #c67a5c;
    border-radius: 50%;
    position: relative;
  }
  .sound-dot::before {
    content: '';
    position: absolute;
    inset: -3px;
    border: 1px solid #c67a5c;
    border-radius: 50%;
    opacity: 0.5;
    animation: soundPulse 2s ease-in-out infinite;
  }
  @keyframes soundPulse {
    0%, 100% { transform: scale(0.8); opacity: 0.6; }
    50% { transform: scale(1.4); opacity: 0; }
  }

  /* 声音瀑布流 */
  .sound-masonry {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 20px 24px;
  }
  .sound-card {
    border-radius: 14px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 2px 14px rgba(92,74,54,0.08);
    cursor: pointer;
    transition: transform 0.3s;
    position: relative;
  }
  .sound-card:hover { transform: translateY(-2px); }
  .sound-card.tall .sound-card-img { height: 180px; }
  .sound-card.short .sound-card-img { height: 130px; }
  .sound-card-img {
    width: 100%;
    object-fit: cover;
    transition: transform 0.6s;
  }
  .sound-card:hover .sound-card-img { transform: scale(1.05); }
  .sound-card-body {
    padding: 10px 12px 12px;
  }
  .sound-card-tag {
    font-size: 10px;
    color: #c67a5c;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .sound-card-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 14px;
    font-weight: 600;
    color: #2c2620;
    line-height: 1.3;
    margin-bottom: 6px;
  }
  .sound-card-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    color: #9a8c7a;
  }
  .play-mini {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #c67a5c;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }

  /* ─── 分类页（吸顶 Tab） ─── */
  .category-hero {
    height: 200px;
    background: linear-gradient(135deg, #d4c4a8 0%, #b8a582 100%);
    position: relative;
    overflow: hidden;
  }
  .category-hero-content {
    padding: 70px 20px 0;
    color: #fff;
  }
  .category-hero-title {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 32px;
    letter-spacing: 3px;
  }
  .category-hero-sub {
    font-size: 12px;
    opacity: 0.85;
    margin-top: 4px;
    letter-spacing: 2px;
  }
  .sticky-tabs {
    position: sticky;
    top: 54px;
    background: rgba(248,243,235,0.95);
    backdrop-filter: blur(12px);
    display: flex;
    gap: 24px;
    padding: 12px 20px;
    z-index: 10;
    border-bottom: 1px solid rgba(0,0,0,0.05);
  }
  .sticky-tab {
    font-size: 14px;
    color: #9a8c7a;
    position: relative;
    padding-bottom: 6px;
    cursor: pointer;
    transition: color 0.2s;
  }
  .sticky-tab.active {
    color: #2c2620;
    font-weight: 600;
  }
  .sticky-tab.active::after {
    content: '';
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 20px; height: 3px;
    background: #c67a5c;
    border-radius: 2px;
  }

  /* 分类列表项（带左滑） */
  .cat-list { padding: 8px 16px 24px; }
  .cat-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid rgba(0,0,0,0.05);
    position: relative;
    overflow: hidden;
  }
  .cat-item:last-child { border-bottom: none; }
  .cat-item-img {
    width: 64px; height: 64px;
    border-radius: 12px;
    object-fit: cover;
    flex-shrink: 0;
  }
  .cat-item-info { flex: 1; min-width: 0; }
  .cat-item-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 15px;
    font-weight: 600;
    color: #2c2620;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cat-item-desc {
    font-size: 11px;
    color: #9a8c7a;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .cat-item-swipe-actions {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    display: flex;
    transform: translateX(100%);
    transition: transform 0.3s;
  }
  .cat-item.swiped .cat-item-swipe-actions { transform: translateX(0); }
  .swipe-btn {
    width: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 12px;
    border: none;
    cursor: pointer;
  }
  .swipe-btn.collect { background: #c67a5c; }
  .swipe-btn.delete { background: #8a6a52; }

  /* ─── 详情页 ─── */
  .detail-hero {
    position: relative;
    height: 420px;
    overflow: hidden;
  }
  .detail-hero-img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .detail-nav {
    position: absolute;
    top: 48px; left: 16px;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    z-index: 10;
    cursor: pointer;
  }
  .detail-body {
    background: #f8f3eb;
    border-radius: 28px 28px 0 0;
    margin-top: -28px;
    position: relative;
    padding: 28px 20px 120px;
    z-index: 5;
  }
  .detail-tag-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .detail-tag {
    padding: 4px 10px;
    background: rgba(198,122,92,0.12);
    color: #c67a5c;
    border-radius: 100px;
    font-size: 11px;
    letter-spacing: 1px;
  }
  .detail-title {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 28px;
    color: #2c2620;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  .detail-loc {
    font-size: 12px;
    color: #9a8c7a;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* 声波可视化 */
  .waveform {
    height: 80px;
    background: #fff;
    border-radius: 16px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 20px;
    box-shadow: 0 2px 12px rgba(92,74,54,0.06);
  }
  .waveform-bar {
    flex: 1;
    background: linear-gradient(180deg, #e8b89c 0%, #c67a5c 100%);
    border-radius: 2px;
    max-width: 4px;
  }

  .detail-section-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 16px;
    font-weight: 600;
    color: #2c2620;
    margin: 20px 0 12px;
  }
  .detail-desc {
    font-size: 13px;
    color: #5c4a36;
    line-height: 1.8;
  }

  /* 底部吸底操作栏 */
  .detail-bottom-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 14px 20px 30px;
    background: rgba(255,253,248,0.95);
    backdrop-filter: blur(16px);
    border-top: 1px solid rgba(0,0,0,0.05);
    display: flex;
    gap: 12px;
    align-items: center;
    z-index: 30;
  }
  .action-icon-btn {
    width: 44px; height: 44px;
    border-radius: 14px;
    background: #f5eee3;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #5c4a36;
    cursor: pointer;
    transition: background 0.2s;
  }
  .action-icon-btn:hover { background: #ede2cf; }
  .action-primary {
    flex: 1;
    height: 44px;
    border-radius: 14px;
    background: linear-gradient(135deg, #e8a085 0%, #c67a5c 100%);
    color: #fff;
    border: none;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 2px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(198,122,92,0.35);
  }
  .action-primary::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    animation: shine 3s ease-in-out infinite;
  }
  @keyframes shine {
    0% { left: -100%; }
    50%, 100% { left: 100%; }
  }

  /* ─── 个人中心 ─── */
  .profile-header {
    padding: 80px 20px 30px;
    background: linear-gradient(180deg, #d4c4a8 0%, #f8f3eb 100%);
    position: relative;
  }
  .profile-top-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .profile-avatar {
    width: 68px; height: 68px;
    border-radius: 50%;
    background: linear-gradient(135deg, #e8b89c, #c67a5c);
    border: 3px solid rgba(255,255,255,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 24px;
    color: #fff;
    position: relative;
  }
  .profile-avatar::before {
    content: '';

  // ──────── 声波条组件 ────────
  function Waveform({ playing, barCount = 48 }) {
    const barsRef = useRef([]);
    const rafRef = useRef(null);

    useEffect(() => {
      if (!playing) {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        barsRef.current.forEach(bar => {
          if (bar) bar.style.height = '30%';
        });
        return;
      }
      const animate = () => {
        barsRef.current.forEach((bar, i) => {
          if (!bar) return;
          const base = 30 + Math.sin(Date.now() / 400 + i * 0.5) * 20;
          const noise = Math.random() * 30;
          bar.style.height = Math.min(95, base + noise) + '%';
        });
        rafRef.current = requestAnimationFrame(animate);
      };
      rafRef.current = requestAnimationFrame(animate);
      return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
    }, [playing]);

    return (
      <div className="waveform">
        {Array.from({ length: barCount }).map((_, i) => (
          <div
            key={i}
            ref={el => barsRef.current[i] = el}
            className="waveform-bar"
            style={{ height: '30%', transition: playing ? 'none' : 'height 0.3s' }}
          />
        ))}
      </div>
    );
  }

      if (pageRef.current?.scrollTop <= 0) {
        startY.current = e.touches[0].clientY;
      }

    const handleTouchMove = (e) => {
      if (pageRef.current?.scrollTop <= 0 && startY.current) {
        const diff = e.touches[0].clientY - startY.current;
        if (diff > 0) setPullDist(Math.min(diff * 0.5, 80));
      }
    };
    const handleTouchEnd = () => {
      if (pullDist > 50) {
        setRefreshing(true);
        setPullDist(60);
        setTimeout(() => {
          setRefreshing(false);
          setPullDist(0);
        }, 1500);
      } else {
        setPullDist(0);
      }
      startY.current = 0;

  // ──────── 主应用 ────────
  function App() {
    const [currentTab, setCurrentTab] = useState('home'); // home / category / wave / profile
    const [detailSound, setDetailSound] = useState(null);
    const [specOpen, setSpecOpen] = useState(false);
    const [apiOpen, setApiOpen] = useState(false);
    const [pageTransition, setPageTransition] = useState('push'); // push / pop
    const [skeleton, setSkeleton] = useState(true);

    useEffect(() => {
      const t = setTimeout(() => setSkeleton(false), 1200);
      return () => clearTimeout(t);
    }, []);

    const tabs = [
      { key: 'home', label: '首页', icon: Icon.Home },
      { key: 'category', label: '图鉴', icon: Icon.Compass },
      { key: 'wave', label: '屿浪', icon: Icon.Wave },
      { key: 'profile', label: '我的', icon: Icon.User },
    ];

    const handleTabClick = (key) => {
      setPageTransition('pop');
      setDetailSound(null);
      setSpecOpen(false);
      setApiOpen(false);
      setTimeout(() => {
        setCurrentTab(key);
        setPageTransition('push');
      }, 50);
    };

    const openDetail = (sound) => {
      setDetailSound(sound);
    };
    const closeDetail = () => {
      setDetailSound(null);
    };

    // 计算当前最顶层页面（用于 TabBar 显示）
    const showTabBar = !detailSound && !specOpen && !apiOpen;

    return (
      <div className="pages">
        {/* 首页 */}
        <div className={`page ${currentTab === 'home' ? '' : 'hidden'}`}>
          {skeleton ? <SkeletonHome /> : <HomePage onOpenDetail={openDetail} onOpenIsland={() => setCurrentTab('category')} />}
        </div>
        {/* 分类页 */}
        <div className={`page ${currentTab === 'category' ? '' : 'hidden'}`}>
          {skeleton ? <SkeletonList /> : <CategoryPage onOpenDetail={openDetail} />}
        </div>
        {/* 屿浪（设计规范） */}
        <div className={`page ${currentTab === 'wave' ? '' : 'hidden'}`}>
          {skeleton ? <SkeletonList /> : <SpecPage onBack={() => {}} />}
        </div>
        {/* 个人中心 */}
        <div className={`page ${currentTab === 'profile' ? '' : 'hidden'}`}>
          {skeleton ? <SkeletonProfile /> : (
            <div>
              <ProfilePage />
              {/* 入口：接口文档 */}
              <div style={{ position: 'absolute', bottom: 90, right: 16, zIndex: 5 }}>
                <button
                  style={{
                    width: 52, height: 52, borderRadius: '50%',
                    background: 'linear-gradient(135deg, #3a332b, #2c2620)',
                    color: '#e8b89c', border: 'none',
                    boxShadow: '0 6px 20px rgba(44,38,32,0.4)',
                    cursor: 'pointer',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontFamily: 'ui-monospace, monospace', fontSize: 18, fontWeight: 700,
                  }}
                  onClick={() => setApiOpen(true)}
                  title="API 文档"
                >
                  {'</>'}
                </button>
              </div>
            </div>
          )}
        </div>

        {/* 详情页（模态叠层） */}
        {detailSound && (
          <DetailPage sound={detailSound} onBack={closeDetail} />
        )}

        {/* 接口文档页（模态叠层） */}
        {apiOpen && (
          <ApiPage onBack={() => setApiOpen(false)} />
        )}

        {/* TabBar */}
        {showTabBar && (
          <div className="tabbar">
            {tabs.map(tab => (
              <div
                key={tab.key}
                className={`tab-item ${currentTab === tab.key ? 'active' : ''}`}
                onClick={() => handleTabClick(tab.key)}
              >
                <div className="tab-icon">
                  <tab.icon size={24} color={currentTab === tab.key ? '#c67a5c' : '#9a8c7a'} />
                </div>
                <span>{tab.label}</span>
                <div className="tab-dot" />
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

            </div>
          ))}
        </div>
        <div style={{ margin: '0 16px', background: '#fff', borderRadius: 14, overflow: 'hidden' }}>
          {[1,2,3].map(i => (
            <div key={i} style={{ padding: 14, borderBottom: '1px solid #f5f5f5', display: 'flex', alignItems: 'center', gap: 10 }}>
              <div className="skeleton" style={{ width: 28, height: 28, borderRadius: 8 }} />
              <div className="skeleton" style={{ height: 14, width: 80, borderRadius: 4 }} />
            </div>
          ))}
        </div>
      </div>
    );
  }

  // ──────── 渲染 ────────
  const root = ReactDOM.createRoot(document.getElementById('pages'));
  root.render(<App />);

  // ──────── 自定义光标 ────────
  (function initCursor() {
    const ring = document.getElementById('cursorRing');
    const dot = document.getElementById('cursorDot');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let ringX = mouseX, ringY = mouseY;
    let rafId = null;
    let visible = false;

    const animate = () => {
      ringX += (mouseX - ringX) * 0.18;
      ringY += (mouseY - ringY) * 0.18;
      ring.style.left = ringX + 'px';
      ring.style.top = ringY + 'px';
      dot.style.left = mouseX + 'px';
      dot.style.top = mouseY + 'px';
      rafId = requestAnimationFrame(animate);
    };

    const handleMove = (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      if (!visible) {
        visible = true;
        ring.style.opacity = 1;
        dot.style.opacity = 1;
        rafId = requestAnimationFrame(animate);
      }
    };

    const handleClick = (e) => {
      const ripple = document.createElement('div');
      ripple.className = 'cursor-ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    };

    const handleOver = (e) => {
      if (e.target.closest('button, .tab-item, .island-card, .sound-card, .cat-item, .grid-item, .profile-row, .detail-nav, .sticky-tab, .swipe-btn, .action-primary, .action-icon-btn, .sheet-option, .sheet-cancel')) {
        ring.classList.add('hover');
        dot.classList.add('hover');
      }
    };
    const handleOut = (e) => {
      if (e.target.closest('button, .tab-item, .island-card, .sound-card, .cat-item, .grid-item, .profile-row, .detail-nav, .sticky-tab, .swipe-btn, .action-primary, .action-icon-btn, .sheet-option, .sheet-cancel')) {
        ring.classList.remove('hover');
        dot.classList.remove('hover');
      }
    };

    // 可见性切换暂停动画
    const handleVisibility = () => {
      if (document.hidden) {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
      } else if (visible) {
        rafId = requestAnimationFrame(animate);
      }
    };

    window.addEventListener('mousemove', handleMove);
    window.addEventListener('click', handleClick);
    document.addEventListener('mouseover', handleOver);
    document.addEventListener('mouseout', handleOut);
    document.addEventListener('visibilitychange', handleVisibility);

    // 初始动画启动（光标显示在屏幕中央）
    ring.style.left = '50%';
    ring.style.top = '50%';
    dot.style.left = '50%';
    dot.style.top = '50%';
    rafId = requestAnimationFrame(animate);
    visible = true;

    // 卸载清理
    window.addEventListener('beforeunload', () => {
      if (rafId) cancelAnimationFrame(rafId);
    });
  })();
</script>
</body>
</html>

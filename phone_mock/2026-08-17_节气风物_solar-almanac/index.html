<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>节气风物 · 微信小程序</title>

<!-- Fonts: traditional Chinese serif + clean sans -->
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Ma+Shan+Zheng&display=swap" />

<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<style>
  :root {
    --ink: #2C241E;
    --paper: #F5EFE3;
    --vermilion: #B83A2F;
    --bamboo: #6B8E5A;
    --ochre: #D4B896;
    --ash: #8B7D6B;
    --cream: #FAF6EC;
    --deep-ink: #1A1512;
    --gold: #B89054;
    --jade: #5A7A6A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    width: 100%;
    background: #E8E2D5;
    font-family: 'Noto Sans SC', -apple-system, system-ui, sans-serif;
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Decorative rice-paper background pattern */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(184, 58, 47, 0.03), transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(107, 142, 90, 0.04), transparent 50%),
      #E8E2D5;
    pointer-events: none;
    z-index: 0;
  }

  .showcase-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    position: relative;
    z-index: 1;
    padding: 40px 20px;
  }

  .showcase-title {
    text-align: center;
  }

  .showcase-title h1 {
    font-family: 'Ma Shan Zheng', 'Noto Serif SC', serif;
    font-size: 36px;
    color: var(--ink);
    letter-spacing: 8px;
    margin-bottom: 6px;
  }

  .showcase-title p {
    font-size: 13px;
    color: var(--ash);
    letter-spacing: 2px;
    font-family: 'Noto Serif SC', serif;
  }

  /* Custom cursor */
  .custom-cursor {
    position: fixed;
    width: 24px;
    height: 24px;
    border: 2px solid var(--vermilion);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.2s ease, height 0.2s ease, background 0.2s ease;
    mix-blend-mode: difference;
  }

  .custom-cursor.drag {
    width: 40px;
    height: 40px;
    background: rgba(184, 58, 47, 0.1);
  }

  @media (hover: none) {
    .custom-cursor { display: none; }
  }

  /* ─── 小程序容器 ─── */
  .miniapp-root {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
    background: var(--paper);
  }

  /* WeChat capsule button */
  .wx-capsule {
    position: absolute;
    top: 56px;
    right: 16px;
    width: 87px;
    height: 32px;
    background: rgba(44, 36, 30, 0.4);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    z-index: 100;
    border: 0.5px solid rgba(255,255,255,0.15);
    transition: background 0.3s;
  }

  .wx-capsule.light {
    background: rgba(255,255,255,0.6);
    border: 0.5px solid rgba(44,36,30,0.08);
  }

  .wx-capsule-btn {
    width: 50%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .wx-capsule-divider {
    width: 0.5px;
    height: 16px;
    background: rgba(255,255,255,0.25);
  }

  .wx-capsule.light .wx-capsule-divider {
    background: rgba(44,36,30,0.15);
  }

  /* Navbar */
  .wx-navbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 88px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 10px;
    z-index: 90;
    transition: background 0.3s, color 0.3s;
    pointer-events: none;
  }

  .wx-navbar-title {
    font-size: 17px;
    font-weight: 500;
    font-family: 'Noto Sans SC', sans-serif;
    letter-spacing: 1px;
  }

  .wx-navbar-back {
    position: absolute;
    left: 16px;
    bottom: 10px;
    pointer-events: all;
    cursor: pointer;
    padding: 4px 8px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* Page stack transitions */
  .page-enter {
    animation: pagePush 0.35s cubic-bezier(0.32, 0.72, 0, 1) both;
  }

  .page-exit {
    animation: pagePop 0.35s cubic-bezier(0.32, 0.72, 0, 1) both;
  }

  @keyframes pagePush {
    from { transform: translateX(100%); opacity: 0.8; }
    to { transform: translateX(0); opacity: 1; }
  }

  @keyframes pagePop {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(100%); opacity: 0.8; }
  }

  /* TabBar */
  .wx-tabbar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 56px;
    padding-bottom: 4px;
    background: rgba(245, 239, 227, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 0.5px solid rgba(44, 36, 30, 0.08);
    display: flex;
    z-index: 80;
    padding-bottom: 4px; /* safe area for home indicator */
  }

  .wx-tabbar-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    position: relative;
  }

  .wx-tabbar-icon {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .wx-tabbar-item.active .wx-tabbar-icon {
    animation: tabBounce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes tabBounce {
    0% { transform: scale(1); }
    50% { transform: scale(1.25) translateY(-2px); }
    100% { transform: scale(1) translateY(0); }
  }

  .wx-tabbar-label {
    font-size: 11px;
    color: var(--ash);
    letter-spacing: 0.5px;
    transition: color 0.2s;
  }

  .wx-tabbar-item.active .wx-tabbar-label {
    color: var(--vermilion);
    font-weight: 500;
  }

  /* Pull to refresh */
  .pull-indicator {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    z-index: 5;
    transition: opacity 0.2s;
  }

  .pull-icon {
    width: 24px;
    height: 24px;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Skeleton */
  .skeleton {
    background: linear-gradient(90deg, #EDE6D5 25%, #F5EFE3 50%, #EDE6D5 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 8px;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* Ink splash reveal signature effect */
  @keyframes inkReveal {
    0% {
      clip-path: circle(0% at 50% 50%);
      opacity: 0;
    }
    60% {
      clip-path: circle(80% at 50% 50%);
      opacity: 1;
    }
    100% {
      clip-path: circle(100% at 50% 50%);
      opacity: 1;
    }
  }

  .ink-reveal {
    animation: inkReveal 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
  }

  /* Seal stamp animation signature effect */
  @keyframes sealStamp {
    0% { transform: scale(2) rotate(-15deg); opacity: 0; }
    50% { transform: scale(1.1) rotate(-3deg); opacity: 0.8; }
    70% { transform: scale(0.95) rotate(1deg); opacity: 1; }
    100% { transform: scale(1) rotate(-2deg); opacity: 1; }
  }

  .seal-stamp {
    animation: sealStamp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  /* Brush stroke drawing */
  @keyframes brushDraw {
    from { stroke-dashoffset: 1000; }
    to { stroke-dashoffset: 0; }
  }

  .brush-stroke {
    stroke-dasharray: 1000;
    animation: brushDraw 2s ease-out both;
  }

  /* Staggered list entrance */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .stagger-item {
    opacity: 0;
    animation: fadeInUp 0.5s ease-out forwards;
  }

  /* Action sheet */
  .action-sheet-mask {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200;
    opacity: 0;
    animation: fadeIn 0.25s ease forwards;
  }

  .action-sheet {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--paper);
    border-radius: 16px 16px 0 0;
    z-index: 201;
    transform: translateY(100%);
    animation: sheetUp 0.35s cubic-bezier(0.32, 0.72, 0, 1) forwards;
    padding-bottom: 34px;
  }

  @keyframes sheetUp {
    to { transform: translateY(0); }
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* Floating leaves ambient animation */
  @keyframes floatLeaf {
    0% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-15px) rotate(5deg); }
    50% { transform: translateY(-5px) rotate(-3deg); }
    75% { transform: translateY(-20px) rotate(4deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }

  .floating-leaf {
    animation: floatLeaf 6s ease-in-out infinite;
  }

  /* Number count up */
  @keyframes countUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .count-up {
    animation: countUp 0.6s ease-out both;
  }

  /* Gradient shift */
  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .gradient-shift {
    background-size: 200% 200%;
    animation: gradientShift 8s ease infinite;
  }

  /* Card hover lift */
  .card-lift {
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
  }

  .card-lift:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(44, 36, 30, 0.12);
  }

  /* Swipe left indicator */
  .swipe-hint {
    animation: swipeHint 2s ease-in-out infinite;
  }

  @keyframes swipeHint {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(-8px); }
  }

  /* Bamboo weave pattern */
  .bamboo-pattern {
    background-image:
      linear-gradient(45deg, rgba(107, 142, 90, 0.06) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(107, 142, 90, 0.06) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, rgba(107, 142, 90, 0.06) 75%),
      linear-gradient(-45deg, transparent 75%, rgba(107, 142, 90, 0.06) 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
  }

  /* Paper texture overlay */
  .paper-texture {
    position: relative;
  }

  .paper-texture::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(184, 144, 84, 0.04), transparent 40%),
      radial-gradient(ellipse at 80% 70%, rgba(139, 125, 107, 0.03), transparent 40%);
    pointer-events: none;
  }

  /* Scrollbar hide */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* Hero parallax container */
  .hero-parallax {
    position: relative;
    overflow: hidden;
  }

  .hero-bg {
    position: absolute;
    inset: -20%;
    will-change: transform;
  }

  /* Sticky tab */
  .sticky-tab {
    position: sticky;
    top: 88px;
    z-index: 50;
  }

  /* Bottom safe area button */
  .safe-bottom-btn {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 12px 16px;
    padding-bottom: calc(12px + 20px);
    background: linear-gradient(to top, var(--paper) 60%, transparent);
    z-index: 60;
  }

  /* Primary button */
  .btn-primary {
    width: 100%;
    height: 48px;
    border-radius: 24px;
    background: var(--vermilion);
    color: #fff;
    font-size: 16px;
    font-weight: 500;
    border: none;
    cursor: pointer;
    font-family: 'Noto Sans SC', sans-serif;
    letter-spacing: 2px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 16px rgba(184, 58, 47, 0.3);
  }

  .btn-primary:active {
    transform: scale(0.98);
  }

  .btn-secondary {
    width: 100%;
    height: 48px;
    border-radius: 24px;
    background: rgba(44, 36, 30, 0.06);
    color: var(--ink);
    font-size: 16px;
    font-weight: 500;
    border: none;
    cursor: pointer;
    font-family: 'Noto Sans SC', sans-serif;
    letter-spacing: 2px;
    transition: background 0.2s;
  }

  /* Code block for API docs */
  .code-block {
    background: var(--deep-ink);
    color: #E8E2D5;
    border-radius: 12px;
    padding: 16px;
    font-family: 'SF Mono', Menlo, monospace;
    font-size: 12px;
    line-height: 1.7;
    overflow-x: auto;
  }

  .code-kw { color: #D4B896; }
  .code-str { color: #6B8E5A; }
  .code-num { color: #B83A2F; }
  .code-cmt { color: #8B7D6B; font-style: italic; }

  /* Design spec color swatch */
  .color-swatch {
    width: 64px;
    height: 64px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    position: relative;
    overflow: hidden;
  }

  /* Calendar cell */
  .cal-cell {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .cal-cell.active {
    background: var(--vermilion);
    color: #fff;
  }

  .cal-cell.solar-term {
    background: rgba(184, 58, 47, 0.08);
    color: var(--vermilion);
  }

  .cal-cell.active.solar-term {
    background: var(--vermilion);
    color: #fff;
  }

  /* Search bar */
  .search-bar {
    height: 36px;
    background: rgba(44, 36, 30, 0.06);
    border-radius: 18px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 8px;
  }

  .search-input {
    flex: 1;
    border: none;
    background: transparent;
    outline: none;
    font-size: 14px;
    color: var(--ink);
    font-family: 'Noto Sans SC', sans-serif;
  }

  /* Tag chip */
  .chip {
    display: inline-flex;
    align-items: center;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    background: rgba(44, 36, 30, 0.05);
    color: var(--ink);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .chip.active {
    background: var(--ink);
    color: var(--paper);
  }

  /* Profile avatar ring */
  .avatar-ring {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    padding: 3px;
    background: conic-gradient(from 0deg, var(--vermilion), var(--gold), var(--bamboo), var(--vermilion));
    animation: rotateRing 8s linear infinite;
  }

  @keyframes rotateRing {
    to { transform: rotate(360deg); }
  }

  /* Masonry layout for discovery */
  .masonry {
    columns: 2;
    column-gap: 10px;
  }

  .masonry-item {
    break-inside: avoid;
    margin-bottom: 10px;
  }

  /* Floating action ball */
  .fab {
    position: absolute;
    right: 16px;
    bottom: 80px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--vermilion);
    box-shadow: 0 6px 20px rgba(184, 58, 47, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 70;
    cursor: pointer;
    transition: transform 0.2s;
  }

  .fab:active { transform: scale(0.95); }

  /* Category filter sticky */
  .cat-filter {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    overflow-x: auto;
    background: var(--paper);
  }

  /* Scrollable header gradient fade */
  .header-fade {
    mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
  }
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
/*EDITMODE-BEGIN*/
const TWEAK_DEFAULTS = {
  "primaryColor": "#B83A2F",
  "accentColor": "#6B8E5A",
  "density": "regular",
  "paperColor": "#F5EFE3",
  "inkColor": "#2C241E"
};
/*EDITMODE-END*/

const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ─── iOS Device Frame (inline) ───
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

function IOSDevice({
  children, width = 402, height = 874, dark = false,
  keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      border: '1px solid #DEE0E3',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
      '--ios-safe-top': '62px',
      '--ios-safe-bottom': '34px',
    }}>
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column', isolation: 'isolate' }}>
        <div style={{ flex: 1, overflow: 'auto', position: 'relative' }}>{children}</div>

function useTweaks(defaults) {
  const [values, setValues] = useState(defaults);
  const setTweak = useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    try { window.parent.postMessage({ type: 'miaoda:tweaks:set-keys', edits }, '*'); } catch(e) {}
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = '风格', children }) {
  const [open, setOpen] = useState(false);
  const dragRef = useRef(null);
  const offsetRef = useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxTop = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxTop, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.top = offsetRef.current.y + 'px';
  }, []);

  useEffect(() => {
    if (!open) return;
    clampToViewport();
    const handleResize = () => clampToViewport();
    window.addEventListener('resize', handleResize);
    return () => window.removeEventListener('resize', handleResize);
  }, [open, clampToViewport]);

  useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === 'miaoda:tweaks:activate') setOpen(true);
      else if (t === 'miaoda:tweaks:deactivate') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    try { window.parent.postMessage({ type: 'miaoda:tweaks:available' }, '*'); } catch(e) {}
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    try { window.parent.postMessage({ type: 'miaoda:tweaks:dismissed' }, '*'); } catch(e) {}
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startTop = r.top;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startTop + (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, top: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label }) {
  return <div className="twk-sect">{label}</div>;
}

function TweakColor({ label, value, options, onChange }) {
  const isArray = Array.isArray(value);
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      <div className="twk-chips">
        {options.map((opt, i) => {
          const isSelected = isArray
            ? JSON.stringify(opt) === JSON.stringify(value)
            : opt === value;
          const colors = isArray ? opt : [opt];
          return (
            <button
              key={i}
              className="twk-chip"
              data-on={isSelected ? 1 : 0}
              onClick={() => onChange(opt)}
            >
              <span>
                {colors.map((c, ci) => (
                  <i key={ci} style={{ background: c }} />
                ))}
              </span>
              {isSelected && (
                <svg viewBox="0 0 13 13" fill="none">
                  <path d="M2.5 7L5.5 10L10.5 3" stroke="#fff" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const segRef = useRef(null);
  const [thumbStyle, setThumbStyle] = useState({ left: 0, width: 0 });

  useEffect(() => {
    const seg = segRef.current;
    if (!seg) return;
    const idx = options.indexOf(value);
    const buttons = seg.querySelectorAll('button');
    if (buttons[idx]) {
      const rect = buttons[idx].getBoundingClientRect();
      const parentRect = seg.getBoundingClientRect();
      setThumbStyle({
        left: rect.left - parentRect.left - 2,
        width: rect.width,
      });
    }
  }, [value, options]);

  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      <div ref={segRef} className="twk-seg">
        <div className="twk-seg-thumb" style={thumbStyle} />
        {options.map((opt) => (
          <button
            key={opt}
            aria-checked={opt === value}
            onClick={() => onChange(opt)}
          >
            {opt}
          </button>
        ))}
      </div>
    </div>
  );
}

// ─── Pull to Refresh Hook ───
function usePullToRefresh(containerRef, onRefresh) {
  const [pullDistance, setPullDistance] = useState(0);
  const [isRefreshing, setIsRefreshing] = useState(false);
  const startY = useRef(0);
  const pulling = useRef(false);

  useEffect(() => {
    const el = containerRef.current;
    if (!el) return;

    const handleTouchStart = (e) => {
      if (el.scrollTop === 0) {
        startY.current = e.touches[0].clientY;
        pulling.current = true;
      }
    };

    const handleTouchMove = (e) => {
      if (!pulling.current || isRefreshing) return;
      const diff = e.touches[0].clientY - startY.current;
      if (diff > 0 && el.scrollTop === 0) {
        e.preventDefault();
        setPullDistance(Math.min(diff * 0.5, 80));
      }
    };

    const handleTouchEnd = () => {
      if (!pulling.current) return;
      pulling.current = false;
      if (pullDistance >= 60 && !isRefreshing) {
        setIsRefreshing(true);
        setPullDistance(60);
        onRefresh?.().then(() => {
          setIsRefreshing(false);
          setPullDistance(0);
        });
      } else {
        setPullDistance(0);
      }
    };

    el.addEventListener('touchstart', handleTouchStart, { passive: true });
    el.addEventListener('touchmove', handleTouchMove, { passive: false });
    el.addEventListener('touchend', handleTouchEnd, { passive: true });

    return () => {
      el.removeEventListener('touchstart', handleTouchStart);
      el.removeEventListener('touchmove', handleTouchMove);
      el.removeEventListener('touchend', handleTouchEnd);
    };
  }, [pullDistance, isRefreshing, onRefresh, containerRef]);

  return { pullDistance, isRefreshing };
}

// ─── Calendar Page ───
function CalendarPage({ onNavigate }) {
  const [selectedDate, setSelectedDate] = useState(8);
  const [viewMonth, setViewMonth] = useState(8); // August

  // Generate calendar cells for August 2026
  const daysInMonth = 31;
  const firstDay = 6; // Saturday (0=Sun)

  const solarTermsInMonth = solarTerms.filter(t => {
    const month = parseInt(t.date.split('月')[0]);
    return month === viewMonth;
  });

  const days = [];
  for (let i = 0; i < firstDay; i++) {
    days.push(null);
  }
  for (let i = 1; i <= daysInMonth; i++) {
    const term = solarTermsInMonth.find(t => parseInt(t.date.match(/(\d+)日/)[1]) === i);
    days.push({ day: i, term });
  }

  return (
    <div style={{ height: '100%', overflowY: 'auto', paddingTop: 88 }} className="no-scrollbar">
      <div style={{ padding: '0 16px 100px' }}>
        {/* Month header with ink painting decoration */}

          position: 'relative',
          overflow: 'hidden',

          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>

            <div style={{ textAlign: 'center' }}>
              <div style={{ fontSize: 13, opacity: 0.8, letterSpacing: 2 }}>丙午年</div>
              <div style={{
                fontFamily: '"Ma Shan Zheng", serif',
                fontSize: 36,
                lineHeight: 1.2,
              }}>
                八月

              <div style={{ fontSize: 12, opacity: 0.7, marginTop: 2 }}>农历六月廿四 · 廿五</div>

function SearchPage({ onBack }) {
  const [query, setQuery] = useState('');
  const inputRef = useRef(null);

  useEffect(() => {
    inputRef.current?.focus();
  }, []);

  const hotSearches = ['立秋习俗', '白露茶', '桂花糕', '霜降红叶', '冬至饺子', '清明踏青'];
  const history = ['梧桐叶', '寒露诗词'];

  const suggestions = query
    ? solarTerms.filter(t => t.name.includes(query) || t.desc.includes(query))
    : [];

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: '#F5EFE3' }}>
      {/* Search bar with back button */}
      <div style={{

          <input
            ref={inputRef}
            className="search-input"
            placeholder="搜索节气、风物、诗词..."
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            style={{ background: 'transparent' }}
          />
          {query && (
            <div style={{ cursor: 'pointer' }} onClick={() => setQuery('')}>
              <Icon name="close" color="#8B7D6B" size={14} />
            </div>
          )}
        </div>
        <span style={{ fontSize: 14, color: '#B83A2F', paddingRight: 4, cursor: 'pointer' }}>
          搜索
        </span>
      </div>

      <div style={{ flex: 1, overflowY: 'auto', padding: '8px 16px 100px' }} className="no-scrollbar">
        {query ? (
          // Search results
          <div>
            <div style={{ fontSize: 13, color: '#8B7D6B', marginBottom: 12 }}>

            {suggestions.map((term, i) => (
              <div
                key={term.name}
                className="stagger-item"
                style={{
                  animationDelay: `${i * 50}ms`,
                  padding: '14px 0',
                  borderBottom: '0.5px solid rgba(44, 36, 30, 0.06)',
                  display: 'flex',
                  alignItems: 'center',
                  gap: 12,
                  cursor: 'pointer',
                }}
              >
                <div style={{
                  width: 40, height: 40,
                  borderRadius: 10,
                  background: `${term.color}15`,
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  flexShrink: 0,
                }}>
                  <span style={{
                    fontFamily: '"Ma Shan Zheng", serif',
                    fontSize: 18,
                    color: term.color,
                  }}>
                    {term.name.charAt(0)}
                  </span>
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 15, fontWeight: 500, marginBottom: 2 }}>{term.name}</div>
                  <div style={{ fontSize: 12, color: '#8B7D6B' }}>{term.date} · {term.desc.substring(0, 12)}...</div>
                </div>
                <span style={{ fontSize: 11, color: '#8B7D6B' }}>{term.season}季</span>

            {suggestions.length === 0 && (

              <div style={{ marginBottom: 24 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                  <span style={{ fontSize: 15, fontWeight: 500 }}>搜索历史</span>

                </div>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                  {history.map(h => (
                    <div key={h} className="chip" onClick={() => setQuery(h)}>{h}</div>
                  ))}
                </div>
              </div>
            )}

            <div>
              <div style={{ fontSize: 15, fontWeight: 500, marginBottom: 12 }}>热门搜索</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 0 }}>
                {hotSearches.map((h, i) => (
                  <div
                    key={h}
                    className="stagger-item"
                    style={{
                      animationDelay: `${i * 60}ms`,

                      width: 20,
                      fontSize: 14,
                      fontWeight: 600,

                    }}>
                      {i + 1}
                    </span>
                    <span style={{ fontSize: 14, flex: 1 }}>{h}</span>
                    <Icon name="fire" color="#B83A2F" size={14} />
                  </div>
                ))}
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

                          borderTop: pi > 0 ? '0.5px solid rgba(44, 36, 30, 0.05)' : 'none',
                          gap: 8,
                        }}>
                          <span style={{ fontFamily: 'monospace', color: '#B83A2F' }}>{p.name}</span>
                          <span style={{ color: '#6B8E5A' }}>{p.type}</span>
                          <span style={{ color: '#5A4A3A' }}>{p.desc}</span>
                        </div>
                      ))}
                    </div>

                    <div style={{ fontSize: 13, fontWeight: 500, marginBottom: 8 }}>响应示例</div>
                    <pre className="code-block" style={{ margin: 0 }}>
{ep.response.split('\n').map((line, li) => {
  let highlighted = line
    .replace(/"(\w+)"/g, '<span class="code-str">"$1"</span>')
    .replace(/\b(\d+)\b/g, '<span class="code-num">$1</span>');
  return <div key={li} dangerouslySetInnerHTML={{ __html: highlighted }} />;
})}
                    </pre>
                  </div>
                </div>
              )}
            </div>
          ))}
        </div>

        {/* Status codes */}
        <SectionTitle title="状态码" subtitle="通用业务码" />
        <div style={{
          background: '#FAF6EC',
          borderRadius: 12,
          padding: 16,
          marginBottom: 28,
        }}>
          {[
            { code: 0, msg: '成功', color: '#6B8E5A' },
            { code: 40001, msg: '参数错误', color: '#B89054' },
            { code: 40101, msg: '未授权 / Token 失效', color: '#B89054' },
            { code: 40301, msg: '无权限访问', color: '#B89054' },
            { code: 40401, msg: '资源不存在', color: '#B83A2F' },
            { code: 50000, msg: '服务器内部错误', color: '#B83A2F' },
          ].map((s, i) => (
            <div key={s.code} style={{
              display: 'flex',
              alignItems: 'center',
              padding: '8px 0',
              borderBottom: i < 5 ? '0.5px solid rgba(44, 36, 30, 0.05)' : 'none',
              gap: 12,
            }}>
              <span style={{
                fontFamily: 'monospace',
                fontSize: 13,
                color: s.color,
                minWidth: 60,
                fontWeight: 500,
              }}>
                {s.code}
              </span>
              <span style={{ fontSize: 13 }}>{s.msg}</span>
            </div>
          ))}
        </div>

        {/* Rate limit */}
        <SectionTitle title="限流策略" subtitle="保护服务稳定性" />
        <div style={{
          background: '#FAF6EC',
          borderRadius: 12,
          padding: 16,
          marginBottom: 16,
          fontSize: 13,
          lineHeight: 1.8,
          color: '#5A4A3A',
        }}>
          <p>• 普通用户：60 次 / 分钟</p>
          <p>• 认证用户：300 次 / 分钟</p>
          <p>• 超出限流返回 HTTP 429</p>
          <p>• 建议客户端使用本地缓存减少请求</p>
        </div>
      </div>
    </div>
  );
}

// ─── useMediaQuery hook ───
function useMediaQuery(query) {
  const [matches, setMatches] = useState(false);
  useEffect(() => {
    const mq = window.matchMedia(query);
    setMatches(mq.matches);
    const handler = (e) => setMatches(e.matches);
    mq.addEventListener('change', handler);
    return () => mq.removeEventListener('change', handler);
  }, [query]);
  return matches;
}

// ═══════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [activeTab, setActiveTab] = useState('home');
  const [pageStack, setPageStack] = useState([{ page: 'home', params: {} }]);
  const [transitioning, setTransitioning] = useState(false);
  const reducedMotion = useMediaQuery('(prefers-reduced-motion: reduce)');

  const currentPage = pageStack[pageStack.length - 1];
  const isDetailPage = currentPage.page !== 'home' && currentPage.page !== 'discovery'
    && currentPage.page !== 'calendar' && currentPage.page !== 'profile';

  const navigate = useCallback((page, params = {}) => {
    if (transitioning) return;
    setTransitioning(true);
    setPageStack(prev => [...prev, { page, params }]);
    setTimeout(() => setTransitioning(false), 350);
  }, [transitioning]);

  const goBack = useCallback(() => {
    if (transitioning) return;
    if (pageStack.length <= 1) return;
    setTransitioning(true);
    setPageStack(prev => prev.slice(0, -1));
    setTimeout(() => setTransitioning(false), 350);
  }, [transitioning, pageStack.length]);

  const handleTabClick = (tab) => {
    if (transitioning) return;
    setActiveTab(tab);
    setTransitioning(true);
    setPageStack([{ page: tab, params: {} }]);
    setTimeout(() => setTransitioning(false), 300);
  };

  const tabItems = [
    { key: 'home', label: '首页', icon: 'home' },
    { key: 'discovery', label: '发现', icon: 'compass' },
    { key: 'calendar', label: '节气历', icon: 'calendar' },
    { key: 'profile', label: '我的', icon: 'user' },
  ];

  // Determine navbar style based on page
  const getNavbarStyle = () => {
    if (currentPage.page === 'home') return { title: '', transparent: true, light: true };
    if (currentPage.page === 'discovery') return { title: '发现', transparent: false, light: false };
    if (currentPage.page === 'calendar') return { title: '节气历', transparent: true, light: true };
    if (currentPage.page === 'profile') return { title: '我的', transparent: true, light: true };
    if (currentPage.page === 'detail') return { title: '风物详情', transparent: false, light: false, showBack: true };
    if (currentPage.page === 'search') return { title: '', transparent: false, light: false, noTitle: true };
    if (currentPage.page === 'spec') return { title: '设计规范', transparent: false, light: false, showBack: true };
    if (currentPage.page === 'api') return { title: '接口文档', transparent: false, light: false, showBack: true };
    return { title: '', transparent: true, light: true };
  };

  const navStyle = getNavbarStyle();
  const showTabBar = !isDetailPage && ['home', 'discovery', 'calendar', 'profile'].includes(currentPage.page);

  const renderPage = () => {
    const { page, params } = currentPage;
    switch (page) {
      case 'home':
        return <HomePage onNavigate={navigate} primary={t.primaryColor} />;
      case 'discovery':
        return <DiscoveryPage onNavigate={navigate} />;
      case 'calendar':
        return <CalendarPage onNavigate={navigate} />;
      case 'profile':
        return <ProfilePage onNavigate={navigate} />;
      case 'detail':
        return <DetailPage params={params} onBack={goBack} />;
      case 'search':
        return <SearchPage onBack={goBack} />;
      case 'spec':
        return <DesignSpecPage onBack={goBack} primary={t.primaryColor} />;
      case 'api':
        return <ApiDocPage onBack={goBack} />;
      default:
        return <HomePage onNavigate={navigate} primary={t.primaryColor} />;
    }
  };

  return (
    <div className="showcase-wrap">
      <div className="showcase-title">
        <h1>节气风物</h1>
        <p>JIE QI FENG WU · 微信小程序 V2</p>
      </div>

      <IOSDevice width={390} height={844}>
        <div className="miniapp-root">
          {/* WeChat capsule button */}
          <div className={`wx-capsule ${navStyle.light ? 'light' : ''}`}>
            <div className="wx-capsule-btn">
              <svg width="17" height="17" viewBox="0 0 17 17">
                <circle cx="5" cy="8.5" r="1.5" fill={navStyle.light ? '#2C241E' : '#fff'} opacity="0.9"/>
                <circle cx="12" cy="8.5" r="1.5" fill={navStyle.light ? '#2C241E' : '#fff'} opacity="0.9"/>
                <circle cx="8.5" cy="5" r="1.5" fill={navStyle.light ? '#2C241E' : '#fff'} opacity="0.9"/>
                <circle cx="8.5" cy="12" r="1.5" fill={navStyle.light ? '#2C241E' : '#fff'} opacity="0.9"/>
              </svg>
            </div>
            <div className="wx-capsule-divider" />
            <div className="wx-capsule-btn">
              <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
                <circle cx="8.5" cy="8.5" r="6" stroke={navStyle.light ? '#2C241E' : '#fff'} strokeWidth="1.5" opacity="0.9"/>
                <circle cx="8.5" cy="8.5" r="2.5" fill={navStyle.light ? '#2C241E' : '#fff'} opacity="0.9"/>
              </svg>
            </div>
          </div>

          {/* Navbar */}
          {!navStyle.noTitle && (
            <div className="wx-navbar" style={{
              background: navStyle.transparent ? 'transparent' : '#F5EFE3',
              color: navStyle.light ? '#F5EFE3' : '#2C241E',
            }}>
              {navStyle.showBack && (
                <div className="wx-navbar-back" onClick={goBack}>
                  <Icon name="back" color={navStyle.light ? '#F5EFE3' : '#2C241E'} size={18} />
                </div>
              )}
              <span className="wx-navbar-title">{navStyle.title}</span>
            </div>
          )}

          {/* Page content with transition */}
          <div
            key={`${currentPage.page}-${pageStack.length}`}
            className={reducedMotion ? '' : 'page-enter'}
            style={{
              position: 'absolute',
              inset: 0,
              height: showTabBar ? 'calc(100% - 56px)' : '100%',
            }}
          >
            {renderPage()}
          </div>

          {/* TabBar */}
          {showTabBar && (
            <div className="wx-tabbar">
              {tabItems.map(tab => (
                <div
                  key={tab.key}
                  className={`wx-tabbar-item ${activeTab === tab.key ? 'active' : ''}`}
                  onClick={() => handleTabClick(tab.key)}
                >
                  <div className="wx-tabbar-icon">
                    <Icon
                      name={tab.icon}
                      color={activeTab === tab.key ? t.primaryColor : '#8B7D6B'}
                      size={22}
                    />
                  </div>
                  <span className="wx-tabbar-label">{tab.label}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      </IOSDevice>

      <div style={{
        fontSize: 12,
        color: '#8B7D6B',
        textAlign: 'center',
        maxWidth: 360,
        lineHeight: 1.8,
        letterSpacing: 0.5,
      }}>
        <p>形态：微信小程序 · 主题：节气风物</p>
        <p style={{ fontSize: 11, opacity: 0.7, marginTop: 2 }}>
          底部 TabBar 切换 · 下拉刷新 · 左滑返回 · ActionSheet · 骨架屏加载
        </p>
      </div>

      <TweaksPanel>
        <TweakSection label="配色" />
        <TweakColor
          label="主色（朱砂）"
          value={t.primaryColor}
          options={['#B83A2F', '#8B5A3A', '#5A7A6A', '#B89054', '#2C241E']}
          onChange={(v) => setTweak('primaryColor', v)}
        />
        <TweakColor
          label="辅助色（竹青）"
          value={t.accentColor}
          options={['#6B8E5A', '#8BA76A', '#5A7A6A', '#B89054', '#D4B896']}
          onChange={(v) => setTweak('accentColor', v)}
        />
        <TweakColor
          label="底色（宣纸）"
          value={t.paperColor}
          options={['#F5EFE3', '#FAF6EC', '#E8E2D5', '#F0E8D8']}
          onChange={(v) => setTweak('paperColor', v)}
        />
        <TweakSection label="文字" />
        <TweakRadio
          label="密度"
          value={t.density}
          options={['compact', 'regular', 'comfy']}
          onChange={(v) => setTweak('density', v)}
        />
      </TweaksPanel>
    </div>
  );
}

// ─── Custom cursor ───
function CustomCursor() {
  const cursorRef = useRef(null);
  const reducedMotion = useMediaQuery('(prefers-reduced-motion: reduce)');

  useEffect(() => {
    if (reducedMotion) return;

    const cursor = cursorRef.current;
    if (!cursor) return;

    let rafId = null;
    let targetX = window.innerWidth / 2;
    let targetY = window.innerHeight / 2;
    let currentX = targetX;
    let currentY = targetY;
    let visible = false;
    let isHover = false;
    let paused = false;

    const handleMove = (e) => {
      targetX = e.clientX;
      targetY = e.clientY;
      if (!visible) {
        visible = true;
        cursor.style.opacity = '1';
      }

      // Check if hovering interactive element
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const interactive = el?.closest('button, .card-lift, .chip, .cal-cell, .wx-tabbar-item, .fab, .wx-capsule-btn, .wx-navbar-back, .masonry-item');
      if (interactive && !isHover) {
        isHover = true;
        cursor.classList.add('drag');
      } else if (!interactive && isHover) {
        isHover = false;
        cursor.classList.remove('drag');
      }
    };

    const animate = () => {
      if (!paused) {
        // Smooth follow - direct DOM transform for perf
        currentX += (targetX - currentX) * 0.15;
        currentY += (targetY - currentY) * 0.15;
        cursor.style.transform = `translate(${currentX}px, ${currentY}px) translate(-50%, -50%)`;
      }
      rafId = requestAnimationFrame(animate);
    };

    const handleVisibility = () => {
      paused = document.hidden;
    };

    const handleLeave = () => {
      visible = false;
      cursor.style.opacity = '0';
    };

    window.addEventListener('mousemove', handleMove, { passive: true });
    document.addEventListener('visibilitychange', handleVisibility);
    document.addEventListener('mouseleave', handleLeave);

    rafId = requestAnimationFrame(animate);

    // Initial center position
    cursor.style.transform = `translate(${window.innerWidth / 2}px, ${window.innerHeight / 2}px) translate(-50%, -50%)`;
    cursor.style.opacity = '0';

    return () => {
      cancelAnimationFrame(rafId);
      window.removeEventListener('mousemove', handleMove);
      document.removeEventListener('visibilitychange', handleVisibility);
      document.removeEventListener('mouseleave', handleLeave);
    };
  }, [reducedMotion]);

  if (reducedMotion) return null;

  return <div ref={cursorRef} className="custom-cursor" />;
}

// ─── Render ───
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  <>
    <CustomCursor />
    <App />
  </>
);

// ─── Announce upgrade availability ───
function announceUpgrade() {
  window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
}
announceUpgrade();
if (document.readyState !== 'complete') window.addEventListener('load', announceUpgrade, { once: true });

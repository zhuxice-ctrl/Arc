<style>

  /* Page transitions */
  .page-enter-right { animation: pageEnterRight 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  @keyframes pageEnterRight {
    from { transform: translateX(100%); opacity: 0.5; }
    to   { transform: translateX(0); opacity: 1; }
  }

  /* Ripple */
  @keyframes ripple {
    0% { transform: scale(0); opacity: 0.6; }

  .ripple-dot {
    position: absolute; border-radius: 50%;

    pointer-events: none;

  /* Brush reveal (signature 1) */
  @keyframes brushReveal {
    0%   { clip-path: inset(0 100% 0 0); opacity: 0; }
    40%  { opacity: 1; }

  .brush-reveal { animation: brushReveal 0.9s cubic-bezier(0.65, 0, 0.35, 1) forwards; }

  /* Ink drop */
  @keyframes inkDrop {

  /* Seal stamp */
  @keyframes sealStamp {
    0%   { transform: scale(2) rotate(-15deg); opacity: 0; }

  /* Floating drift */
  @keyframes floatDrift {

  /* Shimmer sweep */
  @keyframes shimmerSweep {

  .shimmer-wrap { position: relative; overflow: hidden; }

  /* Fade up */

    opacity: 0; transform: translateY(20px);

  /* Pulse ring */

    0%   { box-shadow: 0 0 0 0 rgba(181, 50, 29, 0.4); }

  @keyframes spinSlow {

  /* Tab bounce */
  @keyframes tabBounce {

  .scroll-progress {
    position: absolute; top: 0; left: 0;
    height: 2px; background: #B5321D;
    transform-origin: left; z-index: 30;
  }

  /* Skeleton shimmer */
  @keyframes skeletonShim {
    0%   { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .skeleton {
    background: linear-gradient(90deg, rgba(0,0,0,0.04) 25%, rgba(0,0,0,0.09) 50%, rgba(0,0,0,0.04) 75%);
    background-size: 200% 100%;

  /* Action sheet slide up */
  @keyframes sheetUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  .sheet-up { animation: sheetUp 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

  /* Backdrop fade */
  @keyframes fadeInBg {
    from { opacity: 0; }

  /* Toast */
  @keyframes toastIn {
    0%   { opacity: 0; transform: translate(-50%, -10px) scale(0.9); }

  }
  .toast-in { animation: toastIn 0.25s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

  /* Bounce in */
  @keyframes bounceIn {
    0%   { transform: scale(0.3); opacity: 0; }
    50%  { transform: scale(1.05); opacity: 1; }
    70%  { transform: scale(0.9); }
    100% { transform: scale(1); opacity: 1; }
  }
  .bounce-in { animation: bounceIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo, createContext, useContext } = React;

/*EDITMODE-BEGIN*/
const TWEAK_DEFAULTS = {
  "accentColor": "#B5321D",
  "paperColor": "#F5EFE0",
  "inkColor": "#1C1B19",
  "animations": true,
  "fontSize": 14
};
/*EDITMODE-END*/

// ═════════════════════════════════════════════════════════════
//  TWEAKS PANEL (inlined — external JSX fetch blocked in this env)
// ═════════════════════════════════════════════════════════════
function useTweaks(defaults) {
  const [values, setValues] = useState(defaults);
  const setTweak = useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    try { window.parent.postMessage({ type: 'miaoda:tweaks:set-keys', edits }, '*'); } catch (e) {}
    try { window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits })); } catch (e) {}
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = '风格', children }) {
  const [open, setOpen] = useState(false);
  const dragRef = useRef(null);
  const offsetRef = useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxTop = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxTop, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.top = offsetRef.current.y + 'px';
  }, []);

  useEffect(() => {
    if (!open) return;
    clampToViewport();
    const onResize = () => clampToViewport();
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, [open, clampToViewport]);

  useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === 'miaoda:tweaks:activate') setOpen(true);
      else if (t === 'miaoda:tweaks:deactivate') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    try { window.parent.postMessage({ type: 'miaoda:tweaks:available' }, '*'); } catch (e) {}
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    try { window.parent.postMessage({ type: 'miaoda:tweaks:dismissed' }, '*'); } catch (e) {}
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startTop = r.top;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startTop + (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <div ref={dragRef} className="twk-panel" data-miaoda-chrome=""
         style={{ right: offsetRef.current.x, top: offsetRef.current.y }}>
      <div className="twk-hd" onMouseDown={onDragStart}>
        <b>{title}</b>
        <button className="twk-x" aria-label="Close"
                onMouseDown={(e) => e.stopPropagation()}
                onClick={dismiss}>×</button>
      </div>
      <div className="twk-body">{children}</div>
    </div>
  );
}

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <div className="twk-row">
      <div className="twk-lbl">
        <span>{label}</span>
        <span className="twk-val">{value}{unit}</span>
      </div>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </div>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

function TweakColor({ label, value, options, onChange }) {
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </div>
  );
}

          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>

  );
}

function IOSDevice({ children, width = 402, height = 874, dark = false }) {
  return (

function useCountUp(target, duration = 1200, active = true) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!active) { setVal(target); return; }
    let raf, start;
    const step = (t) => {
      if (!start) start = t;
      const p = Math.min((t - start) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      setVal(Math.floor(target * eased));
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => { if (raf) cancelAnimationFrame(raf); };
  }, [target, duration, active]);
  return val;
}

function triggerRipple(e, container) {
  if (!container) return;
  const rect = container.getBoundingClientRect();
  const dot = document.createElement('span');
  dot.className = 'ripple-dot';
  const size = Math.max(rect.width, rect.height) * 0.6;
  const x = (e.clientX ?? rect.left + rect.width / 2) - rect.left - size / 2;
  const y = (e.clientY ?? rect.top + rect.height / 2) - rect.top - size / 2;
  dot.style.width = dot.style.height = size + 'px';
  dot.style.left = x + 'px';
  dot.style.top = y + 'px';
  container.appendChild(dot);
  setTimeout(() => dot.remove(), 650);
}

  return (
    <div style={{
      position: 'absolute', bottom: 0, left: 0, right: 0,

      background: 'rgba(245, 239, 224, 0.92)',

function BookCard({ book, onClick, compact = false }) {
  const cardRef = useRef(null);

  const handleMove = (e) => {
    if (!cardRef.current) return;
    const rect = cardRef.current.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    const rotY = (x - 0.5) * 12;
    const rotX = (0.5 - y) * 12;
    cardRef.current.style.transform = `perspective(800px) rotateX(${rotX}deg) rotateY(${rotY}deg) translateY(-2px)`;
  };
  const handleLeave = () => {
    if (!cardRef.current) return;
    cardRef.current.style.transform = 'perspective(800px) rotateX(0) rotateY(0) translateY(0)';
  };

  return (
    <div
      ref={cardRef}
      onMouseMove={handleMove}
      onMouseLeave={handleLeave}
      onClick={(e) => { triggerRipple(e, cardRef.current); onClick && onClick(book); }}
      style={{
        position: 'relative', borderRadius: 10, overflow: 'hidden',
        cursor: 'pointer',
        transition: 'transform 0.25s ease-out, box-shadow 0.25s ease-out',
        boxShadow: '0 4px 16px rgba(28,27,25,0.15), 0 1px 3px rgba(28,27,25,0.1)',
        background: book.coverHue,
        height: '100%',
      }}
    >
      <div style={{
        position: 'absolute', inset: 0,
        background: `linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 40%, rgba(0,0,0,0.15) 100%)`,
        pointerEvents: 'none',
      }} />
      <div style={{
        position: 'absolute', left: 0, top: 0, bottom: 0, width: 4,
        background: 'rgba(0,0,0,0.25)', pointerEvents: 'none',
      }} />

      <div style={{
        padding: compact ? '14px 12px' : '22px 16px',
        display: 'flex', flexDirection: 'column',
        alignItems: 'center', justifyContent: 'center',
        height: '100%', textAlign: 'center', color: '#F5EFE0',
      }}>
        <div className="seal-font" style={{
          fontSize: compact ? 22 : 30, fontWeight: 700,
          letterSpacing: 4, marginBottom: compact ? 6 : 10,
          textShadow: '0 2px 8px rgba(0,0,0,0.3)', lineHeight: 1.2,
        }}>{book.title}</div>
        <div style={{
          fontSize: compact ? 10 : 11, opacity: 0.85,
          fontFamily: "'Noto Serif SC', serif", letterSpacing: 1,
        }}>{book.subtitle}</div>
        <div style={{
          position: 'absolute',
          bottom: compact ? 8 : 12, right: compact ? 8 : 12,
          width: compact ? 22 : 28, height: compact ? 22 : 28,
          border: '1.5px solid rgba(255,255,255,0.7)',
          borderRadius: 3,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: compact ? 9 : 11,
          fontFamily: "'Ma Shan Zheng', serif",
          color: 'rgba(255,255,255,0.85)',
          transform: 'rotate(-8deg)',
        }}>善</div>
      </div>
    </div>
  );
}

function HomePage({ onOpenBook, onOpenSearch }) {
  const [scrollY, setScrollY] = useState(0);
  const scrollRef = useRef(null);
  const [showPull, setShowPull] = useState(false);
  const [refreshing, setRefreshing] = useState(false);
  const pullStartRef = useRef(0);
  const pullDistRef = useRef(0);

  const handleScroll = (e) => setScrollY(e.target.scrollTop);

  const handleTouchStart = (e) => {
    if (scrollRef.current && scrollRef.current.scrollTop <= 0) {
      pullStartRef.current = e.touches[0].clientY;
    }
  };
  const handleTouchMove = (e) => {
    if (!pullStartRef.current) return;
    const dy = e.touches[0].clientY - pullStartRef.current;
    if (dy > 0 && scrollRef.current && scrollRef.current.scrollTop <= 0) {
      pullDistRef.current = Math.min(dy * 0.5, 80);
      setShowPull(pullDistRef.current > 10);
      scrollRef.current.style.transform = `translateY(${pullDistRef.current}px)`;
    }
  };
  const handleTouchEnd = () => {
    if (pullDistRef.current > 60) {
      setRefreshing(true);
      scrollRef.current.style.transform = 'translateY(40px)';
      setTimeout(() => {
        setRefreshing(false); setShowPull(false);
        pullDistRef.current = 0; pullStartRef.current = 0;
        if (scrollRef.current) scrollRef.current.style.transform = 'translateY(0)';

      setShowPull(false);
      pullDistRef.current = 0; pullStartRef.current = 0;

    if (!scrollRef.current) return 0;

        }}>

                        width: 18, height: 3, background: '#B5321D', borderRadius: 2,
                      }} />
                    )}
                  </button>
                ))}
              </div>
            </div>

            {/* Book grid */}
            <div style={{
              display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10,
              padding: '12px 12px 0',
            }}>
              {filtered.map((book, i) => (
                <div key={book.id} style={{
                  display: 'flex', flexDirection: 'column', gap: 6,
                  cursor: 'pointer',
                  animation: `fadeUp 0.5s ease ${i * 0.08}s forwards`,
                  opacity: 0,
                }}
                onClick={() => onOpenBook && onOpenBook(book)}
                >
                  <div style={{ height: i % 2 === 0 ? 180 : 150 }}>
                    <BookCard book={book} compact onClick={onOpenBook} />
                  </div>
                  <div style={{ padding: '0 2px' }}>
                    <div style={{
                      fontSize: 13, fontWeight: 600, color: '#1C1B19',
                      fontFamily: "'Noto Serif SC', serif",
                    }}>{book.title}</div>
                    <div style={{ fontSize: 10, color: 'rgba(28,27,25,0.45)' }}>
                      {book.dynasty}刻本
                    </div>
                  </div>
                </div>
              ))}
            </div>

            {filtered.length === 0 && (
              <div style={{
                padding: '60px 20px', textAlign: 'center',
                color: 'rgba(28,27,25,0.4)', fontSize: 13,
              }}>此朝典籍暂无收录</div>
            )}
          </div>
        </div>
      </div>
    </>
  );
}

function SwipeableRow({ book, index }) {
  const [offset, setOffset] = useState(0);
  const startX = useRef(0);
  const startOffset = useRef(0);
  const dragging = useRef(false);
  const actionWidth = 70;

  const handleTouchStart = (e) => {
    dragging.current = true;
    startX.current = e.touches[0].clientX;
    startOffset.current = offset;
  };
  const handleTouchMove = (e) => {
    if (!dragging.current) return;
    const dx = e.touches[0].clientX - startX.current;
    let newOffset = startOffset.current + dx;
    if (newOffset > 0) newOffset = newOffset * 0.3;
    if (newOffset < -actionWidth) {
      newOffset = -actionWidth - (newOffset + actionWidth) * 0.3;
    }
    setOffset(newOffset);
  };
  const handleTouchEnd = () => {
    dragging.current = false;
    if (offset < -actionWidth / 2) setOffset(-actionWidth);
    else setOffset(0);
  };

  return (
    <div style={{ position: 'relative', overflow: 'hidden' }}>
      <div style={{
        position: 'absolute', top: 0, right: 0, bottom: 0, display: 'flex',
      }}>
        <button style={{
          width: actionWidth, border: 'none', background: '#B5321D',
          color: '#fff', fontSize: 13, cursor: 'pointer',
          fontFamily: "'Noto Serif SC', serif",
        }}>删除</button>
      </div>

      <div
        onTouchStart={handleTouchStart}
        onTouchMove={handleTouchMove}
        onTouchEnd={handleTouchEnd}
        style={{
          display: 'flex', alignItems: 'center', gap: 12,
          padding: '12px 16px',
          borderTop: index === 0 ? 'none' : '0.5px solid rgba(0,0,0,0.05)',
          background: '#fff',
          transform: `translateX(${offset}px)`,
          transition: dragging.current ? 'none' : 'transform 0.25s cubic-bezier(0.22, 1, 0.36, 1)',
          cursor: 'pointer', position: 'relative', zIndex: 2,
        }}
      >
        <div style={{ width: 40, height: 56, flexShrink: 0 }}>
          <BookCard book={book} compact />
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{
            fontSize: 14, fontWeight: 500, color: '#1C1B19',
            fontFamily: "'Noto Serif SC', serif",
            marginBottom: 4,
            overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
          }}>{book.title}</div>
          <div style={{ fontSize: 11, color: 'rgba(28,27,25,0.45)' }}>
            读至 {book.chapters[0]?.name || '卷一'}
          </div>
        </div>
        <div style={{ fontSize: 11, color: 'rgba(28,27,25,0.35)' }}>
          {30 + index * 20}%
        </div>
      </div>
    </div>
  );
}

              background: activeSection === s.key ? 'rgba(28,27,25,0.9)' : 'rgba(28,27,25,0.06)',
              color: activeSection === s.key ? '#F5EFE0' : 'rgba(28,27,25,0.7)',
              fontSize: 12, cursor: 'pointer',
              fontFamily: "'Noto Serif SC', serif",
              transition: 'all 0.2s',
            }}>{s.label}</button>
          ))}
        </div>

        <div style={{ padding: 16 }}>
          {activeSection === 'overview' && (
            <>
              <div className="fade-up" style={{
                background: '#fff', borderRadius: 12, padding: 16,
                marginBottom: 12, boxShadow: '0 1px 6px rgba(28,27,25,0.06)',
              }}>
                <div className="section-label">Base URL</div>
                <div style={{
                  padding: 12, background: '#1C1B19', color: '#C9A961',
                  borderRadius: 8, fontFamily: 'monospace',
                  fontSize: 12, overflowX: 'auto',
                }}>https://api.shanben.guji.cn/v2</div>
              </div>
              <div className="fade-up" style={{
                background: '#fff', borderRadius: 12, padding: 16,
                marginBottom: 12, boxShadow: '0 1px 6px rgba(28,27,25,0.06)',
                animationDelay: '0.1s',
              }}>
                <div className="section-label">认证方式</div>
                <p style={{
                  fontSize: 13, color: 'rgba(28,27,25,0.8)',
                  lineHeight: 1.8, fontFamily: "'Noto Serif SC', serif",
                }}>
                  使用微信小程序登录凭证，通过
                  <code style={{
                    background: 'rgba(181,50,29,0.08)',
                    color: '#B5321D', padding: '1px 6px',
                    borderRadius: 3, fontSize: 12, fontFamily: 'monospace',
                    margin: '0 4px',
                  }}>wx.login()</code>
                  获取 code 后调用登录接口换取 token。
                </p>
              </div>
              <div className="fade-up" style={{
                background: '#fff', borderRadius: 12, padding: 16,
                marginBottom: 12, boxShadow: '0 1px 6px rgba(28,27,25,0.06)',
                animationDelay: '0.2s',
              }}>
                <div className="section-label">响应格式</div>
                <pre style={{
                  padding: 12, background: '#1C1B19', color: '#F5EFE0',
                  borderRadius: 8, fontSize: 11, lineHeight: 1.6,
                  overflowX: 'auto', fontFamily: 'monospace', whiteSpace: 'pre-wrap',
                }}>{`{
  "code": 0,
  "message": "ok",
  "data": { ... },
  "timestamp": 1718000000000
}`}</pre>
              </div>
              <div className="fade-up" style={{
                background: '#fff', borderRadius: 12, padding: 16,
                boxShadow: '0 1px 6px rgba(28,27,25,0.06)',
                animationDelay: '0.3s',
              }}>
                <div className="section-label">状态码</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                  {[
                    { code: 0, msg: '成功', color: '#6B8E7A' },
                    { code: 400, msg: '请求参数错误', color: '#C9A961' },
                    { code: 401, msg: '未授权 / token 失效', color: '#B5321D' },
                    { code: 403, msg: '无权限', color: '#B5321D' },
                    { code: 404, msg: '资源不存在', color: '#3E4A5E' },
                    { code: 500, msg: '服务器内部错误', color: '#7A5C3E' },
                  ].map((s, i) => (
                    <div key={i} style={{
                      display: 'flex', alignItems: 'center', gap: 12,
                      padding: '8px 0',
                      borderBottom: i === 5 ? 'none' : '0.5px solid rgba(0,0,0,0.05)',
                    }}>
                      <span style={{
                        padding: '2px 8px', borderRadius: 4,
                        background: `${s.color}15`, color: s.color,
                        fontFamily: 'monospace', fontSize: 11,
                        minWidth: 48, textAlign: 'center',
                      }}>{s.code}</span>
                      <span style={{ fontSize: 12, color: 'rgba(28,27,25,0.7)' }}>{s.msg}</span>
                    </div>
                  ))}
                </div>
              </div>
            </>
          )}

          {endpoints[activeSection] && endpoints[activeSection].map((ep, i) => (
            <div key={i} className="fade-up" style={{
              background: '#fff', borderRadius: 12, padding: 14,
              marginBottom: 10, boxShadow: '0 1px 6px rgba(28,27,25,0.06)',
              animationDelay: `${i * 0.05}s`,
            }}>
              <div style={{
                display: 'flex', alignItems: 'center', gap: 10,
                marginBottom: 10,
              }}>
                <span style={{
                  padding: '3px 8px', borderRadius: 4,
                  background: `${methodColor[ep.method]}15`,
                  color: methodColor[ep.method],
                  fontFamily: 'monospace', fontSize: 11, fontWeight: 700,
                  minWidth: 48, textAlign: 'center',
                }}>{ep.method}</span>
                <code style={{
                  fontSize: 12, color: '#1C1B19',
                  fontFamily: 'monospace', flex: 1, wordBreak: 'break-all',
                }}>{ep.path}</code>
              </div>
              <div style={{
                fontSize: 13, color: 'rgba(28,27,25,0.8)',
                marginBottom: 8,
                fontFamily: "'Noto Serif SC', serif",
              }}>{ep.desc}</div>
              <div style={{
                padding: 8, background: 'rgba(28,27,25,0.03)',
                borderRadius: 6, fontSize: 11, color: 'rgba(28,27,25,0.5)',
              }}>
                <span style={{ color: 'rgba(28,27,25,0.4)' }}>参数: </span>
                <span style={{ fontFamily: 'monospace' }}>{ep.params}</span>
              </div>
            </div>
          ))}
        </div>
      </div>
    </>
  );
}

// ═════════════════════════════════════════════════════════════
//  PAGE 8: 搜索
// ═════════════════════════════════════════════════════════════
function SearchPage({ onBack, onOpenBook }) {
  const [keyword, setKeyword] = useState('');
  const [loading, setLoading] = useState(false);
  const [results, setResults] = useState([]);
  const timerRef = useRef(null);

  const hotWords = ['宋版', '敦煌', '永乐大典', '茶经', '营造法式', '版画'];

  const handleSearch = (kw) => {
    setKeyword(kw);
    if (timerRef.current) clearTimeout(timerRef.current);
    if (!kw.trim()) {
      setResults([]); setLoading(false);
      return;
    }
    setLoading(true);
    timerRef.current = setTimeout(() => {
      const filtered = BOOKS.filter(b =>
        b.title.includes(kw) || b.subtitle.includes(kw) ||
        b.tags.some(t => t.includes(kw)) || b.dynasty.includes(kw)
      );
      setResults(filtered);
      setLoading(false);
    }, 800);
  };

  useEffect(() => () => {
    if (timerRef.current) clearTimeout(timerRef.current);
  }, []);

  return (
    <>
      <MPNavBar title="搜索" onBack={onBack} />
      <div className="mp-scroll" style={{
        position: 'absolute',
        top: 'calc(var(--ios-safe-top) + 44px)',
        left: 0, right: 0, bottom: 0,
        overflowY: 'auto', background: '#F5EFE0',
      }}>
        <div style={{ padding: 12 }}>
          <div style={{
            display: 'flex', alignItems: 'center', gap: 10,
            height: 44, padding: '0 16px',
            background: '#fff', borderRadius: 22,
            boxShadow: '0 1px 6px rgba(28,27,25,0.06)',
            marginBottom: 16,
          }}>
            <Icon.Search size={18} color="rgba(28,27,25,0.4)" />
            <input
              autoFocus
              value={keyword}
              onChange={(e) => handleSearch(e.target.value)}
              placeholder="输入书名、朝代、藏家…"
              style={{
                flex: 1, border: 'none', outline: 'none',
                background: 'transparent', fontSize: 14, color: '#1C1B19',
                fontFamily: "'Noto Serif SC', serif",
              }}
            />
            {keyword && (
              <button onClick={() => handleSearch('')} style={{
                border: 'none', background: 'none',
                cursor: 'pointer', padding: 4,
              }}>
                <Icon.Close size={16} color="rgba(28,27,25,0.3)" />
              </button>
            )}
          </div>

          {loading && (
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
              {[1, 2, 3, 4].map((i) => (
                <div key={i}>
                  <div className="skeleton" style={{
                    height: i % 2 === 0 ? 180 : 150,
                    borderRadius: 10, marginBottom: 6,
                  }} />
                  <div className="skeleton" style={{ height: 12, width: '60%', marginBottom: 4 }} />
                  <div className="skeleton" style={{ height: 10, width: '40%' }} />
                </div>
              ))}
            </div>
          )}

          {!loading && keyword && results.length > 0 && (
            <div>
              <div style={{
                fontSize: 12, color: 'rgba(28,27,25,0.5)',
                marginBottom: 12,
              }}>找到 {results.length} 部相关典籍</div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                {results.map((book, i) => (
                  <div key={book.id} className="fade-up" style={{
                    animationDelay: `${i * 0.08}s`, opacity: 0, cursor: 'pointer',
                  }}
                  onClick={() => onOpenBook && onOpenBook(book)}
                  >
                    <div style={{
                      height: i % 2 === 0 ? 180 : 150, marginBottom: 6,
                    }}>
                      <BookCard book={book} compact onClick={onOpenBook} />
                    </div>
                    <div style={{
                      fontSize: 13, fontWeight: 600, color: '#1C1B19',
                      fontFamily: "'Noto Serif SC', serif",
                    }}>{book.title}</div>
                    <div style={{ fontSize: 10, color: 'rgba(28,27,25,0.45)' }}>
                      {book.dynasty}刻本
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {!loading && keyword && results.length === 0 && (
            <div style={{ padding: '60px 20px', textAlign: 'center' }}>
              <div style={{
                width: 80, height: 80, margin: '0 auto 16px',
                border: '2px solid rgba(28,27,25,0.1)',
                borderRadius: 8,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontSize: 28, fontFamily: "'Ma Shan Zheng', serif",
                color: 'rgba(28,27,25,0.2)',
                transform: 'rotate(-6deg)',
              }}>佚</div>
              <div style={{
                fontSize: 14, color: 'rgba(28,27,25,0.5)',
                fontFamily: "'Noto Serif SC', serif",
              }}>未寻得相关典籍</div>
              <div style={{ fontSize: 11, color: 'rgba(28,27,25,0.3)', marginTop: 4 }}>
                试试换个关键词
              </div>
            </div>
          )}

          {!keyword && (
            <div>
              <div className="section-label">热门搜索</div>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                {hotWords.map((w, i) => (
                  <button
                    key={i}
                    onClick={() => handleSearch(w)}
                    className="fade-up"
                    style={{
                      animationDelay: `${i * 0.08}s`, opacity: 0,
                      padding: '6px 14px', border: 'none', borderRadius: 16,
                      background: '#fff',
                      color: 'rgba(28,27,25,0.7)',
                      fontSize: 12, cursor: 'pointer',
                      boxShadow: '0 1px 4px rgba(28,27,25,0.06)',
                      fontFamily: "'Noto Serif SC', serif",
                    }}
                  >{w}</button>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>
    </>
  );
}

// ═════════════════════════════════════════════════════════════
//  APP ROOT
// ═════════════════════════════════════════════════════════════
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const [pageStack, setPageStack] = useState([
    { key: 'home', transition: 'none' }
  ]);
  const [showTabBar, setShowTabBar] = useState(true);
  const [activeTab, setActiveTab] = useState('home');
  const [toast, setToast] = useState(null);
  const toastTimerRef = useRef(null);

  const currentPage = pageStack[pageStack.length - 1];

  const tabs = [
    { key: 'home', label: '首页', icon: (p) => <Icon.Home active={p.active} /> },
    { key: 'category', label: '分类', icon: (p) => <Icon.Category active={p.active} /> },
    { key: 'discover', label: '砚田', icon: (p) => <Icon.Book active={p.active} /> },
    { key: 'profile', label: '书房', icon: (p) => <Icon.User active={p.active} /> },
  ];

  const showToastMsg = (message) => {
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    setToast(message);
    toastTimerRef.current = setTimeout(() => setToast(null), 1800);
  };

  const pushPage = (key, data = {}) => {
    const isTabPage = ['home', 'category', 'discover', 'profile'].includes(key);
    setPageStack(prev => [...prev, { key, data, transition: 'right' }]);
    if (isTabPage) { setActiveTab(key); setShowTabBar(true); }
    else { setShowTabBar(false); }
  };

  const popPage = () => {
    if (pageStack.length <= 1) return;
    const newTop = pageStack[pageStack.length - 2];
    const isTabPage = ['home', 'category', 'discover', 'profile'].includes(newTop.key);
    setPageStack(prev => prev.slice(0, -1));
    if (isTabPage) { setActiveTab(newTop.key); setShowTabBar(true); }
    else { setShowTabBar(false); }
  };

  const handleTabChange = (key) => {
    setPageStack([{ key, transition: 'none' }]);
    setActiveTab(key);
    setShowTabBar(true);
  };

  const openBook = (book) => pushPage('detail', { book });
  const openSearch = () => pushPage('search');
  const openDesignSpec = () => pushPage('design');
  const openApiDoc = () => pushPage('api');

  const handleAddCollection = () => showToastMsg('已加入书房');

  const renderPage = () => {
    switch (currentPage.key) {
      case 'home': return <HomePage onOpenBook={openBook} onOpenSearch={openSearch} />;
      case 'category': return <CategoryPage onOpenBook={openBook} />;
      case 'discover': return <DiscoverPage />;
      case 'profile': return <ProfilePage />;
      case 'detail': return (
        <BookDetailPage
          book={currentPage.data.book}
          onBack={popPage}
          onAddCollection={handleAddCollection}
        />
      );
      case 'search': return <SearchPage onBack={popPage} onOpenBook={openBook} />;
      case 'design': return <DesignSpecPage onBack={popPage} />;
      case 'api': return <ApiDocPage onBack={popPage} />;
      default: return null;
    }
  };

  return (
    <MPContext.Provider value={{ t, setTweak, showToastMsg, pushPage, popPage }}>
      <div className="stage-wrap">
        <div style={{ position: 'relative' }}>
          <IOSDevice width={390} height={844}>
            <div style={{
              position: 'relative', width: '100%', height: '100%',
              overflow: 'hidden', background: '#F5EFE0',
              fontFamily: `'Noto Sans SC', -apple-system, sans-serif`,
              fontSize: t.fontSize,
            }}>
              <div
                key={currentPage.key + pageStack.length}
                className={currentPage.transition === 'right' ? 'page-enter-right' : ''}
                style={{ position: 'absolute', inset: 0 }}
              >
                {renderPage()}
              </div>

              {showTabBar && (
                <MPTabBar tabs={tabs} active={activeTab} onChange={handleTabChange} />
              )}

              {toast && <Toast message={toast} />}
            </div>
          </IOSDevice>

          {/* Side entry buttons */}
          <button
            onClick={() => currentPage.key === 'design' ? popPage() : openDesignSpec()}
            style={{
              position: 'absolute', top: -10, right: -50,
              width: 40, height: 40, borderRadius: '50%',
              border: 'none', background: '#1C1B19', color: '#F5EFE0',
              cursor: 'pointer',
              boxShadow: '0 4px 12px rgba(28,27,25,0.3)',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontSize: 11, fontFamily: "'Noto Serif SC', serif",
              zIndex: 100, letterSpacing: 2,
            }}
            title="设计规范"
          >规范</button>

          <button
            onClick={() => currentPage.key === 'api' ? popPage() : openApiDoc()}
            style={{
              position: 'absolute', top: 40, right: -50,
              width: 40, height: 40, borderRadius: '50%',
              border: 'none', background: '#3E4A5E', color: '#F5EFE0',
              cursor: 'pointer',
              boxShadow: '0 4px 12px rgba(28,27,25,0.25)',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontSize: 11, fontFamily: "'Noto Serif SC', serif",
              zIndex: 100, letterSpacing: 2,
            }}
            title="接口文档"
          >接口</button>

          <button
            onClick={openSearch}
            style={{
              position: 'absolute', top: 90, right: -50,
              width: 40, height: 40, borderRadius: '50%',
              border: 'none', background: '#B5321D', color: '#F5EFE0',
              cursor: 'pointer',
              boxShadow: '0 4px 12px rgba(181,50,29,0.3)',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              zIndex: 100,
            }}
            title="搜索"
          >
            <Icon.Search size={16} color="#F5EFE0" />
          </button>
        </div>
      </div>

      <TweaksPanel title="风格">
        <TweakSection label="色彩" />
        <TweakColor
          label="印章红"
          value={t.accentColor}
          options={['#B5321D', '#8B2715', '#C9A961', '#6B8E7A', '#3E4A5E']}
          onChange={(v) => setTweak('accentColor', v)}
        />
        <TweakColor
          label="宣纸色"
          value={t.paperColor}
          options={['#F5EFE0', '#EDE5D2', '#FAF6ED', '#E8E1D0']}
          onChange={(v) => setTweak('paperColor', v)}
        />
        <TweakColor
          label="墨色"
          value={t.inkColor}
          options={['#1C1B19', '#2C2A25', '#3A3630']}
          onChange={(v) => setTweak('inkColor', v)}
        />
        <TweakSection label="排版" />
        <TweakSlider
          label="字号"
          value={t.fontSize}
          min={12} max={18} unit="px"
          onChange={(v) => setTweak('fontSize', v)}
        />
        <TweakToggle
          label="动效"
          value={t.animations}
          onChange={(v) => setTweak('animations', v)}
        />
      </TweaksPanel>
    </MPContext.Provider>
  );
}

// Announce upgrade
function announceUpgrade() {
  try {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  } catch (e) {}
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

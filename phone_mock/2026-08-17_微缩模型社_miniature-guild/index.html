<style>
  /* ═══════════════════════════════════════
     GLOBAL RESET & TOKENS
     ═══════════════════════════════════════ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }

  }
  .ruler-mark.top {
    top: 24px; left: 0; right: 0; height: 18px;
    background-image: repeating-linear-gradient(90deg,

      #C99B4A 11px, #C99B4A 12px,

    mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);

  .ruler-mark.bottom {
    bottom: 24px; left: 0; right: 0; height: 18px;

  /* ═══════════════════════════════════════
     CUSTOM CURSOR
     ═══════════════════════════════════════ */
  .cursor-dot, .cursor-ring {
    position: fixed; pointer-events: none; z-index: 9999;
    top: 0; left: 0; transform: translate(-50%, -50%);
    will-change: transform;
  }
  .cursor-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #B33A2B;
    box-shadow: 0 0 0 2px rgba(242,234,217,0.8), 0 2px 8px rgba(46,42,38,0.3);
    transition: width 0.2s ease, height 0.2s ease, background 0.2s ease;
  }
  .cursor-ring {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1.5px solid #C99B4A;
    box-shadow: 0 0 0 1px rgba(242,234,217,0.5), inset 0 0 6px rgba(201,155,74,0.2);
    transition: width 0.25s cubic-bezier(.2,.9,.3,1.2),
                height 0.25s cubic-bezier(.2,.9,.3,1.2),
                border-color 0.2s ease,
                border-width 0.2s ease,
                opacity 0.2s ease;
    background: rgba(179,58,43,0.05);
  }
  .cursor-ring.hover-btn {
    width: 52px; height: 52px;
    border-color: #B33A2B; border-width: 2px;
    background: rgba(179,58,43,0.1);
  }

    width: 44px; height: 44px;
    border-color: #2E2A26;
  }
  .cursor-ring.clicking {
    width: 20px; height: 20px;
    background: rgba(179,58,43,0.25);
    border-color: #B33A2B;
  }
  .cursor-ripple {
    position: fixed; pointer-events: none; z-index: 9998;
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid #B33A2B;
    transform: translate(-50%, -50%) scale(0.5);
    opacity: 0.6;
    animation: rippleExpand 0.6s ease-out forwards;
  }
  @keyframes rippleExpand {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0.6; }
    100% { transform: translate(-50%, -50%) scale(3.5); opacity: 0; }
  }
  @media (hover: none) {
    .cursor-dot, .cursor-ring { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cursor-dot, .cursor-ring, .cursor-ripple { transition: none !important; animation: none !important; }
  }

     SCROLLBAR HIDE
     ═══════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════
   CUSTOM CURSOR HOOK (DOM-level for perf)
   ══════════════════════════════════════════════════════════ */
function useCustomCursor() {
  useEffect(() => {
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduced) return;
    const isTouch = window.matchMedia("(hover: none)").matches;
    if (isTouch) return;

    const dot = document.createElement("div");
    const ring = document.createElement("div");
    dot.className = "cursor-dot";
    ring.className = "cursor-ring";
    document.body.appendChild(dot);
    document.body.appendChild(ring);

    let dx = window.innerWidth / 2, dy = window.innerHeight / 2;
    let rx = dx, ry = dy;
    let rafId = null;
    let visible = false;
    let paused = false;

    function tick() {
      if (paused) { rafId = null; return; }
      rx += (dx - rx) * 0.18;
      ry += (dy - ry) * 0.18;
      ring.style.transform = `translate(${rx}px, ${ry}px) translate(-50%, -50%)`;
      dot.style.transform = `translate(${dx}px, ${dy}px) translate(-50%, -50%)`;
      rafId = requestAnimationFrame(tick);
    }

    function onMove(e) {
      dx = e.clientX; dy = e.clientY;
      if (!visible) {
        visible = true;
        dot.style.opacity = 1; ring.style.opacity = 1;
      }
      if (!rafId) rafId = requestAnimationFrame(tick);
    }

    function onOver(e) {
      const t = e.target.closest("[data-cursor]");
      if (!t) { ring.className = "cursor-ring"; return; }
      const type = t.dataset.cursor;
      ring.className = "cursor-ring " + (type === "btn" ? "hover-btn" : type === "card" ? "hover-card" : "");
    }

    function onClick(e) {
      const r = document.createElement("div");
      r.className = "cursor-ripple";
      r.style.left = e.clientX + "px";
      r.style.top = e.clientY + "px";
      document.body.appendChild(r);
      setTimeout(() => r.remove(), 600);
      ring.classList.add("clicking");
      setTimeout(() => ring.classList.remove("clicking"), 150);
    }

    function onVisibility() {
      if (document.hidden) {
        paused = true;
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      } else {
        paused = false;
        if (!rafId) rafId = requestAnimationFrame(tick);
      }
    }

    window.addEventListener("mousemove", onMove, { passive: true });
    window.addEventListener("mouseover", onOver);
    window.addEventListener("click", onClick);
    document.addEventListener("visibilitychange", onVisibility);

    // initial position
    dot.style.transform = `translate(${dx}px, ${dy}px) translate(-50%, -50%)`;
    ring.style.transform = `translate(${rx}px, ${ry}px) translate(-50%, -50%)`;
    dot.style.opacity = 1; ring.style.opacity = 1;
    rafId = requestAnimationFrame(tick);

    return () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseover", onOver);
      window.removeEventListener("click", onClick);
      document.removeEventListener("visibilitychange", onVisibility);
      if (rafId) cancelAnimationFrame(rafId);
      dot.remove(); ring.remove();
    };
  }, []);
}

/* ══════════════════════════════════════════════════════════
   PAGE 1: HOME · DISCOVERY
   布局：瀑布流双列 + Hero 轮播 + 黄铜刻度尺 + 入场序列动画
   ══════════════════════════════════════════════════════════ */
function HomePage({ onOpenDetail, onOpenPage }) {
  const [activeSlide, setActiveSlide] = useState(0);
  const [enterStep, setEnterStep] = useState(0);
  const scrollRef = useRef(null);
  const [pullOffset, setPullOffset] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const startY = useRef(0);
  const isPulling = useRef(false);
  const slideTimer = useRef(null);

  // 入场序列动画
  useEffect(() => {
    setEnterStep(0);
    const t1 = setTimeout(() => setEnterStep(1), 100);
    const t2 = setTimeout(() => setEnterStep(2), 280);
    const t3 = setTimeout(() => setEnterStep(3), 460);
    const t4 = setTimeout(() => setEnterStep(4), 620);
    return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); clearTimeout(t4); };
  }, []);

  // Hero 轮播
  useEffect(() => {
    if (document.hidden) return;
    slideTimer.current = setInterval(() => {
      setActiveSlide(s => (s + 1) % 3);
    }, 4200);
    return () => { if (slideTimer.current) clearInterval(slideTimer.current); };
  }, []);

  useEffect(() => {
    function onVis() {
      if (document.hidden) {
        if (slideTimer.current) clearInterval(slideTimer.current);
      } else {
        slideTimer.current = setInterval(() => setActiveSlide(s => (s + 1) % 3), 4200);
      }
    }
    document.addEventListener("visibilitychange", onVis);
    return () => document.removeEventListener("visibilitychange", onVis);
  }, []);

  // 下拉刷新
  const onTouchStart = (e) => {
    if (scrollRef.current && scrollRef.current.scrollTop === 0) {
      startY.current = e.touches[0].clientY;
      isPulling.current = true;
    }
  };
  const onTouchMove = (e) => {
    if (!isPulling.current) return;
    const dy = e.touches[0].clientY - startY.current;
    if (dy > 0) {
      setPullOffset(Math.min(dy * 0.5, 80));
    }
  };
  const onTouchEnd = () => {
    if (!isPulling.current) return;
    isPulling.current = false;
    if (pullOffset > 50 && !refreshing) {
      setRefreshing(true);
      setPullOffset(50);
      setTimeout(() => {
        setRefreshing(false);
        setPullOffset(0);
      }, 1500);
    } else {
      setPullOffset(0);
    }
  };

  const heroSlides = [
    { img: IMG.street, title: "昭和横丁物语", subtitle: "情景模型大赛 · 金奖作品", color: C.red },
    { img: IMG.forest, title: "森之秘境", subtitle: "苔藓工坊新作发布", color: C.brass },
    { img: IMG.bookstore, title: "旧书店的下午", subtitle: "细活集 · 建筑微缩系列", color: C.wood },
  ];

  const cats = [
    { name: "情景", icon: Icon.sparkle, c: C.red },
    { name: "建筑", icon: Icon.grid, c: C.brass },
    { name: "车辆", icon: Icon.trophy, c: C.wood },
    { name: "人物", icon: Icon.user, c: C.graphiteSoft },
    { name: "工具", icon: Icon.ruler, c: C.redDeep },
  ];

  // 瀑布流分列
  const col1 = DISCOVERY_FEED.filter((_, i) => i % 2 === 0);
  const col2 = DISCOVERY_FEED.filter((_, i) => i % 2 === 1);

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", background: C.cream }}>
      {/* 大标题导航栏 */}
      <div style={{
        padding: "12px 20px 10px", background: C.cream,
        transform: enterStep >= 1 ? "translateY(0)" : "translateY(-20px)",
        opacity: enterStep >= 1 ? 1 : 0,
        transition: "all 0.5s cubic-bezier(.2,.9,.3,1.2)",
      }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div>
            <div style={{ fontFamily: '"Noto Serif SC", serif', fontWeight: 900, fontSize: 28,
              color: C.graphite, letterSpacing: -0.5, lineHeight: 1.1 }}>发现</div>
            <div style={{ fontSize: 12, color: C.graphiteLight, marginTop: 2, fontFamily: '"Noto Serif SC", serif' }}>
              微缩世界 · 大有乾坤
            </div>
          </div>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }} data-cursor="btn">
            <div style={{
              width: 36, height: 36, borderRadius: 18,
              background: C.creamLight, border: `1px solid ${C.creamDeep}`,
              display: "flex", alignItems: "center", justifyContent: "center",
            }}>{Icon.search(C.graphiteSoft)}</div>
          </div>
        </div>
      </div>

      {/* 滚动内容 */}
      <div
        ref={scrollRef}
        className="no-scrollbar"
        style={{ flex: 1, overflowY: "auto", overflowX: "hidden",
          transform: `translateY(${pullOffset}px)`,
          transition: isPulling.current ? "none" : "transform 0.3s cubic-bezier(.2,.9,.3,1.2)" }}
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
      >
        {/* 下拉刷新指示器 */}
        <div style={{
          height: pullOffset > 0 ? pullOffset : 0,
          display: "flex", alignItems: "center", justifyContent: "center",
          overflow: "hidden",
        }}>
          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4, opacity: Math.min(pullOffset / 50, 1) }}>
            {refreshing ? (
              <div style={{
                width: 20, height: 20, border: `2px solid ${C.brass}`,
                borderTopColor: "transparent", borderRadius: "50%",
                animation: "spinSlow 0.8s linear infinite",
              }} />
            ) : (
              Icon.ruler(pullOffset > 50 ? C.red : C.brass)
            )}
            <span style={{ fontSize: 11, color: C.graphiteLight }}>
              {refreshing ? "更新中…" : pullOffset > 50 ? "松手刷新" : "下拉发现新作"}
            </span>
          </div>
        </div>

        {/* Hero 轮播 */}
        <div style={{
          padding: "4px 16px 16px",
          opacity: enterStep >= 2 ? 1 : 0,
          transform: enterStep >= 2 ? "translateY(0)" : "translateY(16px)",
          transition: "all 0.6s cubic-bezier(.2,.9,.3,1)",
        }}>
          <div style={{
            position: "relative", borderRadius: 20, overflow: "hidden",
            height: 180, boxShadow: "0 8px 24px rgba(46,42,38,0.15)",
          }} data-cursor="card">
            {heroSlides.map((s, i) => (
              <div key={i} style={{
                position: "absolute", inset: 0,
                opacity: activeSlide === i ? 1 : 0,
                transform: activeSlide === i ? "scale(1)" : "scale(1.05)",
                transition: "opacity 0.8s ease, transform 1.6s ease-out",
              }}>
                <img src={s.img} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                <div style={{
                  position: "absolute", inset: 0,
                  background: `linear-gradient(135deg, ${s.color}80 0%, transparent 45%, rgba(46,42,38,0.6) 100%)`,
                }} />
                <div style={{
                  position: "absolute", left: 18, bottom: 16, right: 18,
                  color: "#fff",
                }}>
                  <div style={{
                    fontSize: 11, fontWeight: 500, opacity: 0.85, letterSpacing: 1,
                    marginBottom: 4, fontFamily: '"Noto Serif SC", serif',
                  }}>{s.subtitle}</div>
                  <div style={{ fontFamily: '"Noto Serif SC", serif', fontWeight: 900, fontSize: 24,
                    letterSpacing: 1, textShadow: "0 2px 12px rgba(0,0,0,0.3)" }}>
                    {s.title}
                  </div>
                </div>
                {/* 刻度尺装饰 */}
                <div style={{
                  position: "absolute", top: 14, right: 14,
                  fontFamily: '"Noto Serif SC", serif', fontSize: 10,
                  color: "rgba(255,255,255,0.8)", fontWeight: 600,
                  padding: "2px 6px", border: "1px solid rgba(255,255,255,0.5)",
                  borderRadius: 3,
                }}>1:87</div>
              </div>
            ))}
            {/* 指示器 */}
            <div style={{ position: "absolute", bottom: 10, left: "50%", transform: "translateX(-50%)",
              display: "flex", gap: 5 }}>
              {heroSlides.map((_, i) => (
                <div key={i} style={{
                  width: activeSlide === i ? 18 : 6, height: 4, borderRadius: 2,
                  background: activeSlide === i ? C.brass : "rgba(255,255,255,0.4)",
                  transition: "width 0.3s ease, background 0.3s ease",
                }} />
              ))}
            </div>
          </div>
        </div>

        {/* 分类入口 */}
        <div style={{
          padding: "0 16px 18px",
          opacity: enterStep >= 2 ? 1 : 0,
          transform: enterStep >= 2 ? "translateY(0)" : "translateY(12px)",
          transition: "all 0.5s cubic-bezier(.2,.9,.3,1)",
          transitionDelay: "100ms",
        }}>
          <div style={{
            display: "flex", justifyContent: "space-between",
            background: C.creamLight, borderRadius: 18, padding: "14px 10px",
            border: `1px solid ${C.creamDeep}`,
          }}>
            {cats.map((c, i) => (
              <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}
                data-cursor="btn">
                <div style={{
                  width: 44, height: 44, borderRadius: 14,
                  background: i === 0 ? C.red : C.cream,
                  display: "flex", alignItems: "center", justifyContent: "center",
                  boxShadow: i === 0 ? `0 4px 12px ${C.red}50` : `0 2px 6px rgba(46,42,38,0.06)`,
                  border: i === 0 ? `1px solid ${C.redDeep}` : `1px solid ${C.creamDeep}`,
                  transition: "transform 0.3s ease",
                }}>
                  {c.icon(i === 0 ? "#fff" : c.c)}
                </div>
                <span style={{ fontSize: 11, color: i === 0 ? C.red : C.graphiteSoft, fontWeight: 500 }}>
                  {c.name}
                </span>
              </div>
            ))}
          </div>
        </div>

        {/* section header + 瀑布流 */}
        <div style={{
          padding: "0 16px 100px",
          opacity: enterStep >= 3 ? 1 : 0,
          transform: enterStep >= 3 ? "translateY(0)" : "translateY(20px)",
          transition: "all 0.6s cubic-bezier(.2,.9,.3,1)",
          transitionDelay: "100ms",
        }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <div style={{ width: 3, height: 16, background: C.red, borderRadius: 2 }} />
              <span style={{ fontFamily: '"Noto Serif SC", serif', fontWeight: 700, fontSize: 18, color: C.graphite }}>
                新作推荐
              </span>
            </div>
            <span style={{ fontSize: 12, color: C.graphiteLight }} data-cursor="btn">查看全部 →</span>
          </div>

          <div style={{ display: "flex", gap: 10 }}>
            {[col1, col2].map((col, ci) => (
              <div key={ci} style={{ flex: 1, display: "flex", flexDirection: "column", gap: 10 }}>
                {col.map((item, idx) => (
                  <div key={item.id}
                    data-cursor="card"
                    onClick={() => onOpenDetail(item)}
                    style={{
                      borderRadius: 16, overflow: "hidden", position: "relative",
                      background: C.creamLight,
                      boxShadow: "0 4px 14px rgba(46,42,38,0.08)",
                      border: `1px solid ${C.creamDeep}`,
                      transform: enterStep >= 4 ? "translateY(0)" : "translateY(12px)",
                      opacity: enterStep >= 4 ? 1 : 0,
                      transition: `all 0.5s cubic-bezier(.2,.9,.3,1.2)`,
                      transitionDelay: `${(ci + idx * 2) * 80}ms`,
                    }}>
                    <div style={{ height: item.h, position: "relative", overflow: "hidden" }}>
                      <img src={item.img} alt="" style={{
                        width: "100%", height: "100%", objectFit: "cover",
                        transition: "transform 0.6s ease",
                      }} />
                      <div style={{ position: "absolute", top: 8, left: 8 }}>
                        <RatioBadge scale={item.scale} color="#fff" bg="rgba(46,42,38,0.4)" />
                      </div>
                      <div style={{
                        position: "absolute", top: 8, right: 8,
                        padding: "2px 6px", borderRadius: 4,
                        background: "rgba(46,42,38,0.5)",
                        fontSize: 10, color: "#fff", fontWeight: 500,
                      }}>{item.tag}</div>
                    </div>
                    <div style={{ padding: "10px 12px 12px" }}>
                      <div style={{ fontSize: 13, fontWeight: 500, color: C.graphite,
                        lineHeight: 1.35, marginBottom: 6,

                        overflow: "hidden", textOverflow: "ellipsis" }}>
                        {item.title}
                      </div>
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                          <div style={{
                            width: 18, height: 18, borderRadius: 9,

                            fontSize: 10, fontWeight: 700,

                        </div>
                        <div style={{ display: "flex", alignItems: "center", gap: 3, color: C.red }}>
                          {Icon.heart(C.red, true)}
                          <span style={{ fontSize: 11, fontWeight: 500 }}>{item.likes}</span>
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );

/* ══════════════════════════════════════════════════════════
   PAGE 2: WORK DETAIL
   布局：Hero 大图视差 + 悬浮信息卡 + 返回栈
   ══════════════════════════════════════════════════════════ */
function DetailPage({ item, onBack }) {
  const scrollRef = useRef(null);
  const [scrollY, setScrollY] = useState(0);
  const [liked, setLiked] = useState(false);
  const [likeAnim, setLikeAnim] = useState(false);
  const [saved, setSaved] = useState(false);

  const onScroll = useCallback(() => {
    if (scrollRef.current) {
      setScrollY(scrollRef.current.scrollTop);
    }
  }, []);

  const handleLike = () => {
    setLiked(!liked);
    if (!liked) {
      setLikeAnim(true);
      setTimeout(() => setLikeAnim(false), 500);
    }
  };

  // 视差参数
  const heroH = 340;
  const parallax = scrollY * 0.35;
  const scaleHero = 1 + Math.max(0, -scrollY) * 0.003;
  const titleOpacity = Math.max(0, Math.min(1, 1 - (scrollY - 40) / 80));
  const navOpacity = Math.max(0, Math.min(1, (scrollY - 60) / 40));

  return (
    <div style={{ height: "100%", background: C.cream, position: "relative" }}>
      {/* 滚动容器 */}
      <div ref={scrollRef} className="no-scrollbar"
        style={{ position: "absolute", inset: 0, overflowY: "auto", overflowX: "hidden" }}
        onScroll={onScroll}>
        {/* Hero */}
        <div style={{
          height: heroH, position: "relative", overflow: "hidden",
        }}>
          <div style={{
            position: "absolute", top: -40, left: 0, right: 0,
            height: heroH + 60,
            transform: `translateY(${parallax}px) scale(${scaleHero})`,
            willChange: "transform",
          }}>
            <img src={item.img} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
          </div>
          {/* 渐变蒙版 */}
          <div style={{
            position: "absolute", inset: 0,
            background: `linear-gradient(180deg, rgba(46,42,38,0.35) 0%, transparent 30%, transparent 60%, ${C.cream} 100%)`,

            style={{
              flex: 1, height: 48, borderRadius: 24,
              background: C.red, color: "#fff", border: "none",
              fontSize: 15, fontWeight: 600, cursor: "pointer",
              boxShadow: `0 6px 18px ${C.red}40`,
            }}>
            {step === 2 ? "发布作品" : "下一步"}
          </button>
        ) : (
          <button onClick={onClose} data-cursor="btn"
            style={{
              flex: 1, height: 48, borderRadius: 24,
              background: C.red, color: "#fff", border: "none",
              fontSize: 15, fontWeight: 600, cursor: "pointer",
              boxShadow: `0 6px 18px ${C.red}40`,
            }}>
            返回首页
          </button>
        )}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   BOTTOM TAB BAR
   ══════════════════════════════════════════════════════════ */
function TabBar({ activeTab, onChange }) {
  const tabs = [
    { key: "home", label: "发现", icon: Icon.home },
    { key: "tutorial", label: "制作课", icon: Icon.book },
    { key: "community", label: "社区", icon: Icon.compass },
    { key: "profile", label: "我的", icon: Icon.user },
  ];

  return (
    <div style={{
      position: "absolute", bottom: 0, left: 0, right: 0, zIndex: 30,
      paddingBottom: 28,
      background: C.creamLight,
      backdropFilter: "blur(20px)",
      WebkitBackdropFilter: "blur(20px)",
      borderTop: `1px solid ${C.creamDeep}`,
    }}>
      <div style={{ display: "flex", height: 56 }}>
        {tabs.map((tab, i) => {
          const active = activeTab === tab.key;
          return (
            <button key={tab.key} onClick={() => onChange(tab.key)} data-cursor="btn"
              style={{
                flex: 1, background: "none", border: "none", cursor: "pointer",
                display: "flex", flexDirection: "column", alignItems: "center",
                justifyContent: "center", gap: 2,
                padding: 0,
              }}>
              <div style={{
                color: active ? C.red : C.graphiteLight,
                transform: active ? "translateY(-2px) scale(1.1)" : "translateY(0) scale(1)",
                transition: "all 0.25s cubic-bezier(.2,.9,.3,1.4)",
              }}>
                {tab.icon(active ? C.red : C.graphiteLight)}
              </div>
              <span style={{
                fontSize: 10, fontWeight: active ? 600 : 400,
                color: active ? C.red : C.graphiteLight,
                transition: "all 0.2s ease",
              }}>{tab.label}</span>
              {active && <div style={{
                width: 4, height: 4, borderRadius: 2,
                background: C.red,
                marginTop: 1,
              }} />}
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   PAGE SWITCHER with slide transition
   ══════════════════════════════════════════════════════════ */
function PageRouter({ page, tab, detailItem, onBack, onOpenDetail, onOpenPage, onClosePublish, showPublish }) {
  return (
    <div style={{ position: "absolute", inset: 0, overflow: "hidden" }}>
      {page === "design" && <DesignSystemPage />}
      {page === "api" && <ApiDocPage />}
      {page === "main" && (
        <>
          <div style={{ position: "absolute", inset: 0, bottom: 84 }}>
            {tab === "home" && <HomePage onOpenDetail={onOpenDetail} onOpenPage={onOpenPage} />}
            {tab === "tutorial" && <TutorialPage />}
            {tab === "community" && <CommunityPage />}
            {tab === "profile" && <ProfilePage />}
          </div>
          <TabBar activeTab={tab} onChange={(t) => onOpenPage(t)} />

          {/* Detail overlay */}
          {detailItem && (
            <div style={{
              position: "absolute", inset: 0, zIndex: 50,
              background: C.cream,
              animation: "fadeIn 0.3s ease",
            }}>
              <DetailPage item={detailItem} onBack={onBack} />
            </div>
          )}

          {/* Publish modal */}
          {showPublish && <PublishPage onClose={onClosePublish} />}
        </>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   PAGE SWITCHER / DOTS (side panel for page navigation)
   ══════════════════════════════════════════════════════════ */
function PageSelector({ current, onChange, pages }) {
  return (
    <div style={{
      display: "flex", flexDirection: "column", gap: 8,
      padding: 12, borderRadius: 20,
      background: "rgba(46,42,38,0.06)",
      backdropFilter: "blur(10px)",
      border: `1px solid rgba(46,42,38,0.08)`,
    }}>
      {pages.map((p, i) => (
        <button key={p.key} onClick={() => onChange(p.key)} data-cursor="btn"
          title={p.name}
          style={{
            width: 40, height: 40, borderRadius: 14,
            background: current === p.key ? C.red : "transparent",
            border: current === p.key ? `1px solid ${C.redDeep}` : "none",
            cursor: "pointer",
            display: "flex", flexDirection: "column",
            alignItems: "center", justifyContent: "center",
            color: current === p.key ? "#fff" : C.graphiteSoft,
            gap: 2,
            transition: "all 0.25s ease",
            boxShadow: current === p.key ? `0 4px 12px ${C.red}40` : "none",
            fontFamily: "inherit",
          }}>
          <span style={{ fontSize: 14 }}>{p.icon}</span>
          <span style={{ fontSize: 9, fontWeight: 500, opacity: current === p.key ? 1 : 0.7 }}>
            {p.name}
          </span>
        </button>
      ))}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   MAIN APP
   ══════════════════════════════════════════════════════════ */
function App() {
  const [page, setPage] = useState("main");
  const [tab, setTab] = useState("home");
  const [detailItem, setDetailItem] = useState(null);
  const [showPublish, setShowPublish] = useState(false);
  const [fadeKey, setFadeKey] = useState(0);

  useCustomCursor();

  const pages = [
    { key: "main", name: "首页", icon: "🏠" },
    { key: "design", name: "规范", icon: "🎨" },
    { key: "api", name: "接口", icon: "⌨️" },
    { key: "publish", name: "发布", icon: "✨" },
  ];

  const handleChangePage = useCallback((p) => {
    if (p === "publish") {
      setPage("main");
      setShowPublish(true);
      return;
    }
    setPage(p);
    setDetailItem(null);
    setShowPublish(false);
    setFadeKey(k => k + 1);
  }, []);

  const handleTabChange = useCallback((t) => {
    setTab(t);
    setDetailItem(null);
    setFadeKey(k => k + 1);
  }, []);

  const handleOpenDetail = useCallback((item) => {
    setDetailItem(item);
  }, []);

  const handleCloseDetail = useCallback(() => {
    setDetailItem(null);
  }, []);

  // 升级宣告
  useEffect(() => {
    function announce() {
      window.parent && window.parent.postMessage({
        type: "miaoda:upgrade:available", kind: "interactive-prototype"
      }, "*");
    }
    announce();
    if (document.readyState !== "complete") {
      window.addEventListener("load", announce, { once: true });
    }
  }, []);

  return (
    <div className="app-stage">
      <div className="ruler-mark top" />
      <div className="ruler-mark bottom" />
      <div className="brand-tag">
        微缩模型社 <span>MINIATURE · SOCIETY</span>
      </div>

      <PageSelector current={page === "main" && showPublish ? "publish" : page} onChange={handleChangePage} pages={pages} />

      <div style={{ margin: "0 24px" }}>
        <IOSDevice width={390} height={844}>
          <PageRouter
            key={fadeKey}
            page={page}
            tab={tab}
            detailItem={detailItem}
            onBack={handleCloseDetail}
            onOpenDetail={handleOpenDetail}
            onOpenPage={handleTabChange}
            onClosePublish={() => setShowPublish(false)}
            showPublish={showPublish}
          />
        </IOSDevice>
      </div>

      <div style={{
        position: "absolute", bottom: 40, left: 0, right: 0,
        textAlign: "center",
        fontFamily: '"Noto Serif SC", serif',
        fontSize: 11,
        color: C.graphiteLight,
        opacity: 0.6,
        letterSpacing: 2,
      }}>
        V2 · 原生 App 高保真原型 · 8 页完整呈现
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════════ */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>

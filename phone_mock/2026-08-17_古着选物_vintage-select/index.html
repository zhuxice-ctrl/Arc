<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>Vintage Select · 古着选物 微信小程序</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" />
  <style>
    /* ========== RESET & BASE ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #2a2320;
      font-family: 'Noto Sans SC', -apple-system, 'PingFang SC', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      cursor: none;
    }
    body { display: flex; align-items: center; justify-content: center; }

    /* ========== CUSTOM CURSOR ========== */
    .cursor-outer, .cursor-inner {
      position: fixed; top: 0; left: 0;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.25s cubic-bezier(.2,.8,.2,1), height 0.25s cubic-bezier(.2,.8,.2,1),
                  opacity 0.2s ease, border-color 0.25s ease, background 0.25s ease;
      will-change: transform;
    }
    .cursor-outer {
      width: 32px; height: 32px;
      border: 1.5px solid #c4918c;
      border-radius: 50%;
      transition: transform 0.08s linear, width 0.25s cubic-bezier(.2,.8,.2,1),
                  height 0.25s cubic-bezier(.2,.8,.2,1), opacity 0.2s ease,
                  border-color 0.25s ease, background 0.25s ease;
    }
    .cursor-inner {
      width: 5px; height: 5px;
      background: #5c2a2a;
      border-radius: 50%;
      transition: transform 0.05s linear, width 0.2s ease, height 0.2s ease, background 0.2s ease, opacity 0.2s ease;
    }
    .cursor-hover .cursor-outer { width: 48px; height: 48px; border-color: #7a8b5e; background: rgba(122,139,94,0.08); }
    .cursor-hover .cursor-inner { width: 3px; height: 3px; background: #7a8b5e; }
    .cursor-click .cursor-outer { width: 20px; height: 20px; background: rgba(196,145,140,0.3); }
    .cursor-ripple {
      position: fixed; pointer-events: none; z-index: 9998;
      width: 6px; height: 6px; border-radius: 50%;
      background: radial-gradient(circle, rgba(196,145,140,0.5) 0%, transparent 70%);
      transform: translate(-50%, -50%) scale(1);
      animation: ripple 0.6s ease-out forwards;
    }
    @keyframes ripple {
      0% { width: 6px; height: 6px; opacity: 0.8; }
      100% { width: 60px; height: 60px; opacity: 0; }
    }

    /* ========== STAGE ========== */
    .stage {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%;
      padding: 20px;
      background: radial-gradient(ellipse at 30% 20%, #3a2f2b 0%, #1a1513 100%);
    }

    /* ========== PHONE FRAME ========== */
    .phone {
      position: relative;
      width: 375px; height: 760px;
      background: #0d0b0a;
      border-radius: 48px;
      padding: 10px;
      box-shadow:
        0 40px 80px rgba(0,0,0,0.6),
        0 0 0 1.5px #2a2320,
        inset 0 0 0 1px rgba(255,255,255,0.05);
      flex-shrink: 0;
    }
    .phone-screen {
      position: relative;
      width: 100%; height: 100%;
      border-radius: 40px;
      overflow: hidden;
      background: #f5efe3;
    }

    /* Status bar */
    .status-bar {
      position: absolute; top: 0; left: 0; right: 0;
      height: 44px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px 0 28px;
      z-index: 100;
      font-size: 15px; font-weight: 600;
      color: #2a2018;
    }
    .status-bar.dark { color: #fff; }
    .status-time { font-family: 'Noto Sans SC'; font-weight: 600; letter-spacing: -0.2px; }
    .status-right { display: flex; align-items: center; gap: 5px; }
    .status-icon { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; }

    /* Notch / Dynamic Island */
    .notch {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      width: 110px; height: 30px;
      background: #000; border-radius: 20px;
      z-index: 101;
    }

    /* ========== WECHAT MINI PROGRAM NAVBAR ========== */
    .wx-navbar {
      position: absolute; top: 44px; left: 0; right: 0;
      height: 44px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px;
      z-index: 90;
      transition: background 0.3s ease, color 0.3s ease;
    }
    .wx-navbar-title {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      font-size: 16px; font-weight: 500;
      font-family: 'Noto Serif SC', serif;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .wx-navbar.scrolled .wx-navbar-title { opacity: 1; }

    /* Capsule button */
    .wx-capsule {
      position: absolute; top: 50%; right: 12px;
      transform: translateY(-50%);
      width: 87px; height: 32px;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      display: flex; align-items: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.04);
      transition: background 0.3s ease;
    }
    .navbar-dark .wx-capsule {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .wx-capsule-btn {
      flex: 1; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: #333;
      transition: background 0.15s ease;
    }
    .navbar-dark .wx-capsule-btn { color: rgba(255,255,255,0.9); }
    .wx-capsule-btn:active { background: rgba(0,0,0,0.06); }
    .navbar-dark .wx-capsule-btn:active { background: rgba(255,255,255,0.1); }
    .wx-capsule-divider {
      width: 1px; height: 16px;
      background: rgba(0,0,0,0.08);
    }
    .navbar-dark .wx-capsule-divider { background: rgba(255,255,255,0.2); }
    .wx-back {
      position: absolute; top: 50%; left: 16px; transform: translateY(-50%);
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(20px);
      display: flex; align-items: center; justify-content: center;
      color: #333;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease, background 0.15s ease;
    }
    .wx-back.visible { opacity: 1; pointer-events: auto; }
    .wx-back:active { background: rgba(255,255,255,0.5); }
    .navbar-dark .wx-back { background: rgba(0,0,0,0.3); color: #fff; }

    /* ========== PAGE CONTAINER ========== */
    .page-container {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: hidden;
    }
    .page {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      background: #f5efe3;
      will-change: transform, opacity;
      transform: translateX(100%);
      opacity: 0;
      transition: transform 0.35s cubic-bezier(.25,.8,.25,1), opacity 0.3s ease;
      pointer-events: none;
    }
    .page.active {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }
    .page.exit-left {
      transform: translateX(-30%);
      opacity: 0.6;
    }
    .page::-webkit-scrollbar { display: none; }

    /* Page content padding for scroll pages */
    .page-content { padding-top: 88px; }
    .page-content.with-tabbar { padding-bottom: 70px; }

    /* ========== TAB BAR ========== */
    .tabbar {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 64px;
      background: rgba(255, 252, 245, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(92, 42, 42, 0.06);
      display: flex;
      z-index: 80;
      padding-bottom: 4px;
    }
    .tabbar-item {
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px;
      color: #a89a8a;
      transition: color 0.25s ease;
      position: relative;
    }
    .tabbar-item.active { color: #c4918c; }
    .tabbar-icon {
      width: 24px; height: 24px;
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
    }
    .tabbar-item.active .tabbar-icon {
      transform: scale(1.15) translateY(-2px);
    }
    .tabbar-label { font-size: 10px; font-weight: 500; }
    .tabbar-dot {
      position: absolute; top: 10px; right: 30%;
      width: 6px; height: 6px;
      background: #5c2a2a; border-radius: 50%;
      transform: scale(0);
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
    }
    .tabbar-item.active .tabbar-dot { transform: scale(1); }

    /* ========== FLOATING ACTION BUTTON ========== */
    .fab {
      position: absolute; bottom: 80px; right: 16px;
      width: 52px; height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #c4918c 0%, #a87570 100%);
      box-shadow: 0 6px 20px rgba(196, 145, 140, 0.4), inset 0 1px 0 rgba(255,255,255,0.3);
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      z-index: 70;
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), box-shadow 0.3s ease;
    }
    .fab:active { transform: scale(0.92); }
    .fab::before {
      content: '';
      position: absolute; inset: -3px;
      border-radius: 50%;
      border: 1px solid rgba(196, 145, 140, 0.3);
      animation: fab-pulse 2.5s ease-in-out infinite;
    }
    @keyframes fab-pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 0; }
    }

    /* ========== HOME PAGE ========== */
    .home-hero {
      position: relative;
      height: 420px;
      overflow: hidden;
      background: linear-gradient(180deg, #e8d9d0 0%, #f5efe3 100%);
    }
    .home-hero-bg {
      position: absolute; inset: 0;
      background: url('') center/cover no-repeat;
      opacity: 0.15;
    }
    .home-hero-content {
      position: absolute; bottom: 30px; left: 24px; right: 24px;
      z-index: 2;
    }
    .home-hero-eyebrow {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #7a8b5e;
      margin-bottom: 8px;
      opacity: 0;
      animation: fade-up 0.8s ease forwards;
      animation-delay: 0.2s;
    }
    .home-hero-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 48px;
      font-weight: 300;
      color: #5c2a2a;
      line-height: 1.05;
      letter-spacing: -1px;
      margin-bottom: 12px;
      opacity: 0;
      animation: fade-up 0.8s ease forwards;
      animation-delay: 0.35s;
    }
    .home-hero-title em {
      font-style: italic;
      font-weight: 400;
      color: #c4918c;
    }
    .home-hero-sub {
      font-size: 13px;
      color: #8a7a6b;
      line-height: 1.7;
      max-width: 260px;
      opacity: 0;
      animation: fade-up 0.8s ease forwards;
      animation-delay: 0.5s;
    }
    .home-hero-scroll-hint {
      position: absolute; bottom: 16px; left: 50%;
      transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      opacity: 0;
      animation: fade-in 1s ease 1.2s forwards;
    }
    .scroll-line {
      width: 1px; height: 24px;
      background: linear-gradient(to bottom, #c4918c, transparent);
      animation: scroll-line 2s ease-in-out infinite;
    }
    @keyframes scroll-line {
      0%, 100% { transform: scaleY(1); transform-origin: top; }
      50% { transform: scaleY(0.3); transform-origin: top; }
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Decorative vintage leaf */
    .hero-decoration {
      position: absolute; right: -20px; top: 100px;
      width: 180px; height: 280px;
      opacity: 0;
      animation: float-in 1.5s cubic-bezier(.2,.8,.2,1) 0.6s forwards;
    }
    @keyframes float-in {
      from { opacity: 0; transform: translateY(40px) rotate(10deg); }
      to { opacity: 1; transform: translateY(0) rotate(0deg); }
    }
    .hero-leaf {
      position: absolute;
      width: 30px; height: 30px;
      opacity: 0.6;
      animation: leaf-float 6s ease-in-out infinite;
    }
    .hero-leaf:nth-child(1) { top: 0; right: 40px; animation-delay: 0s; }
    .hero-leaf:nth-child(2) { top: 60px; right: 80px; animation-delay: 1.2s; animation-duration: 7s; }
    .hero-leaf:nth-child(3) { top: 120px; right: 20px; animation-delay: 2.5s; animation-duration: 5s; }
    .hero-leaf:nth-child(4) { top: 180px; right: 60px; animation-delay: 0.8s; animation-duration: 8s; }
    @keyframes leaf-float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
    }

    /* Section */
    .section {
      padding: 24px 20px;
    }
    .section-header {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 16px;
    }
    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 500;
      color: #5c2a2a;
    }
    .section-title-cn {
      font-size: 12px;
      color: #a89a8a;
      margin-left: 8px;
      font-family: 'Noto Serif SC', serif;
      font-weight: 400;
    }
    .section-more {
      font-size: 12px;
      color: #c4918c;
      display: flex; align-items: center; gap: 2px;
    }

    /* Waterfall grid */
    .waterfall {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .product-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(92, 42, 42, 0.06);
      transition: transform 0.3s cubic-bezier(.2,.8,.2,1), box-shadow 0.3s ease;
      position: relative;
    }
    .product-card:active { transform: scale(0.97); }
    .product-card-img {
      position: relative;
      width: 100%;
      aspect-ratio: 3/4;
      overflow: hidden;
      background: #ede5d8;
    }
    .product-card-img img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(.2,.8,.2,1);
    }
    .product-card:hover .product-card-img img { transform: scale(1.06); }
    .product-card-tag {
      position: absolute; top: 8px; left: 8px;
      padding: 3px 8px;
      background: rgba(245, 239, 227, 0.92);
      backdrop-filter: blur(8px);
      border-radius: 6px;
      font-size: 10px;
      color: #5c2a2a;
      font-weight: 500;
    }
    .product-card-heart {
      position: absolute; top: 8px; right: 8px;
      width: 28px; height: 28px;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(8px);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s ease;
    }
    .product-card-heart:active { transform: scale(0.8); }
    .product-card-heart.liked svg path { fill: #c4918c; stroke: #c4918c; }
    .product-card-info { padding: 10px 12px 12px; }
    .product-card-name {
      font-size: 13px;
      color: #2a2018;
      line-height: 1.4;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-weight: 500;
    }
    .product-card-brand {
      font-size: 10px;
      color: #a89a8a;
      margin-bottom: 6px;
      font-family: 'Cormorant Garamond', serif;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .product-card-price {
      display: flex; align-items: baseline; gap: 4px;
    }
    .price-current {
      font-size: 15px;
      font-weight: 600;
      color: #c4918c;
      font-family: 'Cormorant Garamond', serif;
    }
    .price-original {
      font-size: 11px;
      color: #c4b8a8;
      text-decoration: line-through;
    }

    /* Category chips row */
    .chip-row {
      display: flex;
      gap: 8px;
      padding: 0 20px 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      padding: 6px 14px;
      background: #ede5d8;
      border-radius: 20px;
      font-size: 12px;
      color: #8a7a6b;
      transition: all 0.25s ease;
      border: 1px solid transparent;
    }
    .chip.active {
      background: #5c2a2a;
      color: #f5efe3;
      border-color: #5c2a2a;
    }

    /* Story banner */
    .story-banner {
      margin: 8px 20px 0;
      position: relative;
      height: 140px;
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(135deg, #7a8b5e 0%, #5c6b46 100%);
    }
    .story-banner-inner {
      position: absolute; inset: 0;
      padding: 20px;
      display: flex; flex-direction: column; justify-content: center;
      color: #f5efe3;
      background: linear-gradient(135deg, rgba(122,139,94,0.85) 0%, rgba(92,107,70,0.9) 100%);
    }
    .story-banner h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-weight: 400;
      margin-bottom: 6px;
    }
    .story-banner p {
      font-size: 12px;
      opacity: 0.85;
      line-height: 1.6;
      max-width: 200px;
    }
    .story-banner-cta {
      position: absolute; bottom: 16px; right: 16px;
      display: flex; align-items: center; gap: 4px;
      font-size: 12px;
      padding: 6px 12px;
      background: rgba(245, 239, 227, 0.2);
      backdrop-filter: blur(8px);
      border-radius: 20px;
    }

    /* ========== CATEGORIES PAGE ========== */
    .categories-page { background: #f5efe3; }
    .categories-header {
      padding: 20px 20px 12px;
      padding-top: 100px;
      background: linear-gradient(180deg, #ede5d8 0%, #f5efe3 100%);
    }
    .categories-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 400;
      color: #5c2a2a;
      margin-bottom: 4px;
    }
    .categories-subtitle {
      font-size: 12px;
      color: #a89a8a;
      margin-bottom: 16px;
    }
    .search-bar {
      display: flex; align-items: center; gap: 8px;
      height: 40px;
      padding: 0 14px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 1px 6px rgba(92, 42, 42, 0.06);
    }
    .search-bar input {
      flex: 1;
      border: none; background: transparent;
      font-size: 13px;
      color: #2a2018;
      outline: none;
      font-family: inherit;
      cursor: none;
    }
    .search-bar input::placeholder { color: #c4b8a8; }

    /* Sticky filter tabs */
    .filter-sticky {
      position: sticky; top: 88px;
      z-index: 50;
      background: #f5efe3;
      padding: 10px 20px;
      display: flex; gap: 0;
      border-bottom: 1px solid rgba(92, 42, 42, 0.06);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-sticky::-webkit-scrollbar { display: none; }
    .filter-tab {
      flex-shrink: 0;
      padding: 6px 0;
      margin-right: 20px;
      font-size: 14px;
      color: #a89a8a;
      position: relative;
      transition: color 0.25s ease;
      white-space: nowrap;
    }
    .filter-tab.active { color: #5c2a2a; font-weight: 500; }
    .filter-tab::after {
      content: '';
      position: absolute; bottom: 0; left: 50%;
      transform: translateX(-50%) scaleX(0);
      width: 20px; height: 3px;
      background: #c4918c;
      border-radius: 2px;
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
    }
    .filter-tab.active::after { transform: translateX(-50%) scaleX(1); }

    /* Two column category layout */
    .cat-grid {
      padding: 16px 20px 80px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .cat-card {
      position: relative;
      aspect-ratio: 3/4;
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
    }
    .cat-card:active { transform: scale(0.96); }
    .cat-card img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .cat-card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(92,42,42,0.7) 100%);
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 14px;
      color: #f5efe3;
    }
    .cat-card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 2px;
    }
    .cat-card-count { font-size: 11px; opacity: 0.8; }

    /* ========== PRODUCT DETAIL PAGE ========== */
    .detail-page { background: #faf6ee; }
    .detail-gallery {
      position: relative;
      width: 100%; height: 460px;
      background: #ede5d8;
      overflow: hidden;
    }
    .detail-gallery-img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .detail-gallery-dots {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 6px;
    }
    .gallery-dot {

    /* ========== ACTION SHEET ========== */
    .actionsheet-mask {

      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .actionsheet-mask.visible { opacity: 1; pointer-events: auto; }
    .actionsheet {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: #faf6ee;
      border-radius: 20px 20px 0 0;
      z-index: 201;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(.2,.8,.2,1);
      padding-bottom: 20px;
    }
    .actionsheet.visible { transform: translateY(0); }
    .actionsheet-handle {

      border-radius: 2px;
      margin: 8px auto 16px;

      transition: background 0.15s ease;

    /* ========== SKELETON LOADING ========== */
    .skeleton {
      background: linear-gradient(90deg, #ede5d8 25%, #f5efe3 50%, #ede5d8 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s ease-in-out infinite;
      border-radius: 6px;
    }
    @keyframes skeleton-loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ========== SKELETON LOADING - PULL REFRESH ========== */
    .pull-refresh {
      position: absolute; top: 88px; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center;
      height: 0;
      overflow: hidden;
      transition: height 0.3s ease;
      color: #c4918c;
      font-size: 12px;
      gap: 8px;
    }
    .pull-refresh-icon {
      width: 14px; height: 14px;
      border: 2px solid #c4918c;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ========== TOAST ========== */
    .toast {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(42, 32, 24, 0.88);
      backdrop-filter: blur(10px);
      color: #f5efe3;
      padding: 12px 20px;

      font-size: 13px;
      z-index: 300;
      opacity: 0;
      pointer-events: none;

    }

      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    @media (prefers-reduced-motion: reduce) {

        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    .signature-logo {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);

    // ============ PAGE TRANSITION MANAGEMENT ==========
    function PageManager() {
      const [currentPage, setCurrentPage] = useState('home');
      const [pageStack, setPageStack] = useState(['home']);
      const [prevPage, setPrevPage] = useState(null);
      const [direction, setDirection] = useState('forward');
      const [toast, setToast] = useState('');

      const [navbarScrolled, setNavbarScrolled] = useState(false);
      const [navbarDark, setNavbarDark] = useState(false);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [liked, setLiked] = useState({});

      const appRef = useRef(null);

      useEffect(() => {
        setGlobalToast = setToast;
        setGlobalActionSheet = setShowActionSheet;
      }, []);

      const TAB_PAGES = ['home', 'categories', 'profile'];

      const navbarConfigs = {
        home: { title: '', dark: false, back: false },
        categories: { title: '分类', dark: false, back: false },
        profile: { title: '我的', dark: true, back: false },
        detail: { title: '商品详情', dark: false, back: true },
        story: { title: '店铺故事', dark: false, back: true },
        design: { title: '设计规范', dark: true, back: true },
        api: { title: '接口文档', dark: true, back: true },
        membership: { title: '会员中心', dark: true, back: true },
      };

      const config = navbarConfigs[currentPage] || { title: '', dark: false, back: false };

      // Update navbar state
      useEffect(() => {
        setNavbarDark(config.dark);
        const navbar = document.getElementById('wxNavbar');
        const statusBar = document.getElementById('statusBar');
        const navbarTitle = document.getElementById('wxNavbarTitle');
        const wxBack = document.getElementById('wxBack');

        if (navbar) navbar.classList.toggle('navbar-dark', config.dark);
        if (statusBar) statusBar.classList.toggle('dark', config.dark);
        if (navbarTitle) navbarTitle.textContent = config.title;
        if (wxBack) wxBack.classList.toggle('visible', config.back);
      }, [currentPage, config.dark, config.title, config.back]);

      // Navbar scroll effect
      useEffect(() => {
        const pageEl = document.querySelector(`.page[data-page="${currentPage}"]`);
        const handleScroll = (e) => {
          const scrolled = e.target.scrollTop > 60;
          setNavbarScrolled(scrolled);
          const navbar = document.getElementById('wxNavbar');
          if (navbar) {
            navbar.classList.toggle('scrolled', scrolled);
            if (scrolled && config.title) {
              navbar.style.background = config.dark
                ? 'rgba(42, 32, 24, 0.92)'
                : 'rgba(250, 246, 238, 0.92)';
              navbar.style.backdropFilter = 'blur(20px)';
            } else {
              navbar.style.background = 'transparent';
              navbar.style.backdropFilter = 'none';
            }
          }
        };

        const pageElements = document.querySelectorAll('.page');
        pageElements.forEach(el => {
          el.addEventListener('scroll', handleScroll);
        });

        return () => {
          pageElements.forEach(el => {
            el.removeEventListener('scroll', handleScroll);
          });
        };
      }, [currentPage, config.dark, config.title]);

      const navigateTo = useCallback((page, data = null) => {
        setPrevPage(currentPage);
        setDirection('forward');
        setCurrentPage(page);
        setPageStack(prev => [...prev, page]);
        if (data) setSelectedProduct(data);
      }, [currentPage]);

      const goBack = useCallback(() => {
        if (pageStack.length <= 1) return;
        const newStack = pageStack.slice(0, -1);
        setPrevPage(currentPage);
        setDirection('back');
        setCurrentPage(newStack[newStack.length - 1]);
        setPageStack(newStack);
      }, [pageStack, currentPage]);

      useEffect(() => {
        globalGoBack = goBack;
      }, [goBack]);

      const switchTab = useCallback((tabIndex) => {
        const tabs = ['home', 'categories', 'profile'];
        setPrevPage(currentPage);
        setDirection('switch');
        setCurrentPage(tabs[tabIndex]);
        setPageStack([tabs[tabIndex]]);
        setNavbarScrolled(false);
      }, [currentPage]);

      const toggleLike = useCallback((id) => {
        setLiked(prev => ({ ...prev, [id]: !prev[id] }));
      }, []);

      // Apply page transition classes
      useEffect(() => {
        const pages = document.querySelectorAll('.page');
        pages.forEach((page, index) => {
          const pageName = page.getAttribute('data-page');
          page.classList.remove('active', 'exit-left');
          page.style.transform = 'translateX(100%)';
          page.style.opacity = '0';
          page.style.pointerEvents = 'none';

          if (pageName === currentPage) {
            page.classList.add('active');
            page.style.transform = 'translateX(0)';
            page.style.opacity = '1';
            page.style.pointerEvents = 'auto';
            page.scrollTop = 0;
          } else if (pageName === prevPage && direction === 'forward') {
            page.classList.add('exit-left');
            page.style.transform = 'translateX(-30%)';
            page.style.opacity = '0.5';
          }
        });

            <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/>
            <line x1="7" y1="12" x2="17" y2="12"/>
          </svg>
        </div>
      );
    }

    // ============ RENDER TO DOM ============
    const root = ReactDOM.createRoot(document.getElementById('pageContainer'));
    root.render(<PageManager />);

    // ============ CUSTOM CURSOR ============
    (function initCursor() {
      const outer = document.getElementById('cursorOuter');
      const inner = document.getElementById('cursorInner');
      let outerX = 0, outerY = 0, innerX = 0, innerY = 0;
      let targetX = 0, targetY = 0;
      let rafId = null;
      let isVisible = false;

      const phoneScreen = document.getElementById('phoneScreen');

      const animate = () => {
        if (document.hidden) { rafId = null; return; }

        outerX += (targetX - outerX) * 0.15;
        outerY += (targetY - outerY) * 0.15;
        innerX += (targetX - innerX) * 0.35;
        innerY += (targetY - innerY) * 0.35;

        outer.style.transform = `translate(${outerX}px, ${outerY}px) translate(-50%, -50%)`;
        inner.style.transform = `translate(${innerX}px, ${innerY}px) translate(-50%, -50%)`;

        rafId = requestAnimationFrame(animate);
      };

      const startAnim = () => {
        if (!rafId) rafId = requestAnimationFrame(animate);
      };

      document.addEventListener('mousemove', (e) => {
        targetX = e.clientX;
        targetY = e.clientY;
        if (!isVisible) {
          isVisible = true;
          outer.style.opacity = '1';
          inner.style.opacity = '1';
        }
        startAnim();
      });

      // Hover states
      document.addEventListener('mouseover', (e) => {
        const interactive = e.target.closest('button, .chip, .product-card, .cat-card, .size-option, .menu-item, .member-card, .tabbar-item, .fab, .action-icon-btn, .action-add-cart, .action-buy, .filter-tab, .section-more, .story-banner, .wx-capsule-btn, .wx-back, .detail-back, .detail-share, .product-card-heart, input');
        if (interactive) {
          document.body.classList.add('cursor-hover');
        }
      });

      document.addEventListener('mouseout', (e) => {
        const interactive = e.target.closest('button, .chip, .product-card, .cat-card, .size-option, .menu-item, .member-card, .tabbar-item, .fab, .action-icon-btn, .action-add-cart, .action-buy, .filter-tab, .section-more, .story-banner, .wx-capsule-btn, .wx-back, .detail-back, .detail-share, .product-card-heart, input');
        if (interactive && !e.relatedTarget?.closest?.('button, .chip, .product-card, .cat-card, .size-option, .menu-item, .member-card, .tabbar-item, .fab, .action-icon-btn, .action-add-cart, .action-buy, .filter-tab, .section-more, .story-banner, .wx-capsule-btn, .wx-back, .detail-back, .detail-share, .product-card-heart, input')) {
          document.body.classList.remove('cursor-hover');
        }
      });

      // Click ripple
      document.addEventListener('mousedown', (e) => {
        document.body.classList.add('cursor-click');
        const ripple = document.createElement('div');
        ripple.className = 'cursor-ripple';
        ripple.style.left = e.clientX + 'px';
        ripple.style.top = e.clientY + 'px';
        document.body.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
      });

      document.addEventListener('mouseup', () => {
        document.body.classList.remove('cursor-click');
      });

      // Visibility
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && rafId) {
          cancelAnimationFrame(rafId);
          rafId = null;
        } else if (!document.hidden && isVisible) {
          startAnim();
        }
      });
    })();

    // ============ TOAST & ACTION SHEET GLOBAL ============
    const origShowToast = window.showToast;
    window.showToast = function(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 2000);
    };

    window.closeActionSheet = function() {
      const sheet = document.getElementById('actionsheet');
      const mask = document.getElementById('actionsheetMask');
      sheet.classList.remove('visible');
      mask.classList.remove('visible');
    };

    window.openActionSheet = function() {
      const sheet = document.getElementById('actionsheet');
      const mask = document.getElementById('actionsheetMask');
      sheet.classList.add('visible');
      mask.classList.add('visible');
    };

    // Connect action sheet open with detail share button
    document.addEventListener('click', (e) => {
      if (e.target.closest('.detail-share')) {
        window.openActionSheet();
      }
    });

    // ============ SPLASH SCREEN ============
    window.addEventListener('load', () => {
      setTimeout(() => {
        const splash = document.getElementById('splashScreen');
        const logo = document.getElementById('signatureLogo');
        if (splash) splash.style.display = 'none';
        if (logo) logo.style.display = 'none';
      }, 2800);
    });

    // ============ ANNOUNCE UPGRADE ============
    function announceUpgrade() {
      window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    }
    announceUpgrade();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announceUpgrade, { once: true });
    }
  </script>
</body>
</html>

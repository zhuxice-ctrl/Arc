<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #1A1410;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(160,82,45,0.18), transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(74,124,111,0.15), transparent 50%),
      #1A1410;
  }
  .stage { display: flex; gap: 40px; align-items: center; justify-content: center; }
  .caption {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    color: rgba(237,228,211,0.4); font-size: 12px; letter-spacing: 0.08em;
    font-family: 'JetBrains Mono', monospace;
  }

  /* ── custom cursor ── */
  .cursor {
    position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999;
    width: 28px; height: 28px;
    transform: translate(-50%, -50%);
    transition: width 0.25s cubic-bezier(.2,.9,.3,1.2), height 0.25s cubic-bezier(.2,.9,.3,1.2);
    will-change: transform;
  }
  .cursor-ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2.5px solid #fff;
    box-shadow:
      0 0 12px rgba(255,255,255,0.5),
      0 0 24px rgba(160,82,45,0.6),
      0 0 40px rgba(160,82,45,0.3);
    transition: all 0.25s cubic-bezier(.2,.9,.3,1.2);
  }
  .cursor-dot {
    position: absolute; top: 50%; left: 50%;
    width: 6px; height: 6px; border-radius: 50%;
    background: #A0522D;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px rgba(160,82,45,0.8);
    transition: all 0.2s ease;
  }
  .cursor.hover .cursor-ring {
    width: 100%; height: 100%;
    border-color: #4A7C6F;
    box-shadow: 0 0 16px rgba(74,124,111,0.7), 0 0 32px rgba(74,124,111,0.4);
    transform: scale(1.4);
  }
  .cursor.hover .cursor-dot { background: #4A7C6F; }
  .cursor.click .cursor-ring {
    animation: cursorRipple 0.5s ease-out;
  }
  @keyframes cursorRipple {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(2.2); opacity: 0; }
  }

  /* page transition */
  .page-enter { animation: pageSlideIn 0.35s cubic-bezier(.2,.8,.2,1) both; }
  .page-exit { animation: pageSlideOut 0.3s cubic-bezier(.4,0,.8,.2) both; }
  @keyframes pageSlideIn {
    from { transform: translateX(100%); opacity: 0.5; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes pageSlideOut {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(-30%); opacity: 0; }
  }

  /* modal */
  .modal-enter { animation: modalUp 0.35s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes modalUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-backdrop-enter { animation: fadeIn 0.25s ease both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* scrollbar */
  ::-webkit-scrollbar { display: none; }
  * { -ms-overflow-style: none; scrollbar-width: none; }

  /* utility */
  .interactive { cursor: pointer; }
  .serif { font-family: 'Playfair Display', Georgia, serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* particle */
  .particle {
    position: absolute; pointer-events: none;
    border-radius: 50%;
    animation: particleFloat 2.5s ease-out forwards;
  }
  @keyframes particleFloat {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }

  /* fade-up items */
  .fade-up { animation: fadeUp 0.6s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* shimmer */
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  /* bone wiggle */
  @keyframes boneWiggle {
    0%, 100% { transform: rotate(-2deg); }
    50% { transform: rotate(2deg); }
  }

  /* dust float */
  @keyframes dustFloat {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    20% { opacity: 0.7; }
    100% { transform: translateY(-60px) translateX(10px); opacity: 0; }
  }

  /* spin slow */
  @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* pulse ring */
  @keyframes pulseRing {
    0% { transform: scale(0.8); opacity: 1; }
    100% { transform: scale(2); opacity: 0; }
  }

  /* typing */
  @keyframes typingBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* wave */
  @keyframes wave {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  /* slide up staggered */
  .slide-1 { animation: slideUp 0.5s cubic-bezier(.2,.8,.2,1) 0.05s both; }
  .slide-2 { animation: slideUp 0.5s cubic-bezier(.2,.8,.2,1) 0.1s both; }
  .slide-3 { animation: slideUp 0.5s cubic-bezier(.2,.8,.2,1) 0.15s both; }
  .slide-4 { animation: slideUp 0.5s cubic-bezier(.2,.8,.2,1) 0.2s both; }
  .slide-5 { animation: slideUp 0.5s cubic-bezier(.2,.8,.2,1) 0.25s both; }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>

  // ================================================================
  // PAGE 1: Home (图鉴信息流)
  // ================================================================
  function HomePage({ onFossilTap, onNavigate }) {
    const [refreshing, setRefreshing] = useState(false);
    const scrollRef = useRef(null);
    const pullStartY = useRef(0);
    const pullDistance = useRef(0);
    const [pullOffset, setPullOffset] = useState(0);

    // ── pull to refresh (native-style) ──
    const handleTouchStart = (e) => {
      if (scrollRef.current && scrollRef.current.scrollTop === 0) {
        pullStartY.current = e.touches[0].clientY;
      }
    };
    const handleTouchMove = (e) => {
      if (scrollRef.current && scrollRef.current.scrollTop === 0 && pullStartY.current) {
        const dy = e.touches[0].clientY - pullStartY.current;
        if (dy > 0) {
          pullDistance.current = Math.min(dy * 0.5, 100);
          setPullOffset(pullDistance.current);
        }
      }
    };
    const handleTouchEnd = () => {
      if (pullDistance.current > 60) {
        setRefreshing(true);
        setPullOffset(50);
        setTimeout(() => {
          setRefreshing(false);
          setPullOffset(0);
        }, 1500);
      } else {
        setPullOffset(0);
      }
      pullStartY.current = 0;
      pullDistance.current = 0;
    };

    // desktop simulation: wheel up at top triggers refresh
    useEffect(() => {
      const el = scrollRef.current;
      if (!el) return;
      const onWheel = (e) => {
        if (el.scrollTop === 0 && e.deltaY < -30 && !refreshing) {
          setRefreshing(true);
          setPullOffset(50);
          setTimeout(() => {
            setRefreshing(false);
            setPullOffset(0);
          }, 1400);
        }
      };
      el.addEventListener('wheel', onWheel, { passive: true });
      return () => el.removeEventListener('wheel', onWheel);
    }, [refreshing]);

    const featured = FOSSILS[0];
    const recent = FOSSILS.slice(1, 5);

    return (
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', background: C.deeper, color: C.bone }}>
        <LargeNavBar
          title="化石图鉴"
          subtitle="探索 5.4 亿年的生命痕迹"
          rightIcon={<Icon.Search size={20} color={C.bone} />}
          dark
        />
        <div
          ref={scrollRef}
          style={{ flex: 1, overflowY: 'auto', position: 'relative' }}
          onTouchStart={handleTouchStart}
          onTouchMove={handleTouchMove}
          onTouchEnd={handleTouchEnd}
        >
          {/* Pull to refresh indicator */}
          <div style={{
            height: pullOffset, overflow: 'hidden',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            transition: refreshing ? 'none' : 'height 0.3s cubic-bezier(.2,.8,.2,1)',
          }}>
            <div style={{
              display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6,
              opacity: pullOffset > 20 ? 1 : 0,
              transition: 'opacity 0.2s',
            }}>
              <FossilSVG kind="ammonite" color={C.rust} size={28} />
              {refreshing ? (
                <div style={{ fontSize: 11, color: C.boneSoft, letterSpacing: 0.5 }}>正在加载新化石…</div>
              ) : (
                <div style={{ fontSize: 11, color: C.boneSoft, letterSpacing: 0.5 }}>
                  {pullOffset > 60 ? '松开刷新' : '下拉刷新'}
                </div>
              )}
            </div>
          </div>

          {/* Hero card — signature design: diagonal split + fossil portrait */}
          <div className="slide-1 interactive" onClick={() => onFossilTap(featured)} style={{
            margin: '8px 20px 20px',
            borderRadius: 20, overflow: 'hidden', position: 'relative',
            height: 220, cursor: 'pointer',
            background: `linear-gradient(135deg, ${C.rust} 0%, ${C.earth} 60%, ${C.dark} 100%)`,
            boxShadow: `0 8px 24px rgba(160,82,45,0.3), 0 2px 8px rgba(0,0,0,0.2)`,
          }}>
            {/* dust particles (signature animation 1) */}
            <DustParticles count={8} />
            {/* Diagonal split */}
            <div style={{
              position: 'absolute', top: 0, right: 0, bottom: 0,
              width: '55%',
              clipPath: 'polygon(20% 0, 100% 0, 100% 100%, 0% 100%)',
              background: 'rgba(46, 33, 26, 0.4)',
            }} />
            <div style={{ position: 'relative', zIndex: 2, padding: 20, height: '100%', display: 'flex', flexDirection: 'column' }}>
              <div style={{
                fontSize: 11, fontWeight: 600, letterSpacing: 1.5, textTransform: 'uppercase',
                color: C.bone, opacity: 0.7,
              }}>本周精选</div>
              <div style={{ flex: 1 }} />
              <div>
                <div className="serif" style={{ fontSize: 28, fontWeight: 700, color: C.bone, letterSpacing: -0.5, lineHeight: 1.15 }}>
                  {featured.name}
                </div>
                <div className="serif" style={{ fontSize: 13, fontStyle: 'italic', color: C.bone, opacity: 0.75, marginTop: 2 }}>
                  {featured.latin}

  // ── Dust particle animation (signature animation 1) ──
  function DustParticles({ count = 6 }) {
    const particles = useMemo(() =>
      Array.from({ length: count }, (_, i) => ({
        id: i,
        left: Math.random() * 100,
        top: 60 + Math.random() * 40,
        size: 2 + Math.random() * 4,
        delay: Math.random() * 3,
        duration: 3 + Math.random() * 3,
      })), [count]);
    return (
      <>
        {particles.map(p => (
          <div key={p.id} style={{
            position: 'absolute',
            left: `${p.left}%`, top: `${p.top}%`,
            width: p.size, height: p.size,
            borderRadius: '50%',
            background: C.bone, opacity: 0.3,
            animation: `dustFloat ${p.duration}s ease-in-out ${p.delay}s infinite`,
            willChange: 'transform, opacity',
          }} />
        ))}
      </>
    );
  }

  function UploadPage() {
    const [stage, setStage] = useState('idle'); // idle, scanning, result
    const [scanProgress, setScanProgress] = useState(0);
    const rafRef = useRef(null);
    const timerRef = useRef(null);

    useEffect(() => {
      return () => {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        if (timerRef.current) clearTimeout(timerRef.current);
      };
    }, []);

    const startScan = () => {
      setStage('scanning');
      setScanProgress(0);
      const start = performance.now();
      const duration = 2500;
      const animate = (now) => {
        const elapsed = now - start;
        const p = Math.min(elapsed / duration, 1);
        // ease out cubic
        const eased = 1 - Math.pow(1 - p, 3);
        setScanProgress(eased);
        if (p < 1) {
          rafRef.current = requestAnimationFrame(animate);
        } else {
          timerRef.current = setTimeout(() => setStage('result'), 400);
        }
      };
      rafRef.current = requestAnimationFrame(animate);
    };

    const identified = FOSSILS[4]; // ammonite

    const [showApi, setShowApi] = useState(false);
    const [pageTransition, setPageTransition] = useState(false);

    const prevTabRef = useRef(tab);

    // ── Page visibility / animation cleanup ──
    useEffect(() => {
      const onVisibility = () => {
        if (document.hidden) {
          // pause timers by dispatching custom event — components listen
          document.dispatchEvent(new CustomEvent('app-pause'));
        } else {
          document.dispatchEvent(new CustomEvent('app-resume'));
        }
      };
      document.addEventListener('visibilitychange', onVisibility);
      return () => document.removeEventListener('visibilitychange', onVisibility);
    }, []);

    const handleFossilTap = (fossil) => {
      setDetailFossil(fossil);
    };

    const handleBackFromDetail = () => {
      setDetailFossil(null);
    };

    const handleTabChange = (newTab) => {
      if (newTab === tab) return;
      setPageTransition(true);
      setTimeout(() => {
        setTab(newTab);
        prevTabRef.current = newTab;
        setPageTransition(false);
      }, 150);
    };

    const handleNavigate = (target) => {
      if (target === 'catalog') setTab('catalog');
      if (target === 'camera') setTab('camera');
      if (target === 'spec') setShowSpec(true);
      if (target === 'api') setShowApi(true);
    };

    const renderPage = () => {
      switch (tab) {
        case 'home':
          return <HomePage key="home" onFossilTap={handleFossilTap} onNavigate={handleNavigate} />;
        case 'catalog':
          return <CatalogPage key="catalog" onFossilTap={handleFossilTap} />;
        case 'camera':
          return <UploadPage key="camera" />;
        case 'map':
          return <MapPage key="map" onAddRecord={() => setTab('camera')} />;
        case 'collection':
          return <CollectionPage key="collection" onFossilTap={handleFossilTap} onNavigate={handleNavigate} />;
        default:
          return null;
      }
    };

    return (
      <div style={{ position: 'relative' }}>
        <DeviceFrame width={390} height={844}>
          <div style={{ flex: 1, position: 'relative', overflow: 'hidden' }}>
            {/* Main content */}
            <div style={{
              position: 'absolute', inset: 0,
              display: 'flex', flexDirection: 'column',
              transform: pageTransition ? 'translateX(-5%)' : 'translateX(0)',
              opacity: pageTransition ? 0.5 : 1,
              transition: 'transform 0.15s ease, opacity 0.15s ease',
            }}>
              {renderPage()}
              <TabBar active={tab} onChange={handleTabChange} dark={tab === 'home' || tab === 'map' || tab === 'camera'} />
            </div>

            {/* Detail overlay */}
            {detailFossil && (
              <DetailPage fossil={detailFossil} onBack={handleBackFromDetail} />
            )}

            {/* Design Spec modal */}
            {showSpec && (
              <>
                <div
                  className="modal-backdrop-enter"
                  onClick={() => setShowSpec(false)}
                  style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.6)', zIndex: 400 }}
                />
                <div className="modal-enter" style={{
                  position: 'absolute', inset: 0, zIndex: 401,
                  display: 'flex', flexDirection: 'column',
                }}>
                  <DesignSpecPage onBack={() => setShowSpec(false)} />
                </div>
              </>
            )}

            {/* API Doc modal */}
            {showApi && (
              <>
                <div
                  className="modal-backdrop-enter"
                  onClick={() => setShowApi(false)}
                  style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.6)', zIndex: 400 }}
                />
                <div className="modal-enter" style={{
                  position: 'absolute', inset: 0, zIndex: 401,
                  display: 'flex', flexDirection: 'column',
                }}>
                  <ApiDocPage onBack={() => setShowApi(false)} />
                </div>
              </>
            )}

            {/* Design spec + API entry points in settings-like button */}
            {tab === 'collection' && (
              <div style={{
                position: 'absolute', right: 16, top: 100, zIndex: 30,
                display: 'flex', flexDirection: 'column', gap: 8,
              }}>
                <div
                  className="interactive"
                  onClick={() => setShowSpec(true)}
                  style={{
                    width: 36, height: 36, borderRadius: 18,
                    background: C.dark, color: C.bone,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    boxShadow: '0 2px 8px rgba(0,0,0,0.2)',
                    cursor: 'pointer',
                    border: '1px solid rgba(237,228,211,0.1)',
                  }}
                  title="设计规范"
                >
                  <Icon.Palette size={16} color={C.rust} />
                </div>
                <div
                  className="interactive"
                  onClick={() => setShowApi(true)}
                  style={{
                    width: 36, height: 36, borderRadius: 18,
                    background: C.dark, color: C.bone,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    boxShadow: '0 2px 8px rgba(0,0,0,0.2)',
                    cursor: 'pointer',
                    border: '1px solid rgba(237,228,211,0.1)',
                  }}
                  title="接口文档"
                >
                  <Icon.Code size={16} color={C.patina} />
                </div>
              </div>
            )}
          </div>
        </DeviceFrame>
      </div>
    );
  }

  // ================================================================
  // Custom cursor
  // ================================================================
  function initCustomCursor() {
    const cursor = document.getElementById('cursor');
    if (!cursor) return;

    // Reduced motion: don't customize cursor
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) {
      cursor.style.display = 'none';
      return;
    }

    let targetX = window.innerWidth / 2;
    let targetY = window.innerHeight / 2;
    let currentX = targetX;
    let currentY = targetY;
    let rafId = null;
    let paused = false;

    const animate = () => {
      if (paused) return;
      // smooth follow (lerp)
      currentX += (targetX - currentX) * 0.18;
      currentY += (targetY - currentY) * 0.18;
      cursor.style.transform = `translate(${currentX}px, ${currentY}px) translate(-50%, -50%)`;
      rafId = requestAnimationFrame(animate);
    };

    const onMove = (e) => {
      targetX = e.clientX;
      targetY = e.clientY;
    };

    const onOver = (e) => {
      const target = e.target.closest('.interactive');
      if (target) {
        cursor.classList.add('hover');
      }
    };

    const onOut = (e) => {
      const target = e.target.closest('.interactive');
      if (target) {
        cursor.classList.remove('hover');
      }
    };

    const onClick = () => {
      cursor.classList.remove('click');
      void cursor.offsetWidth; // reflow
      cursor.classList.add('click');
      setTimeout(() => cursor.classList.remove('click'), 500);
    };

    const start = () => {
      if (rafId) cancelAnimationFrame(rafId);
      paused = false;
      rafId = requestAnimationFrame(animate);
    };
    const stop = () => {
      paused = true;
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    };

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseover', onOver);
    document.addEventListener('mouseout', onOut);
    document.addEventListener('mousedown', onClick);

    // Page visibility pauses the loop
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stop();
      else start();
    });
    document.addEventListener('app-pause', stop);
    document.addEventListener('app-resume', start);

    // cleanup on unload
    window.addEventListener('beforeunload', () => {
      stop();
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseover', onOver);
      document.removeEventListener('mouseout', onOut);
      document.removeEventListener('mousedown', onClick);
    });

    start();
  }

  // ================================================================
  // Mount
  // ================================================================
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);

  // Announce upgrade ability
  function announceUpgrade() {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  }
  announceUpgrade();
  if (document.readyState !== 'complete') {
    window.addEventListener('load', announceUpgrade, { once: true });
  }

  // Init custom cursor after React mounts
  setTimeout(initCustomCursor, 100);
  </script>
</body>
</html>

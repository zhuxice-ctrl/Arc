<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>城市观星台 · 微信小程序</title>
<style>
  :root {
    --midnight: #1A1B3A;
    --midnight-2: #222449;
    --midnight-3: #2D2F5C;
    --midnight-deep: #0F1026;
    --star-silver: #C4C8D8;
    --star-silver-dim: #8A8FA8;
    --nebula-rose: #E8919A;
    --nebula-rose-deep: #D26A78;
    --amber-gold: #F0B860;
    --amber-gold-deep: #D99C3E;
    --glass-bg: rgba(26, 27, 58, 0.6);
    --glass-border: rgba(196, 200, 216, 0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; min-height: 100vh;
    background: radial-gradient(ellipse at top, #1A1B3A 0%, #0F1026 60%, #070818 100%);
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--star-silver);
    overflow-x: hidden;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  .page-bg {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 20% 10%, #2D2F5C 0%, transparent 50%),
                radial-gradient(ellipse at 80% 90%, #222449 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }
  /* 背景星点装饰 */
  .bg-stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .bg-stars span {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: var(--star-silver); opacity: 0.4;
  }
  /* 自定义光标 */
  .custom-cursor {
    position: fixed; left: 50%; top: 50%;
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--amber-gold);
    box-shadow: 0 0 12px rgba(240,184,96,0.6), inset 0 0 6px rgba(240,184,96,0.3);
    pointer-events: none; z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width .2s ease, height .2s ease, background .2s ease;
    mix-blend-mode: screen;
  }
  .custom-cursor::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--amber-gold); transform: translate(-50%, -50%);
  }
  .custom-cursor.hover { width: 36px; height: 36px; background: rgba(240,184,96,0.15); }

  .stage-label {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    color: rgba(196,200,216,0.5); font-size: 13px; letter-spacing: 2px;
    z-index: 1;
  }
  .stage-label b { color: var(--amber-gold); font-weight: 500; }

  /* ========= 小程序容器 ========= */
  .mp-wrap {
    position: relative; z-index: 1;
    filter: drop-shadow(0 20px 60px rgba(0,0,0,0.5));
  }
  .phone-frame {
    width: 375px; height: 812px;
    border-radius: 42px;
    background: #0a0a1a;
    border: 10px solid #1a1a2e;
    position: relative;
    overflow: hidden;
    box-shadow:
      inset 0 0 0 2px rgba(255,255,255,0.05),
      0 30px 80px rgba(0,0,0,0.6);
  }
  /* iPhone 刘海 */
  .notch {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 150px; height: 30px;
    background: #0a0a1a;
    border-bottom-left-radius: 18px;
    border-bottom-right-radius: 18px;
    z-index: 1000;
  }
  /* 状态栏 */
  .status-bar {
    height: 44px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px 0 28px;
    color: #fff;
    font-size: 15px; font-weight: 600;
    font-family: -apple-system, "SF Pro Display", sans-serif;
    position: relative; z-index: 100;
  }
  .status-bar .icons { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .status-bar .battery {
    width: 24px; height: 11px; border: 1px solid #fff;
    border-radius: 3px; position: relative;
  }
  .status-bar .battery::after {
    content: ''; position: absolute; right: -3px; top: 50%; transform: translateY(-50%);
    width: 2px; height: 6px; background: #fff; border-radius: 0 1px 1px 0; opacity: 0.5;
  }
  .status-bar .battery-fill {
    position: absolute; left: 1px; top: 1px; bottom: 1px;
    width: 18px; background: #fff; border-radius: 1px;
  }

  /* 小程序导航栏（含胶囊按钮） */
  .mp-navbar {
    height: 44px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px 0 20px;
    position: relative; z-index: 100;
    transition: background .3s ease;
  }
  .mp-navbar .nav-title {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 17px; font-weight: 600; color: #fff;
    opacity: 0; transition: opacity .3s ease;
  }
  .mp-navbar.solid .nav-title { opacity: 1; }
  .mp-navbar.solid { background: rgba(26,27,58,0.95); backdrop-filter: blur(20px); }

  /* 胶囊按钮 */
  .capsule {
    width: 87px; height: 32px;
    border: 1px solid rgba(196,200,216,0.3);
    border-radius: 16px;
    background: rgba(26,27,58,0.6);
    backdrop-filter: blur(10px);
    display: flex; align-items: center;
    position: absolute; right: 12px; top: 6px;
    z-index: 200;
    transition: background .2s ease;
    cursor: pointer;
  }
  .capsule:hover { background: rgba(255,255,255,0.12); }
  .capsule-icon {
    flex: 1; display: flex; align-items: center; justify-content: center;
    height: 100%;
  }
  .capsule-divider {
    width: 1px; height: 16px;
    background: rgba(196,200,216,0.2);
  }
  .capsule svg { width: 16px; height: 16px; stroke: var(--star-silver); fill: none; stroke-width: 1.5; }

  /* 页面栈容器 */
  .page-stack {
    position: absolute; inset: 0;
    top: 0; bottom: 0;
    overflow: hidden;
  }
  .page {
    position: absolute; inset: 0;
    background: var(--midnight-deep);
    display: flex; flex-direction: column;
    overflow: hidden;
    transition: transform .35s cubic-bezier(.4,0,.2,1);
    will-change: transform;
  }
  .page.page-active { transform: translateX(0); z-index: 10; }
  .page.page-below { transform: translateX(-30%); z-index: 5; }
  .page.page-hidden { transform: translateX(100%); z-index: 1; pointer-events: none; }

  .page-scroll {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    position: relative;
  }
  .page-scroll::-webkit-scrollbar { display: none; }

  /* 下拉刷新 */
  .pull-refresh {
    position: absolute; top: -50px; left: 0; right: 0;
    height: 50px;
    display: flex; align-items: center; justify-content: center;
    color: var(--star-silver-dim); font-size: 12px;
    gap: 8px;
    transition: top .3s ease;
  }
  .pull-refresh.show { top: 0; }
  .pull-refresh-icon {
    width: 16px; height: 16px; border: 2px solid rgba(196,200,216,0.3);
    border-top-color: var(--amber-gold); border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 底部 TabBar */
  .tab-bar {
    height: 56px;
    background: rgba(15,16,38,0.95);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(196,200,216,0.1);
    display: flex; align-items: stretch;
    padding-bottom: 8px;
    position: relative; z-index: 50;
  }
  .tab-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3px;
    color: var(--star-silver-dim);
    font-size: 10px;
    cursor: pointer;
    transition: color .2s ease, transform .2s ease;
    position: relative;
  }
  .tab-item:hover { color: var(--star-silver); }
  .tab-item.active { color: var(--amber-gold); }
  .tab-item.active .tab-icon { transform: translateY(-2px) scale(1.1); }
  .tab-item:active { transform: scale(0.92); }
  .tab-icon {
    width: 24px; height: 24px;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .tab-icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 1.5; }

  /* ========= 通用组件 ========= */
  .glass-card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  /* ========= 首页 - 今夜星空 ========= */
  .star-canvas-wrap {
    position: relative; width: 100%; height: 380px;
    overflow: hidden;
  }
  .star-canvas-wrap canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
  }
  .home-hero-info {
    position: absolute; bottom: 16px; left: 16px; right: 16px;
    display: flex; justify-content: space-between; align-items: flex-end;
    z-index: 2;
  }
  .home-location {
    display: flex; flex-direction: column; gap: 4px;
  }
  .home-location .city {
    font-size: 28px; font-weight: 700; color: #fff;
    letter-spacing: 1px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.5);
  }
  .home-location .quality {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--star-silver);
  }
  .quality-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--amber-gold);
    box-shadow: 0 0 8px var(--amber-gold);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.2); }
  }

  .moon-card {
    width: 100px; height: 100px;
    border-radius: 16px;
    background: rgba(26,27,58,0.7);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(10px);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 4px;
  }
  .moon-icon {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, #E8E4D0 0%, #C4C0A8 100%);
    position: relative;
    box-shadow: 0 0 20px rgba(232,228,208,0.4);
  }
  .moon-icon::after {
    content: ''; position: absolute; right: -4px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(26,27,58,0.85);
  }
  .moon-phase { font-size: 11px; color: var(--star-silver); }

  /* 今日观测指数卡片组 */
  .home-section {
    padding: 20px 16px;
  }
  .section-title {
    font-size: 18px; font-weight: 600; color: #fff;
    margin-bottom: 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .section-title .more {
    font-size: 12px; color: var(--star-silver-dim); font-weight: 400;
    cursor: pointer;
  }

  .index-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  }
  .index-card {
    padding: 14px 10px;
    border-radius: 12px;
    background: rgba(45,47,92,0.4);
    border: 1px solid var(--glass-border);
    text-align: center;
    transition: transform .2s ease, background .2s ease;
    cursor: pointer;
  }
  .index-card:hover { transform: translateY(-2px); background: rgba(45,47,92,0.7); }
  .index-card:active { transform: scale(0.97); }
  .index-card .val {
    font-size: 22px; font-weight: 700; color: var(--amber-gold);
    line-height: 1.2;
  }
  .index-card .unit { font-size: 11px; color: var(--star-silver-dim); margin-left: 2px; }
  .index-card .label {
    font-size: 11px; color: var(--star-silver); margin-top: 4px;
  }

  /* 推荐观测天体 */
  .celestial-list {
    display: flex; gap: 12px; overflow-x: auto;
    padding: 4px 16px 12px;
    margin: 0 -16px;
    scroll-snap-type: x mandatory;
  }
  .celestial-list::-webkit-scrollbar { display: none; }
  .celestial-card {
    flex-shrink: 0; width: 140px;
    border-radius: 14px;
    overflow: hidden;
    background: rgba(45,47,92,0.5);
    border: 1px solid var(--glass-border);
    scroll-snap-align: start;
    cursor: pointer;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .celestial-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .celestial-card:active { transform: scale(0.97); }
  .celestial-img {
    height: 100px;
    position: relative;
    background: radial-gradient(circle at 30% 30%, var(--nebula-rose) 0%, var(--midnight-3) 60%);
    overflow: hidden;
  }
  .celestial-img.saturn {
    background: radial-gradient(circle at 40% 50%, var(--amber-gold) 0%, var(--midnight-3) 70%);
  }
  .celestial-img.leo {
    background: radial-gradient(circle at 60% 40%, #8B7ED8 0%, var(--midnight-3) 70%);
  }
  .celestial-img.meteor {
    background: linear-gradient(135deg, #1A1B3A 0%, #2D2F5C 50%, #E8919A 100%);
  }
  .celestial-body {
    position: absolute; width: 48px; height: 48px; border-radius: 50%;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: radial-gradient(circle at 35% 35%, #fff, var(--amber-gold) 60%, var(--amber-gold-deep));
    box-shadow: 0 0 30px rgba(240,184,96,0.5);
  }
  .celestial-body.saturn-ring {
    width: 64px; height: 20px;
    border: 3px solid rgba(240,184,96,0.6);
    border-radius: 50%;
    background: transparent;
    top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-20deg);
    box-shadow: none;
  }
  .celestial-info {
    padding: 10px 12px;
  }
  .celestial-name {
    font-size: 14px; font-weight: 600; color: #fff;
    margin-bottom: 2px;
  }
  .celestial-desc {
    font-size: 11px; color: var(--star-silver-dim);
  }

  /* 观测小贴士 */
  .tip-card {
    margin: 0 16px 20px;
    padding: 14px 16px;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(232,145,154,0.15) 0%, rgba(26,27,58,0.6) 100%);
    border: 1px solid rgba(232,145,154,0.25);
    display: flex; gap: 12px; align-items: flex-start;
    cursor: pointer;
    transition: transform .2s ease;
  }
  .tip-card:active { transform: scale(0.98); }
  .tip-icon {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(232,145,154,0.2);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .tip-icon svg { width: 18px; height: 18px; stroke: var(--nebula-rose); fill: none; stroke-width: 1.5; }
  .tip-text { flex: 1; }
  .tip-title { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 3px; }
  .tip-desc { font-size: 12px; color: var(--star-silver-dim); line-height: 1.5; }

  /* ========= 观测点地图页 ========= */
  .map-page { background: var(--midnight-deep); }
  .map-container {
    position: relative; height: 300px;
    background: linear-gradient(180deg, #1A1B3A 0%, #0F1026 100%);
    overflow: hidden;
  }
  /* 光污染地图（SVG） */
  .light-pollution-svg {
    position: absolute; inset: 0; width: 100%; height: 100%;
  }
  .map-marker {
    position: absolute;
    transform: translate(-50%, -100%);
    cursor: pointer;
    transition: transform .2s ease;
  }
  .map-marker:hover { transform: translate(-50%, -100%) scale(1.15); }
  .map-marker:active { transform: translate(-50%, -100%) scale(0.95); }
  .map-marker .pin {
    width: 32px; height: 32px; border-radius: 50% 50% 50% 0;
    background: var(--amber-gold);
    transform: rotate(-45deg);
    box-shadow: 0 4px 12px rgba(240,184,96,0.5);
    display: flex; align-items: center; justify-content: center;
  }
  .map-marker .pin-inner {
    width: 12px; height: 12px; border-radius: 50%;
    background: #fff;
    transform: rotate(45deg);
  }
  .map-marker .pin-label {
    position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
    white-space: nowrap;
    font-size: 10px; color: var(--star-silver);
    background: rgba(26,27,58,0.8);
    padding: 2px 6px; border-radius: 4px;
    backdrop-filter: blur(4px);
  }

  /* 吸顶筛选 Tab */
  .sticky-tabs {
    position: sticky; top: 0; z-index: 30;
    background: rgba(15,16,38,0.95);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--glass-border);
    display: flex; padding: 0 12px;
    gap: 4px;
  }
  .sticky-tab {
    padding: 14px 12px;
    font-size: 14px; color: var(--star-silver-dim);
    position: relative;
    cursor: pointer;
    transition: color .2s ease;
    white-space: nowrap;
  }
  .sticky-tab:hover { color: var(--star-silver); }
  .sticky-tab.active {
    color: var(--amber-gold); font-weight: 600;
  }
  .sticky-tab.active::after {
    content: ''; position: absolute; bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 20px; height: 3px;
    background: var(--amber-gold);
    border-radius: 2px;
    animation: tabSlide .3s ease;
  }
  @keyframes tabSlide {
    from { width: 0; }
    to { width: 20px; }
  }

  /* 观测点列表 */
  .spot-list { padding: 12px 16px; }
  .spot-item {
    display: flex; gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--glass-border);
    position: relative;
    overflow: hidden;
    transition: transform .3s ease;
    cursor: pointer;
  }
  .spot-item:last-child { border-bottom: none; }
  .spot-item:active { background: rgba(255,255,255,0.03); }
  .spot-thumb {
    width: 72px; height: 72px; border-radius: 10px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .spot-thumb.t1 { background: linear-gradient(135deg, #2D2F5C, #1A1B3A); }
  .spot-thumb.t2 { background: linear-gradient(135deg, #3D2F5C, #1A1B3A); }
  .spot-thumb.t3 { background: linear-gradient(135deg, #2F3D5C, #1A1B3A); }
  .spot-thumb.t4 { background: linear-gradient(135deg, #5C3D2F, #1A1B3A); }
  .spot-thumb::after {
    content: '★'; position: absolute; right: 6px; top: 4px;
    color: var(--amber-gold); font-size: 14px;
    text-shadow: 0 0 4px rgba(240,184,96,0.8);
  }

  .spot-info { flex: 1; min-width: 0; }
  .spot-name {
    font-size: 15px; font-weight: 600; color: #fff;
    margin-bottom: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .spot-tag {
    font-size: 10px; padding: 1px 6px;
    border-radius: 4px;
    background: rgba(240,184,96,0.15);
    color: var(--amber-gold);
    font-weight: 400;
  }
  .spot-meta {
    font-size: 12px; color: var(--star-silver-dim);
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 4px;
  }
  .spot-level {
    display: flex; align-items: center; gap: 4px;
    font-size: 11px;
  }
  .level-bar {
    width: 60px; height: 6px; border-radius: 3px;
    background: rgba(196,200,216,0.15);
    overflow: hidden;
  }
  .level-bar-fill {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--nebula-rose), var(--amber-gold));
  }

  /* 左滑操作 */
  .swipe-actions {
    position: absolute; right: 0; top: 0; bottom: 0;
    display: flex; align-items: center;
    transform: translateX(100%);
    transition: transform .3s ease;
  }
  .spot-item.swiped { transform: translateX(-80px); }
  .spot-item.swiped .swipe-actions { transform: translateX(0); }
  .swipe-btn {
    width: 40px; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #fff;
    cursor: pointer;
  }
  .swipe-btn.fav { background: var(--amber-gold); }
  .swipe-btn.share { background: var(--nebula-rose); }

  /* ========= 观测日志页 - 时间线 ========= */
  .log-page { background: var(--midnight-deep); }
  .log-header {
    padding: 20px 16px;
    background: linear-gradient(180deg, rgba(45,47,92,0.5) 0%, transparent 100%);
  }
  .log-stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 12px; margin-top: 16px;
  }
  .log-stat {
    text-align: center;
    padding: 12px 0;
    border-radius: 12px;
    background: rgba(26,27,58,0.6);
    border: 1px solid var(--glass-border);
  }
  .log-stat .num {
    font-size: 22px; font-weight: 700;
    background: linear-gradient(135deg, var(--amber-gold), var(--nebula-rose));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .log-stat .lbl {
    font-size: 11px; color: var(--star-silver-dim); margin-top: 2px;
  }

  .timeline {
    padding: 0 16px 20px;
    position: relative;
  }
  .timeline::before {
    content: ''; position: absolute;
    left: 30px; top: 10px; bottom: 20px;
    width: 2px;
    background: linear-gradient(180deg, var(--amber-gold) 0%, var(--midnight-3) 100%);
  }
  .timeline-item {
    display: flex; gap: 16px;
    padding: 16px 0;
    position: relative;
    animation: fadeInUp .5s ease both;
  }
  .timeline-item:nth-child(1) { animation-delay: .05s; }

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ============================================================
// 全局状态与工具
// ============================================================
const PAGES = ['home', 'map', 'log', 'profile', 'detail', 'spec', 'api', 'sheetdemo'];
const TAB_PAGES = ['home', 'map', 'log', 'profile'];

function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}

// 背景星点
function initBgStars() {
  const container = document.getElementById('bgStars');
  if (!container || container.children.length) return;
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.opacity = (0.2 + Math.random() * 0.5).toFixed(2);
    s.style.width = s.style.height = (1 + Math.random() * 2) + 'px';
    s.style.animation = `pulse ${2 + Math.random() * 3}s ease-in-out ${Math.random() * 2}s infinite`;
    container.appendChild(s);
  }
}

// 自定义光标
function initCustomCursor() {
  const cursor = document.getElementById('customCursor');
  if (!cursor) return;

  let targetX = window.innerWidth / 2;
  let targetY = window.innerHeight / 2;
  let curX = targetX, curY = targetY;
  let rafId = null;
  let visible = true;

  function animate() {
    if (!visible) return;
    curX += (targetX - curX) * 0.15;
    curY += (targetY - curY) * 0.15;
    cursor.style.left = curX + 'px';
    cursor.style.top = curY + 'px';
    rafId = requestAnimationFrame(animate);
  }

  function onMove(e) {
    targetX = e.clientX;
    targetY = e.clientY;
    if (!rafId) rafId = requestAnimationFrame(animate);
  }

  function onEnter() {
    cursor.classList.add('hover');
  }
  function onLeave() {
    cursor.classList.remove('hover');
  }

  function onVisibility() {
    visible = !document.hidden;
    if (visible && !rafId) rafId = requestAnimationFrame(animate);
  }

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseover', (e) => {
    if (e.target.closest('button, .tab-item, .celestial-card, .spot-item, .timeline-card, .badge-item, .menu-item, .action-icon-btn, .action-primary-btn, .demo-btn, .api-endpoint, .demo-trigger-btn, .sticky-tab, .index-card, .tip-card, .sheet-option, .sheet-cancel, .color-card, .detail-back, .capsule')) {
      onEnter();
    }
  });
  document.addEventListener('mouseout', (e) => {
    if (e.target.closest('button, .tab-item, .celestial-card, .spot-item, .timeline-card, .badge-item, .menu-item, .action-icon-btn, .action-primary-btn, .demo-btn, .api-endpoint, .demo-trigger-btn, .sticky-tab, .index-card, .tip-card, .sheet-option, .sheet-cancel, .color-card, .detail-back, .capsule')) {
      onLeave();
    }
  });
  document.addEventListener('visibilitychange', onVisibility);

  // 清理
  window._cursorCleanup = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('visibilitychange', onVisibility);
    if (rafId) cancelAnimationFrame(rafId);
  };
}

// ============================================================
// 首页星空 canvas
// ============================================================
function StarFieldCanvas() {
  const canvasRef = useRef(null);
  const rafRef = useRef(null);
  const starsRef = useRef([]);
  const shootingRef = useRef([]);
  const visibleRef = useRef(true);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      initStars(rect.width, rect.height);
    }

    function initStars(w, h) {
      const stars = [];
      const count = 120;
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.5 + 0.3,
          baseAlpha: Math.random() * 0.6 + 0.3,
          phase: Math.random() * Math.PI * 2,
          speed: 0.01 + Math.random() * 0.02,
          hue: Math.random() < 0.7 ? 220 : (Math.random() < 0.5 ? 45 : 350),
        });
      }
      starsRef.current = stars;
    }

    function spawnShootingStar(w, h) {
      if (Math.random() < 0.015 && shootingRef.current.length < 2) {
        shootingRef.current.push({
          x: Math.random() * w * 0.6 + w * 0.2,
          y: -10,
          vx: 2 + Math.random() * 3,
          vy: 4 + Math.random() * 4,
          len: 40 + Math.random() * 30,
          alpha: 1,
        });
      }
    }

    function draw() {
      if (!visibleRef.current) return;
      const rect = canvas.getBoundingClientRect();
      const w = rect.width, h = rect.height;
      ctx.clearRect(0, 0, w, h);

      // 星星
      starsRef.current.forEach(s => {
        s.phase += s.speed;
        const alpha = s.baseAlpha + Math.sin(s.phase) * 0.3;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        const color = s.hue === 45 ? `rgba(240,184,96,${alpha})`
                    : s.hue === 350 ? `rgba(232,145,154,${alpha})`
                    : `rgba(196,200,216,${alpha})`;
        ctx.fillStyle = color;
        ctx.fill();
      });

      // 流星
      spawnShootingStar(w, h);
      shootingRef.current = shootingRef.current.filter(m => {
        m.x += m.vx;
        m.y += m.vy;
        m.alpha -= 0.015;
        if (m.alpha <= 0 || m.y > h + 50) return false;

        const grad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 8, m.y - m.vy * 8);
        grad.addColorStop(0, `rgba(255,255,255,${m.alpha})`);
        grad.addColorStop(1, `rgba(240,184,96,0)`);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x - m.vx * 8, m.y - m.vy * 8);
        ctx.stroke();

        // 头部光点
        ctx.beginPath();
        ctx.arc(m.x, m.y, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${m.alpha})`;
        ctx.fill();
        return true;
      });

      rafRef.current = requestAnimationFrame(draw);
    }

    resize();
    draw();

    function onVisibility() {
      visibleRef.current = !document.hidden;
      if (visibleRef.current && !rafRef.current) {
        rafRef.current = requestAnimationFrame(draw);
      }
    }

    window.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', onVisibility);

    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      window.removeEventListener('resize', resize);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, []);

  return (
    <canvas ref={canvasRef} style={{ width: '100%', height: '100%' }} />
  );
}

            <div className={`sheet-option-icon ${opt.color || ''}`}>
              <svg viewBox="0 0 24 24">
                {opt.icon === 'star' && <path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8 5.8 21.3l2.4-7.4L2 9.4h7.6z"/>}
                {opt.icon === 'share' && <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/>}
                {opt.icon === 'bookmark' && <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2v16z"/>}
                {opt.icon === 'camera' && <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/>}
                {opt.icon === 'nav' && <polygon points="3 11 22 2 13 21 11 13 3 11"/>}
                {opt.icon === 'report' && <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22V15"/>}
                {opt.icon === 'copy' && <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>}
              </svg>
            </div>
            <span>{opt.label}</span>
          </div>
        ))}
        <div className="sheet-cancel" onClick={onClose}>取消</div>
      </div>
    </>
  );
}

// ============================================================
// 主 App 组件 - 页面栈管理
// ============================================================
function App() {
  const [pageStack, setPageStack] = useState(['home']); // 页面栈，最后一个是当前页
  const [tab, setTab] = useState('home');
  const [sheetVisible, setSheetVisible] = useState(false);
  const [sheetOptions, setSheetOptions] = useState([]);
  const [sheetTitle, setSheetTitle] = useState('');

  const currentPage = pageStack[pageStack.length - 1];
  const isTabPage = TAB_PAGES.includes(currentPage);

  const pushPage = (page) => {
    if (pageStack.includes(page)) return;
    setPageStack([...pageStack, page]);
  };

  const popPage = () => {
    if (pageStack.length <= 1) return;
    setPageStack(pageStack.slice(0, -1));
  };

  const switchTab = (t) => {
    setTab(t);
    setPageStack([t]);
  };

  const openSheet = (opts, title) => {
    setSheetOptions(opts);
    setSheetTitle(title || '');
    setSheetVisible(true);
  };

  // 默认的分享 ActionSheet
  const defaultOptions = [
    { label: '发送给微信好友', icon: 'share', color: '', action: () => showToast('已发送给好友') },
    { label: '分享到朋友圈', icon: 'star', color: 'rose', action: () => showToast('已分享到朋友圈') },
    { label: '收藏', icon: 'bookmark', color: '', action: () => showToast('已收藏') },
    { label: '保存到相册', icon: 'camera', color: 'rose', action: () => showToast('已保存到相册') },
    { label: '复制链接', icon: 'copy', color: 'silver', action: () => showToast('链接已复制') },
    { label: '投诉', icon: 'report', color: 'silver', action: () => showToast('投诉功能暂未开放') },
  ];

  // Tab 切换时，显示/隐藏底部 TabBar
  useEffect(() => {
    const tabBar = document.getElementById('tabBar');
    if (!tabBar) return;
    tabBar.style.display = isTabPage ? 'flex' : 'none';
  }, [currentPage, isTabPage]);

  // 初始化
  useEffect(() => {
    initBgStars();
    initCustomCursor();

    return () => {
      if (window._cursorCleanup) window._cursorCleanup();
    };
  }, []);

  // TabBar 点击事件绑定
  useEffect(() => {
    const tabBar = document.getElementById('tabBar');
    if (!tabBar) return;
    const items = tabBar.querySelectorAll('.tab-item');
    items.forEach(item => {
      const handler = () => {
        const t = item.dataset.tab;
        switchTab(t);
        items.forEach(i => i.classList.toggle('active', i === item));
      };
      item.addEventListener('click', handler);
      return () => item.removeEventListener('click', handler);
    });
  }, []);

  const openDetail = () => pushPage('detail');
  const openSpec = () => pushPage('spec');
  const openApi = () => pushPage('api');
  const openSheetDemo = () => pushPage('sheetdemo');

  // 渲染所有页面（页面栈方式）
  const renderPages = () => {
    const allPages = ['home', 'map', 'log', 'profile', 'detail', 'spec', 'api', 'sheetdemo'];
    return allPages.map(p => {
      const idx = pageStack.indexOf(p);
      let className = 'page page-hidden';
      if (p === currentPage) className = 'page page-active';
      else if (idx !== -1 && idx === pageStack.length - 2) className = 'page page-below';
      else if (idx !== -1) className = 'page page-below';

      return (
        <div key={p} className={className}>
          {p === 'home' && <HomePage onOpenDetail={openDetail} onOpenSpec={openSpec} onOpenApi={openApi} onOpenSheet={() => openSheet(defaultOptions, '分享到')} />}
          {p === 'map' && <MapPage />}
          {p === 'log' && <LogPage onOpenDetail={openDetail} />}
          {p === 'profile' && <ProfilePage onOpenSpec={openSpec} onOpenApi={openApi} onOpenSheet={openSheetDemo} />}
          {p === 'detail' && <DetailPage onBack={popPage} />}
          {p === 'spec' && <SpecPage onBack={popPage} />}
          {p === 'api' && <ApiPage onBack={popPage} />}
          {p === 'sheetdemo' && <SheetDemoPage onBack={popPage} onOpenSheet={() => openSheet(defaultOptions, '分享到')} />}
        </div>
      );
    });
  };

  return (
    <>
      <div className="page-stack" style={{position: 'absolute', inset: 0, overflow: 'hidden'}}>
        {renderPages()}
      </div>
      <ActionSheet
        visible={sheetVisible}
        onClose={() => setSheetVisible(false)}
        options={sheetOptions}
        title={sheetTitle}
      />
    </>
  );
}

// 挂载
const root = ReactDOM.createRoot(document.getElementById('pageStack'));
root.render(<App />);

// 宣告可升级
function announceUpgrade() {
  window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
}
announceUpgrade();
if (document.readyState !== 'complete') window.addEventListener('load', announceUpgrade, { once: true });
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>城市漫游手册 · V2 手机小程序</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" />
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  /* ============ TOKENS ============ */
  :root {
    --brick: #A0522D;
    --brick-deep: #7A3E21;
    --brick-light: #C4774F;
    --olive: #6B8E23;
    --olive-deep: #4F6B18;
    --olive-light: #8FB03A;
    --warmgray: #D9D2C5;
    --warmgray-deep: #B8AFA0;
    --warmgray-light: #EDE8DE;
    --cream: #F5DEB3;
    --cream-deep: #E5C68A;
    --cream-light: #FFF3D9;
    --charcoal: #2C2C2C;
    --charcoal-light: #4A4A4A;
    --ink: #1a1a1a;
    --paper: #FAF6EE;
    --paper-deep: #F0E9D9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #1e1e1e 0%, #2a2620 50%, #1e1e1e 100%);
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--charcoal);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .stage {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .stage-bg-text {
    position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
    color: rgba(217,210,197,0.15); font-size: 11px; letter-spacing: 4px;
    font-family: 'Noto Serif SC', serif; pointer-events: none;
  }

  /* ============ CUSTOM CURSOR ============ */
  .cursor {
    position: fixed; top: 0; left: 0;
    width: 28px; height: 28px; border-radius: 50%;
    pointer-events: none; z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width .25s cubic-bezier(.34,1.56,.64,1), height .25s cubic-bezier(.34,1.56,.64,1),
                border-color .2s, background .2s;
    border: 2px solid #fff;
    mix-blend-mode: difference;
    box-shadow: 0 0 12px rgba(255,255,255,0.4), 0 0 24px rgba(160,82,45,0.3);
  }
  .cursor-dot {
    position: absolute; top: 50%; left: 50%;
    width: 6px; height: 6px; border-radius: 50%;
    background: #A0522D;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px rgba(160,82,45,0.8);
  }
  .cursor.hover {
    width: 44px; height: 44px;
    border-color: #F5DEB3;
    box-shadow: 0 0 16px rgba(245,222,179,0.6), 0 0 32px rgba(160,82,45,0.4);
  }
  .cursor.hover .cursor-dot {
    width: 8px; height: 8px;
    background: #6B8E23;
    box-shadow: 0 0 10px rgba(107,142,35,0.9);
  }
  .cursor.clicking { width: 20px; height: 20px; }
  .cursor-ripple {
    position: fixed; width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid #F5DEB3; pointer-events: none; z-index: 9998;
    transform: translate(-50%,-50%) scale(1);
    animation: cursorRipple .6s ease-out forwards;
  }
  @keyframes cursorRipple {
    0% { opacity: .8; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(3); }
  }
  @media (hover: none) { .cursor, .cursor-ripple { display: none; } }

  /* ============ PHONE FRAME ============ */
  .phone-wrap {
    position: relative;
    width: 390px;
    height: 780px;
    filter: drop-shadow(0 30px 60px rgba(0,0,0,0.6));
  }
  .phone-frame {
    position: absolute; inset: 0;
    border-radius: 52px;
    background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
    padding: 10px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1),
                inset 0 -1px 0 rgba(0,0,0,0.3);
  }
  .phone-screen {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 44px;
    overflow: hidden;
    background: var(--paper);
  }
  .phone-notch {
    position: absolute; top: 10px; left: 50%;
    transform: translateX(-50%);
    width: 110px; height: 28px;
    background: #000;
    border-radius: 20px;
    z-index: 100;
  }
  .status-bar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 44px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px;
    font-size: 14px; font-weight: 600;
    color: #fff;
    z-index: 99;
    pointer-events: none;
  }
  .status-bar.dark { color: var(--charcoal); }
  .status-right { display: flex; align-items: center; gap: 5px; }
  .status-bar .signal, .status-bar .wifi, .status-bar .battery {
    display: inline-block;
  }
  .battery {
    width: 24px; height: 11px;
    border: 1px solid currentColor;
    border-radius: 3px;
    position: relative;
    opacity: .9;
  }
  .battery::after {
    content: ''; position: absolute; top: 2px; right: -3px;
    width: 2px; height: 5px;
    background: currentColor;
    border-radius: 0 1px 1px 0;
  }
  .battery-fill {
    position: absolute; top: 1px; left: 1px; bottom: 1px;
    width: 80%;
    background: currentColor;
    border-radius: 1px;
  }

  /* ============ WECHAT MINI PROGRAM CAPSULE ============ */
  .wx-capsule {
    position: absolute; top: 52px; right: 12px;
    width: 87px; height: 32px;
    background: rgba(255,255,255,0.4);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 20px;
    border: 1px solid rgba(0,0,0,0.05);
    display: flex; align-items: center; justify-content: center;
    z-index: 98;
    transition: background .3s;
  }
  .wx-capsule.dark {
    background: rgba(44,44,44,0.4);
    border-color: rgba(255,255,255,0.1);
  }
  .wx-capsule-btns {
    display: flex; align-items: center; gap: 0;
  }
  .wx-capsule-btn {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    color: var(--charcoal);
  }
  .wx-capsule.dark .wx-capsule-btn { color: #fff; }
  .wx-capsule-divider {
    width: 1px; height: 14px;
    background: rgba(0,0,0,0.15);
  }
  .wx-capsule.dark .wx-capsule-divider { background: rgba(255,255,255,0.25); }

  /* ============ PAGE CONTAINER ============ */
  .page-container {
    position: absolute; inset: 0;
    overflow: hidden;
  }
  .page {
    position: absolute; inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    background: var(--paper);
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .page::-webkit-scrollbar { display: none; }

  /* Page transitions */
  .page-entering-right {
    animation: slideInRight .35s cubic-bezier(.4,0,.2,1) both;
    z-index: 20;
  }
  .page-leaving-left {
    animation: slideOutLeft .35s cubic-bezier(.4,0,.2,1) both;
    z-index: 10;
  }
  .page-entering-left {
    animation: slideInLeft .35s cubic-bezier(.4,0,.2,1) both;
    z-index: 10;
  }
  .page-leaving-right {
    animation: slideOutRight .35s cubic-bezier(.4,0,.2,1) both;
    z-index: 20;
  }
  @keyframes slideInRight {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }
  @keyframes slideOutLeft {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(-30%); opacity: 0.7; }
  }
  @keyframes slideInLeft {
    from { transform: translateX(-30%); opacity: 0.7; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes slideOutRight {
    from { transform: translateX(0); }
    to { transform: translateX(100%); }
  }

  /* ============ TAB BAR ============ */
  .tabbar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 78px;
    background: rgba(250,246,238,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(0,0,0,0.06);
    display: flex; align-items: flex-start;
    padding: 8px 0 0 0;
    z-index: 50;
    padding-bottom: env(safe-area-inset-bottom, 20px);
  }
  .tabbar-item {
    flex: 1;
    display: flex; flex-direction: column; align-items: center;
    gap: 3px;
    padding-top: 4px;
    cursor: pointer;
    position: relative;
  }
  .tabbar-icon {
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    color: var(--warmgray-deep);
    transition: transform .25s cubic-bezier(.34,1.56,.64,1), color .2s;
  }
  .tabbar-item.active .tabbar-icon {
    color: var(--brick);
    transform: translateY(-2px) scale(1.1);
  }
  .tabbar-label {
    font-size: 10px;
    color: var(--warmgray-deep);
    transition: color .2s;
  }
  .tabbar-item.active .tabbar-label {
    color: var(--brick);
    font-weight: 500;
  }
  .tabbar-dot {
    position: absolute; bottom: -4px; left: 50%;
    transform: translateX(-50%) scale(0);
    width: 4px; height: 4px;
    background: var(--brick);
    border-radius: 50%;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .tabbar-item.active .tabbar-dot {
    transform: translateX(-50%) scale(1);
  }

  /* ============ PULL TO REFRESH ============ */
  .ptr-container {
    position: relative;
    min-height: 100%;
  }
  .ptr-indicator {
    position: absolute; top: -50px; left: 50%;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center;
    gap: 4px;
    color: var(--warmgray-deep);
    font-size: 11px;
    transition: top .3s cubic-bezier(.34,1.56,.64,1);
  }
  .ptr-indicator.show { top: 56px; }
  .ptr-spinner {
    width: 24px; height: 24px;
    border: 2px solid var(--warmgray);
    border-top-color: var(--brick);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============ HOME PAGE ============ */
  .home-header {
    position: relative;
    padding: 58px 20px 16px;
    background: linear-gradient(180deg, var(--brick-deep) 0%, var(--brick) 60%, var(--brick-light) 100%);
    color: #fff;
    overflow: hidden;
  }
  .home-header::before {
    content: '';
    position: absolute; top: -40px; right: -40px;
    width: 180px; height: 180px;
    background: radial-gradient(circle, rgba(245,222,179,0.2) 0%, transparent 70%);
    border-radius: 50%;
  }
  .home-top-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .city-select {
    display: flex; align-items: center; gap: 4px;
    font-size: 17px; font-weight: 600;
    cursor: pointer;
  }
  .home-search {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 9px 14px;
    margin-bottom: 16px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    cursor: pointer;
  }
  .home-search-input {
    flex: 1;
    font-size: 13px;
    color: rgba(255,255,255,0.85);
  }
  .home-greeting {
    font-family: 'Noto Serif SC', serif;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 4px;
  }
  .home-subtitle {
    font-size: 12px;
    opacity: 0.85;
    margin-bottom: 18px;
  }
  .home-category-row {
    display: flex; gap: 14px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 4px;
  }
  .home-category-row::-webkit-scrollbar { display: none; }
  .home-category-item {
    display: flex; flex-direction: column; align-items: center;
    gap: 6px;
    min-width: 56px;
    cursor: pointer;
    transition: transform .2s;
  }
  .home-category-item:active { transform: scale(0.92); }
  .home-category-icon {
    width: 48px; height: 48px;
    border-radius: 14px;
    background: rgba(255,255,255,0.25);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    backdrop-filter: blur(10px);
  }
  .home-category-name {
    font-size: 11px;
    color: rgba(255,255,255,0.9);
  }

  .home-featured {
    padding: 20px 20px 0;
  }
  .section-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 14px;
  }
  .section-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--charcoal);
    display: flex; align-items: center; gap: 8px;
  }
  .section-title-bar {
    width: 3px; height: 18px;
    background: var(--brick);
    border-radius: 2px;
  }
  .section-more {
    font-size: 12px;
    color: var(--warmgray-deep);
    cursor: pointer;
    display: flex; align-items: center; gap: 2px;
  }

  .route-card {
    background: #fff;
    border-radius: 18px;
    overflow: hidden;
    margin-bottom: 16px;
    box-shadow: 0 4px 20px rgba(160,82,45,0.08);
    cursor: pointer;
    transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s;
    position: relative;
  }
  .route-card:active {
    transform: scale(0.97);
    box-shadow: 0 2px 10px rgba(160,82,45,0.06);
  }
  .route-card-img {
    width: 100%; height: 170px;
    object-fit: cover;
    display: block;
  }
  .route-card-tag {
    position: absolute; top: 12px; left: 12px;
    background: var(--olive);
    color: #fff;
    font-size: 10px;
    padding: 3px 10px;
    border-radius: 10px;
    font-weight: 500;
  }
  .route-card-fav {
    position: absolute; top: 12px; right: 12px;
    width: 32px; height: 32px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--brick);
  }
  .route-card-body {
    padding: 14px 16px 16px;
  }
  .route-card-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--charcoal);
    margin-bottom: 6px;
    font-family: 'Noto Serif SC', serif;
  }
  .route-card-desc {
    font-size: 12px;
    color: var(--warmgray-deep);
    line-height: 1.5;
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .route-card-meta {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px;
    color: var(--warmgray-deep);
  }
  .route-card-meta-left {
    display: flex; align-items: center; gap: 10px;
  }
  .route-card-meta-item {
    display: flex; align-items: center; gap: 3px;
  }
  .route-card-distance {
    color: var(--olive);
    font-weight: 500;
  }

  /* Home entrance animation */
  .entrance-fade-up {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp .6s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
  .delay-1 { animation-delay: .05s; }
  .delay-2 { animation-delay: .12s; }
  .delay-3 { animation-delay: .2s; }
  .delay-4 { animation-delay: .3s; }
  .delay-5 { animation-delay: .4s; }
  .delay-6 { animation-delay: .5s; }

  /* ============ ROUTE DETAIL ============ */
  .detail-hero {
    position: relative;
    height: 320px;
    overflow: hidden;
  }
  .detail-hero-img {
    width: 100%; height: 130%;
    object-fit: cover;
    position: absolute; top: 0; left: 0;
    will-change: transform;
  }
  .detail-hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.7) 100%);
  }
  .detail-back-btn {
    position: absolute; top: 56px; left: 16px;
    width: 36px; height: 36px;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    z-index: 10;
    cursor: pointer;
  }
  .detail-hero-content {
    position: absolute; bottom: 20px; left: 20px; right: 20px;
    color: #fff;
    z-index: 10;
  }
  .detail-hero-tag {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(245,222,179,0.9);
    color: var(--charcoal);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 10px;
    margin-bottom: 10px;
    font-weight: 500;
  }
  .detail-hero-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 26px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 8px;
  }
  .detail-hero-meta {
    display: flex; align-items: center; gap: 14px;
    font-size: 12px;
    opacity: 0.9;
  }

  .detail-body {
    position: relative;
    background: var(--paper);
    border-radius: 24px 24px 0 0;
    margin-top: -20px;
    padding: 24px 20px 100px;
    min-height: 400px;
    z-index: 5;
  }
  .detail-intro {
    font-size: 14px;
    line-height: 1.8;
    color: var(--charcoal-light);
    margin-bottom: 24px;
  }
  .detail-stats-row {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }
  .detail-stat {
    background: #fff;
    border-radius: 14px;
    padding: 14px 10px;
    text-align: center;
    box-shadow: 0 2px 12px rgba(160,82,45,0.06);
  }
  .detail-stat-num {
    font-size: 20px;
    font-weight: 700;
    color: var(--brick);
    font-family: 'Noto Serif SC', serif;
  }
  .detail-stat-label {
    font-size: 11px;
    color: var(--warmgray-deep);
    margin-top: 2px;
  }

  .timeline {
    position: relative;
    padding-left: 24px;
  }
  .timeline::before {
    content: '';
    position: absolute; top: 8px; bottom: 8px; left: 6px;
    width: 2px;
    background: var(--warmgray);
    border-radius: 1px;
  }
  .timeline-item {
    position: relative;
    margin-bottom: 20px;
    cursor: pointer;
    transition: transform .2s;
  }
  .timeline-item:active { transform: translateX(2px); }
  .timeline-dot {
    position: absolute; top: 6px; left: -24px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--paper);
    border: 3px solid var(--olive);
    z-index: 1;
  }
  .timeline-item.visited .timeline-dot {
    background: var(--olive);
  }
  .timeline-time {
    font-size: 11px;
    color: var(--brick);
    font-weight: 500;
    margin-bottom: 4px;
  }
  .timeline-place {
    font-size: 14px;
    font-weight: 600;
    color: var(--charcoal);
    margin-bottom: 4px;
  }
  .timeline-desc {
    font-size: 12px;
    color: var(--warmgray-deep);
    line-height: 1.5;
  }

  .detail-bottom-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: #fff;
    padding: 12px 20px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 16px));
    display: flex; align-items: center; gap: 12px;
    border-top: 1px solid rgba(0,0,0,0.05);
    box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
  }
  .bottom-icon-btn {
    width: 44px; height: 44px;
    border-radius: 14px;
    background: var(--warmgray-light);
    display: flex; align-items: center; justify-content: center;
    color: var(--charcoal);
    cursor: pointer;
    transition: transform .2s, background .2s;
    position: relative;
  }
  .bottom-icon-btn:active { transform: scale(0.9); }
  .bottom-icon-btn.active { color: var(--brick); }
  .bottom-main-btn {
    flex: 1;
    height: 48px;
    background: linear-gradient(135deg, var(--brick) 0%, var(--brick-deep) 100%);
    color: #fff;
    border: none;
    border-radius: 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .2s, box-shadow .2s;
    box-shadow: 0 6px 20px rgba(160,82,45,0.35);
    position: relative;
    overflow: hidden;
  }
  .bottom-main-btn:active { transform: scale(0.97); }
  .bottom-main-btn::after {
    content: '';
    position: absolute; top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    animation: shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer {
    0% { left: -100%; }

// ========== CUSTOM CURSOR ==========
const initCursor = () => {
  const cursor = document.getElementById('cursor');
  if (!cursor) return;
  const mq = window.matchMedia('(hover: none)');
  if (mq.matches) return;

  let rafId = null;
  let tx = window.innerWidth / 2, ty = window.innerHeight / 2;
  let cx = tx, cy = ty;
  let visible = true;
  let paused = false;

  const tick = () => {
    if (paused) return;
    cx += (tx - cx) * 0.18;
    cy += (ty - cy) * 0.18;
    cursor.style.transform = `translate(${cx}px, ${cy}px) translate(-50%, -50%)`;
    rafId = requestAnimationFrame(tick);
  };

  const onMove = (e) => {
    tx = e.clientX; ty = e.clientY;
    if (!visible) { cursor.style.opacity = '1'; visible = true; }
  };
  const onLeave = () => { cursor.style.opacity = '0'; visible = false; };
  const onOver = (e) => {
    const t = e.target;
    if (t.closest && t.closest('button, [role=button], .cursor, .cursor-dot, a, input, .route-card, .place-card, .bottom-icon-btn, .bottom-main-btn, .tabbar-item, .discover-tab, .setting-item, .profile-grid-item, .timeline-item, .swipe-action, .api-header, .actionsheet-item')) {
      cursor.classList.add('hover');
    }
  };
  const onOut = () => { cursor.classList.remove('hover'); };
  const onDown = () => {
    cursor.classList.add('clicking');
    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = tx + 'px';
    ripple.style.top = ty + 'px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  };
  const onUp = () => { cursor.classList.remove('clicking'); };

  const onVisibility = () => {
    if (document.hidden) { paused = true; cancelAnimationFrame(rafId); }
    else { paused = false; rafId = requestAnimationFrame(tick); }
  };

  // init position center
  cursor.style.opacity = '0';
  cx = tx; cy = ty;
  cursor.style.transform = `translate(${cx}px, ${cy}px) translate(-50%, -50%)`;
  rafId = requestAnimationFrame(tick);

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseleave', onLeave);
  document.addEventListener('mouseover', onOver);
  document.addEventListener('mouseout', onOut);
  document.addEventListener('mousedown', onDown);
  document.addEventListener('mouseup', onUp);
  document.addEventListener('visibilitychange', onVisibility);

  // cleanup function - stored on window
  window.__cursorCleanup = () => {
    cancelAnimationFrame(rafId);
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseleave', onLeave);
    document.removeEventListener('mouseover', onOver);
    document.removeEventListener('mouseout', onOut);
    document.removeEventListener('mousedown', onDown);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('visibilitychange', onVisibility);
  };
};

// ========== HOME PAGE ==========
const HomePage = ({ onOpenRoute, entranceKey }) => {
  const [ptrOffset, setPtrOffset] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const pageRef = useRef(null);
  const startY = useRef(0);
  const dragging = useRef(false);
  const rafId = useRef(null);

  const onTouchStart = (e) => {
    if (pageRef.current && pageRef.current.scrollTop === 0) {
      dragging.current = true;
      startY.current = e.touches[0].clientY;
    }
  };
  const onTouchMove = (e) => {
    if (!dragging.current) return;
    const dy = e.touches[0].clientY - startY.current;
    if (dy > 0 && pageRef.current.scrollTop === 0) {
      const offset = Math.min(dy * 0.5, 80);
      setPtrOffset(offset);
      e.preventDefault();
    }
  };
  const onTouchEnd = () => {
    if (!dragging.current) return;
    dragging.current = false;
    if (ptrOffset > 50) {
      setRefreshing(true);
      setPtrOffset(60);
      setTimeout(() => {
        setRefreshing(false);
        setPtrOffset(0);
      }, 1500);
    } else {
      setPtrOffset(0);
    }
  };

  // Mouse-based pull (for desktop testing)
  const onMouseDown = (e) => {
    if (pageRef.current && pageRef.current.scrollTop === 0) {
      dragging.current = true;
      startY.current = e.clientY;
    }
  };
  const onMouseMove = (e) => {
    if (!dragging.current) return;
    const dy = e.clientY - startY.current;
    if (dy > 0 && pageRef.current.scrollTop === 0) {
      const offset = Math.min(dy * 0.5, 80);
      setPtrOffset(offset);
    }
  };
  const onMouseUp = () => {
    if (!dragging.current) return;
    dragging.current = false;
    if (ptrOffset > 50) {
      setRefreshing(true);
      setPtrOffset(60);
      setTimeout(() => {
        setRefreshing(false);
        setPtrOffset(0);
      }, 1500);
    } else {
      setPtrOffset(0);
    }
  };

  useEffect(() => {
    const mm = (e) => onMouseMove(e);
    const mu = () => onMouseUp();
    document.addEventListener('mousemove', mm);
    document.addEventListener('mouseup', mu);
    return () => {
      document.removeEventListener('mousemove', mm);
      document.removeEventListener('mouseup', mu);
    };
  }, [ptrOffset]);

  return (
    <div
      className="page"
      ref={pageRef}
      onTouchStart={onTouchStart}
      onTouchMove={onTouchMove}
      onTouchEnd={onTouchEnd}
      onMouseDown={onMouseDown}
    >
      {/* Pull to refresh indicator */}
      <div
        className="ptr-indicator"
        style={{ top: 40 + ptrOffset + 'px', opacity: ptrOffset > 10 ? 1 : 0 }}
      >
        {refreshing ? <div className="ptr-spinner"></div> : <Icon name="arrow-down" size={20} />}
        <span>{refreshing ? '正在刷新...' : ptrOffset > 50 ? '释放刷新' : '下拉刷新'}</span>
      </div>

      <div style={{ transform: `translateY(${ptrOffset}px)`, transition: dragging.current ? 'none' : 'transform .4s cubic-bezier(.34,1.56,.64,1)' }}>
        {/* Header */}
        <div className="home-header" key={`header-${entranceKey}`}>
          <div className="home-top-row entrance-fade-up delay-1">
            <div className="city-select">
              <Icon name="location" size={16} />
              <span>苏州古城</span>
              <Icon name="chevronDown" size={14} />
            </div>
            <div style={{cursor:'pointer'}}>
              <Icon name="bell" size={20} />
            </div>
          </div>
          <div className="home-greeting entrance-fade-up delay-2">
            早安，漫游者
          </div>
          <div className="home-subtitle entrance-fade-up delay-2">
            今天适合走一条藏在巷子里的路线
          </div>
          <div className="home-search entrance-fade-up delay-3">
            <Icon name="search" size={16} color="rgba(255,255,255,0.9)" />
            <span className="home-search-input">搜索路线、地点、故事</span>
          </div>
          <div className="home-category-row entrance-fade-up delay-4">
            {CATEGORIES.map((cat, i) => (
              <div key={cat.name} className="home-category-item">
                <div className="home-category-icon">
                  <Icon name={cat.icon} size={22} />
                </div>
                <span className="home-category-name">{cat.name}</span>
              </div>
            ))}
          </div>
        </div>

        {/* Featured routes */}
        <div className="home-featured">
          <div className="section-header entrance-fade-up delay-3">

// ========== API DOCS PAGE ==========

      <div className="api-back" onClick={onBack}>
        <Icon name="chevronLeft" size={22} />
      </div>
      <div style={{paddingTop: 8}}></div>
      <div className="spec-title">接口文档</div>
      <div className="spec-subtitle">API Documentation · 城市漫游手册 V2</div>

      {API_LIST.map((api, i) => (
        <div key={api.path} className={`api-item ${expanded === i ? 'expanded' : ''}`}>
          <div className="api-header" onClick={() => setExpanded(expanded === i ? null : i)}>
            <span className={`api-method ${api.method.toLowerCase()}`}>{api.method}</span>
            <span className="api-path">{api.path}</span>
            <span className="api-arrow"><Icon name="chevronRight" size={14} /></span>
          </div>
          <div className="api-body">
            <div className="api-body-inner">
              <div className="api-desc">{api.desc}</div>

              <div className="api-section-title">请求参数</div>
              <table className="api-param-table">
                <thead>
                  <tr>
                    <th>参数</th>
                    <th>类型</th>
                    <th>说明</th>
                  </tr>
                </thead>
                <tbody>
                  {api.params.map(p => (
                    <tr key={p.name}>
                      <td style={{color:'var(--brick)', fontFamily:'monospace'}}>{p.name}</td>
                      <td style={{color:'var(--olive)', fontFamily:'monospace'}}>{p.type}</td>

              <div className="api-section-title">返回示例</div>

// ========== APP ==========
const App = () => {
  const [tab, setTab] = useState('home');
  const [stack, setStack] = useState([]); // stack pages like 'routeDetail', 'placeDetail', 'specs', 'api'
  const [transition, setTransition] = useState(null); // direction
  const [selectedRoute, setSelectedRoute] = useState(null);
  const [selectedPlace, setSelectedPlace] = useState(null);
  const [entranceKey, setEntranceKey] = useState(0);

  // Trigger entrance animation on mount
  useEffect(() => {
    setEntranceKey(1);
  }, []);

  const openRoute = (route) => {
    setSelectedRoute(route);
    setTransition('right');
    setTimeout(() => {
      setStack([...stack, 'routeDetail']);
      setTransition(null);
    }, 10);
  };

  const openPlace = (place) => {
    setSelectedPlace(place);
    setTransition('right');
    setTimeout(() => {
      setStack([...stack, 'placeDetail']);
      setTransition(null);
    }, 10);
  };

  const openSpecs = () => {
    setTransition('right');
    setTimeout(() => {
      setStack([...stack, 'specs']);
      setTransition(null);
    }, 10);
  };

  const openApi = () => {
    setTransition('right');
    setTimeout(() => {
      setStack([...stack, 'api']);
      setTransition(null);
    }, 10);
  };

  const goBack = () => {
    setTransition('left');
    setTimeout(() => {
      setStack(stack.slice(0, -1));
      setTransition(null);
    }, 10);
  };

  const currentStackPage = stack[stack.length - 1];
  const hasStack = stack.length > 0;

  // Render tab content
  const renderTabPage = () => {
    const transitionClass = transition === 'left' && hasStack
      ? 'page-entering-left'
      : '';

    switch (tab) {
      case 'home':
        return (
          <div className={transitionClass} style={{position:'absolute', inset:0}}>
            <HomePage onOpenRoute={openRoute} entranceKey={entranceKey} />
          </div>
        );
      case 'discover':
        return (
          <div className={transitionClass} style={{position:'absolute', inset:0}}>
            <DiscoverPage onOpenPlace={openPlace} />
          </div>
        );
      case 'walk':
        return (
          <div className={transitionClass} style={{position:'absolute', inset:0}}>
            <WalkRecordPage />
          </div>
        );
      case 'profile':
        return (
          <div className={transitionClass} style={{position:'absolute', inset:0}}>
            <ProfilePage onOpenSpecs={openSpecs} onOpenApi={openApi} />
          </div>
        );
      default:
        return null;
    }
  };

  const renderStackPage = () => {
    if (!currentStackPage) return null;
    const isEntering = transition === 'right';
    const cls = isEntering ? 'page-entering-right' : '';

    switch (currentStackPage) {
      case 'routeDetail':
        return (
          <div className={cls} style={{position:'absolute', inset:0, zIndex:20}}>
            <RouteDetailPage route={selectedRoute} onBack={goBack} onOpenPlace={openPlace} />
          </div>
        );
      case 'placeDetail':
        return (
          <div className={cls} style={{position:'absolute', inset:0, zIndex:20}}>
            <PlaceDetailPage place={selectedPlace} onBack={goBack} />
          </div>
        );
      case 'specs':
        return (
          <div className={cls} style={{position:'absolute', inset:0, zIndex:20}}>
            <DesignSpecPage onBack={goBack} />
          </div>
        );
      case 'api':
        return (
          <div className={cls} style={{position:'absolute', inset:0, zIndex:20}}>
            <ApiDocsPage onBack={goBack} />
          </div>
        );
      default:
        return null;
    }
  };

  // Determine navbar style
  const isLightCapsule =
    (tab === 'home' && !hasStack) ||
    (tab === 'profile' && !hasStack) ||
    (tab === 'walk' && !hasStack) ||
    currentStackPage === 'routeDetail' ||
    currentStackPage === 'placeDetail';

  return (
    <div className="phone-wrap">
      <div className="phone-frame">
        <div className="phone-screen">
          <div className="phone-notch"></div>
          <StatusBar dark={!isLightCapsule} />
          <WxCapsule dark={!isLightCapsule} />

          <div className="page-container" style={{ paddingBottom: hasStack ? 0 : 78 }}>
            {renderTabPage()}
            {renderStackPage()}
          </div>

          {!hasStack && (
            <TabBar active={tab} onChange={(k) => {
              if (k === tab) return;
              setTab(k);
              // trigger entrance re-animation for home
              if (k === 'home') setEntranceKey(prev => prev + 1);
            }} />
          )}
        </div>
      </div>
    </div>
  );
};

// ========== MOUNT ==========
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// Init custom cursor after mount
setTimeout(initCursor, 100);

// Announce upgrade capability
function announceUpgrade() {
  try {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  } catch(e) {}
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}
</script>
</body>

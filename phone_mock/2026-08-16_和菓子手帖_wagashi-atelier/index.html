/* ============================================================
   PHYSICS ENGINE — Hooke spring + inertial momentum
   ============================================================ */
class Spring {
  constructor(k = 180, damping = 14, mass = 1) {
    this.k = k; this.damping = damping; this.mass = mass;
    this.position = 0; this.velocity = 0;
    this.target = 0;
  }
  setTarget(t) { this.target = t; }
  setInstant(v) { this.position = v; this.velocity = 0; this.target = v; }
  step(dt) {
    const force = -this.k * (this.position - this.target);
    const damp = -this.damping * this.velocity;
    const acc = (force + damp) / this.mass;
    this.velocity += acc * dt;
    this.position += this.velocity * dt;
    return this.position;
  }
}

/* ============================================================
   CUSTOM CURSOR
   ============================================================ */
function initCustomCursor() {
  const dot = document.getElementById('cursorDot');
  const ring = document.getElementById('cursorRing');
  if (!dot || !ring) return;

  let tx = window.innerWidth / 2, ty = window.innerHeight / 2;
  let rx = tx, ry = ty;
  let rafId = null;
  let hovered = false;
  let visible = false;

  const springX = new Spring(160, 14, 1);
  const springY = new Spring(160, 14, 1);
  springX.setInstant(tx); springY.setInstant(ty);

  function tick(ts) {
    springX.setTarget(tx); springY.setTarget(ty);
    springX.step(1 / 60); springY.step(1 / 60);
    rx = springX.position; ry = springY.position;
    ring.style.transform = `translate(${rx}px, ${ry}px) translate(-50%, -50%)`;
    dot.style.transform = `translate(${tx}px, ${ty}px) translate(-50%, -50%)`;
    rafId = requestAnimationFrame(tick);
  }

  function onMove(e) {
    tx = e.clientX; ty = e.clientY;
    if (!visible) {
      visible = true;
      dot.style.opacity = '1';
      ring.style.opacity = hovered ? '0.8' : '0.5';
    }
  }

  function onOver(e) {
    let el = e.target;
    while (el && el !== document.body) {
      if (el.dataset && el.dataset.cursor) {
        hovered = true;
        dot.classList.add('hover');
        ring.classList.add('hover');
        return;
      }
      if (el.tagName === 'BUTTON' || el.tagName === 'A' ||
          el.closest && (el.closest('button') || el.closest('a') ||
                         el.closest('[role="button"]') || el.closest('.clickable'))) {
        hovered = true;
        dot.classList.add('hover');
        ring.classList.add('hover');
        return;
      }
      el = el.parentElement;
    }
    if (hovered) {
      hovered = false;
      dot.classList.remove('hover');
      ring.classList.remove('hover');
    }
  }

  function onClick(e) {
    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    ripple.style.animation = 'ripple 0.5s cubic-bezier(.2,.8,.2,1) forwards';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 500);
  }

  function onVisibility() {
    if (document.hidden) {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
    } else {
      if (!rafId) rafId = requestAnimationFrame(tick);
    }
  }

  window.addEventListener('mousemove', onMove);
  document.addEventListener('mouseover', onOver);
  document.addEventListener('click', onClick);
  document.addEventListener('visibilitychange', onVisibility);
  rafId = requestAnimationFrame(tick);

  // initial position
  tx = window.innerWidth / 2; ty = window.innerHeight / 2;

  return () => {
    window.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseover', onOver);
    document.removeEventListener('click', onClick);
    document.removeEventListener('visibilitychange', onVisibility);
    if (rafId) cancelAnimationFrame(rafId);
  };
}

/* ============================================================
   HOOKS
   ============================================================ */
function useSpring(target, options = {}) {
  const { stiffness = 180, damping = 14, mass = 1 } = options;
  const ref = useRef(new Spring(stiffness, damping, mass));
  const [val, setVal] = useState(target);
  const rafRef = useRef(null);
  const lastTarget = useRef(target);

  useEffect(() => {
    if (lastTarget.current === target) return;
    lastTarget.current = target;
    ref.current.setTarget(target);
    if (rafRef.current) return;

    let last = performance.now();
    function loop(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      ref.current.step(dt);
      setVal(ref.current.position);
      if (Math.abs(ref.current.position - target) < 0.1 &&
          Math.abs(ref.current.velocity) < 0.1) {
        setVal(target);
        rafRef.current = null;
        return;
      }
      rafRef.current = requestAnimationFrame(loop);
    }
    rafRef.current = requestAnimationFrame(loop);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [target]);

  useEffect(() => {
    const onVis = () => {
      if (document.hidden && rafRef.current) {
        cancelAnimationFrame(rafRef.current);
        rafRef.current = null;
      }
    };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, []);

  return val;
}

function useStaggeredReveal(items, delay = 80, startDelay = 100) {
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const t = setTimeout(() => setVisible(true), startDelay);
    return () => clearTimeout(t);
  }, [items]);
  return visible;
}

  const categories = [

    { id: 'summer', name: '夏', jp: 'Summer' },

                fontSize: 13, fontWeight: 500,
                background: activeCat === cat.id ? PALETTE.wine : PALETTE.paper,
                color: activeCat === cat.id ? PALETTE.cream : PALETTE.roast,
                boxShadow: activeCat === cat.id ? `0 4px 12px rgba(109,26,45,0.25)` : 'none',
                transition: 'all 0.3s ease',

            <MenuCard
              key={w.id}

function MenuCard({ item, height, delay, revealed, onClick, index }) {
  const [hovered, setHovered] = useState(false);
  const accentColor = index % 3 === 0 ? PALETTE.peach : index % 3 === 1 ? PALETTE.matcha : PALETTE.cream;
  const accentColorDark = index % 3 === 0 ? PALETTE.peachDeep : index % 3 === 1 ? PALETTE.matchaDeep : PALETTE.roastLight;

  return (
    <button
      className="clickable"
      onClick={onClick}
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      style={{
        width: '100%', border: 'none', cursor: 'pointer', padding: 0,
        borderRadius: 18, overflow: 'hidden',
        background: PALETTE.paper,
        textAlign: 'left',
        boxShadow: `0 4px 16px rgba(109,26,45,0.08)`,
        transform: revealed ? 'translateY(0) scale(1)' : 'translateY(20px) scale(0.98)',
        opacity: revealed ? 1 : 0,
        transition: `opacity 0.6s ${delay}ms cubic-bezier(.2,.8,.2,1), transform 0.6s ${delay}ms cubic-bezier(.2,.8,.2,1)`,
      }}
    >
      <div style={{
        height, background: accentColor, position: 'relative', overflow: 'hidden',
      }}>
        <img src={item.img} alt={item.name} style={{
          width: '100%', height: '100%', objectFit: 'cover',
          transform: hovered ? 'scale(1.08)' : 'scale(1)',
          transition: 'transform 0.5s cubic-bezier(.2,.8,.2,1)',
        }} />
        {/* Top corner tag */}
        <div style={{
          position: 'absolute', top: 10, left: 10,
          fontSize: 10, padding: '4px 10px', borderRadius: 20,
          background: `rgba(255,251,245,0.9)`,
          color: PALETTE.wine, fontWeight: 500,
          backdropFilter: 'blur(4px)',
        }}>{item.season.split(' · ')[0]}</div>
      </div>
      <div style={{ padding: '10px 12px 12px' }}>
        <div className="serif" style={{ fontSize: 15, fontWeight: 600, color: PALETTE.ink }}>{item.name}</div>
        <div style={{ fontSize: 10, color: PALETTE.roastLight, marginTop: 2 }}>{item.romaji}</div>
        <div style={{
          display: 'flex', justifyContent: 'space-between',
          alignItems: 'center', marginTop: 8,
        }}>
          <div style={{ fontSize: 14, fontWeight: 700, color: PALETTE.wine }}>¥{item.price}</div>
          <div style={{
            width: 24, height: 24, borderRadius: '50%',
            background: accentColorDark + '20',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            {Icon.plus(accentColorDark)}
          </div>
        </div>
      </div>
    </button>
  );
}

}

/* ============================================================

    return arr;

          </div>
        )}

        {step === 1 && (

        )}

        {step === 2 && (

              marginBottom: 12,
            }}>ご予約の数量をお選びください</div>

            <div style={{
              background: PALETTE.paper,
              borderRadius: 20, padding: 20,
              border: `1px solid ${PALETTE.peachLight}`,

                <div style={{
                  width: 60, height: 60, borderRadius: 14,

                }}>
                  <img src={WAGASHI[0].img} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />

                <div style={{ flex: 1 }}>
                  <div className="serif" style={{ fontSize: 16, fontWeight: 600, color: PALETTE.ink }}>
                    {WAGASHI[0].name}

                  <button

function MotionDemo({ label, duration, easing }) {
  const [play, setPlay] = useState(false);

  useEffect(() => {
    if (!play) return;
    const t = setTimeout(() => setPlay(false), 800);
    return () => clearTimeout(t);
  }, [play]);

  return (
    <div
      className="clickable"
      onClick={() => setPlay(true)}
      style={{
        display: 'flex', alignItems: 'center', gap: 12,
        cursor: 'pointer',
      }}

          {duration} · {easing.split('(')[0]}

    </div>
  );
}

/* ============================================================
   BOTTOM NAVIGATION
   ============================================================ */
function BottomNav({ active, onChange }) {
  const items = [
    { id: 'today', label: '今日', icon: Icon.home },
    { id: 'menu', label: '銘菓', icon: Icon.menu },
    { id: 'collection', label: '手帖', icon: Icon.heart },
    { id: 'profile', label: '私', icon: Icon.user },
  ];

  return (
    <div style={{
      position: 'absolute', bottom: 0, left: 0, right: 0,
      height: 80,
      background: 'rgba(255,251,245,0.85)',
      backdropFilter: 'blur(20px)',
      WebkitBackdropFilter: 'blur(20px)',
      borderTop: `1px solid ${PALETTE.peachLight}`,
      display: 'flex',
      zIndex: 50,
    }}>
      {items.map(item => {
        const isActive = active === item.id;
        return (
          <button
            key={item.id}
            className="clickable"
            onClick={() => onChange(item.id)}
            style={{
              flex: 1, background: 'none', border: 'none',
              cursor: 'pointer',
              display: 'flex', flexDirection: 'column',
              alignItems: 'center', justifyContent: 'center',
              gap: 4,
              paddingBottom: 20,
              color: isActive ? PALETTE.wine : PALETTE.roastLight,
              transition: 'color 0.3s ease',
              position: 'relative',
            }}
          >
            <div style={{
              transform: isActive ? 'scale(1.1)' : 'scale(1)',
              transition: 'transform 0.3s cubic-bezier(.34,1.56,.64,1)',
            }}>
              {item.icon(isActive ? PALETTE.wine : PALETTE.roastLight)}
            </div>
            <span style={{
              fontSize: 10, fontWeight: isActive ? 600 : 400,
              letterSpacing: '0.05em',
            }}>{item.label}</span>
            {isActive && (
              <div style={{
                position: 'absolute', top: 6,
                width: 24, height: 3, borderRadius: 2,
                background: PALETTE.wine,
              }} />
            )}
          </button>
        );
      })}
    </div>
  );
}

/* ============================================================
   MAIN APP
   ============================================================ */
function App() {
  const [page, setPage] = useState('today');
  const [detailItem, setDetailItem] = useState(null);
  const [showDetail, setShowDetail] = useState(false);
  const [showReservation, setShowReservation] = useState(false);
  const [showDesign, setShowDesign] = useState(false);
  const [showApi, setShowApi] = useState(false);

  const handleOpenDetail = (item) => {
    setDetailItem(item);
    setShowDetail(true);
  };

  const handleCloseDetail = () => {
    setShowDetail(false);
    setTimeout(() => setDetailItem(null), 400);
  };

  const handleNavigate = (target) => {
    if (target === 'reservation') {
      setShowReservation(true);
    } else if (target === 'design') {
      setShowDesign(true);
    } else if (target === 'api') {
      setShowApi(true);
    } else {
      setPage(target);
    }
  };

  return (
    <div className="stage">
      <div className="stage-title">
        和菓子手帖 <span className="jp">WAGASHI ATELIER</span>
      </div>
      <div className="stage-label">
        V2 · Mobile App UI · 8 pages · Interactive Prototype
      </div>

      <div className="phone-wrap">
        <IOSDevice width={390} height={844}>
          <div style={{
            position: 'relative', width: '100%', height: '100%',
            overflow: 'hidden',
          }}>
            {/* Main pages (with bottom nav) */}
            {page === 'today' && (
              <TodayPage
                key="today"
                onOpenDetail={handleOpenDetail}
                onNavigate={handleNavigate}
              />
            )}
            {page === 'menu' && (
              <MenuPage
                key="menu"
                onOpenDetail={handleOpenDetail}
              />
            )}
            {page === 'collection' && (
              <CollectionPage
                key="collection"
              />
            )}
            {page === 'profile' && (
              <ProfilePage
                key="profile"
              />
            )}

            {/* Bottom nav (hidden on detail / overlay pages) */}
            {!showDetail && !showReservation && !showDesign && !showApi && (
              <BottomNav active={page} onChange={setPage} />
            )}

            {/* Reservation overlay */}
            {showReservation && (
              <div style={{
                position: 'absolute', inset: 0, zIndex: 100,
              }}>
                <ReservationPage />
                <button
                  className="clickable"
                  onClick={() => setShowReservation(false)}
                  style={{
                    position: 'absolute', top: 62, right: 16, zIndex: 200,
                    width: 36, height: 36, borderRadius: '50%',
                    background: PALETTE.paper,
                    border: `1px solid ${PALETTE.peachLight}`,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    cursor: 'pointer',
                  }}
                >
                  {Icon.close(PALETTE.wine)}
                </button>
              </div>
            )}

            {/* Design system overlay */}
            {showDesign && (
              <div style={{
                position: 'absolute', inset: 0, zIndex: 100,
              }}>
                <DesignSystemPage onBack={() => setShowDesign(false)} />
              </div>
            )}

            {/* API docs overlay */}
            {showApi && (
              <div style={{
                position: 'absolute', inset: 0, zIndex: 100,
              }}>
                <ApiDocsPage onBack={() => setShowApi(false)} />
              </div>
            )}

            {/* Detail drawer */}
            {showDetail && detailItem && (
              <DetailPage
                item={detailItem}
                onClose={handleCloseDetail}
              />
            )}
          </div>
        </IOSDevice>
      </div>
    </div>
  );
}

/* ============================================================
   RENDER & INIT
   ============================================================ */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// Custom cursor init
if (window.matchMedia('(pointer: fine)').matches) {
  initCustomCursor();
}

// Announce upgrade capability
function announceUpgrade() {
  window.parent.postMessage(
    { type: 'miaoda:upgrade:available', kind: 'interactive-prototype' },
    '*'
  );
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}
</script>
</body>
</html>

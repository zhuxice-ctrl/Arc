<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>菌物图鉴 · 微信小程序</title>

<!-- Fonts -->
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" />

<!-- React + Babel -->
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<style>
/* ============ Tokens ============ */
:root {
  --cap-orange: #C4621E;
  --cap-orange-light: #D97A2E;
  --cap-orange-dark: #A04D15;
  --moss-green: #4A6B3A;
  --moss-green-light: #6B8C55;
  --moss-green-dark: #335225;
  --rot-wood: #5C3D2E;
  --rot-wood-light: #7A5543;
  --spore-white: #F2EDE0;
  --spore-white-2: #E8E2D0;
  --ink-green: #1E2A1E;
  --ink-green-2: #2D3D2D;
  --ink-green-3: #4A5A4A;
  --danger: #B8412D;

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;

  --shadow-sm: 0 2px 8px rgba(30,42,30,0.06);
  --shadow-md: 0 8px 24px rgba(30,42,30,0.12);
  --shadow-lg: 0 16px 48px rgba(30,42,30,0.18);

  --font-serif: 'Noto Serif SC', serif;
  --font-sans: 'Noto Sans SC', -apple-system, system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: var(--font-sans);
  color: var(--ink-green);
  background: #EDE6D4;
  /* forest floor gradient */
  background: radial-gradient(ellipse at top, #E8E0C8 0%, #D9D0B5 60%, #C8BC9A 100%);
}

/* Stage */
.stage {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 1800px;
}

.stage-bg-label {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  color: rgba(30,42,30,0.4);
  letter-spacing: 2px;
  z-index: 1;
}

/* ============ Phone Frame ============ */
.phone {
  position: relative;
  width: 375px;
  height: 812px;
  border-radius: 48px;
  background: #1a1a1a;
  padding: 12px;
  box-shadow:
    0 30px 80px rgba(20,20,10,0.35),
    0 10px 30px rgba(20,20,10,0.25),
    inset 0 1px 0 rgba(255,255,255,0.15),
    inset 0 -1px 0 rgba(0,0,0,0.3);
}

.phone::before {
  content: '';
  position: absolute;
  inset: 10px;
  border-radius: 40px;
  background: linear-gradient(145deg, #2a2a2a, #111);
  z-index: 0;
}

.phone-side-btn {
  position: absolute;
  background: #1a1a1a;
  border-radius: 2px;
}
.phone-side-btn.left-1 { left: -2px; top: 120px; width: 3px; height: 32px; }
.phone-side-btn.left-2 { left: -2px; top: 172px; width: 3px; height: 56px; }
.phone-side-btn.left-3 { left: -2px; top: 244px; width: 3px; height: 56px; }
.phone-side-btn.right-1 { right: -2px; top: 190px; width: 3px; height: 80px; }

.screen {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 38px;
  overflow: hidden;
  background: var(--spore-white);
  z-index: 1;
  cursor: none;
}

/* ============ Status Bar ============ */
.status-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px 0 28px;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink-green);
  z-index: 100;
  pointer-events: none;
}
.status-bar.dark { color: #fff; }
.status-bar .right-side {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  font-weight: 500;
}
.status-bar .signal-bars {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 10px;
}
.status-bar .signal-bars span {
  width: 3px;
  background: currentColor;
  border-radius: 1px;
}
.status-bar .signal-bars span:nth-child(1) { height: 3px; }
.status-bar .signal-bars span:nth-child(2) { height: 5px; }
.status-bar .signal-bars span:nth-child(3) { height: 7px; }
.status-bar .signal-bars span:nth-child(4) { height: 10px; }
.status-bar .battery {
  width: 24px;
  height: 11px;
  border: 1px solid currentColor;
  border-radius: 3px;
  position: relative;
  padding: 1px;
}
.status-bar .battery::after {
  content: '';
  position: absolute;
  right: -3px;
  top: 3px;
  width: 2px;
  height: 5px;
  background: currentColor;
  border-radius: 0 1px 1px 0;
}
.status-bar .battery-fill {
  width: 80%;
  height: 100%;
  background: currentColor;
  border-radius: 1px;
}

/* ============ Capsule Button (WeChat Mini-Program) ============ */
.capsule {
  position: absolute;
  top: 52px;
  right: 12px;
  width: 87px;
  height: 32px;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 99;
  border: 1px solid rgba(0,0,0,0.05);
  transition: background 0.3s;
}
.capsule.dark {
  background: rgba(30,42,30,0.5);
  border-color: rgba(255,255,255,0.1);
}
.capsule .capsule-btn {
  width: 30px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.capsule .capsule-divider {
  width: 1px;
  height: 16px;
  background: rgba(0,0,0,0.1);
}
.capsule.dark .capsule-divider {
  background: rgba(255,255,255,0.2);
}

/* ============ Page Container ============ */
.pages {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.page {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--spore-white);
  will-change: transform, opacity;
}

.page-enter {
  animation: pagePushIn 0.35s cubic-bezier(0.32, 0.72, 0, 1) both;
}
.page-exit {
  animation: pagePushOut 0.35s cubic-bezier(0.32, 0.72, 0, 1) both;
}

@keyframes pagePushIn {
  from { transform: translateX(100%); }
  to { transform: translateX(0); }
}
@keyframes pagePushOut {
  from { transform: translateX(0); }
  to { transform: translateX(30%); opacity: 0.3; }
}

/* ============ Nav Bar ============ */
.nav-bar {
  position: relative;
  height: 88px;
  padding-top: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  z-index: 50;
  flex-shrink: 0;
}
.nav-bar.solid {
  background: var(--spore-white);
  box-shadow: 0 1px 0 rgba(30,42,30,0.06);
}
.nav-bar.transparent { background: transparent; }
.nav-bar.dark { color: #fff; }

.nav-bar .nav-title {
  font-size: 17px;
  font-weight: 600;
  font-family: var(--font-sans);
}

.nav-bar .nav-back {
  position: absolute;
  left: 16px;
  bottom: 10px;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(10px);
  border-radius: 50%;
  cursor: pointer;
}
.nav-bar.dark .nav-back {
  background: rgba(30,42,30,0.4);
  color: #fff;
}

/* ============ Page Content ============ */
.page-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.page-content::-webkit-scrollbar { display: none; }

/* ============ Tab Bar ============ */
.tab-bar {
  position: relative;
  height: 83px;
  background: rgba(242,237,224,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid rgba(30,42,30,0.06);
  display: flex;
  padding-bottom: 28px;
  flex-shrink: 0;
  z-index: 50;
}
.tab-bar-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  cursor: pointer;
  color: #999;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.tab-bar-item.active {
  color: var(--cap-orange);
  animation: tabBounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes tabBounce {
  0% { transform: scale(1); }
  40% { transform: scale(1.2); }
  70% { transform: scale(0.92); }
  100% { transform: scale(1); }
}
.tab-bar-item .tab-icon {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.tab-bar-item .tab-label {
  font-size: 10px;
  font-weight: 500;
}
.tab-bar-item.active .tab-dot {
  position: absolute;
  bottom: -6px;
  left: 50%;
  transform: translateX(-50%);
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--cap-orange);
  animation: dotGrow 0.3s ease;
}
@keyframes dotGrow {
  from { transform: translateX(-50%) scale(0); }
  to { transform: translateX(-50%) scale(1); }
}

/* ============ Spore particle animation ============ */
.spore-particle {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: rgba(196,98,30,0.5);
  pointer-events: none;
  animation: sporeFloat 6s ease-in-out infinite;
}
@keyframes sporeFloat {
  0% {
    transform: translateY(0) translateX(0) scale(1);
    opacity: 0;
  }
  20% { opacity: 0.7; }
  80% { opacity: 0.4; }
  100% {
    transform: translateY(-200px) translateX(40px) scale(0.3);
    opacity: 0;
  }
}

/* ============ Home Page ============ */
.home-hero {
  position: relative;
  height: 320px;
  overflow: hidden;
}
.home-hero-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.85) saturate(1.1);
}
.home-hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(30,42,30,0.1) 0%,
    rgba(30,42,30,0.25) 50%,
    rgba(30,42,30,0.7) 100%
  );
}
.home-hero-content {
  position: absolute;
  bottom: 20px;
  left: 20px;
  right: 20px;
  color: #fff;
}
.home-hero-title {
  font-family: var(--font-serif);
  font-size: 32px;
  font-weight: 700;
  letter-spacing: 4px;
  margin-bottom: 6px;
  animation: heroTitleIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
}
.home-hero-sub {
  font-size: 13px;
  opacity: 0.85;
  letter-spacing: 1px;
  animation: heroSubIn 0.8s 0.15s cubic-bezier(0.16, 1, 0.3, 1) both;
}
@keyframes heroTitleIn {
  from { opacity: 0; transform: translateY(20px); letter-spacing: 10px; }
  to { opacity: 1; transform: translateY(0); letter-spacing: 4px; }
}
@keyframes heroSubIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 0.85; transform: translateY(0); }
}

.home-search {
  position: absolute;
  top: 96px;
  left: 16px;
  right: 112px;
  height: 36px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(10px);
  border-radius: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  font-size: 13px;
  color: var(--ink-green-3);
  animation: searchFadeIn 0.6s 0.3s both;
  cursor: pointer;
}
@keyframes searchFadeIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Quick entry grid */
.home-quick {
  position: relative;
  margin: -20px 16px 0;
  background: #fff;
  border-radius: var(--radius-lg);
  padding: 16px;
  box-shadow: var(--shadow-md);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  z-index: 2;
  animation: quickUp 0.5s 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
}
@keyframes quickUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
.quick-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 8px 0;
  cursor: pointer;
  transition: transform 0.2s;
}
.quick-item:active { transform: scale(0.92); }
.quick-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}
.quick-icon.orange { background: linear-gradient(135deg, #F5D5B8, #E8B088); color: var(--cap-orange); }
.quick-icon.green { background: linear-gradient(135deg, #D5E5C8, #A8C994); color: var(--moss-green); }
.quick-icon.brown { background: linear-gradient(135deg, #E0D0C0, #C0A890); color: var(--rot-wood); }
.quick-icon.cream { background: linear-gradient(135deg, #F5ECD8, #E8DCC0); color: var(--rot-wood-light); }
.quick-label { font-size: 11px; color: var(--ink-green-2); }

/* Season Section */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px 20px 12px;
}
.section-title {
  font-family: var(--font-serif);
  font-size: 18px;
  font-weight: 700;
  color: var(--ink-green);
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title::before {
  content: '';
  width: 3px;
  height: 16px;
  background: var(--cap-orange);
  border-radius: 2px;
}
.section-more {
  font-size: 12px;
  color: var(--ink-green-3);
  cursor: pointer;
}

/* Mushroom Card - Waterfall */
.mushroom-card {
  position: relative;
  background: #fff;
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
  break-inside: avoid;
  margin-bottom: 12px;
}
.mushroom-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
}
.mushroom-card:active { transform: scale(0.97); }
.mushroom-card-img-wrap {
  position: relative;
  overflow: hidden;
  background: var(--spore-white-2);
}
.mushroom-card-img {
  width: 100%;
  height: auto;
  display: block;
  transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
.mushroom-card:hover .mushroom-card-img {
  transform: scale(1.06);
}
.mushroom-card-body {
  padding: 10px 12px 12px;
}
.mushroom-card-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink-green);
  margin-bottom: 2px;
  font-family: var(--font-serif);
}
.mushroom-card-latin {
  font-size: 10px;
  color: var(--ink-green-3);
  font-style: italic;
  margin-bottom: 8px;
}
.mushroom-card-tags {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.mushroom-tag {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 500;
}
.mushroom-tag.edible { background: rgba(74,107,58,0.12); color: var(--moss-green); }
.mushroom-tag.medicinal { background: rgba(196,98,30,0.12); color: var(--cap-orange); }
.mushroom-tag.poisonous { background: rgba(184,65,45,0.12); color: var(--danger); }
.mushroom-tag.premium { background: rgba(92,61,46,0.12); color: var(--rot-wood); }

/* Waterfall layout */
.waterfall {
  column-count: 2;
  column-gap: 12px;
  padding: 0 16px 20px;
}

/* ============ Catalog Page ============ */
.catalog-header {
  padding: 96px 20px 16px;
  background: linear-gradient(180deg, #EADFC5 0%, var(--spore-white) 100%);
}
.catalog-title {
  font-family: var(--font-serif);
  font-size: 28px;
  font-weight: 700;
  color: var(--ink-green);
  margin-bottom: 4px;
}
.catalog-subtitle {
  font-size: 12px;
  color: var(--ink-green-3);
}

/* Sticky tabs */
.sticky-tabs {
  position: sticky;
  top: 0;
  background: rgba(242,237,224,0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(30,42,30,0.06);
  z-index: 20;
  padding: 0 12px;
  overflow-x: auto;
  scrollbar-width: none;
}
.sticky-tabs::-webkit-scrollbar { display: none; }
.sticky-tabs-inner {
  display: flex;
  gap: 8px;
  padding: 10px 4px;
  min-width: max-content;
}
.tab-chip {
  padding: 6px 14px;
  border-radius: 16px;
  font-size: 13px;
  background: rgba(30,42,30,0.05);
  color: var(--ink-green-2);
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  flex-shrink: 0;
  font-weight: 500;
}
.tab-chip.active {
  background: var(--cap-orange);
  color: #fff;
  transform: scale(1.05);
}

/* Category grid */
.category-grid {
  padding: 16px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.category-card {
  position: relative;
  height: 110px;
  border-radius: var(--radius-md);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.category-card:active { transform: scale(0.96); }
.category-card-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s;
}
.category-card:hover .category-card-img {
  transform: scale(1.1);
}
.category-card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(30,42,30,0.2) 0%, rgba(30,42,30,0.7) 100%);
}
.category-card-label {
  position: absolute;
  left: 14px;
  bottom: 12px;
  color: #fff;
}
.category-card-name {
  font-family: var(--font-serif);
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 2px;
}
.category-card-count {
  font-size: 11px;
  opacity: 0.8;
}

/* ============ Detail Page ============ */
.detail-hero {
  position: relative;
  height: 380px;
  overflow: hidden;
}
.detail-hero-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  will-change: transform;
}
.detail-hero-gradient {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 40%, rgba(30,42,30,0.8) 100%);
}
.detail-hero-info {
  position: absolute;
  bottom: 20px;
  left: 20px;
  right: 20px;
  color: #fff;
}
.detail-name {
  font-family: var(--font-serif);
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 4px;
}
.detail-latin {
  font-size: 13px;
  font-style: italic;
  opacity: 0.8;
  margin-bottom: 10px;
}
.detail-meta-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.detail-meta-chip {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(10px);
  border-radius: 12px;
  font-size: 11px;
}

.detail-body {
  background: var(--spore-white);
  border-radius: 24px 24px 0 0;
  margin-top: -20px;
  position: relative;
  padding: 20px 20px 120px;
  z-index: 2;
}

.detail-section-title {
  font-family: var(--font-serif);
  font-size: 18px;
  font-weight: 700;
  color: var(--ink-green);
  margin-bottom: 10px;
  margin-top: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.detail-section-title:first-child { margin-top: 0; }

.detail-section-title::before {
  content: '';
  display: inline-block;
  width: 18px;
  height: 18px;
  background: radial-gradient(circle at 50% 40%, var(--cap-orange) 30%, transparent 31%);
  border-bottom: 3px solid var(--cap-orange);
  border-radius: 50% 50% 40% 40%;
}

.detail-desc {
  font-size: 14px;
  line-height: 1.8;
  color: var(--ink-green-2);
}

/* Info grid for detail */
.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 4px;
}
.info-item {
  background: #fff;
  border-radius: 12px;
  padding: 12px;
  box-shadow: var(--shadow-sm);
}
.info-item-label {
  font-size: 11px;
  color: var(--ink-green-3);
  margin-bottom: 4px;
}
.info-item-value {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-green);
}

/* Bottom Action Bar */
.bottom-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 83px;
  background: #fff;
  border-top: 1px solid rgba(30,42,30,0.06);
  display: flex;
  align-items: center;
  padding: 0 16px 28px;
  gap: 12px;
  z-index: 30;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
}
.bottom-bar-icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--spore-white);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.2s, background 0.2s;
  color: var(--ink-green-2);
  position: relative;
}
.bottom-bar-icon-btn:active { transform: scale(0.9); }
.bottom-bar-icon-btn.active {
  color: var(--cap-orange);
}
.bottom-bar-icon-btn.active .heart-fill {
  animation: heartPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes heartPop {
  0% { transform: scale(0); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}
.bottom-bar-main-btn {
  flex: 1;
  height: 44px;
  border-radius: 22px;
  background: linear-gradient(135deg, var(--cap-orange-light), var(--cap-orange));
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(196,98,30,0.35);
  transition: transform 0.15s, box-shadow 0.15s;
}
.bottom-bar-main-btn:active {
  transform: scale(0.97);
  box-shadow: 0 2px 8px rgba(196,98,30,0.3);
}

/* ============ Collection Page ============ */
.collect-header {
  padding: 96px 20px 16px;
  background: linear-gradient(135deg, var(--moss-green) 0%, var(--moss-green-dark) 100%);
  color: #fff;
  position: relative;
  overflow: hidden;
}
.collect-header::before {
  content: '';
  position: absolute;
  top: -60px;
  right: -40px;
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
  border-radius: 50%;
}
.collect-stats {
  display: flex;
  gap: 24px;
  margin-top: 16px;
}
.collect-stat-num {
  font-family: var(--font-serif);
  font-size: 28px;
  font-weight: 700;
  line-height: 1;
}
.collect-stat-label {
  font-size: 11px;
  opacity: 0.7;
  margin-top: 4px;
}

.collect-filter-row {
  display: flex;
  gap: 8px;
  padding: 14px 16px 8px;
  background: var(--spore-white);
  position: sticky;
  top: 0;
  z-index: 10;
}

/* Swipeable list */
.swipe-list {
  padding: 0 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.swipe-item {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius-md);
}
.swipe-item-actions {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  display: flex;
  z-index: 1;
}
.swipe-action-btn {
  width: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: #fff;
  cursor: pointer;
}
.swipe-action-btn.delete { background: var(--danger); }
.swipe-action-btn.edit { background: var(--moss-green); }
.swipe-item-content {
  position: relative;
  z-index: 2;
  background: #fff;
  display: flex;
  gap: 12px;
  padding: 12px;
  border-radius: var(--radius-md);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
}
.swipe-item-img {
  width: 64px;
  height: 64px;
  border-radius: 12px;
  object-fit: cover;
  flex-shrink: 0;
}
.swipe-item-info {
  flex: 1;
  min-width: 0;
}
.swipe-item-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink-green);
  margin-bottom: 4px;
  font-family: var(--font-serif);
}
.swipe-item-meta {
  font-size: 11px;
  color: var(--ink-green-3);
  line-height: 1.5;
}
.swipe-item-date {
  font-size: 11px;
  color: var(--ink-green-3);
  text-align: right;
  flex-shrink: 0;
  padding-top: 2px;
}

/* ============ Profile Page ============ */
.profile-hero {
  position: relative;
  height: 260px;
  background: linear-gradient(160deg, var(--rot-wood) 0%, var(--ink-green) 100%);
  overflow: hidden;
}
.profile-hero::before {
  content: '';
  position: absolute;
  top: -80px;
  left: -60px;
  width: 240px;
  height: 240px;
  background: radial-gradient(circle, rgba(196,98,30,0.3) 0%, transparent 70%);
  border-radius: 50%;
}
.profile-hero::after {
  content: '';
  position: absolute;
  bottom: -100px;
  right: -80px;
  width: 280px;
  height: 280px;
  background: radial-gradient(circle, rgba(74,107,58,0.4) 0%, transparent 70%);
  border-radius: 50%;
}
.profile-user {
  position: relative;
  z-index: 2;
  padding: 100px 20px 0;
  display: flex;
  align-items: center;
  gap: 14px;
  color: #fff;
}
.profile-avatar {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--cap-orange-light), var(--cap-orange));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-family: var(--font-serif);
  font-weight: 700;
  border: 2px solid rgba(255,255,255,0.3);
  flex-shrink: 0;
}
.profile-name {
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 2px;
}
.profile-id {
  font-size: 12px;
  opacity: 0.7;
}

.profile-stats-row {
  position: relative;
  z-index: 2;
  display: flex;
  margin: 20px 16px 0;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 16px;
  padding: 14px 0;
}
.profile-stat {
  flex: 1;
  text-align: center;
  color: #fff;
  position: relative;
}
.profile-stat-num {
  font-family: var(--font-serif);
  font-size: 18px;
  font-weight: 700;
}
.profile-stat-label {
  font-size: 11px;
  opacity: 0.7;
  margin-top: 2px;
}
.profile-stat + .profile-stat::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  height: 24px;
  width: 1px;
  background: rgba(255,255,255,0.2);
}

/* Profile menu card */
.profile-menu-card {
  margin: -24px 16px 16px;
  background: #fff;
  border-radius: var(--radius-lg);
  padding: 8px 0;
  box-shadow: var(--shadow-md);
  position: relative;
  z-index: 3;
}
.profile-menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  cursor: pointer;
  transition: background 0.15s;
}
.profile-menu-item:active { background: var(--spore-white); }
.profile-menu-icon {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.profile-menu-text {
  flex: 1;
  font-size: 14px;
  color: var(--ink-green);
}
.profile-menu-arrow {
  color: #ccc;
  font-size: 14px;
}

/* Grid menu */
.profile-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  padding: 8px 0;
}
.profile-grid-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 10px 0;
  cursor: pointer;
  transition: transform 0.15s;
}
.profile-grid-item:active { transform: scale(0.9); }
.profile-grid-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}
.profile-grid-label {
  font-size: 10px;
  color: var(--ink-green-2);
}

/* ============ Design Specs Page ============ */
.specs-hero {
  padding: 100px 20px 24px;
  background: linear-gradient(135deg, var(--ink-green) 0%, #2D3D2D 100%);
  color: #fff;
  position: relative;
  overflow: hidden;
}
.specs-hero::before {
  content: '设计规范';
  position: absolute;
  right: -20px;
  top: 50px;
  font-family: var(--font-serif);
  font-size: 60px;
  font-weight: 900;
  opacity: 0.05;
  white-space: nowrap;
}
.specs-hero-title {
  font-family: var(--font-serif);
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 4px;
}
.specs-hero-sub {
  font-size: 12px;
  opacity: 0.7;
}

.specs-section {
  padding: 20px 20px 4px;
}
.specs-section-title {
  font-family: var(--font-serif);
  font-size: 16px;
  font-weight: 700;
  color: var(--ink-green);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.specs-section-title::before {
  content: '';
  width: 2px;
  height: 14px;
  background: var(--cap-orange);
}

/* Color palette */
.color-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
}
.color-card {
  width: calc(50% - 5px);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  background: #fff;
}
.color-swatch {
  height: 60px;
}
.color-info {
  padding: 8px 10px;
}
.color-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-green);
  margin-bottom: 2px;
}
.color-hex {
  font-size: 10px;
  color: var(--ink-green-3);
  font-family: monospace;
}

/* Typography samples */
.typo-sample {
  background: #fff;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
}
.typo-sample-label {
  font-size: 10px;
  color: var(--ink-green-3);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.typo-sample-text {
  font-size: 16px;
  color: var(--ink-green);
}
.typo-sample-text.heading {
  font-family: var(--font-serif);
  font-size: 24px;
  font-weight: 700;
}

/* Spacing tokens */
.space-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
  background: #fff;
  border-radius: 10px;
  padding: 10px 12px;
}
.space-box {
  background: linear-gradient(135deg, var(--cap-orange), var(--cap-orange-dark));
  border-radius: 4px;
}
.space-label {
  font-size: 11px;
  color: var(--ink-green-3);
  flex: 1;
  text-align: right;
  font-family: monospace;
}

/* ============ API Docs Page ============ */
.api-hero {
  padding: 100px 20px 24px;
  background: linear-gradient(135deg, var(--rot-wood) 0%, var(--ink-green) 100%);
  color: #fff;
  position: relative;
}
.api-hero-title {
  font-family: var(--font-serif);
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 4px;
}
.api-hero-sub {
  font-size: 12px;
  opacity: 0.7;
}

.api-section {
  padding: 20px 20px 4px;
}
.api-section-title {
  font-family: var(--font-serif);
  font-size: 16px;
  font-weight: 700;
  color: var(--ink-green);
  margin-bottom: 12px;
}

.api-card {
  background: #fff;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
}
.api-card-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.api-method {
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 4px;
  text-transform: uppercase;
}
.api-method.get { background: rgba(74,107,58,0.15); color: var(--moss-green); }
.api-method.post { background: rgba(196,98,30,0.15); color: var(--cap-orange); }
.api-path {
  font-size: 12px;
  font-family: monospace;
  color: var(--ink-green);
  font-weight: 500;
}
.api-desc {
  font-size: 12px;
  color: var(--ink-green-3);
  margin-bottom: 8px;
  line-height: 1.6;
}
.api-params {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed rgba(30,42,30,0.08);
}
.api-param {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
}
.api-param-name {
  font-family: monospace;
  color: var(--rot-wood);
  font-weight: 600;
  min-width: 70px;
}
.api-param-type {
  color: var(--moss-green);
  font-family: monospace;
  font-size: 10px;
}
.api-param-desc {
  color: var(--ink-green-3);
  flex: 1;
}

.code-block {
  background: #1E2A1E;
  color: #B8D4A8;
  border-radius: 10px;
  padding: 12px;
  font-size: 11px;
  font-family: 'SFMono-Regular', Consolas, monospace;
  line-height: 1.6;
  overflow-x: auto;
  margin-bottom: 10px;
}
.code-block .k { color: #C4621E; }
.code-block .s { color: #6B8C55; }
.code-block .n { color: #E8B088; }

/* ============ Pull to Refresh ============ */
.pull-indicator {
  position: absolute;
  top: 50px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  pointer-events: none;
  opacity: 0;
  z-index: 5;
}
.pull-spinner {
  width: 24px;
  height: 24px;
  border: 2px solid var(--cap-orange);
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.pull-text {
  font-size: 11px;
  color: var(--ink-green-3);
}

/* ============ Action Sheet ============ */
.mask {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 200;
  animation: maskFadeIn 0.25s ease both;
}
@keyframes maskFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.action-sheet {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--spore-white);
  border-radius: 18px 18px 0 0;
  z-index: 201;
  animation: actionSheetUp 0.3s cubic-bezier(0.32, 0.72, 0, 1) both;
  padding-bottom: 28px;
}
@keyframes actionSheetUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.action-sheet-title {
  padding: 14px 20px;
  text-align: center;
  font-size: 12px;
  color: var(--ink-green-3);
  border-bottom: 1px solid rgba(30,42,30,0.06);
}
.action-sheet-item {
  padding: 16px 20px;
  text-align: center;
  font-size: 15px;
  color: var(--ink-green);
  cursor: pointer;
  border-bottom: 1px solid rgba(30,42,30,0.04);
  transition: background 0.15s;
}
.action-sheet-item:active { background: var(--spore-white-2); }
.action-sheet-item.danger { color: var(--danger); }
.action-sheet-cancel {
  padding: 16px 20px;
  text-align: center;
  font-size: 15px;
  color: var(--ink-green-2);
  cursor: pointer;
  margin-top: 6px;
  background: #fff;
}

/* ============ Skeleton Screen ============ */
.skeleton {
  background: linear-gradient(90deg, #E8E2D0 25%, #F0E9D6 50%, #E8E2D0 75%);
  background-size: 200% 100%;
  animation: skeletonShimmer 1.4s infinite;
  border-radius: 8px;
}
@keyframes skeletonShimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ============ Custom Cursor ============ */
.cursor-ring {
  position: fixed;
  width: 32px;
  height: 32px;
  border: 2px solid #fff;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  mix-blend-mode: difference;
  transition: width 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
              height 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
              border-color 0.2s,
              opacity 0.2s;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 12px rgba(255,255,255,0.5);
}
.cursor-ring.hovering {
  width: 48px;
  height: 48px;
  border-color: rgba(196,98,30,0.8);
  box-shadow: 0 0 20px rgba(196,98,30,0.6);
}
.cursor-dot {
  position: fixed;
  width: 6px;
  height: 6px;
  background: var(--cap-orange);
  border-radius: 50%;
  pointer-events: none;
  z-index: 10000;
  transform: translate(-50%, -50%);
  transition: transform 0.1s ease, width 0.2s, height 0.2s;
  box-shadow:
    0 0 8px var(--cap-orange),
    0 0 16px rgba(196,98,30,0.5);
}
.cursor-dot.clicking {
  transform: translate(-50%, -50%) scale(0.6);
}
.cursor-ripple {
  position: fixed;
  width: 32px;
  height: 32px;
  border: 2px solid var(--cap-orange);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%, -50%);
  animation: rippleOut 0.6s ease-out forwards;
}
@keyframes rippleOut {
  0% {
    width: 32px;
    height: 32px;
    opacity: 0.8;
  }
  100% {
    width: 80px;
    height: 80px;
    opacity: 0;
  }
}

/* ============ Scrollbar hidden utility ============ */
.hide-scrollbar::-webkit-scrollbar { display: none; }
.hide-scrollbar { scrollbar-width: none; }

/* ============ Toast ============ */
.toast {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(30,42,30,0.85);
  color: #fff;
  padding: 12px 20px;
  border-radius: 12px;
  font-size: 13px;
  z-index: 300;
  backdrop-filter: blur(10px);
  animation: toastIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  pointer-events: none;
}
@keyframes toastIn {
  from { opacity: 0; transform: translate(-50%, -40%) scale(0.9); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

/* ============ Mushroom cap icon animation ============ */
.cap-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.cap-icon svg {
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.cap-icon:hover svg {
  transform: scale(1.15) translateY(-2px);
}

/* ============ Floating action button ============ */
.fab {
  position: absolute;
  bottom: 100px;
  right: 16px;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--cap-orange-light), var(--cap-orange-dark));
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 20px rgba(196,98,30,0.4);
  cursor: pointer;
  z-index: 40;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.fab:active {
  transform: scale(0.9);
}
.fab::before {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 2px solid var(--cap-orange);
  opacity: 0.3;
  animation: fabPulse 2s ease-out infinite;
}
@keyframes fabPulse {
  0% { transform: scale(0.8); opacity: 0.5; }
  100% { transform: scale(1.3); opacity: 0; }
}

/* ============ Divider ============ */
.divider {
  height: 1px;
  background: rgba(30,42,30,0.06);
  margin: 8px 16px;
}

/* ============ Reduce Motion ============ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ============ Small screen adaptation ============ */
@media (max-width: 420px) {
  .phone {
    transform: scale(0.92);
    transform-origin: center;
  }
}
@media (max-width: 360px) {
  .phone {
    transform: scale(0.82);
  }
}

/* mushroom grow animation for page entry */
.mushroom-grow {
  animation: mushroomGrow 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;

// ==================== App Context ====================
const AppContext = createContext(null);

function AppProvider({ children }) {
  const [pageStack, setPageStack] = useState([{ name: 'home', params: {} }]);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  const showToast = useCallback((msg) => {
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setToast(msg);
    toastTimer.current = setTimeout(() => setToast(null), 1800);
  }, []);

  const pushPage = useCallback((name, params = {}) => {
    setPageStack(prev => [...prev, { name, params }]);
  }, []);

  const popPage = useCallback(() => {
    setPageStack(prev => {
      if (prev.length <= 1) return prev;
      return prev.slice(0, -1);
    });
  }, []);

  const switchTab = useCallback((tabName) => {
    if (!TAB_PAGES.includes(tabName)) return;
    setPageStack([{ name: tabName, params: {} }]);
  }, []);

  const currentPage = pageStack[pageStack.length - 1];
  const isTabPage = TAB_PAGES.includes(currentPage.name);

  const value = useMemo(() => ({
    pageStack, pushPage, popPage, switchTab,
    currentPage, isTabPage, showToast,
  }), [pageStack, currentPage, isTabPage, pushPage, popPage, switchTab, showToast]);

  return (
    <AppContext.Provider value={value}>
      {children}
      {toast && <div className="toast">{toast}</div>}
    </AppContext.Provider>
  );
}

function useApp() {

// ==================== Home Page ====================
function HomePage() {
  const { pushPage, showToast } = useApp();
  const [loading, setLoading] = useState(true);
  const [showActionSheet, setShowActionSheet] = useState(false);
  const scrollRef = useRef(null);
  const pullDistance = useRef(0);
  const isPulling = useRef(false);
  const [pullProgress, setPullProgress] = useState(0);
  const [refreshing, setRefreshing] = useState(false);

  // Skeleton loading
  useEffect(() => {
    const t = setTimeout(() => setLoading(false), 1200);
    return () => clearTimeout(t);
  }, []);

  // Pull to refresh - touch simulation with mouse
  useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;

    let startY = 0;
    let isTouch = false;

    const onStart = (e) => {
      if (el.scrollTop <= 0 && !refreshing) {
        startY = e.touches ? e.touches[0].clientY : e.clientY;
        isTouch = true;
        isPulling.current = true;
      }
    };
    const onMove = (e) => {
      if (!isTouch || !isPulling.current) return;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      const diff = y - startY;
      if (diff > 0 && el.scrollTop <= 0) {
        e.preventDefault && e.preventDefault();
        const damped = diff * 0.5;
        pullDistance.current = Math.min(damped, 80);
        setPullProgress(pullDistance.current / 80);
      }
    };
    const onEnd = () => {
      if (!isPulling.current) return;
      isPulling.current = false;
      isTouch = false;
      if (pullDistance.current > 60 && !refreshing) {
        setRefreshing(true);
        setPullProgress(1);
        setTimeout(() => {
          setRefreshing(false);
          pullDistance.current = 0;
          setPullProgress(0);
          showToast('刷新成功');
        }, 1500);
      } else {
        pullDistance.current = 0;
        setPullProgress(0);
      }
    };

    el.addEventListener('touchstart', onStart, { passive: true });
    el.addEventListener('touchmove', onMove, { passive: false });
    el.addEventListener('touchend', onEnd);
    // Mouse drag for desktop preview
    el.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);

    return () => {
      el.removeEventListener('touchstart', onStart);
      el.removeEventListener('touchmove', onMove);
      el.removeEventListener('touchend', onEnd);
      el.removeEventListener('mousedown', onStart);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onEnd);
    };
  }, [refreshing, showToast]);

  // Spore particles
  const spores = useMemo(() => {
    return Array.from({ length: 8 }, (_, i) => ({
      id: i,
      left: 10 + Math.random() * 80,
      bottom: 20 + Math.random() * 30,
      delay: Math.random() * 6,
      duration: 5 + Math.random() * 4,
      size: 3 + Math.random() * 3,
    }));
  }, []);

  const quickItems = [
    { icon: '🍄', label: '拍照识别', color: 'orange' },
    { icon: '📖', label: '图鉴', color: 'green' },
    { icon: '📍', label: '附近菌点', color: 'brown' },
    { icon: '📋', label: '采集记录', color: 'cream' },
  ];

  return (
    <div className="page page-enter">
      <div className="page-content" ref={scrollRef}>
        {/* Hero */}
        <div className="home-hero">
          <img className="home-hero-img" src={IMG.hero} alt="" />
          <div className="home-hero-overlay"></div>

          {/* Spores */}
          {spores.map(s => (
            <span
              key={s.id}
              className="spore-particle"
              style={{
                left: `${s.left}%`,
                bottom: `${s.bottom}%`,
                width: s.size,
                height: s.size,
                animationDelay: `${s.delay}s`,
                animationDuration: `${s.duration}s`,
              }}
            />
          ))}

          <div className="home-search" onClick={() => showToast('搜索功能')}>
            <SearchIcon />
            <span>搜索菌物名称...</span>
          </div>

          <div className="home-hero-content">
            <div className="home-hero-title">菌物图鉴</div>
            <div className="home-hero-sub">探索森林深处的奇妙菌物世界</div>
          </div>
        </div>

        {/* Quick Entry */}
        <div className="home-quick">
          {quickItems.map((item, i) => (
            <div
              key={i}
              className={`quick-item mushroom-grow stagger-${i + 1}`}
              onClick={() => {
                if (i === 1) { /* catalog */ }
                else showToast(item.label);
              }}
            >
              <div className={`quick-icon ${item.color}`}>
                <CapIcon size={20} />
              </div>
              <div className="quick-label">{item.label}</div>
            </div>
          ))}
        </div>

        {/* Season Section */}
        <div className="section-header">
          <div className="section-title">当季菌物</div>
          <div className="section-more" onClick={() => showToast('查看全部')}>查看全部 ›</div>
        </div>

        {/* Waterfall Card Grid */}
        {loading ? (
          <div className="waterfall">
            <SkeletonCard />
            <SkeletonCard />
            <SkeletonCard />
            <SkeletonCard />
          </div>
        ) : (
          <div className="waterfall">
            {MUSHROOMS.map((m, i) => (
              <div
                key={m.id}
                className={`mushroom-card mushroom-grow stagger-${(i % 8) + 1}`}
                onClick={() => pushPage('detail', { id: m.id })}
              >
                <div className="mushroom-card-img-wrap" style={{ aspectRatio: i % 2 === 0 ? '1/1' : '4/5' }}>
                  <img className="mushroom-card-img" src={m.img} alt={m.name} loading="lazy" />
                </div>
                <div className="mushroom-card-body">
                  <div className="mushroom-card-name">{m.name}</div>
                  <div className="mushroom-card-latin">{m.latin}</div>
                  <div className="mushroom-card-tags">
                    {m.tags.map(t => (
                      <span key={t} className={`mushroom-tag ${t}`}>
                        {t === 'edible' ? '可食' : t === 'medicinal' ? '药用' : t === 'premium' ? '名贵' : '有毒'}
                      </span>
                    ))}
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}

        <div style={{ height: 20 }}></div>
      </div>

      {/* Pull indicator */}
      <div
        className="pull-indicator"
        style={{
          opacity: refreshing ? 1 : pullProgress * 0.8,
          transform: `translateX(-50%) translateY(${pullDistance.current}px)`,
        }}
      >
        {refreshing ? (
          <div className="pull-spinner"></div>
        ) : (
          <svg width="24" height="24" viewBox="0 0 24 24" style={{ transform: `rotate(${pullProgress * 360}deg)` }}>
            <path d="M12 4v4m0 8v4M4 12h4m8 0h4M5.6 5.6l2.8 2.8m7.2 7.2 2.8 2.8M5.6 18.4l2.8-2.8m7.2-7.2 2.8-2.8"
              stroke="#C4621E" strokeWidth="2" strokeLinecap="round" opacity={pullProgress} />
          </svg>
        )}
        <div className="pull-text">{refreshing ? '正在刷新...' : pullProgress > 0.7 ? '释放刷新' : '下拉刷新'}</div>
      </div>

      {/* FAB */}
      <div className="fab" onClick={() => setShowActionSheet(true)}>
        <CameraIcon />
      </div>

      {showActionSheet && (
        <ActionSheet
          title="识别菌物"
          items={[
            { key: 'photo', label: '拍照识别' },
            { key: 'album', label: '从相册选择' },
            { key: 'manual', label: '手动录入' },
          ]}
          onClose={() => setShowActionSheet(false)}
          onSelect={(key) => {
            if (key === 'photo') showToast('打开相机...');
            else if (key === 'album') showToast('打开相册...');
            else showToast('手动录入');
          }}
        />
      )}
    </div>
  );
}

// ==================== Page Router ====================
function PageRouter() {
  const { currentPage, isTabPage } = useApp();
  const { name, params } = currentPage;

  let pageContent = null;
  let showTabBar = isTabPage;
  let navVariant = 'solid';
  let darkStatus = false;
  let navTitle = '';
  let showBack = currentPage.name !== 'home';

  switch (name) {
    case 'home':
      pageContent = <HomePage />;
      navTitle = '';
      darkStatus = true;
      showBack = false;
      break;
    case 'catalog':
      pageContent = <CatalogPage />;
      navTitle = '';
      darkStatus = false;
      showBack = false;
      break;
    case 'detail':
      pageContent = <DetailPage />;
      showTabBar = false;
      showBack = true;
      break;
    case 'collect':
      pageContent = <CollectPage />;
      navTitle = '';
      darkStatus = true;
      showBack = false;
      break;
    case 'profile':
      pageContent = <ProfilePage />;
      navTitle = '';
      darkStatus = true;
      showBack = false;
      break;
    case 'specs':
      pageContent = <SpecsPage />;
      navTitle = '设计规范';
      navVariant = 'transparent';
      darkStatus = true;
      showBack = true;
      showTabBar = false;
      break;
    case 'api':
      pageContent = <ApiPage />;
      navTitle = '接口文档';
      navVariant = 'transparent';
      darkStatus = true;
      showBack = true;
      showTabBar = false;
      break;
    default:
      pageContent = <HomePage />;
  }

  // For detail page, it manages its own nav/status
  const needsWrapperNav = name !== 'detail';

  return (
    <div className="pages">
      {/* Status bar and capsule shown for non-detail pages */}
      {needsWrapperNav && <StatusBar dark={darkStatus} />}
      {needsWrapperNav && <Capsule dark={darkStatus} />}

      {/* Page content */}
      {pageContent}

      {/* Tab bar */}
      {showTabBar && <TabBar />}
    </div>
  );
}

// ==================== Custom Cursor ====================
(function initCursor() {
  const ring = document.getElementById('cursorRing');
  const dot = document.getElementById('cursorDot');
  if (!ring || !dot) return;

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let ringX = mouseX;
  let ringY = mouseY;
  let rafId = null;
  let visible = false;
  let hovering = false;

  // Start at center
  ring.style.left = mouseX + 'px';
  ring.style.top = mouseY + 'px';
  dot.style.left = mouseX + 'px';
  dot.style.top = mouseY + 'px';

  const animate = () => {
    // Smooth follow for ring
    ringX += (mouseX - ringX) * 0.15;
    ringY += (mouseY - ringY) * 0.15;
    ring.style.transform = `translate(-50%, -50%) ${hovering ? 'scale(1)' : 'scale(1)'}`;
    ring.style.left = ringX + 'px';
    ring.style.top = ringY + 'px';
    // Dot follows directly
    dot.style.left = mouseX + 'px';
    dot.style.top = mouseY + 'px';
    rafId = requestAnimationFrame(animate);
  };

  const onMove = (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    if (!visible) {
      visible = true;
      ring.style.opacity = 1;
      dot.style.opacity = 1;
    }

    // Check hover
    const target = e.target;
    const isInteractive = target.closest('button, .quick-item, .mushroom-card, .tab-bar-item, .category-card, .swipe-item-content, .profile-menu-item, .profile-grid-item, .tab-chip, .bottom-bar-icon-btn, .bottom-bar-main-btn, .fab, .action-sheet-item, .home-search, .capsule-btn, .section-more, .nav-back');
    if (isInteractive && !hovering) {
      hovering = true;
      ring.classList.add('hovering');
    } else if (!isInteractive && hovering) {
      hovering = false;
      ring.classList.remove('hovering');
    }
  };

  const onClick = (e) => {
    // Ripple effect
    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);

    // Dot click
    dot.classList.add('clicking');
    setTimeout(() => dot.classList.remove('clicking'), 150);
  };

  const onVisibilityChange = () => {
    if (document.hidden && rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    } else if (!document.hidden && !rafId) {
      animate();
    }
  };

  window.addEventListener('mousemove', onMove);
  window.addEventListener('mousedown', onClick);
  document.addEventListener('visibilitychange', onVisibilityChange);

  // Start animation
  animate();
})();

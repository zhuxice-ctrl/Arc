<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="creative-medium" content="interactive-prototype" />
<title>Meteor Shower · V2 手机应用 UI</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;900&family=JetBrains+Mono:wght@400;500&display=swap" />

<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
  html,body{width:100%;min-height:100vh;overflow-x:hidden}
  body{
    background: radial-gradient(ellipse at 50% 0%, #141828 0%, #0B0E17 60%, #05070d 100%);
    color: #C0C5CE;
    font-family: 'Space Grotesk', 'Noto Serif SC', -apple-system, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 20px; min-height: 100vh;
    position: relative;
  }
  /* Ambient star field on page background */
  body::before{
    content:''; position: fixed; inset: 0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(1px 1px at 20px 30px, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 100px 200px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 300px 120px, #FF6B1A, transparent),
      radial-gradient(1px 1px at 500px 300px, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 700px 100px, rgba(192,197,206,0.6), transparent),
      radial-gradient(1.5px 1.5px at 900px 400px, #3DD68C, transparent),
      radial-gradient(1px 1px at 1200px 250px, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 150px 500px, rgba(255,255,255,0.3), transparent);
    background-size: 1200px 600px;
    opacity: 0.6;
  }
  .stage{ position: relative; z-index: 1; display:flex; align-items:center; gap:60px; }
  .page-title{
    position: fixed; top: 28px; left: 40px; z-index: 5; color: #C0C5CE;
    font-family: 'Space Grotesk', sans-serif; font-weight: 500;
    font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase;
    opacity: 0.6;
  }
  .page-title b{ color:#FF6B1A; font-weight: 600; margin-right:8px; }

  /* ───── Custom cursor ───── */
  .cursor-dot{
    position: fixed; top:0; left:0; width:8px; height:8px; border-radius:50%;
    background:#FF6B1A; pointer-events:none; z-index:2147483647;
    transform: translate(-50%,-50%); mix-blend-mode: screen;
    box-shadow: 0 0 10px #FF6B1A, 0 0 20px rgba(255,107,26,0.6);
    transition: width .18s cubic-bezier(.3,.7,.4,1), height .18s cubic-bezier(.3,.7,.4,1), background .2s;
  }
  .cursor-ring{
    position: fixed; top:0; left:0; width:36px; height:36px; border-radius:50%;
    border: 1.5px solid rgba(255,255,255,0.85); pointer-events:none; z-index:2147483646;
    transform: translate(-50%,-50%);
    box-shadow: 0 0 0 1px rgba(255,107,26,0.3), 0 0 12px rgba(255,255,255,0.2);
    transition: width .25s cubic-bezier(.3,.7,.4,1), height .25s cubic-bezier(.3,.7,.4,1),
                border-color .25s, background .25s;
  }
  .cursor-ring.hover{
    width: 56px; height:56px; border-color: #FF6B1A;
    background: rgba(255,107,26,0.08);
    box-shadow: 0 0 20px rgba(255,107,26,0.5);
  }
  .cursor-ring.click{
    width: 24px; height:24px; border-color: #3DD68C;
  }
  .cursor-ripple{
    position: fixed; width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid #FF6B1A; pointer-events: none; z-index: 2147483645;
    transform: translate(-50%,-50%);
    animation: ripple-expand .6s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes ripple-expand{
    0%{ width:10px; height:10px; opacity: 1;}
    100%{ width: 80px; height:80px; opacity:0; }
  }

  /* ───── Page transition ───── */
  .screen-wrap{
    position: relative; width: 100%; height: 100%;
    overflow: hidden;
  }
  .screen-enter{
    animation: screen-in .45s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes screen-in{
    from{ opacity:0; transform: translateY(14px) scale(.98); filter: blur(6px);}
    to{ opacity:1; transform: translateY(0) scale(1); filter: blur(0);}
  }

  /* scrollbar inside phone */
  .app-scroll::-webkit-scrollbar{ width: 0; height: 0;}
  .app-scroll{ scrollbar-width: none;}

  /* Shared glow */
  .glow-orange{ box-shadow: 0 0 24px rgba(255,107,26,0.35), 0 0 8px rgba(255,107,26,0.5);}
  .glow-green{ box-shadow: 0 0 24px rgba(61,214,140,0.3), 0 0 8px rgba(61,214,140,0.45);}
  .glow-amber{ box-shadow: 0 0 24px rgba(232,165,71,0.3), 0 0 8px rgba(232,165,71,0.45);}

  /* glass card recipe */
  .glass{
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.08);
  }

  @media (prefers-reduced-motion: reduce){
    .screen-enter{ animation: none;}
    .cursor-dot,.cursor-ring,.cursor-ripple{ display:none !important;}
    *{ animation-duration: .001ms !important; animation-iteration-count: 1 !important;}
  }

  /* tab nav at bottom */
  .tabbar{
    position:absolute; left: 12px; right: 12px; bottom: 12px; z-index: 40;
    height: 68px; border-radius: 24px;
    background: linear-gradient(180deg, rgba(11,14,23,0.75), rgba(11,14,23,0.9));
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: space-around;
    padding: 0 10px;
  }
  .tab-item{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 3px; color: rgba(192,197,206,0.5); font-size: 10px;
    font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.05em;
    cursor: pointer; transition: color .25s;
    position: relative;
  }
  .tab-item.active{ color:#FF6B1A; }
  .tab-item svg{ width: 22px; height: 22px; transition: transform .25s cubic-bezier(.3,1.6,.4,1); }
  .tab-item.active svg{ transform: translateY(-2px) scale(1.08); }
  .tab-indicator{
    position: absolute; top: -8px; width: 4px; height: 4px; border-radius: 50%;
    background: #FF6B1A; box-shadow: 0 0 10px #FF6B1A;
  }

  /* typewriter caret */
  .caret::after{
    content:'|'; color:#FF6B1A; margin-left: 2px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity:0;}}

  /* shimmer */
  @keyframes shimmer{
    0%{ background-position: -200% 0;}
    100%{ background-position: 200% 0;}
  }
  .shimmer{
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.15) 50%, transparent 100%);
    background-size: 200% 100%;
    animation: shimmer 3s ease-in-out infinite;
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }

  /* page flip indicator */
  .page-pager{
    position: fixed; left: 40px; top: 50%; transform: translateY(-50%);
    display:flex; flex-direction:column; gap:10px; z-index:5;
  }
  .page-dot{
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(192,197,206,0.25);
    cursor: pointer; transition: all .3s cubic-bezier(.3,.7,.4,1);
  }
  .page-dot.active{
    background:#FF6B1A; transform: scale(1.6);
    box-shadow: 0 0 8px #FF6B1A;
  }

  .device-label{
    position: fixed; right: 40px; bottom: 28px; z-index: 5;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: rgba(192,197,206,0.4); letter-spacing: 0.1em;
  }
  .device-label b{ color: #3DD68C; font-weight: 500;}
</style>
</head>
<body>
<div class="page-title"><b>V2</b> Meteor Shower · Astronomy App</div>

<div class="page-pager" id="pagePager"></div>

<div class="stage">
  <div id="root"></div>
</div>

<div class="device-label">MeteorShower <b>v2.1.0</b> · build 0816-nightly</div>

<script type="text/babel">
/* ============================================================
   TWEAK DEFAULTS — editable via panel & persisted
   ============================================================ */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "particleDensity": 60,
  "accentMood": "aurora",
  "meteorSpeed": 1,
  "glowIntensity": 0.8,
  "cardGlass": true,
  "ambientStars": true,
  "fontScale": 1,
  "cursorEnabled": true
}/*EDITMODE-END*/;

const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ============================================================
   UTILITIES
   ============================================================ */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);

// Hook for RAF loop respecting visibility & cleanup
function useRAF(callback, active = true) {
  const cbRef = useRef(callback);
  cbRef.current = callback;
  const rafRef = useRef(0);
  useEffect(() => {
    if (!active) return;
    let running = true;
    const tick = () => {
      if (!running) return;
      cbRef.current && cbRef.current();
      rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);
    const onVis = () => {
      if (document.hidden) {
        cancelAnimationFrame(rafRef.current);
      } else {
        rafRef.current = requestAnimationFrame(tick);
      }
    };
    document.addEventListener('visibilitychange', onVis);
    return () => {
      running = false;
      cancelAnimationFrame(rafRef.current);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, [active]);
}

/* ============================================================
   CUSTOM CURSOR
   ============================================================ */
function CustomCursor({ enabled = true, accent = '#FF6B1A' }) {
  const dotRef = useRef(null);
  const ringRef = useRef(null);
  const ripplesRef = useRef([]);
  const pos = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const ringPos = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const hoverState = useRef(0); // 0=idle,1=hover,2=click
  const reduced = useRef(false);

  useEffect(() => {
    reduced.current = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced.current) return;
    // center immediately
    if (dotRef.current) {
      dotRef.current.style.left = pos.current.x + 'px';
      dotRef.current.style.top = pos.current.y + 'px';
    }
    if (ringRef.current) {
      ringRef.current.style.left = ringPos.current.x + 'px';
      ringRef.current.style.top = ringPos.current.y + 'px';
    }
  }, []);

  const tick = useCallback(() => {
    // lerp ring toward dot for trailing feel
    ringPos.current.x = lerp(ringPos.current.x, pos.current.x, 0.18);
    ringPos.current.y = lerp(ringPos.current.y, pos.current.y, 0.18);
    if (ringRef.current) {
      ringRef.current.style.transform = `translate(${ringPos.current.x}px, ${ringPos.current.y}px) translate(-50%,-50%)`;
    }
    if (dotRef.current) {
      dotRef.current.style.transform = `translate(${pos.current.x}px, ${pos.current.y}px) translate(-50%,-50%)`;
    }
  }, []);

  useRAF(tick, enabled && !reduced.current);

  useEffect(() => {
    if (!enabled || reduced.current) return;
    const onMove = (e) => {
      pos.current.x = e.clientX;
      pos.current.y = e.clientY;
      // detect interactive elements
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const isInteractive = !!(el && el.closest && el.closest('[data-cursor="hover"], button, a, .interactive, [role="button"]'));
      if (ringRef.current) {
        ringRef.current.classList.toggle('hover', isInteractive && hoverState.current !== 2);
      }
    };
    const onDown = (e) => {
      if (ringRef.current) ringRef.current.classList.add('click');
      hoverState.current = 2;
      // spawn ripple
      const r = document.createElement('div');
      r.className = 'cursor-ripple';
      r.style.left = e.clientX + 'px';
      r.style.top = e.clientY + 'px';
      document.body.appendChild(r);
      setTimeout(() => r.remove(), 650);
    };
    const onUp = () => {
      if (ringRef.current) ringRef.current.classList.remove('click');
      hoverState.current = 0;
      setTimeout(() => {
        const el = document.elementFromPoint(pos.current.x, pos.current.y);
        const isInteractive = !!(el && el.closest && el.closest('[data-cursor="hover"], button, a, .interactive, [role="button"]'));
        if (ringRef.current) ringRef.current.classList.toggle('hover', isInteractive);
      }, 50);
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mousedown', onDown);
    window.addEventListener('mouseup', onUp);
    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mousedown', onDown);
      window.removeEventListener('mouseup', onUp);
    };
  }, [enabled]);

  if (!enabled || reduced.current) return null;
  return (
    <>
      <div ref={ringRef} className="cursor-ring" />
      <div ref={dotRef} className="cursor-dot" />
    </>
  );
}

/* ============================================================
   STAR / METEOR PARTICLE FIELD (canvas, inside each screen)
   ============================================================ */
function StarField({ density = 60, meteorSpeed = 1, glow = 0.8, variant = 'default' }) {
  const canvasRef = useRef(null);
  const stateRef = useRef({ stars: [], meteors: [], t: 0 });

  useEffect(() => {
    const cvs = canvasRef.current;
    if (!cvs) return;
    const ctx = cvs.getContext('2d');
    const w = cvs.width = cvs.offsetWidth * 2;
    const h = cvs.height = cvs.offsetHeight * 2;

    // Build stars — different distributions per variant
    const stars = [];
    const n = Math.floor(density * (w / 800) * (h / 800));
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: rand(0.4, 2.2),
        baseA: rand(0.3, 1),
        twinkleSpeed: rand(0.5, 2.5),
        twinklePhase: rand(0, Math.PI * 2),
        color: variant === 'warm'
          ? ['#FF6B1A', '#E8A547', '#ffffff'][Math.floor(rand(0, 3))]
          : variant === 'aurora'
          ? ['#3DD68C', '#C0C5CE', '#ffffff'][Math.floor(rand(0, 3))]
          : ['#ffffff', '#C0C5CE', '#FF6B1A'][Math.floor(rand(0, 3))],
      });
    }
    stateRef.current.stars = stars;

    // Initial meteors
    const meteors = [];
    for (let i = 0; i < 3; i++) {
      meteors.push(spawnMeteor(w, h, true));
    }
    stateRef.current.meteors = meteors;
  }, [density, variant]);

  const tick = useCallback(() => {
    const cvs = canvasRef.current;
    if (!cvs) return;
    const ctx = cvs.getContext('2d');
    const w = cvs.width, h = cvs.height;
    const s = stateRef.current;
    s.t += 0.016;

    ctx.clearRect(0, 0, w, h);

    // draw stars with twinkle
    for (const st of s.stars) {
      const a = st.baseA * (0.55 + 0.45 * Math.sin(s.t * st.twinkleSpeed + st.twinklePhase));
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fillStyle = st.color;
      ctx.globalAlpha = a;
      ctx.fill();
      // soft glow for brighter stars
      if (st.r > 1.5 && glow > 0) {
        const g = ctx.createRadialGradient(st.x, st.y, 0, st.x, st.y, st.r * 8 * glow);
        g.addColorStop(0, st.color);
        g.addColorStop(1, 'transparent');
        ctx.globalAlpha = a * 0.35 * glow;
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(st.x, st.y, st.r * 8 * glow, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // meteors
    for (let i = s.meteors.length - 1; i >= 0; i--) {
      const m = s.meteors[i];
      m.x += m.vx * meteorSpeed;
      m.y += m.vy * meteorSpeed;
      m.life -= 0.016;
      // trail — draw line from past to present
      const tailX = m.x - m.vx * 30;
      const tailY = m.y - m.vy * 30;
      const grad = ctx.createLinearGradient(tailX, tailY, m.x, m.y);
      grad.addColorStop(0, 'transparent');
      grad.addColorStop(0.6, m.color + '66');
      grad.addColorStop(1, m.color);
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(tailX, tailY);
      ctx.lineTo(m.x, m.y);
      ctx.stroke();
      // head glow
      if (glow > 0) {
        const g2 = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 12 * glow);
        g2.addColorStop(0, m.color);
        g2.addColorStop(1, 'transparent');
        ctx.globalAlpha = 0.8 * glow;
        ctx.fillStyle = g2;
        ctx.beginPath();
        ctx.arc(m.x, m.y, 12 * glow, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      // head dot
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(m.x, m.y, 1.8, 0, Math.PI * 2);
      ctx.fill();

      if (m.life <= 0 || m.x > w + 100 || m.y > h + 100) {
        s.meteors[i] = spawnMeteor(w, h);
      }
    }
  }, [meteorSpeed, glow]);

  useRAF(tick);

  function spawnMeteor(w, h, randomY = false) {
    const angle = rand(Math.PI / 5, Math.PI / 3.2); // ~20-35deg
    const speed = rand(4, 10);
    const colors = ['#FF6B1A', '#E8A547', '#3DD68C', '#C0C5CE'];
    return {
      x: rand(-w * 0.3, w * 0.8),
      y: randomY ? rand(-h * 0.3, h * 0.5) : -rand(20, 200),
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      color: colors[Math.floor(rand(0, colors.length))],
      life: rand(1.2, 3),
    };
  }

  return (
    <canvas ref={canvasRef}
      style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none', zIndex: 0 }}
    />
  );
}

/* ============================================================
   IOS DEVICE FRAME (inline version of ios-frame.jsx core)
   ============================================================ */
function IOSDevice({ children, width = 390, height = 844, dark = true }) {
  return (
    <div style={{
      width, height, borderRadius: 52, overflow: 'hidden',
      position: 'relative',
      background: '#0a0c12',
      border: '1px solid rgba(255,255,255,0.08)',
      boxShadow: '0 30px 80px rgba(0,0,0,0.7), 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08)',
      fontFamily: 'Space Grotesk, -apple-system, system-ui, sans-serif',
      '--ios-safe-top': '54px',
      '--ios-safe-bottom': '34px',
    }}>
      {/* side buttons */}
      <div style={{ position:'absolute', left:-2, top:110, width:3, height:36, borderRadius:'0 2px 2px 0', background:'#1a1d28' }}/>
      <div style={{ position:'absolute', left:-2, top:165, width:3, height:60, borderRadius:'0 2px 2px 0', background:'#1a1d28' }}/>
      <div style={{ position:'absolute', right:-2, top:150, width:3, height:90, borderRadius:'2px 0 0 2px', background:'#1a1d28' }}/>

      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 110, height: 34, borderRadius: 20, background: '#000', zIndex: 60,
        boxShadow: 'inset 0 1px 1px rgba(255,255,255,0.08)',
      }} />

      {/* status bar */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 50, pointerEvents: 'none' }}>
        <IOSStatusBar dark={dark} />
      </div>

      {/* content */}
      <div style={{ position: 'absolute', inset: 0, isolation: 'isolate' }}>
        {children}
      </div>

      {/* home indicator */}
      <div style={{
        position: 'absolute', bottom: 6, left: 0, right: 0, zIndex: 70,
        height: 22, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        pointerEvents: 'none',
      }}>
        <div style={{
          width: 130, height: 4.5, borderRadius: 100,
          background: 'rgba(255,255,255,0.5)',
        }} />
      </div>
    </div>
  );
}

function IOSStatusBar({ dark = true }) {
  const c = dark ? '#fff' : '#000';
  const [time, setTime] = useState('21:41');
  useEffect(() => {
    const t = setInterval(() => {
      const d = new Date();
      const h = String(d.getHours()).padStart(2,'0');
      const m = String(d.getMinutes()).padStart(2,'0');
      setTime(`${h}:${m}`);
    }, 30000);
    return () => clearInterval(t);
  }, []);
  return (
    <div style={{
      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      padding: '20px 28px 16px', boxSizing: 'border-box',
      width: '100%', color: c,
    }}>
      <span style={{ fontSize: 15, fontWeight: 600, letterSpacing: 0.2, fontFamily: 'Space Grotesk' }}>{time}</span>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
        {/* signal */}
        <svg width="17" height="11" viewBox="0 0 17 11" fill={c}>
          <rect x="0" y="7" width="3" height="4" rx="0.8" opacity="0.9"/>
          <rect x="4.7" y="4.5" width="3" height="6.5" rx="0.8" opacity="0.9"/>
          <rect x="9.4" y="2" width="3" height="9" rx="0.8" opacity="0.9"/>
          <rect x="14" y="0" width="3" height="11" rx="0.8" opacity="0.9"/>
        </svg>
        {/* wifi */}

/* ============================================================
   TYPEWRITER HOOK
   ============================================================ */
function useTypewriter(text, speed = 40, delay = 0) {
  const [shown, setShown] = useState('');
  useEffect(() => {
    setShown('');
    let i = 0;
    let t;
    const start = setTimeout(() => {
      t = setInterval(() => {
        i++;
        setShown(text.slice(0, i));
        if (i >= text.length) clearInterval(t);
      }, speed);
    }, delay);
    return () => { clearTimeout(start); clearInterval(t); };
  }, [text, speed, delay]);
  return shown;
}

/* ============================================================
   COUNT-UP HOOK (spring-like ease out)
   ============================================================ */
function useCountUp(target, duration = 1500, startDelay = 0) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    let start = 0;
    let raf;
    const begin = setTimeout(() => {
      const t0 = performance.now();
      const step = (t) => {
        const p = Math.min(1, (t - t0) / duration);
        // easeOutCubic
        const e = 1 - Math.pow(1 - p, 3);
        setVal(Math.round(start + (target - start) * e));
        if (p < 1) raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
    }, startDelay);
    return () => { clearTimeout(begin); cancelAnimationFrame(raf); };
  }, [target, duration, startDelay]);
  return val;
}

}

/* ============================================================

function MapScreen({ t }) {
  const mapRef = useRef(null);
  const tilt = useRef({ x: 0, y: 0 });
  const [drawer, setDrawer] = useState(false);

  const onMove = (e) => {
    const r = mapRef.current?.getBoundingClientRect();
    if (!r) return;
    const px = (e.clientX - r.left) / r.width - 0.5;
    const py = (e.clientY - r.top) / r.height - 0.5;
    tilt.current.x = -py * 12;
    tilt.current.y = px * 12;
    if (mapRef.current) {
      mapRef.current.style.transform = `perspective(1000px) rotateX(${tilt.current.x}deg) rotateY(${tilt.current.y}deg)`;
    }

  const onLeave = () => {
    tilt.current.x = 0; tilt.current.y = 0;
    if (mapRef.current) mapRef.current.style.transform = 'perspective(1000px) rotateX(0) rotateY(0)';

function RingStat({ value, max, label, color, unit }) {
  const ref = useRef(null);
  const r = 34;
  const circ = 2 * Math.PI * r;
  const pct = Math.min(1, value / max);
  const dash = circ * (1 - pct);

  return (
    <div style={{
      borderRadius: 18, padding: '16px 10px',
      background: 'rgba(255,255,255,0.04)',
      border: '1px solid rgba(255,255,255,0.06)',
      display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8,
      backdropFilter: 'blur(12px)',
    }}>
      <div style={{ position: 'relative', width: 76, height: 76 }}>
        <svg viewBox="0 0 80 80" style={{ width: '100%', height: '100%', transform: 'rotate(-90deg)' }}>
          <circle cx="40" cy="40" r={r} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="6"/>
          <circle ref={ref} cx="40" cy="40" r={r} fill="none" stroke={color} strokeWidth="6"
                  strokeLinecap="round"
                  strokeDasharray={circ}
                  strokeDashoffset={dash}
                  style={{
                    transition: 'stroke-dashoffset 1.8s cubic-bezier(.2,.8,.2,1)',
                    filter: `drop-shadow(0 0 4px ${color})`,
                  }}/>
        </svg>
        <div style={{
          position: 'absolute', inset: 0,
          display: 'flex', flexDirection: 'column',
          alignItems: 'center', justifyContent: 'center',
        }}>
          <div style={{
            fontSize: 18, fontWeight: 700, color: '#fff',
            fontFamily: 'Space Grotesk', letterSpacing: -0.5,
          }}>{Math.round(value)}</div>
          <div style={{ fontSize: 9, color: 'rgba(192,197,206,0.5)' }}>{unit}</div>
        </div>
      </div>
      <div style={{ fontSize: 11, color: 'rgba(192,197,206,0.6)' }}>{label}</div>
    </div>
  );
}

function shadeColor(hex, percent) {
  const f = parseInt(hex.slice(1), 16);
  const t = percent < 0 ? 0 : 255;
  const p = Math.abs(percent) / 100;
  const R = f >> 16;
  const G = f >> 8 & 0x00FF;
  const B = f & 0x0000FF;
  return '#' + (
    0x1000000 +
    (Math.round((t - R) * p) + R) * 0x10000 +
    (Math.round((t - G) * p) + G) * 0x100 +
    (Math.round((t - B) * p) + B)
  ).toString(16).slice(1);
}

              <div style={{
                width: 8, height: 8, borderRadius: '50%', background: '#FF6B1A',
                boxShadow: '0 0 8px #FF6B1A',
              }}/>
              <span style={{ fontSize: 14, fontWeight: 600, color: '#fff' }}>风格</span>
              <span style={{ fontSize: 10, color: 'rgba(192,197,206,0.4)', fontFamily: 'JetBrains Mono' }}>v2.1</span>
            </div>
            <button onClick={dismiss} data-cursor="hover"
                    style={{
                      width: 24, height: 24, borderRadius: 6,
                      background: 'rgba(255,255,255,0.06)',
                      border: '1px solid rgba(255,255,255,0.08)',
                      color: '#C0C5CE', cursor: 'pointer', fontSize: 12,
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                    }}>✕</button>
          </div>

          {/* body */}
          <div style={{
            padding: '14px 16px 16px', overflowY: 'auto', flex: 1,
            display: 'flex', flexDirection: 'column', gap: 16,
          }}>
            {/* section label */}
            <div style={{ fontSize: 10, color: 'rgba(192,197,206,0.4)', letterSpacing: 1.5, textTransform: 'uppercase' }}>
              氛围
            </div>

            {/* particle density slider */}
            <TweakSlider label="星辰密度" value={t.particleDensity} min={10} max={150} unit="%"
                         onChange={(v) => setTweak('particleDensity', v)}/>
            <TweakSlider label="流星速度" value={t.meteorSpeed} min={0.2} max={2.5} step={0.1} unit="x"
                         onChange={(v) => setTweak('meteorSpeed', v)}/>
            <TweakSlider label="辉光强度" value={t.glowIntensity} min={0} max={1.5} step={0.1} unit=""
                         onChange={(v) => setTweak('glowIntensity', v)}/>

            <div style={{ fontSize: 10, color: 'rgba(192,197,206,0.4)', letterSpacing: 1.5, textTransform: 'uppercase', paddingTop: 4 }}>
              主题
            </div>

            {/* mood radio */}
            <TweakRadio label="色调氛围" value={t.accentMood}
                        options={[
                          { value: 'aurora', label: '极光' },
                          { value: 'warm', label: '暖焰' },
                          { value: 'default', label: '深空' },
                        ]}
                        onChange={(v) => setTweak('accentMood', v)}/>

            {/* toggles */}
            <TweakToggle label="毛玻璃卡片" value={t.cardGlass}
                         onChange={(v) => setTweak('cardGlass', v)}/>
            <TweakToggle label="背景星辰" value={t.ambientStars}
                         onChange={(v) => setTweak('ambientStars', v)}/>
            <TweakToggle label="自定义光标" value={t.cursorEnabled}
                         onChange={(v) => setTweak('cursorEnabled', v)}/>

            {/* font scale */}
            <TweakSlider label="字体缩放" value={t.fontScale} min={0.8} max={1.3} step={0.05} unit="x"
                         onChange={(v) => setTweak('fontScale', v)}/>

            {/* reset button */}
            <div style={{ paddingTop: 4, display: 'flex', gap: 8 }}>
              <button data-cursor="hover" onClick={() => {
                Object.entries(TWEAK_DEFAULTS).forEach(([k, v]) => setTweak(k, v));
              }}
                style={{
                  flex: 1, height: 34, borderRadius: 10,
                  background: 'rgba(255,107,26,0.15)',
                  border: '1px solid rgba(255,107,26,0.3)',
                  color: '#FF6B1A', fontSize: 12, fontWeight: 500,
                  cursor: 'pointer',
                }}>重置默认</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

function TweakSlider({ label, value, min, max, step = 1, unit = '', onChange }) {
  const pct = ((value - min) / (max - min)) * 100;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <span style={{ fontSize: 12, color: '#C0C5CE' }}>{label}</span>
        <span style={{ fontSize: 11, color: '#FF6B1A', fontFamily: 'JetBrains Mono' }}>
          {typeof value === 'number' && step < 1 ? value.toFixed(2) : value}{unit}
        </span>
      </div>
      <div style={{
        position: 'relative', height: 4, borderRadius: 2,
        background: 'rgba(255,255,255,0.08)',
      }}>
        <div style={{
          position: 'absolute', left: 0, top: 0, bottom: 0,
          width: `${pct}%`,
          borderRadius: 2,
          background: 'linear-gradient(90deg, #FF6B1A, #E8A547)',
          boxShadow: '0 0 8px rgba(255,107,26,0.4)',
        }}/>
        <input type="range" min={min} max={max} step={step} value={value}
               onChange={(e) => onChange(Number(e.target.value))}
               style={{
                 position: 'absolute', inset: 0, width: '100%', margin: 0,
                 opacity: 0, cursor: 'pointer',
               }}/>
        <div style={{
          position: 'absolute', top: '50%', left: `${pct}%`,
          transform: 'translate(-50%, -50%)',
          width: 14, height: 14, borderRadius: '50%',
          background: '#fff',
          boxShadow: '0 2px 6px rgba(0,0,0,0.3), 0 0 0 2px rgba(255,107,26,0.4)',
          pointerEvents: 'none',
        }}/>
      </div>
    </div>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
      <span style={{ fontSize: 12, color: '#C0C5CE' }}>{label}</span>
      <button data-cursor="hover" onClick={() => onChange(!value)}
              style={{
                width: 36, height: 20, borderRadius: 20,
                background: value ? 'linear-gradient(135deg, #FF6B1A, #E8A547)' : 'rgba(255,255,255,0.1)',
                border: 'none', position: 'relative', cursor: 'pointer',
                transition: 'all .25s',
                boxShadow: value ? '0 2px 8px rgba(255,107,26,0.4)' : 'none',
              }}>
        <div style={{
          position: 'absolute', top: 2,
          left: value ? 18 : 2,
          width: 16, height: 16, borderRadius: '50%',
          background: '#fff',
          transition: 'left .25s cubic-bezier(.3,1.6,.4,1)',
        }}/>
      </button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      <span style={{ fontSize: 12, color: '#C0C5CE' }}>{label}</span>
      <div style={{
        display: 'flex', gap: 4, padding: 3,
        borderRadius: 10,
        background: 'rgba(255,255,255,0.04)',
        border: '1px solid rgba(255,255,255,0.06)',
      }}>
        {options.map((o, i) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          const active = value === v;
          return (
            <button key={i} data-cursor="hover" onClick={() => onChange(v)}
                    style={{
                      flex: 1, padding: '6px 0', fontSize: 11,
                      borderRadius: 7, border: 'none',
                      background: active ? 'rgba(255,107,26,0.2)' : 'transparent',
                      color: active ? '#FF6B1A' : 'rgba(192,197,206,0.6)',
                      fontWeight: active ? 600 : 400,
                      cursor: 'pointer',
                      transition: 'all .2s',
                    }}>{l}</button>
          );
        })}
      </div>
    </div>
  );
}

/* ============================================================
   APP ROOT
   ============================================================ */
function App() {
  const [tab, setTab] = useState('home');
  const [t, setTweakInner] = React.useState(TWEAK_DEFAULTS);

  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setTweakInner((prev) => ({ ...prev, ...edits }));
    window.parent?.postMessage({ type: 'miaoda:tweaks:set-keys', edits }, '*');
  }, []);

  const pages = [
    { key: 'home', label: '首页', icon: Icon.Home },
    { key: 'gallery', label: '画廊', icon: Icon.Gallery },
    { key: 'log', label: '日志', icon: Icon.Log },
    { key: 'map', label: '星图', icon: Icon.Map },
    { key: 'planner', label: '计划', icon: Icon.Calendar },
    { key: 'profile', label: '我的', icon: Icon.Profile },
    { key: 'design', label: '规范', icon: Icon.Book },
    { key: 'api', label: '接口', icon: Icon.Code },
  ];

  const renderPage = () => {
    switch (tab) {
      case 'home': return <HomeScreen key="home" t={t} />;
      case 'gallery': return <GalleryScreen key="gallery" t={t} />;
      case 'log': return <LogScreen key="log" t={t} />;
      case 'map': return <MapScreen key="map" t={t} />;
      case 'planner': return <PlannerScreen key="planner" t={t} />;
      case 'profile': return <ProfileScreen key="profile" t={t} />;
      case 'design': return <DesignScreen key="design" t={t} />;
      case 'api': return <ApiScreen key="api" t={t} />;
      default: return <HomeScreen key="home" t={t} />;
    }
  };

  // Update page pager dots
  useEffect(() => {
    const pager = document.getElementById('pagePager');
    if (!pager) return;
    pager.innerHTML = '';
    pages.forEach((p, i) => {
      const d = document.createElement('div');
      d.className = 'page-dot' + (tab === p.key ? ' active' : '');
      d.title = p.label;
      d.onclick = () => setTab(p.key);
      pager.appendChild(d);
    });
  }, [tab]);

  // upgrade availability
  useEffect(() => {
    const announce = () => {
      window.parent?.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    };
    announce();
    if (document.readyState !== 'complete') window.addEventListener('load', announce, { once: true });
  }, []);

  // pass through ambient star tweak to body
  useEffect(() => {
    document.body.style.setProperty('--ambient-opacity', t.ambientStars ? '0.6' : '0');
    const beforeStyle = document.querySelector('style');
    if (t.ambientStars === false) {
      document.body.style.setProperty('background-image', 'none');
    } else {
      document.body.style.backgroundImage = '';
    }
  }, [t.ambientStars]);

  return (
    <div style={{ position: 'relative' }}>
      <CustomCursor enabled={t.cursorEnabled} accent="#FF6B1A"/>

      <div style={{
        fontSize: `${t.fontScale * 16}px`,
      }}>
        <IOSDevice dark width={390} height={844}>
          <div className="screen-wrap" style={{
            fontSize: `${1 / t.fontScale}rem`,
          }}>
            {renderPage()}
          </div>

          {/* bottom tab bar */}
          <div className="tabbar">
            {pages.slice(0, 5).map((p) => (
              <div key={p.key} className={'tab-item' + (tab === p.key ? ' active' : '')}
                   data-cursor="hover"
                   onClick={() => setTab(p.key)}>
                {tab === p.key && <div className="tab-indicator"/>}
                <p.icon style={{ width: 22, height: 22 }}/>
                <span>{p.label}</span>
              </div>
            ))}
          </div>
        </IOSDevice>
      </div>

      {/* page list on the right */}
      <div style={{
        position: 'absolute', left: 430, top: 80,
        display: 'flex', flexDirection: 'column', gap: 4,
        width: 160,
      }}>
        <div style={{
          fontSize: 10, color: 'rgba(192,197,206,0.4)',
          letterSpacing: 2, textTransform: 'uppercase',
          marginBottom: 8, paddingLeft: 4,
        }}>Pages · 8</div>
        {pages.map((p, i) => (
          <div key={p.key} data-cursor="hover" onClick={() => setTab(p.key)}
               style={{
                 display: 'flex', alignItems: 'center', gap: 10,
                 padding: '8px 12px', borderRadius: 10,
                 background: tab === p.key ? 'rgba(255,107,26,0.12)' : 'transparent',
                 border: `1px solid ${tab === p.key ? 'rgba(255,107,26,0.25)' : 'transparent'}`,
                 color: tab === p.key ? '#FF6B1A' : 'rgba(192,197,206,0.5)',
                 fontSize: 12, fontWeight: tab === p.key ? 600 : 400,
                 cursor: 'pointer',
                 transition: 'all .25s',
               }}>
            <span style={{
              fontSize: 10, fontFamily: 'JetBrains Mono',
              color: tab === p.key ? '#FF6B1A' : 'rgba(192,197,206,0.3)',
              width: 20,
            }}>{String(i+1).padStart(2,'0')}</span>
            <p.icon style={{ width: 16, height: 16 }}/>
            <span style={{ flex: 1 }}>{p.label}</span>
          </div>
        ))}
      </div>

      <ThemeTweaks t={t} setTweak={setTweak}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

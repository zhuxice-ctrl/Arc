<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="creative-medium" content="interactive-prototype" />
<title>邻里换物 · 微信小程序 V2</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" />
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  /* ============ RESET & BASE ============ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #1a1a1a;
    color: #2c2c2c;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
  img { display: block; max-width: 100%; }
  ul, ol { list-style: none; }
  input, textarea { font-family: inherit; outline: none; border: none; background: none; }

  /* ============ DESIGN TOKENS ============ */
  :root {
    --sage: #7a9e7e;
    --sage-light: #a5c4a8;
    --sage-dark: #5c7d60;
    --warm-white: #f5f0e6;
    --cream: #ebe4d4;
    --terracotta: #c17a54;
    --terracotta-light: #d9a07d;
    --terracotta-dark: #a35f3c;
    --charcoal: #2c2c2c;
    --charcoal-soft: #4a4a4a;
    --fog: #e8e5df;
    --fog-dark: #d4d0c8;
    --white: #ffffff;
    --shadow-sm: 0 2px 8px rgba(44,44,44,0.06);
    --shadow-md: 0 6px 20px rgba(44,44,44,0.10);
    --shadow-lg: 0 12px 36px rgba(44,44,44,0.14);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 24px;
    --safe-bottom: 34px;
    --nav-h: 44px;
    --status-h: 44px;
    --tabbar-h: 56px;
  }

  /* ============ STAGE LAYOUT ============ */
  .stage {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at 20% 20%, #2a2a2a 0%, #121212 70%);
    padding: 20px;
  }

  /* ============ PHONE FRAME ============ */
  .phone-frame {
    position: relative;
    width: 375px;
    height: 812px;
    background: #0a0a0a;
    border-radius: 48px;
    padding: 12px;
    box-shadow:
      0 40px 80px rgba(0,0,0,0.6),
      0 0 0 1px rgba(255,255,255,0.06) inset;
    flex-shrink: 0;
  }
  .phone-screen {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 38px;
    overflow: hidden;
    background: var(--warm-white);
  }

  /* Status bar */
  .status-bar {
    position: absolute; top: 0; left: 0; right: 0;
    height: var(--status-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px 0 24px;
    font-size: 15px;
    font-weight: 600;
    color: var(--charcoal);
    z-index: 100;
    pointer-events: none;
  }
  .status-bar.light { color: #fff; }
  .status-bar .status-icons {
    display: flex; align-items: center; gap: 5px;
  }
  .status-bar .status-icons svg { width: 16px; height: 12px; }

  /* Notch */
  .notch {
    position: absolute; top: 8px; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 28px;
    background: #0a0a0a;
    border-radius: 20px;
    z-index: 101;
  }

  /* Home indicator */
  .home-indicator {
    position: absolute; bottom: 8px; left: 50%;
    transform: translateX(-50%);
    width: 134px; height: 5px;
    background: var(--charcoal);
    border-radius: 3px;
    opacity: 0.3;
    z-index: 200;
  }
  .home-indicator.light { background: #fff; opacity: 0.6; }

  /* ============ NAV BAR (WeChat capsule) ============ */
  .nav-bar {
    position: absolute; top: var(--status-h); left: 0; right: 0;
    height: var(--nav-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px;
    z-index: 90;
    transition: background 0.3s, backdrop-filter 0.3s;
  }
  .nav-bar-title {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: 17px;
    font-weight: 600;
    color: var(--charcoal);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .nav-bar.show-title .nav-bar-title { opacity: 1; }
  .nav-bar.light .nav-bar-title { color: #fff; }
  .nav-back {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    color: var(--charcoal);
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    backdrop-filter: blur(10px);
  }
  .nav-bar.light .nav-back { color: #fff; }
  .nav-capsule {
    display: flex; align-items: center;
    height: 32px;
    padding: 0 4px;
    border-radius: 16px;
    background: rgba(255,255,255,0.4);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.25);
  }
  .nav-bar.light .nav-capsule {
    background: rgba(255,255,255,0.25);
  }
  .nav-capsule-btn {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    color: var(--charcoal);
    opacity: 0.85;
  }
  .nav-bar.light .nav-capsule-btn { color: #fff; }
  .nav-capsule-divider {
    width: 1px; height: 16px;
    background: rgba(44,44,44,0.15);
  }
  .nav-bar.light .nav-capsule-divider { background: rgba(255,255,255,0.3); }

  /* ============ PAGE CONTAINER ============ */
  .page-container {
    position: absolute; inset: 0;
    overflow: hidden;
    background: var(--warm-white);
  }
  .page {
    position: absolute; inset: 0;
    overflow: hidden;
    will-change: transform, opacity;
  }
  .page-scroll {
    position: absolute; inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .page-scroll::-webkit-scrollbar { display: none; }

  /* Page transitions */
  .page-enter-right {
    animation: pageEnterRight 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .page-exit-left {
    animation: pageExitLeft 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .page-enter-left {
    animation: pageEnterLeft 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .page-exit-right {
    animation: pageExitRight 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes pageEnterRight {
    from { transform: translateX(30%); opacity: 0.5; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes pageExitLeft {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(-30%); opacity: 0.5; }
  }
  @keyframes pageEnterLeft {
    from { transform: translateX(-30%); opacity: 0.5; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes pageExitRight {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(30%); opacity: 0.5; }
  }

  /* ============ TAB BAR ============ */
  .tab-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: calc(var(--tabbar-h) + var(--safe-bottom));
    padding-bottom: var(--safe-bottom);
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(0,0,0,0.05);
    display: flex;
    z-index: 80;
  }
  .tab-item {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2px;
    color: #999;
    transition: color 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
  }
  .tab-item svg {
    width: 24px; height: 24px;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .tab-item.active {
    color: var(--sage-dark);
  }
  .tab-item.active svg {
    transform: translateY(-2px) scale(1.1);
  }
  .tab-item .tab-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }
  .tab-item .tab-dot {
    position: absolute; top: 8px; right: 50%;
    transform: translateX(14px);
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--terracotta);
    animation: pulseDot 2s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%, 100% { transform: translateX(14px) scale(1); opacity: 1; }
    50% { transform: translateX(14px) scale(1.3); opacity: 0.7; }
  }

  /* ============ PULL TO REFRESH ============ */
  .pull-indicator {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--sage-dark);
    font-size: 13px;
    pointer-events: none;
    z-index: 5;
  }
  .pull-indicator svg {
    width: 16px; height: 16px;
    margin-right: 6px;
    transition: transform 0.2s;
  }
  .pull-indicator.spinning svg {
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============ SKELETON ============ */
  .skeleton {
    background: var(--fog);
    border-radius: 6px;
    position: relative;
    overflow: hidden;
  }
  .skeleton::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    transform: translateX(-100%);
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer { to { transform: translateX(100%); } }

  /* ============ RIPPLE ============ */
  .ripple-target { position: relative; overflow: hidden; }
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    transform: scale(0);
    animation: rippleAnim 0.6s ease-out forwards;
    pointer-events: none;
  }
  @keyframes rippleAnim {
    to { transform: scale(4); opacity: 0; }
  }

  /* ============ ACTION SHEET ============ */
  .sheet-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.4);
    opacity: 0;
    z-index: 150;
    animation: fadeIn 0.3s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }
  .action-sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--warm-white);
    border-radius: 16px 16px 0 0;
    padding: 8px 12px calc(8px + var(--safe-bottom));
    z-index: 151;
    animation: sheetUp 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    transform: translateY(100%);
  }
  @keyframes sheetUp { to { transform: translateY(0); } }
  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--fog-dark);
    border-radius: 2px;
    margin: 6px auto 10px;
  }
  .sheet-item {
    height: 52px;
    display: flex; align-items: center;
    padding: 0 16px;
    font-size: 16px;
    color: var(--charcoal);
    border-radius: 10px;
    gap: 14px;
  }
  .sheet-item:active { background: var(--fog); }
  .sheet-item svg { width: 20px; height: 20px; color: var(--sage-dark); }
  .sheet-divider { height: 8px; }
  .sheet-cancel {
    margin-top: 8px;
    background: var(--white);
    color: var(--charcoal-soft);
    font-weight: 500;
    justify-content: center;
  }

  /* ============ TOAST ============ */
  .toast {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    z-index: 200;
    animation: toastIn 0.3s ease-out;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translate(-50%, -30%); }
    to { opacity: 1; transform: translate(-50%, -50%); }
  }

  /* ============ HOME PAGE ============ */
  .home-page .home-header {
    padding: calc(var(--status-h) + var(--nav-h)) 16px 0;
    background: linear-gradient(180deg, #f0ead9 0%, var(--warm-white) 100%);
    position: relative;
  }
  .home-location {
    display: flex; align-items: center; gap: 4px;
    font-size: 15px;
    font-weight: 600;
    color: var(--charcoal);
    margin-bottom: 14px;
  }
  .home-location svg { width: 16px; height: 16px; color: var(--terracotta); }
  .home-location .arrow { color: #999; font-size: 12px; margin-left: 2px; }

  .home-search {
    display: flex; align-items: center; gap: 8px;
    height: 36px;
    padding: 0 14px;
    background: var(--white);
    border-radius: 18px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 16px;
  }
  .home-search svg { width: 16px; height: 16px; color: #999; flex-shrink: 0; }
  .home-search input {
    flex: 1;
    font-size: 14px;
    color: var(--charcoal);
  }
  .home-search input::placeholder { color: #bbb; }

  .home-banner {
    height: 92px;
    border-radius: var(--radius-lg);
    background: linear-gradient(135deg, var(--sage) 0%, var(--sage-light) 100%);
    padding: 14px 18px;
    color: #fff;
    position: relative;
    overflow: hidden;
    margin-bottom: 18px;
    box-shadow: 0 8px 20px rgba(122,158,126,0.35);
  }
  .home-banner::before {
    content: '';
    position: absolute; right: -20px; top: -20px;
    width: 100px; height: 100px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
  }
  .home-banner::after {
    content: '';
    position: absolute; right: 20px; bottom: -30px;
    width: 70px; height: 70px;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
  }
  .home-banner .banner-tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    background: rgba(255,255,255,0.25);
    border-radius: 8px;
    font-weight: 500;
    margin-bottom: 6px;
  }
  .home-banner h3 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
    position: relative;
  }
  .home-banner p {
    font-size: 12px;
    opacity: 0.85;
    position: relative;
  }

  .home-categories {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 22px;
  }
  .cat-item {
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
  }
  .cat-icon {
    width: 44px; height: 44px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    transition: transform 0.2s;
  }
  .cat-item:active .cat-icon { transform: scale(0.92); }
  .cat-item .cat-label {
    font-size: 11px;
    color: var(--charcoal-soft);
    font-weight: 500;
  }

  .home-section-title {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 4px;
    margin-bottom: 12px;
  }
  .home-section-title h2 {
    font-size: 17px;
    font-weight: 700;
    color: var(--charcoal);
    font-family: "Noto Serif SC", serif;
  }
  .home-section-title .more {
    font-size: 12px;
    color: #999;
    display: flex; align-items: center; gap: 2px;
  }

  .waterfall {
    columns: 2;
    column-gap: 10px;
    padding: 0 2px;
  }
  .wf-card {
    break-inside: avoid;
    margin-bottom: 10px;
    background: var(--white);
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    opacity: 0;
    transform: translateY(16px);
    animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    transition: box-shadow 0.3s, transform 0.2s;
  }
  .wf-card:active { transform: scale(0.97); box-shadow: var(--shadow-md); }
  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0); }
  }
  .wf-card-img {
    width: 100%;
    background: var(--fog);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    position: relative;
  }
  .wf-card-img .badge {
    position: absolute; top: 8px; left: 8px;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 6px;
    font-weight: 600;
    color: #fff;
  }
  .badge.item { background: var(--sage); }
  .badge.skill { background: var(--terracotta); }
  .badge.help { background: #7b9ac4; }
  .wf-card-body { padding: 10px 10px 12px; }
  .wf-card-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--charcoal);
    line-height: 1.4;
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .wf-card-meta {
    display: flex; align-items: center; justify-content: space-between;
  }
  .wf-card-user {
    display: flex; align-items: center; gap: 5px;
  }
  .user-avatar-mini {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--sage-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px;
    color: #fff;
    font-weight: 600;
  }
  .user-name {
    font-size: 11px;
    color: #888;
  }
  .wf-card-distance {
    font-size: 10px;
    color: #aaa;
  }
  .wf-card-swap {
    margin-top: 6px;
    font-size: 10px;
    color: var(--terracotta);
    background: rgba(193,122,84,0.1);
    padding: 3px 6px;
    border-radius: 6px;
    display: inline-block;
    font-weight: 500;
  }

  /* ============ PLAZA PAGE ============ */
  .plaza-page {
    background: var(--warm-white);
  }
  .plaza-top {
    padding: calc(var(--status-h) + var(--nav-h)) 16px 0;
    background: linear-gradient(180deg, #eef2f0 0%, var(--warm-white) 100%);
  }
  .plaza-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .plaza-header h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--charcoal);
    font-family: "Noto Serif SC", serif;
  }
  .plaza-actions {
    display: flex; gap: 8px;
  }
  .plaza-icon-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--white);
    box-shadow: var(--shadow-sm);
    display: flex; align-items: center; justify-content: center;
    color: var(--charcoal-soft);
  }
  .plaza-icon-btn svg { width: 16px; height: 16px; }

  .plaza-search {
    display: flex; align-items: center; gap: 8px;
    height: 38px;
    padding: 0 14px;
    background: var(--white);
    border-radius: 10px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-sm);
  }
  .plaza-search svg { width: 16px; height: 16px; color: #999; }
  .plaza-search input { flex: 1; font-size: 14px; }

  .sticky-tabs {
    position: sticky; top: 0;
    z-index: 50;
    background: var(--warm-white);
    padding-top: 6px;
  }
  .plaza-tabs {
    display: flex;
    gap: 22px;
    padding: 0 16px 10px;
    position: relative;
  }
  .plaza-tab {
    position: relative;
    font-size: 15px;
    font-weight: 500;
    color: #888;
    padding: 6px 0;
    transition: color 0.25s;
    flex-shrink: 0;
  }
  .plaza-tab.active {
    color: var(--charcoal);
    font-weight: 700;
    font-size: 17px;
  }
  .tab-indicator {
    position: absolute; bottom: 4px;
    height: 3px;
    background: var(--sage);
    border-radius: 2px;
    transition: left 0.3s cubic-bezier(0.22, 1, 0.36, 1), width 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .plaza-list {
    padding: 4px 16px 80px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .plaza-item {
    display: flex;
    background: var(--white);
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    position: relative;
    transition: transform 0.2s;
  }
  .plaza-item:active { transform: scale(0.99); }
  .plaza-item-img {
    width: 96px; height: 96px;
    flex-shrink: 0;
    background: var(--fog);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
  }
  .plaza-item-content {
    flex: 1;
    padding: 10px 12px;
    display: flex; flex-direction: column;
    justify-content: space-between;
    min-width: 0;
  }
  .plaza-item-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--charcoal);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .plaza-item-desc {
    font-size: 12px;
    color: #999;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .plaza-item-bottom {
    display: flex; align-items: center; justify-content: space-between;
  }
  .plaza-item-tags {
    display: flex; gap: 4px;
  }
  .plaza-tag {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 500;
  }
  .tag-sage { color: var(--sage-dark); background: rgba(122,158,126,0.12); }
  .tag-terracotta { color: var(--terracotta-dark); background: rgba(193,122,84,0.12); }
  .tag-blue { color: #5a7ba0; background: rgba(90,123,160,0.12); }
  .plaza-item-meta {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px;
    color: #aaa;
  }

  /* left swipe */
  .swipe-wrap {
    position: relative;
    overflow: hidden;
    border-radius: var(--radius-md);
  }
  .swipe-actions {
    position: absolute; top: 0; right: 0; bottom: 0;
    display: flex;
    z-index: 0;
  }
  .swipe-action {
    width: 72px;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    flex-direction: column;
    gap: 2px;
  }
  .swipe-action svg { width: 18px; height: 18px; }
  .swipe-action.fav { background: var(--terracotta); }
  .swipe-action.report { background: #888; }
  .swipe-content {
    position: relative;
    z-index: 1;
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    background: var(--white);
    border-radius: var(--radius-md);
  }

  /* ============ DETAIL PAGE ============ */
  .detail-page {
    background: var(--white);
  }
  .detail-scroll { padding-bottom: calc(var(--tabbar-h) + 20px); }
  .detail-hero {
    position: relative;
    width: 100%;
    height: 375px;
    background: linear-gradient(135deg, #d9d2c0 0%, #ebe4d4 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 120px;
    overflow: hidden;
    will-change: transform;
  }
  .detail-hero-bg {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5), transparent 60%);
  }
  .detail-hero-emoji {
    position: relative;
    will-change: transform;
  }
  .detail-hero-index {
    position: absolute; bottom: 12px; right: 16px;
    background: rgba(0,0,0,0.5);
    color: #fff;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    backdrop-filter: blur(4px);
  }

  .detail-info {
    background: var(--white);
    border-radius: 20px 20px 0 0;
    margin-top: -16px;
    position: relative;
    padding: 20px 18px 16px;
  }
  .detail-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--charcoal);
    line-height: 1.4;
    margin-bottom: 10px;
    font-family: "Noto Serif SC", serif;
  }
  .detail-tags {
    display: flex; gap: 6px;
    margin-bottom: 14px;
  }
  .detail-tags .plaza-tag { font-size: 11px; padding: 3px 8px; }
  .detail-desc {
    font-size: 14px;
    color: var(--charcoal-soft);
    line-height: 1.7;
    margin-bottom: 16px;
  }
  .detail-swap-box {
    background: linear-gradient(135deg, #fff8f0 0%, #fff 100%);
    border: 1px solid rgba(193,122,84,0.2);
    border-radius: var(--radius-md);
    padding: 14px;
    margin-bottom: 18px;
  }
  .detail-swap-label {
    font-size: 12px;
    color: var(--terracotta);
    font-weight: 600;
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 4px;
  }
  .detail-swap-text {
    font-size: 14px;
    color: var(--charcoal);
    font-weight: 500;
  }

  .detail-section {
    margin-bottom: 18px;
  }
  .detail-section-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--charcoal);
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 6px;
  }
  .detail-section-title::before {
    content: '';
    width: 3px; height: 14px;
    background: var(--sage);
    border-radius: 2px;
  }

  .publisher-card {
    display: flex; align-items: center; gap: 12px;
    background: var(--warm-white);
    border-radius: var(--radius-md);
    padding: 14px;
  }
  .publisher-avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--sage) 0%, var(--sage-light) 100%);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 18px;
    flex-shrink: 0;
    position: relative;
  }
  .publisher-avatar::after {
    content: '';
    position: absolute; inset: -3px;
    border: 2px solid var(--sage-light);
    border-radius: 50%;
    opacity: 0;
    animation: pulseRing 2s ease-out infinite;
  }
  @keyframes pulseRing {
    0% { opacity: 0.8; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.4); }
  }
  .publisher-info { flex: 1; min-width: 0; }
  .publisher-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--charcoal);
    margin-bottom: 2px;
  }
  .publisher-sub {
    font-size: 12px;
    color: #888;
    display: flex; align-items: center; gap: 8px;
  }
  .publisher-sub .dot {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: #ccc;
  }
  .publisher-stats {
    text-align: right;
  }
  .publisher-stats .num {
    font-size: 17px;
    font-weight: 700;
    color: var(--terracotta);
    font-family: "Noto Serif SC", serif;
  }
  .publisher-stats .label {
    font-size: 11px;
    color: #999;
  }

  .detail-meta-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .meta-item {
    background: var(--warm-white);
    border-radius: var(--radius-sm);
    padding: 12px 8px;
    text-align: center;
  }
  .meta-item .meta-value {
    font-size: 16px;
    font-weight: 700;
    color: var(--charcoal);
    margin-bottom: 2px;
  }
  .meta-item .meta-label {
    font-size: 11px;
    color: #888;
  }

  /* Detail bottom bar */
  .detail-bottom-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: var(--white);
    padding: 10px 14px calc(10px + var(--safe-bottom));
    display: flex; align-items: center; gap: 10px;
    border-top: 1px solid var(--fog);
    z-index: 60;
  }
  .bottom-icon-btn {
    display: flex; flex-direction: column;
    align-items: center; gap: 2px;
    color: #666;
    padding: 4px 10px;
  }
  .bottom-icon-btn svg { width: 20px; height: 20px; }
  .bottom-icon-btn span { font-size: 10px; }
  .bottom-btn {
    flex: 1;
    height: 42px;
    border-radius: 21px;
    font-size: 15px;
    font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, box-shadow 0.2s;
  }
  .bottom-btn:active { transform: scale(0.96); }
  .btn-chat {
    background: var(--warm-white);
    color: var(--sage-dark);
    border: 1px solid var(--sage-light);
  }
  .btn-swap {
    background: linear-gradient(135deg, var(--terracotta) 0%, var(--terracotta-dark) 100%);
    color: #fff;
    box-shadow: 0 6px 16px rgba(193,122,84,0.35);
  }

  /* ============ PUBLISH PAGE ============ */
  .publish-page {
    background: var(--warm-white);
  }
  .publish-scroll {
    padding: calc(var(--status-h) + var(--nav-h)) 0 calc(80px + var(--safe-bottom));
  }
  .publish-section {
    background: var(--white);
    margin-bottom: 10px;
    padding: 16px;
  }
  .publish-section:first-child {
    border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  }
  .section-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--charcoal);
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 6px;
  }
  .section-label .req {
    color: var(--terracotta);
    font-weight: 700;
  }

  .image-upload-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .img-thumb {
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    background: var(--fog);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    position: relative;
    overflow: hidden;
  }
  .img-thumb .remove {
    position: absolute; top: 4px; right: 4px;
    width: 18px; height: 18px;
    background: rgba(0,0,0,0.5);
    border-radius: 50%;
    color: #fff;
    font-size: 11px;
    display: flex; align-items: center; justify-content: center;
  }
  .img-add {
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    border: 1.5px dashed var(--fog-dark);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 4px;
    color: #aaa;
    background: var(--warm-white);
  }
  .img-add svg { width: 22px; height: 22px; }
  .img-add span { font-size: 11px; }

  .type-picker {
    display: flex; gap: 8px;
    margin-bottom: 14px;
  }
  .type-chip {
    flex: 1;
    padding: 10px 0;
    border-radius: 10px;
    background: var(--warm-white);
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    color: var(--charcoal-soft);
    border: 1.5px solid transparent;
    transition: all 0.2s;
  }
  .type-chip.active {
    background: rgba(122,158,126,0.1);
    color: var(--sage-dark);
    border-color: var(--sage);
    font-weight: 600;
  }

  .cat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .cat-chip {
    padding: 8px 0;
    background: var(--warm-white);
    border-radius: 8px;
    text-align: center;
    font-size: 12px;
    color: var(--charcoal-soft);
    border: 1.5px solid transparent;
    transition: all 0.2s;
  }
  .cat-chip.active {
    background: rgba(193,122,84,0.1);
    color: var(--terracotta-dark);
    border-color: var(--terracotta);
    font-weight: 600;
  }

  .form-input-wrap {
    background: var(--warm-white);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .form-input-wrap textarea {
    width: 100%;
    min-height: 100px;
    font-size: 14px;
    color: var(--charcoal);
    resize: none;
    line-height: 1.6;
  }
  .form-input-wrap textarea::placeholder { color: #bbb; }
  .char-count {
    text-align: right;
    font-size: 11px;
    color: #bbb;
    margin-top: 4px;
  }

  .form-row {
    display: flex; align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid var(--fog);
  }
  .form-row:last-child { border-bottom: none; }
  .form-row-label {
    width: 80px;
    font-size: 14px;
    color: var(--charcoal-soft);
    font-weight: 500;
  }
  .form-row-input {
    flex: 1;
    font-size: 14px;
    color: var(--charcoal);
    text-align: right;
  }
  .form-row-input.placeholder { color: #ccc; }
  .form-row-arrow {
    color: #ccc;
    margin-left: 4px;
    font-size: 12px;
  }

  .publish-submit-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: var(--white);
    padding: 12px 16px calc(12px + var(--safe-bottom));
    border-top: 1px solid var(--fog);
    z-index: 60;
  }
  .primary-btn {
    width: 100%;
    height: 46px;
    border-radius: 23px;
    background: linear-gradient(135deg, var(--sage) 0%, var(--sage-dark) 100%);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px rgba(122,158,126,0.35);
    transition: transform 0.15s, box-shadow 0.2s;
  }
  .primary-btn:active {
    transform: scale(0.97);
    box-shadow: 0 4px 10px rgba(122,158,126,0.3);
  }

  /* ============ MESSAGES PAGE ============ */
  .msg-page { background: var(--warm-white); }
  .msg-top {
    padding: calc(var(--status-h) + var(--nav-h)) 16px 14px;
    background: linear-gradient(180deg, #efe8d9 0%, var(--warm-white) 100%);
  }
  .msg-top h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--charcoal);
    font-family: "Noto Serif SC", serif;
    margin-bottom: 14px;
  }
  .msg-search {
    display: flex; align-items: center; gap: 8px;
    height: 36px;
    padding: 0 14px;
    background: var(--white);
    border-radius: 18px;
    box-shadow: var(--shadow-sm);
  }
  .msg-search svg { width: 16px; height: 16px; color: #999; }
  .msg-search input { flex: 1; font-size: 14px; }

  .msg-list {
    padding: 6px 0 calc(var(--tabbar-h));
    background: var(--white);
  }
  .msg-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    position: relative;
    transition: background 0.2s;
  }
  .msg-item:active { background: var(--warm-white); }
  .msg-item + .msg-item::before {
    content: '';
    position: absolute; top: 0; left: 76px; right: 16px;
    height: 1px;
    background: var(--fog);
  }
  .msg-avatar {
    width: 48px; height: 48px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--sage-light), var(--sage));
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 17px;
    flex-shrink: 0;
    position: relative;
  }
  .msg-avatar.terracotta { background: linear-gradient(135deg, var(--terracotta-light), var(--terracotta)); }
  .msg-avatar.blue { background: linear-gradient(135deg, #a8c0d8, #7b9ac4); }
  .msg-avatar.grey { background: linear-gradient(135deg, #d0ccc2, #b0aba0); }
  .msg-badge {
    position: absolute; top: -4px; right: -4px;
    min-width: 18px; height: 18px;
    padding: 0 5px;
    background: var(--terracotta);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--white);
  }
  .msg-content { flex: 1; min-width: 0; }
  .msg-top-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 4px;
  }
  .msg-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--charcoal);
  }
  .msg-time {
    font-size: 11px;
    color: #bbb;
  }
  .msg-preview {
    font-size: 13px;
    color: #888;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* skeleton variants */
  .sk-avatar { width: 48px; height: 48px; border-radius: 14px; }
  .sk-name { width: 80px; height: 14px; border-radius: 3px; margin-bottom: 8px; }
  .sk-preview { width: 150px; height: 12px; border-radius: 3px; }
  .sk-time { width: 40px; height: 10px; border-radius: 3px; }
  .msg-item-skel {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
  }
  .msg-item-skel .sk-right { flex: 1; }

  /* ============ PROFILE PAGE ============ */
  .profile-page { background: var(--warm-white); }
  .profile-header {
    background: linear-gradient(160deg, #d4c9b0 0%, #e8ddd0 50%, var(--warm-white) 100%);
    padding: calc(var(--status-h) + var(--nav-h)) 16px 20px;
    position: relative;
    overflow: hidden;
  }
  .profile-header::before {
    content: '';
    position: absolute; top: -40px; right: -40px;
    width: 180px; height: 180px;
    background: radial-gradient(circle, rgba(193,122,84,0.15), transparent 70%);
    border-radius: 50%;
  }
  .profile-user-row {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 18px;
    position: relative;
  }
  .profile-avatar {
    width: 64px; height: 64px;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--sage) 0%, var(--sage-dark) 100%);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-size: 24px;
    font-weight: 700;
    box-shadow: 0 6px 16px rgba(122,158,126,0.3);
    position: relative;
  }
  .profile-info h2 {
    font-size: 20px;
    font-weight: 700;
    color: var(--charcoal);
    margin-bottom: 4px;
    font-family: "Noto Serif SC", serif;
  }
  .profile-community {
    font-size: 12px;
    color: var(--charcoal-soft);
    display: flex; align-items: center; gap: 4px;
  }
  .profile-community svg { width: 12px; height: 12px; color: var(--terracotta); }
  .profile-edit {
    margin-left: auto;
    font-size: 12px;
    color: var(--charcoal-soft);
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(10px);
    padding: 5px 12px;
    border-radius: 14px;
    font-weight: 500;
  }

  .profile-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(10px);
    border-radius: var(--radius-lg);
    padding: 14px 0;
    position: relative;
  }
  .stat-col {
    text-align: center;
    position: relative;
  }
  .stat-col + .stat-col::before {
    content: '';
    position: absolute; left: 0; top: 20%;
    width: 1px; height: 60%;
    background: rgba(0,0,0,0.06);
  }
  .stat-num {
    font-size: 20px;
    font-weight: 700;
    color: var(--charcoal);
    margin-bottom: 2px;
    font-family: "Noto Serif SC", serif;
  }
  .stat-label {
    font-size: 11px;
    color: #888;
  }

  .profile-menu {
    margin: 14px 16px 10px;
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 8px 0;
    box-shadow: var(--shadow-sm);
  }
  .menu-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 8px 0;
  }
  .menu-item {
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
    padding: 10px 0;
    transition: transform 0.15s;
  }
  .menu-item:active { transform: scale(0.92); }
  .menu-icon {
    width: 40px; height: 40px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .menu-icon svg { width: 20px; height: 20px; color: #fff; }
  .menu-label {
    font-size: 11px;
    color: var(--charcoal-soft);
  }

  .profile-section {
    margin: 14px 16px;
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 16px;
    box-shadow: var(--shadow-sm);
  }
  .profile-section-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .profile-section-head h3 {
    font-size: 15px;
    font-weight: 700;
    color: var(--charcoal);
  }
  .profile-section-head .more {
    font-size: 12px;
    color: #999;
  }
  .my-items-row {
    display: flex; gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin: 0 -2px;
    scrollbar-width: none;
  }
  .my-items-row::-webkit-scrollbar { display: none; }
  .my-item-card {
    flex-shrink: 0;
    width: 100px;
    border-radius: var(--radius-sm);
    overflow: hidden;
    background: var(--warm-white);
  }
  .my-item-img {
    height: 100px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    background: var(--fog);
  }
  .my-item-info {
    padding: 6px 8px;
  }
  .my-item-title {
    font-size: 11px;
    color: var(--charcoal);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }
  .my-item-status {
    font-size: 10px;
    color: var(--sage-dark);
  }

  .profile-list {
    margin: 14px 16px 80px;
    background: var(--white);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .list-item {
    display: flex; align-items: center;
    padding: 14px 16px;
    gap: 12px;
    position: relative;
  }
  .list-item + .list-item::before {
    content: '';
    position: absolute; top: 0; left: 48px; right: 0;
    height: 1px;
    background: var(--fog);
  }
  .list-icon {
    width: 28px; height: 28px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .list-icon svg { width: 16px; height: 16px; color: #fff; }
  .list-label {
    flex: 1;
    font-size: 14px;
    color: var(--charcoal);
  }
  .list-arrow {
    color: #ccc;
    font-size: 12px;
  }

  /* ============ DESIGN SPEC PAGE ============ */
  .spec-page {
    background: var(--warm-white);
  }
  .spec-scroll {
    padding: calc(var(--status-h) + var(--nav-h) + 10px) 16px 40px;
  }

/* =========================================================
   HOOKS
   ========================================================= */
function useCountUp(target, duration = 1200, start = false) {
  const [val, setVal] = useState(0);
  const rafRef = useRef(null);
  const startTimeRef = useRef(null);

  useEffect(() => {
    if (!start) return;
    startTimeRef.current = null;
    const step = (ts) => {
      if (startTimeRef.current === null) startTimeRef.current = ts;
      const p = Math.min((ts - startTimeRef.current) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3); // easeOutCubic
      setVal(Math.round(target * eased));
      if (p < 1) rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [target, duration, start]);

  return val;
}

/* =========================================================
   PULL TO REFRESH WRAPPER
   ========================================================= */
function PullToRefresh({ onRefresh, children, className = '' }) {
  const scrollRef = useRef(null);
  const [pullY, setPullY] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const startYRef = useRef(0);
  const pullingRef = useRef(false);
  const rafRef = useRef(null);

  const handleTouchStart = useCallback((e) => {
    if (scrollRef.current && scrollRef.current.scrollTop <= 0) {
      pullingRef.current = true;
      startYRef.current = e.touches[0].clientY;
    }
  }, []);

  const handleTouchMove = useCallback((e) => {
    if (!pullingRef.current || refreshing) return;
    const dy = e.touches[0].clientY - startYRef.current;
    if (dy > 0) {
      // Damping
      const damped = dy * 0.5;
      setPullY(Math.min(damped, 80));
    } else {
      pullingRef.current = false;
      setPullY(0);
    }
  }, [refreshing]);

  const handleTouchEnd = useCallback(() => {
    if (!pullingRef.current) return;
    pullingRef.current = false;
    if (pullY >= 60 && onRefresh && !refreshing) {
      setRefreshing(true);
      // spring to 50px
      setPullY(50);
      onRefresh().then(() => {
        setRefreshing(false);
        // spring back
        let start = 50;
        const startTime = performance.now();
        const springBack = (ts) => {
          const t = Math.min((ts - startTime) / 400, 1);
          // easeOutBack
          const c1 = 1.70158;
          const c3 = c1 + 1;
          const eased = 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
          setPullY(start * (1 - eased));
          if (t < 1) rafRef.current = requestAnimationFrame(springBack);
          else setPullY(0);
        };
        rafRef.current = requestAnimationFrame(springBack);
      });
    } else {
      // spring back
      let start = pullY;
      const startTime = performance.now();
      const springBack = (ts) => {
        const t = Math.min((ts - startTime) / 300, 1);
        const eased = 1 - Math.pow(1 - t, 3);
        setPullY(start * (1 - eased));
        if (t < 1) rafRef.current = requestAnimationFrame(springBack);
      };
      rafRef.current = requestAnimationFrame(springBack);
    }
  }, [pullY, onRefresh, refreshing]);

  useEffect(() => {
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, []);

  // Pause animation on hidden
  useEffect(() => {
    const onVis = () => {
      if (document.hidden && rafRef.current) {
        cancelAnimationFrame(rafRef.current);
        rafRef.current = null;
      }
    };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, []);

  const indicatorHeight = Math.max(pullY, 0);
  return (
    <div className={`page-scroll ${className}`} style={{paddingTop: indicatorHeight}}
      ref={scrollRef}
      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}
      onTouchEnd={handleTouchEnd}
    >
      <div className="pull-indicator" style={{top: indicatorHeight - 40, height: 40}}>
        <Icon.Refresh className={refreshing ? 'spinning' : ''} />
        <span>{refreshing ? '刷新中...' : pullY >= 60 ? '松开刷新' : '下拉刷新'}</span>
      </div>
      {children}
    </div>
  );
}

/* =========================================================
   PLAZA PAGE (left swipe)
   ========================================================= */
function PlazaItem({ item, index, onItemClick }) {
  const [translateX, setTranslateX] = useState(0);
  const startXRef = useRef(0);
  const startTranslateRef = useRef(0);
  const draggingRef = useRef(false);
  const rafRef = useRef(null);

  const ACTION_W = 144; // 2 buttons * 72

  const onTouchStart = (e) => {
    startXRef.current = e.touches[0].clientX;
    startTranslateRef.current = translateX;
    draggingRef.current = true;
  };

  const onTouchMove = (e) => {
    if (!draggingRef.current) return;
    let dx = e.touches[0].clientX - startXRef.current;
    let next = startTranslateRef.current + dx;
    // Damping when pulling right from 0
    if (next > 0) next = next * 0.3;
    // Damping when past action width
    if (next < -ACTION_W) {
      const over = -next - ACTION_W;
      next = -ACTION_W - over * 0.3;
    }
    setTranslateX(next);
  };

  const onTouchEnd = () => {
    draggingRef.current = false;
    // Snap
    const threshold = -ACTION_W / 2;
    const target = translateX < threshold ? -ACTION_W : 0;
    // animate with spring
    const start = translateX;
    const change = target - start;
    const startTime = performance.now();
    const dur = 300;
    const anim = (ts) => {
      const t = Math.min((ts - startTime) / dur, 1);
      // easeOutBack
      const c1 = 1.70158;
      const c3 = c1 + 1;
      const eased = 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      setTranslateX(start + change * eased);
      if (t < 1) rafRef.current = requestAnimationFrame(anim);
    };
    rafRef.current = requestAnimationFrame(anim);
  };

  useEffect(() => {
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, []);

  return (
    <div className="swipe-wrap" style={{animation: `cardIn 0.5s ${index * 60}ms both`}}>
      <div className="swipe-actions">
        <button className="swipe-action fav"><Icon.Heart style={{width:18,height:18,fill:'currentColor'}}/> 收藏</button>
        <button className="swipe-action report"><Icon.Flag style={{width:18,height:18}}/> 举报</button>
      </div>
      <div
        className="swipe-content"
        style={{transform: `translateX(${translateX}px)`}}
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
        onClick={() => translateX === 0 && onItemClick && onItemClick(item)}
      >
        <div className="plaza-item">
          <div className="plaza-item-img">{item.emoji}</div>
          <div className="plaza-item-content">
            <div>
              <div className="plaza-item-title">{item.title}</div>
              <div className="plaza-item-desc" style={{marginTop: 4}}>{item.desc}</div>
            </div>
            <div className="plaza-item-bottom">
              <div className="plaza-item-tags">
                {item.tags.map((t, i) => (
                  <span key={i} className={`plaza-tag ${t.cls}`}>{t.text}</span>
                ))}
              </div>
              <div className="plaza-item-meta">
                <span>{item.user}</span>
                <span>·</span>
                <span>{item.distance}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

  }
}`
    },
    {
      method: 'POST', path: '/api/items/publish',
      desc: '发布物品或技能，支持上传图片、设置分类和交换期望。',
      params: [
        { name: 'type', type: 'string', desc: 'item / skill / help' },
        { name: 'title', type: 'string', desc: '标题，最长 50 字' },
        { name: 'description', type: 'string', desc: '描述，最长 300 字' },
        { name: 'category', type: 'string', desc: '分类 ID' },
        { name: 'images', type: 'string[]', desc: '图片 URL 列表' },
        { name: 'swap_want', type: 'string', desc: '交换期望' },
      ],
      response: `{
  "code": 0,
  "message": "发布成功",
  "data": {
    "item_id": "item_new_001",
    "status": "online",
    "review_status": "approved"
  }
}`
    },
    {
      method: 'GET', path: '/api/user/profile',
      desc: '获取用户个人信息、统计数据和社区身份。',
      params: [
        { name: 'user_id', type: 'string', desc: '用户 ID，不传则取当前用户' },
      ],
      response: `{
  "code": 0,
  "data": {
    "id": "u_001",
    "name": "朱曦策",
    "avatar_url": "",
    "community": {
      "id": "comm_001",
      "name": "阳光花园社区",
      "building": "3号楼"
    },
    "stats": {
      "published": 12,
      "swaps": 23,
      "favorites": 45,
      "credit_score": 98
    },
    "member_days": 180
  }
}`
    },
    {
      method: 'PUT', path: '/api/items/:id/favorite',
      desc: '收藏或取消收藏物品。',
      params: [
        { name: 'id', type: 'string (path)', desc: '物品 ID' },
        { name: 'action', type: 'string', desc: 'add / remove' },
      ],
      response: `{
  "code": 0,
  "data": {
    "item_id": "item_001",
    "favorited": true,
    "fav_count": 33
  }
}`
    },
  ];

  const methodCls = {
    GET: 'method-get',
    POST: 'method-post',
    PUT: 'method-put',
    DELETE: 'method-delete',
  };

  const highlight = (code) => {
    // Very basic syntax coloring via simple string replacements
    return code
      .replace(/(\/\/.*)/g, '<span class="com">$1</span>')
      .replace(/"([^"]+)":/g, '<span class="key">"$1"</span>:')
      .replace(/: "([^"]*)"/g, ': <span class="str">"$1"</span>')
      .replace(/: (\d+\.?\d*)/g, ': <span class="num">$1</span>')
      .replace(/: (true|false|null)/g, ': <span class="bool">$1</span>');
  };

  return (
    <div className="page api-page">
      <div className="page-scroll api-scroll">
        <div className="api-title">接口文档</div>
        <div className="api-subtitle">API Documentation v1.0 · 邻里换物后端</div>

        <div style={{
          background: 'var(--white)', borderRadius: 12, padding: '12px 14px',
          marginBottom: 16, fontSize: 12, lineHeight: 1.8, boxShadow: 'var(--shadow-sm)'
        }}>
          <div style={{fontWeight: 600, color: 'var(--charcoal)', marginBottom: 6}}>Base URL</div>
          <div style={{fontFamily: 'monospace', color: 'var(--sage-dark)', background: 'var(--warm-white)', padding: '6px 10px', borderRadius: 6, marginBottom: 10}}>
            https://api.linlihuanyu.com/v1
          </div>
          <div style={{fontWeight: 600, color: 'var(--charcoal)', marginBottom: 4}}>鉴权方式</div>
          <div style={{color: 'var(--charcoal-soft)'}}>Header: <code style={{background: 'var(--warm-white)', padding: '2px 6px', borderRadius: 4, fontFamily: 'monospace', fontSize: 11}}>Authorization: Bearer {`{token}`}</code></div>
        </div>

        {endpoints.map((ep, i) => (
          <div key={i} className="api-endpoint">
            <div className="api-head">
              <span className={`api-method ${methodCls[ep.method]}`}>{ep.method}</span>
              <span className="api-path">{ep.path}</span>
            </div>
            <div className="api-desc">{ep.desc}</div>
            <div className="api-block">
              <div className="api-block-label">请求参数</div>
              <table className="api-param-table">
                <thead>
                  <tr>
                    <th style={{width: 120}}>参数</th>
                    <th style={{width: 90}}>类型</th>
                    <th>说明</th>
                  </tr>
                </thead>
                <tbody>
                  {ep.params.map((p, j) => (
                    <tr key={j}>
                      <td className="param-name">{p.name}</td>
                      <td className="param-type">{p.type}</td>
                      <td className="param-desc">{p.desc}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="api-block">
              <div className="api-block-label">响应示例</div>
              <pre className="api-code" dangerouslySetInnerHTML={{__html: highlight(ep.response)}}></pre>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* =========================================================
   APP ROOT
   ========================================================= */
function App() {
  // Main tabs state
  const [tab, setTab] = useState('home');
  // Page stack for push/pop navigation
  const [stack, setStack] = useState([{ key: 'home' }]);
  const [transition, setTransition] = useState(null); // 'push' | 'pop' | null
  const [toast, setToast] = useState(null);
  const [sheet, setSheet] = useState(null);

  const currentPage = stack[stack.length - 1];

  const showToast = useCallback((text) => {
    setToast(text);
    const t = setTimeout(() => setToast(null), 1800);
    return () => clearTimeout(t);
  }, []);

  const pushPage = useCallback((pageKey, params = {}) => {
    setTransition('push');
    setStack(prev => [...prev, { key: pageKey, params }]);
    setTimeout(() => setTransition(null), 350);
  }, []);

  const popPage = useCallback(() => {
    if (stack.length <= 1) return;
    setTransition('pop');
    setTimeout(() => {
      setStack(prev => prev.slice(0, -1));
      setTransition(null);
    }, 300);
  }, [stack.length]);

  // Handle tab change
  const handleTabChange = useCallback((key) => {
    if (key === tab) return;
    setTab(key);
    setStack([{ key }]);
    setTransition(null);
  }, [tab]);

  // Item click -> go to detail
  const handleItemClick = useCallback((item) => {
    pushPage('detail', { item });
  }, [pushPage]);

  // Publish FAB
  const handlePublish = useCallback(() => {
    pushPage('publish');
  }, [pushPage]);

  // Profile nav
  const handleProfileNav = useCallback((target) => {
    pushPage(target);
  }, [pushPage]);

  // Status bar theme
  const getStatusBarTheme = () => {
    if (currentPage.key === 'detail') return 'light';
    return 'dark';
  };

  // Show nav bar?
  const showNavBar = currentPage.key !== 'home' && currentPage.key !== 'plaza' && currentPage.key !== 'messages' && currentPage.key !== 'profile';
  const showTabBar = stack.length === 1 && ['home','plaza','messages','profile'].includes(currentPage.key);

  // Nav bar title
  const getNavTitle = () => {
    switch (currentPage.key) {
      case 'detail': return '物品详情';
      case 'publish': return '发布';
      case 'spec': return '设计规范';
      case 'api': return '接口文档';
      default: return '';
    }
  };

  // Render current page
  const renderPage = (page, idx, isTop) => {
    const transitionCls = isTop && transition === 'push' ? 'page-enter-right' : '';
    const exitCls = !isTop && transition === 'pop' ? 'page-exit-right' : '';

    let content;
    switch (page.key) {
      case 'home':
        content = <HomePage onItemClick={handleItemClick} />;
        break;
      case 'plaza':
        content = <PlazaPage onItemClick={handleItemClick} />;
        break;
      case 'messages':
        content = <MessagesPage />;
        break;
      case 'profile':
        content = <ProfilePage onNavTo={handleProfileNav} />;
        break;
      case 'detail':
        content = <DetailPage item={page.params?.item} onBack={popPage} onChat={() => showToast('已打开聊天')} onSwap={() => { setSheet('swap'); }} />;
        break;
      case 'publish':
        content = <PublishPage onBack={popPage} onSubmit={() => { showToast('发布成功！'); setTimeout(() => popPage(), 1000); }} />;
        break;
      case 'spec':
        content = <SpecPage onBack={popPage} />;
        break;
      case 'api':
        content = <ApiPage onBack={popPage} />;
        break;
      default:
        content = null;
    }

    return (
      <div key={`${page.key}-${idx}`} className={`page ${transitionCls} ${exitCls}`} style={{zIndex: idx + 10}}>
        {content}
      </div>
    );
  };

  return (
    <>
      {/* Status bar - only for tab pages; detail has its own */}
      {currentPage.key !== 'detail' && <StatusBar theme="dark" />}

      {/* Nav bar for non-tab pages */}
      {showNavBar && (
        <NavBar
          title={getNavTitle()}
          showTitle={currentPage.key === 'publish' || currentPage.key === 'spec' || currentPage.key === 'api'}
          theme={currentPage.key === 'detail' ? 'light' : 'dark'}
          showBack
          onBack={popPage}
        />
      )}

      {/* Page stack */}
      <div className="page-container">
        {stack.map((page, idx) => renderPage(page, idx, idx === stack.length - 1))}
      </div>

      {/* Tab bar */}
      {showTabBar && <TabBar active={tab} onChange={handleTabChange} />}

      {/* FAB for publish on plaza */}
      {currentPage.key === 'plaza' && (
        <button
          onClick={handlePublish}
          className="ripple-target"
          style={{
            position: 'absolute', right: 16,
            bottom: 78,
            width: 52, height: 52,
            borderRadius: 26,
            background: 'linear-gradient(135deg, var(--terracotta), var(--terracotta-dark))',
            color: '#fff',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            boxShadow: '0 6px 20px rgba(193,122,84,0.45)',
            zIndex: 70,
            transition: 'transform 0.2s',
          }}
          onMouseDown={(e) => { e.currentTarget.style.transform = 'scale(0.9)'; }}
          onMouseUp={(e) => { e.currentTarget.style.transform = 'scale(1)'; }}
          onMouseLeave={(e) => { e.currentTarget.style.transform = 'scale(1)'; }}
        >
          <Icon.Plus style={{width: 24, height: 24}}/>
        </button>
      )}

      {/* Action sheet */}
      {sheet === 'swap' && (
        <ActionSheet
          items={[
            { label: '用我的物品交换', icon: <Icon.Gift /> },
            { label: '用技能交换', icon: <Icon.Zap /> },
            { label: '面议协商', icon: <Icon.Chat /> },
            { divider: true },
            { label: '取消', cancel: true },
          ]}
          onClose={() => setSheet(null)}
          onSelect={(item) => { showToast(`已选择：${item.label}`); }}
        />
      )}

      {/* Toast */}
      {toast && <Toast text={toast} />}
    </>
  );
}

/* =========================================================
   RIPPLE EFFECT (global delegation)
   ========================================================= */
function initRipple() {
  const handle = (e) => {
    const target = e.target.closest('.ripple-target');
    if (!target) return;
    const rect = target.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    target.appendChild(ripple);
    setTimeout(() => ripple.remove(), 650);
  };
  document.addEventListener('click', handle);
  return () => document.removeEventListener('click', handle);
}

/* =========================================================
   MOUNT
   ========================================================= */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// Initialize ripple
initRipple();

// Announce upgrade availability
function announceUpgrade() {
  try {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  } catch(e) {}
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}
</script>

    z-index: 100;
  }
  .screen {

    overflow: hidden;
    position: relative;

  /* status bar */
  .status-bar {

  .home-indicator {

  .tab-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 83px;
    background: rgba(250, 246, 240, 0.88);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 0.5px solid rgba(0,0,0,0.1);
    display: flex;
    padding-bottom: 28px;
    z-index: 40;
  }
  .tab-item {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px;
    cursor: pointer;
    font-size: 10px; font-weight: 500;
    color: #9a8a75;
    transition: transform 0.2s cubic-bezier(.34,1.56,.64,1);
  }
  .tab-item.active { color: #2d7a7a; }
  .tab-item.active svg { animation: tabPop 0.4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes tabPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.22); }
    100% { transform: scale(1); }
  }
  .tab-icon { width: 26px; height: 26px; }

  /* ─── page transitions ─── */
  .page {
    position: absolute; inset: 0;
    overflow: hidden;
    animation: fadeIn 0.35s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .page-scroll {
    position: absolute; inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .page-scroll::-webkit-scrollbar { display: none; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .delay-2 { animation-delay: 0.16s; }
  .delay-3 { animation-delay: 0.24s; }
  .delay-4 { animation-delay: 0.32s; }
  .delay-5 { animation-delay: 0.4s; }
  .delay-6 { animation-delay: 0.48s; }
  .delay-7 { animation-delay: 0.56s; }

      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }

  .safe-bottom { padding-bottom: 83px; }

    background: #faf6f0;
    border-radius: 22px 22px 0 0;

    overflow: hidden;
    display: flex; flex-direction: column;

    from { transform: translateY(100%); }

    from { opacity: 0; transform: scale(0.8) translateY(-10px); }

    width: 38px; height: 38px; border-radius: 50%;

    top: -50px;

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    padding: 0 16px 16px;
  }
  .cal-day {
    aspect-ratio: 1;
    border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;

    cursor: pointer;
    position: relative;

  .cal-day:active { transform: scale(0.92); }
  .cal-day.selected {
    background: #2d7a7a;
    color: #fff;
  }
  .cal-day.out { color: #c4b4a0; }

  /* masonry */
  .masonry {
    column-count: 2;
    column-gap: 12px;
    padding: 0 16px;
  }
  .masonry-item {
    break-inside: avoid;
    margin-bottom: 12px;
    border-radius: 18px;
    overflow: hidden;
    background: #faf6f0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    cursor: pointer;
    transition: transform 0.2s ease;
  }
  .masonry-item:active { transform: scale(0.97); }

  /* map dots */
  .map-dot {
    position: absolute;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(232, 114, 92, 0.2);
    border: 2px solid #e8725c;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 2;
    animation: dotPulse 2s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(232,114,92,0.4); }

  }

  /* code block */
  .code-block {
    background: #1a3a3a;
    color: #e8d5b7;
    padding: 14px;
    border-radius: 12px;
    font-family: 'SF Mono', Menlo, monospace;
    font-size: 11px;
    line-height: 1.6;
    overflow-x: auto;
  }
  .code-key { color: #e8725c; }
  .code-str { color: #8fbc8f; }
  .code-num { color: #f4c06a; }

  /* color swatch */
  .swatch {
    aspect-ratio: 1;
    border-radius: 12px;
    border: 1px solid rgba(0,0,0,0.08);
  }

  /* ─── wave svg animation ─── */
  .wave-anim { animation: waveShift 6s ease-in-out infinite; }
  @keyframes waveShift {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(-8px); }
  }
</style>

/* ─────────────────────────────────────────
   TIDE CURVE (SVG + animation)
   ───────────────────────────────────────── */

function TideCurve({ today }) {
  const width = 340;
  const height = 150;
  const points = useMemo(() => {
    // generate smooth tide curve with 2 high, 2 low
    const pts = [];
    const n = 60;
    for (let i = 0; i <= n; i++) {
      const x = (i / n) * width;
      // two full sine cycles (12h each)
      const t = (i / n) * Math.PI * 2;
      const y = height / 2 - Math.cos(t) * (height / 2 - 18);
      pts.push({ x, y });
    }
    return pts;
  }, []);

  const pathD = useMemo(() => {
    if (points.length < 2) return '';
    let d = `M ${points[0].x} ${points[0].y}`;
    for (let i = 1; i < points.length; i++) {
      d += ` L ${points[i].x} ${points[i].y}`;
    }
    return d;
  }, [points]);

  const areaD = useMemo(() => {
    if (!pathD) return '';
    return pathD + ` L ${width} ${height} L 0 ${height} Z`;
  }, [pathD, width, height]);

  // key tide points
  const t0 = { x: width * 0.18, y: 18 };      // high1
  const t1 = { x: width * 0.43, y: height - 18 }; // low1
  const t2 = { x: width * 0.68, y: 18 };      // high2
  const t3 = { x: width * 0.93, y: height - 18 }; // low2

  return (
    <div style={{ position: 'relative', width: '100%', height: 180, marginTop: 8 }}>
      <svg width="100%" height="180" viewBox={`0 0 ${width} ${height + 30}`} style={{ overflow: 'visible' }}>
        <defs>
          <linearGradient id="tideGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#2d7a7a" stopOpacity="0.5"/>
            <stop offset="100%" stopColor="#2d7a7a" stopOpacity="0.05"/>
          </linearGradient>
        </defs>
        {/* grid */}
        {[0, 0.25, 0.5, 0.75, 1].map((r, i) => (
          <line key={i} x1="0" y1={r * height} x2={width} y2={r * height}
            stroke="rgba(255,255,255,0.15)" strokeDasharray="2 4"/>
        ))}
        {/* area */}
        <path d={areaD} fill="url(#tideGrad)" className="wave-anim" style={{ transformOrigin: 'center' }}/>
        {/* line */}
        <path d={pathD} fill="none" stroke="#faf6f0" strokeWidth="2.5" strokeLinecap="round"/>

        {/* best window highlight */}
        <rect x={width * 0.3} y="0" width={width * 0.2} height={height}
          fill="rgba(232,114,92,0.15)" rx="6"/>
        <line x1={width * 0.3} y1="0" x2={width * 0.3} y2={height}
          stroke="#e8725c" strokeWidth="1.5" strokeDasharray="3 3"/>
        <line x1={width * 0.5} y1="0" x2={width * 0.5} y2={height}
          stroke="#e8725c" strokeWidth="1.5" strokeDasharray="3 3"/>

        {/* high/low points */}
        {[{...t0, label: today.high1.time, sub: '满潮'},
          {...t1, label: today.low1.time, sub: '干潮'},
          {...t2, label: today.high2.time, sub: '满潮'},
          {...t3, label: today.low2.time, sub: '干潮'}].map((p, i) => (
          <g key={i}>
            <circle cx={p.x} cy={p.y} r="6" fill="#e8725c" stroke="#fff" strokeWidth="2"/>
            <text x={p.x} y={i % 2 === 0 ? p.y - 14 : p.y + 26}
              textAnchor="middle" fill="#faf6f0" fontSize="11" fontWeight="600">{p.label}</text>
            <text x={p.x} y={i % 2 === 0 ? p.y - 2 : p.y + 38}
              textAnchor="middle" fill="rgba(250,246,240,0.6)" fontSize="9">{p.sub}</text>
          </g>
        ))}
      </svg>
    </div>
  );
}

   ───────────────────────────────────────── */

function useToast() {
  const [msg, setMsg] = useState(null);
  const timer = useRef(null);
  const show = useCallback((text) => {
    if (timer.current) clearTimeout(timer.current);
    setMsg(text);
    timer.current = setTimeout(() => setMsg(null), 1800);
  }, []);
  useEffect(() => () => { if (timer.current) clearTimeout(timer.current); }, []);
  return [msg, show];
}

  const [ptrOffset, setPtrOffset] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const [animKey, setAnimKey] = useState(0);
  const startY = useRef(0);
  const isPulling = useRef(false);
  const ptrTimer = useRef(null);

  // trigger entrance anim on mount
  useEffect(() => {
    setAnimKey(k => k + 1);
  }, []);

  // pull to refresh
  const onTouchStart = (e) => {
    if (scrollRef.current.scrollTop <= 0) {
      startY.current = e.touches[0].clientY;
      isPulling.current = true;
    }
  };
  const onTouchMove = (e) => {
    if (!isPulling.current) return;
    const dy = e.touches[0].clientY - startY.current;
    if (dy > 0 && scrollRef.current.scrollTop <= 0) {
      const offset = Math.min(dy * 0.5, 80);
      setPtrOffset(offset);
      e.preventDefault();
    }
  };
  const onTouchEnd = () => {
    if (!isPulling.current) return;
    isPulling.current = false;
    if (ptrOffset > 50 && !refreshing) {
      setRefreshing(true);
      setPtrOffset(50);
      if (ptrTimer.current) clearTimeout(ptrTimer.current);
      ptrTimer.current = setTimeout(() => {
        setRefreshing(false);
        setPtrOffset(0);
        onShowToast('潮况已更新');
        setAnimKey(k => k + 1);
      }, 1200);
    } else {
      setPtrOffset(0);
    }

  const firstDay = 5; // Saturday index 6 but we use Mon-first
  const days = [];
  // leading days from July (31 days)
  for (let i = 0; i < firstDay; i++) {

  TIDE_DATA.monthDays.forEach(d => days.push({ day: d.day, type: d.type, out: false }));
  // fill trailing

function MapPage({ onShowToast }) {
  const [drawerState, setDrawerState] = useState('peek'); // peek, half, full
  const [selectedSpot, setSelectedSpot] = useState(null);
  const startY = useRef(0);
  const startState = useRef('peek');
  const drawerRef = useRef(null);
  const [dragY, setDragY] = useState(0);

  const drawerHeights = { peek: 180, half: 420, full: 700 };

  const handleStart = (clientY) => {
    startY.current = clientY;
    startState.current = drawerState;
  };

  const handleMove = (clientY) => {
    const dy = startY.current - clientY;
    setDragY(dy);
  };

  const handleEnd = (clientY) => {
    const dy = startY.current - clientY;
    const currentHeight = drawerHeights[drawerState];
    const newHeight = currentHeight + dy;
    // snap
    if (newHeight < (drawerHeights.peek + drawerHeights.half) / 2) {
      setDrawerState('peek');
    } else if (newHeight < (drawerHeights.half + drawerHeights.full) / 2) {
      setDrawerState('half');
    } else {
      setDrawerState('full');
    }
    setDragY(0);
  };

  const currentHeight = drawerHeights[drawerState] + dragY;

  return (
    <div className="page">
      {/* Map area */}
      <div style={{
        position: 'absolute', inset: 0,
        backgroundImage: `url(/spark/app/app_17c9b6s73uu/runtime/api/v1/storage/object/bucket_aadkqjzvqqoco_static/static%2Faadkqjxvwnggu_ve_miaoda)`,

        position: 'absolute', inset: 0,

        display: 'flex', alignItems: 'center', gap: 10,

          flex: 1, height: 40,
          background: 'rgba(250,246,240,0.92)',
          backdropFilter: 'blur(12px)',
          WebkitBackdropFilter: 'blur(12px)',
          borderRadius: 14,
          display: 'flex', alignItems: 'center', padding: '0 14px',
          gap: 8,
          boxShadow: '0 2px 8px rgba(0,0,0,0.08)',
        }}>

            left: `${spot.x}%`,

          onMouseLeave={(e) => { if (e.buttons) handleEnd(e.clientY); }}
          onTouchStart={(e) => handleStart(e.touches[0].clientY)}

function FavoritesPage({ favorites, onRemove, onShowToast }) {
  const [openSwipe, setOpenSwipe] = useState(null);
  const [longPress, setLongPress] = useState(null);
  const lpTimer = useRef(null);

  const handleLongPress = (item, e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    lpTimer.current = setTimeout(() => {
      setLongPress({ id: item.id, x: rect.width - 12, y: rect.top - 80 });
    }, 500);
  };

  const cancelLongPress = () => {
    if (lpTimer.current) clearTimeout(lpTimer.current);
  };

  useEffect(() => () => {
    if (lpTimer.current) clearTimeout(lpTimer.current);
  }, []);

  const handleSwipe = (id, dir) => {
    if (dir < -30) setOpenSwipe(id);
    else if (dir > 30) setOpenSwipe(null);
  };

  const touchStart = useRef({ x: 0, id: null });

  return (
    <div className="page" style={{ background: '#f5e6d0' }}>
      <div className="page-scroll">
        <div style={{ padding: '64px 16px 16px' }}>
          <div className="serif" style={{ fontSize: 34, fontWeight: 700, color: '#1a3a3a', marginBottom: 4 }}>
            我的收藏
          </div>
          <div style={{ fontSize: 13, color: '#7a6b5a' }}>
            {favorites.length} 种已收藏物种
          </div>
        </div>

        {favorites.length === 0 ? (
          <div style={{
            padding: '60px 20px', textAlign: 'center', color: '#9a8a75',
          }}>
            <div style={{ fontSize: 48, marginBottom: 12 }}>🐚</div>
            <div style={{ fontSize: 15, color: '#7a6b5a' }}>还没有收藏</div>
            <div style={{ fontSize: 12, marginTop: 4 }}>去图鉴页发现喜欢的物种吧</div>
          </div>
        ) : (
          <div style={{ padding: '0 16px 100px', display: 'flex', flexDirection: 'column', gap: 10 }}>
            {favorites.map((item, idx) => {
              const isOpen = openSwipe === item.id;
              return (
                <div
                  key={item.id}
                  className="swipe-row"
                  style={{ borderRadius: 16, overflow: 'hidden' }}
                  onTouchStart={(e) => {
                    touchStart.current = { x: e.touches[0].clientX, id: item.id };
                    handleLongPress(item, e);
                  }}
                  onTouchMove={(e) => {
                    cancelLongPress();
                    const dx = e.touches[0].clientX - touchStart.current.x;
                    handleSwipe(item.id, dx);
                  }}
                  onTouchEnd={cancelLongPress}
                  onMouseDown={(e) => handleLongPress(item, e)}
                  onMouseUp={cancelLongPress}
                  onMouseLeave={cancelLongPress}
                >
                  <div className="swipe-actions">
                    <div className="swipe-btn" style={{ background: '#2d7a7a' }} onClick={() => {
                      setOpenSwipe(null);
                      onShowToast('已分享');
                    }}>分享</div>
                    <div className="swipe-btn" style={{ background: '#e8725c' }} onClick={() => {
                      onRemove(item.id);
                      setOpenSwipe(null);
                      onShowToast('已移除收藏');
                    }}>删除</div>
                  </div>
                  <div style={{
                    display: 'flex', alignItems: 'center', gap: 12,
                    padding: 12, background: '#faf6f0',
                    transform: `translateX(${isOpen ? -144 : 0}px)`,
                    transition: 'transform 0.3s cubic-bezier(.22,1,.36,1)',
                    cursor: 'pointer',
                    animation: `slideUp 0.4s cubic-bezier(.22,1,.36,1) ${idx * 0.06}s both`,
                  }}>
                    <div style={{
                      width: 56, height: 56, borderRadius: 12,
                      backgroundImage: `url(${item.img})`,
                      backgroundSize: 'cover', backgroundPosition: 'center',
                      flexShrink: 0,
                    }}/>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 16, fontWeight: 600, color: '#1a3a3a' }}>{item.name}</div>
                      <div style={{ fontSize: 11, color: '#9a8a75', fontStyle: 'italic', marginTop: 2 }}>{item.sci}</div>
                      <div style={{ fontSize: 12, color: item.color, marginTop: 4, fontWeight: 500 }}>{item.season}</div>
                    </div>
                    <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
                      <path d="M1 1l6 6-6 6" stroke="#c4b4a0" strokeWidth="2" fill="none" strokeLinecap="round"/>
                    </svg>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        <div style={{
          margin: '16px 16px 16px', padding: '12px 14px',
          background: '#faf6f0', borderRadius: 14,
          fontSize: 12, color: '#7a6b5a',
          display: 'flex', alignItems: 'center', gap: 10,
        }}>
          <div style={{ opacity: 0.6 }}>
            <Icon.More />
          </div>
          <span>左滑删除或分享 · 长按弹出快捷菜单</span>
        </div>
      </div>

      {/* long press menu */}
      {longPress && (
        <>
          <div
            style={{
              position: 'absolute', inset: 0, zIndex: 79,
            }}
            onClick={() => setLongPress(null)}
          />
          <div
            className="lpmenu"
            style={{
              right: 28,
              top: longPress.y,
            }}
          >
            <div className="lpmenu-item" onClick={() => {
              setLongPress(null);
              onShowToast('已分享到微信');
            }}>
              <Icon.Share /> 分享
            </div>
            <div className="lpmenu-item" onClick={() => {
              setLongPress(null);
              onShowToast('已添加到相册');
            }}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <path d="M21 15l-5-5L5 21"/>
              </svg>
              保存图片
            </div>
            <div className="lpmenu-sep"/>
            <div className="lpmenu-item danger" onClick={() => {
              onRemove(longPress.id);
              setLongPress(null);
              onShowToast('已移除收藏');
            }}>
              <Icon.Trash /> 移除收藏
            </div>
          </div>
        </>
      )}
    </div>
  );
}

                      display: 'flex', flexDirection: 'column', gap: 4,
                    }}>
                      {ep.params.map((p, i) => (
                        <div key={i} style={{
                          display: 'flex', gap: 8,
                          padding: '6px 10px',
                          background: '#f5e6d0',
                          borderRadius: 8,
                          fontSize: 12,
                        }}>
                          <code style={{ color: '#e8725c', fontWeight: 600, minWidth: 70, fontFamily: 'monospace' }}>
                            {p.k}
                          </code>
                          <span style={{ color: '#2d7a7a', minWidth: 60, fontFamily: 'monospace', fontSize: 11 }}>
                            {p.type}
                          </span>
                          <span style={{ color: '#7a6b5a', flex: 1 }}>{p.desc}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                  {/* response */}
                  <div>
                    <div style={{
                      fontSize: 11, color: '#7a6b5a', fontWeight: 600,
                      marginBottom: 6, textTransform: 'uppercase', letterSpacing: 1,
                    }}>响应示例</div>
                    <div
                      className="code-block"
                      dangerouslySetInnerHTML={{ __html: colorizeJson(ep.response) }}
                    />
                  </div>
                </div>
              )}
            </div>
          ))}

          {/* status codes */}
          <div style={{
            background: '#faf6f0', borderRadius: 16, padding: 16,
            marginTop: 8,
          }}>
            <div style={{
              fontSize: 11, color: '#7a6b5a', fontWeight: 600,
              marginBottom: 10, textTransform: 'uppercase', letterSpacing: 1,
            }}>状态码</div>
            {[
              { code: 0, msg: '成功', c: '#4a6b4a' },
              { code: 400, msg: '请求参数错误', c: '#c4784a' },
              { code: 401, msg: '未授权', c: '#c4784a' },
              { code: 404, msg: '资源不存在', c: '#c4784a' },
              { code: 500, msg: '服务器内部错误', c: '#e8725c' },
            ].map(s => (
              <div key={s.code} style={{
                display: 'flex', alignItems: 'center', gap: 10,
                padding: '6px 0',
                borderBottom: '0.5px solid rgba(0,0,0,0.05)',
                fontSize: 13,
              }}>
                <code style={{
                  color: s.c, fontWeight: 600, minWidth: 50,
                  fontFamily: 'monospace',
                }}>{s.code}</code>
                <span style={{ color: '#1a3a3a' }}>{s.msg}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────
   ROOT APP
   ───────────────────────────────────────── */

function App() {
  const [tab, setTab] = useState('home');
  const [detailSpecies, setDetailSpecies] = useState(null);
  const [showMore, setShowMore] = useState(false);
  const [toastMsg, setToastMsg] = useState(null);
  const [favorites, setFavorites] = useState(FAV_INITIAL);

  const toastTimer = useRef(null);
  const showToast = useCallback((msg) => {
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setToastMsg(msg);
    toastTimer.current = setTimeout(() => setToastMsg(null), 1800);
  }, []);

  useEffect(() => () => {
    if (toastTimer.current) clearTimeout(toastTimer.current);
  }, []);

  const isFav = (sp) => favorites.some(f => f.id === sp.id);

  const toggleFav = (sp) => {
    setFavorites(prev =>
      prev.some(f => f.id === sp.id)
        ? prev.filter(f => f.id !== sp.id)
        : [...prev, sp]
    );
  };

  const removeFav = (id) => {
    setFavorites(prev => prev.filter(f => f.id !== id));
  };

  const openSpecies = (sp) => {
    setDetailSpecies(sp);
  };

  const navigateTo = (key) => {
    if (['home', 'calendar', 'species', 'map'].includes(key)) {
      setTab(key);
    } else if (key === 'favorites') {
      setTab('favorites');
    } else if (key === 'design') {
      setTab('design');
    } else if (key === 'api') {
      setTab('api');
    }
    setDetailSpecies(null);
  };

  const tabs = [
    { key: 'home', label: '今日', icon: <Icon.Home active={tab === 'home'}/> },
    { key: 'calendar', label: '潮汐', icon: <Icon.Calendar active={tab === 'calendar'}/> },
    { key: 'species', label: '图鉴', icon: <Icon.Book active={tab === 'species'}/> },
    { key: 'map', label: '发现', icon: <Icon.Map active={tab === 'map'}/> },
    { key: 'more', label: '更多', icon: <Icon.More active={tab === 'more'}/> },
  ];

  const handleTabChange = (key) => {
    if (key === 'more') {
      setShowMore(true);
    } else {
      setTab(key);
      setDetailSpecies(null);
    }
  };

  // status bar dark for home (dark hero)
  const isDarkStatus = tab === 'home' && !detailSpecies;

  return (
    <>
      <StatusBar dark={isDarkStatus}/>
      <div style={{ position: 'absolute', inset: 0 }}>
        {tab === 'home' && <HomePage onOpenSpecies={openSpecies} onShowToast={showToast}/>}
        {tab === 'calendar' && <CalendarPage />}
        {tab === 'species' && <SpeciesPage onOpenSpecies={openSpecies}/>}
        {tab === 'map' && <MapPage onShowToast={showToast}/>}
        {tab === 'favorites' && <FavoritesPage favorites={favorites} onRemove={removeFav} onShowToast={showToast}/>}
        {tab === 'design' && <DesignSystemPage />}
        {tab === 'api' && <ApiDocsPage />}

        {/* Detail overlay */}
        {detailSpecies && (
          <div style={{
            position: 'absolute', inset: 0, zIndex: 55,
            animation: 'fadeIn 0.35s cubic-bezier(.22,1,.36,1)',
          }}>
            <SpeciesDetailPage
              species={detailSpecies}
              onBack={() => setDetailSpecies(null)}
              onShowToast={showToast}
              isFav={isFav(detailSpecies)}
              onToggleFav={toggleFav}
            />
          </div>
        )}
      </div>

      {/* Tab bar */}
      {!detailSpecies && (
        <TabBar active={tab === 'favorites' || tab === 'design' || tab === 'api' ? 'more' : tab} onChange={handleTabChange} tabs={tabs}/>
      )}
      {!detailSpecies && <div className="home-indicator"/>}
      {detailSpecies && <div className="home-indicator light"/>}

      {/* More sheet */}
      {showMore && <MoreSheet onClose={() => setShowMore(false)} onNavigate={navigateTo}/>}

      {/* Toast */}
      {toastMsg && <div className="toast">{toastMsg}</div>}
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// announce upgrade
function announceUpgrade() {
  window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
}
announceUpgrade();
if (document.readyState !== 'complete') window.addEventListener('load', announceUpgrade, { once: true });
</script>
</body>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>古琴谱 · 减字谱学习与曲库</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" />
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #2a2520;
      font-family: "Noto Sans SC", -apple-system, system-ui, sans-serif;
      overflow: hidden;
      color: #1a1a1a;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Stage */
    .stage {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at center, #3a3028 0%, #1a1512 70%),
        #1a1512;
      overflow: hidden;
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(200,66,60,0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(184,150,106,0.06) 0%, transparent 40%);
      pointer-events: none;
    }

    /* Custom cursor */
    .custom-cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      border: 2px solid #c8423c;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.2s cubic-bezier(.4,0,.2,1), height 0.2s cubic-bezier(.4,0,.2,1),
                  background-color 0.2s, border-color 0.2s;
      mix-blend-mode: difference;
    }
    .custom-cursor::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      background: #c8423c;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s;
    }
    .custom-cursor.hovering {
      width: 40px;
      height: 40px;
      border-color: #f5ecd9;
      background: rgba(200,66,60,0.15);
    }
    .custom-cursor.hovering::after {
      width: 2px;
      height: 2px;
      background: #f5ecd9;
    }

    /* Phone frame wrapper */
    .phone-wrap {
      position: relative;
      filter: drop-shadow(0 40px 80px rgba(0,0,0,0.6));
    }

    /* Page transition */
    .page-container {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .page {
      position: absolute;
      inset: 0;
      background: #f5ecd9;
      overflow: hidden;
      will-change: transform, opacity;
    }
    .page.entering {
      animation: pageEnter 0.35s cubic-bezier(.22,.61,.36,1) forwards;
    }
    .page.leaving {
      animation: pageLeave 0.35s cubic-bezier(.22,.61,.36,1) forwards;
      pointer-events: none;
    }
    @keyframes pageEnter {
      from { transform: translateX(100%); opacity: 0.8; }
      to   { transform: translateX(0); opacity: 1; }
    }
    @keyframes pageLeave {
      from { transform: translateX(0); opacity: 1; }
      to   { transform: translateX(-30%); opacity: 0.4; }
    }
    .page.back-enter {
      animation: pageBackEnter 0.35s cubic-bezier(.22,.61,.36,1) forwards;
    }
    .page.back-leave {
      animation: pageBackLeave 0.35s cubic-bezier(.22,.61,.36,1) forwards;
      pointer-events: none;
    }
    @keyframes pageBackEnter {
      from { transform: translateX(-30%); opacity: 0.4; }
      to   { transform: translateX(0); opacity: 1; }
    }
    @keyframes pageBackLeave {
      from { transform: translateX(0); opacity: 1; }
      to   { transform: translateX(100%); opacity: 0.8; }
    }

    /* Rice paper texture */
    .rice-paper {
      position: absolute;
      inset: 0;
      background: #f5ecd9;
      pointer-events: none;
    }
    .rice-paper::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(ellipse 120% 80% at 50% 0%, rgba(26,26,26,0.03) 0%, transparent 60%),
        radial-gradient(circle at 10% 20%, rgba(184,150,106,0.06) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(184,150,106,0.05) 0%, transparent 25%),
        radial-gradient(circle at 50% 50%, rgba(200,66,60,0.02) 0%, transparent 50%);
    }
    .rice-paper::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.5;
      mix-blend-mode: multiply;
    }

    /* WeChat capsule button */
    .wx-capsule {
      position: absolute;
      top: calc(var(--ios-safe-top, 54px) + 6px);
      right: 12px;
      width: 87px;
      height: 32px;
      background: rgba(26,26,26,0.08);
      border: 1px solid rgba(26,26,26,0.1);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background 0.3s, border-color 0.3s;
    }
    .wx-capsule.dark {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.2);
    }
    .wx-capsule-btn {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.6;
    }
    .wx-capsule-divider {
      width: 1px;
      height: 16px;
      background: rgba(26,26,26,0.15);
    }
    .wx-capsule.dark .wx-capsule-divider {
      background: rgba(255,255,255,0.2);
    }

    /* Navigation bar */
    .nav-bar {
      position: relative;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 50px 0 16px;
      z-index: 50;
    }
    .nav-title {
      font-family: "Noto Serif SC", serif;
      font-weight: 600;
      font-size: 17px;
      color: #1a1a1a;
      letter-spacing: 1px;
    }
    .nav-back {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .nav-back:active { background: rgba(26,26,26,0.08); }

    /* Tab Bar */
    .tab-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      padding-bottom: calc(var(--ios-safe-bottom, 20px));
      background: rgba(245,236,217,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(26,26,26,0.08);
      display: flex;
      align-items: stretch;
      z-index: 100;
    }
    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s cubic-bezier(.34,1.56,.64,1);
    }
    .tab-item:active { transform: scale(0.92); }
    .tab-icon {
      width: 24px;
      height: 24px;
      position: relative;
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
    }
    .tab-item.active .tab-icon {
      transform: translateY(-2px) scale(1.1);
    }
    .tab-item.active .tab-icon::after {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%) scaleX(1);
      width: 16px;
      height: 2px;
      background: #c8423c;
      border-radius: 1px;
      animation: tabInk 0.4s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    @keyframes tabInk {
      from { transform: translateX(-50%) scaleX(0); opacity: 0; }
      to   { transform: translateX(-50%) scaleX(1); opacity: 1; }
    }
    .tab-label {
      font-size: 10px;
      color: #8a8275;
      font-weight: 500;
      transition: color 0.3s;
    }
    .tab-item.active .tab-label {
      color: #c8423c;
    }
    .tab-item.active .tab-icon svg {
      stroke: #c8423c;
      fill: rgba(200,66,60,0.1);
    }
    .tab-icon svg {
      stroke: #8a8275;
      fill: none;
      transition: stroke 0.3s, fill 0.3s;
    }

    /* Scrollable content area */
    .scroll-area {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 56px;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .scroll-area::-webkit-scrollbar { display: none; }
    .scroll-area.no-tab { bottom: 0; }

    /* Pull to refresh */
    .ptr-indicator {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%) translateY(-50px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 5;
    }
    .ptr-indicator.active {
      opacity: 1;
      transform: translateX(-50%) translateY(12px);
    }
    .ptr-ink {
      width: 24px;
      height: 24px;
      position: relative;
    }
    .ptr-ink-drop {
      width: 100%;
      height: 100%;
      background: #1a1a1a;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      animation: inkDrop 1.2s ease-in-out infinite;
    }
    @keyframes inkDrop {
      0%, 100% { transform: rotate(-45deg) scale(1); opacity: 0.6; }
      50% { transform: rotate(-45deg) scale(0.7); opacity: 1; }
    }
    .ptr-text {
      font-size: 11px;
      color: #8a8275;
      font-family: "Noto Serif SC", serif;
    }

    /* Scroll content */
    .scroll-content {
      position: relative;
      min-height: 100%;
      transition: transform 0.3s cubic-bezier(.22,.61,.36,1);
    }

    /* HOME PAGE */
    .home-hero {
      position: relative;
      height: 320px;
      margin: 0 16px 20px;
      border-radius: 20px;
      overflow: hidden;
      background: linear-gradient(160deg, #1a1a1a 0%, #2a2520 60%, #1a1a1a 100%);
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(.22,.61,.36,1);
    }
    .home-hero:active { transform: scale(0.98); }
    .home-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cellipse cx='200' cy='180' rx='160' ry='20' fill='rgba(200,66,60,0.08)'/%3E%3Cpath d='M40 160 Q200 100 360 160' stroke='%23b8966a' stroke-width='2' fill='none' opacity='0.3'/%3E%3Cpath d='M40 175 Q200 115 360 175' stroke='%23b8966a' stroke-width='1.5' fill='none' opacity='0.25'/%3E%3Cpath d='M40 190 Q200 130 360 190' stroke='%23b8966a' stroke-width='1' fill='none' opacity='0.2'/%3E%3Ccircle cx='60' cy='160' r='4' fill='%23c8423c' opacity='0.6'/%3E%3Ccircle cx='120' cy='135' r='3' fill='%23c8423c' opacity='0.5'/%3E%3Ccircle cx='200' cy='115' r='4' fill='%23c8423c' opacity='0.6'/%3E%3Ccircle cx='280' cy='135' r='3' fill='%23c8423c' opacity='0.5'/%3E%3Ccircle cx='340' cy='160' r='4' fill='%23c8423c' opacity='0.6'/%3E%3C/svg%3E");
      background-size: cover;
      opacity: 0.8;
    }
    .hero-qin-body {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-15deg);
      width: 280px;
      height: 60px;
      background: linear-gradient(90deg, #3a2a1a 0%, #5a3a22 30%, #6b4a2a 50%, #5a3a22 70%, #3a2a1a 100%);
      border-radius: 30px 10px 10px 30px;
      box-shadow:
        0 8px 20px rgba(0,0,0,0.5),
        inset 0 2px 6px rgba(255,255,255,0.1);
    }
    .hero-string {
      position: absolute;
      left: 30px;
      right: 20px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #d4c4a0, #e8d8b8, #d4c4a0, transparent);
    }
    .hero-emblem {
      position: absolute;
      top: 24px;
      left: 24px;
      width: 40px;
      height: 40px;
      background: #c8423c;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f5ecd9;
      font-family: "Noto Serif SC", serif;
      font-weight: 700;
      font-size: 18px;
      transform: rotate(-5deg);
      box-shadow: 0 2px 8px rgba(200,66,60,0.4);
    }
    .hero-title {
      position: absolute;
      bottom: 60px;
      left: 24px;
      color: #f5ecd9;
      font-family: "Noto Serif SC", serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 8px;
    }
    .hero-subtitle {
      position: absolute;
      bottom: 32px;
      left: 24px;
      color: rgba(245,236,217,0.6);
      font-size: 12px;
      letter-spacing: 2px;
    }
    .hero-streak {
      position: absolute;
      top: 24px;
      right: 24px;
      text-align: right;
      color: #f5ecd9;
    }
    .hero-streak-num {
      font-family: "Noto Serif SC", serif;
      font-size: 32px;
      font-weight: 700;
      color: #c8423c;
      line-height: 1;
    }
    .hero-streak-label {
      font-size: 10px;
      color: rgba(245,236,217,0.6);
      margin-top: 4px;
      letter-spacing: 1px;
    }

    /* Category quick grid */
    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 0 20px 12px;
    }
    .section-title h3 {
      font-family: "Noto Serif SC", serif;
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
      position: relative;
      padding-left: 12px;
    }
    .section-title h3::before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 16px;
      background: #c8423c;
      border-radius: 2px;
    }
    .section-title .more {
      font-size: 12px;
      color: #8a8275;
      cursor: pointer;
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 0 20px 24px;
    }
    .cat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .cat-item:active { transform: scale(0.92); }
    .cat-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: #faf5eb;
      border: 1px solid rgba(26,26,26,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }
    .cat-item:active .cat-icon {
      background: #1a1a1a;
    }
    .cat-item:active .cat-icon svg { stroke: #f5ecd9; }
    .cat-icon svg { stroke: #1a1a1a; transition: stroke 0.3s; }
    .cat-label {
      font-size: 12px;
      color: #4a4a4a;
    }

    /* Recommended tunes - card stack */
    .tune-stack {
      padding: 0 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .tune-card {
      position: relative;
      background: #faf5eb;
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(.22,.61,.36,1), box-shadow 0.3s;
      border: 1px solid rgba(26,26,26,0.05);
      overflow: hidden;
    }
    .tune-card:active {
      transform: scale(0.98);
      box-shadow: 0 4px 12px rgba(26,26,26,0.1);
    }
    .tune-card-inner {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .tune-cover {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1a1a1a 0%, #3a2a1a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
    }
    .tune-cover-text {
      font-family: "Noto Serif SC", serif;
      font-size: 22px;
      font-weight: 700;
      color: #c8423c;
    }
    .tune-info {
      flex: 1;
      min-width: 0;
    }
    .tune-name {
      font-family: "Noto Serif SC", serif;
      font-size: 17px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tune-meta {
      display: flex;
      gap: 10px;
      font-size: 11px;
      color: #8a8275;
      margin-bottom: 6px;
    }
    .tune-tag {
      display: inline-block;
      padding: 2px 8px;
      background: rgba(200,66,60,0.1);
      color: #c8423c;
      border-radius: 4px;
      font-size: 10px;
      margin-right: 4px;
    }
    .tune-progress {
      height: 3px;
      background: rgba(26,26,26,0.06);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
    }
    .tune-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #c8423c, #e05a54);
      border-radius: 2px;
      transition: width 0.6s ease;
    }
    .tune-play {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.2s;
    }
    .tune-card:active .tune-play { background: #c8423c; transform: scale(1.1); }
    .tune-play svg { stroke: #f5ecd9; fill: none; }

    /* New to you - horizontal scroll */
    .h-scroll {
      display: flex;
      gap: 12px;
      padding: 0 20px 24px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .h-scroll::-webkit-scrollbar { display: none; }
    .mini-card {
      flex-shrink: 0;
      width: 140px;
      border-radius: 14px;
      overflow: hidden;
      background: #faf5eb;
      border: 1px solid rgba(26,26,26,0.05);
      cursor: pointer;
      transition: transform 0.3s;
    }
    .mini-card:active { transform: scale(0.96); }
    .mini-card-img {
      height: 90px;
      background: linear-gradient(135deg, #1a1a1a, #3a2a1a);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mini-card-body {
      padding: 10px 12px;
    }
    .mini-card-title {
      font-family: "Noto Serif SC", serif;
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 4px;
    }
    .mini-card-sub {
      font-size: 11px;
      color: #8a8275;
    }

    /* REPERTOIRE PAGE */
    .rep-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(245,236,217,0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .rep-search {
      margin: 0 16px 12px;
      height: 36px;
      background: #faf5eb;
      border: 1px solid rgba(26,26,26,0.08);
      border-radius: 18px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 8px;
    }
    .rep-search input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 14px;
      color: #1a1a1a;
      font-family: inherit;
    }
    .rep-search input::placeholder { color: #8a8275; }

    .rep-tabs {
      display: flex;
      gap: 20px;
      padding: 0 20px 12px;
      overflow-x: auto;
      scrollbar-width: none;
      position: relative;
    }
    .rep-tabs::-webkit-scrollbar { display: none; }
    .rep-tab {
      flex-shrink: 0;
      font-size: 14px;
      color: #8a8275;
      padding: 4px 0;
      cursor: pointer;
      position: relative;
      font-family: "Noto Serif SC", serif;
      transition: color 0.3s;
    }
    .rep-tab.active {
      color: #1a1a1a;
      font-weight: 600;
      font-size: 16px;
    }
    .rep-tab.active::after {
      content: "";
      position: absolute;
      bottom: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;

      100% { background-position: -200% 0; }

    .toast {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(26,26,26,0.85);
      color: #f5ecd9;

    function HomePage({ onNavigate, onShowToast }) {
      const scrollRef = useRef(null);
      const [ptr, setPtr] = useState(false);
      const [ptrDist, setPtrDist] = useState(0);
      const startY = useRef(0);
      const reducedMotion = useRef(
        typeof window !== 'undefined' && window.matchMedia('(prefers-reduced-motion: reduce)').matches
      );

      const handleTouchStart = (e) => {
        if (scrollRef.current.scrollTop <= 0) {
          startY.current = e.touches ? e.touches[0].clientY : e.clientY;
        }
      };
      const handleTouchMove = (e) => {
        if (scrollRef.current.scrollTop <= 0 && startY.current) {
          const y = e.touches ? e.touches[0].clientY : e.clientY;
          const dist = Math.max(0, (y - startY.current) * 0.5);
          setPtrDist(Math.min(dist, 60));
          if (dist > 40) setPtr(true);
          else setPtr(false);
        }
      };
      const handleTouchEnd = () => {
        if (ptr && ptrDist > 40) {
          onShowToast("琴谱已更新");
          setTimeout(() => { setPtr(false); setPtrDist(0); }, 800);
        } else {
          setPtrDist(0);
        }
        startY.current = 0;
      };

      return (
        <div className="page">
          <div className="rice-paper"></div>

                  animationDuration: `${8 + i * 0.5}s`,
                }}

            onTouchStart={handleTouchStart}
            onTouchMove={handleTouchMove}

    // ─── Main App ───
    function App() {
      const [pageStack, setPageStack] = useState([{ key: 'home', direction: 'forward' }]);
      const [isTransitioning, setIsTransitioning] = useState(false);
      const [toast, setToast] = useState(null);
      const reducedMotion = useRef(
        typeof window !== 'undefined' && window.matchMedia('(prefers-reduced-motion: reduce)').matches
      );

      const currentPage = pageStack[pageStack.length - 1];

      const navigate = useCallback((key) => {
        if (isTransitioning) return;

        // Tab bar items replace the stack root
        const tabKeys = ['home', 'repertoire', 'practice', 'community', 'profile'];
        if (tabKeys.includes(key)) {
          setIsTransitioning(true);
          setPageStack([{ key, direction: 'tab' }]);
          setTimeout(() => setIsTransitioning(false), reducedMotion.current ? 10 : 350);
          return;
        }

        // Push new page
        setIsTransitioning(true);
        setPageStack([...pageStack, { key, direction: 'forward' }]);
        setTimeout(() => setIsTransitioning(false), reducedMotion.current ? 10 : 350);
      }, [pageStack, isTransitioning]);

      const goBack = useCallback(() => {
        if (isTransitioning || pageStack.length <= 1) return;
        setIsTransitioning(true);
        setPageStack(pageStack.slice(0, -1).map(p => ({ ...p, direction: 'back' })));
        setTimeout(() => setIsTransitioning(false), reducedMotion.current ? 10 : 350);
      }, [pageStack, isTransitioning]);

      const showToast = useCallback((message) => {
        setToast({ message, id: Date.now() });
      }, []);

      const renderPage = (page, idx, isTop) => {
        const animClass = isTop
          ? (page.direction === 'back' ? 'page back-enter' : 'page entering')
          : '';

        const pageProps = { onNavigate: navigate, onBack: goBack, onShowToast: showToast };

        let content;
        switch (page.key) {
          case 'home': content = <HomePage {...pageProps} />; break;
          case 'repertoire': content = <RepertoirePage {...pageProps} />; break;
          case 'notation': content = <NotationPage {...pageProps} />; break;
          case 'practice': content = <PracticePage {...pageProps} />; break;
          case 'community': content = <CommunityPage {...pageProps} />; break;
          case 'profile': content = <ProfilePage {...pageProps} />; break;
          case 'spec': content = <SpecPage onBack={goBack} />; break;
          case 'api': content = <ApiPage onBack={goBack} />; break;
          default: content = <HomePage {...pageProps} />;
        }

        return (
          <div
            key={`${page.key}-${idx}`}
            className={`page-container ${isTop ? animClass : ''}`}
            style={{ zIndex: idx + 1 }}
          >
            {content}
          </div>
        );
      };

      return (
        <div className="stage">
          <div className="phone-wrap">
            {/* Device frame - custom WeChat mini-program style phone */}
            <div
              style={{
                width: 390,
                height: 844,
                background: '#1a1a1a',
                borderRadius: 52,
                padding: 12,
                boxShadow: '0 0 0 2px #2a2520, 0 0 0 4px #1a1a1a',
                position: 'relative',
              }}
            >
              {/* Screen */}
              <div
                style={{
                  position: 'relative',
                  width: '100%',
                  height: '100%',
                  borderRadius: 40,
                  overflow: 'hidden',
                  background: '#f5ecd9',
                }}
              >
                {/* Dynamic Island */}
                <div
                  style={{
                    position: 'absolute',
                    top: 12,
                    left: '50%',
                    transform: 'translateX(-50%)',
                    width: 120,
                    height: 34,
                    background: '#1a1a1a',
                    borderRadius: 20,
                    zIndex: 200,
                  }}
                ></div>

                {/* Status bar */}
                <div
                  style={{
                    position: 'absolute',
                    top: 0,
                    left: 0,
                    right: 0,
                    height: 54,
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'space-between',
                    padding: '21px 28px 0',
                    zIndex: 150,
                    pointerEvents: 'none',
                    fontSize: 15,
                    fontWeight: 600,
                    color: '#1a1a1a',
                    fontFamily: '-apple-system, system-ui, sans-serif',
                  }}
                >
                  <span>9:41</span>
                  <div style={{ display: 'flex', gap: 5, alignItems: 'center' }}>
                    {/* signal */}
                    <svg width="18" height="12" viewBox="0 0 18 12">
                      <rect x="0" y="7.5" width="3" height="4.5" rx="0.7" fill="#1a1a1a"/>
                      <rect x="4.5" y="5" width="3" height="7" rx="0.7" fill="#1a1a1a"/>
                      <rect x="9" y="2.5" width="3" height="9.5" rx="0.7" fill="#1a1a1a"/>
                      <rect x="13.5" y="0" width="3" height="12" rx="0.7" fill="#1a1a1a"/>
                    </svg>
                    {/* wifi */}
                    <svg width="16" height="12" viewBox="0 0 16 12">
                      <path d="M8 2.5C10.5 2.5 12.8 3.5 14.5 5l1-1.2C13.2 1.8 10.8 0.8 8 0.8C5.2 0.8 2.8 1.8 0.5 3.8L1.5 5C3.2 3.5 5.5 2.5 8 2.5Z" fill="#1a1a1a"/>
                      <path d="M8 6.2C9.4 6.2 10.7 6.8 11.7 7.8L12.7 6.8C11.4 5.5 9.8 4.8 8 4.8C6.2 4.8 4.6 5.5 3.3 6.8L4.3 7.8C5.3 6.8 6.6 6.2 8 6.2Z" fill="#1a1a1a"/>
                      <circle cx="8" cy="10" r="1.5" fill="#1a1a1a"/>
                    </svg>
                    {/* battery */}
                    <svg width="26" height="12" viewBox="0 0 26 12">
                      <rect x="1" y="1" width="21" height="10" rx="2.5" fill="none" stroke="#1a1a1a" strokeWidth="1"/>
                      <rect x="2.5" y="2.5" width="17" height="7" rx="1.5" fill="#1a1a1a"/>
                      <rect x="23" y="4" width="1.5" height="4" rx="0.75" fill="#1a1a1a"/>
                    </svg>
                  </div>
                </div>

                {/* Pages */}
                {pageStack.map((page, idx) => renderPage(page, idx, idx === pageStack.length - 1))}

                {/* Home indicator */}
                <div
                  style={{
                    position: 'absolute',
                    bottom: 8,
                    left: '50%',
                    transform: 'translateX(-50%)',
                    width: 134,
                    height: 5,
                    background: '#1a1a1a',
                    borderRadius: 3,
                    zIndex: 150,
                    opacity: 0.3,
                  }}
                ></div>

                {/* Toast */}
                {toast && <Toast key={toast.id} message={toast.message} onClose={() => setToast(null)} />}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─── Custom Cursor ───
    function initCursor() {
      const cursor = document.getElementById('customCursor');
      if (!cursor) return;

      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      let cursorX = mouseX;
      let cursorY = mouseY;
      let rafId = null;
      let visible = true;

      const updateCursor = () => {
        if (!visible) return;
        // Direct DOM transform for perf
        cursorX += (mouseX - cursorX) * 0.15;
        cursorY += (mouseY - cursorY) * 0.15;
        cursor.style.transform = `translate(${cursorX}px, ${cursorY}px) translate(-50%, -50%)`;
        rafId = requestAnimationFrame(updateCursor);
      };

      const handleMove = (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      };

      const handleOver = (e) => {
        if (e.target.closest('button, .tab-item, .cat-item, .tune-card, .mini-card, .rep-item, .jianzi-char, .fab, .bottom-btn, .practice-item, .community-card, .menu-item, .profile-row, .filter-chip, .endpoint, .spec-swatch, .demo-btn, .nav-back, .goal-start, .swipe-btn, .fab-publish, .practice-check, .more, .fab-menu-icon, .action-sheet-item, .action-sheet-cancel')) {
          cursor.classList.add('hovering');
        }
      };

      const handleOut = (e) => {
        cursor.classList.remove('hovering');
      };

      const handleVisibility = () => {
        if (document.hidden) {
          visible = false;
          if (rafId) cancelAnimationFrame(rafId);
        } else {
          visible = true;
          rafId = requestAnimationFrame(updateCursor);
        }
      };

      // Initialize at center
      cursor.style.left = '0';
      cursor.style.top = '0';
      cursor.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;

      document.addEventListener('mousemove', handleMove, { passive: true });
      document.addEventListener('mouseover', handleOver);
      document.addEventListener('mouseout', handleOut);
      document.addEventListener('visibilitychange', handleVisibility);

      rafId = requestAnimationFrame(updateCursor);

      return () => {
        document.removeEventListener('mousemove', handleMove);
        document.removeEventListener('mouseover', handleOver);
        document.removeEventListener('mouseout', handleOut);
        document.removeEventListener('visibilitychange', handleVisibility);
        if (rafId) cancelAnimationFrame(rafId);
      };
    }

    // ─── Render ───
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Init custom cursor after DOM ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initCursor, { once: true });
    } else {
      initCursor();
    }

    // Announce upgrade
    function announceUpgrade() {
      if (window.parent) {
        window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
      }
    }
    announceUpgrade();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announceUpgrade, { once: true });
    }
  </script>
</body>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="creative-medium" content="interactive-prototype">
<title>飞羽 · 观鸟记录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    background: #1a1a1a;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: radial-gradient(ellipse at center, #2a3a35 0%, #0d1412 100%);
  }

  /* ===== Phone Frame ===== */
  .phone-wrapper {
    position: relative;
    width: 375px;
    height: 812px;
    perspective: 1000px;
  }
  .phone-frame {
    position: absolute;
    inset: 0;
    background: #0a0a0a;
    border-radius: 48px;
    padding: 10px;
    box-shadow:
      0 40px 80px rgba(0, 0, 0, 0.6),
      0 10px 20px rgba(0, 0, 0, 0.4),
      inset 0 0 0 1px rgba(255, 255, 255, 0.05);
  }
  .phone-screen {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 40px;
    overflow: hidden;
    background: #F5F2EB;
  }

  /* Status bar */
  .status-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    z-index: 100;
    font-size: 15px;
    font-weight: 600;
    color: #1a1a1a;
    pointer-events: none;
  }
  .status-bar.dark { color: #fff; }
  .status-right { display: flex; align-items: center; gap: 6px; }
  .status-bar svg { width: 18px; height: 12px; }

  /* Notch */
  .notch {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 28px;
    background: #000;
    border-radius: 20px;
    z-index: 101;
  }

  /* WeChat capsule */
  .wx-capsule {
    position: absolute;
    top: 52px;
    right: 12px;
    width: 87px;
    height: 32px;
    background: rgba(0, 0, 0, 0.08);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    z-index: 100;
    padding: 0 4px;
  }
  .wx-capsule.dark { background: rgba(255, 255, 255, 0.15); }
  .wx-capsule svg { width: 18px; height: 18px; stroke: #333; fill: none; stroke-width: 1.8; }
  .wx-capsule.dark svg { stroke: #fff; }
  .wx-capsule-divider {
    width: 0.5px;
    height: 16px;
    background: rgba(0, 0, 0, 0.15);
  }
  .wx-capsule.dark .wx-capsule-divider { background: rgba(255, 255, 255, 0.25); }

  /* Page container */
  .page-container {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  .page {
    position: absolute;
    inset: 0;
    background: #F5F2EB;
    overflow-y: auto;
    overflow-x: hidden;
    will-change: transform;
    transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    -webkit-overflow-scrolling: touch;
  }
  .page::-webkit-scrollbar { display: none; }

  /* Tab pages (bottom tab bar pages) */
  .page.tab-page {
    padding-bottom: 70px;
  }

  /* Page transitions */
  .page.enter-from-right {
    transform: translateX(100%);
    animation: slideInRight 0.35s cubic-bezier(0.32, 0.72, 0, 1) forwards;
  }
  .page.exit-to-left {
    animation: slideOutLeft 0.35s cubic-bezier(0.32, 0.72, 0, 1) forwards;
  }
  @keyframes slideInRight {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }
  @keyframes slideOutLeft {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(-25%); opacity: 0.6; }
  }
  @keyframes slideInLeft {
    from { transform: translateX(-25%); opacity: 0.6; }
    to { transform: translateX(0); opacity: 1; }
  }
  .page.back-from-left {
    animation: slideInLeft 0.35s cubic-bezier(0.32, 0.72, 0, 1) forwards;
  }
  .page.exit-to-right {
    animation: slideOutRight 0.35s cubic-bezier(0.32, 0.72, 0, 1) forwards;
  }
  @keyframes slideOutRight {
    from { transform: translateX(0); }
    to { transform: translateX(100%); }
  }

  /* ===== Tab Bar ===== */
  .tab-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 70px;
    background: rgba(245, 242, 235, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 0.5px solid rgba(45, 74, 62, 0.1);
    display: flex;
    align-items: flex-start;
    padding-top: 8px;
    z-index: 50;
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    transition: transform 0.2s ease;
    position: relative;
  }
  .tab-item:active { transform: scale(0.92); }
  .tab-item svg {
    width: 26px;
    height: 26px;
    stroke: #8A9A97;
    fill: none;
    stroke-width: 1.8;
    transition: stroke 0.3s ease;
  }
  .tab-item.active svg {
    stroke: #2D4A3E;
  }
  .tab-item .tab-label {
    font-size: 10px;
    color: #8A9A97;
    transition: color 0.3s ease;
    font-weight: 500;
  }
  .tab-item.active .tab-label {
    color: #2D4A3E;
    font-weight: 600;
  }
  .tab-item.active .wing-flutter {
    animation: wingFlutter 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  @keyframes wingFlutter {
    0%, 100% { transform: scaleY(1); }
    30% { transform: scaleY(0.7) translateY(2px); }
    60% { transform: scaleY(1.15) translateY(-1px); }
  }

  /* ===== Home Page ===== */
  .home-header {
    padding: 56px 20px 16px;
    background: linear-gradient(180deg, #2D4A3E 0%, #3a5a4d 60%, #F5F2EB 100%);
    position: relative;
    overflow: hidden;
  }
  .home-greeting {
    color: rgba(245, 242, 235, 0.85);
    font-size: 13px;
    margin-bottom: 4px;
    font-weight: 400;
  }
  .home-title {
    color: #F5F2EB;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 16px;
  }
  .home-title .accent { color: #E8D48A; }

  .quick-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 8px;
  }
  .stat-card {
    background: rgba(245, 242, 235, 0.12);
    backdrop-filter: blur(10px);
    border-radius: 14px;
    padding: 12px 10px;
    text-align: center;
    border: 1px solid rgba(232, 212, 138, 0.2);
  }
  .stat-num {
    color: #E8D48A;
    font-size: 22px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-label {
    color: rgba(245, 242, 235, 0.7);
    font-size: 11px;
  }

  /* Falling feathers */
  .feather {
    position: absolute;
    width: 16px;
    height: 28px;
    pointer-events: none;
    opacity: 0;
    will-change: transform, opacity;
  }
  @keyframes featherFall {
    0% {
      transform: translateY(-40px) rotate(0deg) translateX(0);
      opacity: 0;
    }
    10% { opacity: 0.6; }
    90% { opacity: 0.4; }
    100% {
      transform: translateY(300px) rotate(360deg) translateX(30px);
      opacity: 0;
    }
  }

  .home-section {
    padding: 20px;
  }
  .section-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .section-title {
    font-size: 17px;
    font-weight: 700;
    color: #2D4A3E;
  }
  .section-title::before {
    content: '';
    display: inline-block;
    width: 3px;
    height: 14px;
    background: #E8D48A;
    border-radius: 2px;
    margin-right: 8px;
    vertical-align: -1px;
  }
  .section-more {
    font-size: 12px;
    color: #8A9A97;
  }

  /* Bird feed cards */
  .feed-card {
    background: #fff;
    border-radius: 18px;
    overflow: hidden;
    margin-bottom: 16px;
    box-shadow: 0 4px 20px rgba(45, 74, 62, 0.08);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
    cursor: pointer;
  }
  .feed-card:active {
    transform: scale(0.97);
    box-shadow: 0 2px 10px rgba(45, 74, 62, 0.12);
  }
  .feed-card-img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    background: #ddd;
  }
  .feed-card-body {
    padding: 14px 16px;
  }
  .feed-card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .user-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #E8D48A, #2D4A3E);
  }
  .user-name {
    font-size: 13px;
    font-weight: 600;
    color: #2D4A3E;
    flex: 1;
  }
  .bird-tag {
    background: rgba(232, 212, 138, 0.2);
    color: #2D4A3E;
    padding: 3px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
  }
  .feed-card-title {
    font-size: 15px;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 6px;
    line-height: 1.4;
  }
  .feed-card-loc {
    font-size: 12px;
    color: #8A9A97;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .feed-card-loc svg { width: 12px; height: 12px; stroke: #8A9A97; fill: none; stroke-width: 2; }
  .feed-card-footer {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 16px 14px;
  }
  .action-icon {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: #8A9A97;
  }
  .action-icon svg {
    width: 16px;
    height: 16px;
    stroke: #8A9A97;
    fill: none;
    stroke-width: 1.8;
    transition: all 0.3s ease;
  }
  .action-icon.liked svg {
    stroke: #e06666;
    fill: #e06666;
    animation: heartPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes heartPop {
    0% { transform: scale(1); }
    40% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }
  .action-icon.liked { color: #e06666; }

  /* Today's highlight card */
  .highlight-card {
    background: linear-gradient(135deg, #2D4A3E 0%, #3d5c4e 100%);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s ease;
  }
  .highlight-card:active { transform: scale(0.97); }
  .highlight-badge {
    display: inline-block;
    background: #E8D48A;
    color: #2D4A3E;
    padding: 3px 10px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .highlight-title {
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .highlight-desc {
    color: rgba(255, 255, 255, 0.7);
    font-size: 12px;
    line-height: 1.6;
    margin-bottom: 12px;
  }
  .highlight-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(232, 212, 138, 0.2);
    border: 1px solid rgba(232, 212, 138, 0.4);
    color: #E8D48A;
    padding: 6px 14px;
    border-radius: 14px;
    font-size: 12px;
    font-weight: 500;
  }
  .highlight-deco {
    position: absolute;
    right: -20px;
    bottom: -20px;
    width: 120px;
    height: 120px;
    opacity: 0.15;
  }

  /* Stagger entrance */
  .stagger-item {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeInUp 0.6s cubic-bezier(0.32, 0.72, 0, 1) forwards;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== Field Guide Page ===== */
  .guide-header {
    padding: 56px 20px 12px;
    background: #F5F2EB;
  }
  .guide-title {
    font-size: 22px;
    font-weight: 700;
    color: #2D4A3E;
    margin-bottom: 12px;
  }
  .search-bar {
    display: flex;
    align-items: center;
    background: #fff;
    border-radius: 12px;
    padding: 10px 14px;
    gap: 8px;
    box-shadow: 0 2px 10px rgba(45, 74, 62, 0.06);
  }
  .search-bar svg { width: 16px; height: 16px; stroke: #8A9A97; fill: none; stroke-width: 2; }
  .search-bar input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 14px;
    color: #2D4A3E;
    background: transparent;
  }
  .search-bar input::placeholder { color: #8A9A97; }

  /* Sticky category tabs */
  .sticky-tabs {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(245, 242, 235, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 10px 20px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    border-bottom: 0.5px solid rgba(45, 74, 62, 0.08);
  }
  .sticky-tabs::-webkit-scrollbar { display: none; }
  .cat-tab {
    flex-shrink: 0;
    padding: 7px 16px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 500;
    color: #5a6e68;
    background: rgba(138, 154, 151, 0.12);
    cursor: pointer;
    transition: all 0.3s ease;
    white-space: nowrap;
  }
  .cat-tab.active {
    background: #2D4A3E;
    color: #E8D48A;
    font-weight: 600;
  }

  /* Bird grid */
  .bird-grid {
    padding: 16px 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .bird-grid-card {
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(45, 74, 62, 0.06);
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .bird-grid-card:active { transform: scale(0.95); }
  .bird-grid-img {
    width: 100%;
    height: 120px;
    object-fit: cover;
    background: #ddd;
  }
  .bird-grid-info {
    padding: 10px 12px;
  }
  .bird-grid-name {
    font-size: 14px;
    font-weight: 600;
    color: #2D4A3E;
    margin-bottom: 3px;
  }
  .bird-grid-sci {
    font-size: 10px;
    font-style: italic;
    color: #8A9A97;
    margin-bottom: 6px;
  }
  .bird-grid-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .conservation-badge {
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 600;
  }
  .conservation-badge.lc { background: rgba(46, 139, 87, 0.15); color: #2e8b57; }
  .conservation-badge.nt { background: rgba(255, 193, 7, 0.2); color: #c79a00; }
  .conservation-badge.vu { background: rgba(255, 107, 107, 0.15); color: #e06666; }
  .seen-indicator {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #2D4A3E;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .seen-indicator svg {
    width: 10px;
    height: 10px;
    stroke: #E8D48A;
    fill: none;
    stroke-width: 2.5;
  }

  /* Pull to refresh indicator */
  .pull-refresh {
    text-align: center;
    padding: 10px;
    font-size: 12px;
    color: #8A9A97;
    height: 0;
    overflow: hidden;
    transition: height 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .pull-refresh.show { height: 50px; }
  .pull-refresh .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(45, 74, 62, 0.2);
    border-top-color: #2D4A3E;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== Detail Page ===== */
  .detail-page {
    background: #F5F2EB;
  }
  .detail-hero {
    position: relative;
    height: 340px;
    overflow: hidden;
  }
  .detail-hero-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    will-change: transform;
  }
  .detail-hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 40%, rgba(0,0,0,0.6) 100%);
  }
  .detail-back-btn {
    position: absolute;
    top: 52px;
    left: 16px;
    width: 36px;
    height: 36px;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10;
    transition: transform 0.2s ease;
  }
  .detail-back-btn:active { transform: scale(0.9); }
  .detail-back-btn svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2; }

  .detail-hero-info {
    position: absolute;
    bottom: 20px;
    left: 20px;
    right: 20px;
    color: #fff;
    z-index: 5;
  }
  .detail-bird-name {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: 1px;
  }
  .detail-bird-sci {
    font-size: 13px;
    font-style: italic;
    opacity: 0.8;
    margin-bottom: 10px;
  }
  .detail-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .detail-tag {
    padding: 3px 10px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 500;
    background: rgba(232, 212, 138, 0.25);
    color: #E8D48A;
    backdrop-filter: blur(4px);
  }

  .detail-body {
    padding: 20px;
  }
  .detail-section {
    margin-bottom: 24px;
  }
  .detail-section-title {
    font-size: 16px;
    font-weight: 700;
    color: #2D4A3E;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .detail-section-title::before {
    content: '';
    width: 4px;
    height: 16px;
    background: #E8D48A;
    border-radius: 2px;
  }
  .detail-text {
    font-size: 14px;
    color: #4a5c57;
    line-height: 1.8;
  }

  /* Info grid */
  .info-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .info-item {
    background: #fff;
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 2px 8px rgba(45, 74, 62, 0.05);
  }
  .info-item-label {
    font-size: 11px;
    color: #8A9A97;
    margin-bottom: 4px;
  }
  .info-item-value {
    font-size: 14px;
    font-weight: 600;
    color: #2D4A3E;
  }

  /* Bottom action bar */
  .detail-bottom-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: calc(375px - 20px);
    max-width: 355px;
    padding: 14px 20px 24px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 60;
  }
  .bottom-action-icon {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: rgba(45, 74, 62, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .bottom-action-icon:active { transform: scale(0.9); }
  .bottom-action-icon svg {
    width: 22px;
    height: 22px;
    stroke: #2D4A3E;
    fill: none;
    stroke-width: 1.8;
  }
  .bottom-action-icon.favorited svg { stroke: #e06666; fill: #e06666; }
  .primary-btn {
    flex: 1;
    height: 48px;
    background: linear-gradient(135deg, #2D4A3E, #3d5c4e);
    color: #E8D48A;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s ease;
  }
  .primary-btn:active { transform: scale(0.97); opacity: 0.9; }

  /* Gallery */

  /* ===== Action Sheet ===== */
  .actionsheet-mask {

    transition: opacity 0.3s ease;

  /* ===== Toast ===== */
  .toast {

    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(26, 45, 38, 0.9);
    backdrop-filter: blur(10px);
    color: #E8D48A;
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 14px;
    z-index: 300;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    align-items: center;
    gap: 8px;

  .toast svg { width: 18px; height: 18px; stroke: #E8D48A; fill: none; stroke-width: 2; }

  /* Floating action button */
  .fab {

// ===== Main App =====
function App() {
  const [activeTab, setActiveTab] = useState('home');
  const [pageStack, setPageStack] = useState([{ name: 'home', direction: 'forward' }]);
  const [showActionSheet, setShowActionSheet] = useState(false);
  const [toast, setToast] = useState({ show: false, msg: '' });
  const [feedLikes, setFeedLikes] = useState({});
  const [favoritedBirds, setFavoritedBirds] = useState({});
  const toastTimerRef = useRef(null);
  const animationFrameRef = useRef(null);
  const visibilityRef = useRef(true);

  const currentPage = pageStack[pageStack.length - 1];

  const showToastMsg = useCallback((msg) => {
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    setToast({ show: true, msg });
    toastTimerRef.current = setTimeout(() => {
      setToast({ show: false, msg: '' });
    }, 2000);
  }, []);

  const navigateTo = useCallback((pageName) => {
    setPageStack(prev => [...prev, { name: pageName, direction: 'forward' }]);
  }, []);

  const goBack = useCallback(() => {
    if (pageStack.length > 1) {
      setPageStack(prev => {
        const next = [...prev];
        next[next.length - 1] = { ...next[next.length - 1], direction: 'backward' };
        return next;
      });
      setTimeout(() => {
        setPageStack(prev => prev.slice(0, -1));
      }, 330);
    }
  }, [pageStack.length]);

  const switchTab = useCallback((tab) => {
    setActiveTab(tab);
    setPageStack([{ name: tab, direction: 'forward' }]);
  }, []);

  const toggleLike = useCallback((id) => {
    setFeedLikes(prev => ({ ...prev, [id]: !prev[id] }));
  }, []);

  const toggleFavorite = useCallback((id) => {
    setFavoritedBirds(prev => ({ ...prev, [id]: !prev[id] }));
    showToastMsg(favoritedBirds[id] ? '已取消收藏' : '已加入收藏');
  }, [favoritedBirds, showToastMsg]);

  // Visibility change handler for pausing animations
  useEffect(() => {
    const handleVisibility = () => {
      visibilityRef.current = !document.hidden;
      if (document.hidden) {
        if (animationFrameRef.current) {
          cancelAnimationFrame(animationFrameRef.current);
          animationFrameRef.current = null;
        }
      }
    };
    document.addEventListener('visibilitychange', handleVisibility);
    return () => {
      document.removeEventListener('visibilitychange', handleVisibility);
      if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
      if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    };
  }, []);

  return (
    <>
      {/* Status bar */}
      <div className={`status-bar ${currentPage.name === 'detail' ? 'dark' : ''}`}>
        <span>9:41</span>
        <div className="status-right">

          <svg viewBox="0 0 18 12" fill="currentColor"><path d="M9 10.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM3.5 7.5l1.5 1.5a5 5 0 0 1 8 0l1.5-1.5a7 7 0 0 0-11 0zM0.5 4.5l1.5 1.5a9 9 0 0 1 14 0l1.5-1.5a11 11 0 0 0-17 0z"/></svg>
          {/* battery */}
          <svg viewBox="0 0 26 12"><rect x="1" y="1" width="21" height="10" rx="2.5" stroke="currentColor" fill="none" strokeWidth="1"/><rect x="3" y="3" width="17" height="6" rx="1" fill="currentColor"/><rect x="23" y="4" width="2" height="4" rx="1" fill="currentColor"/></svg>
        </div>
      </div>
      <div className="notch"></div>
      <div className={`wx-capsule ${currentPage.name === 'detail' ? 'dark' : ''}`}>
        <div className="wx-capsule-divider"></div>

          <circle cx="12" cy="12" r="10"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
      </div>

      {/* Page stack rendering */}
      <div className="page-container">
        {pageStack.map((page, idx) => {

// ===== Home Page =====
function HomePage({ onOpenDetail, onOpenPublish, onOpenNotify, feedLikes, toggleLike }) {
  const [pullDistance, setPullDistance] = useState(0);
  const [isRefreshing, setIsRefreshing] = useState(false);
  const startYRef = useRef(0);
  const pageRef = useRef(null);
  const featherRefs = useRef([]);
  const featherTimers = useRef([]);

  // Falling feathers animation on mount
  useEffect(() => {
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReduced) return;

    featherTimers.current.forEach(t => clearTimeout(t));
    featherTimers.current = [];

    for (let i = 0; i < 5; i++) {
      const timer = setTimeout(() => {
        if (featherRefs.current[i]) {
          const el = featherRefs.current[i];
          const left = 10 + Math.random() * 80;
          const duration = 3 + Math.random() * 2;
          const delay = Math.random() * 0.5;
          el.style.left = `${left}%`;
          el.style.top = '10px';
          el.style.opacity = '0';
          el.style.animation = `featherFall ${duration}s cubic-bezier(0.32, 0.72, 0, 1) ${delay}s forwards`;
        }
      }, i * 400 + 200);
      featherTimers.current.push(timer);
    }

    return () => {
      featherTimers.current.forEach(t => clearTimeout(t));
    };
  }, []);

  // Pull to refresh (simplified)
  const handleTouchStart = (e) => {
    if (pageRef.current?.scrollTop === 0) {
      startYRef.current = e.touches[0].clientY;
    }
  };
  const handleTouchMove = (e) => {
    if (startYRef.current && !isRefreshing) {
      const diff = e.touches[0].clientY - startYRef.current;
      if (diff > 0 && pageRef.current?.scrollTop === 0) {
        setPullDistance(Math.min(diff * 0.5, 60));
      }
    }
  };
  const handleTouchEnd = () => {
    if (pullDistance > 40 && !isRefreshing) {
      setIsRefreshing(true);
      setPullDistance(50);
      setTimeout(() => {
        setIsRefreshing(false);
        setPullDistance(0);
      }, 1200);
    } else {
      setPullDistance(0);
    }
    startYRef.current = 0;
  };

  return (
    <div
      className="page tab-page"
      ref={pageRef}
      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}
      onTouchEnd={handleTouchEnd}
      style={{ paddingBottom: 70 }}
    >
      {/* Header with gradient */}
      <div className="home-header">
        {/* Falling feathers */}
        {[0,1,2,3,4].map(i => (
          <svg
            key={i}
            ref={el => featherRefs.current[i] = el}
            className="feather"
            viewBox="0 0 24 40"
            fill="#E8D48A"
            opacity="0.6"
          >
            <path d="M12 0C6 10 3 22 3 32c0 3 2 6 5 7 0-6 2-12 5-20 2 8 4 14 4 20 3-1 5-4 5-7 0-10-3-22-9-32z"/>
            <line x1="12" y1="0" x2="12" y2="39" stroke="rgba(45,74,62,0.3)" strokeWidth="0.8"/>
          </svg>
        ))}

        <p className="home-greeting">早上好，观鸟人 · 今日适宜户外观鸟</p>
        <h1 className="home-title">飞羽 <span className="accent">观鸟</span> 记录</h1>

        <div className="quick-stats">
          <div className="stat-card stagger-item" style={{ animationDelay: '0.1s' }}>
            <div className="stat-num">87</div>
            <div className="stat-label">已记录</div>
          </div>
          <div className="stat-card stagger-item" style={{ animationDelay: '0.2s' }}>
            <div className="stat-num">23</div>
            <div className="stat-label">本月新种</div>
          </div>
          <div className="stat-card stagger-item" style={{ animationDelay: '0.3s' }}>
            <div className="stat-num">12</div>
            <div className="stat-label">连续打卡</div>
          </div>
        </div>
      </div>

      {/* Pull to refresh indicator */}
      <div
        className="pull-refresh"
        style={{ height: isRefreshing || pullDistance > 0 ? `${isRefreshing ? 50 : pullDistance}px` : 0 }}
      >
        {isRefreshing ? (
          <>
            <div className="spinner"></div>
            <span>正在刷新...</span>
          </>
        ) : pullDistance > 40 ? (
          <span>松手刷新</span>
        ) : pullDistance > 0 ? (
          <span>下拉刷新</span>
        ) : null}
      </div>

      {/* Today's highlight */}
      <div className="home-section">
        <div className="highlight-card stagger-item" style={{ animationDelay: '0.4s' }} onClick={onOpenDetail}>
          <span className="highlight-badge">今日稀有</span>
          <h3 className="highlight-title">朱鹮现身德清湿地</h3>
          <p className="highlight-desc">国家一级保护动物朱鹮近日在德清下渚湖湿地被观察到，这是本年度第3次记录...</p>
          <span className="highlight-btn">查看详情 <Icons.ChevronRight /></span>
          {/* Decorative feather */}
          <svg className="highlight-deco" viewBox="0 0 120 120" fill="#E8D48A">
            <path d="M60 10C35 40 20 70 20 95c0 10 8 18 18 20 0-18 8-38 22-65 11 27 18 47 18 65 10-2 18-10 18-20 0-25-15-55-38-85z"/>
          </svg>
        </div>

        <div className="section-header stagger-item" style={{ animationDelay: '0.5s' }}>
          <h2 className="section-title">观鸟动态</h2>
          <span className="section-more">查看全部</span>

        {/* Feed cards */}

function DetailPage({ onBack, onAction, favorited, onToggleFavorite }) {
  const heroRef = useRef(null);
  const pageRef = useRef(null);
  const scrollYRef = useRef(0);
  const rafRef = useRef(null);
  const bird = birdSpecies[0];

  // Parallax effect on scroll using direct DOM transform
  useEffect(() => {
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReduced) return;

    const handleScroll = () => {
      if (!pageRef.current) return;
      scrollYRef.current = pageRef.current.scrollTop;
      if (rafRef.current) return;
      rafRef.current = requestAnimationFrame(() => {
        if (heroRef.current && document.visibilityState === 'visible') {
          const y = scrollYRef.current;
          heroRef.current.style.transform = y > 0
            ? `translateY(${y * 0.3}px) scale(${1 + y * 0.002})`
            : 'translateY(0) scale(1)';
        }
        rafRef.current = null;
      });
    };

    const el = pageRef.current;
    if (el) el.addEventListener('scroll', handleScroll, { passive: true });

    return () => {
      if (el) el.removeEventListener('scroll', handleScroll);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, []);

  return (
    <div className="page detail-page" ref={pageRef} style={{ paddingBottom: 90 }}>
      {/* Hero with parallax */}
      <div className="detail-hero">
        <img
          ref={heroRef}

            <span className="detail-tag">{bird.category}</span>

          <h3 className="detail-section-title">基本信息</h3>
          <div className="info-grid">
            <div className="info-item">
              <div className="info-item-label">体长</div>
              <div className="info-item-value">{bird.size}</div>
            </div>
            <div className="info-item">

              <div className="info-item-value">{bird.weight}</div>

            <div className="info-item">

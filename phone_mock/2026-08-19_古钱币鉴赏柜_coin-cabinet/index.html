<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="creative-medium" content="interactive-prototype">
<title>泉阁 · 古钱币鉴赏柜</title>
<style>
/* ========== Reset & Base ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:#1a1612;color:#e8e2d6;overflow:hidden;user-select:none;-webkit-user-select:none;}
button{border:none;background:none;font:inherit;color:inherit;cursor:pointer;}
ul,ol{list-style:none;}
a{color:inherit;text-decoration:none;}

/* ========== WeChat Mini Program Frame ========== */
.phone-frame{
  position:relative;
  width:390px;
  height:100vh;
  min-height:780px;
  max-height:844px;
  margin:0 auto;
  background:#0f1410;
  overflow:hidden;
  font-size:14px;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
}

/* Status bar */
.status-bar{
  height:44px;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  font-size:15px;
  font-weight:600;
  color:#e8e2d6;
  position:relative;
  z-index:100;
}
.status-bar .status-right{display:flex;align-items:center;gap:5px;font-size:11px;}
.status-bar .signal-dots{display:flex;gap:2px;align-items:flex-end;}
.status-bar .signal-dots span{width:3px;background:#e8e2d6;border-radius:1px;}
.status-bar .signal-dots span:nth-child(1){height:4px;}
.status-bar .signal-dots span:nth-child(2){height:6px;}
.status-bar .signal-dots span:nth-child(3){height:8px;}
.status-bar .signal-dots span:nth-child(4){height:10px;}
.status-bar .battery{
  width:24px;height:11px;border:1px solid #e8e2d6;border-radius:2px;
  display:flex;align-items:center;padding:1px;position:relative;
}
.status-bar .battery::after{
  content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;
  background:#e8e2d6;border-radius:0 1px 1px 0;
}
.status-bar .battery span{flex:1;background:#e8e2d6;border-radius:1px;}

/* Custom navigation bar */
.nav-bar{
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:90;
  background:transparent;
}
.nav-bar .nav-title{
  font-size:17px;
  font-weight:600;
  color:#e8e2d6;
  letter-spacing:0.5px;
}

/* Capsule button (WeChat Mini Program) */
.capsule-btn{
  position:absolute;
  top:54px;
  right:16px;
  width:87px;
  height:32px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:16px;
  display:flex;
  align-items:center;
  z-index:95;
  backdrop-filter:blur(10px);
}
.capsule-btn .capsule-divider{
  width:1px;
  height:16px;
  background:rgba(255,255,255,0.15);
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}
.capsule-btn .capsule-icon{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,255,255,0.8);
  height:100%;
}
.capsule-btn .capsule-icon svg{width:16px;height:16px;}

/* Back button (stack pages) */
.nav-back{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#e8e2d6;
  z-index:91;
}
.nav-back svg{width:20px;height:20px;}

/* ========== Page Stack System ========== */
.page-stack{
  position:absolute;
  top:88px;
  bottom:0;
  left:0;
  right:0;
  overflow:hidden;
}
.page{
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:0;
  background:#0f1410;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  transform:translateX(100%);
  transition:transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
  will-change:transform;
}
.page.active{transform:translateX(0);}
.page.behind{transform:translateX(-30%);}
.page.entering{z-index:20;}

/* Scrollbar hide */
.page::-webkit-scrollbar{display:none;}

/* ========== Tab Bar ========== */
.tab-bar{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:56px;
  background:rgba(15,20,16,0.96);
  backdrop-filter:blur(20px);
  border-top:1px solid rgba(212,175,55,0.12);
  display:flex;
  z-index:80;
  padding-bottom:env(safe-area-inset-bottom, 0);
}
.tab-item{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  color:rgba(232,226,214,0.45);
  font-size:10px;
  transition:color 0.2s;
}
.tab-item.active{color:#d4af37;}
.tab-item svg{width:22px;height:22px;}
.tab-item span{letter-spacing:0.5px;}

/* ========== Pull to Refresh ========== */
.pull-indicator{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:50px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(212,175,55,0.6);
  font-size:12px;
  transform:translateY(-50px);
  transition:transform 0.3s;
  pointer-events:none;
  z-index:1;
}
.pull-indicator .pull-spinner{
  width:16px;height:16px;border:2px solid rgba(212,175,55,0.3);
  border-top-color:#d4af37;border-radius:50%;
  animation:spin 0.8s linear infinite;
  margin-right:8px;
  display:none;
}
.pull-indicator.refreshing .pull-spinner{display:block;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ========== Home / Cabinet Page ========== */
.cabinet-hero{
  padding:12px 20px 8px;
}
.cabinet-hero .hero-label{
  font-size:11px;
  letter-spacing:3px;
  color:rgba(212,175,55,0.6);
  text-transform:uppercase;
}
.cabinet-hero .hero-title{
  font-size:22px;
  font-weight:700;
  color:#e8e2d6;
  margin-top:4px;
  letter-spacing:1px;
}
.cabinet-hero .hero-sub{
  font-size:12px;
  color:rgba(232,226,214,0.5);
  margin-top:6px;
}
.cabinet-hero .hero-stats{
  display:flex;
  gap:20px;
  margin-top:14px;
  padding:12px 16px;
  background:linear-gradient(135deg, rgba(212,175,55,0.08), rgba(70,130,120,0.06));
  border:1px solid rgba(212,175,55,0.15);
  border-radius:10px;
}
.cabinet-hero .stat-item{flex:1;}
.cabinet-hero .stat-num{
  font-size:20px;
  font-weight:700;
  color:#d4af37;
  font-family:"Times New Roman",serif;
}
.cabinet-hero .stat-label{
  font-size:11px;
  color:rgba(232,226,214,0.5);
  margin-top:2px;
}

/* Cabinet drawers */
.drawer-section{
  margin-top:20px;
  padding:0 16px;
}
.drawer-section .section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 4px 10px;
}
.drawer-section .section-title{
  font-size:14px;
  font-weight:600;
  color:#e8e2d6;
  display:flex;
  align-items:center;
  gap:8px;
}
.drawer-section .section-title .ornament{
  width:3px;height:14px;background:#d4af37;border-radius:2px;
}
.drawer-section .section-more{
  font-size:12px;
  color:rgba(212,175,55,0.6);
  display:flex;
  align-items:center;
  gap:2px;
}

/* Coin grid - cabinet tray */
.coin-tray{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:10px;
  padding:14px;
  background:linear-gradient(180deg, #1a1f1a 0%, #141814 100%);
  border:1px solid rgba(212,175,55,0.1);
  border-radius:12px;
  position:relative;
}
.coin-tray::before{
  content:"";
  position:absolute;
  inset:4px;
  border:1px solid rgba(212,175,55,0.06);
  border-radius:8px;
  pointer-events:none;
}
.coin-cell{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  cursor:pointer;
  transition:transform 0.2s;
}
.coin-cell:active{transform:scale(0.95);}
.coin-cell .coin-slot{
  width:82%;
  height:82%;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #2a2418 0%, #0d100d 70%);
  box-shadow:inset 0 2px 8px rgba(0,0,0,0.6), inset 0 -1px 3px rgba(212,175,55,0.1);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}
.coin-cell .coin-face{
  width:70%;
  height:70%;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:700;
  letter-spacing:1px;
  text-align:center;
  line-height:1.1;
  font-family:"STKaiti","KaiTi","Kaiti SC",serif;
  color:#e8d5a0;
  position:relative;
  box-shadow:0 2px 6px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.1);
}
.coin-cell.empty .coin-face{
  border:1px dashed rgba(212,175,55,0.2);
  background:transparent;
  color:rgba(212,175,55,0.3);
  font-size:20px;
  font-weight:300;
  box-shadow:none;
}
.coin-cell .coin-grade{
  position:absolute;
  bottom:2px;
  right:2px;
  font-size:8px;
  padding:1px 4px;
  background:rgba(212,175,55,0.8);
  color:#1a1408;
  border-radius:3px;
  font-weight:600;
}

/* Bronze coin face */
.coin-bronze{
  background:radial-gradient(circle at 35% 30%, #8a7a52 0%, #5c4d2d 40%, #3d3219 80%);
  border:1px solid rgba(180,150,90,0.4);
}
/* Iron coin face */
.coin-iron{
  background:radial-gradient(circle at 35% 30%, #6b4a3a 0%, #4a2e25 40%, #2e1c17 80%);
  border:1px solid rgba(150,90,70,0.4);
}
/* Silver coin face */
.coin-silver{
  background:radial-gradient(circle at 35% 30%, #c0c0c8 0%, #8a8a95 40%, #5a5a65 80%);
  border:1px solid rgba(200,200,220,0.4);
  color:#2a2a30 !important;
}
/* Brass coin face */
.coin-brass{
  background:radial-gradient(circle at 35% 30%, #d4af37 0%, #a07820 40%, #6b5014 80%);
  border:1px solid rgba(220,180,80,0.5);
}

/* Left-swipe wrapper */
.swipe-cell{
  position:relative;
  overflow:hidden;
}
.swipe-cell .swipe-content{
  transition:transform 0.25s cubic-bezier(0.32, 0.72, 0, 1);
  position:relative;
  z-index:2;
  background:#0f1410;
}
.swipe-cell .swipe-actions{
  position:absolute;
  right:0;
  top:0;
  bottom:0;
  display:flex;
  z-index:1;
}
.swipe-cell .swipe-action{
  width:64px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  color:#fff;
  font-weight:500;
}
.swipe-action.edit{background:#d4af37;color:#1a1408;}
.swipe-action.delete{background:#c0483a;}

/* Quick entry row */
.quick-entries{
  display:flex;
  gap:10px;
  padding:16px;
  margin:16px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:10px;
}
.quick-entry{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  padding:10px 0;
  border-radius:8px;
  transition:background 0.2s;
  cursor:pointer;
}
.quick-entry:active{background:rgba(212,175,55,0.1);}
.quick-entry .qe-icon{
  width:36px;height:36px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg, rgba(212,175,55,0.15), rgba(212,175,55,0.05));
  border:1px solid rgba(212,175,55,0.2);
}
.quick-entry .qe-icon svg{width:18px;height:18px;color:#d4af37;}
.quick-entry .qe-label{font-size:11px;color:rgba(232,226,214,0.7);}

/* ========== Half Sheet / Coin Detail ========== */
.half-sheet-mask{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0);
  z-index:200;
  pointer-events:none;
  transition:background 0.3s;
}
.half-sheet-mask.show{background:rgba(0,0,0,0.5);pointer-events:auto;}

.half-sheet{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  background:#141814;
  border-radius:20px 20px 0 0;
  z-index:210;
  transform:translateY(100%);
  transition:transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  max-height:82%;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  border-top:1px solid rgba(212,175,55,0.15);
}
.half-sheet.show{transform:translateY(0);}
.half-sheet .sheet-handle{
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.half-sheet .sheet-handle::before{
  content:"";
  width:36px;
  height:4px;
  background:rgba(255,255,255,0.15);
  border-radius:2px;
}
.half-sheet .sheet-body{
  flex:1;
  overflow-y:auto;
  padding:0 20px 24px;
}
.half-sheet .sheet-body::-webkit-scrollbar{display:none;}

/* Coin detail hero */
.coin-detail-hero{
  display:flex;
  gap:16px;
  padding-bottom:20px;
}
.coin-detail-hero .coin-canvas-wrap{
  width:140px;
  height:140px;
  flex-shrink:0;
  position:relative;
}
.coin-detail-hero .coin-canvas-wrap canvas{
  width:140px;height:140px;
  border-radius:50%;
  cursor:grab;
  touch-action:none;
}
.coin-detail-hero .coin-canvas-wrap canvas:active{cursor:grabbing;}
.coin-detail-hero .coin-info{
  flex:1;
  padding-top:8px;
}
.coin-detail-hero .coin-name{
  font-size:20px;
  font-weight:700;
  color:#e8e2d6;
  font-family:"STKaiti","KaiTi",serif;
  letter-spacing:2px;
}
.coin-detail-hero .coin-dynasty{
  font-size:12px;
  color:rgba(212,175,55,0.7);
  margin-top:4px;
}
.coin-detail-hero .coin-tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:10px;
}
.coin-detail-hero .coin-tag{
  font-size:10px;
  padding:3px 8px;
  background:rgba(212,175,55,0.1);
  border:1px solid rgba(212,175,55,0.2);
  color:#d4af37;
  border-radius:4px;
}
.coin-detail-hero .patina-hint{
  font-size:10px;
  color:rgba(232,226,214,0.4);
  margin-top:10px;
  display:flex;
  align-items:center;
  gap:4px;
}
.coin-detail-hero .patina-hint svg{width:12px;height:12px;}

/* Detail sections */
.detail-section{
  border-top:1px solid rgba(255,255,255,0.06);
  padding:16px 0;
}
.detail-section .ds-title{
  font-size:13px;
  font-weight:600;
  color:#e8e2d6;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:6px;
}
.detail-section .ds-title::before{
  content:"";width:3px;height:12px;background:#d4af37;border-radius:2px;
}
.detail-section .ds-desc{
  font-size:13px;
  color:rgba(232,226,214,0.65);
  line-height:1.7;
}

/* Attribute grid */
.attr-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.attr-item{
  padding:10px 12px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:8px;
}
.attr-item .attr-label{
  font-size:10px;
  color:rgba(232,226,214,0.4);
  margin-bottom:4px;
}
.attr-item .attr-value{
  font-size:14px;
  color:#e8e2d6;
  font-weight:500;
}

/* Sheet action buttons */
.sheet-actions{
  display:flex;
  gap:10px;
  padding:14px 20px 20px;
  flex-shrink:0;
  border-top:1px solid rgba(255,255,255,0.06);
}
.sheet-actions .btn{
  flex:1;
  height:44px;
  border-radius:10px;
  font-size:14px;
  font-weight:600;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity 0.15s, transform 0.1s;
  cursor:pointer;
}
.sheet-actions .btn:active{transform:scale(0.97);opacity:0.8;}
.sheet-actions .btn-primary{
  background:linear-gradient(135deg, #d4af37, #a07820);
  color:#1a1408;
}
.sheet-actions .btn-secondary{
  background:rgba(255,255,255,0.06);
  color:#e8e2d6;
  border:1px solid rgba(255,255,255,0.1);
}

/* ========== Action Sheet ========== */
.action-sheet-mask{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0);
  z-index:300;
  pointer-events:none;
  transition:background 0.3s;
}
.action-sheet-mask.show{background:rgba(0,0,0,0.5);pointer-events:auto;}
.action-sheet{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  z-index:310;
  transform:translateY(100%);
  transition:transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  padding:8px 10px;
  padding-bottom:calc(8px + env(safe-area-inset-bottom, 0));
  background:transparent;
}
.action-sheet.show{transform:translateY(0);}
.action-sheet .as-group{
  background:rgba(30,35,28,0.98);
  border-radius:12px;
  overflow:hidden;
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.06);
}
.action-sheet .as-group + .as-group{margin-top:8px;}
.action-sheet .as-item{
  height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  color:#e8e2d6;
  border-bottom:1px solid rgba(255,255,255,0.06);
  transition:background 0.15s;
  cursor:pointer;
}
.action-sheet .as-item:last-child{border-bottom:none;}
.action-sheet .as-item:active{background:rgba(255,255,255,0.06);}
.action-sheet .as-item.danger{color:#e06555;}
.action-sheet .as-item.cancel{font-weight:600;}

/* ========== Catalog Page (入册) ========== */
.catalog-form{
  padding:16px;
}
.form-group{
  margin-bottom:18px;
}
.form-group .fg-label{
  font-size:13px;
  color:rgba(232,226,214,0.7);
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:6px;
}
.form-group .fg-label .required{color:#e06555;}

.chip-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.chip{
  padding:8px 14px;
  border-radius:20px;
  font-size:12px;
  border:1px solid rgba(255,255,255,0.1);
  color:rgba(232,226,214,0.6);
  background:rgba(255,255,255,0.03);
  transition:all 0.2s;
  cursor:pointer;
}
.chip.active{
  background:rgba(212,175,55,0.15);
  border-color:#d4af37;
  color:#d4af37;
}

.form-input{
  width:100%;
  height:44px;
  padding:0 14px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:10px;
  color:#e8e2d6;
  font-size:14px;
  outline:none;
  transition:border-color 0.2s;
}
.form-input:focus{border-color:#d4af37;}
.form-textarea{
  width:100%;
  min-height:80px;
  padding:12px 14px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:10px;
  color:#e8e2d6;
  font-size:14px;
  outline:none;
  resize:none;
  font-family:inherit;
}
.form-textarea:focus{border-color:#d4af37;}

/* ========== Atlas Page (图谱) ========== */
.atlas-search{
  padding:10px 16px;
  position:sticky;
  top:0;
  background:#0f1410;
  z-index:5;
}
.search-box{
  height:36px;
  background:rgba(255,255,255,0.06);
  border-radius:18px;
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:8px;
}
.search-box svg{width:16px;height:16px;color:rgba(232,226,214,0.4);flex-shrink:0;}
.search-box input{
  flex:1;height:100%;background:transparent;border:none;outline:none;
  color:#e8e2d6;font-size:14px;
}
.search-box input::placeholder{color:rgba(232,226,214,0.3);}

/* ========== Toast ========== */
.toast{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%) scale(0.9);
  background:rgba(20,25,20,0.95);
  color:#e8e2d6;
  padding:12px 20px;
  border-radius:10px;
  font-size:13px;
  z-index:500;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.2s, transform 0.2s;
  border:1px solid rgba(255,255,255,0.1);
  backdrop-filter:blur(10px);
}
.toast.show{opacity:1;transform:translate(-50%, -50%) scale(1);}

@media (prefers-reduced-motion: reduce) {

  .coin-cell{transition:none;}

  .toast{transition:none;}
  .half-sheet-mask{transition:none;}

  .pull-spinner{animation:none;}
}

function switchTab(tab) {
  // Clear page stack when switching tabs
  state.pageStack = [];
  state.currentTab = tab;

  // Update tab bar
  document.querySelectorAll('.tab-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });

  // Show active page
  document.querySelectorAll('.page[data-page]').forEach(p => {
    p.classList.remove('active');
    if (p.dataset.page === tab) p.classList.add('active');
  });

  // Update nav title
  const page = document.querySelector(`.page[data-page="${tab}"]`);
  const title = page ? page.dataset.title : '泉阁';
  updateNav(title, false);

  updateStats();
}

function updateNav(title, showBack) {
  document.getElementById('navTitle').textContent = title;
  document.getElementById('navBack').style.display = showBack ? 'flex' : 'none';
}

// Page stack (push/pop like WeChat mini program navigateTo/navigateBack)
function pushPage(pageName) {
  const pageEl = document.getElementById(pageName + 'Page');
  if (!pageEl) {
    // Build dynamic page
    buildDynamicPage(pageName);
  }

  const allPages = document.querySelectorAll('.page');
  allPages.forEach(p => {
    if (p.classList.contains('active')) {
      p.classList.remove('active');
      p.classList.add('behind');
    }
  });

  const target = document.getElementById(pageName + 'Page');
  if (target) {
    target.classList.add('entering');
    target.style.transform = 'translateX(100%)';
    // Force reflow
    void target.offsetWidth;
    target.classList.add('active');
    target.classList.remove('behind');
    target.style.transform = '';

    // After transition, remove 'behind' from previous
    setTimeout(() => {
      allPages.forEach(p => {
        if (p.id !== pageName + 'Page' && p.classList.contains('behind')) {
          p.classList.remove('behind');
          p.style.transform = 'translateX(-100%)';
        }
      });
    }, 320);

    state.pageStack.push(pageName);
    const titles = { catalog: '入册藏柜', spec: '设计规范', api: '接口文档', market: '行情参考' };
    updateNav(titles[pageName] || pageName, true);
  }
}

function popPage() {
  if (state.pageStack.length === 0) return;

  const currentName = state.pageStack.pop();
  const currentEl = document.getElementById(currentName + 'Page');
  if (!currentEl) return;

  // Slide current page out to right
  currentEl.style.transform = 'translateX(100%)';
  currentEl.classList.remove('active');

  // Restore previous page
  const prevName = state.pageStack.length > 0 ? state.pageStack[state.pageStack.length - 1] : state.currentTab;
  const prevEl = document.getElementById(prevName + 'Page') || document.querySelector(`.page[data-page="${prevName}"]`);
  
  if (prevEl) {
    prevEl.style.transform = '';
    prevEl.classList.add('active');
    prevEl.classList.remove('behind');
  }

  // Clean up dynamic page after transition
  setTimeout(() => {
    if (['catalog', 'spec', 'api'].includes(currentName)) {
      currentEl.remove();
    }
  }, 350);

  if (state.pageStack.length === 0) {
    const titleMap = { cabinet: '泉阁', atlas: '钱文图谱', me: '藏家' };
    updateNav(titleMap[state.currentTab] || '泉阁', false);
  } else {
    const titles = { catalog: '入册藏柜', spec: '设计规范', api: '接口文档', market: '行情参考' };
    updateNav(titles[state.pageStack[state.pageStack.length - 1]] || '...', true);
  }
}

// ---------- Dynamic Pages ----------
function buildDynamicPage(name) {
  const pageStack = document.getElementById('pageStack');
  const page = document.createElement('div');
  page.className = 'page';
  page.id = name + 'Page';
  page.dataset.title = name;

  let content = '';
  if (name === 'catalog') {
    content = buildCatalogPage();
  } else if (name === 'spec') {
    content = buildSpecPage();
  } else if (name === 'api') {
    content = buildApiPage();
  } else if (name === 'market') {
    content = buildMarketPage();
  }

  page.innerHTML = `<div class="tab-content" style="bottom:0;">${content}</div>`;
  pageStack.appendChild(page);
}

// ---------- Catalog Form ----------
function selectDynasty(d) {
  state.catalogForm.dynasty = d;
  updateChips('dynastyChips', d, DYNASTY_OPTIONS);
}
function selectMaterial(m) {
  state.catalogForm.material = m;
  updateChips('materialChips', m, MATERIALS);
}
function selectGrade(g) {
  state.catalogForm.grade = g;
  updateChips('gradeChips', g, GRADES);
}
function updateChips(id, value, options) {
  const container = document.getElementById(id);
  if (!container) return;
  const chips = container.querySelectorAll('.chip');
  chips.forEach((chip, i) => {
    chip.classList.toggle('active', options[i] === value);
  });
}

function submitCatalog() {
  if (!state.catalogForm.dynasty || !state.catalogForm.material || !state.catalogForm.grade) {
    showToast('请完善朝代、材质、品相');
    return;
  }

  const noteEl = document.getElementById('catalogNote');
  if (noteEl) state.catalogForm.note = noteEl.value;

  // Add or update coin in collection
  let coin = getSelectedCoin();
  if (!coin) {
    // Use first one as default for demo
    coin = COINS_DATA[0];
  }
  
  if (coin) {
    coin.inCollection = true;
    coin.grade = state.catalogForm.grade;
    saveCollection();
  }

  showToast('已入册藏柜');
  
  // Close sheet and page, go to cabinet
  closeSheet();
  setTimeout(() => {
    popPage();
    setTimeout(() => {
      switchTab('cabinet');
      renderCoinTray();
      updateStats();
    }, 350);
  }, 600);
}

// ---------- Coin Tray Rendering ----------
function getCollectionCoins() {
  return COINS_DATA.filter(c => c.inCollection);
}

function getSelectedCoin() {
  return COINS_DATA.find(c => c.id === state.selectedCoinId);
}

function renderCoinTray() {
  const tray = document.getElementById('coinTray');
  if (!tray) return;

  const coins = getCollectionCoins();
  
  if (coins.length === 0) {
    tray.innerHTML = `
      <div style="grid-column:1/-1; padding:30px 20px; text-align:center;">
        <div style="font-size:12px; color:rgba(232,226,214,0.35);">藏柜尚虚</div>
        <div style="font-size:11px; color:rgba(232,226,214,0.25); margin-top:4px;">入册第一枚古钱开始收藏</div>
      </div>
    `;
    return;
  }

  // Sort
  let sorted = [...coins];
  if (state.sortBy === 'dynasty') {
    const order = { '唐': 0, '五代': 1, '宋': 2, '辽': 3, '金': 4, '元': 5, '明': 6, '清': 7 };
    sorted.sort((a, b) => (order[a.dynasty] ?? 99) - (order[b.dynasty] ?? 99));
  } else if (state.sortBy === 'value') {
    sorted.sort((a, b) => b.marketValue - a.marketValue);
  } else if (state.sortBy === 'grade') {
    const order = { '近未流通': 0, '极美品': 1, '美品': 2, '上品': 3, '中品': 4 };
    sorted.sort((a, b) => (order[a.grade] ?? 99) - (order[b.grade] ?? 99));
  }

  tray.innerHTML = sorted.map(coin => `
    <div class="coin-cell" onclick="openCoinDetail('${coin.id}')" oncontextmenu="return false;">
      <div class="coin-slot">
        <div class="coin-face coin-${coin.materialClass}" data-coin-id="${coin.id}">
          ${coin.name.substring(0, 2)}<br>${coin.name.substring(2, 4)}
        </div>
        <span class="coin-grade">${coin.grade}</span>
      </div>
    </div>
  `).join('');
}

function updateStats() {
  const coins = getCollectionCoins();
  const total = coins.length;
  const dynasties = new Set(coins.map(c => c.dynasty)).size;
  const totalValue = coins.reduce((s, c) => s + c.marketValue, 0);

  const statTotal = document.getElementById('statTotal');
  const statDyn = document.getElementById('statDynasties');
  const statVal = document.getElementById('statValue');
  if (statTotal) statTotal.textContent = total;
  if (statDyn) statDyn.textContent = dynasties;
  if (statVal) statVal.textContent = totalValue.toLocaleString();

  const mstatTotal = document.getElementById('mstatTotal');
  const mstatDyn = document.getElementById('mstatDyn');
  const mstatVal = document.getElementById('mstatVal');
  if (mstatTotal) mstatTotal.textContent = total;
  if (mstatDyn) mstatDyn.textContent = dynasties;
  if (mstatVal) mstatVal.textContent = totalValue.toLocaleString();
}

// ---------- Signature Effect: Patina Rotation ----------
function initPatinaCanvas(coin) {
  const canvas = document.getElementById('patinaCanvas');
  if (!canvas) return;
  
  patinaCanvas = canvas;
  patinaCtx = canvas.getContext('2d');
  coinDataForCanvas = coin;
  patinaAngle = Math.random() * Math.PI * 2;
  patinaAngularVel = 0;
  patinaIsDragging = false;

  // Set up event listeners for drag rotation
  const startDrag = (e) => {
    patinaIsDragging = true;
    const p = getEventPoint(e, canvas);
    patinaLastX = p.x;
    patinaLastY = p.y;
    patinaLastTime = performance.now();
    patinaAngularVel = 0;
    e.preventDefault();
  };
  
  const moveDrag = (e) => {
    if (!patinaIsDragging || !patinaCanvas) return;
    const p = getEventPoint(e, canvas);
    const rect = canvas.getBoundingClientRect();
    const cx = rect.width / 2;
    const cy = rect.height / 2;
    
    const lastAngle = Math.atan2(patinaLastY - cy, patinaLastX - cx);
    const curAngle = Math.atan2(p.y - cy, p.x - cx);
    let delta = curAngle - lastAngle;
    
    // Normalize
    if (delta > Math.PI) delta -= Math.PI * 2;
    if (delta < -Math.PI) delta += Math.PI * 2;
    
    patinaAngle += delta;
    
    const now = performance.now();
    const dt = Math.max(now - patinaLastTime, 1);
    patinaAngularVel = delta / dt * 1000; // rad per second scaled
    
    patinaLastX = p.x;
    patinaLastY = p.y;
    patinaLastTime = now;
    
    // Update speed indicator
    updateSpeedBar(Math.abs(patinaAngularVel));
    
    e.preventDefault();
  };
  
  const endDrag = () => {
    patinaIsDragging = false;
  };

  canvas.addEventListener('mousedown', startDrag);
  canvas.addEventListener('mousemove', moveDrag);
  canvas.addEventListener('mouseup', endDrag);
  canvas.addEventListener('mouseleave', endDrag);
  canvas.addEventListener('touchstart', startDrag, { passive: false });
  canvas.addEventListener('touchmove', moveDrag, { passive: false });
  canvas.addEventListener('touchend', endDrag);
  canvas.addEventListener('touchcancel', endDrag);

  // Start animation loop
  if (!state.reducedMotion) {
    animatePatina();
  } else {
    drawPatina(patinaAngle);
  }
}

function getEventPoint(e, element) {
  const rect = element.getBoundingClientRect();
  if (e.touches && e.touches[0]) {
    return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
  }
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function updateSpeedBar(speed) {
  const bar = document.getElementById('speedFill');
  if (!bar) return;
  const pct = Math.min(Math.abs(speed) / 3, 1) * 100;
  bar.style.width = pct + '%';
}

let lastFrameTime = 0;
function animatePatina() {
  if (!patinaCtx || !patinaCanvas || !pageVisibility) {
    patinaRafId = requestAnimationFrame(animatePatina);
    return;
  }

  const now = performance.now();
  const dt = Math.min((now - lastFrameTime) / 1000, 0.1);
  lastFrameTime = now;

  // Apply inertia + damping when not dragging
  if (!patinaIsDragging && Math.abs(patinaAngularVel) > 0.01) {
    patinaAngle += patinaAngularVel * dt;
    patinaAngularVel *= Math.pow(0.92, dt * 60); // damping
    updateSpeedBar(Math.abs(patinaAngularVel));
  } else if (!patinaIsDragging) {
    patinaAngularVel = 0;
  }

  drawPatina(patinaAngle);
  
  patinaRafId = requestAnimationFrame(animatePatina);
}

function drawPatina(angle) {
  if (!patinaCtx || !patinaCanvas || !coinDataForCanvas) return;
  
  const ctx = patinaCtx;
  const w = patinaCanvas.width;
  const h = patinaCanvas.height;
  const cx = w / 2;
  const cy = h / 2;
  const r = w / 2 - 6;
  
  ctx.clearRect(0, 0, w, h);
  
  // Light source angle for sheen (perpendicular to "incoming light")
  const lightAngle = angle;
  const lx = cx + Math.cos(lightAngle) * r * 0.6;
  const ly = cy + Math.sin(lightAngle) * r * 0.6;
  
  // 1. Base coin shape - dark bronze/iron/silver/brass
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.closePath();
  
  // Base color by material
  const coin = coinDataForCanvas;
  let baseDark, baseMid;
  if (coin.materialClass === 'bronze') {
    baseDark = '#2a2214';
    baseMid = '#5c4d2d';
  } else if (coin.materialClass === 'brass') {
    baseDark = '#4a3810';
    baseMid = '#8a6a15';
  } else if (coin.materialClass === 'silver') {
    baseDark = '#3a3a42';
    baseMid = '#6a6a75';
  } else if (coin.materialClass === 'iron') {
    baseDark = '#2e1c17';
    baseMid = '#5c3830';
  } else {
    baseDark = '#2a2214';
    baseMid = '#5c4d2d';
  }
  
  // Radial base gradient
  const baseGrad = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, 0, cx, cy, r);
  baseGrad.addColorStop(0, baseMid);
  baseGrad.addColorStop(0.7, baseDark);
  baseGrad.addColorStop(1, '#100c08');
  ctx.fillStyle = baseGrad;
  ctx.fill();
  ctx.restore();
  
  // 2. Patina layer - rotating radial sheen
  // Primary sheen - the highlight that follows rotation
  const sheenGrad = ctx.createRadialGradient(lx, ly, 0, lx, ly, r * 1.2);
  
  const colors = coin.patinaColors || ['#d4af37', '#4a7c59', '#a05030', '#c0c0c8', '#5c4d2d'];
  // Use angle to determine which patina color is most prominent
  const normalizedAngle = ((angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  const colorIndex = Math.floor((normalizedAngle / (Math.PI * 2)) * colors.length) % colors.length;
  const nextIndex = (colorIndex + 1) % colors.length;
  const blendT = ((normalizedAngle / (Math.PI * 2)) * colors.length) % 1;
  
  const primaryColor = blendColor(colors[colorIndex], colors[nextIndex], blendT);
  
  sheenGrad.addColorStop(0, hexToRgba(primaryColor, 0.75));
  sheenGrad.addColorStop(0.3, hexToRgba(primaryColor, 0.45));
  sheenGrad.addColorStop(0.6, hexToRgba(colors[nextIndex], 0.15));
  sheenGrad.addColorStop(1, 'rgba(0,0,0,0)');
  
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.clip();
  
  ctx.globalCompositeOperation = 'screen';
  ctx.fillStyle = sheenGrad;
  ctx.fillRect(0, 0, w, h);
  ctx.restore();
  
  // 3. Secondary sheen - opposite side, different color
  const oppAngle = angle + Math.PI;
  const ox = cx + Math.cos(oppAngle) * r * 0.5;
  const oy = cy + Math.sin(oppAngle) * r * 0.5;
  
  const oppColorIndex = (colorIndex + Math.floor(colors.length / 2)) % colors.length;
  const oppColor = colors[oppColorIndex];
  
  const sheenGrad2 = ctx.createRadialGradient(ox, oy, 0, ox, oy, r * 0.9);
  sheenGrad2.addColorStop(0, hexToRgba(oppColor, 0.5));
  sheenGrad2.addColorStop(0.4, hexToRgba(oppColor, 0.2));
  sheenGrad2.addColorStop(1, 'rgba(0,0,0,0)');
  
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.clip();
  ctx.globalCompositeOperation = 'screen';
  ctx.fillStyle = sheenGrad2;
  ctx.fillRect(0, 0, w, h);
  ctx.restore();
  
  // 4. Edge highlight - rim light
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r - 3, 0, Math.PI * 2);
  ctx.clip();
  
  const rimX = cx + Math.cos(angle + 0.5) * r * 0.8;
  const rimY = cy + Math.sin(angle + 0.5) * r * 0.8;
  const rimGrad = ctx.createRadialGradient(rimX, rimY, 0, rimX, rimY, r);
  rimGrad.addColorStop(0, 'rgba(255,240,200,0.15)');
  rimGrad.addColorStop(1, 'rgba(0,0,0,0)');
  
  ctx.globalCompositeOperation = 'screen';
  ctx.fillStyle = rimGrad;
  ctx.fillRect(0, 0, w, h);
  ctx.restore();
  
  // 5. Coin characters (钱文) - 4 characters top-bottom-right-left
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r - 4, 0, Math.PI * 2);
  ctx.clip();
  
  // Text color - depends on how well-lit the center is
  const textColor = 'rgba(232,210,160,0.85)';
  ctx.fillStyle = textColor;
  ctx.font = 'bold 38px "STKaiti","KaiTi","Kaiti SC",serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  
  // Simulate lighting on characters
  const charDistance = 38; // distance from center
  const name = coin.name;
  
  // Calculate light intensity at each character position
  function drawLitChar(ch, px, py) {
    const dist = Math.sqrt((px - lx) ** 2 + (py - ly) ** 2);
    const maxDist = r * 1.2;
    const intensity = 1 - Math.min(dist / maxDist, 1);
    const alpha = 0.4 + intensity * 0.55;
    
    ctx.globalAlpha = alpha;
    ctx.fillText(ch, px, py);
    
    // Add slight shadow on the dark side
    if (intensity < 0.4) {
      ctx.globalAlpha = (0.4 - intensity) * 0.3;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillText(ch, px + 1, py + 1);
      ctx.fillStyle = textColor;
    }
  }
  
  // Top character
  if (name.length >= 1) drawLitChar(name[0], cx, cy - charDistance);
  // Bottom character
  if (name.length >= 2) drawLitChar(name[1], cx, cy + charDistance);
  // Right character
  if (name.length >= 3) drawLitChar(name[2], cx + charDistance, cy);
  // Left character
  if (name.length >= 4) drawLitChar(name[3], cx - charDistance, cy);
  
  ctx.restore();
  
  // 6. Central square hole (方孔)
  const holeSize = r * 0.22;
  ctx.save();
  ctx.beginPath();
  ctx.rect(cx - holeSize, cy - holeSize, holeSize * 2, holeSize * 2);
  ctx.fillStyle = '#080a08';
  ctx.fill();
  
  // Hole shadow
  ctx.strokeStyle = 'rgba(0,0,0,0.8)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
  
  // 7. Outer rim shadow
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.lineWidth = 3;
  ctx.stroke();
  
  // Outer rim highlight
  ctx.beginPath();
  ctx.arc(cx, cy, r - 1, -Math.PI / 2 + angle * 0.3, Math.PI / 2 + angle * 0.3);
  ctx.strokeStyle = 'rgba(255,230,180,0.25)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

// Color utilities
function hexToRgba(hex, alpha) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function blendColor(c1, c2, t) {
  const h1 = c1.replace('#', '');
  const h2 = c2.replace('#', '');
  const r1 = parseInt(h1.substring(0, 2), 16);
  const g1 = parseInt(h1.substring(2, 4), 16);
  const b1 = parseInt(h1.substring(4, 6), 16);
  const r2 = parseInt(h2.substring(0, 2), 16);
  const g2 = parseInt(h2.substring(2, 4), 16);
  const b2 = parseInt(h2.substring(4, 6), 16);
  const r = Math.round(r1 + (r2 - r1) * t);
  const g = Math.round(g1 + (g2 - g1) * t);
  const b = Math.round(b1 + (b2 - b1) * t);
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

// ---------- Action Sheet ----------
function openActionSheet(type) {
  const group = document.getElementById('actionSheetGroup');
  
  if (type === 'sort') {
    group.innerHTML = `
      <div class="as-item" onclick="setSort('dynasty'); closeActionSheet();">按朝代排序</div>
      <div class="as-item" onclick="setSort('value'); closeActionSheet();">按价值排序</div>
      <div class="as-item" onclick="setSort('grade'); closeActionSheet();">按品相排序</div>
    `;
  } else if (type === 'more') {
    group.innerHTML = `
      <div class="as-item" onclick="showToast('已分享'); closeActionSheet();">分享给泉友</div>
      <div class="as-item" onclick="showToast('已收藏'); closeActionSheet();">收藏钱币</div>
      <div class="as-item danger" onclick="removeCoin(); closeActionSheet();">移出鉴赏柜</div>
    `;
  }
  
  document.getElementById('actionMask').classList.add('show');
  document.getElementById('actionSheet').classList.add('show');
}

function closeActionSheet() {
  document.getElementById('actionMask').classList.remove('show');
  document.getElementById('actionSheet').classList.remove('show');
}

function setSort(sort) {
  state.sortBy = sort;
  renderCoinTray();
  showToast(sort === 'dynasty' ? '按朝代排序' : sort === 'value' ? '按价值排序' : '按品相排序');
}

function removeCoin() {
  const coin = getSelectedCoin();
  if (!coin) return;
  coin.inCollection = false;
  saveCollection();
  closeSheet();
  renderCoinTray();
  updateStats();
  showToast('已移出鉴赏柜');
}

// ---------- Atlas Page ----------
function renderDynastyList() {
  const list = document.getElementById('dynastyList');
  if (!list) return;
  
  list.innerHTML = DYNASTIES.map(d => `
    <div class="dynasty-item" onclick="showToast('${d.name}代钱币图谱')">
      <span class="dy-period">${d.period}</span>
      <span class="dy-dot"></span>
      <div class="dy-info">
        <div class="dy-name">${d.name}</div>
        <div class="dy-coins">${d.coins} · ${d.years}</div>
      </div>
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="rgba(232,226,214,0.25)" stroke-width="2" stroke-linecap="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </div>
  `).join('');
}

function renderScriptGrid() {
  const grid = document.getElementById('scriptGrid');
  if (!grid) return;
  
  grid.innerHTML = SCRIPT_TYPES.map(s => `
    <div class="script-card" onclick="showToast('${s.name}钱文识读')">
      <div class="sc-char">${s.char}</div>
      <div class="sc-name">${s.name}</div>
    </div>
  `).join('');
}

// ---------- Pull to Refresh ----------
let pullStartY = 0;
let pullCurrentY = 0;
let isPulling = false;
let isRefreshing = false;
const PULL_THRESHOLD = 60;

function initPullToRefresh() {
  const content = document.getElementById('cabinetContent');
  const indicator = document.getElementById('pullIndicator');
  if (!content || !indicator) return;

  content.addEventListener('touchstart', (e) => {
    if (content.scrollTop <= 0 && !isRefreshing) {
      pullStartY = e.touches[0].clientY;
      isPulling = true;
    }
  }, { passive: true });

  content.addEventListener('touchmove', (e) => {
    if (!isPulling || isRefreshing) return;
    const y = e.touches[0].clientY;
    const dy = y - pullStartY;
    
    if (dy > 0 && content.scrollTop <= 0) {
      pullCurrentY = dy * 0.5; // damping
      indicator.style.transform = `translateY(${pullCurrentY - 50}px)`;
      indicator.querySelector('.pull-text').textContent = 
        pullCurrentY >= PULL_THRESHOLD ? '松手刷新' : '下拉刷新';
    }
  }, { passive: true });

  content.addEventListener('touchend', () => {
    if (!isPulling) return;
    isPulling = false;
    
    if (pullCurrentY >= PULL_THRESHOLD && !isRefreshing) {
      doRefresh();
    } else {
      indicator.style.transform = 'translateY(-50px)';
    }
    pullCurrentY = 0;
  });
}

function doRefresh() {
  isRefreshing = true;
  const indicator = document.getElementById('pullIndicator');
  indicator.classList.add('refreshing');
  indicator.querySelector('.pull-text').textContent = '正在刷新...';
  indicator.style.transform = 'translateY(0px)';

  // Simulate refresh
  setTimeout(() => {
    renderCoinTray();
    updateStats();
    
    indicator.style.transform = 'translateY(-50px)';
    indicator.classList.remove('refreshing');
    indicator.querySelector('.pull-text').textContent = '下拉刷新';
    isRefreshing = false;
    
    showToast('已更新鉴赏柜');
  }, 1200);
}

// ---------- Toast ----------
let toastTimer = null;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 1800);
}

// ---------- Page Visibility (RAF pause) ----------
document.addEventListener('visibilitychange', () => {
  pageVisibility = !document.hidden;
  if (pageVisibility && patinaCanvas && !state.reducedMotion) {
    lastFrameTime = performance.now();
    if (!patinaRafId) animatePatina();
  }
});

// ---------- Status bar clock ----------
function updateClock() {
  const now = new Date();
  const h = now.getHours().toString().padStart(2, '0');
  const m = now.getMinutes().toString().padStart(2, '0');
  const el = document.getElementById('statusTime');
  if (el) el.textContent = `${h}:${m}`;
}

// ---------- Left Swipe ----------
// (Coin cells can be long-pressed / swiped for actions)
function initSwipeActions() {
  // Left swipe on coin tray cells
  const tray = document.getElementById('coinTray');
  if (!tray) return;
  
  let startX = 0;
  let currentX = 0;
  let activeCell = null;
  let isSwiping = false;
  
  tray.addEventListener('touchstart', (e) => {
    const cell = e.target.closest('.coin-cell');
    if (!cell) return;
    startX = e.touches[0].clientX;
    activeCell = cell;
    isSwiping = false;
  }, { passive: true });
  
  tray.addEventListener('touchmove', (e) => {
    if (!activeCell) return;
    const dx = e.touches[0].clientX - startX;
    
    if (Math.abs(dx) > 10) {
      isSwiping = true;
    }
    
    if (dx < 0 && Math.abs(dx) < 80) {
      currentX = dx;
    }
  }, { passive: true });
  
  tray.addEventListener('touchend', (e) => {
    if (isSwiping && currentX < -40 && activeCell) {
      // Trigger action sheet for the coin
      const coinFace = activeCell.querySelector('.coin-face');
      if (coinFace && coinFace.dataset.coinId) {
        state.selectedCoinId = coinFace.dataset.coinId;
        openActionSheet('more');
      }
    }
    activeCell = null;
    currentX = 0;
    isSwiping = false;
  });
}

// ---------- Atlas Search ----------
function initAtlasSearch() {
  const input = document.getElementById('atlasSearch');
  if (!input) return;
  
  input.addEventListener('input', (e) => {
    const q = e.target.value.trim();
    if (q) {
      showToast(`搜索：${q}`);
    }
  });
}

// ---------- Market Page (stacked page) ----------
function buildMarketPage() {
  return `
    <div style="padding-bottom:24px;">
      <div class="market-header">
        <div class="mh-title">行情参考</div>
        <div class="mh-sub">古钱币市场参考价 · 数据每日更新</div>
        <div class="market-tabs">
          <div class="market-tab active" onclick="switchMarketTab(this, 'all')">全部</div>
          <div class="market-tab" onclick="switchMarketTab(this, 'up')">上涨</div>
          <div class="market-tab" onclick="switchMarketTab(this, 'down')">下跌</div>
        </div>
      </div>
      <div class="market-list" id="marketList">
        ${buildMarketList('all')}
      </div>
      <div style="height:20px;"></div>
    </div>
  `;
}

function buildMarketList(filter) {
  let coins = [...COINS_DATA];
  if (filter === 'up') coins = coins.filter(c => c.valueChange > 0);
  if (filter === 'down') coins = coins.filter(c => c.valueChange < 0);
  
  return coins.map(coin => `
    <div class="market-item" onclick="state.selectedCoinId='${coin.id}'; openCoinDetail('${coin.id}');">
      <div class="mi-coin coin-${coin.materialClass}" style="box-shadow:0 1px 4px rgba(0,0,0,0.4);">
        ${coin.name.substring(0, 2)}
      </div>
      <div class="mi-info">
        <div class="mi-name">${coin.name}</div>
        <div class="mi-grade">${coin.dynasty} · ${coin.material} · ${coin.grade}</div>
      </div>
      <div class="mi-price">
        <div class="mi-price-val">¥${coin.marketValue}</div>
        <div class="mi-price-change ${coin.valueChange >= 0 ? 'up' : 'down'}">
          ${coin.valueChange >= 0 ? '↑' : '↓'} ${Math.abs(coin.valueChange)}%
        </div>
      </div>
    </div>
  `).join('');
}

function switchMarketTab(el, filter) {
  document.querySelectorAll('.market-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  
  const list = document.getElementById('marketList');
  if (list) list.innerHTML = buildMarketList(filter);
}

// ---------- Init ----------
function init() {
  loadCollection();
  renderCoinTray();
  updateStats();
  renderDynastyList();
  renderScriptGrid();
  initPullToRefresh();
  initSwipeActions();
  initAtlasSearch();
  updateClock();
  setInterval(updateClock, 30000);
}

// Wait for DOM
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>

  @keyframes beat-pulse {

  }
  .beat-breathing {
    animation: beat-pulse var(--beat-duration, 1s) ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .beat-breathing { animation: none; }
  }

  /* Stamp animation */
  @keyframes stamp-down {
    0% { transform: translateY(-40px) scale(1.2) rotate(-8deg); opacity: 0; }
    50% { transform: translateY(5px) scale(0.95) rotate(-2deg); opacity: 1; }
    70% { transform: translateY(-2px) scale(1.02) rotate(-1deg); }
    100% { transform: translateY(0) scale(1) rotate(-3deg); opacity: 1; }
  }
  @keyframes stamp-ink-spread {
    0% { transform: scale(0.8); opacity: 0; }
    40% { transform: scale(1.05); opacity: 0.9; }
    100% { transform: scale(1); opacity: 1; }
  }
  .stamp-enter {
    animation: stamp-down 0.45s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
  }
  .stamp-ink {
    animation: stamp-ink-spread 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) 0.2s both;
  }
  @media (prefers-reduced-motion: reduce) {
    .stamp-enter, .stamp-ink { animation: none; opacity: 1; transform: translateY(0) scale(1) rotate(-3deg); }
  }

  /* Page transitions */
  .page-enter {
    animation: page-slide-in 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  @keyframes page-slide-in {
    from { transform: translateX(100%); opacity: 0.5; }
    to { transform: translateX(0); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .page-enter { animation: none; }
  }

  @keyframes sheet-flip {
    0% { transform: rotateY(0deg); opacity: 1; }
    50% { transform: rotateY(-90deg); opacity: 0.3; }
    100% { transform: rotateY(0deg); opacity: 1; }
  }
  .sheet-flip {
    animation: sheet-flip 0.5s ease-in-out;
  }
  @media (prefers-reduced-motion: reduce) {
    .sheet-flip { animation: none; }
  }

  /* Number flip (BPM counter) */
  .digit-flip {
    display: inline-block;

  }

    animation: digit-turn 0.2s ease;
  }

    0% { transform: translateY(0); }
    50% { transform: translateY(-6px); opacity: 0.3; }
    51% { transform: translateY(6px); opacity: 0.3; }
    100% { transform: translateY(0); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .digit-flip.flip { animation: none; }
  }

  /* Pendulum rod + weight */
  .pendulum-wrap {
    position: relative;
    width: 100%;
    height: 320px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    perspective: 600px;
    user-select: none;
    touch-action: none;
  }
  .pendulum-pivot {
    position: absolute;
    top: 0;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #e8c87a, #a67c20);
    box-shadow: 0 1px 2px rgba(0,0,0,0.4);
    z-index: 5;

  .pendulum-rod {
    position: absolute;
    top: 6px;
    width: 2.5px;
    background: linear-gradient(180deg, #b89040, #8a6a1e);
    transform-origin: top center;
    border-radius: 2px;
    pointer-events: none;
  }
  .pendulum-weight {
    position: absolute;
    width: 42px;
    height: 54px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(180deg,

    z-index: 3;
  }
  .pendulum-weight:active { cursor: grabbing; }
  .pendulum-weight::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 28px;
    height: 2px;
    background: rgba(0,0,0,0.25);

// ──────────────────────────────────────────────────────────
// Pendulum (Metronome) — signature component with physics
// ──────────────────────────────────────────────────────────
function PendulumMetronome({ bpm, setBpm, isPlaying, onBeat }) {
  const wrapRef = useRef(null);
  const [dragging, setDragging] = useState(false);
  const dragStartY = useRef(0);
  const dragStartWeightY = useRef(0);
  const weightYRef = useRef(200); // px from pivot
  const angleRef = useRef(0);
  const angularVelRef = useRef(0);
  const rafRef = useRef(null);
  const lastBeatSideRef = useRef(0); // -1 left, 1 right, 0 none
  const beatTimerRef = useRef(null);
  const prevBpmRef = useRef(bpm);
  const visibleRef = useRef(true);

  // Weight position corresponds to BPM
  // Higher weight (closer to pivot) = faster = higher BPM
  // Physics: T = 2π√(L/g), BPM ∝ 1/√L
  // Map: weightY in [60, 260]px → BPM in [208, 40]
  const weightYFromBpm = useCallback((bpmVal) => {
    const minY = 60, maxY = 260;
    const minBpm = 40, maxBpm = 208;
    // BPM is proportional to 1/sqrt(L)
    const t = (1 / Math.sqrt(bpmVal) - 1 / Math.sqrt(maxBpm)) /
              (1 / Math.sqrt(minBpm) - 1 / Math.sqrt(maxBpm));
    return minY + t * (maxY - minY);
  }, []);

  const bpmFromWeightY = useCallback((y) => {
    const minY = 60, maxY = 260;
    const minBpm = 40, maxBpm = 208;
    const t = (y - minY) / (maxY - minY);
    const invSqrt = 1 / Math.sqrt(maxBpm) + t * (1 / Math.sqrt(minBpm) - 1 / Math.sqrt(maxBpm));
    return Math.round(1 / (invSqrt * invSqrt));
  }, []);

  // Initialize weight position
  useEffect(() => {
    weightYRef.current = weightYFromBpm(bpm);
  }, [bpm, weightYFromBpm]);

  // Pendulum physics loop
  useEffect(() => {
    if (!isPlaying || dragging) {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      return;
    }

    let lastTime = performance.now();
    const maxAngle = Math.PI / 5; // ~36 degrees

    // Natural frequency based on BPM
    // For simple pendulum: ω = √(g/L). We want beats per minute = frequency * 60
    // Each full swing (left-right-left) has 2 beats (at each endpoint)
    // BPM = 2 * f * 60 = 120 * ω/(2π) = 60ω/π → ω = BPM * π / 60
    const naturalOmega = bpm * Math.PI / 60;

    const tick = (now) => {
      if (!visibleRef.current) {
        lastTime = now;
        rafRef.current = requestAnimationFrame(tick);
        return;
      }
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      // Simple pendulum: θ'' = -ω² * sin(θ)
      // But we want constant amplitude with "power" to simulate metronome spring
      // Use a modified equation with sustained amplitude
      const angle = angleRef.current;
      const omega = angularVelRef.current;

      // Non-linear pendulum with slight drive to maintain amplitude
      const alpha = -naturalOmega * naturalOmega * Math.sin(angle);
      // Add small damping that's countered by amplitude-dependent drive
      const damping = 0.3;
      const drive = Math.abs(angle) < maxAngle * 0.3 ? 0.5 : 0;

      angularVelRef.current = omega + (alpha - damping * omega + drive * Math.sign(omega) * (1 - Math.abs(angle)/maxAngle)) * dt;
      angleRef.current = angle + angularVelRef.current * dt;

      // Clamp and detect beats at endpoints
      if (angleRef.current > maxAngle) {
        angleRef.current = maxAngle;
        angularVelRef.current = -Math.abs(angularVelRef.current) * 0.85;
        if (lastBeatSideRef.current !== 1) {
          lastBeatSideRef.current = 1;
          if (onBeat) onBeat();
        }
      }
      if (angleRef.current < -maxAngle) {
        angleRef.current = -maxAngle;
        angularVelRef.current = Math.abs(angularVelRef.current) * 0.85;
        if (lastBeatSideRef.current !== -1) {
          lastBeatSideRef.current = -1;
          if (onBeat) onBeat();
        }
      }

      // Apply rotation to DOM
      const rod = wrapRef.current?.querySelector('.pendulum-rod');
      const weight = wrapRef.current?.querySelector('.pendulum-weight');
      const deg = angleRef.current * (180 / Math.PI);
      if (rod) rod.style.transform = `rotate(${deg}deg)`;
      if (weight) {
        const y = weightYRef.current;
        weight.style.top = `${y - 27}px`;
        weight.style.transform = `translateX(-50%) rotate(${deg}deg)`;
      }

      rafRef.current = requestAnimationFrame(tick);
    };

    // Start from small angle
    angleRef.current = maxAngle * 0.8;
    angularVelRef.current = 0;
    lastBeatSideRef.current = 0;
    rafRef.current = requestAnimationFrame(tick);

    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [isPlaying, dragging, bpm, onBeat]);

  // Visibility handling
  useEffect(() => {
    const handle = () => { visibleRef.current = !document.hidden; };
    document.addEventListener('visibilitychange', handle);
    return () => document.removeEventListener('visibilitychange', handle);
  }, []);

  // Reset angle when not playing
  useEffect(() => {
    if (!isPlaying && !dragging) {
      angleRef.current = 0;
      const rod = wrapRef.current?.querySelector('.pendulum-rod');
      const weight = wrapRef.current?.querySelector('.pendulum-weight');
      if (rod) rod.style.transform = 'rotate(0deg)';
      if (weight) weight.style.transform = 'translateX(-50%) rotate(0deg)';
    }
  }, [isPlaying, dragging]);

  // Drag handlers (high-frequency mouse events → direct DOM)
  const handleWeightPointerDown = useCallback((e) => {
    e.preventDefault();
    e.stopPropagation();
    setDragging(true);
    dragStartY.current = e.clientY;
    dragStartWeightY.current = weightYRef.current;
    document.body.style.cursor = 'none';
    // Reset pendulum to center when dragging
    angleRef.current = 0;
    angularVelRef.current = 0;
  }, []);

  const handlePointerMove = useCallback((e) => {
    if (!dragging) return;
    const dy = e.clientY - dragStartY.current;
    let newY = dragStartWeightY.current + dy;
    newY = Math.max(60, Math.min(260, newY));
    weightYRef.current = newY;

    const newBpm = bpmFromWeightY(newY);
    if (newBpm !== prevBpmRef.current) {
      prevBpmRef.current = newBpm;
      setBpm(newBpm);
    }

    // Direct DOM update
    const weight = wrapRef.current?.querySelector('.pendulum-weight');
    if (weight) {
      weight.style.top = `${newY - 27}px`;
    }
  }, [dragging, bpmFromWeightY, setBpm]);

  const handlePointerUp = useCallback(() => {
    if (!dragging) return;
    setDragging(false);
  }, [dragging]);

  useEffect(() => {
    if (dragging) {
      window.addEventListener('pointermove', handlePointerMove);
      window.addEventListener('pointerup', handlePointerUp);
      window.addEventListener('pointercancel', handlePointerUp);
    }
    return () => {
      window.removeEventListener('pointermove', handlePointerMove);
      window.removeEventListener('pointerup', handlePointerUp);
      window.removeEventListener('pointercancel', handlePointerUp);
    };
  }, [dragging, handlePointerMove, handlePointerUp]);

  return (
    <div className="pendulum-wrap" ref={wrapRef}>
      <div className="pendulum-pivot" />
      <div className="pendulum-rod" style={{ height: `${weightYRef.current + 10}px` }} />
      <div
        className="pendulum-weight"
        style={{ top: `${weightYRef.current - 27}px` }}
        onPointerDown={handleWeightPointerDown}
      />
    </div>
  );
}

// ──────────────────────────────────────────────────────────
// Tuner Dial
// ──────────────────────────────────────────────────────────
function TunerDial({ cents = 0, note = 'A', freq = 440, active = false }) {
  const dialRef = useRef(null);
  const rafRef = useRef(null);
  const needleAngleRef = useRef(0);
  const targetAngleRef = useRef(0);
  const visibleRef = useRef(true);

  // Map cents to angle: -50 to +50 cents → -90 to +90 degrees
  const centsToAngle = (c) => {
    return Math.max(-90, Math.min(90, c * 1.8));
  };

  useEffect(() => {
    targetAngleRef.current = centsToAngle(cents);
  }, [cents]);

  useEffect(() => {
    if (!active) {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      const needle = dialRef.current?.querySelector('.tuner-needle');
      if (needle) needle.style.transform = 'translateX(-50%) rotate(0deg)';
      return;
    }

    let lastTime = performance.now();
    const damping = 6; // damping coefficient
    const stiffness = 40; // spring stiffness

    const tick = (now) => {
      if (!visibleRef.current) {
        lastTime = now;
        rafRef.current = requestAnimationFrame(tick);
        return;
      }
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      // Spring-damper system toward target
      const error = targetAngleRef.current - needleAngleRef.current;
      const velocity = (error * stiffness - damping * 0) * dt; // simplified damped spring
      // Use proper approach with velocity tracking
      if (!tick.velocity) tick.velocity = 0;

      const acceleration = stiffness * error - damping * tick.velocity;
      tick.velocity += acceleration * dt;
      needleAngleRef.current += tick.velocity * dt;

      const needle = dialRef.current?.querySelector('.tuner-needle');
      if (needle) {
        needle.style.transform = `translateX(-50%) rotate(${needleAngleRef.current}deg)`;
      }

      rafRef.current = requestAnimationFrame(tick);
    };

    rafRef.current = requestAnimationFrame(tick);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [active]);

  useEffect(() => {
    const handle = () => { visibleRef.current = !document.hidden; };
    document.addEventListener('visibilitychange', handle);
    return () => document.removeEventListener('visibilitychange', handle);
  }, []);

  const inTune = Math.abs(cents) < 5;

  return (
    <div className="tuner-dial" ref={dialRef}>
      <div className="tuner-dial-inner">
        {/* Scale marks */}
        {[-50, -40, -30, -20, -10, -5, 0, 5, 10, 20, 30, 40, 50].map((c, i) => {
          const angle = centsToAngle(c);
          const isMajor = c % 10 === 0;
          const isCenter = c === 0;
          const isGreen = Math.abs(c) <= 5;
          return (
            <div key={i} style={{
              position: 'absolute',
              bottom: '50%',
              left: '50%',
              width: isMajor ? 2 : 1,
              height: isMajor ? 14 : 8,
              background: isGreen ? '#2e7d32' : (isCenter ? '#c99a3e' : 'rgba(42,32,24,0.5)'),
              transformOrigin: 'bottom center',
              transform: `translateX(-50%) rotate(${angle}deg)`,
              marginBottom: 8,
            }} />
          );
        })}
        {/* Number labels */}
        {[-50, -25, 0, 25, 50].map((c, i) => {
          const angle = centsToAngle(c);
          const rad = (angle - 90) * Math.PI / 180;
          const r = 95;
          const x = 120 + r * Math.cos(rad);
          const y = 120 + r * Math.sin(rad);
          return (
            <div key={i} style={{
              position: 'absolute',
              left: x,
              top: y,
              transform: 'translate(-50%, -50%)',
              fontSize: 10,
              fontWeight: 600,
              color: c === 0 ? '#c99a3e' : 'rgba(42,32,24,0.5)',
              fontFamily: '"Noto Serif SC", serif',
            }}>{c}</div>
          );
        })}
      </div>
      <div className="tuner-needle" style={{ transform: 'translateX(-50%) rotate(0deg)' }} />
      {/* Center note display */}
      <div style={{
        position: 'absolute',
        bottom: 30,
        left: '50%',
        transform: 'translateX(-50%)',
        textAlign: 'center',
      }}>
        <div style={{
          fontSize: 36,
          fontWeight: 700,
          color: inTune ? '#2e7d32' : '#2a2420',
          fontFamily: '"Noto Serif SC", serif',
          lineHeight: 1,
          transition: 'color 0.2s',
        }}>{note}</div>
        <div style={{
          fontSize: 12,
          color: 'rgba(42,32,24,0.5)',
          marginTop: 2,
        }}>{freq.toFixed(1)} Hz</div>
      </div>
      {/* In-tune indicator */}
      {inTune && active && (
        <div style={{
          position: 'absolute',
          top: -8,
          left: '50%',
          transform: 'translateX(-50%)',
          padding: '4px 12px',
          background: '#2e7d32',
          color: '#f5edd9',
          borderRadius: 12,
          fontSize: 12,
          fontWeight: 600,
          animation: 'stamp-ink-spread 0.3s ease',
        }}>
          准了
        </div>
      )}
    </div>
  );
}

// Digit flip display
// ──────────────────────────────────────────────────────────
function DigitDisplay({ value, className = '' }) {
  const digits = String(value).split('');
  const [flipKey, setFlipKey] = useState(0);
  const prevValue = useRef(value);

  useEffect(() => {
    if (prevValue.current !== value) {
      prevValue.current = value;
      setFlipKey(k => k + 1);
    }
  }, [value]);

  return (
    <div className={className} style={{ display: 'inline-flex', gap: 2 }}>
      {digits.map((d, i) => (
        <span
          key={`${flipKey}-${i}`}
          className="digit-flip flip"
          style={{ fontVariantNumeric: 'tabular-nums' }}
        >
          {d}
        </span>
      ))}
    </div>
  );
}

// ──────────────────────────────────────────────────────────
// Tuner Page
// ──────────────────────────────────────────────────────────
function TunerPage({ standalone = false, popPage }) {
  const [isActive, setIsActive] = useState(false);
  const [cents, setCents] = useState(-25);
  const [note, setNote] = useState('A');
  const [freq, setFreq] = useState(440);
  const rafRef = useRef(null);
  const targetCentsRef = useRef(-25);
  const currentCentsRef = useRef(-25);
  const visibleRef = useRef(true);
  const noteIndexRef = useRef(0);
  const notes = ['A', 'A#', 'B', 'C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#'];

  // Simulate incoming audio signal with some variation
  useEffect(() => {
    if (!isActive) {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      return;
    }

    let lastTime = performance.now();
    let phase = 0;

    const tick = (now) => {
      if (!visibleRef.current) {
        lastTime = now;
        rafRef.current = requestAnimationFrame(tick);
        return;
      }
      const dt = (now - lastTime) / 1000;
      lastTime = now;
      phase += dt;

      // Simulate approaching correct pitch
      // Start off, gradually approach 0 with slight wobble
      const target = Math.sin(phase * 0.7) * 3 + (phase > 3 ? 0 : -15 + phase * 5);
      targetCentsRef.current = Math.max(-50, Math.min(50, target));

      // Smooth approach
      currentCentsRef.current += (targetCentsRef.current - currentCentsRef.current) * 0.08;
      setCents(currentCentsRef.current);

      // Slight frequency variation
      const baseFreq = 440 * Math.pow(2, currentCentsRef.current / 1200);
      setFreq(baseFreq);

      rafRef.current = requestAnimationFrame(tick);
    };

    rafRef.current = requestAnimationFrame(tick);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [isActive]);

  useEffect(() => {
    const handle = () => { visibleRef.current = !document.hidden; };
    document.addEventListener('visibilitychange', handle);
    return () => document.removeEventListener('visibilitychange', handle);
  }, []);

  const inTune = Math.abs(cents) < 5;

  return (
    <div style={{
      height: '100%',
      overflowY: 'auto',
      background: '#f5edd9',
      display: 'flex',
      flexDirection: 'column',
    }}>
      {!standalone && (
        <NavHeader title="调音器" onBack={popPage} />
      )}

      <div style={{ padding: standalone ? '80px 20px 24px' : '20px 20px 24px', flex: 1 }}>
        {standalone && (
          <div style={{ textAlign: 'center', marginBottom: 24 }}>
            <div style={{
              fontFamily: '"Noto Serif SC", serif',
              fontSize: 22,
              fontWeight: 700,
              color: '#2a2420',
            }}>调音器</div>
            <div style={{ fontSize: 13, color: 'rgba(42,36,32,0.5)', marginTop: 4 }}>
              拨动琴弦，指针指向绿区即为准确
            </div>
          </div>
        )}

        {/* Dial */}
        <div style={{ marginBottom: 32 }}>
          <TunerDial cents={cents} note={note} freq={freq} active={isActive} />
        </div>

        {/* String selector */}
        <div style={{
          display: 'flex',
          justifyContent: 'center',
          gap: 8,
          marginBottom: 24,
        }}>
          {['1弦', '2弦', '3弦', '4弦', '5弦', '6弦'].map((s, i) => (
            <div
              key={i}
              style={{
                width: 36,
                height: 36,
                borderRadius: '50%',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                fontSize: 12,
                fontWeight: 500,
                background: i === 0 ? '#c99a3e' : 'rgba(42,36,32,0.08)',
                color: i === 0 ? '#f5edd9' : '#2a2420',
                transition: 'all 0.2s ease',
                cursor: 'pointer',
              }}
              data-hoverable="true"
              onClick={() => setNote(notes[(i + 9) % 12])}
            >
              {s}
            </div>
          ))}
        </div>

        {/* Status */}
        <div style={{
          textAlign: 'center',
          padding: '16px 20px',
          background: isActive
            ? (inTune ? 'rgba(46,125,50,0.1)' : 'rgba(201,154,62,0.1)')
            : 'rgba(42,36,32,0.05)',
          borderRadius: 16,
          marginBottom: 24,
          transition: 'background 0.3s ease',
        }}>
          <div style={{
            fontSize: 14,
            fontWeight: 600,
            color: isActive
              ? (inTune ? '#2e7d32' : '#8b6914')
              : 'rgba(42,36,32,0.5)',
            marginBottom: 4,
          }}>
            {isActive ? (inTune ? '✓ 音准了，可以开始练习' : '继续微调，指针接近绿区') : '点击下方按钮开始调音'}
          </div>
          {isActive && (
            <div style={{
              fontSize: 12,
              color: 'rgba(42,36,32,0.5)',
            }}>
              偏差：{cents > 0 ? '+' : ''}{cents.toFixed(1)} 音分
            </div>
          )}
        </div>

        {/* Start/Stop Button */}
        <button
          className="btn-ripple"
          style={{

function MetronomePage({ popPage, onBeat, setBeatDuration }) {
  const [bpm, setBpm] = useState(80);

  const [currentBeat, setCurrentBeat] = useState(0);
  const [beatsPerMeasure, setBeatsPerMeasure] = useState(4);
  const beatCountRef = useRef(0);
  const lastBeatTimeRef = useRef(0);

  const handleBeat = useCallback(() => {
    if (onBeat) onBeat();
    beatCountRef.current = (beatCountRef.current + 1) % beatsPerMeasure;
    setCurrentBeat(beatCountRef.current);
    lastBeatTimeRef.current = performance.now();
  }, [onBeat, beatsPerMeasure]);

  // Update beat duration for breathing effect
  useEffect(() => {
    setBeatDuration(60 / bpm);
  }, [bpm, setBeatDuration]);

  const beatMarkers = Array.from({ length: beatsPerMeasure }, (_, i) => i);

// Practice Page (Timer)

function PracticePage({ piece, popPage, pushPage }) {
  const [isRunning, setIsRunning] = useState(false);
  const [seconds, setSeconds] = useState(0);
  const [isFlipped, setIsFlipped] = useState(false);
  const timerRef = useRef(null);

  const formatTime = (s) => {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
  };

  useEffect(() => {
    if (!isRunning) {
      if (timerRef.current) {
        clearInterval(timerRef.current);
        timerRef.current = null;
      }
      return;
    }
    // Use a single interval, no stacking
    if (timerRef.current) clearInterval(timerRef.current);
    timerRef.current = setInterval(() => {
      if (document.hidden) return; // pause when hidden
      setSeconds(s => s + 1);
    }, 1000);
    return () => {
      if (timerRef.current) {
        clearInterval(timerRef.current);
        timerRef.current = null;
      }
    };
  }, [isRunning]);

  const handleFinish = () => {
    setIsRunning(false);
    pushPage({
      type: 'checkin',
      piece,
      duration: Math.max(1, Math.floor(seconds / 60)),
    });
  };

  const progressPct = Math.min(100, (seconds / (piece.targetBars * 60)) * 100);

  return (
    <div
      className={`sheet-flip ${isFlipped ? '' : ''}`}
      key={piece.id}
      style={{
        height: '100%',
        background: '#f5edd9',
        display: 'flex',

        {/* Timer display */}

        }}>
          {/* Decorative circle */}

            top: '50%',

  let content = null;
  switch (page.type) {

      content = <TunerPage popPage={popPage} />;

    case 'metronome':
      content = <MetronomePage popPage={popPage} onBeat={onBeat} setBeatDuration={setBeatDuration} />;
      break;
    case 'practice':
      content = <PracticePage piece={page.piece} popPage={popPage} pushPage={pushPage} />;
      break;
    case 'checkin':
      content = <CheckinPage piece={page.piece} duration={page.duration} popPage={popPage} />;
      break;
    case 'design-spec':
      content = <DesignSpecPage popPage={popPage} />;

  );
}

// ──────────────────────────────────────────────────────────
// Custom Cursor Controller
// ──────────────────────────────────────────────────────────
function setupCursor() {
  const cursor = document.getElementById('cursor');
  if (!cursor) return;
  if (prefersReducedMotion) {
    cursor.style.display = 'none';
    document.body.style.cursor = 'auto';
    return;
  }

  let targetX = window.innerWidth / 2;
  let targetY = window.innerHeight / 2;
  let curX = targetX;
  let curY = targetY;
  let rafId = null;
  let visible = true;

  const animate = () => {
    if (!visible) { rafId = null; return; }
    // Smooth follow
    curX += (targetX - curX) * 0.25;
    curY += (targetY - curY) * 0.25;
    cursor.style.left = curX + 'px';
    cursor.style.top = curY + 'px';
    rafId = requestAnimationFrame(animate);
  };

  const handleMove = (e) => {
    targetX = e.clientX;
    targetY = e.clientY;
    if (!rafId) {
      visible = !document.hidden;
      if (visible) rafId = requestAnimationFrame(animate);
    }

    // Hover detection
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const isHoverable = el?.closest('[data-hoverable="true"]');
    const isDraggable = el?.closest('.pendulum-weight');
    cursor.classList.toggle('hover', !!isHoverable);
    cursor.classList.toggle('drag', !!isDraggable);
  };

  const handleVisibility = () => {
    visible = !document.hidden;
    if (visible && !rafId) {
      rafId = requestAnimationFrame(animate);
    }
  };

  window.addEventListener('mousemove', handleMove, { passive: true });
  document.addEventListener('visibilitychange', handleVisibility);

  // Start animation
  rafId = requestAnimationFrame(animate);

  return () => {
    window.removeEventListener('mousemove', handleMove);
    document.removeEventListener('visibilitychange', handleVisibility);
    if (rafId) cancelAnimationFrame(rafId);
  };
}

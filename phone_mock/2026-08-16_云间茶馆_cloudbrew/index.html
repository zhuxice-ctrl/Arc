  /* ============ CLOUDBREW 云间茶馆 ============ */
  /* Palette: 雾绿 / 栗棕 / 米白 / 釉青点缀 / 焙火橙 */
  :root {
    --mist-50: #F3F7F1;
    --mist-100: #E5EDE0;
    --mist-200: #C9DCC2;
    --mist-300: #A8C79D;
    --mist-400: #84AE7A;
    --mist-500: #65965B;
    --mist-600: #4D7946;
    --mist-700: #3E6038;
    --mist-800: #324E2E;
    --mist-900: #283F26;

    --chestnut-50: #F7F1EB;
    --chestnut-100: #EBDDD0;
    --chestnut-200: #D6BFA9;
    --chestnut-300: #BD9A7B;
    --chestnut-400: #A77A56;
    --chestnut-500: #8B5E3C;
    --chestnut-600: #6E492D;
    --chestnut-700: #553823;
    --chestnut-800: #3F2A1B;
    --chestnut-900: #2C1D12;

    --cream-50: #FBF7EF;
    --cream-100: #F5EDDB;
    --cream-200: #EBDFC4;
    --cream-300: #E0D0A7;

    --celadon-100: #DBE8E2;
    --celadon-200: #B8D4CC;
    --celadon-300: #8DBFB4;
    --celadon-400: #6AA99E;
    --celadon-500: #4F9289;

    --roast-300: #F0B27A;
    --roast-400: #E89454;
    --roast-500: #D97A2D;
    --roast-600: #BC6320;

    --ink-900: #1F2922;
    --ink-700: #3F4A42;
    --ink-500: #677468;
    --ink-400: #8E9A8B;
    --ink-300: #B8C0B7;
    --ink-200: #D9DDD8;
    --ink-100: #EEF0ED;

    --shadow-sm: 0 1px 2px rgba(31, 41, 34, 0.04), 0 1px 3px rgba(31, 41, 34, 0.06);
    --shadow-md: 0 4px 8px -2px rgba(31, 41, 34, 0.08), 0 2px 4px -1px rgba(31, 41, 34, 0.06);
    --shadow-lg: 0 12px 24px -4px rgba(31, 41, 34, 0.12), 0 4px 8px -2px rgba(31, 41, 34, 0.08);
    --shadow-xl: 0 24px 48px -12px rgba(31, 41, 34, 0.18), 0 10px 20px -6px rgba(31, 41, 34, 0.10);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
    color: var(--ink-900);
    background:
      radial-gradient(1200px 800px at 20% 10%, rgba(168,199,157,0.18), transparent 60%),
      radial-gradient(900px 700px at 85% 90%, rgba(184,212,204,0.20), transparent 55%),
      linear-gradient(180deg, #F7F5EE 0%, #EEF1E9 100%);
    overflow: hidden;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: 'Noto Serif SC', 'Songti SC', serif; }

  /* Custom cursor */
  #cursor-wrap {
    position: fixed; inset: 0; pointer-events: none; z-index: 2147483647;
    mix-blend-mode: normal;
  }
  .cursor-outer {
    position: absolute; width: 32px; height: 32px;
    border: 2px solid #fff; border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 2px rgba(101, 150, 91, 0.35), 0 0 18px 4px rgba(101, 150, 91, 0.18);
    transition: width 0.22s cubic-bezier(.3,.7,.4,1), height 0.22s cubic-bezier(.3,.7,.4,1),
                border-color 0.2s, background 0.2s, opacity 0.25s;
    background: rgba(255,255,255,0.06);
    will-change: transform, width, height;
  }
  .cursor-inner {
    position: absolute; width: 6px; height: 6px;
    background: #65965B; border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px 2px rgba(101, 150, 91, 0.55);
    transition: width 0.18s, height 0.18s, background 0.18s, opacity 0.2s;
    will-change: transform;
  }
  .cursor-hover .cursor-outer {
    width: 44px; height: 44px;
    border-color: #D97A2D;
    background: rgba(217, 122, 45, 0.08);
    box-shadow: 0 0 0 3px rgba(217, 122, 45, 0.25), 0 0 22px 6px rgba(217, 122, 45, 0.2);
  }
  .cursor-hover .cursor-inner {
    width: 5px; height: 5px;
    background: #D97A2D;
  }
  .cursor-active .cursor-outer {
    width: 24px; height: 24px;
    border-color: #8B5E3C;
  }
  .cursor-ripple {
    position: absolute; border-radius: 50%;
    border: 2px solid rgba(101, 150, 91, 0.6);
    transform: translate(-50%, -50%);
    pointer-events: none;
    animation: ripple-pop 0.6s ease-out forwards;
  }
  @keyframes ripple-pop {
    0% { width: 0; height: 0; opacity: 0.9; }
    100% { width: 80px; height: 80px; opacity: 0; }
  }

  /* Page container & transitions */
  .app-stage {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
  }
  .page-enter {
    animation: page-slide-in 0.42s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes page-slide-in {
    0% { opacity: 0; transform: translateY(18px); filter: blur(4px); }
    100% { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  /* Scrollbar hide inside device */
  .noscroll::-webkit-scrollbar { display: none; }
  .noscroll { scrollbar-width: none; }

  /* Utility: no select */
  .noselect { user-select: none; -webkit-user-select: none; }

  /* Steam particles */
  .steam-particle {
    position: absolute;
    border-radius: 50%;
    filter: blur(6px);
    pointer-events: none;
    opacity: 0;
    will-change: transform, opacity;
  }

  /* Tilt cards */
  .tilt-card {
    transition: box-shadow 0.3s;
    will-change: transform;
    transform-style: preserve-3d;
  }

  /* Shimmer / gloss sweep */
  .shimmer {
    position: relative;
    overflow: hidden;
  }
  .shimmer::after {
    content: '';
    position: absolute;
    top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transform: skewX(-15deg);
    animation: gloss-sweep 3.2s ease-in-out infinite;
  }
  @keyframes gloss-sweep {
    0%, 100% { left: -60%; }
    50% { left: 120%; }
  }

  /* Pulse ring */
  .pulse-ring {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    animation: pulse-ring 2.2s cubic-bezier(.2,.8,.2,1) infinite;
  }
  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 rgba(217, 122, 45, 0.35); }
    70% { box-shadow: 0 0 0 18px rgba(217, 122, 45, 0); }
    100% { box-shadow: 0 0 0 0 rgba(217, 122, 45, 0); }
  }

  /* Typewriter */
  .typing-caret::after {
    content: '|';
    display: inline-block;
    margin-left: 2px;
    color: var(--roast-500);
    animation: caret-blink 0.9s steps(1) infinite;
  }
  @keyframes caret-blink {
    50% { opacity: 0; }
  }

  /* Scroll reveal */
  .reveal {
    opacity: 0;
    transform: translateY(20px);
    animation: reveal-up 0.6s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes reveal-up {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Tab bar slide indicator */
  .tab-thumb {
    transition: transform 0.3s cubic-bezier(.3,.7,.4,1), width 0.3s cubic-bezier(.3,.7,.4,1);
  }

  /* Tea leaf floating */
  @keyframes leaf-float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-8px) rotate(3deg); }
    50% { transform: translateY(-3px) rotate(-2deg); }
    75% { transform: translateY(-10px) rotate(2deg); }
  }
  .leaf-float { animation: leaf-float 7s ease-in-out infinite; }

  /* Wave ripple (water) */
  .wave-ripple {
    position: absolute;
    border-radius: 50%;
    border: 1.5px solid rgba(79, 146, 137, 0.5);
    animation: wave-expand 2s ease-out infinite;
    pointer-events: none;
  }
  @keyframes wave-expand {
    0% { width: 0; height: 0; opacity: 0.8; }
    100% { width: 160px; height: 160px; opacity: 0; }
  }

  /* Spring pop */
  @keyframes spring-pop {
    0% { transform: scale(0.85); opacity: 0; }
    60% { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .spring-pop { animation: spring-pop 0.45s cubic-bezier(.3,.7,.4,1) both; }

  /* Fade in */
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  .fade-in { animation: fade-in 0.5s ease both; }

  /* Bottom sheet */
  .bottom-sheet {
    animation: sheet-up 0.35s cubic-bezier(.3,.7,.4,1) both;
  }
  @keyframes sheet-up {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  /* Glow hover */
  .glow-hover {
    transition: box-shadow 0.3s cubic-bezier(.2,.8,.2,1), transform 0.25s ease;
  }
  .glow-hover:hover {
    box-shadow: 0 16px 32px -8px rgba(101, 150, 91, 0.28), 0 6px 12px -4px rgba(101, 150, 91, 0.18);
  }

  /* Masonry two-col */
  .masonry {
    column-count: 2;
    column-gap: 12px;
  }
  .masonry > * {
    break-inside: avoid;
    margin-bottom: 12px;
    display: block;
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .shimmer::after { display: none; }
  }

  /* Stage layout */
  .stage-wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 32px;
  }
  .decor-label {
    position: absolute;
    top: 28px; left: 36px;
    font-family: 'Noto Serif SC', serif;
    font-size: 13px; color: var(--ink-500);
    letter-spacing: 0.2em;
  }
  .decor-label b {
    color: var(--ink-900);
    font-size: 22px;
    display: block;
    letter-spacing: 0.05em;
    margin-bottom: 2px;
  }
  .decor-hint {
    position: absolute;
    bottom: 28px; right: 36px;
    font-size: 12px; color: var(--ink-500);
    text-align: right;
    line-height: 1.8;
  }
  .decor-hint .dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--roast-500);
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
    animation: pulse-dot 1.8s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 0.4; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.1); }
  }

  /* Tilt 3D container */
  .tilt-3d {
    perspective: 1000px;
  }
</style>
</head>

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: 'miaoda:tweaks:set-keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxTop = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxTop, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.top = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = typeof ResizeObserver !== 'undefined'
      ? new ResizeObserver(clampToViewport) : null;
    if (ro) ro.observe(document.documentElement);
    else window.addEventListener('resize', clampToViewport);
    return () => {
      if (ro) ro.disconnect();
      else window.removeEventListener('resize', clampToViewport);
    };
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === 'miaoda:tweaks:activate') setOpen(true);
      else if (t === 'miaoda:tweaks:deactivate') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: 'miaoda:tweaks:available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: 'miaoda:tweaks:dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startTop = r.top;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startTop + (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, top: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

              role="switch" aria-checked={!!value}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  const __twkIsLight = (hex) => {
    const h = String(hex).replace('#', '');
    const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
    const n = parseInt(x.slice(0, 6), 16);
    if (Number.isNaN(n)) return true;
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return r * 299 + g * 587 + b * 114 > 148000;
  };
  const __TwkCheck = ({ light }) => (
    <svg viewBox="0 0 14 14" aria-hidden="true">
      <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
            strokeLinecap="round" strokeLinejoin="round"
            stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
    </svg>
  );
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

// ── Utility: format time ──────────────────────────────────
function fmtTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
}

// ============================================================
//  STEAM PARTICLES (signature effect #1)
// ============================================================
function useSteam(containerRef, config = {}) {
  const { count = 14, color = 'rgba(255,255,255,0.55)', minSize = 10, maxSize = 28 } = config;
  useEffect(() => {
    const container = containerRef.current;
    if (!container) return;

    const particles = [];
    let rafId = null;
    let running = true;

    function spawn() {
      if (!running || !container) return;
      const el = document.createElement('div');
      el.className = 'steam-particle';
      const size = minSize + Math.random() * (maxSize - minSize);
      const left = 20 + Math.random() * 60;
      const duration = 3000 + Math.random() * 2500;
      const drift = (Math.random() - 0.5) * 40;
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.left = left + '%';
      el.style.bottom = '10%';
      el.style.background = color;
      el.style.opacity = '0';
      container.appendChild(el);

      const start = performance.now();
      function step(now) {
        if (!running) return;
        const t = (now - start) / duration;
        if (t >= 1) {
          el.remove();
          const idx = particles.indexOf(anim);
          if (idx > -1) particles.splice(idx, 1);
          return;
        }
        // ease-out for opacity
        const op = t < 0.2 ? t / 0.2 : 1 - (t - 0.2) / 0.8;
        const y = -t * 100;
        const x = Math.sin(t * Math.PI * 2) * drift;
        const scale = 1 + t * 1.2;
        el.style.opacity = Math.max(0, op * 0.6);
        el.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
        rafId = requestAnimationFrame(step);
      }
      const anim = { step, el };
      particles.push(anim);
      rafId = requestAnimationFrame(step);
    }

    // initial burst
    for (let i = 0; i < count; i++) {
      setTimeout(spawn, i * 180 + Math.random() * 200);
    }
    const interval = setInterval(spawn, 350);

    // visibility handler
    function onVis() {
      running = !document.hidden;
    }
    document.addEventListener('visibilitychange', onVis);

    return () => {
      running = false;
      clearInterval(interval);
      if (rafId) cancelAnimationFrame(rafId);
      particles.forEach(p => p.el && p.el.remove());
      document.removeEventListener('visibilitychange', onVis);
    };
  }, [containerRef, count, color, minSize, maxSize]);
}

// ============================================================
//  CARD 3D TILT (direct DOM manipulation, no setState)
// ============================================================
function useTilt(ref, { max = 10, perspective = 900 } = {}) {
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    el.style.transformStyle = 'preserve-3d';
    el.style.perspective = perspective + 'px';

    function onMove(e) {
      const r = el.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width;
      const py = (e.clientY - r.top) / r.height;
      const rx = (0.5 - py) * max;
      const ry = (px - 0.5) * max;
      el.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
    }
    function onLeave() {
      el.style.transition = 'transform 0.5s cubic-bezier(.2,.8,.2,1)';
      el.style.transform = 'rotateX(0) rotateY(0)';
      setTimeout(() => { if (el) el.style.transition = ''; }, 500);
    }
    function onEnter() {
      el.style.transition = '';
    }

    el.addEventListener('mousemove', onMove);
    el.addEventListener('mouseleave', onLeave);
    el.addEventListener('mouseenter', onEnter);
    return () => {
      el.removeEventListener('mousemove', onMove);
      el.removeEventListener('mouseleave', onLeave);
      el.removeEventListener('mouseenter', onEnter);
    };
  }, [ref, max, perspective]);
}

// ============================================================
//  TYPEWRITER effect
// ============================================================
function useTypewriter(text, { speed = 80, delay = 500 } = {}) {
  const [out, setOut] = useState('');
  useEffect(() => {
    let i = 0;
    let timer = null;
    let running = true;
    function onVis() { if (document.hidden) running = false; else running = true; }
    document.addEventListener('visibilitychange', onVis);

    setTimeout(() => {
      function tick() {
        if (!running) { timer = setTimeout(tick, 200); return; }
        i++;
        setOut(text.slice(0, i));
        if (i < text.length) {
          timer = setTimeout(tick, speed + Math.random() * 40);
        }
      }
      tick();
    }, delay);

    return () => {
      clearTimeout(timer);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, [text, speed, delay]);
  return out;
}

// ============================================================
//  DIGITAL COUNTER (spring physics feel via easing)
// ============================================================
function useCounter(target, { duration = 1500, delay = 300 } = {}) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    let rafId = null;
    let start = 0;
    let running = true;
    function onVis() { running = !document.hidden; }
    document.addEventListener('visibilitychange', onVis);

    const t = setTimeout(() => {
      start = performance.now();
      function step(now) {
        if (!running) { rafId = requestAnimationFrame(step); return; }
        const p = Math.min(1, (now - start) / duration);
        // easeOutExpo
        const e = p === 1 ? 1 : 1 - Math.pow(2, -10 * p);
        setVal(Math.round(target * e));
        if (p < 1) rafId = requestAnimationFrame(step);
      }
      rafId = requestAnimationFrame(step);
    }, delay);

    return () => {
      clearTimeout(t);
      if (rafId) cancelAnimationFrame(rafId);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, [target, duration, delay]);
  return val;
}

// ============================================================
//  PARALLAX scroll helper
// ============================================================
function useParallax(scrollRef, layers) {
  useEffect(() => {
    const sc = scrollRef.current;
    if (!sc) return;
    let rafId = null;

    function onScroll() {
      if (rafId) return;
      rafId = requestAnimationFrame(() => {
        rafId = null;
        const s = sc.scrollTop;
        layers.forEach(({ ref, speed, scale = false }) => {
          const el = ref.current;
          if (!el) return;
          if (scale) {
            const scl = 1 + s * speed * 0.001;
            el.style.transform = `translateY(${s * speed}px) scale(${scl})`;
          } else {
            el.style.transform = `translateY(${s * speed}px)`;
          }
        });
      });
    }

    sc.addEventListener('scroll', onScroll, { passive: true });
    return () => {
      sc.removeEventListener('scroll', onScroll);
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, [scrollRef, layers]);
}

// ============================================================
//  TEA CUP RIPPLE (signature effect #2)
// ============================================================
function TeaCupRipple({ active = true, color = 'rgba(79, 146, 137, 0.5)' }) {
  const [ripples, setRipples] = useState([]);
  const nextId = useRef(0);

  useEffect(() => {
    if (!active) return;
    let timer = null;
    function spawn() {
      const id = nextId.current++;
      setRipples(r => [...r, id]);
      setTimeout(() => {
        setRipples(r => r.filter(x => x !== id));
      }, 2000);
      timer = setTimeout(spawn, 1200 + Math.random() * 800);
    }
    timer = setTimeout(spawn, 400);
    return () => { if (timer) clearTimeout(timer); };
  }, [active]);

  return (
    <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', pointerEvents: 'none' }}>
      {ripples.map(id => (
        <div
          key={id}
          style={{
            position: 'absolute',
            width: 0, height: 0,
            borderRadius: '50%',
            border: `1.5px solid ${color}`,
            animation: 'wave-expand 2s ease-out forwards',
          }}
        />
      ))}
    </div>
  );
}

// ============================================================
//  CUSTOM CURSOR
// ============================================================
function initCustomCursor() {
  const wrap = document.getElementById('cursor-wrap');
  const outer = document.getElementById('cursor-outer');
  const inner = document.getElementById('cursor-inner');
  if (!outer || !inner) return;

  let tx = window.innerWidth / 2;
  let ty = window.innerHeight / 2;
  let cx = tx, cy = ty;
  let rafId = null;
  let running = true;

  function tick() {
    if (!running) return;
    // outer follows with damping (inertia)
    cx += (tx - cx) * 0.18;
    cy += (ty - cy) * 0.18;
    outer.style.left = cx + 'px';
    outer.style.top = cy + 'px';
    inner.style.left = tx + 'px';
    inner.style.top = ty + 'px';
    rafId = requestAnimationFrame(tick);
  }

  function onMove(e) {
    tx = e.clientX;
    ty = e.clientY;
  }

  function onEnterInteractive(e) {
    const target = e.target.closest('button, a, [data-cursor="hover"], .tilt-card, .glow-hover');
    if (target) {
      wrap.classList.add('cursor-hover');
    } else {
      wrap.classList.remove('cursor-hover');
    }
  }

  function onDown() { wrap.classList.add('cursor-active'); }
  function onUp() { wrap.classList.remove('cursor-active'); }

  function onClick(e) {
    const r = document.createElement('div');
    r.className = 'cursor-ripple';
    r.style.left = e.clientX + 'px';
    r.style.top = e.clientY + 'px';
    wrap.appendChild(r);
    setTimeout(() => r.remove(), 600);
  }

  function onVis() {
    running = !document.hidden;
    if (running && !rafId) rafId = requestAnimationFrame(tick);
  }

  // center start
  outer.style.left = tx + 'px';
  outer.style.top = ty + 'px';
  inner.style.left = tx + 'px';
  inner.style.top = ty + 'px';
  wrap.style.opacity = '1';

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseover', onEnterInteractive);
  document.addEventListener('mousedown', onDown);
  document.addEventListener('mouseup', onUp);
  document.addEventListener('click', onClick);
  document.addEventListener('visibilitychange', onVis);

  rafId = requestAnimationFrame(tick);

  return () => {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseover', onEnterInteractive);
    document.removeEventListener('mousedown', onDown);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('click', onClick);
    document.removeEventListener('visibilitychange', onVis);
  };
}

// ── PAGE 4: 冲泡计时器 (Timer) — Circular progress + ring animation ─
function TimerPage() {
  const [methodId, setMethodId] = useState('green');
  const method = brewMethods.find(m => m.id === methodId);
  const [running, setRunning] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const total = method.time;
  const progress = Math.min(1, elapsed / total);

  useEffect(() => {
    let timer = null;
    let runningFlag = true;

    function onVis() { if (document.hidden) runningFlag = false; else runningFlag = true; }
    document.addEventListener('visibilitychange', onVis);

    if (running && elapsed < total) {
      timer = setInterval(() => {
        if (!runningFlag) return;
        setElapsed(e => {
          if (e >= total) {
            setRunning(false);
            return total;
          }
          return e + 1;
        });
      }, 1000);
    }
    return () => {
      clearInterval(timer);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, [running, elapsed, total]);

  const remaining = total - elapsed;
  const angle = progress * 360;

  function reset() {
    setRunning(false);
    setElapsed(0);
  }
  function toggle() {
    if (elapsed >= total) {
      setElapsed(0);
      setRunning(true);
    } else {
      setRunning(r => !r);
    }
  }

  // water wave ripples at bottom
  const [ripples, setRipples] = useState([]);
  useEffect(() => {
    if (!running) return;
    let t = null;
    function spawn() {
      const id = Date.now() + Math.random();
      setRipples(r => [...r, id]);
      setTimeout(() => setRipples(r => r.filter(x => x !== id)), 2000);
      t = setTimeout(spawn, 1000 + Math.random() * 600);
    }
    t = setTimeout(spawn, 500);
    return () => clearTimeout(t);
  }, [running]);

  return (
    <div className="page-enter noscroll" style={{
      height: '100%', overflowY: 'auto',
      background: 'linear-gradient(180deg, #1F2E26 0%, #2E4431 50%, #3E6038 100%)',
      color: '#fff',
    }}>
      <div style={{ padding: '18px 20px 0' }}>
        <div style={{ fontSize: 11, opacity: 0.6, letterSpacing: 2 }}>BREWING TIMER</div>
        <div className="serif" style={{ fontSize: 22, fontWeight: 600, marginTop: 2 }}>冲泡计时器</div>
      </div>

      {/* Tea cup visual with ring progress */}
      <div style={{
        display: 'flex', justifyContent: 'center',
        padding: '28px 0 20px',
        position: 'relative',
      }}>
        <div style={{ position: 'relative', width: 240, height: 240 }}>
          {/* Outer glow */}
          <div style={{
            position: 'absolute', inset: -20,
            borderRadius: '50%',
            background: 'radial-gradient(circle, rgba(101,150,91,0.2) 0%, transparent 70%)',
            filter: 'blur(10px)',
          }} />

          {/* Ring background */}
          <svg viewBox="0 0 240 240" style={{ width: 240, height: 240, transform: 'rotate(-90deg)' }}>
            <circle cx="120" cy="120" r="100" fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="10" />
            <circle
              cx="120" cy="120" r="100" fill="none"
              stroke="url(#ringGrad)"
              strokeWidth="10" strokeLinecap="round"
              strokeDasharray={2 * Math.PI * 100}
              strokeDashoffset={2 * Math.PI * 100 * (1 - progress)}
              style={{ transition: 'stroke-dashoffset 0.3s ease' }}
            />
            <defs>
              <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#8DBFB4" />
                <stop offset="50%" stopColor="#65965B" />
                <stop offset="100%" stopColor="#D97A2D" />
              </linearGradient>
            </defs>
          </svg>

          {/* Inner content */}
          <div style={{
            position: 'absolute', inset: 0,
            display: 'flex', flexDirection: 'column',
            alignItems: 'center', justifyContent: 'center',
          }}>
            <div style={{ fontSize: 12, opacity: 0.6, marginBottom: 4 }}>剩余时间</div>
            <div className="serif" style={{ fontSize: 42, fontWeight: 300, letterSpacing: 1, fontVariantNumeric: 'tabular-nums' }}>
              {fmtTime(remaining)}
            </div>
            <div style={{ fontSize: 12, color: 'var(--celadon-300)', marginTop: 4 }}>
              {method.temp} · {method.ratio} · {method.leaf}
            </div>
          </div>

          {/* Tea water surface (fills up visually for decoration) */}
          <div style={{
            position: 'absolute',
            left: 40, right: 40,
            bottom: 30,
            height: 4,

// ── PAGE 6: 茶品详情 (Detail) — Gallery + parallax + info panels ─
function DetailPage({ tea, onBack }) {
  const scrollRef = useRef(null);
  const heroRef = useRef(null);
  const barRef = useRef(null);

  useParallax(scrollRef, [
    { ref: heroRef, speed: 0.4, scale: true },
  ]);

  // Fade in the top bar on scroll
  useEffect(() => {
    const sc = scrollRef.current;
    if (!sc) return;
    function onScroll() {
      if (barRef.current) {
        const op = Math.min(1, sc.scrollTop / 80);
        barRef.current.style.opacity = op;
        barRef.current.style.background = `rgba(255,255,255,${op * 0.95})`;
        barRef.current.style.backdropFilter = op > 0.3 ? 'blur(12px)' : 'none';
        barRef.current.style.borderBottom = op > 0.5 ? '1px solid var(--ink-100)' : '1px solid transparent';
      }
    }
    sc.addEventListener('scroll', onScroll, { passive: true });
    return () => sc.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <div ref={scrollRef} className="page-enter noscroll" style={{
      height: '100%', overflowY: 'auto',
      background: '#fff',
      position: 'relative',
    }}>
      {/* Top bar (fades in) */}

        position: 'sticky', top: 0, zIndex: 20,

function Section({ title, subtitle, children }) {
  return (
    <div style={{ marginBottom: 24 }}>

      </div>
      {children}
    </div>
  );
}

function ColorGroup({ label, colors }) {
  return (
    <div style={{ marginBottom: 10 }}>
      <div style={{ fontSize: 11, color: 'var(--ink-500)', marginBottom: 6 }}>{label}</div>
      <div style={{ display: 'flex', gap: 4 }}>
        {colors.map((c, i) => (
          <div key={i} data-cursor="hover" title={c} style={{
            flex: 1, height: 36,
            background: c,
            borderRadius: 6,
            cursor: 'pointer',
            border: i === Math.floor(colors.length / 2) ? '2px solid var(--ink-900)' : '1px solid var(--ink-200)',
            boxShadow: i === Math.floor(colors.length / 2) ? '0 0 0 2px #fff' : 'none',
            transition: 'transform 0.2s',
          }}
          onMouseEnter={e => e.currentTarget.style.transform = 'scale(1.1)'}
          onMouseLeave={e => e.currentTarget.style.transform = 'scale(1)'}
          />
        ))}
      </div>
    </div>
  );
}

}`,
    },
  ];

  const methodColor = {
    GET: '#65965B',
    POST: '#D97A2D',
    PUT: '#4F9289',
    DELETE: '#BC6320',
  };

  return (
    <div className="page-enter noscroll" style={{
      height: '100%', overflowY: 'auto',
      background: '#1a1d1f',
      color: '#e2e8e4',
    }}>
      {/* Header */}
      <div style={{
        padding: '20px 20px 16px',
        background: 'linear-gradient(135deg, #2E4431, #1F2E26)',
        color: '#fff',
        borderBottom: '1px solid rgba(255,255,255,0.08)',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <button data-cursor="hover" onClick={onBack} style={{
            width: 36, height: 36, borderRadius: '50%',
            background: 'rgba(255,255,255,0.1)', border: '1px solid rgba(255,255,255,0.15)',
            color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center',
            cursor: 'pointer',
          }}>{I.back(18, '#fff')}</button>
          <div>
            <div style={{ fontSize: 11, opacity: 0.6, letterSpacing: 2 }}>API DOCUMENTATION</div>
            <div className="serif" style={{ fontSize: 20, fontWeight: 600, marginTop: 2 }}>接口文档 v1.0</div>
          </div>
        </div>

        {/* Base URL */}
        <div style={{
          marginTop: 14, padding: '10px 14px',
          background: 'rgba(0,0,0,0.3)', borderRadius: 10,
          fontFamily: 'ui-monospace, Menlo, monospace', fontSize: 11,
          border: '1px solid rgba(255,255,255,0.08)',
          display: 'flex', alignItems: 'center', gap: 10,
        }}>
          <span style={{ color: '#8DBFB4' }}>BASE URL</span>
          <span style={{ color: '#E2E8E4' }}>https://api.cloudbrew.tea/v1</span>
          <button data-cursor="hover" style={{
            marginLeft: 'auto',
            fontSize: 10, padding: '2px 8px', borderRadius: 4,
            background: 'rgba(141,191,180,0.2)', border: '1px solid rgba(141,191,180,0.3)',
            color: '#8DBFB4', cursor: 'pointer',
          }}>复制</button>
        </div>
      </div>

      {/* Tabs */}
      <div style={{
        display: 'flex', gap: 0, padding: '0 20px',
        borderBottom: '1px solid rgba(255,255,255,0.08)',
        background: '#1a1d1f',
        position: 'sticky', top: 0, zIndex: 5,
      }}>
        {['接口总览', '鉴权说明', '错误码', '状态码'].map(tab => (
          <button key={tab} data-cursor="hover" onClick={() => setActiveTab(tab)} style={{
            padding: '12px 14px', background: 'none', border: 0,
            fontSize: 12, fontWeight: activeTab === tab ? 600 : 400,
            color: activeTab === tab ? '#8DBFB4' : '#8E9A8B',
            cursor: 'pointer', position: 'relative',
          }}>
            {tab}
            {activeTab === tab && (
              <div style={{
                position: 'absolute', bottom: -1, left: 14, right: 14,
                height: 2, borderRadius: 1, background: '#8DBFB4',
              }} />
            )}
          </button>
        ))}
      </div>

      {/* Endpoint list */}
      {activeTab === '接口总览' && (
        <div style={{ padding: '16px 16px 100px' }}>
          <div style={{ fontSize: 11, color: '#677468', marginBottom: 10, padding: '0 4px' }}>
            共 {endpoints.length} 个接口
          </div>
          {endpoints.map((ep, i) => (
            <div key={ep.id} data-cursor="hover" style={{
              marginBottom: 8,
              borderRadius: 12,
              overflow: 'hidden',
              background: '#222629',
              border: '1px solid rgba(255,255,255,0.06)',
              animation: `reveal-up 0.4s cubic-bezier(.2,.8,.2,1) ${i * 0.05}s both`,
            }}>
              <div
                onClick={() => setExpandedId(expandedId === ep.id ? '' : ep.id)}
                style={{
                  padding: '12px 14px',
                  display: 'flex', alignItems: 'center', gap: 10,
                  cursor: 'pointer',
                }}
              >
                <span style={{
                  fontSize: 10, fontWeight: 700,
                  padding: '3px 7px', borderRadius: 5,
                  background: methodColor[ep.method] + '22',
                  color: methodColor[ep.method],
                  flexShrink: 0,
                }}>{ep.method}</span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 12, fontFamily: 'ui-monospace, Menlo, monospace', color: '#e2e8e4' }}>{ep.path}</div>
                  <div style={{ fontSize: 10, color: '#677468', marginTop: 2 }}>{ep.name}</div>
                </div>
                <div style={{
                  color: '#677468',
                  transform: expandedId === ep.id ? 'rotate(90deg)' : 'rotate(0deg)',
                  transition: 'transform 0.2s',
                }}>{I.arrow(12, '#677468')}</div>
              </div>

              {expandedId === ep.id && (
                <div style={{
                  padding: '0 14px 14px',
                  borderTop: '1px solid rgba(255,255,255,0.06)',
                  animation: 'fade-in 0.2s ease',
                }}>
                  <div style={{ fontSize: 11, color: '#B8C0B7', marginTop: 12, lineHeight: 1.6 }}>{ep.desc}</div>

                  {/* Parameters */}
                  <div style={{ marginTop: 14 }}>
                    <div style={{ fontSize: 10, fontWeight: 600, color: '#8DBFB4', marginBottom: 8, letterSpacing: 1 }}>请求参数</div>
                    <div style={{
                      background: 'rgba(0,0,0,0.2)', borderRadius: 8,
                      overflow: 'hidden',
                    }}>
                      {ep.params.map((p, pi) => (
                        <div key={pi} style={{
                          padding: '8px 10px',
                          borderBottom: pi < ep.params.length - 1 ? '1px solid rgba(255,255,255,0.04)' : 0,
                          display: 'flex', gap: 10, fontSize: 11,
                        }}>
                          <span style={{ color: '#F0B27A', fontFamily: 'ui-monospace, Menlo, monospace', minWidth: 80 }}>{p.name}</span>
                          <span style={{ color: '#6AA99E', fontSize: 10, minWidth: 52 }}>{p.type}</span>
                          {p.required && <span style={{ color: '#D97A2D', fontSize: 10 }}>必填</span>}
                          <span style={{ color: '#8E9A8B', marginLeft: 'auto' }}>{p.desc}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Response */}
                  <div style={{ marginTop: 14 }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                      <span style={{ fontSize: 10, fontWeight: 600, color: '#8DBFB4', letterSpacing: 1 }}>响应示例</span>
                      <button data-cursor="hover" style={{
                        fontSize: 10, padding: '2px 8px', borderRadius: 4,
                        background: 'rgba(141,191,180,0.15)', border: '1px solid rgba(141,191,180,0.25)',
                        color: '#8DBFB4', cursor: 'pointer',
                      }}>复制</button>
                    </div>
                    <pre style={{
                      margin: 0, padding: 12,
                      background: 'rgba(0,0,0,0.3)',
                      borderRadius: 8,
                      fontSize: 10.5,
                      lineHeight: 1.6,
                      color: '#c5d0c8',
                      fontFamily: 'ui-monospace, Menlo, monospace',
                      overflowX: 'auto',
                      border: '1px solid rgba(255,255,255,0.05)',
                    }}>{ep.response}</pre>
                  </div>
                </div>
              )}
            </div>
          ))}
        </div>
      )}

      {activeTab === '鉴权说明' && (
        <div style={{ padding: '20px', fontSize: 12, lineHeight: 1.8, color: '#B8C0B7' }}>
          <div className="serif" style={{ fontSize: 16, fontWeight: 600, color: '#e2e8e4', marginBottom: 12 }}>鉴权方式</div>
          <p style={{ margin: '0 0 12px' }}>本 API 使用 Bearer Token 进行鉴权。所有需要登录的接口需要在请求头中携带 token。</p>

          <div style={{
            padding: 12,
            background: 'rgba(141,191,180,0.1)',
            border: '1px solid rgba(141,191,180,0.25)',
            borderRadius: 8,
            fontFamily: 'ui-monospace, Menlo, monospace',
            fontSize: 11,
            color: '#8DBFB4',
            marginBottom: 16,
          }}>
            Authorization: Bearer {'<your_token_here>'}
          </div>

          <div className="serif" style={{ fontSize: 14, fontWeight: 600, color: '#e2e8e4', margin: '16px 0 10px' }}>获取 Token</div>
          <p style={{ margin: 0 }}>调用登录接口获取 token，token 有效期为 7 天。过期后需重新登录获取。</p>
        </div>
      )}

      {activeTab === '错误码' && (
        <div style={{ padding: '20px' }}>
          <div className="serif" style={{ fontSize: 16, fontWeight: 600, color: '#e2e8e4', marginBottom: 12 }}>业务错误码</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 0 }}>
            {[
              { code: 0, msg: 'success', desc: '请求成功' },
              { code: 40001, msg: 'invalid_params', desc: '参数校验失败' },
              { code: 40101, msg: 'unauthorized', desc: '未授权，token 无效或已过期' },
              { code: 40301, msg: 'forbidden', desc: '无权限访问该资源' },
              { code: 40401, msg: 'not_found', desc: '资源不存在' },
              { code: 40901, msg: 'conflict', desc: '资源冲突，如重复添加收藏' },
              { code: 50001, msg: 'server_error', desc: '服务器内部错误' },
              { code: 50301, msg: 'service_unavailable', desc: '服务暂时不可用' },
            ].map(e => (
              <div key={e.code} style={{
                display: 'flex', alignItems: 'center', gap: 12,
                padding: '10px 0',
                borderBottom: '1px solid rgba(255,255,255,0.05)',
                fontSize: 12,
              }}>
                <span style={{
                  fontFamily: 'ui-monospace, monospace',
                  color: e.code === 0 ? '#65965B' : '#D97A2D',
                  fontWeight: 500, minWidth: 60,
                }}>{e.code}</span>
                <span style={{ color: '#8DBFB4', fontFamily: 'ui-monospace, monospace', minWidth: 120, fontSize: 11 }}>{e.msg}</span>
                <span style={{ color: '#8E9A8B', fontSize: 11, marginLeft: 'auto' }}>{e.desc}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {activeTab === '状态码' && (
        <div style={{ padding: '20px' }}>
          <div className="serif" style={{ fontSize: 16, fontWeight: 600, color: '#e2e8e4', marginBottom: 12 }}>HTTP 状态码</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 0 }}>
            {[
              { code: 200, desc: '请求成功' },
              { code: 201, desc: '资源创建成功' },
              { code: 204, desc: '操作成功，无返回内容' },
              { code: 400, desc: '请求参数错误' },
              { code: 401, desc: '未认证' },
              { code: 403, desc: '禁止访问' },
              { code: 404, desc: '资源未找到' },
              { code: 429, desc: '请求过于频繁' },
              { code: 500, desc: '服务器内部错误' },
              { code: 502, desc: '网关错误' },
              { code: 503, desc: '服务不可用' },
            ].map(s => (
              <div key={s.code} style={{
                display: 'flex', alignItems: 'center', gap: 16,
                padding: '10px 0',
                borderBottom: '1px solid rgba(255,255,255,0.05)',
                fontSize: 12,
              }}>
                <span style={{
                  fontFamily: 'ui-monospace, monospace',
                  color: s.code < 300 ? '#65965B' : s.code < 500 ? '#D97A2D' : '#BC6320',
                  fontWeight: 600, minWidth: 40,
                }}>{s.code}</span>
                <span style={{ color: '#B8C0B7' }}>{s.desc}</span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================================
//  BOTTOM TAB BAR
// ============================================================
function TabBar({ active, onChange }) {
  const tabs = [
    { key: 'home', label: '今日', icon: I.home },
    { key: 'mountain', label: '茶山', icon: I.mountain },
    { key: 'market', label: '市集', icon: I.shop },
    { key: 'timer', label: '计时', icon: I.timer },
    { key: 'profile', label: '我的', icon: I.user },
  ];

  const activeIdx = tabs.findIndex(t => t.key === active);

  return (
    <div style={{
      position: 'absolute', bottom: 0, left: 0, right: 0,
      height: 72,
      background: 'rgba(255, 255, 255, 0.92)',
      backdropFilter: 'blur(20px)',
      borderTop: '1px solid rgba(0,0,0,0.06)',
      display: 'flex', alignItems: 'center',
      padding: '0 8px 16px',
      zIndex: 50,
    }}>
      {tabs.map((tab, i) => {
        const isActive = tab.key === active;
        return (
          <button
            key={tab.key}
            data-cursor="hover"
            onClick={() => onChange(tab.key)}
            style={{
              flex: 1, height: '100%',
              background: 'none', border: 0, cursor: 'pointer',
              display: 'flex', flexDirection: 'column',
              alignItems: 'center', justifyContent: 'center',
              gap: 4,
              color: isActive ? 'var(--chestnut-600)' : 'var(--ink-400)',
              transition: 'color 0.25s',
              position: 'relative',
            }}
          >
            <div style={{
              transform: isActive ? 'translateY(-2px) scale(1.1)' : 'scale(1)',
              transition: 'transform 0.25s cubic-bezier(.3,.7,.4,1)',
            }}>
              {tab.icon(22, isActive ? 'var(--chestnut-600)' : 'var(--ink-400)')}
            </div>
            <span style={{
              fontSize: 10,
              fontWeight: isActive ? 600 : 400,
              transition: 'font-weight 0.2s',
            }}>{tab.label}</span>
          </button>
        );
      })}
    </div>
  );
}

// ============================================================
//  MAIN APP
// ============================================================
function CloudBrewApp() {
  const [page, setPage] = useState('home');
  const [detailTea, setDetailTea] = useState(null);
  const [showDesign, setShowDesign] = useState(false);
  const [showApi, setShowApi] = useState(false);

  const mainPages = ['home', 'mountain', 'market', 'timer', 'profile'];
  const isMainPage = mainPages.includes(page);

  function handleNav(key) {
    setPage(key);
    setDetailTea(null);
    setShowDesign(false);
    setShowApi(false);
  }

  function openDetail(tea) {
    setDetailTea(tea);
  }
  function closeDetail() {
    setDetailTea(null);
  }

  return (
    <div className="app-stage" style={{ position: 'relative', width: '100%', height: '100%' }}>
      {/* Top utility row — quick links to spec pages */}
      <div style={{
        position: 'absolute', top: 8, left: '50%', transform: 'translateX(-50%)',
        display: 'flex', gap: 8, zIndex: 5,
      }}>
        <button data-cursor="hover" onClick={() => setShowDesign(true)} style={{
          fontSize: 11, padding: '6px 12px', borderRadius: 100,
          background: 'rgba(255,255,255,0.8)',
          border: '1px solid var(--mist-200)',
          color: 'var(--chestnut-600)',
          cursor: 'pointer',
          display: 'flex', alignItems: 'center', gap: 4,
          fontWeight: 500,
          backdropFilter: 'blur(10px)',
          boxShadow: 'var(--shadow-sm)',
        }}>
          {I.book(14, 'var(--chestnut-600)')} 设计规范
        </button>
        <button data-cursor="hover" onClick={() => setShowApi(true)} style={{
          fontSize: 11, padding: '6px 12px', borderRadius: 100,
          background: 'rgba(26,29,31,0.85)',
          border: '1px solid rgba(141,191,180,0.3)',
          color: '#8DBFB4',
          cursor: 'pointer',
          display: 'flex', alignItems: 'center', gap: 4,
          fontWeight: 500,
          backdropFilter: 'blur(10px)',
          boxShadow: 'var(--shadow-sm)',
        }}>
          {I.api(14, '#8DBFB4')} 接口文档
        </button>
      </div>

      {/* Pages */}
      {page === 'home' && !detailTea && (
        <HomePage onNav={handleNav} onOpenDetail={openDetail} />
      )}
      {page === 'mountain' && (
        <MountainPage onNav={handleNav} />
      )}
      {page === 'market' && (
        <MarketPage onOpenDetail={openDetail} />
      )}
      {page === 'timer' && (
        <TimerPage />
      )}
      {page === 'profile' && (
        <ProfilePage onNav={handleNav} />
      )}

      {/* Detail overlay */}
      {detailTea && (
        <div style={{
          position: 'absolute', inset: 0, zIndex: 80,
          background: '#fff',
        }}>
          <DetailPage tea={detailTea} onBack={closeDetail} />
        </div>
      )}

      {/* Design system overlay */}
      {showDesign && (
        <div style={{
          position: 'absolute', inset: 0, zIndex: 90,
          background: 'var(--cream-50)',
        }}>
          <DesignSystemPage onBack={() => setShowDesign(false)} />
        </div>
      )}

      {/* API docs overlay */}
      {showApi && (
        <div style={{
          position: 'absolute', inset: 0, zIndex: 90,
          background: '#1a1d1f',
        }}>
          <ApiDocsPage onBack={() => setShowApi(false)} />
        </div>
      )}

      {/* Tab bar — only on main pages */}
      {isMainPage && !detailTea && !showDesign && !showApi && (
        <TabBar active={page} onChange={handleNav} />
      )}
    </div>
  );
}

// ============================================================
//  OUTER STAGE (device frame + labels)
// ============================================================
function App() {
  const [t] = useTweaks(TWEAK_DEFAULTS);

  useEffect(() => {
    const cleanup = initCustomCursor();
    return cleanup;
  }, []);

  // announce upgrade
  useEffect(() => {
    function announce() {
      window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    }
    announce();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announce, { once: true });
    }
  }, []);

  return (
    <div className="stage-wrap">
      {/* Decorative labels */}
      <div className="decor-label noselect">
        <b>云间茶馆</b>
        Cloudbrew · V2 Mobile App
      </div>
      <div className="decor-hint noselect">
        <div><span className="dot"></span>5 个主页面 + 详情页 + 规范页 + 接口文档</div>
        <div>雾绿 · 栗棕 · 米白 · 釉青 · 焙火橙</div>
      </div>

      {/* Android device */}
      <div style={{ position: 'relative' }}>
        <AndroidDevice width={390} height={844}>
          <CloudBrewApp />
        </AndroidDevice>

        {/* Soft shadow glow under device */}
        <div style={{
          position: 'absolute', left: '50%', bottom: -20,
          transform: 'translateX(-50%)',
          width: '70%', height: 24,
          background: 'radial-gradient(ellipse at center, rgba(46,68,49,0.18) 0%, transparent 70%)',
          filter: 'blur(4px)',
          zIndex: -1,
        }} />
      </div>

      {/* Tweaks */}
      <TweaksPanel title="风格">
        <TweakSection label="色彩" />
        <TweakColor
          label="主色调"
          value={t.primaryHue}
          options={['mist', 'chestnut', 'celadon']}
          onChange={(v) => setTweak('primaryHue', v)}
        />
        <TweakColor
          label="强调色"
          value={t.accentColor}
          options={['#D97A2D', '#4F9289', '#8B5E3C', '#65965B']}
          onChange={(v) => setTweak('accentColor', v)}
        />
        <TweakSlider
          label="色彩强度"
          value={t.intensity}
          min={0.4} max={1} step={0.05}
          onChange={(v) => setTweak('intensity', v)}
        />
        <TweakSection label="动效" />
        <TweakToggle
          label="启用动效"
          value={t.animations}
          onChange={(v) => setTweak('animations', v)}
        />
        <TweakToggle
          label="深色模式"
          value={t.dark}
          onChange={(v) => setTweak('dark', v)}
        />
      </TweaksPanel>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>



</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>半盏灯 · 手工灯笼铺</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Ma+Shan+Zheng&display=swap" />
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  /* ===== Reset & Base ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #2a241c;
    color: #3d2c1e;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 50% 30%, #3d3326 0%, #1a1612 70%, #0d0a08 100%);
  }
  #root { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }

  /* ===== Phone Frame ===== */
  .phone-wrapper {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .phone-frame {
    position: relative;
    width: 390px;
    height: 844px;
    background: #111;
    border-radius: 54px;
    padding: 12px;
    box-shadow:
      0 0 0 2px #2a2622,
      0 40px 80px -20px rgba(0,0,0,0.6),
      0 20px 40px -10px rgba(0,0,0,0.4),
      inset 0 0 0 1px rgba(255,255,255,0.05);
  }
  .phone-screen {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 42px;
    overflow: hidden;
    background: #F7F1E3;
  }
  .phone-notch {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 32px;
    background: #000;
    border-radius: 20px;
    z-index: 1000;
  }
  .phone-label {
    color: rgba(247,241,227,0.6);
    font-size: 13px;
    letter-spacing: 2px;
    font-family: "Noto Serif SC", serif;
  }

  /* ===== Status Bar ===== */
  .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px 0 32px;
    font-size: 15px;
    font-weight: 600;
    color: #3d2c1e;
    z-index: 900;
    pointer-events: none;
  }
  .status-bar.dark { color: #fff; }
  .status-bar .right-icons {
    display: flex; align-items: center; gap: 5px;
  }
  .status-bar .signal, .status-bar .wifi, .status-bar .battery {
    display: inline-block;
  }
  .status-bar .battery {
    width: 24px; height: 11px;
    border: 1px solid currentColor;
    border-radius: 3px;
    position: relative;
    opacity: 0.8;
  }
  .status-bar .battery::after {
    content: '';
    position: absolute;
    top: 2px; right: -3px;
    width: 2px; height: 5px;
    background: currentColor;
    border-radius: 0 2px 2px 0;
    opacity: 0.5;
  }
  .status-bar .battery-fill {
    position: absolute;
    top: 1px; left: 1px;
    bottom: 1px;
    width: 80%;
    background: currentColor;
    border-radius: 1px;
  }

  /* ===== Mini-Program Nav Bar ===== */
  .mp-navbar {
    position: absolute;
    top: 44px; left: 0; right: 0;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 800;
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  .mp-navbar.title-center { justify-content: center; }
  .mp-navbar .nav-title {
    font-size: 17px;
    font-weight: 600;
    color: inherit;
    font-family: "Noto Serif SC", serif;
  }
  .mp-navbar .nav-left, .mp-navbar .nav-right {
    min-width: 60px;
    display: flex; align-items: center;
  }
  .mp-navbar .nav-right { justify-content: flex-end; }
  .nav-back-btn {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    color: inherit;
    cursor: pointer;
    border-radius: 50%;
    transition: background 0.2s;
  }
  .nav-back-btn:active { background: rgba(0,0,0,0.08); }

  /* Capsule button (top-right mini-program control) */
  .mp-capsule {
    position: absolute;
    top: 54px;
    right: 14px;
    width: 87px;
    height: 32px;
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 16px;
    display: flex;
    align-items: center;
    z-index: 950;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    border: 0.5px solid rgba(0,0,0,0.05);
  }
  .mp-capsule .capsule-btn {
    flex: 1;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #333;
    cursor: pointer;
    position: relative;
  }
  .mp-capsule .capsule-btn:active { opacity: 0.6; }
  .mp-capsule .capsule-divider {
    width: 0.5px;
    height: 16px;
    background: rgba(0,0,0,0.12);
  }

  /* ===== Tab Bar ===== */
  .mp-tabbar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 56px;
    background: rgba(255, 252, 247, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    align-items: stretch;
    border-top: 0.5px solid rgba(107, 74, 46, 0.12);
    z-index: 700;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .tabbar-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    color: #9a8a78;
    transition: color 0.25s ease;
    position: relative;
  }
  .tabbar-item.active { color: #D96C2C; }
  .tabbar-icon {
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .tabbar-item.active .tabbar-icon {
    transform: translateY(-2px) scale(1.08);
  }
  .tabbar-label {
    font-size: 10px;
    font-weight: 500;
  }
  .tabbar-glow {
    position: absolute;
    top: 8px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(217,108,44,0.6) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  .tabbar-item.active .tabbar-glow {
    opacity: 1;
    animation: lampGlow 2.2s ease-in-out infinite;
  }
  @keyframes lampGlow {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.4); }
  }

  /* ===== Page Container ===== */
  .page-container {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 56px;
    overflow: hidden;
  }
  .page-container.no-tabbar { bottom: 0; }
  .page {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    background: #F7F1E3;
    will-change: transform;
  }
  .page.page-enter {
    animation: pagePush 0.35s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
  .page.page-exit {
    animation: pagePop 0.35s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
  @keyframes pagePush {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }
  @keyframes pagePop {
    from { transform: translateX(0); }
    to { transform: translateX(100%); }
  }
  .page-behind {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    transform: translateX(-30%);
    opacity: 0.5;
    filter: brightness(0.85);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.35s ease,
                filter 0.35s ease;
  }

  /* Scrollbar hide */
  .page::-webkit-scrollbar { display: none; }
  .page { scrollbar-width: none; }

  /* ===== Home Page ===== */
  .home-hero {
    position: relative;
    height: 420px;
    overflow: hidden;
  }
  .home-hero-bg {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, #6B4A2E 0%, #8B5E34 40%, #D96C2C 70%, #E89B5A 100%);
  }
  .home-hero-img {
    position: absolute;
    inset: 0;
    object-fit: cover;
    width: 100%; height: 100%;
    opacity: 0.55;
    mix-blend-mode: overlay;
  }
  .home-hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(107,74,46,0.4) 0%, transparent 30%, rgba(247,241,227,0.9) 85%, #F7F1E3 100%);
  }
  .hero-content {
    position: absolute;
    top: 120px;
    left: 24px;
    right: 24px;
    color: #fff;
    z-index: 2;
  }
  .hero-brand {
    font-family: "Ma Shan Zheng", "Noto Serif SC", serif;
    font-size: 42px;
    letter-spacing: 8px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.3);
    opacity: 0;
    transform: translateY(20px);
    animation: heroFadeUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s forwards;
  }
  .hero-sub {
    margin-top: 8px;
    font-size: 13px;
    letter-spacing: 6px;
    opacity: 0;
    transform: translateY(15px);
    animation: heroFadeUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s forwards;
    font-family: "Noto Serif SC", serif;
    font-weight: 300;
    color: rgba(255,255,255,0.85);
  }
  @keyframes heroFadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Floating lanterns in hero */
  .hero-lanterns {
    position: absolute;
    top: 60px; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 1;
  }
  .hero-lantern {
    position: absolute;
    width: 60px; height: 80px;
    border-radius: 50% / 60%;
    animation: lanternFloat 6s ease-in-out infinite;
  }
  .hero-lantern.l1 {
    left: 20%; top: 20px;
    background: radial-gradient(ellipse at 50% 50%, rgba(255,180,80,0.7) 0%, rgba(217,108,44,0.4) 50%, transparent 70%);
    animation-delay: 0s;
  }
  .hero-lantern.l2 {
    right: 25%; top: 40px;
    width: 48px; height: 64px;
    background: radial-gradient(ellipse at 50% 50%, rgba(255,200,120,0.5) 0%, rgba(217,108,44,0.3) 50%, transparent 70%);
    animation-delay: -2s;
    animation-duration: 5s;
  }
  .hero-lantern.l3 {
    left: 60%; top: 10px;
    width: 36px; height: 48px;
    background: radial-gradient(ellipse at 50% 50%, rgba(255,220,150,0.4) 0%, rgba(217,108,44,0.25) 50%, transparent 70%);
    animation-delay: -4s;
    animation-duration: 7s;
  }
  @keyframes lanternFloat {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-12px) rotate(2deg); }
  }

  /* Breathing glow on hero */
  .hero-glow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 300px; height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,180,80,0.15) 0%, transparent 60%);
    animation: breathGlow 4s ease-in-out infinite;
    pointer-events: none;
    z-index: 1;
  }
  @keyframes breathGlow {
    0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
  }

  /* Home carousel */
  .home-carousel {
    position: relative;
    margin: -60px 16px 0;
    height: 180px;
    border-radius: 20px;
    overflow: hidden;
    z-index: 10;
    box-shadow: 0 12px 32px rgba(107, 74, 46, 0.25);
  }
  .carousel-track {
    display: flex;
    height: 100%;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .carousel-slide {
    min-width: 100%;
    height: 100%;
    position: relative;
    flex-shrink: 0;
  }
  .carousel-slide img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .carousel-slide .slide-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(107,74,46,0.5) 0%, rgba(217,108,44,0.2) 100%);
  }
  .carousel-slide .slide-caption {
    position: absolute;
    bottom: 16px; left: 20px;
    color: #fff;
  }
  .carousel-slide .slide-tag {
    display: inline-block;
    padding: 2px 10px;
    background: rgba(217, 108, 44, 0.9);
    border-radius: 10px;
    font-size: 11px;
    margin-bottom: 6px;
  }
  .carousel-slide .slide-title {
    font-size: 18px;
    font-weight: 600;
    font-family: "Noto Serif SC", serif;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .carousel-dots {
    position: absolute;
    bottom: 10px; right: 16px;
    display: flex; gap: 5px;
  }
  .carousel-dot {
    width: 6px; height: 6px;
    border-radius: 3px;
    background: rgba(255,255,255,0.5);
    transition: width 0.3s ease, background 0.3s ease;
  }
  .carousel-dot.active {
    width: 18px;
    background: #fff;
  }

  /* Home sections */
  .home-section {
    padding: 24px 16px 0;
  }
  .section-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 16px;
  }
  .section-title {
    font-family: "Noto Serif SC", serif;
    font-size: 20px;
    font-weight: 600;
    color: #3d2c1e;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title .accent-dot {
    width: 4px; height: 18px;
    background: linear-gradient(180deg, #D96C2C, #E89B5A);
    border-radius: 2px;
  }
  .section-more {
    font-size: 13px;
    color: #9a8a78;
    display: flex; align-items: center; gap: 2px;
  }

  /* Category chips */
  .cat-chips {
    display: flex; gap: 10px;
    padding: 0 16px;
    overflow-x: auto;
    scrollbar-width: none;
    margin-bottom: 8px;
  }
  .cat-chips::-webkit-scrollbar { display: none; }
  .cat-chip {
    flex-shrink: 0;
    padding: 8px 16px;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(107, 74, 46, 0.12);
    border-radius: 20px;
    font-size: 13px;
    color: #6B4A2E;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .cat-chip.active {
    background: #4A7C59;
    color: #fff;
    border-color: #4A7C59;
  }

  /* Product card grid */
  .product-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 16px 24px;
  }
  .product-card {
    background: #fffdf8;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(107, 74, 46, 0.08);
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
    position: relative;
  }
  .product-card:active {
    transform: scale(0.96);
  }
  .product-card-img {
    width: 100%;
    aspect-ratio: 1;
    overflow: hidden;
    position: relative;
  }
  .product-card-img img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform 0.5s ease;
  }
  .product-card:active .product-card-img img {
    transform: scale(1.05);
  }
  .product-card-badge {
    position: absolute;
    top: 8px; left: 8px;
    padding: 2px 8px;
    background: rgba(217, 108, 44, 0.9);
    color: #fff;
    font-size: 10px;
    border-radius: 8px;
  }
  .product-card-body {
    padding: 10px 12px 12px;
  }
  .product-card-name {
    font-size: 14px;
    font-weight: 500;
    color: #3d2c1e;
    line-height: 1.4;
    margin-bottom: 6px;
    font-family: "Noto Serif SC", serif;
  }
  .product-card-desc {
    font-size: 11px;
    color: #9a8a78;
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .product-card-footer {
    display: flex; align-items: center; justify-content: space-between;
  }
  .product-price {
    color: #D96C2C;
    font-weight: 600;
    font-size: 16px;
    display: flex; align-items: baseline;
  }
  .product-price .yuan {
    font-size: 11px;
    font-weight: 500;
    margin-right: 1px;
  }
  .product-fav {
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    color: #c8b8a5;
    cursor: pointer;
    transition: color 0.2s, transform 0.2s;
  }
  .product-fav.active { color: #D96C2C; }
  .product-fav:active { transform: scale(1.3); }

  /* Workshop banner */
  .workshop-banner {
    margin: 0 16px 24px;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    height: 140px;
    cursor: pointer;
  }
  .workshop-banner img {
    width: 100%; height: 100%; object-fit: cover;
    filter: brightness(0.85);
  }
  .workshop-banner .banner-content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 24px;
    color: #fff;
    background: linear-gradient(90deg, rgba(107,74,46,0.6) 0%, transparent 70%);
  }
  .banner-tag {
    font-size: 11px;
    letter-spacing: 2px;
    color: #F0C898;
    margin-bottom: 4px;
    font-family: "Noto Serif SC", serif;
  }
  .banner-title {
    font-size: 22px;
    font-weight: 600;
    font-family: "Noto Serif SC", serif;
    margin-bottom: 4px;
  }
  .banner-sub {
    font-size: 12px;
    opacity: 0.85;
  }

  /* ===== Category Page ===== */
  .cat-header {
    padding: 100px 16px 16px;
    background: linear-gradient(180deg, #4A7C59 0%, #5d9470 50%, #F7F1E3 100%);
    color: #fff;
  }
  .cat-page-title {
    font-family: "Ma Shan Zheng", "Noto Serif SC", serif;
    font-size: 32px;
    letter-spacing: 4px;
    margin-bottom: 4px;
  }
  .cat-page-sub {
    font-size: 12px;
    opacity: 0.85;
    letter-spacing: 2px;
  }
  .cat-sticky-tabs {
    position: sticky;
    top: 88px;
    z-index: 50;
    background: rgba(247,241,227,0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 0.5px solid rgba(107, 74, 46, 0.1);
  }
  .cat-tabs-scroll {
    display: flex;
    padding: 0 12px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .cat-tabs-scroll::-webkit-scrollbar { display: none; }
  .cat-tab {
    flex-shrink: 0;
    padding: 14px 16px;
    font-size: 14px;
    color: #9a8a78;
    cursor: pointer;
    position: relative;
    transition: color 0.2s;
    font-weight: 500;
  }
  .cat-tab.active {
    color: #4A7C59;
    font-weight: 600;
  }
  .cat-tab-indicator {
    position: absolute;
    bottom: 4px; left: 50%;
    transform: translateX(-50%);
    width: 20px; height: 3px;
    background: linear-gradient(90deg, #4A7C59, #5d9470);
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .cat-tab.active .cat-tab-indicator { width: 24px; }

  /* Waterfall grid for category */
  .waterfall-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 16px 12px 100px;
    align-items: start;
  }
  .waterfall-card {
    background: #fffdf8;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(107, 74, 46, 0.06);
    cursor: pointer;
    break-inside: avoid;
    margin-bottom: 10px;
    transition: transform 0.3s ease;
  }
  .waterfall-card:active { transform: scale(0.97); }
  .waterfall-card .wc-img {
    width: 100%;
    overflow: hidden;
  }
  .waterfall-card .wc-img img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .waterfall-card .wc-body {
    padding: 10px 12px;
  }
  .waterfall-card .wc-name {
    font-size: 13px;
    font-weight: 500;
    color: #3d2c1e;
    font-family: "Noto Serif SC", serif;
    margin-bottom: 4px;
  }
  .waterfall-card .wc-price {
    font-size: 14px;
    color: #D96C2C;
    font-weight: 600;
  }

  /* Pull to refresh */
  .ptr-indicator {
    position: absolute;
    top: 88px;
    left: 50%;

    return () => mq.removeEventListener('change', handler);

/* ===== Page Router ===== */
function PageContent({ page, pushPage, popPage, switchTab, setSheet, reducedMotion }) {
  const { showToast } = useContext(ToastContext);

  switch (page.name) {
    case 'home':
      return <HomePage pushPage={pushPage} showToast={showToast} reducedMotion={reducedMotion} />;
    case 'category':
      return <CategoryPage pushPage={pushPage} showToast={showToast} reducedMotion={reducedMotion} />;
    case 'detail':
      return <DetailPage lanternId={page.params.id} popPage={popPage} pushPage={pushPage} setSheet={setSheet} showToast={showToast} reducedMotion={reducedMotion} />;
    case 'workshop':
      return <WorkshopPage showToast={showToast} reducedMotion={reducedMotion} />;
    case 'orders':
      return <OrdersPage pushPage={pushPage} setSheet={setSheet} showToast={showToast} reducedMotion={reducedMotion} />;

      return <ProfilePage pushPage={pushPage} switchTab={switchTab} showToast={showToast} reducedMotion={reducedMotion} />;

      return <DesignSystemPage popPage={popPage} />;
    case 'api':

/* ===== Category Page ===== */
function CategoryPage({ pushPage, showToast, reducedMotion }) {
  const [activeTab, setActiveTab] = useState('全部');
  const pageRef = useRef(null);
  const scrollRef = useRef(null);
  const [ptr, setPtr] = useState({ pulling: false, distance: 0, refreshing: false });
  const touchStartY = useRef(0);
  const rafRef = useRef(null);

  const scrollEl = scrollRef.current;

  const handleTouchStart = (e) => {
    if (scrollEl && scrollEl.scrollTop <= 0) {
      touchStartY.current = e.touches[0].clientY;
    } else {
      touchStartY.current = -1;
    }
  };

  const handleTouchMove = (e) => {
    if (touchStartY.current < 0 || ptr.refreshing) return;
    const dy = e.touches[0].clientY - touchStartY.current;
    if (dy > 0 && scrollEl && scrollEl.scrollTop <= 0) {
      const distance = Math.min(dy * 0.5, 80);
      setPtr({ pulling: true, distance, refreshing: false });
      // Use transform directly for smoothness
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      rafRef.current = requestAnimationFrame(() => {
        if (scrollEl) {
          scrollEl.style.transform = `translateY(${distance}px)`;
        }
      });
    }
  };

  const handleTouchEnd = () => {
    if (ptr.refreshing) return;
    if (ptr.distance > 50) {
      // trigger refresh
      setPtr({ pulling: true, distance: 50, refreshing: true });
      showToast('灯笼灯谱更新中…');
      setTimeout(() => {
        setPtr({ pulling: false, distance: 0, refreshing: false });
        if (scrollEl) {
          scrollEl.style.transform = '';
          scrollEl.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
          setTimeout(() => {
            if (scrollEl) scrollEl.style.transition = '';
          }, 400);
        }
      }, 1500);
    } else {
      setPtr({ pulling: false, distance: 0, refreshing: false });
      if (scrollEl) {
        scrollEl.style.transition = 'transform 0.3s ease';
        scrollEl.style.transform = '';
        setTimeout(() => {
          if (scrollEl) scrollEl.style.transition = '';
        }, 300);
      }
    }
    touchStartY.current = -1;
  };

  useEffect(() => {
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, []);

  // Build staggered waterfall
  const leftCol = LANTERNS.filter((_, i) => i % 2 === 0);
  const rightCol = LANTERNS.filter((_, i) => i % 2 === 1);
  const extraLanterns = [
    { id: 101, name: '荷花灯·粉', price: 158, img: 3, h: 140 },
    { id: 102, name: '走马灯·山水', price: 488, img: 0, h: 180 },
    { id: 103, name: '孔明灯·素', price: 68, img: 1, h: 120 },
    { id: 104, name: '南瓜灯·秋', price: 228, img: 2, h: 160 },
  ];
  const allLeft = [...leftCol, ...extraLanterns.filter((_, i) => i % 2 === 0)];
  const allRight = [...rightCol, ...extraLanterns.filter((_, i) => i % 2 === 1)];

  const filteredLanterns = activeTab === '全部'
    ? LANTERNS
    : LANTERNS.filter(l => l.category === activeTab || activeTab.length > 3);

  return (
    <div
      className="page-inner"
      ref={pageRef}
      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}
      onTouchEnd={handleTouchEnd}
    >
      {/* PTR indicator */}
      <div className={`ptr-indicator ${ptr.pulling ? 'show' : ''}`} style={{ top: 92 + ptr.distance - 30 }}>
        <div className={`ptr-icon ${ptr.refreshing ? 'refreshing' : ''}`}>
          {IconLantern()}
        </div>
        <span>{ptr.refreshing ? '更新中…' : ptr.distance > 50 ? '松手更新灯谱' : '下拉提灯刷新'}</span>
      </div>

      {/* Header */}
      <div className="cat-header">
        <div className="cat-page-title">灯谱</div>
        <div className="cat-page-sub">百盏灯笼 · 各有风华</div>
      </div>

      {/* Sticky tabs */}
      <div className="cat-sticky-tabs">
        <div className="cat-tabs-scroll">
          {CATEGORIES.map(c => (
            <div
              key={c}
              className={`cat-tab ${activeTab === c ? 'active' : ''}`}
              onClick={() => setActiveTab(c)}
            >
              {c}
              {activeTab === c && <div className="cat-tab-indicator"></div>}
            </div>
          ))}
        </div>
      </div>

      {/* Waterfall grid */}
      <div style={{ display: 'flex', gap: 10, padding: '16px 12px 100px' }} ref={scrollRef}>
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 10 }}>
          {allLeft.map(l => (
            <div key={l.id} className="waterfall-card" onClick={() => pushPage('detail', { id: (l.id % 4) + 1 })}>
              <div className="wc-img" style={{ height: l.h || 160 }}>
                <img src={IMAGES[l.img]} alt={l.name} style={{ height: '100%' }} />
              </div>
              <div className="wc-body">
                <div className="wc-name">{l.name}</div>
                <div className="wc-price">¥{l.price}</div>
              </div>
            </div>
          ))}
        </div>
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 10 }}>
          {allRight.map(l => (
            <div key={l.id} className="waterfall-card" onClick={() => pushPage('detail', { id: (l.id % 4) + 1 })}>
              <div className="wc-img" style={{ height: l.h || 180 }}>
                <img src={IMAGES[l.img]} alt={l.name} style={{ height: '100%' }} />
              </div>
              <div className="wc-body">
                <div className="wc-name">{l.name}</div>
                <div className="wc-price">¥{l.price}</div>
              </div>
            </div>
          ))}

  );

/* ===== Orders Page ===== */
function OrdersPage({ pushPage, setSheet, showToast, reducedMotion }) {
  const [tab, setTab] = useState('all');
  const [swipedId, setSwipedId] = useState(null);
  const touchStartX = useRef(null);
  const moveStartX = useRef(null);
  const [swipeOffsets, setSwipeOffsets] = useState({});
  const rafRef = useRef(null);

  const handleTouchStart = (id, e) => {
    touchStartX.current = e.touches[0].clientX;
    moveStartX.current = swipeOffsets[id] || 0;
  };

  const handleTouchMove = (id, e) => {
    if (touchStartX.current === null) return;
    const dx = e.touches[0].clientX - touchStartX.current;
    let offset = moveStartX.current + dx;
    // clamp: 0 to -144 (2 buttons * 72px)
    offset = Math.max(-144, Math.min(0, offset));

    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    rafRef.current = requestAnimationFrame(() => {
      setSwipeOffsets(prev => ({ ...prev, [id]: offset }));
    });
  };

  const handleTouchEnd = (id) => {
    if (touchStartX.current === null) return;
    const offset = swipeOffsets[id] || 0;
    // snap logic
    if (offset < -72) {
      setSwipeOffsets(prev => ({ ...prev, [id]: -144 }));
      setSwipedId(id);
    } else {
      setSwipeOffsets(prev => ({ ...prev, [id]: 0 }));
      if (swipedId === id) setSwipedId(null);
    }
    touchStartX.current = null;
    moveStartX.current = null;
  };

  // Close other swiped items when tapping elsewhere
  const handleItemClick = (id, lanternId) => {
    if (swipedId === id && (swipeOffsets[id] || 0) < -72) {
      // close swipe
      setSwipeOffsets(prev => ({ ...prev, [id]: 0 }));
      setSwipedId(null);
    } else {
      pushPage('detail', { id: lanternId });
    }
  };

  const deleteOrder = (id) => {
    setSwipeOffsets(prev => ({ ...prev, [id]: 0 }));
    setSwipedId(null);
    showToast('订单已删除');
  };

  useEffect(() => {
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, []);

  const filteredOrders = tab === 'all' ? ORDERS : ORDERS.filter(o => o.status === tab);

  return (
    <div className="page-inner">
      <div className="orders-header">
        <div className="orders-title">我的订单</div>
        <div className="order-tabs">
          {[
            { key: 'all', label: '全部' },
            { key: 'pending', label: '待付款' },
            { key: 'shipped', label: '待收货' },
            { key: 'done', label: '已完成' },
          ].map(t => (
            <div
              key={t.key}
              className={`order-tab ${tab === t.key ? 'active' : ''}`}
              onClick={() => setTab(t.key)}
            >{t.label}</div>
          ))}
        </div>
      </div>

      <div className="order-hint">← 左滑可操作订单</div>

      <div className="order-list">
        {filteredOrders.map(order => {
          const lantern = LANTERNS.find(l => l.id === order.lanternId) || LANTERNS[0];
          const offset = swipeOffsets[order.id] || 0;
          return (
            <div key={order.id} className="order-item-wrapper">
              <div className="order-swipe-bg">
                <div className="swipe-btn edit" onClick={() => setSheet('order')}>查看</div>
                <div className="swipe-btn delete" onClick={() => deleteOrder(order.id)}>删除</div>
              </div>
              <div
                className="order-item"
                style={{ transform: `translateX(${offset}px)` }}
                onTouchStart={(e) => handleTouchStart(order.id, e)}
                onTouchMove={(e) => handleTouchMove(order.id, e)}
                onTouchEnd={() => handleTouchEnd(order.id)}
                onClick={() => handleItemClick(order.id, order.lanternId)}
              >
                <div className="order-item-img">
                  <img src={IMAGES[lantern.img]} alt="" />
                </div>
                <div className="order-item-info">
                  <div>
                    <div className="order-item-name">{lantern.name}</div>
                    <div className="order-item-spec">{order.spec}</div>
                  </div>
                  <div className="order-item-bottom">
                    <div className="order-item-price">¥{order.price}</div>
                    <div className={`order-item-status ${order.status}`}>{order.statusText}</div>
                  </div>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {filteredOrders.length === 0 && (
        <div style={{ textAlign: 'center', padding: 60, color: '#c8b8a5' }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>🏮</div>
          <div style={{ fontSize: 13 }}>暂无相关订单</div>
        </div>
      )}
    </div>
  );
}

/* ===== Profile Page ===== */
function ProfilePage({ pushPage, switchTab, showToast, reducedMotion }) {
  const [ringProgress, setRingProgress] = useState(0);
  const pageRef = useRef(null);
  const hasAnimated = useRef(false);

  useEffect(() => {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !hasAnimated.current) {
          hasAnimated.current = true;
          // Animate ring progress
          let start = 0;
          const target = 68;
          const duration = 1500;
          const startTime = Date.now();
          const animate = () => {
            const elapsed = Date.now() - startTime;
            const t = Math.min(elapsed / duration, 1);
            // easeOutCubic
            const eased = 1 - Math.pow(1 - t, 3);
            setRingProgress(start + (target - start) * eased);
            if (t < 1) requestAnimationFrame(animate);
          };
          if (reducedMotion) {
            setRingProgress(target);
          } else {
            requestAnimationFrame(animate);
          }
        }
      });
    }, { threshold: 0.3 });

    const el = pageRef.current;
    if (el) observer.observe(el);
    return () => observer.disconnect();
  }, [reducedMotion]);

  // Pause when not visible
  useEffect(() => {
    const handler = () => {
      if (document.hidden) {
        // nothing heavy here to pause
      }
    };
    document.addEventListener('visibilitychange', handler);
    return () => document.removeEventListener('visibilitychange', handler);
  }, []);

  const circumference = 2 * Math.PI * 32; // r=32
  const dashOffset = circumference - (ringProgress / 100) * circumference;

  const menuGridItems = [
    { icon: '🏮', label: '心愿单', color: 'rgba(217,108,44,0.12)', iconColor: '#D96C2C' },

        {/* Ring progress */}

/* ===== Utility functions ===== */
function adjustBrightness(hex, amount) {
  const num = parseInt(hex.replace('#', ''), 16);
  let r = (num >> 16) + amount;
  let g = ((num >> 8) & 0x00FF) + amount;
  let b = (num & 0x0000FF) + amount;
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

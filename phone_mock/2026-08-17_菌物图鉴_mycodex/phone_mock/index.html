    cursor: none;

    display: flex;

  .stage-title {

  .stage-title .main {

  .page-nav-dot {

  .page-nav-dot.active {

  }
  .page-nav-dot:hover {

  }
  .page-nav-label {

  }

    90% { opacity: 0.6; }
    100% { transform: translateY(-20vh) translateX(40px) scale(1); opacity: 0; }
  }

  .custom-cursor {
    position: fixed;
    top: 50%; left: 50%;
    width: 24px; height: 24px;
    border: 2px solid #fff;
    border-radius: 50%;
    pointer-events: none;
    z-index: 99999;
    transform: translate(-50%, -50%);
    transition: width 0.2s ease, height 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    mix-blend-mode: difference;
    box-shadow:
      0 0 12px rgba(221,139,62,0.6),
      0 0 24px rgba(221,139,62,0.3);
  }
  .custom-cursor::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 6px; height: 6px;
    background: #DD8B3E;
    border-radius: 50%;
    transition: width 0.2s, height 0.2s, background 0.2s;
  }

    width: 40px; height: 40px;
    border-color: #DD8B3E;
    mix-blend-mode: normal;

  .custom-cursor.hover::before {
    width: 4px; height: 4px;
    background: #DD8B3E;
  }

    animation: cursor-ripple 0.4s ease-out;

    background: #F5EFE3;
    position: relative;
    overflow: hidden;
  }

    top: 54px; right: 12px;
    width: 87px; height: 32px;
    border-radius: 16px;
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 0.5px solid rgba(0,0,0,0.04);
    display: flex;
    align-items: center;
    justify-content: space-around;
    z-index: 100;
    transition: background 0.3s;
  }

    background: rgba(36,28,20,0.6);
  }
  .mp-capsule .capsule-divider {
    width: 1px; height: 16px;
    background: rgba(74,56,42,0.15);
  }
  .mp-capsule.dark .capsule-divider {

    color: #4A382A;
  }
  .mp-capsule.dark .capsule-icon {
    color: #F5EFE3;
  }

  .page-stack {
    position: absolute;
    inset: 0;
  }
  .page-enter {
    animation: page-push 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .page-exit {
    animation: page-pop 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;

  @keyframes page-push {

  }
  @keyframes page-pop {
    0% { transform: translateX(0); opacity: 1; }

    content: '';

    top: 6px;

    background: #DD8B3E;
    border-radius: 50%;

    0% { transform: scale(0) translateY(10px); opacity: 0; }

  .scroll-area {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .pull-refresh {

    top: -60px; left: 0; right: 0;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 12px;

    border-radius: 50%;

    to { transform: rotate(360deg); }

  .serif { font-family: 'Noto Serif SC', serif; }
  .cormorant { font-family: 'Cormorant Garamond', serif; }

  .truffle { color: #4A382A; }
  .moss { color: #6B7F59; }
  .spore-orange { color: #DD8B3E; }
  .paper { background: #F5EFE3; }

  .action-sheet-mask {
    position: absolute;
    inset: 0;
    background: rgba(36,28,20,0.4);
    z-index: 200;
    animation: fade-in 0.3s ease;
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .action-sheet {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: #F5EFE3;
    border-radius: 20px 20px 0 0;
    z-index: 201;
    animation: sheet-up 0.4s cubic-bezier(0.16, 1, 0.3, 1);

    overflow-y: auto;
  }
  @keyframes sheet-up {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .action-sheet-handle {
    width: 36px; height: 4px;
    background: rgba(74,56,42,0.15);
    border-radius: 2px;
    margin: 8px auto 0;
  }

  /* Skeleton shimmer */
  .skeleton {
    background: linear-gradient(90deg, rgba(74,56,42,0.04) 25%, rgba(74,56,42,0.08) 50%, rgba(74,56,42,0.04) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 8px;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .custom-cursor { display: none; }
    body { cursor: auto; }
  }

  /* Stamp badge */
  .stamp-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border: 1.5px solid currentColor;
    border-radius: 2px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1px;
    transform: rotate(-1deg);
    opacity: 0.9;
  }

  /* Entrance animations */
  .fade-up {
    opacity: 0;
    transform: translateY(20px);
    animation: fade-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @keyframes fade-up {
    to { opacity: 1; transform: translateY(0); }
  }
  .scale-in {
    opacity: 0;
    transform: scale(0.9);
    animation: scale-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @keyframes scale-in {
    to { opacity: 1; transform: scale(1); }
  }
  .slide-in-right {
    opacity: 0;
    transform: translateX(30px);
    animation: slide-in-right 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @keyframes slide-in-right {
    to { opacity: 1; transform: translateX(0); }
  }
</style>

// ───── Page 1: Home (首页) — Card stream + carousel + entrance animation ─────
function HomePage({ onMushroomClick }) {
  const [scrollY, setScrollY] = useState(0);
  const [carouselIdx, setCarouselIdx] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const scrollRef = useRef(null);
  const touchStartY = useRef(0);
  const pullDistance = useRef(0);
  const rafRef = useRef(null);
  const carouselTimer = useRef(null);

  // Carousel auto-play
  useEffect(() => {
    if (prefersReducedMotion) return;
    carouselTimer.current = setInterval(() => {
      setCarouselIdx(i => (i + 1) % 3);
    }, 4000);
    return () => clearInterval(carouselTimer.current);
  }, []);

  // Visibility change pause
  useEffect(() => {
    const onVis = () => {
      if (document.hidden) {
        if (carouselTimer.current) clearInterval(carouselTimer.current);
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      }
    };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, []);

  // Parallax via direct DOM
  const handleScroll = useCallback((e) => {
    const y = e.target.scrollTop;
    setScrollY(y);
  }, []);

  // Pull to refresh (touch simulation)
  const handleTouchStart = (e) => {
    if (scrollRef.current?.scrollTop === 0) {
      touchStartY.current = e.touches[0].clientY;
    }
  };
  const handleTouchMove = (e) => {
    if (!scrollRef.current) return;
    if (scrollRef.current.scrollTop === 0 && e.touches[0].clientY > touchStartY.current) {
      pullDistance.current = Math.min((e.touches[0].clientY - touchStartY.current) * 0.5, 80);
      scrollRef.current.style.transform = `translateY(${pullDistance.current}px)`;
    }
  };
  const handleTouchEnd = () => {
    if (!scrollRef.current) return;
    if (pullDistance.current > 50) {
      setRefreshing(true);
      scrollRef.current.style.transform = 'translateY(60px)';
      setTimeout(() => {
        setRefreshing(false);
        if (scrollRef.current) scrollRef.current.style.transform = 'translateY(0)';
        pullDistance.current = 0;
      }, 1500);
    } else {
      scrollRef.current.style.transform = 'translateY(0)';
      pullDistance.current = 0;
    }
    touchStartY.current = 0;
  };

  const heroOpacity = Math.max(0, 1 - scrollY / 200);
  const heroScale = 1 + scrollY / 1000;

  const featured = MUSHROOMS.slice(0, 3);

  return (
    <div className="scroll-area"
      ref={scrollRef}
      onScroll={handleScroll}
      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}
      onTouchEnd={handleTouchEnd}
      style={{ transition: refreshing ? 'none' : 'transform 0.4s cubic-bezier(0.16, 1, 0.3, 1)' }}
    >
      {refreshing && (
        <div className="pull-refresh">
          <div className="pull-refresh-icon"></div>
          <span style={{ fontSize: 11 }}>正在刷新菌讯…</span>
        </div>
      )}

      {/* Hero Header with parallax */}

          backgroundPosition: 'center',
          transform: `scale(${heroScale}) translateY(${scrollY * 0.3}px)`,

        }} />
        <div style={{
          position: 'absolute', inset: 0,

    { id: 4, mushroom: MUSHROOMS[1], date: '2025.09.05', location: '香格里拉 · 纳帕海', note: '桦树林下，颜色鲜艳，拍照记录', offset: 0 },
    { id: 5, mushroom: MUSHROOMS[6], date: '2025.08.28', location: '昆明 · 西山森林公园', note: '松林下常见种，菌盖有绿色龟裂', offset: 0 },
  ]);

  const [activeSwipe, setActiveSwipe] = useState(null);
  const touchStartX = useRef(0);
  const touchStartY = useRef(0);

  const handleTouchStart = (e, id) => {
    touchStartX.current = e.touches[0].clientX;
    touchStartY.current = e.touches[0].clientY;
    setActiveSwipe(id);
  };

  const handleTouchMove = (e, id) => {
    if (activeSwipe !== id) return;
    const diff = touchStartX.current - e.touches[0].clientX;
    const yDiff = Math.abs(touchStartY.current - e.touches[0].clientY);
    if (yDiff > Math.abs(diff)) return; // vertical scroll
    if (diff > 0) {
      const newOffset = Math.min(diff, 140);
      setRecords(prev => prev.map(r =>
        r.id === id ? { ...r, offset: newOffset } : r
      ));
    }
  };

  const handleTouchEnd = (id) => {
    setRecords(prev => prev.map(r => {
      if (r.id !== id) return r;
      if (r.offset > 70) return { ...r, offset: 140 };
      return { ...r, offset: 0 };
    }));
    setActiveSwipe(null);
  };

  const deleteRecord = (id) => {
    setRecords(prev => prev.filter(r => r.id !== id));
  };

  // Stats
  const foundCount = MUSHROOMS.filter(m => m.found).length;
  const totalCount = MUSHROOMS.length;

  return (
    <div className="scroll-area" style={{ background: '#F5EFE3' }}>

      <div style={{

          <h1 className="serif" style={{ fontSize: 26, fontWeight: 700, letterSpacing: 2 }}>
            采集日记
          </h1>
          <div
            onClick={onPublish}
            style={{
              width: 36, height: 36, borderRadius: 18,
              background: 'rgba(245,239,227,0.15)',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              cursor: 'pointer',
              backdropFilter: 'blur(10px)',
            }}
          >
            <Icon.Plus />
          </div>
        </div>

        {/* Stats row */}
        <div className="fade-up" style={{
          animationDelay: '0.2s',
          display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 12,
        }}>
          <div style={{ textAlign: 'center' }}>
            <div className="serif" style={{ fontSize: 28, fontWeight: 700, color: '#DD8B3E' }}>23</div>
            <div style={{ fontSize: 10, opacity: 0.6, letterSpacing: 1 }}>总采集</div>
          </div>
          <div style={{ textAlign: 'center' }}>
            <div className="serif" style={{ fontSize: 28, fontWeight: 700 }}>{foundCount}</div>
            <div style={{ fontSize: 10, opacity: 0.6, letterSpacing: 1 }}>图鉴种类</div>
          </div>
          <div style={{ textAlign: 'center' }}>
            <div className="serif" style={{ fontSize: 28, fontWeight: 700 }}>5</div>
            <div style={{ fontSize: 10, opacity: 0.6, letterSpacing: 1 }}>本月</div>
          </div>
        </div>
      </div>

      {/* Decorative transition */}
      <div style={{
        height: 20,

        marginTop: -1,
        position: 'relative',
      }}>
        <svg viewBox="0 0 400 20" style={{

// ───── Main App ─────
function App() {
  const [activeTab, setActiveTab] = useState('home');
  const [pageStack, setPageStack] = useState([{ id: 'home', type: 'tab' }]);
  const [navDirection, setNavDirection] = useState('push');
  const [showDesign, setShowDesign] = useState(false);
  const [showApi, setShowApi] = useState(false);

  const currentPage = pageStack[pageStack.length - 1];

  // Animation loop management
  const rafRefs = useRef([]);
  const timerRefs = useRef([]);

  // Visibility change handler
  useEffect(() => {
    const handleVisibility = () => {
      if (document.hidden) {
        rafRefs.current.forEach(id => cancelAnimationFrame(id));
        timerRefs.current.forEach(id => clearTimeout(id));
        rafRefs.current = [];
        timerRefs.current = [];
      }
    };
    document.addEventListener('visibilitychange', handleVisibility);
    return () => {
      document.removeEventListener('visibilitychange', handleVisibility);
      rafRefs.current.forEach(id => cancelAnimationFrame(id));
      timerRefs.current.forEach(id => clearTimeout(id));
    };
  }, []);

  const pushPage = (page) => {
    setNavDirection('push');
    setPageStack(prev => [...prev, page]);
  };

  const popPage = () => {
    if (pageStack.length <= 1) return;
    setNavDirection('pop');
    setTimeout(() => {
      setPageStack(prev => prev.slice(0, -1));
    }, 10);
  };

  const handleTabChange = (tabId) => {
    if (activeTab === tabId) return;
    setActiveTab(tabId);
    setNavDirection('tab');
    setPageStack([{ id: tabId, type: 'tab' }]);
    setShowDesign(false);
    setShowApi(false);
  };

  const handleMushroomClick = (id) => {
    const m = MUSHROOMS.find(x => x.id === id);
    if (m) pushPage({ id: 'detail', type: 'detail', mushroom: m });
  };

  const handlePublish = () => {
    pushPage({ id: 'publish', type: 'publish' });
  };

  // Determine which tab pages to show tab bar
  const tabPages = ['home', 'discover', 'journal', 'profile'];
  const showTabBar = currentPage.type === 'tab';
  const isDarkNav = currentPage.id === 'api';

  const renderPage = (page) => {
    switch (page.id) {
      case 'home':
        return <HomePage onMushroomClick={handleMushroomClick} />;
      case 'discover':
        return <DiscoverPage onMushroomClick={handleMushroomClick} />;
      case 'journal':
        return <JournalPage onPublish={handlePublish} />;
      case 'profile':
        return <ProfilePage />;
      case 'detail':
        return <DetailPage mushroom={page.mushroom} onBack={popPage} />;
      case 'publish':
        return <PublishPage onBack={popPage} onSuccess={popPage} />;
      case 'design':
        return <DesignSystemPage onBack={popPage} />;
      case 'api':
        return <ApiDocPage onBack={popPage} />;
      default:
        return null;
    }
  };

  // Quick nav for design & api pages (open as push pages)
  const openDesign = () => {
    setShowDesign(true);
    pushPage({ id: 'design', type: 'design' });
  };
  const openApi = () => {
    setShowApi(true);
    pushPage({ id: 'api', type: 'api' });
  };

  return (
    <div className="stage">
      {/* Ambient spore particles */}
      <div className="spore-field" id="sporeField"></div>

      <div className="stage-title">
        <div className="sub">MYCOLOGICAL DEX MINI PROGRAM</div>
        <div className="main">菌物图鉴 · 小程序</div>
      </div>

      {/* Side page nav */}
      <div className="page-nav">
        {[
          { id: 'home', label: '首页' },
          { id: 'discover', label: '发现' },
          { id: 'journal', label: '记录' },
          { id: 'profile', label: '我的' },
          { id: 'design', label: '设计规范' },
          { id: 'api', label: '接口文档' },
        ].map((p, i) => {
          const isActive = currentPage.id === p.id;
          const isTab = ['home', 'discover', 'journal', 'profile'].includes(p.id);
          return (
            <div
              key={p.id}
              className={`page-nav-dot ${isActive ? 'active' : ''}`}
              onClick={() => {
                if (isTab) {
                  handleTabChange(p.id);
                } else if (p.id === 'design') {
                  openDesign();
                } else if (p.id === 'api') {
                  openApi();
                }
              }}
            >
              <span className="page-nav-label">{i + 1}. {p.label}</span>
            </div>
          );
        })}
      </div>

      <div className="phone-shell">
        <IOSDevice width={390} height={844}>
          <div className="mp-container">
            {/* Capsule */}
            <MPCapsule dark={currentPage.id === 'api'} />

            {/* Page stack */}
            <div className="page-stack">
              {pageStack.map((page, i) => {
                const isCurrent = i === pageStack.length - 1;
                const isPrev = i === pageStack.length - 2;
                if (!isCurrent && !isPrev) return null;
                return (
                  <div
                    key={`${page.id}-${i}`}
                    style={{
                      position: 'absolute',
                      inset: 0,
                      transform: isPrev && navDirection === 'push'
                        ? 'translateX(-30%)'
                        : isPrev && navDirection === 'pop'
                        ? 'translateX(0)'
                        : 'translateX(0)',
                      opacity: isPrev ? 0.6 : 1,
                      transition: isCurrent ? 'none' : 'transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s',
                      zIndex: isCurrent ? 2 : 1,
                    }}
                  >
                    {renderPage(page)}
                  </div>
                );
              })}
            </div>

            {/* Tab bar */}
            {showTabBar && (
              <TabBar activeTab={activeTab} onChange={handleTabChange} />
            )}
          </div>
        </IOSDevice>
      </div>
    </div>
  );
}

// ───── Custom Cursor Logic ─────
function initCursor() {
  if (prefersReducedMotion) return;
  const cursor = document.getElementById('customCursor');
  if (!cursor) return;

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let cursorX = mouseX;
  let cursorY = mouseY;
  let rafId = null;
  let isHover = false;
  let visible = true;

  const animate = () => {
    cursorX += (mouseX - cursorX) * 0.15;
    cursorY += (mouseY - cursorY) * 0.15;
    cursor.style.left = cursorX + 'px';
    cursor.style.top = cursorY + 'px';
    rafId = requestAnimationFrame(animate);
  };

  const onMove = (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    if (!visible) {
      cursor.style.opacity = '1';
      visible = true;
    }
  };

  const onOver = (e) => {
    const target = e.target;
    if (target.closest && (
      target.closest('button') ||
      target.closest('.tab-item') ||
      target.closest('.page-nav-dot') ||
      target.closest('[style*="cursor: pointer"]') ||
      target.tagName === 'INPUT' ||
      target.tagName === 'TEXTAREA' ||
      target.closest('.stamp-badge')
    )) {
      cursor.classList.add('hover');
      isHover = true;
    } else if (isHover) {
      cursor.classList.remove('hover');
      isHover = false;
    }
  };

  const onClick = () => {
    cursor.classList.add('click');
    setTimeout(() => cursor.classList.remove('click'), 400);
  };

  const onVis = () => {
    if (document.hidden) {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
    } else if (!rafId) {
      animate();
    }
  };

  window.addEventListener('mousemove', onMove);
  document.addEventListener('mouseover', onOver);
  document.addEventListener('click', onClick);
  document.addEventListener('visibilitychange', onVis);

  animate();
}

// ───── Spore particles ─────
function initSpores() {
  if (prefersReducedMotion) return;
  const field = document.getElementById('sporeField');
  if (!field) return;

  for (let i = 0; i < 15; i++) {
    const spore = document.createElement('div');
    spore.className = 'spore';
    const size = 3 + Math.random() * 6;
    spore.style.width = size + 'px';
    spore.style.height = size + 'px';
    spore.style.left = Math.random() * 100 + '%';
    spore.style.animationDuration = (15 + Math.random() * 20) + 's';
    spore.style.animationDelay = (-Math.random() * 20) + 's';
    spore.style.opacity = 0.2 + Math.random() * 0.4;
    const colors = ['rgba(221,139,62,', 'rgba(107,127,89,', 'rgba(74,56,42,'];
    const c = colors[Math.floor(Math.random() * colors.length)];
    spore.style.background = c + (0.2 + Math.random() * 0.3) + ')';
    field.appendChild(spore);
  }
}

// ───── Announce Upgrade ─────
function announceUpgrade() {
  try {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  } catch (e) {}
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}

// ───── Render ─────
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// Initialize cursor and spores after render
if (document.readyState === 'complete') {
  setTimeout(() => { initCursor(); initSpores(); }, 100);
} else {
  window.addEventListener('load', () => {
    setTimeout(() => { initCursor(); initSpores(); }, 100);
  });
}
</script>

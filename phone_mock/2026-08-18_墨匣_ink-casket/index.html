<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>墨匣 · 文具与墨水爱好者社区</title>

<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<!-- 字体 -->
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Ma+Shan+Zheng&display=swap" />

<style>
/* ========== 全局重置 ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #1a1f1c;
  font-family: 'Noto Sans SC', sans-serif;
  -webkit-font-smoothing: antialiased;
  color: #f5f1e8;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(62, 96, 82, 0.25), transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(139, 69, 40, 0.15), transparent 50%),
    #0f1210;
}

/* ========== 自定义光标 ========== */
.custom-cursor {
  position: fixed;
  top: 50%; left: 50%;
  width: 32px; height: 32px;
  margin: -16px 0 0 -16px;
  border: 2px solid #f5f1e8;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  mix-blend-mode: difference;
  transition: width 0.25s cubic-bezier(.2,.8,.2,1), height 0.25s cubic-bezier(.2,.8,.2,1), margin 0.25s cubic-bezier(.2,.8,.2,1), border-color 0.25s, opacity 0.2s;
  will-change: transform;
}
.custom-cursor::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 6px; height: 6px;
  margin: -3px 0 0 -3px;
  background: #7fb89a;
  border-radius: 50%;
  box-shadow: 0 0 12px rgba(127, 184, 154, 0.8);
  transition: width 0.2s, height 0.2s, margin 0.2s;
}
.custom-cursor.hover {
  width: 56px; height: 56px;
  margin: -28px 0 0 -28px;
  border-color: #7fb89a;
}
.custom-cursor.hover::after {
  width: 10px; height: 10px;
  margin: -5px 0 0 -5px;
  background: #f5f1e8;
}
.custom-cursor.click {
  width: 20px; height: 20px;
  margin: -10px 0 0 -10px;
}
.cursor-ripple {
  position: fixed;
  width: 40px; height: 40px;
  margin: -20px 0 0 -20px;
  border: 2px solid #7fb89a;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  opacity: 0;
  animation: cursorRipple 0.6s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes cursorRipple {
  0% { opacity: 0.8; transform: scale(0.3); }
  100% { opacity: 0; transform: scale(2.5); }
}
@media (prefers-reduced-motion: reduce) {
  .custom-cursor, .cursor-ripple { display: none; }
  * { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
}

/* ========== 手机外壳 ========== */
.phone-wrapper {
  position: relative;
  width: 390px;
  height: 844px;
  background: #1c1f1d;
  border-radius: 54px;
  padding: 12px;
  box-shadow:
    0 40px 80px rgba(0, 0, 0, 0.5),
    0 10px 30px rgba(0, 0, 0, 0.4),
    inset 0 0 0 1px rgba(255, 255, 255, 0.06);
}
.phone-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 44px;
  overflow: hidden;
  background: #f5f1e8;
}
/* 灵动岛 */
.dynamic-island {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 36px;
  background: #000;
  border-radius: 20px;
  z-index: 200;
  transition: width 0.3s cubic-bezier(.2,.8,.2,1), height 0.3s cubic-bezier(.2,.8,.2,1);
}

/* 状态栏 */
.status-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 54px;
  padding: 18px 32px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 15px;
  font-weight: 600;
  color: #1a241e;
  z-index: 150;
  font-family: 'Noto Sans SC', sans-serif;
}
.status-bar.dark { color: #f5f1e8; }
.status-icons {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ========== 内容容器 ========== */
.app-content {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  overflow: hidden;
  background: #f5f1e8;
}

/* 页面通用容器 */
.page {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: #f5f1e8;
  overflow: hidden;
  will-change: transform, opacity;
}
.page-scroll {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.page-scroll::-webkit-scrollbar { display: none; }

/* 页面转场 */
.page-enter-right {
  animation: pageEnterRight 0.4s cubic-bezier(.2,.8,.2,1) forwards;
}
.page-enter-back {
  animation: pageEnterBack 0.4s cubic-bezier(.2,.8,.2,1) forwards;
}
.page-exit-right {
  animation: pageExitRight 0.4s cubic-bezier(.2,.8,.2,1) forwards;
}
.page-exit-back {
  animation: pageExitBack 0.4s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes pageEnterRight {
  from { transform: translateX(100%); }
  to { transform: translateX(0); }
}
@keyframes pageExitRight {
  from { transform: translateX(0); }
  to { transform: translateX(30%); opacity: 0.3; }
}
@keyframes pageEnterBack {
  from { transform: translateX(-30%); opacity: 0.3; }
  to { transform: translateX(0); opacity: 1; }
}
@keyframes pageExitBack {
  from { transform: translateX(0); }
  to { transform: translateX(100%); }
}

/* ========== 导航栏 ========== */
.nav-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 92px;
  padding: 44px 16px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 100;
  background: transparent;
  transition: background 0.3s;
}
.nav-bar.scrolled {
  background: rgba(245, 241, 232, 0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 0.5px solid rgba(26, 36, 30, 0.08);
}
.nav-bar.dark { color: #f5f1e8; }
.nav-bar.dark.scrolled {
  background: rgba(26, 36, 30, 0.92);
  border-bottom: 0.5px solid rgba(245, 241, 232, 0.08);
}
.nav-title {
  position: absolute;
  left: 50%;
  top: 50px;
  transform: translateX(-50%);
  font-size: 17px;
  font-weight: 600;
  opacity: 0;
  transition: opacity 0.3s;
}
.nav-bar.scrolled .nav-title { opacity: 1; }

.nav-back {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  background: rgba(26, 36, 30, 0.08);
  transition: transform 0.2s, background 0.2s;
}
.nav-back:active { transform: scale(0.9); }
.nav-bar.dark .nav-back { background: rgba(245, 241, 232, 0.15); }

/* 大标题 */
.large-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 34px;
  font-weight: 700;
  color: #1a241e;
  line-height: 1.2;
  letter-spacing: -0.5px;
}
.large-subtitle {
  font-size: 15px;
  color: #6a776f;
  margin-top: 4px;
  font-weight: 400;
}

/* ========== 底部 TabBar ========== */
.tab-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 84px;
  padding: 8px 0 28px;
  display: flex;
  align-items: center;
  justify-content: space-around;
  background: rgba(245, 241, 232, 0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 0.5px solid rgba(26, 36, 30, 0.08);
  z-index: 90;
}
.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  padding: 4px 16px;
  position: relative;
  transition: transform 0.2s;
}
.tab-item:active { transform: scale(0.92); }
.tab-item svg {
  width: 24px; height: 24px;
  stroke: #9aa5a0;
  stroke-width: 1.8;
  fill: none;
  transition: stroke 0.2s;
}
.tab-item.active svg {
  stroke: #2d4a3e;
}
.tab-label {
  font-size: 10px;
  color: #9aa5a0;
  font-weight: 500;
  transition: color 0.2s;
}
.tab-item.active .tab-label { color: #2d4a3e; }

/* FAB 中心按钮 */
.tab-fab {
  position: relative;
  width: 52px; height: 52px;
  margin-top: -24px;
  border-radius: 50%;
  background: linear-gradient(135deg, #2d4a3e 0%, #3e6052 100%);
  box-shadow: 0 6px 20px rgba(45, 74, 62, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.2s cubic-bezier(.2,.8,.2,1), box-shadow 0.2s;
}
.tab-fab:hover {
  transform: translateY(-2px) scale(1.05);
  box-shadow: 0 10px 28px rgba(45, 74, 62, 0.5);
}
.tab-fab:active { transform: scale(0.9); }
.tab-fab svg {
  stroke: #f5f1e8;
  stroke-width: 2.2;
  fill: none;
  width: 24px; height: 24px;
}

/* ========== 首页 ========== */
.home-header {
  padding: 92px 20px 16px;
  background: linear-gradient(180deg, #f5f1e8 0%, #ebe5d8 100%);
  position: relative;
  overflow: hidden;
}
.home-header::after {
  content: '墨';
  position: absolute;
  top: 40px;
  right: -20px;
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 200px;
  color: rgba(45, 74, 62, 0.04);
  line-height: 1;
  pointer-events: none;
}

/* 搜索栏 */
.search-bar {
  margin-top: 16px;
  height: 40px;
  background: rgba(255, 255, 255, 0.7);
  border-radius: 12px;
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 8px;
  border: 1px solid rgba(26, 36, 30, 0.06);
  cursor: pointer;
  transition: background 0.2s;
}
.search-bar:hover { background: rgba(255, 255, 255, 0.95); }
.search-bar svg {
  width: 16px; height: 16px;
  stroke: #6a776f;
  stroke-width: 2;
  fill: none;
}
.search-bar span {
  font-size: 14px;
  color: #9aa5a0;
}

/* 横向分类滚动 */
.category-scroll {
  display: flex;
  gap: 8px;
  padding: 16px 20px 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.category-scroll::-webkit-scrollbar { display: none; }
.category-chip {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 18px;
  font-size: 13px;
  font-weight: 500;
  background: rgba(255, 255, 255, 0.6);
  color: #6a776f;
  border: 1px solid rgba(26, 36, 30, 0.06);
  cursor: pointer;
  transition: all 0.2s;
}
.category-chip.active {
  background: #2d4a3e;
  color: #f5f1e8;
  border-color: #2d4a3e;
}

/* Hero 卡片 */
.hero-card {
  margin: 20px;
  border-radius: 24px;
  overflow: hidden;
  position: relative;
  height: 200px;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(26, 36, 30, 0.12);
  transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
}
.hero-card:hover { transform: translateY(-4px); }
.hero-card:active { transform: scale(0.98); }
.hero-img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 40%, rgba(26, 36, 30, 0.75) 100%);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 20px;
  color: #f5f1e8;
}
.hero-tag {
  position: absolute;
  top: 16px; left: 16px;
  padding: 4px 10px;
  background: rgba(245, 241, 232, 0.9);
  color: #2d4a3e;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 600;
}
.hero-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 4px;
}
.hero-desc {
  font-size: 12px;
  opacity: 0.8;
}

/* 分区标题 */
.section-header {
  padding: 24px 20px 12px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}
.section-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 20px;
  font-weight: 700;
  color: #1a241e;
}
.section-more {
  font-size: 13px;
  color: #6a776f;
  cursor: pointer;
}
.section-more:hover { color: #2d4a3e; }

/* 墨水色卡网格 */
.ink-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding: 0 20px;
}
.ink-card {
  border-radius: 16px;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 4px 12px rgba(26, 36, 30, 0.06);
  cursor: pointer;
  transition: transform 0.3s cubic-bezier(.2,.8,.2,1), box-shadow 0.3s;
  position: relative;
}
.ink-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 24px rgba(26, 36, 30, 0.12);
}
.ink-swatch {
  height: 110px;
  position: relative;
  overflow: hidden;
}
.ink-swatch::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 30% 30%, rgba(255,255,255,0.25), transparent 60%);
}
.ink-info {
  padding: 10px 12px 14px;
}
.ink-name {
  font-size: 14px;
  font-weight: 600;
  color: #1a241e;
  margin-bottom: 2px;
}
.ink-brand {
  font-size: 11px;
  color: #9aa5a0;
}
.ink-likes {
  position: absolute;
  top: 8px; right: 10px;
  font-size: 11px;
  color: rgba(255, 255, 255, 0.9);
  display: flex;
  align-items: center;
  gap: 3px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.2);
}

/* ========== 墨水图鉴页 ========== */
.gallery-header {
  padding: 92px 20px 12px;
  background: #2d4a3e;
  color: #f5f1e8;
  position: relative;
  overflow: hidden;
}
.gallery-header .large-title { color: #f5f1e8; }
.gallery-header .large-subtitle { color: rgba(245, 241, 232, 0.6); }

/* 筛选器 */
.filter-bar {
  display: flex;
  gap: 6px;
  padding: 12px 20px;
  background: #2d4a3e;
  overflow-x: auto;
  scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }
.filter-chip {
  flex-shrink: 0;
  padding: 5px 12px;
  border-radius: 14px;
  font-size: 12px;
  background: rgba(245, 241, 232, 0.12);
  color: rgba(245, 241, 232, 0.8);
  border: 1px solid rgba(245, 241, 232, 0.15);
  cursor: pointer;
  transition: all 0.2s;
}
.filter-chip.active {
  background: rgba(245, 241, 232, 0.95);
  color: #2d4a3e;
}

/* 瀑布流 */
.masonry {
  padding: 16px 20px 100px;
  display: flex;
  gap: 12px;
}
.masonry-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.masonry-item {
  border-radius: 14px;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 3px 10px rgba(26, 36, 30, 0.06);
  cursor: pointer;
  transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
}
.masonry-item:hover { transform: translateY(-2px); }
.masonry-img {
  width: 100%;
  display: block;
}
.masonry-img.color-block {
  height: var(--h, 140px);
}
.masonry-info {
  padding: 10px 12px;
}
.masonry-title {
  font-size: 13px;
  font-weight: 600;
  color: #1a241e;
  margin-bottom: 2px;
}
.masonry-meta {
  font-size: 11px;
  color: #9aa5a0;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ========== 详情页 ========== */
.detail-page { background: #f5f1e8; }
.detail-hero {
  position: relative;
  width: 100%;
  height: 420px;
  overflow: hidden;
}
.detail-hero-img {
  width: 100%; height: 100%;
  object-fit: cover;
  will-change: transform;
}
.detail-hero::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 80px;
  background: linear-gradient(180deg, transparent, rgba(245, 241, 232, 0.9));
}

.detail-nav {
  position: absolute;
  top: 44px; left: 0; right: 0;
  padding: 0 16px;
  display: flex;
  justify-content: space-between;
  z-index: 50;
}
.detail-nav-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(245, 241, 232, 0.9);
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.2s;
}
.detail-nav-btn:active { transform: scale(0.9); }
.detail-nav-btn svg {
  width: 20px; height: 20px;
  stroke: #1a241e;
  stroke-width: 2;
  fill: none;
}

.detail-body {
  margin-top: -40px;
  position: relative;
  z-index: 10;
  padding: 0 20px 120px;
}
.detail-title-block {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 16px;
}
.detail-product-name {
  font-family: 'Noto Serif SC', serif;
  font-size: 28px;
  font-weight: 700;
  color: #1a241e;
  line-height: 1.2;
}
.detail-product-brand {
  font-size: 13px;
  color: #6a776f;
  margin-top: 4px;
}
.detail-price {
  font-family: 'Noto Serif SC', serif;
  font-size: 24px;
  font-weight: 700;
  color: #8b4513;
}
.detail-price small {
  font-size: 14px;
  font-weight: 400;
}

/* 色值展示 */
.color-swatches-row {
  display: flex;
  gap: 8px;
  margin: 20px 0;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 4px;
}
.color-swatches-row::-webkit-scrollbar { display: none; }
.color-swatch-sm {
  flex-shrink: 0;
  width: 44px; height: 44px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: transform 0.2s, border-color 0.2s;
  position: relative;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.color-swatch-sm:hover { transform: scale(1.1); }
.color-swatch-sm.selected {
  border-color: #1a241e;
  transform: scale(1.1);
}
.color-swatch-sm.selected::after {
  content: '';
  position: absolute;
  inset: -6px;
  border: 1.5px solid #1a241e;
  border-radius: 50%;
  opacity: 0.3;
}

/* 章节标题 */
.detail-section-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 17px;
  font-weight: 700;
  color: #1a241e;
  margin: 24px 0 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.detail-section-title::before {
  content: '';
  width: 3px; height: 16px;
  background: #2d4a3e;
  border-radius: 2px;
}

.detail-text {
  font-size: 14px;
  color: #4a5450;
  line-height: 1.8;
}

/* 属性列表 */
.spec-list {
  background: #fff;
  border-radius: 14px;
  overflow: hidden;
  margin-top: 12px;
}
.spec-item {
  display: flex;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 0.5px solid #ebe5d8;
  font-size: 13px;
}
.spec-item:last-child { border-bottom: none; }
.spec-key { color: #9aa5a0; }
.spec-val { color: #1a241e; font-weight: 500; }

/* 底部操作栏 */
.detail-actions {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 12px 20px 30px;
  background: rgba(245, 241, 232, 0.95);
  backdrop-filter: blur(20px);
  border-top: 0.5px solid rgba(26, 36, 30, 0.06);
  display: flex;
  gap: 10px;
  z-index: 60;
}
.detail-action-btn {
  flex: 1;
  height: 48px;
  border-radius: 24px;
  display: flex;

/* ========== 发布模态 ========== */

}
.api-desc {

.api-block-body {

/* ========== 下拉刷新 ========== */
.pull-refresh {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  pointer-events: none;
  z-index: 5;
  height: 50px;
  transform: translateY(-100%);
  opacity: 0;
  transition: opacity 0.2s;
}
.pull-refresh-icon {
  width: 24px; height: 24px;
  border: 2px solid #2d4a3e;
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ========== 入场动画 ========== */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.anim-fade-in-up {
  opacity: 0;
  animation: fadeInUp 0.6s cubic-bezier(.2,.8,.2,1) forwards;
}
.anim-delay-1 { animation-delay: 0.05s; }
.anim-delay-2 { animation-delay: 0.1s; }
.anim-delay-3 { animation-delay: 0.15s; }
.anim-delay-4 { animation-delay: 0.2s; }
.anim-delay-5 { animation-delay: 0.25s; }
.anim-delay-6 { animation-delay: 0.3s; }
.anim-delay-7 { animation-delay: 0.35s; }
.anim-delay-8 { animation-delay: 0.4s; }

/* 3D 倾斜容器 */
.tilt-card {
  transform-style: preserve-3d;
  perspective: 800px;
}

/* 印章动画 */
.stamp {
  display: inline-block;
  transform: rotate(-15deg) scale(0);
  opacity: 0;
  animation: stampIn 0.6s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes stampIn {
  0% { transform: rotate(-15deg) scale(2); opacity: 0; }
  60% { transform: rotate(-10deg) scale(0.95); opacity: 1; }
  100% { transform: rotate(-12deg) scale(1); opacity: 1; }
}

/* 数字计数 */
.number-roll {
  display: inline-block;
  font-variant-numeric: tabular-nums;
}

/* 光泽扫过 */
.shine-wrap {
  position: relative;
  overflow: hidden;
}
.shine-wrap::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 50%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transform: skewX(-20deg);
  animation: shine 3s ease-in-out infinite;
  animation-delay: 1s;
}

  0% { left: -100%; }

/* ========== 滚动渐入 Hook ========== */
function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    if (reducedMotion) return;
    const el = ref.current;
    if (!el) return;
    const items = el.querySelectorAll('.reveal');
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          obs.unobserve(e.target);
        }
      });
    }, { threshold: 0.1 });
    items.forEach(i => obs.observe(i));
    return () => obs.disconnect();
  }, []);
  return ref;
}

/* ========== 下拉刷新 Hook ========== */
function usePullRefresh(scrollRef, onRefresh) {
  const [refreshing, setRefreshing] = useState(false);
  const [pullY, setPullY] = useState(0);
  const startY = useRef(0);
  const pulling = useRef(false);

  useEffect(() => {
    if (!scrollRef.current) return;
    const el = scrollRef.current;

    const onTouchStart = (e) => {
      if (el.scrollTop <= 0 && !refreshing) {
        startY.current = e.touches[0].clientY;
        pulling.current = true;
      }
    };
    const onTouchMove = (e) => {
      if (!pulling.current) return;
      const dy = e.touches[0].clientY - startY.current;
      if (dy > 0 && el.scrollTop <= 0) {
        e.preventDefault();
        setPullY(Math.min(dy * 0.5, 80));
      }
    };
    const onTouchEnd = () => {
      if (!pulling.current) return;
      pulling.current = false;
      if (pullY > 50) {
        setRefreshing(true);
        setPullY(50);
        setTimeout(() => {
          setRefreshing(false);
          setPullY(0);
          onRefresh && onRefresh();
        }, 1200);
      } else {
        setPullY(0);
      }
    };

    // 模拟鼠标拖拽（桌面测试用）
    let mouseDown = false;
    const onMouseDown = (e) => {
      if (el.scrollTop <= 0 && !refreshing) {
        startY.current = e.clientY;
        mouseDown = true;
      }
    };
    const onMouseMove = (e) => {
      if (!mouseDown) return;
      const dy = e.clientY - startY.current;
      if (dy > 0 && el.scrollTop <= 0) {
        setPullY(Math.min(dy * 0.5, 80));
      }
    };
    const onMouseUp = () => {
      if (!mouseDown) return;
      mouseDown = false;
      if (pullY > 50) {
        setRefreshing(true);
        setPullY(50);
        setTimeout(() => {
          setRefreshing(false);
          setPullY(0);
          onRefresh && onRefresh();
        }, 1200);
      } else {
        setPullY(0);
      }
    };

    el.addEventListener('touchstart', onTouchStart, { passive: true });
    el.addEventListener('touchmove', onTouchMove, { passive: false });
    el.addEventListener('touchend', onTouchEnd);
    el.addEventListener('mousedown', onMouseDown);
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mouseup', onMouseUp);

    return () => {
      el.removeEventListener('touchstart', onTouchStart);
      el.removeEventListener('touchmove', onTouchMove);
      el.removeEventListener('touchend', onTouchEnd);
      el.removeEventListener('mousedown', onMouseDown);
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('mouseup', onMouseUp);
    };
  }, [refreshing, pullY, onRefresh]);

  return { refreshing, pullY };
}

/* ========== 数字计数动画 ========== */
function CountUp({ end, duration = 1000, prefix = '', suffix = '' }) {
  const [val, setVal] = useState(0);
  const ref = useRef(null);
  const started = useRef(false);

  useEffect(() => {
    if (reducedMotion) { setVal(end); return; }
    const obs = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && !started.current) {
        started.current = true;
        const start = 0;
        const startTime = performance.now();
        const step = (now) => {
          const p = Math.min((now - startTime) / duration, 1);
          // easeOutCubic
          const eased = 1 - Math.pow(1 - p, 3);
          setVal(Math.floor(start + (end - start) * eased));
          if (p < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }
    }, { threshold: 0.5 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, [end, duration]);

  return <span ref={ref} className="number-roll">{prefix}{val.toLocaleString()}{suffix}</span>;
}

/* ========== 社区页 ========== */
function CommunityPage({ onNavigate }) {
  const scrollRef = useRef(null);
  const [scrolled, setScrolled] = useState(false);
  const [segment, setSegment] = useState(0);
  const [liked, setLiked] = useState({});
  const revealRef = useReveal();
  const { refreshing, pullY } = usePullRefresh(scrollRef);
  const indicatorRef = useRef(null);

  const onScroll = () => {
    setScrolled((scrollRef.current?.scrollTop || 0) > 20);
  };

  useEffect(() => {
    if (indicatorRef.current) {
      indicatorRef.current.style.transform = `translateX(${segment * 50}%)`;
    }
  }, [segment]);

  const toggleLike = (id) => {
    setLiked(prev => ({ ...prev, [id]: !prev[id] }));
  };

  // 长按菜单
  const [pressMenu, setPressMenu] = useState(null);
  const pressTimer = useRef(null);
  const startPress = (id, e) => {
    e.preventDefault();
    pressTimer.current = setTimeout(() => {
      const rect = e.currentTarget.getBoundingClientRect();
      setPressMenu({ id, x: rect.left + rect.width / 2 - 80, y: rect.bottom + 8 });
    }, 600);
  };
  const endPress = () => {
    if (pressTimer.current) {
      clearTimeout(pressTimer.current);
      pressTimer.current = null;
    }
  };

  const segments = ['关注', '推荐', '热门'];

  return (
    <div className="page">
      <StatusBar />
      <NavBar title="社区广场" scrolled={scrolled} />
      <div
        className="page-scroll"
        ref={(el) => { scrollRef.current = el; revealRef.current = el; }}
        onScroll={onScroll}
        style={{ transform: `translateY(${pullY}px)` }}
      >
        <div className="pull-refresh" style={{
          transform: `translateY(${pullY - 50}px)`,
          opacity: pullY > 10 ? 1 : 0,
        }}>
          <div className="pull-refresh-icon"/>
        </div>

        <div className="community-header">
          <div style={{ padding: '48px 0 0' }}>
            <div className="large-title anim-fade-in-up">社区广场</div>
            <div className="large-subtitle anim-fade-in-up anim-delay-1">与同好一起，记录每一笔</div>
          </div>

          <div className="community-segments">
            {segments.map((s, i) => (
              <div
                key={i}
                className={`segment ${i === segment ? 'active' : ''}`}
                onClick={() => setSegment(i)}
              >{s}</div>
            ))}
            <div className="segment-indicator" ref={indicatorRef} style={{ left: 'calc(16.67% - 12px)' }}/>
          </div>
        </div>

        {/* 信息流 */}
        <div className="feed-list">
          {FEEDS.map((feed, fi) => (
            <div
              key={feed.id}
              className="feed-card reveal"
              style={{ transitionDelay: `${fi * 0.08}s` }}
              onMouseDown={(e) => startPress(feed.id, e)}
              onMouseUp={endPress}
              onMouseLeave={endPress}
              onTouchStart={(e) => startPress(feed.id, e)}
              onTouchEnd={endPress}
            >
              <div className="feed-user">
                <div className="feed-avatar">{feed.avatar}</div>
                <div className="feed-user-info">
                  <div className="feed-username">{feed.user}</div>
                  <div className="feed-time">{feed.time}</div>
                </div>
                <div className="feed-more">
                  <Icon.More style={{ width: 18, height: 18 }}/>
                </div>
              </div>

              <div className="feed-content">{feed.content}</div>

              {feed.imgMode === 'single' && (
                <img src={IMG_URLS[feed.imgs[0]]} alt="" className="feed-img" />
              )}
              {feed.imgMode === 'dual' && (
                <div className="feed-img dual">
                  {feed.imgs.map((idx, i) => (
                    <img key={i} src={IMG_URLS[idx]} alt="" />
                  ))}
                </div>
              )}

              <div className="feed-tags">
                {feed.tags.map((t, i) => (
                  <span key={i} className="feed-tag">#{t}</span>
                ))}
              </div>

              <div className="feed-actions">
                <div
                  className={`feed-action ${liked[feed.id] ? 'liked' : ''}`}
                  onClick={(e) => { e.stopPropagation(); toggleLike(feed.id); }}
                >
                  <Icon.Heart />

            textAlign: 'center', padding: '20px 0',
            fontSize: 12, color: '#9aa5a0',
          }}>
            长按卡片可唤出快捷菜单
          </div>
        </div>
      </div>

      {/* 长按菜单 */}
      {pressMenu && (
        <>
          <div style={{
            position: 'absolute', inset: 0, zIndex: 400,
            background: 'rgba(0,0,0,0.2)',
          }} onClick={() => setPressMenu(null)}/>
          <div
            className="long-press-menu"
            style={{ left: pressMenu.x, top: pressMenu.y }}

            <div className="lpm-item" onClick={() => setPressMenu(null)}>

/* ========== 主 App ========== */
function App() {
  const [tab, setTab] = useState('home');
  const [stack, setStack] = useState([]); // 二级页面栈
  const [showPublish, setShowPublish] = useState(false);
  const [transition, setTransition] = useState({ type: null, dir: 'right' });
  const rafIds = useRef([]);

  // 切换 Tab
  const handleTabChange = (key) => {
    if (key === tab) return;
    setStack([]);
    setTab(key);
  };

  // 导航到二级页
  const handleNavigate = (page, data) => {
    setStack(prev => [...prev, { page, data }]);
    setTransition({ type: 'push', dir: 'right' });
  };

  // 返回
  const handleBack = () => {
    if (stack.length > 0) {
      setTransition({ type: 'pop', dir: 'back' });
      setTimeout(() => {
        setStack(prev => prev.slice(0, -1));
        setTransition({ type: null, dir: 'right' });
      }, 10);
    }
  };

  // 自定义光标
  useEffect(() => {
    if (reducedMotion) return;
    const cursor = document.getElementById('cursor');
    if (!cursor) return;

    let x = window.innerWidth / 2;
    let y = window.innerHeight / 2;
    let tx = x, ty = y;
    let rafId = null;

    const animate = () => {
      x += (tx - x) * 0.25;
      y += (ty - y) * 0.25;
      cursor.style.transform = `translate(${x - window.innerWidth / 2}px, ${y - window.innerHeight / 2}px)`;
      rafId = requestAnimationFrame(animate);
    };
    rafId = requestAnimationFrame(animate);
    rafIds.current.push(rafId);

    const onMove = (e) => {
      tx = e.clientX;
      ty = e.clientY;
    };

    const onOver = (e) => {
      const target = e.target.closest('button, .btn, [role="button"], .clickable, a, .tab-item, .tab-fab, .category-chip, .filter-chip, .ink-card, .masonry-item, .feed-card, .color-swatch-sm, .detail-action-btn, .photo-slot, .menu-item, .quick-entry, .feed-action, .segment, .section-more, .api-nav-item, .search-bar, .hero-card, .spec-item');
      if (target) {
        cursor.classList.add('hover');
      } else {
        cursor.classList.remove('hover');
      }
    };

    const onClick = (e) => {
      cursor.classList.add('click');
      setTimeout(() => cursor.classList.remove('click'), 150);
      // 涟漪
      const ripple = document.createElement('div');
      ripple.className = 'cursor-ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    };

    window.addEventListener('mousemove', onMove);
    document.addEventListener('mouseover', onOver);
    document.addEventListener('mousedown', onClick);

    return () => {
      window.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseover', onOver);
      document.removeEventListener('mousedown', onClick);
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, []);

  // visibility change 暂停动画
  useEffect(() => {
    const onVisibilityChange = () => {
      if (document.hidden) {
        rafIds.current.forEach(id => cancelAnimationFrame(id));
        rafIds.current = [];
      }
    };
    document.addEventListener('visibilitychange', onVisibilityChange);
    return () => document.removeEventListener('visibilitychange', onVisibilityChange);
  }, []);

  // 渲染当前页面
  const currentPage = stack.length > 0 ? stack[stack.length - 1] : { page: tab };

  const renderTabPage = () => {
    switch (tab) {
      case 'home': return <HomePage onNavigate={handleNavigate} key="home" />;
      case 'gallery': return <GalleryPage onNavigate={handleNavigate} key="gallery" />;
      case 'community': return <CommunityPage onNavigate={handleNavigate} key="community" />;
      case 'profile': return <ProfilePage onNavigate={handleNavigate} key="profile" />;
      default: return <HomePage onNavigate={handleNavigate} key="home" />;
    }
  };

  const renderStackPage = () => {
    if (stack.length === 0) return null;
    const top = stack[stack.length - 1];
    const key = `${top.page}-${stack.length}`;
    switch (top.page) {
      case 'detail':
        return <DetailPage data={top.data} onBack={handleBack} key={key} />;
      case 'spec':
        return <SpecPage onBack={handleBack} key={key} />;
      case 'api':
        return <ApiPage onBack={handleBack} key={key} />;
      default:
        return null;
    }
  };

  return (
    <>
      {/* Tab 底层页面 */}
      <div className="tab-content">
        {renderTabPage()}
      </div>

      {/* 栈顶页面 */}
      {stack.length > 0 && (
        <div
          className="page-enter-right"
          style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', zIndex: 200 }}
          key={stack.length}
        >
          {renderStackPage()}
        </div>
      )}

      {/* TabBar 只在根页面显示 */}
      {stack.length === 0 && (
        <TabBar active={tab} onChange={handleTabChange} onPublish={() => setShowPublish(true)} />
      )}

      {/* 发布模态 */}
      {showPublish && <PublishModal onClose={() => setShowPublish(false)} />}
    </>
  );
}

// 宣告可升级
function announceUpgrade() {
  try {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  } catch(e) {}
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}

// 渲染
const root = ReactDOM.createRoot(document.getElementById('app'));
root.render(<App />);
</script>

</body>
</html>

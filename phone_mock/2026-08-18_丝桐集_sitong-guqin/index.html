<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>丝桐集 · 古琴雅集小程序</title>
<meta name="creative-medium" content="interactive-prototype" />
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Ma+Shan+Zheng&display=swap" />
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
/* ============================================
   丝桐集 · 古琴小程序 V2
   配色：宣纸米白 + 紫檀深棕 + 黛青 + 朱砂
   ============================================ */
:root {
  --xuan-zhi: #F4EDE0;           /* 宣纸米白（底）*/
  --xuan-zhi-deep: #EDE4D1;      /* 深宣纸色 */
  --xuan-zhi-light: #FAF6EE;     /* 浅宣纸 */
  --zi-tan: #5C3A21;             /* 紫檀深棕（主色）*/
  --zi-tan-light: #8B5A2B;       /* 浅紫檀 */
  --zi-tan-dark: #3D2614;        /* 深紫檀 */
  --dai-qing: #2D4A47;           /* 黛青（辅助色）*/
  --dai-qing-light: #4A6B68;     /* 浅黛青 */
  --dai-qing-deep: #1A302E;      /* 深黛青 */
  --zhu-sha: #C23B22;            /* 朱砂（强调色）*/
  --zhu-sha-light: #E35A3F;      /* 浅朱砂 */
  --zhu-sha-deep: #8B2815;       /* 深朱砂 */
  --mo-se: #2B241D;              /* 墨色（正文）*/
  --mo-se-light: #5A4E42;        /* 浅墨色（次级文字）*/
  --mo-se-faint: #9B8E7E;        /* 淡墨（辅助文字）*/
  --yin-xian: #D9CEBC;           /* 银线（分割线）*/
  --xiang-yun: #C9B896;          /* 祥云金（装饰）*/
  --ruan-yu: #B8A888;            /* 软玉色 */
  
  --radius-s: 6px;
  --radius-m: 12px;
  --radius-l: 20px;
  --radius-xl: 28px;
  
  --shadow-sm: 0 1px 3px rgba(60, 40, 20, 0.08);
  --shadow-md: 0 4px 16px rgba(60, 40, 20, 0.12);
  --shadow-lg: 0 12px 40px rgba(60, 40, 20, 0.18);
  --shadow-ink: 0 8px 24px rgba(43, 36, 29, 0.25);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--mo-se);
  background: linear-gradient(135deg, #E8DFCC 0%, #D4C7A8 50%, #C9B896 100%);
  -webkit-font-smoothing: antialiased;
}

#root {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 40px;
  padding: 20px;
}

/* ============================================
   自定义光标
   ============================================ */
.custom-cursor {
  position: fixed;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 99999;
  transform: translate(-50%, -50%);
  transition: width 0.2s cubic-bezier(.25, .8, .25, 1),
              height 0.2s cubic-bezier(.25, .8, .25, 1),
              background 0.2s,
              border-color 0.2s;
  mix-blend-mode: difference;
  background: transparent;
  border: 2px solid var(--zhu-sha);
}
.custom-cursor.hover {
  width: 48px;
  height: 48px;
  border-color: var(--zhu-sha);
  background: rgba(194, 59, 34, 0.15);
}
.custom-cursor.click {
  width: 12px;
  height: 12px;
  background: var(--zhu-sha);
}
.cursor-ripple {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 99998;
  transform: translate(-50%, -50%) scale(0);
  border: 2px solid var(--zhu-sha);
  opacity: 0.6;
  animation: cursorRipple 0.6s cubic-bezier(.25, .8, .25, 1) forwards;
}
@keyframes cursorRipple {
  0% { transform: translate(-50%, -50%) scale(0); opacity: 0.7; }
  100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
}

@media (hover: none) {
  .custom-cursor { display: none; }
}

/* ============================================
   手机外壳（微信小程序风格）
   ============================================ */
.phone-frame {
  position: relative;
  width: 390px;
  height: 844px;
  border-radius: 54px;
  background: linear-gradient(145deg, #1a1512 0%, #2b2119 50%, #1a1512 100%);
  padding: 12px;
  box-shadow: 
    0 30px 80px rgba(0,0,0,0.4),
    0 10px 30px rgba(0,0,0,0.3),
    inset 0 1px 0 rgba(255,255,255,0.1);
  flex-shrink: 0;
}
.phone-bezel {
  position: absolute;
  inset: 12px;
  border-radius: 44px;
  overflow: hidden;
  background: var(--xuan-zhi);
}
.phone-screen {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--xuan-zhi);
}

/* 刘海 */
.phone-notch {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 34px;
  background: #000;
  border-radius: 20px;
  z-index: 1000;
}

/* 状态栏 */
.status-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 28px 0;
  z-index: 999;
  font-size: 15px;
  font-weight: 600;
  color: var(--mo-se);
  pointer-events: none;
}
.status-bar.dark { color: #fff; }
.status-bar-right {
  display: flex;
  align-items: center;
  gap: 6px;
}
.status-icon {
  width: 18px;
  height: 12px;
  display: inline-block;
}

/* 胶囊按钮（微信小程序特有） */
.capsule-btn {
  position: absolute;
  top: 54px;
  right: 12px;
  width: 88px;
  height: 32px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  z-index: 998;
  border: 1px solid rgba(0,0,0,0.06);
  cursor: pointer;
  transition: background 0.2s;
}
.capsule-btn:hover { background: rgba(255, 255, 255, 0.9); }
.capsule-btn.dark {
  background: rgba(0, 0, 0, 0.35);
  border-color: rgba(255,255,255,0.1);
}
.capsule-btn.dark .capsule-icon { color: rgba(255,255,255,0.9); }
.capsule-icon {
  width: 44px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--mo-se);
  font-size: 14px;
  transition: transform 0.2s;
}
.capsule-icon:hover { transform: scale(1.1); }
.capsule-divider {
  width: 1px;
  height: 16px;
  background: rgba(0,0,0,0.1);
}
.capsule-btn.dark .capsule-divider { background: rgba(255,255,255,0.2); }

/* 自定义导航栏 */
.nav-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 88px;
  z-index: 900;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 10px;
  transition: background 0.3s, color 0.3s;
  pointer-events: none;
}
.nav-bar.scrolled {
  background: rgba(244, 237, 224, 0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--yin-xian);
}
.nav-bar.dark.scrolled {
  background: rgba(43, 36, 29, 0.92);
  border-bottom-color: rgba(255,255,255,0.1);
}
.nav-title {
  font-size: 17px;
  font-weight: 600;
  font-family: 'Noto Serif SC', serif;
}
.nav-left-btn {
  position: absolute;
  left: 16px;
  bottom: 10px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  pointer-events: auto;
  transition: transform 0.2s;
}
.nav-left-btn:hover { transform: translateX(-2px); }

/* Home indicator */
.home-indicator {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 134px;
  height: 5px;
  background: var(--mo-se);
  border-radius: 3px;
  z-index: 999;
  opacity: 0.5;
}
.home-indicator.dark { background: #fff; }

/* ============================================
   页面容器与转场
   ============================================ */
.page-container {
  position: absolute;
  inset: 0;
  overflow: hidden;
}
.page {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--xuan-zhi);
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.page::-webkit-scrollbar { display: none; }

.page-enter {
  animation: pageEnter 0.35s cubic-bezier(.25, .8, .25, 1) forwards;
}
.page-exit {
  animation: pageExit 0.3s cubic-bezier(.4, 0, .2, 1) forwards;
  pointer-events: none;
}
@keyframes pageEnter {
  0% { transform: translateX(30%); opacity: 0.5; }
  100% { transform: translateX(0); opacity: 1; }
}
@keyframes pageExit {
  0% { transform: translateX(0); opacity: 1; }
  100% { transform: translateX(30%); opacity: 0; }
}

.page-back-enter {
  animation: pageBackEnter 0.35s cubic-bezier(.25, .8, .25, 1) forwards;
}
.page-back-exit {
  animation: pageBackExit 0.3s cubic-bezier(.4, 0, .2, 1) forwards;
  pointer-events: none;
}
@keyframes pageBackEnter {
  0% { transform: translateX(-20%); opacity: 0.6; }
  100% { transform: translateX(0); opacity: 1; }
}
@keyframes pageBackExit {
  0% { transform: translateX(0); opacity: 1; }
  100% { transform: translateX(30%); opacity: 0; }
}

/* ============================================
   底部 TabBar
   ============================================ */
.tab-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 86px;
  background: rgba(250, 246, 238, 0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--yin-xian);
  display: flex;
  align-items: flex-start;
  justify-content: space-around;
  padding: 6px 8px 28px;
  z-index: 800;
}
.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  transition: transform 0.2s;
  padding: 4px 0;
  position: relative;
}
.tab-item:hover { transform: translateY(-2px); }
.tab-icon {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--mo-se-faint);
  transition: color 0.25s;
  position: relative;
}
.tab-item.active .tab-icon {
  color: var(--zi-tan);
  animation: tabBounce 0.4s cubic-bezier(.34, 1.56, .64, 1);
}
@keyframes tabBounce {
  0% { transform: scale(1) translateY(0); }
  40% { transform: scale(1.25) translateY(-4px); }
  70% { transform: scale(0.92) translateY(1px); }
  100% { transform: scale(1) translateY(0); }
}
.tab-label {
  font-size: 10px;
  color: var(--mo-se-faint);
  transition: color 0.25s;
  font-family: 'Noto Serif SC', serif;
}
.tab-item.active .tab-label {
  color: var(--zi-tan);
  font-weight: 500;
}
.tab-dot {
  position: absolute;
  top: 2px;
  right: 6px;
  width: 6px;
  height: 6px;
  background: var(--zhu-sha);
  border-radius: 50%;
  transform: scale(0);
  animation: dotPop 0.3s cubic-bezier(.34, 1.56, .64, 1) forwards;
}
@keyframes dotPop {
  0% { transform: scale(0); }
  100% { transform: scale(1); }
}

/* ============================================
   首页
   ============================================ */
.home-hero {
  position: relative;
  height: 420px;
  padding-top: 88px;
  background: 
    linear-gradient(180deg, var(--zi-tan-dark) 0%, var(--zi-tan) 60%, var(--xuan-zhi) 100%);
  overflow: hidden;
}
.home-hero-title {
  position: relative;
  z-index: 2;
  padding: 0 24px;
  color: var(--xuan-zhi-light);
  margin-top: 8px;
}
.hero-sub {
  font-size: 12px;
  letter-spacing: 6px;
  color: var(--ruan-yu);
  margin-bottom: 8px;
  opacity: 0;
  animation: fadeSlideUp 0.8s 0.2s cubic-bezier(.25, .8, .25, 1) forwards;
}
.hero-main-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 42px;
  font-weight: 900;
  line-height: 1.2;
  letter-spacing: 8px;
  margin-bottom: 12px;
  opacity: 0;
  animation: fadeSlideUp 0.9s 0.35s cubic-bezier(.25, .8, .25, 1) forwards;
}
.hero-desc {
  font-size: 13px;
  color: var(--ruan-yu);
  max-width: 240px;
  line-height: 1.7;
  opacity: 0;
  animation: fadeSlideUp 0.8s 0.55s cubic-bezier(.25, .8, .25, 1) forwards;
  font-weight: 300;
}
@keyframes fadeSlideUp {
  0% { opacity: 0; transform: translateY(20px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* 琴弦动画 */
.guqin-strings {
  position: absolute;
  top: 60%;
  left: 0;
  right: 0;
  height: 180px;
  z-index: 1;
}
.guqin-string {
  position: absolute;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent 5%, rgba(201, 184, 150, 0.6) 20%, rgba(201, 184, 150, 0.8) 50%, rgba(201, 184, 150, 0.6) 80%, transparent 95%);
  transform-origin: center;
}
.guqin-string:nth-child(1) { top: 10%; animation: stringVibrate1 3.2s ease-in-out infinite; }
.guqin-string:nth-child(2) { top: 24%; animation: stringVibrate2 3.8s ease-in-out infinite; }
.guqin-string:nth-child(3) { top: 38%; animation: stringVibrate3 3.5s ease-in-out infinite; }
.guqin-string:nth-child(4) { top: 52%; animation: stringVibrate1 4.1s ease-in-out infinite; }
.guqin-string:nth-child(5) { top: 66%; animation: stringVibrate2 3.6s ease-in-out infinite; }
.guqin-string:nth-child(6) { top: 80%; animation: stringVibrate3 3.9s ease-in-out infinite; }
.guqin-string:nth-child(7) { top: 94%; animation: stringVibrate1 4.3s ease-in-out infinite; }

@keyframes stringVibrate1 {
  0%, 100% { transform: scaleY(1); }
  25% { transform: scaleY(2.5) skewY(0.3deg); }
  50% { transform: scaleY(1.5) skewY(-0.2deg); }
  75% { transform: scaleY(2) skewY(0.15deg); }
}
@keyframes stringVibrate2 {
  0%, 100% { transform: scaleY(1); }
  30% { transform: scaleY(2) skewY(-0.25deg); }
  60% { transform: scaleY(1.3) skewY(0.2deg); }
  85% { transform: scaleY(2.2) skewY(-0.1deg); }
}
@keyframes stringVibrate3 {
  0%, 100% { transform: scaleY(1); }
  20% { transform: scaleY(2.8) skewY(0.2deg); }
  45% { transform: scaleY(1.6) skewY(-0.3deg); }
  75% { transform: scaleY(2.1) skewY(0.25deg); }
}

/* 徽位 */
.hui-mark {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--xiang-yun);
  box-shadow: 0 0 8px rgba(201, 184, 150, 0.6);
  top: 50%;
  transform: translateY(-50%);
  opacity: 0;
  animation: huiFadeIn 1s 0.8s cubic-bezier(.25, .8, .25, 1) forwards;
}
@keyframes huiFadeIn {
  to { opacity: 1; }
}

/* 快捷入口 */
.quick-entries {
  position: relative;
  z-index: 3;
  margin: -40px 20px 0;
  background: var(--xuan-zhi-light);
  border-radius: var(--radius-l);
  padding: 20px 12px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  box-shadow: var(--shadow-lg);
  opacity: 0;
  animation: fadeSlideUp 0.7s 0.7s cubic-bezier(.25, .8, .25, 1) forwards;
}
.quick-entry {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: transform 0.2s;
}
.quick-entry:hover { transform: translateY(-3px); }
.quick-entry-icon {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  transition: box-shadow 0.3s;
}
.quick-entry:hover .quick-entry-icon { box-shadow: var(--shadow-md); }
.quick-entry-label {
  font-size: 11px;
  color: var(--mo-se-light);
  font-family: 'Noto Serif SC', serif;
}

/* 首页分区 */
.home-section {
  padding: 24px 20px 0;
}
.section-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 16px;
}
.section-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--zi-tan);
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title::before {
  content: '';
  width: 3px;
  height: 18px;
  background: linear-gradient(180deg, var(--zhu-sha), var(--zi-tan));
  border-radius: 2px;
}
.section-more {
  font-size: 12px;
  color: var(--mo-se-faint);
  cursor: pointer;
  transition: color 0.2s;
  display: flex;
  align-items: center;
  gap: 2px;
}
.section-more:hover { color: var(--zi-tan-light); }

/* 今日推荐曲卡 */
.today-piece {
  position: relative;
  background: linear-gradient(135deg, var(--dai-qing-deep) 0%, var(--dai-qing) 100%);
  border-radius: var(--radius-l);
  padding: 20px;
  color: var(--xuan-zhi-light);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.3s;
}
.today-piece:hover { transform: translateY(-2px); }
.today-piece-badge {
  display: inline-block;
  font-size: 10px;
  background: rgba(194, 59, 34, 0.9);
  padding: 3px 8px;
  border-radius: 10px;
  letter-spacing: 2px;
  margin-bottom: 12px;
}
.today-piece-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 4px;
  margin-bottom: 6px;
}
.today-piece-sub {
  font-size: 12px;
  opacity: 0.7;
  margin-bottom: 16px;
}
.today-piece-info {
  display: flex;
  gap: 16px;
  font-size: 11px;
  opacity: 0.8;
}
.today-piece-ornament {
  position: absolute;
  right: -20px;
  bottom: -20px;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(201, 184, 150, 0.15) 0%, transparent 70%);
}

/* 名师卡片 */
.masters-scroll {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
  margin: 0 -20px;
  padding-left: 20px;
  padding-right: 20px;
}
.masters-scroll::-webkit-scrollbar { display: none; }
.master-card {
  flex-shrink: 0;
  width: 140px;
  background: var(--xuan-zhi-light);
  border-radius: var(--radius-m);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform 0.25s, box-shadow 0.25s;
}
.master-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-md);
}
.master-avatar {
  width: 100%;
  height: 120px;
  background: linear-gradient(135deg, var(--ruan-yu), var(--zi-tan-light));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  font-family: 'Noto Serif SC', serif;
  color: var(--xuan-zhi-light);
  position: relative;
}
.master-avatar::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.2));
}
.master-info {
  padding: 10px 12px 14px;
}
.master-name {
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--zi-tan-dark);
  margin-bottom: 4px;
}
.master-title {
  font-size: 10px;
  color: var(--mo-se-faint);
  margin-bottom: 6px;
}
.master-stats {
  display: flex;
  justify-content: space-between;
  font-size: 10px;

}

}
.course-tabs {

}
.course-tab {

  position: relative;

  font-family: 'Noto Serif SC', serif;
}
.course-tab.active {
  color: var(--zi-tan);
  font-weight: 600;
}
.course-tab-indicator {
  position: absolute;
  bottom: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--zhu-sha), var(--zi-tan));

.course-grid {

  gap: 12px;
}
.course-card {

}
.course-card:hover { transform: translateY(-3px); }
.course-cover {

  color: var(--xuan-zhi-light);
  position: relative;
  overflow: hidden;
}
.course-cover::after {
  content: '';

  inset: 0;
  background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.25));
}
.course-level {
  position: absolute;

  left: 8px;

}
.course-info {
  padding: 10px 12px 14px;
}
.course-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--mo-se);

}
.course-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.course-teacher {
  font-size: 11px;
  color: var(--mo-se-faint);
}
.course-price {
  font-size: 13px;
  font-weight: 700;
  color: var(--zhu-sha);
}
.course-price small {
  font-size: 9px;
  font-weight: 400;
}

/* 下拉刷新 */
.pull-refresh {
  position: absolute;
  top: 88px;
  left: 0;
  right: 0;
  height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  z-index: 600;
  pointer-events: none;
}
.pull-string {
  width: 200px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--xiang-yun), transparent);
  position: relative;
  transition: transform 0.3s cubic-bezier(.25, .8, .25, 1);
}
.pull-string-vibrate {
  animation: pullStringVibrate 0.5s ease-out;
}
@keyframes pullStringVibrate {
  0%, 100% { transform: scaleY(1); }
  25% { transform: scaleY(4); }
  50% { transform: scaleY(2); }
  75% { transform: scaleY(3); }
}
.pull-hui {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--zhu-sha);
  box-shadow: 0 0 12px var(--zhu-sha-light);
}
.pull-text {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: var(--mo-se-faint);
  white-space: nowrap;
}

/* ============================================
   雅集页
   ============================================ */

.yaji-hero-btn {

/* 雅集日历 */
.yaji-calendar {

}
.calendar-header {

}
.calendar-month {
  font-family: 'Noto Serif SC', serif;
  font-size: 16px;
  font-weight: 600;
  color: var(--zi-tan);
}
.calendar-nav {
  display: flex;
  gap: 10px;
}
.calendar-nav-btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px solid var(--yin-xian);
  background: transparent;
  color: var(--mo-se-light);

  align-items: center;

}

}
.calendar-week {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;

}
.calendar-weekday {
  text-align: center;
  font-size: 10px;

}

  display: grid;
  grid-template-columns: repeat(7, 1fr);

}
.calendar-day {
  aspect-ratio: 1;

  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--mo-se);

  cursor: pointer;

}
.calendar-day:hover {

}
.calendar-day.empty {
  color: transparent;

}
.calendar-day.today {
  color: var(--zhu-sha);

}
.calendar-day.has-event::after {
  content: '';

  bottom: 4px;

  border-radius: 50%;

}
.calendar-day.selected {
  background: var(--zi-tan);

}

/* 雅集列表 */
.yaji-list {

}
.yaji-list-title {

}

}

}
.yaji-item-tag {

}

}
.yaji-item-body {
  padding: 10px 16px 14px;
}
.yaji-item-title {

}
.yaji-item-desc {
  font-size: 12px;

.yaji-join-count {
  font-size: 11px;

}

/* ============================================
   琴谱页（瀑布流）
   ============================================ */
.qinpu-page {
  padding-top: 88px;
  padding-bottom: 86px;
  background: var(--xuan-zhi-deep);
}
.qinpu-header {
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.qinpu-search {
  flex: 1;
  background: var(--xuan-zhi-light);
  border-radius: 20px;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--yin-xian);
}
.qinpu-search input {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;

}
.qinpu-search input::placeholder { color: var(--mo-se-faint); }
.qinpu-filter-btn {
  margin-left: 12px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--xuan-zhi-light);
  border: 1px solid var(--yin-xian);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.2s;
}
.qinpu-filter-btn:hover { transform: rotate(45deg); }

/* 琴谱分类标签 */
.qinpu-tags {
  display: flex;
  gap: 8px;
  padding: 0 20px 14px;
  overflow-x: auto;
  scrollbar-width: none;
}
.qinpu-tags::-webkit-scrollbar { display: none; }
.qinpu-tag {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 16px;
  font-size: 12px;
  background: var(--xuan-zhi-light);
  border: 1px solid var(--yin-xian);
  color: var(--mo-se-light);
  cursor: pointer;
  transition: all 0.25s;
  font-family: 'Noto Serif SC', serif;
}
.qinpu-tag:hover { border-color: var(--zi-tan-light); }
.qinpu-tag.active {
  background: var(--zi-tan);
  border-color: var(--zi-tan);
  color: var(--xuan-zhi-light);
}

/* 瀑布流 */
.masonry {
  columns: 2;
  column-gap: 12px;
  padding: 0 16px 20px;
}
.masonry-item {
  break-inside: avoid;
  margin-bottom: 12px;
  background: var(--xuan-zhi-light);
  border-radius: var(--radius-m);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform 0.25s;
  animation: masonryReveal 0.5s ease-out both;
}
.masonry-item:hover { transform: scale(1.02); }
@keyframes masonryReveal {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.qinpu-cover {
  width: 100%;
  background: linear-gradient(135deg, var(--xuan-zhi-deep), var(--ruan-yu));
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.qinpu-cover-text {
  font-family: 'Noto Serif SC', serif;
  font-size: 28px;
  color: var(--zi-tan-dark);
  writing-mode: vertical-rl;
  text-orientation: upright;
  letter-spacing: 8px;
  padding: 20px 0;
}
.qinpu-item-body {
  padding: 10px 12px 14px;
}
.qinpu-item-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--mo-se);
  margin-bottom: 6px;
}
.qinpu-item-meta {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--mo-se-faint);
}
.qinpu-item-difficulty {

  gap: 2px;
}
.diff-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--yin-xian);
}
.diff-dot.active { background: var(--zhu-sha); }

function safeTimeout(cb, ms) {

  const id = setTimeout(cb, ms);
  timers.add(id);

function cleanupAnimations() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  timers.forEach(id => clearTimeout(id));
  timers.clear();

/* ============================================
   琴课页
   ============================================ */
function CoursesPage({ onNavigate }) {
  const [activeTab, setActiveTab] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const scrollRef = useRef(null);
  const startY = useRef(0);
  const pullDist = useRef(0);
  const pullEl = useRef(null);

  const tabs = ['入门', '进阶', '高阶', '名家'];
  
  const courses = [
    { title: '琴学入门·指法基础', teacher: '陈长林', level: '入门', price: 199, cover: '法', color: 'linear-gradient(135deg, #C23B22, #8B2815)', h: 110 },
    { title: '平沙落雁精讲', teacher: '龚一', level: '进阶', price: 399, cover: '雁', color: 'linear-gradient(135deg, #5C3A21, #3D2614)', h: 130 },
    { title: '梅花三弄全曲', teacher: '李祥霆', level: '高阶', price: 599, cover: '梅', color: 'linear-gradient(135deg, #2D4A47, #1A302E)', h: 110 },
    { title: '流水·伯牙心法', teacher: '赵家珍', level: '高阶', price: 499, cover: '流', color: 'linear-gradient(135deg, #C9B896, #B8A888)', h: 140 },
    { title: '酒狂·阮籍之风', teacher: '陈长林', level: '进阶', price: 299, cover: '酒', color: 'linear-gradient(135deg, #8B5A2B, #5C3A21)', h: 110 },
    { title: '湘妃怨·初学曲', teacher: '龚一', level: '入门', price: 99, cover: '湘', color: 'linear-gradient(135deg, #E35A3F, #C23B22)', h: 120 },
  ];

  const handleTouchStart = (e) => {
    if (scrollRef.current?.scrollTop === 0) {
      startY.current = e.touches?.[0]?.clientY || e.clientY;
    }
  };

  const handleTouchMove = (e) => {
    if (scrollRef.current?.scrollTop > 0) return;
    const currentY = e.touches?.[0]?.clientY || e.clientY;
    const dist = currentY - startY.current;
    if (dist > 0 && dist < 120) {
      pullDist.current = dist;
      if (pullEl.current) {
        pullEl.current.style.height = dist + 'px';
      }
    }
  };

  const handleTouchEnd = () => {
    if (pullDist.current > 80) {
      setRefreshing(true);
      if (pullEl.current) {
        pullEl.current.style.height = '50px';
      }
      safeTimeout(() => {
        setRefreshing(false);
        pullDist.current = 0;
        if (pullEl.current) {
          pullEl.current.style.height = '0px';
        }
      }, 1500);
    } else {
      pullDist.current = 0;
      if (pullEl.current) {
        pullEl.current.style.height = '0px';
      }
    }
  };

  return (
    <div
      className="page course-page"
      ref={scrollRef}
      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}
      onTouchEnd={handleTouchEnd}
      onMouseDown={handleTouchStart}
      onMouseMove={(e) => e.buttons === 1 && handleTouchMove(e)}
      onMouseUp={handleTouchEnd}
    >
      <div className="nav-bar">
        <span className="nav-title">琴课</span>
      </div>

      {/* 下拉刷新 - 琴弦样式 */}
      <div className="pull-refresh" ref={pullEl}>
        <div className={`pull-string ${refreshing ? 'pull-string-vibrate' : ''}`}>
          <div className="pull-hui" />
        </div>
        <span className="pull-text">{refreshing ? '琴弦振动中...' : '下拉刷新'}</span>
      </div>

      {/* 吸顶分类 Tab */}
      <div className="course-sticky-tabs">
        <div className="course-tabs">
          {tabs.map((tab, i) => (
            <div
              key={tab}
              className={`course-tab ${activeTab === i ? 'active' : ''}`}
              onClick={() => setActiveTab(i)}
            >
              {tab}
            </div>
          ))}
          <div
            className="course-tab-indicator"
            style={{
              width: `${100 / tabs.length}%`,
              transform: `translateX(${activeTab * 100}%)`,
            }}
          />
        </div>
      </div>

      {/* 课程网格 */}
      <div className="course-grid">
        {courses.map((c, i) => (
          <div
            key={i}
            className="course-card"
            style={{ animation: `masonryReveal 0.5s ${i * 0.08}s ease-out both` }}
          >
            <div className="course-cover" style={{ background: c.color, height: c.h }}>
              <span style={{ fontFamily: "'Noto Serif SC', serif", fontSize: '36px', color: 'rgba(255,255,255,0.9)' }}>
                {c.cover}
              </span>
              <span className="course-level">{c.level}</span>
            </div>
            <div className="course-info">
              <div className="course-title">{c.title}</div>
              <div className="course-meta">

/* ============================================
   主应用
   ============================================ */
function App() {
  const [currentTab, setCurrentTab] = useState(PAGES.HOME);
  const [pageStack, setPageStack] = useState([PAGES.HOME]);
  const [pageTransition, setPageTransition] = useState(null); // 'forward' | 'back' | null
  const [actionSheet, setActionSheet] = useState(null);
  const [darkNavBar, setDarkNavBar] = useState(false);

  // 主 Tab 页
  const tabPages = [PAGES.HOME, PAGES.COURSES, PAGES.YAJI, PAGES.COMMUNITY, PAGES.PROFILE];
  
  // 检查当前页是否为主 Tab 页
  const isTabPage = (page) => tabPages.includes(page);
  const currentPage = pageStack[pageStack.length - 1];

  const navigate = useCallback((page, direction = 'forward') => {
    if (page === currentPage) return;
    
    setPageTransition(direction);
    
    safeTimeout(() => {
      if (direction === 'forward') {
        setPageStack(prev => [...prev, page]);
      } else {
        setPageStack(prev => prev.slice(0, -1));
      }
      
      safeTimeout(() => {
        setPageTransition(null);
      }, 350);
    }, 10);
  }, [currentPage]);

  const handleTabChange = useCallback((tab) => {
    if (tab === currentPage) return;
    setPageTransition('tab');
    safeTimeout(() => {
      setPageStack([tab]);
      setCurrentTab(tab);
      safeTimeout(() => setPageTransition(null), 300);
    }, 10);
  }, [currentPage]);

  const goBack = useCallback(() => {
    if (pageStack.length > 1) {
      navigate(pageStack[pageStack.length - 2], 'back');
    }
  }, [pageStack, navigate]);

  const openActionSheet = useCallback(() => {
    setActionSheet({
      title: '琴谱筛选',
      items: [
        { label: '按难度排序', icon: 'star' },
        { label: '按人气排序', icon: 'heart' },
        { label: '按年代排序', icon: 'calendar' },
        { label: '只看古谱', icon: 'book' },
      ],
    });
  }, []);

  const handleCapsuleMenu = () => {
    setActionSheet({
      title: '更多',
      items: [
        { label: '分享给朋友', icon: 'share' },
        { label: '收藏小程序', icon: 'bookmark' },
        { label: '举报', icon: 'settings' },
        { label: '设计规范', icon: 'edit' },
        { label: '接口文档', icon: 'more' },
      ],
    });
  };

  // 渲染当前页面
  const renderPage = (pageKey) => {
    switch (pageKey) {
      case PAGES.HOME:
        return <HomePage onNavigate={navigate} />;
      case PAGES.COURSES:
        return <CoursesPage onNavigate={navigate} />;
      case PAGES.YAJI:
        return <YajiPage onNavigate={navigate} />;
      case PAGES.QINPU:
        return <QinpuPage onNavigate={navigate} onOpenActionSheet={openActionSheet} />;
      case PAGES.COMMUNITY:
        return <CommunityPage onNavigate={navigate} />;
      case PAGES.PROFILE:
        return (
          <ProfilePage
            onNavigate={navigate}
            onOpenDesign={() => navigate(PAGES.DESIGN)}
            onOpenApi={() => navigate(PAGES.API)}
          />
        );
      case PAGES.DESIGN:
        return <DesignPage onBack={goBack} />;
      case PAGES.API:
        return <ApiPage onBack={goBack} />;
      default:
        return <HomePage onNavigate={navigate} />;
    }
  };

  const isCurrentTabPage = isTabPage(currentPage);
  const isDark = currentPage === PAGES.HOME || currentPage === PAGES.YAJI || currentPage === PAGES.PROFILE;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '20px' }}>
      {/* 标题 */}
      <div style={{ 
        textAlign: 'center',
        color: COLORS.ziTanDark,
      }}>
        <div style={{
          fontFamily: "'Noto Serif SC', serif",
          fontSize: '24px',
          fontWeight: 700,
          letterSpacing: '8px',
          marginBottom: '6px',
        }}>
          丝 桐 集
        </div>
        <div style={{
          fontSize: '12px',
          color: COLORS.moSeFaint,
          letterSpacing: '4px',
        }}>
          古琴雅集小程序 · V2
        </div>
      </div>

      <PhoneFrame dark={isDark}>
        <StatusBar dark={isDark} />
        <CapsuleButton dark={isDark} onMenu={handleCapsuleMenu} onClose={() => {}} />

        {/* 页面容器 */}
        <div className="page-container">
          {pageStack.map((pageKey, idx) => {
            const isTop = idx === pageStack.length - 1;
            const isSecond = idx === pageStack.length - 2;
            
            let pageClass = '';
            if (pageTransition === 'forward' && isTop) {
              pageClass = 'page-enter';
            } else if (pageTransition === 'back' && isSecond) {
              pageClass = 'page-back-enter';
            }
            
            return (
              <div
                key={`${pageKey}-${idx}`}
                className={pageClass}
                style={{
                  position: 'absolute',
                  inset: 0,
                  pointerEvents: isTop ? 'auto' : 'none',
                  transform: isTop ? 'none' : 'translateX(-20%)',
                  opacity: isTop ? 1 : 0.3,
                  transition: 'none',
                }}
              >
                {renderPage(pageKey)}
              </div>
            );
          })}
        </div>

        {/* TabBar - 仅主 Tab 页显示 */}
        {isCurrentTabPage && (
          <TabBar activeTab={currentPage} onTabChange={handleTabChange} />
        )}

        {/* ActionSheet */}
        {actionSheet && (
          <ActionSheet
            title={actionSheet.title}
            items={actionSheet.items}
            onSelect={(item) => {
              if (item.label === '设计规范') navigate(PAGES.DESIGN);
              if (item.label === '接口文档') navigate(PAGES.API);
            }}
            onClose={() => setActionSheet(null)}

      {/* 说明文字 */}
      <div style={{
        maxWidth: '390px',
        fontSize: '12px',
        color: COLORS.moSeLight,
        textAlign: 'center',
        lineHeight: 1.7,
      }}>
        点击底部 TabBar 切换主页面 · 点击各卡片和按钮可触发交互<br/>
        个人琴斋 → 设计规范 / 接口文档 可进入子页面，支持左滑返回
      </div>
    </div>
  );
}

/* ============================================
   自定义光标（直接操作 DOM）
   ============================================ */
function initCustomCursor() {
  const cursor = document.getElementById('customCursor');
  const rippleContainer = document.getElementById('cursorRippleContainer');
  if (!cursor || !rippleContainer) return;

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let cursorX = mouseX;
  let cursorY = mouseY;
  let animId = null;
  let lastMoveTime = 0;

  // 初始位置居中
  cursor.style.left = mouseX + 'px';
  cursor.style.top = mouseY + 'px';

  const moveCursor = (e) => {
    const now = Date.now();
    lastMoveTime = now;
    // 直接设置目标位置，RAF 积分器处理平滑
    mouseX = e.clientX;
    mouseY = e.clientY;
    
    if (!animId) {
      animateCursor();
    }
  };

  const animateCursor = () => {
    if (document.hidden) {
      animId = null;
      return;
    }
    // 弹簧式阻尼跟随
    const dx = mouseX - cursorX;
    const dy = mouseY - cursorY;
    cursorX += dx * 0.25;
    cursorY += dy * 0.25;
    
    cursor.style.left = cursorX + 'px';
    cursor.style.top = cursorY + 'px';
    
    // 速度足够小且距离目标近时停止
    if (Math.abs(dx) < 0.3 && Math.abs(dy) < 0.3) {
      cursorX = mouseX;
      cursorY = mouseY;
      cursor.style.left = cursorX + 'px';
      cursor.style.top = cursorY + 'px';
      animId = null;
      return;
    }
    
    animId = requestAnimationFrame(animateCursor);
  };

  const handleMouseOver = (e) => {
    const target = e.target;
    if (target.closest && (
      target.closest('button') ||
      target.closest('.tab-item') ||
      target.closest('.course-card') ||
      target.closest('.master-card') ||
      target.closest('.event-card') ||
      target.closest('.yaji-item') ||
      target.closest('.masonry-item') ||
      target.closest('.post-item') ||
      target.closest('.quick-entry') ||
      target.closest('.profile-grid-item') ||
      target.closest('.profile-stat') ||
      target.closest('.qinpu-tag') ||
      target.closest('.course-tab') ||
      target.closest('.community-tab') ||
      target.closest('.api-tab') ||
      target.closest('.today-piece') ||
      target.closest('.section-more') ||
      target.closest('.actionsheet-item') ||
      target.closest('.nav-left-btn') ||
      target.closest('.capsule-btn') ||
      target.closest('.post-action') ||
      target.closest('.color-swatch') ||
      target.closest('.jianzipu-char') ||
      target.closest('.btn-showcase') ||
      target.closest('.calendar-day') ||
      target.closest('.yaji-hero-btn')
    )) {
      cursor.classList.add('hover');
    }
  };

  const handleMouseOut = (e) => {
    const target = e.target;
    if (target.closest && (
      target.closest('button') ||
      target.closest('.tab-item') ||
      target.closest('.course-card') ||
      target.closest('.master-card') ||
      target.closest('.event-card') ||
      target.closest('.yaji-item') ||
      target.closest('.masonry-item') ||
      target.closest('.post-item') ||
      target.closest('.quick-entry') ||
      target.closest('.profile-grid-item') ||
      target.closest('.profile-stat') ||
      target.closest('.qinpu-tag') ||
      target.closest('.course-tab') ||
      target.closest('.community-tab') ||
      target.closest('.api-tab') ||
      target.closest('.today-piece') ||
      target.closest('.section-more') ||
      target.closest('.actionsheet-item') ||
      target.closest('.nav-left-btn') ||
      target.closest('.capsule-btn') ||
      target.closest('.post-action') ||
      target.closest('.color-swatch') ||
      target.closest('.jianzipu-char') ||
      target.closest('.btn-showcase') ||
      target.closest('.calendar-day') ||
      target.closest('.yaji-hero-btn')
    )) {
      cursor.classList.remove('hover');
    }
  };

  const handleClick = (e) => {
    // 涟漪效果
    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    rippleContainer.appendChild(ripple);
    
    cursor.classList.add('click');
    safeTimeout(() => cursor.classList.remove('click'), 150);
    
    safeTimeout(() => {
      if (ripple.parentNode) ripple.parentNode.removeChild(ripple);
    }, 600);
  };

  document.addEventListener('mousemove', moveCursor);
  document.addEventListener('mouseover', handleMouseOver);
  document.addEventListener('mouseout', handleMouseOut);
  document.addEventListener('mousedown', handleClick);

  // 页面不可见时暂停动画
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && animId) {
      cancelAnimationFrame(animId);
      animId = null;
    }
  });
}

// 检查 reduced motion
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!prefersReducedMotion) {
  // 初始化自定义光标
  if (document.readyState === 'complete') {
    initCustomCursor();
  } else {
    window.addEventListener('load', initCustomCursor);
  }
}

/* ============================================
   渲染应用
   ============================================ */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// 宣告可升级为全栈应用
function announceUpgrade() {
  try {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  } catch (e) {}
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}

// 页面卸载时清理
window.addEventListener('beforeunload', cleanupAnimations);
</script>
</body>
</html>

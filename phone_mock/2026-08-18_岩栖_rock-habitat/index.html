<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>岩栖 · 矿物标本收藏</title>
<meta name="creative-medium" content="interactive-prototype" />
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
  :root {
    --olive-900: #2C3322;
    --olive-800: #3A442B;
    --olive-700: #4E5B38;
    --olive-600: #667848;
    --olive-500: #7D9458;
    --olive-400: #99AD70;
    --olive-300: #B5C494;
    --olive-200: #D2DBB9;
    --olive-100: #EAEAD6;
    --olive-50:  #F3F2E4;
    --amber-700: #8B6318;
    --amber-600: #B07F1F;
    --amber-500: #D4A02A;
    --amber-400: #E8BC4A;
    --amber-300: #F0D078;
    --amber-100: #FAEFC5;
    --rust-700:  #6B3A1E;
    --rust-600:  #8A4B27;
    --rust-500:  #B05E2E;
    --rust-400:  #C97A47;
    --rust-300:  #DEA278;
    --rust-100:  #F1D9C3;
    --parchment:    #F5EFE0;
    --parchment-2:  #EDE4CB;
    --charcoal: #2B2720;
    --charcoal-2: #3F3A31;
    --charcoal-3: #5A5347;
    --rose-500: #C97B7B;
    --rose-300: #E6B0B0;
    --ink: #2B2720;
    --paper: #F8F3E6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #1a1714 0%, #2d2820 50%, #1f2418 100%);
    font-family: 'Noto Sans SC', -apple-system, system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .stage {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    padding: 20px;
  }

  .stage::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(125, 148, 88, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(212, 160, 42, 0.06) 0%, transparent 40%);
    pointer-events: none;
  }

  .stage-title {
    position: absolute; top: 28px; left: 40px;
    color: rgba(245, 239, 224, 0.7);
    font-size: 13px; letter-spacing: 2px;
    font-family: 'Noto Serif SC', serif;
    font-weight: 400;
  }
  .stage-title strong {
    font-weight: 700; color: var(--amber-400);
    letter-spacing: 4px; margin-right: 12px;
  }

  .stage-caption {
    position: absolute; bottom: 28px; right: 40px;
    color: rgba(245, 239, 224, 0.45);
    font-size: 12px; letter-spacing: 1px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* ─── custom cursor ─── */
  .cursor-dot {
    position: fixed;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--amber-400);
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.2s cubic-bezier(0.4,0,0.2,1),
                height 0.2s cubic-bezier(0.4,0,0.2,1),
                background 0.2s;
    will-change: transform;
    box-shadow: 0 0 8px rgba(212, 160, 42, 0.6);
  }
  .cursor-ring {
    position: fixed;
    width: 32px; height: 32px;
    border: 1.5px solid rgba(232, 188, 74, 0.6);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: width 0.25s cubic-bezier(0.4,0,0.2,1),
                height 0.25s cubic-bezier(0.4,0,0.2,1),
                border-color 0.25s,
                opacity 0.2s;
    will-change: transform;
  }
  .cursor-ring.hover {
    width: 48px; height: 48px;
    border-color: rgba(212, 160, 42, 0.9);
    background: rgba(212, 160, 42, 0.08);
  }
  .cursor-dot.hover {
    width: 4px; height: 4px;
  }

  .cursor-ripple {
    position: fixed;
    border-radius: 50%;
    border: 2px solid var(--amber-400);
    pointer-events: none;
    z-index: 9997;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0.8;
    animation: rippleExpand 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  @keyframes rippleExpand {
    to { transform: translate(-50%, -50%) scale(4); opacity: 0; }
  }

  /* scrollbars */
  ::-webkit-scrollbar { width: 0; height: 0; }

  /* screen transitions */
  .screen-wrap { position: relative; width: 100%; height: 100%; }
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    opacity: 0;
    transform: translateX(20px);
    transition: opacity 0.35s cubic-bezier(0.2, 0.8, 0.2, 1),
                transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    pointer-events: none;
    overflow: hidden;
  }
  .screen.active {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }
  .screen.back {
    transform: translateX(-20px);
  }

  /* tab bar */
  .tab-bar {
    position: relative;
    flex-shrink: 0;
    height: calc(83px + var(--ios-safe-bottom, 34px));
    padding-bottom: var(--ios-safe-bottom, 34px);
    background: rgba(248, 243, 230, 0.85);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-top: 0.5px solid rgba(43, 39, 32, 0.12);
    display: flex;
    z-index: 10;
  }
  .tab-bar-item {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3px;
    color: var(--charcoal-3);
    font-size: 10px;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: color 0.2s;
    position: relative;
  }
  .tab-bar-item.active { color: var(--olive-700); }
  .tab-bar-item svg { width: 24px; height: 24px; }
  .tab-bar-indicator {
    position: absolute; top: 6px;
    width: 20px; height: 3px;
    background: var(--olive-600);
    border-radius: 2px;
    transition: left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* crystal hex background pattern */
  .crystal-bg {
    position: absolute; inset: 0;
    opacity: 0.06;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='52' viewBox='0 0 60 52'><path d='M30 0L60 17v18L30 52 0 35V17z' fill='none' stroke='%232C3322' stroke-width='1'/></svg>");
    background-size: 60px 52px;
    pointer-events: none;
  }

  /* hero crystal signature animation */
  .hero-crystal {
    width: 120px; height: 120px;
    position: relative;
    animation: crystalFloat 6s ease-in-out infinite;
    transform-style: preserve-3d;
  }
  @keyframes crystalFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-12px) rotate(6deg); }
  }
  .crystal-shine {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent 30%, rgba(255, 255, 255, 0.6) 50%, transparent 70%);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    animation: shineMove 4s ease-in-out infinite;
  }
  @keyframes shineMove {
    0% { transform: translateX(-100%); opacity: 0; }
    30%, 70% { opacity: 0.6; }
    100% { transform: translateX(100%); opacity: 0; }
  }

  /* pull to refresh spinner */
  .ptr-spinner {
    display: flex; align-items: center; justify-content: center;
    padding: 12px 0;
    color: var(--olive-600);
    font-size: 12px;
    letter-spacing: 2px;
    gap: 8px;
  }
  .ptr-hex {
    width: 14px; height: 16px;
    animation: hexSpin 1s linear infinite;
  }
  @keyframes hexSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* long press menu */
  .long-press-menu {
    position: absolute;
    background: rgba(248, 243, 230, 0.95);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 14px;
    padding: 6px;
    box-shadow: 0 12px 40px rgba(43, 39, 32, 0.25), 0 2px 8px rgba(43, 39, 32, 0.1);
    border: 0.5px solid rgba(43, 39, 32, 0.1);
    display: flex;
    gap: 2px;
    z-index: 100;
    animation: menuPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes menuPop {
    from { transform: scale(0.8) translateY(10px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }
  .lpm-item {
    padding: 8px 14px;
    font-size: 13px;
    color: var(--charcoal);
    border-radius: 9px;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: background 0.15s;
  }
  .lpm-item:hover { background: rgba(102, 120, 72, 0.12); }

  /* bottom sheet */
  .bottom-sheet-mask {
    position: absolute; inset: 0;
    background: rgba(43, 39, 32, 0.4);
    z-index: 80;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .bottom-sheet-mask.show { opacity: 1; pointer-events: auto; }
  .bottom-sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--paper);
    border-radius: 20px 20px 0 0;
    z-index: 85;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
    box-shadow: 0 -8px 32px rgba(43, 39, 32, 0.15);
    max-height: 80%;
    display: flex; flex-direction: column;
  }
  .bottom-sheet.show { transform: translateY(0); }
  .sheet-grabber {
    width: 36px; height: 5px;
    border-radius: 3px;
    background: rgba(43, 39, 32, 0.2);
    margin: 8px auto 0;
    flex-shrink: 0;
  }

  /* toast */
  .toast {
    position: absolute;
    top: calc(var(--ios-safe-top, 62px) + 16px);
    left: 50%;
    transform: translateX(-50%) translateY(-60px);
    background: rgba(43, 39, 32, 0.92);
    backdrop-filter: blur(12px);
    color: var(--parchment);
    padding: 10px 20px;
    border-radius: 24px;
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex; align-items: center; gap: 8px;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* detail page transition */
  .detail-overlay {
    position: absolute; inset: 0;
    background: var(--paper);
    z-index: 150;
    transform: translateY(100%);
    transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .detail-overlay.show { transform: translateY(0); }
  .detail-hero {
    height: 280px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }
  .detail-hero-shape {
    position: absolute;
    width: 300px; height: 300px;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(0.5);
    transition: transform 0.6s cubic-bezier(0.32, 0.72, 0, 1) 0.1s;
    animation: slowSpin 20s linear infinite;
    animation-play-state: paused;
  }
  .detail-overlay.show .detail-hero-shape {
    transform: translate(-50%, -50%) scale(1);
    animation-play-state: running;
  }
  @keyframes slowSpin {
    from { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    to { transform: translate(-50%, -50%) scale(1) rotate(360deg); }
  }

  /* FAB */
  .fab {
    position: absolute;
    right: 20px; bottom: calc(83px + var(--ios-safe-bottom, 34px) + 16px);
    width: 56px; height: 56px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--olive-600), var(--olive-800));
    box-shadow: 0 8px 24px rgba(43, 39, 32, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 20;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.2s;
  }
  .fab:hover { transform: scale(1.08); }
  .fab:active { transform: scale(0.95); }
  .fab-sparkles {
    position: absolute; inset: -6px;
    border-radius: 22px;
    background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.3), transparent 40%);
    pointer-events: none;
  }

  /* museum label card */
  .museum-card {
    background: var(--parchment);
    border-radius: 8px;
    padding: 14px 16px;
    position: relative;
    box-shadow: 0 2px 8px rgba(43, 39, 32, 0.08),
                0 1px 2px rgba(43, 39, 32, 0.04);
    font-family: 'Noto Serif SC', serif;
  }
  .museum-card::before {
    content: '';
    position: absolute;
    top: 8px; left: 50%;
    transform: translateX(-50%);
    width: 40px; height: 12px;
    background: rgba(106, 90, 60, 0.25);
    border-radius: 2px;
  }
  .museum-label {
    border: 1px solid rgba(43, 39, 32, 0.2);
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 11px;
    line-height: 1.6;
    color: var(--charcoal);
  }
  .museum-label .cn { font-size: 13px; font-weight: 600; letter-spacing: 2px; }
  .museum-label .latin {
    font-style: italic; font-size: 10px;
    color: var(--charcoal-3); letter-spacing: 0.5px;
    font-family: 'Noto Serif SC', serif;
    margin-top: 2px;
  }
  .museum-label .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--charcoal-3);
    margin-top: 4px;
    letter-spacing: 1px;
  }

  /* shimmer on cards */
  .shimmer-card {
    position: relative;
    overflow: hidden;
  }
  .shimmer-card::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(
      105deg,
      transparent 30%,
      rgba(255, 255, 255, 0.35) 50%,
      transparent 70%
    );
    transform: translateX(-100%);
    transition: transform 0.6s;
  }
  .shimmer-card:hover::after { transform: translateX(100%); }

  /* number counter */
  .stat-number {
    font-variant-numeric: tabular-nums;
    font-family: 'JetBrains Mono', monospace;
  }

  /* utility */
  .serif { font-family: 'Noto Serif SC', serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .safe-top { padding-top: var(--ios-safe-top, 62px); }
  .safe-bottom { padding-bottom: var(--ios-safe-bottom, 34px); }

  /* nav large title */
  .nav-large {
    padding: 8px 20px 12px;
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .nav-large h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 34px; font-weight: 700;
    color: var(--charcoal);
    letter-spacing: -1px;
    line-height: 1.1;
  }
  .nav-large .sub {
    font-size: 12px;
    color: var(--charcoal-3);
    letter-spacing: 2px;
  }

  /* modal */
  .modal-mask {
    position: absolute; inset: 0;
    background: rgba(43, 39, 32, 0.5);
    z-index: 120;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    padding: 40px;
  }
  .modal-mask.show { opacity: 1; pointer-events: auto; }
  .modal-card {
    background: var(--paper);
    border-radius: 20px;
    padding: 24px;
    width: 100%;
    transform: scale(0.85);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 20px 60px rgba(43, 39, 32, 0.3);
  }
  .modal-mask.show .modal-card { transform: scale(1); }

  /* reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* horizontal snap scroll gallery */
  .snap-gallery {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding: 0 20px 4px;
    scrollbar-width: none;
  }
  .snap-gallery > * {
    scroll-snap-align: start;
    flex-shrink: 0;
  }

  /* grid collage */
  .collage-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: 80px;
    gap: 8px;
    padding: 0 16px;
  }
  .collage-grid .item {
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .collage-grid .item:hover { transform: scale(0.97); }
  .collage-grid .item.tall { grid-row: span 2; }
  .collage-grid .item.wide { grid-column: span 2; }

  /* floating action ball */
  .float-ball {
    position: absolute;
    right: 16px; top: 50%;
    transform: translateY(-50%);
    z-index: 25;
    display: flex; flex-direction: column;
    gap: 10px;
  }
  .float-ball .dot {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(248, 243, 230, 0.9);
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 16px rgba(43, 39, 32, 0.15);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    border: 0.5px solid rgba(43, 39, 32, 0.08);
  }
  .float-ball .dot:hover { transform: scale(1.12); }

  /* tilt card */
  .tilt-card {
    transition: transform 0.1s ease-out;
    transform-style: preserve-3d;
  }

  /* spectrum bars */
  .spectrum-bar {
    display: flex;
    gap: 3px;
    align-items: flex-end;
    height: 24px;
  }
  .spectrum-bar span {
    flex: 1;
    background: var(--olive-500);
    border-radius: 1.5px;
    height: 20%;
    animation: spectrumPulse 1.2s ease-in-out infinite;
  }
  @keyframes spectrumPulse {
    0%, 100% { height: 20%; }
    50% { height: 100%; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" src="components/ios-frame.jsx"></script>
<script type="text/babel" src="components/tweaks-panel.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ═══════════════════════════════════════════
   DATA — 矿物标本数据
   ═══════════════════════════════════════════ */
const SPECIMENS = [
  {
    id: 'sp-001', cn: '橄榄石', latin: 'Peridot', formula: '(Mg,Fe)₂SiO₄',

    hardness: '6.5–7', crystal: '斜方晶系', origin: '中国吉林',
    collected: '2024.03.12', size: '3.2×2.1×1.8cm',
    tag: '岛状硅酸盐', rarity: 3,
    desc: '橄榄石是一种古老的宝石矿物，古埃及人称之为「太阳的宝石」。其典型的橄榄绿色源自铁元素的存在，产自玄武岩或陨石之中。',
    facts: ['八月生辰石', '古埃及护身符', '可形成于地幔深处'],
  },
  {

    color: '#D4A02A', bgFrom: '#8B6318', bgTo: '#F0D078',
    hardness: '6–6.5', crystal: '等轴晶系', origin: '西班牙纳瓦洪',
    collected: '2023.11.05', size: '4.5×3.0×2.5cm',

  },
  {
    id: 'sp-003', cn: '蔷薇辉石', latin: 'Rhodonite', formula: 'MnSiO₃',
    color: '#C97B7B', bgFrom: '#8B4B4B', bgTo: '#E6B0B0',
    hardness: '5.5–6.5', crystal: '三斜晶系', origin: '澳大利亚布罗肯希尔',

/* ═══════════════════════════════════════════
   CRYSTAL SHAPE — 晶面图形组件
   ═══════════════════════════════════════════ */
function CrystalShape({ color = '#7D9458', size = 100, from, to, style }) {
  const gradId = useMemo(() => 'g' + Math.random().toString(36).slice(2, 8), []);
  return (
    <svg width={size} height={size} viewBox="0 0 100 100" style={style}>
      <defs>
        <linearGradient id={gradId} x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stopColor={from || color} stopOpacity="0.95"/>
          <stop offset="50%" stopColor={color} stopOpacity="1"/>
          <stop offset="100%" stopColor={to || color} stopOpacity="0.7"/>
        </linearGradient>
      </defs>
      {/* 主六方柱体 */}
      <polygon points="50,5 88,27 88,73 50,95 12,73 12,27"
        fill={`url(#${gradId})`} stroke="rgba(255,255,255,0.2)" strokeWidth="0.5"/>
      {/* 晶面分割线 */}
      <polygon points="50,5 50,95 88,73 88,27" fill="rgba(255,255,255,0.08)"/>
      <polygon points="50,5 12,27 12,73 50,95" fill="rgba(0,0,0,0.1)"/>
      {/* 高光面 */}
      <polygon points="50,5 88,27 50,50" fill="rgba(255,255,255,0.25)"/>
      <polygon points="50,50 88,27 88,73" fill="rgba(255,255,255,0.1)"/>
      {/* 尖端光泽 */}
      <circle cx="35" cy="20" r="6" fill="rgba(255,255,255,0.35)" filter="blur(2px)"/>
    </svg>
  );
}

/* ═══════════════════════════════════════════
   PULL TO REFRESH WRAPPER
   ═══════════════════════════════════════════ */
function PullToRefresh({ onRefresh, children }) {
  const ref = useRef(null);
  const [pull, setPull] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const startY = useRef(0);
  const pulling = useRef(false);

  const handleTouchStart = (e) => {
    if (ref.current.scrollTop <= 0) {
      startY.current = e.touches[0].clientY;
      pulling.current = true;
    }
  };
  const handleTouchMove = (e) => {
    if (!pulling.current) return;
    const dy = e.touches[0].clientY - startY.current;
    if (dy > 0) {
      setPull(Math.min(dy * 0.5, 80));
    }
  };
  const handleTouchEnd = () => {
    if (pull > 50 && !refreshing) {
      setRefreshing(true);
      setPull(50);
      onRefresh && onRefresh(() => {
        setRefreshing(false);
        setPull(0);
      });
    } else {
      setPull(0);
    }
    pulling.current = false;
  };

  return (
    <div ref={ref} style={{ flex: 1, overflowY: 'auto', position: 'relative' }}
      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}
      onTouchEnd={handleTouchEnd}>
      <div style={{
        height: pull,
        display: 'flex', alignItems: 'flex-end', justifyContent: 'center',
        paddingBottom: 8,
        transition: refreshing ? 'none' : 'height 0.3s',
      }}>
        <div className="ptr-spinner" style={{ opacity: pull / 60 }}>
          <svg className="ptr-hex" viewBox="0 0 14 16" style={{ animationPlayState: refreshing ? 'running' : 'paused' }}>
            <path d="M7 0L14 4v8l-7 4-7-4V4z" fill="none" stroke="var(--olive-600)" strokeWidth="1.5"/>
          </svg>
          <span>{refreshing ? '晶面校准中…' : '下拉刷新晶藏'}</span>
        </div>
      </div>
      {children}
    </div>
  );
}

      setScanProgress(p => {
        if (p >= 100) {
          clearInterval(interval);
          setTimeout(() => {
            setScanning(false);
            setToast('识别完成：橄榄石（置信度 97.3%）');

function ProfileScreen({ onOpenSettings, onOpenAPI, onOpenSpec }) {
  const statAnimated = useRef({ count: 0 });
  const [stats, setStats] = useState({ specimens: 0, species: 0, trips: 0 });

  useEffect(() => {
    const targets = { specimens: 6, species: 5, trips: 3 };
    let start = 0;
    const dur = 1500;
    const t0 = performance.now();
    let rafId;
    const step = (now) => {
      const p = Math.min((now - t0) / dur, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      setStats({
        specimens: Math.round(targets.specimens * eased),
        species: Math.round(targets.species * eased),
        trips: Math.round(targets.trips * eased),
      });
      if (p < 1) rafId = requestAnimationFrame(step);
    };
    rafId = requestAnimationFrame(step);
    return () => cancelAnimationFrame(rafId);
  }, []);

  const menuItems = [
    { icon: <IconDoc />, label: '设计规范', sub: 'Design Tokens', action: onOpenSpec, color: 'var(--olive-600)' },

/* ═══════════════════════════════════════════
   CUSTOM CURSOR 自定义光标
   ═══════════════════════════════════════════ */
function CustomCursor() {
  const dotRef = useRef(null);
  const ringRef = useRef(null);
  const pos = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const target = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const rafId = useRef(null);
  const hoverRef = useRef(false);

  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const move = (e) => {
      target.current.x = e.clientX;
      target.current.y = e.clientY;
    };

    const animate = () => {
      pos.current.x += (target.current.x - pos.current.x) * 0.2;
      pos.current.y += (target.current.y - pos.current.y) * 0.12;

      if (dotRef.current) {
        dotRef.current.style.transform = `translate(${pos.current.x}px, ${pos.current.y}px) translate(-50%, -50%)`;
      }
      if (ringRef.current) {
        ringRef.current.style.transform = `translate(${target.current.x}px, ${target.current.y}px) translate(-50%, -50%)`;
      }
      rafId.current = requestAnimationFrame(animate);
    };

    const handleOver = (e) => {
      const t = e.target;
      if (t.closest && (t.closest('button') || t.closest('[role="button"]') || t.closest('.fab') || t.tagName === 'BUTTON' || t.style.cursor === 'pointer' || t.closest('[style*="cursor: pointer"]'))) {
        if (!hoverRef.current) {
          hoverRef.current = true;
          ringRef.current && ringRef.current.classList.add('hover');
          dotRef.current && dotRef.current.classList.add('hover');
        }
      } else if (hoverRef.current) {
        hoverRef.current = false;
        ringRef.current && ringRef.current.classList.remove('hover');
        dotRef.current && dotRef.current.classList.remove('hover');
      }
    };

    const handleClick = (e) => {
      const ripple = document.createElement('div');
      ripple.className = 'cursor-ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    };

    const handleVisibility = () => {
      if (document.hidden) {
        if (rafId.current) cancelAnimationFrame(rafId.current);
      } else {
        rafId.current = requestAnimationFrame(animate);
      }
    };

    window.addEventListener('mousemove', move);
    window.addEventListener('mouseover', handleOver);
    window.addEventListener('click', handleClick);
    document.addEventListener('visibilitychange', handleVisibility);

    if (!reduced) {
      rafId.current = requestAnimationFrame(animate);
    } else {
      // reduced motion: snap cursor
      dotRef.current.style.transform = `translate(${window.innerWidth / 2}px, ${window.innerHeight / 2}px) translate(-50%, -50%)`;
      ringRef.current.style.transform = `translate(${window.innerWidth / 2}px, ${window.innerHeight / 2}px) translate(-50%, -50%)`;
    }

    return () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseover', handleOver);
      window.removeEventListener('click', handleClick);
      document.removeEventListener('visibilitychange', handleVisibility);
      if (rafId.current) cancelAnimationFrame(rafId.current);
    };
  }, []);

  return (
    <>
      <div ref={ringRef} className="cursor-ring" />
      <div ref={dotRef} className="cursor-dot" />
    </>
  );
}

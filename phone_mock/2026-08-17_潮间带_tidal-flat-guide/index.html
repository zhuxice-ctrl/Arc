<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>潮间带 · 赶海潮汐图鉴</title>
<style>
  /* === 全局重置与画布 === */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #ede6d6;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  /* 砂质地纹背景 */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(217, 119, 87, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(196, 143, 80, 0.1) 0%, transparent 50%),
      #ede6d6;
    z-index: 0;
  }

  /* === 自定义光标 === */
  .custom-cursor {
    position: fixed;
    width: 14px; height: 14px;
    border: 2px solid #6b4226;
    border-radius: 50%;
    pointer-events: none;
    z-index: 99999;
    transform: translate(-50%, -50%);
    transition: width 0.18s ease, height 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    mix-blend-mode: difference;
  }
  .custom-cursor.cursor-hover {
    width: 32px; height: 32px;
    background: rgba(255,255,255,0.15);
    border-color: #d97757;
  }
  .cursor-ripple {
    position: fixed;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(217, 119, 87, 0.4);
    pointer-events: none;
    z-index: 99998;
    transform: translate(-50%, -50%) scale(1);
    animation: cursor-ripple-anim 0.6s ease-out forwards;
  }
  @keyframes cursor-ripple-anim {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
    100% { transform: translate(-50%, -50%) scale(5); opacity: 0; }
  }

  /* === 舞台容器 === */
  .stage {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 48px;
  }
  .stage-info {
    width: 240px;
    color: #6b4226;
  }
  .stage-info h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 6px;
    color: #4a2c18;
  }
  .stage-info .subtitle {
    font-size: 13px;
    color: #8b6242;
    margin-bottom: 20px;
    letter-spacing: 1px;
  }
  .stage-info .spec-line {
    font-size: 12px;
    color: #9a7558;
    line-height: 1.9;
    padding-left: 12px;
    border-left: 2px solid #d97757;
    margin-bottom: 12px;
  }
  .stage-info .spec-line strong { color: #6b4226; }
  .page-nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 16px;
  }
  .page-nav button {
    text-align: left;
    padding: 8px 12px;
    border: none;
    background: rgba(255,255,255,0.5);
    border-radius: 8px;
    color: #6b4226;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s ease;
    border-left: 3px solid transparent;
  }
  .page-nav button:hover {
    background: rgba(255,255,255,0.8);
  }
  .page-nav button.active {
    background: #d97757;
    color: #fff;
    border-left-color: #a8553a;
  }

  /* === 手机壳 === */
  .phone-wrapper {
    position: relative;
  }
  .phone-frame {
    width: 390px;
    height: 820px;
    border-radius: 54px;
    background: #1a1814;
    padding: 12px;
    box-shadow:
      0 50px 100px -20px rgba(107, 66, 38, 0.3),
      0 30px 60px -30px rgba(107, 66, 38, 0.4),
      inset 0 0 0 1px rgba(255,255,255,0.08);
    position: relative;
  }
  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 42px;
    overflow: hidden;
    background: #f8f3ea;
    position: relative;
  }
  /* 刘海 */
  .notch {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 30px;
    background: #0a0907;
    border-radius: 20px;
    z-index: 100;
  }
  /* 状态栏 */
  .status-bar {
    height: 48px;
    padding: 14px 28px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 600;
    color: #2a1f15;
    position: relative;
    z-index: 90;
  }
  .status-bar .time { font-variant-numeric: tabular-nums; }
  .status-bar .icons {
    display: flex;
    gap: 5px;
    align-items: center;
  }
  .status-icon {
    width: 16px; height: 10px;
    display: inline-block;
  }

  /* === 小程序导航栏（胶囊） === */
  .mp-navbar {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    position: relative;
    z-index: 80;
    transition: background 0.3s ease;
  }
  .mp-navbar .title {
    font-size: 17px;
    font-weight: 600;
    color: #2a1f15;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
  }
  .mp-capsule {
    position: absolute;
    right: 12px;
    top: 8px;
    width: 88px;
    height: 32px;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    border: 0.5px solid rgba(0,0,0,0.08);
    z-index: 90;
  }
  .mp-capsule .cap-item {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 43px;
    height: 20px;
    color: #2a1f15;
  }
  .mp-capsule .cap-divider {
    width: 0.5px;
    height: 16px;
    background: rgba(0,0,0,0.15);
  }

  /* === 页面内容区 === */
  .page-container {
    position: absolute;
    inset: 0;
    top: 44px; /* 导航栏下方 */
    bottom: 0;
    overflow: hidden;
  }
  .page {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    background: #f8f3ea;
    -webkit-overflow-scrolling: touch;
    will-change: transform, opacity;
  }
  .page::-webkit-scrollbar { display: none; }
  .page.pushing { animation: page-push 0.35s cubic-bezier(0.32, 0.72, 0, 1) both; }
  .page.popping { animation: page-pop 0.3s cubic-bezier(0.32, 0.72, 0, 1) both; }
  @keyframes page-push {
    from { transform: translateX(30%); opacity: 0.6; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes page-pop {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(30%); opacity: 0; }
  }

  /* === Tab Bar === */
  .tab-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60px;
    padding-bottom: 8px;
    background: rgba(255, 252, 247, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 0.5px solid rgba(107, 66, 38, 0.1);
    display: flex;
    align-items: center;
    justify-content: space-around;
    z-index: 70;
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    padding: 6px 0;
    color: #9a7558;
    font-size: 10px;
    transition: color 0.2s ease;
    position: relative;
  }
  .tab-item.active { color: #d97757; }
  .tab-item .tab-icon {
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .tab-item.active .tab-icon {
    animation: tab-bounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes tab-bounce {
    0% { transform: scale(1); }
    40% { transform: scale(1.25); }
    60% { transform: scale(0.92); }
    80% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  .tab-item .tab-dot {
    position: absolute;
    bottom: 2px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #d97757;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .tab-item.active .tab-dot { opacity: 1; }

  /* === 首页 === */
  .home-hero {
    position: relative;
    padding: 12px 20px 28px;
    background: linear-gradient(180deg, #f5e6d0 0%, #f8f3ea 100%);
    overflow: hidden;
  }
  /* 签名动效：海浪层 */
  .wave-layer {
    position: absolute;
    bottom: -1px;
    left: 0; right: 0;
    height: 60px;
    overflow: hidden;
  }
  .wave-svg {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 200%;
    height: 100%;
    animation: wave-move 8s linear infinite;
  }
  .wave-svg.wave2 {
    animation-duration: 12s;
    animation-direction: reverse;
    opacity: 0.5;
    bottom: -4px;
  }
  @keyframes wave-move {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .home-greeting {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }
  .home-greeting .hi {
    font-size: 22px;
    font-weight: 700;
    color: #4a2c18;
    line-height: 1.3;
  }
  .home-greeting .hi small {
    display: block;
    font-size: 12px;
    font-weight: 400;
    color: #9a7558;
    margin-top: 2px;
  }
  .home-tide-card {
    background: linear-gradient(135deg, #d97757 0%, #e8956a 100%);
    border-radius: 20px;
    padding: 18px;
    color: #fff;
    position: relative;
    overflow: hidden;
    box-shadow: 0 12px 28px -8px rgba(217, 119, 87, 0.5);
  }
  .tide-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .tide-card-header .label {
    font-size: 12px;
    opacity: 0.85;
    letter-spacing: 1px;
  }
  .tide-card-header .location {
    font-size: 11px;
    background: rgba(255,255,255,0.2);
    padding: 3px 8px;
    border-radius: 10px;
  }
  .tide-value {
    font-size: 42px;
    font-weight: 300;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    margin-bottom: 4px;
  }
  .tide-value .unit { font-size: 16px; margin-left: 4px; opacity: 0.8; }
  .tide-desc {
    font-size: 12px;
    opacity: 0.9;
    margin-bottom: 14px;
  }
  .tide-timeline {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 4px;
    height: 40px;
  }
  .tide-bar {
    flex: 1;
    background: rgba(255,255,255,0.3);
    border-radius: 2px;
    transition: height 0.3s ease;
  }
  .tide-bar.now {
    background: #fff;
    position: relative;
  }
  .tide-bar.now::after {
    content: '现在';
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    white-space: nowrap;
    color: rgba(255,255,255,0.9);
  }

  /* 首页功能宫格 */
  .home-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 20px 16px;
  }
  .grid-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .grid-icon {
    width: 48px; height: 48px;
    border-radius: 14px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px -4px rgba(107, 66, 38, 0.15);
    transition: transform 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  .grid-item:hover .grid-icon {
    transform: translateY(-2px);
  }
  .grid-item .grid-label {
    font-size: 11px;
    color: #6b4226;
  }
  .grid-icon .shine {
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    animation: shine-sweep 3s ease-in-out infinite;
  }
  @keyframes shine-sweep {
    0%, 70% { left: -100%; }
    100% { left: 100%; }
  }

  /* 首页发现卡片区 */
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 16px 12px;
  }
  .section-title {
    font-size: 17px;
    font-weight: 700;
    color: #4a2c18;
  }
  .section-title::before {
    content: '';
    display: inline-block;
    width: 3px;
    height: 14px;
    background: #d97757;
    border-radius: 2px;
    margin-right: 8px;
    vertical-align: middle;
  }
  .section-more {
    font-size: 12px;
    color: #9a7558;
    cursor: pointer;
  }
  .section-more::after {
    content: ' ›';
  }

  .discover-list {
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 80px;
  }
  .discover-card {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 2px 12px -4px rgba(107, 66, 38, 0.1);
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    display: flex;
  }
  .discover-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px -6px rgba(107, 66, 38, 0.18);
  }
  .discover-card .card-img {
    width: 100px;
    height: 100px;
    border-radius: 12px;
    margin: 10px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    position: relative;
    overflow: hidden;
  }
  .discover-card .card-body {
    flex: 1;
    padding: 12px 12px 12px 4px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .discover-card .card-title {
    font-size: 15px;
    font-weight: 600;
    color: #2a1f15;
    line-height: 1.4;
  }
  .discover-card .card-meta {
    font-size: 11px;
    color: #9a7558;
    display: flex;
    gap: 10px;
  }
  .discover-card .card-tag {
    display: inline-block;
    font-size: 10px;
    padding: 2px 8px;
    background: #f5e6d0;
    color: #b8744a;
    border-radius: 8px;
    align-self: flex-start;
  }
  .discover-card .card-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* === 图鉴页（左滑列表操作） === */
  .guide-top {
    padding: 8px 16px 12px;
    background: #f8f3ea;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .guide-search {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px -2px rgba(107, 66, 38, 0.08);
  }
  .guide-search input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 14px;
    color: #2a1f15;
    font-family: inherit;
  }
  .guide-search input::placeholder { color: #b8a58d; }

  .filter-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .filter-tabs::-webkit-scrollbar { display: none; }
  .filter-tab {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 16px;
    background: #fff;
    color: #6b4226;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .filter-tab.active {
    background: #d97757;
    color: #fff;
    border-color: #d97757;
  }

  .guide-waterfall {
    columns: 2;
    column-gap: 10px;
    padding: 8px 12px;
    padding-bottom: 80px;
  }
  .guide-item {
    break-inside: avoid;
    margin-bottom: 10px;
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    transition: transform 0.25s ease;
  }
  .guide-item:hover { transform: translateY(-2px); }
  .guide-item .g-img {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    position: relative;
    overflow: hidden;
  }
  .guide-item .g-img .pulse-ring {
    position: absolute;
    top: 50%; left: 50%;
    width: 20px; height: 20px;
    border: 2px solid rgba(255,255,255,0.8);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: pulse-ring 2s ease-out infinite;
  }
  @keyframes pulse-ring {
    0% { width: 20px; height: 20px; opacity: 0.8; }
    100% { width: 80px; height: 80px; opacity: 0; }
  }
  .guide-item .g-info {
    padding: 10px 12px 12px;
  }
  .guide-item .g-name {
    font-size: 14px;
    font-weight: 600;
    color: #2a1f15;
    margin-bottom: 4px;
  }
  .guide-item .g-sub {
    font-size: 11px;
    color: #9a7558;
    margin-bottom: 8px;
  }
  .guide-item .g-tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .guide-item .g-tag {
    font-size: 9px;
    padding: 2px 6px;
    background: #f5e6d0;
    color: #b8744a;
    border-radius: 6px;
  }
  .guide-item .g-rarity {
    position: absolute;
    top: 8px; right: 8px;
    font-size: 10px;
    padding: 2px 8px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(8px);
    border-radius: 10px;
    color: #d97757;
    font-weight: 600;
  }

  /* === 潮汐页 === */
  .tide-page {
    padding-bottom: 80px;
  }
  .tide-week-banner {
    background: linear-gradient(160deg, #c48f50 0%, #d97757 100%);
    color: #fff;
    padding: 20px 20px 24px;
    position: relative;
    overflow: hidden;
  }
  .tide-week-banner::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
  }
  .tide-week-banner::after {
    content: '';
    position: absolute;
    bottom: -30px; left: 20px;
    width: 80px; height: 80px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
  }
  .tide-date {
    font-size: 14px;
    opacity: 0.9;
    margin-bottom: 10px;
  }
  .tide-big {
    font-size: 36px;
    font-weight: 300;
    line-height: 1;
    margin-bottom: 6px;
    font-variant-numeric: tabular-nums;
  }
  .tide-big span { font-size: 16px; opacity: 0.8; }
  .tide-week-days {
    display: flex;
    justify-content: space-between;
    padding: 16px 12px 0;
    position: relative;
    z-index: 1;
  }
  .week-day {
    text-align: center;
    font-size: 11px;
    cursor: pointer;
    padding: 6px 6px;
    border-radius: 10px;
    color: rgba(255,255,255,0.8);
    transition: all 0.2s ease;
    position: relative;
  }
  .week-day .d-num {
    font-size: 16px;
    font-weight: 600;
    margin: 2px 0;
  }
  .week-day.active {
    background: rgba(255,255,255,0.2);
    color: #fff;
  }
  .week-day.active .d-dot {
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #fff;
  }

  .tide-detail-section {
    padding: 16px;
  }
  .tide-info-card {
    background: #fff;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 2px 12px -4px rgba(107, 66, 38, 0.08);
    margin-bottom: 12px;
  }
  .tide-info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 0.5px solid #f0e6d5;
  }
  .tide-info-row:last-child { border-bottom: none; }
  .tide-info-row .label {
    font-size: 13px;
    color: #8b6242;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tide-info-row .value {
    font-size: 14px;
    color: #2a1f15;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .tide-info-row .value.up { color: #c48f50; }
  .tide-info-row .value.down { color: #5a7a6e; }

  /* 潮汐波浪大图表 */

  .detail-latin {

  .detail-section {

  .detail-bottom-bar {

    transition: transform 0.15s ease;
  }
  .bottom-main-btn:active { transform: scale(0.97); }

  /* === 个人中心（环形进度 + 宫格） === */
  .profile-hero {
    background: linear-gradient(160deg, #5a7a6e 0%, #4a655a 100%);
    padding: 24px 20px 40px;
    position: relative;
    color: #fff;

    content: '';

    border-radius: 50%;
    background: rgba(255,255,255,0.05);
  }
  .profile-hero::after {
    content: '';
    position: absolute;
    bottom: -80px; left: -30px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);

  .profile-top {

    align-items: center;
    gap: 14px;
    position: relative;
    z-index: 1;
  }
  .profile-avatar {
    width: 64px; height: 64px;

  .profile-info .name {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;

  .profile-info .level {
    font-size: 11px;

    margin-top: 20px;

  }
  .profile-stat {
    text-align: center;
  }
  .profile-stat .num {
    font-size: 20px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .profile-stat .lab {
    font-size: 11px;
    opacity: 0.8;
    margin-top: 2px;
  }

  /* 成就环形进度 */
  .achievement-section {
    margin: -20px 16px 0;

    padding: 18px;

    z-index: 2;
  }
  .achievement-title {
    font-size: 15px;
    font-weight: 700;

    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .achievement-title .more { font-size: 11px; color: #9a7558; font-weight: 400; cursor: pointer; }
  .achievement-rings {
    display: flex;
    justify-content: space-around;
  }
  .ring-item {
    text-align: center;
    position: relative;
  }
  .ring-svg {
    width: 60px; height: 60px;
    transform: rotate(-90deg);
  }
  .ring-bg { stroke: #f0e6d5; fill: none; stroke-width: 5; }
  .ring-fill {
    stroke: #d97757;
    fill: none;
    stroke-width: 5;
    stroke-linecap: round;
    stroke-dasharray: 157;
    stroke-dashoffset: 157;
    transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .ring-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);

    font-weight: 700;
    color: #d97757;
    font-variant-numeric: tabular-nums;
  }
  .ring-label {
    font-size: 11px;
    color: #6b4226;
    margin-top: 6px;
  }

  /* 宫格菜单 */
  .profile-menu-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px 8px;
    padding: 20px 12px;
  }
  .profile-menu-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .profile-menu-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    box-shadow: 0 2px 8px -2px rgba(107, 66, 38, 0.1);
  }
  .profile-menu-label {
    font-size: 11px;
    color: #6b4226;
  }

  /* === 发布页（表单 + 底部安全区主按钮） === */
  .publish-page {
    padding-bottom: 100px;
  }
  .publish-upload {
    margin: 12px 16px;
    background: #fff;
    border-radius: 14px;
    padding: 16px;
  }
  .upload-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .upload-slot {
    aspect-ratio: 1;
    border-radius: 10px;
    background: #f5e6d0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    position: relative;
    overflow: hidden;
  }
  .upload-slot.add {
    border: 2px dashed #d9bd94;
    background: transparent;
    color: #b8744a;
    cursor: pointer;
    font-size: 24px;
  }
  .upload-label {
    font-size: 13px;
    color: #6b4226;
    margin-bottom: 12px;
    font-weight: 500;
  }

  .publish-form {
    margin: 12px 16px;
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
  }
  .form-row {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 0.5px solid #f0e6d5;
    gap: 12px;
  }

  .form-row .label {
    font-size: 14px;
    color: #4a2c18;
    width: 80px;
    flex-shrink: 0;
    font-weight: 500;
  }
  .form-row .input-wrap {
    flex: 1;
    position: relative;
  }
  .form-row input,
  .form-row select,
  .form-row textarea {
    width: 100%;

    font-size: 14px;
    color: #2a1f15;

  .form-row input::placeholder,

  .form-row .arrow { color: #c4b59c; font-size: 14px; }
  .form-row.tag-row {

  .form-row.tag-row .label { width: 100%; margin-bottom: 4px; }
  .tag-chip {
    padding: 5px 12px;
    background: #f5e6d0;
    color: #8b6242;
    border-radius: 14px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .tag-chip.selected {
    background: #d97757;
    color: #fff;
  }

  .publish-location {
    margin: 12px 16px;
    background: #fff;
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;

  .publish-location .loc-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: #f5e6d0;
    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 13px;
    color: #4a2c18;
  }
  .publish-location .loc-sub {
    font-size: 11px;
    color: #9a7558;

  }

  /* === 骨架屏 === */
  .skeleton {
    background: linear-gradient(90deg, #f0e6d5 25%, #f5ede0 50%, #f0e6d5 75%);
    background-size: 200% 100%;
    animation: skeleton-sweep 1.5s ease-in-out infinite;
    border-radius: 8px;
  }
  @keyframes skeleton-sweep {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* === 半屏弹层（ActionSheet） === */
  .sheet-mask {
    position: absolute;
    inset: 0;
    background: rgba(42, 31, 21, 0.4);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .sheet-mask.open {
    opacity: 1;
    pointer-events: auto;
  }
  .action-sheet {
    position: absolute;
    bottom: 0;
    left: 0; right: 0;
    background: #f8f3ea;
    border-radius: 20px 20px 0 0;
    padding: 8px 12px 20px;
    z-index: 201;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .action-sheet.open {
    transform: translateY(0);
  }
  .sheet-handle {
    width: 36px; height: 4px;
    background: #d4c5a8;
    border-radius: 2px;
    margin: 8px auto 12px;
  }
  .sheet-title {
    text-align: center;
    font-size: 13px;
    color: #9a7558;
    margin-bottom: 12px;
  }
  .sheet-item {
    padding: 14px;
    text-align: center;
    font-size: 15px;
    color: #2a1f15;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s ease;
    background: #fff;
    margin-bottom: 6px;
  }
  .sheet-item:hover { background: #f5e6d0; }
  .sheet-item.danger { color: #d97757; }
  .sheet-item.cancel {
    margin-top: 6px;
    font-weight: 500;
  }

  /* === 下拉刷新 === */
  .pull-refresh {
    position: absolute;
    top: -40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #9a7558;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    z-index: 5;
  }
  .pull-icon {
    width: 18px; height: 18px;
    border: 2px solid #d9bd94;
    border-top-color: #d97757;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* === 设计规范页 === */
  .spec-page {
    padding-bottom: 80px;
  }
  .spec-hero {
    padding: 20px;
    background: linear-gradient(135deg, #4a2c18, #6b4226);
    color: #fff;
  }
  .spec-hero h2 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  }

  .swatch-hex {

  }
  .icon-item .ic-name {
    font-size: 9px;
    color: #9a7558;

    align-items: center;
    gap: 8px;

  }
  .spacing-bar {
    height: 28px;
    background: linear-gradient(90deg, #d97757, #e8956a);

    align-items: center;

    font-size: 10px;

  .spacing-label {
    font-size: 11px;
    color: #6b4226;

  /* === 接口文档页 === */
  .api-page {
    padding-bottom: 80px;
  }

    background: linear-gradient(135deg, #5a7a6e, #3d554d);

    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;

    font-size: 12px;
    opacity: 0.7;

  .api-body .n { color: #c48f50; }

    const [val, setVal] = useState(0);

      if (!trigger) return;
      let start = null;
      let raf;
      const step = (ts) => {
        if (!start) start = ts;
        const p = Math.min((ts - start) / duration, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        setVal(Math.round(target * eased));
        if (p < 1) raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
      return () => cancelAnimationFrame(raf);
    }, [target, duration, trigger]);
    return val;
  }

      let ticking = false;

        if (!ticking) {
          requestAnimationFrame(() => {
            setScrollY(el.scrollTop);
            ticking = false;
          });
          ticking = true;

      el.addEventListener('scroll', onScroll, { passive: true });
      return () => el.removeEventListener('scroll', onScroll);

            <div className="s-lab">平均响应</div>
          </div>
        </div>

        {apis.map((api, i) => (
          <div key={i} className="api-section">
            <div className="api-header" onClick={() => setOpenIndex(openIndex === i ? -1 : i)}>
              <span className={`api-method ${methodClass[api.method]}`}>{api.method}</span>
              <span className="api-path">{api.path}</span>
              <span className={`api-arrow ${openIndex === i ? 'open' : ''}`}>▼</span>
            </div>
            {openIndex === i && (
              <div className="api-body open">
                <div style={{color:'#8b6242',marginBottom:6}}>// {api.desc}</div>
                <div>Response:</div>
                <pre style={{margin:0,fontFamily:'inherit',whiteSpace:'pre-wrap'}} dangerouslySetInnerHTML={{__html: api.response}}></pre>
              </div>
            )}
          </div>
        ))}

        <div style={{padding:'12px 12px 20px',fontSize:11,color:'#9a7558',textAlign:'center'}}>
          Base URL: api.tide-zone.example.com<br/>
          所有接口需携带 token 鉴权
        </div>
      </div>
    );
  }

  // ==================== 主应用 ====================
  function App() {
    const [currentPage, setCurrentPage] = useState('home');
    const [navTitle, setNavTitle] = useState('潮间带');
    const [pageStack, setPageStack] = useState(['home']);
    const [transition, setTransition] = useState('push');
    const [sheetOpen, setSheetOpen] = useState(false);
    const [isTabBar, setIsTabBar] = useState(true);
    const [pullDistance, setPullDistance] = useState(0);
    const [isRefreshing, setIsRefreshing] = useState(false);
    const pageContainerRef = useRef(null);
    const touchStartY = useRef(0);
    const rafRef = useRef(null);

    const NAV_TITLES = {
      home: '潮间带',
      guide: '生物图鉴',
      tide: '潮汐预报',
      profile: '我的',
      publish: '发布记录',
      detail: '物种详情',
      spec: '设计规范',
      api: '接口文档',
    };

    const TAB_PAGES = ['home', 'guide', 'tide', 'profile'];
    const MODAL_PAGES = ['detail', 'publish'];

    const navigate = useCallback((page) => {
      if (page === currentPage) return;
      setTransition('push');
      setCurrentPage(page);
      setNavTitle(NAV_TITLES[page] || '');
      setPageStack(prev => [...prev, page]);
      setIsTabBar(TAB_PAGES.includes(page));

      // 更新侧导航
      document.querySelectorAll('.page-nav button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.page === page);
      });
    }, [currentPage]);

    const goBack = useCallback(() => {
      if (pageStack.length <= 1) return;
      setTransition('pop');
      const newStack = pageStack.slice(0, -1);
      const prevPage = newStack[newStack.length - 1];
      setCurrentPage(prevPage);
      setNavTitle(NAV_TITLES[prevPage] || '');
      setPageStack(newStack);
      setIsTabBar(TAB_PAGES.includes(prevPage));

      document.querySelectorAll('.page-nav button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.page === prevPage);
      });
    }, [pageStack]);

    // Tab 切换
    useEffect(() => {
      const tabs = document.querySelectorAll('.tab-item');
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          const page = tab.dataset.tab;
          if (TAB_PAGES.includes(page)) {
            setTransition('tab');
            setCurrentPage(page);
            setNavTitle(NAV_TITLES[page]);
            setPageStack([page]);
            setIsTabBar(true);
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            document.querySelectorAll('.page-nav button').forEach(btn => {
              btn.classList.toggle('active', btn.dataset.page === page);
            });
          }
        });
      });
    }, []);

    // 侧导航点击
    useEffect(() => {
      const navBtns = document.querySelectorAll('.page-nav button');
      navBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const page = btn.dataset.page;
          setTransition('push');
          setCurrentPage(page);
          setNavTitle(NAV_TITLES[page] || '');
          setPageStack([page]);
          setIsTabBar(TAB_PAGES.includes(page));

          // 同步 tab-bar
          document.querySelectorAll('.tab-item').forEach(t => {
            t.classList.toggle('active', t.dataset.tab === page);
          });
          navBtns.forEach(b => b.classList.toggle('active', b.dataset.page === page));
        });
      });
    }, []);

    // Action Sheet 逻辑
    useEffect(() => {
      const mask = document.getElementById('sheetMask');
      const sheet = document.getElementById('actionSheet');
      const cancel = document.getElementById('sheetCancel');
      mask?.addEventListener('click', () => {
        mask.classList.remove('open');
        sheet.classList.remove('open');
        setSheetOpen(false);
      });
      cancel?.addEventListener('click', () => {
        mask.classList.remove('open');
        sheet.classList.remove('open');
        setSheetOpen(false);
      });
    }, []);

    // 长按列表项弹 ActionSheet
    useEffect(() => {
      const timer = setTimeout(() => {
        const cards = document.querySelectorAll('.discover-card');
        cards.forEach((card, i) => {
          let pressTimer;
          card.addEventListener('touchstart', () => {
            pressTimer = setTimeout(() => {
              document.getElementById('sheetMask').classList.add('open');
              document.getElementById('actionSheet').classList.add('open');
              setSheetOpen(true);
            }, 600);
          });
          card.addEventListener('touchend', () => clearTimeout(pressTimer));
          card.addEventListener('touchmove', () => clearTimeout(pressTimer));
        });
      }, 500);
      return () => clearTimeout(timer);
    }, [currentPage]);

    // 下拉刷新
    useEffect(() => {
      const container = document.querySelector('.page');
      if (!container) return;

      const onTouchStart = (e) => {
        if (container.scrollTop <= 0) {
          touchStartY.current = e.touches ? e.touches[0].clientY : e.clientY;
        }
      };
      const onTouchMove = (e) => {
        if (container.scrollTop <= 0) {
          const y = e.touches ? e.touches[0].clientY : e.clientY;
          const diff = y - touchStartY.current;
          if (diff > 0 && diff < 80) {
            if (rafRef.current) cancelAnimationFrame(rafRef.current);
            rafRef.current = requestAnimationFrame(() => {
              setPullDistance(diff);
            });
          }
        }
      };
      const onTouchEnd = () => {
        if (pullDistance > 50) {
          setIsRefreshing(true);
          setTimeout(() => {
            setIsRefreshing(false);
            setPullDistance(0);
          }, 1500);
        } else {
          setPullDistance(0);
        }
      };

      container.addEventListener('touchstart', onTouchStart, { passive: true });
      container.addEventListener('touchmove', onTouchMove, { passive: true });
      container.addEventListener('touchend', onTouchEnd, { passive: true });
      // 鼠标模拟
      let isDown = false;
      const onMouseDown = (e) => {
        if (container.scrollTop <= 0) { isDown = true; touchStartY.current = e.clientY; }
      };
      const onMouseMove = (e) => {
        if (!isDown) return;
        const diff = e.clientY - touchStartY.current;
        if (diff > 0 && diff < 80) {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          rafRef.current = requestAnimationFrame(() => setPullDistance(diff));
        }
      };
      const onMouseUp = () => {
        if (!isDown) return;
        isDown = false;
        if (pullDistance > 50) {
          setIsRefreshing(true);
          setTimeout(() => { setIsRefreshing(false); setPullDistance(0); }, 1500);
        } else {
          setPullDistance(0);
        }
      };
      container.addEventListener('mousedown', onMouseDown);
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);

      return () => {
        container.removeEventListener('touchstart', onTouchStart);
        container.removeEventListener('touchmove', onTouchMove);
        container.removeEventListener('touchend', onTouchEnd);
        container.removeEventListener('mousedown', onMouseDown);
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      };
    }, [currentPage, pullDistance]);

    // visibilitychange 暂停动画
    useEffect(() => {
      const onVisibility = () => {
        if (document.hidden) {
          document.querySelectorAll('.wave-svg, .shine, .pulse-ring, .fab-btn, .profile-avatar::after').forEach(el => {
            el.style.animationPlayState = 'paused';
          });
        } else {
          document.querySelectorAll('.wave-svg, .shine, .pulse-ring, .fab-btn, .profile-avatar::after').forEach(el => {
            el.style.animationPlayState = 'running';
          });
        }
      };
      document.addEventListener('visibilitychange', onVisibility);
      return () => document.removeEventListener('visibilitychange', onVisibility);
    }, []);

    // 3D 倾斜卡片
    useEffect(() => {
      const card = document.querySelector('.home-tide-card');
      if (!card) return;
      let rafId;
      const onMove = (e) => {
        const rect = card.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;
        if (rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(() => {
          card.style.transform = `perspective(800px) rotateY(${x * 8}deg) rotateX(${-y * 6}deg)`;
        });
      };
      const onLeave = () => {
        if (rafId) cancelAnimationFrame(rafId);
        card.style.transform = '';
      };
      card.addEventListener('mousemove', onMove);
      card.addEventListener('mouseleave', onLeave);
      return () => {
        card.removeEventListener('mousemove', onMove);
        card.removeEventListener('mouseleave', onLeave);
        if (rafId) cancelAnimationFrame(rafId);
      };
    }, [currentPage]);

    // 渲染页面
    const renderPage = () => {
      switch (currentPage) {
        case 'home': return <HomePage onNavigate={navigate} />;
        case 'guide': return <GuidePage onNavigate={navigate} />;
        case 'tide': return <TidePage />;
        case 'profile': return <ProfilePage />;
        case 'publish': return <PublishPage onNavigate={navigate} />;
        case 'detail': return <DetailPage onBack={goBack} />;
        case 'spec': return <SpecPage />;
        case 'api': return <ApiPage />;
        default: return <HomePage onNavigate={navigate} />;
      }
    };

    return (
      <>
        <div className="page-container" ref={pageContainerRef} style={{
          transform: `translateY(${pullDistance * 0.5}px)`,
          transition: isRefreshing ? 'none' : 'transform 0.3s ease'
        }}>
          {(pullDistance > 0 || isRefreshing) && (
            <div className="pull-refresh">
              {isRefreshing ? (
                <>
                  <div className="pull-icon"></div>
                  <span>刷新中...</span>
                </>
              ) : (
                <span>{pullDistance > 50 ? '松开刷新' : '下拉刷新'}</span>
              )}
            </div>
          )}
          {renderPage()}
        </div>
        <style>{`
          .tab-bar { display: ${isTabBar ? 'flex' : 'none'}; }
        `}</style>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('pageContainer').parentNode.appendChild(document.createElement('div'))).render(<App />);

  // ==================== 自定义光标 ====================
  (function() {
    const cursor = document.getElementById('customCursor');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let cursorX = mouseX;
    let cursorY = mouseY;
    let rafId;
    let isVisible = false;

    // 初始位置
    cursor.style.left = mouseX + 'px';
    cursor.style.top = mouseY + 'px';

    function onMouseMove(e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
      if (!isVisible) {
        isVisible = true;
        cursor.style.opacity = '1';
      }
    }

    function animate() {
      cursorX += (mouseX - cursorX) * 0.2;
      cursorY += (mouseY - cursorY) * 0.2;
      cursor.style.left = cursorX + 'px';
      cursor.style.top = cursorY + 'px';
      rafId = requestAnimationFrame(animate);
    }
    animate();

    document.addEventListener('mousemove', onMouseMove);

    // 悬停检测
    let hoverRaf;
    function checkHover() {
      const el = document.elementFromPoint(mouseX, mouseY);
      if (el && el.closest('button, .tab-item, .grid-item, .discover-card, .guide-item, .filter-tab, .fab-btn, .bottom-action-btn, .bottom-main-btn, .sheet-item, .week-day, .profile-menu-item, .upload-slot.add, .tag-chip, .api-header, .section-more, .tide-tip')) {
        cursor.classList.add('cursor-hover');
      } else {
        cursor.classList.remove('cursor-hover');
      }
    }
    document.addEventListener('mousemove', () => {
      if (hoverRaf) cancelAnimationFrame(hoverRaf);
      hoverRaf = requestAnimationFrame(checkHover);
    });

    // 点击涟漪
    document.addEventListener('click', (e) => {
      const ripple = document.createElement('div');
      ripple.className = 'cursor-ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    });

    // visibilitychange
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        cancelAnimationFrame(rafId);
      } else {
        animate();
      }
    });

    // reduced-motion
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      cursor.style.transition = 'none';
    }
  })();

  // 升级为全栈应用宣告
  function announceUpgrade() {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  }
  announceUpgrade();
  if (document.readyState !== 'complete')
    window.addEventListener('load', announceUpgrade, { once: true });
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<meta name="creative-medium" content="interactive-prototype" />
<title>SKYLINE 滑板志 — 街头滑板文化 App</title>

<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Space+Grotesk:wght@400;500;600;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&display=swap" />

<style>
  :root {
    --asphalt: #23262B;
    --asphalt-2: #1A1D21;
    --asphalt-3: #2D3138;
    --asphalt-4: #3A3F47;
    --neon-orange: #FF6B1A;
    --neon-orange-dim: #E05A10;
    --fog-white: #F5F3EF;
    --fog-white-dim: #D9D7D0;
    --electric-yellow: #FFD21F;
    --electric-yellow-dim: #E6BC1C;
    --cement: #8B8F97;
    --cement-light: #B4B8BF;
    --cement-dark: #5A5E66;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    background: #0E0F12;
    color: var(--fog-white);
    user-select: none;
  }

  .app-wrapper {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,107,26,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(255,210,31,0.05) 0%, transparent 50%),
      #0E0F12;
    position: relative;
    overflow: hidden;
  }

  /* Custom cursor */
  .custom-cursor {
    position: fixed;
    width: 32px; height: 32px;
    border: 2px solid var(--fog-white);
    border-radius: 50%;
    pointer-events: none;
    z-index: 99999;
    transform: translate(-50%, -50%);
    transition: width 0.25s cubic-bezier(0.34,1.56,0.64,1),
                height 0.25s cubic-bezier(0.34,1.56,0.64,1),
                border-color 0.2s ease,
                background 0.2s ease;
    mix-blend-mode: difference;
    will-change: transform, width, height;
  }
  .custom-cursor::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 5px; height: 5px;
    background: var(--neon-orange);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px var(--neon-orange), 0 0 16px rgba(255,107,26,0.5);
  }
  .custom-cursor::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 14px; height: 14px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .custom-cursor.hover {
    width: 54px; height: 54px;
    border-color: var(--neon-orange);
    background: rgba(255,107,26,0.1);
  }
  .custom-cursor.click {
    width: 20px; height: 20px;
    border-color: var(--electric-yellow);
  }

  .cursor-ripple {
    position: fixed;
    border: 2px solid var(--neon-orange);
    border-radius: 50%;
    pointer-events: none;
    z-index: 99998;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0.8;
    animation: rippleExpand 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes rippleExpand {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0.8; }
    100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
  }

  /* Ambient particles */
  .particle {
    position: fixed;
    width: 2px; height: 2px;
    background: var(--electric-yellow);
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
    opacity: 0;
    animation: particleFloat linear infinite;
  }
  @keyframes particleFloat {
    0% { transform: translateY(100vh) translateX(0); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.4; }
    100% { transform: translateY(-10vh) translateX(30px); opacity: 0; }
  }

  /* Phone frame area */
  .phone-container {
    display: flex; align-items: center; justify-content: center;
    gap: 60px;
    padding: 40px;
    position: relative;
    z-index: 2;
  }

  .brand-marks {
    position: absolute;
    top: 40px; left: 40px;
    display: flex; flex-direction: column; gap: 6px;
    z-index: 10;
  }
  .brand-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 4px;
    color: var(--fog-white);
  }
  .brand-subtitle {
    font-size: 11px;
    color: var(--cement-light);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .page-indicator {
    position: absolute;
    bottom: 40px; left: 40px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 10;
  }
  .page-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--asphalt-4);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .page-dot.active {
    background: var(--neon-orange);
    width: 8px; height: 24px;
    border-radius: 4px;
    box-shadow: 0 0 12px rgba(255,107,26,0.6);
  }
  .page-dot:hover {
    background: var(--electric-yellow);
    transform: scale(1.3);
  }

  /* Android device overrides */
  .android-frame-outer {
    filter: drop-shadow(0 40px 80px rgba(0,0,0,0.5));
  }

  .device-screen-content {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--asphalt-2);
  }

  /* Page transition */
  .page {
    position: absolute;
    inset: 0;
    overflow: hidden;
    transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.3s ease;
  }
  .page.entering-right { transform: translateX(100%); opacity: 0; }
  .page.entering-left { transform: translateX(-100%); opacity: 0; }
  .page.active { transform: translateX(0); opacity: 1; z-index: 2; }
  .page.exiting-right { transform: translateX(30%); opacity: 0; z-index: 1; }
  .page.exiting-left { transform: translateX(-30%); opacity: 0; z-index: 1; }

  /* Status bar spacer */
  .status-spacer { height: 32px; }

  /* ===== PAGE 1: HOME / DISCOVER ===== */
  .home-page {
    background: var(--asphalt-2);
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none;
  }
  .home-page::-webkit-scrollbar { display: none; }

  .home-hero {
    position: relative;
    height: 420px;
    overflow: hidden;
  }
  .home-hero-img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scale(1.05);
    will-change: transform;
  }
  .home-hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom,
      rgba(26,29,33,0.2) 0%,
      rgba(26,29,33,0.1) 40%,
      rgba(26,29,33,0.8) 80%,
      var(--asphalt-2) 100%);
  }
  .home-hero-content {
    position: absolute;
    bottom: 24px; left: 20px; right: 20px;
    z-index: 2;
  }
  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 10px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--electric-yellow);
    margin-bottom: 10px;
  }
  .hero-eyebrow::before {
    content: '';
    width: 20px; height: 2px;
    background: var(--electric-yellow);
  }
  .hero-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    line-height: 1;
    letter-spacing: 2px;
    color: var(--fog-white);
    margin-bottom: 8px;
  }
  .hero-subtitle {
    font-size: 13px;
    color: var(--fog-white-dim);
    line-height: 1.5;
    max-width: 280px;
  }
  .hero-meta {
    display: flex; align-items: center; gap: 16px;
    margin-top: 14px;
  }
  .hero-stat {
    display: flex; flex-direction: column; gap: 2px;
  }
  .hero-stat-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--neon-orange);
    letter-spacing: 1px;
  }
  .hero-stat-label {
    font-size: 9px;
    color: var(--cement-light);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  /* Top bar */
  .top-bar {
    position: absolute;
    top: 32px; left: 0; right: 0;
    padding: 12px 20px;
    display: flex; align-items: center; justify-content: space-between;
    z-index: 10;
  }
  .logo-mark {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 3px;
    color: var(--fog-white);
  }
  .logo-mark span { color: var(--neon-orange); }
  .top-actions {
    display: flex; align-items: center; gap: 12px;
  }
  .icon-btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .icon-btn:hover {
    background: rgba(255,107,26,0.2);
    border-color: var(--neon-orange);
    transform: scale(1.1);
  }
  .icon-btn svg { width: 18px; height: 18px; stroke: var(--fog-white); fill: none; stroke-width: 1.8; }

  /* Section header */
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 20px 12px;
  }
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--fog-white);
  }
  .section-title em {
    font-style: normal;
    color: var(--neon-orange);
  }
  .section-more {
    font-size: 11px;
    color: var(--cement-light);
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.2s;
  }
  .section-more:hover { color: var(--neon-orange); }

  /* Trending spots horizontal scroll */
  .spots-scroll {
    display: flex; gap: 12px;
    padding: 0 20px 4px;
    overflow-x: auto;
    scrollbar-width: none;
    scroll-snap-type: x mandatory;
  }
  .spots-scroll::-webkit-scrollbar { display: none; }

  .spot-card {
    flex: 0 0 180px;
    height: 240px;
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    scroll-snap-align: start;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .spot-card:hover {
    transform: translateY(-4px) scale(1.02);
  }
  .spot-card-img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
  }
  .spot-card:hover .spot-card-img { transform: scale(1.08); }
  .spot-card-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(26,29,33,0.95) 0%, rgba(26,29,33,0.2) 50%, transparent 100%);
  }
  .spot-card-content {
    position: absolute;
    bottom: 14px; left: 12px; right: 12px;
  }
  .spot-badge {
    display: inline-block;
    padding: 3px 8px;
    background: var(--neon-orange);
    color: var(--asphalt-2);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-radius: 4px;
    margin-bottom: 8px;
  }
  .spot-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--fog-white);
    margin-bottom: 4px;
    line-height: 1.2;
  }
  .spot-meta {
    display: flex; align-items: center; gap: 8px;
    font-size: 10px;
    color: var(--cement-light);
  }
  .spot-rating {
    display: flex; align-items: center; gap: 2px;
    color: var(--electric-yellow);
    font-weight: 600;
  }
  .spot-rating svg { width: 10px; height: 10px; fill: var(--electric-yellow); }

  /* Tricks of the day - grid */
  .tricks-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding: 0 20px;
  }
  .trick-card {
    position: relative;
    height: 110px;
    border-radius: 12px;
    overflow: hidden;
    background: var(--asphalt-3);
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .trick-card:hover {
    transform: scale(1.03);
    box-shadow: 0 8px 24px rgba(255,107,26,0.2);
  }
  .trick-card .trick-bg {
    position: absolute;
    right: -15px; top: 50%;
    transform: translateY(-50%) rotate(-15deg);
    width: 80px; height: 80px;
    opacity: 0.15;
  }
  .trick-card-info {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    z-index: 2;
  }
  .trick-level {
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--electric-yellow);
    margin-bottom: 4px;
    font-weight: 700;
  }
  .trick-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--fog-white);
    margin-bottom: 4px;
  }
  .trick-diff {
    display: flex; gap: 2px;
  }
  .trick-diff-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--asphalt-4);
  }
  .trick-diff-dot.active { background: var(--neon-orange); }

  /* Activity feed section */
  .activity-list {
    padding: 0 20px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .activity-item {
    display: flex; gap: 12px;
    padding: 12px;
    background: var(--asphalt-3);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    border: 1px solid transparent;
  }
  .activity-item:hover {
    border-color: rgba(255,107,26,0.3);
    transform: translateX(4px);
  }
  .activity-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    position: relative;
  }
  .activity-avatar img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .activity-avatar.online::after {
    content: '';
    position: absolute;
    bottom: 2px; right: 2px;
    width: 10px; height: 10px;
    background: #34D399;
    border-radius: 50%;
    border: 2px solid var(--asphalt-3);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(52,211,153,0.4); }
    50% { box-shadow: 0 0 0 4px rgba(52,211,153,0); }
  }
  .activity-content { flex: 1; min-width: 0; }
  .activity-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--fog-white);
    margin-bottom: 2px;
  }
  .activity-name em {
    font-style: normal;
    color: var(--neon-orange);
  }
  .activity-text {
    font-size: 11px;
    color: var(--cement-light);
    line-height: 1.4;
  }
  .activity-time {
    font-size: 10px;
    color: var(--cement-dark);
    margin-top: 4px;
  }

  /* Bottom nav */
  .bottom-nav {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 72px;
    background: rgba(26,29,33,0.9);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: space-around;
    padding: 0 8px 14px;
    z-index: 100;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 12px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
    position: relative;
  }
  .nav-item svg {
    width: 22px; height: 22px;
    stroke: var(--cement);
    fill: none;
    stroke-width: 1.8;
    transition: all 0.25s ease;
  }
  .nav-item.active svg {
    stroke: var(--neon-orange);
    filter: drop-shadow(0 0 6px rgba(255,107,26,0.6));
  }
  .nav-label {
    font-size: 9px;
    color: var(--cement);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    font-weight: 600;
    transition: color 0.25s ease;
  }
  .nav-item.active .nav-label { color: var(--neon-orange); }
  .nav-item.active { transform: translateY(-2px); }
  .nav-indicator {
    position: absolute;
    top: 2px;
    width: 4px; height: 4px;
    background: var(--neon-orange);
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .nav-item.active .nav-indicator { opacity: 1; }

  /* ===== PAGE 2: SPOTS (Map / List) ===== */
  .spots-page {
    background: var(--asphalt-2);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .spots-map-area {
    flex: 1;
    position: relative;
    background:
      linear-gradient(135deg, var(--asphalt-3) 0%, var(--asphalt-2) 100%);
    overflow: hidden;
  }
  .spots-map-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 30px 30px;
  }
  .spots-map-roads {
    position: absolute; inset: 0;
  }
  .map-road {
    position: absolute;
    background: var(--asphalt-4);
    border-radius: 2px;
  }
  .map-road.h { height: 6px; }
  .map-road.v { width: 6px; }

  .map-pin {
    position: absolute;
    transform: translate(-50%, -100%);
    cursor: pointer;
    z-index: 5;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .map-pin:hover { transform: translate(-50%, -100%) scale(1.2); }
  .map-pin-body {
    width: 32px; height: 32px;
    background: var(--neon-orange);
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(255,107,26,0.4);
  }
  .map-pin-body span {
    transform: rotate(45deg);
    font-size: 11px;
    font-weight: 700;
    color: var(--asphalt-2);
  }
  .map-pin.featured .map-pin-body {
    background: var(--electric-yellow);
    box-shadow: 0 4px 16px rgba(255,210,31,0.5);
    width: 40px; height: 40px;
  }
  .map-pin.featured {
    animation: pinBounce 2s ease-in-out infinite;
  }
  @keyframes pinBounce {
    0%, 100% { transform: translate(-50%, -100%) translateY(0); }
    50% { transform: translate(-50%, -100%) translateY(-6px); }
  }

  .spots-search-bar {
    position: absolute;
    top: 52px; left: 16px; right: 16px;
    height: 44px;
    background: rgba(26,29,33,0.9);
    backdrop-filter: blur(20px);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; gap: 10px;
    padding: 0 14px;
    z-index: 10;
  }
  .spots-search-bar svg {
    width: 18px; height: 18px;
    stroke: var(--cement-light);
    fill: none; stroke-width: 1.8;
  }
  .spots-search-bar input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--fog-white);
    font-size: 13px;
    font-family: inherit;
  }
  .spots-search-bar input::placeholder { color: var(--cement); }

  .spots-filter-row {
    position: absolute;
    top: 110px; left: 16px; right: 16px;
    display: flex; gap: 8px;
    z-index: 10;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .spots-filter-row::-webkit-scrollbar { display: none; }
  .filter-chip {
    flex-shrink: 0;
    padding: 7px 14px;
    background: rgba(26,29,33,0.8);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    font-size: 11px;
    color: var(--cement-light);
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
    font-weight: 500;
  }
  .filter-chip.active {
    background: var(--neon-orange);
    border-color: var(--neon-orange);
    color: var(--asphalt-2);
    font-weight: 700;
  }
  .filter-chip:hover { transform: scale(1.05); }

  .spots-bottom-sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: var(--asphalt-2);
    border-radius: 24px 24px 0 0;
    padding: 8px 0 0;
    z-index: 20;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.4);
    transform: translateY(calc(100% - 220px));
    transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .spots-bottom-sheet.expanded { transform: translateY(80px); }
  .sheet-handle {
    width: 40px; height: 4px;
    background: var(--asphalt-4);
    border-radius: 2px;
    margin: 0 auto 12px;
    cursor: pointer;
    transition: background 0.2s;
  }

// ===================== CUSTOM CURSOR =====================
function CustomCursor() {
  const cursorRef = useRef(null);
  const [hovering, setHovering] = useState(false);
  const reducedMotion = useMemo(() => {
    if (typeof window !== 'undefined' && window.matchMedia) {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
    return false;
  }, []);

  useEffect(() => {
    if (reducedMotion) return;

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let cursorX = mouseX;
    let cursorY = mouseY;
    let rafId = null;
    let visible = false;

    // Initialize at center
    if (cursorRef.current) {
      cursorRef.current.style.left = mouseX + 'px';
      cursorRef.current.style.top = mouseY + 'px';
      cursorRef.current.style.opacity = '0';
    }

    const animate = () => {
      // Spring physics
      const dx = mouseX - cursorX;
      const dy = mouseY - cursorY;
      cursorX += dx * 0.2;
      cursorY += dy * 0.2;

      if (cursorRef.current) {
        cursorRef.current.style.left = cursorX + 'px';
        cursorRef.current.style.top = cursorY + 'px';
      }
      rafId = requestAnimationFrame(animate);
    };

    const handleMove = (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      if (!visible && cursorRef.current) {
        cursorRef.current.style.opacity = '1';
        visible = true;
      }
    };

    const handleMouseOver = (e) => {
      const target = e.target;
      if (target.closest && target.closest('button, .icon-btn, .nav-item, .filter-chip, .trick-card, .spot-card, .activity-item, .sheet-item, .trick-list-item, .gear-card, .feed-action, .story-ring, .achievement-item, .color-swatch, .api-endpoint, .fab, .profile-btn, .profile-stat, .gear-cat, .trick-tab, .profile-tab, .api-endpoint-group, .section-more, .gear-featured, .sheet-handle')) {
        setHovering(true);
      } else {
        setHovering(false);
      }
    };

    const handleClick = (e) => {
      // Ripple effect
      const ripple = document.createElement('div');
      ripple.className = 'cursor-ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);

      // Click state
      if (cursorRef.current) {
        cursorRef.current.classList.add('click');
        setTimeout(() => cursorRef.current?.classList.remove('click'), 150);
      }
    };

    const handleVisibility = () => {
      if (document.hidden) {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
      } else {
        if (!rafId) rafId = requestAnimationFrame(animate);
      }
    };

    document.addEventListener('mousemove', handleMove);
    document.addEventListener('mouseover', handleMouseOver);
    document.addEventListener('click', handleClick);
    document.addEventListener('visibilitychange', handleVisibility);

    rafId = requestAnimationFrame(animate);

    return () => {
      if (rafId) cancelAnimationFrame(rafId);
      document.removeEventListener('mousemove', handleMove);
      document.removeEventListener('mouseover', handleMouseOver);
      document.removeEventListener('click', handleClick);
      document.removeEventListener('visibilitychange', handleVisibility);
    };
  }, [reducedMotion]);

  if (reducedMotion) return null;

  return (
    <div
      ref={cursorRef}
      className={`custom-cursor ${hovering ? 'hover' : ''}`}
      style={{ opacity: 0 }}
    />
  );
}

// ===================== AMBIENT PARTICLES =====================
function AmbientParticles() {
  const reducedMotion = useMemo(() => {
    if (typeof window !== 'undefined' && window.matchMedia) {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
    return false;
  }, []);

  if (reducedMotion) return null;

  const particles = useMemo(() => {
    return Array.from({ length: 15 }, (_, i) => ({
      id: i,
      left: Math.random() * 100 + '%',
      duration: 8 + Math.random() * 12 + 's',
      delay: Math.random() * 10 + 's',
      size: 1 + Math.random() * 2 + 'px',
      color: Math.random() > 0.5 ? 'var(--electric-yellow)' : 'var(--neon-orange)',
    }));
  }, []);

  return (
    <>
      {particles.map(p => (
        <div
          key={p.id}
          className="particle"
          style={{
            left: p.left,
            animationDuration: p.duration,
            animationDelay: p.delay,
            width: p.size,
            height: p.size,
            background: p.color,
          }}
        />
      ))}
    </>
  );
}

      { id: 3, method: 'POST', path: '/api/v1/spots/:id/checkin', desc: '在指定场地打卡签到',
        params: [{ name: 'id', type: 'string', desc: '场地 ID' }],
        response: `{
  "code": <span class="number">200</span>,
  "data": {
    "success": <span class="bool">true</span>,
    "streak": <span class="number">7</span>,
    "xp_earned": <span class="number">50</span>
  }
}`
      },
    ],
    tricks: [
      { id: 4, method: 'GET', path: '/api/v1/tricks', desc: '获取动作列表，支持按难度和分类筛选',
        params: [
          { name: 'category', type: 'string', desc: '分类: flat/grind/air/manual' },
          { name: 'level', type: 'string', desc: '难度等级' },
          { name: 'status', type: 'string', desc: '学习状态' },
        ],
        response: `{ "code": 200, "data": { "list": [...] } }`
      },
      { id: 5, method: 'PUT', path: '/api/v1/tricks/:id/complete', desc: '标记动作已掌握',
        params: [{ name: 'id', type: 'string', desc: '动作 ID' }],
        response: `{ "code": 200, "data": { "unlocked": true } }`
      },
    ],
    users: [
      { id: 6, method: 'GET', path: '/api/v1/users/:id', desc: '获取用户个人信息',
        params: [{ name: 'id', type: 'string', desc: '用户 ID' }],
        response: `{ "code": 200, "data": { "user": {...} } }`
      },
      { id: 7, method: 'PUT', path: '/api/v1/users/profile', desc: '更新用户个人资料',
        params: [
          { name: 'nickname', type: 'string', desc: '昵称' },
          { name: 'bio', type: 'string', desc: '个人简介' },
          { name: 'avatar', type: 'string', desc: '头像 URL' },
        ],
        response: `{ "code": 200, "data": { "success": true } }`
      },
    ],
    community: [
      { id: 8, method: 'GET', path: '/api/v1/feed', desc: '获取社区动态信息流',
        params: [
          { name: 'cursor', type: 'string', desc: '分页游标' },
          { name: 'filter', type: 'string', desc: '过滤类型' },
        ],
        response: `{ "code": 200, "data": { "items": [...] } }`
      },
      { id: 9, method: 'POST', path: '/api/v1/posts/:id/like', desc: '点赞帖子',
        params: [{ name: 'id', type: 'string', desc: '帖子 ID' }],
        response: `{ "code": 200, "data": { "liked": true, "count": 329 } }`
      },
      { id: 10, method: 'DELETE', path: '/api/v1/posts/:id/like', desc: '取消点赞',
        params: [{ name: 'id', type: 'string', desc: '帖子 ID' }],
        response: `{ "code": 200, "data": { "liked": false, "count": 328 } }`
      },
    ],
  };

  const currentEndpoints = endpoints[activeGroup] || [];

  const toggleExpand = (id) => {
    setExpanded(prev =>
      prev.includes(id)
        ? prev.filter(eid => eid !== id)
        : [...prev, id]
    );
  };

  return (
    <div className="api-page">
      <div className="api-header">
        <div>
          <span className="api-status-dot" />
          <span className="api-status-text">API 服务正常运行</span>
        </div>
        <div className="api-title">API DOCS</div>
        <div className="api-base-url">
          https://api.skyline-skate.com/v2
        </div>
      </div>

      <div className="api-sidebar">
        {groups.map(g => (
          <div
            key={g.key}
            className={`api-endpoint-group ${activeGroup === g.key ? 'active' : ''}`}
            onClick={() => setActiveGroup(g.key)}
          >
            {g.label}
          </div>
        ))}
      </div>

      <div className="api-endpoints">
        {currentEndpoints.map(ep => (
          <div
            key={ep.id}
            className={`api-endpoint ${expanded.includes(ep.id) ? 'expanded' : ''}`}
            onClick={() => toggleExpand(ep.id)}
          >
            <div className="api-endpoint-header">
              <span className={`api-method ${ep.method.toLowerCase()}`}>{ep.method}</span>
              <span className="api-path">{ep.path}</span>
              <svg className="api-chevron" viewBox="0 0 24 24">
                <polyline points="6 9 12 15 18 9" />
              </svg>
            </div>
            <div className="api-endpoint-body">
              <div className="api-endpoint-content">
                <div className="api-desc">{ep.desc}</div>
                <div className="api-param-label">Parameters</div>
                <div className="api-params">
                  {ep.params.map((p, i) => (
                    <div key={i} className="api-param">
                      <span className="api-param-name">{p.name}</span>
                      <span className="api-param-type">{p.type}</span>
                      <span className="api-param-desc">{p.desc}</span>
                    </div>
                  ))}
                </div>
                <div className="api-param-label">Response</div>
                <div className="api-response-block" dangerouslySetInnerHTML={{ __html: ep.response }} />
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ===================== BOTTOM NAV =====================
function BottomNav({ active, onChange }) {
  const items = [
    { key: 'home', label: '首页', Icon: Icons.Home },
    { key: 'spots', label: '场地', Icon: Icons.Map },
    { key: 'tricks', label: '动作', Icon: Icons.Zap },
    { key: 'gear', label: '装备', Icon: Icons.Bag },
    { key: 'profile', label: '我的', Icon: Icons.User },
  ];

  return (
    <div className="bottom-nav">
      {items.map(item => (
        <div
          key={item.key}
          className={`nav-item ${active === item.key ? 'active' : ''}`}
          onClick={() => onChange(item.key)}
        >
          <div className="nav-indicator" />
          <item.Icon />
          <span className="nav-label">{item.label}</span>
        </div>
      ))}
    </div>
  );
}

// ===================== FAB =====================
function FloatingActionButton({ visible, onClick }) {
  if (!visible) return null;
  return (
    <div className="fab" onClick={onClick}>
      <Icons.Plus />
    </div>
  );
}

// ===================== MAIN APP =====================
function App() {
  const [activeTab, setActiveTab] = useState('home');
  const [transitioning, setTransitioning] = useState(false);
  const [direction, setDirection] = useState('right');
  const [currentPage, setCurrentPage] = useState('home');
  const transitionTimeoutRef = useRef(null);

  const mainPages = ['home', 'spots', 'tricks', 'gear', 'community', 'profile'];
  const allPages = [
    { key: 'home', label: '首页 / 发现' },
    { key: 'spots', label: '场地探索' },
    { key: 'tricks', label: '动作图鉴' },
    { key: 'gear', label: '装备商店' },
    { key: 'community', label: '社区动态' },
    { key: 'profile', label: '个人中心' },
    { key: 'design', label: '设计规范' },
    { key: 'api', label: '接口文档' },
  ];

  const pageOrder = ['home', 'spots', 'tricks', 'gear', 'community', 'profile', 'design', 'api'];

  const navigateTo = useCallback((target) => {
    if (target === currentPage || transitioning) return;

    const fromIndex = pageOrder.indexOf(currentPage);
    const toIndex = pageOrder.indexOf(target);
    const dir = toIndex > fromIndex ? 'right' : 'left';

    setDirection(dir);
    setTransitioning(true);
    setActiveTab(mainPages.includes(target) ? target : activeTab);

    if (transitionTimeoutRef.current) {
      clearTimeout(transitionTimeoutRef.current);
    }

    transitionTimeoutRef.current = setTimeout(() => {
      setCurrentPage(target);
      setTransitioning(false);
    }, 350);
  }, [currentPage, transitioning, activeTab]);

  useEffect(() => {
    return () => {
      if (transitionTimeoutRef.current) {
        clearTimeout(transitionTimeoutRef.current);
      }
    };
  }, []);

  // Visibility change - pause any animations
  useEffect(() => {
    const handleVisibility = () => {
      if (document.hidden) {
        if (transitionTimeoutRef.current) {
          clearTimeout(transitionTimeoutRef.current);
          transitionTimeoutRef.current = null;
        }
      }
    };
    document.addEventListener('visibilitychange', handleVisibility);
    return () => document.removeEventListener('visibilitychange', handleVisibility);
  }, []);

  const handleTabChange = (tab) => {
    navigateTo(tab);
  };

  const showFab = currentPage === 'community' || currentPage === 'home';

  const renderPage = (pageKey) => {
    switch (pageKey) {
      case 'home': return <HomePage onNavigate={navigateTo} />;
      case 'spots': return <SpotsPage />;
      case 'tricks': return <TricksPage />;
      case 'gear': return <GearPage />;
      case 'community': return <CommunityPage />;
      case 'profile': return <ProfilePage />;
      case 'design': return <DesignSystemPage />;
      case 'api': return <ApiDocsPage />;
      default: return null;
    }
  };

  const currentIndex = pageOrder.indexOf(currentPage);

  return (
    <>
      <CustomCursor />
      <AmbientParticles />

      <div className="app-wrapper">
        <div className="brand-marks">
          <div className="brand-title">SKYLINE</div>
          <div className="brand-subtitle">滑板志 · V2 MOCKUP</div>
        </div>

        <div className="phone-container">
          {/* Device Frame */}
          <div className="android-frame-outer">
            <svg
              width="412" height="892"
              viewBox="0 0 412 892"
              style={{ display: 'block' }}
            >
              {/* Outer frame */}
              <rect x="0" y="0" width="412" height="892" rx="46" fill="#0A0B0D" />
              <rect x="3" y="3" width="406" height="886" rx="44" fill="#1A1D21" />
              {/* Screen area */}
              <rect x="8" y="8" width="396" height="876" rx="40" fill="#1A1D21" />
              {/* Camera cutout */}
              <circle cx="206" cy="24" r="10" fill="#0A0B0D" />
              <circle cx="206" cy="24" r="6" fill="#1A1D21" />
              {/* Side buttons */}
              <rect x="0" y="150" width="3" height="40" rx="1.5" fill="#2A2D33" />
              <rect x="0" y="200" width="3" height="60" rx="1.5" fill="#2A2D33" />
              <rect x="409" y="170" width="3" height="80" rx="1.5" fill="#2A2D33" />
            </svg>
            <div style={{
              position: 'absolute',
              top: '50%', left: '50%',
              transform: 'translate(-50%, -50%)',
              width: '390px',
              height: '862px',
              borderRadius: '38px',
              overflow: 'hidden',
            }}>
              {/* Status bar */}
              <div style={{
                height: '32px',
                background: 'transparent',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'space-between',
                padding: '0 20px',
                fontSize: '12px',
                fontWeight: '600',
                color: 'var(--fog-white)',
                position: 'relative',
                zIndex: 200,
                pointerEvents: 'none',
                fontFamily: "'JetBrains Mono', monospace",
              }}>
                <span>9:41</span>
                <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                  <svg width="16" height="10" viewBox="0 0 16 10" fill="none">
                    <rect x="0" y="2" width="12" height="6" rx="1.5" fill="currentColor"/>
                    <rect x="13" y="3.5" width="2" height="3" rx="0.5" fill="currentColor"/>
                    <rect x="1" y="3" width="8" height="4" rx="0.5" fill="#23262B"/>
                  </svg>
                </div>
              </div>

              {/* Screen content with page transitions */}
              <div className="device-screen-content" style={{ top: '-32px' }}>
                <div className="status-spacer" />

                {/* Current page */}
                <div className={`page active`}>
                  {renderPage(currentPage)}
                </div>

                {/* Bottom nav (only main pages) */}
                {mainPages.includes(currentPage) && (
                  <BottomNav active={activeTab} onChange={handleTabChange} />
                )}

                {/* Back button for special pages */}
                {!mainPages.includes(currentPage) && (
                  <div
                    style={{
                      position: 'absolute',
                      top: '44px', left: '16px',
                      zIndex: 100,
                      width: '36px', height: '36px',
                      borderRadius: '50%',
                      background: 'rgba(26,29,33,0.8)',
                      backdropFilter: 'blur(10px)',
                      border: '1px solid rgba(255,255,255,0.1)',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      cursor: 'pointer',
                      color: 'var(--fog-white)',
                    }}
                    onClick={() => navigateTo('home')}
                    className="icon-btn"
                  >
                    <Icons.ArrowLeft />
                  </div>
                )}

                <FloatingActionButton
                  visible={showFab}
                  onClick={() => {}}
                />
              </div>

              {/* Gesture bar */}
              <div style={{
                position: 'absolute',
                bottom: '6px',
                left: '50%',
                transform: 'translateX(-50%)',
                width: '120px',
                height: '4px',
                borderRadius: '2px',
                background: 'rgba(255,255,255,0.3)',
                zIndex: 300,
                pointerEvents: 'none',
              }} />
            </div>
          </div>
        </div>

        {/* Page indicator */}
        <div className="page-indicator">
          {allPages.map((p, i) => (
            <div
              key={p.key}
              className={`page-dot ${currentPage === p.key ? 'active' : ''}`}
              title={p.label}
              onClick={() => navigateTo(p.key)}
            />
          ))}
        </div>
      </div>
    </>
  );
}

// Mount
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// Announce upgrade capability
function announceUpgrade() {
  try {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  } catch(e) {}
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>云笺 SlowPost · 书信慢递</title>
<meta name="creative-medium" content="interactive-prototype" />
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&display=swap" />
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<!-- 组件内联在下方 script 中 -->
<style>
  :root {
    --paper: #F5EFE0;
    --paper-2: #EDE6D3;
    --paper-3: #E4DCC4;
    --dai: #2F4A4A;
    --dai-2: #3D5C5C;
    --dai-light: #5A7A7A;
    --zhu: #C0392B;
    --zhu-light: #D45548;
    --ink: #3A3A38;
    --ink-2: #5A5A58;
    --ink-3: #8A8A88;
    --gold: #C49A4A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: "Noto Serif SC", "Songti SC", serif;
    background:
      radial-gradient(1200px 800px at 20% 10%, #EDE6D3 0%, transparent 60%),
      radial-gradient(900px 700px at 80% 90%, #E4DCC4 0%, transparent 55%),
      #F5EFE0;
    color: var(--ink);
    overflow: hidden;
    text-wrap: pretty;
  }
  .app-stage {
    width: 100%; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    padding: 20px;
  }
  /* 纸张纹理叠加 */
  .paper-texture::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(60,40,20,0.03) 0%, transparent 40%),
      radial-gradient(circle at 70% 80%, rgba(60,40,20,0.04) 0%, transparent 45%);
    pointer-events: none;
    mix-blend-mode: multiply;
  }
  /* 小程序容器 */
  .mp-container {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--paper);
  }
  /* 自定义导航栏 */
  .mp-navbar {
    position: absolute; top: 0; left: 0; right: 0;
    z-index: 30;
    display: flex; align-items: center;
    padding-top: calc(var(--ios-safe-top, 62px) - 4px);
    padding-left: 16px; padding-right: 16px;
    height: calc(var(--ios-safe-top, 62px) + 44px - 4px);
    transition: background 0.3s ease, box-shadow 0.3s ease, color 0.3s ease;
  }
  .mp-navbar.title-dark { color: var(--ink); }
  .mp-navbar.title-light { color: #fff; }
  .mp-navbar-title {
    flex: 1; text-align: center;
    font-size: 17px; font-weight: 600;
    font-family: "ZCOOL XiaoWei", "Noto Serif SC", serif;
    letter-spacing: 2px;
  }
  .mp-navbar-back {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  /* 胶囊按钮（微信小程序风格） */
  .mp-capsule {
    width: 87px; height: 32px;
    border-radius: 20px;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 0.5px solid rgba(0,0,0,0.08);
    display: flex; align-items: center; justify-content: space-around;
    padding: 0 8px;
  }
  .mp-capsule.dark {
    background: rgba(47,74,74,0.7);
    border-color: rgba(255,255,255,0.15);
  }
  .mp-capsule-icon {
    width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .mp-capsule-divider {
    width: 1px; height: 16px;
    background: rgba(0,0,0,0.15);
  }
  .mp-capsule.dark .mp-capsule-divider {
    background: rgba(255,255,255,0.25);
  }

  /* 页面通用 */
  .page-wrap {
    position: absolute; inset: 0;
    background: var(--paper);
    overflow: hidden;
  }
  .page-scroll {
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .page-scroll::-webkit-scrollbar { display: none; }

  /* TabBar */
  .tabbar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: calc(56px + var(--ios-safe-bottom, 34px));
    padding-bottom: var(--ios-safe-bottom, 34px);
    background: rgba(245,239,224,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 0.5px solid rgba(60,60,56,0.1);
    display: flex;
    z-index: 25;
  }
  .tabbar-item {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3px;
    cursor: pointer;
    position: relative;
    transition: transform 0.2s ease;
  }
  .tabbar-item:active { transform: scale(0.92); }
  .tabbar-item svg { transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .tabbar-item.active svg { transform: translateY(-2px) scale(1.08); }
  .tabbar-label {
    font-size: 10px;
    font-family: "ZCOOL XiaoWei", serif;
    letter-spacing: 1px;
    transition: color 0.2s ease;
  }
  .tabbar-dot {
    position: absolute; top: 6px; right: 50%;
    transform: translateX(12px);
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--zhu);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  /* 页面切换过渡 */
  .page-enter {
    animation: slideInRight 0.35s cubic-bezier(0.32, 0.72, 0, 1) forwards;
  }
  .page-exit {
    animation: slideOutLeft 0.35s cubic-bezier(0.32, 0.72, 0, 1) forwards;
  }
  @keyframes slideInRight {
    from { transform: translateX(100%); opacity: 0.6; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes slideOutLeft {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(-30%); opacity: 0.4; }
  }
  .page-back-enter {
    animation: slideInLeft 0.35s cubic-bezier(0.32, 0.72, 0, 1) forwards;
  }
  .page-back-exit {
    animation: slideOutRight 0.35s cubic-bezier(0.32, 0.72, 0, 1) forwards;
  }
  @keyframes slideInLeft {
    from { transform: translateX(-30%); opacity: 0.4; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes slideOutRight {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(100%); opacity: 0.6; }
  }

  /* 入场动画 */
  .fade-up { opacity: 0; transform: translateY(20px); animation: fadeUp 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
  .fade-up.d1 { animation-delay: 0.05s; }
  .fade-up.d2 { animation-delay: 0.15s; }
  .fade-up.d3 { animation-delay: 0.25s; }
  .fade-up.d4 { animation-delay: 0.35s; }
  .fade-up.d5 { animation-delay: 0.45s; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 邮戳印章动效 */
  .stamp-seal {
    animation: stampPress 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    opacity: 0; transform: scale(2) rotate(-15deg);
  }
  @keyframes stampPress {
    0% { opacity: 0; transform: scale(2) rotate(-15deg); }
    70% { opacity: 1; transform: scale(0.95) rotate(-10deg); }
    100% { opacity: 1; transform: scale(1) rotate(-8deg); }
  }

  /* 墨迹滴落 */
  .ink-drop {
    animation: inkSpread 1.2s cubic-bezier(0.23, 1, 0.32, 1) forwards;
  }
  @keyframes inkSpread {
    from { transform: scale(0); opacity: 0; }
    50% { transform: scale(1.2); opacity: 0.9; }
    to { transform: scale(1); opacity: 1; }
  }

  /* 浮动微光 */
  @keyframes floatGlow {
    0%, 100% { transform: translateY(0); opacity: 0.6; }
    50% { transform: translateY(-8px); opacity: 1; }
  }
  .float-glow { animation: floatGlow 3s ease-in-out infinite; }

  /* 涟漪 */
  @keyframes rippleExpand {
    from { transform: scale(0); opacity: 0.5; }
    to { transform: scale(4); opacity: 0; }
  }
  .ripple-effect {
    position: absolute;
    border-radius: 50%;
    background: rgba(192,57,43,0.3);
    pointer-events: none;
    animation: rippleExpand 0.6s ease-out forwards;
  }

  /* 下拉刷新弹性 */
  @keyframes elasticBounce {
    0% { transform: scaleY(0.3); }
    50% { transform: scaleY(1.3); }
    75% { transform: scaleY(0.9); }
    100% { transform: scaleY(1); }
  }
  .pull-elastic { animation: elasticBounce 0.5s ease-out; }

  /* 打字机光标 */
  @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  .type-cursor { animation: blink 1s step-end infinite; }

  /* 光泽扫过 */
  @keyframes shineSweep {
    0% { transform: translateX(-100%) skewX(-15deg); }
    100% { transform: translateX(200%) skewX(-15deg); }
  }
  .shine-wrap { position: relative; overflow: hidden; }
  .shine-wrap::after {
    content: "";
    position: absolute; top: 0; left: 0; bottom: 0; width: 40%;
    background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
    animation: shineSweep 2.8s ease-in-out infinite;
    animation-delay: 1s;
  }

  /* 头像脉冲 */
  @keyframes pulseRing {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1.8); opacity: 0; }
  }
  .pulse-ring {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 2px solid var(--zhu);
    animation: pulseRing 2s ease-out infinite;
  }

  /* 数字计数相关 */
  .count-num { font-variant-numeric: tabular-nums; }

  /* 滚动渐入 */
  .scroll-reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .scroll-reveal.in { opacity: 1; transform: translateY(0); }

  /* 毛玻璃卡片 */
  .glass-card {
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.8);
    box-shadow: 0 8px 32px rgba(47,74,74,0.08);
  }

  /* 自定义光标 */
  #custom-cursor {
    position: fixed;
    top: 50%; left: 50%;
    width: 32px; height: 32px;
    border: 2px solid #fff;
    border-radius: 50%;
    pointer-events: none;
    z-index: 99999;
    transform: translate(-50%, -50%);
    transition: width 0.2s ease, height 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
    mix-blend-mode: difference;
    will-change: transform;
    box-shadow:
      0 0 12px rgba(192,57,43,0.6),
      0 0 24px rgba(192,57,43,0.3),
      inset 0 0 6px rgba(255,255,255,0.5);
  }
  #custom-cursor::before {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    width: 6px; height: 6px;
    background: var(--zhu);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px var(--zhu);
    transition: transform 0.2s ease;
  }
  #custom-cursor.hover {
    width: 56px; height: 56px;
    border-color: rgba(255,255,255,0.8);
  }
  #custom-cursor.hover::before {
    transform: translate(-50%, -50%) scale(0.8);
    background: #fff;
  }
  #custom-cursor.click {
    animation: cursorClick 0.3s ease-out;
  }
  @keyframes cursorClick {
    0% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(0.7); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  /* 悬浮操作球 FAB */
  .fab-btn {
    position: absolute;
    right: 18px;
    bottom: calc(72px + var(--ios-safe-bottom, 34px));
    width: 56px; height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--zhu) 0%, #9B2C1F 100%);
    box-shadow:
      0 4px 16px rgba(192,57,43,0.4),
      0 8px 24px rgba(192,57,43,0.2),
      inset 0 1px 0 rgba(255,255,255,0.3);
    display: flex; align-items: center; justify-content: center;
    z-index: 20;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .fab-btn:active { transform: scale(0.9); }
  .fab-btn::before {
    content: "";
    position: absolute; inset: -6px;
    border-radius: 50%;
    border: 1px solid rgba(192,57,43,0.4);
    animation: pulseRing 2.5s ease-out infinite;
  }

  /* 吸顶 Tab */
  .sticky-tabs {
    position: sticky; top: calc(var(--ios-safe-top, 62px) + 44px);
    z-index: 20;
    display: flex; gap: 4px;
    padding: 8px 16px;
    background: rgba(245,239,224,0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 0.5px solid rgba(60,60,56,0.08);
  }
  .sticky-tab {
    flex: 1;
    padding: 8px 12px;
    text-align: center;
    font-size: 14px;
    color: var(--ink-3);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: "ZCOOL XiaoWei", serif;
    letter-spacing: 1px;
  }
  .sticky-tab.active {
    background: var(--dai);
    color: var(--paper);
    box-shadow: 0 2px 8px rgba(47,74,74,0.2);
  }

  /* 左滑列表项 */
  .swipe-item {
    position: relative;
    overflow: hidden;
  }
  .swipe-content {
    position: relative;
    z-index: 2;
    background: var(--paper);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .swipe-item.swipe-open .swipe-content {
    transform: translateX(-80px);
  }
  .swipe-actions {
    position: absolute; top: 0; right: 0; bottom: 0;
    width: 80px;
    display: flex;
    z-index: 1;
  }
  .swipe-action-btn {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    background: var(--zhu);
    color: #fff;
    font-size: 13px;
    cursor: pointer;
  }

  /* Action Sheet */
  .action-sheet-mask {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .action-sheet-mask.show {
    opacity: 1;
    pointer-events: auto;
  }
  .action-sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--paper);
    border-radius: 20px 20px 0 0;
    z-index: 101;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    padding-bottom: var(--ios-safe-bottom, 34px);
  }
  .action-sheet.show { transform: translateY(0); }

  /* 骨架屏 */
  .skeleton {
    background: linear-gradient(90deg, var(--paper-2) 25%, var(--paper-3) 50%, var(--paper-2) 75%);
    background-size: 200% 100%;
    animation: skeletonShine 1.5s infinite;
    border-radius: 8px;
  }
  @keyframes skeletonShine {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* 下拉刷新指示器 */
  .pull-indicator {
    position: absolute;
    top: calc(var(--ios-safe-top, 62px) + 44px);
    left: 50%;
    transform: translateX(-50%) scale(0);
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    z-index: 15;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .pull-indicator.show { transform: translateX(-50%) scale(1); }

  /* 底部安全区主按钮 */
  .bottom-main-btn {
    position: sticky; bottom: 0;
    padding: 16px 16px calc(16px + var(--ios-safe-bottom, 34px));
    background: linear-gradient(to top, var(--paper) 60%, transparent);
    z-index: 15;
  }
  .main-btn {
    width: 100%;
    height: 48px;
    border-radius: 24px;
    background: linear-gradient(135deg, var(--zhu) 0%, #9B2C1F 100%);
    color: #fff;
    border: none;
    font-size: 16px;
    font-weight: 500;
    font-family: "ZCOOL XiaoWei", serif;
    letter-spacing: 3px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(192,57,43,0.3);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .main-btn:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(192,57,43,0.2); }
  .main-btn.dai {
    background: linear-gradient(135deg, var(--dai) 0%, #1E3535 100%);
    box-shadow: 0 4px 16px rgba(47,74,74,0.3);
  }

  /* 进度环 */
  .ring-progress {
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .ring-progress svg {
    transform: rotate(-90deg);
  }
  .ring-progress .ring-bg {
    stroke: rgba(47,74,74,0.12);
    fill: none;
    stroke-width: 6;
  }
  .ring-progress .ring-fg {
    fill: none;
    stroke-width: 6;
    stroke-linecap: round;
    stroke: url(#ringGradient);
    transition: stroke-dashoffset 2s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* 悬停发光 */
  .glow-hover {
    transition: box-shadow 0.3s ease, transform 0.3s ease;
  }
  .glow-hover:hover {
    box-shadow: 0 8px 24px rgba(192,57,43,0.25), 0 0 0 1px rgba(192,57,43,0.1);
    transform: translateY(-2px);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div id="root"></div>

<!-- 自定义光标 -->
<div id="custom-cursor"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback, createContext, useContext } = React;

/* ============================================================
   IOS DEVICE COMPONENT (inlined)
   ============================================================ */
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

function IOSDevice({ children, width = 402, height = 874, dark = false }) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      border: '1px solid #DEE0E3',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
      '--ios-safe-top': '62px',
      '--ios-safe-bottom': '34px',

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: 'miaoda:tweaks:set-keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = '风格', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxTop = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxTop, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.top = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    window.addEventListener('resize', clampToViewport);
    return () => window.removeEventListener('resize', clampToViewport);
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === 'miaoda:tweaks:activate') setOpen(true);
      else if (t === 'miaoda:tweaks:deactivate') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: 'miaoda:tweaks:available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: 'miaoda:tweaks:dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startTop = r.top;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startTop + (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, top: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <div className="twk-row">
      <div className="twk-lbl">
        <span>{label}</span>
        <span className="twk-val">{value}{unit}</span>
      </div>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </div>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      <div className="twk-seg" role="radiogroup">
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio"
                  aria-checked={o.value === value}
                  onClick={() => onChange(o.value)}>
            {o.label}
          </button>
        ))}
      </div>
    </div>
  );
}

function TweakText({ label, value, onChange }) {
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      <input className="twk-field" type="text" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

/* ============================================================
   自定义光标 - DOM 直接操作
   ============================================================ */
function initCustomCursor() {
  const cursor = document.getElementById('custom-cursor');
  if (!cursor) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    cursor.style.display = 'none';
    return;
  }

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let cursorX = mouseX;
  let cursorY = mouseY;
  let rafId = null;
  let isVisible = true;

  function animate() {
    if (!isVisible) return;
    // 缓动跟随
    cursorX += (mouseX - cursorX) * 0.18;
    cursorY += (mouseY - cursorY) * 0.18;
    cursor.style.transform = `translate(${cursorX - window.innerWidth/2}px, ${cursorY - window.innerHeight/2}px) translate(-50%, -50%)`;
    rafId = requestAnimationFrame(animate);
  }

  function onMove(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
  }

  function onOver(e) {
    const target = e.target.closest('button, .interactive, a, [role="button"], .tabbar-item, .fab-btn, .sticky-tab, .swipe-item');
    if (target) {
      cursor.classList.add('hover');
    } else {
      cursor.classList.remove('hover');
    }
  }

  function onClick() {
    cursor.classList.remove('click');
    void cursor.offsetWidth;
    cursor.classList.add('click');
    // 涟漪
    const ripple = document.createElement('div');
    ripple.style.cssText = `
      position: fixed; left: ${mouseX}px; top: ${mouseY}px;
      width: 10px; height: 10px; margin-left: -5px; margin-top: -5px;
      border-radius: 50%; background: rgba(192,57,43,0.4);
      pointer-events: none; z-index: 99998;
      animation: rippleExpand 0.6s ease-out forwards;
    `;
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  }

  function onVisibility() {
    if (document.hidden) {
      isVisible = false;
      if (rafId) cancelAnimationFrame(rafId);
    } else {
      isVisible = true;
      rafId = requestAnimationFrame(animate);
    }
  }

  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseover', onOver);
  window.addEventListener('click', onClick);
  document.addEventListener('visibilitychange', onVisibility);

  rafId = requestAnimationFrame(animate);

  return () => {
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseover', onOver);
    window.removeEventListener('click', onClick);
    document.removeEventListener('visibilitychange', onVisibility);
    if (rafId) cancelAnimationFrame(rafId);
  };
}

/* ============================================================
   数字计数动画 hook
   ============================================================ */
function useCountUp(target, duration = 1500, start = false) {
  const [value, setValue] = useState(0);
  const rafRef = useRef(null);
  const startTimeRef = useRef(null);

  useEffect(() => {
    if (!start) { setValue(0); return; }
    startTimeRef.current = null;

    function step(timestamp) {
      if (!startTimeRef.current) startTimeRef.current = timestamp;
      const progress = Math.min((timestamp - startTimeRef.current) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setValue(Math.round(target * eased));
      if (progress < 1) {
        rafRef.current = requestAnimationFrame(step);
      }
    }

    rafRef.current = requestAnimationFrame(step);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [target, duration, start]);

  return value;
}

/* ============================================================
   打字机效果 hook
   ============================================================ */
function useTypewriter(text, speed = 40, start = false) {
  const [displayText, setDisplayText] = useState('');
  const timerRef = useRef(null);
  const indexRef = useRef(0);

  useEffect(() => {
    if (!start) { setDisplayText(''); indexRef.current = 0; return; }
    if (timerRef.current) clearInterval(timerRef.current);

    timerRef.current = setInterval(() => {
      if (indexRef.current < text.length) {
        setDisplayText(text.slice(0, indexRef.current + 1));
        indexRef.current++;
      } else {
        clearInterval(timerRef.current);
      }
    }, speed);

    return () => {
      if (timerRef.current) clearInterval(timerRef.current);
    };
  }, [text, speed, start]);

  return displayText;
}

/* ============================================================
   滚动渐入观察器 hook
   ============================================================ */
function useScrollReveal(ref, deps = []) {
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const items = el.querySelectorAll('.scroll-reveal');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });

    items.forEach(item => observer.observe(item));
    return () => observer.disconnect();
  }, deps);
}

function FloatingParticles({ count = 12, color = COLORS.zhu }) {
  const particles = useMemo(() =>

      id: i,
      left: Math.random() * 100,

  return (

      {particles.map(p => (
        <div key={p.id} style={{
          position: 'absolute',

          top: `${p.top}%`,
          width: p.size, height: p.size,
          borderRadius: '50%',
          background: color,
          opacity: p.opacity,
          animation: `floatGlow ${p.duration}s ease-in-out ${p.delay}s infinite`,
        }} />
      ))}
    </div>
  );
}

/* ============================================================
   进度环组件
   ============================================================ */
function RingProgress({ value = 75, size = 120, strokeWidth = 6, label, sublabel }) {
  const radius = (size - strokeWidth) / 2;
  const circumference = 2 * Math.PI * radius;
  const [displayVal, setDisplayVal] = useState(0);
  const rafRef = useRef(null);

  useEffect(() => {
    let start = null;
    const duration = 2000;
    function step(t) {
      if (!start) start = t;
      const p = Math.min((t - start) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 4);
      setDisplayVal(value * eased);
      if (p < 1) rafRef.current = requestAnimationFrame(step);
    }
    rafRef.current = requestAnimationFrame(step);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [value]);

  const offset = circumference - (displayVal / 100) * circumference;

  return (
    <div className="ring-progress" style={{ width: size, height: size }}>
      <svg width={size} height={size}>
        <defs>
          <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor={COLORS.zhu} />
            <stop offset="100%" stopColor={COLORS.gold} />
          </linearGradient>
        </defs>
        <circle className="ring-bg" cx={size/2} cy={size/2} r={radius} />
        <circle className="ring-fg" cx={size/2} cy={size/2} r={radius}
          strokeDasharray={circumference} strokeDashoffset={offset} />
      </svg>
      <div style={{
        position: 'absolute',
        display: 'flex', flexDirection: 'column',
        alignItems: 'center', justifyContent: 'center',
      }}>
        {label && <div style={{
          fontSize: 28, fontWeight: 600, color: COLORS.dai,
          fontFamily: '"ZCOOL XiaoWei", serif',
        }}>{label}</div>}
        {sublabel && <div style={{
          fontSize: 11, color: COLORS.ink3, marginTop: 2,
          letterSpacing: 1,
        }}>{sublabel}</div>}
      </div>
    </div>
  );
}

/* ============================================================
   TabBar 组件
   ============================================================ */
function TabBar({ activeTab, onTabChange }) {
  const tabs = [
    { icon: 'home', label: '首页', key: 'home' },
    { icon: 'time', label: '时光', key: 'time' },
    { icon: 'mail', label: '信箱', key: 'mailbox' },
    { icon: 'user', label: '我的', key: 'profile' },
  ];

  return (
    <div className="tabbar">
      {tabs.map((tab, i) => (
        <div
          key={tab.key}
          className={`tabbar-item ${activeTab === i ? 'active' : ''}`}
          onClick={() => onTabChange(i)}
        >
          <Icon
            name={tab.icon}
            color={activeTab === i ? COLORS.zhu : COLORS.ink3}
            size={22}
          />
          <span className="tabbar-label" style={{
            color: activeTab === i ? COLORS.zhu : COLORS.ink3,
          }}>{tab.label}</span>
          {tab.key === 'mailbox' && <div className="tabbar-dot" style={{ opacity: 1 }} />}
        </div>
      ))}
    </div>
  );
}

/* ============================================================
   主应用 - 路由管理
   ============================================================ */
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [activeTab, setActiveTab] = useState(0);
  const [stack, setStack] = useState([]); // push 页面栈
  const [direction, setDirection] = useState('forward'); // forward / back
  const [isAnimating, setIsAnimating] = useState(false);

  const tabPages = ['home', 'time', 'mailbox', 'profile'];

  const handlePush = useCallback((pageName, params = {}) => {
    if (isAnimating) return;
    setDirection('forward');
    setIsAnimating(true);
    setStack(prev => [...prev, { name: pageName, params, key: Date.now() }]);
    setTimeout(() => setIsAnimating(false), 350);
  }, [isAnimating]);

  const handlePop = useCallback(() => {
    if (isAnimating || stack.length === 0) return;
    setDirection('back');
    setIsAnimating(true);
    setTimeout(() => {
      setStack(prev => prev.slice(0, -1));
      setIsAnimating(false);
    }, 300);
  }, [isAnimating, stack.length]);

  const handleTabChange = useCallback((index) => {
    if (index === activeTab) return;
    // 切 tab 时清空 stack
    setStack([]);
    setActiveTab(index);
  }, [activeTab]);

  // 渲染当前 tab 页
  const renderTabPage = () => {
    switch (tabPages[activeTab]) {
      case 'home': return <HomePage onPush={handlePush} />;
      case 'time': return <TimePage />;
      case 'mailbox': return <MailboxPage onPush={handlePush} />;
      case 'profile': return <ProfilePage onPush={handlePush} />;
      default: return null;
    }
  };

  // 渲染 push 页
  const renderStackPage = (page) => {
    switch (page.name) {
      case 'compose': return <ComposePage onBack={handlePop} />;
      case 'letter-detail': return <LetterDetailPage onBack={handlePop} params={page.params} />;
      case 'design-spec': return <DesignSpecPage onBack={handlePop} />;
      case 'api-docs': return <ApiDocsPage onBack={handlePop} />;
      // 占位页面
      case 'time':
      case 'stamp':
      case 'penpal':
        return (
          <div className="page-wrap paper-texture">
            <MPNavbar title={page.name === 'time' ? '时光胶囊' : page.name === 'stamp' ? '邮票市集' : '寻找笔友'} showBack onBack={handlePop} />
            <div style={{
              paddingTop: 'calc(var(--ios-safe-top) + 80px)',
              display: 'flex', flexDirection: 'column',
              alignItems: 'center', justifyContent: 'center',
              height: '100%',
            }}>
              <div style={{
                fontSize: 48, marginBottom: 16,
              }}>{page.name === 'time' ? '⏳' : page.name === 'stamp' ? '📮' : '✉️'}</div>
              <div style={{
                fontFamily: '"ZCOOL XiaoWei", serif',
                fontSize: 18, color: COLORS.ink, marginBottom: 8,
              }}>{page.name === 'time' ? '时光胶囊' : page.name === 'stamp' ? '邮票市集' : '寻找笔友'}</div>
              <div style={{ fontSize: 13, color: COLORS.ink3 }}>功能建设中，敬请期待</div>
            </div>
          </div>
        );
      default: return null;
    }
  };

  // 根据 tab 决定导航栏样式
  const getNavbarConfig = () => {
    const tab = tabPages[activeTab];
    switch (tab) {
      case 'home':
        return { title: '云笺', variant: 'transparent', dark: true };
      case 'time':
        return { title: '时光胶囊', variant: 'default', dark: false };
      case 'mailbox':
        return { title: '我的信箱', variant: 'default', dark: false };
      case 'profile':
        return { title: '我的', variant: 'transparent', dark: true };
      default:
        return { title: '', variant: 'default', dark: false };
    }
  };

  const navConfig = getNavbarConfig();

  return (
    <div className="app-stage">
      <IOSDevice width={390} height={844}>
        <div className="mp-container">
          {/* 基础层：tab 页 + tab bar */}
          <div style={{ position: 'absolute', inset: 0 }}>
            {renderTabPage()}

            {/* Tab 页的导航栏（只在 stack 为空时显示） */}
            {stack.length === 0 && (
              <MPNavbar
                title={navConfig.title}
                variant={navConfig.variant}
                dark={navConfig.dark}
                transparent={navConfig.variant === 'transparent'}
              />
            )}

            {/* TabBar */}
            {stack.length === 0 && (
              <TabBar activeTab={activeTab} onTabChange={handleTabChange} />
            )}
          </div>

          {/* Stack 层：push 出来的页面 */}
          {stack.map((page, index) => {
            const isTop = index === stack.length - 1;
            const animClass = isTop
              ? (direction === 'forward' ? 'page-enter' : '')
              : '';

            // 决定该页的导航栏
            let navTitle = '';
            let navDark = false;
            switch (page.name) {
              case 'compose': navTitle = '写新信'; break;
              case 'letter-detail': navTitle = '信件详情'; navDark = false; break;
              case 'design-spec': navTitle = '设计规范'; break;
              case 'api-docs': navTitle = '接口文档'; break;
              case 'time': navTitle = '时光胶囊'; break;
              case 'stamp': navTitle = '邮票市集'; break;
              case 'penpal': navTitle = '寻找笔友'; break;
              default: navTitle = '';
            }

            return (
              <div key={page.key} className={`page-wrap ${animClass}`}
                style={{ zIndex: 40 + index }}>
                {renderStackPage(page)}
                <MPNavbar
                  title={navTitle}
                  showBack
                  onBack={handlePop}
                  dark={navDark}
                />
              </div>
            );
          })}
        </div>
      </IOSDevice>

      {/* Tweaks Panel */}
      <TweaksPanel>
        <TweakSection label="主题" />
        <TweakRadio label="配色方案" value={t.theme}
          options={['paper', 'ink', 'bamboo']}
          onChange={(v) => setTweak('theme', v)} />
        <TweakSlider label="字体大小" value={t.fontSize}
          min={12} max={20} unit="px"
          onChange={(v) => setTweak('fontSize', v)} />
        <TweakToggle label="动效" value={t.showAnimations}
          onChange={(v) => setTweak('showAnimations', v)} />
        <TweakSection label="关于" />
        <TweakText label="版本" value="v 2.1.0" />
      </TweaksPanel>
    </div>
  );
}

/* ============================================================
   启动
   ============================================================ */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// 自定义光标
let cursorCleanup = null;
function bootCursor() {
  if (cursorCleanup) cursorCleanup();
  cursorCleanup = initCustomCursor();
}
if (document.readyState === 'complete') {
  bootCursor();
} else {
  window.addEventListener('load', bootCursor, { once: true });
}

// 宣告升级
function announceUpgrade() {
  window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}
</script>
</body>
</html>

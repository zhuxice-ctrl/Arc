<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="creative-medium" content="interactive-prototype" />
<title>潜蓝日志 DiveLog — V2 Native App Mock</title>
<style>
  /* ===== RESET & BASE ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, 'SF Pro Display', 'PingFang SC', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(1200px 800px at 10% -10%, #0a2540 0%, transparent 60%),
      radial-gradient(900px 600px at 110% 110%, #061626 0%, transparent 55%),
      linear-gradient(180deg, #03101d 0%, #020a12 100%);
    color: #fff;
    cursor: none;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ===== CUSTOM CURSOR ===== */
  .cursor-outer {
    position: fixed;
    top: 0; left: 0;
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,0.9);
    pointer-events: none;
    z-index: 99999;
    transform: translate(-50%, -50%);
    transition: width 0.22s cubic-bezier(.2,.8,.2,1), height 0.22s cubic-bezier(.2,.8,.2,1),
                border-color 0.22s, background 0.22s, opacity 0.3s;
    will-change: transform;
    mix-blend-mode: difference;
  }
  .cursor-inner {
    position: fixed;
    top: 0; left: 0;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #FF7A7A;
    pointer-events: none;
    z-index: 100000;
    transform: translate(-50%, -50%);
    box-shadow:
      0 0 12px rgba(255,122,122,0.9),
      0 0 24px rgba(255,122,122,0.5),
      0 0 40px rgba(255,122,122,0.25);
    will-change: transform;
  }
  .cursor-ripple {
    position: fixed;
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 2px solid rgba(255,122,122,0.7);
    pointer-events: none;
    z-index: 99998;
    transform: translate(-50%, -50%);
    animation: ripple 0.6s cubic-bezier(.15,.8,.3,1) forwards;
  }
  @keyframes ripple {
    0% { width: 10px; height: 10px; opacity: 1; }
    100% { width: 70px; height: 70px; opacity: 0; }
  }
  body.cursor-hover .cursor-outer {
    width: 54px; height: 54px;
    border-color: rgba(255,122,122,0.9);
    background: rgba(255,122,122,0.08);
  }
  body.cursor-hover .cursor-inner {
    width: 4px; height: 4px;
  }
  body.cursor-down .cursor-outer {
    width: 32px; height: 32px;
  }

  /* ===== STAGE ===== */
  .stage {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    perspective: 2000px;
  }
  .device-wrap {
    position: relative;
    transform-style: preserve-3d;
    animation: floatY 6s ease-in-out infinite;
  }
  @keyframes floatY {
    0%,100% { transform: translateY(0) rotateY(-4deg) rotateX(2deg); }
    50%     { transform: translateY(-12px) rotateY(-2deg) rotateX(3deg); }
  }
  .stage-glow {
    position: absolute;
    width: 600px; height: 600px;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(10,60,110,0.35) 0%, transparent 65%);
    pointer-events: none;
    filter: blur(40px);
  }

  /* ===== BUBBLES (ambient) ===== */
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.05) 60%, transparent);
    pointer-events: none;
    opacity: 0.5;
    animation: bubbleRise linear infinite;
  }
  @keyframes bubbleRise {
    0%   { transform: translateY(100vh) scale(0.6); opacity: 0; }
    10%  { opacity: 0.5; }
    90%  { opacity: 0.4; }
    100% { transform: translateY(-10vh) scale(1.1); opacity: 0; }
  }

  /* ===== PAGE TRANSITIONS ===== */
  .screen-root {
    position: absolute; inset: 0;
    overflow: hidden;
  }
  .screen-page {
    position: absolute; inset: 0;
    will-change: transform, opacity;
    transition: transform 0.45s cubic-bezier(.32,.72,0,1), opacity 0.35s ease;
    backface-visibility: hidden;
  }
  .screen-page.from-right { transform: translateX(100%); }
  .screen-page.from-left  { transform: translateX(-30%); opacity: 0.3; }
  .screen-page.active     { transform: translateX(0); opacity: 1; }
  .screen-page.exiting    { transform: translateX(-30%); opacity: 0.3; }

  /* ===== HOME PAGE ===== */
  .home-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(800px 500px at 50% -10%, #15406d 0%, #0a2540 40%, #05152a 100%);
    overflow: hidden;
  }
  .home-hero {
    padding-top: 70px;
    padding-left: 24px; padding-right: 24px;
    position: relative; z-index: 2;
  }
  .home-greeting {
    font-size: 14px; font-weight: 500;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.3px;
    margin-bottom: 4px;
  }
  .home-title {
    font-size: 34px; font-weight: 700;
    letter-spacing: -0.8px;
    color: #fff;
    margin-bottom: 20px;
  }
  .home-title em {
    font-style: normal;
    background: linear-gradient(135deg, #FFB3B3 0%, #FF7A7A 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* ===== DIVING CONDITION CARD (HERO) ===== */
  .condition-card {
    position: relative;
    width: 100%;
    border-radius: 28px;
    padding: 24px;
    background:
      linear-gradient(145deg, rgba(30,90,150,0.6) 0%, rgba(10,40,75,0.7) 60%, rgba(5,20,40,0.8) 100%);
    border: 1px solid rgba(255,255,255,0.08);
    overflow: hidden;
    box-shadow:
      0 20px 40px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .condition-card::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(200px 120px at 80% 20%, rgba(255,122,122,0.25), transparent 70%),
      radial-gradient(300px 200px at -10% 80%, rgba(100,180,255,0.12), transparent 70%);
    pointer-events: none;
  }
  .condition-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px;
  }
  .condition-location {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 500; color: #fff;
  }
  .condition-location .dot { font-size: 18px; color: #FF7A7A; }
  .condition-badge {
    padding: 4px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 600;
    background: rgba(255,122,122,0.2); color: #FFB3B3;
    letter-spacing: 0.2px;
  }
  .condition-stats {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
    margin-bottom: 22px;
  }
  .stat-item .stat-val {
    font-size: 26px; font-weight: 700;
    color: #fff;
    letter-spacing: -0.6px;
    font-variant-numeric: tabular-nums;
  }
  .stat-item .stat-label {
    font-size: 12px; color: rgba(255,255,255,0.55);
    margin-top: 2px;
  }
  .condition-tide {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .condition-tide .tide-label {
    font-size: 13px; color: rgba(255,255,255,0.6);
  }
  .condition-tide .tide-val {
    font-size: 13px; font-weight: 600; color: #fff;
  }

  /* ===== BUBBLE PARTICLES ON HERO ===== */
  .hero-bubbles {
    position: absolute; inset: 0;
    pointer-events: none; overflow: hidden;
  }
  .hero-bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.7), rgba(255,255,255,0.04) 60%, transparent);
    animation: heroBubbleRise linear infinite;
  }
  @keyframes heroBubbleRise {
    0%   { transform: translateY(100%); opacity: 0; }
    15%  { opacity: 0.6; }
    85%  { opacity: 0.4; }
    100% { transform: translateY(-20%); opacity: 0; }
  }

  /* ===== HOME SECTIONS ===== */
  .home-scroll {
    position: absolute; inset: 0;
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .home-scroll::-webkit-scrollbar { display: none; }

  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 24px 24px 12px;
  }
  .section-title {
    font-size: 20px; font-weight: 700;
    color: #fff; letter-spacing: -0.4px;
  }
  .section-more {
    font-size: 13px; color: #FF7A7A; font-weight: 500;
  }

  /* ===== DIVE SITE HORIZONTAL SCROLL ===== */
  .site-hscroll {
    display: flex; gap: 14px;
    padding: 0 24px 8px;
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none;
  }
  .site-hscroll::-webkit-scrollbar { display: none; }
  .site-card {
    flex-shrink: 0; width: 240px;
    border-radius: 22px; overflow: hidden;
    background: #0a2540;
    border: 1px solid rgba(255,255,255,0.06);
    transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
  }
  .site-card:active { transform: scale(0.97); }
  .site-card-img {
    width: 100%; height: 140px;
    background: linear-gradient(135deg, #1a5590, #0a2d58);
    position: relative;
    overflow: hidden;
  }
  .site-card-img::after {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 30% 40%, rgba(255,255,255,0.12), transparent 50%),
      linear-gradient(180deg, transparent 40%, rgba(5,20,40,0.6) 100%);
  }
  .site-card-body { padding: 14px 16px 16px; }
  .site-card-name {
    font-size: 16px; font-weight: 600; color: #fff;
    margin-bottom: 4px;
  }
  .site-card-meta {
    font-size: 12px; color: rgba(255,255,255,0.55);
    display: flex; align-items: center; gap: 6px;
  }
  .site-card-meta .rating { color: #FFB366; }

  /* ===== LOG TIMELINE ===== */
  .log-item {
    display: flex; gap: 14px;
    margin: 0 24px 14px;
    padding: 16px;
    border-radius: 20px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(10px);
    transition: transform 0.25s, background 0.25s;
    position: relative;
  }
  .log-item:active { transform: scale(0.98); background: rgba(255,255,255,0.06); }
  .log-date {
    width: 48px; flex-shrink: 0;
    text-align: center;
    padding-top: 2px;
  }
  .log-date .month {
    font-size: 11px; color: #FF7A7A; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .log-date .day {
    font-size: 26px; font-weight: 700;
    color: #fff; line-height: 1;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  .log-info { flex: 1; min-width: 0; }
  .log-info .site {
    font-size: 16px; font-weight: 600; color: #fff;
    margin-bottom: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .log-info .stats-row {
    display: flex; gap: 12px;
    font-size: 12px; color: rgba(255,255,255,0.55);
  }
  .log-info .stats-row span {
    display: flex; align-items: center; gap: 4px;
  }
  .log-context {
    display: flex; flex-direction: column;
    align-items: flex-end; justify-content: center;
    gap: 4px;
  }
  .log-context .depth-num {
    font-size: 22px; font-weight: 700;
    background: linear-gradient(180deg, #7FC8FF, #3B8BEB);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-variant-numeric: tabular-nums;
  }
  .log-context .unit {
    font-size: 11px; color: rgba(255,255,255,0.4);
  }

  /* ===== FAB ===== */
  .fab {
    position: absolute;
    bottom: calc(var(--ios-safe-bottom) + 20px);
    right: 20px;
    width: 56px; height: 56px;
    border-radius: 28px;
    background: linear-gradient(135deg, #FF7A7A, #E85555);
    display: flex; align-items: center; justify-content: center;
    box-shadow:
      0 8px 24px rgba(255,90,90,0.4),
      0 2px 8px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.3);
    z-index: 10;
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
    animation: fabPulse 3s ease-in-out infinite;
  }
  @keyframes fabPulse {
    0%,100% { box-shadow: 0 8px 24px rgba(255,90,90,0.4), 0 2px 8px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.3); }
    50%     { box-shadow: 0 8px 30px rgba(255,90,90,0.6), 0 2px 12px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.3); }
  }
  .fab:active { transform: scale(0.9); }

  /* ===== BOTTOM TAB BAR ===== */
  .tabbar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: calc(64px + var(--ios-safe-bottom));
    padding-bottom: var(--ios-safe-bottom);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    background: rgba(8,22,40,0.72);
    border-top: 0.5px solid rgba(255,255,255,0.1);
    display: flex;
    z-index: 30;
  }
  .tab-item {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 4px;
    font-size: 10px;
    color: rgba(255,255,255,0.45);
    transition: color 0.25s;
    position: relative;
  }
  .tab-item.active { color: #FF7A7A; }
  .tab-item svg { transition: transform 0.25s; }
  .tab-item:active svg { transform: scale(0.85); }

  /* ===== EXPLORE PAGE ===== */
  .explore-bg {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #0a2540 0%, #03101d 100%);
  }
  .explore-header {
    padding: 70px 24px 16px;
    position: relative; z-index: 2;
  }
  .explore-title {
    font-size: 32px; font-weight: 700;
    letter-spacing: -0.7px;
    color: #fff;
    margin-bottom: 16px;
  }
  .search-bar {
    display: flex; align-items: center; gap: 8px;
    height: 40px;
    padding: 0 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(10px);
  }
  .search-bar .search-icon {
    width: 16px; height: 16px;
    opacity: 0.6;
    flex-shrink: 0;
  }
  .search-bar .search-text {
    font-size: 15px; color: rgba(255,255,255,0.45);
    flex: 1;
  }
  .filter-chips {
    display: flex; gap: 8px;
    padding: 14px 24px 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filter-chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 18px;
    font-size: 13px; font-weight: 500;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.7);
    transition: all 0.25s;
  }
  .chip.active {
    background: linear-gradient(135deg, #FF7A7A, #E85555);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 12px rgba(255,90,90,0.35);
  }

  /* ===== GALLERY CAROUSEL ===== */
  .gallery-scroll {
    display: flex; gap: 16px;
    padding: 16px 24px 24px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .gallery-scroll::-webkit-scrollbar { display: none; }
  .gallery-card {
    flex-shrink: 0;
    width: 280px;
    scroll-snap-align: center;
    border-radius: 26px;
    overflow: hidden;
    position: relative;
    aspect-ratio: 3/4;
    background: #0a2540;
    box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    transition: transform 0.4s cubic-bezier(.2,.8,.2,1);
  }
  .gallery-card::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 45%, rgba(3,16,29,0.95) 100%);
    z-index: 2;
  }
  .gallery-bg {
    position: absolute; inset: 0;
    background-size: cover;
  }
  .gallery-info {
    position: absolute;
    left: 20px; right: 20px; bottom: 20px;
    z-index: 3;
  }
  .gallery-tag {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px; font-weight: 600;
    background: rgba(255,122,122,0.25);
    color: #FFB3B3;
    backdrop-filter: blur(10px);
    margin-bottom: 10px;
    letter-spacing: 0.3px;
  }
  .gallery-name {
    font-size: 22px; font-weight: 700;
    color: #fff;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }
  .gallery-desc {
    font-size: 12px; color: rgba(255,255,255,0.65);
    line-height: 1.5;
  }
  .gallery-meta-row {
    display: flex; gap: 12px;
    margin-top: 10px;
    font-size: 11px;
    color: rgba(255,255,255,0.55);
  }
  .gallery-meta-row span {
    display: flex; align-items: center; gap: 4px;
  }

  /* ===== LOGS PAGE ===== */
  .logs-header {
    padding: 70px 24px 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logs-title {
    font-size: 32px; font-weight: 700;
    color: #fff;
    letter-spacing: -0.7px;
  }
  .logs-sub {
    font-size: 13px; color: rgba(255,255,255,0.5);
    margin-top: 2px;
  }
  .logs-year-ribbon {
    display: flex; gap: 12px;
    padding: 8px 24px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .logs-year-ribbon::-webkit-scrollbar { display: none; }
  .year-pill {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 14px;
    font-size: 13px; font-weight: 500;
    color: rgba(255,255,255,0.5);
    transition: all 0.25s;
  }
  .year-pill.active {
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-weight: 600;
  }

  /* timeline */
  .timeline-wrap {
    padding: 8px 24px 100px;
    position: relative;
  }
  .timeline-line {
    position: absolute;
    left: 48px; top: 0; bottom: 0;
    width: 2px;
    background: linear-gradient(180deg, rgba(255,122,122,0.4), rgba(255,122,122,0.05));
  }
  .timeline-item {
    display: flex; gap: 20px;
    margin-bottom: 16px;
    position: relative;
  }
  .timeline-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #FF7A7A;
    margin-top: 22px;
    margin-left: 43px;
    flex-shrink: 0;
    box-shadow: 0 0 0 4px rgba(255,122,122,0.2), 0 2px 6px rgba(255,90,90,0.4);
  }
  .timeline-card {
    flex: 1;
    border-radius: 18px;
    padding: 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.07);
    backdrop-filter: blur(10px);
    transition: transform 0.25s;
  }
  .timeline-card:active { transform: scale(0.98); }
  .timeline-card .tc-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 10px;
  }
  .timeline-card .tc-site {
    font-size: 16px; font-weight: 600; color: #fff;
  }
  .timeline-card .tc-date {
    font-size: 12px; color: rgba(255,255,255,0.5);
    white-space: nowrap;
  }
  .timeline-card .tc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .tc-stat {
    display: flex; flex-direction: column; gap: 2px;
  }
  .tc-stat .tc-val {
    font-size: 15px; font-weight: 600; color: #7FC8FF;
    font-variant-numeric: tabular-nums;
  }
  .tc-stat .tc-key {
    font-size: 10px; color: rgba(255,255,255,0.45);
  }
  .tc-tags {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-top: 10px;
  }
  .tc-tag {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 8px;
    background: rgba(255,122,122,0.15);
    color: #FFB3B3;
  }

  /* ===== LONG PRESS MENU ===== */
  .longpress-menu {
    position: absolute;
    background: rgba(20,35,55,0.92);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.12);
    overflow: hidden;
    box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    z-index: 100;
    min-width: 180px;
    animation: menuPop 0.25s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes menuPop {
    0%   { opacity: 0; transform: scale(0.85) translateY(-8px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  .lp-item {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px;
    font-size: 14px;
    color: #fff;
    border-bottom: 0.5px solid rgba(255,255,255,0.08);
    transition: background 0.15s;
  }
  .lp-item:last-child { border-bottom: none; }
  .lp-item:active { background: rgba(255,255,255,0.08); }
  .lp-item.danger { color: #FF7A7A; }

  /* ===== DETAIL PAGE (fullscreen transition) ===== */
  .detail-bg {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #051525 0%, #020a12 100%);
  }
  .detail-hero {
    position: relative;
    height: 320px;
    overflow: hidden;
  }
  .detail-hero-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(400px 300px at 70% 30%, #1a5590 0%, #0a2d58 60%, #031428 100%);
  }
  .detail-hero::after {
    content: '';
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 100px;
    background: linear-gradient(180deg, transparent, #020a12);
    z-index: 2;
  }
  .back-btn {
    position: absolute;
    top: 60px; left: 16px;
    width: 38px; height: 38px;
    border-radius: 19px;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    border: 1px solid rgba(255,255,255,0.1);
    transition: transform 0.2s;
  }
  .back-btn:active { transform: scale(0.9); }
  .share-btn {
    position: absolute;
    top: 60px; right: 16px;
    width: 38px; height: 38px;
    border-radius: 19px;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    border: 1px solid rgba(255,255,255,0.1);
    transition: transform 0.2s;
  }
  .share-btn:active { transform: scale(0.9); }
  .detail-hero-content {
    position: absolute;
    bottom: 20px; left: 24px; right: 24px;
    z-index: 3;
  }
  .detail-badge {
    display: inline-block;
    padding: 5px 12px;
    border-radius: 14px;
    background: rgba(255,122,122,0.25);
    backdrop-filter: blur(10px);
    font-size: 12px; font-weight: 600;
    color: #FFB3B3;
    margin-bottom: 10px;
  }
  .detail-title {
    font-size: 28px; font-weight: 700;
    color: #fff;
    letter-spacing: -0.6px;
    margin-bottom: 4px;
  }
  .detail-subtitle {
    font-size: 14px;
    color: rgba(255,255,255,0.6);
  }

  .detail-body {
    padding: 24px;
  }
  .detail-section-title {
    font-size: 17px; font-weight: 600;
    color: #fff;
    margin-bottom: 14px;
  }

  /* depth chart card */
  .depth-card {
    border-radius: 22px;
    padding: 20px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    margin-bottom: 20px;
  }
  .depth-chart {
    position: relative;
    height: 140px;
    margin-bottom: 14px;
  }
  .depth-svg {
    width: 100%; height: 100%;
    overflow: visible;
  }
  .depth-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .ds-item {
    display: flex; flex-direction: column; gap: 3px;
  }
  .ds-val {
    font-size: 18px; font-weight: 700;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .ds-val.blue { color: #7FC8FF; }
  .ds-val.coral { color: #FF7A7A; }
  .ds-val.sand { color: #E8D5A8; }
  .ds-key {
    font-size: 11px;
    color: rgba(255,255,255,0.45);
  }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  .info-card {
    border-radius: 18px;
    padding: 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .info-card .ic-label {
    font-size: 12px; color: rgba(255,255,255,0.5);
    margin-bottom: 6px;
  }
  .info-card .ic-val {
    font-size: 16px; font-weight: 600;
    color: #fff;
  }

  .sightings-row {
    display: flex; gap: 12px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .sightings-row::-webkit-scrollbar { display: none; }
  .sighting-chip {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px 8px 8px;
    border-radius: 22px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.07);
  }
  .sighting-avatar {
    width: 28px; height: 28px;
    border-radius: 14px;
    background: linear-gradient(135deg, #1a5590, #0a2d58);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .sighting-name {
    font-size: 13px; font-weight: 500;
    color: #fff;
  }

  /* ===== CREATURES PAGE (grid collage) ===== */
  .creatures-bg {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #061628 0%, #020a12 100%);
  }
  .creatures-header {
    padding: 70px 24px 16px;
  }
  .creatures-title {
    font-size: 32px; font-weight: 700;
    color: #fff;
    letter-spacing: -0.7px;
    margin-bottom: 4px;
  }
  .creatures-sub {
    font-size: 13px; color: rgba(255,255,255,0.5);
  }
  .creatures-grid {
    padding: 0 16px 100px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: 80px;
    gap: 10px;
  }
  .creature-card {
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
  }
  .creature-card:active { transform: scale(0.96); }
  .creature-card .cc-bg {
    position: absolute; inset: 0;
    background-size: cover;
  }
  .creature-card::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 40%, rgba(3,16,29,0.9) 100%);
  }
  .creature-card .cc-info {
    position: absolute;
    left: 12px; right: 12px; bottom: 10px;
    z-index: 2;
  }
  .creature-card .cc-name {
    font-size: 14px; font-weight: 600;
    color: #fff;
  }
  .creature-card .cc-type {
    font-size: 10px;
    color: rgba(255,255,255,0.55);
  }
  .creature-card.tall { grid-row: span 2; }
  .creature-card.wide { grid-column: span 2; }

  /* ===== PROFILE PAGE (ring progress) ===== */
  .profile-bg {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #0a2540 0%, #020a12 100%);
  }
  .profile-header {
    padding: 70px 24px 20px;
    display: flex; align-items: center; gap: 16px;
  }
  .profile-avatar {
    width: 64px; height: 64px;
    border-radius: 32px;
    background: linear-gradient(135deg, #FF7A7A, #E85555);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700;
    color: #fff;
    box-shadow: 0 4px 16px rgba(255,90,90,0.4);
  }
  .profile-name {
    font-size: 22px; font-weight: 700;
    color: #fff;
    letter-spacing: -0.4px;
  }
  .profile-level {
    font-size: 13px; color: #FFB3B3;
    margin-top: 2px;
  }

  /* stats ring */
  .ring-section {
    padding: 10px 24px 24px;
    display: flex; align-items: center; gap: 20px;
  }
  .ring-wrap {
    width: 130px; height: 130px;
    flex-shrink: 0;
    position: relative;
  }
  .ring-wrap svg {
    width: 100%; height: 100%;
    transform: rotate(-90deg);
    overflow: visible;
  }
  .ring-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .ring-num {
    font-size: 30px; font-weight: 700;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .ring-label {
    font-size: 11px;
    color: rgba(255,255,255,0.55);
  }
  .ring-stats {
    flex: 1;
    display: flex; flex-direction: column;
    gap: 12px;
  }
  .ring-stat-item {
    display: flex; justify-content: space-between; align-items: center;
  }
  .ring-stat-item .key {
    font-size: 13px; color: rgba(255,255,255,0.6);
  }
  .ring-stat-item .val {
    font-size: 15px; font-weight: 600;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }

  /* certification card */
  .cert-section { padding: 0 24px 24px; }
  .cert-section-title {
    font-size: 18px; font-weight: 600;
    color: #fff;
    margin-bottom: 14px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .cert-section-title .more {
    font-size: 13px; color: #FF7A7A; font-weight: 500;
  }
  .cert-card {
    width: 100%;
    border-radius: 22px;
    padding: 22px;
    background:
      linear-gradient(145deg, #1a5590 0%, #0a2d58 50%, #051830 100%);
    border: 1px solid rgba(255,255,255,0.1);
    position: relative;
    overflow: hidden;
    box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    transition: transform 0.5s cubic-bezier(.4,0,.2,1);
    transform-style: preserve-3d;
  }
  .cert-card::before {
    content: '';
    position: absolute;
    right: -30px; top: -30px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,122,122,0.3), transparent 65%);
  }
  .cert-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 30px;
  }
  .cert-logo {
    font-size: 11px; font-weight: 700;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.8);
  }
  .cert-level-badge {
    padding: 4px 10px;
    border-radius: 10px;
    background: rgba(255,122,122,0.25);
    font-size: 10px; font-weight: 600;
    color: #FFB3B3;
  }
  .cert-name {
    font-size: 22px; font-weight: 700;
    color: #fff;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }
  .cert-holder {
    font-size: 12px;
    color: rgba(255,255,255,0.55);
    margin-bottom: 24px;
  }
  .cert-bottom {
    display: flex; justify-content: space-between;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .cert-info-block .lbl {
    font-size: 10px; color: rgba(255,255,255,0.45);
    margin-bottom: 3px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .cert-info-block .val {
    font-size: 13px; font-weight: 500;
    color: rgba(255,255,255,0.9);
  }

  /* settings list */
  .settings-group {
    margin: 0 16px 20px;
    border-radius: 20px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    overflow: hidden;
  }
  .settings-row {
    display: flex; align-items: center;
    padding: 14px 16px;
    border-bottom: 0.5px solid rgba(255,255,255,0.05);
    gap: 12px;
    transition: background 0.15s;
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-row:active { background: rgba(255,255,255,0.04); }
  .settings-icon {
    width: 30px; height: 30px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .settings-label {
    flex: 1;
    font-size: 15px;
    color: #fff;
  }
  .settings-arrow {
    opacity: 0.35;
  }

  /* ===== DESIGN SPEC PAGE ===== */
  .spec-bg {
    position: absolute; inset: 0;
    background: #0a1a2e;
    overflow-y: auto;
  }
  .spec-nav {
    position: sticky;
    top: 0;
    padding: 60px 24px 14px;
    background: linear-gradient(180deg, #0a1a2e 70%, transparent);
    z-index: 5;
    display: flex; align-items: center; gap: 12px;
  }
  .spec-title {
    font-size: 22px; font-weight: 700;
    color: #fff;
    letter-spacing: -0.4px;
    flex: 1;
  }
  .spec-body { padding: 0 24px 40px; }
  .spec-section { margin-bottom: 32px; }
  .spec-h2 {
    font-size: 13px; font-weight: 600;
    color: #FF7A7A;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 14px;
  }
  .color-swatches {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .swatch {
    display: flex; flex-direction: column;
    gap: 6px;
  }
  .swatch-block {
    height: 60px;
    border-radius: 14px;
    position: relative;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.15),
                0 4px 10px rgba(0,0,0,0.2);
  }
  .swatch-name {
    font-size: 11px;
    color: rgba(255,255,255,0.75);
    font-weight: 500;
  }
  .swatch-hex {
    font-size: 10px;
    color: rgba(255,255,255,0.4);
    font-family: 'SF Mono', monospace;
  }
  .type-samples { display: flex; flex-direction: column; gap: 10px; }
  .type-row {
    display: flex; align-items: baseline; gap: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .type-label {
    width: 70px; flex-shrink: 0;
    font-size: 10px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .type-text {
    flex: 1;
    color: #fff;
    line-height: 1.2;
  }
  .spacing-grid {
    display: grid; grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    align-items: end;
  }
  .spacing-item {
    background: rgba(255,122,122,0.3);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #FFB3B3;
    font-weight: 600;
  }
  .icon-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .icon-item {
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
    padding: 14px 8px;
    border-radius: 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .icon-item .name {
    font-size: 10px;
    color: rgba(255,255,255,0.5);
  }
  .component-card {
    border-radius: 16px;
    padding: 16px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    margin-bottom: 12px;
  }
  .component-card .cname {
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* ===== API PAGE ===== */
  .api-bg {
    position: absolute; inset: 0;
    background: #06111e;
    overflow-y: auto;
    font-family: -apple-system, system-ui, 'SF Mono', monospace;
  }
  .api-header {
    padding: 60px 24px 16px;
    position: sticky; top: 0;
    background: linear-gradient(180deg, #06111e 80%, transparent);
    z-index: 5;
  }
  .api-title {
    font-size: 22px; font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
  }
  .api-base {
    font-size: 12px;
    color: #7FC8FF;
    font-family: 'SF Mono', monospace;
    padding: 6px 10px;
    border-radius: 8px;
    background: rgba(127,200,255,0.1);
    display: inline-block;
  }
  .api-group {
    margin: 0 24px 28px;
  }
  .api-group-title {
    font-size: 13px; font-weight: 600;
    color: #FFB3B3;
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    letter-spacing: 0.3px;
  }
  .endpoint {
    border-radius: 14px;
    padding: 14px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    margin-bottom: 10px;
  }
  .endpoint-head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 8px;
  }
  .method {
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px; font-weight: 700;
    font-family: 'SF Mono', monospace;
    flex-shrink: 0;
  }
  .method.get    { background: rgba(127,200,255,0.18); color: #7FC8FF; }
  .method.post   { background: rgba(140,220,140,0.18); color: #8CDC8C; }
  .method.put    { background: rgba(255,179,102,0.18); color: #FFB366; }
  .method.delete { background: rgba(255,122,122,0.18); color: #FF7A7A; }
  .ep-path {
    font-size: 13px;
    color: #fff;
    font-family: 'SF Mono', monospace;
    font-weight: 500;
  }
  .ep-desc {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 8px;
    line-height: 1.5;
  }
  .ep-params {
    border-radius: 10px;
    padding: 10px 12px;
    background: rgba(0,0,0,0.2);
    font-family: 'SF Mono', monospace;
    font-size: 11px;
    color: rgba(255,255,255,0.65);
    line-height: 1.6;
  }
  .ep-params .key { color: #FFB3B3; }
  .ep-params .type { color: #7FC8FF; }
  .ep-params .req { color: #FF7A7A; }

  /* ===== MODAL SHEET ===== */
  .modal-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0);
    z-index: 50;
    pointer-events: none;
    transition: background 0.3s;
  }
  .modal-overlay.open {
    background: rgba(0,0,0,0.5);
    pointer-events: auto;
  }
  .modal-sheet {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, #0f2a47, #0a1d33);
    border-radius: 24px 24px 0 0;
    padding: 14px 24px calc(34px + 24px);
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(.32,.72,0,1);
    z-index: 51;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .modal-sheet.open { transform: translateY(0); }
  .sheet-grabber {
    width: 36px; height: 5px;
    border-radius: 3px;
    background: rgba(255,255,255,0.25);
    margin: 0 auto 18px;
  }
  .sheet-title {
    font-size: 20px; font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
  }
  .sheet-sub {
    font-size: 13px; color: rgba(255,255,255,0.5);
    margin-bottom: 20px;
  }
  .sheet-actions {
    display: flex; flex-direction: column; gap: 10px;
  }
  .sheet-btn {
    height: 50px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 600;
    transition: transform 0.15s, opacity 0.15s;
  }
  .sheet-btn.primary {
    background: linear-gradient(135deg, #FF7A7A, #E85555);
    color: #fff;
    box-shadow: 0 4px 16px rgba(255,90,90,0.35);
  }
  .sheet-btn.secondary {
    background: rgba(255,255,255,0.06);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .sheet-btn:active { transform: scale(0.98); opacity: 0.9; }

  /* ===== PULL TO REFRESH ===== */
  .ptr-indicator {
    position: absolute;
    top: 60px; left: 50%;
    transform: translateX(-50%) scale(0.8);
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 5;
    pointer-events: none;
  }
  .ptr-indicator.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }
  .ptr-icon {
    width: 28px; height: 28px;
    border-radius: 14px;
    background: rgba(255,122,255,0.15);
    display: flex; align-items: center; justify-content: center;
    animation: ptrFloat 1.2s ease-in-out infinite;
  }
  @keyframes ptrFloat {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(4px); }
  }

  /* ===== ENTRANCE ANIMATIONS ===== */
  .entrance-item {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.6s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== STROKE ANIMATION ===== */
  .draw-path {
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: drawStroke 3s ease-out forwards;
  }
  @keyframes drawStroke {
    to { stroke-dashoffset: 0; }
  }
  .draw-path-area {
    opacity: 0;
    animation: fadeFill 0.8s ease-out 2.2s forwards;
  }
  @keyframes fadeFill {
    to { opacity: 0.3; }
  }

  /* ===== LIGHT RAYS (ambient underwater) ===== */
  .light-ray {
    position: absolute;
    top: -20%;
    width: 120px;
    height: 140%;
    background: linear-gradient(180deg, rgba(255,255,255,0.08), transparent 70%);
    transform: rotate(12deg);
    filter: blur(12px);
    pointer-events: none;
    animation: rayDrift 8s ease-in-out infinite;
  }
  @keyframes rayDrift {
    0%,100% { transform: rotate(12deg) translateX(0); opacity: 0.4; }
    50%     { transform: rotate(10deg) translateX(20px); opacity: 0.6; }
  }

  /* ===== REDUCED MOTION ===== */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }

// ============ DEPTH CURVE DATA ============
function generateDepthProfile() {
  // Simulated dive profile: surface → descend → bottom → safety stop → surface
  const points = [];
  const totalTime = 48; // minutes
  for (let t = 0; t <= totalTime; t += 0.5) {
    let d;
    if (t < 3) d = (t / 3) * 28;           // descend
    else if (t < 8) d = 28 + Math.sin(t * 1.5) * 1.5;  // at depth with variations
    else if (t < 15) d = 28 - (t-8) * 0.8 + Math.sin(t*2)*1;  // slow ascent
    else if (t < 20) d = 22.4 + Math.sin(t*1.2)*1;  // hover at ~22m
    else if (t < 35) d = 22.4 - (t-20)*1.2 + Math.sin(t*0.8)*2;  // ascent
    else if (t < 40) d = 5;  // safety stop 5m
    else d = 5 - (t-40)*5;  // final surface
    d = Math.max(0, Math.min(35, d));
    points.push({ t, d });
  }
  return points;
}

function HomePage({ onNavigate }) {
  const scrollRef = useRef(null);
  const [pullDistance, setPullDistance] = useState(0);
  const [isRefreshing, setIsRefreshing] = useState(false);
  const startY = useRef(0);
  const isPulling = useRef(false);

  const handleTouchStart = (e) => {
    if (scrollRef.current.scrollTop <= 0) {
      startY.current = e.touches[0].clientY;
      isPulling.current = true;
    }
  };
  const handleTouchMove = (e) => {
    if (!isPulling.current) return;
    const dy = e.touches[0].clientY - startY.current;
    if (dy > 0 && scrollRef.current.scrollTop <= 0) {
      const damped = Math.min(dy * 0.5, 80);
      setPullDistance(damped);
    }
  };
  const handleTouchEnd = () => {
    if (pullDistance > 50 && !isRefreshing) {
      setIsRefreshing(true);
      setPullDistance(50);
      setTimeout(() => {
        setIsRefreshing(false);
        setPullDistance(0);
      }, 1800);
    } else {
      setPullDistance(0);
    }
    isPulling.current = false;
  };

  // Also handle mouse drag for desktop
  const mouseDown = useRef(false);
  const mouseStartY = useRef(0);
  const handleMouseDown = (e) => {
    if (scrollRef.current.scrollTop <= 0) {
      mouseDown.current = true;
      mouseStartY.current = e.clientY;
    }
  };
  const handleMouseMove = (e) => {
    if (!mouseDown.current) return;
    const dy = e.clientY - mouseStartY.current;
    if (dy > 0 && scrollRef.current.scrollTop <= 0) {
      setPullDistance(Math.min(dy * 0.5, 80));
    }
  };
  const handleMouseUp = () => {
    if (pullDistance > 50 && !isRefreshing && mouseDown.current) {
      setIsRefreshing(true);
      setPullDistance(50);
      setTimeout(() => {
        setIsRefreshing(false);
        setPullDistance(0);
      }, 1800);
    } else {
      setPullDistance(0);
    }
    mouseDown.current = false;
  };

  return (
    <div className="home-bg">
      {/* light rays */}
      <div className="light-ray" style={{ left: '20%', animationDelay: '0s' }}></div>

        </div>
      </div>

      <div

        onTouchStart={handleTouchStart}
        onTouchMove={handleTouchMove}

        onMouseDown={handleMouseDown}
        onMouseMove={handleMouseMove}
        onMouseUp={handleMouseUp}
        onMouseLeave={handleMouseUp}
        style={{ transform: `translateY(${pullDistance}px)`, transition: pullDistance === 0 && !isRefreshing ? 'transform 0.3s' : 'none' }}

// ============ LOGS PAGE ============
function LogsPage({ onNavigate, activeYear, setActiveYear }) {
  const [longPressId, setLongPressId] = useState(null);
  const [menuPos, setMenuPos] = useState({ x: 0, y: 0 });
  const pressTimer = useRef(null);

  const handleLongPressStart = (e, logId) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const parentRect = e.currentTarget.parentElement.getBoundingClientRect();
    pressTimer.current = setTimeout(() => {
      setLongPressId(logId);
      setMenuPos({
        x: rect.left - parentRect.left + rect.width / 2 - 90,
        y: rect.top - parentRect.top - 10,
      });
    }, 500);
  };

  const handlePressEnd = () => {
    if (pressTimer.current) {
      clearTimeout(pressTimer.current);
      pressTimer.current = null;
    }
  };

  const yearLogs = useMemo(() => {
    const year = activeYear;
    // Simulate: current year all logs, previous years fewer
    if (year === '2024') return diveLogs;
    if (year === '2023') return diveLogs.slice(0, 3).map(l => ({ ...l, date: l.date.replace('2024', '2023'), id: l.id + 100 }));
    return diveLogs.slice(0, 1).map(l => ({ ...l, date: l.date.replace('2024', '2022'), id: l.id + 200 }));
  }, [activeYear]);

  return (
    <div className="explore-bg" onClick={() => setLongPressId(null)}>
      <div className="logs-header">
        <div>
          <div className="logs-title">潜水日志</div>
          <div className="logs-sub">共 {diveLogs.length + 5} 次下潜 · 累计 42 小时</div>
        </div>
      </div>

      <div className="logs-year-ribbon">
        {['2024', '2023', '2022', '2021'].map(y => (
          <div
            key={y}
            className={`year-pill ${activeYear === y ? 'active' : ''}`}
            onClick={(e) => { e.stopPropagation(); setActiveYear(y); }}
          >
            {y}
            <span style={{ opacity: 0.5, marginLeft: 4 }}>
              {y === '2024' ? diveLogs.length : y === '2023' ? 3 : 1}
            </span>
          </div>
        ))}
      </div>

      <div className="timeline-wrap">
        <div className="timeline-line" />
        {yearLogs.map((log, idx) => {
          const d = new Date(log.date);
          return (
            <div key={log.id} className="timeline-item" style={{ animation: `fadeUp 0.5s cubic-bezier(.2,.8,.2,1) ${idx * 0.08}s both` }}>
              <div className="timeline-dot" />
              <div
                className="timeline-card"
                onMouseDown={(e) => { e.stopPropagation(); handleLongPressStart(e, log.id); }}
                onMouseUp={() => handlePressEnd()}
                onMouseLeave={() => handlePressEnd()}
                onTouchStart={(e) => { e.stopPropagation(); handleLongPressStart(e, log.id); }}
                onTouchEnd={() => handlePressEnd()}
                onClick={(e) => {
                  e.stopPropagation();
                  if (!longPressId) onNavigate('detail', { ...log, fromLog: true });
                }}
              >
                <div className="tc-head">
                  <div className="tc-site">{log.site}</div>
                  <div className="tc-date">
                    {d.getMonth() + 1}月{d.getDate()}日
                  </div>
                </div>
                <div className="tc-grid">
                  <div className="tc-stat">
                    <span className="tc-val">{log.depth}m</span>
                    <span className="tc-key">最大深度</span>
                  </div>
                  <div className="tc-stat">
                    <span className="tc-val">{log.duration}'</span>
                    <span className="tc-key">下潜时长</span>
                  </div>
                  <div className="tc-stat">
                    <span className="tc-val">{log.temp}°</span>
                    <span className="tc-key">水温</span>
                  </div>
                  <div className="tc-stat">
                    <span className="tc-val">{log.visibility}m</span>
                    <span className="tc-key">能见度</span>
                  </div>
                </div>
                <div className="tc-tags">
                  {log.tags.map(t => (
                    <span key={t} className="tc-tag">{t}</span>
                  ))}
                </div>
              </div>
              {longPressId === log.id && (
                <div
                  className="longpress-menu"
                  style={{ left: menuPos.x, top: menuPos.y - 140 }}
                  onClick={(e) => e.stopPropagation()}
                >
                  <div className="lp-item">
                    <Icon.Share style={{ width: 16, height: 16 }} /> 分享日志
                  </div>
                  <div className="lp-item">
                    <Icon.Award style={{ width: 16, height: 16 }} /> 标记为精选
                  </div>
                  <div className="lp-item">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                      <path d="M2 4h12M6 4V2h4v2M3 4l1 10h8l1-10" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/>
                    </svg>
                    编辑日志
                  </div>
                  <div className="lp-item danger">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                      <path d="M2 2l12 12M14 2L2 14" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>
                    </svg>
                    删除日志
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ============ DETAIL PAGE ============
function DetailPage({ data, onBack }) {
  const [scrollY, setScrollY] = useState(0);
  const scrollRef = useRef(null);
  const depthPoints = useMemo(() => generateDepthProfile(), []);
  const [showSheet, setShowSheet] = useState(false);

  const handleScroll = () => {
    if (scrollRef.current) {
      setScrollY(scrollRef.current.scrollTop);
    }
  };

  // Build depth curve path
  const chartW = 300;
  const chartH = 120;
  const maxDepth = 35;
  const totalTime = 48;

  const pathD = depthPoints.map((p, i) => {
    const x = (p.t / totalTime) * chartW;
    const y = (p.d / maxDepth) * chartH;
    return i === 0 ? `M${x},${y}` : `L${x},${y}`;
  }).join(' ');

  const areaD = `${pathD} L${chartW},${chartH} L0,${chartH} Z`;

  const isLog = data && data.fromLog;
  const title = data?.site || data?.name || '诗巴丹·海龟洞';
  const subtitle = isLog ? `${data.date} · ${data.level}` : (data?.location || '马来西亚·仙本那');

  return (
    <div className="detail-bg">
      {/* hero with parallax */}
      <div className="detail-hero">
        <div
          className="detail-hero-bg"
          style={{
            transform: `translateY(${scrollY * 0.4}px) scale(${1 + Math.max(0, -scrollY / 400)})`,
            transformOrigin: 'center top',
          }}
        >
          {/* underwater scene */}
          <svg style={{ position: 'absolute', bottom: 0, width: '100%', height: '60%', opacity: 0.3 }} viewBox="0 0 400 200" preserveAspectRatio="none">
            <path d="M0 200 Q100 100 200 140 T400 120 L400 200 Z" fill="#7FC8FF" opacity="0.3"/>
            <path d="M0 200 Q80 140 180 170 T400 160 L400 200 Z" fill="#7FC8FF" opacity="0.5"/>
          </svg>
          {/* light shafts */}
          <div className="light-ray" style={{ left: '30%', animationDelay: '0s', opacity: 0.5 }} />
          <div className="light-ray" style={{ left: '70%', animationDelay: '-4s', opacity: 0.35 }} />
        </div>
        <div className="back-btn" onClick={onBack}>
          <Icon.Back style={{ color: '#fff', width: 18, height: 18 }} />
        </div>
        <div className="share-btn" onClick={() => setShowSheet(true)}>
          <Icon.Share style={{ color: '#fff', width: 18, height: 18 }} />
        </div>
        <div className="detail-hero-content">
          <div className="detail-badge">{isLog ? '潜水日志 #' + (data?.id || '001') : data?.type || '潜点'}</div>
          <div className="detail-title">{title}</div>
          <div className="detail-subtitle">{subtitle}</div>
        </div>
      </div>

      {/* scrollable body */}
      <div
        ref={scrollRef}
        onScroll={handleScroll}
        style={{
          position: 'absolute', top: 300, bottom: 0, left: 0, right: 0,
          overflowY: 'auto',
          scrollbarWidth: 'none',
        }}
      >
        <div className="detail-body">
          {/* depth card */}
          {isLog && (
            <div className="depth-card">
              <div className="detail-section-title" style={{ fontSize: 15, marginBottom: 12 }}>
                深度曲线
              </div>
              <div className="depth-chart">
                <svg className="depth-svg" viewBox={`0 0 ${chartW} ${chartH}`} preserveAspectRatio="none">
                  {/* grid lines */}
                  {[0, 10, 20, 30].map(d => (
                    <line
                      key={d}
                      x1="0" y1={(d / maxDepth) * chartH}
                      x2={chartW} y2={(d / maxDepth) * chartH}
                      stroke="rgba(255,255,255,0.06)"
                      strokeDasharray="4 4"
                    />
                  ))}
                  {/* area fill */}
                  <path
                    d={areaD}
                    fill="url(#depthGradient)"
                    className="draw-path-area"
                  />
                  {/* line */}
                  <path
                    d={pathD}

                      <stop offset="0%" stopColor="#7FC8FF" />
                      <stop offset="100%" stopColor="#FF7A7A" />
                    </linearGradient>
                    <linearGradient id="depthGradient" x1="0" x2="0" y1="0" y2="1">
                      <stop offset="0%" stopColor="#7FC8FF" stopOpacity="0.4" />
                      <stop offset="100%" stopColor="#7FC8FF" stopOpacity="0" />
                    </linearGradient>
                  </defs>
                  {/* depth labels */}
                  {[0, 10, 20, 30].map(d => (
                    <text
                      key={d}
                      x={chartW - 4}
                      y={(d / maxDepth) * chartH + 3}
                      fill="rgba(255,255,255,0.3)"

          <div className="detail-section-title">

          <div className="info-grid">
            {isLog ? (
              <>

                  <div className="ic-label">气瓶</div>
                  <div className="ic-val">{data?.gas}</div>
                </div>
                <div className="info-card">

                </div>
                <div className="info-card">
                  <div className="ic-label">配重</div>
                  <div className="ic-val">4 kg</div>
                </div>
                <div className="info-card">
                  <div className="ic-label">湿衣</div>
                  <div className="ic-val">3mm 连体</div>
                </div>
              </>
            ) : (
              <>
                <div className="info-card">
                  <div className="ic-label">最大深度</div>
                  <div className="ic-val">{data?.depth || '40m'}</div>
                </div>
                <div className="info-card">
                  <div className="ic-label">难度等级</div>

// ============ APP ROOT ============
function App() {
  const [tab, setTab] = useState('home');
  const [stack, setStack] = useState([]); // pages pushed on top of tab
  const [year, setYear] = useState('2024');
  const [transitioning, setTransitioning] = useState(false);
  const [navDirection, setNavDirection] = useState('right'); // right = forward

  const navigate = useCallback((target, data) => {
    if (transitioning) return;
    setTransitioning(true);
    setNavDirection('right');

    if (target === 'detail' || target === 'spec' || target === 'api') {
      setStack(s => [...s, { key: target, data }]);
    } else {
      // tab switch
      setTab(target);
      setStack([]);
    }
    setTimeout(() => setTransitioning(false), 450);
  }, [transitioning]);

  const goBack = useCallback(() => {
    if (transitioning) return;
    if (stack.length === 0) return;
    setTransitioning(true);
    setNavDirection('left');
    setTimeout(() => {
      setStack(s => s.slice(0, -1));
      setTransitioning(false);
    }, 450);
  }, [transitioning, stack.length]);

  // current page content
  const currentPage = stack.length > 0 ? stack[stack.length - 1] : { key: tab, data: null };
  const showTabBar = stack.length === 0;

  const renderPage = (key, data) => {
    switch (key) {
      case 'home': return <HomePage onNavigate={navigate} />;
      case 'explore': return <ExplorePage />;
      case 'logs': return <LogsPage onNavigate={navigate} activeYear={year} setActiveYear={setYear} />;
      case 'creatures': return <CreaturesPage />;
      case 'profile': return <ProfilePage onNavigate={navigate} />;
      case 'detail': return <DetailPage data={data} onBack={goBack} />;
      case 'spec': return <SpecPage onBack={goBack} />;
      case 'api': return <ApiPage onBack={goBack} />;
      default: return null;
    }
  };

  return (
    <IOSDevice dark={true}>
      <div style={{ position: 'absolute', inset: 0 }}>
        {/* base tab page */}
        <div
          className={`screen-page ${stack.length > 0 ? (navDirection === 'right' ? 'from-left' : 'exiting') : 'active'}`}
          style={{
            opacity: stack.length > 0 ? (navDirection === 'right' ? 0.3 : 0.3) : 1,
            pointerEvents: stack.length > 0 ? 'none' : 'auto',
          }}
        >
          {renderPage(tab, null)}
          {showTabBar && <TabBar active={tab} onChange={navigate} />}
        </div>

        {/* stack pages */}
        {stack.map((page, i) => {
          const isTop = i === stack.length - 1;
          const isTransitioning = transitioning && isTop;
          return (
            <div
              key={`${page.key}-${i}`}
              className={`screen-page ${isTop && navDirection === 'right' && isTransitioning ? 'from-right' : ''} ${isTop ? 'active' : ''}`}
              style={{
                zIndex: 20 + i,
                opacity: isTop ? 1 : 0,
                pointerEvents: isTop ? 'auto' : 'none',
                transform: isTop ? 'translateX(0)' : (navDirection === 'right' ? 'translateX(100%)' : 'translateX(-30%)'),
              }}
            >
              {renderPage(page.key, page.data)}
            </div>
          );
        })}
      </div>
    </IOSDevice>
  );
}

// ============ MOUNT ============
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// ============ CUSTOM CURSOR (vanilla, high-performance) ============
(function initCursor() {
  const outer = document.getElementById('cursorOuter');
  const inner = document.getElementById('cursorInner');
  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let outerX = mouseX;
  let outerY = mouseY;
  let rafId = null;
  let isVisible = true;

  // position inner directly (high frequency)
  function onMouseMove(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
    inner.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
    if (!rafId) rafId = requestAnimationFrame(tickOuter);
  }

  function tickOuter() {
    // lerp outer toward mouse
    outerX += (mouseX - outerX) * 0.18;
    outerY += (mouseY - outerY) * 0.18;
    outer.style.transform = `translate(${outerX}px, ${outerY}px) translate(-50%, -50%)`;
    if (Math.abs(mouseX - outerX) > 0.5 || Math.abs(mouseY - outerY) > 0.5) {
      rafId = requestAnimationFrame(tickOuter);
    } else {
      rafId = null;
    }
  }

  // click ripple
  function onClick(e) {
    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 650);
  }

  // hover detection
  function onMouseOver(e) {
    const t = e.target;
    if (t.closest && (
      t.closest('.tab-item') || t.closest('.fab') || t.closest('.chip') ||
      t.closest('.site-card') || t.closest('.log-item') || t.closest('.gallery-card') ||
      t.closest('.creature-card') || t.closest('.back-btn') || t.closest('.share-btn') ||
      t.closest('.settings-row') || t.closest('.section-more') || t.closest('.sheet-btn') ||
      t.closest('.cert-card') || t.closest('.lp-item') || t.closest('.year-pill') ||
      t.closest('.endpoint') || t.closest('.timeline-card')
    )) {
      document.body.classList.add('cursor-hover');
    } else {
      document.body.classList.remove('cursor-hover');
    }
  }

  function onMouseDown() {
    document.body.classList.add('cursor-down');
  }
  function onMouseUp() {
    document.body.classList.remove('cursor-down');
  }

  // pause on visibility change
  function onVisibility() {
    if (document.hidden) {
      isVisible = false;
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    } else {
      isVisible = true;
      rafId = requestAnimationFrame(tickOuter);
    }
  }

  window.addEventListener('mousemove', onMouseMove, { passive: true });
  window.addEventListener('mousedown', onMouseDown);
  window.addEventListener('mouseup', onMouseUp);
  window.addEventListener('mouseover', onMouseOver, { passive: true });
  window.addEventListener('click', onClick);
  document.addEventListener('visibilitychange', onVisibility);

  // initial position (center screen)
  inner.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
  outer.style.transform = `translate(${outerX}px, ${outerY}px) translate(-50%, -50%)`;
  rafId = requestAnimationFrame(tickOuter);

  // cleanup on unload
  window.addEventListener('beforeunload', () => {
    if (rafId) cancelAnimationFrame(rafId);
    window.removeEventListener('mousemove', onMouseMove);
    window.removeEventListener('click', onClick);
    document.removeEventListener('visibilitychange', onVisibility);
  });
})();

// ============ STAGE BUBBLES (ambient) ============
(function initStageBubbles() {
  const container = document.getElementById('stageBubbles');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) return;

  const count = 12;
  let timers = [];

  function createBubbles() {
    for (let i = 0; i < count; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      const size = 4 + Math.random() * 16;
      b.style.width = size + 'px';
      b.style.height = size + 'px';
      b.style.left = Math.random() * 100 + '%';
      b.style.animationDuration = (8 + Math.random() * 10) + 's';
      b.style.animationDelay = (Math.random() * 8) + 's';
      container.appendChild(b);
    }
  }

  function clearAll() {
    container.innerHTML = '';
    timers.forEach(t => clearTimeout(t));
    timers = [];
  }

  createBubbles();

  // pause on hidden
  function onVis() {
    if (document.hidden) {
      container.style.animationPlayState = 'paused';
      Array.from(container.children).forEach(c => c.style.animationPlayState = 'paused');
    } else {
      Array.from(container.children).forEach(c => c.style.animationPlayState = 'running');
    }
  }
  document.addEventListener('visibilitychange', onVis);
})();

// ============ UPGRADE ANNOUNCEMENT ============
function announceUpgrade() {
  try {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  } catch(e) {}
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}

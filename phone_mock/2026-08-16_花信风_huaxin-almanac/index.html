  }

    background: rgba(255,255,255,0.6);

  .tabbar {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 40;
    height: calc(56px + var(--ios-safe-bottom));
    padding-bottom: var(--ios-safe-bottom);
    background: rgba(247, 243, 232, 0.85);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 0.5px solid rgba(0,0,0,0.06);

  }
  .page-enter {
    animation: pagePushIn 0.35s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
  }
  .page-leave {
    animation: pagePushOut 0.35s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;

  @keyframes pagePushIn {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }

    from { transform: translateX(0); }
    to { transform: translateX(-25%); filter: brightness(0.85); }
  }
  .page-back-enter {
    animation: pageBackIn 0.35s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;

    from { transform: translateX(0); }

    0% { background-position: -200% 0; }

  @keyframes bloomScale {
    0% { transform: scale(0.4); opacity: 0; filter: blur(8px); }
    60% { transform: scale(1.08); opacity: 1; filter: blur(0); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes bloomRotate {
    0% { transform: rotate(-30deg) scale(0); }
    100% { transform: rotate(0deg) scale(1); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }

  .bottom-sheet-mask {
    position: absolute; inset: 0; z-index: 80;
    background: rgba(0,0,0,0.4);

  .ptr-indicator {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    color: var(--ai-green); font-size: 12px;
    display: flex; flex-direction: column; align-items: center;

  .ptr-spinner {
    width: 22px; height: 22px; border-radius: 50%;

    animation: spin 0.8s linear infinite;

  /* ── Ring progress ── */
  .ring-bg { stroke: rgba(95,122,97,0.15); }

    stroke: var(--ai-green); stroke-linecap: round;

  .swipe-cell-wrap { position: relative; overflow: hidden; }
  .swipe-actions {
    position: absolute; top: 0; right: 0; bottom: 0;

      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .petal-canvas { display: none; }
  }
</style>

// ───────────────────────────────────────────
// App context: page stack, tab, navigation
// ───────────────────────────────────────────
const AppContext = createContext(null);

function useApp() {
  const ctx = useContext(AppContext);
  if (!ctx) throw new Error('useApp must be inside AppProvider');
  return ctx;
}

function AppProvider({ children }) {
  const [tab, setTab] = useState('home'); // home | calendar | news | profile
  const [stack, setStack] = useState([]); // [{ key, component, props }]
  const [direction, setDirection] = useState('push'); // push | pop
  const [sheet, setSheet] = useState(null); // { type, data }

  const push = useCallback((component, props = {}) => {
    setDirection('push');
    setStack(s => [...s, { key: Date.now() + Math.random(), component, props }]);
  }, []);

  const pop = useCallback(() => {
    setDirection('pop');
    setStack(s => s.slice(0, -1));
  }, []);

  const openSheet = useCallback((type, data = {}) => {
    setSheet({ type, data });
  }, []);

  const closeSheet = useCallback(() => setSheet(null), []);

  const switchTab = useCallback((t) => {
    setTab(t);
    setStack([]); // clear stack on tab switch
  }, []);

  const value = { tab, switchTab, stack, push, pop, direction, sheet, openSheet, closeSheet };
  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

// ───────────────────────────────────────────
// Petal particle system (RAF + gravity + wind)
// ───────────────────────────────────────────
function PetalCanvas({ count = 22, color = '#C0453E', color2 = '#E3B04B' }) {
  const canvasRef = useRef(null);
  const rafRef = useRef(0);
  const petalsRef = useRef([]);
  const visibleRef = useRef(true);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let w = 0, h = 0, dpr = window.devicePixelRatio || 1;

    const resize = () => {
      const rect = canvas.getBoundingClientRect();
      w = rect.width; h = rect.height;
      canvas.width = w * dpr; canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();

    // Initialize petals
    const palette = [color, color2, '#E8D5C0', '#D4A574'];
    petalsRef.current = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: -Math.random() * h * 0.8,
      vx: (Math.random() - 0.3) * 0.8,
      vy: 0.3 + Math.random() * 0.8,
      size: 4 + Math.random() * 8,
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 0.06,
      color: palette[Math.floor(Math.random() * palette.length)],
      opacity: 0.4 + Math.random() * 0.5,
      phase: Math.random() * Math.PI * 2,
      swayAmp: 10 + Math.random() * 25,
      swayFreq: 0.01 + Math.random() * 0.02,
    }));

    let lastTime = performance.now();
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const drawPetal = (p) => {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = p.opacity;
      ctx.fillStyle = p.color;
      // Simple petal shape: teardrop/ellipse
      ctx.beginPath();
      ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
      // Vein line
      ctx.globalAlpha = p.opacity * 0.4;
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(-p.size * 0.8, 0);
      ctx.lineTo(p.size * 0.8, 0);
      ctx.stroke();
      ctx.restore();
    };

    const tick = (now) => {
      if (!visibleRef.current) { rafRef.current = requestAnimationFrame(tick); return; }
      const dt = Math.min(now - lastTime, 50); // cap dt
      lastTime = now;
      ctx.clearRect(0, 0, w, h);

      for (const p of petalsRef.current) {
        // Gravity + wind sway (sine wave horizontal drift)
        p.phase += p.swayFreq * dt * 0.1;
        const sway = Math.sin(p.phase) * p.swayAmp * 0.02;
        p.vx += sway * 0.05;
        // Air resistance
        p.vx *= 0.995;
        p.vy += 0.002 * dt * 0.1; // gentle gravity
        p.x += p.vx * dt * 0.06;
        p.y += p.vy * dt * 0.06;
        p.rot += p.vrot * dt * 0.06;

        // Wrap around
        if (p.y > h + 20) {
          p.y = -15;
          p.x = Math.random() * w;
          p.vy = 0.3 + Math.random() * 0.8;
        }
        if (p.x < -20) p.x = w + 10;
        if (p.x > w + 20) p.x = -10;

        drawPetal(p);
      }

      if (!reduced) rafRef.current = requestAnimationFrame(tick);
    };

    if (!reduced) rafRef.current = requestAnimationFrame(tick);

    const onResize = () => resize();
    window.addEventListener('resize', onResize);

    // Visibility API
    const onVisibility = () => {
      visibleRef.current = !document.hidden;
      if (!document.hidden && !reduced) {
        lastTime = performance.now();
        rafRef.current = requestAnimationFrame(tick);
      }
    };
    document.addEventListener('visibilitychange', onVisibility);

    return () => {
      cancelAnimationFrame(rafRef.current);
      window.removeEventListener('resize', onResize);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, [count, color, color2]);

  return <canvas ref={canvasRef} className="petal-canvas" />;
}

// ───────────────────────────────────────────
// Decorative flower SVG (bloom animation)
// ───────────────────────────────────────────
function FlowerSvg({ color, accent, size = 120, petals = 6, style = {} }) {
  const petalPath = 'M50 0 C70 20, 70 50, 50 70 C30 50, 30 20, 50 0 Z';
  const arr = [];
  for (let i = 0; i < petals; i++) {
    const angle = (360 / petals) * i;
    arr.push(
      <g key={i} style={{
        transformOrigin: '50px 50px',
        transform: `rotate(${angle}deg)`,
        opacity: 0.85,
      }}>
        <path d={petalPath} fill={color} />
      </g>
    );
  }
  return (
    <svg viewBox="0 0 100 100" width={size} height={size} style={style}>
      {arr}
      <circle cx="50" cy="50" r="10" fill={accent} />
      <circle cx="50" cy="50" r="4" fill="#fff" opacity="0.7" />
    </svg>
  );
}

function CalendarPage() {
  const { push } = useApp();
  const [activeMonth, setActiveMonth] = useState(3);
  const [refreshing, setRefreshing] = useState(false);
  const scrollRef = useRef(null);
  const pullStartY = useRef(0);
  const pullDistance = useRef(0);
  const [pullOffset, setPullOffset] = useState(0);

  const monthFlowers = useMemo(() =>
    FLOWERS.filter(f => f.month === activeMonth),
  [activeMonth]);

  // Pull to refresh
  const onTouchStart = (e) => {
    if (scrollRef.current.scrollTop <= 0) {
      pullStartY.current = e.touches[0].clientY;
    }
  };
  const onTouchMove = (e) => {
    if (pullStartY.current && scrollRef.current.scrollTop <= 0) {
      const dy = e.touches[0].clientY - pullStartY.current;
      if (dy > 0) {
        pullDistance.current = Math.min(dy * 0.5, 80);
        setPullOffset(pullDistance.current);
      }
    }
  };
  const onTouchEnd = () => {
    if (pullDistance.current > 60 && !refreshing) {
      setRefreshing(true);
      setPullOffset(50);
      setTimeout(() => {
        setRefreshing(false);
        setPullOffset(0);
      }, 1500);
    } else {
      setPullOffset(0);
    }
    pullStartY.current = 0;
    pullDistance.current = 0;
  };

  // Mosaic layout: 2 columns with varying heights
  const renderMosaic = () => {
    return (
      <div style={{
        display: 'grid', gridTemplateColumns: '1fr 1fr',
        gap: 12, padding: '16px 20px 100px',
      }}>
        {monthFlowers.map((f, i) => {
          const tall = i % 3 === 0;
          return (
            <div key={f.id} onClick={() => push('detail', { flowerId: f.id })} style={{
              gridRow: tall ? 'span 2' : 'span 1',
              borderRadius: 18,
              background: `linear-gradient(160deg, ${f.color} 0%, #fff 100%)`,
              padding: '16px 14px',
              display: 'flex', flexDirection: 'column', justifyContent: 'space-between',
              position: 'relative', overflow: 'hidden',
              boxShadow: '0 4px 16px rgba(0,0,0,0.05)',
              cursor: 'pointer',
              minHeight: tall ? 220 : 140,
            }}>
              <div style={{
                position: 'absolute', top: -20, right: -20, opacity: 0.4,
              }}>
                <FlowerSvg color={f.color} accent={f.accent} size={100} petals={5 + (i % 4)} />
              </div>
              <div style={{ position: 'relative', zIndex: 2 }}>
                <div style={{
                  fontSize: 11, color: f.accent, fontWeight: 600,
                  letterSpacing: 1, marginBottom: 4,
                }}>
                  第{f.order}番 · {f.term}
                </div>
                <div className="font-serif" style={{
                  fontSize: tall ? 26 : 20, fontWeight: 800,
                  color: 'var(--ink)', letterSpacing: 2,
                }}>{f.name}</div>
              </div>
              <div style={{ position: 'relative', zIndex: 2 }}>
                <div style={{ fontSize: 11, color: 'var(--ink-mute)', marginBottom: 4 }}>
                  {f.meaning}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    );
  };

  return (
    <div className="scroll-area" ref={scrollRef}
      onTouchStart={onTouchStart}
      onTouchMove={onTouchMove}
      onTouchEnd={onTouchEnd}
      style={{
        position: 'absolute', inset: 0, overflowY: 'auto',
        background: 'var(--rice-paper)',
      }}>
      <MPNavBar style="frosted" />

      {/* Pull to refresh indicator */}
      <div style={{
        height: pullOffset, display: 'flex', alignItems: 'flex-end',
        justifyContent: 'center', paddingBottom: 8,
        transition: refreshing ? 'none' : 'height 0.3s ease',
      }}>
        {pullOffset > 0 && (
          <div className="ptr-indicator" style={{ position: 'relative' }}>
            {refreshing ? (
              <div className="ptr-spinner" />
            ) : (
              <svg width="20" height="20" viewBox="0 0 20 20" style={{
                transform: `rotate(${Math.min(pullOffset / 60, 1) * 360}deg)`,
                transition: 'transform 0.1s linear',
              }}>
                <path d="M10 2v4M10 14v4M3 10H7M13 10h4M5 5l2.5 2.5M12.5 12.5L15 15M5 15l2.5-2.5M12.5 7.5L15 5"
                  stroke="var(--ai-green)" strokeWidth="1.5" strokeLinecap="round" fill="none"/>
              </svg>
            )}
            <span style={{ fontSize: 11, color: 'var(--ai-green-deep)' }}>
              {refreshing ? '加载中…' : pullOffset > 60 ? '松开刷新' : '下拉刷新'}
            </span>
          </div>
        )}
      </div>

      {/* Header */}
      <div style={{
        paddingTop: 'calc(var(--ios-safe-top) + 56px)',
        paddingLeft: 20, paddingRight: 20, paddingBottom: 8,
      }}>
        <h1 className="font-serif" style={{
          fontSize: 30, fontWeight: 800, color: 'var(--ink)',
          letterSpacing: 3,
        }}>花历</h1>
        <p style={{ fontSize: 13, color: 'var(--ink-mute)', marginTop: 4, letterSpacing: 1 }}>
          二十四番花信风 · 二十四番花开
        </p>
      </div>

      {/* Sticky month tabs */}
      <div className="sticky-tabs" style={{
        position: 'sticky', top: 'calc(var(--ios-safe-top) + 44px)',
        zIndex: 15, background: 'rgba(247, 243, 232, 0.9)',
        backdropFilter: 'blur(12px)',
        padding: '10px 20px',
        borderBottom: '0.5px solid rgba(0,0,0,0.05)',
      }}>
        <div style={{ display: 'flex', gap: 8, overflowX: 'auto' }} className="scroll-area">
          {MONTHS.map(m => (
            <div key={m.id} onClick={() => setActiveMonth(m.id)} style={{
              flexShrink: 0, padding: '8px 16px', borderRadius: 100,
              background: activeMonth === m.id ? 'var(--ai-green)' : 'transparent',
              color: activeMonth === m.id ? '#fff' : 'var(--ink-soft)',
              fontSize: 14, fontWeight: 500,
              transition: 'all 0.25s ease',
              cursor: 'pointer',
              display: 'flex', alignItems: 'center', gap: 6,
            }}>
              <span className="font-serif">{m.name}</span>
              <span style={{ fontSize: 11, opacity: 0.7 }}>{m.solar}</span>
            </div>
          ))}
        </div>
      </div>

      {/* Mosaic grid */}
      {renderMosaic()}
    </div>
  );
}

// FLOWER DETAIL PAGE  (hero + parallax + sticky bottom bar)
// ───────────────────────────────────────────
function DetailPage({ flowerId }) {
  const { pop } = useApp();
  const flower = FLOWERS.find(f => f.id === flowerId) || FLOWERS[0];
  const scrollRef = useRef(null);
  const [scrollY, setScrollY] = useState(0);
  const [collected, setCollected] = useState(false);
  const rafRef = useRef(0);
  const ticking = useRef(false);

  // High performance scroll: use RAF + direct DOM transform for parallax
  const heroRef = useRef(null);
  const titleRef = useRef(null);
  const navBarRef = useRef(null);

  const onScroll = useCallback(() => {
    if (!ticking.current) {
      ticking.current = true;
      rafRef.current = requestAnimationFrame(() => {
        const y = scrollRef.current?.scrollTop || 0;
        // Direct DOM manipulation for parallax
        if (heroRef.current) {
          const scale = Math.max(1, 1 + y * -0.003);
          const yOffset = y * 0.4;
          heroRef.current.style.transform = `translateY(${yOffset}px) scale(${scale})`;
          heroRef.current.style.opacity = Math.max(0, 1 - y / 300);
        }
        if (titleRef.current) {
          titleRef.current.style.transform = `translateY(${Math.max(0, y - 120) * 0.3}px)`;
          titleRef.current.style.opacity = Math.max(0, 1 - (y - 80) / 120);
        }
        if (navBarRef.current) {
          if (y > 200) {
            navBarRef.current.style.background = 'rgba(247, 243, 232, 0.92)';
            navBarRef.current.style.backdropFilter = 'blur(18px)';
          } else {
            navBarRef.current.style.background = 'transparent';
            navBarRef.current.style.backdropFilter = 'none';
          }
        }
        setScrollY(y);
        ticking.current = false;
      });
    }
  }, []);

  useEffect(() => {
    return () => cancelAnimationFrame(rafRef.current);
  }, []);

  const sections = [
    { label: '花信', icon: '花' },
    { label: '诗词', icon: '诗' },
    { label: '花语', icon: '意' },
  ];

  return (
    <div className="scroll-area" ref={scrollRef} onScroll={onScroll} style={{
      position: 'absolute', inset: 0, overflowY: 'auto',
      background: 'var(--rice-paper)',
    }}>
      {/* Custom nav bar that changes on scroll */}
      <div ref={navBarRef} style={{
        position: 'fixed', top: 0, left: 0, right: 0, zIndex: 25,
        height: 'calc(var(--ios-safe-top) + 44px)',
        display: 'flex', alignItems: 'flex-end', justifyContent: 'center',
        paddingBottom: 10, transition: 'background 0.3s',
      }}>
        <div onClick={pop} style={{
          position: 'absolute', left: 16, bottom: 8,
          width: 32, height: 32, borderRadius: '50%',
          background: 'rgba(0,0,0,0.2)', backdropFilter: 'blur(10px)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          cursor: 'pointer',
        }}>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M11 3L5 9L11 15" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </div>
        <div className="font-sans" style={{
          fontSize: 17, fontWeight: 600, color: 'var(--ink)',
          opacity: scrollY > 220 ? 1 : 0,
          transition: 'opacity 0.2s', letterSpacing: 2,
        }}>{flower.name}</div>
      </div>

      {/* Hero image with parallax */}
      <div ref={heroRef} style={{
        height: 380, position: 'relative',
        background: `linear-gradient(180deg, ${flower.color} 0%, ${flower.color}99 60%, var(--rice-paper) 100%)`,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        overflow: 'hidden',
        willChange: 'transform, opacity',
      }}>
        <PetalCanvas count={18} color={flower.accent} color2={flower.color} />
        <div style={{ position: 'relative', zIndex: 2 }} className="animate-bloom">
          <FlowerSvg color="#fff" accent={flower.accent} size={220} petals={6} />
        </div>
        <div style={{
          position: 'absolute', bottom: -20, left: -40, opacity: 0.3,
        }} className="animate-fadein">
          <FlowerSvg color={flower.accent} accent={flower.color} size={140} petals={8} />
        </div>
      </div>

      {/* Floating title */}
      <div ref={titleRef} style={{
        position: 'absolute', top: 260, left: 0, right: 0,
        padding: '0 24px', zIndex: 3,
        willChange: 'transform, opacity',
      }}>
        <div style={{
          display: 'inline-block', padding: '4px 12px', borderRadius: 100,
          background: 'rgba(255,255,255,0.7)', backdropFilter: 'blur(8px)',
          color: flower.accent, fontSize: 12, fontWeight: 600,
          marginBottom: 10,
        }}>
          第{flower.order}番 · {flower.term} · {flower.monthName}
        </div>
        <h1 className="font-serif" style={{
          fontSize: 52, fontWeight: 900, color: 'var(--ink)',
          letterSpacing: 6, lineHeight: 1,
          textShadow: '0 2px 20px rgba(255,255,255,0.5)',
        }}>{flower.name}</h1>
        <div className="font-serif" style={{
          fontSize: 14, color: 'var(--ink-soft)', fontStyle: 'italic',
          marginTop: 4, letterSpacing: 1,
        }}>{flower.latin}</div>
      </div>

      {/* Content */}
      <div style={{ padding: '32px 24px 120px' }}>
        {/* Poem block */}
        <div style={{
          background: `linear-gradient(135deg, ${flower.color}66 0%, #fff 100%)`,
          borderRadius: 20, padding: '24px 20px',
          position: 'relative', overflow: 'hidden',
          marginBottom: 28,
        }}>
          <div className="font-serif" style={{
            fontSize: 18, lineHeight: 2, color: 'var(--ink)',
            letterSpacing: 2, fontWeight: 500,
          }}>
            「{flower.poem}」
          </div>
          <div style={{
            textAlign: 'right', marginTop: 12,
            fontSize: 13, color: 'var(--ink-mute)',
          }}>—— {flower.poet}</div>
          <div style={{
            position: 'absolute', bottom: -30, right: -30, opacity: 0.15,
          }}>
            <FlowerSvg color={flower.accent} accent={flower.color} size={120} petals={5} />
          </div>
        </div>

        {/* Info sections */}
        <div style={{ marginBottom: 24 }}>
          <h3 className="font-serif" style={{
            fontSize: 20, fontWeight: 700, color: 'var(--ink)',
            marginBottom: 12, letterSpacing: 2,
          }}>花之语</h3>
          <p style={{
            fontSize: 14, color: 'var(--ink-soft)', lineHeight: 1.8,
          }}>{flower.desc}</p>
          <div style={{
            display: 'flex', gap: 8, marginTop: 14, flexWrap: 'wrap',
          }}>
            {flower.meaning.split(' · ').map((m, i) => (
              <span key={i} style={{
                padding: '6px 14px', borderRadius: 100,
                background: `${flower.color}`,
                color: flower.accent,
                fontSize: 12, fontWeight: 500,
              }}>{m}</span>
            ))}
          </div>
        </div>

        {/* Nearby flowers */}
        <div style={{ marginBottom: 24 }}>
          <h3 className="font-serif" style={{
            fontSize: 20, fontWeight: 700, color: 'var(--ink)',
            marginBottom: 12, letterSpacing: 2,
          }}>同节令花信</h3>
          <div style={{ display: 'flex', gap: 10, overflowX: 'auto' }} className="scroll-area">
            {FLOWERS.filter(f => f.term === flower.term && f.id !== flower.id).map(f => (
              <div key={f.id} style={{
                flexShrink: 0, width: 100,
                background: '#fff', borderRadius: 14, padding: 12,
                textAlign: 'center',
                boxShadow: '0 2px 8px rgba(0,0,0,0.04)',
              }}>
                <div style={{
                  width: 60, height: 60, margin: '0 auto 8px',
                  borderRadius: '50%',
                  background: `linear-gradient(135deg, ${f.color}, #fff)`,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                }}>
                  <FlowerSvg color={f.color} accent={f.accent} size={40} petals={6} />
                </div>
                <div className="font-serif" style={{ fontSize: 14, fontWeight: 600 }}>{f.name}</div>
                <div style={{ fontSize: 11, color: 'var(--ink-mute)' }}>第{f.order}番</div>
              </div>
            ))}
          </div>
        </div>

        {/* Details table */}
        <div style={{ marginBottom: 24 }}>
          <h3 className="font-serif" style={{
            fontSize: 20, fontWeight: 700, color: 'var(--ink)',
            marginBottom: 12, letterSpacing: 2,
          }}>花信档案</h3>
          <div style={{
            background: '#fff', borderRadius: 16, overflow: 'hidden',
          }}>
            {[
              { k: '花名', v: flower.name },
              { k: '节令', v: `${flower.term} · 第${['一','二','三'][(flower.order - 1) % 3]}候` },
              { k: '月份', v: `${flower.monthName}（${flower.month}月）` },
              { k: '学名', v: flower.latin },

            ].map((row, i, arr) => (

            ))}
          </div>
        </div>
      </div>

      {/* Sticky bottom action bar */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 30,
        padding: '12px 16px calc(12px + var(--ios-safe-bottom))',
        background: 'rgba(247, 243, 232, 0.92)',

        <div onClick={() => setCollected(!collected)} style={{
          width: 44, height: 44, borderRadius: 14,
          background: '#fff',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          cursor: 'pointer',

            <path d="M11 19C11 19 3 13.5 3 8.5C3 5.5 5.5 3 8.5 3C10 3 11 4 11 4C11 4 12 3 13.5 3C16.5 3 19 5.5 19 8.5C19 13.5 11 19 11 19Z"

          boxShadow: '0 2px 8px rgba(0,0,0,0.04)',

          letterSpacing: 2,
          boxShadow: '0 4px 12px rgba(95,122,97,0.3)',
        }}>记录今日花事</button>
      </div>
    </div>
  );
}

// NEWS / ARTICLES PAGE  (card stream + left swipe favorite)

function NewsPage() {
  const { push } = useApp();
  const [loading, setLoading] = useState(true);
  const [favorites, setFavorites] = useState(new Set());

  useEffect(() => {
    const t = setTimeout(() => setLoading(false), 1200);
    return () => clearTimeout(t);
  }, []);

  const toggleFav = (id, e) => {
    e.stopPropagation();
    setFavorites(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };

  return (
    <div className="scroll-area" style={{
      position: 'absolute', inset: 0, overflowY: 'auto',
      background: 'var(--rice-paper)',
    }}>
      <MPNavBar style="frosted" title="花讯" />

        }} className="scroll-area">

            <div key={c} style={{
              flexShrink: 0, padding: '6px 14px', borderRadius: 100,

        {!loading && (
          <div style={{ padding: '4px 20px 16px' }} className="animate-fadeup">
            <div style={{
              borderRadius: 20, overflow: 'hidden',
              background: 'linear-gradient(135deg, #C0453E 0%, #E3B04B 100%)',

// ── Swipe cell (left-swipe action) ──
function SwipeCell({ children, rightActions = [], index = 0 }) {
  const [offset, setOffset] = useState(0);
  const startX = useRef(0);
  const startOffset = useRef(0);
  const dragging = useRef(false);
  const ACTION_WIDTH = 72;

  const onTouchStart = (e) => {
    startX.current = e.touches[0].clientX;
    startOffset.current = offset;
    dragging.current = true;
  };
  const onTouchMove = (e) => {
    if (!dragging.current) return;
    const dx = e.touches[0].clientX - startX.current;
    let next = startOffset.current + dx;
    // Only allow left swipe for actions
    if (next > 0) next = 0;
    if (next < -ACTION_WIDTH) next = -ACTION_WIDTH + (next + ACTION_WIDTH) * 0.3;
    setOffset(next);
  };
  const onTouchEnd = () => {
    dragging.current = false;
    // Snap
    if (offset < -ACTION_WIDTH / 2) {
      setOffset(-ACTION_WIDTH);
    } else {
      setOffset(0);
    }
  };

  return (
    <div className="swipe-cell-wrap">
      <div className="swipe-actions" style={{ width: ACTION_WIDTH }}>
        {rightActions.map((a, i) => (
          <div key={i} onClick={(e) => { a.onClick?.(e); setOffset(0); }} style={{
            flex: 1, height: '100%',
            background: a.color || '#ccc',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            color: '#fff', fontSize: 13, fontWeight: 500,
            cursor: 'pointer',
          }}>{a.label}</div>
        ))}
      </div>
      <div className="swipe-content"
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
        style={{ transform: `translateX(${offset}px)` }}>
        {children}
      </div>
    </div>
  );
}

// PAGE ROUTER
// ───────────────────────────────────────────
function PageRouter() {
  const { tab, stack, direction, pop, sheet, closeSheet } = useApp();
  const [animKey, setAnimKey] = useState(0);

  // Main tab pages
  const mainPages = {
    home: HomePage,
    calendar: CalendarPage,
    news: NewsPage,
    profile: ProfilePage,
  };

  // Pushed pages
  const pushedPages = {
    detail: DetailPage,
    article: ArticlePage,
    spec: SpecPage,
    api: ApiPage,
  };

  const MainComp = mainPages[tab];

  return (
    <div className="page-stack">
      {/* Base (tab) page */}
      <div className="page-layer" key={`base-${tab}`} style={{ zIndex: 1 }}>
        <MainComp />
      </div>

      {/* Stack pages */}
      {stack.map((page, i) => {
        const Comp = pushedPages[page.component];
        const isTop = i === stack.length - 1;
        const animClass = direction === 'push' && isTop
          ? 'page-enter'
          : '';
        return (
          <div key={page.key}
            className={`page-layer ${animClass}`}
            style={{ zIndex: 10 + i }}>
            {Comp && <Comp {...page.props} />}
          </div>
        );
      })}

      {/* Bottom sheet */}
      {sheet && (
        <BottomSheet type={sheet.type} onClose={closeSheet} />
      )}
    </div>
  );
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />

<title>书渡 · 二手书漂流微信小程序</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" />
<style>
  /* ─── Design tokens ─── */
  :root {
    --moss: #4a6b3a;
    --moss-deep: #355128;
    --moss-light: #6b8f55;
    --moon: #eef0e8;
    --moon-deep: #dfe2d3;
    --ochre: #a05c2c;
    --ochre-light: #c87844;
    --ochre-pale: #e8c9a8;
    --warm-gray: #8a8275;
    --warm-gray-light: #b8b2a6;
    --warm-gray-pale: #d6d0c4;
    --ink: #2a2620;
    --paper: #f7f6f0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    font-family: 'Noto Sans SC', -apple-system, system-ui, sans-serif;
    color: var(--ink);
    overflow: hidden;
    height: 100vh;
    user-select: none;
  }
  .serif { font-family: 'Noto Serif SC', serif; }

  /* ─── Stage ─── */
  .stage {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at top, rgba(74,107,58,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at bottom, rgba(160,92,44,0.06) 0%, transparent 50%),
      var(--paper);
    position: relative;
    padding: 20px;
  }
  .stage-bg-pattern {
    position: absolute; inset: 0;
    opacity: 0.4; pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(74,107,58,0.06) 0%, transparent 30%),
      radial-gradient(circle at 80% 70%, rgba(160,92,44,0.05) 0%, transparent 30%);
  }

  /* ─── Device frame (custom WeChat mini program style) ─── */
  .phone {
    width: 390px; height: 844px;
    border-radius: 54px;
    background: #1a1a1a;
    padding: 12px;
    box-shadow:
      0 50px 100px -20px rgba(0,0,0,0.3),
      0 30px 60px -30px rgba(74,107,58,0.2);
    position: relative;
    z-index: 2;
  }
  .phone-screen {
    width: 100%; height: 100%;
    border-radius: 42px;
    overflow: hidden;
    background: var(--moon);
    position: relative;
  }
  .phone-notch {
    position: absolute;
    top: 12px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 32px;
    background: #1a1a1a;
    border-radius: 0 0 20px 20px;
    z-index: 100;
  }
  .phone-home-bar {
    position: absolute;
    bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px;
    background: rgba(0,0,0,0.3);
    border-radius: 3px;
    z-index: 200;
  }

  /* ─── Status bar ─── */
  .status-bar {
    height: 44px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px;
    font-size: 15px; font-weight: 600;
    color: var(--ink);
    position: relative;
    z-index: 90;
    flex-shrink: 0;
  }
  .status-bar.dark { color: #fff; }
  .status-icons { display: flex; gap: 6px; align-items: center; }

  /* ─── Mini program navigation bar (capsule) ─── */
  .mp-navbar {
    height: 44px;
    display: flex; align-items: center;
    padding: 0 12px;
    position: relative;
    z-index: 80;
    flex-shrink: 0;
    transition: background 0.3s, backdrop-filter 0.3s;
  }
  .mp-title {
    flex: 1; text-align: center;
    font-size: 17px; font-weight: 600;
    color: var(--ink);
    font-family: 'Noto Serif SC', serif;
  }
  .mp-capsule {
    position: absolute;
    right: 12px; top: 7px;
    width: 87px; height: 32px;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 0.5px solid rgba(0,0,0,0.08);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: space-around;
    z-index: 85;
  }
  .mp-capsule-btn {
    width: 40px; height: 100%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .mp-capsule-btn:hover { opacity: 0.6; }
  .mp-capsule-divider {
    width: 0.5px; height: 16px;
    background: rgba(0,0,0,0.1);
  }

  /* ─── App content area ─── */
  .app-container {
    flex: 1; position: relative;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .page-stack {
    flex: 1; position: relative;
    overflow: hidden;
  }
  .page {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
    background: var(--moon);
    transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.3s;
  }
  .page.active { transform: translateX(0); opacity: 1; z-index: 2; }
  .page.behind { transform: translateX(-30%); opacity: 0.7; z-index: 1; }
  .page.hidden { transform: translateX(100%); opacity: 1; z-index: 3; }
  .page-content { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; -webkit-overflow-scrolling: touch; }
  .page-content::-webkit-scrollbar { display: none; }

  /* ─── TabBar ─── */
  .tab-bar {
    height: 60px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 0.5px solid rgba(0,0,0,0.06);
    display: flex;
    position: relative;
    z-index: 10;
    flex-shrink: 0;
    padding-bottom: 0;
  }
  .tab-item {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3px;
    cursor: pointer;
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
  }
  .tab-item:active { transform: scale(0.92); }
  .tab-item.active .tab-icon { color: var(--moss); }
  .tab-item.active .tab-label { color: var(--moss); font-weight: 600; }
  .tab-icon {
    color: var(--warm-gray);
    transition: color 0.2s;
    display: flex; align-items: center;
  }
  .tab-label {
    font-size: 10px;
    color: var(--warm-gray);
    transition: color 0.2s;
    font-family: 'Noto Sans SC', sans-serif;
  }
  .tab-bounce {
    animation: tabBounce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes tabBounce {
    0% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-4px) scale(1.1); }
    60% { transform: translateY(1px) scale(0.95); }
    100% { transform: translateY(0) scale(1); }
  }

  /* ─── Action Sheet ─── */
  .action-sheet-mask {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .action-sheet-mask.show { opacity: 1; pointer-events: auto; }
  .action-sheet {
    position: absolute;
    left: 12px; right: 12px; bottom: 20px;
    background: #fff;
    border-radius: 14px;
    z-index: 210;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    overflow: hidden;
  }
  .action-sheet.show { transform: translateY(0); }
  .action-item {
    height: 56px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    color: var(--ink);
    border-bottom: 0.5px solid var(--warm-gray-pale);
    cursor: pointer;
    transition: background 0.15s;
  }
  .action-item:active { background: var(--moon-deep); }
  .action-item.cancel {
    color: var(--warm-gray);
    margin-top: 8px;
    background: var(--moon);
    border-bottom: none;
  }

  /* ─── Custom cursor ─── */
  .cursor-outer {
    position: fixed;
    width: 32px; height: 32px;
    border: 2px solid var(--moss);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.2s, height 0.2s, border-color 0.2s, background 0.2s;
    mix-blend-mode: normal;
    box-shadow: 0 0 12px rgba(74,107,58,0.3);
  }
  .cursor-inner {
    position: fixed;
    width: 6px; height: 6px;
    background: var(--ochre);
    border-radius: 50%;
    pointer-events: none;
    z-index: 10000;
    transform: translate(-50%, -50%);
    transition: width 0.15s, height 0.15s, background 0.2s;
    box-shadow: 0 0 8px rgba(160,92,44,0.6);
  }
  .cursor-outer.hover {
    width: 48px; height: 48px;
    border-color: var(--ochre);
    background: rgba(160,92,44,0.1);
  }
  .cursor-inner.hover {
    width: 4px; height: 4px;
  }
  .cursor-ripple {
    position: fixed;
    width: 20px; height: 20px;
    border: 2px solid var(--ochre);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%) scale(1);
    opacity: 0.8;
    animation: rippleExpand 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  @keyframes rippleExpand {
    0% { width: 20px; height: 20px; opacity: 0.8; border-width: 3px; }
    100% { width: 60px; height: 60px; opacity: 0; border-width: 1px; }
  }

  /* ─── Skeleton loading ─── */
  .skeleton {
    background: linear-gradient(90deg, var(--moon-deep) 0%, var(--paper) 50%, var(--moon-deep) 100%);
    background-size: 200% 100%;
    animation: skeletonShimmer 1.5s infinite;
    border-radius: 8px;
  }
  @keyframes skeletonShimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ─── Common ─── */
  .scroll-fade-in {
    opacity: 0; transform: translateY(20px);
    transition: opacity 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .scroll-fade-in.visible { opacity: 1; transform: translateY(0); }

  .safe-bottom { height: 34px; flex-shrink: 0; }

  /* ─── Pull to refresh ─── */
  .pull-indicator {
    position: absolute;
    top: -50px; left: 50%;
    transform: translateX(-50%);
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    color: var(--moss);
    transition: transform 0.3s;
  }
  .pull-indicator.spinning svg {
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── Page label indicator (for design display) ─── */
  .page-indicator {
    position: absolute;
    bottom: 90px; right: -80px;
    display: flex; flex-direction: column;
    gap: 6px;
    z-index: 50;
  }
  .page-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--warm-gray-pale);
    cursor: pointer;
    transition: all 0.3s;
  }
  .page-dot.active {
    background: var(--moss);
    width: 24px; height: 24px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
    color: #fff;
  }

  /* Stage label */
  .stage-label {
    position: absolute;
    top: 40px; left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 1;
  }
  .stage-label h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--moss-deep);
    margin: 0 0 6px 0;
    letter-spacing: 4px;
  }
  .stage-label p {
    margin: 0;
    font-size: 13px;
    color: var(--warm-gray);
    letter-spacing: 2px;
  }

  .stage-nav {
    position: absolute;
    bottom: 30px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 8px;
    flex-wrap: wrap; justify-content: center;
    max-width: 600px;
    z-index: 1;
  }
  .stage-nav-btn {
    padding: 6px 14px;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(74,107,58,0.15);
    border-radius: 20px;
    font-size: 12px;
    color: var(--moss-deep);
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Noto Sans SC', sans-serif;
  }
  .stage-nav-btn:hover {
    background: var(--moss);
    color: #fff;
    transform: translateY(-1px);
  }
  .stage-nav-btn.active {
    background: var(--moss);
    color: #fff;
  }

  /* ─── Reduced motion ─── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .cursor-outer, .cursor-inner { display: none; }
  }
</style>
</head>

// ─── Custom cursor component (direct DOM manipulation for performance) ───
function useCustomCursor() {
  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;

    let outer = document.createElement('div');
    let inner = document.createElement('div');
    outer.className = 'cursor-outer';
    inner.className = 'cursor-inner';
    document.body.appendChild(outer);
    document.body.appendChild(inner);

    let outerX = window.innerWidth / 2, outerY = window.innerHeight / 2;
    let innerX = outerX, innerY = outerY;
    let targetX = outerX, targetY = outerY;
    let rafId = null;
    let isHover = false;
    let isPaused = false;

    const animate = () => {
      if (isPaused) { rafId = null; return; }
      outerX += (targetX - outerX) * 0.15;
      outerY += (targetY - outerY) * 0.15;
      innerX += (targetX - innerX) * 0.35;
      innerY += (targetY - innerY) * 0.35;
      outer.style.left = outerX + 'px';
      outer.style.top = outerY + 'px';
      inner.style.left = innerX + 'px';
      inner.style.top = innerY + 'px';
      rafId = requestAnimationFrame(animate);
    };
    rafId = requestAnimationFrame(animate);

    const handleMove = (e) => {
      targetX = e.clientX;
      targetY = e.clientY;
    };

    const handleOver = (e) => {
      const el = e.target.closest('button, .clickable, [role="button"], .tab-item, .card-clickable, .action-item');
      if (el) {
        outer.classList.add('hover');
        inner.classList.add('hover');
        isHover = true;
      } else {
        outer.classList.remove('hover');
        inner.classList.remove('hover');
        isHover = false;
      }
    };

    const handleClick = (e) => {
      const ripple = document.createElement('div');
      ripple.className = 'cursor-ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    };

    const handleVisibility = () => {
      if (document.hidden) {
        isPaused = true;
        if (rafId) cancelAnimationFrame(rafId);
      } else {
        isPaused = false;
        if (!rafId) rafId = requestAnimationFrame(animate);
      }
    };

    window.addEventListener('mousemove', handleMove);
    document.addEventListener('mouseover', handleOver);
    window.addEventListener('click', handleClick);
    document.addEventListener('visibilitychange', handleVisibility);

    return () => {
      window.removeEventListener('mousemove', handleMove);
      document.removeEventListener('mouseover', handleOver);
      window.removeEventListener('click', handleClick);
      document.removeEventListener('visibilitychange', handleVisibility);
      if (rafId) cancelAnimationFrame(rafId);
      outer.remove();
      inner.remove();
    };
  }, []);
}

// ─── Animated Counter ───
function AnimatedCounter({ end, duration = 1500, prefix = '', suffix = '' }) {
  const [val, setVal] = useState(0);
  const ref = useRef(null);

  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) { setVal(end); return; }

    let rafId;
    let startTime;

    const start = () => {
      startTime = performance.now();
      const step = (now) => {
        const progress = Math.min((now - startTime) / duration, 1);
        // easeOutCubic
        const eased = 1 - Math.pow(1 - progress, 3);
        setVal(Math.round(eased * end));
        if (progress < 1) rafId = requestAnimationFrame(step);
      };
      rafId = requestAnimationFrame(step);
    };

    const obs = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) start();
    }, { threshold: 0.3 });

    if (ref.current) obs.observe(ref.current);
    return () => { if (rafId) cancelAnimationFrame(rafId); obs.disconnect(); };
  }, [end, duration]);

  return <span ref={ref}>{prefix}{val}{suffix}</span>;
}

// ─── Typewriter effect ───
function Typewriter({ text, speed = 80 }) {
  const [shown, setShown] = useState('');
  const idxRef = useRef(0);
  const timerRef = useRef(null);
  const containerRef = useRef(null);

  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) { setShown(text); return; }

    let visible = true;
    const tick = () => {
      if (!visible) return;
      if (idxRef.current < text.length) {
        idxRef.current++;
        setShown(text.slice(0, idxRef.current));
        timerRef.current = setTimeout(tick, speed + Math.random() * 40);
      }
    };

    const obs = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && idxRef.current === 0) {
        timerRef.current = setTimeout(tick, 200);
      }
    }, { threshold: 0.5 });

    if (containerRef.current) obs.observe(containerRef.current);

    const visHandler = () => {
      if (document.hidden) {
        visible = false;
        if (timerRef.current) clearTimeout(timerRef.current);
      } else {
        visible = true;
        if (idxRef.current < text.length) {
          timerRef.current = setTimeout(tick, speed);
        }
      }
    };
    document.addEventListener('visibilitychange', visHandler);

    return () => {
      if (timerRef.current) clearTimeout(timerRef.current);
      obs.disconnect();
      document.removeEventListener('visibilitychange', visHandler);
    };
  }, [text, speed]);

  return (
    <span ref={containerRef}>
      {shown}
      <span style={{ opacity: shown.length < text.length ? 1 : 0, transition: 'opacity 0.3s' }}>|</span>
    </span>
  );
}

// ─── Ring progress (profile page) ───
function RingProgress({ percent, size = 120, strokeWidth = 8, label, sublabel }) {
  const [progress, setProgress] = useState(0);
  const ref = useRef(null);
  const radius = (size - strokeWidth) / 2;
  const circumference = 2 * Math.PI * radius;
  const offset = circumference - (progress / 100) * circumference;

  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) { setProgress(percent); return; }

    const obs = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) {
        let start = 0;
        const startTime = performance.now();
        const duration = 1500;
        const animate = (now) => {
          const t = Math.min((now - startTime) / duration, 1);
          const eased = 1 - Math.pow(1 - t, 3);
          setProgress(eased * percent);
          if (t < 1) requestAnimationFrame(animate);
        };
        requestAnimationFrame(animate);
      }
    }, { threshold: 0.3 });

    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, [percent]);

  return (
    <div ref={ref} style={{ position: 'relative', width: size, height: size }}>
      <svg width={size} height={size}>
        <circle
          cx={size/2} cy={size/2} r={radius}
          fill="none" stroke="rgba(74,107,58,0.15)" strokeWidth={strokeWidth}
        />
        <circle
          cx={size/2} cy={size/2} r={radius}
          fill="none" stroke={COLORS.moss} strokeWidth={strokeWidth}
          strokeDasharray={circumference} strokeDashoffset={offset}
          strokeLinecap="round"
          transform={`rotate(-90 ${size/2} ${size/2})`}
          style={{ transition: 'stroke-dashoffset 0.1s linear' }}
        />
      </svg>
      <div style={{
        position: 'absolute', inset: 0,
        display: 'flex', flexDirection: 'column',
        alignItems: 'center', justifyContent: 'center',
      }}>
        <div style={{ fontSize: 28, fontWeight: 700, color: COLORS.mossDeep, fontFamily: 'Noto Serif SC, serif' }}>
          {Math.round(progress)}<span style={{ fontSize: 14, fontWeight: 500 }}>%</span>
        </div>
        {label && <div style={{ fontSize: 11, color: COLORS.warmGray, marginTop: 2 }}>{label}</div>}
      </div>
    </div>
  );
}

// ─── Scroll reveal hook ───
function useScrollReveal(containerRef) {
  useEffect(() => {
    if (!containerRef.current) return;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const container = containerRef.current;
    const items = container.querySelectorAll('.scroll-fade-in');

    if (reduced) {
      items.forEach(el => el.classList.add('visible'));
      return;
    }

    const obs = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          obs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, root: container });

    items.forEach(el => obs.observe(el));
    return () => obs.disconnect();
  }, [containerRef]);
}

// ─── Sticky tab animation ───
function StickyTabs({ tabs, active, onChange }) {
  const sliderRef = useRef(null);
  const tabRefs = useRef([]);

  useEffect(() => {
    const tab = tabRefs.current[active];
    if (tab && sliderRef.current) {
      sliderRef.current.style.width = tab.offsetWidth + 'px';
      sliderRef.current.style.transform = `translateX(${tab.offsetLeft}px)`;
    }
  }, [active]);

  return (
    <div style={{ position: 'relative', display: 'flex', gap: 0 }}>
      <div
        ref={sliderRef}
        style={{
          position: 'absolute', bottom: 0,

            transition: 'color 0.2s',

      ))}
    </div>
  );
}

function App() {
  useCustomCursor();
  const [currentPage, setCurrentPage] = useState('home');
  const [prevPage, setPrevPage] = useState(null);
  const [tabBounce, setTabBounce] = useState(null);
  const [selectedBook, setSelectedBook] = useState(BOOKS[0]);
  const [showActionSheet, setShowActionSheet] = useState(false);
  const [actionSheetVisible, setActionSheetVisible] = useState(false);

  const tabPages = ['home', 'category', 'map', 'profile'];

  const navigate = (page, book = null) => {
    if (page === currentPage) return;
    setPrevPage(currentPage);
    if (book) setSelectedBook(book);
    setCurrentPage(page);
  };

  const handleTabClick = (tab) => {
    if (tab === currentPage) return;
    setTabBounce(tab);
    setTimeout(() => setTabBounce(null), 400);
    setPrevPage(currentPage);
    setCurrentPage(tab);
  };

  const handleActionSheet = () => {
    setShowActionSheet(true);
    setTimeout(() => setActionSheetVisible(true), 10);
  };

  const closeActionSheet = () => {
    setActionSheetVisible(false);
    setTimeout(() => setShowActionSheet(false), 300);
  };

  const pages = [
    { key: 'home', label: '首页', isTab: true, component: <HomePage onBookClick={(b) => navigate('detail', b)} /> },
    { key: 'category', label: '书单', isTab: true, component: <CategoryPage onBookClick={(b) => navigate('detail', b)} /> },
    { key: 'detail', label: '详情', isTab: false, component: <DetailPage book={selectedBook} onBack={() => navigate(prevPage || 'home')} /> },
    { key: 'map', label: '地图', isTab: true, component: <MapPage /> },
    { key: 'profile', label: '我的', isTab: true, component: <ProfilePage onNavigate={navigate} /> },
    { key: 'spec', label: '规范', isTab: false, component: <SpecPage /> },
    { key: 'api', label: '接口', isTab: false, component: <ApiPage /> },
    { key: 'publish', label: '发布', isTab: false, component: <PublishPage onActionSheet={handleActionSheet} /> },
  ];

  const allPageKeys = pages.map(p => p.key);
  const allPageLabels = pages.map(p => p.label);

  const pageIndex = allPageKeys.indexOf(currentPage);
  const isPageStackTransition = !tabPages.includes(currentPage) || (prevPage && !tabPages.includes(prevPage));

  return (
    <div className="stage">
      <div className="stage-bg-pattern" />

        <p>二手书漂流微信小程序 · V2 设计稿</p>

              {/* wifi */}
              <svg width="15" height="12" viewBox="0 0 17 12">
                <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill="currentColor"/>
                <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill="currentColor"/>
                <circle cx="8.5" cy="10.5" r="1.5" fill="currentColor"/>
              </svg>
              {/* battery */}
              <svg width="25" height="12" viewBox="0 0 27 13">
                <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="currentColor" strokeOpacity="0.35" fill="none"/>
                <rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"/>
                <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill="currentColor" fillOpacity="0.4"/>
              </svg>
            </div>
          </div>

          {/* Mini program capsule */}
          <div className="mp-capsule">
            <div className="mp-capsule-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                <circle cx="12" cy="12" r="1"/>
                <circle cx="5" cy="12" r="1"/>
                <circle cx="19" cy="12" r="1"/>
              </svg>
            </div>
            <div className="mp-capsule-divider" />
            <div className="mp-capsule-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="9"/>
                <circle cx="12" cy="12" r="1" fill="currentColor"/>
              </svg>
            </div>
          </div>

          {/* App container */}
          <div className="app-container" style={{ paddingTop: 88 }}>
            <div className="page-stack">
              {pages.map(p => {
                const isActive = p.key === currentPage;
                const isBehind = p.key === prevPage && isActive;
                // Determine transition class
                let cls = 'page';
                if (isActive) cls += ' active';
                else if (isBehind) cls += ' behind';
                else cls += ' hidden';

                // Determine nav title
                const titles = {
                  home: '书渡',
                  category: '发现书单',
                  detail: '书籍详情',
                  map: '漂流地图',
                  profile: '我的',
                  spec: '设计规范',
                  api: '接口文档',
                  publish: '发布漂流',
                };

                return (
                  <div key={p.key} className={cls} data-screen-label={p.label}>
                    {/* Navbar title (visible on non-tab pages or when needed) */}
                    {p.key !== 'detail' && p.key !== 'map' && (
                      <div style={{
                        position: 'absolute',
                        top: 0, left: 0, right: 0,
                        height: 44,
                        display: 'flex', alignItems: 'center',
                        justifyContent: 'center',
                        zIndex: 5,
                        pointerEvents: 'none',
                      }}>
                        <span className="serif" style={{
                          fontSize: 17, fontWeight: 600,
                          color: COLORS.ink,
                        }}>
                          {titles[p.key]}
                        </span>
                      </div>
                    )}

                    {/* Back button for non-tab pages */}
                    {!p.isTab && p.key !== 'detail' && (
                      <div
                        className="clickable"
                        onClick={() => navigate(prevPage || 'home')}
                        style={{
                          position: 'absolute',
                          top: 6, left: 12,
                          zIndex: 10,
                          width: 32, height: 32,
                          borderRadius: 16,
                          display: 'flex', alignItems: 'center', justifyContent: 'center',
                          cursor: 'pointer',
                          color: COLORS.ink,
                        }}
                      >
                        <Icon.Back />
                      </div>
                    )}

                    {p.component}
                  </div>
                );
              })}

              {/* Action sheet overlay */}
              {showActionSheet && (
                <>
                  <div
                    className={`action-sheet-mask ${actionSheetVisible ? 'show' : ''}`}
                    onClick={closeActionSheet}
                  />
                  <div className={`action-sheet ${actionSheetVisible ? 'show' : ''}`}>
                    <div className="action-item" style={{ color: COLORS.ink, fontWeight: 500 }}>
                      确认发布这本漂流书？
                    </div>
                    <div className="action-item" style={{ color: COLORS.warmGray, fontSize: 13 }}>
                      发布后书籍将进入漂流流程
                    </div>
                    <div className="action-item" style={{ color: COLORS.moss, fontWeight: 600 }} onClick={closeActionSheet}>
                      确认发布
                    </div>
                    <div className="action-item cancel" onClick={closeActionSheet}>取消</div>
                  </div>
                </>
              )}
            </div>

            {/* TabBar */}
            <div className="tab-bar">
              {[
                { key: 'home', label: '首页', icon: Icon.Home },
                { key: 'category', label: '书单', icon: Icon.Book },
                { key: 'map', label: '地图', icon: Icon.Map },
                { key: 'profile', label: '我的', icon: Icon.User },
              ].map((tab, i) => (
                <div
                  key={tab.key}
                  className={`tab-item ${currentPage === tab.key ? 'active' : ''} ${tabBounce === tab.key ? 'tab-bounce' : ''}`}
                  onClick={() => handleTabClick(tab.key)}
                >
                  <div className="tab-icon">
                    <tab.icon active={currentPage === tab.key} />
                  </div>
                  <div className="tab-label">{tab.label}</div>
                </div>
              ))}
            </div>
          </div>

          <div className="phone-home-bar" />
        </div>
      </div>

      {/* Stage navigation */}
      <div className="stage-nav">
        {allPageKeys.map((key, i) => (
          <button
            key={key}
            className={`stage-nav-btn ${currentPage === key ? 'active' : ''}`}
            onClick={() => navigate(key)}
          >
            {allPageLabels[i]}
          </button>
        ))}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

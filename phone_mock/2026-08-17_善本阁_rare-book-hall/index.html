<script type="text/babel">
/* BEGIN USAGE */
// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports (to window): IOSDevice, IOSStatusBar, IOSList, IOSListRow, IOSKeyboard
//
// Usage — wrap your screen content in <IOSDevice> to get the bezel, status bar
// and home indicator (props: width=402, height=874, dark, keyboard):
//
//   <IOSDevice>
//     ...your screen content...
//   </IOSDevice>
//   <IOSDevice dark keyboard>…</IOSDevice>
//   <IOSDevice width={390} height={844}>…</IOSDevice>   // smaller device size
//
// Safe areas — REQUIRED on every screen. The status bar (top) and home
// indicator (bottom) float OVER your content; inset it or it overlaps them.
//   --ios-safe-top     top inset (Dynamic Island + status bar)
//   --ios-safe-bottom  bottom inset (home indicator)
/* END USAGE */

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      border: '1px solid #DEE0E3',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
      '--ios-safe-top': '62px',
      '--ios-safe-bottom': '34px',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* content — isolate:isolate keeps the screen in its own stacking
          context so any z-index authored inside it stays *below* the frame
          chrome (status bar z:10, island z:50, home indicator z:60); a
          sticky/opaque header with a high z-index can no longer paint over
          the status bar. */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column', isolation: 'isolate' }}>
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSList, IOSListRow, IOSKeyboard,
});

</script>

/* ============================================================
   UTILITY — Animation helpers with cleanup
   ============================================================ */

function useRaf(callback, deps = []) {
  const ref = useRef({ id: null, cb: callback });
  ref.current.cb = callback;

  useEffect(() => {
    let running = true;
    const tick = () => {
      if (!running) return;
      ref.current.cb();
      ref.current.id = requestAnimationFrame(tick);
    };
    ref.current.id = requestAnimationFrame(tick);
    const onVis = () => {
      if (document.hidden) {
        if (ref.current.id) cancelAnimationFrame(ref.current.id);
        ref.current.id = null;
      } else if (running && !ref.current.id) {
        ref.current.id = requestAnimationFrame(tick);
      }
    };
    document.addEventListener('visibilitychange', onVis);
    return () => {
      running = false;
      if (ref.current.id) cancelAnimationFrame(ref.current.id);
      document.removeEventListener('visibilitychange', onVis);
    };
    // eslint-disable-next-line
  }, deps);
}

function useTimeout() {
  const ids = useRef([]);
  const set = (fn, t) => {
    const id = setTimeout(fn, t);
    ids.current.push(id);
    return id;
  };
  const clear = (id) => {
    clearTimeout(id);
    ids.current = ids.current.filter(x => x !== id);
  };
  useEffect(() => () => { ids.current.forEach(clearTimeout); ids.current = []; }, []);
  return { set, clear };
}

/* ============================================================
   NAV CONTEXT
   ============================================================ */

const NavContext = createContext(null);

function NavProvider({ children, initialTab = 'discover' }) {
  const [tab, setTab] = useState(initialTab);
  const [stack, setStack] = useState({}); // per-tab stack
  const [direction, setDirection] = useState('right');
  const [reducedMotion, setReducedMotion] = useState(false);

  useEffect(() => {
    const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    setReducedMotion(mq.matches);
    const h = e => setReducedMotion(e.matches);
    mq.addEventListener('change', h);
    return () => mq.removeEventListener('change', h);
  }, []);

  const push = useCallback((screen, params = {}) => {
    setDirection('right');
    setStack(prev => ({
      ...prev,
      [tab]: [...(prev[tab] || []), { screen, params }],
    }));
  }, [tab]);

  const pop = useCallback(() => {
    setDirection('back');
    setStack(prev => {
      const cur = prev[tab] || [];
      if (cur.length === 0) return prev;
      return { ...prev, [tab]: cur.slice(0, -1) };
    });
  }, [tab]);

  const switchTab = useCallback((newTab) => {
    setDirection('right');
    setTab(newTab);
  }, []);

  const currentStack = stack[tab] || [];
  const topScreen = currentStack.length > 0
    ? currentStack[currentStack.length - 1]
    : { screen: tab, params: {} };

  const canGoBack = currentStack.length > 0;

  return (
    <NavContext.Provider value={{
      tab, switchTab, push, pop, canGoBack,
      topScreen, direction, reducedMotion,
    }}>
      {children}
    </NavContext.Provider>
  );
}

function useNav() { return useContext(NavContext); }

/* ============================================================
   PAGE 1: DISCOVER (发现) — 大标题导航 + Hero 视差 + 分类轮播 + 卡片堆叠
   ============================================================ */

function DiscoverPage() {
  const { push, reducedMotion } = useNav();
  const scrollRef = useRef(null);
  const [scrollY, setScrollY] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const [ptrDistance, setPtrDistance] = useState(0);
  const touchStartY = useRef(0);
  const { set: setT, clear: clearT } = useTimeout();

  // Track scroll for parallax header
  const onScroll = useCallback((e) => {
    const y = e.target.scrollTop;
    setScrollY(y);
  }, []);

  // Pull to refresh (touch-based)
  const onTouchStart = (e) => {
    if (scrollRef.current?.scrollTop <= 0) {
      touchStartY.current = e.touches[0].clientY;
    }
  };
  const onTouchMove = (e) => {
    if (!scrollRef.current || scrollRef.current.scrollTop > 0) return;
    const diff = e.touches[0].clientY - touchStartY.current;
    if (diff > 0) {
      const damped = Math.min(diff * 0.5, 80);
      setPtrDistance(damped);
    }
  };
  const onTouchEnd = () => {
    if (ptrDistance > 60 && !refreshing) {
      setRefreshing(true);
      setPtrDistance(60);
      const id = setT(() => {
        setRefreshing(false);
        setPtrDistance(0);
      }, 1500);
    } else {
      setPtrDistance(0);
    }
  };

  const featuredBooks = BOOKS.filter(b => b.featured);
  const heroOpacity = Math.max(0, 1 - scrollY / 180);
  const heroScale = 1 + Math.min(scrollY / 1000, 0.05);
  const titleY = Math.max(0, -scrollY * 0.4);

  return (
    <div style={{
      height: '100%',

      position: 'relative',
      overflow: 'hidden',

        display: 'flex', alignItems: 'center', justifyContent: 'center',
        zIndex: 5,
        transition: refreshing ? 'none' : 'height 0.3s ease',
      }}>
        {(ptrDistance > 10 || refreshing) && (
          <div className={refreshing && !reducedMotion ? 'ptr-spinner' : ''}
               style={{ opacity: Math.min(1, ptrDistance / 60) }}>
            <Seal size={28}>卷</Seal>
          </div>
        )}
      </div>

      <div
        ref={scrollRef}
        className="scroll-y"
        style={{
          height: '100%',
          paddingTop: 62 + ptrDistance,
          paddingBottom: 'calc(var(--ios-safe-bottom) + 70px)',
          transition: refreshing ? 'none' : 'padding-top 0.3s ease',
        }}
        onScroll={onScroll}
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}

      >
        {/* Large title nav */}
        <div style={{

/* ============================================================
   PAGE 4: READER (阅读) — 翻页动效 + 底部半屏抽屉
   ============================================================ */

function ReaderPage({ bookId }) {
  const { pop, reducedMotion } = useNav();
  const [page, setPage] = useState(1);
  const [showSheet, setShowSheet] = useState(false);
  const [fontSize, setFontSize] = useState(16);
  const [theme, setTheme] = useState('paper'); // paper, dark, sepia
  const sheetRef = useRef(null);
  const touchStartY = useRef(0);

  const book = BOOKS.find(b => b.id === bookId) || BOOKS[0];
  const totalPages = Math.min(book.pages, 50);

  const themes = {
    paper: { bg: '#FBF6EC', text: '#1C1917', name: '宣纸' },
    sepia: { bg: '#E8DCC0', text: '#3F3A34', name: '古卷' },
    dark: { bg: '#1C1917', text: '#D8CFBC', name: '夜读' },
  };
  const currentTheme = themes[theme];

  const sampleText = [
    `地之所载，六合之间，四海之内，照之以日月，经之以星辰，纪之以四时，要之以太岁。神灵所生，其物异形，或天或寿，唯圣人能通其道。`,
    `南山经之首曰䧿山。其首曰招摇之山，临于西海之上，多桂，多金玉。有草焉，其状如韭而青华，其名曰祝余，食之不饥。`,
    `有木焉，其状如谷而黑理，其华四照，其名曰迷谷，佩之不迷。有兽焉，其状如禺而白耳，伏行人走，其名曰狌狌，食之善走。`,
    `丽麂之水出焉，而西流注于海，其中多育沛，佩之无瘕疾。又东三百里，曰堂庭之山，多棪木，多白猿，多水玉，多黄金。`,
    `又东三百八十里，曰猨翼之山，其中多怪兽，水多怪鱼，多白玉，多蝮虫，多怪蛇，多怪木，不可以上。`,
  ];

  const turnPage = (dir) => {
    if (dir === 'next' && page < totalPages) {
      setPage(p => p + 1);
    } else if (dir === 'prev' && page > 1) {
      setPage(p => p - 1);
    }
  };

  return (
    <div style={{
      height: '100%',
      background: currentTheme.bg,
      position: 'relative',
      transition: 'background 0.3s ease',
      color: currentTheme.text,

      <div style={{
        position: 'absolute', top: 0, left: 0, right: 0,
        paddingTop: 'var(--ios-safe-top)',
        padding: '8px 16px',
        paddingTop: 'calc(var(--ios-safe-top) - 20px + 8px)',
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        zIndex: 10,
      }}>
        <BackButton onClick={pop} dark={theme === 'dark'} />
        <div style={{
          fontFamily: "'Noto Serif SC', serif",
          fontSize: 15, color: currentTheme.text, opacity: 0.7,
        }}>{book.title} · 卷一</div>
        <button
          onClick={() => setShowSheet(true)}
          style={{
            width: 36, height: 36, borderRadius: 18,
            background: theme === 'dark' ? 'rgba(255,255,255,0.15)' : 'rgba(28,25,23,0.08)',
            border: 'none', cursor: 'pointer',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            backdropFilter: 'blur(10px)',
          }}
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="3" stroke={theme === 'dark' ? '#fff' : '#1C1917'} strokeWidth="1.8"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" stroke={theme === 'dark' ? '#fff' : '#1C1917'} strokeWidth="1.5"/>
          </svg>
        </button>
      </div>

      {/* Reading area — click to turn pages */}
      <div
        style={{
          height: '100%',
          padding: '100px 28px 100px',
          display: 'flex', flexDirection: 'column',
          justifyContent: 'center',
          position: 'relative',
        }}
        onClick={(e) => {
          const rect = e.currentTarget.getBoundingClientRect();
          const x = e.clientX - rect.left;
          if (x < rect.width * 0.3) {
            turnPage('prev');

            turnPage('next');

            display: 'flex', flexDirection: 'column', justifyContent: 'center',
          }}
        >
          <div style={{
            fontFamily: "'Noto Serif SC', serif",
            fontSize: fontSize,
            lineHeight: 2,
            color: currentTheme.text,
            textAlign: 'justify',
            textIndent: '2em',
          }}>
            {sampleText[page % sampleText.length]}
          </div>
        </div>

        {/* Page corner fold hint */}
        <div style={{
          position: 'absolute', bottom: 30, right: 20,
          width: 0, height: 0,
          borderBottom: `24px solid ${currentTheme.bg}`,
          borderLeft: '24px solid transparent',
          filter: 'drop-shadow(-2px -2px 3px rgba(0,0,0,0.1))',
          opacity: page < totalPages ? 0.6 : 0,
          transition: 'opacity 0.3s ease',
        }} />

        {/* Page number */}
        <div style={{
          position: 'absolute', bottom: 50, left: 0, right: 0,
          textAlign: 'center',
          fontSize: 12,
          color: currentTheme.text,
          opacity: 0.4,
          fontFamily: "'Noto Serif SC', serif",
        }}>
          第 {page} 页 / 共 {totalPages} 页
        </div>
      </div>

      {/* Progress bar */}
      <div style={{
        position: 'absolute', bottom: 34, left: 0, right: 0,
        height: 2, background: 'rgba(28,25,23,0.1)',
      }}>
        <div style={{
          width: `${(page / totalPages) * 100}%`,
          height: '100%',
          background: '#B94A3A',
          transition: 'width 0.3s ease',
        }} />
      </div>

      {/* Bottom Sheet (设置) */}
      {showSheet && (
        <>
          <div
            className="modal-backdrop"
            onClick={() => setShowSheet(false)}
            style={{
              position: 'absolute', inset: 0,
              background: 'rgba(0,0,0,0.4)',
              zIndex: 30,

          />
          <div
            ref={sheetRef}
            className="modal-sheet"
            style={{
              position: 'absolute', bottom: 0, left: 0, right: 0,
              background: currentTheme.bg,
              borderTopLeftRadius: 24, borderTopRightRadius: 24,

              zIndex: 40,
              boxShadow: '0 -8px 30px rgba(0,0,0,0.2)',
            }}
          >
            <div style={{
              width: 36, height: 5, borderRadius: 3,
              background: 'rgba(28,25,23,0.2)',
              margin: '0 auto 16px',
            }} />
            <div style={{
              fontFamily: "'Noto Serif SC', serif",
              fontSize: 17, fontWeight: 600, marginBottom: 18,
              color: currentTheme.text,
            }}>阅读设置</div>

            {/* Font size */}
            <div style={{ marginBottom: 20 }}>
              <div style={{
                fontSize: 13, color: currentTheme.text, opacity: 0.6,
                marginBottom: 10,
              }}>字号</div>
              <div style={{
                display: 'flex', alignItems: 'center', gap: 16,
                background: theme === 'dark' ? 'rgba(255,255,255,0.08)' : 'rgba(28,25,23,0.05)',

                    border: 'none', cursor: 'pointer',

                    fontSize: 18,
                  }}>-</button>
                <div style={{ flex: 1, textAlign: 'center', fontSize: 14, color: currentTheme.text }}>
                  {fontSize}px
                </div>
                <button
                  onClick={() => setFontSize(s => Math.min(24, s + 1))}
                  style={{
                    width: 32, height: 32, borderRadius: 16,
                    background: theme === 'dark' ? 'rgba(255,255,255,0.1)' : '#fff',
                    border: 'none', cursor: 'pointer',
                    color: currentTheme.text,

                  }}>+</button>

            {/* Theme */}
            <div style={{ marginBottom: 20 }}>
              <div style={{
                fontSize: 13, color: currentTheme.text, opacity: 0.6,

                  <button
                    key={key}
                    onClick={() => setTheme(key)}
                    style={{
                      flex: 1, padding: '14px 0',
                      background: t.bg,
                      border: theme === key ? '2px solid #B94A3A' : '1px solid rgba(28,25,23,0.1)',
                      borderRadius: 12,

                color: '#FBF6EC', fontSize: 15, fontWeight: 600,

          </div>
        </>
      )}
    </div>
  );
}

/* ============================================================
   PAGE 5: COMMUNITY (雅集) — 瀑布流 + 下拉刷新
   ============================================================ */

function CommunityPage() {
  const { push, reducedMotion } = useNav();
  const scrollRef = useRef(null);
  const [refreshing, setRefreshing] = useState(false);
  const [ptrDistance, setPtrDistance] = useState(0);
  const touchStartY = useRef(0);
  const [filter, setFilter] = useState('all');
  const { set: setT } = useTimeout();

  const filters = [
    { id: 'all', name: '全部' },
    { id: '晒书', name: '晒书' },
    { id: '夜读', name: '夜读' },
    { id: '修复', name: '修复' },
    { id: '临池', name: '临池' },
  ];

  const onTouchStart = (e) => {
    if (scrollRef.current?.scrollTop <= 0) {
      touchStartY.current = e.touches[0].clientY;
    }
  };
  const onTouchMove = (e) => {
    if (!scrollRef.current || scrollRef.current.scrollTop > 0) return;
    const diff = e.touches[0].clientY - touchStartY.current;
    if (diff > 0) {
      setPtrDistance(Math.min(diff * 0.5, 80));
    }
  };
  const onTouchEnd = () => {
    if (ptrDistance > 60 && !refreshing) {
      setRefreshing(true);
      setPtrDistance(60);
      setT(() => {
        setRefreshing(false);
        setPtrDistance(0);
      }, 1500);
    } else {
      setPtrDistance(0);
    }
  };

  // masonry columns
  const leftPosts = COMMUNITY_POSTS.filter((_, i) => i % 2 === 0);
  const rightPosts = COMMUNITY_POSTS.filter((_, i) => i % 2 === 1);

  const renderPost = (post, i) => (
    <div
      key={post.id}
      onClick={() => push('post', { postId: post.id })}
      style={{
        background: '#fff',
        borderRadius: 16,
        padding: 14,
        marginBottom: 12,
        boxShadow: '0 2px 10px rgba(28,25,23,0.06)',
        cursor: 'pointer',
        animation: reducedMotion ? 'none' : `fadeUp 0.5s ease ${i * 0.08}s both`,
      }}
    >
      {/* colored top block */}
      <div style={{
        height: post.height * 0.5,
        background: post.bg,
        borderRadius: 10,
        marginBottom: 10,
        position: 'relative',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
      }}>
        <div style={{
          fontFamily: "'Noto Serif SC', serif",
          fontSize: 28, fontWeight: 700,
          color: post.color,
          opacity: 0.7,
        }}>{post.tag}</div>
        <div style={{
          position: 'absolute', top: 8, right: 8,
        }}>
          <Seal size={20}>{post.tag.charAt(0)}</Seal>
        </div>
      </div>
      <div style={{
        fontSize: 13,
        color: '#1C1917',
        lineHeight: 1.6,
        fontFamily: "'Noto Serif SC', serif",
        marginBottom: 10,
        display: '-webkit-box',
        WebkitLineClamp: 3,
        WebkitBoxOrient: 'vertical',
        overflow: 'hidden',
      }}>{post.text}</div>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
          <div style={{
            width: 22, height: 22, borderRadius: 11,
            background: post.bg,
            color: post.color,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontSize: 11, fontWeight: 600,
            fontFamily: "'Noto Serif SC', serif",
          }}>{post.avatar}</div>
          <span style={{ fontSize: 11, color: '#6B6358' }}>{post.user}</span>
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 3 }}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="#A39C8E">
              <path d="M12 21s-7-4.35-7-10a5 5 0 019-3 5 5 0 019 3c0 5.65-7 10-7 10h-4z"/>
            </svg>
            <span style={{ fontSize: 11, color: '#A39C8E' }}>{post.likes}</span>
          </div>
        </div>
      </div>
    </div>
  );

  return (
    <div style={{
      height: '100%',
      background: '#FBF6EC',
      display: 'flex', flexDirection: 'column',
      position: 'relative',
    }}>
      {/* PTR */}
      <div style={{
        position: 'absolute', top: 62, left: 0, right: 0,
        height: ptrDistance,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        zIndex: 5,
        transition: refreshing ? 'none' : 'height 0.3s ease',
      }}>
        {(ptrDistance > 10 || refreshing) && (
          <div className={refreshing && !reducedMotion ? 'ptr-spinner' : ''}
               style={{ opacity: Math.min(1, ptrDistance / 60) }}>
            <Seal size={24}>雅</Seal>
          </div>
        )}
      </div>

      {/* Header */}
      <div style={{
        paddingTop: 62,
        paddingLeft: 24, paddingRight: 24, paddingBottom: 12,
        background: '#FBF6EC',
        flexShrink: 0,
      }}>
        <div style={{
          fontFamily: "'Noto Serif SC', serif",
          fontSize: 34, fontWeight: 700, color: '#1C1917',
          letterSpacing: -1, marginBottom: 12,
        }}>雅集</div>

        {/* Filter pills */}
        <div className="scroll-x" style={{ display: 'flex', gap: 8, margin: '0 -24px', padding: '0 24px' }}>
          {filters.map(f => (
            <button
              key={f.id}
              onClick={() => setFilter(f.id)}
              style={{
                flexShrink: 0,
                padding: '7px 14px',
                background: filter === f.id ? '#1C1917' : 'rgba(28,25,23,0.06)',
                border: 'none',
                borderRadius: 20,
                fontSize: 13,
                color: filter === f.id ? '#FBF6EC' : '#3F3A34',
                fontFamily: "'Noto Sans SC', sans-serif",
                fontWeight: filter === f.id ? 500 : 400,
                cursor: 'pointer',
                transition: 'all 0.2s ease',
              }}
            >{f.name}</button>
          ))}
        </div>
      </div>

      {/* Masonry grid */}
      <div
        ref={scrollRef}
        className="scroll-y"
        style={{
          flex: 1,
          padding: `8px 16px 0`,
          paddingBottom: 'calc(var(--ios-safe-bottom) + 90px)',
          paddingTop: ptrDistance > 0 ? `${ptrDistance}px` : '8px',
          transition: refreshing ? 'none' : 'padding-top 0.3s ease',
        }}
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
      >
        <div style={{ display: 'flex', gap: 10 }}>
          <div style={{ flex: 1 }}>{leftPosts.map((p, i) => renderPost(p, i * 2))}</div>
          <div style={{ flex: 1 }}>{rightPosts.map((p, i) => renderPost(p, i * 2 + 1))}</div>
        </div>
      </div>
    </div>
  );
}

            fontFamily: "'Noto Serif SC', serif",
            fontSize: 15, fontWeight: 600, color: '#1C1917',
            marginBottom: 12,
          }}>状态码</div>
          {[
            { code: 200, desc: '请求成功', color: '#6B8E5A' },
            { code: 400, desc: '参数错误', color: '#C9A961' },
            { code: 401, desc: '未授权', color: '#B94A3A' },
            { code: 404, desc: '资源不存在', color: '#8B7355' },
            { code: 500, desc: '服务器错误', color: '#B94A3A' },
          ].map(s => (
            <div key={s.code} style={{
              display: 'flex', alignItems: 'center', gap: 12,
              padding: '8px 0',
              borderBottom: s.code !== 500 ? '0.5px solid rgba(28,25,23,0.06)' : 'none',
            }}>
              <span style={{
                fontFamily: 'monospace',
                fontSize: 13,
                fontWeight: 600,
                color: s.color,
                width: 50,
              }}>{s.code}</span>
              <span style={{ fontSize: 13, color: '#3F3A34' }}>{s.desc}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   APP ROUTER
   ============================================================ */

function AppRouter() {
  const { topScreen, direction, tab, canGoBack, reducedMotion } = useNav();
  const { screen, params } = topScreen;

  const animClass = reducedMotion
    ? ''
    : (direction === 'right' ? 'page-enter-right' : 'page-enter-back');

  // Map screen name to component
  const renderScreen = () => {
    switch (screen) {
      case 'discover':
        return <DiscoverPage key="discover" />;
      case 'library':
        return <LibraryPage key="library" />;
      case 'community':
        return <CommunityPage key="community" />;
      case 'profile':
        return <ProfilePage key="profile" />;
      case 'detail':
        return <BookDetailPage key="detail" bookId={params.bookId} />;
      case 'reader':
        return <ReaderPage key="reader" bookId={params.bookId} />;
      case 'designSpec':
        return <DesignSpecPage key="designSpec" />;
      case 'apiDocs':
        return <ApiDocsPage key="apiDocs" />;
      default:
        return <DiscoverPage key="discover" />;
    }
  };

  const showTabBar = ['discover', 'library', 'community', 'profile'].includes(screen);

  return (
    <div key={screen + '-' + tab} className={animClass} style={{
      position: 'absolute', inset: 0,
      overflow: 'hidden',
    }}>
      {renderScreen()}
      {showTabBar && <TabBar />}
    </div>
  );
}

/* ============================================================
   ROOT
   ============================================================ */

function App() {
  return (
    <div className="app-wrap">
      <div className="app-title">
        卷 · 古籍善本馆
        <span className="sub">JUAN RARE BOOKS · iOS</span>
      </div>
      <IOSDevice>
        <NavProvider initialTab="discover">
          <NavRefBridge />
          <AppRouter />
        </NavProvider>
      </IOSDevice>
    </div>
  );
}

// Bridge to expose nav for imperative calls from nested pages
function NavRefBridge() {
  const nav = useNav();
  useEffect(() => {
    window.__nav = nav;
  }, [nav]);
  return null;
}

/* Announce upgrade */
function announceUpgrade() {
  try {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  } catch (e) {}
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

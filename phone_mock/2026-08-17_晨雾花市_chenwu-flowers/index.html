// ─── Utility: Counter Animation Hook ───
function useCountUp(target, duration = 1200) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    let start = null, raf;
    const step = (ts) => {
      if (!start) start = ts;
      const p = Math.min((ts - start) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      setVal(Math.round(target * eased));
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target, duration]);
  return val;
}

function HomePage({ onOpenDetail }) {
  const [activeSlide, setActiveSlide] = useState(0);
  const [showPull, setShowPull] = useState(false);
  const scrollRef = useRef(null);
  const pullStartY = useRef(0);
  const pulling = useRef(false);

  const slides = [
    { img: IMG.heroMarket, title: '清晨花市', subtitle: '每日六点 新鲜到店' },
    { img: IMG.rosePink, title: '限定玫瑰季', subtitle: '厄瓜多尔直供' },
    { img: IMG.dahlia, title: '秋日花语', subtitle: '大丽花限时特惠' },
  ];

  // Auto-rotate carousel
  useEffect(() => {
    const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    if (mq.matches) return;
    let id = setInterval(() => {
      if (document.hidden) return;
      setActiveSlide(s => (s + 1) % slides.length);
    }, 4000);
    return () => clearInterval(id);
  }, [slides.length]);

  // Pull to refresh
  useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    const onStart = (e) => {
      if (el.scrollTop === 0) {
        pulling.current = true;
        pullStartY.current = e.touches ? e.touches[0].clientY : e.clientY;
      }
    };
    const onMove = (e) => {
      if (!pulling.current) return;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      const d = y - pullStartY.current;
      if (d > 50) setShowPull(true);
    };
    const onEnd = () => {
      if (showPull) {
        setTimeout(() => setShowPull(false), 1000);
      }
      pulling.current = false;
    };
    el.addEventListener('touchstart', onStart);
    el.addEventListener('touchmove', onMove);
    el.addEventListener('touchend', onEnd);
    return () => {
      el.removeEventListener('touchstart', onStart);
      el.removeEventListener('touchmove', onMove);
      el.removeEventListener('touchend', onEnd);
    };
  }, [showPull]);

  return (
    <div className="page-scroll" ref={scrollRef} style={{ background: 'var(--bg)' }}>
      {/* Pull indicator */}
      <div className="pull-indicator" style={{ top: 50 }}>
        <div className={`pull-spinner ${showPull ? 'spinning' : ''}`}></div>
      </div>

      {/* Header */}
      <div style={{
        padding: '70px 20px 16px',
        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
      }}>
        <div className="fade-in" style={{ animationDelay: '0.3s' }}>
          <div style={{
            fontFamily: '"Cormorant Garamond", "Noto Serif SC", serif',
            fontSize: 22, fontWeight: 500, fontStyle: 'italic',
            color: 'var(--berry)', letterSpacing: 1,
          }}>Chenwu Flower</div>
          <div style={{ fontSize: 12, color: 'var(--ink-soft)', marginTop: 2, letterSpacing: 2 }}>
            晨 雾 花 市

        </div>
        <div className="fade-in" style={{ animationDelay: '0.35s' }} data-hoverable>
          <div style={{
            width: 38, height: 38, borderRadius: '50%',
            background: 'var(--card)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            boxShadow: 'var(--shadow-sm)', color: 'var(--ink-soft)',

            <Icon.Search />

        </div>
      </div>

      {/* Hero Carousel */}
      <div className="fade-in" style={{ padding: '0 20px', marginTop: 4, animationDelay: '0.4s' }}>
        <div style={{
          position: 'relative', height: 180, borderRadius: 20, overflow: 'hidden',
          boxShadow: 'var(--shadow-md)',
        }}>
          {slides.map((s, i) => (
            <div key={i} style={{
              position: 'absolute', inset: 0,
              opacity: activeSlide === i ? 1 : 0,
              transform: `translateX(${(i - activeSlide) * 30}px)`,
              transition: 'opacity 0.5s ease, transform 0.5s cubic-bezier(.2,.8,.2,1)',
            }}>
              <img src={s.img} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
              <div style={{
                position: 'absolute', inset: 0,

              }} />

          {/* Dots */}
          <div style={{

  );

// ─── Flower Card Component ───
function FlowerCard({ bouquet, index = 0, onClick, variant = 'default' }) {
  const [tilt, setTilt] = useState({ x: 0, y: 0 });
  const [lpMenu, setLpMenu] = useState(null);
  const pressTimer = useRef(null);
  const cardRef = useRef(null);

  const handleMove = (e) => {
    const rect = cardRef.current?.getBoundingClientRect();
    if (!rect) return;
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    setTilt({ x: y * -8, y: x * 8 });
  };

  const handleLeave = () => {
    setTilt({ x: 0, y: 0 });
    clearTimeout(pressTimer.current);
    setLpMenu(null);
  };

  const handleDown = (e) => {
    clearTimeout(pressTimer.current);
    pressTimer.current = setTimeout(() => {
      const rect = cardRef.current.getBoundingClientRect();
      setLpMenu({ x: e.clientX - rect.left, y: e.clientY - rect.top });
      if (navigator.vibrate) navigator.vibrate(10);
    }, 500);
  };

  const handleUp = () => {
    clearTimeout(pressTimer.current);
  };

  const colorMap = {
    rose: { bg: '#f5e6e6', tag: 'var(--rose-deep)' },
    sage: { bg: '#e5ede4', tag: 'var(--sage-deep)' },
    berry: { bg: '#ebe0e0', tag: 'var(--berry)' },
    apricot: { bg: '#f7ecd8', tag: '#a87c4e' },
  };
  const c = colorMap[bouquet.color] || colorMap.rose;

  return (
    <div ref={cardRef}
         className="flower-card tilt-card stagger-item"
         style={{
           animationDelay: `${0.6 + index * 0.08}s`,
           transform: variant === 'grid' ? 'none' : undefined,
         }}
         data-hoverable
         onMouseMove={handleMove}
         onMouseLeave={handleLeave}
         onMouseDown={handleDown}
         onMouseUp={handleUp}
         onTouchStart={handleDown}
         onTouchEnd={handleUp}
         onClick={onClick}>
      <div className="tilt-inner" style={{
        transform: `perspective(600px) rotateX(${tilt.x}deg) rotateY(${tilt.y}deg)`,
      }}>
        <div style={{ position: 'relative', height: bouquet.h * 0.6 || 140, overflow: 'hidden', background: c.bg }}>
          <img src={bouquet.img} alt={bouquet.name}
               style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
          {bouquet.tag && (
            <div style={{
              position: 'absolute', top: 10, left: 10,
              padding: '3px 8px', borderRadius: 20,
              background: 'rgba(255,255,255,0.85)',
              backdropFilter: 'blur(8px)',
              fontSize: 10, fontWeight: 600, color: c.tag,
              letterSpacing: 0.5,
            }}>{bouquet.tag}</div>
          )}
          <div data-hoverable style={{
            position: 'absolute', top: 10, right: 10,
            width: 28, height: 28, borderRadius: '50%',
            background: 'rgba(255,255,255,0.85)',
            backdropFilter: 'blur(8px)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            color: 'var(--rose)',
          }} onClick={(e) => e.stopPropagation()}>
            <Icon.Heart filled={false} />
          </div>
        </div>
        <div style={{ padding: '12px 12px 14px' }}>
          <div style={{
            fontSize: 14, fontWeight: 600, color: 'var(--ink)',
            marginBottom: 2,
          }}>{bouquet.name}</div>
          <div style={{
            fontSize: 10, color: 'var(--ink-mute)',
            fontFamily: '"Cormorant Garamond", serif', fontStyle: 'italic',
            marginBottom: 8,
          }}>{bouquet.nameEn}</div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div style={{
              fontSize: 16, fontWeight: 700, color: 'var(--rose-deep)',
              fontFamily: '"Cormorant Garamond", serif',
            }}>¥{bouquet.price}</div>
            <div data-hoverable style={{
              width: 24, height: 24, borderRadius: '50%',
              background: 'var(--rose)',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              color: '#fff',
            }}>
              <Icon.Plus />
            </div>
          </div>
        </div>
      </div>

      {/* Long press menu */}
      {lpMenu && (
        <div className="longpress-menu"
             style={{ left: lpMenu.x - 70, top: lpMenu.y + 10 }}
             onClick={(e) => { e.stopPropagation(); setLpMenu(null); }}>
          <div className="lp-menu-item">加入购物车</div>
          <div className="lp-menu-item">收藏</div>
          <div className="lp-menu-item">分享</div>
          <div className="lp-menu-item">相似花束</div>
        </div>
      )}
    </div>
  );
}

// ─── Cart Page ───
function CartPage({ items, setItems }) {
  const [swipedId, setSwipedId] = useState(null);

  const total = items.reduce((s, it) => s + it.price * it.qty, 0);
  const totalCount = items.reduce((s, it) => s + it.qty, 0);

  const handleDelete = (id) => {
    setItems(items.filter(i => i.id !== id));
    setSwipedId(null);
  };

  const updateQty = (id, delta) => {
    setItems(items.map(i => i.id === id
      ? { ...i, qty: Math.max(1, i.qty + delta) }
      : i
    ));
  };

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: 'var(--bg)' }}>
      {/* Header */}
      <div style={{
        padding: 'calc(var(--ios-safe-top) + 8px) 20px 16px',
        background: 'var(--bg)',
      }}>
        <div style={{
          fontFamily: '"Noto Serif SC", serif',
          fontSize: 22, fontWeight: 600, color: 'var(--ink)',
        }}>购物车</div>
        <div style={{ fontSize: 12, color: 'var(--ink-mute)', marginTop: 2 }}>
          共 {totalCount} 件商品
        </div>
      </div>

      {/* Items */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '0 16px 200px' }} className="page-scroll">
        {items.length === 0 ? (
          <div style={{
            padding: '60px 20px', textAlign: 'center',
          }}>
            <div style={{ fontSize: 48, marginBottom: 16 }}>🌸</div>
            <div style={{ fontSize: 15, color: 'var(--ink-soft)', marginBottom: 8 }}>
              购物车还是空的
            </div>
            <div style={{ fontSize: 12, color: 'var(--ink-mute)' }}>
              去逛逛，挑一束喜欢的花吧
            </div>
          </div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            {items.map((it, i) => (
              <div key={it.id} className="cart-item-wrap" style={{
                animation: `fadeInUp 0.4s cubic-bezier(.2,.8,.2,1) ${i * 0.08}s both`,
              }}>
                <div className="cart-item-delete-bg" data-hoverable
                     onClick={() => handleDelete(it.id)}>
                  删除
                </div>
                <div className={`cart-item ${swipedId === it.id ? 'swiped' : ''}`}
                     onClick={() => setSwipedId(swipedId === it.id ? null : it.id)}>
                  <img src={it.img} alt="" style={{
                    width: 72, height: 72, borderRadius: 12, objectFit: 'cover',
                  }} />
                  <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
                    <div>
                      <div style={{ fontSize: 14, fontWeight: 600, color: 'var(--ink)' }}>
                        {it.name}
                      </div>
                      <div style={{ fontSize: 11, color: 'var(--ink-mute)', marginTop: 2 }}>
                        {it.nameEn}
                      </div>
                    </div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                      <div style={{
                        fontSize: 16, fontWeight: 700, color: 'var(--rose-deep)',
                        fontFamily: '"Cormorant Garamond", serif',
                      }}>¥{it.price}</div>
                      <div style={{
                        display: 'flex', alignItems: 'center',
                        background: 'var(--cream-deep)',
                        borderRadius: 16, padding: 2,
                      }}>
                        <div data-hoverable onClick={(e) => { e.stopPropagation(); updateQty(it.id, -1); }}
                             style={{
                               width: 26, height: 26, borderRadius: '50%',
                               background: '#fff',
                               display: 'flex', alignItems: 'center', justifyContent: 'center',
                               color: 'var(--ink-soft)', cursor: 'pointer', fontSize: 12,
                             }}>
                          <Icon.Minus />
                        </div>
                        <span style={{
                          minWidth: 24, textAlign: 'center',
                          fontSize: 13, fontWeight: 600, color: 'var(--ink)',
                        }} className="count-num">{it.qty}</span>
                        <div data-hoverable onClick={(e) => { e.stopPropagation(); updateQty(it.id, 1); }}
                             style={{
                               width: 26, height: 26, borderRadius: '50%',
                               background: 'var(--rose)',
                               display: 'flex', alignItems: 'center', justifyContent: 'center',
                               color: '#fff', cursor: 'pointer', fontSize: 12,
                             }}>
                          <Icon.Plus />
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}

        {/* Recommendations */}
        {items.length > 0 && (
          <div style={{ marginTop: 28 }}>
            <div style={{
              fontSize: 14, fontWeight: 600, color: 'var(--ink)',
              marginBottom: 12, padding: '0 4px',
            }}>猜你喜欢</div>
            <div style={{ display: 'flex', gap: 10, overflowX: 'auto' }}>
              {BOUQUETS.slice(0, 4).filter(b => !items.find(i => i.id === b.id)).slice(0, 3).map(b => (

                     style={{

                       overflow: 'hidden', boxShadow: 'var(--shadow-sm)',
                       cursor: 'pointer',
                     }}>
                  <div style={{ height: 100, overflow: 'hidden' }}>
                    <img src={b.img} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                  </div>
                  <div style={{ padding: 8 }}>
                    <div style={{ fontSize: 12, color: 'var(--ink)', fontWeight: 500 }}>{b.name}</div>
                    <div style={{ fontSize: 13, fontWeight: 700, color: 'var(--rose-deep)', marginTop: 2 }}>
                      ¥{b.price}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      {/* Bottom checkout bar */}
      {items.length > 0 && (
        <div style={{
          position: 'absolute', bottom: 84, left: 0, right: 0,
          background: 'var(--card)',
          padding: '14px 20px',
          borderTop: '0.5px solid var(--line)',
          display: 'flex', alignItems: 'center',
          boxShadow: '0 -4px 20px rgba(92,58,58,0.06)',
        }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 12, color: 'var(--ink-mute)' }}>合计</div>
            <div style={{
              fontSize: 22, fontWeight: 700, color: 'var(--rose-deep)',
              fontFamily: '"Cormorant Garamond", serif',
            }} className="count-num">¥{total.toFixed(0)}</div>
          </div>
          <button data-hoverable style={{
            padding: '12px 28px', borderRadius: 24,
            background: 'linear-gradient(135deg, var(--rose) 0%, var(--rose-deep) 100%)',
            color: '#fff', border: 'none',
            fontSize: 15, fontWeight: 600,
            fontFamily: 'inherit', cursor: 'pointer',
            boxShadow: '0 4px 12px rgba(192,138,138,0.35)',
          }}>
            去结算 ({totalCount})
          </button>
        </div>
      )}
    </div>
  );
}

// ─── Custom Cursor Implementation ───
(function initCursor() {
  const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  if (mq.matches) return;

  const ring = document.getElementById('cursorRing');
  const dot = document.getElementById('cursorDot');
  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let ringX = mouseX, ringY = mouseY;
  let dotX = mouseX, dotY = mouseY;
  let rafId;
  let visible = false;

  function animate() {
    if (document.hidden) { rafId = null; return; }
    // Ring: slower follow
    ringX += (mouseX - ringX) * 0.18;
    ringY += (mouseY - ringY) * 0.18;
    // Dot: faster follow
    dotX += (mouseX - dotX) * 0.45;
    dotY += (mouseY - dotY) * 0.45;

    ring.style.left = ringX + 'px';
    ring.style.top = ringY + 'px';
    dot.style.left = dotX + 'px';
    dot.style.top = dotY + 'px';

    rafId = requestAnimationFrame(animate);
  }

  function start() {
    if (!rafId) rafId = requestAnimationFrame(animate);
  }

  function stop() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  }

  document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    if (!visible) {
      ring.style.opacity = '1';
      dot.style.opacity = '1';
      visible = true;
    }
    start();
  });

  // Hover state
  document.addEventListener('mouseover', (e) => {
    if (e.target.closest('[data-hoverable], button, a, input')) {
      ring.classList.add('hover');
      dot.classList.add('hover');
    }
  });
  document.addEventListener('mouseout', (e) => {
    if (e.target.closest('[data-hoverable], button, a, input')) {
      ring.classList.remove('hover');
      dot.classList.remove('hover');
    }
  });

  // Click ripple
  document.addEventListener('mousedown', (e) => {
    ring.classList.add('click');
    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  });
  document.addEventListener('mouseup', () => {
    ring.classList.remove('click');
  });

  // Pause on visibility change
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stop();
    else start();
  });

  // Initialize at center
  ring.style.left = (window.innerWidth / 2) + 'px';
  ring.style.top = (window.innerHeight / 2) + 'px';
  dot.style.left = (window.innerWidth / 2) + 'px';
  dot.style.top = (window.innerHeight / 2) + 'px';
  ring.style.opacity = '1';
  dot.style.opacity = '1';
  start();
})();

  --safe-top: 62px;
  --safe-bottom: 34px;
}

html, body {
  width: 100%; height: 100%;
  background: linear-gradient(135deg, #1A0F08 0%, #2E1F13 50%, #1A0F08 100%);
  font-family: 'Noto Sans SC', -apple-system, system-ui, sans-serif;
  color: var(--ink-primary);
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 40px 20px;
}

/* 舞台背景装饰 */
.stage-bg {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0;
  overflow: hidden;
}
.stage-bg::before {
  content: '';
  position: absolute;
  top: -20%; left: -10%;
  width: 60%; height: 60%;
  background: radial-gradient(ellipse, rgba(201, 116, 40, 0.15) 0%, transparent 70%);
  filter: blur(40px);
}
.stage-bg::after {
  content: '';
  position: absolute;
  bottom: -20%; right: -10%;
  width: 50%; height: 50%;
  background: radial-gradient(ellipse, rgba(107, 155, 85, 0.1) 0%, transparent 70%);
  filter: blur(40px);
}

.app-label {
  position: fixed;
  top: 24px; left: 50%;
  transform: translateX(-50%);
  color: rgba(255, 251, 242, 0.5);
  font-size: 12px;
  letter-spacing: 4px;
  font-weight: 300;
  text-transform: uppercase;
  z-index: 10;
}

/* 页面切换过渡 */
.page-enter {
  animation: pageSlideIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes pageSlideIn {
  from { opacity: 0; transform: translateX(30px); }
  to   { opacity: 1; transform: translateX(0); }
}

.page-back-enter {
  animation: pageBackIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes pageBackIn {
  from { opacity: 0; transform: translateX(-20px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* 滚动条隐藏 */
.scroll-area { overflow-y: auto; overflow-x: hidden; }
.scroll-area::-webkit-scrollbar { display: none; }

/* 玻璃拟态 */
.glass-dark {
  background: rgba(46, 31, 19, 0.72);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 0.5px solid rgba(255, 200, 140, 0.15);
}
.glass-light {
  background: rgba(255, 251, 242, 0.85);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 0.5px solid rgba(201, 116, 40, 0.15);
}

/* 泡沫粒子动画容器 */
.foam-particles {
  position: absolute; inset: 0;
  pointer-events: none;
  overflow: hidden;
}
.foam-bubble {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,251,242,0.5));
  animation: bubbleRise linear infinite;
}
@keyframes bubbleRise {
  0%   { transform: translateY(0) scale(1); opacity: 0.8; }
  80%  { opacity: 0.6; }
  100% { transform: translateY(-200px) scale(0.4); opacity: 0; }
}

/* 入场序列动画 */
.stagger-item {
  opacity: 0;
  transform: translateY(20px);
  animation: staggerIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes staggerIn {
  to { opacity: 1; transform: translateY(0); }
}

/* 涟漪点击效果 */
.ripple-target { position: relative; overflow: hidden; }
.ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(255, 251, 242, 0.4);
  transform: scale(0);
  animation: rippleAnim 0.6s ease-out;
  pointer-events: none;
}
@keyframes rippleAnim {
  to { transform: scale(4); opacity: 0; }
}

/* 3D 倾斜卡片容器 */
.tilt-card {
  transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  transform-style: preserve-3d;
  perspective: 1000px;
}

/* 光泽扫过 */
.shine-overlay {

  border-radius: inherit;
  pointer-events: none;

  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);

  animation: shineSweep 3s ease-in-out infinite;
}
@keyframes shineSweep {
  0%, 60%  { left: -60%; }
  100%     { left: 120%; }
}

.tab-item {

.tab-item.active .tab-icon {
  transform: translateY(-2px) scale(1.1);
}
.tab-dot {
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--amber-500);
  transform: scale(0);

.tab-item.active .tab-dot { transform: scale(1); }

/* 浮动按钮脉冲 */
.fab-pulse::before {

}
@keyframes fabPulse {
  0%   { transform: scale(0.9); opacity: 0.6; }
  100% { transform: scale(1.4); opacity: 0; }
}

/* 环形进度 */
.ring-progress {
  transform: rotate(-90deg);
}
.ring-progress circle {
  transition: stroke-dashoffset 1.5s cubic-bezier(0.22, 1, 0.36, 1);
}

/* 骨架屏加载 */
.skeleton {
  background: linear-gradient(90deg, var(--foam-100) 25%, var(--foam-200) 50%, var(--foam-100) 75%);
  background-size: 200% 100%;
  animation: skeletonShimmer 1.5s ease-in-out infinite;
}
@keyframes skeletonShimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* 下拉刷新弹性 */
.pull-refresh-indicator {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 0;
  overflow: hidden;
  transition: height 0.3s cubic-bezier(0.22, 1, 0.36, 1);
}
.pull-refresh-indicator.active {
  height: 50px;
}
.pull-arrow {
  transition: transform 0.3s ease;
}
.pull-arrow.spinning {
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* 星星评分动画 */
.star-rating .star {
  transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
}
.star-rating .star.filled {
  animation: starPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes starPop {
  0%   { transform: scale(0); }
  60%  { transform: scale(1.3); }
  100% { transform: scale(1); }
}

/* 打字机光标 */
.type-cursor::after {
  content: '|';
  animation: blink 1s step-end infinite;
}
@keyframes blink {
  50% { opacity: 0; }
}

/* 减少动效支持 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* 左滑删除手势指示 */
.swipe-row {

.swipe-delete-bg {

/* 模态弹窗 */
.modal-backdrop {
  position: absolute; inset: 0;
  background: rgba(26, 15, 8, 0.5);
  backdrop-filter: blur(4px);
  z-index: 100;

@keyframes modalFadeIn {
  from { opacity: 0; }

.modal-sheet {
  width: 100%;
  background: var(--foam-50);
  border-radius: 24px 24px 0 0;
  padding: 12px 20px calc(20px + var(--safe-bottom));
  animation: modalSlideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  max-height: 85%;
  overflow-y: auto;
}
@keyframes modalSlideUp {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}
.modal-handle {
  width: 36px; height: 5px;
  border-radius: 3px;
  background: var(--roast-200);
  margin: 0 auto 16px;
}
</style>

const { useState, useEffect, useRef, useCallback, useMemo } = React;

// 涟漪点击指令
function useRipple() {
  const createRipple = (e) => {
    const target = e.currentTarget;
    const rect = target.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const x = e.clientX - rect.left - size / 2;
    const y = e.clientY - rect.top - size / 2;
    
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    target.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  };
  return createRipple;
}

// 泡沫粒子
function FoamParticles({ count = 12, color = 'rgba(255, 251, 242, 0.6)' }) {
  const particles = useMemo(() => {
    return Array.from({ length: count }, (_, i) => ({
      id: i,
      size: 4 + Math.random() * 10,
      left: Math.random() * 100,
      delay: Math.random() * 4,
      duration: 3 + Math.random() * 3,
      bottom: -10 - Math.random() * 20,
    }));
  }, [count]);

  return (
    <div className="foam-particles">
      {particles.map(p => (
        <div
          key={p.id}
          className="foam-bubble"
          style={{
            width: p.size, height: p.size,
            left: p.left + '%',
            bottom: p.bottom + '%',
            background: `radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), ${color})`,
            animationDelay: p.delay + 's',
            animationDuration: p.duration + 's',
          }}
        />
      ))}
    </div>
  );
}

// 星星评分
function StarRating({ value = 0, size = 18, onChange, interactive = false }) {
  const [hover, setHover] = useState(0);
  const stars = [1, 2, 3, 4, 5];
  
  return (
    <div className="star-rating" style={{ display: 'flex', gap: 3 }}>
      {stars.map(s => {
        const filled = (hover || value) >= s;
        return (
          <svg
            key={s}
            className={`star ${filled ? 'filled' : ''}`}
            width={size}
            height={size}
            viewBox="0 0 24 24"
            style={{
              cursor: interactive ? 'pointer' : 'default',
              fill: filled ? 'var(--amber-500)' : 'none',
              stroke: filled ? 'var(--amber-500)' : 'var(--roast-200)',
              strokeWidth: 1.5,
            }}
            onMouseEnter={() => interactive && setHover(s)}
            onMouseLeave={() => interactive && setHover(0)}
            onClick={() => interactive && onChange && onChange(s)}
          >
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
          </svg>
        );
      })}
    </div>
  );
}

// 酒精度球
function AbvBadge({ abv, size = 44 }) {
  const circumference = 2 * Math.PI * 18;
  const progress = Math.min(abv / 12, 1);
  const offset = circumference * (1 - progress);
  
  return (
    <div style={{
      width: size, height: size, borderRadius: '50%',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      position: 'relative',

  );
}

// 风味雷达图
function FlavorRadar({ data, size = 160 }) {
  const center = size / 2;
  const radius = size * 0.35;
  const angleStep = (Math.PI * 2) / data.length;

  const points = data.map((d, i) => {
    const angle = i * angleStep - Math.PI / 2;
    const r = radius * d.value;
    return {
      x: center + Math.cos(angle) * r,
      y: center + Math.sin(angle) * r,
      labelX: center + Math.cos(angle) * (radius + 18),
      labelY: center + Math.sin(angle) * (radius + 18),
    };
  });

  const pathData = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x},${p.y}`).join(' ') + 'Z';

  // 网格线
  const grids = [0.25, 0.5, 0.75, 1];

  return (
    <svg width={size} height={size} style={{ overflow: 'visible' }}>
      {/* 网格 */}
      {grids.map((g, gi) => (
        <polygon key={gi}
          points={data.map((_, i) => {
            const angle = i * angleStep - Math.PI / 2;
            const r = radius * g;
            return `${center + Math.cos(angle) * r},${center + Math.sin(angle) * r}`;
          }).join(' ')}
          fill="none"
          stroke="var(--foam-200)"
          strokeWidth="1"
        />
      ))}
      {/* 轴线 */}
      {data.map((_, i) => {
        const angle = i * angleStep - Math.PI / 2;
        return (
          <line key={i}
            x1={center} y1={center}
            x2={center + Math.cos(angle) * radius}
            y2={center + Math.sin(angle) * radius}
            stroke="var(--foam-200)"
            strokeWidth="1"
          />
        );
      })}
      {/* 数据区域 */}
      <defs>
        <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stopColor="var(--amber-500)" stopOpacity="0.8" />
          <stop offset="100%" stopColor="var(--hop-500)" stopOpacity="0.8" />
        </linearGradient>
      </defs>
      <path d={pathData}
        fill="url(#radarGrad)"
        stroke="var(--amber-600)"
        strokeWidth="2"
        style={{
          transformOrigin: 'center',
          animation: 'radarDraw 1.2s cubic-bezier(0.22, 1, 0.36, 1) both',
        }}
      />
      {/* 数据点 */}
      {points.map((p, i) => (
        <circle key={i} cx={p.x} cy={p.y} r="3.5"
          fill="#fff"
          stroke="var(--amber-600)"
          strokeWidth="2"
          style={{
            animation: `radarPoint 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) ${0.8 + i * 0.1}s both`,
          }}
        />
      ))}
      {/* 标签 */}
      {data.map((d, i) => (
        <text key={i}
          x={points[i].labelX}
          y={points[i].labelY}
          textAnchor="middle"
          dominantBaseline="middle"
          fontSize="11"
          fill="var(--roast-500)"
          fontWeight={500}
        >{d.name}</text>
      ))}
      <style>{`
        @keyframes radarDraw {
          from { opacity: 0; transform: scale(0.3); }
          to { opacity: 1; transform: scale(1); }
        }
        @keyframes radarPoint {
          from { opacity: 0; transform: scale(0); }
          to { opacity: 1; transform: scale(1); }
        }
      `}</style>
    </svg>
  );
}

/* ============================================================
   页面 3：品鉴记录
   布局：时间线 + 左滑删除 + 下拉刷新
   签名动效：下拉弹性 + 列表左滑手势
   ============================================================ */

function TastingPage({ onNavigate }) {
  const ripple = useRipple();
  const scrollRef = useRef(null);
  const [logs, setLogs] = useState(TASTING_LOGS);
  const [refreshing, setRefreshing] = useState(false);
  const [pullDistance, setPullDistance] = useState(0);
  const [filter, setFilter] = useState('全部');

  const startY = useRef(0);
  const isPulling = useRef(false);

  const handleTouchStart = (e) => {
    if (scrollRef.current?.scrollTop === 0) {
      startY.current = e.touches[0].clientY;
      isPulling.current = true;
    }
  };

  const handleTouchMove = (e) => {
    if (!isPulling.current) return;
    const diff = e.touches[0].clientY - startY.current;
    if (diff > 0) {
      setPullDistance(Math.min(diff * 0.5, 80));
    }
  };

  const handleTouchEnd = () => {
    if (pullDistance > 50) {
      setRefreshing(true);
      setPullDistance(50);
      setTimeout(() => {
        setRefreshing(false);
        setPullDistance(0);
      }, 1500);
    } else {
      setPullDistance(0);
    }
    isPulling.current = false;
  };

  const deleteLog = (id) => {
    setLogs(prev => prev.filter(l => l.id !== id));
  };

  const [swipedId, setSwipedId] = useState(null);

  return (
    <div style={{
      height: '100%', width: '100%',
      background: 'var(--foam-50)',
      display: 'flex', flexDirection: 'column',
    }}>
      {/* 大标题导航 */}
      <div style={{
        padding: 'calc(var(--ios-safe-top) + 8px) 20px 12px',
        background: 'var(--foam-50)',
      }}>
        <h1 style={{
          fontSize: 34, fontWeight: 900,
          color: 'var(--roast-800)',
          fontFamily: "'Noto Serif SC', serif",
          letterSpacing: -0.5,
        }}>品鉴记录</h1>
        <p style={{ fontSize: 13, color: 'var(--roast-400)', marginTop: 4 }}>
          共 {logs.length} 条记录 · 本月 12 条
        </p>
      </div>

      {/* 筛选 */}
      <div style={{
        padding: '0 20px 12px',
        display: 'flex', gap: 8,
      }}>
        {['全部', '五星', 'IPA', '世涛'].map(f => (
          <button key={f}
            onClick={() => setFilter(f)}
            className="ripple-target"
            style={{
              padding: '6px 14px',
              borderRadius: 100,
              border: '1px solid',
              borderColor: filter === f ? 'var(--roast-700)' : 'var(--foam-200)',
              background: filter === f ? 'var(--roast-700)' : 'transparent',
              color: filter === f ? 'var(--foam-50)' : 'var(--roast-500)',
              fontSize: 12, fontWeight: 500,
            }}
          >{f}</button>
        ))}
      </div>

      {/* 下拉刷新指示器 */}
      <div className={`pull-refresh-indicator ${pullDistance > 0 ? 'active' : ''}`}
        style={{ height: pullDistance }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <svg width="16" height="16" viewBox="0 0 24 24"
            className={`pull-arrow ${refreshing ? 'spinning' : ''}`}
            style={{
              transform: pullDistance > 50 ? 'rotate(180deg)' : 'rotate(0deg)',
              fill: 'none',
              stroke: 'var(--amber-600)',
              strokeWidth: 2,
              transition: refreshing ? 'none' : 'transform 0.3s ease',
            }}
          >
            <path d="M12 5v14M5 12l7 7 7-7" strokeLinecap="round" strokeLinejoin="round" />
          </svg>
          <span style={{ fontSize: 12, color: 'var(--amber-600)' }}>
            {refreshing ? '更新中...' : pullDistance > 50 ? '松手刷新' : '下拉刷新'}
          </span>
        </div>
      </div>

      {/* 列表 */}
      <div
        ref={scrollRef}
        className="scroll-area"
        style={{ flex: 1 }}
        onTouchStart={handleTouchStart}
        onTouchMove={handleTouchMove}
        onTouchEnd={handleTouchEnd}
      >
        <div style={{ padding: '4px 20px 120px' }}>
          {logs.map((log, i) => (
            <div
              key={log.id}
              style={{
                marginBottom: 12,
                position: 'relative',
                overflow: 'hidden',
                borderRadius: 16,
                animation: `staggerIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) ${i * 0.08}s both`,
              }}
            >
              {/* 删除按钮背景 */}
              <div className="swipe-delete-bg"
                onClick={() => deleteLog(log.id)}
              >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                </svg>
              </div>
              {/* 卡片内容 */}
              <div
                className="swipe-row ripple-target"
                style={{
                  background: '#fff',
                  borderRadius: 16,
                  padding: 14,
                  display: 'flex', gap: 12,
                  boxShadow: '0 2px 12px rgba(26, 15, 8, 0.06)',
                  transform: swipedId === log.id ? 'translateX(-80px)' : 'translateX(0)',
                  cursor: 'pointer',
                }}
                onClick={() => onNavigate('detail', { beer: BEERS.find(b => b.id === log.beerId) || BEERS[0] })}
              >
                {/* 色卡 */}
                <div style={{

                      ? 'linear-gradient(135deg, var(--amber-600), var(--amber-400))'
                      : 'linear-gradient(135deg, var(--hop-400), var(--hop-200))',
                  flexShrink: 0,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  position: 'relative',
                  overflow: 'hidden',

                  <div style={{
                    position: 'absolute', top: 4, left: '50%',

                    width: 20, height: 8,
                    background: 'rgba(255,251,242,0.8)',
                    borderRadius: '50% 50% 4px 4px',
                  }} />
                </div>

                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                    <h4 style={{
                      fontSize: 15, fontWeight: 600,
                      color: 'var(--roast-800)',
                      marginBottom: 2,
                    }}>{log.beerName}</h4>
                    <span style={{ fontSize: 12, color: 'var(--roast-300)' }}>{log.date}</span>
                  </div>
                  <p style={{ fontSize: 12, color: 'var(--roast-400)', marginBottom: 6 }}>
                    {log.brewery} · {log.abv}%
                  </p>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <StarRating value={log.rating} size={13} />
                    <span style={{ fontSize: 11, color: 'var(--roast-300)' }}>
                      {log.note}
                    </span>
                  </div>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function AddTastingModal({ beer, onClose, onSave }) {
  const ripple = useRipple();
  const [rating, setRating] = useState(4);
  const [note, setNote] = useState('');
  const [aroma, setAroma] = useState([]);
  const [appearance, setAppearance] = useState([]);
  const [flavor, setFlavor] = useState([]);

  const toggleTag = (tag, list, setList) => {
    if (list.includes(tag)) {
      setList(list.filter(t => t !== tag));
    } else {
      setList([...list, tag]);
    }
  };

  const aromaTags = ['柑橘', '热带水果', '花香', '麦芽香', '焦糖', '烘焙', '松针', '酵母'];
  const appearanceTags = ['金黄色', '琥珀色', '深褐色', '黑色', '浑浊', '清澈', '泡沫丰富', '挂杯'];
  const flavorTags = ['苦', '甜', '酸', '醇厚', '清爽', '辛辣', '果香', '麦香'];

  return (
    <div className="modal-backdrop" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-sheet">
        <div className="modal-handle" />
        
        <h2 style={{
          fontSize: 20, fontWeight: 700,
          color: 'var(--roast-800)',
          fontFamily: "'Noto Serif SC', serif",
          marginBottom: 4,
        }}>记录品鉴</h2>
        <p style={{ fontSize: 13, color: 'var(--roast-400)', marginBottom: 16 }}>
          {beer?.name || '精选啤酒'} · {beer?.brewery || ''}
        </p>

        {/* 评分 */}
        <SectionMini title="整体评分">
          <div style={{ display: 'flex', gap: 8, justifyContent: 'center' }}>
            <StarRating value={rating} size={32} interactive onChange={setRating} />
            <span style={{
              fontSize: 28, fontWeight: 700,
              color: 'var(--amber-600)',
              marginLeft: 8,
            }}>{rating}.0</span>
          </div>
        </SectionMini>

        {/* 香气 */}
        <SectionMini title="香气">
          <TagCloud tags={aromaTags} selected={aroma} onToggle={(t) => toggleTag(t, aroma, setAroma)} color="amber" />
        </SectionMini>

        {/* 外观 */}
        <SectionMini title="外观">
          <TagCloud tags={appearanceTags} selected={appearance} onToggle={(t) => toggleTag(t, appearance, setAppearance)} color="hop" />
        </SectionMini>

        {/* 风味 */}
        <SectionMini title="风味">
          <TagCloud tags={flavorTags} selected={flavor} onToggle={(t) => toggleTag(t, flavor, setFlavor)} color="roast" />
        </SectionMini>

        {/* 笔记 */}
        <SectionMini title="品鉴笔记">
          <textarea
            value={note}
            onChange={(e) => setNote(e.target.value)}
            placeholder="记录你的感受和发现..."
            style={{
              width: '100%',
              minHeight: 80,
              padding: 12,
              borderRadius: 12,
              border: '1px solid var(--foam-200)',
              background: 'var(--foam-50)',
              fontSize: 14,
              color: 'var(--roast-700)',
              fontFamily: 'inherit',
              resize: 'none',
              outline: 'none',
            }}
          />
        </SectionMini>

        {/* 保存按钮 */}
        <button
          onClick={(e) => { ripple(e); onSave && onSave(); onClose(); }}
          className="ripple-target"
          style={{
            width: '100%',
            padding: '16px 24px',
            background: 'var(--roast-700)',
            color: 'var(--foam-50)',
            border: 'none', borderRadius: 16,
            fontSize: 16, fontWeight: 600,
            marginTop: 20,
            boxShadow: '0 8px 24px rgba(46, 31, 19, 0.3)',
          }}
        >
          保存品鉴记录
        </button>
      </div>
    </div>
  );
}

function SectionMini({ title, children }) {
  return (
    <div style={{ marginBottom: 16 }}>
      <h4 style={{
        fontSize: 13, fontWeight: 600,
        color: 'var(--roast-600)',
        marginBottom: 8,
      }}>{title}</h4>
      {children}
    </div>
  );
}

function TagCloud({ tags, selected, onToggle, color = 'amber' }) {
  const colorMap = {
    amber: { bg: 'var(--amber-100)', active: 'var(--amber-500)', text: 'var(--amber-700)', activeText: '#fff' },
    hop: { bg: 'var(--hop-100)', active: 'var(--hop-500)', text: 'var(--hop-700)', activeText: '#fff' },
    roast: { bg: 'var(--foam-200)', active: 'var(--roast-600)', text: 'var(--roast-600)', activeText: '#fff' },
  };
  const c = colorMap[color];

  return (
    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
      {tags.map((tag, i) => {
        const isActive = selected.includes(tag);
        return (
          <button key={i}
            onClick={() => onToggle(tag)}
            className="ripple-target"
            style={{
              padding: '6px 14px',
              borderRadius: 100,
              border: 'none',
              background: isActive ? c.active : c.bg,
              color: isActive ? c.activeText : c.text,
              fontSize: 12, fontWeight: 500,
              transition: 'all 0.25s ease',
            }}
          >{tag}</button>
        );
      })}
    </div>
  );
}

/* ============================================================
   主应用
   ============================================================ */

function App() {
  const [activeTab, setActiveTab] = useState('home');
  const [detailBeer, setDetailBeer] = useState(null);
  const [showAddTasting, setShowAddTasting] = useState(false);
  const [addTastingBeer, setAddTastingBeer] = useState(null);
  const [showDesign, setShowDesign] = useState(false);
  const [showApi, setShowApi] = useState(false);
  const [isBack, setIsBack] = useState(false);

  const handleNavigate = useCallback((page, params = {}) => {
    setIsBack(false);
    if (page === 'detail') {
      setDetailBeer(params.beer);
    } else if (page === 'addTasting') {
      setAddTastingBeer(params.beer || null);
      setShowAddTasting(true);
    } else if (page === 'design') {
      setShowDesign(true);
    } else if (page === 'api') {
      setShowApi(true);
    }
  }, []);

  const handleBack = useCallback(() => {
    setIsBack(true);
    setTimeout(() => {
      if (detailBeer) setDetailBeer(null);
      else if (showDesign) setShowDesign(false);
      else if (showApi) setShowApi(false);
    }, 100);
  }, [detailBeer, showDesign, showApi]);

  const handleTabChange = useCallback((tab) => {
    setIsBack(false);
    setDetailBeer(null);
    setShowDesign(false);
    setShowApi(false);
    setActiveTab(tab);
  }, []);

  const showFAB = !detailBeer && !showDesign && !showApi;

  return (
    <div style={{
      position: 'relative',
      width: '100%', height: '100%',
      overflow: 'hidden',
    }}>
      {/* 主页面 */}
      {activeTab === 'home' && !detailBeer && !showDesign && !showApi && (
        <HomePage onNavigate={handleNavigate} />
      )}
      {activeTab === 'cellar' && !detailBeer && !showDesign && !showApi && (
        <CellarPage onNavigate={handleNavigate} />
      )}
      {activeTab === 'tasting' && !detailBeer && !showDesign && !showApi && (
        <TastingPage onNavigate={handleNavigate} />
      )}
      {activeTab === 'profile' && !detailBeer && !showDesign && !showApi && (
        <ProfilePage onNavigate={handleNavigate} />
      )}

      {/* 详情页 */}
      {detailBeer && (
        <div className={isBack ? 'page-back-enter' : 'page-enter'} style={{
          position: 'absolute', inset: 0, zIndex: 40,
        }}>
          <DetailPage beer={detailBeer} onBack={handleBack} onNavigate={handleNavigate} />
        </div>
      )}

      {/* 设计规范页 */}
      {showDesign && (
        <div className={isBack ? 'page-back-enter' : 'page-enter'} style={{
          position: 'absolute', inset: 0, zIndex: 40,
        }}>
          <DesignSpecPage onBack={handleBack} />
        </div>
      )}

      {/* 接口文档页 */}
      {showApi && (
        <div className={isBack ? 'page-back-enter' : 'page-enter'} style={{
          position: 'absolute', inset: 0, zIndex: 40,
        }}>
          <ApiDocPage onBack={handleBack} />
        </div>
      )}

      {/* FAB */}
      <FAB onClick={() => setShowAddTasting(true)} visible={showFAB} />

      {/* TabBar（详情页不显示） */}
      {!detailBeer && !showDesign && !showApi && (
        <BottomTabBar activeTab={activeTab} onTabChange={handleTabChange} />
      )}

      {/* 添加品鉴模态 */}
      {showAddTasting && (
        <AddTastingModal
          beer={addTastingBeer}
          onClose={() => setShowAddTasting(false)}
          onSave={() => {
            // 模拟保存
          }}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<PhoneMock />);

// 宣告可升级为全栈应用
function announceUpgrade() {
  window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
}
announceUpgrade();
if (document.readyState !== 'complete') window.addEventListener('load', announceUpgrade, { once: true });
</script>

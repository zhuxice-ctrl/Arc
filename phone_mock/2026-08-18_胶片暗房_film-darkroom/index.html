    #0E0B09;
    position: relative;
  }

  /* ─── Custom Cursor ─── */
  .custom-cursor {
    position: fixed;
    width: 32px; height: 32px;
    pointer-events: none;
    z-index: 99999;
    transform: translate(-50%, -50%);
    transition: width 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                height 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                border-color 0.3s ease;
  }
  .cursor-ring {
    position: absolute; inset: 0;
    border: 2px solid #F2EBDD;
    border-radius: 50%;
    box-shadow:
      0 0 12px rgba(242, 235, 221, 0.6),
      0 0 24px rgba(192, 57, 43, 0.3),
      inset 0 0 6px rgba(242, 235, 221, 0.3);
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .cursor-dot {
    position: absolute; top: 50%; left: 50%;
    width: 6px; height: 6px;
    background: #C0392B;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px #C0392B, 0 0 16px rgba(192, 57, 43, 0.5);
    transition: all 0.15s ease;
  }
  .custom-cursor.hovering {
    width: 56px; height: 56px;
  }
  .custom-cursor.hovering .cursor-ring {
    border-color: #D98E32;
    box-shadow:
      0 0 20px rgba(217, 142, 50, 0.7),
      0 0 40px rgba(192, 57, 43, 0.4),
      inset 0 0 10px rgba(217, 142, 50, 0.4);
  }
  .custom-cursor.hovering .cursor-dot {
    background: #D98E32;
    box-shadow: 0 0 12px #D98E32;
  }
  .cursor-ripple {
    position: fixed;
    pointer-events: none;
    z-index: 99998;
    border: 2px solid #D98E32;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0.8;
  }

  /* ─── Film grain overlay ─── */
  .film-grain {
    position: absolute; inset: 0;
    pointer-events: none;
    opacity: 0.03;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* ─── Red safelight ambient glow (in dark areas) ─── */
  .safelight-glow {
    position: absolute; top: -60px; left: 50%;
    width: 200px; height: 200px;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(192,57,43,0.35), transparent 70%);
    pointer-events: none;
    filter: blur(20px);
    animation: safelight-breathe 4s ease-in-out infinite;
  }
  @keyframes safelight-breathe {
    0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.15); }
  }

  /* ─── Film developing animation (gray to photo) ─── */
  .developing-photo {
    position: relative;
    filter: grayscale(100%) brightness(1.1) contrast(0.7);
    transition: filter 2.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .developing-photo.developed {
    filter: grayscale(0%) brightness(1) contrast(1);
  }

  /* ─── Shutter click effect ─── */
  .shutter-flash {
    position: fixed; inset: 0;
    background: #F2EBDD;
    opacity: 0;
    pointer-events: none;
    z-index: 1000;
  }
  .shutter-flash.active {
    animation: shutter-flash-anim 0.25s ease-out;
  }
  @keyframes shutter-flash-anim {
    0% { opacity: 0; }
    20% { opacity: 0.9; }
    100% { opacity: 0; }
  }

  /* ─── Scrollbar hidden inside phone ─── */
  ::-webkit-scrollbar { width: 0; height: 0; }

  /* ─── Page transition ─── */
  .page-enter {
    animation: page-slide-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes page-slide-in {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* ─── Film advance strips ─── */
  .film-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding: 0 16px 8px;
  }
  .film-card {
    scroll-snap-align: start;
    flex-shrink: 0;
  }

  /* ─── Staggered list enter ─── */
  .stagger-item {
    opacity: 0;
    transform: translateY(16px);
    animation: stagger-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes stagger-in {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ─── Progress ring ─── */
  .progress-ring-circle {
    transform: rotate(-90deg);
    transform-origin: 50% 50%;
    transition: stroke-dashoffset 1s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* ─── Pull to refresh spring ─── */
  .pull-indicator {
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    transition: height 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* ─── Floating action button ─── */
  .fab {
    position: absolute;
    bottom: calc(var(--ios-safe-bottom, 34px) + 80px);
    right: 20px;
    z-index: 30;
  }
  .fab-btn {
    width: 56px; height: 56px;
    border-radius: 18px;
    background: linear-gradient(135deg, #C0392B, #D98E32);
    box-shadow: 0 8px 24px rgba(192, 57, 43, 0.4), 0 2px 8px rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
    cursor: none;
  }
  .fab-btn:hover {
    transform: scale(1.1) rotate(90deg);
    box-shadow: 0 12px 32px rgba(192, 57, 43, 0.5);
  }
  .fab-btn:active { transform: scale(0.95); }

  /* ─── Bottom sheet / half screen drawer ─── */
  .bottom-sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: #1A1512;
    border-radius: 24px 24px 0 0;
    z-index: 25;
    transform: translateY(100%);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
  }
  .bottom-sheet.open {
    transform: translateY(0);
  }
  .sheet-handle {
    width: 36px; height: 5px;
    background: rgba(242, 235, 221, 0.2);
    border-radius: 3px;
    margin: 10px auto;
  }

  /* ─── Tab bar ─── */
  .tab-bar {
    position: absolute;
    left: 0; right: 0;
    bottom: 0;
    height: calc(var(--ios-safe-bottom, 34px) + 64px);
    padding-bottom: var(--ios-safe-bottom, 34px);
    z-index: 20;
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    background: rgba(26, 21, 18, 0.85);
    border-top: 0.5px solid rgba(242, 235, 221, 0.1);
    display: flex;
    align-items: center;
    justify-content: space-around;
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 6px 0;
    cursor: none;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .tab-item:active { transform: scale(0.92); }
  .tab-icon {
    width: 24px; height: 24px;
    opacity: 0.5;
    transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .tab-item.active .tab-icon {
    opacity: 1;
    transform: translateY(-2px);
  }
  .tab-label {
    font-size: 10px;
    color: rgba(242, 235, 221, 0.5);
    font-weight: 500;
    letter-spacing: 0.2px;
    transition: color 0.3s ease;
  }
  .tab-item.active .tab-label {
    color: #D98E32;
  }

  /* ─── Masonry columns ─── */
  .masonry {
    column-count: 2;
    column-gap: 10px;
    padding: 0 16px;
  }
  .masonry-item {
    break-inside: avoid;
    margin-bottom: 10px;
    border-radius: 14px;
    overflow: hidden;
    position: relative;
  }

  /* ─── Badge / chip ─── */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    cursor: none;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .chip:hover { transform: translateY(-2px); }

  /* ─── Nav bar title ─── */
  .nav-large-title {
    font-family: 'Noto Serif SC', serif;
    font-weight: 700;

    line-height: 1.1;
    color: #F2EBDD;

  }

  /* ─── Utility ─── */
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

  /* Ambient float animation */
  @keyframes float-slow {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .float-slow { animation: float-slow 4s ease-in-out infinite; }

  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(2.5); opacity: 0; }
  }

  /* Code block for API docs */
  .code-block {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    line-height: 1.7;
    color: #F2EBDD;
    background: #0E0B09;
    border-radius: 10px;
    padding: 12px 14px;
    overflow-x: auto;
    border: 1px solid rgba(242, 235, 221, 0.08);
  }
  .code-keyword { color: #D98E32; }
  .code-string { color: #C0392B; }
  .code-comment { color: rgba(242, 235, 221, 0.35); }
  .code-prop { color: #F2EBDD; }

  /* Spec swatch */
  .swatch {
    border-radius: 10px;
    height: 58px;
    position: relative;
    overflow: hidden;
    cursor: none;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .swatch:hover { transform: scale(1.04); }

  /* Step indicator */
  .step-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(242, 235, 221, 0.2);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);

    background: #D98E32;
    width: 24px;
    border-radius: 4px;
    box-shadow: 0 0 12px rgba(217, 142, 50, 0.6);
  }

  /* Long press menu hint */
  .press-card {
    position: relative;
    overflow: hidden;
  }
  .press-card::after {
    content: '';
    position: absolute; inset: 0;
    background: rgba(255,255,255,0);
    transition: background 0.3s ease;
    pointer-events: none;
  }
  .press-card:active::after {
    background: rgba(255,255,255,0.08);
  }

  /* Page container */
  .page-container {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
    background: #1A1512;
  }

  /* Modal */
  .modal-backdrop {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 40;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .modal-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }
  .modal-content {
    position: absolute;
    left: 16px; right: 16px;
    top: 50%;
    transform: translateY(-50%) scale(0.9);
    background: #2E241C;
    border-radius: 20px;
    padding: 24px 20px;
    z-index: 41;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border: 1px solid rgba(242, 235, 221, 0.08);
  }
  .modal-content.open {
    opacity: 1;
    transform: translateY(-50%) scale(1);
    pointer-events: auto;
  }

  /* Film sprocket holes decoration */
  .sprocket-top, .sprocket-bottom {
    height: 12px;
    background-image: radial-gradient(circle, #1A1512 3px, transparent 3.5px);
    background-size: 16px 12px;
    background-repeat: repeat-x;
    background-color: #2E241C;
  }
</style>

/* ============================================================
   Custom Cursor Component
   ============================================================ */
function CustomCursor() {
  const cursorRef = useRef(null);
  const dotRef = useRef(null);
  const [hovering, setHovering] = useState(false);
  const rafRef = useRef(null);
  const mouse = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const pos = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });

  useEffect(() => {
    const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    if (mq.matches) return;

    const onMove = (e) => {
      mouse.current.x = e.clientX;
      mouse.current.y = e.clientY;
      // Check if hovering interactive element
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const interactive = el && el.closest && el.closest('button, a, .chip, .tab-item, .press-card, .fab-btn, .swatch, .masonry-item, .scroll-item');
      setHovering(!!interactive);
    };

    const onClick = (e) => {
      // Ripple effect
      const ripple = document.createElement('div');
      ripple.className = 'cursor-ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      ripple.style.width = '32px';
      ripple.style.height = '32px';
      document.body.appendChild(ripple);
      ripple.animate([
        { transform: 'translate(-50%, -50%) scale(0)', opacity: 0.8 },
        { transform: 'translate(-50%, -50%) scale(2.5)', opacity: 0 }
      ], { duration: 600, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });
      setTimeout(() => ripple.remove(), 600);
    };

    const animate = () => {
      pos.current.x += (mouse.current.x - pos.current.x) * 0.18;
      pos.current.y += (mouse.current.y - pos.current.y) * 0.18;
      if (cursorRef.current) {
        cursorRef.current.style.transform = `translate(${pos.current.x}px, ${pos.current.y}px) translate(-50%, -50%)`;
      }
      rafRef.current = requestAnimationFrame(animate);
    };
    rafRef.current = requestAnimationFrame(animate);

    const onVisibility = () => {
      if (document.hidden) {
        cancelAnimationFrame(rafRef.current);
      } else {
        rafRef.current = requestAnimationFrame(animate);
      }
    };

    window.addEventListener('mousemove', onMove);
    window.addEventListener('click', onClick);
    document.addEventListener('visibilitychange', onVisibility);

    return () => {
      cancelAnimationFrame(rafRef.current);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('click', onClick);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, []);

  return (
    <div ref={cursorRef} className={`custom-cursor ${hovering ? 'hovering' : ''}`}>
      <div className="cursor-ring" />
      <div className="cursor-dot" />
    </div>
  );
}

/* ============================================================
   Film Developing Photo (gray → color animation)
   ============================================================ */
function DevelopingPhoto({ src, alt, style, className = '', delay = 0 }) {
  const [developed, setDeveloped] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const imgRef = useRef(null);

  useEffect(() => {
    const timer = setTimeout(() => {
      if (loaded) setDeveloped(true);
    }, delay);
    return () => clearTimeout(timer);
  }, [delay, loaded]);

  return (
    <img
      ref={imgRef}
      src={src}
      alt={alt}
      onLoad={() => setLoaded(true)}
      style={{ ...style, transition: 'filter 2.5s cubic-bezier(0.22, 1, 0.36, 1)' }}
      className={`developing-photo ${developed ? 'developed' : ''} ${className}`}
    />
  );
}

/* ============================================================
   Progress Ring
   ============================================================ */
function ProgressRing({ size = 80, stroke = 6, progress = 70, color = '#D98E32', label, sublabel }) {
  const radius = (size - stroke) / 2;
  const circumference = radius * 2 * Math.PI;
  const offset = circumference - (progress / 100) * circumference;

  return (
    <div style={{ position: 'relative', width: size, height: size }}>
      <svg width={size} height={size}>
        <circle cx={size/2} cy={size/2} r={radius} fill="none" stroke="rgba(242,235,221,0.1)" strokeWidth={stroke} />
        <circle
          className="progress-ring-circle"
          cx={size/2} cy={size/2} r={radius}
          fill="none" stroke={color} strokeWidth={stroke}
          strokeLinecap="round"
          strokeDasharray={circumference}
          strokeDashoffset={offset}
          style={{ filter: `drop-shadow(0 0 6px ${color}80)` }}
        />
      </svg>
      {label && (
        <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
          <div style={{ fontSize: 18, fontWeight: 700, color: TOKENS.cream, lineHeight: 1 }}>{label}</div>
          {sublabel && <div style={{ fontSize: 10, color: TOKENS.creamDim, marginTop: 3 }}>{sublabel}</div>}
        </div>
      )}
    </div>
  );
}

   ============================================================ */
function HomePage({ onCameraClick, onFilmClick, onShutter }) {
  const [pullY, setPullY] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const [activeChip, setActiveChip] = useState('推荐');
  const containerRef = useRef(null);
  const startY = useRef(0);
  const pulling = useRef(false);
  const mq = useRef(window.matchMedia('(prefers-reduced-motion: reduce)'));

  const chips = ['推荐', '人像', '街拍', '风光', '黑白', '新冲扫'];

  const onTouchStart = (e) => {
    if (containerRef.current?.scrollTop === 0) {
      startY.current = e.touches[0].clientY;
      pulling.current = true;
    }
  };
  const onTouchMove = (e) => {
    if (!pulling.current) return;
    const dy = e.touches[0].clientY - startY.current;
    if (dy > 0 && containerRef.current?.scrollTop === 0) {
      const damped = Math.min(dy * 0.4, 80);
      setPullY(damped);
    }
  };
  const onTouchEnd = () => {
    if (pullY > 50 && !refreshing) {
      setRefreshing(true);
      setPullY(50);
      setTimeout(() => {
        setRefreshing(false);
        setPullY(0);
      }, 1500);
    } else {
      setPullY(0);
    }
    pulling.current = false;
  };

  // Mouse drag simulation for desktop
  const onMouseDown = (e) => {
    if (containerRef.current?.scrollTop === 0) {
      startY.current = e.clientY;
      pulling.current = true;
    }
  };
  const onMouseMove = (e) => {
    if (!pulling.current) return;
    const dy = e.clientY - startY.current;
    if (dy > 0 && containerRef.current?.scrollTop === 0) {
      const damped = Math.min(dy * 0.4, 80);
      setPullY(damped);
    }
  };
  const onMouseUp = () => {
    if (pullY > 50 && !refreshing) {
      setRefreshing(true);
      setPullY(50);
      setTimeout(() => {
        setRefreshing(false);
        setPullY(0);
      }, 1500);
    } else {
      setPullY(0);
    }
    pulling.current = false;
  };

  return (
    <div className="page-container page-enter" onMouseDown={onMouseDown} onMouseMove={onMouseMove} onMouseUp={onMouseUp} onMouseLeave={onMouseUp}
      onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd} ref={containerRef}>
      <SafeLightGlow />
      <div style={{ padding: 'var(--ios-safe-top, 62px) 20px 16px', position: 'relative', zIndex: 2 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>

            <div className="nav-large-title">发现</div>
            <div className="nav-subtitle">今日新冲扫 · 128 张样片</div>
          </div>

            style={{ width: 40, height: 40, borderRadius: 12, background: 'rgba(242,235,221,0.08)', border: '1px solid rgba(242,235,221,0.12)', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'none', color: TOKENS.cream, transition: 'all 0.3s ease' }}>
            <Icon name="shutter" size={20} />
          </button>
        </div>

        {/* Search bar */}
        <div style={{ marginTop: 16, display: 'flex', alignItems: 'center', gap: 10, padding: '10px 16px', background: 'rgba(242,235,221,0.06)', borderRadius: 14, border: '1px solid rgba(242,235,221,0.08)' }}>
          <Icon name="search" size={18} color={TOKENS.creamDim} />
          <span style={{ fontSize: 14, color: TOKENS.creamDim }}>搜索相机、胶卷、冲扫店</span>
        </div>
      </div>

      {/* Pull to refresh indicator */}
      <div className="pull-indicator" style={{ height: pullY }}>

/* ============================================================

   ============================================================ */
function CameraDetailPage({ camera, onBack, onShutter }) {
  const scrollRef = useRef(null);
  const heroRef = useRef(null);
  const [like, setLike] = useState(false);

  useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    const onScroll = () => {
      const y = el.scrollTop;
      if (heroRef.current) {
        const scale = Math.max(1, 1 + y * 0.003);
        const opacity = Math.max(0, 1 - y / 200);
        heroRef.current.style.transform = `scale(${scale}) translateY(${y * 0.3}px)`;
        heroRef.current.style.opacity = opacity;
      }
    };
    el.addEventListener('scroll', onScroll);
    return () => el.removeEventListener('scroll', onScroll);
  }, [camera]);

  if (!camera) return null;

  return (
    <div className="page-container page-enter" ref={scrollRef}>
      {/* Hero image */}
      <div style={{ position: 'relative', height: 360, overflow: 'hidden', background: TOKENS.charcoal }}>

/* ============================================================
   Page 4: Film Library (Film Strip Carousel)
   胶片过片/上卷动效 + 轮播画廊
   ============================================================ */
function FilmLibraryPage({ onFilmClick }) {
  const [activeIdx, setActiveIdx] = useState(0);
  const scrollRef = useRef(null);
  const cardWidth = 260;
  const cardGap = 16;

  const scrollToIndex = (idx) => {
    if (scrollRef.current) {
      const x = idx * (cardWidth + cardGap) + 16;
      scrollRef.current.scrollTo({ left: x, behavior: 'smooth' });
    }
  };

  const onScroll = () => {
    if (!scrollRef.current) return;
    const x = scrollRef.current.scrollLeft;
    const idx = Math.round(x / (cardWidth + cardGap));
    setActiveIdx(Math.max(0, Math.min(FILMS.length - 1, idx)));
  };

  const active = FILMS[activeIdx];

  return (
    <div className="page-container page-enter" style={{ background: `linear-gradient(180deg, ${TOKENS.charcoal} 0%, ${TOKENS.warmBlack} 100%)` }}>
      <div style={{ padding: 'var(--ios-safe-top, 62px) 20px 0' }}>
        <div className="nav-large-title">胶卷库</div>
        <div className="nav-subtitle">24 款胶卷 · 从入门到收藏级</div>

      {/* Featured film with sprocket design */}

          <span style={{ fontSize: 12, color: TOKENS.cream, fontWeight: 500 }}>正在浏览 · {active.name}</span>
          <span style={{ marginLeft: 'auto', fontSize: 11, color: TOKENS.creamDim }}>{activeIdx + 1} / {FILMS.length}</span>
        </div>
        <div className="sprocket-bottom" />
      </div>

      {/* Film strip carousel */}

        ref={scrollRef}

        style={{
          display: 'flex', gap: cardGap,
          overflowX: 'auto', scrollSnapType: 'x mandatory',

              transform: i === activeIdx ? 'scale(1)' : 'scale(0.92)',
              boxShadow: i === activeIdx ? `0 20px 40px rgba(192,57,43,0.25), 0 8px 20px rgba(0,0,0,0.4)` : 'none',
            }}>

              <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(to top, rgba(26,21,18,0.95) 0%, transparent 50%)' }} />

              {/* ISO badge */}
              <div style={{ position: 'absolute', top: 14, right: 14, background: 'rgba(26,21,18,0.7)', backdropFilter: 'blur(8px)', padding: '6px 12px', borderRadius: 10, border: '1px solid rgba(242,235,221,0.12)' }}>

    </div>
  );
}

function App() {
  const [tab, setTab] = useState('home');
  const [selectedCamera, setSelectedCamera] = useState(null);
  const [showCameraDetail, setShowCameraDetail] = useState(false);
  const [showBooking, setShowBooking] = useState(false);
  const [showSpecs, setShowSpecs] = useState(false);
  const [showApi, setShowApi] = useState(false);
  const [shutterFlash, setShutterFlash] = useState(false);

  const triggerShutter = useCallback(() => {
    setShutterFlash(true);
    const t = setTimeout(() => setShutterFlash(false), 250);
    return () => clearTimeout(t);
  }, []);

  const handleTabChange = (newTab) => {
    triggerShutter();
    setShowCameraDetail(false);
    setShowBooking(false);
    setShowSpecs(false);
    setShowApi(false);
    setTimeout(() => setTab(newTab), 150);
  };

  const handleCameraClick = (cam) => {
    triggerShutter();
    setSelectedCamera(cam);
    setTimeout(() => setShowCameraDetail(true), 150);
  };

  // ── Announce upgrade ──
  useEffect(() => {
    const announce = () => {
      window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    };
    announce();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announce, { once: true });
    }
  }, []);

  // ── Render current page ──
  const renderPage = () => {
    if (showSpecs) return <DesignSpecsPage onBack={() => setShowSpecs(false)} />;
    if (showApi) return <ApiDocsPage onBack={() => setShowApi(false)} />;
    if (showBooking) return <BookingPage onBack={() => setShowBooking(false)} />;
    if (showCameraDetail) return <CameraDetailPage camera={selectedCamera} onBack={() => setShowCameraDetail(false)} onShutter={triggerShutter} />;

    switch (tab) {
      case 'home':
        return <HomePage onCameraClick={handleCameraClick} onFilmClick={() => setTab('films')} onShutter={triggerShutter} />;
      case 'cameras':
        return <CameraCatalogPage onCameraClick={handleCameraClick} />;
      case 'films':
        return <FilmLibraryPage onFilmClick={() => {}} />;
      case 'darkroom':
        return <DarkroomPage
          onBooking={() => setShowBooking(true)}
          onSpecs={() => setShowSpecs(true)}
          onApi={() => setShowApi(true)}
          onShutter={triggerShutter}
        />;
      default:
        return null;
    }
  };

  const showTabBar = !showCameraDetail && !showBooking && !showSpecs && !showApi;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 24 }}>
      <h1 style={{
        fontFamily: '"Noto Serif SC", serif',
        fontSize: 14,
        color: 'rgba(242,235,221,0.4)',
        fontWeight: 400,
        letterSpacing: 3,
      }}>
        胶 片 暗 房 · 原 生 App V2
      </h1>

      <div style={{
        width: 402, height: 874, borderRadius: 48, overflow: 'hidden',
        position: 'relative', background: '#000',
        border: '1px solid #2A2522',
        boxShadow: '0 30px 80px rgba(0,0,0,0.6), 0 0 120px rgba(192,57,43,0.08)',
        fontFamily: '"Noto Sans SC", -apple-system, system-ui, sans-serif',
        WebkitFontSmoothing: 'antialiased',
        '--ios-safe-top': '62px',
        '--ios-safe-bottom': '34px',
      }}>
        {/* dynamic island */}
        <div style={{
          position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
          width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
        }} />
        {/* status bar */}
        <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
          {/* custom status bar with dark icons on dark bg */}
          <div style={{
            display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
            padding: '21px 24px 19px', boxSizing: 'border-box',
            position: 'relative', zIndex: 20, width: '100%',
          }}>
            <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
              <span style={{ fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590, fontSize: 17, lineHeight: '22px', color: '#F2EBDD' }}>9:41</span>
            </div>
            <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
              <svg width="19" height="12" viewBox="0 0 19 12">
                <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill="#F2EBDD"/>
                <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill="#F2EBDD"/>
                <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill="#F2EBDD"/>
                <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill="#F2EBDD"/>
              </svg>
              <svg width="17" height="12" viewBox="0 0 17 12">
                <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill="#F2EBDD"/>
                <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill="#F2EBDD"/>
                <circle cx="8.5" cy="10.5" r="1.5" fill="#F2EBDD"/>
              </svg>
              <svg width="27" height="13" viewBox="0 0 27 13">
                <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="rgba(242,235,221,0.35)" fill="none"/>
                <rect x="2" y="2" width="20" height="9" rx="2" fill="#F2EBDD"/>
                <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill="#F2EBDD" fillOpacity="0.4"/>
              </svg>
            </div>
          </div>
        </div>

        {/* screen content */}
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column', isolation: 'isolate' }}>
          <div style={{ flex: 1, overflow: 'hidden', position: 'relative' }}>
            {renderPage()}
          </div>
          {showTabBar && <TabBar active={tab} onChange={handleTabChange} />}
        </div>

        {/* home indicator */}
        <div style={{
          position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
          height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
          paddingBottom: 8, pointerEvents: 'none',
        }}>
          <div style={{
            width: 139, height: 5, borderRadius: 100,
            background: 'rgba(242,235,221,0.7)',
          }} />
        </div>

        {/* shutter flash overlay */}
        <ShutterFlash active={shutterFlash} />

        {/* film grain overlay */}
        <div className="film-grain" />
      </div>

      {/* Page indicator (for demo) */}
      <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', justifyContent: 'center', maxWidth: 400 }}>
        {[
          { key: 'home', label: '首页', tab: 'home' },
          { key: 'cameras', label: '相机图鉴', tab: 'cameras' },
          { key: 'camera-detail', label: '相机详情', action: () => { setTab('cameras'); setTimeout(() => handleCameraClick(CAMERAS[0]), 200); } },
          { key: 'films', label: '胶卷库', tab: 'films' },
          { key: 'booking', label: '冲扫预约', action: () => setShowBooking(true) },
          { key: 'darkroom', label: '个人暗房', tab: 'darkroom' },
          { key: 'specs', label: '设计规范', action: () => { setTab('darkroom'); setTimeout(() => setShowSpecs(true), 200); } },
          { key: 'api', label: '接口文档', action: () => { setTab('darkroom'); setTimeout(() => setShowApi(true), 200); } },
        ].map(p => {
          const isActive =
            (p.tab && tab === p.tab && !showCameraDetail && !showBooking && !showSpecs && !showApi) ||
            (p.key === 'camera-detail' && showCameraDetail) ||
            (p.key === 'booking' && showBooking) ||
            (p.key === 'specs' && showSpecs) ||
            (p.key === 'api' && showApi);
          return (
            <button key={p.key}
              onClick={() => {
                triggerShutter();
                if (p.action) p.action();
                else if (p.tab) handleTabChange(p.tab);
              }}
              style={{
                padding: '6px 14px', borderRadius: 20,
                fontSize: 12,
                background: isActive ? 'rgba(217,142,50,0.15)' : 'rgba(242,235,221,0.04)',
                color: isActive ? '#D98E32' : 'rgba(242,235,221,0.5)',
                border: `1px solid ${isActive ? 'rgba(217,142,50,0.4)' : 'rgba(242,235,221,0.08)'}`,
                cursor: 'none',
                transition: 'all 0.25s ease',
              }}>
              {p.label}
            </button>
          );
        })}
      </div>

      <CustomCursor />
    </div>
  );
}

   Mount

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>

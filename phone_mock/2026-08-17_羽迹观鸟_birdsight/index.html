<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>羽迹 Birdsight · 观鸟微信小程序</title>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; min-height:100vh; background:#2a2a24; font-family:'Noto Sans SC','PingFang SC',sans-serif; color:#3A3A32; overflow:hidden; cursor:none; }
  
  /* Stage */
  .stage { width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; background:
    radial-gradient(ellipse at 30% 20%, rgba(90,107,59,0.15), transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(210,105,30,0.1), transparent 50%),
    #2a2a24;
    position:relative;
  }
  .stage::before { content:''; position:absolute; inset:0; background-image:
    radial-gradient(circle at 10% 20%, rgba(255,255,255,0.03) 0%, transparent 40%),
    radial-gradient(circle at 90% 70%, rgba(255,255,255,0.02) 0%, transparent 40%); pointer-events:none; }
  
  /* Phone Frame */
  .phone { position:relative; width:390px; height:844px; border-radius:54px; background:#0a0a0a; padding:12px; box-shadow:
    0 40px 80px rgba(0,0,0,0.5),
    0 0 0 1px rgba(255,255,255,0.05),
    inset 0 0 0 2px #1a1a1a;
  }
  .phone-screen { position:relative; width:100%; height:100%; border-radius:44px; overflow:hidden; background:#F4F1E8; }
  
  /* Dynamic Island */
  .dynamic-island { position:absolute; top:12px; left:50%; transform:translateX(-50%); width:120px; height:36px; background:#000; border-radius:20px; z-index:200; }
  
  /* Status Bar */
  .status-bar { position:absolute; top:0; left:0; right:0; height:54px; display:flex; align-items:center; justify-content:space-between; padding:0 28px; padding-top:16px; z-index:150; font-size:14px; font-weight:600; color:#3A3A32; pointer-events:none; }
  .status-bar.light { color:#fff; }
  .status-right { display:flex; align-items:center; gap:5px; }
  .signal-bars { display:flex; align-items:flex-end; gap:2px; height:10px; }
  .signal-bars span { width:3px; background:currentColor; border-radius:1px; }
  .signal-bars span:nth-child(1) { height:3px; }
  .signal-bars span:nth-child(2) { height:5px; }
  .signal-bars span:nth-child(3) { height:7px; }
  .signal-bars span:nth-child(4) { height:10px; }
  .battery { width:24px; height:11px; border:1px solid currentColor; border-radius:2px; position:relative; padding:1px; }
  .battery::after { content:''; position:absolute; right:-3px; top:3px; width:2px; height:5px; background:currentColor; border-radius:0 1px 1px 0; }
  .battery-fill { height:100%; width:80%; background:currentColor; border-radius:1px; }
  
  /* Capsule Button */
  .capsule-btn { position:absolute; top:54px; right:12px; width:88px; height:32px; background:rgba(255,255,255,0.85); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-radius:16px; border:1px solid rgba(0,0,0,0.06); display:flex; align-items:center; z-index:140; cursor:none; }
  .capsule-btn.dark { background:rgba(0,0,0,0.4); border-color:rgba(255,255,255,0.15); }
  .capsule-btn .cap-icon { flex:1; display:flex; align-items:center; justify-content:center; height:100%; color:#3A3A32; }
  .capsule-btn.dark .cap-icon { color:#fff; }
  .capsule-btn .cap-divider { width:1px; height:16px; background:rgba(0,0,0,0.1); }
  .capsule-btn.dark .cap-divider { background:rgba(255,255,255,0.2); }
  .capsule-dots { display:flex; gap:2.5px; }
  .capsule-dots span { width:3px; height:3px; border-radius:50%; background:currentColor; }
  
  /* App Container */
  .app-container { position:absolute; inset:0; overflow:hidden; }
  
  /* Page Container */
  .page { position:absolute; inset:0; background:#F4F1E8; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
  .page::-webkit-scrollbar { display:none; }
  .page-content { padding-bottom:calc(83px + env(safe-area-inset-bottom,0px)); }
  
  /* Page transitions */
  .page-enter { transform:translateX(100%); }
  .page-enter-active { transform:translateX(0); transition:transform 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
  .page-exit { transform:translateX(0); }
  .page-exit-active { transform:translateX(-30%); transition:transform 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
  
  /* Navigation Bar */
  .nav-bar { position:sticky; top:0; z-index:100; height:88px; padding-top:54px; display:flex; align-items:center; padding-left:16px; padding-right:108px; }
  .nav-bar.transparent { background:transparent; }
  .nav-bar.frosted { background:rgba(244,241,232,0.85); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-bottom:1px solid rgba(58,58,50,0.06); }
  .nav-title { font-family:'Noto Serif SC', serif; font-size:17px; font-weight:700; color:#3A3A32; flex:1; text-align:center; }
  .nav-back { width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:rgba(255,255,255,0.6); backdrop-filter:blur(8px); }
  
  /* Tab Bar */
  .tab-bar { position:absolute; bottom:0; left:0; right:0; height:calc(83px + env(safe-area-inset-bottom,0px)); padding-bottom:env(safe-area-inset-bottom,0px); background:rgba(244,241,232,0.95); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-top:1px solid rgba(58,58,50,0.08); display:flex; z-index:90; }
  .tab-item { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding-top:8px; cursor:none; position:relative; }
  .tab-item svg { width:24px; height:24px; stroke:#9A9A8A; fill:none; stroke-width:1.8; transition:all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .tab-item.active svg { stroke:#5A6B3B; transform:translateY(-2px) scale(1.1); }
  .tab-icon-wrap { position:relative; width:28px; height:28px; display:flex; align-items:center; justify-content:center; }
  .tab-item.active .tab-icon-wrap::after { content:''; position:absolute; bottom:-4px; width:4px; height:4px; border-radius:50%; background:#D2691E; animation:tabBounce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes tabBounce { 0%{transform:scale(0);} 60%{transform:scale(1.3);} 100%{transform:scale(1);} }
  .tab-label { font-size:10px; color:#9A9A8A; transition:color 0.3s; font-weight:500; }
  .tab-item.active .tab-label { color:#5A6B3B; font-weight:600; }
  
  /* Floating Action Ball */
  .fab { position:absolute; right:16px; bottom:100px; width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg, #D2691E, #E87B2D); box-shadow:0 8px 24px rgba(210,105,30,0.4); display:flex; align-items:center; justify-content:center; z-index:80; cursor:none; }
  .fab:active { transform:scale(0.92); }
  .fab-ring { position:absolute; inset:-4px; border-radius:50%; border:2px solid rgba(210,105,30,0.3); animation:fabPulse 2.5s ease-out infinite; }
  @keyframes fabPulse { 0%{transform:scale(0.9); opacity:1;} 100%{transform:scale(1.4); opacity:0;} }
  
  /* ===== PAGE 1: HOME ===== */
  .home-hero { position:relative; height:380px; overflow:hidden; }
  .home-hero-bg { position:absolute; inset:0; }
  .home-hero-bg img { width:100%; height:100%; object-fit:cover; }
  .home-hero-overlay { position:absolute; inset:0; background:linear-gradient(180deg, rgba(90,107,59,0.3) 0%, rgba(58,58,50,0.1) 40%, rgba(244,241,232,0) 60%, #F4F1E8 100%); }
  
  .home-hero-content { position:relative; padding:100px 20px 0; color:#fff; z-index:2; }
  .hero-greeting { font-size:13px; opacity:0.9; margin-bottom:4px; letter-spacing:1px; }
  .hero-title { font-family:'Noto Serif SC', serif; font-size:28px; font-weight:900; line-height:1.3; margin-bottom:6px; }
  .hero-subtitle { font-size:13px; opacity:0.85; display:flex; align-items:center; gap:6px; }
  .hero-season-badge { display:inline-block; padding:2px 8px; background:rgba(210,105,30,0.9); border-radius:10px; font-size:11px; font-weight:500; }
  
  /* Feathers falling */
  .feather { position:absolute; width:18px; height:18px; pointer-events:none; opacity:0.7; z-index:3; }
  .feather svg { width:100%; height:100%; }
  
  /* Search Bar */
  .search-bar { margin:16px 20px 0; height:44px; background:rgba(255,255,255,0.95); backdrop-filter:blur(12px); border-radius:22px; display:flex; align-items:center; padding:0 16px; gap:10px; box-shadow:0 4px 20px rgba(58,58,50,0.08); position:relative; z-index:5; }
  .search-bar svg { width:18px; height:18px; stroke:#9A9A8A; fill:none; stroke-width:2; flex-shrink:0; }
  .search-bar input { flex:1; border:none; outline:none; background:transparent; font-size:14px; color:#3A3A32; font-family:inherit; }
  .search-bar input::placeholder { color:#B0B0A0; }
  
  /* Quick Actions */
  .quick-actions { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; padding:24px 20px 12px; }
  .quick-action { display:flex; flex-direction:column; align-items:center; gap:8px; cursor:none; }
  .qa-icon { width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center; transition:transform 0.2s; }
  .quick-action:active .qa-icon { transform:scale(0.92); }
  .qa-icon svg { width:24px; height:24px; stroke:#fff; fill:none; stroke-width:1.8; }
  .qa-label { font-size:11px; color:#3A3A32; font-weight:500; }
  
  /* Section Headers */
  .section-header { display:flex; align-items:center; justify-content:space-between; padding:20px 20px 12px; }
  .section-title { font-family:'Noto Serif SC', serif; font-size:18px; font-weight:700; color:#3A3A32; display:flex; align-items:center; gap:8px; }
  .section-title::before { content:''; width:3px; height:18px; background:linear-gradient(180deg, #5A6B3B, #D2691E); border-radius:2px; }
  .section-more { font-size:12px; color:#9A9A8A; display:flex; align-items:center; gap:2px; }
  
  /* Bird Cards - horizontal scroll */
  .bird-scroll { display:flex; gap:12px; padding:0 20px 8px; overflow-x:auto; scroll-snap-type:x mandatory; }
  .bird-scroll::-webkit-scrollbar { display:none; }
  .bird-card { flex:0 0 160px; border-radius:16px; overflow:hidden; background:#fff; box-shadow:0 4px 16px rgba(58,58,50,0.08); scroll-snap-align:start; cursor:none; transition:transform 0.3s; }
  .bird-card:active { transform:scale(0.97); }
  .bird-card-img { width:100%; height:120px; overflow:hidden; position:relative; }
  .bird-card-img img { width:100%; height:100%; object-fit:cover; transition:transform 0.5s; }
  .bird-card:hover .bird-card-img img { transform:scale(1.05); }
  .bird-card-rarity { position:absolute; top:8px; left:8px; padding:2px 6px; border-radius:4px; font-size:9px; font-weight:600; }
  .rarity-common { background:rgba(90,107,59,0.9); color:#fff; }
  .rarity-uncommon { background:rgba(210,105,30,0.9); color:#fff; }
  .rarity-rare { background:linear-gradient(135deg, #C9A227, #E8C84A); color:#fff; }
  .bird-card-body { padding:10px 12px 12px; }
  .bird-card-name { font-family:'Noto Serif SC', serif; font-size:14px; font-weight:700; color:#3A3A32; margin-bottom:2px; }
  .bird-card-latin { font-size:10px; color:#9A9A8A; font-style:italic; margin-bottom:6px; }
  .bird-card-meta { display:flex; align-items:center; justify-content:space-between; font-size:10px; color:#9A9A8A; }
  .bird-card-meta span { display:flex; align-items:center; gap:3px; }
  
  /* Community Feed */
  .feed-list { padding:0 20px; display:flex; flex-direction:column; gap:12px; }
  .feed-card { background:#fff; border-radius:16px; padding:14px; box-shadow:0 2px 12px rgba(58,58,50,0.05); }
  .feed-header { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .feed-avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg, #5A6B3B, #7A8B4B); display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:600; }
  .feed-user-info { flex:1; }
  .feed-username { font-size:13px; font-weight:600; color:#3A3A32; }
  .feed-time { font-size:11px; color:#9A9A8A; }
  .feed-location { display:flex; align-items:center; gap:3px; font-size:11px; color:#D2691E; margin-top:2px; }
  .feed-content { font-size:13px; color:#3A3A32; line-height:1.6; margin-bottom:10px; }
  .feed-tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .feed-tag { padding:3px 8px; background:rgba(90,107,59,0.1); color:#5A6B3B; border-radius:6px; font-size:10px; font-weight:500; }
  .feed-images { display:grid; grid-template-columns:repeat(3, 1fr); gap:4px; border-radius:10px; overflow:hidden; margin-bottom:10px; }
  .feed-images img { width:100%; aspect-ratio:1; object-fit:cover; }
  .feed-actions { display:flex; align-items:center; justify-content:space-around; padding-top:10px; border-top:1px solid rgba(58,58,50,0.06); }
  .feed-action { display:flex; align-items:center; gap:4px; font-size:12px; color:#9A9A8A; cursor:none; }
  .feed-action svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; }
  .feed-action.liked { color:#D2691E; }
  .feed-action.liked svg { fill:#D2691E; stroke:#D2691E; }
  
  /* Pull to refresh */
  .pull-refresh { position:sticky; top:-40px; height:40px; display:flex; align-items:center; justify-content:center; color:#5A6B3B; font-size:12px; transform:translateY(0); }
  .pull-refresh svg { width:16px; height:16px; margin-right:6px; }
  .pull-refresh.spinning svg { animation:spin 1s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg);} }
  
  /* ===== PAGE 2: BIRD GUIDE (图鉴) ===== */
  .guide-header { padding:100px 20px 16px; background:linear-gradient(180deg, #5A6B3B 0%, #6A7B4B 60%, #F4F1E8 100%); color:#fff; position:relative; overflow:hidden; }
  .guide-header::before { content:''; position:absolute; right:-40px; top:-20px; width:180px; height:180px; background:radial-gradient(circle, rgba(210,105,30,0.25), transparent 70%); border-radius:50%; }
  .guide-title { font-family:'Noto Serif SC', serif; font-size:26px; font-weight:900; margin-bottom:4px; position:relative; }
  .guide-subtitle { font-size:13px; opacity:0.85; position:relative; }
  .guide-stats { display:flex; gap:16px; margin-top:14px; position:relative; }
  .guide-stat { background:rgba(255,255,255,0.15); backdrop-filter:blur(8px); padding:8px 14px; border-radius:10px; }
  .guide-stat-num { font-family:'Noto Serif SC', serif; font-size:20px; font-weight:700; }
  .guide-stat-label { font-size:10px; opacity:0.8; }
  
  /* Sticky Category Tabs */
  .guide-tabs { position:sticky; top:88px; z-index:50; background:rgba(244,241,232,0.92); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); padding:10px 16px; display:flex; gap:8px; overflow-x:auto; border-bottom:1px solid rgba(58,58,50,0.06); }
  .guide-tabs::-webkit-scrollbar { display:none; }
  .guide-tab { flex-shrink:0; padding:7px 14px; border-radius:16px; background:rgba(90,107,59,0.08); color:#5A6B3B; font-size:12px; font-weight:500; transition:all 0.3s; cursor:none; }
  .guide-tab.active { background:#5A6B3B; color:#fff; }
  
  /* Bird Grid */
  .bird-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; padding:12px 16px; }
  .bird-grid-card { background:#fff; border-radius:14px; overflow:hidden; box-shadow:0 2px 10px rgba(58,58,50,0.06); cursor:none; position:relative; }
  .bird-grid-card:active { transform:scale(0.97); transition:transform 0.2s; }
  .bird-grid-img { width:100%; height:110px; overflow:hidden; position:relative; }
  .bird-grid-img img { width:100%; height:100%; object-fit:cover; }
  .bird-grid-info { padding:10px; }
  .bird-grid-name { font-family:'Noto Serif SC', serif; font-size:13px; font-weight:700; color:#3A3A32; margin-bottom:2px; }
  .bird-grid-latin { font-size:9px; color:#9A9A8A; font-style:italic; margin-bottom:6px; }
  .bird-grid-footer { display:flex; align-items:center; justify-content:space-between; }
  .bird-grid-status { font-size:9px; padding:2px 6px; border-radius:4px; }
  .status-lc { background:rgba(90,107,59,0.12); color:#5A6B3B; }
  .status-nt { background:rgba(210,105,30,0.12); color:#D2691E; }
  .status-vu { background:rgba(210,60,30,0.12); color:#C94C1E; }
  .bird-grid-count { font-size:10px; color:#9A9A8A; }
  
  /* ===== PAGE 3: MAP ===== */
  .map-page { background:#E8DDB5; }
  .map-container { position:relative; height:100%; min-height:700px; }
  .map-canvas { position:absolute; inset:0; background:
    radial-gradient(ellipse at 30% 40%, rgba(90,107,59,0.3), transparent 50%),
    radial-gradient(ellipse at 70% 60%, rgba(90,107,59,0.2), transparent 50%),
    linear-gradient(135deg, #D4D0B8, #C8C4A8);
  }
  .map-roads { position:absolute; inset:0; opacity:0.3; }
  .map-roads::before, .map-roads::after {
    content:''; position:absolute; background:#B0AC90;
  }
  .map-roads::before { top:45%; left:0; right:0; height:3px; border-radius:2px; }
  .map-roads::after { left:55%; top:0; bottom:0; width:3px; border-radius:2px; }
  .map-river { position:absolute; top:20%; left:10%; width:60%; height:60%; border:3px solid #7BA3B8; border-color:transparent #7BA3B8 transparent transparent; border-radius:50%; opacity:0.4; transform:rotate(-20deg); }
  .map-lake { position:absolute; bottom:20%; right:15%; width:80px; height:50px; background:#7BA3B8; border-radius:50%; opacity:0.5; }
  .map-park { position:absolute; top:25%; left:15%; width:100px; height:80px; background:rgba(90,107,59,0.4); border-radius:30% 70% 40% 60%; }
  
  /* Bird pins on map */
  .bird-pin { position:absolute; width:36px; height:44px; transform:translate(-50%, -100%); cursor:none; z-index:10; }
  .pin-marker { width:36px; height:44px; position:relative; }
  .pin-head { position:absolute; top:0; left:50%; transform:translateX(-50%); width:32px; height:32px; border-radius:50% 50% 50% 0; background:#D2691E; border:2px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,0.2); overflow:hidden; }
  .pin-head img { width:100%; height:100%; object-fit:cover; border-radius:50% 50% 50% 0; }
  .pin-pulse { position:absolute; top:0; left:50%; transform:translateX(-50%); width:32px; height:32px; border-radius:50%; background:rgba(210,105,30,0.4); animation:pinPulse 2s ease-out infinite; }
  @keyframes pinPulse {
    0% { transform:translateX(-50%) scale(0.8); opacity:1; }
    100% { transform:translateX(-50%) scale(2.2); opacity:0; }
  }
  
  .map-fab-left { position:absolute; left:16px; bottom:200px; display:flex; flex-direction:column; gap:10px; z-index:20; }
  .map-fab-btn { width:44px; height:44px; border-radius:14px; background:rgba(255,255,255,0.95); backdrop-filter:blur(12px); box-shadow:0 4px 16px rgba(58,58,50,0.15); display:flex; align-items:center; justify-content:center; cursor:none; }
  .map-fab-btn svg { width:20px; height:20px; stroke:#5A6B3B; fill:none; stroke-width:1.8; }
  
  /* Bottom sheet (spot info) */
  .bottom-sheet { position:absolute; left:0; right:0; bottom:0; background:#F4F1E8; border-radius:20px 20px 0 0; padding:20px 20px 30px; box-shadow:0 -4px 20px rgba(0,0,0,0.1); z-index:30; animation:sheetUp 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes sheetUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
  .sheet-handle { width:36px; height:4px; background:rgba(58,58,50,0.2); border-radius:2px; margin:0 auto 14px; }
  .sheet-title { font-family:'Noto Serif SC', serif; font-size:18px; font-weight:700; color:#3A3A32; margin-bottom:4px; }
  .sheet-meta { font-size:12px; color:#9A9A8A; margin-bottom:12px; display:flex; gap:12px; }
  .sheet-meta span { display:flex; align-items:center; gap:3px; }
  .sheet-birds { display:flex; gap:8px; margin-bottom:14px; }
  .sheet-bird-item { text-align:center; }
  .sheet-bird-item img { width:44px; height:44px; border-radius:50%; object-fit:cover; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
  .sheet-bird-item p { font-size:9px; color:#9A9A8A; margin-top:3px; }
  .sheet-btn { width:100%; height:44px; background:#5A6B3B; color:#fff; border:none; border-radius:22px; font-size:14px; font-weight:600; font-family:inherit; cursor:none; }
  
  /* ===== PAGE 4: BIRD DETAIL ===== */
  .detail-hero { position:relative; height:420px; }
  .detail-hero img { width:100%; height:100%; object-fit:cover; }

// ============ CUSTOM CURSOR (vanilla JS) ============
(function initCursor() {
  const cursor = document.createElement('div');
  cursor.className = 'custom-cursor';
  cursor.innerHTML = '<div class="cursor-outer"></div><div class="cursor-inner"></div>';
  document.getElementById('cursor-root').appendChild(cursor);
  
  let cx = window.innerWidth / 2;
  let cy = window.innerHeight / 2;
  let tx = cx, ty = cy;
  let rafId = null;
  let hidden = false;
  
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  
  function animateCursor() {
    if (reduceMotion) {
      cursor.style.left = tx + 'px';
      cursor.style.top = ty + 'px';
      rafId = null;
      return;
    }
    cx += (tx - cx) * 0.2;
    cy += (ty - cy) * 0.2;
    cursor.style.left = cx + 'px';
    cursor.style.top = ty + 'px';
    if (Math.abs(tx - cx) > 0.5 || Math.abs(ty - cy) > 0.5) {
      rafId = requestAnimationFrame(animateCursor);
    } else {
      rafId = null;
    }
  }
  
  function moveCursor(e) {
    tx = e.clientX;
    ty = e.clientY;
    if (hidden) {
      cursor.style.opacity = '1';
      hidden = false;
    }
    if (!rafId) rafId = requestAnimationFrame(animateCursor);
  }
  
  function handleClick(e) {
    const ripple = document.createElement('div');
    ripple.className = 'click-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    ripple.style.width = '20px';
    ripple.style.height = '20px';
    document.getElementById('cursor-root').appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  }
  
  function handleMouseOver(e) {
    const t = e.target;
    if (t.closest && t.closest('button, .tab-item, .bird-card, .bird-grid-card, .quick-action, .feed-action, .guide-tab, .map-fab-btn, .sheet-btn, .action-icon-btn, .action-main, .record-item, .menu-item, .list-item, .api-card-header, .cal-day, .fab, .nav-back, .swipe-btn')) {
      cursor.classList.add('hover');
    } else {
      cursor.classList.remove('hover');
    }
  }
  
  function handleVisibility() {
    if (document.hidden) {
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    } else {
      if (!rafId) rafId = requestAnimationFrame(animateCursor);
    }
  }
  
  document.addEventListener('mousemove', moveCursor);
  document.addEventListener('click', handleClick);
  document.addEventListener('mouseover', handleMouseOver);
  document.addEventListener('mouseleave', () => { cursor.style.opacity = '0'; hidden = true; });
  document.addEventListener('mouseenter', () => { cursor.style.opacity = '1'; hidden = false; });
  document.addEventListener('visibilitychange', handleVisibility);
  
  // Position center initially
  cursor.style.left = cx + 'px';
  cursor.style.top = cy + 'px';
})();

// ============ SOUND WAVE ANIMATION ============
function SoundWave({ playing }) {
  const barRefs = useRef([]);
  const rafRef = useRef(null);
  
  useEffect(() => {
    if (!playing) {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      barRefs.current.forEach(b => { if (b) { b.style.height = '30%'; b.classList.remove('active'); } });
      return;
    }
    
    function animate() {
      barRefs.current.forEach((b, i) => {
        if (!b) return;
        const h = 30 + Math.sin(Date.now() / 150 + i * 0.8) * 35 + Math.random() * 20;
        b.style.height = Math.min(100, Math.max(10, h)) + '%';
        b.classList.add('active');
      });
      rafRef.current = requestAnimationFrame(animate);
    }
    rafRef.current = requestAnimationFrame(animate);
    
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [playing]);
  
  const bars = Array.from({ length: 24 }, (_, i) => i);
  
  return (
    <div className="sound-bars">
      {bars.map(i => (
        <div
          key={i}
          className="sound-bar"
          ref={el => barRefs.current[i] = el}
          style={{ height: '30%' }}
        />
      ))}
    </div>
  );
}

// ============ MIGRATION TRAIL ============
function MigrationTrail() {
  const canvasRef = useRef(null);
  const progressRef = useRef(0);
  const rafRef = useRef(null);
  
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width = canvas.offsetWidth * 2;
    const h = canvas.height = canvas.offsetHeight * 2;
    ctx.scale(2, 2);
    const W = w / 2, H = h / 2;
    
    // S-curve migration path
    const points = [];
    for (let t = 0; t <= 1; t += 0.02) {
      const x = 20 + t * (W - 40);
      const y = H * 0.7 - Math.sin(t * Math.PI * 1.2) * H * 0.4;
      points.push([x, y]);
    }
    
    let startTime = null;
    function draw(ts) {
      if (!startTime) startTime = ts;
      const elapsed = ts - startTime;
      const progress = Math.min(1, elapsed / 3000);
      progressRef.current = progress;
      
      ctx.clearRect(0, 0, W, H);
      
      // Background path (dashed)
      ctx.strokeStyle = 'rgba(90, 107, 59, 0.2)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      points.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
      ctx.stroke();
      ctx.setLineDash([]);
      
      // Drawn path
      const drawIdx = Math.floor(progress * points.length);
      ctx.strokeStyle = '#D2691E';
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      points.slice(0, drawIdx + 1).forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
      ctx.stroke();
      
      // Glowing dot at head
      if (drawIdx < points.length) {
        const [hx, hy] = points[drawIdx];
        const gradient = ctx.createRadialGradient(hx, hy, 0, hx, hy, 12);
        gradient.addColorStop(0, 'rgba(210, 105, 30, 0.8)');
        gradient.addColorStop(1, 'rgba(210, 105, 30, 0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(hx, hy, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#D2691E';
        ctx.beginPath();
        ctx.arc(hx, hy, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      
      // Start/end markers
      ctx.fillStyle = '#5A6B3B';
      ctx.beginPath();
      ctx.arc(points[0][0], points[0][1], 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#C94C1E';
      ctx.beginPath();
      ctx.arc(points[points.length - 1][0], points[points.length - 1][1], 5, 0, Math.PI * 2);
      ctx.fill();
      
      if (progress < 1) {
        rafRef.current = requestAnimationFrame(draw);
      } else {
        // Loop after pause
        setTimeout(() => {
          startTime = null;
          rafRef.current = requestAnimationFrame(draw);
        }, 1500);
      }
    }
    
    rafRef.current = requestAnimationFrame(draw);
    
    const handleVis = () => {
      if (document.hidden && rafRef.current) {
        cancelAnimationFrame(rafRef.current);
        rafRef.current = null;
      } else if (!document.hidden && !rafRef.current) {
        startTime = null;
        rafRef.current = requestAnimationFrame(draw);
      }
    };
    document.addEventListener('visibilitychange', handleVis);
    
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      document.removeEventListener('visibilitychange', handleVis);
    };
  }, []);
  
  return (
    <div className="migration-vis">
      <canvas ref={canvasRef} style={{width:'100%',height:'100%',position:'absolute',inset:0}} />
      <div style={{position:'absolute',top:8,left:10,fontSize:10,color:'#9A9A8A',display:'flex',gap:10}}>
        <span style={{display:'flex',alignItems:'center',gap:3}}><span style={{width:6,height:6,borderRadius:'50%',background:'#5A6B3B'}}></span>繁殖地</span>
        <span style={{display:'flex',alignItems:'center',gap:3}}><span style={{width:6,height:6,borderRadius:'50%',background:'#C94C1E'}}></span>越冬地</span>
      </div>
    </div>
  );
}

// ============ RING PROGRESS ============
function RingProgress({ value, max, label }) {
  const ref = useRef(null);
  const pct = Math.min(1, value / max);
  const circumference = 2 * Math.PI * 42;
  const offset = circumference * (1 - pct);
  
  return (
    <div className="ring-canvas">
      <svg viewBox="0 0 100 100">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#5A6B3B" />
            <stop offset="100%" stopColor="#D2691E" />
          </linearGradient>
        </defs>
        <circle className="ring-bg" cx="50" cy="50" r="42" />
        <circle
          ref={ref}
          className="ring-progress"
          cx="50" cy="50" r="42"
          strokeDasharray={circumference}
          strokeDashoffset={circumference}
          style={{
            strokeDashoffset: offset,
            transition: 'stroke-dashoffset 1.5s cubic-bezier(0.22, 1, 0.36, 1)',
          }}
        />
      </svg>
      <div className="ring-text">
        <span className="ring-num">{value}</span>
        <span className="ring-label">{label}</span>
      </div>
    </div>
  );
}

// ============ PULL TO REFRESH ============
function usePullToRefresh(onRefresh) {
  const [pullDist, setPullDist] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const startY = useRef(0);
  const pulling = useRef(false);
  
  const handleTouchStart = useCallback((e) => {
    if (refreshing) return;
    const target = e.target;
    if (target.closest('.page') && target.closest('.page').scrollTop <= 0) {
      startY.current = e.touches[0].clientY;
      pulling.current = true;
    }
  }, [refreshing]);
  
  const handleTouchMove = useCallback((e) => {
    if (!pulling.current || refreshing) return;
    const dy = e.touches[0].clientY - startY.current;
    if (dy > 0) {
      const d = Math.min(dy * 0.5, 80);
      setPullDist(d);
    }
  }, [refreshing]);
  
  const handleTouchEnd = useCallback(() => {
    if (!pulling.current) return;
    pulling.current = false;
    if (pullDist > 60) {
      setRefreshing(true);
      setPullDist(40);
      onRefresh && onRefresh(() => {
        setRefreshing(false);
        setPullDist(0);
      });
    } else {
      setPullDist(0);
    }
  }, [pullDist, onRefresh]);
  
  return { pullDist, refreshing, handleTouchStart, handleTouchMove, handleTouchEnd };
}

function RecordPage({ onBack }) {
  const [currentMonth, setCurrentMonth] = useState({ year: 2026, month: 7 }); // Aug 2026
  const [swipedItem, setSwipedItem] = useState(null);
  
  const records = [
    { id:1, name:'普通翠鸟', latin:'Alcedo atthis', img:IMG.kingfisher, location:'奥森南园湿地', time:'今天 08:23', count:3, date:17 },
    { id:2, name:'戴胜', latin:'Upupa epops', img:IMG.hoopoe, location:'北京植物园', time:'昨天 16:45', count:1, date:16 },
    { id:3, name:'白头鹎', latin:'Pycnonotus sinensis', img:IMG.bulbul, location:'小区花园', time:'08-15 07:12', count:5, date:15 },
    { id:4, name:'灰喜鹊', latin:'Cyanopica cyanus', img:IMG.magpie, location:'学校操场', time:'08-14 09:30', count:8, date:14 },
    { id:5, name:'鸳鸯', latin:'Aix galericulata', img:IMG.mandarin, location:'圆明园', time:'08-12 14:20', count:6, date:12 },
  ];
  
  // Generate calendar
  const generateCal = () => {
    const { year, month } = currentMonth;
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrev = new Date(year, month, 0).getDate();
    
    const days = [];
    // Previous month
    for (let i = firstDay - 1; i >= 0; i--) {
      days.push({ day: daysInPrev - i, other: true, recorded: false });
    }
    // Current month
    for (let i = 1; i <= daysInMonth; i++) {
      const recorded = records.some(r => r.date === i);
      const many = records.some(r => r.date === i && r.count >= 5);
      days.push({ day: i, other: false, recorded, many, today: i === 17 && month === 7 });
    }
    // Next month
    const remaining = 42 - days.length;
    for (let i = 1; i <= remaining; i++) {
      days.push({ day: i, other: true, recorded: false });
    }
    return days;
  };
  
  const calDays = generateCal();
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const weekdayNames = ['日','一','二','三','四','五','六'];
  
  const prevMonth = () => setCurrentMonth(({year, month}) => month === 0 ? {year:year-1, month:11} : {year, month:month-1});
  const nextMonth = () => setCurrentMonth(({year, month}) => month === 11 ? {year:year+1, month:0} : {year, month:month+1});
  
  const handleSwipe = (id, dir) => {
    if (dir < -30) setSwipedItem(id);
    else if (dir > 30) setSwipedItem(null);
  };
  
  // Simple swipe detection
  const touchStart = useRef(0);
  const handleTouchStart = (e) => { touchStart.current = e.touches[0].clientX; };
  const handleTouchEnd = (e, id) => {
    const dx = e.changedTouches[0].clientX - touchStart.current;
    handleSwipe(id, dx);
  };
  
  return (
    <div className="page record-page">
      <div className="page-content">
        <StatusBar light />
        <CapsuleBtn dark onBack={onBack} />
        
        <div style={{position:'absolute',top:54,left:12,zIndex:100}} onClick={onBack}>
          <div className="nav-back" style={{background:'rgba(255,255,255,0.25)'}}>
            <Icon.ChevronLeft style={{width:18,height:18,stroke:'#fff',fill:'none',strokeWidth:2.5}} />
          </div>
        </div>
        
        <div className="record-header fade-in-up">
          <div className="record-title">观鸟打卡</div>
          <div className="record-subtitle">记录每一次与飞羽的邂逅</div>
          <div className="record-stats">
            <div className="record-stat">
              <div className="record-stat-num">42</div>
              <div className="record-stat-label">本月打卡</div>
            </div>
            <div className="record-stat">
              <div className="record-stat-num">18</div>
              <div className="record-stat-label">新增鸟种</div>
            </div>
            <div className="record-stat">
              <div className="record-stat-num">8</div>
              <div className="record-stat-label">连续天数</div>
            </div>
          </div>
        </div>
        
        {/* Calendar */}
        <div className="record-calendar fade-in-up delay-1">
          <div className="cal-header">
            <div className="cal-title">{currentMonth.year} 年 {monthNames[currentMonth.month]}</div>
            <div className="cal-nav">
              <div className="cal-nav-btn" onClick={prevMonth}>
                <Icon.ChevronLeft />
              </div>
              <div className="cal-nav-btn" onClick={nextMonth}>
                <Icon.ChevronRight />
              </div>
            </div>
          </div>
          <div className="cal-weekdays">
            {weekdayNames.map(d => <div key={d} className="cal-weekday">{d}</div>)}
          </div>
          <div className="cal-days">
            {calDays.map((d, i) => (
              <div
                key={i}
                className={`cal-day ${d.other ? 'other' : ''} ${d.today ? 'today' : ''} ${d.recorded ? 'recorded' : ''} ${d.many ? 'recorded-many' : ''}`}
              >
                {d.day}
              </div>
            ))}
          </div>
        </div>
        
        {/* Recent records */}
        <div className="recent-records fade-in-up delay-2">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
            <span style={{fontFamily:'Noto Serif SC, serif',fontSize:15,fontWeight:700,color:'#3A3A32'}}>近期记录</span>
            <span style={{fontSize:12,color:'#9A9A8A'}}>共 {records.length} 条</span>
          </div>
          
          {records.map((r, i) => (
            <div
              key={r.id}
              className="record-item"
              style={{ overflow: 'hidden' }}
              onTouchStart={handleTouchStart}
              onTouchEnd={(e) => handleTouchEnd(e, r.id)}
            >
              <div style={{
                transform: swipedItem === r.id ? 'translateX(-100px)' : 'translateX(0)',
                transition: 'transform 0.3s cubic-bezier(0.22, 1, 0.36, 1)',
                display:'flex', gap:12, width:'100%',
              }}>
                <div className="record-item-img">
                  <img src={r.img} alt={r.name} />
                </div>
                <div className="record-item-info">
                  <div className="record-item-name">{r.name}</div>
                  <div style={{fontSize:10,color:'#9A9A8A',fontStyle:'italic',marginBottom:3}}>{r.latin}</div>
                  <div className="record-item-meta">
                    <span><Icon.Location style={{width:10,height:10,stroke:'currentColor',fill:'none',strokeWidth:2}} /> {r.location}</span>
                    <span><Icon.Calendar style={{width:10,height:10,stroke:'currentColor',fill:'none',strokeWidth:2}} /> {r.time}</span>
                  </div>
                </div>
                <div className="record-item-count">×{r.count}</div>
              </div>
              <div className="record-swipe-actions" style={{right: swipedItem === r.id ? 10 : -100, transition:'right 0.3s cubic-bezier(0.22, 1, 0.36, 1)'}}>
                <div className="swipe-btn edit"><Icon.Edit /></div>
                <div className="swipe-btn delete"><Icon.Trash /></div>
              </div>
            </div>
          ))}
        </div>
        
        <div style={{height:20}}></div>
      </div>
    </div>
  );
}

// ============ SOUND RECOGNITION PAGE ============
function SoundPage({ onBack, onResult }) {
  const [recording, setRecording] = useState(false);
  const [progress, setProgress] = useState(0);
  const barRefs = useRef([]);
  const rafRef = useRef(null);
  const timerRef = useRef(null);
  
  const startRecord = () => {
    setRecording(true);
    setProgress(0);
    
    // Sound wave animation
    function animate() {
      barRefs.current.forEach((b, i) => {
        if (!b) return;
        const h = 20 + Math.abs(Math.sin(Date.now() / 120 + i * 0.6)) * 60 + Math.random() * 20;
        b.style.height = Math.min(100, h) + '%';
        b.style.background = `hsl(${30 + i * 2}, 70%, ${50 + Math.random() * 10}%)`;
      });
      rafRef.current = requestAnimationFrame(animate);
    }
    rafRef.current = requestAnimationFrame(animate);
    
    // Progress timer
    timerRef.current = setInterval(() => {
      setProgress(p => {
        if (p >= 100) {
          clearInterval(timerRef.current);
          cancelAnimationFrame(rafRef.current);
          setRecording(false);
          setTimeout(() => onResult && onResult(BIRDS[0]), 500);
          return 100;
        }
        return p + 2;
      });
    }, 100);
  };
  
  useEffect(() => {
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      if (timerRef.current) clearInterval(timerRef.current);
    };
  }, []);
  
  const bars = Array.from({ length: 32 }, (_, i) => i);
  
  return (
    <div className="page" style={{background:'linear-gradient(180deg, #3A3A32 0%, #5A6B3B 100%)'}}>
      <div className="page-content">
        <StatusBar light />
        <CapsuleBtn dark onBack={onBack} />
        
        <div style={{position:'absolute',top:54,left:12,zIndex:100}} onClick={onBack}>
          <div className="nav-back" style={{background:'rgba(255,255,255,0.2)'}}>
            <Icon.ChevronLeft style={{width:18,height:18,stroke:'#fff',fill:'none',strokeWidth:2.5}} />
          </div>
        </div>
        
        <div style={{padding:'140px 20px 0', textAlign:'center', color:'#fff'}}>
          <div className="fade-in-up" style={{fontFamily:'Noto Serif SC, serif',fontSize:24,fontWeight:900,marginBottom:6}}>鸟声识别</div>
          <div className="fade-in-up delay-1" style={{fontSize:13,opacity:0.8,marginBottom:40}}>
            {recording ? '正在聆听…' : '点击麦克风，录制 5 秒鸟鸣'}
          </div>
          
          {/* Waveform */}
          <div style={{height:120,display:'flex',alignItems:'center',gap:2,marginBottom:40}} className="fade-in-up delay-2">
            {bars.map(i => (
              <div
                key={i}
                ref={el => barRefs.current[i] = el}
                style={{
                  flex:1,
                  height: recording ? '50%' : '20%',
                  background: recording ? '#D2691E' : 'rgba(255,255,255,0.2)',
                  borderRadius: 2,
                  transition: recording ? 'none' : 'height 0.3s, background 0.3s',
                }}
              />
            ))}
          </div>
          
          {/* Record button */}
          <div
            style={{
              width:100, height:100, borderRadius:'50%',
              background: recording
                ? 'radial-gradient(circle, #C94C1E, #8B2E0E)'
                : 'radial-gradient(circle, #D2691E, #A05018)',
              margin:'0 auto 30px',
              display:'flex',alignItems:'center',justifyContent:'center',
              boxShadow: recording

            )}

// ============ MAIN APP ============
function App() {
  const [tab, setTab] = useState('home');
  const [stack, setStack] = useState([]); // pages pushed on top
  const [birdDetail, setBirdDetail] = useState(null);
  const [actionSheet, setActionSheet] = useState(null);
  const [toast, setToast] = useState(null);
  
  // Navigate to a sub-page (push on stack)
  const pushPage = (key, data = null) => {
    setStack(s => [...s, { key, data }]);
  };
  
  const popPage = () => {
    if (stack.length > 0) {
      setStack(s => s.slice(0, -1));
    }
  };
  
  const openBirdDetail = (bird) => {
    setBirdDetail(bird);
    pushPage('detail', bird);
  };
  
  const handleTabChange = (newTab) => {
    setTab(newTab);
    setStack([]);
    setBirdDetail(null);
  };
  
  const handleNavigate = (target) => {
    if (target === 'sound') pushPage('sound');
    else if (target === 'record') pushPage('record');
    else if (target === 'spec') pushPage('spec');
    else if (target === 'api') pushPage('api');
    else if (target === 'map') { setTab('map'); setStack([]); }
  };
  
  const handleMore = () => {
    setActionSheet({
      title: '更多操作',
      items: [
        { label: '分享给朋友' },
        { label: '分享到朋友圈' },
        { label: '收藏' },
        { label: '举报', danger: true },
      ]
    });
  };
  
  const handleActionSelect = (item) => {
    setToast(item.label + '成功');
  };
  
  // Render current tab page
  const renderTabPage = () => {
    switch (tab) {
      case 'home': return <HomePage onBirdClick={openBirdDetail} onNavigate={handleNavigate} />;
      case 'guide': return <GuidePage onBirdClick={openBirdDetail} />;
      case 'map': return <MapPage onBirdClick={openBirdDetail} />;
      case 'me': return <ProfilePage onNavigate={handleNavigate} />;
      default: return null;
    }
  };
  
  // Render top of stack
  const renderStackPage = (page, idx) => {
    const isTop = idx === stack.length - 1;
    switch (page.key) {
      case 'detail':
        return <BirdDetailPage key={idx} bird={page.data} onBack={popPage} />;
      case 'record':
        return <RecordPage key={idx} onBack={popPage} />;
      case 'spec':
        return <SpecPage key={idx} onBack={popPage} />;
      case 'api':
        return <ApiPage key={idx} onBack={popPage} />;
      case 'sound':
        return <SoundPage key={idx} onBack={popPage} onResult={(bird) => { setStack(s=>s.slice(0,-1)); openBirdDetail(bird); }} />;
      default:
        return null;
    }
  };
  
  return (
    <div className="app-container">
      {/* Base tab page */}
      <div className="page-stack">
        {renderTabPage()}
      </div>
      
      {/* Stacked pages */}
      {stack.map((page, idx) => (
        <div key={idx} className="page-slide entering" style={{zIndex: 50 + idx}}>
          {renderStackPage(page, idx)}
        </div>
      ))}
      
      {/* Tab bar (only when stack is empty) */}
      {stack.length === 0 && (
        <TabBar active={tab} onChange={handleTabChange} />
      )}
      
      {/* Action Sheet */}
      {actionSheet && (
        <ActionSheet
          title={actionSheet.title}
          items={actionSheet.items}
          onSelect={handleActionSelect}
          onClose={() => setActionSheet(null)}
        />
      )}
      
      {/* Toast */}
      {toast && <Toast message={toast} onDone={() => setToast(null)} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// Announce upgrade
function announceUpgrade() {
  try {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  } catch(e) {}
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}
</script>
</body>
</html>

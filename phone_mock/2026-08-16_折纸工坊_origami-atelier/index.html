<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; }
    body {
      background: #1a1714;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    
    /* ── Paper texture background for showcase ── */
    .showcase-bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(212, 92, 62, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(139, 149, 109, 0.06) 0%, transparent 50%),
        linear-gradient(180deg, #2a2520 0%, #1a1714 100%);
      z-index: 0;
    }
    
    .phone-wrapper {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    
    .app-title {
      color: #F5EDE0;
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: 2px;
      opacity: 0.8;
    }
    
    .app-subtitle {
      color: #8B956D;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.7;
    }
    
    /* ── Custom cursor ── */
    .custom-cursor {
      position: fixed;
      width: 24px;
      height: 24px;
      border: 2px solid #fff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.2s ease, height 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      mix-blend-mode: difference;
      box-shadow:
        0 0 8px rgba(255,255,255,0.4),
        0 0 20px rgba(212, 92, 62, 0.3),
        inset 0 0 4px rgba(255,255,255,0.2);
    }
    .custom-cursor::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 5px;
      height: 5px;
      background: #D45C3E;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s, background 0.2s;
    }
    .custom-cursor.hovering {
      width: 44px;
      height: 44px;
      border-color: #D45C3E;
      mix-blend-mode: normal;
      background: rgba(212, 92, 62, 0.1);
      box-shadow:
        0 0 12px rgba(212, 92, 62, 0.5),
        0 0 30px rgba(212, 92, 62, 0.2);
    }
    .custom-cursor.hovering::before {
      width: 3px;
      height: 3px;
      background: #D45C3E;
    }
    .custom-cursor.clicking {
      animation: cursorRipple 0.4s ease-out;
    }
    @keyframes cursorRipple {
      0% { box-shadow: 0 0 0 0 rgba(212,92,62,0.4), 0 0 8px rgba(255,255,255,0.4), 0 0 20px rgba(212, 92, 62, 0.3); }
      50% { box-shadow: 0 0 0 12px rgba(212,92,62,0), 0 0 16px rgba(255,255,255,0.6), 0 0 40px rgba(212, 92, 62, 0.5); }
      100% { box-shadow: 0 0 0 0 rgba(212,92,62,0), 0 0 8px rgba(255,255,255,0.4), 0 0 20px rgba(212, 92, 62, 0.3); }
    }
    
    .cursor-click-ripple {
      position: fixed;
      width: 0;
      height: 0;
      border: 1.5px solid #D45C3E;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      animation: rippleExpand 0.6s ease-out forwards;
    }
    @keyframes rippleExpand {
      0% { width: 0; height: 0; opacity: 0.8; }
      100% { width: 80px; height: 80px; opacity: 0; }
    }
    
    /* Floating paper particles */
    .paper-particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .paper-flake {
      position: absolute;
      width: 8px;
      height: 8px;
      background: rgba(245, 237, 224, 0.3);
      transform-origin: center;
      animation: flakeFloat linear infinite;
    }
    @keyframes flakeFloat {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.4; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }
    
    /* ── Entrance animation overlay (paper crane) ── */
    .entrance-overlay {
      position: fixed;
      inset: 0;
      background: #F5EDE0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: entranceFade 1.8s ease-out forwards;
      animation-delay: 2s;
    }
    @keyframes entranceFade {
      0% { opacity: 1; }
      100% { opacity: 0; pointer-events: none; }
    }
    .entrance-crane {
      width: 80px;
      height: 80px;
      animation: craneFold 2s ease-in-out forwards;
    }
    @keyframes craneFold {
      0% { transform: scale(0.3) rotate(-30deg); opacity: 0; }
      30% { transform: scale(1.2) rotate(10deg); opacity: 1; }
      60% { transform: scale(1) rotate(0deg); opacity: 1; }
      100% { transform: scale(0.8) rotate(-5deg) translateY(-20px); opacity: 0; }
    }
    
    /* ── Page transition ── */
    .page-transition {
      animation: pageFoldIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes pageFoldIn {
      0% { transform: perspective(1000px) rotateY(-15deg) translateX(30px); opacity: 0; }
      100% { transform: perspective(1000px) rotateY(0) translateX(0); opacity: 1; }
    }
    
    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 0; height: 0; }
    
    /* ── Responsive ── */
    @media (max-width: 768px) {
      body { padding: 20px 0; }
    }
    
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .custom-cursor { display: none; }
    }
  </style>
</head>

  // ─── UTILITY: Animated Number Counter ───
  function useCountUp(target, duration = 1500, start = 0) {
    const [val, setVal] = useState(start);
    const rafRef = useRef(null);
    const startTimeRef = useRef(null);
    
    useEffect(() => {
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReduced) { setVal(target); return; }
      
      startTimeRef.current = null;
      const startVal = val;
      const diff = target - startVal;
      
      const step = (ts) => {
        if (!startTimeRef.current) startTimeRef.current = ts;
        const progress = Math.min((ts - startTimeRef.current) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        setVal(Math.round(startVal + diff * eased));
        if (progress < 1) rafRef.current = requestAnimationFrame(step);
      };
      rafRef.current = requestAnimationFrame(step);
      return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
    }, [target, duration]);
    
    return val;
  }

  // ─── UTILITY: Intersection Observer hook for scroll animations ───
  function useInView(ref, threshold = 0.1) {
    const [inView, setInView] = useState(false);
    useEffect(() => {
      const el = ref.current;
      if (!el) return;
      const io = new IntersectionObserver(([entry]) => {
        if (entry.isIntersecting) { setInView(true); io.disconnect(); }
      }, { threshold });
      io.observe(el);
      return () => io.disconnect();
    }, [ref, threshold]);
    return inView;
  }

  function TutorialPage() {
    const [step, setStep] = useState(0);

    const handleNext = () => {

      setCompleted(newCompleted);
      if (step < tutorialSteps.length - 1) {

    const handlePrev = () => {

    const currentStep = tutorialSteps[step];

  function PaperCard({ paper, selected, onClick, index }) {
    const cardRef = useRef(null);
    const ref = useRef(null);
    const inView = useInView(ref, 0.1);
    
    const handleMove = (e) => {
      const card = cardRef.current;
      if (!card) return;
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const rotateY = ((x / rect.width) - 0.5) * 12;
      const rotateX = ((y / rect.height) - 0.5) * -12;
      card.style.transform = `perspective(600px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-4px) scale(1.03)`;
    };
    
    const handleLeave = () => {
      const card = cardRef.current;
      if (!card) return;
      card.style.transform = 'perspective(600px) rotateX(0) rotateY(0) translateY(0) scale(1)';
    };
    
    return (
      <div
        ref={ref}
        onClick={onClick}
        onMouseMove={handleMove}
        onMouseLeave={handleLeave}
        style={{
          ...styles.materials.paperCard,
          borderColor: selected ? TOKENS.color.coral : TOKENS.color.paperDark,
          boxShadow: selected ? `0 8px 24px rgba(212,92,62,0.25)` : TOKENS.shadow.sm,
          opacity: inView ? 1 : 0,
          transform: inView ? 'translateY(0)' : 'translateY(30px)',
          transition: `opacity 0.5s ease ${index * 0.08}s, transform 0.5s ease ${index * 0.08}s, border-color 0.3s, box-shadow 0.3s`,
        }}
        ref={cardRef}
      >
        <div style={{
          ...styles.materials.paperSwatch,
          background: paper.color,
        }}>
          {/* Paper texture pattern */}
          <svg width="100%" height="100%" style={{ opacity: 0.08 }}>
            <pattern id={`p${paper.id}`} patternUnits="userSpaceOnUse" width="8" height="8">
              <path d="M0 4h8M4 0v8" stroke={paper.id === 1 ? '#000' : '#fff'} strokeWidth="0.3" />
            </pattern>
            <rect width="100%" height="100%" fill={`url(#p${paper.id})`} />
          </svg>
        </div>
        <div style={styles.materials.paperInfo}>
          <div style={styles.materials.paperName}>{paper.name}</div>
          <div style={styles.materials.paperPrice}>{paper.price}</div>
        </div>
        {selected && (
          <div style={styles.materials.paperCheck}>
            <Icon.Check size={12} color="#fff" />
          </div>
        )}
      </div>
    );
  }

                <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill="#000"/>
                <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill="#000"/>
                <circle cx="8.5" cy="10.5" r="1.5" fill="#000"/>
              </svg>
              <svg width="27" height="13" viewBox="0 0 27 13">
                <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="#000" strokeOpacity="0.35" fill="none"/>
                <rect x="2" y="2" width="20" height="9" rx="2" fill="#000"/>
                <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill="#000" fillOpacity="0.4"/>
              </svg>
            </div>
          </div>
        </div>
        
        {/* Top page menu pill for spec/api pages */}
        {specPages.includes(currentPage) && (
          <div style={{
            position: 'absolute', top: 58, right: 16,
            zIndex: 15,
            display: 'flex',
            gap: 4,
            background: 'rgba(255,255,255,0.8)',
            backdropFilter: 'blur(8px)',
            padding: 4,
            borderRadius: TOKENS.radius.full,
            boxShadow: TOKENS.shadow.sm,
          }}>
            <button onClick={() => handleNavigate('design')} style={{
              padding: '6px 12px',
              border: 'none',
              borderRadius: TOKENS.radius.full,
              background: currentPage === 'design' ? TOKENS.color.coral : 'transparent',
              color: currentPage === 'design' ? '#fff' : TOKENS.color.ink,
              fontFamily: TOKENS.font.body,
              fontSize: 11,
              fontWeight: 500,
              cursor: 'pointer',
            }}>
              <Icon.Palette size={12} /> Design
            </button>
            <button onClick={() => handleNavigate('api')} style={{
              padding: '6px 12px',
              border: 'none',
              borderRadius: TOKENS.radius.full,
              background: currentPage === 'api' ? TOKENS.color.ink : 'transparent',
              color: currentPage === 'api' ? TOKENS.color.washi : TOKENS.color.ink,
              fontFamily: TOKENS.font.body,
              fontSize: 11,
              fontWeight: 500,
              cursor: 'pointer',
            }}>
              <Icon.Code size={12} /> API
            </button>
          </div>
        )}
        
        {/* Page content with safe area */}
        <div style={{
          position: 'absolute',
          top: 0,
          left: 0,
          right: 0,
          bottom: 0,
          paddingTop: 62,
          paddingBottom: showNav ? 0 : 34,
        }}>
          <div key={pageKey} className="page-transition" style={{ height: '100%' }}>
            {renderPage()}
          </div>
        </div>
        
        {/* Bottom Navigation (only for main pages) */}
        {showNav && <BottomNav currentPage={currentPage} onNavigate={handleNavigate} />}
        
        {/* FAB */}
        {showNav && (
          <FAB onClick={() => handleNavigate('design')} />
        )}
        
        {/* Home indicator */}
        <div style={{
          position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
          height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
          paddingBottom: 8, pointerEvents: 'none',
        }}>
          <div style={{
            width: 139, height: 5, borderRadius: 100,
            background: 'rgba(0,0,0,0.25)',
          }} />
        </div>
      </div>
    );
  }

  // ─── RENDER ───
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);

  // ─── CUSTOM CURSOR (imperative, no React setState for mousemove) ───
  (function initCustomCursor() {
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReduced) return;
    
    const cursor = document.getElementById('customCursor');
    if (!cursor) return;
    
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let cursorX = mouseX;
    let cursorY = mouseY;
    let rafId = null;
    let isVisible = true;
    
    // Initialize at center
    cursor.style.left = mouseX + 'px';
    cursor.style.top = mouseY + 'px';
    
    const lerp = (start, end, factor) => start + (end - start) * factor;
    
    const animate = () => {
      if (!isVisible) { rafId = requestAnimationFrame(animate); return; }
      cursorX = lerp(cursorX, mouseX, 0.18);
      cursorY = lerp(cursorY, mouseY, 0.18);
      cursor.style.left = cursorX + 'px';
      cursor.style.top = cursorY + 'px';
      rafId = requestAnimationFrame(animate);
    };
    
    rafId = requestAnimationFrame(animate);
    
    const handleMove = (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    };
    
    const handleOver = (e) => {
      const target = e.target;
      if (target.closest && (
        target.closest('button') ||
        target.closest('a') ||
        target.closest('[role="button"]') ||
        target.tagName === 'BUTTON' ||
        target.style.cursor === 'pointer' ||
        target.closest('[style*="cursor: pointer"]')
      )) {
        cursor.classList.add('hovering');
      } else {
        cursor.classList.remove('hovering');
      }
    };
    
    const handleClick = (e) => {
      cursor.classList.add('clicking');
      setTimeout(() => cursor.classList.remove('clicking'), 400);
      
      // Ripple
      const ripple = document.createElement('div');
      ripple.className = 'cursor-click-ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    };
    
    const handleVisibility = () => {
      if (document.hidden) {
        isVisible = false;
        if (rafId) cancelAnimationFrame(rafId);
      } else {
        isVisible = true;
        if (!rafId) rafId = requestAnimationFrame(animate);
      }
    };
    
    window.addEventListener('mousemove', handleMove, { passive: true });
    window.addEventListener('mouseover', handleOver, { passive: true });
    window.addEventListener('click', handleClick, { passive: true });
    document.addEventListener('visibilitychange', handleVisibility);
    
    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      if (rafId) cancelAnimationFrame(rafId);
      window.removeEventListener('mousemove', handleMove);
      window.removeEventListener('mouseover', handleOver);
      window.removeEventListener('click', handleClick);
      document.removeEventListener('visibilitychange', handleVisibility);
    });
  })();

  // ─── PAPER PARTICLES ───
  (function initPaperParticles() {
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReduced) return;
    
    const container = document.getElementById('paperParticles');
    if (!container) return;
    
    let rafId = null;
    let isVisible = true;
    const flakes = [];
    const FLAKE_COUNT = 18;
    
    // Create flakes
    for (let i = 0; i < FLAKE_COUNT; i++) {
      const flake = document.createElement('div');
      flake.className = 'paper-flake';
      const size = 4 + Math.random() * 8;
      flake.style.width = size + 'px';
      flake.style.height = size + 'px';
      flake.style.left = Math.random() * 100 + '%';
      flake.style.top = -20 + 'px';
      const duration = 12 + Math.random() * 18;
      flake.style.animationDuration = duration + 's';
      flake.style.animationDelay = (-Math.random() * duration) + 's';
      flake.style.opacity = 0.15 + Math.random() * 0.25;
      flake.style.borderRadius = Math.random() > 0.5 ? '2px' : '50%';
      // Random color variations
      const colors = ['#F5EDE0', '#E8DDCC', '#D45C3E', '#D4A74A', '#8B956D'];
      flake.style.background = colors[Math.floor(Math.random() * colors.length)];
      flake.style.opacity = 0.1 + Math.random() * 0.15;
      container.appendChild(flake);
      flakes.push({ el: flake, speed: 0.3 + Math.random() * 0.7, drift: (Math.random() - 0.5) * 0.3, y: Math.random() * window.innerHeight, x: Math.random() * window.innerWidth });
    }
    
    // Update visibility to pause/resume
    const handleVisibility = () => {
      if (document.hidden) {
        isVisible = false;
      } else {
        isVisible = true;
      }
    };
    
    document.addEventListener('visibilitychange', handleVisibility);
    
    window.addEventListener('beforeunload', () => {
      document.removeEventListener('visibilitychange', handleVisibility);
    });
  })();

  // ─── ENTRANCE OVERLAY cleanup ───
  (function removeEntranceOverlay() {
    const overlay = document.getElementById('entranceOverlay');
    if (!overlay) return;
    setTimeout(() => {
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
    }, 4000);
  })();

  // ─── UPGRADE ANNOUNCEMENT ───
  function announceUpgrade() {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  }
  announceUpgrade();
  if (document.readyState !== 'complete') window.addEventListener('load', announceUpgrade, { once: true });
  </script>
</body>

// ============ 蒸汽粒子 ============
const SteamParticles = ({ count = 3 }) => {
  const particles = useMemo(() =>
    Array.from({ length: count }, (_, i) => ({
      id: i,
      delay: (i * 0.6) + 's',
      dx: (Math.random() - 0.5) * 20,
      dur: 2.5 + Math.random() * 1.2,
      size: 6 + Math.random() * 6,
    })), [count]
  );
  return (
    <div className="steam-wrap" style={{ left: '50%', top: -10 }}>
      {particles.map(p => (
        <div key={p.id} className="steam-particle" style={{
          left: `calc(50% + ${p.dx * 0.3}px)`,
          width: p.size, height: p.size,
          animation: `steamRise ${p.dur}s ease-out infinite`,
          animationDelay: p.delay,
          '--dx': p.dx + 'px',
        }} />
      ))}
    </div>
  );
};

      setNavStack(prev => prev.slice(0, -1));
    }
  }, [navStack.length]);

  const switchTab = useCallback((tab: string) => {
    setActiveTab(tab);
    setDirection('forward');
    setNavStack([{ id: tab, data: null }]);
  }, []);

  const showToast = useCallback((msg: string) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2200);
  }, []);

  const theme = {
    matcha: t.matcha, rice: t.rice, urushi: t.urushi, kaki: t.kaki,
    matchaLight: '#A8B89A', matchaDark: '#4E5E3F',
    riceDark: '#E8E1CE',
  };

  const ctx = { theme, navigate, goBack, showToast, setSheet, switchTab, activeTab };

  const renderScreen = () => {
    const screen = currentScreen;
    const isNew = direction === 'forward';
    const cls = isNew ? 'page-enter' : '';

    switch (screen.id) {
      case 'home': return <HomeScreen key="home" ctx={ctx} />;
      case 'teaDetail': return <TeaDetailScreen key={screen.id} ctx={ctx} data={screen.data} />;
      case 'reserve': return <ReserveScreen key="reserve" ctx={ctx} />;
      case 'reserveSeat': return <ReserveSeatScreen key={screen.id} ctx={ctx} data={screen.data} />;
      case 'storage': return <StorageScreen key="storage" ctx={ctx} />;
      case 'teawareDetail': return <TeawareDetailScreen key={screen.id} ctx={ctx} data={screen.data} />;
      case 'events': return <EventsScreen key="events" ctx={ctx} />;
      case 'eventDetail': return <EventDetailScreen key={screen.id} ctx={ctx} data={screen.data} />;
      case 'me': return <MeScreen key="me" ctx={ctx} />;
      case 'specs': return <SpecsScreen key="specs" ctx={ctx} />;
      case 'api': return <ApiScreen key="api" ctx={ctx} />;
      default: return <HomeScreen key="home" ctx={ctx} />;
    }
  };

  return (
    <div className="phone-wrap">
      <div className="app-label">喫茶去 · KISSA</div>
      <IOSDevice width={390} height={844}>
        <div style={{ width: '100%', height: '100%', position: 'relative', overflow: 'hidden', background: theme.rice }}>
          <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column' }}>
            <div style={{ flex: 1, position: 'relative', overflow: 'hidden' }}>
              {renderScreen()}
            </div>
            {/* Tab Bar */}
            {currentScreen.id !== 'specs' && currentScreen.id !== 'api' && (
              <TabBar active={activeTab} onSwitch={switchTab} theme={theme} style={t.tabStyle} />
            )}
          </div>

          {/* 底部抽屉 */}
          {sheet === 'menu' && <MenuSheet theme={theme} onClose={() => setSheet(null)} ctx={ctx} />}

          {/* Toast */}
          {toast && (
            <div style={{
              position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%, -50%)',
              background: 'rgba(28,26,23,0.88)', color: '#F5F0E4', padding: '12px 20px', borderRadius: 12,
              fontSize: 14, zIndex: 100, backdropFilter: 'blur(10px)', pointerEvents: 'none',
              animation: 'fadeIn 200ms ease',
            }}>{toast}</div>
          )}
        </div>
      </IOSDevice>

      <TweaksPanel>
        <TweakSection label="配色" />
        <TweakColor label="抹茶绿" value={t.matcha}
          options={['#6B7F59', '#4E5E3F', '#8BA888', '#5A7247']}
          onChange={(v) => setTweak('matcha', v)} />
        <TweakColor label="柿红" value={t.kaki}
          options={['#C6563A', '#A34028', '#E07A5F', '#8B3A28']}
          onChange={(v) => setTweak('kaki', v)} />
        <TweakColor label="宣纸米" value={t.rice}
          options={['#F5F0E4', '#EDE7D8', '#F8F4E8', '#E8E1CE']}
          onChange={(v) => setTweak('rice', v)} />
        <TweakSection label="排版" />
        <TweakSlider label="字号" value={t.fontScale} min={0.85} max={1.2} step={0.05} unit="x"
          onChange={(v) => setTweak('fontScale', v)} />
        <TweakRadio label="TabBar 样式" value={t.tabStyle}
          options={['glass', 'solid', 'dark']}
          onChange={(v) => setTweak('tabStyle', v)} />
      </TweaksPanel>
    </div>
  );
}

// ============ TabBar ============
function TabBar({ active, onSwitch, theme, style }) {
  const [bounceKey, setBounceKey] = useState('');
  const handleSwitch = (id: string) => {
    if (id !== active) {
      setBounceKey(id);
      onSwitch(id);
      setTimeout(() => setBounceKey(''), 400);
    }
  };
  const tabs = [
    { id: 'home', label: '茶單', icon: 'cup' },
    { id: 'reserve', label: '予約', icon: 'calendar' },
    { id: 'storage', label: '茶倉', icon: 'storage' },
    { id: 'events', label: '茶会', icon: 'events' },
    { id: 'me', label: '我的', icon: 'user' },
  ];

  const bgStyle = style === 'glass'
    ? { background: 'rgba(245,240,228,0.72)', backdropFilter: 'blur(20px)', borderTop: '1px solid rgba(107,127,89,0.12)' }
    : style === 'dark'
    ? { background: theme.urushi, borderTop: 'none' }
    : { background: theme.rice, borderTop: '1px solid rgba(107,127,89,0.15)' };

  const activeColor = style === 'dark' ? theme.matchaLight : theme.matcha;
  const inactiveColor = style === 'dark' ? 'rgba(245,240,228,0.5)' : 'rgba(28,26,23,0.35)';

  return (
    <div style={{
      position: 'relative', ...bgStyle,
      paddingBottom: 'var(--ios-safe-bottom, 34px)',
    }}>
      <div style={{ display: 'flex', height: 56, alignItems: 'center', justifyContent: 'space-around' }}>
        {tabs.map(tab => {
          const isActive = active === tab.id;
          const isBounce = bounceKey === tab.id;
          return (
            <button key={tab.id} onClick={() => handleSwitch(tab.id)}
              style={{
                flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
                gap: 3, background: 'none', border: 'none', padding: 0, cursor: 'pointer',
              }}>
              <div className={isBounce ? 'tab-bounce' : ''}>
                <Icon name={tab.icon} size={22} color={isActive ? activeColor : inactiveColor} stroke={isActive ? 2.2 : 1.8} />
              </div>
              <span style={{
                fontSize: 10, fontWeight: isActive ? 600 : 400,
                color: isActive ? activeColor : inactiveColor, letterSpacing: 0.3,
              }}>{tab.label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ============ 预约页 ============
function ReserveScreen({ ctx }) {
  const { theme, navigate } = ctx;
  const [calendarOpen, setCalendarOpen] = useState(true);
  const [selectedDate, setSelectedDate] = useState(new Date().getDate() + 2);
  const [selectedSeat, setSelectedSeat] = useState(null);

  const today = new Date();
  const month = today.getMonth();
  const year = today.getFullYear();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const weekdays = ['日', '一', '二', '三', '四', '五', '六'];

  return (
    <div className="scroll" style={{ height: '100%', background: theme.rice, position: 'relative' }}>
      {/* 顶部大标题 */}
      <div className="safe-top" style={{ padding: '16px 20px 20px' }}>
        <div style={{ fontSize: 12, color: theme.matcha, marginBottom: 4, letterSpacing: 2 }}>SEAT RESERVATION</div>
        <h1 className="serif" style={{ fontSize: 28, fontWeight: 900, margin: 0, color: theme.urushi }}>座席予約</h1>
        <div style={{ fontSize: 13, color: 'rgba(28,26,23,0.5)', marginTop: 4 }}>茶室のご予約は前日まで承ります</div>
      </div>

      {/* 日历 - 弹性展开动效 */}
      <div style={{ padding: '0 20px', marginBottom: 8 }}>
        <div onClick={() => setCalendarOpen(!calendarOpen)}
          style={{
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            padding: '8px 0', cursor: 'pointer',
          }}>
          <div className="serif" style={{ fontSize: 16, fontWeight: 700, color: theme.urushi }}>
            {year}年 {month + 1}月
          </div>
          <div style={{
            width: 28, height: 28, borderRadius: 14, background: theme.riceDark,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            transition: 'transform 300ms', transform: calendarOpen ? 'rotate(180deg)' : 'rotate(0)',
          }}>
            <Icon name="chevronD" size={16} color={theme.matcha} />
          </div>
        </div>

        {calendarOpen && (
          <div className="cal-expand" style={{
            background: '#fff', borderRadius: 16, padding: 14,
            boxShadow: '0 4px 20px rgba(28,26,23,0.06)',
          }}>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 4, marginBottom: 8 }}>
              {weekdays.map(d => (
                <div key={d} style={{ textAlign: 'center', fontSize: 10, color: 'rgba(28,26,23,0.4)', fontWeight: 500 }}>{d}</div>
              ))}
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 4 }}>
              {Array.from({ length: firstDay }).map((_, i) => (
                <div key={`e${i}`} />
              ))}
              {Array.from({ length: daysInMonth }, (_, i) => {
                const day = i + 1;
                const isPast = day < today.getDate();
                const isSelected = selectedDate === day;
                const isToday = day === today.getDate();
                return (
                  <button key={day} disabled={isPast} onClick={() => setSelectedDate(day)}
                    style={{
                      aspectRatio: '1', borderRadius: 8, border: 'none',
                      fontSize: 13, fontWeight: 500, cursor: isPast ? 'not-allowed' : 'pointer',
                      background: isSelected ? theme.matcha : isToday ? theme.riceDark : 'transparent',
                      color: isSelected ? theme.rice : isPast ? 'rgba(28,26,23,0.2)' : theme.urushi,
                      transition: 'all 200ms',
                    }}>
                    {day}
                  </button>
                );
              })}
            </div>
          </div>
        )}
      </div>

      {/* 时间段选择 */}
      <div style={{ padding: '16px 20px 8px' }}>
        <div className="serif" style={{ fontSize: 14, fontWeight: 700, color: theme.urushi, marginBottom: 10 }}>ご来店時間</div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8 }}>
          {['10:00', '11:30', '13:00', '14:30', '15:00', '16:30'].map((t, i) => (
            <button key={t} onClick={() => ctx.showToast(`已选择 ${t}`)} className="press"
              style={{
                padding: '10px 0', borderRadius: 10, border: i === 2 ? `1.5px solid ${theme.matcha}` : '1px solid rgba(107,127,89,0.2)',
                background: i === 2 ? 'rgba(107,127,89,0.08)' : '#fff',
                fontSize: 13, fontWeight: i === 2 ? 600 : 400,
                color: i === 2 ? theme.matchaDark : theme.urushi, cursor: 'pointer',
              }}>
              {t}
            </button>
          ))}
        </div>
      </div>

      {/* 坐席列表 */}
      <div style={{ padding: '20px', paddingBottom: 100 }} className="stagger">
        <div className="serif" style={{ fontSize: 14, fontWeight: 700, color: theme.urushi, marginBottom: 12 }}>お席選び</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {SEATS.map(seat => {
            const isSelected = selectedSeat === seat.id;
            return (
              <div key={seat.id} onClick={() => setSelectedSeat(seat.id)}
                className="press" style={{
                  display: 'flex', gap: 14, padding: 14, borderRadius: 14, cursor: 'pointer',
                  background: isSelected ? 'rgba(107,127,89,0.08)' : '#fff',
                  border: isSelected ? `1.5px solid ${theme.matcha}` : '1px solid rgba(107,127,89,0.1)',
                  transition: 'all 200ms',
                  boxShadow: isSelected ? '0 4px 16px rgba(107,127,89,0.15)' : '0 2px 8px rgba(28,26,23,0.04)',
                }}>
                <div style={{
                  width: 56, height: 56, borderRadius: 12, flexShrink: 0,
                  background: seat.type === '個室' ? `linear-gradient(135deg, ${theme.matcha}, ${theme.matchaDark})` : theme.riceDark,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                }}>
                  <div className="serif" style={{
                    fontSize: seat.type === '個室' ? 16 : 20, fontWeight: 700,
                    color: seat.type === '個室' ? theme.rice : theme.matchaDark,
                  }}>
                    {seat.type === '個室' ? '室' : seat.type === 'お座敷' ? '座' : seat.type === 'カウンター' ? 'カ' : '机'}
                  </div>
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 2 }}>
                    <span className="serif" style={{ fontSize: 15, fontWeight: 700, color: theme.urushi }}>{seat.name}</span>
                    <span style={{ fontSize: 10, padding: '1px 6px', borderRadius: 4, background: theme.riceDark, color: theme.matchaDark }}>
                      {seat.type}
                    </span>
                  </div>
                  <div style={{ fontSize: 11, color: 'rgba(28,26,23,0.5)', marginBottom: 4 }}>
                    {seat.floor} · {seat.capacity}名様まで
                  </div>
                  <div style={{ fontSize: 12, color: theme.kaki, fontWeight: 600 }}>
                    {seat.price > 0 ? `¥${seat.price} / 時間` : '料金なし'}
                  </div>
                </div>
                <div style={{ display: 'flex', alignItems: 'center' }}>
                  {isSelected ? (
                    <div style={{ width: 22, height: 22, borderRadius: 11, background: theme.matcha,
                      display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                      <Icon name="check" size={14} color={theme.rice} stroke={2.5} />
                    </div>
                  ) : (
                    <Icon name="chevronR" size={18} color="rgba(28,26,23,0.25)" />
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* 底部预约按钮 */}
      <div className="safe-bottom glass" style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, padding: '12px 20px',
        borderTop: '1px solid rgba(107,127,89,0.1)',
      }}>
        <button onClick={() => selectedSeat ? navigate('reserveSeat', SEATS.find(s => s.id === selectedSeat)) : ctx.showToast('请先选择坐席')}
          className="press" style={{
            width: '100%', height: 48, borderRadius: 24,
            background: `linear-gradient(135deg, ${theme.matcha}, ${theme.matchaDark})`,
            color: theme.rice, fontSize: 15, fontWeight: 600, border: 'none', cursor: 'pointer',
            boxShadow: '0 8px 24px rgba(107,127,89,0.3)',
          }}>
          予約を確定する
        </button>
      </div>
    </div>
  );
}

              </div>
            );
          })}
        </div>

        {/* Base URL */}
        <div style={{
          background: 'rgba(245,240,228,0.05)', borderRadius: 12, padding: 14,
          border: '1px solid rgba(245,240,228,0.08)', marginBottom: 16,
        }}>
          <div style={{ fontSize: 10, color: 'rgba(245,240,228,0.5)', marginBottom: 4 }}>Base URL</div>
          <code style={{ fontSize: 12, color: theme.matchaLight, fontFamily: 'monospace' }}>
            https://api.kissa.app/v1
          </code>
        </div>

        {/* 认证 */}
        <div style={{
          background: 'rgba(245,240,228,0.05)', borderRadius: 12, padding: 14,
          border: '1px solid rgba(245,240,228,0.08)', marginBottom: 24,
        }}>
          <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 6 }}>認証方式</div>
          <p style={{ fontSize: 11, color: 'rgba(245,240,228,0.6)', margin: '0 0 8px', lineHeight: 1.6 }}>
            すべてのリクエストは Bearer Token 認証を必要とします。
          </p>
          <pre style={{
            margin: 0, padding: 8, borderRadius: 6,
            background: '#0E0D0B', fontSize: 10, color: '#A8B89A', fontFamily: 'monospace',
          }}>Authorization: Bearer &lt;token&gt;</pre>
        </div>

        {/* 错误码 */}
        <div style={{
          background: 'rgba(245,240,228,0.05)', borderRadius: 12, padding: 14,
          border: '1px solid rgba(245,240,228,0.08)',
        }}>
          <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 10 }}>エラーコード</div>
          {[
            { code: 200, desc: '成功' },
            { code: 400, desc: 'リクエストパラメータ不正' },
            { code: 401, desc: '認証失敗' },
            { code: 403, desc: '権限なし' },
            { code: 404, desc: 'リソースが存在しない' },
            { code: 429, desc: 'レートリミット超過' },
            { code: 500, desc: 'サーバーエラー' },
          ].map(e => (
            <div key={e.code} style={{ display: 'flex', gap: 10, padding: '4px 0' }}>
              <code style={{
                fontSize: 10, color: e.code === 200 ? theme.matchaLight : theme.kaki,
                minWidth: 36, fontFamily: 'monospace',
              }}>{e.code}</code>
              <span style={{ fontSize: 11, color: 'rgba(245,240,228,0.6)' }}>{e.desc}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

          メニュー
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 12, marginBottom: 16 }}>
          {items.map(item => (
            <button key={item.label} onClick={() => { onClose(); ctx.showToast(`${item.label}功能开发中`); }}
              className="press" style={{

              <div style={{

}

// ============ 渲染 ============
function announceUpgrade() {
  try {
    window.parent?.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  } catch (e) {}
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

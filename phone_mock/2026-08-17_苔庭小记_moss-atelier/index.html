<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="creative-medium" content="interactive-prototype" />
<title>苔庭小记 · 苔藓微景观手作工坊</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Ma+Shan+Zheng&display=swap" />
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  :root {
    --moss-deep: #3d5a3f;
    --moss-green: #5a7d52;
    --moss-light: #8aa88a;
    --moss-pale: #c4d4c0;
    --moss-mist: #e8ede5;
    --terracotta: #b87a56;
    --terracotta-light: #d4a574;
    --terracotta-pale: #f0dcc4;
    --cream: #faf6ef;
    --cream-warm: #f5efe4;
    --mist-gray: #8a9a8e;
    --mist-light: #d8ddd6;
    --ink: #2a342c;
    --ink-soft: #4a5a4e;
    --paper: #fdfaf3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #e8ede5 0%, #d8ddd6 50%, #c4d4c0 100%);
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    color: var(--ink);
    font-size: 14px;
    line-height: 1.5;
  }
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1600px;
    padding: 20px;
  }
  /* Custom cursor */
  .custom-cursor {
    position: fixed;
    top: 0; left: 0;
    width: 24px; height: 24px;
    pointer-events: none;
    z-index: 99999;
    transform: translate(-50%, -50%);
    transition: width .2s cubic-bezier(.25,.8,.25,1), height .2s cubic-bezier(.25,.8,.25,1), opacity .2s;
    will-change: transform;
  }
  .custom-cursor .ring {
    position: absolute;
    inset: 0;
    border: 2px solid #fff;
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(90,125,82,.5), 0 0 24px rgba(184,122,86,.3), inset 0 0 6px rgba(255,255,255,.3);
    transition: border-color .2s, background .2s;
  }
  .custom-cursor .dot {
    position: absolute;
    top: 50%; left: 50%;
    width: 6px; height: 6px;
    background: var(--terracotta);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px var(--terracotta), 0 0 16px rgba(184,122,86,.5);
  }
  .custom-cursor.hover { width: 40px; height: 40px; }
  .custom-cursor.hover .ring { border-color: var(--moss-green); background: rgba(90,125,82,.1); }
  .custom-cursor.clicking .ring { border-color: var(--terracotta); background: rgba(184,122,86,.2); }
  .cursor-ripple {
    position: fixed;
    pointer-events: none;
    border-radius: 50%;
    border: 2px solid var(--moss-green);
    z-index: 99998;
    animation: ripple .6s cubic-bezier(.25,.8,.25,1) forwards;
  }
  @keyframes ripple {
    0% { width: 0; height: 0; opacity: .8; transform: translate(-50%,-50%); }
    100% { width: 60px; height: 60px; opacity: 0; transform: translate(-50%,-50%); }
  }

  /* Phone shell */
  .phone-frame {
    position: relative;
    width: 390px;
    height: 844px;
    background: #1a1a1a;
    border-radius: 52px;
    padding: 12px;
    box-shadow: 
      0 40px 80px -20px rgba(42,52,44,.4),
      0 20px 40px -10px rgba(42,52,44,.3),
      0 0 0 1px rgba(255,255,255,.05) inset,
      0 2px 0 rgba(255,255,255,.1) inset;
  }
  .phone-screen {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--paper);
    border-radius: 42px;
    overflow: hidden;
  }
  .phone-notch {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 32px;
    background: #1a1a1a;
    border-radius: 0 0 20px 20px;
    z-index: 1000;
  }
  .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    z-index: 999;
    pointer-events: none;
  }
  .status-bar .icons {
    display: flex;
    gap: 5px;
    align-items: center;
  }
  .status-bar .icons svg { width: 16px; height: 16px; }

  /* Mini program nav bar */
  .wx-navbar {
    position: absolute;
    top: 44px; left: 0; right: 0;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 998;
    transition: background .3s, color .3s;
  }
  .wx-navbar .title {
    font-size: 17px;
    font-weight: 600;
    font-family: 'Noto Serif SC', serif;
  }
  .wx-capsule {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    background: rgba(255,255,255,.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 20px;
    height: 32px;
    padding: 0 4px;
    border: 0.5px solid rgba(0,0,0,.08);
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .wx-capsule .btn {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .wx-capsule .divider {
    width: 1px;
    height: 16px;
    background: rgba(0,0,0,.1);
  }
  .wx-capsule svg { width: 16px; height: 16px; color: var(--ink); }

  /* Page content */
  .page-container {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden;
  }
  .page {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .page::-webkit-scrollbar { display: none; }
  
  .page-enter {
    animation: pageSlideIn .35s cubic-bezier(.25,.8,.25,1) forwards;
  }
  .page-exit {
    animation: pageSlideOut .3s cubic-bezier(.4,0,.2,1) forwards;
  }
  @keyframes pageSlideIn {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }
  @keyframes pageSlideOut {
    from { transform: translateX(0); }
    to { transform: translateX(30%); opacity: 0; }
  }
  .page-tab-enter {
    animation: tabFadeIn .25s ease-out forwards;
  }
  @keyframes tabFadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* TabBar */
  .tabbar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 83px;
    background: rgba(253,250,243,.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 0.5px solid rgba(0,0,0,.06);
    display: flex;
    align-items: flex-start;
    padding-top: 6px;
    z-index: 997;
  }
  .tabbar-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: pointer;
    padding: 4px 0;
    transition: transform .2s cubic-bezier(.34,1.56,.64,1);
  }
  .tabbar-item svg {
    width: 24px; height: 24px;
    color: var(--mist-gray);
    transition: color .2s;
  }
  .tabbar-item .label {
    font-size: 10px;
    color: var(--mist-gray);
    transition: color .2s;
  }
  .tabbar-item.active svg { color: var(--moss-green); }
  .tabbar-item.active .label { color: var(--moss-green); font-weight: 500; }
  .tabbar-item.active { transform: translateY(-2px) scale(1.05); }
  .tabbar-item .tab-dot {
    position: absolute;
    bottom: 2px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--terracotta);
    transform: scale(0);
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .tabbar-item.active .tab-dot { transform: scale(1); }
  
  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    background: var(--ink);
    border-radius: 3px;
    opacity: .3;
  }

  /* Scroll content */
  .scroll-content {
    padding-bottom: 100px;
  }

  /* ---------- HOME PAGE ---------- */
  .home-hero {
    position: relative;
    height: 420px;
    overflow: hidden;
    background: linear-gradient(180deg, var(--moss-mist) 0%, var(--cream) 100%);
  }
  .home-hero-img {
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%;
    height: 320px;
    object-fit: cover;
    object-position: center 30%;
    mask-image: linear-gradient(180deg, transparent 0%, #000 30%, #000 100%);
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 30%, #000 100%);
  }
  .home-hero-content {
    position: relative;
    z-index: 2;
    padding: 108px 24px 0;
  }
  .home-brand {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 42px;
    color: var(--moss-deep);
    margin-bottom: 4px;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp .8s .1s cubic-bezier(.25,.8,.25,1) forwards;
  }
  .home-subtitle {
    font-size: 13px;
    color: var(--moss-green);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 16px;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp .8s .25s cubic-bezier(.25,.8,.25,1) forwards;
  }
  .home-tagline {
    font-family: 'Noto Serif SC', serif;
    font-size: 15px;
    color: var(--ink-soft);
    line-height: 1.8;
    max-width: 260px;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp .8s .4s cubic-bezier(.25,.8,.25,1) forwards;
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
  /* Spore particles */
  .spore {
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--moss-light);
    opacity: .6;
    pointer-events: none;
  }

  /* Search bar */
  .search-bar {
    position: absolute;
    bottom: -24px;
    left: 20px; right: 20px;
    height: 48px;
    background: #fff;
    border-radius: 24px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 10px;
    box-shadow: 0 8px 32px rgba(42,52,44,.1), 0 2px 8px rgba(42,52,44,.06);
    z-index: 10;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp .8s .55s cubic-bezier(.25,.8,.25,1) forwards;
  }
  .search-bar:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(42,52,44,.15); }
  .search-bar svg { width: 18px; height: 18px; color: var(--mist-gray); flex-shrink: 0; }
  .search-bar .placeholder {
    font-size: 14px;
    color: var(--mist-gray);
    flex: 1;
  }

  /* Category quick entry */
  .cat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 48px 20px 12px;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp .8s .7s cubic-bezier(.25,.8,.25,1) forwards;
  }
  .cat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: transform .2s cubic-bezier(.34,1.56,.64,1);
  }
  .cat-item:hover { transform: translateY(-3px) scale(1.05); }
  .cat-icon {
    width: 48px; height: 48px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  .cat-icon.moss { background: linear-gradient(135deg, var(--moss-pale), var(--moss-mist)); }
  .cat-icon.course { background: linear-gradient(135deg, var(--terracotta-pale), var(--cream-warm)); }
  .cat-icon.tools { background: linear-gradient(135deg, var(--mist-light), var(--moss-mist)); }
  .cat-icon.community { background: linear-gradient(135deg, var(--cream-warm), var(--terracotta-pale)); }
  .cat-item .cat-name {
    font-size: 12px;
    color: var(--ink-soft);
  }

  /* Section header */
  .section-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 20px 20px 12px;
  }
  .section-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
  }
  .section-title .en {
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 11px;
    font-weight: 400;
    color: var(--mist-gray);
    letter-spacing: 2px;
    margin-left: 8px;
    text-transform: uppercase;
  }
  .section-more {
    font-size: 12px;
    color: var(--moss-green);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .section-more svg { width: 12px; height: 12px; }

  /* Featured card horizontal scroll */
  .featured-scroll {
    display: flex;
    gap: 14px;
    padding: 0 20px 4px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
  }
  .featured-scroll::-webkit-scrollbar { display: none; }
  .featured-card {
    flex-shrink: 0;
    width: 260px;
    border-radius: 20px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 4px 20px rgba(42,52,44,.08);
    cursor: pointer;
    transition: transform .3s cubic-bezier(.25,.8,.25,1), box-shadow .3s;
    scroll-snap-align: start;
  }
  .featured-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(42,52,44,.15); }
  .featured-card .img-wrap {
    position: relative;
    height: 160px;
    overflow: hidden;
  }
  .featured-card .img-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform .6s cubic-bezier(.25,.8,.25,1);
  }
  .featured-card:hover .img-wrap img { transform: scale(1.06); }
  .featured-card .badge {
    position: absolute;
    top: 12px; left: 12px;
    padding: 4px 10px;
    background: rgba(184,122,86,.92);
    color: #fff;
    font-size: 11px;
    border-radius: 10px;
    backdrop-filter: blur(10px);
  }
  .featured-card .info {
    padding: 14px 16px 16px;
  }
  .featured-card .title {
    font-family: 'Noto Serif SC', serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .featured-card .desc {
    font-size: 12px;
    color: var(--mist-gray);
    line-height: 1.5;
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .featured-card .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .featured-card .price {
    font-size: 16px;
    font-weight: 600;
    color: var(--terracotta);
  }
  .featured-card .price small {
    font-size: 11px;
    font-weight: 400;
  }
  .featured-card .spots {
    font-size: 11px;
    color: var(--mist-gray);
  }

  /* Products grid */
  .products-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 20px;
  }
  .product-card {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(42,52,44,.06);
    cursor: pointer;
    transition: transform .3s cubic-bezier(.25,.8,.25,1);
  }
  .product-card:hover { transform: translateY(-3px); }
  .product-card .p-img {
    width: 100%;
    aspect-ratio: 1;
    overflow: hidden;
    background: var(--cream);
  }
  .product-card .p-img img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform .5s cubic-bezier(.25,.8,.25,1);
  }
  .product-card:hover .p-img img { transform: scale(1.08); }
  .product-card .p-info {
    padding: 10px 12px 12px;
  }
  .product-card .p-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .product-card .p-desc {
    font-size: 11px;
    color: var(--mist-gray);
    margin-bottom: 8px;
  }
  .product-card .p-price {
    font-size: 14px;
    font-weight: 600;
    color: var(--terracotta);
  }
  .product-card .p-price small {
    font-size: 10px;
    font-weight: 400;
  }

  /* ---------- CATEGORY / SHOP PAGE ---------- */
  .shop-header {
    position: relative;
    height: 200px;
    background: linear-gradient(180deg, var(--moss-pale) 0%, var(--moss-mist) 100%);
    padding-top: 100px;
    padding-left: 24px;
  }
  .shop-header .shop-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 36px;
    color: var(--moss-deep);
    margin-bottom: 4px;
  }
  .shop-header .shop-sub {
    font-size: 12px;
    color: var(--moss-green);
    letter-spacing: 3px;
  }
  .sticky-tabs {
    position: sticky;
    top: 88px;
    z-index: 20;
    background: rgba(253,250,243,.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 0.5px solid rgba(0,0,0,.05);
  }
  .tabs-row {
    display: flex;
    gap: 24px;
    padding: 12px 20px;
    overflow-x: auto;
  }
  .tabs-row::-webkit-scrollbar { display: none; }
  .tab-item {
    flex-shrink: 0;
    font-size: 14px;
    color: var(--mist-gray);
    padding: 4px 0;
    position: relative;
    cursor: pointer;
    transition: color .2s;
  }
  .tab-item.active {
    color: var(--moss-deep);
    font-weight: 600;
  }
  .tab-item.active::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 3px;
    background: var(--terracotta);
    border-radius: 2px;
    animation: tabExpand .3s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes tabExpand {
    from { width: 0; }
    to { width: 20px; }
  }

  /* Pull to refresh */
  .pull-indicator {
    position: absolute;
    top: 90px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
    z-index: 30;
  }
  .pull-indicator.visible { opacity: 1; }
  .pull-moss {
    width: 32px; height: 32px;
    position: relative;
  }
  .pull-moss .leaf {
    position: absolute;
    bottom: 0;
    width: 6px;
    height: 20px;
    background: var(--moss-green);
    border-radius: 50% 50% 0 0;
    transform-origin: bottom center;
    animation: mossGrow 1.2s ease-in-out infinite;
  }
  .pull-moss .leaf:nth-child(1) { left: 2px; height: 16px; animation-delay: 0s; }
  .pull-moss .leaf:nth-child(2) { left: 10px; height: 22px; animation-delay: .15s; }
  .pull-moss .leaf:nth-child(3) { left: 18px; height: 18px; animation-delay: .3s; }
  .pull-moss .leaf:nth-child(4) { left: 26px; height: 14px; animation-delay: .45s; }
  @keyframes mossGrow {
    0%, 100% { transform: scaleY(.6); }
    50% { transform: scaleY(1); }
  }
  .pull-text {
    font-size: 11px;
    color: var(--moss-green);
  }

  /* Waterfall layout */
  .waterfall {
    columns: 2;
    column-gap: 12px;
    padding: 16px 20px;
  }
  .wf-item {
    break-inside: avoid;
    margin-bottom: 12px;
    border-radius: 14px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 2px 12px rgba(42,52,44,.06);
    cursor: pointer;
    transition: transform .3s;
  }
  .wf-item:hover { transform: translateY(-2px); }
  .wf-item img {
    width: 100%;
    display: block;
  }
  .wf-item .wf-info {
    padding: 10px 12px;
  }
  .wf-item .wf-name {
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 2px;
  }
  .wf-item .wf-price {
    font-size: 13px;
    font-weight: 600;
    color: var(--terracotta);
  }

  /* ---------- COMMUNITY PAGE ---------- */
  .community-hero {
    position: relative;

  /* Floating action button */

  .fab:hover { transform: scale(1.1) rotate(90deg); box-shadow: 0 12px 32px rgba(61,90,63,.5); }
  .fab svg { width: 22px; height: 22px; }

  /* ---------- PROFILE PAGE ---------- */
  .profile-hero {

  .profile-hero::after {
    content: '';

  .profile-stats {

  .stat-item {

  .stat-item .num {

  /* Ring progress for collection */
  .ring-progress {
    position: relative;
    width: 44px; height: 44px;
    margin: 0 auto 4px;
  }
  .ring-progress svg {
    width: 44px; height: 44px;
    transform: rotate(-90deg);
  }
  .ring-progress circle {
    fill: none;
    stroke-width: 3;
  }
  .ring-progress .bg { stroke: rgba(255,255,255,.2); }
  .ring-progress .fg {
    stroke: var(--terracotta-light);

    stroke-dasharray: 113;
    stroke-dashoffset: 113;
    transition: stroke-dashoffset 1.5s cubic-bezier(.25,.8,.25,1);
  }
  .ring-progress .num {
    position: absolute;

  /* Profile card section */
  .profile-card-section {
    margin: -30px 16px 16px;

    box-shadow: 0 4px 20px rgba(42,52,44,.08);

  }
  .profile-card-title {

  /* ---------- COURSE DETAIL PAGE ---------- */

  /* Bottom action bar */
  .bottom-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;

    background: #fff;
    border-top: 0.5px solid rgba(0,0,0,.06);

    align-items: center;

    gap: 2px;

  .bottom-bar-icon:hover { transform: translateY(-2px); }
  .bottom-bar-icon svg { width: 22px; height: 22px; color: var(--ink-soft); }

  /* ---------- ACTION SHEET ---------- */
  .sheet-mask {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.4);
    z-index: 2000;
    opacity: 0;
    animation: maskFadeIn .3s forwards;
  }
  .sheet-mask.closing { animation: maskFadeOut .25s forwards; }
  @keyframes maskFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes maskFadeOut { from { opacity: 1; } to { opacity: 0; } }
  
  .action-sheet {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--paper);
    border-radius: 20px 20px 0 0;
    padding: 8px 16px calc(env(safe-area-inset-bottom, 0) + 20px);
    z-index: 2001;
    animation: sheetSlideUp .35s cubic-bezier(.25,.8,.25,1) forwards;
  }
  .action-sheet.closing { animation: sheetSlideDown .3s cubic-bezier(.4,0,.2,1) forwards; }
  @keyframes sheetSlideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes sheetSlideDown { from { transform: translateY(0); } to { transform: translateY(100%); } }
  
  .sheet-grabber {

    background: var(--mist-light);
    border-radius: 2px;

  .sheet-cancel {

    text-align: center;
    font-size: 15px;
    color: var(--mist-gray);
    background: var(--cream);

    cursor: pointer;

  .comp-btn {

  const target = useRef({ x: 0, y: 0 });
  const current = useRef({ x: 0, y: 0 });
  const reducedMotion = useRef(false);

  useEffect(() => {
    reducedMotion.current = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const el = cursorRef.current;
    if (!el) return;
    
    // Center initial position
    const rect = document.querySelector('.phone-frame')?.getBoundingClientRect();
    if (rect) {
      target.current.x = rect.left + rect.width / 2;
      target.current.y = rect.top + rect.height / 2;
      current.current.x = target.current.x;
      current.current.y = target.current.y;
      el.style.left = target.current.x + 'px';
      el.style.top = target.current.y + 'px';
    }

    const handleMove = (e) => {
      target.current.x = e.clientX;
      target.current.y = e.clientY;
    };

    const handleEnter = (e) => {
      if (e.target.closest('button, .tabbar-item, .cat-item, .featured-card, .product-card, .feed-follow, .feed-action, .fab, .book-btn, .sheet-option, .tab-item, .wf-item, .api-endpoint, .color-chip, .comp-btn, .search-bar, .profile-grid-item, .detail-back, .bottom-bar-icon, .section-more, .teacher-follow')) {
        el.classList.add('hover');
      } else {
        el.classList.remove('hover');
      }
    };

    const handleDown = () => { el.classList.add('clicking'); };
    const handleUp = () => { el.classList.remove('clicking'); };

    const handleClick = (e) => {
      const ripple = document.createElement('div');
      ripple.className = 'cursor-ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    };

    const animate = () => {
      if (!reducedMotion.current) {
        // Spring physics follow
        const ease = 0.18;
        current.current.x += (target.current.x - current.current.x) * ease;
        current.current.y += (target.current.y - current.current.y) * ease;
        el.style.transform = `translate(${current.current.x}px, ${current.current.y}px) translate(-50%, -50%)`;
      } else {
        el.style.transform = `translate(${target.current.x}px, ${target.current.y}px) translate(-50%, -50%)`;
      }
      rafRef.current = requestAnimationFrame(animate);
    };

    const handleVisibility = () => {
      if (document.hidden) {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      } else {
        rafRef.current = requestAnimationFrame(animate);
      }
    };

    document.addEventListener('mousemove', handleMove);
    document.addEventListener('mouseover', handleEnter);
    document.addEventListener('mousedown', handleDown);
    document.addEventListener('mouseup', handleUp);
    document.addEventListener('click', handleClick);
    document.addEventListener('visibilitychange', handleVisibility);
    rafRef.current = requestAnimationFrame(animate);

    return () => {
      document.removeEventListener('mousemove', handleMove);
      document.removeEventListener('mouseover', handleEnter);
      document.removeEventListener('mousedown', handleDown);
      document.removeEventListener('mouseup', handleUp);
      document.removeEventListener('click', handleClick);
      document.removeEventListener('visibilitychange', handleVisibility);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, []);

  return (
    <div ref={cursorRef} className="custom-cursor">
      <div className="ring"></div>
      <div className="dot"></div>
    </div>
  );
}

// ========== SPORE PARTICLES ==========
function SporeParticles({ count = 12 }) {
  const containerRef = useRef(null);
  const rafRef = useRef(null);
  const particlesRef = useRef([]);
  const reducedMotion = useRef(false);

  useEffect(() => {
    reducedMotion.current = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const container = containerRef.current;
    if (!container || reducedMotion.current) return;

    const w = container.offsetWidth;
    const h = container.offsetHeight;
    
    particlesRef.current = Array.from({ length: count }, (_, i) => {
      const el = document.createElement('div');
      el.className = 'spore';
      el.style.left = Math.random() * w + 'px';
      el.style.top = Math.random() * h + 'px';
      container.appendChild(el);
      return {
        el,
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.3,
        vy: -0.2 - Math.random() * 0.3,
        size: 2 + Math.random() * 4,
        opacity: 0.3 + Math.random() * 0.5,
        phase: Math.random() * Math.PI * 2,
      };
    });

    let t = 0;
    const animate = () => {
      t += 0.02;
      particlesRef.current.forEach((p, i) => {
        p.x += p.vx + Math.sin(t + p.phase) * 0.2;
        p.y += p.vy;
        if (p.y < -10) {
          p.y = h + 10;
          p.x = Math.random() * w;
        }
        if (p.x < -10) p.x = w + 10;
        if (p.x > w + 10) p.x = -10;
        p.el.style.transform = `translate(${p.x - p.x}px, ${p.y - p.y}px)`;
        p.el.style.left = p.x + 'px';
        p.el.style.top = p.y + 'px';
        p.el.style.width = p.size + 'px';
        p.el.style.height = p.size + 'px';
        p.el.style.opacity = p.opacity * (0.5 + 0.5 * Math.sin(t * 2 + p.phase));
      });
      rafRef.current = requestAnimationFrame(animate);
    };

    const handleVisibility = () => {
      if (document.hidden) {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      } else {
        rafRef.current = requestAnimationFrame(animate);
      }
    };

    rafRef.current = requestAnimationFrame(animate);
    document.addEventListener('visibilitychange', handleVisibility);

    return () => {
      document.removeEventListener('visibilitychange', handleVisibility);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      particlesRef.current.forEach(p => p.el.remove());
      particlesRef.current = [];
    };
  }, [count]);

  return <div ref={containerRef} style={{ position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'hidden', zIndex: 1 }} />;
}

// ========== TOAST ==========
function Toast({ message, onClose }) {
  const [leaving, setLeaving] = useState(false);

  useEffect(() => {
    const t = setTimeout(() => {
      setLeaving(true);
      setTimeout(onClose, 200);
    }, 1800);
    return () => clearTimeout(t);
  }, [onClose]);

  return <div className={'toast' + (leaving ? ' leaving' : '')}>{message}</div>;
}

function ShopPage({ onProductClick }) {
  const [activeTab, setActiveTab] = useState(0);
  const [pullDistance, setPullDistance] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const pageRef = useRef(null);
  const startY = useRef(0);
  const pulling = useRef(false);
  const timerRef = useRef(null);

  const handleTouchStart = (e) => {
    if (pageRef.current?.scrollTop === 0) {
      startY.current = e.touches[0].clientY;
      pulling.current = true;
    }
  };

  const handleTouchMove = (e) => {
    if (!pulling.current) return;
    const dy = e.touches[0].clientY - startY.current;
    if (dy > 0 && pageRef.current?.scrollTop === 0) {
      const damped = Math.min(dy * 0.5, 80);
      setPullDistance(damped);
    }
  };

  const handleTouchEnd = () => {
    if (!pulling.current) return;
    pulling.current = false;
    if (pullDistance > 50) {
      setRefreshing(true);
      setPullDistance(60);
      if (timerRef.current) clearTimeout(timerRef.current);
      timerRef.current = setTimeout(() => {
        setRefreshing(false);
        setPullDistance(0);
      }, 1500);
    } else {
      setPullDistance(0);
    }
  };

  useEffect(() => {
    return () => { if (timerRef.current) clearTimeout(timerRef.current); };
  }, []);

  return (
    <div
      ref={pageRef}
      className="page page-tab-enter"
      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}
      onTouchEnd={handleTouchEnd}
    >
      <div className="pull-indicator" style={{
        opacity: pullDistance > 10 ? 1 : 0,
        transform: `translateX(-50%) translateY(${pullDistance - 40}px)`,
      }}>
        <div className="pull-moss">
          <div className="leaf"></div>
          <div className="leaf"></div>
          <div className="leaf"></div>
          <div className="leaf"></div>
        </div>
        <span className="pull-text">{refreshing ? '苔藓正在生长…' : pullDistance > 50 ? '松开刷新' : '下拉刷新'}</span>
      </div>

      <div style={{
        transform: `translateY(${pullDistance}px)`,
        transition: pulling.current ? 'none' : 'transform .4s cubic-bezier(.25,.8,.25,1)',
      }}>
        <div className="scroll-content">
          <div className="shop-header">
            <div className="shop-title">苔材商城</div>
            <div className="shop-subtitle">MOSS MATERIALS</div>
          </div>

          <div className="sticky-tabs">
            <div className="tabs-row">
              {catTabs.map((tab, i) => (
                <div
                  key={tab}
                  className={'tab-item' + (activeTab === i ? ' active' : '')}
                  onClick={() => setActiveTab(i)}
                >
                  {tab}
                </div>
              ))}
            </div>
          </div>

          <div className="waterfall">
            {[...products, ...products].map((p, i) => (
              <div key={i} className="wf-item" onClick={() => onProductClick?.(p)}>
                <img src={p.image} alt={p.name} style={{ height: p.tall ? 180 : 140, objectFit: 'cover' }} />

                  <div className="wf-name">{p.name}</div>

            ))}

// ========== COURSE DETAIL PAGE ==========
function CourseDetailPage({ course, onBack, onBook }) {
  const [following, setFollowing] = useState(false);
  const heroRef = useRef(null);
  const pageRef = useRef(null);
  const rafRef = useRef(null);
  const dewIntervalRef = useRef(null);
  const reducedMotion = useRef(false);

  // Parallax effect on scroll
  useEffect(() => {
    reducedMotion.current = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const page = pageRef.current;
    const hero = heroRef.current;
    if (!page || !hero || reducedMotion.current) return;

    const handleScroll = () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      rafRef.current = requestAnimationFrame(() => {
        const scrollTop = page.scrollTop;
        if (scrollTop < 0) {
          hero.style.transform = `scale(${1 + Math.abs(scrollTop) * 0.003})`;
          hero.style.transformOrigin = 'center top';
        } else {
          hero.style.transform = `translateY(${scrollTop * 0.4}px) scale(${1 + scrollTop * 0.0005})`;
        }
      });
    };

    page.addEventListener('scroll', handleScroll, { passive: true });

    return () => {
      page.removeEventListener('scroll', handleScroll);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, []);

  // Dew drop animation
  useEffect(() => {
    if (reducedMotion.current) return;
    const hero = heroRef.current;
    if (!hero) return;

    const createDew = () => {
      const dew = document.createElement('div');
      dew.className = 'dew-drop';
      const startX = 20 + Math.random() * 320;
      dew.style.left = startX + 'px';
      dew.style.top = '-10px';
      dew.style.opacity = '0.8';
      hero.appendChild(dew);

      let y = -10;
      let vy = 0;
      const gravity = 0.15;
      const wobbleAmp = 20 + Math.random() * 30;
      const wobbleFreq = 0.02 + Math.random() * 0.02;
      let t = 0;

      const drop = () => {
        vy += gravity;
        y += vy;
        t += 1;
        const x = startX + Math.sin(t * wobbleFreq) * wobbleAmp * 0.3;
        dew.style.transform = `translateX(${x - startX}px) translateY(${y + 10}px) rotate(${Math.sin(t * 0.05) * 10}deg)`;
        dew.style.opacity = Math.max(0, 0.8 - y / 350);
        if (y < 360) {
          requestAnimationFrame(drop);
        } else {
          dew.remove();
        }
      };
      requestAnimationFrame(drop);
    };

    dewIntervalRef.current = setInterval(createDew, 2000);
    // First drop immediately
    setTimeout(createDew, 500);

    return () => {
      if (dewIntervalRef.current) clearInterval(dewIntervalRef.current);
    };
  }, []);

  if (!course) return null;

  return (
    <div ref={pageRef} className="page page-enter">
      <div className="detail-hero">
        <img ref={heroRef} src={course.image} alt={course.title} />
        <div className="detail-back" onClick={onBack}>
          <Icon.ArrowLeft />
        </div>
      </div>

      <div className="detail-body">
        <div className="detail-tag-row">
          {course.tags.map(tag => (
            <span key={tag} className="detail-tag">{tag}</span>
          ))}
        </div>
        <h1 className="detail-title">{course.title}</h1>
        <p className="detail-subtitle">{course.subtitle}</p>

        <div className="detail-meta-row">
          <div className="detail-meta-item"><Icon.Calendar /> {course.date}</div>
          <div className="detail-meta-item"><Icon.Clock /> {course.duration}</div>
          <div className="detail-meta-item"><Icon.Users /> 剩{course.spots}席</div>
        </div>

        <h2 className="detail-section-title">课程介绍</h2>
        <p className="detail-desc">{course.desc}</p>

        <h2 className="detail-section-title">课程流程</h2>
        <div className="timeline">
          {course.schedule.map((s, i) => (
            <div key={i} className="timeline-item">
              <div className="timeline-dot"></div>
              <div className="timeline-content">
                <div className="time">{s.time}</div>
                <div className="text">{s.text}</div>
              </div>
            </div>
          ))}
        </div>

        <h2 className="detail-section-title">授课老师</h2>
        <div className="teacher-card">
          <div className="teacher-avatar">{course.teacher[0]}</div>
          <div className="teacher-info">
            <div className="teacher-name">{course.teacher}</div>
            <div className="teacher-title">{course.teacherTitle}</div>
          </div>
          <div
            className={'teacher-follow'}
            style={{ background: following ? 'var(--mist-light)' : 'var(--moss-green)', color: following ? 'var(--mist-gray)' : '#fff' }}
            onClick={() => setFollowing(!following)}
          >
            {following ? '已关注' : '+ 关注'}
          </div>
        </div>

        <h2 className="detail-section-title">上课地点</h2>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 20, padding: '12px 14px', background: 'var(--cream)', borderRadius: 12 }}>
          <div style={{ width: 40, height: 40, borderRadius: 10, background: 'var(--moss-mist)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
            <Icon.MapPin />
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 13, fontWeight: 500, marginBottom: 2 }}>{course.location}</div>
            <div style={{ fontSize: 11, color: 'var(--mist-gray)' }}>距您 2.3km · 约15分钟</div>
          </div>
        </div>
      </div>

      <div className="bottom-bar">

function ActionSheet({ title, options, onSelect, onClose }) {
  const [closing, setClosing] = useState(false);

  const handleClose = () => {
    setClosing(true);
    setTimeout(onClose, 250);
  };

  const handleSelect = (opt) => {
    setClosing(true);
    setTimeout(() => {
      onSelect(opt);
      onClose();
    }, 200);
  };

  return (
    <>
      <div className={'sheet-mask' + (closing ? ' closing' : '')} onClick={handleClose}></div>
      <div className={'action-sheet' + (closing ? ' closing' : '')}>
        <div className="sheet-grabber"></div>
        {title && <div className="sheet-title">{title}</div>}
        <div className="sheet-options">
          {options.map((opt, i) => (
            <div
              key={i}
              className={'sheet-option' + (opt.danger ? ' danger' : '')}
              onClick={() => handleSelect(opt)}
            >
              {opt.label}
            </div>
          ))}
        </div>
        <div className="sheet-cancel" onClick={handleClose}>取消</div>
      </div>
    </>
  );
}

      window.parent?.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    };

    if (document.readyState !== 'complete') {

    shop: '苔材商城',
    community: '苔友社区',
    me: '',
  }[tab] || '';

  const navTransparent = tab === 'home' || tab === 'me';
  const navDark = false;

  const renderStackPage = (page, index) => {
    switch (page.key) {
      case 'detail':
        return (
          <CourseDetailPage
            key={'stack-' + index}
            course={page.props.course || courses[0]}
            onBack={handleBack}
            onBook={handleBook}
          />
        );
      case 'spec':
        return <SpecPage key={'stack-' + index} onBack={handleBack} />;
      case 'api':
        return <ApiPage key={'stack-' + index} onBack={handleBack} />;
      default:
        return null;
    }
  };

  return (
    <div className="stage">
      <div className="phone-frame">
        <div className="phone-screen">
          <div className="phone-notch"></div>
          <StatusBar dark={tab === 'me'} />
          {stackPages.length === 0 && (
            <>
              {!navTransparent && <WxNavbar title={navTitle} transparent={navTransparent} darkText={navDark} />}
              {tab === 'home' && (
                <HomePage onCourseClick={handleCourseClick} onNavigate={handleNavigate} />
              )}
              {tab === 'shop' && (
                <>
                  <WxNavbar title="苔材商城" />
                  <ShopPage />
                </>
              )}
              {tab === 'community' && (
                <>
                  <WxNavbar title="苔友社区" />
                  <CommunityPage />
                </>
              )}
              {tab === 'me' && (
                <ProfilePage onNavigate={handleNavigate} />
              )}
            </>
          )}

          {stackPages.map((page, i) => renderStackPage(page, i))}

          {showTabBar && (
            <>
              <TabBar active={tab} onChange={handleTabChange} />
              <div className="home-indicator"></div>
            </>
          )}

          {actionSheet && (
            <ActionSheet
              title={actionSheet.title}
              options={actionSheet.options}
              onSelect={actionSheet.onSelect}
              onClose={() => setActionSheet(null)}
            />
          )}

          {toast && (
            <Toast message={toast.msg} onClose={() => setToast(null)} />
          )}
        </div>
      </div>
      <CustomCursor />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

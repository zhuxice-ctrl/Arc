<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>古籍修复坊 · Manuscript Atelier</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" />
<style>
  :root {
    --paper-aged: #F4E8D0;
    --ink-black: #1A1714;
    --cinnabar: #C8392E;
    --bronze: #B8860B;
    --rice-paper: #FAF5EB;
    --indigo: #2E4057;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #E8DFC8;
    overflow: hidden;
    color: var(--ink-black);
    cursor: none;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(200, 57, 46, 0.06), transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(184, 134, 11, 0.08), transparent 60%),
      linear-gradient(135deg, #EDE0C3 0%, #E4D5B3 100%);
    z-index: 0;
    pointer-events: none;
  }
  .stage {
    position: relative;
    width: 100%; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    z-index: 1;
  }
  .phone-frame {
    position: relative;
    width: 390px;
    height: 844px;
    background: var(--ink-black);
    border-radius: 55px;
    padding: 12px;
    box-shadow:
      0 40px 80px rgba(26, 23, 20, 0.35),
      0 10px 30px rgba(26, 23, 20, 0.25),
      inset 0 0 0 2px rgba(255,255,255,0.05);
  }
  .phone-screen {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 44px;
    overflow: hidden;
    background: var(--paper-aged);
  }
  /* Dynamic Island */
  .dynamic-island {
    position: absolute;
    top: 11px; left: 50%;
    transform: translateX(-50%);
    width: 126px; height: 37px;
    background: #000;
    border-radius: 20px;
    z-index: 100;
  }
  /* Status bar */
  .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 54px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-black);
    z-index: 50;
    pointer-events: none;
    font-family: 'Noto Sans SC', sans-serif;
  }
  .status-bar .right {
    display: flex; align-items: center; gap: 5px;
  }
  .status-bar .battery {
    width: 25px; height: 12px;
    border: 1.2px solid var(--ink-black);
    border-radius: 3px;
    position: relative;
  }
  .status-bar .battery::after {
    content: '';
    position: absolute;
    right: -3px; top: 3px;
    width: 2px; height: 4px;
    background: var(--ink-black);
    border-radius: 0 1px 1px 0;
  }
  .status-bar .battery-fill {
    position: absolute;
    left: 1px; top: 1px; bottom: 1px;
    width: 80%;
    background: var(--ink-black);
    border-radius: 1px;
  }
  /* App content */
  .app-content {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden;
  }
  .page {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow-y: auto;
    overflow-x: hidden;
    background: var(--paper-aged);
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .page::-webkit-scrollbar { display: none; }
  .page.page-enter-active { animation: pageSlideIn 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
  .page.page-exit-active { animation: pageSlideOut 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes pageSlideIn {
    from { transform: translateX(30%); opacity: 0.7; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes pageSlideOut {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(-20%); opacity: 0.5; }
  }
  /* Bottom Tab Bar */
  .tab-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 83px;
    background: rgba(250, 245, 235, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 0.5px solid rgba(26, 23, 20, 0.12);
    display: flex;
    align-items: flex-start;
    justify-content: space-around;
    padding: 8px 0 28px;
    z-index: 40;
  }
  .tab-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 4px 14px;
    color: rgba(26, 23, 20, 0.45);
    font-size: 10px;
    font-weight: 500;
    transition: color 0.2s ease, transform 0.2s ease;
    cursor: none;
  }
  .tab-item.active { color: var(--cinnabar); transform: translateY(-2px); }
  .tab-item svg { width: 24px; height: 24px; }
  .tab-item:active { transform: scale(0.92); }
  .page-with-tab { padding-bottom: 83px; }
  /* Navigation bar */
  .nav-bar {
    position: sticky; top: 0;
    height: 94px;
    padding: 54px 16px 10px;
    background: rgba(244, 232, 208, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: space-between;
    z-index: 30;
    border-bottom: 0.5px solid rgba(26, 23, 20, 0.08);
  }
  .nav-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--ink-black);
    letter-spacing: 2px;
  }
  .nav-back {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    transition: background 0.2s;
    cursor: none;
  }
  .nav-back:active { background: rgba(26, 23, 20, 0.08); }
  .nav-action {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    cursor: none;
  }
  /* Large title */
  .large-title {
    padding: 60px 20px 16px;
    font-family: 'Noto Serif SC', serif;
    font-size: 34px;
    font-weight: 700;
    color: var(--ink-black);
    letter-spacing: 3px;
    line-height: 1.2;
  }
  .large-title .sub {
    display: block;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 6px;
    color: var(--cinnabar);
    margin-top: 6px;
    font-family: 'Noto Sans SC', sans-serif;
    text-transform: uppercase;
  }
  /* Home feed cards */
  .home-hero {
    position: relative;
    margin: 0 16px 16px;
    border-radius: 20px;
    overflow: hidden;
    height: 220px;
    box-shadow: 0 8px 30px rgba(26, 23, 20, 0.15);
  }
  .home-hero img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.6s ease;
  }
  .home-hero:hover img { transform: scale(1.05); }
  .home-hero .hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 40%, rgba(26,23,20,0.75) 100%);
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 20px;
    color: var(--rice-paper);
  }
  .home-hero .hero-tag {
    display: inline-block;
    padding: 3px 10px;
    background: var(--cinnabar);
    color: var(--rice-paper);
    font-size: 11px;
    border-radius: 4px;
    margin-bottom: 8px;
    letter-spacing: 2px;
    width: fit-content;
  }
  .home-hero h3 {
    font-family: 'Noto Serif SC', serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 2px;
  }
  .home-hero p {
    font-size: 12px;
    opacity: 0.8;
    margin-top: 4px;
  }
  /* Section header */
  .section-header {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 20px 20px 12px;
  }
  .section-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink-black);
    letter-spacing: 2px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::before {
    content: '';
    width: 3px; height: 16px;
    background: var(--cinnabar);
    border-radius: 1px;
  }
  .section-more {
    font-size: 12px;
    color: var(--bronze);
    cursor: none;
  }
  /* Manuscript card (horizontal) */
  .ms-card-row {
    display: flex;
    gap: 12px;
    padding: 0 16px 14px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .ms-card-row::-webkit-scrollbar { display: none; }
  .ms-card {
    flex-shrink: 0;
    width: 160px;
    background: var(--rice-paper);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(26, 23, 20, 0.08);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: none;
  }
  .ms-card:active { transform: scale(0.97); }
  .ms-card .cover {
    width: 100%; height: 200px;
    object-fit: cover;
  }
  .ms-card .info {
    padding: 10px 12px;
  }
  .ms-card .info h4 {
    font-family: 'Noto Serif SC', serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-black);
    margin-bottom: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ms-card .info .meta {
    font-size: 11px;
    color: rgba(26,23,20,0.55);
    display: flex; justify-content: space-between;
  }
  .ms-card .info .dyn-tag {
    display: inline-block;
    padding: 1px 6px;
    background: rgba(200, 57, 46, 0.1);
    color: var(--cinnabar);
    font-size: 10px;
    border-radius: 3px;
    margin-top: 6px;
  }
  /* Category chips */
  .chip-row {
    display: flex; gap: 8px;
    padding: 0 20px 16px;
    flex-wrap: wrap;
  }
  .chip {
    padding: 6px 14px;
    background: var(--rice-paper);
    border: 1px solid rgba(26,23,20,0.1);
    border-radius: 18px;
    font-size: 12px;
    color: var(--ink-black);
    transition: all 0.2s;
    cursor: none;
  }
  .chip.active {
    background: var(--ink-black);
    color: var(--rice-paper);
    border-color: var(--ink-black);
  }
  /* Grid (Browse) */
  .browse-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 0 16px 20px;
  }
  .browse-item {
    background: var(--rice-paper);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(26,23,20,0.07);
    cursor: none;
    transition: transform 0.25s ease;
  }
  .browse-item:active { transform: scale(0.97); }
  .browse-item img {
    width: 100%; height: 170px;
    object-fit: cover;
  }
  .browse-item .b-info {
    padding: 8px 10px 12px;
  }
  .browse-item .b-info h4 {
    font-family: 'Noto Serif SC', serif;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 3px;
  }
  .browse-item .b-info p {
    font-size: 10px;
    color: rgba(26,23,20,0.5);
  }
  /* Timeline */
  .timeline {
    padding: 20px 16px 20px 36px;
    position: relative;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 24px; top: 20px; bottom: 20px;
    width: 1.5px;
    background: linear-gradient(180deg, var(--cinnabar), var(--bronze), transparent);
  }
  .tl-item {
    position: relative;
    padding: 0 0 24px 24px;
  }
  .tl-item::before {
    content: '';
    position: absolute;
    left: -27px; top: 6px;
    width: 12px; height: 12px;
    background: var(--paper-aged);
    border: 2px solid var(--cinnabar);
    border-radius: 50%;
    z-index: 1;
  }
  .tl-item .tl-date {
    font-size: 11px;
    color: var(--cinnabar);
    letter-spacing: 1px;
    font-weight: 500;
  }
  .tl-item .tl-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 15px;
    font-weight: 600;
    margin: 4px 0 6px;
    color: var(--ink-black);
  }
  .tl-item .tl-desc {
    font-size: 12px;
    color: rgba(26,23,20,0.6);
    line-height: 1.6;
  }
  .tl-card {
    background: var(--rice-paper);
    border-radius: 12px;
    padding: 12px;
    margin-top: 8px;
    box-shadow: 0 3px 10px rgba(26,23,20,0.06);
    cursor: none;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .tl-card:active { transform: scale(0.98); box-shadow: 0 1px 5px rgba(26,23,20,0.06); }
  .tl-card .tl-img {
    width: 100%; height: 100px;
    object-fit: cover;
    border-radius: 8px;
    margin-top: 8px;
  }
  .tl-progress {
    display: flex; gap: 4px;
    margin-top: 8px;
  }
  .tl-progress span {
    flex: 1;
    height: 4px;
    background: rgba(26,23,20,0.1);
    border-radius: 2px;
  }
  .tl-progress span.done { background: var(--bronze); }
  /* Hero detail */
  .detail-hero {
    position: relative;
    height: 360px;
    overflow: hidden;
  }
  .detail-hero img {
    width: 100%; height: 100%;
    object-fit: cover;
    will-change: transform;
  }
  .detail-hero .dh-mask {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(26,23,20,0.8) 100%);
  }
  .detail-hero .dh-info {
    position: absolute;
    left: 20px; right: 20px; bottom: 24px;
    color: var(--rice-paper);
  }
  .detail-hero .dh-tag {
    display: inline-block;
    padding: 3px 10px;
    border: 1px solid var(--bronze);
    color: var(--bronze);
    font-size: 11px;
    border-radius: 3px;
    margin-bottom: 10px;
    letter-spacing: 2px;
  }
  .detail-hero h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 4px;
    margin-bottom: 6px;
  }
  .detail-hero .dh-meta {
    font-size: 12px;
    opacity: 0.8;
    display: flex; gap: 14px;
  }
  .detail-body {
    padding: 24px 20px 40px;
    background: var(--paper-aged);
    border-radius: 24px 24px 0 0;
    margin-top: -20px;
    position: relative;
  }
  .detail-body h2 {
    font-family: 'Noto Serif SC', serif;
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .detail-body h2::before {
    content: '';
    width: 3px; height: 16px;
    background: var(--cinnabar);
  }
  .detail-body p {
    font-size: 13px;
    line-height: 1.9;
    color: rgba(26,23,20,0.75);
    margin-bottom: 12px;
  }
  .detail-steps {
    margin-top: 8px;
  }
  .step-item {
    display: flex; gap: 14px;
    padding: 14px 0;
    border-bottom: 0.5px solid rgba(26,23,20,0.08);
  }
  .step-num {
    width: 30px; height: 30px;
    flex-shrink: 0;
    border: 1.5px solid var(--bronze);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Noto Serif SC', serif;
    font-size: 13px;
    color: var(--bronze);
    font-weight: 600;
  }
  .step-content h4 {
    font-family: 'Noto Serif SC', serif;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .step-content p {
    font-size: 12px;
    color: rgba(26,23,20,0.6);
    line-height: 1.7;
  }
  .fab {
    position: absolute;
    right: 20px; bottom: 100px;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--cinnabar), #A52A22);
    box-shadow: 0 8px 24px rgba(200, 57, 46, 0.4);
    display: flex; align-items: center; justify-content: center;
    color: var(--rice-paper);
    z-index: 25;
    cursor: none;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .fab:active { transform: scale(0.9); }
  /* Calendar */
  .cal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px 16px;
  }
  .cal-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 2px;
  }
  .cal-nav {
    display: flex; gap: 8px;
  }
  .cal-nav button {
    width: 30px; height: 30px;
    border: 1px solid rgba(26,23,20,0.15);
    border-radius: 50%;
    background: var(--rice-paper);
    display: flex; align-items: center; justify-content: center;
    cursor: none;
    transition: all 0.2s;
  }
  .cal-nav button:active { transform: scale(0.9); background: var(--ink-black); color: var(--rice-paper); }
  .calendar {
    margin: 0 16px 20px;
    background: var(--rice-paper);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 4px 20px rgba(26,23,20,0.06);
  }
  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 11px;
    color: rgba(26,23,20,0.4);
    margin-bottom: 8px;
    font-weight: 500;
  }
  .cal-days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-day {
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    border-radius: 8px;
    cursor: none;
    transition: all 0.2s;
    position: relative;
  }
  .cal-day.empty { visibility: hidden; }
  .cal-day.today { color: var(--cinnabar); font-weight: 600; }
  .cal-day.selected {
    background: var(--ink-black);
    color: var(--rice-paper);
  }
  .cal-day.has-slots::after {
    content: '';
    position: absolute;
    bottom: 4px; left: 50%;
    transform: translateX(-50%);
    width: 4px; height: 4px;
    background: var(--bronze);
    border-radius: 50%;
  }
  .cal-day.selected.has-slots::after { background: var(--rice-paper); }
  .cal-day:active:not(.empty) { transform: scale(0.9); }
  .booking-form {
    margin: 0 16px 20px;
    background: var(--rice-paper);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 20px rgba(26,23,20,0.06);
  }
  .form-group {
    margin-bottom: 16px;
  }
  .form-group label {
    display: block;
    font-size: 12px;
    color: rgba(26,23,20,0.55);
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .form-input, .form-select {
    width: 100%;
    padding: 12px 14px;
    background: var(--paper-aged);
    border: 1px solid rgba(26,23,20,0.1);
    border-radius: 10px;
    font-size: 14px;
    color: var(--ink-black);
    font-family: inherit;
    cursor: none;
    transition: border-color 0.2s;
  }
  .form-input:focus, .form-select:focus {
    outline: none;
    border-color: var(--cinnabar);
  }
  .time-slots {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .time-slot {
    padding: 10px;
    text-align: center;
    font-size: 12px;
    background: var(--paper-aged);
    border: 1px solid rgba(26,23,20,0.1);
    border-radius: 8px;
    cursor: none;
    transition: all 0.2s;
  }
  .time-slot.selected {
    background: var(--ink-black);
    color: var(--rice-paper);
    border-color: var(--ink-black);
  }
  .time-slot:active { transform: scale(0.95); }
  .submit-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--cinnabar), #A52A22);
    color: var(--rice-paper);
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 4px;
    cursor: none;
    font-family: 'Noto Serif SC', serif;
    box-shadow: 0 6px 20px rgba(200, 57, 46, 0.35);
    transition: all 0.2s;
  }
  .submit-btn:active { transform: scale(0.98); box-shadow: 0 2px 10px rgba(200, 57, 46, 0.3); }
  /* Community */
  .community-header {
    padding: 60px 20px 16px;
    background: linear-gradient(180deg, var(--indigo) 0%, #1a2738 100%);
    color: var(--rice-paper);
    position: relative;
    overflow: hidden;
  }
  .community-header::before {
    content: '';
    position: absolute;
    top: -40px; right: -30px;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(184, 134, 11, 0.2), transparent 70%);
    border-radius: 50%;
  }
  .community-header h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 3px;
    position: relative;
  }
  .community-header .sub {
    font-size: 12px;
    opacity: 0.7;
    letter-spacing: 4px;
    margin-top: 6px;
    text-transform: uppercase;
  }
  .community-stats {
    display: flex; gap: 20px;
    margin-top: 18px;
    position: relative;
  }
  .stat-item { flex: 1; }
  .stat-item .num {
    font-family: 'Noto Serif SC', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--bronze);

// ============ APP ROOT ============
function App() {
  const [currentPage, setCurrentPage] = useState('home');
  const [prevPage, setPrevPage] = useState(null);
  const [pageTransition, setPageTransition] = useState(false);
  const [sheetOpen, setSheetOpen] = useState(false);
  const [toast, setToast] = useState({ show: false, text: '' });
  const [manuscriptDetail, setManuscriptDetail] = useState(null);

  const showToast = useCallback((text) => {
    setToast({ show: true, text });
    const t = setTimeout(() => setToast({ show: false, text: '' }), 2000);
    return () => clearTimeout(t);
  }, []);

  const navigate = useCallback((page, data = null) => {
    setPrevPage(currentPage);
    setPageTransition(true);
    if (data) setManuscriptDetail(data);
    setTimeout(() => {
      setCurrentPage(page);
      setTimeout(() => setPageTransition(false), 50);
    }, 300);
  }, [currentPage]);

  const goBack = useCallback(() => {
    if (prevPage) {
      setPageTransition(true);
      setTimeout(() => {
        setCurrentPage(prevPage);
        setPrevPage(null);
        setTimeout(() => setPageTransition(false), 50);
      }, 300);
    }
  }, [prevPage]);

  // Pages that show tab bar
  const tabPages = ['home', 'browse', 'timeline', 'community', 'profile'];
  const showTabBar = tabPages.includes(currentPage);

  return (
    <>
      <div className={`page ${pageTransition ? 'page-enter-active' : ''}`} key={currentPage}>
        {currentPage === 'home' && <HomePage onNavigate={navigate} showToast={showToast} />}
        {currentPage === 'browse' && <BrowsePage onNavigate={navigate} showToast={showToast} />}
        {currentPage === 'timeline' && <TimelinePage onNavigate={navigate} showToast={showToast} />}
        {currentPage === 'detail' && <DetailPage manuscript={manuscriptDetail} onBack={goBack} onNavigate={navigate} showToast={showToast} />}
        {currentPage === 'booking' && <BookingPage onBack={goBack} showToast={showToast} />}
        {currentPage === 'community' && <CommunityPage onNavigate={navigate} showToast={showToast} />}
        {currentPage === 'profile' && <ProfilePage onNavigate={navigate} showToast={showToast} />}
        {currentPage === 'design' && <DesignSystemPage onBack={goBack} />}
        {currentPage === 'api' && <ApiDocPage onBack={goBack} />}
      </div>

      {showTabBar && <TabBar current={currentPage} onChange={navigate} />}

      <div className={`backdrop ${sheetOpen ? 'show' : ''}`} onClick={() => setSheetOpen(false)} />
      <div className={`bottom-sheet ${sheetOpen ? 'show' : ''}`}>
        <div className="sheet-grabber" />
        <div className="sheet-header">
          <h3>快捷操作</h3>
        </div>
        <div className="sheet-content">
          <div className="menu-item" onClick={() => { setSheetOpen(false); navigate('booking'); }}>
            <div className="left"><div className="icon"><Icon name="calendar" size={16} /></div>预约修复</div>
            <div className="arrow"><Icon name="chevronRight" size={14} /></div>
          </div>
          <div className="menu-item" onClick={() => { setSheetOpen(false); navigate('design'); }}>
            <div className="left"><div className="icon"><Icon name="palette" size={16} /></div>设计规范</div>
            <div className="arrow"><Icon name="chevronRight" size={14} /></div>
          </div>
          <div className="menu-item" onClick={() => { setSheetOpen(false); navigate('api'); }}>
            <div className="left"><div className="icon"><Icon name="code" size={16} /></div>接口文档</div>
            <div className="arrow"><Icon name="chevronRight" size={14} /></div>
          </div>
        </div>
      </div>

      <div className={`toast ${toast.show ? 'show' : ''}`}>{toast.text}</div>
    </>
  );
}

// ============ TAB BAR ============
function TabBar({ current, onChange }) {
  const tabs = [
    { key: 'home', label: '首页', icon: 'home' },
    { key: 'browse', label: '善本', icon: 'book' },
    { key: 'timeline', label: '修复', icon: 'clock' },
    { key: 'community', label: '社区', icon: 'users' },
    { key: 'profile', label: '我的', icon: 'user' },
  ];
  return (
    <div className="tab-bar">
      {tabs.map(t => (
        <div
          key={t.key}
          className={`tab-item ${current === t.key ? 'active' : ''}`}
          onClick={() => onChange(t.key)}
        >
          <Icon name={t.icon} size={24} />
          <span>{t.label}</span>
        </div>
      ))}
    </div>
  );
}

// ============ HOME PAGE ============
function HomePage({ onNavigate, showToast }) {
  const titleRef = useRef(null);
  const [pullY, setPullY] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const startYRef = useRef(0);
  const pageRef = useRef(null);

  useEffect(() => {
    const t = setTimeout(() => {
      if (titleRef.current) titleRef.current.classList.add('animate');
    }, 400);
    return () => clearTimeout(t);
  }, []);

  // Pull to refresh
  const handleTouchStart = (e) => {
    if (pageRef.current?.scrollTop === 0) {
      startYRef.current = e.touches[0].clientY;
    }
  };
  const handleTouchMove = (e) => {
    if (pageRef.current?.scrollTop === 0 && startYRef.current) {
      const diff = e.touches[0].clientY - startYRef.current;
      if (diff > 0) setPullY(Math.min(diff * 0.5, 80));
    }
  };
  const handleTouchEnd = () => {
    if (pullY > 50) {
      setRefreshing(true);
      setPullY(50);
      setTimeout(() => {
        setRefreshing(false);
        setPullY(0);
        showToast('已刷新');
      }, 1200);
    } else {
      setPullY(0);
    }
    startYRef.current = 0;
  };

  return (
    <div
      className="page-with-tab"
      ref={pageRef}
      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}
      onTouchEnd={handleTouchEnd}
    >
      <div className="pull-indicator" style={{ transform: `translateY(${pullY - 50}px)` }}>
        {refreshing ? <><div className="spin" />修复中…</> : pullY > 50 ? '松开刷新' : '下拉刷新'}
      </div>

      <div className="large-title">
        古籍修复坊
        <span className="sub">MANUSCRIPT ATELIER</span>
      </div>

      {/* Hero card */}
      <div className="home-hero fade-up" style={{ animationDelay: '0.1s' }} onClick={() => onNavigate('detail', MANUSCRIPTS[0])}>
        <img src={IMG.songBook} alt="宋版古籍" />

// ============ DETAIL PAGE (Hero + Parallax) ============
function DetailPage({ manuscript, onBack, onNavigate, showToast }) {
  const [scrollY, setScrollY] = useState(0);
  const pageRef = useRef(null);
  const imgRef = useRef(null);
  const rafRef = useRef(null);
  const visibleRef = useRef(true);

  const handleScroll = useCallback(() => {
    if (!visibleRef.current) return;
    if (rafRef.current) return;
    rafRef.current = requestAnimationFrame(() => {
      if (pageRef.current) {
        setScrollY(pageRef.current.scrollTop);
      }
      rafRef.current = null;
    });
  }, []);

  useEffect(() => {
    const onVis = () => { visibleRef.current = !document.hidden; };
    document.addEventListener('visibilitychange', onVis);
    return () => {
      document.removeEventListener('visibilitychange', onVis);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, []);

  const m = manuscript || MANUSCRIPTS[0];
  const parallax = scrollY * 0.4;
  const heroOpacity = Math.max(0, 1 - scrollY / 300);

  return (
    <div ref={pageRef} onScroll={handleScroll}>
      {/* Hero with parallax */}
      <div className="detail-hero">
        <img
          ref={imgRef}
          src={m.cover}
          alt={m.title}
          style={{ transform: `translateY(${Math.max(-parallax, -80)}px) scale(${1 + scrollY * 0.0005})` }}
        />
        <div className="dh-mask" />
        <div className="dh-info" style={{ opacity: heroOpacity }}>
          <span className="dh-tag">{m.status}</span>
          <h1>{m.title}</h1>
          <div className="dh-meta">
            <span>{m.dynasty}</span>
            <span>第 {m.progress || 3} / 5 步</span>
          </div>
        </div>
        <div className="scroll-hint" style={{ opacity: heroOpacity * 0.7 }}>上滑查看详情</div>
      </div>

      {/* Nav bar overlay - shows on scroll */}
      <div style={{
        position: 'sticky', top: 0, zIndex: 20,
        height: 54, display: 'flex', alignItems: 'center',
        padding: '0 12px', justifyContent: 'space-between',
        background: scrollY > 250 ? 'rgba(244, 232, 208, 0.92)' : 'transparent',
        backdropFilter: scrollY > 250 ? 'blur(12px)' : 'none',
        transition: 'background 0.3s, backdrop-filter 0.3s',
      }}>
        <div className="nav-back" onClick={onBack}>
          <Icon name="back" size={22} color={scrollY > 200 ? 'var(--ink-black)' : 'var(--rice-paper)'} />
        </div>
        <span style={{
          fontFamily: "'Noto Serif SC', serif",
          fontSize: 17, fontWeight: 600,
          color: scrollY > 200 ? 'var(--ink-black)' : 'transparent',
          transition: 'color 0.3s',
          letterSpacing: 2,
        }}>{m.title}</span>
        <div className="nav-action" onClick={() => showToast('已收藏')}>
          <Icon name="bookmark" size={22} color={scrollY > 200 ? 'var(--ink-black)' : 'var(--rice-paper)'} />
        </div>
      </div>

      {/* Body */}
      <div className="detail-body">
        <h2>修复简介</h2>
        <p>
          {m.title}，{m.dynasty}刊本，开本纵 28.5 厘米，横 18.2 厘米。
          全书共十卷，现存七卷，每半叶十行，行二十字。版式疏朗，字体端楷，
          为典型的宋代浙刻风格。原藏者为清代藏书家黄氏士礼居，后辗转流传。
        </p>
        <p>
          此书入藏时，书衣破损，书脊断裂，部分书页有虫蛀、水渍及霉变痕迹。
          经修复团队评估，制定五期修复方案，预计耗时六个月完成全卷修复。

// ============ BOOKING PAGE ============
function BookingPage({ onBack, showToast }) {
  const [selectedDate, setSelectedDate] = useState(null);
  const [selectedSlot, setSelectedSlot] = useState(null);
  const [month, setMonth] = useState({ y: 2024, m: 8 });
  const [formData, setFormData] = useState({ name: '', phone: '', note: '' });

  const daysInMonth = new Date(month.y, month.m, 0).getDate();
  const firstDay = new Date(month.y, month.m - 1, 1).getDay();
  const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
  const slots = ['巳时 09:00', '午时 11:00', '未时 14:00', '申时 16:00'];
  const slotDays = [3, 5, 8, 12, 15, 19, 22, 26, 29];

  const handleSubmit = () => {
    if (!selectedDate || !selectedSlot) {
      showToast('请选择日期和时段');
      return;
    }
    if (!formData.name) {
      showToast('请输入您的姓名');
      return;
    }
    showToast('预约提交成功');
  };

  const prevMonth = () => {
    if (month.m === 1) setMonth({ y: month.y - 1, m: 12 });
    else setMonth({ y: month.y, m: month.m - 1 });
  };
  const nextMonth = () => {
    if (month.m === 12) setMonth({ y: month.y + 1, m: 1 });
    else setMonth({ y: month.y, m: month.m + 1 });
  };

  const days = [];
  for (let i = 0; i < firstDay; i++) days.push({ empty: true });
  for (let d = 1; d <= daysInMonth; d++) {
    days.push({
      day: d,
      today: month.y === 2024 && month.m === 8 && d === 17,
      hasSlots: slotDays.includes(d),
      selected: selectedDate === d,
    });
  }

  return (
    <div>
      {/* Nav bar */}
      <div className="nav-bar" style={{ background: 'rgba(244, 232, 208, 0.95)' }}>
        <div className="nav-back" onClick={onBack}>
          <Icon name="back" size={22} />
        </div>
        <div className="nav-title">工坊预约</div>
        <div className="nav-action">
          <Icon name="more" size={20} />
        </div>
      </div>

      {/* Calendar section */}
      <div className="cal-header" style={{ paddingTop: 10 }}>
        <div className="cal-title">{month.y}年 {month.m}月</div>
        <div className="cal-nav">
          <button onClick={prevMonth}><Icon name="chevronLeft" size={16} /></button>
          <button onClick={nextMonth}><Icon name="chevronRight" size={16} /></button>
        </div>
      </div>

      <div className="calendar">
        <div className="cal-weekdays">
          {weekdays.map(w => <div key={w}>{w}</div>)}
        </div>
        <div className="cal-days">
          {days.map((d, i) => (
            <div
              key={i}
              className={`cal-day ${d.empty ? 'empty' : ''} ${d.today ? 'today' : ''} ${d.selected ? 'selected' : ''} ${d.hasSlots ? 'has-slots' : ''}`}
              onClick={() => !d.empty && d.hasSlots && setSelectedDate(d.day)}
            >
              {d.day}
            </div>
          ))}
        </div>
        <div style={{ display: 'flex', gap: 14, marginTop: 12, fontSize: 11, color: 'rgba(26,23,20,0.5)', paddingTop: 10, borderTop: '0.5px solid rgba(26,23,20,0.06)' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
            <div style={{ width: 4, height: 4, borderRadius: '50%', background: 'var(--bronze)' }} />
            可预约
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
            <div style={{ width: 14, height: 14, borderRadius: 4, background: 'var(--ink-black)' }} />
            已选
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
            <span style={{ color: 'var(--cinnabar)', fontWeight: 600 }}>今</span>
            今日
          </div>
        </div>
      </div>

      {/* Time slots */}
      {selectedDate && (
        <div className="booking-form fade-up">
          <div className="form-group">
            <label>选择时段</label>
            <div className="time-slots">
              {slots.map(s => (
                <div
                  key={s}
                  className={`time-slot ${selectedSlot === s ? 'selected' : ''}`}
                  onClick={() => setSelectedSlot(s)}
                >
                  {s}
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* Form */}
      {selectedSlot && (
        <div className="booking-form fade-up">
          <div className="form-group">
            <label>姓名</label>
            <input
              className="form-input"
              placeholder="请输入您的姓名"
              value={formData.name}
              onChange={e => setFormData({ ...formData, name: e.target.value })}
            />
          </div>
          <div className="form-group">
            <label>联系电话</label>
            <input
              className="form-input"
              placeholder="请输入联系电话"
              value={formData.phone}
              onChange={e => setFormData({ ...formData, phone: e.target.value })}
            />
          </div>
          <div className="form-group">
            <label>备注</label>
            <input
              className="form-input"
              placeholder="古籍名称或其他说明"
              value={formData.note}
              onChange={e => setFormData({ ...formData, note: e.target.value })}
            />
          </div>
          <button className="submit-btn" onClick={handleSubmit}>
            确认预约
          </button>
        </div>
      )}

      <div style={{ height: 30 }} />
    </div>
  );
}

// ============ CUSTOM CURSOR ============
(function() {
  const cursor = document.getElementById('cursor');
  const dot = document.getElementById('cursorDot');
  const stage = document.getElementById('stage');

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let cursorX = mouseX;
  let cursorY = mouseY;
  let rafId = null;
  let visible = true;

  function updateCursor() {
    if (!visible) { rafId = null; return; }
    cursorX += (mouseX - cursorX) * 0.18;
    cursorY += (mouseY - cursorY) * 0.18;
    cursor.style.transform = `translate(${cursorX}px, ${cursorY}px) translate(-50%, -50%)`;
    dot.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
    rafId = requestAnimationFrame(updateCursor);
  }

  document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    if (!rafId && visible) {
      rafId = requestAnimationFrame(updateCursor);
    }
  });

  // Hover state
  const hoverSelectors = 'button, .tab-item, .ms-card, .browse-item, .chip, .cal-day, .time-slot, .menu-item, .post-actions .act, .ep-head, .section-more, .browse-tab, .nav-back, .nav-action, .tl-card, .home-hero, .fab, .submit-btn';
  document.addEventListener('mouseover', (e) => {
    if (e.target.closest(hoverSelectors)) {
      cursor.classList.add('hover');
    }
  });
  document.addEventListener('mouseout', (e) => {
    if (e.target.closest(hoverSelectors)) {
      cursor.classList.remove('hover');
    }
  });

  // Ripple on click
  document.addEventListener('click', (e) => {
    if (e.target.closest(hoverSelectors)) {
      const ripple = document.createElement('div');
      ripple.className = 'ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    }
  });

  // Visibility
  document.addEventListener('visibilitychange', () => {
    visible = !document.hidden;
    if (visible && !rafId) rafId = requestAnimationFrame(updateCursor);
  });

  // Clock
  function updateClock() {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes().toString().padStart(2, '0');
    const el = document.getElementById('clock');
    if (el) el.textContent = `${h}:${m}`;
  }
  updateClock();
  setInterval(updateClock, 30000);

  // Reduce motion check
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    cursor.style.transition = 'none';
    cursor.style.display = 'none';
    dot.style.display = 'none';
    document.body.style.cursor = 'auto';
  }

  // Initialize cursor at center
  cursor.style.transform = `translate(${window.innerWidth/2}px, ${window.innerHeight/2}px) translate(-50%, -50%)`;
  dot.style.transform = `translate(${window.innerWidth/2}px, ${window.innerHeight/2}px) translate(-50%, -50%)`;
})();

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>柿染工坊 · 微信小程序</title>

<!-- React + Babel -->
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<!-- Fonts -->
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Ma+Shan+Zheng&display=swap" />

<style>
  /* ===== Reset & Base ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1410; font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif; color: #4A2C1A; -webkit-font-smoothing: antialiased; }
  #root { width: 100%; height: 100%; }
  button { border: none; background: none; font-family: inherit; color: inherit; cursor: pointer; }
  img { display: block; max-width: 100%; }
  ul, ol { list-style: none; }

  /* ===== Page Background ===== */
  .page-bg {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(212, 118, 26, 0.12), transparent 70%),
      radial-gradient(ellipse 50% 30% at 80% 90%, rgba(107, 127, 62, 0.10), transparent 70%),
      #f5efe3;
  }

  /* ===== Phone Frame ===== */
  .phone-wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 2000px;
  }
  .phone {
    position: relative;
    width: 375px;
    height: 812px;
    background: #1a1410;
    border-radius: 54px;
    padding: 12px;
    box-shadow:
      0 60px 120px -20px rgba(0, 0, 0, 0.6),
      0 0 0 2px rgba(255, 255, 255, 0.05),
      inset 0 0 0 1px rgba(255, 255, 255, 0.03);
  }
  .phone-screen {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 44px;
    overflow: hidden;
    background: #F0E6D2;
  }

  /* Status Bar */
  .status-bar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    z-index: 100;
    font-size: 15px;
    font-weight: 600;
    color: #4A2C1A;
  }
  .status-bar.light { color: #fff; }
  .status-bar .time { font-weight: 700; font-size: 15px; letter-spacing: 0.3px; }
  .status-bar .icons { display: flex; align-items: center; gap: 5px; }
  .status-bar .icon-sig { width: 17px; height: 11px; }
  .status-bar .icon-batt { width: 25px; height: 12px; }

  /* Notch */
  .notch {
    position: absolute;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 32px;
    background: #000;
    border-radius: 20px;
    z-index: 110;
  }

  /* WeChat Capsule Nav */
  .wx-capsule {
    position: absolute;
    top: 52px; right: 12px;
    height: 32px;
    display: flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 16px;
    padding: 0 4px;
    z-index: 90;
    border: 0.5px solid rgba(74, 44, 26, 0.1);
    transition: background 0.3s ease;
  }
  .wx-capsule.dark { background: rgba(0, 0, 0, 0.3); border-color: rgba(255, 255, 255, 0.1); }
  .wx-capsule .cap-btn {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    color: #4A2C1A;
    transition: opacity 0.2s;
  }
  .wx-capsule.dark .cap-btn { color: #fff; }
  .wx-capsule .cap-btn:active { opacity: 0.6; }
  .wx-capsule .cap-divider {
    width: 1px; height: 16px;
    background: rgba(74, 44, 26, 0.15);
  }
  .wx-capsule.dark .cap-divider { background: rgba(255, 255, 255, 0.2); }

  /* Custom Nav Title */
  .nav-title {
    position: absolute;
    top: 52px; left: 0; right: 88px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 600;
    color: #4A2C1A;
    z-index: 80;
    pointer-events: none;
  }
  .nav-title.light { color: #fff; }

  /* ===== Page Container System ===== */
  .pages {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .page {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    background: #F5EFE3;
    will-change: transform, opacity;
  }
  .page::-webkit-scrollbar { display: none; }
  .page.main { z-index: 1; }
  .page.pushed { z-index: 10; }

  /* Page transitions */
  @keyframes slideInRight {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }
  @keyframes slideOutRight {
    from { transform: translateX(0); }
    to { transform: translateX(100%); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes scaleIn {
    from { transform: scale(0.96); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .page-enter { animation: slideInRight 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  .page-leave { animation: slideOutRight 0.3s cubic-bezier(0.4, 0, 1, 1) forwards; }

  /* ===== TabBar ===== */
  .tabbar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 60px;
    background: rgba(240, 230, 210, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 0.5px solid rgba(74, 44, 26, 0.1);
    display: flex;
    align-items: stretch;
    z-index: 50;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    color: rgba(74, 44, 26, 0.5);
    font-size: 10px;
    position: relative;
    transition: color 0.25s ease;
  }
  .tab-item.active { color: #D4761A; }
  .tab-item .tab-icon { width: 24px; height: 24px; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .tab-item.active .tab-icon { transform: scale(1.15) translateY(-2px); }
  .tab-item.active::after {
    content: '';
    position: absolute;
    bottom: 8px;
    width: 16px;
    height: 3px;
    border-radius: 2px;
    background: #D4761A;
    animation: tabDotIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes tabDotIn {
    from { transform: scaleX(0); opacity: 0; }
    to { transform: scaleX(1); opacity: 1; }
  }

  /* ===== Shared ===== */
  .safe-top { height: 88px; }
  .safe-bottom { height: 76px; }
  .serif { font-family: "Noto Serif SC", serif; }
  .brush { font-family: "Ma Shan Zheng", cursive; }

  /* ===== Custom Cursor ===== */
  .cursor-dot {
    position: fixed;
    top: 0; left: 0;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #D4761A;
    pointer-events: none;
    z-index: 99999;
    transform: translate(-50%, -50%);
    transition: width 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                height 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                background 0.25s;
    will-change: transform;
    mix-blend-mode: normal;
  }
  .cursor-ring {
    position: fixed;
    top: 0; left: 0;
    width: 40px; height: 40px;
    border: 2px solid #D4761A;
    border-radius: 50%;
    pointer-events: none;
    z-index: 99998;
    transform: translate(-50%, -50%);
    transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                height 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.3s,
                opacity 0.3s;
    will-change: transform;
    opacity: 0.5;
  }
  .cursor-ring.hover {
    width: 56px; height: 56px;
    border-color: #E8B94D;
    opacity: 0.8;
    border-width: 1.5px;
  }
  .cursor-dot.hover {
    width: 6px; height: 6px;
    background: #E8B94D;
  }
  .cursor-ripple {
    position: fixed;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(212, 118, 26, 0.35);
    pointer-events: none;
    z-index: 99997;
    transform: translate(-50%, -50%) scale(1);
    animation: rippleOut 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes rippleOut {
    from { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
    to { transform: translate(-50%, -50%) scale(6); opacity: 0; }
  }
  @media (max-width: 768px), (pointer: coarse) {
    .cursor-dot, .cursor-ring { display: none; }
  }

  /* ===== Skeleton ===== */
  .skeleton {
    background: linear-gradient(90deg, rgba(212, 118, 26, 0.06) 25%, rgba(212, 118, 26, 0.12) 50%, rgba(212, 118, 26, 0.06) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 8px;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ===== Pull to Refresh ===== */
  .pull-indicator {
    position: absolute;
    top: 88px;
    left: 50%;
    transform: translateX(-50%) scale(0.6);
    opacity: 0;
    font-size: 12px;
    color: #D4761A;
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .pull-indicator.show { opacity: 1; }
  .pull-indicator .dye-drop {
    width: 10px; height: 14px;
    background: #D4761A;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    animation: drip 1s ease-in-out infinite;
  }
  @keyframes drip {
    0%, 100% { transform: translateY(0) scaleY(1); }
    50% { transform: translateY(3px) scaleY(1.2); }
  }

  /* ===== Action Sheet ===== */
  .sheet-mask {
    position: absolute; inset: 0;
    background: rgba(74, 44, 26, 0.4);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .sheet-mask.show { opacity: 1; pointer-events: auto; }
  .sheet-panel {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: #FAF4E8;
    border-radius: 24px 24px 0 0;
    z-index: 201;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet-panel.show { transform: translateY(0); }
  .sheet-handle {
    width: 40px; height: 4px;
    background: rgba(74, 44, 26, 0.15);
    border-radius: 2px;
    margin: 10px auto 0;
  }

  /* ===== Home Page ===== */
  .home-hero {
    position: relative;
    height: 420px;
    overflow: hidden;
  }
  .home-hero-img {
    width: 100%; height: 100%;
    object-fit: cover;
    will-change: transform;
  }
  .home-hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg,
      rgba(74, 44, 26, 0.15) 0%,
      rgba(74, 44, 26, 0.08) 40%,
      transparent 60%,
      rgba(245, 239, 227, 0.95) 95%);
  }
  .home-hero-content {
    position: absolute;
    bottom: 32px; left: 20px; right: 20px;
    color: #4A2C1A;
  }
  .home-hero-tag {
    display: inline-block;
    padding: 4px 12px;
    background: rgba(212, 118, 26, 0.15);
    color: #D4761A;
    font-size: 12px;
    border-radius: 20px;
    margin-bottom: 10px;
    font-weight: 500;
    letter-spacing: 1px;
  }
  .home-hero-title {
    font-family: "Noto Serif SC", serif;
    font-size: 32px;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 6px;
    color: #4A2C1A;
  }
  .home-hero-sub {
    font-size: 13px;
    color: rgba(74, 44, 26, 0.6);
    line-height: 1.5;
  }

  /* Sunlight rays - signature animation */
  .sun-rays {
    position: absolute;
    top: -10%; left: 20%;
    width: 150%; height: 80%;
    pointer-events: none;
    opacity: 0.35;
    mix-blend-mode: soft-light;
  }
  .sun-ray {
    position: absolute;
    top: 0;
    width: 60px;
    height: 100%;
    background: linear-gradient(180deg, rgba(232, 185, 77, 0.6), transparent 70%);
    filter: blur(8px);
    animation: sunRay 6s ease-in-out infinite;
  }
  .sun-ray:nth-child(1) { left: 10%; animation-delay: 0s; }
  .sun-ray:nth-child(2) { left: 25%; animation-delay: 0.8s; }
  .sun-ray:nth-child(3) { left: 45%; animation-delay: 1.6s; }
  .sun-ray:nth-child(4) { left: 65%; animation-delay: 2.4s; }
  .sun-ray:nth-child(5) { left: 80%; animation-delay: 3.2s; }
  @keyframes sunRay {
    0%, 100% { transform: translateX(0) scaleY(1); opacity: 0.4; }
    50% { transform: translateX(20px) scaleY(1.1); opacity: 0.7; }
  }

  /* Dye flow streams - signature animation */
  .dye-streams {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 60px;
    pointer-events: none;
    overflow: hidden;
    opacity: 0.6;
  }
  .dye-stream {
    position: absolute;
    bottom: -20px;
    width: 3px;
    background: linear-gradient(180deg, transparent, rgba(212, 118, 26, 0.6));
    border-radius: 2px;
    animation: dyeFlow 4s ease-in-out infinite;
  }
  @keyframes dyeFlow {
    0% { height: 0; opacity: 0; }
    30% { opacity: 0.8; }
    70% { height: 60px; opacity: 0.5; }
    100% { height: 80px; opacity: 0; }
  }

  /* Category chips */
  .home-cats {
    display: flex;
    gap: 12px;
    padding: 20px 20px 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .home-cats::-webkit-scrollbar { display: none; }
  .cat-chip {
    flex-shrink: 0;
    padding: 8px 18px;
    background: #fff;
    border-radius: 20px;
    font-size: 13px;
    color: rgba(74, 44, 26, 0.7);
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    border: 1px solid rgba(74, 44, 26, 0.06);
    white-space: nowrap;
  }
  .cat-chip.active {
    background: #D4761A;
    color: #fff;
    border-color: #D4761A;
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(212, 118, 26, 0.3);
  }

  /* Masonry / Waterfall */
  .waterfall {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 16px 16px 80px;
  }
  .wf-col { display: flex; flex-direction: column; gap: 12px; }
  .wf-card {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(74, 44, 26, 0.06);
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.3s ease;
    position: relative;
  }
  .wf-card:active {
    transform: scale(0.97);
    box-shadow: 0 1px 4px rgba(74, 44, 26, 0.1);
  }
  .wf-card-img {
    width: 100%;
    display: block;
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .wf-card:hover .wf-card-img { transform: scale(1.04); }
  .wf-card-info {
    padding: 12px 14px 14px;
  }
  .wf-card-title {
    font-size: 14px;
    font-weight: 600;
    color: #4A2C1A;
    line-height: 1.4;
    margin-bottom: 4px;
    font-family: "Noto Serif SC", serif;
  }
  .wf-card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: rgba(74, 44, 26, 0.5);
  }
  .wf-card-price {
    color: #D4761A;
    font-weight: 700;
    font-size: 15px;
  }
  .wf-card-price small { font-weight: 400; font-size: 11px; }
  .wf-card-tag {
    position: absolute;
    top: 10px; left: 10px;
    padding: 2px 8px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(4px);
    font-size: 10px;
    color: #6B7F3E;
    border-radius: 10px;
    font-weight: 500;
  }

  /* Reveal animation for cards */
  .wf-card.reveal {
    animation: cardReveal 0.6s cubic-bezier(0.22, 1, 0.36, 1) backwards;
  }
  @keyframes cardReveal {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== Category Page ===== */
  .cat-header {
    position: sticky;
    top: 0;
    z-index: 30;
    background: #F5EFE3;
    padding-bottom: 0;
  }
  .cat-search {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 16px 12px;
    padding: 10px 16px;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 1px 6px rgba(74, 44, 26, 0.04);
  }
  .cat-search input {
    flex: 1;
    border: none;
    outline: none;
    background: none;
    font-size: 14px;
    color: #4A2C1A;
    font-family: inherit;
  }
  .cat-search input::placeholder { color: rgba(74, 44, 26, 0.3); }

  .cat-filter-row {
    display: flex;
    gap: 8px;
    padding: 0 16px 12px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .cat-filter-row::-webkit-scrollbar { display: none; }
  .filter-chip {
    flex-shrink: 0;
    padding: 6px 14px;
    background: #fff;
    border-radius: 14px;
    font-size: 12px;
    color: rgba(74, 44, 26, 0.6);
    border: 1px solid rgba(74, 44, 26, 0.08);
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .filter-chip.active {
    background: #4A2C1A;
    color: #E8B94D;
    border-color: #4A2C1A;
  }

  .cat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 4px 12px 80px;
  }
  .cat-grid-item {
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .cat-grid-item:active { transform: scale(0.96); }
  .cat-grid-item img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
  }
  .cat-grid-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(74, 44, 26, 0.7) 100%);
    display: flex;
    align-items: flex-end;
    padding: 12px;
  }
  .cat-grid-overlay p {
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    font-family: "Noto Serif SC", serif;
  }
  .cat-grid-overlay small {
    font-size: 10px;
    opacity: 0.7;
    font-weight: 400;
    font-family: "Noto Sans SC", sans-serif;
  }

  /* ===== Work Detail Page ===== */
  .detail-hero {
    position: relative;
    height: 480px;
    overflow: hidden;
  }
  .detail-hero img {
    width: 100%; height: 100%;
    object-fit: cover;
    will-change: transform;
  }
  .detail-back {
    position: absolute;
    top: 54px; left: 16px;
    width: 36px; height: 36px;
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(10px);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    z-index: 80;
    transition: transform 0.25s ease;
  }
  .detail-back:active { transform: scale(0.9); }

  .detail-body {
    position: relative;
    margin-top: -20px;
    background: #F5EFE3;
    border-radius: 24px 24px 0 0;
    padding: 24px 20px 100px;
  }
  .detail-title-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  .detail-title {
    font-family: "Noto Serif SC", serif;
    font-size: 22px;
    font-weight: 700;
    color: #4A2C1A;
    flex: 1;
    line-height: 1.3;
  }
  .detail-like {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(74, 44, 26, 0.3);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .detail-like.liked { color: #D4761A; animation: heartBeat 0.4s ease; }
  @keyframes heartBeat {
    0% { transform: scale(1); }
    25% { transform: scale(1.3); }
    50% { transform: scale(0.95); }
    100% { transform: scale(1.1); }
  }

  .detail-price {
    font-size: 24px;
    font-weight: 700;
    color: #D4761A;
    margin-bottom: 16px;
  }

      // hover detection
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const isInteractive = el && el.closest && el.closest('button, a, .wf-card, .cat-chip, .filter-chip, .ws-tab, .ws-card, .artisan-card, .profile-menu-item, .setting-row, .api-card-header, .color-swatch, .cat-grid-item');
      setHover(!!isInteractive);
    };
    const onClick = (e) => {
      const id = Date.now();
      setRipples(prev => [...prev, { id, x: e.clientX, y: e.clientY }]);
      setTimeout(() => {
        setRipples(prev => prev.filter(r => r.id !== id));
      }, 600);
    };
    // animate ring with RAF for smooth easing
    const animate = () => {
      ringTargetRef.current.x += (targetRef.current.x - ringTargetRef.current.x) * 0.15;
      ringTargetRef.current.y += (targetRef.current.y - ringTargetRef.current.y) * 0.15;
      setRingPos({ x: ringTargetRef.current.x, y: ringTargetRef.current.y });
      rafRef.current = requestAnimationFrame(animate);
    };
    rafRef.current = requestAnimationFrame(animate);

    // Initialize cursor in center
    targetRef.current = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    ringTargetRef.current = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    setPos({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
    setRingPos({ x: window.innerWidth / 2, y: window.innerHeight / 2 });

    window.addEventListener('mousemove', onMove);
    window.addEventListener('click', onClick);

    // Pause on page hidden
    const onVisChange = () => {
      if (document.hidden && rafRef.current) {
        cancelAnimationFrame(rafRef.current);
        rafRef.current = null;
      } else if (!document.hidden && !rafRef.current) {
        rafRef.current = requestAnimationFrame(animate);
      }
    };
    document.addEventListener('visibilitychange', onVisChange);

    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('click', onClick);
      document.removeEventListener('visibilitychange', onVisChange);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, []);

  return (
    <>
      <div className={`cursor-dot ${hover ? 'hover' : ''}`} style={{ left: pos.x, top: pos.y }} />
      <div className={`cursor-ring ${hover ? 'hover' : ''}`} style={{ left: ringPos.x, top: ringPos.y }} />
      {ripples.map(r => (
        <div key={r.id} className="cursor-ripple" style={{ left: r.x, top: r.y }} />
      ))}
    </>
  );
};

const HomePage = ({ onNav, showToast }) => {
  const [activeCat, setActiveCat] = useState(0);
  const [loading, setLoading] = useState(true);
  const [pullY, setPullY] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const startY = useRef(0);
  const pageRef = useRef(null);
  const heroRef = useRef(null);
  const rafRef = useRef(null);
  const timerRef = useRef(null);

  const categories = ['推荐', '新品', '热卖', '限量', '配件', '家居'];

  useEffect(() => {
    timerRef.current = setTimeout(() => setLoading(false), 1200);
    return () => {
      if (timerRef.current) clearTimeout(timerRef.current);
    };
  }, []);

  // Parallax effect on scroll
  useEffect(() => {
    const onScroll = () => {
      if (!pageRef.current || !heroRef.current) return;
      const scrollTop = pageRef.current.scrollTop;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      rafRef.current = requestAnimationFrame(() => {
        if (heroRef.current) {
          heroRef.current.style.transform = `translateY(${scrollTop * 0.3}px) scale(${1 + scrollTop * 0.0005})`;
        }
      });
    };
    const el = pageRef.current;
    el.addEventListener('scroll', onScroll, { passive: true });
    return () => {
      el.removeEventListener('scroll', onScroll);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, []);

  // Pull to refresh
  const onTouchStart = (e) => {
    if (pageRef.current && pageRef.current.scrollTop <= 0) {
      startY.current = e.touches[0].clientY;
    } else {
      startY.current = 0;
    }
  };
  const onTouchMove = (e) => {
    if (!startY.current || refreshing) return;
    const dy = e.touches[0].clientY - startY.current;
    if (dy > 0) {
      const damped = Math.min(dy * 0.5, 80);
      setPullY(damped);
    }
  };
  const onTouchEnd = () => {
    if (pullY > 50 && !refreshing) {
      setRefreshing(true);
      setPullY(50);
      setTimeout(() => {
        setRefreshing(false);
        setPullY(0);
        showToast && showToast('刷新成功');
      }, 1500);
    } else {
      setPullY(0);
    }
    startY.current = 0;
  };

  const leftCol = WORKS.filter((_, i) => i % 2 === 0);
  const rightCol = WORKS.filter((_, i) => i % 2 === 1);

  return (
    <div
      ref={pageRef}
      className="page main"
      data-screen-label="01-首页"
      onTouchStart={onTouchStart}
      onTouchMove={onTouchMove}
      onTouchEnd={onTouchEnd}
    >
      <div className="pull-indicator" style={{ opacity: pullY > 10 ? Math.min(pullY / 60, 1) : 0 }}>
        <div className="dye-drop" />
        <span>{refreshing ? '正在刷新...' : pullY > 50 ? '释放刷新' : '下拉刷新'}</span>
      </div>

      {/* Hero */}
      <div className="home-hero">
        <img ref={heroRef} src={IMG.workshop} alt="柿染工坊" className="home-hero-img dip-enter" />
        <div className="sun-rays">
          <div className="sun-ray" />
          <div className="sun-ray" />
          <div className="sun-ray" />
          <div className="sun-ray" />
          <div className="sun-ray" />
        </div>
        <div className="home-hero-overlay" />
        <div className="dye-streams">
          {[...Array(8)].map((_, i) => (
            <div key={i} className="dye-stream" style={{
              left: `${10 + i * 12}%`,
              animationDelay: `${i * 0.3}s`,
              height: `${30 + Math.random() * 40}px`,
            }} />
          ))}
        </div>
        <div className="home-hero-content stagger">
          <span className="home-hero-tag">非遗传承 · 古法柿染</span>
          <h1 className="home-hero-title">柿染工坊</h1>
          <p className="home-hero-sub">一方染缸，一缕阳光，<br />让时间在布料上慢慢沉淀出颜色。</p>
        </div>
      </div>

      {/* 分类芯片 */}
      <div className="home-cats">
        {categories.map((cat, i) => (
          <button
            key={cat}
            className={`cat-chip ${activeCat === i ? 'active' : ''}`}
            onClick={() => setActiveCat(i)}
          >
            {cat}
          </button>
        ))}
      </div>

      {/* 瀑布流作品 */}
      {loading ? (
        <div className="waterfall">
          <div className="wf-col">
            <SkeletonCard />
            <SkeletonCard />
          </div>
          <div className="wf-col">
            <SkeletonCard />
            <SkeletonCard />
          </div>
        </div>
      ) : (
        <div className="waterfall">
          <div className="wf-col">
            {leftCol.map((w, i) => (
              <div
                key={w.id}
                className="wf-card reveal"
                style={{ animationDelay: `${i * 0.1}s` }}
                onClick={() => onNav('detail', { work: w })}
              >
                {w.tag && <span className="wf-card-tag">{w.tag}</span>}
                <img src={w.img} alt={w.title} className="wf-card-img" />
                <div className="wf-card-info">

                  <div className="wf-card-meta">
                    <span>{w.artisan}</span>
                    <span className="wf-card-price">¥{w.price}</span>
                  </div>
                </div>
              </div>
            ))}
          </div>
          <div className="wf-col">
            {rightCol.map((w, i) => (
              <div
                key={w.id}
                className="wf-card reveal"
                style={{ animationDelay: `${i * 0.1 + 0.05}s` }}
                onClick={() => onNav('detail', { work: w })}
              >
                {w.tag && <span className="wf-card-tag">{w.tag}</span>}
                <img src={w.img} alt={w.title} className="wf-card-img" />
                <div className="wf-card-info">

                  <div className="wf-card-meta">
                    <span>{w.artisan}</span>
                    <span className="wf-card-price">¥{w.price}</span>

  );
};

        {/* 体验课相关 */}
        <div className="api-section" style={{ paddingBottom: 24 }}>
          <h2 className="api-section-title">体验课相关</h2>
          <div className={`api-card ${openId === 4 ? 'open' : ''}`}>
            <button className="api-card-header" onClick={() => setOpenId(openId === 4 ? -1 : 4)}>
              <span className="api-method get">GET</span>
              <span className="api-path">{APIS[4].path}</span>
              <Icon name="chevronDown" size={16} className="api-arrow" />
            </button>
            <div className="api-card-body">
              <div className="api-card-content">
                <p className="api-desc">{APIS[4].desc}</p>
                {APIS[4].params.map((p, j) => (
                  <div key={j} className="api-param-row">
                    <span className="api-param-name">{p.name}</span>
                    <span className="api-param-type">{p.type}</span>
                    <span className="api-param-desc">{p.desc}</span>
                  </div>
                ))}
                <div style={{ fontSize: 11, color: 'rgba(240,230,210,0.5)', margin: '10px 0 6px' }}>响应示例</div>
                <div className="api-response-block" dangerouslySetInnerHTML={{ __html: highlightJson(APIS[4].response).replace(/\n/g, '<br/>').replace(/  /g, '&nbsp;&nbsp;') }} />
              </div>
            </div>
          </div>

          <div style={{
            marginTop: 16, padding: 14,
            background: '#2A1F14', borderRadius: 10,
            border: '0.5px solid rgba(212,118,26,0.15)',
          }}>
            <div style={{ fontSize: 11, color: '#E8B94D', marginBottom: 6, fontWeight: 600 }}>统一响应格式</div>
            <div className="api-response-block" style={{ background: '#1A1410' }}>
              <span className="api-json-key">"code"</span>: <span className="api-json-num">0</span>, <span style={{ color: 'rgba(240,230,210,0.3)' }}>// 0成功 / 非0错误码</span><br/>
              <span className="api-json-key">"msg"</span>: <span className="api-json-str">"ok"</span>,<br/>
              <span className="api-json-key">"data"</span>: {"{...}"}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

// ================= 主应用 =================
const App = () => {
  const [mainTab, setMainTab] = useState('home');
  const [stack, setStack] = useState([]); // pushed pages: [{key, params}]
  const [toast, setToast] = useState({ show: false, text: '' });
  const toastTimer = useRef(null);

  const showToast = useCallback((text) => {
    setToast({ show: true, text });
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => {
      setToast({ show: false, text: '' });
    }, 2000);
  }, []);

  const handleNav = useCallback((pageKey, params = {}) => {
    setStack(prev => [...prev, { key: pageKey, params }]);
  }, []);

  const handleBack = useCallback(() => {
    setStack(prev => prev.slice(0, -1));
  }, []);

  const handleTabChange = useCallback((tab) => {
    setMainTab(tab);
    setStack([]); // clear stack when switching tabs
  }, []);

  const handleCapsuleBack = useCallback(() => {
    if (stack.length > 0) {
      handleBack();
    } else {
      showToast('已在首页');
    }
  }, [stack.length, handleBack, showToast]);

  const handleCapsuleMenu = useCallback(() => {
    showToast('分享小程序');
  }, [showToast]);

  // Determine nav bar style
  const topPageKey = stack.length > 0 ? stack[stack.length - 1].key : mainTab;
  const isLightStatus = ['home', 'detail', 'workshop', 'artisan'].includes(topPageKey);
  const isDarkCapsule = ['spec', 'api', 'detail', 'workshop', 'artisan'].includes(topPageKey);

  // Get current page title for nav
  const getNavTitle = () => {
    if (stack.length > 0) {
      const top = stack[stack.length - 1];
      if (top.key === 'detail') return '';
      if (top.key === 'spec') return '';
      if (top.key === 'api') return '';
      return '';
    }
    if (mainTab === 'home') return '';
    if (mainTab === 'category') return '分类';
    if (mainTab === 'workshop') return '';
    if (mainTab === 'artisan') return '';
    if (mainTab === 'profile') return '';
    return '';
  };

  const topParams = stack.length > 0 ? stack[stack.length - 1].params : {};

  return (
    <>
      <CustomCursor />
      <div className="page-bg" />
      <div className="phone-wrap">
        <div className="phone">
          <div className="phone-screen">
            <div className="notch" />
            <StatusBar light={isLightStatus} />
            <WxCapsule
              dark={isDarkCapsule}
              onBack={handleCapsuleBack}
              onMenu={handleCapsuleMenu}
            />
            {getNavTitle() && (
              <div className={`nav-title ${isLightStatus ? 'light' : ''}`}>
                {getNavTitle()}
              </div>
            )}

            <div className="pages">
              {/* Main tab pages */}
              {mainTab === 'home' && (
                <HomePage onNav={handleNav} showToast={showToast} />
              )}
              {mainTab === 'category' && (
                <CategoryPage onNav={handleNav} showToast={showToast} />
              )}
              {mainTab === 'workshop' && (
                <WorkshopPage onNav={handleNav} showToast={showToast} />
              )}
              {mainTab === 'artisan' && (
                <ArtisanPage onNav={handleNav} showToast={showToast} />
              )}
              {mainTab === 'profile' && (
                <ProfilePage onNav={handleNav} showToast={showToast} />
              )}

              {/* Pushed pages */}
              {stack.map((page, i) => {
                const isTop = i === stack.length - 1;
                if (page.key === 'detail' && isTop) {
                  return (
                    <DetailPage
                      key={`detail-${i}`}
                      work={page.params.work || WORKS[0]}
                      onBack={handleBack}
                      showToast={showToast}
                      onNav={handleNav}
                    />
                  );
                }
                if (page.key === 'spec' && isTop) {
                  return (
                    <SpecPage
                      key={`spec-${i}`}
                      onBack={handleBack}
                      showToast={showToast}
                    />
                  );
                }
                if (page.key === 'api' && isTop) {
                  return (
                    <ApiPage
                      key={`api-${i}`}
                      onBack={handleBack}
                      showToast={showToast}
                    />
                  );
                }
                if (page.key === 'artisan' && isTop) {
                  return (
                    <ArtisanPage
                      key={`artisan-detail-${i}`}
                      onNav={handleNav}
                      showToast={showToast}
                    />
                  );
                }
                return null;
              })}
            </div>

            {/* TabBar only on main tabs (no pushed page) */}
            {stack.length === 0 && (
              <TabBar active={mainTab} onChange={handleTabChange} />
            )}

            {/* Toast */}
            <div className={`toast ${toast.show ? 'show' : ''}`}>
              {toast.text}
            </div>
          </div>
        </div>
      </div>

      <div className="hint-text" id="hint">
        点击卡片 / 按钮进行交互 · 下拉可刷新 · 左右滑动探索
      </div>
    </>
  );
};

// Render
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// Hint fade
setTimeout(() => {
  const hint = document.getElementById('hint');
  if (hint) hint.style.opacity = '0';
}, 4000);

// Announce upgrade capability
function announceUpgrade() {
  try {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  } catch (e) {}
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}
</script>
</body>
</html>

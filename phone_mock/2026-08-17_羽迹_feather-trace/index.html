<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="creative-medium" content="interactive-prototype" />
<title>羽迹 · 观鸟手记</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" />
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  /* ===== Design Tokens ===== */
  :root {
    --forest-deep: #2d5016;
    --forest-moss: #6b8e23;
    --forest-leaf: #4a7c23;
    --amber: #d4943a;
    --amber-light: #e8b05a;
    --chestnut: #a0522d;
    --cream: #f5f0e1;
    --rice-paper: #ede6d0;
    --ink: #2b2b23;
    --ink-soft: #5c5a50;
    --gray: #8a8578;
    --gray-light: #c4bfb0;
    --bg-dark: #1a1d14;
    --bg-darker: #0f110b;
    --surface: #faf7ed;
    --success: #3d7a2a;
    --warning: #d4943a;
    --danger: #c24b2e;
    --font-serif: 'Noto Serif SC', 'Songti SC', serif;
    --font-sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
    --shadow-sm: 0 2px 8px rgba(43, 43, 35, 0.08);
    --shadow-md: 0 6px 24px rgba(43, 43, 35, 0.12);
    --shadow-lg: 0 12px 48px rgba(43, 43, 35, 0.18);
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --radius-xl: 28px;
    --tabbar-h: 84px;
    --statusbar-h: 44px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: var(--font-sans);
    color: var(--ink);
    background: var(--bg-dark);
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(45, 80, 22, 0.18) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 80%, rgba(164, 82, 45, 0.12) 0%, transparent 50%),
      linear-gradient(145deg, #1a1d14 0%, #0f110b 50%, #161912 100%);
    min-height: 100vh;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 15% 85%, rgba(107, 142, 35, 0.06) 0%, transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(212, 148, 58, 0.05) 0%, transparent 40%);
    pointer-events: none;
  }

  /* ===== Desk label ===== */
  .desk-label {
    position: fixed;
    top: 32px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--gray);
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 500;
    z-index: 1;
    pointer-events: none;
    opacity: 0.6;
  }

  .desk-label span {
    color: var(--amber);
    font-family: var(--font-serif);
    letter-spacing: 2px;
    margin-left: 8px;
    font-size: 13px;
  }

  /* ===== Phone Frame ===== */
  .phone-stage {
    position: relative;
    width: 390px;
    height: 844px;
    z-index: 2;
  }

  .phone-frame {
    position: absolute;
    inset: 0;
    border-radius: 54px;
    background: linear-gradient(145deg, #2a2d25 0%, #1a1c15 50%, #0f110b 100%);
    padding: 12px;
    box-shadow:
      0 40px 80px rgba(0, 0, 0, 0.5),
      0 20px 40px rgba(0, 0, 0, 0.3),
      inset 0 1px 1px rgba(255, 255, 255, 0.1),
      inset 0 -1px 2px rgba(0, 0, 0, 0.5);
  }

  .phone-frame::before {
    content: '';
    position: absolute;
    inset: 10px;
    border-radius: 44px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    pointer-events: none;
  }

  .phone-screen {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 42px;
    overflow: hidden;
    background: var(--surface);
  }

  /* Dynamic Island / Notch */
  .notch {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 124px;
    height: 36px;
    background: #000;
    border-radius: 20px;
    z-index: 100;
  }

  /* Status bar */
  .status-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: var(--statusbar-h);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    padding-top: 14px;
    z-index: 99;
    font-size: 15px;
    font-weight: 600;
    pointer-events: none;
    transition: color 0.3s;
  }

  .status-bar.dark { color: var(--ink); }
  .status-bar.light { color: #fff; }

  .status-right {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .status-icon {
    width: 18px;
    height: 12px;
    opacity: 0.9;
  }

  .battery {
    width: 26px;
    height: 12px;
    border: 1.5px solid currentColor;
    border-radius: 3px;
    position: relative;
    opacity: 0.9;
  }
  .battery::after {
    content: '';
    position: absolute;
    right: -3px;
    top: 3px;
    width: 2px;
    height: 4px;
    background: currentColor;
    border-radius: 0 1px 1px 0;
    opacity: 0.5;
  }
  .battery::before {
    content: '';
    position: absolute;
    left: 1.5px;
    top: 1.5px;
    bottom: 1.5px;
    width: 70%;
    background: currentColor;
    border-radius: 1px;
  }

  /* ===== App Container ===== */
  .app-root {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .page-container {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .page-container::-webkit-scrollbar { display: none; }

  .page-container.has-tabbar {
    padding-bottom: var(--tabbar-h);
  }

  /* ===== Tab Bar ===== */
  .tabbar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: var(--tabbar-h);
    background: rgba(250, 247, 237, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 0.5px solid rgba(43, 43, 35, 0.08);
    display: flex;
    align-items: flex-start;
    justify-content: space-around;
    padding-top: 8px;
    padding-bottom: 24px;
    z-index: 50;
  }

  .tabbar.dark-bg {
    background: rgba(26, 29, 20, 0.92);
    border-top: 0.5px solid rgba(255, 255, 255, 0.08);
  }

  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    position: relative;
    padding: 4px 0;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .tab-item:active { transform: scale(0.92); }

  .tab-icon {
    width: 24px;
    height: 24px;
    position: relative;
    z-index: 2;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .tab-item.active .tab-icon {
    transform: translateY(-2px) scale(1.08);
  }

  .tab-label {
    font-size: 10px;
    font-weight: 500;
    color: var(--gray);
    transition: color 0.3s;
    z-index: 2;
  }

  .tabbar.dark-bg .tab-label {
    color: rgba(255,255,255,0.5);
  }

  .tab-item.active .tab-label {
    color: var(--forest-deep);
    font-weight: 600;
  }
  .tabbar.dark-bg .tab-item.active .tab-label {
    color: var(--amber-light);
  }

  .tab-pill {
    position: absolute;
    top: 2px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(45, 80, 22, 0.12);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s;
    z-index: 1;
  }

  .tabbar.dark-bg .tab-pill {
    background: rgba(212, 148, 58, 0.18);
  }

  .tab-item.active .tab-pill {
    transform: translateX(-50%) scale(1);
  }

  /* ===== Common ===== */
  .serif { font-family: var(--font-serif); }
  .text-amber { color: var(--amber); }
  .text-forest { color: var(--forest-deep); }
  .text-chestnut { color: var(--chestnut); }
  .text-gray { color: var(--gray); }
  .text-ink { color: var(--ink); }
  .text-moss { color: var(--forest-moss); }

  .h1 { font-size: 28px; font-weight: 700; line-height: 1.25; font-family: var(--font-serif); }
  .h2 { font-size: 22px; font-weight: 700; line-height: 1.3; font-family: var(--font-serif); }
  .h3 { font-size: 18px; font-weight: 600; line-height: 1.35; font-family: var(--font-serif); }
  .body { font-size: 14px; line-height: 1.55; color: var(--ink-soft); }
  .caption { font-size: 11px; line-height: 1.4; color: var(--gray); }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    background: rgba(107, 142, 35, 0.12);
    color: var(--forest-deep);
  }
  .chip-amber { background: rgba(212, 148, 58, 0.15); color: #8b6914; }
  .chip-chestnut { background: rgba(160, 82, 45, 0.12); color: var(--chestnut); }
  .chip-red { background: rgba(194, 75, 46, 0.12); color: var(--danger); }

  .divider {
    height: 1px;
    background: rgba(43, 43, 35, 0.08);
  }

  /* ===== Custom Cursor ===== */
  .custom-cursor {
    position: fixed;
    top: 0;
    left: 0;
    width: 28px;
    height: 28px;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                height 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.3s;
    mix-blend-mode: normal;
  }

  .custom-cursor.hover {
    width: 44px;
    height: 44px;
  }

  .cursor-ring {
    position: absolute;
    inset: 0;
    border: 2px solid rgba(255, 255, 255, 0.85);
    border-radius: 50%;
    box-shadow:
      0 0 8px rgba(212, 148, 58, 0.4),
      0 0 20px rgba(212, 148, 58, 0.2),
      inset 0 0 6px rgba(255, 255, 255, 0.2);
    transition: border-color 0.25s, box-shadow 0.25s;
  }

  .custom-cursor.hover .cursor-ring {
    border-color: var(--amber);
    box-shadow:
      0 0 12px rgba(212, 148, 58, 0.6),
      0 0 30px rgba(212, 148, 58, 0.3),
      inset 0 0 8px rgba(212, 148, 58, 0.25);
  }

  .cursor-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 5px;
    height: 5px;
    background: var(--amber);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px var(--amber), 0 0 16px rgba(212, 148, 58, 0.5);
  }

  .cursor-ripple {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 10px;
    height: 10px;
    border: 2px solid var(--amber);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
  }

  .cursor-ripple.active {
    animation: cursorRipple 0.6s ease-out forwards;
  }

  @keyframes cursorRipple {
    0% { width: 10px; height: 10px; opacity: 0.8; border-width: 2px; }
    100% { width: 60px; height: 60px; opacity: 0; border-width: 1px; }
  }

  /* ===== Page Transition ===== */
  .page-enter {
    animation: pageEnter 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes pageEnter {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== Large Title Nav Bar ===== */
  .large-nav {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(250, 247, 237, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding-top: var(--statusbar-h);
    transition: all 0.3s;
  }

  .large-nav .nav-title {
    padding: 8px 20px 14px;
    font-family: var(--font-serif);
    font-size: 30px;
    font-weight: 700;
    color: var(--ink);
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .large-nav.collapsed .nav-title {
    font-size: 18px;
    padding: 14px 20px 12px;
    text-align: center;
  }

  .large-nav .nav-sub {
    font-size: 13px;
    color: var(--gray);
    margin-top: 2px;
    font-family: var(--font-sans);
    font-weight: 400;
    transition: opacity 0.25s;
  }

  .large-nav.collapsed .nav-sub {
    opacity: 0;
    height: 0;
    margin-top: 0;
  }

  /* ===== Home Page ===== */
  .home-hero {
    position: relative;
    height: 420px;
    overflow: hidden;
    margin: 0 16px;
    border-radius: var(--radius-xl);
    margin-top: 12px;
  }

  .home-hero-img {
    position: absolute;
    inset: -20px;
    width: calc(100% + 40px);
    height: calc(100% + 40px);
    object-fit: cover;
    will-change: transform;
  }

  .home-hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.2) 40%, rgba(0,0,0,0.75) 100%);
    border-radius: var(--radius-xl);
  }

  .home-hero-content {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 24px 22px 26px;
    color: #fff;
  }

  .hero-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    background: rgba(212, 148, 58, 0.9);
    color: #fff;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 12px;
    backdrop-filter: blur(10px);
  }

  .hero-title {
    font-family: var(--font-serif);
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }

  .hero-sci {
    font-style: italic;
    font-size: 13px;
    opacity: 0.75;
    margin-bottom: 12px;
    font-weight: 300;
  }

  .hero-desc {
    font-size: 13px;
    line-height: 1.6;
    opacity: 0.85;
    max-width: 90%;
  }

  .hero-meta {
    display: flex;
    gap: 16px;
    margin-top: 14px;
    font-size: 11px;
    opacity: 0.75;
  }

  .hero-meta-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  /* Flying bird silhouette */
  .bird-silhouette {
    position: absolute;
    top: 28%;
    left: -60px;
    width: 50px;
    height: 20px;
    opacity: 0.6;
    z-index: 5;
    animation: birdFly 12s linear infinite;
    animation-delay: 2s;
  }

  @keyframes birdFly {
    0% { transform: translateX(0) translateY(0); opacity: 0; }
    10% { opacity: 0.6; }
    50% { transform: translateX(280px) translateY(-15px); }
    90% { opacity: 0.6; }
    100% { transform: translateX(560px) translateY(5px); opacity: 0; }
  }

  .bird-silhouette-2 {
    top: 20%;
    animation-duration: 15s;
    animation-delay: 5s;
    width: 35px;
    height: 14px;
    opacity: 0.4;
  }

  /* Hotspot carousel */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 20px 14px;
  }

  .section-title {
    font-family: var(--font-serif);
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
  }

  .section-more {
    font-size: 12px;
    color: var(--gray);
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .hotspot-scroll {
    display: flex;
    gap: 12px;
    padding: 0 20px 4px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .hotspot-scroll::-webkit-scrollbar { display: none; }

  .hotspot-card {
    flex-shrink: 0;
    width: 200px;
    border-radius: var(--radius-md);
    overflow: hidden;
    background: #fff;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
    position: relative;
  }

  .hotspot-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md), 0 0 20px rgba(212, 148, 58, 0.15);
  }

  .hotspot-img-wrap {
    height: 110px;
    overflow: hidden;
    position: relative;
  }

  .hotspot-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s;
  }

  .hotspot-card:hover .hotspot-img {
    transform: scale(1.06);
  }

  .hotspot-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(45, 80, 22, 0.85);
    color: #fff;
    padding: 3px 8px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 500;
    backdrop-filter: blur(8px);
  }

  .hotspot-info {
    padding: 12px 14px 14px;
  }

  .hotspot-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
    font-family: var(--font-serif);
  }

  .hotspot-dist {
    font-size: 11px;
    color: var(--gray);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .hotspot-count {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--forest-moss);
    margin-top: 6px;
  }

  /* Bird index gauge */
  .index-section {
    margin: 24px 20px 0;
    background: linear-gradient(135deg, #e8e0c8 0%, #f5f0e1 50%, #ede6d0 100%);
    border-radius: var(--radius-lg);
    padding: 22px 24px;
    position: relative;
    overflow: hidden;
  }

  .index-section::before {
    content: '';
    position: absolute;
    top: -30px;
    right: -30px;
    width: 120px;
    height: 120px;
    background: radial-gradient(circle, rgba(212, 148, 58, 0.15) 0%, transparent 70%);
    border-radius: 50%;
  }

  .index-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .index-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }

  .index-sub {
    font-size: 11px;
    color: var(--gray);
    margin-top: 2px;
  }

  .index-val {
    font-family: var(--font-serif);
    font-size: 42px;
    font-weight: 700;
    color: var(--forest-deep);
    line-height: 1;
  }

  .index-unit {
    font-size: 13px;
    color: var(--gray);
    margin-left: 4px;
    font-weight: 400;
  }

  .index-ring-wrap {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .index-ring {
    position: relative;
    width: 100px;
    height: 100px;
    flex-shrink: 0;
  }

  .index-ring svg {
    transform: rotate(-90deg);
  }

  .index-ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .index-desc {
    flex: 1;
    font-size: 12px;
    line-height: 1.7;
    color: var(--ink-soft);
  }

  .index-desc strong {
    color: var(--chestnut);
    font-weight: 600;
  }

  /* Waterfall records */
  .records-waterfall {
    padding: 0 20px;
  }

  .waterfall-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .wf-card {
    border-radius: var(--radius-md);
    overflow: hidden;
    background: #fff;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
  }

  .wf-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md), 0 0 18px rgba(107, 142, 35, 0.12);
  }

  .wf-card:nth-child(3n+1) { margin-top: 16px; }
  .wf-card:nth-child(2) { margin-top: -8px; }

  .wf-img-wrap {
    position: relative;
    overflow: hidden;
  }

  .wf-img {
    width: 100%;
    display: block;
    object-fit: cover;
  }

  .wf-tall .wf-img-wrap { height: 180px; }

    transform: scale(1.08);
  }

  .func-1 { background: linear-gradient(135deg, rgba(45, 80, 22, 0.12), rgba(107, 142, 35, 0.18)); color: var(--forest-deep); }
  .func-2 { background: linear-gradient(135deg, rgba(212, 148, 58, 0.12), rgba(212, 148, 58, 0.2)); color: #8b6914; }
  .func-3 { background: linear-gradient(135deg, rgba(160, 82, 45, 0.1), rgba(160, 82, 45, 0.18)); color: var(--chestnut); }
  .func-4 { background: linear-gradient(135deg, rgba(107, 142, 35, 0.1), rgba(74, 124, 35, 0.15)); color: var(--forest-leaf); }
  .func-5 { background: linear-gradient(135deg, rgba(43, 43, 35, 0.06), rgba(138, 133, 120, 0.12)); color: var(--ink-soft); }
  .func-6 { background: linear-gradient(135deg, rgba(194, 75, 46, 0.08), rgba(160, 82, 45, 0.14)); color: var(--danger); }
  .func-7 { background: linear-gradient(135deg, rgba(107, 142, 35, 0.08), rgba(45, 80, 22, 0.12)); color: var(--forest-moss); }
  .func-8 { background: linear-gradient(135deg, rgba(212, 148, 58, 0.1), rgba(160, 82, 45, 0.08)); color: var(--amber); }

  .func-label {
    font-size: 11px;
    color: var(--ink);
    font-weight: 500;
  }

  /* Badges */
  .badges-section {
    padding: 20px 20px 0;
  }

  .badges-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 14px;
  }

  .badge-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .badge-icon {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    position: relative;
    transition: transform 0.3s;
  }

  .badge-icon.unlocked {
    background: linear-gradient(135deg, var(--amber) 0%, var(--chestnut) 100%);
    box-shadow: 0 4px 12px rgba(212, 148, 58, 0.3);
  }

  .badge-icon.locked {
    background: rgba(43, 43, 35, 0.08);
    opacity: 0.5;
    filter: grayscale(1);
  }

  .badge-item:hover .badge-icon {
    transform: scale(1.1) rotate(-5deg);
  }

  .badge-name {
    font-size: 10px;
    color: var(--ink);
    text-align: center;
    font-weight: 500;
  }

  .badge-icon.locked + .badge-name {
    color: var(--gray);
  }

  /* ===== Map Page ===== */
  .map-page {
    background: #1a2215;
    height: 100%;
    position: relative;
    overflow: hidden;
  }

  .map-header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: calc(var(--statusbar-h) + 12px) 20px 16px;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .map-title {
    color: #fff;
    font-family: var(--font-serif);
    font-size: 22px;
    font-weight: 700;
  }

  .map-search {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    cursor: pointer;
  }

  .map-illustration {
    position: absolute;
    inset: 0;
    background:
      /* Green land masses */
      radial-gradient(ellipse 60% 40% at 30% 40%, #2a4a1f 0%, transparent 70%),
      radial-gradient(ellipse 50% 35% at 70% 60%, #1f3d1a 0%, transparent 65%),
      radial-gradient(ellipse 40% 30% at 50% 80%, #264d1c 0%, transparent 60%),
      radial-gradient(ellipse 35% 25% at 80% 30%, #244218 0%, transparent 55%),
      /* Water areas */
      radial-gradient(ellipse 30% 15% at 20% 70%, #2d4a5a 0%, transparent 70%),
      radial-gradient(ellipse 25% 12% at 60% 25%, #253e4d 0%, transparent 65%),
      /* Background */
      linear-gradient(180deg, #1a2215 0%, #121810 100%);
  }

  .map-contour {
    position: absolute;
    inset: 0;
    background-image:
      repeating-radial-gradient(ellipse at 30% 40%, transparent 0px, transparent 20px, rgba(107, 142, 35, 0.06) 20px, rgba(107, 142, 35, 0.06) 21px),
      repeating-radial-gradient(ellipse at 70% 60%, transparent 0px, transparent 18px, rgba(107, 142, 35, 0.04) 18px, rgba(107, 142, 35, 0.04) 19px);
  }

  .map-hotspot {
    position: absolute;
    cursor: pointer;
    z-index: 5;
  }

  .hotspot-pin {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--amber);
    position: relative;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }

  .hotspot-pin::before,
  .hotspot-pin::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  .hotspot-pin::before {
    width: 30px;
    height: 30px;
    border: 2px solid rgba(212, 148, 58, 0.5);
    animation: pulse 2s ease-out infinite;
  }

  .hotspot-pin::after {
    width: 50px;
    height: 50px;
    border: 1px solid rgba(212, 148, 58, 0.2);
    animation: pulse 2s ease-out infinite;
    animation-delay: 0.5s;
  }

  .hotspot-pin.rare {
    background: var(--danger);
  }
  .hotspot-pin.rare::before {
    border-color: rgba(194, 75, 46, 0.5);
  }
  .hotspot-pin.rare::after {
    border-color: rgba(194, 75, 46, 0.2);
  }

  .hotspot-pin.common {
    background: var(--forest-moss);
  }
  .hotspot-pin.common::before {
    border-color: rgba(107, 142, 35, 0.5);
  }
  .hotspot-pin.common::after {
    border-color: rgba(107, 142, 35, 0.2);
  }

  @keyframes pulse {
    0% { transform: translate(-50%, -50%) scale(0.8); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
  }

  .hotspot-label {
    position: absolute;
    top: -24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 10px;
    white-space: nowrap;
    backdrop-filter: blur(8px);
  }

  /* Bottom drawer */
  .map-drawer {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(250, 247, 237, 0.98);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 24px 24px 0 0;
    z-index: 20;
    padding-bottom: var(--tabbar-h);
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
    box-shadow: 0 -4px 30px rgba(0,0,0,0.2);
  }

  .drawer-handle {
    width: 40px;
    height: 4px;
    background: rgba(43, 43, 35, 0.2);
    border-radius: 2px;
    margin: 10px auto;
    cursor: grab;
  }

  .drawer-handle:active {
    cursor: grabbing;
  }

  .drawer-content {
    padding: 4px 20px 20px;
    max-height: 300px;
    overflow-y: auto;
  }

  .drawer-hotspot-item {
    display: flex;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 0.5px solid rgba(43, 43, 35, 0.08);
    cursor: pointer;
    transition: transform 0.2s;
  }

  .drawer-hotspot-item:hover {
    transform: translateX(3px);
  }

  .drawer-hotspot-item:last-child {
    border-bottom: none;
  }

  .dhs-img {
    width: 60px;
    height: 60px;
    border-radius: 12px;
    object-fit: cover;
    flex-shrink: 0;
  }

  .dhs-info {
    flex: 1;
    min-width: 0;
  }

  .dhs-name {
    font-family: var(--font-serif);
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 3px;
  }

  .dhs-meta {
    font-size: 11px;
    color: var(--gray);
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  .dhs-birds {
    font-size: 11px;
    color: var(--forest-deep);
    font-weight: 500;
  }

  /* ===== Design Spec Page ===== */
  .spec-page {
    padding-bottom: 110px;
    background: var(--surface);
  }

  .spec-hero {
    background: linear-gradient(135deg, var(--forest-deep) 0%, #1f3a10 100%);
    padding: calc(var(--statusbar-h) + 28px) 24px 32px;
    color: #fff;
    position: relative;
    overflow: hidden;
  }

  .spec-hero::before {
    content: '';
    position: absolute;
    top: -60px;
    right: -40px;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(212, 148, 58, 0.2) 0%, transparent 65%);
    border-radius: 50%;
  }

  .spec-label {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.6;
    margin-bottom: 6px;
  }

  .spec-hero h1 {
    font-family: var(--font-serif);
    font-size: 30px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .spec-hero p {
    font-size: 13px;
    opacity: 0.7;
    line-height: 1.6;
  }

  .spec-section {
    padding: 28px 24px 0;
  }

  .spec-section-title {
    font-family: var(--font-serif);
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .spec-section-title::before {
    content: '';
    width: 4px;
    height: 20px;
    background: var(--amber);
    border-radius: 2px;
  }

  /* Color cards */
  .color-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .color-card {
    border-radius: 14px;
    overflow: hidden;
    background: #fff;
    box-shadow: var(--shadow-sm);
  }

  .color-swatch {
    height: 72px;
    position: relative;
  }

  .color-info {
    padding: 10px 12px 12px;
  }

  .color-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 3px;
  }

  .color-hex {
    font-size: 10px;
    color: var(--gray);
    font-family: 'SF Mono', 'Menlo', monospace;
    letter-spacing: 0.5px;
  }

  /* Typography */
  .type-demo {
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    box-shadow: var(--shadow-sm);
  }

  .type-item {
    padding: 10px 0;
    border-bottom: 0.5px solid rgba(43, 43, 35, 0.06);
  }
  .type-item:last-child { border-bottom: none; }

  .type-label {
    font-size: 10px;
    color: var(--gray);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .type-display-1 {
    font-family: var(--font-serif);
    font-size: 32px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.2;
  }

  .type-display-2 {
    font-family: var(--font-serif);
    font-size: 22px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.3;
  }

  .type-body {
    font-size: 14px;
    color: var(--ink);
    line-height: 1.6;
  }

  .type-caption {
    font-size: 12px;
    color: var(--gray);
    line-height: 1.5;
  }

  /* Component spec */
  .comp-demo {
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .comp-row {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .spec-btn-primary {
    padding: 10px 22px;
    background: var(--forest-deep);
    color: #fff;
    border-radius: 22px;
    font-size: 13px;
    font-weight: 500;
  }

  .spec-btn-secondary {
    padding: 10px 22px;
    background: rgba(45, 80, 22, 0.1);
    color: var(--forest-deep);
    border-radius: 22px;
    font-size: 13px;
    font-weight: 500;
  }

  .spec-chip {
    padding: 4px 12px;
    background: rgba(212, 148, 58, 0.15);
    color: #8b6914;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 500;
  }

  .spec-input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid rgba(43, 43, 35, 0.12);
    border-radius: 10px;
    font-size: 13px;
    color: var(--gray);
    background: var(--surface);
  }

  /* Motion spec */
  .motion-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .motion-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    background: #fff;
    border-radius: 12px;
    box-shadow: var(--shadow-sm);
  }

  .motion-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(45, 80, 22, 0.1), rgba(107, 142, 35, 0.18));
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--forest-deep);
    flex-shrink: 0;
  }

  .motion-info {
    flex: 1;
  }

  .motion-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 2px;
  }

  .motion-val {
    font-size: 11px;
    color: var(--gray);
    font-family: 'SF Mono', monospace;
  }

  /* ===== API Docs Page ===== */
  .api-page {
    padding-bottom: 110px;
    background: #0f1410;
    color: #e8e6dd;
  }

  .api-hero {
    background: linear-gradient(135deg, #1a2815 0%, #0f1a0b 100%);
    padding: calc(var(--statusbar-h) + 28px) 24px 32px;
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid rgba(107, 142, 35, 0.1);
  }

  .api-hero::before {
    content: '';
    position: absolute;
    top: -40px;
    right: -30px;
    width: 160px;
    height: 160px;
    background: radial-gradient(circle, rgba(107, 142, 35, 0.2) 0%, transparent 65%);
    border-radius: 50%;
  }

  .api-label {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--forest-moss);
    margin-bottom: 6px;
    font-family: 'SF Mono', monospace;
  }

  .api-hero h1 {
    font-family: var(--font-serif);
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 6px;
  }

  .api-hero p {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    line-height: 1.6;
  }

  .api-section {
    padding: 24px;
  }

  .api-section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--amber-light);
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-family: 'SF Mono', monospace;
  }

  .api-endpoint {
    background: #1a2015;
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
    border: 1px solid rgba(107, 142, 35, 0.1);
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .api-endpoint:hover {
    border-color: rgba(107, 142, 35, 0.25);
  }

  .api-endpoint-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
  }

  .api-method {
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    font-family: 'SF Mono', monospace;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  .method-get { background: rgba(107, 142, 35, 0.2); color: #8bc34a; }
  .method-post { background: rgba(212, 148, 58, 0.2); color: var(--amber-light); }
  .method-put { background: rgba(77, 142, 208, 0.2); color: #64b5f6; }
  .method-delete { background: rgba(194, 75, 46, 0.2); color: #ef5350; }

  .api-path {
    flex: 1;
    font-size: 12px;
    color: #e8e6dd;
    font-family: 'SF Mono', 'Menlo', monospace;
    letter-spacing: 0.3px;
  }

  .api-arrow {
    color: rgba(255,255,255,0.3);
    transition: transform 0.3s;
    flex-shrink: 0;
  }

  .api-endpoint.open .api-arrow {
    transform: rotate(90deg);
  }

  .api-endpoint-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
  }

  .api-endpoint.open .api-endpoint-body {
    max-height: 500px;
  }

  .api-body-inner {
    padding: 0 16px 16px;
    border-top: 1px solid rgba(107, 142, 35, 0.1);
    padding-top: 14px;
  }

  .api-desc {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 12px;
    line-height: 1.6;
  }

  .api-sub-label {
    font-size: 10px;
    color: var(--forest-moss);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-family: 'SF Mono', monospace;
  }

  .json-block {
    background: #0a0d08;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 11px;
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    color: #b8c4a8;
    line-height: 1.7;
    overflow-x: auto;
    margin-bottom: 12px;
  }

  .json-key { color: var(--amber-light); }
  .json-string { color: #8bc34a; }
  .json-number { color: #ffcc80; }
  .json-boolean { color: #ce93d8; }
  .json-null { color: #ef9a9a; }
  .json-punct { color: rgba(255,255,255,0.3); }

  .api-params {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 12px;
  }

  .api-param {
    display: flex;
    gap: 10px;
    font-size: 11px;
  }

  .api-param-name {
    color: var(--amber-light);
    font-family: 'SF Mono', monospace;
    min-width: 80px;
  }

  .api-param-type {
    color: var(--forest-moss);
    font-family: 'SF Mono', monospace;
    font-size: 10px;
    min-width: 40px;
  }

  .api-param-desc {
    color: rgba(255,255,255,0.5);
    flex: 1;
  }

  /* ===== Modal Sheet ===== */
  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 80;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    z-index: 81;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    padding-bottom: 32px;
  }

  .modal-sheet.active {
    transform: translateY(0);
  }

  .modal-handle {
    width: 40px;
    height: 4px;
    background: rgba(43, 43, 35, 0.2);
    border-radius: 2px;
    margin: 10px auto 0;
  }

  .modal-body {
    padding: 16px 24px 8px;
  }

  .modal-title {
    font-family: var(--font-serif);
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 16px;
    text-align: center;
  }

  .modal-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .modal-action {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s;
    font-size: 14px;
    color: var(--ink);
  }

  .modal-action:hover {
    background: rgba(45, 80, 22, 0.06);
  }

  .modal-action-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: rgba(45, 80, 22, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--forest-deep);
  }

  .modal-action.danger {
    color: var(--danger);
  }
  .modal-action.danger .modal-action-icon {
    background: rgba(194, 75, 46, 0.1);
    color: var(--danger);
  }

  /* ===== Pull to refresh ===== */
  .pull-refresh {
    position: absolute;
    top: -50px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 50px;
    pointer-events: none;
    z-index: 15;
  }

  .refresh-spinner {
    width: 22px;
    height: 22px;
    border: 2px solid rgba(45, 80, 22, 0.2);
    border-top-color: var(--forest-deep);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .pull-arrow {
    color: var(--forest-deep);
    transition: transform 0.3s;
  }

  .pull-arrow.flip {
    transform: rotate(180deg);
  }

  /* Scroll fade-in */
  .scroll-reveal {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .scroll-reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Entry animations */
  .enter-seq > * {
    opacity: 0;
    transform: translateY(16px);
    animation: enterSeq 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes enterSeq {

// ===== Guide Page =====
const GuidePage = ({ onBirdClick, activeTab, setActiveTab }) => {
  const scrollRef = useRef(null);
  const [collapsed, setCollapsed] = useState(false);
  const [longPress, setLongPress] = useState(null);
  const pressTimer = useRef(null);

  const orders = ['雀形目', '隼形目', '鹤形目', '鸻形目', '雁形目'];

  const handleScroll = useCallback(() => {
    const el = scrollRef.current;
    if (!el) return;
    setCollapsed(el.scrollTop > 40);
  }, []);

  useEffect(() => {
    const el = scrollRef.current;
    if (el) el.addEventListener('scroll', handleScroll, { passive: true });
    return () => el && el.removeEventListener('scroll', handleScroll);
  }, [handleScroll]);

  // Long press simulation
  const handlePressStart = (bird, e) => {
    clearTimeout(pressTimer.current);
    const rect = e.currentTarget.getBoundingClientRect();
    pressTimer.current = setTimeout(() => {
      setLongPress({ bird, x: rect.left + rect.width / 2, y: rect.bottom });
    }, 500);
  };

  const handlePressEnd = () => {
    clearTimeout(pressTimer.current);
  };

  // Filter birds by order
  const filteredBirds = useMemo(() => {
    if (activeTab === '雀形目') return BIRDS.filter(b => b.order === '雀形目' || b.order === '鸽形目' || b.order === '犀鸟目');
    if (activeTab === '隼形目') return BIRDS.filter(b => b.order === '隼形目' || b.order === '鹈形目');
    if (activeTab === '鹤形目') return BIRDS.filter(b => b.order === '鹤形目' || b.order === '鹳形目');
    if (activeTab === '鸻形目') return BIRDS.filter(b => b.order === '鸻形目' || b.order === '鹈形目');
    if (activeTab === '雁形目') return BIRDS.filter(b => b.order === '雁形目' || b.order === '佛法僧目' || b.order === '雨燕目');
    return BIRDS;
  }, [activeTab]);

  const cardLayouts = ['tall', 'small', 'wide', 'small', 'tall', 'small'];

  return (
    <div className="page-container has-tabbar page-enter" ref={scrollRef}>
      <div className={`guide-tabs ${collapsed ? 'collapsed' : ''}`}>
        <div className="guide-tabs-header">
          <div className="guide-tabs-title">鸟种图鉴</div>
          <div style={{ display: 'flex', gap: 8 }}>
            <div style={{ width: 36, height: 36, borderRadius: '50%', background: 'rgba(43,43,35,0.06)', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }} data-hoverable>
              <Icon name="search" size={16} />
            </div>
          </div>
        </div>
        <div className="tab-row">
          {orders.map(o => (
            <button
              key={o}
              className={`tab-pill-btn ${activeTab === o ? 'active' : ''}`}
              onClick={() => setActiveTab(o)}
              data-hoverable
            >
              {o}
            </button>
          ))}
        </div>
      </div>

      <div className="guide-grid">
        {filteredBirds.slice(0, 6).map((bird, i) => {
          const layout = cardLayouts[i % cardLayouts.length];
          const protectClass = typeof bird.protect === 'number' ? `protect-${bird.protect}` : 'protect-lc';
          return (
            <div
              key={bird.id}
              className={`bird-card ${layout}`}
              onClick={() => !longPress && onBirdClick(bird)}
              onMouseDown={(e) => handlePressStart(bird, e)}
              onMouseUp={handlePressEnd}
              onMouseLeave={handlePressEnd}
              onTouchStart={(e) => handlePressStart(bird, e)}
              onTouchEnd={handlePressEnd}
              data-hoverable
            >
              <div className="bird-card-img-wrap">
                <img className="bird-card-img" src={bird.image} alt={bird.name} draggable={false} />
                <span className={`protect-badge ${protectClass}`} title={bird.protectText}></span>
              </div>
              <div className="bird-card-info">
                <div className="bird-card-name">{bird.name}</div>
                <div className="bird-card-en">{bird.en}</div>
                <div className="bird-card-tags">
                  <span className="bird-card-tag">{bird.order}</span>
                  <span className="bird-card-tag" style={{ background: 'rgba(160, 82, 45, 0.1)', color: 'var(--chestnut)' }}>
                    {bird.protectText}
                  </span>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      <div style={{ height: 20 }}></div>

      {/* Long press menu */}
      {longPress && (
        <>
          <div style={{ position: 'fixed', inset: 0, zIndex: 199 }} onClick={() => setLongPress(null)}></div>
          <div className="longpress-menu" style={{ left: longPress.x - 80, top: longPress.y + 10 }}>
            <div className="lp-menu-item" data-hoverable>
              <Icon name="bookmark" size={16} color="var(--forest-deep)" />
              <span>加入收藏</span>
            </div>
            <div className="lp-menu-item" data-hoverable>
              <Icon name="camera" size={16} color="var(--forest-deep)" />
              <span>记录目击</span>
            </div>
            <div className="lp-menu-item" data-hoverable>
              <Icon name="share" size={16} color="var(--forest-deep)" />
              <span>分享鸟种</span>
            </div>
            <div className="lp-menu-item" data-hoverable>
              <Icon name="map" size={16} color="var(--forest-deep)" />
              <span>查看分布</span>
            </div>
          </div>
        </>
      )}
    </div>
  );
};

  useEffect(() => {
    let rafId;
    let startTime;
    const duration = 1800;
    const targetTotal = 128;
    const targetSpecies = 47;
    const targetDays = 23;

    const animate = (ts) => {
      if (!startTime) startTime = ts;
      const progress = Math.min((ts - startTime) / duration, 1);
      const ease = 1 - Math.pow(1 - progress, 3);
      setTotalCount(Math.floor(targetTotal * ease));
      setSpeciesCount(Math.floor(targetSpecies * ease));
      setDaysCount(Math.floor(targetDays * ease));

    rafId = requestAnimationFrame(animate);

const MapPage = () => {
  const [drawerOpen, setDrawerOpen] = useState(false);
  const drawerRef = useRef(null);
  const startY = useRef(0);
  const currentY = useRef(0);

  const handleTouchStart = (e) => {
    startY.current = e.touches[0].clientY;
    currentY.current = 0;
  };

  const handleTouchMove = (e) => {
    const dy = startY.current - e.touches[0].clientY;
    // simulate via mouse for desktop
  };

  // Mouse drag for demo
  const [dragging, setDragging] = useState(false);
  const [drawerY, setDrawerY] = useState(0);
  const dragStartY = useRef(0);
  const dragStartDrawer = useRef(0);

  const onDragStart = (e) => {
    setDragging(true);
    dragStartY.current = e.clientY;
    dragStartDrawer.current = drawerY;
  };

  const onDragMove = useCallback((e) => {
    if (!dragging) return;
    const dy = dragStartY.current - e.clientY;
    const newY = Math.min(Math.max(dragStartDrawer.current + dy, -200), 0);
    setDrawerY(newY);
  }, [dragging, drawerY]);

  const onDragEnd = useCallback(() => {
    if (!dragging) return;
    setDragging(false);
    // snap
    if (drawerY < -100) {
      setDrawerY(-200);
      setDrawerOpen(true);
    } else {
      setDrawerY(0);
      setDrawerOpen(false);
    }
  }, [dragging, drawerY]);

  useEffect(() => {
    if (dragging) {
      window.addEventListener('mousemove', onDragMove);
      window.addEventListener('mouseup', onDragEnd);
    }
    return () => {
      window.removeEventListener('mousemove', onDragMove);
      window.removeEventListener('mouseup', onDragEnd);
    };
  }, [dragging, onDragMove, onDragEnd]);

  return (
    <div className="page-container map-page" style={{ paddingBottom: 'var(--tabbar-h)' }}>
      <StatusBar dark={false} />

      {/* Header */}
      <div className="map-header">

        <div className="map-contour"></div>

        {HOTSPOTS.map((hs, i) => (
          <div

            className="map-hotspot"
            style={{ left: `${hs.x}%`, top: `${hs.y}%`, animationDelay: `${i * 0.3}s` }}
            data-hoverable
          >
            <div className={`hotspot-pin ${hs.type}`}></div>
            {i < 3 && <div className="hotspot-label">{hs.name}</div>}
          </div>
        ))}

        {/* Current location */}

const App = () => {
  const [activeTab, setActiveTab] = useState('home');
  const [detailBird, setDetailBird] = useState(null);
  const [currentPage, setCurrentPage] = useState('home'); // home/guide/record/map/profile/spec/api/detail
  const [guideTab, setGuideTab] = useState('雀形目');

  const navigate = (tab) => {
    setActiveTab(tab);
    setCurrentPage(tab);
    setDetailBird(null);
  };

  const openBirdDetail = (bird) => {
    setDetailBird(bird);
    setCurrentPage('detail');
  };

  const goBack = () => {
    setDetailBird(null);
    setCurrentPage(activeTab);
  };

  const handleTabChange = (key) => {
    if (key === 'profile') {
      // stay on tabbar profile, but we can show spec/api from profile
    }
    navigate(key);
  };

  // For prototype: clicking the design spec / api docs from profile
  // We'll add direct access via the tab... let's use profile page's quick links
  // Instead, let's add a way to access spec and api via... hmm
  // Let's just show them when clicking on certain items in profile

  const renderPage = () => {
    if (currentPage === 'detail' && detailBird) {
      return (
        <DetailPage
          bird={detailBird}
          onBack={goBack}
          onRecord={goBack}
        />
      );
    }

    switch (currentPage) {
      case 'home':
        return <HomePage onBirdClick={openBirdDetail} onRecordClick={() => navigate('record')} />;
      case 'guide':
        return <GuidePage onBirdClick={openBirdDetail} activeTab={guideTab} setActiveTab={setGuideTab} />;
      case 'record':
        return <RecordsPage onBirdClick={openBirdDetail} />;
      case 'map':
        return <MapPage />;
      case 'profile':
        return <ProfilePage />;
      case 'spec':
        return <SpecPage />;
      case 'api':
        return <ApiPage />;
      default:
        return <HomePage onBirdClick={openBirdDetail} onRecordClick={() => navigate('record')} />;
    }
  };

  const showTabbar = currentPage !== 'detail' && currentPage !== 'spec' && currentPage !== 'api';
  const darkTabbar = currentPage === 'map';

  return (
    <div className="app-root">
      {showTabbar && currentPage !== 'home' && currentPage !== 'guide' && currentPage !== 'record' && currentPage !== 'profile' && currentPage !== 'map' ? null : (
        <>
          {renderPage()}
          {showTabbar && (
            <TabBar active={activeTab} onChange={handleTabChange} darkBg={darkTabbar} />
          )}
          {!showTabbar && renderPage()}
        </>
      )}
      {/* Fix: ensure single render */}
      {!showTabbar && null /* already rendered above */}
    </div>
  );
};

  const scrollRef = useRef(null);
  const [progress, setProgress] = useState(0);

  useEffect(() => {
    let rafId;
    let startTime;
    const duration = 2000;
    const target = 68;
    const animate = (ts) => {
      if (!startTime) startTime = ts;
      const p = Math.min((ts - startTime) / duration, 1);
      const ease = 1 - Math.pow(1 - p, 3);

      if (p < 1) rafId = requestAnimationFrame(animate);

          <div className="progress-ring-wrap">
            <svg width="100" height="100" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth="8" />
              <circle
                cx="50" cy="50" r="42" fill="none"
                stroke="var(--amber-light)"
                strokeWidth="8"
                strokeLinecap="round"
                strokeDasharray={circumference}
                strokeDashoffset={offset}
              />
            </svg>
            <div className="progress-ring-center">
              <div className="progress-num">{Math.floor(progress)}%</div>
              <div className="progress-label">年度目标</div>
            </div>
          </div>
          <div className="goal-text">
            <h3>年度目标：100 种</h3>
            <p>已识别 <strong>47 种</strong>，距离目标还差 53 种。本月新添 8 种，继续加油！</p>
          </div>
        </div>
      </div>

      <div className="profile-content">
        <div className="function-grid">
          {functions.map((f, i) => (
            <div key={i} className="func-item" data-hoverable>
              <div className={`func-icon ${f.cls}`}>
                <Icon name={f.icon} size={22} />
              </div>
              <span className="func-label">{f.label}</span>
            </div>
          ))}
        </div>

        <div className="badges-section">
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <span style={{ fontFamily: 'var(--font-serif)', fontSize: '18px', fontWeight: 700, color: 'var(--ink)' }}>徽章墙</span>
            <span style={{ fontSize: '12px', color: 'var(--gray)' }}>已获得 4/20</span>
          </div>
          <div className="badges-grid">
            {badges.map((b, i) => (
              <div key={i} className="badge-item" data-hoverable>
                <div className={`badge-icon ${b.unlocked ? 'unlocked' : 'locked'}`}>
                  <Icon name={b.icon} size={22} color="#fff" />
                </div>
                <span className="badge-name">{b.name}</span>
              </div>
            ))}
          </div>
        </div>

        <div className="badges-section">
          <span style={{ fontFamily: 'var(--font-serif)', fontSize: '18px', fontWeight: 700, color: 'var(--ink)' }}>更多</span>
          <div style={{ marginTop: 14, background: '#fff', borderRadius: 14, overflow: 'hidden', boxShadow: 'var(--shadow-sm)' }}>
            {quickLinks.map((item, i) => (
              <div
                key={i}
                style={{
                  display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                  padding: '14px 16px',
                  borderBottom: i < quickLinks.length - 1 ? '0.5px solid rgba(43,43,35,0.06)' : 'none',
                  cursor: 'pointer',
                }}
                data-hoverable
                onClick={item.action}
                onMouseEnter={(e) => e.currentTarget.style.background = 'rgba(45, 80, 22, 0.04)'}
                onMouseLeave={(e) => e.currentTarget.style.background = 'transparent'}
              >
                <span style={{ fontSize: 14, color: 'var(--ink)' }}>{item.label}</span>
                <Icon name="chevronRight" size={14} color="var(--gray)" />
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
};

// ===== Custom Cursor =====
const initCustomCursor = () => {
  const cursor = document.getElementById('customCursor');
  const ripple = document.getElementById('cursorRipple');
  if (!cursor || !ripple) return;

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let cursorX = mouseX;
  let cursorY = mouseY;
  let rafId;
  let visible = true;

  // Handle reduced motion
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const animate = () => {
    if (!visible) { rafId = requestAnimationFrame(animate); return; }
    // Follow with easing
    cursorX += (mouseX - cursorX) * 0.18;
    cursorY += (mouseY - cursorY) * 0.18;
    cursor.style.transform = `translate(${cursorX}px, ${cursorY}px) translate(-50%, -50%)`;
    rafId = requestAnimationFrame(animate);
  };

  const handleMove = (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  };

  const handleOver = (e) => {
    if (e.target.closest('[data-hoverable]')) {
      cursor.classList.add('hover');
    }
  };

  const handleOut = (e) => {
    if (e.target.closest('[data-hoverable]')) {
      cursor.classList.remove('hover');
    }
  };

  const handleClick = (e) => {
    ripple.classList.remove('active');
    void ripple.offsetWidth; // reflow
    ripple.classList.add('active');
  };

  const handleVisibility = () => {
    if (document.hidden) {
      cancelAnimationFrame(rafId);
    } else {
      rafId = requestAnimationFrame(animate);
    }
  };

  if (!reducedMotion) {
    window.addEventListener('mousemove', handleMove, { passive: true });
    document.addEventListener('mouseover', handleOver);
    document.addEventListener('mouseout', handleOut);
    document.addEventListener('click', handleClick);
    document.addEventListener('visibilitychange', handleVisibility);
    rafId = requestAnimationFrame(animate);
  } else {
    cursor.style.display = 'none';
  }
};

// ===== Render =====
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AppFixed />);

// Init cursor after DOM ready
if (document.readyState === 'complete' || document.readyState === 'interactive') {
  setTimeout(initCustomCursor, 100);
} else {
  window.addEventListener('DOMContentLoaded', initCustomCursor);
}

// Announce upgrade
function announceUpgrade() {
  try {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  } catch (e) {}
}
announceUpgrade();
if (document.readyState !== 'complete') window.addEventListener('load', announceUpgrade, { once: true });

// Clean up all timers on page unload / visibility
window.addEventListener('beforeunload', () => {
  // All RAFs and timers are cleaned up via component unmounts
});
</script>

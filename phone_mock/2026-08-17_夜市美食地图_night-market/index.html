<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>夜市美食地图 · 微信小程序 V2</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" />
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --charcoal: #1a1815;
      --charcoal-2: #221f1a;
      --charcoal-3: #2d2821;
      --lantern: #ff9a3c;
      --lantern-2: #ffb066;
      --chili: #d63a2a;
      --chili-2: #e85040;
      --sesame: #f5f0e0;
      --sesame-2: #e8e0c8;
      --scallion: #7aba4a;
      --scallion-2: #90ce5c;
      --gold: #e8b94c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif; background: #0d0c0a; color: var(--sesame); }
    body { display: flex; align-items: center; justify-content: center; cursor: none; }
    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(255, 154, 60, 0.08), transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(214, 58, 42, 0.06), transparent 50%),
        #0d0c0a;
    }
    /* Phone frame */
    .phone {
      position: relative;
      width: 390px;
      height: 844px;
      border-radius: 52px;
      background: #111;
      box-shadow:
        0 50px 120px rgba(0,0,0,0.8),
        0 0 0 2px #222 inset,
        0 0 0 12px #0a0a0a,
        0 0 60px rgba(255, 154, 60, 0.15);
      overflow: hidden;
    }
    .phone::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 130px; height: 34px;
      background: #000;
      border-radius: 0 0 20px 20px;
      z-index: 100;
    }
    .phone-screen {
      position: absolute;
      inset: 0;
      border-radius: 52px;
      overflow: hidden;
      background: var(--charcoal);
    }
    .phone-content {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    /* Mini-program status bar */
    .status-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-size: 15px;
      font-weight: 600;
      color: var(--sesame);
      z-index: 50;
      pointer-events: none;
    }
    .status-bar .right-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }
    /* Nav bar with capsule */
    .nav-bar {
      position: absolute;
      top: 44px; left: 0; right: 0;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 16px;
      z-index: 40;
      transition: background 0.3s ease;
    }
    .nav-bar .nav-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 17px;
      font-weight: 600;
      color: var(--sesame);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .nav-bar.solid .nav-title { opacity: 1; }
    .capsule {
      position: relative;
      width: 87px;
      height: 32px;
      border-radius: 16px;
      background: rgba(245, 240, 224, 0.18);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0.5px solid rgba(245, 240, 224, 0.25);
    }
    .capsule::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 20%;
      bottom: 20%;
      width: 0.5px;
      background: rgba(245, 240, 224, 0.3);
    }
    .capsule .dot-group {
      display: flex;
      gap: 3px;
      padding-right: 16px;
    }
    .capsule .dot {
      width: 3.5px;
      height: 3.5px;
      border-radius: 50%;
      background: var(--sesame);
      opacity: 0.9;
    }
    .capsule .circle-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--sesame);
      position: relative;
      margin-left: 16px;
    }
    .capsule .circle-icon::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--sesame);
    }
    /* Page container */
    .page-container {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .page {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    .page::-webkit-scrollbar { display: none; }
    .page-enter {
      animation: pagePushIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .page-enter-back {
      animation: pagePopIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes pagePushIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    @keyframes pagePopIn {
      from { transform: translateX(-30%); opacity: 0.8; }
      to { transform: translateX(0); opacity: 1; }
    }
    /* TabBar */
    .tab-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 83px;
      padding-bottom: 34px;
      background: rgba(26, 24, 21, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 0.5px solid rgba(245, 240, 224, 0.1);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 30;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 10px;
      color: var(--sesame-2);
      opacity: 0.6;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }
    .tab-item.active {
      color: var(--lantern);
      opacity: 1;
      transform: translateY(-2px);
    }
    .tab-item.active .tab-icon {
      transform: scale(1.15);
      filter: drop-shadow(0 0 8px rgba(255, 154, 60, 0.5));
    }
    .tab-icon {
      width: 26px;
      height: 26px;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    /* Custom cursor */
    .custom-cursor {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--lantern);
      background: rgba(255, 154, 60, 0.12);
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s, background 0.2s, border-color 0.2s;
      mix-blend-mode: normal;
      box-shadow: 0 0 16px rgba(255, 154, 60, 0.4);
    }
    .custom-cursor.hover {
      width: 48px;
      height: 48px;
      background: rgba(255, 154, 60, 0.2);
      border-color: var(--lantern-2);
    }
    .cursor-dot {
      position: fixed;
      pointer-events: none;
      z-index: 10000;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--lantern);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px var(--lantern);
    }
    /* ============ HOME PAGE ============ */
    .home-hero {
      position: relative;
      height: 380px;
      overflow: hidden;
    }
    .home-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.55);
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(26,24,21,0.2) 0%, rgba(26,24,21,0.5) 40%, var(--charcoal) 100%);
    }
    .hero-content {
      position: absolute;
      top: 88px;
      left: 20px;
      right: 20px;
      z-index: 2;
    }
    .hero-greeting {
      font-size: 13px;
      color: var(--sesame-2);
      opacity: 0.7;
      margin-bottom: 6px;
    }
    .hero-title {
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 34px;
      color: var(--sesame);
      line-height: 1.2;
      margin-bottom: 4px;
      text-shadow: 0 2px 20px rgba(255, 154, 60, 0.3);
    }
    .hero-title .accent { color: var(--lantern); }
    .hero-subtitle {
      font-size: 13px;
      color: var(--sesame-2);
      opacity: 0.8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hero-subtitle .pulse-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--scallion);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.4); }
    }
    .search-box {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 36px;
      background: rgba(245, 240, 224, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      color: var(--sesame-2);
      z-index: 3;
    }
    .search-icon {
      width: 14px; height: 14px;
      opacity: 0.7;
    }
    /* Lantern decorations */
    .lanterns {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .lantern {
      position: absolute;
      width: 30px;
      height: 40px;
      background: radial-gradient(ellipse at center, var(--lantern) 0%, var(--chili) 100%);
      border-radius: 50%;
      transform-origin: top center;
      box-shadow: 0 0 20px var(--lantern), 0 0 40px rgba(255, 154, 60, 0.5);
      animation: lanternSwing 3s ease-in-out infinite;
    }
    .lantern::before {
      content: '';
      position: absolute;
      top: -6px; left: 50%;
      transform: translateX(-50%);
      width: 14px; height: 3px;
      background: var(--gold);
      border-radius: 2px;
    }
    .lantern::after {
      content: '';
      position: absolute;
      bottom: -8px; left: 50%;
      transform: translateX(-50%);
      width: 3px; height: 8px;
      background: var(--gold);
    }
    @keyframes lanternSwing {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(8deg); }
    }
    .lantern-1 { top: 60px; left: 20px; animation-delay: 0s; animation-duration: 3.2s; }
    .lantern-2 { top: 45px; left: 70px; width: 22px; height: 28px; animation-delay: 0.5s; animation-duration: 2.8s; }
    .lantern-3 { top: 70px; right: 100px; width: 26px; height: 34px; animation-delay: 1s; animation-duration: 3.5s; }
    .lantern-4 { top: 50px; right: 40px; width: 20px; height: 26px; animation-delay: 1.5s; animation-duration: 2.5s; }
    /* Steam effect */
    .steam-container {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }
    .steam {
      position: absolute;
      bottom: 0;
      width: 8px;
      height: 8px;
      background: rgba(245, 240, 224, 0.6);
      border-radius: 50%;
      filter: blur(4px);
      animation: steamRise 3s ease-out infinite;
    }
    @keyframes steamRise {
      0% { transform: translateY(0) scale(1); opacity: 0.6; }
      100% { transform: translateY(-80px) scale(3); opacity: 0; }
    }
    .steam-1 { left: 0; animation-delay: 0s; }
    .steam-2 { left: 15px; animation-delay: 0.5s; }
    .steam-3 { left: 30px; animation-delay: 1s; }
    /* Hot market section */
    .section {
      padding: 0 20px;
      margin-top: 24px;
    }
    .section-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--sesame);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title .icon-tag {
      font-size: 11px;
      padding: 3px 8px;
      background: linear-gradient(135deg, var(--chili), var(--lantern));
      border-radius: 10px;
      color: #fff;
      font-weight: 500;
    }
    .section-more {
      font-size: 12px;
      color: var(--lantern);
      display: flex;
      align-items: center;
      gap: 2px;
    }
    /* Hot market cards - horizontal scroll */
    .market-scroll {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin: 0 -20px;
      padding-left: 20px;
      padding-right: 20px;
      scroll-snap-type: x mandatory;
    }
    .market-scroll::-webkit-scrollbar { display: none; }
    .market-card {
      flex-shrink: 0;
      width: 260px;
      border-radius: 18px;
      overflow: hidden;
      background: var(--charcoal-2);
      position: relative;
      scroll-snap-align: start;
      cursor: pointer;
      transition: transform 0.3s;
    }
    .market-card:active { transform: scale(0.97); }
    .market-card-img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }
    .market-card-badge {
      position: absolute;
      top: 12px; left: 12px;
      background: linear-gradient(135deg, var(--chili), var(--lantern));
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
    }
    .market-card-body {
      padding: 12px 14px 14px;
    }
    .market-card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--sesame);
      margin-bottom: 6px;
    }
    .market-card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: var(--sesame-2);
      opacity: 0.7;
    }
    .market-card-meta .rating {
      color: var(--gold);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    /* Stall cards - masonry-like */
    .stall-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stall-card {
      background: var(--charcoal-2);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: transform 0.25s;
    }
    .stall-card:active { transform: scale(0.96); }
    .stall-card.tall .stall-img { height: 180px; }
    .stall-card.short .stall-img { height: 120px; }
    .stall-img {
      width: 100%;
      object-fit: cover;
    }
    .stall-card-info {
      padding: 10px 12px 12px;
    }
    .stall-card-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--sesame);
      margin-bottom: 4px;
    }
    .stall-card-dish {
      font-size: 11px;
      color: var(--sesame-2);
      opacity: 0.6;
      margin-bottom: 8px;
    }
    .stall-card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .stall-price {
      font-size: 14px;
      font-weight: 700;
      color: var(--lantern);
    }
    .stall-price small { font-size: 10px; font-weight: 400; opacity: 0.8; }
    .stall-rating {
      font-size: 11px;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .floating-action {
      position: absolute;
      right: 16px;
      bottom: 100px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--lantern), var(--chili));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(255, 154, 60, 0.4);
      z-index: 10;
      cursor: pointer;
      animation: floatBall 3s ease-in-out infinite;
    }
    @keyframes floatBall {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .floating-action:active { transform: scale(0.9); }
    /* ============ CATEGORY PAGE ============ */
    .category-page {
      padding-top: 88px;
    }
    .category-header {
      padding: 0 20px 16px;
    }
    .category-title {
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 28px;
      color: var(--sesame);
      margin-bottom: 4px;
    }
    .category-subtitle {
      font-size: 12px;
      color: var(--sesame-2);
      opacity: 0.6;
    }
    .sticky-tabs {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--charcoal);
      padding: 12px 20px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      border-bottom: 0.5px solid rgba(245, 240, 224, 0.08);
    }
    .sticky-tabs::-webkit-scrollbar { display: none; }
    .tab-chip {
      flex-shrink: 0;
      padding: 7px 16px;
      border-radius: 16px;
      background: var(--charcoal-3);
      font-size: 13px;
      color: var(--sesame-2);
      opacity: 0.7;
      transition: all 0.3s;
      cursor: pointer;
    }
    .tab-chip.active {
      background: linear-gradient(135deg, var(--lantern), var(--chili));
      color: #fff;
      opacity: 1;
      font-weight: 500;
    }
    .category-grid {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .cat-card {
      position: relative;
      height: 120px;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s;
    }
    .cat-card:active { transform: scale(0.95); }
    .cat-card.wide { grid-column: span 2; height: 140px; }
    .cat-card-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: brightness(0.5);
      transition: transform 0.4s;
    }
    .cat-card:hover .cat-card-bg { transform: scale(1.05); }
    .cat-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(26,24,21,0.3), rgba(26,24,21,0.7));
    }
    .cat-card-content {
      position: absolute;
      bottom: 12px;
      left: 14px;
      right: 14px;
    }
    .cat-card-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--sesame);
      margin-bottom: 2px;
    }
    .cat-card-count {
      font-size: 11px;
      color: var(--lantern-2);
    }
    /* Chili bounce icon */
    .chili-icon {
      display: inline-block;
      animation: chiliBounce 1.5s ease-in-out infinite;
    }
    @keyframes chiliBounce {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-4px) rotate(5deg); }
    }
    /* ============ DETAIL PAGE ============ */
    .detail-hero {
      position: relative;
      height: 320px;
      overflow: hidden;
    }
    .detail-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .detail-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(26,24,21,0.1) 0%, rgba(26,24,21,0.3) 50%, var(--charcoal) 100%);
    }
    .detail-back-btn {
      position: absolute;
      top: 50px;
      left: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      cursor: pointer;
    }
    .detail-actions {
      position: absolute;
      top: 50px;
      right: 120px;
      display: flex;
      gap: 8px;
      z-index: 5;
    }
    .detail-action-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .detail-action-btn:active { transform: scale(0.85); }
    .detail-body {
      padding: 0 20px;
      margin-top: -20px;
      position: relative;
      z-index: 2;
    }
    .detail-title-card {
      background: var(--charcoal-2);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 -4px 30px rgba(0,0,0,0.3);
    }
    .detail-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--sesame);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .detail-status {
      display: inline-block;
      font-size: 10px;
      padding: 3px 8px;
      background: rgba(122, 186, 74, 0.2);

      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
    }
    .pull-refresh-icon {
      width: 24px;
      height: 24px;
      border: 2px solid var(--lantern);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;

    .pull-refresh-text {
      font-size: 10px;
      color: var(--lantern);
      opacity: 0.8;

      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }

      background: linear-gradient(90deg, var(--charcoal-2) 25%, var(--charcoal-3) 50%, var(--charcoal-2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;

    .action-sheet-mask {
      position: absolute;

      transition: opacity 0.3s;
      z-index: 60;

    .action-sheet {

      bottom: 0;
      left: 0;
      right: 0;
      background: var(--charcoal-2);
      border-radius: 20px 20px 0 0;
      transform: translateY(100%);

      padding: 6px 0 34px;

    .action-sheet.show { transform: translateY(0); }
    .action-sheet-handle {

      background: var(--charcoal-3);
      border-radius: 2px;
      margin: 8px auto 12px;
    }
    .action-sheet-title {

    .action-sheet-cancel {

    /* Toast */

      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(0,0,0,0.8);

      const cursorRef = useRef(null);

      const pos = useRef({ x: 0, y: 0 });
      const target = useRef({ x: 0, y: 0 });
      const rafId = useRef(null);

      useEffect(() => {
        const cursor = cursorRef.current;
        const dot = dotRef.current;
        if (!cursor || !dot) return;

        // Center initial position
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        pos.current = { x: centerX, y: centerY };
        target.current = { x: centerX, y: centerY };

        const animate = () => {
          const dx = target.current.x - pos.current.x;
          const dy = target.current.y - pos.current.y;
          pos.current.x += dx * 0.15;
          pos.current.y += dy * 0.15;
          cursor.style.transform = `translate(${pos.current.x}px, ${pos.current.y}px) translate(-50%, -50%)`;
          dot.style.transform = `translate(${target.current.x}px, ${target.current.y}px) translate(-50%, -50%)`;
          rafId.current = requestAnimationFrame(animate);
        };
        rafId.current = requestAnimationFrame(animate);

        const onMove = (e) => {
          target.current.x = e.clientX;
          target.current.y = e.clientY;
        };

        const onEnter = () => { cursor.classList.add('hover'); };
        const onLeave = () => { cursor.classList.remove('hover'); };

        window.addEventListener('mousemove', onMove);

            el.addEventListener('mouseenter', onEnter);
            el.addEventListener('mouseleave', onLeave);
          });
        };
        setTimeout(addHover, 100);

        const onVisibility = () => {
          if (document.hidden && rafId.current) {
            cancelAnimationFrame(rafId.current);
            rafId.current = null;
          } else if (!document.hidden && !rafId.current) {
            rafId.current = requestAnimationFrame(animate);
          }
        };
        document.addEventListener('visibilitychange', onVisibility);

        return () => {
          if (rafId.current) cancelAnimationFrame(rafId.current);
          window.removeEventListener('mousemove', onMove);
          document.removeEventListener('visibilitychange', onVisibility);
        };
      }, []);

    const FavoritesPage = ({ onOpenStall, showToast }) => {
      const [favs, setFavs] = useState(stalls.slice(0, 4).map(s => ({ ...s, swipeX: 0 })));
      const activeSwipeRef = useRef(null);
      const startXRef = useRef(0);
      const currentXRef = useRef(0);

      const handleSwipeStart = (e, id) => {
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        startXRef.current = clientX;
        currentXRef.current = favs.find(f => f.id === id)?.swipeX || 0;
        activeSwipeRef.current = id;
      };

      const handleSwipeMove = (e) => {
        if (activeSwipeRef.current === null) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const diff = clientX - startXRef.current;
        let newX = currentXRef.current + diff;
        newX = Math.max(-80, Math.min(0, newX));

        setFavs(prev => prev.map(f =>
          f.id === activeSwipeRef.current ? { ...f, swipeX: newX } : f
        ));
      };

      const handleSwipeEnd = () => {
        if (activeSwipeRef.current === null) return;
        setFavs(prev => prev.map(f => {
          if (f.id === activeSwipeRef.current) {
            return { ...f, swipeX: f.swipeX < -40 ? -70 : 0 };
          }
          return f;
        }));
      };

      const handleDelete = (id, name) => {
        setFavs(prev => prev.filter(f => f.id !== id));
        showToast(`已取消收藏 ${name}`, 'success');
      };

      return (
        <div className="page fav-page">

            <div className="fav-title">我的收藏</div>
            <div className="fav-count">{favs.length} 个摊位</div>

                <div className="swipe-actions">
                  <div className="swipe-btn delete" onClick={() => handleDelete(f.id, f.name)}>删除</div>
                </div>
                <div
                  className="fav-item-content"
                  style={{ transform: `translateX(${f.swipeX}px)` }}
                  onMouseDown={(e) => handleSwipeStart(e, f.id)}
                  onTouchStart={(e) => handleSwipeStart(e, f.id)}
                  onTouchMove={handleSwipeMove}
                  onTouchEnd={handleSwipeEnd}
                  onClick={() => f.swipeX === 0 && onOpenStall(f.id)}
                >
                  <img src={f.img} alt={f.name} />
                  <div className="fav-item-info">
                    <div>
                      <div className="fav-item-name">{f.name}</div>
                      <div className="fav-item-meta">

                      </div>
                    </div>
                    <div className="fav-item-bottom">
                      <div className="fav-item-price"><small style={{ fontSize: 10 }}>¥</small>{f.price}<small style={{ fontSize: 10 }}>起</small></div>
                      <div className="fav-item-rating">
                        <Icon name="star" size={10} color="var(--gold)" />
                        {f.rating}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            ))}

            <div className="spec-section-title">组件展示</div>
            <div className="component-grid">
              <div className="component-demo">
                <div className="demo-btn">主按钮</div>
                <div className="component-demo-label">主按钮 Primary</div>
              </div>
              <div className="component-demo">
                <div className="demo-btn-outline">边框按钮</div>
                <div className="component-demo-label">次按钮 Ghost</div>
              </div>
              <div className="component-demo">
                <div className="demo-badge">营业中</div>
                <div className="component-demo-label">状态标签</div>
              </div>
              <div className="component-demo">
                <div className="demo-card" />
                <div className="component-demo-label">卡片容器</div>
              </div>
            </div>
          </div>

          <div className="spec-section">
            <div className="spec-section-title">圆角系统</div>
            <div className="typography-demo" style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
              <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
                <div style={{ width: 40, height: 40, borderRadius: 6, background: 'var(--lantern)', opacity: 0.8 }} />
                <span style={{ fontSize: 10, color: 'var(--sesame-2)', opacity: 0.6 }}>6px · 小</span>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
                <div style={{ width: 40, height: 40, borderRadius: 12, background: 'var(--lantern)', opacity: 0.8 }} />
                <span style={{ fontSize: 10, color: 'var(--sesame-2)', opacity: 0.6 }}>12px · 中</span>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
                <div style={{ width: 40, height: 40, borderRadius: 20, background: 'var(--lantern)', opacity: 0.8 }} />
                <span style={{ fontSize: 10, color: 'var(--sesame-2)', opacity: 0.6 }}>20px · 大</span>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
                <div style={{ width: 40, height: 40, borderRadius: '50%', background: 'var(--lantern)', opacity: 0.8 }} />
                <span style={{ fontSize: 10, color: 'var(--sesame-2)', opacity: 0.6 }}>50% · 圆</span>
              </div>
            </div>
          </div>

          <div className="spec-section">
            <div className="spec-section-title">间距规范</div>
            <div className="typography-demo" style={{ display: 'flex', alignItems: 'center', gap: 0, flexWrap: 'wrap' }}>
              {[4, 8, 12, 16, 20, 24].map(s => (
                <div key={s} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, marginRight: 12 }}>
                  <div style={{ width: s, height: 20, background: 'var(--lantern)', opacity: 0.6, borderRadius: 2 }} />
                  <span style={{ fontSize: 9, color: 'var(--sesame-2)', opacity: 0.5 }}>{s}px</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // ============== API DOC PAGE ==============
    const ApiDocPage = () => {
      const [activeTab, setActiveTab] = useState('全部');
      const [openId, setOpenId] = useState(null);
      const tabs = ['全部', '摊位', '夜市', '用户', '收藏'];

      const toggleEndpoint = (id) => {
        setOpenId(openId === id ? null : id);
      };

      return (
        <div className="page api-page">
          <div className="api-header">
            <div className="api-title">接口文档</div>
            <div style={{ fontSize: 12, color: 'var(--sesame-2)', opacity: 0.6 }}>夜市美食地图 API v1.0</div>
          </div>

          <div className="api-tabs">
            {tabs.map(t => (
              <div
                key={t}
                className={`api-tab ${activeTab === t ? 'active' : ''}`}
                onClick={() => setActiveTab(t)}
              >
                {t}
              </div>
            ))}
          </div>

          <div className="api-endpoint-list">
            {apiEndpoints.map((ep, i) => (
              <div
                key={i}
                className={`api-endpoint ${openId === i ? 'open' : ''}`}
                onClick={() => toggleEndpoint(i)}
              >
                <div className="api-endpoint-header">
                  <span className={`api-method ${ep.method.toLowerCase() === 'get' ? 'get' : ep.method.toLowerCase() === 'post' ? 'post' : ep.method.toLowerCase() === 'put' ? 'put' : 'del'}`}>
                    {ep.method}
                  </span>
                  <span className="api-path">{ep.path}</span>
                  <span className="api-arrow">
                    <Icon name="chevronDown" size={16} color="currentColor" />
                  </span>
                </div>
                <div className="api-endpoint-body">
                  <div className="api-desc">{ep.desc}</div>
                  <div className="api-param-label">参数 Parameters</div>
                  <div className="api-params">
                    {ep.params.map((p, j) => (
                      <div key={j}>
                        <span className="param-key">{p.key}</span>
                        <span className="param-type"> : {p.type}</span>
                        <span style={{ opacity: 0.5 }}> — {p.desc}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            ))}
          </div>

          <div style={{ margin: '24px 20px 0' }}>
            <div className="spec-section-title" style={{ marginLeft: 0 }}>响应示例</div>
            <div style={{
              background: 'var(--charcoal-2)',
              borderRadius: 14,
              padding: 14,
              fontFamily: 'monospace',
              fontSize: 11,
              lineHeight: 1.8,
              color: 'var(--sesame-2)',
              overflow: 'auto',
            }}>
              <pre style={{ margin: 0, whiteSpace: 'pre-wrap' }}>{`{
  "code": 0,
  "message": "success",
  "data": {
    "id": "stall_001",
    "name": "阿婆烧烤摊",
    "rating": 4.9,
    "category": "烧烤",
    "price": 25,
    "status": "open",
    "dishes": [...]
  }
}`}</pre>
            </div>
          </div>
        </div>
      );
    };

    // ============== ACTION SHEET ==============
    const ActionSheet = ({ show, onClose, items }) => {
      return (
        <>
          <div className={`action-sheet-mask ${show ? 'show' : ''}`} onClick={onClose} />
          <div className={`action-sheet ${show ? 'show' : ''}`}>
            <div className="action-sheet-handle" />
            <div className="action-sheet-title">选择操作</div>
            {items.map((item, i) => (
              <div
                key={i}
                className={`action-sheet-item ${item.danger ? 'danger' : ''}`}
                onClick={() => { item.onClick && item.onClick(); onClose(); }}
              >
                {item.label}
              </div>
            ))}
            <div className="action-sheet-cancel" onClick={onClose}>取消</div>
          </div>
        </>
      );
    };

    // ============== TOAST ==============
    const Toast = ({ show, message, type }) => {
      const icons = { success: '✅', error: '❌', info: '💡', warning: '⚠️' };
      return (
        <div className={`toast ${show ? 'show' : ''}`}>
          <span className="toast-icon">{icons[type] || icons.info}</span>
          <span>{message}</span>
        </div>
      );
    };

    // ============== APP ==============
    const App = () => {
      const [activeTab, setActiveTab] = useState('home');
      const [stack, setStack] = useState([{ key: 'home', params: {} }]);
      const [direction, setDirection] = useState('push');
      const [actionSheetShow, setActionSheetShow] = useState(false);
      const [toast, setToast] = useState({ show: false, message: '', type: 'info' });
      const toastTimerRef = useRef(null);

      const currentPage = stack[stack.length - 1];

      const showToast = useCallback((message, type = 'info') => {
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        setToast({ show: true, message, type });
        toastTimerRef.current = setTimeout(() => {
          setToast(prev => ({ ...prev, show: false }));
        }, 1800);
      }, []);

      const navigate = useCallback((key, params = {}) => {
        setDirection('push');
        setStack(prev => [...prev, { key, params }]);
      }, []);

      const goBack = useCallback(() => {
        if (stack.length <= 1) return;
        setDirection('pop');
        setStack(prev => prev.slice(0, -1));
      }, [stack.length]);

      const handleTabChange = useCallback((tab) => {
        setActiveTab(tab);
        setDirection('push');
        setStack([{ key: tab, params: {} }]);
      }, []);

      const openStall = useCallback((id) => {
        navigate('detail', { stallId: id });
      }, [navigate]);

      const openActionSheet = useCallback(() => {
        setActionSheetShow(true);
      }, []);

      const addToCart = useCallback(() => {
        showToast('已加入购物车', 'success');
      }, [showToast]);

      // TabBar items
      const tabItems = [
        { key: 'home', label: '首页', icon: 'home' },
        { key: 'category', label: '分类', icon: 'category' },
        { key: 'map', label: '地图', icon: 'map' },
        { key: 'favorites', label: '收藏', icon: 'favorite' },
        { key: 'profile', label: '我的', icon: 'profile' },
      ];

      // Determine if current page is tab-level (no back)
      const isTabLevel = stack.length === 1;

      const getNavTitle = () => {
        const titles = {
          home: '',
          category: '分类',
          map: '夜市地图',
          favorites: '我的收藏',
          profile: '个人中心',
          detail: '',
          spec: '设计规范',
          api: '接口文档',
        };
        return titles[currentPage.key] || '';
      };

      const isNavSolid = () => {
        // Pages that need solid nav from the start
        return ['favorites', 'profile', 'spec', 'api'].includes(currentPage.key) && isTabLevel;
      };

      // Render page content
      const renderPage = () => {
        const { key, params } = currentPage;
        const animClass = direction === 'push' ? 'page-enter' : 'page-enter-back';

        return (
          <div className={`page-container ${animClass}`} key={stack.length + '-' + key}>
            {key === 'home' && <HomePage onOpenStall={openStall} onOpenActionSheet={openActionSheet} />}
            {key === 'category' && <CategoryPage onOpenStall={openStall} />}
            {key === 'map' && <MapPage onOpenStall={openStall} />}
            {key === 'favorites' && <FavoritesPage onOpenStall={openStall} showToast={showToast} />}
            {key === 'profile' && <ProfilePage showToast={showToast} />}
            {key === 'detail' && <DetailPage stallId={params.stallId} onBack={goBack} onAddToCart={addToCart} />}
            {key === 'spec' && <DesignSpecPage />}
            {key === 'api' && <ApiDocPage />}
          </div>
        );
      };

      return (
        <div className="stage">
          {/* Links to spec/api */}
          <div style={{
            position: 'absolute', top: 30, right: 30,
            display: 'flex', gap: 10, zIndex: 100,
          }}>
            <button
              onClick={() => navigate('spec')}
              style={{
                padding: '8px 16px', borderRadius: 20,
                background: 'rgba(255, 154, 60, 0.15)',
                border: '1px solid rgba(255, 154, 60, 0.3)',
                color: 'var(--lantern)',
                fontSize: 12, fontWeight: 500,
                cursor: 'pointer',
                backdropFilter: 'blur(10px)',
              }}
            >
              设计规范
            </button>
            <button
              onClick={() => navigate('api')}
              style={{
                padding: '8px 16px', borderRadius: 20,
                background: 'rgba(122, 186, 74, 0.15)',
                border: '1px solid rgba(122, 186, 74, 0.3)',
                color: 'var(--scallion)',
                fontSize: 12, fontWeight: 500,
                cursor: 'pointer',
                backdropFilter: 'blur(10px)',
              }}
            >
              接口文档
            </button>
          </div>

          <div className="phone">
            <div className="phone-screen">
              <div className="phone-content">
                {/* Status bar */}
                <div className="status-bar">
                  <span>9:41</span>
                  <div className="right-icons">
                    <span>●●●●</span>
                    <span>📶</span>
                    <span>🔋</span>
                  </div>
                </div>

                {/* Nav bar with capsule */}
                <div className={`nav-bar ${isNavSolid() ? 'solid' : ''}`}>
                  <div className="nav-title">{getNavTitle()}</div>
                  <div className="capsule">
                    <div className="dot-group">
                      <div className="dot" />
                      <div className="dot" />
                      <div className="dot" />
                    </div>
                    <div className="circle-icon" />
                  </div>
                </div>

                {/* Pages */}
                {renderPage()}

                {/* TabBar - only show on tab-level pages */}
                {isTabLevel && activeTab !== 'detail' && (
                  <div className="tab-bar">
                    {tabItems.map(item => (
                      <div
                        key={item.key}
                        className={`tab-item ${activeTab === item.key ? 'active' : ''}`}
                        onClick={() => handleTabChange(item.key)}
                      >
                        <div className="tab-icon">
                          <Icon name={item.icon} size={24} color="currentColor" />
                        </div>
                        <span>{item.label}</span>
                      </div>
                    ))}
                  </div>
                )}

                {/* Action Sheet */}
                <ActionSheet
                  show={actionSheetShow}
                  onClose={() => setActionSheetShow(false)}
                  items={[
                    { label: '📷 拍菜品识别', onClick: () => showToast('拍照识别功能开发中', 'info') },
                    { label: '📍 上报新摊位', onClick: () => showToast('感谢您的反馈', 'success') },
                    { label: '⭐ 推荐给好友', onClick: () => showToast('已复制分享链接', 'success') },
                    { label: '取消收藏', danger: true, onClick: () => showToast('操作已取消', 'warning') },
                  ]}
                />

                {/* Toast */}
                <Toast show={toast.show} message={toast.message} type={toast.type} />
              </div>
            </div>
          </div>

          <CustomCursor />
        </div>
      );
    };

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Announce upgrade capability
    function announceUpgrade() {
      try {
        window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
      } catch (e) {}
    }
    announceUpgrade();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announceUpgrade, { once: true });
    }
  </script>
</body>
</html>

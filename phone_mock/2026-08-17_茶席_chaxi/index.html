<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Noto Sans SC", -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: radial-gradient(1200px 800px at 50% 40%, #e8e2d5 0%, #d6cfc0 60%, #bfb7a4 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #2C2825;
    user-select: none;
    -webkit-user-select: none;
  }
  #root { width: 100%; height: 100%; }

  /* ── Custom cursor ── */
  .cursor-dot {
    position: fixed;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #7A9B5E;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width .18s cubic-bezier(.2,.8,.2,1), height .18s cubic-bezier(.2,.8,.2,1),
                background-color .18s, opacity .2s;
    mix-blend-mode: difference;
    filter: invert(1) hue-rotate(180deg);
  }
  .cursor-dot.hover {
    width: 32px; height: 32px;
    background: rgba(122, 155, 94, 0.25);
    mix-blend-mode: normal;
    filter: none;
    border: 1.5px solid #7A9B5E;
  }
  .cursor-dot.click {
    width: 14px; height: 14px;
    background: #B8935A;
    mix-blend-mode: normal;
    filter: none;
  }
  .cursor-ring {
    position: fixed;
    width: 36px; height: 36px;
    border: 1px solid rgba(122, 155, 94, 0.4);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: transform .25s cubic-bezier(.2,.8,.2,1), opacity .3s,
                width .25s, height .25s, border-color .2s;
  }
  .cursor-ring.hover {
    width: 48px; height: 48px;
    border-color: rgba(184, 147, 90, 0.6);
  }
  .cursor-ring.click { transform: translate(-50%, -50%) scale(0.6); }

  /* ripple */
  @keyframes ripple-anim {
    0% { transform: scale(0); opacity: .6; }
    100% { transform: scale(4); opacity: 0; }
  }
  .ripple {
    position: fixed;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(184,147,90,.6) 0%, rgba(122,155,94,0) 70%);
    pointer-events: none;
    z-index: 9997;
    transform: translate(-50%, -50%) scale(0);
    animation: ripple-anim .7s cubic-bezier(.2,.8,.2,1) forwards;
  }

  /* stage */
  .stage {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .stage::before {
    content: '';
    position: absolute;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(184,147,90,.12) 0%, transparent 60%);
    filter: blur(40px);
    pointer-events: none;
  }
  .stage::after {
    content: '茶 席';
    position: absolute;
    top: 40px;
    font-family: "Ma Shan Zheng", serif;
    font-size: 28px;
    color: rgba(44, 40, 37, 0.18);
    letter-spacing: 12px;
    pointer-events: none;
  }
  .phone-wrap {
    position: relative;
    filter: drop-shadow(0 30px 60px rgba(44, 40, 37, 0.25))
            drop-shadow(0 10px 20px rgba(44, 40, 37, 0.15));
  }

  /* ── Mini-program weui-like typography ── */
  .serif { font-family: "Noto Serif SC", "Songti SC", serif; }
  .brush { font-family: "Ma Shan Zheng", "Noto Serif SC", serif; }

  /* scrollbar hide inside phone */
  .phone-scroll::-webkit-scrollbar { display: none; }
  .phone-scroll { scrollbar-width: none; -ms-overflow-style: none; }

  /* Tab bar */
  .tab-icon { transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
  .tab-item.active .tab-icon { transform: scale(1.15) translateY(-2px); }
  .tab-item.active .tab-label { color: #7A9B5E; font-weight: 600; }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    padding: 6px 0 2px;
  }
  .tab-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #7A9B5E;
    transform: scale(0);
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .tab-item.active .tab-dot { transform: scale(1); }

  /* page transitions */
  @keyframes page-push {
    0% { transform: translateX(100%); opacity: .5; }
    100% { transform: translateX(0); opacity: 1; }
  }
  @keyframes page-pop {
    0% { transform: translateX(0); opacity: 1; }
    100% { transform: translateX(30%); opacity: 0; }
  }
  .page-push { animation: page-push .35s cubic-bezier(.2,.8,.2,1) both; }
  .page-pop { animation: page-pop .3s cubic-bezier(.4,0,.2,1) both; }

  /* skeleton shimmer */
  @keyframes shimmer {
    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }
  }
  .skeleton {
    background: linear-gradient(90deg, rgba(210,200,180,.4) 25%, rgba(230,220,200,.8) 50%, rgba(210,200,180,.4) 75%);
    background-size: 800px 100%;
    animation: shimmer 1.4s ease-in-out infinite;
    border-radius: 6px;
  }

  /* entrance fade-up */
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fade-up .6s cubic-bezier(.2,.8,.2,1) both; }

  /* float bubble */
  @keyframes float-1 {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-8px) rotate(2deg); }
  }
  @keyframes float-2 {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(6px) rotate(-3deg); }
  }
  .float-1 { animation: float-1 4s ease-in-out infinite; }
  .float-2 { animation: float-2 5s ease-in-out infinite; }

  /* steam */
  @keyframes steam {
    0% { transform: translateY(0) scale(1); opacity: .5; }
    100% { transform: translateY(-30px) scale(1.4); opacity: 0; }
  }
  .steam { animation: steam 2.5s ease-out infinite; }

  /* scroll snap & parallax handled inline via refs */

  /* Action sheet animation */
  @keyframes sheet-up {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  @keyframes sheet-mask-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .sheet-up { animation: sheet-up .35s cubic-bezier(.2,.8,.2,1) both; }
  .mask-in { animation: sheet-mask-in .25s ease both; }

  /* card press */
  .press-card { transition: transform .2s cubic-bezier(.2,.8,.2,1); }
  .press-card:active { transform: scale(0.97); }

  /* swipe-left indicator */
  @keyframes swipe-hint {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(-6px); }
  }

  /* tea leaf spin */
  @keyframes leaf-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* brew drip */
  @keyframes drip {
    0% { transform: translateY(-10px) scaleY(0.6); opacity: 0; }
    40% { opacity: 1; }
    100% { transform: translateY(30px) scaleY(1.4); opacity: 0; }
  }

  /* tag chip hover */
  .chip { transition: all .2s; cursor: pointer; }
  .chip:hover { transform: translateY(-1px); box-shadow: 0 4px 8px rgba(44,40,37,.1); }
  .chip.active { background: #7A9B5E; color: #fff; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>

/* Layout: Hero banner + category grid + event cards + course highlights */
function HomePage({ onNavigate, onShowSheet }) {
  const [loading, setLoading] = useState(true);
  const [pullY, setPullY] = useState(0);
  const [pulling, setPulling] = useState(false);
  const scrollRef = useRef(null);
  const startY = useRef(0);

  useEffect(() => {
    const t = setTimeout(() => setLoading(false), 1200);
    return () => clearTimeout(t);
  }, []);

  // pull to refresh
  const handleTouchStart = (e) => {
    if (scrollRef.current?.scrollTop === 0) {
      startY.current = e.touches[0].clientY;
      setPulling(true);
    }
  };
  const handleTouchMove = (e) => {
    if (!pulling) return;
    const dy = e.touches[0].clientY - startY.current;
    if (dy > 0 && scrollRef.current?.scrollTop === 0) {
      setPullY(Math.min(dy * 0.5, 80));
    }
  };
  const handleTouchEnd = () => {
    if (pullY > 50) {
      setLoading(true);
      setPullY(60);
      setTimeout(() => {
        setLoading(false);
        setPullY(0);
      }, 1000);
    } else {
      setPullY(0);
    }
    setPulling(false);
  };

  // mouse-based pull (for desktop preview)
  const mouseStart = useRef(0);
  const mousePulling = useRef(false);
  const handleMouseDown = (e) => {
    if (scrollRef.current?.scrollTop === 0) {
      mouseStart.current = e.clientY;
      mousePulling.current = true;
    }
  };
  const handleMouseMove = (e) => {
    if (!mousePulling.current) return;
    const dy = e.clientY - mouseStart.current;
    if (dy > 0 && scrollRef.current?.scrollTop === 0) {
      setPullY(Math.min(dy * 0.5, 80));
    }
  };
  const handleMouseUp = () => {
    if (mousePulling.current && pullY > 50) {
      setLoading(true);
      setPullY(60);
      setTimeout(() => {
        setLoading(false);
        setPullY(0);
      }, 1000);
    } else if (mousePulling.current) {
      setPullY(0);
    }
    mousePulling.current = false;
  };

  return (
    <div
      ref={scrollRef}
      className="phone-scroll"
      style={{ height: '100%', overflowY: 'auto', position: 'relative' }}
      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}
      onTouchEnd={handleTouchEnd}
      onMouseDown={handleMouseDown}
      onMouseMove={handleMouseMove}
      onMouseUp={handleMouseUp}
      onMouseLeave={handleMouseUp}
    >
      {/* pull to refresh indicator */}
      <div style={{
        position: 'absolute', top: -60 + pullY,
        left: 0, right: 0, height: 60,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        gap: 8, color: C.inkMuted, fontSize: 13,
        transition: pulling ? 'none' : 'top .35s cubic-bezier(.2,.8,.2,1)',
      }}>

        <span>{pullY > 50 ? '松手刷新' : '下拉刷新'}</span>
      </div>

      <div style={{
        transform: `translateY(${pullY}px)`,
        transition: pulling ? 'none' : 'transform .35s cubic-bezier(.2,.8,.2,1)',
      }}>
        {loading ? (
          <HomeSkeleton />
        ) : (
          <>

              margin: '0 16px 16px',

              <div style={{

/* ────── Custom Cursor ────── */
function CustomCursor() {
  const dotRef = useRef(null);
  const ringRef = useRef(null);
  const pos = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const target = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const rafId = useRef(null);
  const ringPos = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const ringTarget = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const visible = useRef(false);
  const reducedMotion = useRef(false);

  useEffect(() => {
    reducedMotion.current = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reducedMotion.current) return;

    const animate = () => {
      // dot follows instantly (with lerp for smoothness)
      pos.current.x += (target.current.x - pos.current.x) * 0.6;
      pos.current.y += (target.current.y - pos.current.y) * 0.6;

      // ring lags behind
      ringPos.current.x += (ringTarget.current.x - ringPos.current.x) * 0.18;
      ringPos.current.y += (ringTarget.current.y - ringPos.current.y) * 0.18;

      if (dotRef.current) {
        dotRef.current.style.left = pos.current.x + 'px';
        dotRef.current.style.top = pos.current.y + 'px';
      }
      if (ringRef.current) {
        ringRef.current.style.left = ringPos.current.x + 'px';
        ringRef.current.style.top = ringPos.current.y + 'px';
      }

      rafId.current = requestAnimationFrame(animate);
    };
    rafId.current = requestAnimationFrame(animate);

    const handleMove = (e) => {
      target.current.x = e.clientX;
      target.current.y = e.clientY;
      ringTarget.current.x = e.clientX;
      ringTarget.current.y = e.clientY;

      if (!visible.current) {
        visible.current = true;
        if (dotRef.current) dotRef.current.style.opacity = '1';
        if (ringRef.current) ringRef.current.style.opacity = '1';
      }

      // hover detection
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const interactive = el?.closest?.('.interactive');
      const cursorType = interactive?.dataset?.cursor;
      if (dotRef.current) {
        if (interactive) {
          dotRef.current.classList.add('hover');
        } else {
          dotRef.current.classList.remove('hover');
        }
      }
      if (ringRef.current) {
        if (interactive) {
          ringRef.current.classList.add('hover');
        } else {
          ringRef.current.classList.remove('hover');
        }
      }
    };

    const handleDown = (e) => {
      target.current.x = e.clientX;
      target.current.y = e.clientY;
      if (dotRef.current) dotRef.current.classList.add('click');
      if (ringRef.current) ringRef.current.classList.add('click');

      // ripple
      const ripple = document.createElement('div');
      ripple.className = 'ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 700);
    };

    const handleUp = () => {
      if (dotRef.current) dotRef.current.classList.remove('click');
      if (ringRef.current) ringRef.current.classList.remove('click');
    };

    const handleLeave = () => {
      visible.current = false;
      if (dotRef.current) dotRef.current.style.opacity = '0';
      if (ringRef.current) ringRef.current.style.opacity = '0';
    };

    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mousedown', handleDown);
    window.addEventListener('mouseup', handleUp);
    document.addEventListener('mouseleave', handleLeave);
    document.addEventListener('mouseenter', () => {
      visible.current = true;
      if (dotRef.current) dotRef.current.style.opacity = '1';
      if (ringRef.current) ringRef.current.style.opacity = '1';
    });

    // visibility change pause
    const handleVisibility = () => {
      if (document.hidden) {
        if (rafId.current) cancelAnimationFrame(rafId.current);
        rafId.current = null;
      } else {
        if (!rafId.current) rafId.current = requestAnimationFrame(animate);
      }
    };
    document.addEventListener('visibilitychange', handleVisibility);

    // initial center
    target.current.x = window.innerWidth / 2;
    target.current.y = window.innerHeight / 2;
    ringTarget.current.x = window.innerWidth / 2;
    ringTarget.current.y = window.innerHeight / 2;
    pos.current.x = window.innerWidth / 2;
    pos.current.y = window.innerHeight / 2;
    ringPos.current.x = window.innerWidth / 2;
    ringPos.current.y = window.innerHeight / 2;

    return () => {
      if (rafId.current) cancelAnimationFrame(rafId.current);
      window.removeEventListener('mousemove', handleMove);
      window.removeEventListener('mousedown', handleDown);
      window.removeEventListener('mouseup', handleUp);
      document.removeEventListener('mouseleave', handleLeave);
      document.removeEventListener('visibilitychange', handleVisibility);
    };
  }, []);

  if (typeof window !== 'undefined' && window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches) {
    return null;
  }

  return (
    <>
      <div ref={ringRef} className="cursor-ring" style={{ opacity: 0 }} />
      <div ref={dotRef} className="cursor-dot" style={{ opacity: 0 }} />
    </>
  );
}

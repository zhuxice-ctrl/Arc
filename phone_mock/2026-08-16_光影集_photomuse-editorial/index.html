// ===== 全局 Hook =====
function useAppState() {
  // 路由：index / detail / adminLogin / admin
  const [page, setPage] = useState('index');
  const [pageStack, setPageStack] = useState(['index']);

  // 全局 Toast
  const [toast, setToast] = useState({ visible: false, message: '', type: 'info' });

  // 下单表单状态（对齐契约 data 字段）
  const [form, setForm] = useState({
    selectedProductId: PRODUCTS[0].productId,
    selectedStyleId: STYLES[0].styleId,
    backgroundIndex: 0,
    clothingIndex: 0,
    specIndex: 0,
    customerNote: '',
    contactPhone: '',
    queryPassword: '',
    photos: [],           // [{ id, url, size }]
    authorization: {
      isSelfOrAuthorized: false,
      isAdult: false,
      agreesProduction: false,
    },
    // 查询面板
    showQueryPanel: false,
    queryOrderId: '',
    queryContactPhone: '',
    queryOrderPassword: '',
  });

  // 订单列表
  const [orders, setOrders] = useState([]);
  const [ordersLoading, setOrdersLoading] = useState(true);

  // 当前订单（详情页）
  const [currentOrder, setCurrentOrder] = useState(null);
  const [currentOrderFiles, setCurrentOrderFiles] = useState([]);
  const [detailLoading, setDetailLoading] = useState(false);
  const [queryMode, setQueryMode] = useState(false);

  // 管理端
  const [adminPassword, setAdminPassword] = useState('');
  const [isAdmin, setIsAdmin] = useState(false);
  const [adminOrders, setAdminOrders] = useState([]);
  const [adminStatus, setAdminStatus] = useState('photo_review');
  const [adminLoading, setAdminLoading] = useState(true);
  const [actionOrderId, setActionOrderId] = useState(null);

  const showToast = useCallback((message, type = 'info', duration = 2200) => {
    setToast({ visible: true, message, type });
    setTimeout(() => setToast(t => ({ ...t, visible: false })), duration);
  }, []);

  const navigate = useCallback((newPage, params = {}) => {
    setPageStack(prev => [...prev, newPage]);
    setPage(newPage);
  }, []);

  const goBack = useCallback(() => {
    setPageStack(prev => {
      if (prev.length <= 1) return prev;
      const newStack = prev.slice(0, -1);
      setPage(newStack[newStack.length - 1]);
      return newStack;
    });
  }, []);

  const goHome = useCallback(() => {
    setPageStack(['index']);
    setPage('index');
  }, []);

  // 初始化：模拟加载订单列表
  useEffect(() => {
    setOrdersLoading(true);
    setTimeout(() => {
      const demoOrders = [
        {
          orderId: 'AIStudio-1730000000-abc123',
          productName: '证件照体验版',
          styleName: '蓝底正装',
          price: '¥3.9',

          updatedAt: '2026-08-15T10:25:00Z',
          customerUrls: [IMG.cinematic],
          deliveryUrls: [IMG.idBlue],
        },
        {
          orderId: 'AIStudio-1729000000-def456',
          productName: '简历形象照',
          styleName: '白底简约',
          price: '¥29.9',
          order_status: 'photo_review',
          photo_check: 'unchecked',
          reference_photo_count: 2,
          delivery_file_count: 0,
          reviewNote: '',
          createdAt: '2026-08-14T14:05:00Z',
          updatedAt: '2026-08-14T14:06:00Z',
          customerUrls: [IMG.magazine, IMG.portrait],
          deliveryUrls: [],

      setOrders(demoOrders);
      setOrdersLoading(false);

  }, []);

  return {

    page, navigate, goBack, goHome, pageStack,
    // Toast
    toast, showToast,
    // 表单
    form, setForm,
    // 订单列表
    orders, setOrders, ordersLoading, setOrdersLoading,
    // 当前订单
    currentOrder, setCurrentOrder,
    currentOrderFiles, setCurrentOrderFiles,
    detailLoading, setDetailLoading,
    queryMode, setQueryMode,
    // 管理端
    adminPassword, setAdminPassword,
    isAdmin, setIsAdmin,
    adminOrders, setAdminOrders,
    adminStatus, setAdminStatus,
    adminLoading, setAdminLoading,
    actionOrderId, setActionOrderId,

}

// ===== 全局组件 =====
function Toast({ message, visible, type = 'info' }) {
  const bgMap = {
    info: 'rgba(26,26,26,0.92)',
    success: 'rgba(46,107,63,0.92)',
    error: 'rgba(178,58,58,0.92)',
    warning: 'rgba(198,106,46,0.92)',
  };
  return (
    <div style={{
      position: 'fixed',
      top: '38%',
      left: '50%',
      transform: 'translateX(-50%)',
      padding: '11px 22px',
      background: bgMap[type],
      backdropFilter: 'blur(12px)',
      color: '#fff',
      fontSize: 13,
      lineHeight: 1.5,
      borderRadius: 10,
      zIndex: 9999,
      opacity: visible ? 1 : 0,
      pointerEvents: 'none',
      transition: 'opacity 0.25s ease',
      textAlign: 'center',
      maxWidth: '78%',
      fontWeight: 400,
      letterSpacing: 0.2,
      boxShadow: '0 8px 32px rgba(0,0,0,0.2)',
    }}>
      {message}
    </div>
  );
}

// 发丝线分隔
function Hairline({ style }) {
  return <div style={{ height: 1, background: PM.hairline, opacity: 0.5, ...style }} />;
}

// 页面容器
function PageFrame({ children }) {
  return (
    <div style={{
      width: '100%',
      maxWidth: 480,
      height: '100%',
      margin: '0 auto',
      background: PM.pageBg,
      position: 'relative',
      overflow: 'hidden',
      display: 'flex',
      flexDirection: 'column',
    }}>
      {children}
    </div>
  );
}

// ===== 主 App =====
function App() {
  const state = useAppState();
  const { page, pageStack } = state;

  const renderPage = () => {
    const { IndexPage } = window;
    const { DetailPage } = window;
    const { AdminLoginPage } = window;
    const { AdminPage } = window;

    switch (page) {
      case 'detail': return <DetailPage {...state} />;
      case 'adminLogin': return <AdminLoginPage {...state} />;
      case 'admin': return <AdminPage {...state} />;
      default: return <IndexPage {...state} />;
    }
  };

  const pageKey = `${page}-${pageStack.length}`;

  return (
    <div style={{
      width: '100%', height: '100%',
      background: PM.pageBg,
      overflow: 'hidden',
    }}>
      <PageFrame>
        <div
          key={pageKey}
          style={{
            width: '100%',
            height: '100%',
            animation: 'slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1)',
            overflow: 'hidden',
            display: 'flex',
            flexDirection: 'column',
          }}
        >
          {renderPage()}
        </div>
      </PageFrame>
      <Toast message={state.toast.message} visible={state.toast.visible} type={state.toast.type} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// 暴露到全局（页面组件通过 window 访问）
Object.assign(window, {

  BACKGROUND_OPTIONS,
  CLOTHING_OPTIONS,
  SPEC_OPTIONS,
  PRODUCT_EXAMPLES,
  Hairline,
  PageFrame,
  Toast,
});


// ===== 页面一：Index 下单主页 =====
// 对齐契约区块树：page-nav / hero / 套餐 / 效果范例 / 拍照引导 / 风格 / 制作要求 / 上传 / 授权 / 提交 / 查询订单 / 我的订单 / 管理入口

function IndexPage(props) {
  const s = PM;
  const {
    form, setForm,
    orders, setOrders, ordersLoading,
    navigate, showToast,
  } = props;

  const [isSubmitting, setIsSubmitting] = useState(false);
  const [exampleImgLoaded, setExampleImgLoaded] = useState(false);

  const currentProduct = PRODUCTS.find(p => p.productId === form.selectedProductId) || PRODUCTS[0];
  const currentExample = PRODUCT_EXAMPLES[form.selectedProductId] || PRODUCT_EXAMPLES.id_photo_9_9;
  const currentStyle = STYLES.find(st => st.styleId === form.selectedStyleId) || STYLES[0];

  // ---- 交互方法（对齐行为契约） ----
  const [hoverProduct, setHoverProduct] = useState(null);
  const [hoverStyle, setHoverStyle] = useState(null);

  const selectProduct = (productId) => {
    setForm(prev => ({
      ...prev,
      selectedProductId: productId,
      // 选简历形象照时强制风格为白底简约（ID-03）
      selectedStyleId: productId === 'resume_photo_29_9' ? 'ID-03' : prev.selectedStyleId,
    }));
    setExampleImgLoaded(false);
  };

  const selectStyle = (styleId) => {
    setForm(prev => ({ ...prev, selectedStyleId: styleId }));
  };

  const setPickerIndex = (field, index) => {
    setForm(prev => ({ ...prev, [field]: index }));
  };

  const setField = (field, value) => {
    setForm(prev => ({ ...prev, [field]: value }));
  };

  const toggleAuth = (field) => {
    setForm(prev => ({
      ...prev,
      authorization: { ...prev.authorization, [field]: !prev.authorization[field] },
    }));
  };

  const toggleQueryPanel = () => {
    setForm(prev => ({ ...prev, showQueryPanel: !prev.showQueryPanel }));
  };

  const choosePhotos = () => {
    if (form.photos.length >= 3) {
      showToast('最多上传 3 张参考照片', 'error');
      return;
    }
    const remaining = 3 - form.photos.length;
    const candidates = [IMG.cinematic, IMG.portrait, IMG.magazine];
    const newPhotos = [];
    for (let i = 0; i < remaining; i++) {
      const idx = (form.photos.length + i) % candidates.length;
      newPhotos.push({
        id: Date.now() + i,
        tempFilePath: candidates[idx],
        url: candidates[idx],
        size: 1024000 + Math.floor(Math.random() * 500000),
      });
    }
    setForm(prev => ({ ...prev, photos: [...prev.photos, ...newPhotos] }));
    showToast('照片已添加', 'success');
  };

  const removePhoto = (index) => {
    setForm(prev => ({
      ...prev,
      photos: prev.photos.filter((_, i) => i !== index),
    }));
  };

  const allAuthChecked = form.authorization.isSelfOrAuthorized
    && form.authorization.isAdult
    && form.authorization.agreesProduction;

  const submitOrder = () => {
    // 校验（对齐契约 VALIDATION_ERROR / AUTHORIZATION_REQUIRED / PHOTO_REQUIRED）
    if (form.photos.length === 0) {
      showToast('请至少上传 1 张正脸照片', 'error');
      return;
    }
    if (!form.contactPhone || !/^1\d{10}$/.test(form.contactPhone.replace(/\s/g, ''))) {
      showToast('请填写正确的手机号', 'error');
      return;
    }
    if (!form.queryPassword || form.queryPassword.length < 6) {
      showToast('查询密码至少 6 位', 'error');
      return;
    }
    if (!allAuthChecked) {
      showToast('请先确认本人/成年人授权', 'error');
      return;
    }

    setIsSubmitting(true);
    // 模拟三阶段：create → upload → submit
    setTimeout(() => {
      const newOrder = {
        orderId: `AIStudio-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        productName: currentProduct.name,
        styleName: currentStyle.name,
        price: currentProduct.price,
        order_status: 'photo_review',
        photo_check: 'unchecked',
        reference_photo_count: form.photos.length,
        delivery_file_count: 0,
        reviewNote: '',
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        customerUrls: form.photos.map(p => p.url),
        deliveryUrls: [],
        background: BACKGROUND_OPTIONS[form.backgroundIndex],
        clothing: CLOTHING_OPTIONS[form.clothingIndex],
        spec: SPEC_OPTIONS[form.specIndex],
      };
      // 插入到订单列表顶部
      setOrders(prev => [newOrder, ...prev]);
      // 清表单（对齐契约）
      setForm(prev => ({
        ...prev,
        photos: [],
        customerNote: '',
        contactPhone: '',
        queryPassword: '',
        authorization: { isSelfOrAuthorized: false, isAdult: false, agreesProduction: false },
      }));
      setIsSubmitting(false);
      showToast('订单提交成功', 'success');
      // 跳详情
      setTimeout(() => {
        props.setCurrentOrder(newOrder);
        props.setCurrentOrderFiles([
          ...form.photos.map((p, i) => ({ fileId: `cust-${i}`, fileType: 'customer_photo', fileID: p.url, fileName: `photo-${i + 1}.jpg`, size: p.size, status: 'uploaded' })),
        ]);
        navigate('detail');
      }, 400);
    }, 1400);
  };

  // 查询订单

// 对齐契约：状态卡 / 订单信息 / 补拍上传 / 交付图 / 进度 / queryMode

function DetailPage(props) {
  const s = PM;
  const {
    currentOrder, setCurrentOrder,
    currentOrderFiles, setCurrentOrderFiles,
    detailLoading, setDetailLoading,
    queryMode, setQueryMode,
    goBack, navigate, showToast,
  } = props;

  const [retakePhotos, setRetakePhotos] = useState([]);
  const [isUploading, setIsUploading] = useState(false);
  const [progress, setProgress] = useState(65);
  const [previewUrl, setPreviewUrl] = useState(null);

  const order = currentOrder;
  const needRetake = order?.photo_check === 'need_retake';

  const customerFiles = currentOrderFiles.filter(f => f.fileType === 'customer_photo');
  const deliveryFiles = currentOrderFiles.filter(f => f.fileType === 'delivery');

  // 模拟生成中进度推进
  useEffect(() => {
    if (order && (order.order_status === 'queued' || order.order_status === 'generating')) {
      const timer = setInterval(() => {
        setProgress(prev => {
          if (prev >= 100) {
            clearInterval(timer);
            setCurrentOrder(prev => prev ? {
              ...prev,
              order_status: 'delivered',
              delivery_file_count: 1,
            } : null);
            return 100;
          }
          return prev + 1.5;
        });
      }, 280);
      return () => clearInterval(timer);
    }
  }, [order?.order_status]);

  if (!order) {
    return (
      <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', color: s.inkTertiary }}>
        加载订单中...
      </div>
    );
  }

  const chooseRetakePhotos = () => {
    if (retakePhotos.length >= 3) { showToast('最多上传 3 张参考照片', 'error'); return; }
    const remaining = 3 - retakePhotos.length;
    const candidates = [IMG.portrait, IMG.idBlue, IMG.magazine];
    const newPhotos = [];
    for (let i = 0; i < remaining; i++) {
      newPhotos.push({
        id: Date.now() + i,
        tempFilePath: candidates[(retakePhotos.length + i) % candidates.length],
        url: candidates[(retakePhotos.length + i) % candidates.length],
        size: 800000 + Math.floor(Math.random() * 400000),
      });
    }
    setRetakePhotos(prev => [...prev, ...newPhotos]);
  };

  const removeRetakePhoto = (index) => {
    setRetakePhotos(prev => prev.filter((_, i) => i !== index));
  };

  const submitRetakePhotos = () => {
    if (retakePhotos.length === 0) { showToast('请至少上传 1 张正脸照片', 'error'); return; }
    setIsUploading(true);
    // 模拟 upload → submit
    setTimeout(() => {
      setCurrentOrder(prev => prev ? {
        ...prev,
        order_status: 'photo_review',
        photo_check: 'unchecked',
        reference_photo_count: prev.reference_photo_count + retakePhotos.length,
      } : null);
      setCurrentOrderFiles(prev => [
        ...prev,
        ...retakePhotos.map((p, i) => ({
          fileId: `retake-${Date.now()}-${i}`,
          fileType: 'customer_photo',
          fileID: p.url,
          fileName: `retake-${i + 1}.jpg`,
          size: p.size,
          status: 'uploaded',
        })),
      ]);
      setRetakePhotos([]);
      setIsUploading(false);
      showToast('补拍照片已提交', 'success');
    }, 1200);
  };

  const previewDelivery = (url) => {
    setPreviewUrl(url);
  };

  const closePreview = () => {
    setPreviewUrl(null);
  };

  const statusInfo = STATUS_LABELS[order.order_status] || '进行中';
  const photoCheckInfo = PHOTO_CHECK_LABELS[order.photo_check] || '未知';

  // 步骤进度
  const steps = [
    { label: '上传', done: order.order_status !== 'waiting_photos' },
    { label: '审核', done: order.order_status !== 'photo_review' && order.order_status !== 'waiting_photos' && order.photo_check !== 'need_retake' && order.photo_check !== 'unchecked', current: order.order_status === 'photo_review' || order.photo_check === 'need_retake' },
    { label: '制作', done: order.order_status === 'qc' || order.order_status === 'delivered' || order.order_status === 'cancelled', current: order.order_status === 'queued' || order.order_status === 'generating' },
    { label: '交付', done: order.order_status === 'delivered', current: order.order_status === 'qc' },
  ];

  const isActive = (order.order_status === 'queued' || order.order_status === 'generating' || order.order_status === 'qc');

  return (
    <div style={{
      flex: 1, overflowY: 'auto', overflowX: 'hidden',
      background: s.pageBg, color: s.ink,
    }}>

      {/* 顶栏 */}
      <div style={{
        position: 'sticky', top: 0, zIndex: 10,
        background: s.pageBg,
      }}>
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '52px 24px 14px',
        }}>
          <div
            onClick={goBack}
            style={{
              width: 32, height: 32,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              cursor: 'pointer',
            }}
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={s.ink} strokeWidth="1">
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </div>
          <div style={{ fontSize: 13, fontWeight: 500, letterSpacing: 2, textTransform: 'uppercase', color: s.ink }}>
            Order Detail
          </div>
          <div style={{ width: 32 }} />
        </div>
        <div style={{ height: 1, background: s.hairline, opacity: 0.4 }} />
      </div>

      {/* 状态大标题区 */}
      <div style={{ padding: '36px 28px 28px', textAlign: 'center' }}>
        <div style={{
          fontSize: 9,
          letterSpacing: 3,
          textTransform: 'uppercase',
          color: s.inkTertiary,
          marginBottom: 16,
          fontFamily: s.mono,
        }}>{order.orderId}</div>

        <h1 style={{
          fontFamily: s.display,
          fontSize: 48,
          fontWeight: 400,
          lineHeight: 0.95,
          marginBottom: 4,
        }}>
          {order.order_status === 'delivered' ? 'Ready' :
           needRetake ? 'Retake' :
           order.order_status === 'photo_review' ? 'In' :
           order.order_status === 'cancelled' ? 'Cancelled' :
           'In'}
        </h1>
        <h1 style={{
          fontFamily: s.display,
          fontSize: 48,
          fontWeight: 400,
          fontStyle: 'italic',
          lineHeight: 0.95,
        }}>
          {order.order_status === 'delivered' ? 'to View' :
           needRetake ? 'Required' :
           order.order_status === 'photo_review' ? 'Review' :
           order.order_status === 'cancelled' ? 'Order' :
           'Progress'}
        </h1>

        <div style={{
          width: 36, height: 1,
          background: s.ink,
          margin: '24px auto',
        }} />

        <p style={{
          fontSize: 13,
          color: s.inkSecondary,
          lineHeight: 1.75,

          margin: '0 auto',

          {order.order_status === 'delivered'
            ? '您的照片已制作完成，快来查看吧。'
            : needRetake
            ? '照片不符合要求，请重新上传清晰正脸照。'
            : order.order_status === 'photo_review'
            ? '工作人员正在审核您的照片，请稍候。'
            : order.order_status === 'cancelled'
            ? '订单已取消。'
            : '照片正在制作中，完成后会第一时间呈现。'}
        </p>
      </div>

      {/* 进度条与步骤节点（生成中显示） */}
      {isActive && (
        <div style={{ padding: '0 28px 32px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 12 }}>
            <span style={{ fontSize: 11, color: s.inkSecondary }}>制作进度</span>
            <span style={{
              fontFamily: s.serif,
              fontStyle: 'italic',
              fontSize: 16,
              color: s.ink,
            }}>{Math.floor(progress)}%</span>
          </div>
          <div style={{
            height: 2,
            background: s.divider,
          }}>
            <div style={{
              width: `${progress}%`,

          <div style={{
            display: 'flex',

              style={{
                width: '100%',
                minHeight: 100,
                padding: 12,
                background: s.surfaceAlt,
                border: `1px solid ${s.border}`,
                fontSize: 13,
                color: s.ink,
                outline: 'none',
                resize: 'none',
                fontFamily: s.body,
                lineHeight: 1.6,
                marginBottom: 16,
              }}
            />

            {/* 常用原因快捷 */}
            <div style={{
              display: 'flex',
              flexWrap: 'wrap',
              gap: 6,
              marginBottom: 20,
            }}>
              {['光线过暗', '面部有遮挡', '角度不端正', '像素模糊'].map(reason => (
                <div
                  key={reason}
                  onClick={() => setRetakeReason(reason + '，请重新上传清晰正脸照。')}
                  style={{
                    padding: '4px 10px',
                    fontSize: 11,
                    border: `1px solid ${s.border}`,
                    color: s.inkSecondary,
                    cursor: 'pointer',
                  }}
                >{reason}</div>
              ))}
            </div>

            <div style={{ display: 'flex', gap: 10 }}>
              <button
                onClick={() => setShowRetakeModal(null)}
                style={{
                  flex: 1,
                  height: 46,
                  background: 'transparent',
                  border: `1px solid ${s.hairline}`,
                  color: s.inkTertiary,
                  fontSize: 12,
                  cursor: 'pointer',
                  letterSpacing: 1,
                }}
              >取消</button>
              <button
                onClick={confirmRetake}
                style={{
                  flex: 1,
                  height: 46,
                  background: s.warning,
                  border: 'none',
                  color: '#fff',
                  fontSize: 12,
                  fontWeight: 500,
                  cursor: 'pointer',
                  letterSpacing: 2,
                }}
              >确认重拍</button>
            </div>
          </div>
        </div>
      )}

      {/* ===== 图片预览层 ===== */}
      {previewUrl && (
        <div
          onClick={() => setPreviewUrl(null)}
          style={{
            position: 'fixed',
            top: 0, left: 0, right: 0, bottom: 0,
            background: 'rgba(0,0,0,0.92)',
            zIndex: 300,
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            animation: 'fadeIn 0.25s ease',
            cursor: 'zoom-out',
          }}
        >
          <img src={previewUrl} style={{
            maxWidth: '90%',
            maxHeight: '80%',
            objectFit: 'contain',
          }} />
          <div
            onClick={() => setPreviewUrl(null)}
            style={{
              position: 'absolute',
              top: 24, right: 24,
              width: 40, height: 40,
              borderRadius: '50%',
              border: '1px solid rgba(255,255,255,0.3)',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              cursor: 'pointer',
            }}
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="1">
              <path d="M18 6L6 18M6 6l12 12" />
            </svg>
          </div>
        </div>
      )}
    </div>
  );
}

// 管理操作按钮
function AdminActionBtn({ label, color, onClick, loading, full = false }) {
  const s = PM;
  return (
    <button
      onClick={onClick}
      disabled={loading}
      onMouseEnter={(e) => {
        if (!loading) {
          e.currentTarget.style.background = color;
          e.currentTarget.style.color = '#fff';
          e.currentTarget.style.fontWeight = 600;
        }
      }}
      onMouseLeave={(e) => {
        e.currentTarget.style.background = 'transparent';
        e.currentTarget.style.color = color;
        e.currentTarget.style.fontWeight = 500;
      }}
      style={{
        flex: full ? 1 : undefined,
        flexGrow: 1,
        height: 40,
        background: 'transparent',
        border: 'none',
        color: color,
        fontSize: 12,
        cursor: loading ? 'not-allowed' : 'pointer',
        fontWeight: 500,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        borderRight: full ? 'none' : `1px solid ${s.divider}`,
        padding: '0 8px',
        letterSpacing: 0.3,
        whiteSpace: 'nowrap',
        transition: 'all 0.2s ease',
        borderRadius: 4,
      }}
    >
      {loading ? '...' : label}
    </button>
  );
}

Object.assign(window, { AdminPage, AdminActionBtn });

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="creative-medium" content="interactive-prototype" />
<title>Chalk Up 攀岩社区 - V2 手机 UI</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" />
<style>
/* ============================================
   Chalk Up 攀岩社区 · V2 原生 App UI
   配色：岩壁赭红 #B23A2A · 镁粉米白 #F6F2EA · 炭黑 #1C1A17 · 松针绿 #4C6B4F
   ============================================ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --rock: #B23A2A;
  --rock-dark: #8A2B1F;
  --rock-light: #D4543F;
  --chalk: #F6F2EA;
  --chalk-2: #EDE7D8;
  --chalk-3: #D9D1BD;
  --charcoal: #1C1A17;
  --charcoal-2: #2C2925;
  --charcoal-3: #4A463F;
  --pine: #4C6B4F;
  --pine-light: #6B8A6E;
  --pine-dark: #36503A;
  --amber: #D49A3E;
  --amber-light: #E8B96A;
  --shadow-1: 0 2px 8px rgba(28,26,23,0.08);
  --shadow-2: 0 8px 24px rgba(28,26,23,0.12);
  --shadow-3: 0 16px 48px rgba(28,26,23,0.18);
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --tabbar-h: 62px;
  --statusbar-h: 44px;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0f0e0c;
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--charcoal);
  -webkit-font-smoothing: antialiased;
  cursor: none;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

/* ===== Custom Cursor ===== */
.cursor-dot {
  position: fixed;
  top: 0; left: 0;
  width: 8px; height: 8px;
  background: var(--chalk);
  border-radius: 50%;
  pointer-events: none;
  z-index: 99999;
  transform: translate(-50%, -50%);
  transition: width 0.2s cubic-bezier(.2,.8,.2,1), height 0.2s cubic-bezier(.2,.8,.2,1),
              background 0.2s ease, border-color 0.2s ease;
  mix-blend-mode: difference;
}
.cursor-ring {
  position: fixed;
  top: 0; left: 0;
  width: 36px; height: 36px;
  border: 1.5px solid var(--chalk);
  border-radius: 50%;
  pointer-events: none;
  z-index: 99998;
  transform: translate(-50%, -50%);
  transition: width 0.25s cubic-bezier(.2,.8,.2,1), height 0.25s cubic-bezier(.2,.8,.2,1),
              border-color 0.2s ease, border-width 0.2s ease;
  mix-blend-mode: difference;
}
.cursor-ring.hover {
  width: 56px; height: 56px;
  border-width: 2px;
}
.cursor-dot.hover {
  width: 4px; height: 4px;
}
.cursor-ripple {
  position: fixed;
  top: 0; left: 0;
  width: 20px; height: 20px;
  border: 2px solid var(--chalk);
  border-radius: 50%;
  pointer-events: none;
  z-index: 99997;
  transform: translate(-50%, -50%) scale(0);
  opacity: 0;
  mix-blend-mode: difference;
}
@keyframes cursorRipple {
  0% { transform: translate(-50%, -50%) scale(0); opacity: 0.8; }
  100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
}

/* ===== Stage / Phone Frame ===== */
.stage {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(178,58,42,0.15), transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(76,107,79,0.12), transparent 50%),
    #121110;
  position: relative;
}

.phone {
  position: relative;
  width: 380px;
  height: 780px;
  background: #1a1917;
  border-radius: 52px;
  padding: 14px;
  box-shadow:
    0 40px 100px rgba(0,0,0,0.5),
    0 4px 16px rgba(0,0,0,0.3),
    inset 0 1px 0 rgba(255,255,255,0.05);
  border: 1px solid #2a2824;
}

.phone-side-btn {
  position: absolute;
  background: #2a2824;
  border-radius: 2px;
}
.phone-btn-vol-up { left: -2px; top: 140px; width: 3px; height: 36px; }
.phone-btn-vol-dn { left: -2px; top: 188px; width: 3px; height: 36px; }
.phone-btn-power { right: -2px; top: 160px; width: 3px; height: 64px; }

.screen {
  width: 100%;
  height: 100%;
  background: var(--chalk);
  border-radius: 40px;
  overflow: hidden;
  position: relative;
}

/* ===== Status Bar ===== */
.status-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: var(--statusbar-h);
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 14px;
  font-weight: 600;
  color: var(--charcoal);
  z-index: 200;
  pointer-events: none;
}
.status-bar.dark { color: var(--chalk); }
.status-bar .right {
  display: flex;
  gap: 6px;
  align-items: center;
  font-size: 12px;
}
.status-bar .signal { letter-spacing: -1px; }

.notch {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 110px;
  height: 30px;
  background: #0a0908;
  border-radius: 20px;
  z-index: 210;
}

/* ===== Page Container ===== */
.page-container {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.page {
  position: absolute;
  inset: 0;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  transform: translateX(100%);
  transition: transform 0.45s cubic-bezier(.2,.8,.2,1), opacity 0.3s ease;
  background: var(--chalk);
}
.page.active {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0);
}
.page.slide-left {
  transform: translateX(-30%);
  opacity: 0.5;
}

/* Scrollable content area */
.page-scroll {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.page-scroll::-webkit-scrollbar { display: none; }

/* ===== Tab Bar ===== */
.tabbar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: var(--tabbar-h);
  background: rgba(246,242,234,0.85);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-top: 0.5px solid rgba(28,26,23,0.1);
  display: flex;
  align-items: flex-start;
  justify-content: space-around;
  padding: 6px 8px 0;
  z-index: 150;
}
.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 0;
  cursor: pointer;
  position: relative;
  transition: transform 0.2s ease;
}
.tab-item:active { transform: scale(0.9); }
.tab-item svg { width: 22px; height: 22px; stroke: var(--charcoal-3); transition: stroke 0.2s ease; }
.tab-item.active svg { stroke: var(--rock); }
.tab-item span {
  font-size: 10px;
  color: var(--charcoal-3);
  font-weight: 500;
  transition: color 0.2s ease;
}
.tab-item.active span { color: var(--rock); font-weight: 600; }
.tab-dot {
  position: absolute;
  top: 2px;
  right: calc(50% - 14px);
  width: 6px; height: 6px;
  background: var(--rock);
  border-radius: 50%;
  transform: scale(0);
  transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
}
.tab-item.active .tab-dot { transform: scale(1); }

/* ===== Home Page ===== */
.home-hero {
  position: relative;
  padding: calc(var(--statusbar-h) + 16px) 20px 24px;
  background: linear-gradient(180deg, var(--rock) 0%, var(--rock-dark) 70%, var(--chalk) 100%);
  color: var(--chalk);
  min-height: 280px;
}

.home-hero::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(circle at 85% 25%, rgba(255,255,255,0.08) 0%, transparent 40%),
    radial-gradient(circle at 15% 60%, rgba(0,0,0,0.15) 0%, transparent 50%);
  pointer-events: none;
}

.home-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-mark {
  width: 36px; height: 36px;
  background: var(--chalk);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--rock);
  font-weight: 900;
  font-size: 18px;
  font-family: 'Noto Serif SC', serif;
}
.brand-name {
  font-family: 'Noto Serif SC', serif;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.5px;
}
.brand-sub {
  font-size: 10px;
  opacity: 0.7;
  font-weight: 400;
}

.home-icons {
  display: flex;
  gap: 12px;
}
.icon-btn {
  width: 36px; height: 36px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.2s ease, transform 0.15s ease;
}
.icon-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.2); }
.icon-btn svg { width: 18px; height: 18px; stroke: var(--chalk); }

/* Hero greeting */
.hero-greet {
  margin: 8px 0 18px;
}
.hero-greet .eyebrow {
  font-size: 12px;
  opacity: 0.7;
  margin-bottom: 4px;
}
.hero-greet h1 {
  font-family: 'Noto Serif SC', serif;
  font-size: 26px;
  font-weight: 700;
  line-height: 1.3;
}
.hero-greet h1 em {
  font-style: normal;
  color: var(--amber-light);
}

/* Quick stats row */
.hero-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 16px;
}
.stat-pill {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.12);
  backdrop-filter: blur(10px);
  border-radius: 14px;
  padding: 12px 10px;
  text-align: center;
}
.stat-pill .num {
  font-size: 20px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  display: block;
  line-height: 1;
  margin-bottom: 4px;
}
.stat-pill .lbl {
  font-size: 10px;
  opacity: 0.7;
}

/* Entrance animation */
.home-hero .brand { opacity: 0; transform: translateY(-10px); animation: fadeDown 0.7s 0.1s forwards; }
.home-hero .home-icons { opacity: 0; transform: translateY(-10px); animation: fadeDown 0.7s 0.2s forwards; }
.hero-greet .eyebrow { opacity: 0; transform: translateY(10px); animation: fadeUp 0.7s 0.3s forwards; }
.hero-greet h1 { opacity: 0; transform: translateY(10px); animation: fadeUp 0.7s 0.4s forwards; }
.hero-stats .stat-pill { opacity: 0; transform: translateY(15px) scale(0.95); }
.hero-stats .stat-pill:nth-child(1) { animation: fadeUp 0.6s 0.55s forwards cubic-bezier(.2,.8,.2,1); }
.hero-stats .stat-pill:nth-child(2) { animation: fadeUp 0.6s 0.65s forwards cubic-bezier(.2,.8,.2,1); }
.hero-stats .stat-pill:nth-child(3) { animation: fadeUp 0.6s 0.75s forwards cubic-bezier(.2,.8,.2,1); }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(15px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== Home feed section ===== */
.home-section {
  padding: 0 20px;
  margin-top: -10px;
  position: relative;
  z-index: 2;
}
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin: 20px 0 12px;
}
.section-head h2 {
  font-family: 'Noto Serif SC', serif;
  font-size: 17px;
  font-weight: 700;
  color: var(--charcoal);
}
.section-head .more {
  font-size: 12px;
  color: var(--rock);
  font-weight: 500;
  cursor: pointer;
}

/* Featured gym card */
.featured-card {
  position: relative;
  height: 180px;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-2);
  cursor: pointer;
  transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
}
.featured-card:active { transform: scale(0.97); }
.featured-card .bg {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, transparent 30%, rgba(28,26,23,0.85) 100%),
    linear-gradient(135deg, var(--rock-light) 0%, var(--rock-dark) 50%, var(--charcoal) 100%);
}
.featured-card .bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(212,154,62,0.25), transparent 50%),
    radial-gradient(ellipse at 70% 70%, rgba(76,107,79,0.3), transparent 50%);
}
/* climbing holds pattern */
.holds-pattern {
  position: absolute;
  inset: 0;
  opacity: 0.35;
}
.hold {
  position: absolute;
  border-radius: 50% 40% 60% 30%;
}
.hold:nth-child(1) { width: 28px; height: 22px; background: var(--amber); top: 15%; left: 20%; transform: rotate(-15deg); }
.hold:nth-child(2) { width: 18px; height: 24px; background: var(--pine-light); top: 35%; left: 60%; transform: rotate(25deg); border-radius: 40% 50% 30% 60%; }
.hold:nth-child(3) { width: 22px; height: 16px; background: var(--chalk); top: 55%; left: 35%; transform: rotate(10deg); }
.hold:nth-child(4) { width: 14px; height: 20px; background: var(--rock-light); top: 25%; left: 75%; transform: rotate(-30deg); }
.hold:nth-child(5) { width: 20px; height: 18px; background: var(--amber-light); top: 65%; left: 78%; transform: rotate(15deg); }
.hold:nth-child(6) { width: 24px; height: 20px; background: var(--pine); top: 45%; left: 12%; transform: rotate(20deg); border-radius: 60% 30% 50% 40%; }

.featured-card .content {
  position: absolute;
  left: 16px; right: 16px; bottom: 16px;
  color: var(--chalk);
  z-index: 2;
}
.featured-card .tag {
  display: inline-block;
  padding: 3px 8px;
  background: var(--amber);
  color: var(--charcoal);
  font-size: 10px;
  font-weight: 700;
  border-radius: 6px;
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}
.featured-card h3 {
  font-family: 'Noto Serif SC', serif;
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 4px;
}
.featured-card .meta {
  font-size: 11px;
  opacity: 0.8;
  display: flex;
  gap: 10px;
}

/* Post feed cards */
.post-card {
  background: white;
  border-radius: var(--radius-md);
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-1);
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  position: relative;
  overflow: hidden;
}
.post-card:active {
  transform: scale(0.98);
  box-shadow: var(--shadow-2);
}
.post-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  color: white;
  font-family: 'Noto Serif SC', serif;
}
.avatar-a { background: linear-gradient(135deg, var(--rock), var(--rock-dark)); }
.avatar-b { background: linear-gradient(135deg, var(--pine), var(--pine-dark)); }
.avatar-c { background: linear-gradient(135deg, var(--amber), var(--rock)); }
.avatar-d { background: linear-gradient(135deg, var(--charcoal-2), var(--charcoal)); }

.post-user .name {
  font-size: 13px;
  font-weight: 600;
  color: var(--charcoal);
}
.post-user .time {
  font-size: 11px;
  color: var(--charcoal-3);
}

.post-body {
  font-size: 13px;
  line-height: 1.6;
  color: var(--charcoal-2);
  margin-bottom: 10px;
}
.post-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.tag-pill {
  padding: 2px 8px;
  background: var(--chalk-2);
  color: var(--rock);
  border-radius: 10px;
  font-size: 10px;
  font-weight: 500;
}
.tag-pill.green { color: var(--pine); }
.tag-pill.amber { color: #8B6914; background: rgba(212,154,62,0.15); }

.post-actions {
  display: flex;
  gap: 16px;
  padding-top: 10px;
  border-top: 0.5px solid var(--chalk-3);
}
.action-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--charcoal-3);
  cursor: pointer;
  transition: color 0.2s ease;
}
.action-btn:hover { color: var(--rock); }
.action-btn svg { width: 14px; height: 14px; stroke: currentColor; }
.action-btn.liked { color: var(--rock); }
.action-btn.liked svg { fill: var(--rock); stroke: var(--rock); }

/* ===== Pull-to-refresh ===== */
.pull-indicator {
  position: absolute;
  top: calc(var(--statusbar-h) - 30px);
  left: 50%;
  transform: translateX(-50%);
  width: 30px; height: 30px;
  opacity: 0;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 5;
}
.pull-indicator.visible { opacity: 1; }
.pull-indicator.spinning { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: translateX(-50%) rotate(360deg); } }

/* ===== Route Wall Page ===== */
.wall-page {
  background: var(--charcoal);
  color: var(--chalk);
}
.wall-header {
  padding: calc(var(--statusbar-h) + 12px) 20px 16px;
  background: var(--charcoal);
  position: sticky;
  top: 0;
  z-index: 10;
}
.wall-header .title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.wall-header h1 {
  font-family: 'Noto Serif SC', serif;
  font-size: 24px;
  font-weight: 700;
}
.wall-header .subtitle {
  font-size: 11px;
  opacity: 0.6;
  margin-top: 2px;
}
.gym-switcher {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--charcoal-2);
  padding: 6px 10px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 12px;
}
.gym-switcher svg { width: 14px; height: 14px; stroke: var(--chalk); }

/* Difficulty filter pills */
.diff-filter {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.diff-filter::-webkit-scrollbar { display: none; }
.diff-pill {
  flex-shrink: 0;
  padding: 6px 12px;
  background: var(--charcoal-2);
  border: 1px solid transparent;
  border-radius: 16px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  color: var(--chalk);
}
.diff-pill.active {
  border-color: currentColor;
}
.diff-V0 { color: #6BCB77; }
.diff-V1 { color: #98D8AA; }
.diff-V2 { color: #FFD93D; }
.diff-V3 { color: #FF9A3C; }
.diff-V4 { color: #FF6B6B; }
.diff-V5 { color: #D6345A; }
.diff-V6 { color: #7B337D; }
.diff-V7 { color: #2C3E50; background: #fff; color: #2C3E50; }

/* Route grid - mosaic / collage layout */
.route-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-auto-rows: 90px;
  gap: 6px;
  padding: 0 12px 100px;
}
.route-tile {
  position: relative;
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.25s cubic-bezier(.2,.8,.2,1);
}
.route-tile:active { transform: scale(0.95); }
.route-tile.tall { grid-row: span 2; }
.route-tile.wide { grid-column: span 2; }
.route-tile.big { grid-row: span 2; grid-column: span 2; }

.route-tile .tile-bg {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.route-tile .tile-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.7) 100%);
}
.route-tile .tile-info {
  position: absolute;
  left: 8px; bottom: 8px; right: 8px;
  color: white;
}
.route-tile .route-name {
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.route-tile .route-grade {
  font-size: 9px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  opacity: 0.9;
}

.tile-pink .tile-bg { background: linear-gradient(135deg, #D6345A, #8a1e3a); }
.tile-purple .tile-bg { background: linear-gradient(135deg, #7B337D, #4a1d4c); }
.tile-navy .tile-bg { background: linear-gradient(135deg, #2C3E50, #1a252f); }

/* Holds icon pattern */

/* ===== Route Detail Page ===== */
.route-detail {

}
.detail-hero {

}
.detail-hero-bg {

    radial-gradient(ellipse at 70% 70%, rgba(123,51,125,0.4), transparent 60%),

.detail-holds {

}

.detail-back {

.detail-share {

  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 10;
}
.detail-share svg { width: 18px; height: 18px; stroke: var(--chalk); }

.detail-content {
  position: relative;

}
.detail-content h1 {

  font-size: 24px;
  font-weight: 700;
  margin-bottom: 6px;
}
.detail-subtitle {

}
.grade-badge {

}

.detail-meta-grid {

}
.detail-meta-item {
  text-align: center;
}
.detail-meta-item .val {
  font-size: 18px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;

}
.detail-meta-item .lbl {

}

.detail-section {

}
.detail-section h3 {

}

.detail-section p {

}

/* Comments */
.comment-item {
  display: flex;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 0.5px solid rgba(255,255,255,0.06);
}
.comment-item .comment-body { flex: 1; }
.comment-item .comment-name {
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 4px;
}
.comment-item .comment-text {
  font-size: 12px;
  opacity: 0.75;
  line-height: 1.5;
}
.comment-item .comment-time {
  font-size: 10px;
  opacity: 0.4;
  margin-top: 4px;
}

.detail-cta {
  position: fixed;
  bottom: 0;
  left: 0; right: 0;
  padding: 14px 20px 24px;
  background: linear-gradient(180deg, transparent, var(--charcoal) 40%);

  gap: 10px;
  z-index: 50;
}
.btn-primary {
  flex: 1;
  padding: 14px;
  background: var(--rock);
  color: var(--chalk);

  border-radius: 14px;
  font-size: 14px;
  font-weight: 600;

}
.btn-primary:active { transform: scale(0.97); background: var(--rock-dark); }
.btn-secondary {
  padding: 14px 18px;
  background: rgba(255,255,255,0.1);
  color: var(--chalk);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 14px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: transform 0.15s ease;
}
.btn-secondary:active { transform: scale(0.97); }

/* ===== Climbing Partners Page (约爬广场) ===== */
.partners-page {
  background: var(--chalk);
  padding-bottom: calc(var(--tabbar-h) + 20px);
}
.partners-header {
  padding: calc(var(--statusbar-h) + 16px) 20px 0;
}
.partners-header h1 {
  font-family: 'Noto Serif SC', serif;
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 4px;
}
.partners-header .sub {
  font-size: 12px;
  color: var(--charcoal-3);
}

.partners-filter {
  display: flex;
  gap: 8px;
  padding: 14px 20px;
  overflow-x: auto;
  scrollbar-width: none;
}
.partners-filter::-webkit-scrollbar { display: none; }
.filter-chip {
  flex-shrink: 0;
  padding: 7px 14px;
  background: white;
  border: 1px solid var(--chalk-3);
  border-radius: 16px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
}
.filter-chip.active {
  background: var(--charcoal);
  color: var(--chalk);
  border-color: var(--charcoal);
}

/* Card stack */
.card-stack {
  position: relative;
  height: 420px;
  padding: 0 20px;
  margin-top: 10px;
}
.partner-card {
  position: absolute;
  left: 50%;
  top: 0;
  width: calc(100% - 40px);
  height: 100%;
  background: white;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-3);
  transform-origin: bottom center;
  cursor: grab;
  transition: transform 0.4s cubic-bezier(.2,.8,.2,1), opacity 0.3s ease;
  overflow: hidden;
}
.partner-card:active { cursor: grabbing; }

.partner-card .card-top {
  height: 180px;
  position: relative;
  background: linear-gradient(135deg, var(--rock-light), var(--rock-dark));
  display: flex;
  align-items: flex-end;
  padding: 20px;
}
.partner-card .card-top.pine { background: linear-gradient(135deg, var(--pine-light), var(--pine-dark)); }
.partner-card .card-top.amber { background: linear-gradient(135deg, var(--amber-light), var(--rock)); }
.partner-card .card-top.charcoal { background: linear-gradient(135deg, var(--charcoal-3), var(--charcoal)); }

.card-avatar-lg {
  width: 60px; height: 60px;
  border-radius: 50%;
  background: var(--chalk);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-weight: 700;
  font-family: 'Noto Serif SC', serif;
  color: var(--rock);
  margin-right: 14px;
  border: 3px solid rgba(255,255,255,0.3);
  flex-shrink: 0;
}
.card-top-info {
  color: var(--chalk);
  flex: 1;
}
.card-top-info .name {
  font-family: 'Noto Serif SC', serif;
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 4px;
}
.card-top-info .tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.card-top-info .tag-sm {
  padding: 2px 6px;
  background: rgba(255,255,255,0.2);
  border-radius: 4px;
  font-size: 10px;
  font-weight: 500;
}

.card-bottom {
  padding: 16px 18px;
}
.card-bottom .section-title {
  font-size: 11px;
  color: var(--charcoal-3);
  font-weight: 500;
  margin-bottom: 6px;
}
.card-bottom .desc {
  font-size: 12px;
  line-height: 1.6;
  color: var(--charcoal-2);
  margin-bottom: 12px;
}
.card-info-row {
  display: flex;
  gap: 12px;
  margin-bottom: 12px;
}
.card-info-item {
  flex: 1;
  background: var(--chalk);
  padding: 8px;
  border-radius: 8px;
}
.card-info-item .val {
  font-size: 13px;
  font-weight: 700;
  color: var(--charcoal);
  display: block;
  font-family: 'JetBrains Mono', monospace;
}
.card-info-item .lbl {
  font-size: 9px;
  color: var(--charcoal-3);
}
.card-actions-row {
  display: flex;
  gap: 8px;
}
.card-action-btn {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: none;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s ease;
}
.card-action-btn:active { transform: scale(0.95); }
.card-action-btn.pass {
  background: var(--chalk-2);
  color: var(--charcoal-3);
}
.card-action-btn.match {
  background: var(--rock);
  color: var(--chalk);
}

/* Stack positions */
.partner-card:nth-child(1) { transform: translateX(-50%) translateY(0) rotate(0deg); z-index: 4; }
.partner-card:nth-child(2) { transform: translateX(-50%) translateY(12px) scale(0.96); z-index: 3; opacity: 0.8; }
.partner-card:nth-child(3) { transform: translateX(-50%) translateY(24px) scale(0.92); z-index: 2; opacity: 0.6; }
.partner-card:nth-child(4) { transform: translateX(-50%) translateY(36px) scale(0.88); z-index: 1; opacity: 0.4; }

/* FAB */
.fab {
  position: absolute;
  bottom: calc(var(--tabbar-h) + 20px);
  right: 20px;
  width: 56px; height: 56px;
  background: var(--rock);
  color: var(--chalk);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 24px rgba(178,58,42,0.4);
  cursor: pointer;
  z-index: 100;
  transition: transform 0.3s cubic-bezier(.2,.8,.2,1), box-shadow 0.3s ease;
}
.fab:active {
  transform: scale(0.9);
  box-shadow: 0 4px 12px rgba(178,58,42,0.3);
}
.fab svg { width: 24px; height: 24px; stroke: currentColor; }

/* Floating FAB menu */
.fab-menu {
  position: absolute;
  bottom: calc(var(--tabbar-h) + 80px);
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 99;
}
.fab-menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  transform: translateX(20px);
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s cubic-bezier(.2,.8,.2,1);
}
.fab-menu.open .fab-menu-item {
  transform: translateX(0);
  opacity: 1;
  pointer-events: auto;
}
.fab-menu-item:nth-child(1) { transition-delay: 0.05s; }
.fab-menu-item:nth-child(2) { transition-delay: 0.1s; }
.fab-menu-item:nth-child(3) { transition-delay: 0.15s; }

.fab-menu-item .label {
  background: var(--charcoal);
  color: var(--chalk);
  padding: 5px 10px;
  border-radius: 8px;
  font-size: 11px;
  white-space: nowrap;
}
.fab-menu-item .icon-btn-sm {
  width: 44px; height: 44px;
  background: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-2);
  cursor: pointer;
}
.fab-menu-item .icon-btn-sm svg { width: 20px; height: 20px; stroke: var(--rock); }

/* ===== Training Page ===== */
.training-page {
  background: var(--chalk);
  padding-bottom: calc(var(--tabbar-h) + 20px);
}
.training-hero {
  padding: calc(var(--statusbar-h) + 20px) 20px 30px;
  background: linear-gradient(180deg, var(--pine-dark), var(--pine));
  color: var(--chalk);
  position: relative;
  overflow: hidden;
}
.training-hero::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 180px; height: 180px;
  background: radial-gradient(circle, rgba(255,255,255,0.08), transparent 70%);
  border-radius: 50%;
}
.training-hero::after {
  content: '';
  position: absolute;
  bottom: -60px; left: -30px;
  width: 160px; height: 160px;
  background: radial-gradient(circle, rgba(0,0,0,0.1), transparent 70%);
  border-radius: 50%;
}
.training-hero h1 {
  font-family: 'Noto Serif SC', serif;
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 4px;
  position: relative;
  z-index: 2;
}
.training-hero .sub {
  font-size: 12px;
  opacity: 0.75;
  position: relative;
  z-index: 2;
}

/* Circular progress */
.progress-wrap {
  display: flex;
  justify-content: center;
  margin: 20px 0;
  position: relative;
  z-index: 2;
}
.progress-ring {
  position: relative;
  width: 180px; height: 180px;
}
.progress-ring svg {
  transform: rotate(-90deg);
  width: 100%;
  height: 100%;
}
.progress-ring .ring-bg {
  stroke: rgba(255,255,255,0.15);
  fill: none;
  stroke-width: 12;
  stroke-linecap: round;
}
.progress-ring .ring-fill {
  stroke: var(--amber);
  fill: none;
  stroke-width: 12;
  stroke-linecap: round;
  stroke-dasharray: 440;
  stroke-dashoffset: 132;
  transition: stroke-dashoffset 1.5s cubic-bezier(.2,.8,.2,1);
  filter: drop-shadow(0 0 6px rgba(212,154,62,0.5));
}
.progress-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.progress-center .num {
  font-size: 42px;
  font-weight: 900;
  font-family: 'JetBrains Mono', monospace;
  line-height: 1;
}
.progress-center .lbl {
  font-size: 11px;
  opacity: 0.7;
  margin-top: 4px;
}
.progress-center .unit {
  font-size: 16px;
  font-weight: 400;
  opacity: 0.6;
}

.training-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  position: relative;
  z-index: 2;
}
.training-stat {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 10px;
  text-align: center;
}
.training-stat .val {
  font-size: 18px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  display: block;
}
.training-stat .lbl {
  font-size: 10px;
  opacity: 0.7;
}

/* Training plans */
.training-section {
  padding: 20px 20px 0;
}
.training-section h2 {
  font-family: 'Noto Serif SC', serif;
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 12px;
}
.plan-card {
  display: flex;
  align-items: center;
  gap: 12px;
  background: white;
  border-radius: var(--radius-md);
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-1);
  cursor: pointer;
  transition: transform 0.2s ease;
}
.plan-card:active { transform: scale(0.98); }
.plan-icon {
  width: 48px; height: 48px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.plan-icon svg { width: 24px; height: 24px; stroke: white; }
.plan-icon.red { background: linear-gradient(135deg, var(--rock-light), var(--rock-dark)); }
.plan-icon.green { background: linear-gradient(135deg, var(--pine-light), var(--pine-dark)); }
.plan-icon.amber { background: linear-gradient(135deg, var(--amber-light), var(--amber)); }
.plan-info { flex: 1; }
.plan-info .name {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 4px;
}
.plan-info .meta {
  font-size: 11px;
  color: var(--charcoal-3);
  display: flex;
  gap: 10px;
}
.plan-check {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 2px solid var(--chalk-3);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s ease;
}
.plan-check.done {
  background: var(--pine);
  border-color: var(--pine);
}
.plan-check.done svg { opacity: 1; }
.plan-check svg { width: 14px; height: 14px; stroke: white; opacity: 0; transition: opacity 0.2s ease; }

/* Weekly chart */
.week-chart {
  background: white;
  border-radius: var(--radius-md);
  padding: 16px;
  margin-top: 12px;
  box-shadow: var(--shadow-1);
}
.week-chart-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 14px;
}
.week-chart-head .title {
  font-size: 13px;
  font-weight: 600;
}
.week-chart-head .unit {
  font-size: 10px;
  color: var(--charcoal-3);
}
.week-bars {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  height: 80px;
}
.week-bar {
  flex: 1;
  background: var(--chalk-2);
  border-radius: 4px 4px 2px 2px;
  position: relative;
  transition: height 1s cubic-bezier(.2,.8,.2,1);
  min-height: 4px;
}
.week-bar.today { background: var(--rock); }
.week-bar.done { background: var(--pine); }
.week-bar .day-label {
  position: absolute;
  bottom: -18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  color: var(--charcoal-3);
  white-space: nowrap;
}

/* ===== Profile Page ===== */
.profile-page {
  background: var(--chalk);
  padding-bottom: calc(var(--tabbar-h) + 20px);
}
.profile-hero {
  padding: calc(var(--statusbar-h) + 20px) 20px 60px;

.profile-name {

  margin-bottom: 4px;

.profile-handle {

.profile-bio {

.profile-stats {

  border-top: 1px solid rgba(255,255,255,0.15);
}
.profile-stat .val {
  font-size: 20px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  display: block;
}
.profile-stat .lbl {
  font-size: 10px;
  opacity: 0.7;
}

/* Badge wall */
.badge-section {
  padding: 0 20px;
  margin-top: -30px;
  position: relative;
  z-index: 3;
}
.badge-card {
  background: white;
  border-radius: var(--radius-lg);
  padding: 16px;
  box-shadow: var(--shadow-2);
  margin-bottom: 14px;
}
.badge-card .head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;

function App() {
  const [currentPage, setCurrentPage] = useState('home');
  const [prevPage, setPrevPage] = useState(null);
  const [pageDirection, setPageDirection] = useState('forward');
  const [likedPosts, setLikedPosts] = useState({ 2: true });
  const [activeFilter, setActiveFilter] = useState('全部');
  const [fabOpen, setFabOpen] = useState(false);
  const [toastMsg, setToastMsg] = useState('');
  const [sheetOpen, setSheetOpen] = useState(false);
  const [sheetContent, setSheetContent] = useState(null);
  const [darkStatus, setDarkStatus] = useState(false);
  const [partnerIndex, setPartnerIndex] = useState(0);
  const [cardDrag, setCardDrag] = useState({ x: 0, y: 0 });
  const [planDones, setPlanDones] = useState({ 1: true, 2: true });
  const [progressAnim, setProgressAnim] = useState(false);
  const [activeApiTab, setActiveApiTab] = useState('线路');
  const [tilesAnimated, setTilesAnimated] = useState(false);
  const [pullOffset, setPullOffset] = useState(0);
  const [isRefreshing, setIsRefreshing] = useState(false);
  const [longPressItem, setLongPressItem] = useState(null);
  const [detailRoute, setDetailRoute] = useState(null);

  const tabbarPages = ['home', 'wall', 'partners', 'training', 'profile'];
  const fullPagePages = ['routeDetail', 'spec', 'api'];

  const navTo = useCallback((page, detail = null) => {
    if (page === currentPage && !detail) return;
    setPrevPage(currentPage);
    const isTabbarTarget = tabbarPages.includes(page);
    const isTabbarCurrent = tabbarPages.includes(currentPage);
    if (isTabbarTarget && isTabbarCurrent) {
      setPageDirection('none');
    } else if (fullPagePages.includes(page) || (page === 'routeDetail')) {
      setPageDirection('forward');
    } else if (fullPagePages.includes(currentPage) || currentPage === 'routeDetail') {
      setPageDirection('back');
    } else {
      setPageDirection('forward');
    }
    if (detail) setDetailRoute(detail);
    setCurrentPage(page);
    // update status bar dark state
    setDarkStatus(page === 'wall' || page === 'routeDetail' || page === 'api');
  }, [currentPage]);

  const goBack = useCallback(() => {
    if (prevPage) {
      navTo(prevPage);
      setPrevPage(null);
    } else {
      navTo('home');
    }
  }, [prevPage, navTo]);

  // Toast
  const showToast = useCallback((msg) => {
    setToastMsg(msg);
    setTimeout(() => setToastMsg(''), 2000);
  }, []);

  // Long press timer
  const longPressTimer = useRef(null);
  const longPressPos = useRef({ x: 0, y: 0 });

  const handleLongPressStart = useCallback((e, item, label) => {
    const screen = document.getElementById('screen');
    const rect = screen.getBoundingClientRect();
    longPressPos.current = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    longPressTimer.current = setTimeout(() => {
      setLongPressItem({ item, label });
      // haptic-like feedback
    }, 550);
  }, []);

  const handleLongPressEnd = useCallback(() => {
    if (longPressTimer.current) {
      clearTimeout(longPressTimer.current);
      longPressTimer.current = null;
    }
    setTimeout(() => setLongPressItem(null), 1500);
  }, []);

  // Pull to refresh
  const pullStartY = useRef(0);
  const scrollRef = useRef(null);

  const handlePullStart = useCallback((e) => {
    const scrollEl = document.querySelector('.page.active .page-scroll');
    if (scrollEl && scrollEl.scrollTop <= 0) {
      pullStartY.current = e.touches ? e.touches[0].clientY : e.clientY;
    }
  }, []);

  const handlePullMove = useCallback((e) => {
    if (!pullStartY.current) return;
    const scrollEl = document.querySelector('.page.active .page-scroll');
    if (!scrollEl || scrollEl.scrollTop > 0) { pullStartY.current = 0; return; }
    const currentY = e.touches ? e.touches[0].clientY : e.clientY;
    const diff = currentY - pullStartY.current;
    if (diff > 0) {
      setPullOffset(Math.min(diff * 0.5, 80));
    }
  }, []);

  const handlePullEnd = useCallback(() => {
    if (pullOffset > 50) {
      setIsRefreshing(true);
      setPullOffset(50);
      setTimeout(() => {
        setIsRefreshing(false);
        setPullOffset(0);
        showToast('已刷新');
      }, 1500);
    } else {
      setPullOffset(0);
    }
    pullStartY.current = 0;
  }, [pullOffset, showToast]);

  // Toggle like
  const toggleLike = useCallback((id) => {
    setLikedPosts(prev => ({ ...prev, [id]: !prev[id] }));
  }, []);

  // Card drag (for partner stack)
  const isDragging = useRef(false);
  const dragStart = useRef({ x: 0, y: 0 });

  const handleCardDragStart = useCallback((e) => {
    isDragging.current = true;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    dragStart.current = { x: clientX, y: clientY };
  }, []);

  const handleCardDragMove = useCallback((e) => {
    if (!isDragging.current) return;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const dx = clientX - dragStart.current.x;
    const dy = clientY - dragStart.current.y;
    setCardDrag({ x: dx, y: dy });
  }, []);

  const handleCardDragEnd = useCallback(() => {
    if (!isDragging.current) return;
    isDragging.current = false;
    if (Math.abs(cardDrag.x) > 100) {
      // swipe card
      const dir = cardDrag.x > 0 ? 'match' : 'pass';
      setTimeout(() => {
        setPartnerIndex(prev => (prev + 1) % partners.length);
        setCardDrag({ x: 0, y: 0 });
        showToast(dir === 'match' ? '已发出约爬邀请！' : '已跳过');
      }, 200);
    } else {
      setCardDrag({ x: 0, y: 0 });
    }
  }, [cardDrag, showToast]);

  // Open bottom sheet
  const openSheet = useCallback((content) => {
    setSheetContent(content);
    setSheetOpen(true);
  }, []);

  const closeSheet = useCallback(() => {
    setSheetOpen(false);
    setTimeout(() => setSheetContent(null), 400);
  }, []);

  // Toggle training plan
  const togglePlan = useCallback((id) => {
    setPlanDones(prev => ({ ...prev, [id]: !prev[id] }));
  }, []);

  // FAB items
  const fabItems = [
    { icon: <I.plus />, label: '发布动态', action: () => { setFabOpen(false); showToast('打开发布动态'); } },
    { icon: <I.users />, label: '发起约爬', action: () => { setFabOpen(false); showToast('发起约爬'); } },
    { icon: <I.calendar />, label: '记录打卡', action: () => { setFabOpen(false); showToast('记录今日打卡'); } },
  ];

  const diffs = ['全部', 'V0', 'V1', 'V2', 'V3', 'V4', 'V5', 'V6', 'V7'];
  const [activeDiff, setActiveDiff] = useState('全部');

  // trigger tile animation on wall page
  useEffect(() => {
    if (currentPage === 'wall') {
      const t = setTimeout(() => setTilesAnimated(true), 100);
      return () => clearTimeout(t);
    } else {
      setTilesAnimated(false);
    }
  }, [currentPage]);

  // progress animation
  useEffect(() => {
    if (currentPage === 'training') {
      const t = setTimeout(() => setProgressAnim(true), 300);
      return () => clearTimeout(t);
    } else {
      setProgressAnim(false);
    }
  }, [currentPage]);

  // API doc tabs & endpoints
  const apiEndpoints = {
    '线路': [
      { method: 'GET', path: '/api/v1/routes', desc: '获取岩馆线路列表，支持按难度、岩馆、颜色筛选。' },

      { method: 'GET', path: '/api/v1/feed', desc: '获取首页信息流，支持分页与按关注/热门排序。' },

/* ============================================
   Custom Cursor
   ============================================ */
(() => {
  const dot = document.getElementById('cursorDot');
  const ring = document.getElementById('cursorRing');
  const stage = document.getElementById('stage');

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let ringX = mouseX;
  let ringY = mouseY;
  let rafId = null;
  let paused = false;

  // center initial position
  dot.style.left = mouseX + 'px';
  dot.style.top = mouseY + 'px';
  ring.style.left = mouseX + 'px';
  ring.style.top = mouseY + 'px';

  const animateRing = () => {
    if (paused) return;
    ringX += (mouseX - ringX) * 0.18;
    ringY += (mouseY - ringY) * 0.18;
    ring.style.left = ringX + 'px';
    ring.style.top = ringY + 'px';
    rafId = requestAnimationFrame(animateRing);
  };

  const moveCursor = (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    dot.style.left = mouseX + 'px';
    dot.style.top = mouseY + 'px';
  };

  document.addEventListener('mousemove', moveCursor, { passive: true });
  rafId = requestAnimationFrame(animateRing);

  // Hover state
  const hoverables = 'button, .icon-btn, .tab-item, .post-card, .route-tile, .partner-card, .plan-card, .badge-item, .filter-chip, .diff-pill, .section-head .more, .fab, .fab-menu-item, .sheet-action, .api-nav-item, .action-btn, .gym-switcher, .settings';

  document.addEventListener('mouseover', (e) => {
    if (e.target.closest(hoverables)) {
      ring.classList.add('hover');
      dot.classList.add('hover');
    }
  });
  document.addEventListener('mouseout', (e) => {
    if (e.target.closest(hoverables)) {
      ring.classList.remove('hover');
      dot.classList.remove('hover');
    }
  });

  // Click ripple
  const createRipple = (e) => {
    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    ripple.style.animation = 'cursorRipple 0.6s cubic-bezier(.2,.8,.2,1) forwards';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  };
  document.addEventListener('click', createRipple);

  // Visibility change pause
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      paused = true;
      if (rafId) cancelAnimationFrame(rafId);
    } else {
      paused = false;
      rafId = requestAnimationFrame(animateRing);
    }
  });

  // Reduced motion
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    if (rafId) cancelAnimationFrame(rafId);
    ring.style.transition = 'none';
  }

  // Cleanup
  window.addEventListener('beforeunload', () => {
    if (rafId) cancelAnimationFrame(rafId);
    document.removeEventListener('mousemove', moveCursor);
    document.removeEventListener('click', createRipple);
  });
})();

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>百草集 · 传统中草药百科</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" />
<style>
  :root {
    --herb-green: #3A6B35;
    --warm-wood: #8B6914;
    --terracotta: #C65D3C;
    --rice-paper: #F5F0E1;
    --warm-white: #FAF8F3;
    --ink-black: #2A2418;
    --gray-brown: #7A6E5A;
    --herb-green-light: rgba(58, 107, 53, 0.08);
    --warm-wood-light: rgba(139, 105, 20, 0.08);
    --terracotta-light: rgba(198, 93, 60, 0.1);
    --divider: rgba(42, 36, 24, 0.08);
    --shadow-sm: 0 1px 2px rgba(42, 36, 24, 0.06);
    --shadow-md: 0 4px 16px rgba(42, 36, 24, 0.08);
    --shadow-lg: 0 12px 32px rgba(42, 36, 24, 0.12);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 24px;
    --font-serif: 'Noto Serif SC', 'Songti SC', serif;
    --font-sans: 'Noto Sans SC', 'PingFang SC', 'Helvetica Neue', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    min-height: 100vh;
    font-family: var(--font-sans);
    color: var(--ink-black);
    background: #E8E4D9;
    -webkit-font-smoothing: antialiased;
  }

  .page-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(ellipse at top, #F0EBDC 0%, #E8E4D9 50%, #D8D3C4 100%);
  }

  .device-stage {
    display: flex;
    gap: 32px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }

  .device-label {
    text-align: center;
    margin-top: 12px;
    color: var(--gray-brown);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  /* App container styles */
  .app-shell {
    width: 100%;
    height: 100%;
    background: var(--warm-white);
    overflow: hidden;
    position: relative;
    font-family: var(--font-sans);
  }

  .screen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow-y: auto;
    overflow-x: hidden;
    background: var(--warm-white);
    transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.25s ease;
    will-change: transform, opacity;
    -webkit-overflow-scrolling: touch;
  }
  .screen::-webkit-scrollbar { display: none; }
  .screen.hidden-left { transform: translateX(-30%); opacity: 0; pointer-events: none; }
  .screen.hidden-right { transform: translateX(30%); opacity: 0; pointer-events: none; }
  .screen.hidden-fade { opacity: 0; pointer-events: none; }
  .screen.modal-up { transform: translateY(100%); }

  /* Status bar spacer */
  .safe-top { padding-top: var(--ios-safe-top, 54px); }
  .safe-bottom { padding-bottom: var(--ios-safe-bottom, 34px); }

  /* Large title nav */
  .large-nav {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(250, 248, 243, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 0.5px solid transparent;
    transition: all 0.3s ease;
  }
  .large-nav.scrolled {
    border-bottom-color: var(--divider);
  }
  .large-nav .nav-inner {
    padding: 0 20px;
    padding-top: var(--ios-safe-top, 54px);
    transition: padding 0.3s ease;
  }
  .large-nav h1 {
    font-family: var(--font-serif);
    font-size: 34px;
    font-weight: 700;
    color: var(--ink-black);
    line-height: 1.2;
    padding: 8px 0 12px;
    transition: font-size 0.3s ease, padding 0.3s ease;
    letter-spacing: -0.01em;
  }
  .large-nav.scrolled h1 {
    font-size: 20px;
    padding: 12px 0 10px;
  }

  /* Tab Bar */
  .tab-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: calc(84px + var(--ios-safe-bottom, 34px));
    padding-bottom: var(--ios-safe-bottom, 34px);
    background: rgba(250, 248, 243, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 0.5px solid var(--divider);
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 20;
  }
  .tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 14px;
    color: var(--gray-brown);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: color 0.2s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    user-select: none;
  }
  .tab-item svg {
    width: 26px; height: 26px;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .tab-item.active {
    color: var(--herb-green);
  }
  .tab-item.active svg {
    transform: translateY(-2px) scale(1.08);
  }
  .tab-item:active {
    transform: scale(0.94);
  }

  /* Scroll content */
  .scroll-content {
    padding-bottom: calc(100px + var(--ios-safe-bottom, 34px));
  }

  /* Home page */
  .hero-banner {
    margin: 0 20px;
    position: relative;
    border-radius: var(--radius-lg);
    overflow: hidden;
    aspect-ratio: 4 / 3;
    box-shadow: var(--shadow-md);
  }
  .hero-banner img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 40%, rgba(42, 36, 24, 0.65) 100%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 20px;
  }
  .hero-tag {
    display: inline-block;
    padding: 4px 10px;
    background: var(--terracotta);
    color: white;
    font-size: 11px;
    font-weight: 600;
    border-radius: 20px;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
    align-self: flex-start;
  }
  .hero-title {
    font-family: var(--font-serif);
    font-size: 24px;
    font-weight: 700;
    color: white;
    line-height: 1.3;
    margin-bottom: 4px;
  }
  .hero-sub {
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    font-weight: 400;
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 24px 20px 12px;
  }
  .section-title {
    font-family: var(--font-serif);
    font-size: 20px;
    font-weight: 700;
    color: var(--ink-black);
  }
  .section-more {
    font-size: 13px;
    color: var(--warm-wood);
    font-weight: 500;
    cursor: pointer;
  }

  /* Horizontal scroll cards */
  .h-scroll {
    display: flex;
    gap: 12px;
    padding: 0 20px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .h-scroll::-webkit-scrollbar { display: none; }
  .h-card {
    flex: 0 0 140px;
    scroll-snap-align: start;
    background: var(--rice-paper);
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: transform 0.2s ease;
  }
  .h-card:active { transform: scale(0.97); }
  .h-card-img {
    width: 100%;
    aspect-ratio: 1;
    background: #E8E0CC;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
  }
  .h-card-body {
    padding: 10px 12px;
  }
  .h-card-name {
    font-family: var(--font-serif);
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-black);
    margin-bottom: 2px;
  }
  .h-card-nature {
    font-size: 11px;
    color: var(--gray-brown);
  }
  .nature-tag {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 500;
    margin-right: 4px;
  }
  .nature-warm { background: #FBE3D5; color: #C65D3C; }
  .nature-cool { background: #D4E4D1; color: #3A6B35; }
  .nature-neutral { background: #EDE2C7; color: #8B6914; }
  .nature-pungent { background: #F6E0B5; color: #A0721D; }

  /* Mosaic grid */
  .mosaic-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 0 20px;
  }
  .mosaic-item {
    border-radius: var(--radius-md);
    overflow: hidden;
    background: var(--rice-paper);
    position: relative;
    cursor: pointer;
    transition: transform 0.2s ease;
  }
  .mosaic-item:active { transform: scale(0.97); }
  .mosaic-item.tall { grid-row: span 2; }
  .mosaic-item.wide { grid-column: span 2; }
  .mosaic-item img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    min-height: 100px;
  }
  .mosaic-label {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 10px 12px;
    background: linear-gradient(transparent, rgba(42,36,24,0.7));
    color: white;
    font-weight: 500;
    font-size: 13px;
  }

  /* Pharmacopeia page - sticky tabs */
  .filter-tabs {
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(250, 248, 243, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 0 20px;
    display: flex;
    gap: 20px;
    overflow-x: auto;
    scrollbar-width: none;
    border-bottom: 0.5px solid var(--divider);
  }
  .filter-tabs::-webkit-scrollbar { display: none; }
  .filter-tab {
    flex: 0 0 auto;
    padding: 14px 0 12px;
    font-size: 15px;
    font-weight: 500;
    color: var(--gray-brown);
    position: relative;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.2s ease;
  }
  .filter-tab.active {
    color: var(--herb-green);
    font-weight: 600;
  }
  .filter-tab.active::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: var(--herb-green);
    border-radius: 2px;
  }

  /* Pull to refresh indicator */
  .pull-indicator {
    height: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--gray-brown);
    transition: height 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .pull-indicator.show {
    height: 50px;
  }
  .pull-indicator svg {
    width: 18px; height: 18px;
    margin-right: 6px;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  /* Herb list card */
  .herb-list {
    padding: 12px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .herb-card {
    display: flex;
    gap: 14px;
    padding: 14px;
    background: var(--rice-paper);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .herb-card:active { transform: scale(0.98); }
  .herb-thumb {
    width: 64px; height: 64px;
    border-radius: var(--radius-sm);
    background: #E8E0CC;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    flex-shrink: 0;
  }
  .herb-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
  }
  .herb-name-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .herb-name {
    font-family: var(--font-serif);
    font-size: 17px;
    font-weight: 700;
    color: var(--ink-black);
  }
  .herb-pinyin {
    font-size: 11px;
    color: var(--gray-brown);
    font-style: italic;
  }
  .herb-effect {
    font-size: 12px;
    color: var(--gray-brown);
    line-height: 1.4;
  }
  .herb-tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 2px;
  }

  /* Prescriptions - stacked cards */
  .prescription-stack {
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    perspective: 1000px;
    min-height: 500px;
    position: relative;
  }
  .rx-card {
    position: absolute;
    width: calc(100% - 40px);
    max-width: 320px;
    background: var(--rice-paper);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    padding: 20px;
    cursor: grab;
    transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.3s ease;
    user-select: none;
    touch-action: pan-y;
  }
  .rx-card:active { cursor: grabbing; }
  .rx-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
  }
  .rx-name {
    font-family: var(--font-serif);
    font-size: 22px;
    font-weight: 700;
    color: var(--ink-black);
  }
  .rx-classic-tag {
    padding: 3px 8px;
    background: var(--terracotta-light);
    color: var(--terracotta);
    font-size: 10px;
    font-weight: 600;
    border-radius: 4px;
  }
  .rx-source {
    font-size: 12px;
    color: var(--gray-brown);
    margin-bottom: 14px;
    font-style: italic;
  }
  .rx-herbs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .rx-herb-chip {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 10px;
    background: white;
    border-radius: 20px;
    font-size: 12px;
    color: var(--ink-black);
    box-shadow: var(--shadow-sm);
  }
  .rx-herb-chip .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--herb-green);
  }
  .rx-effect {
    font-size: 13px;
    color: var(--ink-black);
    line-height: 1.6;
    margin-bottom: 14px;
    padding: 12px;
    background: white;
    border-radius: var(--radius-sm);
    border-left: 3px solid var(--herb-green);
  }
  .rx-effect strong {
    color: var(--warm-wood);
    font-size: 12px;
    display: block;
    margin-bottom: 4px;
  }
  .rx-usage {
    font-size: 12px;
    color: var(--gray-brown);
    line-height: 1.5;
  }
  .rx-card-indicators {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 16px;
  }
  .rx-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(42, 36, 24, 0.2);
    transition: all 0.3s ease;
  }
  .rx-dot.active {
    width: 20px;
    border-radius: 3px;
    background: var(--herb-green);
  }
  .rx-hint {
    text-align: center;
    font-size: 12px;
    color: var(--gray-brown);
    margin-top: 8px;
  }

  /* Solar terms timeline */
  .solar-hero {
    margin: 0 20px;
    border-radius: var(--radius-lg);
    overflow: hidden;
    aspect-ratio: 16 / 9;
    position: relative;
    box-shadow: var(--shadow-md);
  }
  .solar-hero img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .solar-hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(42,36,24,0.2) 0%, rgba(42,36,24,0.7) 100%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 20px;
  }
  .solar-current-term {
    font-family: var(--font-serif);
    font-size: 28px;
    color: white;
    font-weight: 700;
  }
  .solar-current-sub {
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    margin-top: 4px;
  }

  .timeline {
    padding: 24px 20px;
    position: relative;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 72px;
    top: 24px;
    bottom: 24px;
    width: 2px;
    background: linear-gradient(180deg, var(--herb-green) 0%, var(--warm-wood) 50%, var(--terracotta) 100%);
    opacity: 0.3;
  }
  .timeline-item {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .timeline-item.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .timeline-date {
    width: 52px;
    flex-shrink: 0;
    text-align: right;
    padding-top: 4px;
  }
  .timeline-date .month {
    font-family: var(--font-serif);
    font-size: 18px;
    font-weight: 700;
    color: var(--warm-wood);
    line-height: 1;
  }
  .timeline-date .day {
    font-size: 11px;
    color: var(--gray-brown);
    margin-top: 2px;
  }
  .timeline-node {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--herb-green);
    border: 2px solid var(--warm-white);
    margin-top: 8px;
    margin-left: -6px;
    flex-shrink: 0;
    z-index: 1;
    box-shadow: 0 0 0 2px rgba(58,107,53,0.2);
  }
  .timeline-node.current {
    background: var(--terracotta);
    box-shadow: 0 0 0 4px rgba(198,93,60,0.2);
  }
  .timeline-content {
    flex: 1;
    background: var(--rice-paper);
    border-radius: var(--radius-md);
    padding: 14px;
    box-shadow: var(--shadow-sm);
  }
  .timeline-term {
    font-family: var(--font-serif);
    font-size: 17px;
    font-weight: 700;
    color: var(--ink-black);
    margin-bottom: 6px;
  }
  .timeline-herb {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--gray-brown);
  }
  .timeline-herb-icon {
    width: 36px; height: 36px;
    border-radius: var(--radius-sm);
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .timeline-herb-name {
    color: var(--herb-green);
    font-weight: 600;
  }

  /* Personal cabinet page */
  .cabinet-header {
    padding: 0 20px 24px;
    background: linear-gradient(180deg, var(--herb-green) 0%, #2D5429 100%);
    color: white;
    position: relative;
    overflow: hidden;
  }
  .cabinet-header::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 180px; height: 180px;
    background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
    border-radius: 50%;
  }
  .cabinet-top {
    display: flex;
    align-items: center;
    gap: 16px;
    padding-top: var(--ios-safe-top, 54px);
    margin-bottom: 24px;
  }
  .avatar {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #E8E0CC, #C9B890);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-serif);
    font-size: 24px;
    font-weight: 700;
    color: var(--warm-wood);
    border: 3px solid rgba(255,255,255,0.3);
  }
  .user-info h2 {
    font-family: var(--font-serif);
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .user-info p {
    font-size: 12px;
    opacity: 0.75;
  }

  .progress-ring-wrap {
    display: flex;
    align-items: center;
    gap: 20px;
    background: rgba(255,255,255,0.1);
    border-radius: var(--radius-lg);
    padding: 16px;
    backdrop-filter: blur(10px);
  }
  .progress-ring {
    width: 80px; height: 80px;
    flex-shrink: 0;
    position: relative;
  }
  .progress-ring svg {
    width: 100%; height: 100%;
    transform: rotate(-90deg);
  }
  .progress-ring circle {
    fill: none;
    stroke-width: 6;
  }
  .progress-ring .ring-bg {
    stroke: rgba(255,255,255,0.2);
  }
  .progress-ring .ring-fg {
    stroke: #F5D98C;
    stroke-linecap: round;
    stroke-dasharray: 207.3;
    stroke-dashoffset: 207.3;
    transition: stroke-dashoffset 1.5s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .progress-ring .ring-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-family: var(--font-serif);
  }
  .progress-ring .ring-num {
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
  }
  .progress-ring .ring-label {
    font-size: 9px;
    opacity: 0.7;
    margin-top: 2px;
  }
  .progress-info {
    flex: 1;
  }

  .detail-name {

  .detail-body {
    background: var(--warm-white);

  }
  .detail-section {
    margin-bottom: 24px;
  }
  .detail-section-title {
    font-family: var(--font-serif);
    font-size: 18px;
    font-weight: 700;
    color: var(--ink-black);
    margin-bottom: 10px;

    align-items: center;

  }
  .detail-section p {
    font-size: 14px;

    color: var(--ink-black);
    opacity: 0.85;
  }

  .nature-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .nature-card {
    background: var(--rice-paper);
    border-radius: var(--radius-md);
    padding: 14px;
  }
  .nature-card-label {
    font-size: 11px;
    color: var(--gray-brown);
    margin-bottom: 6px;
  }
  .nature-card-value {
    font-family: var(--font-serif);
    font-size: 16px;
    font-weight: 700;
    color: var(--herb-green);

  .taboo-box {
    background: var(--terracotta-light);

  .detail-bottom-bar {

  .icon-btn {
    width: 48px; height: 48px;
    border-radius: var(--radius-md);
    background: var(--rice-paper);

    align-items: center;
    justify-content: center;

    transition: transform 0.15s ease;
    flex-shrink: 0;

  .icon-btn:active { transform: scale(0.92); }
  .icon-btn.active {
    background: var(--terracotta-light);

  .primary-btn {
    flex: 1;
    height: 48px;
    border-radius: var(--radius-md);
    background: var(--herb-green);

    border-radius: 2px;

  .color-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;

  .color-swatch {

    background: white;
    border-radius: var(--radius-md);
    padding: 16px;

  .radius-demo {
    display: flex;
    gap: 12px;
    align-items: flex-end;

  .radius-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;

    border: 2px solid var(--herb-green);

  .radius-label {
    font-size: 11px;
    color: var(--gray-brown);
  }

  .spacing-demo {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: white;
    padding: 16px;
    border-radius: var(--radius-md);

    display: flex;
    align-items: center;
    gap: 12px;
  }
  .spacing-bar {
    background: var(--herb-green);
    height: 16px;

  .spacing-label {
    font-size: 11px;
    color: var(--gray-brown);
    min-width: 36px;
    font-family: 'SF Mono', 'Menlo', monospace;

  .motion-demo {
    background: white;
    border-radius: var(--radius-md);

    box-shadow: var(--shadow-sm);

    flex-direction: column;
    gap: 10px;

  .motion-item {

    align-items: center;
    gap: 12px;

    color: var(--ink-black);
  }
  .motion-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--herb-green);
  }

  /* API docs page */
  .api-container {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .api-card {
    background: var(--rice-paper);
    border-radius: var(--radius-md);

    box-shadow: var(--shadow-sm);

  .api-card-header {

    font-weight: 700;
    font-family: 'SF Mono', 'Menlo', monospace;

  .method-get { background: #D4E4D1; color: #3A6B35; }
  .method-post { background: #FBE3D5; color: #C65D3C; }
  .method-put { background: #EDE2C7; color: #8B6914; }
  .method-delete { background: #F8D7DA; color: #B91C1C; }
  .api-endpoint {
    flex: 1;
    font-size: 13px;
    font-family: 'SF Mono', 'Menlo', monospace;
    color: var(--ink-black);
    font-weight: 500;

  .api-chevron {
    color: var(--gray-brown);

    transition: transform 0.2s ease;
  }

  .api-card-body {
    display: none;
    padding: 14px 16px;
    font-size: 12px;

  .code-block .key { color: #C65D3C; }

  .code-block .num { color: #F5D98C; }

    font-weight: 600;

  .secondary-nav {

    flex: 1;
    text-align: center;

    font-weight: 600;

  /* Home entry animation */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-in > * {
    opacity: 0;
    animation: fadeUp 0.6s cubic-bezier(0.32, 0.72, 0, 1) forwards;
  }
  .animate-in > *:nth-child(1) { animation-delay: 0.05s; }
  .animate-in > *:nth-child(2) { animation-delay: 0.12s; }
  .animate-in > *:nth-child(3) { animation-delay: 0.2s; }
  .animate-in > *:nth-child(4) { animation-delay: 0.28s; }
  .animate-in > *:nth-child(5) { animation-delay: 0.36s; }
  .animate-in > *:nth-child(6) { animation-delay: 0.44s; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    .animate-in > * { opacity: 1; transform: none; }
  }

  /* Long press context menu */
  .context-menu {
    position: fixed;
    background: white;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    z-index: 100;
    min-width: 160px;
    animation: menuPop 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes menuPop {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }
  .context-menu-item {
    padding: 12px 16px;
    font-size: 14px;
    color: var(--ink-black);
    border-bottom: 0.5px solid var(--divider);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .context-menu-item:last-child { border-bottom: none; }
  .context-menu-item:active { background: var(--herb-green-light); }
  .context-menu-item.danger { color: var(--terracotta); }
  .context-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.2);
    z-index: 99;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* Modal */
  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(42, 36, 24, 0.5);
    z-index: 50;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    animation: fadeIn 0.25s ease;
  }
  .modal-sheet {
    width: 100%;
    background: var(--warm-white);
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    padding: 20px 20px calc(24px + var(--ios-safe-bottom, 34px));
    animation: slideUp 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    max-height: 80%;
    overflow-y: auto;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-handle {
    width: 36px;
    height: 4px;
    background: rgba(42, 36, 24, 0.2);
    border-radius: 2px;
    margin: 0 auto 16px;
  }
  .modal-title {
    font-family: var(--font-serif);
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
    text-align: center;
  }

  /* Search bar */
  .search-bar {
    margin: 0 20px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--rice-paper);
    border-radius: var(--radius-md);
    color: var(--gray-brown);
    font-size: 14px;

  /* Toast */
  .toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(42, 36, 24, 0.9);
    color: white;
    padding: 12px 20px;
    border-radius: var(--radius-md);
    font-size: 14px;
    z-index: 200;
    animation: toastIn 0.3s ease;
    pointer-events: none;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translate(-50%, -40%); }
    to { opacity: 1; transform: translate(-50%, -50%); }
  }
</style>
</head>

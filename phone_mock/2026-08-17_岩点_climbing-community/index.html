<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>岩点 · 攀岩馆社区 App — V2 手机 UI Mock</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@600;900&display=swap" />
<style>
:root {
  --rock-900: #1A1D22;
  --rock-800: #23272E;
  --rock-700: #2C313A;
  --rock-600: #3A3F4A;
  --rock-500: #525966;
  --rock-400: #7A8290;
  --rock-300: #A0A7B3;
  --rock-200: #C5CAD3;
  --rock-100: #E4E6EB;
  --rock-50:  #F2F3F5;

  --lava-700: #C24A1A;
  --lava-600: #E85D24;
  --lava-500: #FF7A3D;
  --lava-400: #FF9A6B;
  --lava-300: #FFBFA0;
  --lava-50:  #FFF1E8;

  --moss-700: #2D5A3D;
  --moss-600: #3A7A52;
  --moss-500: #5AA476;
  --moss-400: #84C69A;
  --moss-300: #B5DCC2;
  --moss-50:  #EAF5EE;

  --cream-500: #FDFBF7;
  --cream-400: #FAF6ED;
  --cream-300: #F5EFE0;
  --cream-200: #EDE5D1;

  --sand-500: #D9C9A6;
  --clay-500: #B07A5B;

  --font-display: "Noto Serif SC", "Songti SC", serif;
  --font-body: "Noto Sans SC", -apple-system, system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  font-family: var(--font-body);
  background: var(--rock-900);
  color: var(--cream-500);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  cursor: none;
}

/* ─────────── Custom Cursor ─────────── */
.cursor {
  position: fixed;
  width: 28px; height: 28px;
  border: 2px solid #fff;
  border-radius: 50%;
  pointer-events: none;
  z-index: 99999;
  transform: translate(-50%, -50%);
  transition: width 0.25s cubic-bezier(.22,1,.36,1),
              height 0.25s cubic-bezier(.22,1,.36,1),
              border-color 0.25s ease,
              background 0.25s ease;
  mix-blend-mode: difference;
}
.cursor-dot {
  position: fixed;
  width: 6px; height: 6px;
  background: var(--lava-500);
  border-radius: 50%;
  pointer-events: none;
  z-index: 100000;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 10px var(--lava-500), 0 0 20px rgba(255,122,61,0.5);
  transition: transform 0.08s ease-out, box-shadow 0.25s ease;
}
.cursor.glow {
  width: 56px; height: 56px;
  border-color: rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.04);
}
.cursor.click {
  width: 16px; height: 16px;
  border-color: var(--lava-500);
  background: var(--lava-500);
}
.cursor-ripple {
  position: fixed;
  width: 10px; height: 10px;
  border: 2px solid var(--lava-500);
  border-radius: 50%;
  pointer-events: none;
  z-index: 99998;
  transform: translate(-50%, -50%);
  animation: cursorRipple 0.6s cubic-bezier(.16,1,.3,1) forwards;
}
@keyframes cursorRipple {
  0% { width: 10px; height: 10px; opacity: 0.8; }
  100% { width: 60px; height: 60px; opacity: 0; border-width: 1px; }
}

/* ─────────── Page Stage ─────────── */
.stage {
  position: relative;
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(1200px 600px at 50% 40%, rgba(255,122,61,0.08), transparent 60%),
    radial-gradient(800px 400px at 80% 80%, rgba(90,164,118,0.06), transparent 60%),
    var(--rock-900);
  padding: 20px;
}
.stage-layout {
  display: flex;
  align-items: flex-start;
  gap: 32px;
  max-width: 100%;
}
.app-frame-wrap { position: relative; }
.side-panel {
  width: 260px;
  color: var(--cream-500);
  font-size: 13px;
  line-height: 1.7;
  padding-top: 8px;
}
.side-panel h3 {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 900;
  margin-bottom: 8px;
  color: var(--lava-400);
  letter-spacing: 2px;
}
.side-panel .tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  border: 1px solid var(--rock-600);
  font-size: 11px;
  color: var(--rock-300);
  margin-right: 6px;
  margin-bottom: 6px;
}
.side-panel .page-nav {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.side-panel .page-nav button {
  background: transparent;
  border: none;
  color: var(--rock-300);
  font-family: var(--font-body);
  font-size: 13px;
  padding: 7px 12px;
  text-align: left;
  cursor: none;
  border-radius: 8px;
  transition: background 0.2s, color 0.2s;
  display: flex;
  align-items: center;
  gap: 8px;
}
.side-panel .page-nav button .num {
  width: 22px; height: 22px;
  border-radius: 6px;
  background: var(--rock-700);
  color: var(--rock-300);
  font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 600;
  transition: background 0.2s, color 0.2s;
  flex-shrink: 0;
}
.side-panel .page-nav button.active {
  background: rgba(255,122,61,0.12);
  color: var(--lava-400);
}
.side-panel .page-nav button.active .num {
  background: var(--lava-500);
  color: #fff;
}
.side-panel .page-nav button:hover {
  background: var(--rock-700);
  color: var(--cream-500);
}

/* ─────────── iOS device frame customizations ─────────── */
.app-screen {
  width: 100%; height: 100%;
  position: relative;
  overflow: hidden;
}
.page-enter {
  animation: pageEnter 0.5s cubic-bezier(.22,1,.36,1) both;
}
@keyframes pageEnter {
  0% { opacity: 0; transform: translateY(14px) scale(0.98); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
.page-slide-right {
  animation: slideRight 0.35s cubic-bezier(.22,1,.36,1) both;
}
@keyframes slideRight {
  0% { opacity: 0; transform: translateX(24px); }
  100% { opacity: 1; transform: translateX(0); }
}

/* ─────────── Scrollbar hide inside app ─────────── */
.app-screen ::-webkit-scrollbar { display: none; }
.app-screen * { scrollbar-width: none; }

/* ─────────── Utility ─────────── */
.no-select {
  -webkit-user-select: none; user-select: none;
}
.clamp-1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clamp-2 {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ─────────── Tab Bar ─────────── */
.tab-bar {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 83px;
  padding-bottom: 28px;
  display: flex;
  align-items: center;
  justify-content: space-around;
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  background: rgba(26,29,34,0.72);
  border-top: 0.5px solid rgba(255,255,255,0.08);
  z-index: 30;
}
.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 14px;
  color: var(--rock-400);
  font-size: 10px;
  font-weight: 500;
  transition: color 0.2s;
  cursor: none;
}
.tab-item.active { color: var(--lava-500); }
.tab-item svg { width: 26px; height: 26px; }

/* ─────────── FAB ─────────── */
.fab {
  position: absolute;
  right: 16px;
  bottom: 100px;
  width: 56px; height: 56px;
  border-radius: 18px;
  background: linear-gradient(135deg, var(--lava-500), var(--lava-700));
  box-shadow: 0 8px 24px rgba(232,93,36,0.45),
              inset 0 1px 1px rgba(255,255,255,0.3),
              inset 0 -1px 1px rgba(0,0,0,0.15);
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  z-index: 25;
  cursor: none;
  animation: fabFloat 4s ease-in-out infinite;
}
@keyframes fabFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
.fab:active { transform: scale(0.92); }

/* ─────────── Hero entrance ─────────── */
.hero-stagger > * {
  opacity: 0;
  transform: translateY(16px);
  animation: heroItem 0.6s cubic-bezier(.22,1,.36,1) forwards;
}
.hero-stagger > *:nth-child(1) { animation-delay: 0.05s; }
.hero-stagger > *:nth-child(2) { animation-delay: 0.12s; }
.hero-stagger > *:nth-child(3) { animation-delay: 0.19s; }
.hero-stagger > *:nth-child(4) { animation-delay: 0.26s; }
.hero-stagger > *:nth-child(5) { animation-delay: 0.33s; }
.hero-stagger > *:nth-child(6) { animation-delay: 0.40s; }
@keyframes heroItem {
  to { opacity: 1; transform: translateY(0); }
}

/* ─────────── Card lift hover ─────────── */
.lift-card {
  transition: transform 0.35s cubic-bezier(.22,1,.36,1), box-shadow 0.35s;
}
.lift-card:active {
  transform: scale(0.97);
}

/* ─────────── Grade chips ─────────── */
.grade-chip {
  display: inline-flex;
  align-items: center; justify-content: center;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

/* ─────────── Progress Ring ─────────── */
.ring-bg {
  stroke: var(--rock-700);
  fill: none;
}
.ring-fg {
  fill: none;
  stroke-linecap: round;
  transition: stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1);
}

/* ─────────── Design spec page ─────────── */
.spec-swatch {
  height: 40px;
  border-radius: 10px;
  position: relative;
  overflow: hidden;
}
.spec-swatch::after {
  content: attr(data-color);
  position: absolute;
  right: 8px; top: 50%;
  transform: translateY(-50%);
  font-size: 10px;
  font-family: ui-monospace, monospace;
  opacity: 0.8;
}

/* ─────────── API doc page ─────────── */
.api-method {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  font-family: ui-monospace, monospace;
}
.api-method.get { background: rgba(90,164,118,0.18); color: var(--moss-400); }
.api-method.post { background: rgba(255,122,61,0.18); color: var(--lava-400); }
.api-method.put { background: rgba(217,201,166,0.18); color: var(--sand-500); }
.api-method.del { background: rgba(194,74,26,0.18); color: var(--lava-300); }

/* ─────────── Pull-to-refresh ─────────── */
.pull-indicator {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--lava-400);
  font-size: 12px;
  pointer-events: none;
  transition: height 0.3s ease;
}
.pull-spinner {
  width: 22px; height: 22px;
  border: 2px solid var(--rock-600);
  border-top-color: var(--lava-500);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─────────── Route tile tilt ─────────── */
.route-tile {
  transition: transform 0.4s cubic-bezier(.22,1,.36,1);
  transform-style: preserve-3d;
  will-change: transform;
}

/* ─────────── Shimmer ─────────── */
@keyframes shimmer {
  0% { background-position: -150% 0; }
  100% { background-position: 150% 0; }
}
.shimmer {
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(255,255,255,0.1) 50%,
    transparent 100%);
  background-size: 200% 100%;
  animation: shimmer 2.4s ease-in-out infinite;
}

/* ─────────── Profile avatar ring pulse ─────────── */
@keyframes ringPulse {
  0%, 100% { transform: scale(1); opacity: 0.4; }
  50% { transform: scale(1.1); opacity: 0; }
}
.avatar-ring-pulse {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid var(--lava-500);
  animation: ringPulse 2.8s ease-out infinite;
}

/* ─────────── Activity tab fade ─────────── */
@keyframes tabSlide {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.tab-fade { animation: tabSlide 0.35s cubic-bezier(.22,1,.36,1) both; }

/* ─────────── Marquee of grades ─────────── */
@keyframes marquee {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
.marquee-track {
  display: flex;
  gap: 10px;
  white-space: nowrap;
  animation: marquee 28s linear infinite;
}

/* ─────────── Floating panel (bottom sheet) ─────────── */
.bottom-sheet {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  border-radius: 24px 24px 0 0;
  background: var(--rock-800);
  z-index: 40;
  animation: sheetUp 0.5s cubic-bezier(.22,1,.36,1) both;
  box-shadow: 0 -8px 40px rgba(0,0,0,0.4);
}
@keyframes sheetUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.sheet-handle {
  width: 36px; height: 5px;
  border-radius: 999px;
  background: var(--rock-600);
  margin: 10px auto 0;
}

/* ─────────── Modal ─────────── */
.modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 55;
  display: flex;
  align-items: center; justify-content: center;
  animation: fadeIn 0.25s ease both;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-card {
  width: 300px;
  background: var(--rock-700);
  border-radius: 20px;
  padding: 20px;
  animation: modalPop 0.4s cubic-bezier(.22,1,.36,1) both;
  border: 1px solid var(--rock-600);
}
@keyframes modalPop {
  0% { opacity: 0; transform: scale(0.85); }
  100% { opacity: 1; transform: scale(1); }
}

/* ─────────── Reduced motion ─────────── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ─────────── Stage responsive ─────────── */
@media (max-width: 900px) {
  .side-panel { display: none; }
}
</style>

<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<body>

<!-- Custom Cursor DOM (managed via vanilla JS outside React for perf) -->
<div id="cursor" class="cursor"></div>
<div id="cursor-dot" class="cursor-dot"></div>

<div class="stage">
  <div class="stage-layout">
    <div class="side-panel" id="sidePanel">
      <h3>岩点 · V2</h3>
      <div style="margin-bottom:12px">
        <span class="tag">原生 App</span>
        <span class="tag">攀岩社区</span>
        <span class="tag">8 页</span>
        <span class="tag">岩石灰 × 熔岩橙</span>
      </div>
      <div style="color:var(--rock-300);font-size:12px;line-height:1.7">
        每日三版设计 mock · V2 手机 UI 方向<br/>
        主题：岩点攀岩馆社区<br/>
        形态：iOS / Android 原生 App
      </div>
      <div class="page-nav" id="pageNav"></div>
    </div>
    <div class="app-frame-wrap" id="root"></div>
  </div>
</div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ══════════════════════════════════════════
// DESIGN TOKENS
// ══════════════════════════════════════════
const TOKENS = {
  rock900: '#1A1D22', rock800: '#23272E', rock700: '#2C313A', rock600: '#3A3F4A',
  rock500: '#525966', rock400: '#7A8290', rock300: '#A0A7B3', rock200: '#C5CAD3',
  rock100: '#E4E6EB', rock50: '#F2F3F5',
  lava700: '#C24A1A', lava600: '#E85D24', lava500: '#FF7A3D', lava400: '#FF9A6B',
  lava300: '#FFBFA0', lava50: '#FFF1E8',
  moss700: '#2D5A3D', moss600: '#3A7A52', moss500: '#5AA476', moss400: '#84C69A',
  moss300: '#B5DCC2', moss50: '#EAF5EE',
  cream500: '#FDFBF7', cream400: '#FAF6ED', cream300: '#F5EFE0', cream200: '#EDE5D1',
  sand500: '#D9C9A6', clay500: '#B07A5B',
  fontDisplay: '"Noto Serif SC", "Songti SC", serif',
  fontBody: '"Noto Sans SC", -apple-system, system-ui, sans-serif',
};

// ══════════════════════════════════════════
// IOS DEVICE FRAME (inlined from starter)
// ══════════════════════════════════════════
function IOSStatusBar({ dark = true, time = '9:41' }) {

  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{ fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590, fontSize: 17, lineHeight: '22px', color: c }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>

        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>

        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

function IOSDevice({ children, width = 390, height = 844, dark = true }) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      border: '1px solid #2C313A',
      fontFamily: TOKENS.fontBody,
      WebkitFontSmoothing: 'antialiased',
      '--ios-safe-top': '62px',
      '--ios-safe-bottom': '34px',
      boxShadow: '0 30px 80px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.3)',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column', isolation: 'isolate' }}>
        <div style={{ flex: 1, overflow: 'hidden', position: 'relative' }}>{children}</div>
      </div>
      {/* home indicator */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ══════════════════════════════════════════
// SVG ICONS

function GradeChip({ grade, size = 'sm' }) {
  const hueMap = {
    'V0': TOKENS.moss400, 'V1': TOKENS.moss500, 'V2': TOKENS.moss600,
    'V3': TOKENS.sand500, 'V4': TOKENS.clay500,
    'V5': TOKENS.lava400, 'V6': TOKENS.lava500, 'V7': TOKENS.lava600,
    'V8': TOKENS.lava700, 'V9': '#A33E1A', 'V10': '#8A3516',
    'V11': '#6B2810', 'V12': '#4A1B0A',
    '5.10c': TOKENS.moss500, '5.10a': TOKENS.moss400,
  };
  const bg = hueMap[grade] || TOKENS.lava500;
  const isDark = ['V7','V8','V9','V10','V11','V12', 'V6'].includes(grade);
  const fontSize = size === 'lg' ? 14 : 11;
  const padding = size === 'lg' ? '5px 14px' : '3px 10px';
  return (
    <span className="grade-chip" style={{ background: bg, color: isDark ? '#fff' : '#1A1D22', fontSize, padding }}>
      {grade}
    </span>
  );
}

function HomePage({ onNavigate }) {
  const [pullY, setPullY] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const scrollRef = useRef(null);
  const startY = useRef(0);

  const handleTouchStart = (e) => {
    if (scrollRef.current?.scrollTop === 0) startY.current = e.touches[0].clientY;
  };
  const handleTouchMove = (e) => {
    if (scrollRef.current?.scrollTop === 0 && !refreshing) {
      const dy = e.touches[0].clientY - startY.current;
      if (dy > 0) setPullY(Math.min(dy * 0.5, 70));
    }
  };
  const handleTouchEnd = () => {
    if (pullY > 50 && !refreshing) {
      setRefreshing(true);
      setPullY(50);
      setTimeout(() => {
        setRefreshing(false);
        setPullY(0);
      }, 1500);
    } else {
      setPullY(0);
    }
  };

  return (
    <div
      className="app-screen"
      style={{ background: TOKENS.rock900 }}
      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}
      onTouchEnd={handleTouchEnd}
    >
      {/* Pull indicator */}
      <div className="pull-indicator" style={{ height: pullY, top: 60 }}>
        {refreshing ? <div className="pull-spinner" /> : (
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, opacity: pullY / 70 }}>
            {ICON.flame(TOKENS.lava400)}
            <span>下拉刷新线路</span>
          </div>
        )}
      </div>

      <div ref={scrollRef} style={{ height: '100%', overflowY: 'auto', paddingTop: 60, paddingBottom: 100, transform: `translateY(${pullY}px)`, transition: pullY === 0 && !refreshing ? 'transform 0.3s' : 'none' }}>
        {/* Header */}
        <div className="hero-stagger" style={{ padding: '0 20px 16px' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>

            <div style={{ position: 'relative', width: 44, height: 44, borderRadius: '50%', overflow: 'hidden', background: TOKENS.rock700, border: `2px solid ${TOKENS.lava500}` }}>

// PAGE 2: ROUTES (Masonry grid + filter)
// ══════════════════════════════════════════
function RoutesPage() {
  const [activeFilter, setActiveFilter] = useState('全部');
  const filters = ['全部', 'V0-V2', 'V3-V5', 'V6-V8', 'V9+', '难度'];

  const tileRefs = useRef([]);

  const handleMouseMove = useCallback((e, idx) => {
    const tile = tileRefs.current[idx];
    if (!tile) return;
    const rect = tile.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    tile.style.transform = `perspective(600px) rotateX(${-y * 8}deg) rotateY(${x * 8}deg) scale(1.02)`;
  }, []);
  const handleMouseLeave = useCallback((idx) => {
    const tile = tileRefs.current[idx];
    if (tile) tile.style.transform = 'perspective(600px) rotateX(0) rotateY(0) scale(1)';
  }, []);

  return (
    <div className="app-screen page-enter" style={{ background: TOKENS.rock900 }}>
      {/* Large title nav */}
      <div style={{ paddingTop: 60, paddingBottom: 10, paddingHorizontal: 20, background: TOKENS.rock900, position: 'sticky', top: 0, zIndex: 20 }}>
        <h1 style={{ fontFamily: TOKENS.fontDisplay, fontSize: 34, fontWeight: 900, color: TOKENS.cream500, letterSpacing: 1, marginBottom: 12 }}>
          线路图鉴
        </h1>

        {/* Filter pills */}
        <div style={{ display: 'flex', gap: 8, overflowX: 'auto', paddingBottom: 2 }}>
          {filters.map((f) => (
            <button
              key={f}
              onClick={() => setActiveFilter(f)}
              style={{
                flexShrink: 0,
                padding: '7px 16px',
                borderRadius: 999,
                border: 'none',
                fontSize: 13,
                fontWeight: activeFilter === f ? 600 : 400,
                background: activeFilter === f ? TOKENS.lava500 : TOKENS.rock800,
                color: activeFilter === f ? '#fff' : TOKENS.rock300,
                cursor: 'none',
                transition: 'background 0.25s, color 0.25s',
              }}
            >{f}</button>
          ))}
        </div>
      </div>

      <div style={{ padding: '8px 16px 100px', overflowY: 'auto', height: 'calc(100% - 140px)' }}>
        {/* Masonry grid */}
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
          {ROUTES.map((route, i) => {
            const tall = i % 3 === 0;
            return (
              <div
                key={route.id}
                ref={(el) => (tileRefs.current[i] = el)}
                className="route-tile"
                style={{
                  gridRow: tall ? 'span 2' : 'span 1',
                  borderRadius: 16,
                  overflow: 'hidden',
                  background: TOKENS.rock800,
                  border: `1px solid ${TOKENS.rock700}`,
                  cursor: 'none',
                  position: 'relative',
                  height: tall ? 240 : 160,
                }}
                onMouseMove={(e) => handleMouseMove(e, i)}
                onMouseLeave={() => handleMouseLeave(i)}
              >
                <ClimbWallArt variant={(i % 4) + 1} height={tall ? 240 : 160} />

                {/* gradient overlay */}
                <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg, transparent 30%, rgba(26,29,34,0.95))' }} />

                {/* grade tag top */}
                <div style={{ position: 'absolute', top: 10, left: 10 }}>
                  <GradeChip grade={route.grade} size="lg" />
                </div>

                {/* bottom info */}
                <div style={{ position: 'absolute', left: 12, right: 12, bottom: 12 }}>
                  <div style={{ fontSize: 15, fontWeight: 700, color: '#fff', marginBottom: 4 }}>{route.name}</div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 11, color: TOKENS.rock300 }}>
                    <span>{route.setter} · {route.gym}</span>
                    <span style={{ display: 'flex', alignItems: 'center', gap: 3, color: TOKENS.lava400 }}>
                      ★ {route.stars}
                    </span>
                  </div>
                </div>

                {/* angle badge */}
                <div style={{ position: 'absolute', top: 10, right: 10, fontSize: 10, padding: '3px 7px', borderRadius: 6, background: 'rgba(0,0,0,0.5)', color: '#fff', backdropFilter: 'blur(4px)' }}>
                  {route.angle}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

                background: TOKENS.rock800, borderRadius: 12,
                border: `1px solid ${TOKENS.rock700}`,
                animation: `heroItem 0.4s cubic-bezier(.22,1,.36,1) ${i * 0.08 + 0.3}s both`,
              }}>
                <div style={{
                  width: 28, height: 28, borderRadius: '50%',
                  background: `linear-gradient(135deg, ${TOKENS.lava500}, ${TOKENS.lava700})`,
                  color: '#fff', fontSize: 13, fontWeight: 700,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  flexShrink: 0,
                }}>{s.step}</div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 13, color: TOKENS.cream500, marginBottom: 3 }}>{s.text}</div>

        </div>

        <div style={{ padding: '20px 20px 100px' }}>
          <h2 style={{ fontSize: 17, fontWeight: 700, color: TOKENS.cream500, marginBottom: 12 }}>最近完攀</h2>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 1, background: TOKENS.rock800, borderRadius: 14, overflow: 'hidden', border: `1px solid ${TOKENS.rock700}` }}>
            {[
              { name: '阿鬼', grade: 'V8', time: '昨天', style: 'Flash' },
              { name: '小陈', grade: 'V6', time: '3天前', style: 'Redpoint' },
              { name: 'Moss', grade: 'V7', time: '5天前', style: 'Onsight' },
            ].map((a, i) => (
              <div key={i} style={{
                display: 'flex', alignItems: 'center', gap: 10,
                padding: 12,
                borderBottom: i < 2 ? `1px solid ${TOKENS.rock700}` : 'none',

                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 13, color: TOKENS.cream500, fontWeight: 500 }}>{a.name}</div>

          </div>
        </div>
      </div>

      {/* Bottom action bar */}
      <div style={{
        position: 'absolute', left: 0, right: 0, bottom: 0, zIndex: 40,
        padding: '12px 16px 28px',
        background: `linear-gradient(180deg, transparent, ${TOKENS.rock900} 40%)`,
        display: 'flex', gap: 10,
      }}>
        <button style={{
          width: 48, height: 48, borderRadius: 14,
          background: TOKENS.rock800,
          border: `1px solid ${TOKENS.rock700}`,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          cursor: 'none', color: TOKENS.rock300,
        }}>
          {ICON.bookmark(TOKENS.rock300)}
        </button>
        <button style={{
          flex: 1, height: 48, borderRadius: 14,
          background: `linear-gradient(135deg, ${TOKENS.lava500}, ${TOKENS.lava700})`,
          color: '#fff', border: 'none',
          fontSize: 15, fontWeight: 700,
          cursor: 'none',
          boxShadow: `0 6px 20px ${TOKENS.lava500}55`,
        }}>
          标记完成 ✓
        </button>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════
// TAB BAR
// ══════════════════════════════════════════
function TabBar({ active, onTabChange }) {
  const tabs = [
    { id: 'home', label: '首页', icon: ICON.home },
    { id: 'routes', label: '线路', icon: ICON.routes },
    { id: 'activities', label: '活动', icon: ICON.calendar },
    { id: 'profile', label: '我的', icon: ICON.user },
  ];

  return (
    <div className="tab-bar">
      {tabs.map((t) => (
        <div
          key={t.id}
          className={`tab-item ${active === t.id ? 'active' : ''}`}
          onClick={() => onTabChange(t.id)}
        >
          {t.icon(active === t.id ? TOKENS.lava500 : 'currentColor')}
          <span>{t.label}</span>
        </div>
      ))}
    </div>
  );
}

// ══════════════════════════════════════════
// MAIN APP
// ══════════════════════════════════════════
function App() {
  const [page, setPage] = useState('home');
  const [showDetail, setShowDetail] = useState(false);
  const [detailRoute, setDetailRoute] = useState(ROUTES[0]);

  const mainPages = ['home', 'routes', 'activities', 'profile'];
  const isMainPage = mainPages.includes(page);

  const handleTabChange = (tab) => {
    setPage(tab);
    setShowDetail(false);
  };

  const handleNavigate = (target) => {
    if (target === 'routes' || target === 'home' || target === 'activities' || target === 'profile') {
      setPage(target);
    } else if (target === 'spec') {
      setPage('spec');
    } else if (target === 'api') {
      setPage('api');
    }
    setShowDetail(false);
  };

  const openRouteDetail = (route) => {
    setDetailRoute(route);
    setShowDetail(true);
  };

  // Update side nav (outside React, using vanilla JS)
  useEffect(() => {
    const nav = document.getElementById('pageNav');
    if (nav) {
      const pages = [
        { id: 'home', name: '首页', num: '01' },
        { id: 'routes', name: '线路图鉴', num: '02' },
        { id: 'activities', name: '约爬活动', num: '03' },
        { id: 'training', name: '训练日志', num: '04' },
        { id: 'profile', name: '个人主页', num: '05' },
        { id: 'detail', name: '线路详情', num: '06' },
        { id: 'spec', name: '设计规范', num: '07' },
        { id: 'api', name: '接口文档', num: '08' },
      ];
      nav.innerHTML = pages.map(p => {
        const isActive = (p.id === 'detail' && showDetail) || (p.id !== 'detail' && page === p.id);
        return `<button class="${isActive ? 'active' : ''}" data-page="${p.id}">
          <span class="num">${p.num}</span>
          <span>${p.name}</span>
        </button>`;
      }).join('');

      nav.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          const pid = btn.dataset.page;
          if (pid === 'training') {
            setPage('profile');
            setTimeout(() => setPage('home'), 50); // hack to trigger tab change
            setPage('activities');
            // training is accessible via home quick actions — go to home
            setPage('home');
          } else if (pid === 'detail') {
            setShowDetail(true);
          } else {
            handleNavigate(pid);
          }
        });
      });
    }
  }, [page, showDetail]);

  const renderPage = () => {
    if (showDetail) {
      return <RouteDetailPage route={detailRoute} onBack={() => setShowDetail(false)} />;
    }
    switch (page) {
      case 'home': return <HomePage onNavigate={handleNavigate} />;
      case 'routes': return <RoutesPage />;
      case 'activities': return <ActivitiesPage />;
      case 'profile': return <ProfilePage onNavigate={handleNavigate} />;
      case 'spec': return <SpecPage onNavigate={handleNavigate} />;
      case 'api': return <ApiPage onNavigate={handleNavigate} />;
      default: return <HomePage onNavigate={handleNavigate} />;
    }
  };

  return (
    <IOSDevice width={390} height={844} dark={true}>
      {renderPage()}
      {isMainPage && !showDetail && <TabBar active={page} onTabChange={handleTabChange} />}
      {isMainPage && !showDetail && page !== 'activities' && (
        <div className="fab" onClick={() => openRouteDetail(ROUTES[0])}>
          {ICON.plus('#fff')}
        </div>
      )}
    </IOSDevice>
  );
}

// ══════════════════════════════════════════
// CUSTOM CURSOR (vanilla JS, max performance)
// ══════════════════════════════════════════
function initCursor() {
  const cursor = document.getElementById('cursor');
  const dot = document.getElementById('cursor-dot');
  if (!cursor || !dot) return;

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let cursorX = mouseX;
  let cursorY = mouseY;
  let dotX = mouseX;
  let dotY = mouseY;
  let rafId = null;
  let isVisible = true;

  function animate() {
    if (!isVisible) return;
    // cursor (ring) - slower follow
    cursorX += (mouseX - cursorX) * 0.18;
    cursorY += (mouseY - cursorY) * 0.18;
    cursor.style.left = cursorX + 'px';
    cursor.style.top = cursorY + 'px';

    // dot - faster follow
    dotX += (mouseX - dotX) * 0.45;
    dotY += (mouseY - dotY) * 0.45;
    dot.style.left = dotX + 'px';
    dot.style.top = dotY + 'px';

    rafId = requestAnimationFrame(animate);
  }

  function handleMove(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
    if (!isVisible) {
      isVisible = true;
      cursor.style.opacity = '1';
      dot.style.opacity = '1';
      cursorX = mouseX;
      cursorY = mouseY;
      dotX = mouseX;
      dotY = mouseY;
      animate();
    }
  }

  function handleDown() {
    cursor.classList.add('click');
    // create ripple
    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = mouseX + 'px';
    ripple.style.top = mouseY + 'px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  }

  function handleUp() {
    cursor.classList.remove('click');
  }

  function handleOver(e) {
    const target = e.target.closest('button, .lift-card, .tab-item, .fab, .route-tile, .grade-chip');
    if (target) {
      cursor.classList.add('glow');
    }
  }

  function handleOut(e) {
    const target = e.target.closest('button, .lift-card, .tab-item, .fab, .route-tile, .grade-chip');
    if (target) {
      cursor.classList.remove('glow');
    }
  }

  function handleVisibility() {
    if (document.hidden) {
      isVisible = false;
      if (rafId) cancelAnimationFrame(rafId);
    } else {
      isVisible = true;
      animate();
    }
  }

  // Initialize at center
  cursor.style.left = mouseX + 'px';
  cursor.style.top = mouseY + 'px';
  dot.style.left = mouseX + 'px';
  dot.style.top = mouseY + 'px';
  cursor.style.opacity = '1';
  dot.style.opacity = '1';

  window.addEventListener('mousemove', handleMove);
  window.addEventListener('mousedown', handleDown);
  window.addEventListener('mouseup', handleUp);
  document.addEventListener('mouseover', handleOver);
  document.addEventListener('mouseout', handleOut);
  document.addEventListener('visibilitychange', handleVisibility);

  animate();

  // cleanup on unload
  window.addEventListener('beforeunload', () => {
    if (rafId) cancelAnimationFrame(rafId);
    window.removeEventListener('mousemove', handleMove);
    window.removeEventListener('mousedown', handleDown);
    window.removeEventListener('mouseup', handleUp);
    document.removeEventListener('mouseover', handleOver);
    document.removeEventListener('mouseout', handleOut);
    document.removeEventListener('visibilitychange', handleVisibility);
  });
}

// ══════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// Init cursor after DOM ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initCursor);
} else {
  initCursor();
}

// Announce upgrade capability
function announceUpgrade() {
  try {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  } catch (e) {}
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}
</script>

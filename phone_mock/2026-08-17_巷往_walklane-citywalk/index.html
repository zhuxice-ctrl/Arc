<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>巷往 · 城市漫步约伴</title>

<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=ZCOOL+XiaoWei&display=swap" />

<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #1a1510;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh;
  color: #2b2418;
}

/* === Color Tokens === */
:root {
  --brick: #B8523E;
  --brick-dark: #8A3A2A;
  --brick-light: #D6745F;
  --goose: #F2D98D;
  --goose-deep: #E8C55A;
  --olive: #4A5A3A;
  --olive-light: #6B7D52;
  --olive-moss: #3D4A2E;
  --cream: #F8F2E8;
  --cream-deep: #F0E8D8;
  --sand: #E8DCC4;
  --terracotta: #C97B5B;
  --ink: #2B2418;
  --ink-soft: #5C5040;
  --ink-light: #8A7F6E;
  --border: rgba(74, 52, 34, 0.12);
}

/* === Page Stage === */
.stage {
  position: relative;
  display: flex;
  gap: 48px;
  align-items: center;
  justify-content: center;
  padding: 40px;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(184, 82, 62, 0.15), transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(242, 217, 141, 0.1), transparent 50%),
    linear-gradient(180deg, #201913 0%, #15110c 100%);
}

.device-wrap { position: relative; }

.page-label {
  position: absolute;
  bottom: -36px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 2px;
  white-space: nowrap;
  font-family: 'Noto Serif SC', serif;
}

/* === App Container === */
.app {
  width: 390px;
  height: 844px;
  position: relative;
  overflow: hidden;
  background: var(--cream);
  border-radius: 48px;
  box-shadow:
    0 0 0 10px #1a1510,
    0 0 0 12px #2a221a,
    0 40px 80px rgba(0,0,0,0.5),
    0 0 120px rgba(184, 82, 62, 0.15);
}

/* Status bar */
.status-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 44px;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px 0 28px;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  pointer-events: none;
}
.status-bar .time { font-variant-numeric: tabular-nums; letter-spacing: -0.3px; }
.status-bar .icons { display: flex; gap: 5px; align-items: center; }
.status-bar .icon-signal, .status-bar .icon-wifi, .status-bar .icon-battery {
  display: inline-block;
}
.status-bar.dark { color: #fff; }

/* Dynamic Island */
.dynamic-island {
  position: absolute;
  top: 11px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 36px;
  background: #000;
  border-radius: 20px;
  z-index: 101;
}

/* Home indicator */
.home-indicator {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 134px;
  height: 5px;
  background: var(--ink);
  border-radius: 3px;
  z-index: 100;
  opacity: 0.3;
}

/* === WeChat Mini Program Nav === */
.wx-nav {
  position: absolute;
  top: 44px; left: 0; right: 0;
  height: 44px;
  z-index: 90;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 12px;
  transition: background 0.3s, backdrop-filter 0.3s, color 0.3s;
}
.wx-nav .nav-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--ink);
  font-family: 'Noto Serif SC', serif;
}
.wx-nav .capsule {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 88px;
  height: 32px;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 16px;
  border: 0.5px solid rgba(0,0,0,0.08);
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 0 8px;
}
.wx-nav .capsule .cap-btn {
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink);
  opacity: 0.7;
  font-size: 14px;
}
.wx-nav .capsule .divider {
  width: 0.5px; height: 16px;
  background: rgba(0,0,0,0.1);
}
.wx-nav .back-btn {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 32px; height: 32px;
  border-radius: 50%;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex; align-items: center; justify-content: center;
  color: var(--ink);
  font-size: 16px;
}
.wx-nav.dark .nav-title { color: #fff; }
.wx-nav.dark .back-btn { color: #fff; background: rgba(0,0,0,0.3); }
.wx-nav.dark .capsule { background: rgba(0,0,0,0.3); border-color: rgba(255,255,255,0.1); }
.wx-nav.dark .capsule .cap-btn { color: #fff; }
.wx-nav.dark .capsule .divider { background: rgba(255,255,255,0.15); }

/* === Page Container === */
.page-container {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  overflow: hidden;
}
.page {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  background: var(--cream);
  animation: pageEnter 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}
.page::-webkit-scrollbar { display: none; }
@keyframes pageEnter {
  from { transform: translateX(30%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
.page.pop { animation: pagePop 0.35s cubic-bezier(0.32, 0.72, 0, 1) forwards; }
@keyframes pagePop {
  from { transform: translateX(0); opacity: 1; }
  to { transform: translateX(30%); opacity: 0; }
}

/* === Tab Bar === */
.tab-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 68px;
  padding-bottom: 20px;
  background: rgba(248, 242, 232, 0.92);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-top: 0.5px solid var(--border);
  display: flex;
  z-index: 80;
}
.tab-bar .tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 10px;
  color: var(--ink-light);
  position: relative;
  cursor: pointer;
  transition: color 0.2s;
}
.tab-bar .tab-item.active {
  color: var(--brick);
}
.tab-bar .tab-item .tab-icon {
  font-size: 22px;
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.tab-bar .tab-item.active .tab-icon {
  transform: translateY(-2px) scale(1.1);
  animation: tabBounce 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes tabBounce {
  0% { transform: translateY(0) scale(1); }
  40% { transform: translateY(-4px) scale(1.15); }
  70% { transform: translateY(-1px) scale(0.95); }
  100% { transform: translateY(-2px) scale(1.1); }
}
.tab-bar .tab-item .tab-dot {
  position: absolute;
  bottom: 18px;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--brick);
  transform: scale(0);
  transition: transform 0.3s;
}
.tab-bar .tab-item.active .tab-dot { transform: scale(1); }

/* === Custom Cursor === */
.custom-cursor {
  position: fixed;
  width: 32px; height: 32px;
  pointer-events: none;
  z-index: 99999;
  transform: translate(-50%, -50%);
  transition: width 0.2s, height 0.2s, opacity 0.2s;
  mix-blend-mode: normal;
}
.custom-cursor .ring {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  border: 2px solid #fff;
  border-radius: 50%;
  box-shadow: 0 0 12px rgba(255,255,255,0.6), 0 0 24px rgba(184, 82, 62, 0.4);
  transition: all 0.15s ease-out;
}
.custom-cursor .dot {
  position: absolute;
  top: 50%; left: 50%;
  width: 6px; height: 6px;
  background: var(--brick);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 8px var(--brick);
}
.custom-cursor.hovering {
  width: 48px; height: 48px;
}
.custom-cursor.hovering .ring {
  border-color: var(--goose-deep);
  box-shadow: 0 0 16px var(--goose), 0 0 32px rgba(242, 217, 141, 0.5);
}
.custom-cursor.clicking .ring {
  transform: scale(0.6);
  background: rgba(184, 82, 62, 0.3);
}
.cursor-ripple {
  position: fixed;
  pointer-events: none;
  z-index: 99998;
  width: 20px; height: 20px;
  border: 2px solid var(--goose);
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(1);
  opacity: 0.8;
  animation: cursorRipple 0.6s ease-out forwards;
}
@keyframes cursorRipple {
  to { transform: translate(-50%, -50%) scale(4); opacity: 0; }
}

/* === HOME PAGE === */
.home-hero {
  position: relative;
  padding: 110px 20px 24px;
  background: linear-gradient(180deg, var(--cream-deep) 0%, var(--cream) 100%);
  overflow: hidden;
}
.home-hero::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(242, 217, 141, 0.4), transparent 70%);
  border-radius: 50%;
}
.home-hero::after {
  content: '';
  position: absolute;
  bottom: 20px; left: -30px;
  width: 140px; height: 140px;
  background: radial-gradient(circle, rgba(184, 82, 62, 0.15), transparent 70%);
  border-radius: 50%;
}
.home-greeting {
  font-size: 13px;
  color: var(--ink-light);
  margin-bottom: 4px;
  letter-spacing: 1px;
  opacity: 0;
  animation: fadeUp 0.6s 0.1s forwards;
}
.home-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.3;
  margin-bottom: 4px;
  opacity: 0;
  animation: fadeUp 0.6s 0.2s forwards;
}
.home-subtitle {
  font-size: 13px;
  color: var(--brick);
  font-weight: 500;
  opacity: 0;
  animation: fadeUp 0.6s 0.3s forwards;
  display: flex;
  align-items: center;
  gap: 6px;
}
.home-subtitle .deco {
  display: inline-block;
  width: 20px; height: 1px;
  background: var(--brick);
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Search bar */
.search-bar {
  margin: 18px 0 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  background: #fff;
  border-radius: 24px;
  box-shadow: 0 2px 12px rgba(74, 52, 34, 0.06);
  position: relative;
  z-index: 2;
  opacity: 0;
  animation: fadeUp 0.6s 0.4s forwards;
}
.search-bar .search-icon { color: var(--ink-light); font-size: 16px; }
.search-bar .search-placeholder {
  font-size: 13px;
  color: var(--ink-light);
  flex: 1;
}

/* Category chips */
.category-chips {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 24px;
  position: relative;
  z-index: 2;
  opacity: 0;
  animation: fadeUp 0.6s 0.5s forwards;
}
.category-chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  padding: 7px 16px;
  border-radius: 20px;
  font-size: 13px;
  background: #fff;
  color: var(--ink-soft);
  border: 1px solid var(--border);
  transition: all 0.25s;
  cursor: pointer;
  white-space: nowrap;
}
.chip.active {
  background: var(--ink);
  color: var(--goose);
  border-color: var(--ink);
}
.chip:hover { transform: translateY(-1px); }

/* Section title */
.section-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 0 20px;
  margin-bottom: 14px;
}
.section-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--ink);
  position: relative;
}
.section-title .accent-bar {
  position: absolute;
  bottom: 2px; left: 0;
  width: 32px; height: 8px;
  background: var(--goose);
  opacity: 0.6;
  z-index: -1;
  border-radius: 2px;
}
.section-more {
  font-size: 12px;
  color: var(--ink-light);
  display: flex;
  align-items: center;
  gap: 2px;
}

/* Featured route card - horizontal scroll */
.featured-scroll {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding: 0 20px 20px;
  scroll-snap-type: x mandatory;
}
.featured-scroll::-webkit-scrollbar { display: none; }
.route-card {
  flex-shrink: 0;
  width: 260px;
  background: #fff;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(74, 52, 34, 0.08);
  scroll-snap-align: start;
  cursor: pointer;
  transition: transform 0.3s, box-shadow 0.3s;
  position: relative;
}
.route-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 30px rgba(74, 52, 34, 0.15);
}
.route-card .card-img {
  width: 100%;
  height: 150px;
  position: relative;
  overflow: hidden;
}
.route-card .card-img .bg-shape {
  width: 100%; height: 100%;
  position: absolute;
}
.route-card .card-img .tag {
  position: absolute;
  top: 12px; left: 12px;
  padding: 4px 10px;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(10px);
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  color: var(--brick);
}
.route-card .card-body {
  padding: 12px 14px 14px;
}
.route-card .card-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 6px;
  line-height: 1.3;
}
.route-card .card-desc {
  font-size: 12px;
  color: var(--ink-light);
  line-height: 1.5;
  margin-bottom: 10px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.route-card .card-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--ink-soft);
}
.route-card .card-meta .meta-left { display: flex; gap: 10px; align-items: center; }
.route-card .card-meta .meta-item { display: flex; align-items: center; gap: 3px; }
.route-card .card-meta .price { color: var(--brick); font-weight: 600; font-size: 13px; }

/* Nearby walks - list style */
.nearby-section {
  padding: 0 20px 100px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.nearby-card {
  display: flex;
  gap: 12px;
  padding: 12px;
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 2px 10px rgba(74, 52, 34, 0.05);
  cursor: pointer;
  transition: transform 0.2s;
}
.nearby-card:hover { transform: translateX(4px); }
.nearby-card .nb-img {
  width: 88px; height: 88px;
  border-radius: 10px;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}
.nearby-card .nb-info { flex: 1; min-width: 0; }
.nearby-card .nb-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 4px;
  font-family: 'Noto Serif SC', serif;
}
.nearby-card .nb-desc {
  font-size: 12px;
  color: var(--ink-light);
  line-height: 1.4;
  margin-bottom: 8px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.nearby-card .nb-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  color: var(--ink-soft);
}
.nearby-card .nb-bottom .nb-rating {
  color: var(--goose-deep);
  font-weight: 600;
  display: flex; align-items: center; gap: 2px;
}
.nearby-card .nb-bottom .nb-distance {
  background: var(--cream-deep);
  padding: 2px 8px;
  border-radius: 8px;
}

/* Floating action button */
.fab {
  position: absolute;
  right: 20px;
  bottom: 90px;
  width: 52px; height: 52px;
  border-radius: 26px;
  background: linear-gradient(135deg, var(--brick) 0%, var(--terracotta) 100%);
  box-shadow: 0 6px 20px rgba(184, 82, 62, 0.4), 0 2px 6px rgba(184, 82, 62, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 22px;
  z-index: 70;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
.fab:hover {
  transform: scale(1.08);
  box-shadow: 0 8px 26px rgba(184, 82, 62, 0.5);
}
.fab .fab-plus { transition: transform 0.3s; }
.fab:hover .fab-plus { transform: rotate(90deg); }

/* === DISCOVER PAGE === */
.discover-page {
  background: var(--cream);
  padding-top: 88px;
  padding-bottom: 80px;
  min-height: 100%;
}
.discover-header {
  padding: 0 20px 12px;
  background: var(--cream);
}
.discover-header .discover-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 12px;
}
.sticky-tabs {
  position: sticky;
  top: 88px;
  z-index: 50;
  background: var(--cream);
  padding: 10px 20px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  border-bottom: 0.5px solid var(--border);
}
.sticky-tabs::-webkit-scrollbar { display: none; }
.sticky-tab {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 16px;
  font-size: 13px;
  color: var(--ink-soft);
  background: transparent;
  cursor: pointer;
  position: relative;
  transition: color 0.2s;
  white-space: nowrap;
}
.sticky-tab.active {
  color: var(--ink);
  font-weight: 600;
}
.sticky-tab.active::after {
  content: '';
  position: absolute;
  bottom: 2px;
  left: 50%;
  transform: translateX(-50%);
  width: 18px; height: 3px;
  background: var(--brick);
  border-radius: 2px;
}

/* Waterfall/masonry grid */
.waterfall {
  padding: 16px 16px 20px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.waterfall-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.masonry-card {
  background: #fff;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(74, 52, 34, 0.06);
  cursor: pointer;
  transition: transform 0.25s;
  position: relative;
}
.masonry-card:hover { transform: translateY(-2px); }
.masonry-card .ms-img {
  width: 100%;
  position: relative;
  overflow: hidden;
}
.masonry-card .ms-body {
  padding: 10px 12px 12px;
}
.masonry-card .ms-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 4px;
  font-family: 'Noto Serif SC', serif;
  line-height: 1.3;
}
.masonry-card .ms-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  color: var(--ink-light);
}
.masonry-card .ms-fav {
  position: absolute;
  top: 8px; right: 8px;
  width: 28px; height: 28px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(10px);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--brick);
  font-size: 13px;
}

/* Pull to refresh */
.pull-indicator {
  position: absolute;
  top: 88px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  color: var(--brick);
  opacity: 0;

  z-index: 60;
  background: #fff;
  padding: 6px 14px;

function DiscoverPage({ onRouteClick }) {
  const tabs = ['全部', '热门', '新手友好', '亲子', '摄影', '美食', '历史', '自然'];
  const [activeTab, setActiveTab] = useState('全部');
  const [pullOffset, setPullOffset] = useState(0);
  const [showPullTip, setShowPullTip] = useState(false);
  const pageRef = useRef(null);
  const startY = useRef(0);
  const pulling = useRef(false);

  const handleTouchStart = (e) => {
    if (pageRef.current && pageRef.current.scrollTop <= 0) {
      startY.current = e.touches ? e.touches[0].clientY : e.clientY;
      pulling.current = true;
    }
  };
  const handleTouchMove = (e) => {
    if (!pulling.current) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const diff = y - startY.current;
    if (diff > 0 && pageRef.current.scrollTop <= 0) {
      setPullOffset(Math.min(diff * 0.5, 80));
    }
  };
  const handleTouchEnd = () => {
    if (pullOffset > 50) {
      setShowPullTip(true);
      setTimeout(() => setShowPullTip(false), 1500);
    }
    setPullOffset(0);
    pulling.current = false;
  };

  const col1 = ROUTES.filter((_, i) => i % 2 === 0);
  const col2 = ROUTES.filter((_, i) => i % 2 === 1);

  return (
    <div
      className="page discover-page"
      ref={pageRef}
      onMouseDown={handleTouchStart}
      onMouseMove={handleTouchMove}
      onMouseUp={handleTouchEnd}
      onMouseLeave={handleTouchEnd}
      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}
      onTouchEnd={handleTouchEnd}
      style={{ transform: `translateY(${pullOffset}px)`, transition: pulling.current ? 'none' : 'transform 0.3s cubic-bezier(0.22, 1, 0.36, 1)' }}
    >
      <WxNav title="发现" />
      <StatusBar />

      <div className={`pull-indicator ${showPullTip ? 'show' : ''}`}>
        {pullOffset > 50 ? '松手刷新' : '下拉刷新'}
      </div>

      <div className="discover-header">
        <h1 className="discover-title">探索城市的<br />每一种可能</h1>
      </div>

      <div className="sticky-tabs">
        {tabs.map(tab => (
          <div
            key={tab}
            className={`sticky-tab ${activeTab === tab ? 'active' : ''}`}
            onClick={() => setActiveTab(tab)}
          >
            {tab}
          </div>
        ))}
      </div>

      <div className="waterfall">
        <div className="waterfall-col">
          {col1.map((route, i) => (

function RouteDetailPage({ route, onBack, onSignup }) {
  const [favorited, setFavorited] = useState(false);
  const [scrollY, setScrollY] = useState(0);
  const pageRef = useRef(null);
  const heroRef = useRef(null);
  const rafRef = useRef(null);

  const handleScroll = useCallback(() => {
    if (rafRef.current) return;
    rafRef.current = requestAnimationFrame(() => {
      if (pageRef.current) {
        const y = pageRef.current.scrollTop;
        setScrollY(y);
        if (heroRef.current) {
          const scale = Math.max(1, 1 + y * -0.003);
          const yOffset = Math.max(0, y * 0.4);
          heroRef.current.style.transform = `translateY(${yOffset}px) scale(${scale})`;
        }
      }
      rafRef.current = null;
    });
  }, []);

  useEffect(() => {
    const el = pageRef.current;
    if (el) el.addEventListener('scroll', handleScroll, { passive: true });
    return () => {
      if (el) el.removeEventListener('scroll', handleScroll);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [handleScroll]);

  const navDark = scrollY < 100;

  return (
    <div className="page detail-page" ref={pageRef}>
      <WxNav title={scrollY > 200 ? route.title : ''} showBack onBack={onBack} dark={navDark} transparent />

// === CUSTOM CURSOR ===
function CustomCursor() {
  const cursorRef = useRef(null);
  const posRef = useRef({ x: 0, y: 0 });
  const targetRef = useRef({ x: 0, y: 0 });
  const rafRef = useRef(null);
  const [hovering, setHovering] = useState(false);
  const [visible, setVisible] = useState(false);

  useEffect(() => {
    const animate = () => {
      if (cursorRef.current) {
        posRef.current.x += (targetRef.current.x - posRef.current.x) * 0.2;
        posRef.current.y += (targetRef.current.y - posRef.current.y) * 0.2;
        cursorRef.current.style.left = posRef.current.x + 'px';
        cursorRef.current.style.top = posRef.current.y + 'px';
      }
      rafRef.current = requestAnimationFrame(animate);
    };
    rafRef.current = requestAnimationFrame(animate);

    const handleMove = (e) => {
      targetRef.current.x = e.clientX;
      targetRef.current.y = e.clientY;
      if (!visible) setVisible(true);
      // Check hover
      const target = e.target;
      const isInteractive = target.closest && target.closest('button, .chip, .route-card, .nearby-card, .masonry-card, .sticky-tab, .menu-item, .tab-item, .event-card, .action-btn, .guide-follow, .submit-btn, .action-icon, .choice-chip, .switch-btn, .ep-head, .as-item, .as-cancel, .back-btn, .fab');
      setHovering(!!isInteractive);
    };

    const handleClick = (e) => {
      const ripple = document.createElement('div');
      ripple.className = 'cursor-ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    };

    window.addEventListener('mousemove', handleMove);
    window.addEventListener('click', handleClick);

    const handleVisibility = () => {
      if (document.hidden && rafRef.current) {
        cancelAnimationFrame(rafRef.current);
        rafRef.current = null;
      } else if (!document.hidden && !rafRef.current) {
        rafRef.current = requestAnimationFrame(animate);
      }
    };
    document.addEventListener('visibilitychange', handleVisibility);

    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      window.removeEventListener('mousemove', handleMove);
      window.removeEventListener('click', handleClick);
      document.removeEventListener('visibilitychange', handleVisibility);
    };
  }, [visible]);

  return (
    <div
      ref={cursorRef}
      className={`custom-cursor ${hovering ? 'hovering' : ''}`}
      style={{ opacity: visible ? 1 : 0, pointerEvents: 'none' }}
    >
      <div className="ring"></div>
      <div className="dot"></div>
    </div>
  );
}

// === MAIN APP ===
function App() {
  const [currentTab, setCurrentTab] = useState('home');
  const [stack, setStack] = useState([{ type: 'tab', page: 'home' }]);
  const [selectedRoute, setSelectedRoute] = useState(null);
  const pageLabelRef = useRef(null);

  const top = stack[stack.length - 1];

  const updateLabel = (label) => {
    if (pageLabelRef.current) {
      pageLabelRef.current.textContent = label;
    }
  };

  const handleTabChange = (tab) => {
    setCurrentTab(tab);
    setStack([{ type: 'tab', page: tab }]);
    updateLabel(TAB_LABELS[tab]);
  };

  const handleRouteClick = (route) => {
    setSelectedRoute(route);
    setStack(s => [...s, { type: 'detail', route }]);
    updateLabel('路线详情');
  };

  const handleSignup = () => {
    setStack(s => [...s, { type: 'signup' }]);
    updateLabel('活动报名');
  };

  const handleBack = () => {
    if (stack.length > 1) {
      const newStack = stack.slice(0, -1);
      setStack(newStack);
      const newTop = newStack[newStack.length - 1];
      if (newTop.type === 'tab') {
        updateLabel(TAB_LABELS[newTop.page]);
        setCurrentTab(newTop.page);
      } else if (newTop.type === 'detail') {
        updateLabel('路线详情');
      }
    }
  };

  const handleMenuClick = (label) => {
    if (label === '设计规范' || label === '更多') {
      setStack(s => [...s, { type: 'spec' }]);
      updateLabel('设计规范');
    }
  };

  // Add spec and api access via profile menu
  const openSpec = () => {
    setStack(s => [...s, { type: 'spec' }]);
    updateLabel('设计规范');
  };
  const openApi = () => {
    setStack(s => [...s, { type: 'api' }]);
    updateLabel('接口文档');
  };

  const renderPage = (item, idx) => {
    const isTop = idx === stack.length - 1;
    const key = `${item.type}-${item.page || item.route?.id || idx}`;

    let content;
    switch (item.type) {
      case 'tab':
        if (item.page === 'home') {
          content = (
            <HomePage
              onRouteClick={handleRouteClick}
              activeCategory="推荐"
              onCategoryClick={() => { setCurrentTab('discover'); setStack([{ type: 'tab', page: 'discover' }]); updateLabel('发现'); }}
            />
          );
        } else if (item.page === 'discover') {
          content = <DiscoverPage onRouteClick={handleRouteClick} />;
        } else if (item.page === 'events') {
          content = <EventsPage onJoin={handleSignup} />;
        } else if (item.page === 'profile') {
          content = (
            <ProfilePage
              onMenuClick={(label) => {
                if (label === '设置') openSpec();
                if (label === '帮助中心') openApi();
              }}
            />
          );
        }
        break;
      case 'detail':
        content = (
          <RouteDetailPage
            route={item.route || ROUTES[0]}
            onBack={handleBack}
            onSignup={handleSignup}
          />
        );
        break;
      case 'signup':
        content = (
          <SignupFormPage
            route={selectedRoute || ROUTES[0]}
            onBack={handleBack}
            onSubmit={handleBack}
          />
        );
        break;
      case 'spec':
        content = <DesignSpecPage onBack={handleBack} />;
        break;
      case 'api':
        content = <ApiDocPage onBack={handleBack} />;
        break;
      default:
        content = null;
    }

    return (
      <div key={key} className="page-container" style={{ zIndex: idx + 10, pointerEvents: isTop ? 'auto' : 'none' }}>
        {content}
      </div>
    );
  };

  return (
    <>
      <CustomCursor />
      <div className="app">
        {stack.map((item, idx) => renderPage(item, idx))}
        <div className="home-indicator"></div>
      </div>
      <div className="page-label" ref={pageLabelRef}>首页</div>
    </>
  );
}

// Render

root.render(<App />);

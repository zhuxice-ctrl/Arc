<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>邮驿 StampPost · 邮票收藏原生 App</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&display=swap" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0F1F18;
      font-family: 'Noto Sans SC', -apple-system, system-ui, sans-serif;
      overflow: hidden;
      cursor: none;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(176,141,76,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(179,74,58,0.06) 0%, transparent 50%),
        #0F1F18;
      position: relative;
    }
    .phone-frame {
      position: relative;
    }
    .app-label {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(239,230,213,0.5);
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-family: 'Playfair Display', serif;
    }
    iframe {
      border: none;
      width: 402px;
      height: 874px;
      border-radius: 48px;
      overflow: hidden;
      display: block;
    }
    .phone-bezel {
      width: 428px;
      height: 900px;
      border-radius: 54px;
      background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 30px 80px rgba(0,0,0,0.6),
        0 0 0 1px rgba(255,255,255,0.05),
        inset 0 2px 4px rgba(255,255,255,0.1);
      position: relative;
    }
    .phone-side-btn {
      position: absolute;
      width: 3px;
      background: #1a1a1a;
      border-radius: 0 2px 2px 0;
    }
    .phone-side-btn.left-1 { left: -3px; top: 180px; height: 36px; }
    .phone-side-btn.left-2 { left: -3px; top: 240px; height: 52px; }
    .phone-side-btn.right { right: -3px; top: 220px; height: 72px; border-radius: 2px 0 0 2px; }

    @media (max-width: 500px) {
      .phone-bezel { width: 100vw; height: 100vh; border-radius: 0; background: transparent; box-shadow: none; }
      iframe { width: 100%; height: 100%; border-radius: 0; }
      .app-label { display: none; }
      .phone-side-btn { display: none; }
    }
  </style>
</head>
<body>

<div class="phone-frame">
  <div class="phone-bezel">
    <div class="phone-side-btn left-1"></div>
    <div class="phone-side-btn left-2"></div>
    <div class="phone-side-btn right"></div>
    <iframe src="phone_mock/index.html" title="邮驿 StampPost"></iframe>
  </div>
  <div class="app-label">邮驿 · StampPost · V2 原生 App</div>
</div>

<script>
  // Pass upgrade message through from iframe
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'miaoda:upgrade:available') {
      window.parent?.postMessage(e.data, '*');
    }
  });
</script>

</body>
</html>

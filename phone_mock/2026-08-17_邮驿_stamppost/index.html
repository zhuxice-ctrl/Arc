    /* Custom cursor */
    #custom-cursor {
      position: fixed; top: 50%; left: 50%;
      width: 28px; height: 28px;
      transform: translate(-50%, -50%);
      pointer-events: none; z-index: 9999;
      transition: width 0.25s cubic-bezier(.2,.8,.2,1), height 0.25s cubic-bezier(.2,.8,.2,1), border-color 0.3s;

    }

      border-radius: 50%;
      box-shadow:
        0 0 20px rgba(176,141,76,0.8),
        0 0 40px rgba(176,141,76,0.4),
        inset 0 0 10px rgba(255,255,255,0.3);
      transition: all 0.25s cubic-bezier(.2,.8,.2,1);
    }
    #custom-cursor .cursor-ring-inner {
      position: absolute; top: 50%; left: 50%;
      width: 6px; height: 6px;
      transform: translate(-50%, -50%);
      background: #B34A3A;
      border-radius: 50%;
      box-shadow: 0 0 8px #B34A3A, 0 0 16px rgba(179,74,58,0.6);

    #custom-cursor.hover {

    }
    #custom-cursor.hover .cursor-ring-outer {
      border-color: #B08D4C;
      box-shadow:
        0 0 24px rgba(176,141,76,1),
        0 0 48px rgba(176,141,76,0.5),
        inset 0 0 12px rgba(176,141,76,0.4);
    }
    #custom-cursor.hover .cursor-ring-inner {
      width: 8px; height: 8px;
      background: #EFE6D5;
      box-shadow: 0 0 10px #EFE6D5;
    }
    #custom-cursor.clicking .cursor-ring-outer {
      width: 110%; height: 110%;
      top: -5%; left: -5%;
      border-color: #1E5945;
      opacity: 0.6;
    }
    .cursor-ripple {
      position: fixed;
      width: 6px; height: 6px;
      border: 2px solid #B08D4C;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      animation: cursorRipple 0.6s ease-out forwards;
    }
    @keyframes cursorRipple {
      0% { width: 6px; height: 6px; opacity: 0.8; }
      100% { width: 60px; height: 60px; opacity: 0; }

    /* Ambient floating particles */
    .particle {
      position: fixed;
      width: 3px; height: 3px;
      background: rgba(176,141,76,0.4);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }

    /* Screen transitions */
    .screen-enter {
      animation: slideInRight 0.35s cubic-bezier(.2,.8,.2,1);
    }
    .screen-enter-back {
      animation: slideInLeft 0.35s cubic-bezier(.2,.8,.2,1);
    }
    @keyframes slideInRight {
      from { transform: translateX(40%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideInLeft {
      from { transform: translateX(-40%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* Page title fade-in for large titles */
    .title-reveal {
      animation: titleReveal 0.8s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes titleReveal {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .stagger-1 { animation: fadeUp 0.5s cubic-bezier(.2,.8,.2,1) 0.05s both; }

    .stagger-3 { animation: fadeUp 0.5s cubic-bezier(.2,.8,.2,1) 0.15s both; }
    .stagger-4 { animation: fadeUp 0.5s cubic-bezier(.2,.8,.2,1) 0.2s both; }
    .stagger-5 { animation: fadeUp 0.5s cubic-bezier(.2,.8,.2,1) 0.25s both; }
    .stagger-6 { animation: fadeUp 0.5s cubic-bezier(.2,.8,.2,1) 0.3s both; }

      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }

      -webkit-mask: none;
    }

    /* Postmark stamp animation */
    .postmark-stamp {

      opacity: 0;
      transform: scale(1.6) rotate(-12deg);
      transition: all 0.4s cubic-bezier(.17,.67,.25,1.3);
      pointer-events: none;

    .postmark-stamp.active {
      opacity: 1;
      transform: scale(1) rotate(-12deg);

    /* Tab bar */
    .tab-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 83px;
      background: rgba(239, 230, 213, 0.92);
      backdrop-filter: blur(20px) saturate(180%);

    .fab {

      border-radius: 50%;
      background: linear-gradient(135deg, #B34A3A, #8C3829);

      z-index: 25;
      transition: all 0.2s cubic-bezier(.2,.8,.2,1);
    }
    .fab:active {
      transform: scale(0.92);
      box-shadow: 0 4px 12px rgba(179,74,58,0.3);
    }

    /* Pull to refresh */
    .pull-indicator {
      position: absolute;
      top: 0; left: 50%;
      transform: translate(-50%, -40px);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
      z-index: 5;
      pointer-events: none;

    .pull-indicator.show {
      transform: translate(-50%, 70px);
    }
    .pull-icon {
      width: 32px; height: 32px;
      border: 2px solid #B08D4C;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Modal sheet */
    .modal-backdrop {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-sheet {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: #EFE6D5;
      border-radius: 24px 24px 0 0;
      z-index: 31;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(.2,.8,.2,1);
      max-height: 80%;
      overflow: auto;
    }
    .modal-sheet.active {
      transform: translateY(0);
    }
    .modal-handle {
      width: 36px; height: 5px;
      background: rgba(30,89,69,0.2);
      border-radius: 3px;
      margin: 10px auto 0;
    }

    /* Long press menu */
    .context-menu {
      position: absolute;
      background: rgba(28,26,23,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 14px;
      padding: 6px;
      min-width: 160px;
      z-index: 40;
      box-shadow: 0 12px 32px rgba(0,0,0,0.3);
      opacity: 0;
      transform: scale(0.85);
      transform-origin: top center;
      pointer-events: none;
      transition: all 0.18s cubic-bezier(.2,.8,.2,1);
    }
    .context-menu.show {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }
    .context-menu-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      color: #EFE6D5;
      font-size: 14px;
      border-radius: 8px;

    }
    .context-menu-item:hover {
      background: rgba(255,255,255,0.1);
    }
    .context-menu-divider {
      height: 0.5px;
      background: rgba(255,255,255,0.1);
      margin: 3px 6px;
    }

    /* Detail fullscreen transition */
    .detail-page {
      position: absolute; inset: 0;
      background: #EFE6D5;
      z-index: 35;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(.2,.8,.2,1);
      overflow: auto;
    }
    .detail-page.active {
      transform: translateY(0);
    }

    /* Typewriter effect */
    .typewriter-cursor {
      display: inline-block;
      width: 2px; height: 1em;
      background: #B34A3A;
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Glow pulse for rare items */
    .pulse-glow {
      animation: pulseGlow 2.5s ease-in-out infinite;

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 8px rgba(176,141,76,0.4), 0 0 16px rgba(176,141,76,0.2); }

    }

    /* Count up numbers */
    .stat-number {
      font-variant-numeric: tabular-nums;
    }

    /* Floating envelope animation */
    @keyframes floatY {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }

    /* Shimmer on stamp surface */
    .stamp-shimmer {
      position: relative;
      overflow: hidden;
    }
    .stamp-shimmer::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.35) 50%, transparent 60%);
      transform: translateX(-100%);
      transition: transform 0s;
    }
    .stamp-shimmer:hover::after,

      transform: translateX(100%);
      transition: transform 0.8s ease;
    }

      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(239,230,213,0.5);
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-family: 'Playfair Display', serif;
    }
  </style>

function HomePage({ onOpenStamp, onOpenDetail }) {
  const [pullOffset, setPullOffset] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const startY = useRef(0);
  const scrollRef = useRef(null);
  const [postmarkVisible, setPostmarkVisible] = useState(false);

  const handleTouchStart = (e) => {
    if (scrollRef.current && scrollRef.current.scrollTop <= 0) {
      startY.current = e.touches[0].clientY;
    }
  };

  const handleTouchMove = (e) => {
    if (scrollRef.current && scrollRef.current.scrollTop <= 0) {
      const diff = e.touches[0].clientY - startY.current;
      if (diff > 0) {
        setPullOffset(Math.min(diff * 0.5, 80));
      }
    }
  };

  const handleTouchEnd = () => {
    if (pullOffset > 50) {
      setRefreshing(true);
      setTimeout(() => {
        setRefreshing(false);
        setPullOffset(0);
      }, 1500);
    } else {
      setPullOffset(0);
    }
  };

  const featured = stampCollections.filter(s => s.featured).slice(0, 3);

  return (
    <div
      ref={scrollRef}
      style={{ height: '100%', overflowY: 'auto', position: 'relative' }}
      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}
      onTouchEnd={handleTouchEnd}
    >
      {/* Pull to refresh indicator */}
      <div
        className={`pull-indicator ${pullOffset > 10 || refreshing ? 'show' : ''}`}
        style={{
          transform: `translate(-50%, ${-40 + pullOffset}px)`,
          opacity: pullOffset > 10 ? 1 : 0,
        }}

        {refreshing ? (
          <div className="pull-icon" />
        ) : (
          <div style={{
            width: 28, height: 28, borderRadius: '50%',

          }} />

function MarketPage() {
  const [tab, setTab] = useState('行情');
  const [counts, setCounts] = useState({ total: 0, up: 0, down: 0 });

  // Number count-up animation
  useEffect(() => {
    const targets = { total: 12580, up: 8342, down: 4238 };
    let rafId;
    let start = null;
    const duration = 1200;

    const animate = (ts) => {
      if (!start) start = ts;
      const progress = Math.min((ts - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setCounts({
        total: Math.floor(targets.total * eased),
        up: Math.floor(targets.up * eased),
        down: Math.floor(targets.down * eased),
      });
      if (progress < 1) rafId = requestAnimationFrame(animate);
    };
    rafId = requestAnimationFrame(animate);
    return () => cancelAnimationFrame(rafId);
  }, []);

  return (
    <div style={{ height: '100%', overflowY: 'auto' }}>

                background: 'rgba(0,0,0,0.7)', color: '#fff',
                fontSize: 12,
              }}>{action.label}</span>
              <div style={{
                width: 42, height: 42, borderRadius: '50%',
                background: '#fff', color: action.color,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontSize: 18,
                boxShadow: '0 4px 12px rgba(0,0,0,0.15)',
                cursor: 'pointer',
              }}
                onClick={() => { setExpanded(false); setRotation(r => r - 45); }}
                onMouseEnter={(e) => window.dispatchEvent(new CustomEvent('cursor-hover', { detail: { hovering: true, target: e.currentTarget } }))}
                onMouseLeave={() => window.dispatchEvent(new CustomEvent('cursor-hover', { detail: { hovering: false } }))}
              >
                {action.icon}
              </div>
            </div>
          ))}
        </div>
      )}

      {/* FAB */}
      <div
        ref={btnRef}
        className="fab"
        style={{
          transform: expanded ? 'scale(0.95)' : 'scale(1)',
        }}
        onClick={handleClick}
        onMouseEnter={(e) => window.dispatchEvent(new CustomEvent('cursor-hover', { detail: { hovering: true, target: e.currentTarget } }))}
        onMouseLeave={() => window.dispatchEvent(new CustomEvent('cursor-hover', { detail: { hovering: false } }))}
      >
        <div style={{
          transform: `rotate(${rotation}deg)`,
          transition: 'transform 0.3s cubic-bezier(.2,.8,.2,1)',
        }}>
          <Icon.Plus />
        </div>
      </div>
    </>
  );
}

// ─────────────────────────────────────────────────────────────
// Custom Cursor Controller
// ─────────────────────────────────────────────────────────────
function CustomCursor() {
  const cursorRef = useRef(null);
  const rafRef = useRef(null);
  const targetRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const currentRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const hoverRef = useRef(false);
  const reducedMotion = useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const visibleRef = useRef(true);

  useEffect(() => {
    const cursor = cursorRef.current;
    if (!cursor) return;

    const onMove = (e) => {
      targetRef.current.x = e.clientX;
      targetRef.current.y = e.clientY;
    };

    const onHover = (e) => {
      hoverRef.current = e.detail.hovering;
      cursor.classList.toggle('hover', e.detail.hovering);
    };

    const onDown = () => {
      cursor.classList.add('clicking');
      // Create ripple
      const ripple = document.createElement('div');
      ripple.className = 'cursor-ripple';
      ripple.style.left = `${currentRef.current.x - 3}px`;
      ripple.style.top = `${currentRef.current.y - 3}px`;
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    };

    const onUp = () => {
      cursor.classList.remove('clicking');
    };

    const onVisibility = () => {
      visibleRef.current = !document.hidden;
      if (visibleRef.current && !rafRef.current) {
        animate();
      }
    };

    const animate = () => {
      if (!visibleRef.current || reducedMotion.current) {
        rafRef.current = null;
        return;
      }
      const tx = targetRef.current.x;
      const ty = targetRef.current.y;
      const cx = currentRef.current.x;
      const cy = currentRef.current.y;

      // Easing toward target
      const nx = cx + (tx - cx) * 0.18;
      const ny = cy + (ty - cy) * 0.18;

      currentRef.current.x = nx;
      currentRef.current.y = ny;

      cursor.style.transform = `translate(${nx - cursor.offsetWidth / 2}px, ${ny - cursor.offsetHeight / 2}px)`;
      cursor.style.left = '0';
      cursor.style.top = '0';

      rafRef.current = requestAnimationFrame(animate);
    };

    window.addEventListener('mousemove', onMove);
    window.addEventListener('mousedown', onDown);
    window.addEventListener('mouseup', onUp);
    window.addEventListener('cursor-hover', onHover);
    document.addEventListener('visibilitychange', onVisibility);

    // Initial position
    cursor.style.left = `${window.innerWidth / 2}px`;
    cursor.style.top = `${window.innerHeight / 2}px`;

    if (!reducedMotion.current) {
      animate();
    } else {
      // Snap directly
      cursor.style.left = `${targetRef.current.x}px`;
      cursor.style.top = `${targetRef.current.y}px`;
    }

    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mousedown', onDown);
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('cursor-hover', onHover);
      document.removeEventListener('visibilitychange', onVisibility);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, []);

  return (
    <div id="custom-cursor" ref={cursorRef} style={{ position: 'fixed' }}>
      <div className="cursor-ring-outer"></div>
      <div className="cursor-ring-inner"></div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Ambient particles
// ─────────────────────────────────────────────────────────────
function AmbientParticles() {
  const containerRef = useRef(null);
  const rafRef = useRef(null);
  const particlesRef = useRef([]);
  const visibleRef = useRef(true);
  const reducedMotion = useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  useEffect(() => {
    if (reducedMotion.current) return;

    const container = containerRef.current;
    if (!container) return;

    // Create particles
    const count = 20;
    const particles = [];
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'particle';
      const size = 2 + Math.random() * 4;
      el.style.width = `${size}px`;
      el.style.height = `${size}px`;
      container.appendChild(el);
      particles.push({
        el,
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - 0.5) * 0.3,
        vy: -0.2 - Math.random() * 0.5,
        phase: Math.random() * Math.PI * 2,
        speed: 0.5 + Math.random() * 1.5,
        opacity: 0.2 + Math.random() * 0.4,
      });
    }
    particlesRef.current = particles;

    let time = 0;

    const animate = () => {
      if (!visibleRef.current) {
        rafRef.current = null;
        return;
      }
      time += 0.016;

      for (const p of particles) {
        p.x += p.vx + Math.sin(time * p.speed + p.phase) * 0.15;
        p.y += p.vy;

        // Wrap around
        if (p.y < -10) {
          p.y = window.innerHeight + 10;
          p.x = Math.random() * window.innerWidth;
        }
        if (p.x < -10) p.x = window.innerWidth + 10;
        if (p.x > window.innerWidth + 10) p.x = -10;

        p.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
        p.el.style.opacity = p.opacity * (0.5 + 0.5 * Math.sin(time * p.speed + p.phase));
      }

      rafRef.current = requestAnimationFrame(animate);
    };

    const onVisibility = () => {
      visibleRef.current = !document.hidden;
      if (visibleRef.current && !rafRef.current) {
        animate();
      }
    };

    document.addEventListener('visibilitychange', onVisibility);
    animate();

    return () => {
      document.removeEventListener('visibilitychange', onVisibility);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      for (const p of particles) {
        p.el.remove();
      }
    };
  }, []);

  return <div ref={containerRef} style={{ position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 1 }} />;
}

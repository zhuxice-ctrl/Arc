  <style>
/* ================================
   口袋天文台 · Pocket Observatory
   设计系统：午夜黑 + 月白 + 彗星橙
   ================================ */

:root {
  --midnight: #0D0F14;
  --midnight-900: #06070A;
  --midnight-800: #12151C;
  --midnight-700: #1A1E28;
  --midnight-600: #242936;
  --midnight-500: #333948;
  --midnight-400: #4A5162;
  --rock: #2A2D35;
  --moonwhite: #F2EFE6;
  --moonwhite-dim: #C8C5B8;
  --moonwhite-faint: #8A8779;
  --comet: #FF7A1A;
  --comet-dim: #CC5F0F;
  --comet-glow: rgba(255, 122, 26, 0.35);
  --aurora: #4CD6A7;
  --aurora-glow: rgba(76, 214, 167, 0.25);
  --zodiac: #E8D59B;

  --font-display: 'Cormorant Garamond', serif;
  --font-body: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--midnight-900);
  color: var(--moonwhite);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

#root {
  width: 100%;
  height: 100%;
}

/* 星点纹理背景 */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 20% 30%, rgba(255, 255, 255, 0.8), transparent 50%),
    radial-gradient(1px 1px at 40% 70%, rgba(255, 255, 255, 0.5), transparent 50%),
    radial-gradient(1.5px 1.5px at 60% 20%, rgba(255, 255, 255, 0.6), transparent 50%),
    radial-gradient(1px 1px at 80% 50%, rgba(255, 255, 255, 0.7), transparent 50%),
    radial-gradient(1px 1px at 10% 80%, rgba(255, 255, 255, 0.4), transparent 50%),
    radial-gradient(1.2px 1.2px at 90% 90%, rgba(255, 255, 255, 0.5), transparent 50%),
    radial-gradient(1px 1px at 50% 10%, rgba(255, 255, 255, 0.6), transparent 50%),
    radial-gradient(0.8px 0.8px at 30% 50%, rgba(255, 255, 255, 0.4), transparent 50%),
    radial-gradient(1px 1px at 70% 40%, rgba(255, 255, 255, 0.5), transparent 50%),
    radial-gradient(1.5px 1.5px at 15% 15%, rgba(255, 122, 26, 0.6), transparent 50%);
  background-size: 400px 400px;
  opacity: 0.6;
  pointer-events: none;
  z-index: 0;
}

/* 舞台容器 */
.stage {
  position: relative;
  width: 100%;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
  padding: 24px;
}

/* ===== 自定义光标 ===== */
.custom-cursor {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  will-change: transform;
}

.cursor-ring {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 28px;
  height: 28px;
  border: 1.5px solid var(--moonwhite);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: width 0.3s cubic-bezier(0.2, 0.9, 0.3, 1),
              height 0.3s cubic-bezier(0.2, 0.9, 0.3, 1),
              border-color 0.3s,
              border-width 0.3s;
  box-shadow:
    0 0 12px rgba(255, 255, 255, 0.3),
    0 0 24px rgba(255, 122, 26, 0.2);
}

.cursor-dot {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 5px;
  height: 5px;
  background: var(--comet);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow:
    0 0 8px var(--comet),
    0 0 16px var(--comet-glow);
  transition: width 0.2s, height 0.2s, background 0.2s;
}

.cursor-ring.hover {
  width: 48px;
  height: 48px;
  border-color: var(--comet);
  border-width: 1px;
  box-shadow:
    0 0 20px var(--comet-glow),
    0 0 40px rgba(255, 122, 26, 0.15);
}

.cursor-dot.hover {
  width: 3px;
  height: 3px;
  background: var(--moonwhite);
  box-shadow: 0 0 6px var(--moonwhite);
}

/* 涟漪 */
.cursor-ripple {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border: 1.5px solid var(--comet);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  opacity: 0;
  animation: ripple-expand 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes ripple-expand {
  0% {
    width: 0;
    height: 0;
    opacity: 0.8;
  }
  100% {
    width: 60px;
    height: 60px;
    opacity: 0;
  }
}

/* ===== 签名动效：星轨签名 ===== */
.signature-arc {
  fill: none;
  stroke: var(--comet);
  stroke-width: 1.5;
  stroke-linecap: round;
  filter: drop-shadow(0 0 4px var(--comet-glow)) drop-shadow(0 0 8px rgba(255, 122, 26, 0.2));
}

/* ===== 设备外壳调整 ===== */
.ios-device-dark {
  background: var(--midnight) !important;
}

/* ===== 通用文字 ===== */
.font-display {
  font-family: var(--font-display);
  letter-spacing: 0.01em;
}

.font-mono {
  font-family: var(--font-mono);
}

/* ===== 滚动条 ===== */
::-webkit-scrollbar {
  width: 3px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--midnight-500);
  border-radius: 2px;
}

/* ===== 交互元素标签 ===== */
.interactive {
  cursor: none;
}

/* ===== 减少动效 ===== */
@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .custom-cursor { display: none; }
}

</style>
</head>

/* BEGIN USAGE */
// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports (to window): IOSDevice, IOSStatusBar, IOSList, IOSListRow, IOSKeyboard
//
// Usage — wrap your screen content in <IOSDevice> to get the bezel, status bar
// and home indicator (props: width=402, height=874, dark, keyboard):
//
//   <IOSDevice>
//     ...your screen content...
//   </IOSDevice>
//   <IOSDevice dark keyboard>…</IOSDevice>
//   <IOSDevice width={390} height={844}>…</IOSDevice>   // smaller device size
//
// Safe areas — REQUIRED on every screen. The status bar (top) and home
// indicator (bottom) float OVER your content; inset it or it overlaps them.
//   --ios-safe-top     top inset (Dynamic Island + status bar)
//   --ios-safe-bottom  bottom inset (home indicator)
/* END USAGE */

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      border: '1px solid #DEE0E3',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
      '--ios-safe-top': '62px',
      '--ios-safe-bottom': '34px',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* content — isolate:isolate keeps the screen in its own stacking
          context so any z-index authored inside it stays *below* the frame
          chrome (status bar z:10, island z:50, home indicator z:60); a
          sticky/opaque header with a high z-index can no longer paint over
          the status bar. */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column', isolation: 'isolate' }}>
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSList, IOSListRow, IOSKeyboard,
});

</script>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (miaoda:tweaks:set-keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: 'miaoda:tweaks:set-keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts miaoda:tweaks:dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes miaoda:tweaks:deactivate back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // x = distance from the viewport's right edge, y = distance from its TOP.
  // The panel anchors top-right (right/top in CSS) so it clears the host's
  // bottom toolbar; both axes still grow inward, so clamp/drag math is
  // symmetric with the old bottom-right anchor.
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxTop = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxTop, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.top = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === 'miaoda:tweaks:activate') setOpen(true);
      else if (t === 'miaoda:tweaks:deactivate') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: 'miaoda:tweaks:available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: 'miaoda:tweaks:dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startTop = r.top;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startTop + (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-miaoda-chrome=""
           style={{ right: offsetRef.current.x, top: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {

      <input type="range" className="twk-slider" min={min} max={max} step={step}

function TweakToggle({ label, value, onChange }) {

              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~244px (280 panel − 32 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 12px system-ui averages ~6.6px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

// Opt out of DCViewport's transform so position:fixed works against the viewport.

// Typewriter-cycles through `suggestions`. Clicking the field while a
// suggestion is animating freezes it as ghost text; Tab accepts it into the
// input. Enter posts miaoda:tweaks:chat (host drops the text into the chat
// composer for the user to send). After the cycle the static placeholder
// types in and "Ideas" appears — clicking asks for three more suggestions.
function TweakSuggestionBar({
  suggestions = [],
  placeholder = 'Describe a tweak…',
  ideasPrompt = 'Suggest three more tweak ideas for this design and update the suggestions on TweakSuggestionBar.',
}) {
  const [val, setVal] = React.useState('');
  const [ghost, setGhost] = React.useState('');
  const [focused, setFocused] = React.useState(false);
  const inputRef = React.useRef(null);
  const tw = useTwkTypewriter(suggestions, { placeholder, enabled: !val && !ghost && !focused });

  const freeze = () => {
    tw.markPlayed();
    if (val || ghost) return;
    const target = !tw.done ? suggestions[tw.idx] : '';
    if (target) setGhost(target);
    inputRef.current?.focus();
  };

  const submit = () => {
    const v = (val || ghost).trim();
    if (!v) return;
    __twkSendChat(v);
    setVal('');
    setGhost('');
  };

  const onKeyDown = (e) => {
    if (e.key === 'Tab' && ghost && !val) {
      e.preventDefault();
      setVal(ghost);
      setGhost('');
    } else if (e.key === 'Enter') {
      e.preventDefault();
      submit();
    } else if (e.key === 'Escape') {
      setGhost('');
    }
  };

  const requestIdeas = () => __twkSendChat(ideasPrompt);

  const showAnim = !val && !ghost && !focused && !tw.done;
  const showStatic = !val && !ghost && !focused && tw.done;

  return (
    <div className="twk-sugg" onMouseDown={freeze}>
      <div className="twk-sugg-field">
        <input
          ref={inputRef}
          value={val}
          placeholder={focused && !ghost ? placeholder : ''}
          onChange={(e) => { setVal(e.target.value); setGhost(''); }}
          onFocus={() => { setFocused(true); tw.markPlayed(); }}
          onBlur={() => { setFocused(false); if (!val) setGhost(''); }}
          onKeyDown={onKeyDown}
        />
        {showAnim && (
          <div className="twk-sugg-ghost">
            {tw.text}<span className="twk-sugg-caret" />
          </div>
        )}
        {showStatic && (
          <div className="twk-sugg-ghost">
            {tw.tail}{tw.tail.length < placeholder.length && <span className="twk-sugg-caret" />}
          </div>
        )}
        {ghost && !val && (
          <div className="twk-sugg-ghost hint">{ghost}</div>
        )}
      </div>
      {val || ghost ? (
        <button className="twk-sugg-send"
                onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); }}
                onClick={submit}>
          Add
        </button>
      ) : tw.done && !focused ? (
        <button className="twk-sugg-ideas"
                onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); }}
                onClick={requestIdeas}>
          Ideas <ClaudeSpark />
        </button>
      ) : null}
    </div>
  );
}

// Minimal type→pause→erase cycler. Plays once per unique `items` content per
// session — a reload from a tweak-value write skips straight to done; a new
// suggestion set (after "Ideas") gets a fresh animation.
function useTwkTypewriter(items, { placeholder, typeMs = 35, eraseMs = 22, pauseMs = 1800, enabled = true } = {}) {
  const key = React.useMemo(() => '__twk_played:' + JSON.stringify(items), [items.join('\n')]);
  const played = () => { try { return sessionStorage.getItem(key) === '1'; } catch { return false; } };

  const [text, setText] = React.useState('');
  const [tail, setTail] = React.useState(() => (items.length === 0 || played() ? placeholder : ''));
  const [idx, setIdx] = React.useState(0);
  const [done, setDone] = React.useState(() => items.length === 0 || played());
  const phase = React.useRef('type');
  const n = React.useRef(0);

  const markPlayed = React.useCallback(() => {
    try { sessionStorage.setItem(key, '1'); } catch {}
    setDone(true);
  }, [key]);

  React.useEffect(() => {
    const skip = items.length === 0 || played();
    setText(''); setIdx(0);
    setDone(skip);
    setTail(skip ? placeholder : '');
    phase.current = 'type'; n.current = 0;
  }, [key]);

  React.useEffect(() => {
    if (done || !enabled) return;
    const item = items[idx] ?? '';
    let t;
    const tick = () => {
      if (phase.current === 'type') {
        n.current++;
        setText(item.slice(0, n.current));
        if (n.current >= item.length) { phase.current = 'pause'; t = setTimeout(tick, pauseMs); }
        else t = setTimeout(tick, typeMs + Math.random() * 20);
      } else if (phase.current === 'pause') {
        phase.current = 'erase'; t = setTimeout(tick, eraseMs);
      } else {
        n.current--;
        setText(item.slice(0, n.current));
        if (n.current <= 0) {
          if (idx === items.length - 1) { markPlayed(); return; }
          phase.current = 'type'; setIdx((i) => i + 1);
        } else t = setTimeout(tick, eraseMs);
      }
    };
    phase.current = 'type'; n.current = 0; setText('');
    t = setTimeout(tick, 400);
    return () => clearTimeout(t);
  }, [idx, done, key, enabled, typeMs, eraseMs, pauseMs]);

  React.useEffect(() => {
    if (!done || tail === placeholder) return;
    let i = 0;
    const t = setInterval(() => {
      i++; setTail(placeholder.slice(0, i));
      if (i >= placeholder.length) clearInterval(t);
    }, 28);
    return () => clearInterval(t);
  }, [done, placeholder]);

  return { text, tail, idx, done, markPlayed };
}

/* =====================================================================
   口袋天文台 · 动效组件库 (effects.jsx)
   12+ 组件级特效：自定义光标、粒子、频谱、3D倾斜、滚动渐入、

const { useState, useEffect, useRef, useCallback } = React;

/* ============================================================
   1. 自定义光标 Custom Cursor
   - 白色粗环 + 彗星橙内点 + 多层发光
   - z-index: 9999
   - 悬停可交互元素放大 + 变色 + 三态切换
   - 点击涟漪
   - visibilitychange 暂停
   ============================================================ */
function CustomCursor() {
  const cursorRef = useRef(null);
  const ringRef = useRef(null);
  const dotRef = useRef(null);
  const rafRef = useRef(null);
  const hoverRef = useRef(false);
  const clickRef = useRef(0);
  const targetRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const currentRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });

  const initPos = useCallback(() => {
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    targetRef.current = { x: cx, y: cy };
    currentRef.current = { x: cx, y: cy };
    if (cursorRef.current) {
      cursorRef.current.style.transform = `translate(${cx}px, ${cy}px)`;
    }
  }, []);

  useEffect(() => {
    initPos();

    // 弹簧阻尼系数
    const SPRING = 0.18;
    const DAMPING = 0.82;
    const vel = { x: 0, y: 0 };

    const onMove = (e) => {
      targetRef.current.x = e.clientX;
      targetRef.current.y = e.clientY;

      // 悬停检测
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const isInteractive = el && el.closest('.interactive');
      if (isInteractive !== hoverRef.current) {
        hoverRef.current = isInteractive;
        if (ringRef.current) ringRef.current.classList.toggle('hover', isInteractive);
        if (dotRef.current) dotRef.current.classList.toggle('hover', isInteractive);
      }
    };

    const onDown = (e) => {
      if (!cursorRef.current) return;
      clickRef.current++;
      const ripple = document.createElement('div');
      ripple.className = 'cursor-ripple';
      ripple.style.animationDelay = '0s';
      cursorRef.current.appendChild(ripple);
      setTimeout(() => ripple.remove(), 650);
    };

    const tick = () => {
      const dx = targetRef.current.x - currentRef.current.x;
      const dy = targetRef.current.y - currentRef.current.y;
      vel.x = (vel.x + dx * SPRING) * DAMPING;
      vel.y = (vel.y + dy * SPRING) * DAMPING;
      currentRef.current.x += vel.x;
      currentRef.current.y += vel.y;

      if (cursorRef.current) {
        cursorRef.current.style.transform = `translate(${currentRef.current.x}px, ${currentRef.current.y}px)`;
      }
      rafRef.current = requestAnimationFrame(tick);
    };

    const onVisible = () => {
      if (!rafRef.current) rafRef.current = requestAnimationFrame(tick);
    };
    const onHidden = () => {
      if (rafRef.current) {
        cancelAnimationFrame(rafRef.current);
        rafRef.current = null;
      }
    };

    const onVis = () => {
      if (document.hidden) onHidden();
      else onVisible();
    };

    window.addEventListener('mousemove', onMove);
    window.addEventListener('mousedown', onDown);
    document.addEventListener('visibilitychange', onVis);
    rafRef.current = requestAnimationFrame(tick);

    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mousedown', onDown);
      document.removeEventListener('visibilitychange', onVis);
      if (rafRef.current) {
        cancelAnimationFrame(rafRef.current);
        rafRef.current = null;
      }
    };
  }, [initPos]);

  return (
    <div className="custom-cursor" ref={cursorRef}>
      <div className="cursor-ring" ref={ringRef}></div>
      <div className="cursor-dot" ref={dotRef}></div>
    </div>
  );
}

/* ============================================================
   2. 星空粒子 Starfield Particles
   - 视差多层
   - 缓慢漂移（惯性）
   - 闪烁（正弦叠加）
   ============================================================ */
function Starfield({ count = 80, speed = 0.3 }) {
  const canvasRef = useRef(null);
  const rafRef = useRef(null);
  const starsRef = useRef([]);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * 2;
    canvas.height = rect.height * 2;
    ctx.scale(2, 2);

    // 三层星：近/中/远
    const layers = [
      { count: Math.floor(count * 0.2), size: [1.2, 2], speed: speed * 1.8, opacity: 0.9, color: '#F2EFE6' },
      { count: Math.floor(count * 0.4), size: [0.8, 1.4], speed: speed * 1, opacity: 0.6, color: '#C8C5B8' },
      { count: Math.floor(count * 0.4), size: [0.5, 1], speed: speed * 0.4, opacity: 0.35, color: '#8A8779' },
    ];

    const stars = [];
    layers.forEach((layer) => {
      for (let i = 0; i < layer.count; i++) {
        stars.push({
          x: Math.random() * rect.width,
          y: Math.random() * rect.height,
          size: layer.size[0] + Math.random() * (layer.size[1] - layer.size[0]),
          speed: layer.speed * (0.6 + Math.random() * 0.8),
          opacity: layer.opacity * (0.5 + Math.random() * 0.5),
          color: layer.color,
          twinkle: Math.random() * Math.PI * 2,
          twinkleSpeed: 0.008 + Math.random() * 0.02,
          drift: (Math.random() - 0.5) * 0.15,
        });
      }
    });
    starsRef.current = stars;

    let t = 0;
    const tick = () => {
      ctx.clearRect(0, 0, rect.width, rect.height);
      t++;
      stars.forEach((s) => {
        s.x += s.drift;
        s.y -= s.speed * 0.1;
        s.twinkle += s.twinkleSpeed;
        if (s.y < -2) {
          s.y = rect.height + 2;
          s.x = Math.random() * rect.width;
        }
        if (s.x < -2) s.x = rect.width + 2;
        if (s.x > rect.width + 2) s.x = -2;

        const flicker = 0.6 + Math.sin(s.twinkle) * 0.4;
        ctx.globalAlpha = s.opacity * flicker;
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();

        // 近层加光晕
        if (s.size > 1.2) {
          ctx.globalAlpha = s.opacity * flicker * 0.3;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size * 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      });
      ctx.globalAlpha = 1;
      rafRef.current = requestAnimationFrame(tick);
    };

    const onVis = () => {
      if (document.hidden) {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        rafRef.current = null;
      } else {
        if (!rafRef.current) rafRef.current = requestAnimationFrame(tick);
      }
    };
    document.addEventListener('visibilitychange', onVis);
    rafRef.current = requestAnimationFrame(tick);

    return () => {
      document.removeEventListener('visibilitychange', onVis);
      if (rafRef.current) {
        cancelAnimationFrame(rafRef.current);
        rafRef.current = null;
      }
    };
  }, [count, speed]);

  return <canvas ref={canvasRef} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none' }} />;
}

/* ============================================================
   3. 数字计数 CountUp
   - 弹簧式缓动
   ============================================================ */
function CountUp({ value, duration = 1500, decimals = 0, prefix = '', suffix = '', className = '' }) {
  const [display, setDisplay] = useState(0);
  const rafRef = useRef(null);
  const startTimeRef = useRef(null);
  const startValueRef = useRef(0);

  useEffect(() => {
    const start = startValueRef.current;
    const end = value;
    startValueRef.current = end;
    startTimeRef.current = null;

    if (rafRef.current) {
      cancelAnimationFrame(rafRef.current);
      rafRef.current = null;
    }

    // easeOutQuart
    const ease = (t) => 1 - Math.pow(1 - t, 4);

    const step = (ts) => {
      if (!startTimeRef.current) startTimeRef.current = ts;
      const elapsed = ts - startTimeRef.current;
      const p = Math.min(elapsed / duration, 1);
      const v = start + (end - start) * ease(p);
      setDisplay(v);
      if (p < 1) {
        rafRef.current = requestAnimationFrame(step);
      } else {
        rafRef.current = null;
      }
    };
    rafRef.current = requestAnimationFrame(step);

    const onVis = () => {
      if (document.hidden) {
        if (rafRef.current) {
          cancelAnimationFrame(rafRef.current);
          rafRef.current = null;
        }
      } else {
        if (!startTimeRef.current || display !== value) {
          rafRef.current = requestAnimationFrame(step);
        }
      }
    };
    document.addEventListener('visibilitychange', onVis);

    return () => {
      document.removeEventListener('visibilitychange', onVis);
      if (rafRef.current) {
        cancelAnimationFrame(rafRef.current);
        rafRef.current = null;
      }
    };
  }, [value, duration]);

  return (
    <span className={className}>
      {prefix}{display.toFixed(decimals)}{suffix}
    </span>
  );
}

/* ============================================================
   4. 打字机 Typewriter
   - 变速度（模拟人类节奏）
   ============================================================ */
function Typewriter({ text, speed = 60, delay = 0, className = '', onDone }) {
  const [shown, setShown] = useState('');
  const timeoutRef = useRef(null);
  const idxRef = useRef(0);
  const doneRef = useRef(false);

  useEffect(() => {
    idxRef.current = 0;
    setShown('');
    doneRef.current = false;

    if (timeoutRef.current) {
      clearTimeout(timeoutRef.current);
      timeoutRef.current = null;
    }

    const type = () => {
      if (idxRef.current < text.length) {
        idxRef.current++;
        setShown(text.slice(0, idxRef.current));
        // 变速：标点后停顿
        const ch = text[idxRef.current - 1];
        let wait = speed * (0.6 + Math.random() * 0.8);
        if (ch === '.' || ch === '。' || ch === '!' || ch === '?') wait = speed * 2.5;
        else if (ch === ',' || ch === '，') wait = speed * 1.4;
        timeoutRef.current = setTimeout(type, wait);
      } else {
        doneRef.current = true;
        if (onDone) onDone();
      }
    };

    timeoutRef.current = setTimeout(type, delay);

    const onVis = () => {
      if (document.hidden) {
        if (timeoutRef.current) {
          clearTimeout(timeoutRef.current);
          timeoutRef.current = null;
        }
      } else {
        if (!doneRef.current && !timeoutRef.current) {
          timeoutRef.current = setTimeout(type, speed);
        }
      }
    };
    document.addEventListener('visibilitychange', onVis);

    return () => {
      document.removeEventListener('visibilitychange', onVis);
      if (timeoutRef.current) {
        clearTimeout(timeoutRef.current);
        timeoutRef.current = null;

/* ============================================================
   5. 3D 倾斜卡片 TiltCard
   - 磁性反平方引力（鼠标越近偏转越大）
   - 直接操作 DOM transform，不触发 setState
   ============================================================ */
function TiltCard({ children, maxTilt = 12, style = {}, className = '' }) {
  const cardRef = useRef(null);

  useEffect(() => {
    const el = cardRef.current;
    if (!el) return;

    const onMove = (e) => {
      const rect = el.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = (e.clientX - cx) / (rect.width / 2);
      const dy = (e.clientY - cy) / (rect.height / 2);
      const dist = Math.sqrt(dx * dx + dy * dy);
      // 磁性反平方：距离越近力越大
      const force = 1 / (1 + dist * 1.2);
      const tiltX = -dy * maxTilt * force;
      const tiltY = dx * maxTilt * force;
      el.style.transform = `perspective(900px) rotateX(${tiltX}deg) rotateY(${tiltY}deg) translateZ(0)`;

      // 内部光泽跟随
      const gloss = el.querySelector('.tilt-gloss');
      if (gloss) {
        const gx = (e.clientX - rect.left) / rect.width * 100;
        const gy = (e.clientY - rect.top) / rect.height * 100;
        gloss.style.background = `radial-gradient(circle at ${gx}% ${gy}%, rgba(255,255,255,0.12) 0%, transparent 60%)`;
      }
    };

    const onLeave = () => {
      el.style.transform = 'perspective(900px) rotateX(0) rotateY(0)';
      const gloss = el.querySelector('.tilt-gloss');
      if (gloss) gloss.style.background = 'transparent';
    };

    el.addEventListener('mousemove', onMove);
    el.addEventListener('mouseleave', onLeave);
    return () => {
      el.removeEventListener('mousemove', onMove);
      el.removeEventListener('mouseleave', onLeave);
    };
  }, [maxTilt]);

  return (
    <div
      ref={cardRef}
      className={`interactive ${className}`}
      style={{
        position: 'relative',
        transition: 'transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1)',
        transformStyle: 'preserve-3d',
        ...style,
      }}
    >
      <div className="tilt-gloss" style={{ position: 'absolute', inset: 0, pointerEvents: 'none', borderRadius: 'inherit', zIndex: 10 }}></div>
      {children}
    </div>
  );
}

/* ============================================================
   9. 频谱条 SpectrumBars
   - 模拟天体光谱/信号
   - 正弦 + 随机噪声
   ============================================================ */
function SpectrumBars({ count = 32, height = 60, color = 'var(--comet)' }) {
  const canvasRef = useRef(null);
  const rafRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * 2;
    canvas.height = rect.height * 2;
    ctx.scale(2, 2);

    const bars = [];
    for (let i = 0; i < count; i++) {
      bars.push({
        phase: Math.random() * Math.PI * 2,
        freq: 0.015 + Math.random() * 0.03,
        amp: 0.3 + Math.random() * 0.7,
        noise: 0,
        noiseSpeed: 0.05 + Math.random() * 0.1,
      });
    }

    let t = 0;
    const tick = () => {
      t++;
      ctx.clearRect(0, 0, rect.width, rect.height);
      const barW = rect.width / count - 2;

      bars.forEach((b, i) => {
        b.phase += b.freq;
        const base = Math.sin(b.phase) * 0.5 + 0.5;
        b.noise += (Math.random() - 0.5) * b.noiseSpeed;
        b.noise *= 0.9;
        const h = (base * b.amp + Math.abs(b.noise) * 0.4) * rect.height * 0.9;
        const x = i * (rect.width / count) + 1;
        const y = rect.height - h;

        const grad = ctx.createLinearGradient(0, y, 0, rect.height);
        grad.addColorStop(0, color);
        grad.addColorStop(1, 'rgba(255, 122, 26, 0.2)');
        ctx.fillStyle = grad;
        ctx.fillRect(x, y, barW, h);
      });

      rafRef.current = requestAnimationFrame(tick);
    };

    const onVis = () => {
      if (document.hidden) {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        rafRef.current = null;
      } else {
        if (!rafRef.current) rafRef.current = requestAnimationFrame(tick);
      }
    };
    document.addEventListener('visibilitychange', onVis);
    rafRef.current = requestAnimationFrame(tick);

    return () => {
      document.removeEventListener('visibilitychange', onVis);
      if (rafRef.current) {
        cancelAnimationFrame(rafRef.current);
        rafRef.current = null;
      }
    };
  }, [count, color]);

  return <canvas ref={canvasRef} style={{ width: '100%', height, display: 'block' }} />;
}

/* ============================================================
   11. 潮汐波形 Wave
   - 正弦叠加
   ============================================================ */
function TidalWave({ color = 'rgba(255, 122, 26, 0.15)', height = 40 }) {
  const canvasRef = useRef(null);
  const rafRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * 2;
    canvas.height = rect.height * 2;
    ctx.scale(2, 2);

    let t = 0;
    const tick = () => {
      t += 0.02;
      ctx.clearRect(0, 0, rect.width, rect.height);

      // 双层波
      [
        { amp: 8, freq: 0.02, speed: 1, color },
        { amp: 5, freq: 0.035, speed: 1.5, color: 'rgba(76, 214, 167, 0.1)' },
      ].forEach((w) => {
        ctx.beginPath();
        ctx.moveTo(0, rect.height);
        for (let x = 0; x <= rect.width; x += 2) {
          const y = rect.height / 2 + Math.sin(x * w.freq + t * w.speed) * w.amp
            + Math.sin(x * w.freq * 2.3 + t * w.speed * 0.7) * w.amp * 0.3;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(rect.width, rect.height);
        ctx.closePath();
        ctx.fillStyle = w.color;
        ctx.fill();
      });

      rafRef.current = requestAnimationFrame(tick);
    };

    const onVis = () => {
      if (document.hidden) {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        rafRef.current = null;
      } else {
        if (!rafRef.current) rafRef.current = requestAnimationFrame(tick);
      }
    };
    document.addEventListener('visibilitychange', onVis);
    rafRef.current = requestAnimationFrame(tick);

    return () => {
      document.removeEventListener('visibilitychange', onVis);
      if (rafRef.current) {
        cancelAnimationFrame(rafRef.current);
        rafRef.current = null;
      }
    };
  }, [color, height]);

  return <canvas ref={canvasRef} style={{ width: '100%', height, display: 'block' }} />;
}

/* ============================================================
   12. 磁吸按钮 MagneticButton
   - 反平方引力
   ============================================================ */
function MagneticButton({ children, style = {}, radius = 80, onClick, className = '' }) {
  const btnRef = useRef(null);

  useEffect(() => {
    const el = btnRef.current;
    if (!el) return;

    const onMove = (e) => {
      const rect = el.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < radius) {
        // 反平方：距离越近吸力越强
        const force = Math.pow(1 - dist / radius, 2);
        const tx = dx * force * 0.35;
        const ty = dy * force * 0.35;
        el.style.transform = `translate(${tx}px, ${ty}px)`;
      } else {
        el.style.transform = 'translate(0, 0)';
      }
    };

    const reset = () => {
      el.style.transform = 'translate(0, 0)';
    };

    window.addEventListener('mousemove', onMove);
    el.addEventListener('mouseleave', reset);

    return () => {
      window.removeEventListener('mousemove', onMove);
      el.removeEventListener('mouseleave', reset);
    };
  }, [radius]);

  return (
    <div
      ref={btnRef}
      onClick={onClick}
      className={`interactive ${className}`}
      style={{
        display: 'inline-flex',
        transition: 'transform 0.15s cubic-bezier(0.2, 0.9, 0.3, 1)',
        ...style,
      }}
    >
      {children}
    </div>
  );
}

/* ============================================================
   13. 滚动渐入 Reveal
   - 带阻尼
   ============================================================ */
function Reveal({ children, delay = 0, direction = 'up', className = '' }) {
  const [visible, setVisible] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    const t = setTimeout(() => setVisible(true), delay);
    return () => clearTimeout(t);
  }, [delay]);

  const transform = {
    up: 'translateY(20px)',
    down: 'translateY(-20px)',
    left: 'translateX(20px)',
    right: 'translateX(-20px)',
  }[direction] || 'translateY(20px)';

  return (
    <div
      ref={ref}
      className={className}
      style={{
        opacity: visible ? 1 : 0,
        transform: visible ? 'translate(0, 0)' : transform,
        transition: `opacity 0.8s cubic-bezier(0.2, 0.9, 0.3, 1) ${delay}ms, transform 0.8s cubic-bezier(0.2, 0.9, 0.3, 1) ${delay}ms`,
      }}
    >
      {children}
    </div>
  );
}

/* 星座连线 SVG */
function ConstellationLines({ id }) {
  const paths = {
    orion: 'M30,40 L50,60 L70,50 L90,35 M50,60 L50,85 M42,70 L58,70 M70,50 L70,80 L80,95',
    ursa: 'M25,45 L40,40 L55,48 L70,42 L80,55 L70,75 L55,72 L40,60 M40,40 L40,60 L55,72',
    cassiopeia: 'M20,60 L35,40 L50,55 L65,35 L80,55 L95,45',
    leo: 'M25,60 L40,50 L55,45 L70,50 L85,60 L75,75 L60,80 L45,75 L30,70 L25,60 M55,45 L50,55 L60,60',
    scorpius: 'M20,50 L35,45 L50,50 L65,45 L75,55 L70,70 L55,80 L40,85 L30,75 L35,60',
    lyra: 'M50,25 L60,50 L50,65 L40,50 L50,25 M60,50 L75,55 M40,50 L25,55 M50,65 L50,85',
  };

  return (
    <path
      d={paths[id] || paths.orion}
      fill="none"
      stroke="var(--comet)"
      strokeWidth="0.8"
      strokeOpacity="0.4"
      strokeLinecap="round"
    />
  );
}

function ConstellationStars({ id }) {
  const starSets = {
    orion: [[30, 40], [50, 60], [70, 50], [90, 35], [50, 85], [42, 70], [58, 70], [70, 80], [80, 95]],
    ursa: [[25, 45], [40, 40], [55, 48], [70, 42], [80, 55], [70, 75], [55, 72], [40, 60]],
    cassiopeia: [[20, 60], [35, 40], [50, 55], [65, 35], [80, 55], [95, 45]],
    leo: [[25, 60], [40, 50], [55, 45], [70, 50], [85, 60], [75, 75], [60, 80], [45, 75], [30, 70]],
    scorpius: [[20, 50], [35, 45], [50, 50], [65, 45], [75, 55], [70, 70], [55, 80], [40, 85], [30, 75]],
    lyra: [[50, 25], [60, 50], [50, 65], [40, 50], [75, 55], [25, 55], [50, 85]],
  };

  const stars = starSets[id] || starSets.orion;

  return stars.map(([cx, cy], i) => {
    const r = i === 2 ? 3 : 1.5 + Math.random() * 1.5;
    return (
      <g key={i}>
        <circle cx={cx} cy={cy} r={r * 2.5} fill="var(--moonwhite)" opacity="0.15" />
        <circle cx={cx} cy={cy} r={r} fill="var(--moonwhite)">
          <animate attributeName="opacity" values="1;0.6;1" dur={`${2 + i * 0.3}s`} repeatCount="indefinite" />
        </circle>
      </g>
    );
  });
}

  <script type="text/babel">
/* =====================================================================
   口袋天文台 · 主应用 (app.jsx)

const { useState: useStateA, useEffect: useEffectA, useRef: useRefA } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#FF7A1A",
  "palette": ["#0D0F14", "#F2EFE6", "#FF7A1A"],

  "showSignature": true

  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [activeTab, setActiveTab] = useStateA('tonight');
  const [activeSub, setActiveSub] = useStateA(null); // 'design' | 'api' | null
  const [menuOpen, setMenuOpen] = useStateA(false);
  const [screenTransition, setScreenTransition] = useStateA(false);
  const transitionTimeoutRef = useRefA(null);

  // 页面切换过渡
  const handleTabChange = (tab) => {
    if (tab === activeTab) return;
    setScreenTransition(true);

    if (transitionTimeoutRef.current) {
      clearTimeout(transitionTimeoutRef.current);
      transitionTimeoutRef.current = null;
    }

    transitionTimeoutRef.current = setTimeout(() => {
      setActiveTab(tab);
      setActiveSub(null);
      setScreenTransition(false);
    }, 200);
  };

  const handleSubNavigate = (sub) => {
    setScreenTransition(true);
    if (transitionTimeoutRef.current) {
      clearTimeout(transitionTimeoutRef.current);
      transitionTimeoutRef.current = null;
    }
    transitionTimeoutRef.current = setTimeout(() => {
      setActiveSub(sub);
      setScreenTransition(false);
    }, 200);
  };

  const handleBack = () => {
    setScreenTransition(true);
    if (transitionTimeoutRef.current) {
      clearTimeout(transitionTimeoutRef.current);
      transitionTimeoutRef.current = null;
    }
    transitionTimeoutRef.current = setTimeout(() => {
      setActiveSub(null);
      setScreenTransition(false);
    }, 200);
  };

  useEffectA(() => {
    // 宣告可升级
    const announce = () => {
      window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    };
    announce();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announce, { once: true });
    }

    return () => {
      if (transitionTimeoutRef.current) {
        clearTimeout(transitionTimeoutRef.current);
        transitionTimeoutRef.current = null;
      }
    };
  }, []);

  // CSS 变量注入（根据 tweak）
  useEffectA(() => {
    document.documentElement.style.setProperty('--comet', t.accentColor);
    document.documentElement.style.setProperty('--comet-glow', t.accentColor + '55');
  }, [t.accentColor]);

  const renderScreen = () => {
    if (activeSub === 'design') {
      return <DesignSystemScreen onBack={handleBack} />;
    }
    if (activeSub === 'api') {
      return <ApiDocsScreen onBack={handleBack} />;
    }

    switch (activeTab) {
      case 'tonight':
        return <TonightScreen onNavigate={handleTabChange} />;
      case 'constellations':
        return <ConstellationsScreen />;
      case 'planets':
        return <PlanetsScreen />;
      case 'log':
        return <LogScreen />;
      default:
        return <TonightScreen onNavigate={handleTabChange} />;
    }
  };

  return (
    <>
      <GlobalKeyframes />
      <CustomCursor />

      <div className="stage">
        {/* 侧菜单 */}

          <div

                position: 'absolute',

              </div>

              {/* 菜单项 */}

                ].map((item) => (
                  <div
                    key={item.key}
                    className="interactive"
                    onClick={() => {
                      handleSubNavigate(item.key);
                      setMenuOpen(false);
                    }}
                    style={{
                      display: 'flex', alignItems: 'center', gap: 12,
                      padding: '12px 14px',
                      borderRadius: 10,
                      transition: 'all 0.25s ease',
                    }}
                    onMouseEnter={(e) => {
                      e.currentTarget.style.background = 'rgba(255, 122, 26, 0.08)';
                    }}
                    onMouseLeave={(e) => {
                      e.currentTarget.style.background = 'transparent';
                    }}
                  >
                    <div style={{
                      width: 28, height: 28, borderRadius: 8,
                      background: 'rgba(255, 122, 26, 0.12)',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                    }}>
                      {item.icon === 'design' && (
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--comet)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                          <circle cx="13.5" cy="6.5" r=".5" />
                          <circle cx="17.5" cy="10.5" r=".5" />
                          <circle cx="8.5" cy="7.5" r=".5" />
                          <circle cx="6.5" cy="12.5" r=".5" />
                          <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z" />
                        </svg>
                      )}
                      {item.icon === 'code' && (
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--comet)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                          <polyline points="16 18 22 12 16 6" />
                          <polyline points="8 6 2 12 8 18" />
                        </svg>
                      )}
                    </div>
                    <span style={{ fontSize: 14, color: 'var(--moonwhite)' }}>{item.label}</span>
                  </div>
                ))}
              </div>

              <div style={{ position: 'absolute', bottom: 24, left: 24, right: 24 }}>
                <div style={{
                  padding: 14, borderRadius: 12,
                  background: 'rgba(255, 122, 26, 0.06)',
                  border: '1px solid rgba(255, 122, 26, 0.15)',

                  <div style={{ fontSize: 11, color: 'var(--comet)', fontWeight: 500, marginBottom: 4 }}>v2.0.0</div>
                  <div style={{ fontSize: 10, color: 'var(--moonwhite-faint)', lineHeight: 1.5 }}>
                    星图数据更新于 08.16<br />
                    88 星座 · 7,832 天体
                  </div>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* 设备外壳 */}
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16 }}>
          <IOSDevice dark width={390} height={844}>
            <div style={{
              position: 'relative',
              width: '100%',
              height: '100%',
              overflow: 'hidden',
              background: 'var(--midnight)',

                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="18" x2="21" y2="18" />

              {/* 屏幕内容 */}
              <div

                  position: 'absolute', inset: 0,

              {/* 底部导航 */}

          {/* 设备下方品牌 */}
          <div style={{ textAlign: 'center', marginTop: 4 }}>

              V2 · MOBILE APP UI

          </div>
        </div>

        {/* 侧边说明 */}
        <div style={{
          position: 'fixed',
          right: 24,
          top: '50%',
          transform: 'translateY(-50%)',
          display: 'flex',
          flexDirection: 'column',
          gap: 12,
          alignItems: 'flex-end',
        }}>
          <div style={{
            padding: '12px 16px',
            borderRadius: 12,

            <div style={{ fontSize: 10, color: 'var(--comet)', fontWeight: 600, letterSpacing: '0.1em', marginBottom: 6 }}>

              口袋天文台
            </div>
            <div style={{ fontSize: 11, color: 'var(--moonwhite-faint)', lineHeight: 1.6 }}>
              星空观测 App<br />
              4 大主页面 · 13 项组件动效<br />

          <div style={{
            padding: '10px 14px',

            background: 'rgba(13, 15, 20, 0.6)',

          }}>

      </div>

      {/* Tweaks Panel */}

        <TweakToggle

        @keyframes slide-in-left {
          from { transform: translateX(-100%); }
          to { transform: translateX(0); }
        }
      `}</style>
    </>
  );
}

</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>飞盘约战局 · 微信小程序</title>
<style>
  /* ===== Reset & Base ===== */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;background:#1a1a1a;color:#2B2B2B;user-select:none;-webkit-user-select:none}
  button{border:none;background:none;cursor:pointer;font-family:inherit;color:inherit}
  img{display:block;max-width:100%}
  ul,ol{list-style:none}
  a{text-decoration:none;color:inherit}

  /* ===== Design Tokens ===== */
  :root{
    --lawn:#2E7D32;
    --lawn-2:#3B7A2E;
    --lawn-light:#66BB6A;
    --sunset:#E8762C;
    --sunset-2:#F08A3C;
    --cream:#FAF6EE;
    --cream-2:#F3EDE0;
    --charcoal:#2B2B2B;
    --charcoal-2:#4A4A4A;
    --charcoal-3:#8A8A8A;
    --charcoal-4:#BEBEBE;
    --yellow:#FFD23F;
    --white:#FFFFFF;
    --shadow-sm:0 2px 8px rgba(43,43,43,.06);
    --shadow-md:0 8px 24px rgba(43,43,43,.10);
    --shadow-lg:0 16px 48px rgba(43,43,43,.16);
    --radius-xs:6px;
    --radius-sm:10px;
    --radius-md:16px;
    --radius-lg:22px;
    --radius-xl:28px;
  }

  /* ===== Stage Background ===== */
  .stage{
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(46,125,50,.12), transparent 60%),
      radial-gradient(ellipse at 80% 70%, rgba(232,118,44,.10), transparent 60%),
      linear-gradient(135deg, #1e1e1e 0%, #2a2a2a 100%);
    position:relative;
    overflow:hidden;
  }
  .stage-title{
    position:absolute;top:32px;left:0;right:0;text-align:center;
    color:#fff;font-size:14px;letter-spacing:2px;font-weight:300;opacity:.6;
  }

  /* ===== Phone Frame ===== */
  .phone{
    position:relative;
    width:375px;height:780px;
    border-radius:48px;
    background:#0a0a0a;
    padding:10px;
    box-shadow:
      0 30px 80px rgba(0,0,0,.5),
      0 10px 30px rgba(0,0,0,.3),
      inset 0 0 0 1px rgba(255,255,255,.06);
    z-index:10;
  }
  .phone-screen{
    position:relative;
    width:100%;height:100%;
    border-radius:38px;
    background:var(--cream);
    overflow:hidden;
    position:relative;
  }
  /* Notch */
  .phone-notch{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    width:120px;height:28px;background:#0a0a0a;border-radius:18px;
    z-index:200;
  }

  /* ===== Status Bar ===== */
  .status-bar{
    position:absolute;top:0;left:0;right:0;
    height:44px;display:flex;align-items:center;justify-content:space-between;
    padding:0 28px;padding-top:2px;
    font-size:14px;font-weight:600;color:var(--charcoal);
    z-index:100;
    pointer-events:none;
  }
  .status-bar.dark{color:#fff}
  .status-right{display:flex;align-items:center;gap:5px}
  .status-icon{width:16px;height:16px;display:flex;align-items:center;justify-content:center}

  /* ===== Navigation Bar (WeChat Mini Program Capsule) ===== */
  .nav-bar{
    position:absolute;top:44px;left:0;right:0;
    height:44px;
    display:flex;align-items:center;justify-content:space-between;
    z-index:90;
    padding:0 16px;
    transition:background .3s ease, box-shadow .3s ease;
  }
  .nav-bar.title-centered{justify-content:center}
  .nav-title{
    font-size:17px;font-weight:600;color:var(--charcoal);
    flex:1;text-align:center;
    position:absolute;left:0;right:0;
    pointer-events:none;
    opacity:0;transition:opacity .3s ease;
  }
  .nav-title.visible{opacity:1}
  .nav-bar.dark .nav-title{color:#fff}

  /* Capsule button — WeChat mini-program style */
  .nav-capsule{
    position:relative;
    display:flex;align-items:center;
    height:32px;
    background:rgba(255,255,255,.7);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-radius:16px;
    padding:0 2px;
    margin-left:auto;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    border:1px solid rgba(0,0,0,.06);
  }
  .nav-capsule.dark{background:rgba(43,43,43,.7);border-color:rgba(255,255,255,.1)}
  .capsule-btn{
    width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    color:var(--charcoal);
    opacity:.8;
  }
  .nav-capsule.dark .capsule-btn{color:#fff}
  .capsule-divider{width:1px;height:16px;background:rgba(43,43,43,.15)}
  .nav-capsule.dark .capsule-divider{background:rgba(255,255,255,.2)}
  .capsule-btn svg{width:18px;height:18px}

  /* Nav back button */
  .nav-back{
    width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    background:rgba(255,255,255,.7);
    backdrop-filter:blur(20px);
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    color:var(--charcoal);
    z-index:5;
  }
  .nav-back.dark{background:rgba(43,43,43,.6);color:#fff}

  /* ===== Tab Bar ===== */
  .tab-bar{
    position:absolute;bottom:0;left:0;right:0;
    height:72px;
    background:rgba(250,246,238,.95);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-top:1px solid rgba(43,43,43,.06);
    display:flex;align-items:flex-start;justify-content:space-around;
    padding-top:8px;padding-bottom:20px;
    z-index:80;
  }
  .tab-item{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:2px 12px;
    color:var(--charcoal-3);
    font-size:10px;
    position:relative;
    cursor:pointer;
    transition:color .25s ease;
    flex:1;
  }
  .tab-item svg{width:24px;height:24px;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
  .tab-item.active{color:var(--lawn)}
  .tab-item.active svg{transform:translateY(-2px) scale(1.08)}
  .tab-dot{
    position:absolute;bottom:4px;
    width:4px;height:4px;border-radius:50%;
    background:var(--sunset);
    transform:scale(0);
    transition:transform .35s cubic-bezier(.34,1.56,.64,1);
  }
  .tab-item.active .tab-dot{transform:scale(1)}

  /* ===== Page System ===== */
  .page-container{
    position:absolute;top:0;left:0;right:0;bottom:0;
    overflow:hidden;
    background:var(--cream);
  }
  .page{
    position:absolute;top:0;left:0;right:0;bottom:0;
    overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    background:var(--cream);
    will-change:transform;
    pointer-events:none;
  }
  .page.active{pointer-events:auto}
  .page::before{
    content:'';
    position:absolute;top:0;left:0;right:0;
    height:88px;
    pointer-events:none;
    z-index:5;
  }
  .page::-webkit-scrollbar{display:none}

  /* Page transitions */
  @keyframes pushIn{
    from{transform:translateX(100%)}
    to{transform:translateX(0)}
  }
  @keyframes pushOut{
    from{transform:translateX(0)}
    to{transform:translateX(-25%)}
  }
  @keyframes popIn{
    from{transform:translateX(-25%)}
    to{transform:translateX(0)}
  }
  @keyframes popOut{
    from{transform:translateX(0)}
    to{transform:translateX(100%)}
  }
  .page.push-enter{animation:pushIn .35s cubic-bezier(.4,0,.2,1) forwards;pointer-events:auto}
  .page.push-leave{animation:pushOut .35s cubic-bezier(.4,0,.2,1) forwards}
  .page.pop-enter{animation:popIn .35s cubic-bezier(.4,0,.2,1) forwards;pointer-events:auto}
  .page.pop-leave{animation:popOut .35s cubic-bezier(.4,0,.2,1) forwards}

  /* ===== Shared Page Elements ===== */
  .page-content{padding-bottom:100px}
  .has-tabbar .page-content{padding-bottom:120px}

  /* ===== Home Page ===== */
  .home-wrap{min-height:100%}
  /* Hero */
  .home-hero{
    position:relative;
    height:320px;
    background:linear-gradient(180deg, var(--lawn) 0%, var(--lawn-2) 60%, var(--cream) 100%);
    padding-top:88px;
    overflow:hidden;
  }
  .hero-pattern{
    position:absolute;inset:0;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,.1) 0%, transparent 40%),
      radial-gradient(circle at 80% 60%, rgba(255,210,63,.15) 0%, transparent 40%);
  }
  .hero-greeting{
    padding:0 20px;
    color:#fff;
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:16px;
  }
  .hero-greeting-text h2{font-size:22px;font-weight:700;margin-bottom:4px;letter-spacing:.5px}
  .hero-greeting-text p{font-size:12px;opacity:.75;font-weight:400}
  .hero-avatar{
    width:44px;height:44px;border-radius:50%;
    background:linear-gradient(135deg, var(--yellow), var(--sunset));
    border:2px solid rgba(255,255,255,.3);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:700;color:var(--charcoal);
  }
  /* Hero featured game card */
  .hero-card{
    margin:0 16px;
    background:var(--cream);
    border-radius:var(--radius-lg);
    padding:16px;
    box-shadow:var(--shadow-lg);
    position:relative;
    overflow:hidden;
    transform:translateY(0);
  }
  .hero-card-badge{
    display:inline-flex;align-items:center;gap:4px;
    padding:3px 10px;
    background:linear-gradient(135deg, var(--sunset), var(--sunset-2));
    color:#fff;
    font-size:11px;font-weight:600;
    border-radius:20px;
    margin-bottom:10px;
  }
  .hero-card-title{
    font-size:17px;font-weight:700;color:var(--charcoal);
    margin-bottom:8px;line-height:1.3;
  }
  .hero-card-meta{
    display:flex;align-items:center;gap:12px;
    margin-bottom:12px;
    flex-wrap:wrap;
  }
  .hero-card-meta-item{
    display:flex;align-items:center;gap:4px;
    font-size:12px;color:var(--charcoal-2);
  }
  .hero-card-meta-item svg{width:14px;height:14px;color:var(--lawn)}
  .hero-card-bottom{
    display:flex;align-items:center;justify-content:space-between;
    padding-top:10px;
    border-top:1px solid rgba(43,43,43,.06);
  }
  .hero-card-avatars{display:flex;align-items:center}
  .hero-card-avatars .avatar{
    width:26px;height:26px;border-radius:50%;
    border:2px solid var(--cream);
    margin-left:-6px;
    background:linear-gradient(135deg,var(--lawn-light),var(--lawn));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:9px;font-weight:600;
  }
  .hero-card-avatars .avatar:first-child{margin-left:0}
  .hero-card-avatars .more{
    width:26px;height:26px;border-radius:50%;
    background:var(--cream-2);color:var(--charcoal-3);
    display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:500;margin-left:-6px;
    border:2px solid var(--cream);
  }
  .hero-card-btn{
    padding:7px 16px;
    background:var(--lawn);
    color:#fff;
    border-radius:20px;
    font-size:12px;font-weight:600;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .hero-card-btn:active{transform:scale(.95)}

  /* Pull to refresh indicator */
  .pull-indicator{
    position:absolute;top:88px;left:0;right:0;
    height:0;overflow:hidden;
    display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:8px;
    z-index:1;
    transition:height .2s ease;
  }
  .pull-indicator-content{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    color:var(--lawn);
    font-size:11px;
  }
  .pull-frisbee{
    width:24px;height:24px;
    animation:spin 1.5s linear infinite;
  }
  @keyframes spin{
    from{transform:rotate(0)}
    to{transform:rotate(360deg)}
  }

  /* Section titles */
  .section-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 20px 12px;
  }
  .section-head h3{
    font-size:16px;font-weight:700;color:var(--charcoal);
    display:flex;align-items:center;gap:8px;
  }
  .section-head h3::before{
    content:'';
    width:4px;height:16px;border-radius:2px;
    background:var(--sunset);
  }
  .section-head .more-btn{
    font-size:12px;color:var(--charcoal-3);
    display:flex;align-items:center;gap:2px;
  }

  /* Game cards (masonry/stacked) */
  .game-list{padding:0 16px;display:flex;flex-direction:column;gap:12px}
  .game-card{
    background:#fff;
    border-radius:var(--radius-md);
    padding:14px;
    box-shadow:var(--shadow-sm);
    display:flex;gap:12px;
    position:relative;
    cursor:pointer;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .game-card:active{transform:scale(.98)}
  .game-card-img{
    width:80px;height:80px;
    border-radius:var(--radius-sm);
    flex-shrink:0;
    background:linear-gradient(135deg, var(--lawn-light), var(--lawn-2));
    position:relative;
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .game-card-img.orange{background:linear-gradient(135deg, var(--sunset-2), var(--sunset))}
  .game-card-img.yellow{background:linear-gradient(135deg, var(--yellow), var(--sunset-2))}
  .game-card-img svg{width:36px;height:36px;color:#fff;opacity:.9}
  .game-card-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
  .game-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .game-card-name{
    font-size:15px;font-weight:600;color:var(--charcoal);
    line-height:1.3;margin-bottom:4px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .game-card-tag{
    padding:2px 8px;border-radius:10px;
    font-size:10px;font-weight:500;
    background:rgba(46,125,50,.1);
    color:var(--lawn);
    flex-shrink:0;
  }
  .game-card-tag.orange{background:rgba(232,118,44,.12);color:var(--sunset)}
  .game-card-tag.yellow{background:rgba(255,210,63,.3);color:#B8860B}
  .game-card-desc{
    font-size:12px;color:var(--charcoal-3);
    margin-bottom:8px;
    line-height:1.4;
    display:flex;align-items:center;gap:6px;
  }
  .game-card-desc svg{width:12px;height:12px;flex-shrink:0}
  .game-card-bottom{display:flex;align-items:center;justify-content:space-between}
  .game-card-people{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--charcoal-2)}
  .game-card-people svg{width:12px;height:12px;color:var(--lawn)}
  .game-card-price{font-size:13px;font-weight:700;color:var(--sunset)}
  .game-card-price small{font-size:10px;font-weight:400;color:var(--charcoal-3)}

  /* Quick entry icons */
  .quick-entry{
    display:grid;grid-template-columns:repeat(4,1fr);
    padding:20px 20px 8px;
    gap:12px;
  }
  .quick-item{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    cursor:pointer;
  }
  .quick-icon{
    width:48px;height:48px;border-radius:16px;
    background:var(--cream-2);
    display:flex;align-items:center;justify-content:center;
    transition:transform .25s ease;
  }
  .quick-item:active .quick-icon{transform:scale(.9)}
  .quick-icon svg{width:22px;height:22px;color:var(--lawn)}
  .quick-icon.orange{background:rgba(232,118,44,.12)}
  .quick-icon.orange svg{color:var(--sunset)}
  .quick-icon.yellow{background:rgba(255,210,63,.25)}
  .quick-icon.yellow svg{color:#B8860B}
  .quick-icon.charcoal{background:rgba(43,43,43,.08)}
  .quick-icon.charcoal svg{color:var(--charcoal)}
  .quick-label{font-size:11px;color:var(--charcoal-2)}

  /* Floating action button */
  .fab{
    position:absolute;bottom:90px;right:16px;
    width:56px;height:56px;border-radius:28px;
    background:linear-gradient(135deg, var(--sunset), var(--sunset-2));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 24px rgba(232,118,44,.4);
    z-index:60;
    cursor:pointer;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease;
    animation:fabPulse 3s ease-in-out infinite;
  }
  .fab:active{transform:scale(.92)}
  .fab svg{width:24px;height:24px;color:#fff}
  @keyframes fabPulse{
    0%,100%{box-shadow:0 8px 24px rgba(232,118,44,.4)}
    50%{box-shadow:0 8px 24px rgba(232,118,44,.4), 0 0 0 8px rgba(232,118,44,.15)}
  }

  /* ===== Discover / Venues Page ===== */
  .discover-wrap{padding-top:88px;min-height:100%}
  .discover-header{
    padding:0 20px 16px;
  }
  .discover-header h1{
    font-size:24px;font-weight:800;color:var(--charcoal);
    margin-bottom:4px;
  }
  .discover-header p{font-size:13px;color:var(--charcoal-3)}
  .search-bar{
    margin-top:14px;
    display:flex;align-items:center;gap:8px;
    padding:10px 14px;
    background:#fff;
    border-radius:12px;
    box-shadow:var(--shadow-sm);
  }
  .search-bar svg{width:16px;height:16px;color:var(--charcoal-3);flex-shrink:0}
  .search-bar input{
    flex:1;border:none;outline:none;background:transparent;
    font-size:13px;color:var(--charcoal);
    font-family:inherit;
  }
  .search-bar input::placeholder{color:var(--charcoal-4)}

  /* Sticky tabs */
  .sticky-tabs{
    position:sticky;top:88px;
    z-index:50;
    background:var(--cream);
    padding:0 20px;
    border-bottom:1px solid rgba(43,43,43,.05);
  }
  .sticky-tabs-inner{
    display:flex;gap:20px;
    padding:12px 0;
    position:relative;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .sticky-tabs-inner::-webkit-scrollbar{display:none}
  .sticky-tab{
    font-size:14px;font-weight:500;
    color:var(--charcoal-3);
    white-space:nowrap;
    padding-bottom:6px;
    position:relative;
    cursor:pointer;
    transition:color .25s ease;
    flex-shrink:0;
  }
  .sticky-tab.active{
    color:var(--charcoal);
    font-weight:700;
  }
  .sticky-tab-underline{
    position:absolute;bottom:0;left:0;
    height:3px;width:24px;
    background:var(--sunset);
    border-radius:2px;
    transition:transform .3s cubic-bezier(.4,0,.2,1), width .3s ease;
  }

  /* Venue grid — mosaic */
  .venue-grid{
    padding:16px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    grid-auto-rows:min-content;
    grid-auto-flow:dense;
  }
  .venue-card{
    border-radius:var(--radius-md);
    overflow:hidden;
    background:#fff;
    box-shadow:var(--shadow-sm);
    cursor:pointer;
    position:relative;
    transition:transform .25s ease;
  }
  .venue-card:active{transform:scale(.97)}
  .venue-card.tall{grid-row:span 2}
  .venue-card.wide{grid-column:span 2}
  .venue-img{
    width:100%;
    aspect-ratio:1;
    position:relative;
    overflow:hidden;
  }
  .venue-card.tall .venue-img{aspect-ratio:1/1.35}
  .venue-card.wide .venue-img{aspect-ratio:2.1/1}
  .venue-img.lawn{background:linear-gradient(135deg,#81C784 0%,#2E7D32 100%)}
  .venue-img.sunset{background:linear-gradient(135deg,#FFCC80 0%,#E8762C 100%)}
  .venue-img.night{background:linear-gradient(135deg,#607D8B 0%,#263238 100%)}
  .venue-img.indoor{background:linear-gradient(135deg,#A5D6A7 0%,#558B2F 100%)}
  .venue-img.beach{background:linear-gradient(135deg,#FFE082 0%,#FF8A65 100%)}
  .venue-img-icon{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    color:#fff;opacity:.9;
  }
  .venue-img-icon svg{width:40px;height:40px}
  .venue-overlay{
    position:absolute;top:8px;right:8px;
    padding:3px 8px;
    background:rgba(0,0,0,.35);
    backdrop-filter:blur(8px);
    color:#fff;
    border-radius:10px;
    font-size:10px;font-weight:500;
  }
  .venue-info{padding:10px 12px 12px}
  .venue-name{
    font-size:13px;font-weight:600;color:var(--charcoal);
    margin-bottom:4px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .venue-meta{
    display:flex;align-items:center;justify-content:space-between;
    font-size:10px;color:var(--charcoal-3);
  }
  .venue-meta svg{width:10px;height:10px;color:var(--sunset)}
  .venue-rating{display:flex;align-items:center;gap:2px;color:var(--sunset);font-weight:600;font-size:11px}

  /* ===== Game Detail Page ===== */
  .detail-hero{
    position:relative;
    height:300px;
    background:linear-gradient(135deg, #2E7D32 0%, #1B5E20 100%);
    overflow:hidden;
  }
  .detail-hero-bg{
    position:absolute;inset:0;
    opacity:.3;
    background:
      radial-gradient(circle at 30% 40%, rgba(255,210,63,.4), transparent 50%),
      radial-gradient(circle at 70% 70%, rgba(232,118,44,.3), transparent 50%);
  }
  .detail-hero-pattern{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    opacity:.15;
  }
  .detail-hero-pattern .frisbee-svg{width:200px;height:200px;color:#fff;animation:spin 20s linear infinite}
  .detail-hero-content{
    position:absolute;bottom:0;left:0;right:0;
    padding:20px;
    color:#fff;
    background:linear-gradient(180deg, transparent, rgba(0,0,0,.5));
  }
  .detail-badge-row{display:flex;gap:6px;margin-bottom:10px}
  .detail-badge{
    padding:3px 10px;
    background:rgba(255,255,255,.2);
    backdrop-filter:blur(10px);
    border-radius:20px;
    font-size:11px;font-weight:500;
    border:1px solid rgba(255,255,255,.15);
  }
  .detail-title{
    font-size:22px;font-weight:700;
    margin-bottom:6px;line-height:1.3;
  }
  .detail-sub{
    font-size:13px;opacity:.85;
    display:flex;align-items:center;gap:6px;
  }
  .detail-sub svg{width:14px;height:14px}

  /* Detail info section */
  .detail-info{
    background:var(--cream);
    border-radius:24px 24px 0 0;
    margin-top:-20px;
    position:relative;
    padding:20px;
    z-index:2;
  }
  .detail-info-row{
    display:flex;align-items:center;gap:12px;
    padding:14px 0;
    border-bottom:1px solid rgba(43,43,43,.06);
  }
  .detail-info-row:last-child{border-bottom:none}
  .detail-info-icon{
    width:40px;height:40px;border-radius:12px;
    background:rgba(46,125,50,.1);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .detail-info-icon svg{width:20px;height:20px;color:var(--lawn)}
  .detail-info-icon.orange{background:rgba(232,118,44,.12)}
  .detail-info-icon.orange svg{color:var(--sunset)}
  .detail-info-icon.yellow{background:rgba(255,210,63,.25)}
  .detail-info-icon.yellow svg{color:#B8860B}
  .detail-info-text{flex:1}
  .detail-info-label{font-size:11px;color:var(--charcoal-3);margin-bottom:2px}
  .detail-info-value{font-size:14px;font-weight:600;color:var(--charcoal)}
  .detail-info-arrow{color:var(--charcoal-4)}

  /* Section with title */
  .detail-section{padding:8px 20px 20px}
  .detail-section-title{
    font-size:16px;font-weight:700;color:var(--charcoal);
    margin-bottom:12px;
    display:flex;align-items:center;gap:8px;
  }
  .detail-section-title::before{
    content:'';
    width:4px;height:16px;border-radius:2px;
    background:var(--sunset);
  }

  /* Participants */
  .participant-list{display:flex;flex-wrap:wrap;gap:12px}
  .participant{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    width:56px;
  }
  .participant-avatar{
    width:48px;height:48px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:14px;font-weight:700;
    border:2px solid #fff;
    box-shadow:var(--shadow-sm);
  }
  .participant-name{font-size:10px;color:var(--charcoal-2);text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .participant.add .participant-avatar{
    background:var(--cream-2);
    color:var(--charcoal-3);
    border:1px dashed var(--charcoal-4);
  }

  /* Bottom bar */
  .bottom-bar{
    position:absolute;bottom:0;left:0;right:0;
    height:80px;
    background:#fff;
    border-top:1px solid rgba(43,43,43,.06);
    display:flex;align-items:center;gap:12px;
    padding:0 16px 20px;
    z-index:70;
  }
  .bottom-bar-icon{
    width:44px;height:44px;border-radius:22px;
    background:var(--cream-2);
    display:flex;align-items:center;justify-content:center;
    color:var(--charcoal-2);
    cursor:pointer;
    transition:transform .2s ease;
  }
  .bottom-bar-icon:active{transform:scale(.9)}
  .bottom-bar-icon svg{width:20px;height:20px}
  .bottom-bar-btn{
    flex:1;height:44px;
    background:linear-gradient(135deg, var(--sunset), var(--sunset-2));
    color:#fff;
    border-radius:22px;
    font-size:15px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:6px;
    box-shadow:0 6px 16px rgba(232,118,44,.35);
    cursor:pointer;
    transition:transform .2s ease;
  }
  .bottom-bar-btn:active{transform:scale(.98)}

  /* Action Sheet */
  .sheet-mask{
    position:absolute;inset:0;
    background:rgba(0,0,0,.4);
    z-index:95;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
  }
  .sheet-mask.visible{opacity:1;pointer-events:auto}
  .action-sheet{
    position:absolute;bottom:0;left:0;right:0;
    background:var(--cream);
    border-radius:20px 20px 0 0;
    padding:16px 16px 32px;
    z-index:96;
    transform:translateY(100%);
    transition:transform .35s cubic-bezier(.4,0,.2,1);
    max-height:70%;
    overflow-y:auto;
  }
  .action-sheet.visible{transform:translateY(0)}
  .sheet-handle{
    width:36px;height:4px;border-radius:2px;
    background:var(--charcoal-4);
    margin:0 auto 16px;
  }
  .sheet-title{
    font-size:16px;font-weight:700;color:var(--charcoal);
    text-align:center;margin-bottom:16px;
  }
  .sheet-option{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;
    background:#fff;
    border-radius:var(--radius-sm);
    margin-bottom:8px;
    cursor:pointer;
    transition:background .2s ease;
  }
  .sheet-option:active{background:var(--cream-2)}
  .sheet-option.active{background:rgba(46,125,50,.08);color:var(--lawn)}
  .sheet-option-name{font-size:14px;font-weight:500}
  .sheet-option-check svg{width:18px;height:18px}
  .sheet-cancel{
    margin-top:8px;
    padding:14px;
    background:#fff;
    border-radius:var(--radius-sm);
    text-align:center;
    font-size:15px;font-weight:500;
    color:var(--charcoal-3);
    cursor:pointer;
  }

  /* ===== Publish Page ===== */
  .publish-wrap{padding-top:88px;min-height:100%}
  .publish-form{
    padding:0 16px 20px;
  }
  .form-section{
    background:#fff;
    border-radius:var(--radius-md);
    padding:4px 16px;
    margin-bottom:12px;
    box-shadow:var(--shadow-sm);
  }
  .form-row{
    display:flex;align-items:center;gap:12px;
    padding:14px 0;
    border-bottom:1px solid rgba(43,43,43,.05);
  }
  .form-row:last-child{border-bottom:none}
  .form-label{
    width:72px;
    font-size:14px;color:var(--charcoal);
    font-weight:500;
    flex-shrink:0;
  }
  .form-input-wrap{
    flex:1;
    display:flex;align-items:center;justify-content:flex-end;
    gap:8px;
  }
  .form-input{
    flex:1;border:none;outline:none;background:transparent;
    font-size:14px;color:var(--charcoal);
    text-align:right;
    font-family:inherit;
  }
  .form-input::placeholder{color:var(--charcoal-4)}
  .form-select{
    color:var(--charcoal-3);
    font-size:14px;
    display:flex;align-items:center;gap:4px;
  }
  .form-select svg{width:14px;height:14px}
  .form-value{font-size:14px;color:var(--charcoal)}
  .form-picker-value{color:var(--charcoal)}

  /* Level selector */
  .level-picker{
    display:flex;gap:8px;
  }
  .level-btn{
    padding:6px 14px;
    border-radius:20px;
    background:var(--cream-2);
    font-size:12px;font-weight:500;
    color:var(--charcoal-2);
    transition:all .25s ease;
  }
  .level-btn.active{
    background:var(--lawn);
    color:#fff;
  }

  /* Member list — swipe to delete */
  .member-list-section{
    background:#fff;
    border-radius:var(--radius-md);
    margin-bottom:12px;
    box-shadow:var(--shadow-sm);
    overflow:hidden;
  }
  .member-list-header{
    padding:14px 16px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid rgba(43,43,43,.05);
  }
  .member-list-title{font-size:14px;font-weight:600;color:var(--charcoal)}
  .member-add-btn{
    font-size:12px;color:var(--lawn);
    display:flex;align-items:center;gap:2px;
  }
  .swipe-list{position:relative;overflow:hidden}
  .swipe-item{
    position:relative;
    display:flex;align-items:center;
    padding:12px 16px;
    background:#fff;
    transition:transform .3s cubic-bezier(.4,0,.2,1);
    touch-action:pan-y;
    cursor:grab;
  }
  .swipe-item:active{cursor:grabbing}
  .swipe-item.deleting{transform:translateX(-80px)}
  .swipe-delete{
    position:absolute;top:0;right:0;bottom:0;
    width:80px;
    background:#E53935;
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:500;
  }
  .swipe-avatar{
    width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:12px;font-weight:600;
    margin-right:12px;
    flex-shrink:0;
  }
  .swipe-info{flex:1;min-width:0}
  .swipe-name{font-size:14px;font-weight:500;color:var(--charcoal);margin-bottom:2px}
  .swipe-sub{font-size:11px;color:var(--charcoal-3)}

  /* Form bottom safe area button */
  .form-bottom{
    position:absolute;bottom:0;left:0;right:0;
    padding:12px 16px 28px;
    background:linear-gradient(180deg, transparent, var(--cream) 30%);
    z-index:60;
  }
  .form-submit-btn{
    width:100%;
    height:48px;
    background:linear-gradient(135deg, var(--lawn), var(--lawn-2));
    color:#fff;
    border-radius:24px;
    font-size:16px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(46,125,50,.3);
    cursor:pointer;
    transition:transform .2s ease;
  }
  .form-submit-btn:active{transform:scale(.98)}

  /* ===== Profile Page ===== */
  .profile-header{
    position:relative;
    padding:88px 20px 80px;
    background:linear-gradient(135deg, var(--lawn) 0%, var(--lawn-2) 100%);
    color:#fff;
    overflow:hidden;
  }
  .profile-header-bg{
    position:absolute;inset:0;
    background:
      radial-gradient(circle at 80% 20%, rgba(255,210,63,.2), transparent 40%),
      radial-gradient(circle at 20% 80%, rgba(232,118,44,.15), transparent 40%);
  }
  .profile-top{
    position:relative;
    display:flex;align-items:center;gap:14px;
    margin-bottom:20px;
  }
  .profile-avatar{
    width:64px;height:64px;border-radius:50%;
    background:linear-gradient(135deg, var(--yellow), var(--sunset));
    border:3px solid rgba(255,255,255,.3);
    display:flex;align-items:center;justify-content:center;
    font-size:24px;font-weight:700;color:var(--charcoal);
  }
  .profile-info h2{font-size:20px;font-weight:700;margin-bottom:4px}
  .profile-info p{font-size:12px;opacity:.75;display:flex;align-items:center;gap:4px}
  .profile-info p svg{width:12px;height:12px}
  .profile-edit-btn{
    margin-left:auto;
    padding:6px 12px;
    background:rgba(255,255,255,.2);
    backdrop-filter:blur(10px);
    border-radius:16px;
    font-size:12px;font-weight:500;
    border:1px solid rgba(255,255,255,.2);
    cursor:pointer;
  }

  /* Stats cards */
  .profile-stats{
    position:relative;
    display:flex;gap:10px;
    margin-bottom:-40px;
  }
  .stat-card{
    flex:1;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.2);
    border-radius:var(--radius-md);
    padding:12px 10px;
    text-align:center;
  }
  .stat-num{
    font-size:22px;font-weight:800;
    font-variant-numeric:tabular-nums;
    margin-bottom:2px;
  }
  .stat-label{font-size:11px;opacity:.8;font-weight:400}

  /* Ring progress card (signature) */
  .ring-progress-card{
    margin:0 16px;
    background:#fff;
    border-radius:var(--radius-lg);
    padding:20px;
    box-shadow:var(--shadow-md);
    position:relative;
    top:-30px;
    margin-bottom:-20px;
    z-index:5;
  }
  .ring-card-title{
    font-size:15px;font-weight:700;color:var(--charcoal);
    margin-bottom:16px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .ring-card-title span:last-child{
    font-size:11px;font-weight:400;color:var(--charcoal-3);
  }
  .ring-container{
    display:flex;align-items:center;gap:20px;
  }
  .ring-svg-wrap{
    width:110px;height:110px;
    position:relative;
    flex-shrink:0;
  }
  .ring-svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring-bg{fill:none;stroke:var(--cream-2);stroke-width:10}
  .ring-fill{
    fill:none;
    stroke:url(#ringGradient);
    stroke-width:10;
    stroke-linecap:round;
    stroke-dasharray:314;
    stroke-dashoffset:314;
    transition:stroke-dashoffset 1.5s cubic-bezier(.4,0,.2,1);
  }
  .ring-content{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .ring-value{
    font-size:28px;font-weight:800;color:var(--lawn);
    font-variant-numeric:tabular-nums;
    line-height:1;
  }
  .ring-unit{font-size:11px;color:var(--charcoal-3);margin-top:3px}
  .ring-details{flex:1;display:flex;flex-direction:column;gap:10px}
  .ring-detail-row{
    display:flex;align-items:center;justify-content:space-between;
  }
  .ring-detail-label{
    font-size:12px;color:var(--charcoal-3);
    display:flex;align-items:center;gap:6px;
  }
  .ring-dot{
    width:8px;height:8px;border-radius:50%;
  }
  .ring-dot.lawn{background:var(--lawn)}
  .ring-dot.orange{background:var(--sunset)}
  .ring-dot.yellow{background:var(--yellow)}
  .ring-detail-value{font-size:13px;font-weight:600;color:var(--charcoal);font-variant-numeric:tabular-nums}

  /* Profile menu grid */
  .profile-menu{
    padding:36px 16px 20px;
    display:grid;grid-template-columns:repeat(4,1fr);
    gap:16px;
  }
  .menu-item{
    display:flex;flex-direction:column;align-items:center;gap:8px;
    cursor:pointer;
  }
  .menu-icon{
    width:48px;height:48px;border-radius:16px;
    background:var(--cream-2);
    display:flex;align-items:center;justify-content:center;
    transition:transform .25s ease;
  }
  .menu-item:active .menu-icon{transform:scale(.92)}
  .menu-icon svg{width:22px;height:22px;color:var(--charcoal-2)}
  .menu-icon.lawn{background:rgba(46,125,50,.1)}
  .menu-icon.lawn svg{color:var(--lawn)}
  .menu-icon.orange{background:rgba(232,118,44,.12)}
  .menu-icon.orange svg{color:var(--sunset)}
  .menu-icon.yellow{background:rgba(255,210,63,.25)}
  .menu-icon.yellow svg{color:#B8860B}
  .menu-label{font-size:11px;color:var(--charcoal-2)}

  /* Recent activities */
  .activity-list{
    padding:0 16px;
    display:flex;flex-direction:column;gap:10px;
  }
  .activity-item{
    display:flex;align-items:center;gap:12px;
    padding:12px;
    background:#fff;
    border-radius:var(--radius-sm);
    box-shadow:var(--shadow-sm);
  }
  .activity-icon{
    width:40px;height:40px;border-radius:12px;
    background:rgba(46,125,50,.1);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .activity-icon svg{width:20px;height:20px;color:var(--lawn)}
  .activity-icon.orange{background:rgba(232,118,44,.12)}
  .activity-icon.orange svg{color:var(--sunset)}
  .activity-content{flex:1}
  .activity-text{font-size:13px;color:var(--charcoal);font-weight:500;margin-bottom:2px}
  .activity-time{font-size:10px;color:var(--charcoal-3)}
  .activity-right{font-size:12px;font-weight:600;color:var(--lawn)}
  .activity-right.orange{color:var(--sunset)}

  /* ===== Stats Page ===== */
  .stats-wrap{padding-top:88px;min-height:100%}
  .stats-header{
    padding:0 20px 20px;
    background:linear-gradient(135deg, var(--sunset) 0%, var(--sunset-2) 100%);
    color:#fff;
    position:relative;
    overflow:hidden;
  }
  .stats-header h1{font-size:22px;font-weight:700;margin-bottom:4px}
  .stats-header p{font-size:12px;opacity:.85}

  /* Diagonal split stats */
  .diagonal-section{
    margin:-20px 16px 16px;
    background:#fff;
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-md);
    overflow:hidden;
    position:relative;
  }
  .diagonal-top{
    background:linear-gradient(135deg, var(--lawn) 0%, var(--lawn-2) 100%);
    padding:20px;
    position:relative;
    color:#fff;
  }
  .diagonal-top::after{
    content:'';
    position:absolute;bottom:-1px;left:0;right:0;
    height:40px;
    background:#fff;
    clip-path:polygon(0 100%, 100% 0, 100% 100%);
  }
  .diagonal-title{
    font-size:14px;font-weight:600;
    margin-bottom:12px;
    opacity:.9;
  }
  .diagonal-big{
    font-size:48px;font-weight:800;
    line-height:1;font-variant-numeric:tabular-nums;
    margin-bottom:4px;
    letter-spacing:-2px;
  }
  .diagonal-sub{font-size:12px;opacity:.75}
  .diagonal-bottom{
    padding:24px 20px 20px;
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:12px;
  }
  .diagonal-stat{text-align:center}
  .diagonal-stat-num{
    font-size:20px;font-weight:700;color:var(--charcoal);
    font-variant-numeric:tabular-nums;
  }
  .diagonal-stat-label{font-size:11px;color:var(--charcoal-3);margin-top:2px}

  /* Bar chart */
  .chart-card{
    margin:0 16px 16px;
    background:#fff;
    border-radius:var(--radius-md);
    padding:16px;
    box-shadow:var(--shadow-sm);
  }
  .chart-card-title{
    font-size:14px;font-weight:700;color:var(--charcoal);
    margin-bottom:16px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .chart-period{
    font-size:11px;color:var(--charcoal-3);
    display:flex;gap:8px;
  }
  .chart-period span{
    padding:2px 8px;border-radius:10px;
    cursor:pointer;
  }
  .chart-period span.active{
    background:rgba(46,125,50,.1);
    color:var(--lawn);
    font-weight:600;
  }
  .bar-chart{
    display:flex;align-items:flex-end;
    gap:8px;
    height:140px;
    padding-top:10px;
  }
  .bar-col{
    flex:1;
    display:flex;flex-direction:column;align-items:center;
    gap:6px;
    height:100%;
    justify-content:flex-end;
  }
  .bar{
    width:100%;
    background:linear-gradient(180deg, var(--lawn-light), var(--lawn));
    border-radius:6px 6px 2px 2px;
    position:relative;
    min-height:4px;
    transition:height 1s cubic-bezier(.4,0,.2,1);
  }
  .bar.orange{background:linear-gradient(180deg, var(--sunset-2), var(--sunset))}
  .bar-label{font-size:10px;color:var(--charcoal-3)}
  .bar-value{
    position:absolute;top:-16px;left:50%;transform:translateX(-50%);
    font-size:9px;font-weight:600;color:var(--charcoal-2);
    opacity:0;
    transition:opacity .3s ease;
  }
  .bar-col:hover .bar-value{opacity:1}

  /* Achievement grid */
  .achievement-grid{
    padding:0 16px 20px;
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
  .achievement{
    background:#fff;
    border-radius:var(--radius-md);
    padding:14px 10px;
    text-align:center;
    box-shadow:var(--shadow-sm);
    position:relative;
  }
  .achievement-icon{
    width:40px;height:40px;border-radius:50%;
    background:var(--cream-2);
    margin:0 auto 8px;
    display:flex;align-items:center;justify-content:center;
  }
  .achievement-icon svg{width:20px;height:20px;color:var(--yellow)}
  .achievement-icon.lawn{background:rgba(46,125,50,.12)}
  .achievement-icon.lawn svg{color:var(--lawn)}
  .achievement-icon.orange{background:rgba(232,118,44,.12)}
  .achievement-icon.orange svg{color:var(--sunset)}
  .achievement-name{font-size:11px;color:var(--charcoal);font-weight:500}

  .cursor-ripple{
    position:fixed;
    width:24px;height:24px;
    border:2px solid var(--sunset);

  .delay-3{animation-delay:.15s}

  /* Rotating frisbee (hero entrance) */

  /* Toast */
  .toast{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    padding:12px 20px;
    background:rgba(43,43,43,.85);
    color:#fff;

    font-size:13px;
    z-index:200;

    transition:opacity .3s ease;

  }
  .toast.visible{opacity:1}

  /* Reduce motion */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
    }
  }
</style>

<script>
  // ===== Utility: Animation Frame Manager =====
  const RAF = {
    callbacks: new Map(),
    running: false,
    rafId: null,
    paused: false,

    start() {
      if (this.running) return;
      this.running = true;
      this.loop();
    },

    loop() {
      if (!this.running || this.paused) {
        this.rafId = null;
        return;
      }
      const now = performance.now();
      this.callbacks.forEach(cb => {
        try { cb(now); } catch(e) { console.error(e); }
      });
      this.rafId = requestAnimationFrame(() => this.loop());
    },

    add(key, cb) {
      this.callbacks.set(key, cb);
      if (this.callbacks.size > 0 && !this.paused) this.start();
    },

    remove(key) {
      this.callbacks.delete(key);
      if (this.callbacks.size === 0 && this.rafId) {
        cancelAnimationFrame(this.rafId);
        this.rafId = null;
        this.running = false;
      }
    },

    pause() {
      this.paused = true;
      if (this.rafId) {
        cancelAnimationFrame(this.rafId);
        this.rafId = null;
      }
      this.running = false;
    },

    resume() {
      this.paused = false;
      if (this.callbacks.size > 0) this.start();
    }
  };

  // Visibility change handling
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      RAF.pause();
      timers.forEach((_, key) => clearTimeout(key));
    } else {
      RAF.resume();
    }
  });

  // Timer manager
  const timers = new Set();
  function safeTimeout(fn, ms) {
    const id = setTimeout(() => {
      timers.delete(id);
      fn();
    }, ms);
    timers.add(id);
    return id;
  }
  function clearTimers() {
    timers.forEach(id => clearTimeout(id));
    timers.clear();
  }

  // ===== Custom Cursor =====
  const cursor = document.getElementById('customCursor');
  let cursorX = window.innerWidth / 2;
  let cursorY = window.innerHeight / 2;
  let targetX = cursorX;
  let targetY = cursorY;

  function updateCursor(now) {
    const dx = targetX - cursorX;
    const dy = targetY - cursorY;
    cursorX += dx * 0.2;
    cursorY += dy * 0.2;
    cursor.style.left = cursorX + 'px';
    cursor.style.top = cursorY + 'px';
  }
  RAF.add('cursor', updateCursor);

  document.addEventListener('mousemove', (e) => {
    targetX = e.clientX;
    targetY = e.clientY;
  });

  // Hover detection
  document.addEventListener('mouseover', (e) => {
    const target = e.target.closest('button, .game-card, .venue-card, .tab-item, .quick-item, .menu-item, .participant, .sheet-option, .sticky-tab, .swipe-item, .form-submit-btn, .bottom-bar-btn, .nav-back, .capsule-btn, .fab, .achievement, .level-btn');
    if (target) cursor.classList.add('hover');
  });
  document.addEventListener('mouseout', (e) => {
    const target = e.target.closest('button, .game-card, .venue-card, .tab-item, .quick-item, .menu-item, .participant, .sheet-option, .sticky-tab, .swipe-item, .form-submit-btn, .bottom-bar-btn, .nav-back, .capsule-btn, .fab, .achievement, .level-btn');
    if (target) cursor.classList.remove('hover');
  });

  // Click ripple
  document.addEventListener('click', (e) => {
    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    document.body.appendChild(ripple);
    safeTimeout(() => ripple.remove(), 600);
  });

  // ===== Page Stack System =====
  const pageContainer = document.getElementById('pageContainer');
  const tabBar = document.getElementById('tabBar');
  const statusBar = document.getElementById('statusBar');
  const pageStack = [];
  let currentTab = 'home';
  let isAnimating = false;

  const tabPages = {
    home: 'home',
    discover: 'discover',
    publish: 'publish',
    stats: 'stats',
    profile: 'profile'
  };

  function showTab(tabName) {
    if (isAnimating || currentTab === tabName) return;
    currentTab = tabName;

    // Update tab bar
    document.querySelectorAll('.tab-item').forEach(item => {
      if (item.dataset.tab === tabName) item.classList.add('active');
      else item.classList.remove('active');
    });

    // Clear page stack and show tab page
    pageStack.length = 0;
    renderPage(tabPages[tabName], 'tab');
  }

  function pushPage(pageName, data) {
    if (isAnimating) return;
    isAnimating = true;
    const oldPage = pageContainer.querySelector('.page.active');
    const newPageEl = createPageElement(pageName, data);
    newPageEl.classList.add('push-enter');
    pageContainer.appendChild(newPageEl);

    if (oldPage) {
      oldPage.classList.add('push-leave');
      oldPage.classList.remove('active');
    }

    pageStack.push({ name: pageName, data });

    safeTimeout(() => {
      if (oldPage) {
        oldPage.classList.remove('push-leave');
        oldPage.style.display = 'none';
      }
      newPageEl.classList.remove('push-enter');
      newPageEl.classList.add('active');
      isAnimating = false;
      initPageAnimations(pageName, newPageEl);
    }, 350);

    updateNavForPage(pageName);
  }

  function popPage() {
    if (isAnimating || pageStack.length <= 1) return;
    isAnimating = true;

    const currentPage = pageContainer.querySelector('.page.active');
    const prev = pageStack[pageStack.length - 2];

    // Find or recreate prev page
    let prevPage = pageContainer.querySelectorAll('.page')[pageContainer.querySelectorAll('.page').length - 2];
    if (!prevPage || prevPage === currentPage) {
      prevPage = createPageElement(prev.name, prev.data);
      prevPage.style.display = 'block';
      pageContainer.insertBefore(prevPage, currentPage);
    } else {
      prevPage.style.display = 'block';
    }
    prevPage.classList.add('pop-enter');

    currentPage.classList.add('pop-leave');
    currentPage.classList.remove('active');

    pageStack.pop();

    safeTimeout(() => {
      currentPage.remove();
      prevPage.classList.remove('pop-enter');
      prevPage.classList.add('active');
      isAnimating = false;
      initPageAnimations(prev.name, prevPage);
    }, 350);

    updateNavForPage(prev.name);
  }

  function renderPage(pageName, type) {
    // Clear all existing pages
    pageContainer.innerHTML = '';
    const pageEl = createPageElement(pageName, null);
    pageEl.classList.add('active');
    pageContainer.appendChild(pageEl);
    pageStack.push({ name: pageName, data: null });

    updateNavForPage(pageName);
    safeTimeout(() => initPageAnimations(pageName, pageEl), 50);
  }

  function updateNavForPage(pageName) {
    // Remove existing nav
    const oldNav = document.querySelector('.nav-bar');
    if (oldNav) oldNav.remove();

    const isTabPage = Object.values(tabPages).includes(pageName) && pageStack.length === 1;
    const isDetail = pageName === 'detail';

    const nav = document.createElement('div');
    nav.className = 'nav-bar';
    if (isDetail) nav.classList.add('dark');

    if (!isTabPage) {
      // Back button
      const backBtn = document.createElement('button');
      backBtn.className = 'nav-back' + (isDetail ? ' dark' : '');
      backBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';
      backBtn.addEventListener('click', popPage);
      nav.appendChild(backBtn);
    }

    // Title
    const title = document.createElement('div');
    title.className = 'nav-title';
    const titles = {
      home: '',
      discover: '发现场地',
      publish: '发布约战',
      stats: '战绩数据',
      profile: '个人中心',
      detail: '约战详情',
      spec: '设计规范',
      api: '接口文档'
    };
    title.textContent = titles[pageName] || '';
    if (titles[pageName]) title.classList.add('visible');

      </button>
    `;
    nav.appendChild(capsule);

    document.getElementById('screen').appendChild(nav);

    // Status bar color
    if (isDetail || pageName === 'profile' || pageName === 'stats' || pageName === 'home') {

  function createPageElement(pageName, data) {
    const page = document.createElement('div');
    page.className = 'page';
    page.dataset.page = pageName;

    const isTabPage = Object.values(tabPages).includes(pageName) && pageStack.length === 0;

    const content = document.createElement('div');
    content.className = 'page-content';
    if (isTabPage) content.classList.add('has-tabbar');

    content.innerHTML = getPageHTML(pageName, data);
    page.appendChild(content);

    // Bind events
    bindPageEvents(pageName, page, data);

    return page;
  }

  // ===== Page HTML Templates =====
  function getPageHTML(pageName, data) {
    switch(pageName) {
      case 'home': return getHomeHTML();
      case 'discover': return getDiscoverHTML();
      case 'publish': return getPublishHTML();
      case 'stats': return getStatsHTML();
      case 'profile': return getProfileHTML();
      case 'detail': return getDetailHTML(data);
      case 'spec': return getSpecHTML();
      case 'api': return getApiHTML();
      default: return '';
    }
  }

  // ===== Page Event Binding =====
  function bindPageEvents(pageName, pageEl, data) {
    // Tab bar
    pageEl.querySelectorAll('.tab-item').forEach(item => {
      item.addEventListener('click', () => {
        const tab = item.dataset.tab;
        if (tab && tab !== 'publish') showTab(tab);
        else if (tab === 'publish') {
          showTab('publish');
        }
      });
    });

    // Game cards -> detail
    pageEl.querySelectorAll('.game-card, .hero-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if (e.target.closest('button')) return; // Don't navigate when clicking button
        const gameId = card.dataset.game;
        const titles = {
          '1': '朝阳公园极限飞盘周末局',
          '2': '奥森极限飞盘训练局',
          '3': '腰旗飞盘新手友好局',
          '4': '高校联赛热身对抗赛'
        };
        pushPage('detail', { id: gameId, title: titles[gameId] || '约战详情' });
      });
    });

    // Sticky tabs in discover page
    pageEl.querySelectorAll('.sticky-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const allTabs = pageEl.querySelectorAll('.sticky-tab');
        allTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        // Animate underline
        const underline = pageEl.querySelector('#tabUnderline');
        if (underline) {
          const tabRect = tab.getBoundingClientRect();
          const tabsRect = tab.parentElement.getBoundingClientRect();
          const offsetLeft = tab.offsetLeft;
          underline.style.width = tab.offsetWidth + 'px';
          underline.style.transform = `translateX(${offsetLeft}px)`;
        }
      });
    });

    // Level picker
    pageEl.querySelectorAll('.level-picker .level-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const picker = btn.parentElement;
        picker.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    // Swipe items
    pageEl.querySelectorAll('.swipe-item').forEach(item => {
      let startX = 0;
      let currentX = 0;
      let isDragging = false;

      item.addEventListener('mousedown', (e) => {
        startX = e.clientX;
        isDragging = true;
        item.style.transition = 'none';
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        if (dx > 0) {
          currentX = 0;
        } else if (dx < -80) {
          currentX = -80;
        } else {
          currentX = dx;
        }
        item.style.transform = `translateX(${currentX}px)`;
      });

      document.addEventListener('mouseup', () => {
        if (!isDragging) return;
        isDragging = false;
        item.style.transition = 'transform .3s cubic-bezier(.4,0,.2,1)';
        if (currentX < -40) {
          item.style.transform = 'translateX(-80px)';
        } else {
          item.style.transform = 'translateX(0)';
        }
      });

      // Touch support
      item.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        isDragging = true;
        item.style.transition = 'none';
      }, {passive:true});

      item.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const dx = e.touches[0].clientX - startX;
        if (dx > 0) currentX = 0;
        else if (dx < -80) currentX = -80;
        else currentX = dx;
        item.style.transform = `translateX(${currentX}px)`;
      }, {passive:true});

      item.addEventListener('touchend', () => {
        if (!isDragging) return;
        isDragging = false;
        item.style.transition = 'transform .3s cubic-bezier(.4,0,.2,1)';
        if (currentX < -40) item.style.transform = 'translateX(-80px)';
        else item.style.transform = 'translateX(0)';
      });
    });
  }

  // ===== Page Animation Initialization =====
  function initPageAnimations(pageName, pageEl) {
    // Number count-up animations
    const countEls = pageEl.querySelectorAll('[data-count]');
    countEls.forEach(el => {
      const target = parseInt(el.dataset.target || el.dataset.count, 10) || parseInt(el.textContent, 10) || 0;
      let start = null;
      const duration = 1500;
      const key = 'count-' + Math.random().toString(36).substr(2, 9);

      function animate(now) {
        if (!start) start = now;
        const progress = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3); // easeOutCubic
        el.textContent = Math.floor(eased * target).toLocaleString();
        if (progress < 1) requestAnimationFrame(animate);
      }
      safeTimeout(() => requestAnimationFrame(animate), 200);
    });

    // Ring progress
    const ringFill = pageEl.querySelector('#ringFill');
    const ringValue = pageEl.querySelector('#ringValue');
    if (ringFill && ringValue) {
      const progress = 80; // 80%
      const circumference = 314; // 2 * PI * 50
      const offset = circumference - (progress / 100) * circumference;

      safeTimeout(() => {
        ringFill.style.strokeDashoffset = offset;
        // Animate number
        let start = null;
        const duration = 1500;
        function animate(now) {
          if (!start) start = now;
          const p = Math.min((now - start) / duration, 1);
          const eased = 1 - Math.pow(1 - p, 3);
          ringValue.textContent = Math.floor(eased * progress) + '%';
          if (p < 1) requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);
      }, 300);
    }

    // Bar chart animation
    const bars = pageEl.querySelectorAll('.bar[data-height]');
    bars.forEach(bar => {
      const height = bar.dataset.height;
      const delay = parseInt(bar.dataset.delay || '0', 10);
      safeTimeout(() => {
        bar.style.height = height + '%';
      }, 300 + delay);
    });

    // Diagonal big number
    const diagonalBig = pageEl.querySelector('.diagonal-big');
    if (diagonalBig && diagonalBig.dataset.target) {
      const target = parseInt(diagonalBig.dataset.target, 10);
      let start = null;
      const duration = 2000;
      function animate(now) {
        if (!start) start = now;
        const p = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        diagonalBig.textContent = Math.floor(eased * target).toLocaleString();
        if (p < 1) requestAnimationFrame(animate);
      }
      safeTimeout(() => requestAnimationFrame(animate), 400);
    }

    // Diagonal stat nums
    const diagNums = pageEl.querySelectorAll('.diagonal-stat-num[data-target]');
    diagNums.forEach((el, i) => {
      const target = parseInt(el.dataset.target, 10);
      let start = null;
      const duration = 1500;
      function animate(now) {
        if (!start) start = now;
        const p = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.floor(eased * target);
        if (p < 1) requestAnimationFrame(animate);
      }
      safeTimeout(() => requestAnimationFrame(animate), 500 + i * 100);
    });

    // Pull to refresh for home page
    if (pageName === 'home') {
      initPullToRefresh(pageEl);
    }

    // Parallax for detail page
    if (pageName === 'detail') {
      initParallax(pageEl);
    }
  }

  // ===== Pull to Refresh =====
  function initPullToRefresh(pageEl) {
    const pullIndicator = pageEl.querySelector('#pullIndicator');
    const content = pageEl.querySelector('.home-wrap');
    if (!pullIndicator || !content) return;

    let startY = 0;
    let pullDistance = 0;
    let isPulling = false;
    let isRefreshing = false;
    const threshold = 60;

    pageEl.addEventListener('touchstart', (e) => {
      if (pageEl.scrollTop <= 0 && !isRefreshing) {
        startY = e.touches[0].clientY;
        isPulling = true;
      }
    }, {passive:true});

    pageEl.addEventListener('touchmove', (e) => {
      if (!isPulling || isRefreshing) return;
      const dy = e.touches[0].clientY - startY;
      if (dy > 0 && pageEl.scrollTop <= 0) {
        pullDistance = Math.min(dy * 0.5, 100);
        pullIndicator.style.height = pullDistance + 'px';
      }
    }, {passive:true});

    pageEl.addEventListener('touchend', () => {
      if (!isPulling) return;
      isPulling = false;

      if (pullDistance >= threshold) {
        isRefreshing = true;
        pullIndicator.style.height = '50px';
        safeTimeout(() => {
          isRefreshing = false;
          pullIndicator.style.height = '0';
          showToast('刷新成功');
        }, 1500);
      } else {
        pullIndicator.style.height = '0';
      }
      pullDistance = 0;
    });
  }

  // ===== Parallax =====
  function initParallax(pageEl) {
    const hero = pageEl.querySelector('.detail-hero');
    const heroPattern = pageEl.querySelector('.detail-hero-pattern');
    if (!hero || !heroPattern) return;

    let ticking = false;
    pageEl.addEventListener('scroll', () => {
      if (!ticking) {
        requestAnimationFrame(() => {
          const scrollY = pageEl.scrollTop;
          if (scrollY < 300) {
            heroPattern.style.transform = `translateY(${scrollY * 0.3}px) scale(${1 + scrollY * 0.001})`;
            hero.style.opacity = 1 - scrollY / 300;
          }
          ticking = false;
        });
        ticking = true;
      }
    });
  }

  // ===== Action Sheet =====
  const sheetMask = document.getElementById('sheetMask');
  const actionSheet = document.getElementById('actionSheet');
  const sheetTitle = document.getElementById('sheetTitle');
  const sheetOptions = document.getElementById('sheetOptions');
  const sheetCancel = document.getElementById('sheetCancel');
  let currentSheetCb = null;

  function showSheet(title, options, type, cb) {
    sheetTitle.textContent = title;
    sheetOptions.innerHTML = options.map((opt, i) => `
      <div class="sheet-option" data-idx="${i}">
        <span class="sheet-option-name">${opt}</span>
        <span class="sheet-option-check"></span>
      </div>
    `).join('');

    sheetOptions.querySelectorAll('.sheet-option').forEach(opt => {
      opt.addEventListener('click', () => {
        const idx = parseInt(opt.dataset.idx, 10);
        hideSheet();
        if (cb) cb(options[idx], idx);
        else showToast(`已选择: ${options[idx]}`);
      });
    });

    sheetMask.classList.add('visible');
    actionSheet.classList.add('visible');
  }

  function hideSheet() {
    sheetMask.classList.remove('visible');
    actionSheet.classList.remove('visible');
  }

  sheetMask.addEventListener('click', hideSheet);
  sheetCancel.addEventListener('click', hideSheet);

  // ===== Toast =====
  const toast = document.getElementById('toast');
  let toastTimer = null;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('visible');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = safeTimeout(() => {
      toast.classList.remove('visible');
    }, 2000);
  }

  // ===== Global Handlers =====
  function handleJoinGame(e) {
    e.stopPropagation();
    showSheet('确认报名', ['确定报名此战局', '我再想想'], '报名', (opt, idx) => {
      if (idx === 0) {
        showToast('报名成功！');
      }
    });
  }

  function handlePublish() {
    showToast('约战发布成功！');
    safeTimeout(() => {
      showTab('home');
    }, 1000);
  }

  function deleteMember(id) {
    const item = document.querySelector(`.swipe-item[data-member="${id}"]`);
    if (item) {
      item.style.transition = 'all .3s ease';
      item.style.transform = 'translateX(-100%)';
      item.style.height = item.offsetHeight + 'px';
      item.style.opacity = '0';
      safeTimeout(() => {
        item.style.height = '0';
        item.style.paddingTop = '0';
        item.style.paddingBottom = '0';
        item.style.margin = '0';
      }, 100);
      safeTimeout(() => {
        item.remove();
        showToast('已移除');
      }, 400);
    }
  }

  // ===== Init =====
  function init() {
    // Initial tab
    renderPage('home', 'tab');

    // Tab bar events
    document.querySelectorAll('.tab-bar .tab-item').forEach(item => {
      item.addEventListener('click', () => {
        const tab = item.dataset.tab;
        if (tab) showTab(tab);
      });
    });

    // Initial cursor position
    const rect = document.getElementById('phone').getBoundingClientRect();
    targetX = rect.left + rect.width / 2;
    targetY = rect.top + rect.height / 2;
  }

  // Reduced motion check
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (prefersReducedMotion) {
    document.documentElement.style.setProperty('--animation-duration', '0.01ms');
  }

  // Cleanup on unload
  window.addEventListener('beforeunload', () => {
    RAF.pause();
    clearTimers();
  });

  // Start
  init();

  // Expose globals
  window.showToast = showToast;
  window.pushPage = pushPage;
  window.popPage = popPage;
  window.showTab = showTab;
  window.showSheet = showSheet;
  window.handleJoinGame = handleJoinGame;
  window.handlePublish = handlePublish;
  window.deleteMember = deleteMember;

  // Announce upgrade capability
  function announceUpgrade() {
    try {
      window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    } catch(e) {}
  }
  announceUpgrade();
  if (document.readyState !== 'complete') window.addEventListener('load', announceUpgrade, { once: true });
</script>
</body>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="creative-medium" content="interactive-prototype" />
<title>煎茶物语 Sencha Journal</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=ZCOOL+XiaoWei&display=swap" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #2a2520; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; color: #3a2e22; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: radial-gradient(ellipse at center, #3d3429 0%, #1a1612 100%); }

  /* === Custom Cursor === */
  .cursor-outer {
    position: fixed; width: 32px; height: 32px; border: 2px solid #fff;
    border-radius: 50%; pointer-events: none; z-index: 9999;
    transform: translate(-50%, -50%); transition: width 0.25s cubic-bezier(.2,.8,.2,1), height 0.25s cubic-bezier(.2,.8,.2,1),
      border-color 0.25s ease, background-color 0.25s ease;
    mix-blend-mode: difference;
    box-shadow: 0 0 12px rgba(95, 125, 78, 0.6);
  }
  .cursor-inner {
    position: fixed; width: 6px; height: 6px; background: #D96C2C;
    border-radius: 50%; pointer-events: none; z-index: 10000;
    transform: translate(-50%, -50%); transition: transform 0.1s ease-out, background-color 0.2s ease;
    box-shadow: 0 0 8px #D96C2C, 0 0 16px rgba(217, 108, 44, 0.5);
  }
  .cursor-outer.hover { width: 48px; height: 48px; border-color: #5F7D4E; background: rgba(95, 125, 78, 0.15); }
  .cursor-outer.click { width: 20px; height: 20px; }
  .cursor-inner.hover { background: #5F7D4E; transform: translate(-50%, -50%) scale(1.5); }
  .cursor-ripple {
    position: fixed; border-radius: 50%; pointer-events: none; z-index: 9998;
    border: 2px solid #5F7D4E; transform: translate(-50%, -50%) scale(0);
    animation: rippleOut 0.6s ease-out forwards;
  }
  @keyframes rippleOut {
    to { transform: translate(-50%, -50%) scale(4); opacity: 0; }
  }

  /* === App Stage === */
  .app-stage { position: relative; display: flex; align-items: center; justify-content: center; gap: 48px; padding: 20px; }

  /* === Tea Particles (ambient) === */
  .tea-particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
  .tea-particle {
    position: absolute; width: 4px; height: 4px; background: rgba(95, 125, 78, 0.4);
    border-radius: 50%; animation: particleFloat linear infinite;
  }
  @keyframes particleFloat {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; transform: translateY(90vh) scale(1); }
    90% { opacity: 0.5; }
    100% { transform: translateY(-10vh) scale(0.5); opacity: 0; }
  }

  /* === Scrollbar hide inside phone === */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* === Page Transition === */
  .page-enter { animation: pageEnter 0.45s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes pageEnter {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* === Shared Token Classes === */
  .serif { font-family: 'Noto Serif SC', 'Songti SC', serif; }
  .display-font { font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif; }

  /* === Steam animation (signature) === */
  .steam-wrap { position: relative; display: flex; justify-content: center; gap: 6px; height: 60px; }
  .steam {
    width: 6px; height: 100%; background: linear-gradient(to top, rgba(246, 241, 230, 0.8), rgba(246, 241, 230, 0));
    border-radius: 50%; filter: blur(4px); animation: steamRise 3s ease-in-out infinite;
  }
  .steam:nth-child(2) { animation-delay: 0.6s; animation-duration: 3.5s; }
  .steam:nth-child(3) { animation-delay: 1.2s; animation-duration: 2.8s; }
  .steam:nth-child(4) { animation-delay: 0.3s; animation-duration: 4s; }
  .steam:nth-child(5) { animation-delay: 1.8s; animation-duration: 3.2s; }
  @keyframes steamRise {
    0% { transform: translateY(20px) scaleX(1) scaleY(0.3); opacity: 0; }
    30% { opacity: 0.8; }
    60% { transform: translateY(-10px) scaleX(1.5) scaleY(0.8); opacity: 0.4; }
    100% { transform: translateY(-40px) scaleX(0.5) scaleY(0.2); opacity: 0; }
  }

  /* === Entrance stagger === */
  .stagger-item { opacity: 0; transform: translateY(16px); animation: staggerIn 0.6s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes staggerIn { to { opacity: 1; transform: translateY(0); } }

  /* === Bamboo divider === */
  .bamboo-rule {
    height: 2px; background: linear-gradient(to right, transparent, #6B4A32, transparent);
    position: relative;
  }
  .bamboo-rule::before {
    content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 8px; height: 8px; background: #D96C2C; border-radius: 50%;
  }

  /* === Glow pulse === */
  .glow-pulse { animation: glowPulse 2.4s ease-in-out infinite; }
  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 16px rgba(217, 108, 44, 0.4); }
    50% { box-shadow: 0 0 32px rgba(217, 108, 44, 0.8), 0 0 64px rgba(217, 108, 44, 0.3); }
  }

  /* === Press effect === */
  .pressable { transition: transform 0.15s cubic-bezier(.2,.8,.2,1); }
  .pressable:active { transform: scale(0.96); }

  /* === 3D tilt container === */
  .tilt-card { transform-style: preserve-3d; transition: transform 0.1s ease-out; will-change: transform; }

  /* === Spin (tea leaf loading / vinyl-like) === */
  .spin-slow { animation: spinSlow 20s linear infinite; }
  @keyframes spinSlow { to { transform: rotate(360deg); } }

  /* === Typewriter caret === */
  .type-caret { display: inline-block; width: 2px; background: #5F7D4E; animation: caretBlink 1s step-end infinite; margin-left: 2px; }
  @keyframes caretBlink { 50% { opacity: 0; } }

  /* === Scroll reveal helper === */
  .reveal { opacity: 0; transform: translateY(20px); transition: all 0.6s cubic-bezier(.2,.8,.2,1); }
  .reveal.visible { opacity: 1; transform: translateY(0); }

  /* === Tab bar === */
  .tab-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 84px;
    background: rgba(246, 241, 230, 0.92); backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(107, 74, 50, 0.12);
    display: flex; align-items: flex-start; justify-content: space-around;
    padding-top: 10px; z-index: 50;
  }
  .tab-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 4px 12px; }
  .tab-item svg { width: 22px; height: 22px; stroke: #a08870; transition: all 0.3s cubic-bezier(.2,.8,.2,1); }
  .tab-item.active svg { stroke: #5F7D4E; transform: translateY(-2px) scale(1.1); }
  .tab-item.active .tab-dot { opacity: 1; transform: scale(1); }
  .tab-label { font-size: 10px; color: #a08870; transition: color 0.3s ease; font-weight: 500; }
  .tab-item.active .tab-label { color: #5F7D4E; font-weight: 600; }
  .tab-dot { width: 4px; height: 4px; background: #D96C2C; border-radius: 50%; opacity: 0; transform: scale(0); transition: all 0.3s cubic-bezier(.2,.8,.2,1); }

  /* === More menu sheet === */
  .more-sheet-backdrop {
    position: absolute; inset: 0; background: rgba(42, 32, 22, 0.4);
    z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
  }
  .more-sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .more-sheet {
    position: absolute; bottom: 0; left: 0; right: 0; background: #F6F1E6;
    border-radius: 24px 24px 0 0; padding: 12px 20px 32px;
    transform: translateY(100%); transition: transform 0.4s cubic-bezier(.2,.8,.2,1);
    z-index: 101;
  }
  .more-sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 40px; height: 4px; background: #c9b8a0; border-radius: 2px;
    margin: 0 auto 20px;
  }
  .sheet-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .sheet-item {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 12px 4px; cursor: pointer; border-radius: 12px;
    transition: background 0.2s ease;
  }
  .sheet-item:active { background: rgba(95, 125, 78, 0.1); }
  .sheet-icon {
    width: 48px; height: 48px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #e8dfcc, #d4c7ae);
  }
  .sheet-icon svg { width: 22px; height: 22px; stroke: #6B4A32; }
  .sheet-label { font-size: 11px; color: #6B4A32; font-weight: 500; }

  /* === Floating Action Button === */
  .fab {
    position: absolute; right: 20px; bottom: 100px; width: 56px; height: 56px;
    border-radius: 50%; background: linear-gradient(135deg, #5F7D4E, #4a6538);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(95, 125, 78, 0.4); cursor: pointer; z-index: 40;
    transition: transform 0.2s cubic-bezier(.2,.8,.2,1), box-shadow 0.2s ease;
  }
  .fab:active { transform: scale(0.92); }
  .fab svg { width: 24px; height: 24px; stroke: #F6F1E6; }

  /* === Toast === */
  .toast {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: rgba(42, 32, 22, 0.9); color: #F6F1E6; padding: 10px 20px;
    border-radius: 20px; font-size: 13px; z-index: 200;
    opacity: 0; transition: all 0.3s cubic-bezier(.2,.8,.2,1); pointer-events: none;
    backdrop-filter: blur(10px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* === Page specific: Home (Hero + parallax + entrance sequence) === */
  .home-page {
    position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
    background: #F6F1E6;
  }
  .home-hero {
    position: relative; height: 420px; overflow: hidden;
    background: linear-gradient(180deg, #5F7D4E 0%, #4a6538 60%, #3d542e 100%);
  }
  .home-hero-img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    opacity: 0.85; will-change: transform;
  }
  .home-hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(42, 32, 22, 0.1) 0%, rgba(42, 32, 22, 0) 40%, rgba(42, 32, 22, 0.6) 100%);
  }
  .hero-topbar {
    position: absolute; top: 0; left: 0; right: 0; padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
    z-index: 10;
  }
  .hero-greeting { color: #F6F1E6; font-size: 13px; opacity: 0.85; }
  .hero-date { color: #F6F1E6; font-size: 11px; opacity: 0.6; }
  .hero-title {
    position: absolute; bottom: 60px; left: 20px; right: 20px; z-index: 5;
  }
  .hero-title h1 {
    font-family: 'ZCOOL XiaoWei', serif; font-size: 36px; color: #F6F1E6;
    line-height: 1.2; letter-spacing: 2px; text-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  .hero-title .subtitle {
    color: #d4c7ae; font-size: 13px; margin-top: 8px; font-weight: 300;
    letter-spacing: 3px;
  }
  .hero-steam {
    position: absolute; bottom: 30px; right: 30px; z-index: 5;
  }

  .home-content {
    position: relative; z-index: 5; padding: 0 20px 120px;
    margin-top: -30px;
  }
  .today-card {
    background: #fff; border-radius: 20px; padding: 20px;
    box-shadow: 0 10px 30px rgba(107, 74, 50, 0.12);
    margin-bottom: 20px;
    position: relative; overflow: hidden;
  }
  .today-card::before {
    content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
    background: linear-gradient(to bottom, #5F7D4E, #D96C2C);
  }
  .today-label { font-size: 11px; color: #a08870; letter-spacing: 2px; margin-bottom: 8px; }
  .today-tea-name { font-family: 'Noto Serif SC', serif; font-size: 22px; color: #3a2e22; font-weight: 600; margin-bottom: 4px; }
  .today-tea-origin { font-size: 12px; color: #6B4A32; margin-bottom: 14px; }
  .today-meta { display: flex; gap: 16px; }
  .today-meta-item { display: flex; align-items: center; gap: 6px; }
  .today-meta-item svg { width: 14px; height: 14px; stroke: #5F7D4E; }
  .today-meta-item span { font-size: 12px; color: #6B4A32; }

  .section-title {
    display: flex; align-items: center; justify-content: space-between;
    margin: 24px 0 14px;
  }
  .section-title h3 {
    font-family: 'Noto Serif SC', serif; font-size: 17px; color: #3a2e22; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title h3::before {
    content: ''; width: 3px; height: 16px; background: #D96C2C; border-radius: 2px;
  }
  .section-title .more-link { font-size: 12px; color: #5F7D4E; cursor: pointer; }

  .quick-actions {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    margin-bottom: 20px;
  }
  .quick-action {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 14px 4px; background: #fff; border-radius: 14px;
    cursor: pointer; transition: all 0.2s ease;
    box-shadow: 0 2px 8px rgba(107, 74, 50, 0.06);
  }
  .quick-action:active { transform: scale(0.94); }
  .qa-icon {
    width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, rgba(95, 125, 78, 0.15), rgba(95, 125, 78, 0.05));
  }
  .qa-icon svg { width: 20px; height: 20px; stroke: #5F7D4E; }
  .qa-label { font-size: 11px; color: #6B4A32; font-weight: 500; }

  .journal-list { display: flex; flex-direction: column; gap: 12px; }
  .journal-item {
    display: flex; gap: 14px; padding: 14px; background: #fff;
    border-radius: 14px; cursor: pointer; transition: all 0.2s ease;
    box-shadow: 0 2px 8px rgba(107, 74, 50, 0.05);
  }
  .journal-item:active { transform: scale(0.98); }
  .journal-thumb {
    width: 64px; height: 64px; border-radius: 12px; overflow: hidden; flex-shrink: 0;
  }
  .journal-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .journal-info { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-width: 0; }
  .journal-title { font-size: 14px; color: #3a2e22; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .journal-desc { font-size: 12px; color: #8a7560; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .journal-date { font-size: 11px; color: #b8a890; }

  /* === Timer Page (circular progress + signature) === */
  .timer-page {
    position: absolute; inset: 0; overflow-y: auto;
    background: linear-gradient(180deg, #1e2a18 0%, #2a3520 40%, #3d4a2e 100%);
    color: #F6F1E6;
  }
  .timer-header {
    padding: 20px; padding-top: 16px; display: flex; align-items: center; justify-content: space-between;
  }
  .timer-header h2 { font-family: 'ZCOOL XiaoWei', serif; font-size: 20px; letter-spacing: 2px; }
  .timer-main {
    display: flex; flex-direction: column; align-items: center; padding: 20px 0 40px;
  }
  .timer-ring-wrap {
    position: relative; width: 260px; height: 260px; margin-bottom: 32px;
  }
  .timer-ring-bg {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from -90deg, rgba(246, 241, 230, 0.1) 0deg, rgba(246, 241, 230, 0.02) 360deg);
  }
  .timer-ring-progress {
    position: absolute; inset: 0; border-radius: 50%;
    transition: background 0.3s linear;
  }
  .timer-ring-inner {
    position: absolute; inset: 14px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #2e3a22, #1a2214);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: inset 0 4px 20px rgba(0,0,0,0.4), 0 0 40px rgba(95, 125, 78, 0.2);
  }
  .timer-time {
    font-family: 'Noto Serif SC', serif; font-size: 48px; font-weight: 300;
    letter-spacing: 2px; color: #F6F1E6; font-variant-numeric: tabular-nums;
  }
  .timer-label { font-size: 12px; color: #8a9a70; margin-top: 4px; letter-spacing: 3px; }
  .timer-status { font-size: 13px; color: #b8c99a; margin-top: 12px; }
  .timer-controls {
    display: flex; gap: 20px; align-items: center; margin-bottom: 32px;
  }
  .timer-btn {
    width: 60px; height: 60px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s cubic-bezier(.2,.8,.2,1);
    border: none;
  }
  .timer-btn:active { transform: scale(0.9); }
  .timer-btn.secondary {
    background: rgba(246, 241, 230, 0.1); color: #d4c7ae;
  }
  .timer-btn.secondary svg { width: 20px; height: 20px; stroke: #d4c7ae; }
  .timer-btn.primary {
    background: linear-gradient(135deg, #D96C2C, #c45520);
    box-shadow: 0 8px 24px rgba(217, 108, 44, 0.4);
    width: 72px; height: 72px;
  }
  .timer-btn.primary svg { width: 28px; height: 28px; stroke: #fff; fill: #fff; }

  .preset-scroll {
    display: flex; gap: 12px; padding: 0 20px; overflow-x: auto;
    margin-bottom: 24px;
  }
  .preset-card {
    flex-shrink: 0; width: 140px; padding: 16px;
    background: rgba(246, 241, 230, 0.06);
    border: 1px solid rgba(246, 241, 230, 0.1);
    border-radius: 16px; cursor: pointer; transition: all 0.3s ease;
  }
  .preset-card.active {
    background: rgba(95, 125, 78, 0.25);
    border-color: rgba(95, 125, 78, 0.6);
    box-shadow: 0 4px 20px rgba(95, 125, 78, 0.3);
  }
  .preset-card:active { transform: scale(0.96); }
  .preset-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .preset-time { font-size: 20px; font-family: 'Noto Serif SC', serif; color: #D96C2C; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .preset-temp { font-size: 11px; color: #8a9a70; }

  .brew-steps { padding: 0 20px; }
  .brew-steps h3 {
    font-family: 'Noto Serif SC', serif; font-size: 16px; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .brew-steps h3::before {
    content: ''; width: 3px; height: 14px; background: #D96C2C; border-radius: 2px;
  }
  .step-item {
    display: flex; gap: 14px; padding: 14px 0;
    border-bottom: 1px solid rgba(246, 241, 230, 0.08);
  }
  .step-item:last-child { border-bottom: none; }
  .step-num {
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(95, 125, 78, 0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; color: #b8c99a; flex-shrink: 0;
  }
  .step-item.active .step-num {
    background: #5F7D4E; color: #fff;
    box-shadow: 0 0 12px rgba(95, 125, 78, 0.6);
  }
  .step-info h4 { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
  .step-info p { font-size: 12px; color: #8a9a70; line-height: 1.5; }

  /* === Catalog Page (waterfall / masonry) === */
  .catalog-page {
    position: absolute; inset: 0; overflow-y: auto;
    background: #efe7d6;
  }
  .catalog-header {
    padding: 20px; padding-bottom: 12px;
    background: linear-gradient(180deg, #6B4A32 0%, #5a3d2a 100%);
    color: #F6F1E6;
  }
  .catalog-header h2 { font-family: 'ZCOOL XiaoWei', serif; font-size: 22px; letter-spacing: 3px; margin-bottom: 4px; }
  .catalog-header .sub { font-size: 12px; opacity: 0.7; letter-spacing: 2px; }
  .catalog-search {
    margin: 16px 20px 0; display: flex; align-items: center; gap: 10px;
    background: rgba(246, 241, 230, 0.15); border-radius: 12px; padding: 10px 14px;
    backdrop-filter: blur(10px);
  }
  .catalog-search svg { width: 16px; height: 16px; stroke: #d4c7ae; }
  .catalog-search input {
    flex: 1; background: none; border: none; outline: none;
    color: #F6F1E6; font-size: 13px; font-family: inherit;
  }
  .catalog-search input::placeholder { color: rgba(246, 241, 230, 0.5); }

  .catalog-filters {
    display: flex; gap: 10px; padding: 16px 20px; overflow-x: auto;
  }
  .filter-chip {
    flex-shrink: 0; padding: 7px 16px; border-radius: 20px;
    background: #fff; border: 1px solid #d4c7ae;
    font-size: 12px; color: #6B4A32; cursor: pointer; transition: all 0.2s ease;
    font-weight: 500;
  }
  .filter-chip.active {
    background: #5F7D4E; border-color: #5F7D4E; color: #fff;
  }
  .filter-chip:active { transform: scale(0.95); }

  .masonry {
    columns: 2; column-gap: 12px; padding: 0 16px 120px;
  }
  .masonry-item {
    break-inside: avoid; margin-bottom: 12px;
    background: #fff; border-radius: 14px; overflow: hidden;
    box-shadow: 0 4px 12px rgba(107, 74, 50, 0.08);
    cursor: pointer; transition: all 0.25s cubic-bezier(.2,.8,.2,1);
  }
  .masonry-item:active { transform: scale(0.97); }
  .masonry-img {
    width: 100%; display: block;
  }

          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>

      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,

      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';

}

// ─────────────────────────────────────────────────────────────
function IOSDevice({

}) {

      <div style={{ height: '100%', display: 'flex', flexDirection: 'column', isolation: 'isolate' }}>

// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {

  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}

  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',

        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',

        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>

}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('appToast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// === Timer Page ===
function TimerPage() {
  const [activePreset, setActivePreset] = useState('sencha');
  const [isRunning, setIsRunning] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const [activeStep, setActiveStep] = useState(3);
  const rafRef = useRef(null);
  const startTimeRef = useRef(0);
  const pausedRef = useRef(0);

  const preset = TEA_PRESETS.find(p => p.id === activePreset);
  const totalTime = preset ? preset.time : 60;
  const remaining = Math.max(0, totalTime - elapsed);
  const progress = Math.min(1, elapsed / totalTime);

  const minutes = Math.floor(remaining / 60);
  const seconds = Math.floor(remaining % 60);
  const ms = Math.floor((remaining % 1) * 100);

  const tick = useCallback((ts) => {
    if (!startTimeRef.current) startTimeRef.current = ts - pausedRef.current;
    const e = (ts - startTimeRef.current) / 1000;
    if (e >= totalTime) {
      setElapsed(totalTime);
      setIsRunning(false);
      showToast('冲泡完成，品茶愉快！');
      return;
    }
    setElapsed(e);
    rafRef.current = requestAnimationFrame(tick);
  }, [totalTime]);

  useEffect(() => {
    if (isRunning) {
      startTimeRef.current = 0;
      rafRef.current = requestAnimationFrame(tick);
    } else {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      pausedRef.current = elapsed * 1000;
    }
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [isRunning, tick]);

  // Visibility handling
  useEffect(() => {
    const onVis = () => {
      if (document.hidden && isRunning) {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      }
    };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, [isRunning]);

  const handlePreset = (id) => {
    setActivePreset(id);
    setIsRunning(false);
    setElapsed(0);
    pausedRef.current = 0;
  };

  const handleReset = () => {
    setIsRunning(false);
    setElapsed(0);
    pausedRef.current = 0;
    startTimeRef.current = 0;
  };

  // Ring gradient
  const ringStyle = {
    background: `conic-gradient(from -90deg, #D96C2C ${progress * 360}deg, rgba(246, 241, 230, 0.08) ${progress * 360}deg)`,
  };

  return (
    <div className="timer-page no-scrollbar">
      <div className="timer-header">
        <h2>冲 泡 计 时</h2>
        <div style={{opacity:0.6,fontSize:12}}>
          <Icon.Cup style={{width:18,height:18,stroke:'#d4c7ae'}} />
        </div>
      </div>

      <div className="timer-main">
        {/* Timer Ring */}
        <div className="timer-ring-wrap">
          <div className="timer-ring-bg"></div>
          <div className="timer-ring-progress" style={ringStyle}></div>
          <div className="timer-ring-inner">
            <div className="timer-time">
              {String(minutes).padStart(2,'0')}:{String(seconds).padStart(2,'0')}
              <span style={{fontSize:20, opacity:0.6}}>.{String(ms).padStart(2,'0')}</span>
            </div>
            <div className="timer-label">{preset?.name}</div>
            <div className="timer-status">
              {isRunning ? '冲泡中…' : elapsed > 0 ? '已暂停' : '准备就绪'}
            </div>
          </div>
        </div>

        {/* Controls */}
        <div className="timer-controls">
          <button className="timer-btn secondary pressable" onClick={handleReset}>
            <Icon.Reset />
          </button>
          <button className={`timer-btn primary pressable ${isRunning ? 'glow-pulse' : ''}`}
            onClick={() => setIsRunning(!isRunning)}>
            {isRunning ? <Icon.Pause /> : <Icon.Play />}
          </button>
          <button className="timer-btn secondary pressable" onClick={() => showToast('添加到茶席')}>
            <Icon.Plus />
          </button>
        </div>
      </div>

      {/* Presets */}
      <div className="preset-scroll no-scrollbar">
        {TEA_PRESETS.map((p, i) => (
          <div key={p.id}
            className={`preset-card ${activePreset === p.id ? 'active' : ''} stagger-item`}
            style={{animationDelay: `${0.3 + i * 0.08}s`}}
            onClick={() => handlePreset(p.id)}>
            <div className="preset-name">{p.name}</div>
            <div className="preset-time">{Math.floor(p.time/60)}:{String(p.time%60).padStart(2,'0')}</div>
            <div className="preset-temp">{p.temp} · {p.desc}</div>
          </div>
        ))}
      </div>

      {/* Brew Steps */}
      <div className="brew-steps">
        <h3>冲泡步骤</h3>
        {BREW_STEPS.map((step, i) => (
          <div key={i} className="step-item" onClick={() => setActiveStep(i)}>
            <div className={`step-num ${activeStep === i ? 'active' : ''}`}>{i + 1}</div>
            <div className="step-info">
              <h4>{step.title}</h4>
              <p>{step.desc}</p>
            </div>
          </div>
        ))}
      </div>
      <div style={{height:100}}></div>
    </div>
  );
}

// === API Doc Page ===
function ApiDocPage() {
  const [activeCategory, setActiveCategory] = useState('全部');
  const [openEndpoints, setOpenEndpoints] = useState({0: true});
  const categories = ['全部', '茶品', '手账', '计时器', '用户'];

  const toggleEndpoint = (i) => {
    setOpenEndpoints(prev => ({...prev, [i]: !prev[i]}));
  };

  const methodClass = (m) => m.toLowerCase();

  // Simple syntax highlight for JSON response
  const renderCode = (code) => {
    return code.split('\n').map((line, idx) => {
      // Highlight keys, strings, numbers, booleans
      let highlighted = line
        .replace(/"([^"]+)":/g, '<span class="key">"$1"</span>:')
        .replace(/: "([^"]+)"/g, ': <span class="str">"$1"</span>')
        .replace(/: (\d+\.?\d*)/g, ': <span class="num">$1</span>')
        .replace(/: (true|false)/g, ': <span class="bool">$1</span>');
      return <div key={idx} className="api-code-line" dangerouslySetInnerHTML={{__html: highlighted}}></div>;
    });
  };

  return (
    <div className="api-page no-scrollbar">
      <div className="api-header">
        <h2>接 口 文 档</h2>
        <div className="sub">API REFERENCE · v1.0</div>
      </div>

      <div className="api-nav no-scrollbar">
        {categories.map(cat => (
          <div key={cat}
            className={`api-nav-item ${activeCategory === cat ? 'active' : ''}`}
            onClick={() => setActiveCategory(cat)}>
            {cat}
          </div>
        ))}
      </div>

      <div className="api-body">
        {API_ENDPOINTS.map((ep, i) => (
          <div key={i} className="api-endpoint stagger-item"
            style={{animationDelay: `${0.2 + i * 0.08}s`}}>
            <div className="api-endpoint-header" onClick={() => toggleEndpoint(i)}>
              <span className={`api-method ${methodClass(ep.method)}`}>{ep.method}</span>
              <span className="api-path">{ep.path}</span>
              <span className={`api-chevron ${openEndpoints[i] ? 'open' : ''}`}>▶</span>
            </div>
            <div className={`api-endpoint-body ${openEndpoints[i] ? 'open' : ''}`}>
              <div className="api-desc">{ep.desc}</div>

              <div className="api-subtitle">请求参数</div>
              {ep.params.map((p, pi) => (
                <div key={pi} className="api-param-row">
                  <span className="api-param-name">{p.name}</span>
                  <span className="api-param-type">{p.type}</span>
                  <span className="api-param-desc">{p.desc}</span>
                </div>
              ))}

              <div className="api-subtitle">响应示例</div>
              <div className="api-code-block">
                {renderCode(ep.response)}
              </div>
            </div>
          </div>
        ))}
      </div>
      <div style={{height: 120}}></div>
    </div>
  );
}

// === Main App ===
function App() {
  const [page, setPage] = useState('home');
  const [pageKey, setPageKey] = useState(0);
  const [moreOpen, setMoreOpen] = useState(false);
  const [showSplash, setShowSplash] = useState(true);

  useEffect(() => {
    const t = setTimeout(() => setShowSplash(false), 2400);
    return () => clearTimeout(t);
  }, []);

  const navigate = useCallback((p) => {
    setPage(p);
    setPageKey(k => k + 1);
  }, []);

  const renderPage = () => {
    switch (page) {
      case 'home': return <HomePage onNavigate={navigate} />;
      case 'timer': return <TimerPage />;
      case 'catalog': return <CatalogPage />;
      case 'origin': return <OriginPage />;
      case 'profile': return <ProfilePage />;
      case 'spec': return <DesignSpecPage />;
      case 'api': return <ApiDocPage />;
      default: return <HomePage onNavigate={navigate} />;
    }
  };

  // Map page to tab bar active key
  const tabActive = ['home','catalog','origin','profile'].includes(page) ? page : 'home';

  return (
    <IOSDevice width={390} height={844}>
      <div style={{position:'absolute', inset:0, overflow:'hidden'}}>
        <div key={pageKey} className="page-enter" style={{position:'absolute', inset:0, paddingBottom: 84}}>
          {renderPage()}
        </div>

        {/* Floating action button on home */}
        {page === 'home' && (
          <div className="fab pressable glow-pulse" onClick={() => navigate('timer')}>
            <Icon.Timer />
          </div>
        )}

        <TabBar active={tabActive} onChange={navigate} onMore={() => setMoreOpen(true)} />

        <MoreSheet open={moreOpen} onClose={() => setMoreOpen(false)} onNavigate={navigate} />

        <SplashScreen show={showSplash} />

        <div id="appToast" className="toast"></div>
      </div>
    </IOSDevice>
  );
}

// === Custom Cursor & Ambient Effects ===
function initCursor() {
  const outer = document.getElementById('cursorOuter');
  const inner = document.getElementById('cursorInner');
  if (!outer || !inner) return;

  // Initial center position
  outer.style.left = '50%';
  outer.style.top = '50%';
  inner.style.left = '50%';
  inner.style.top = '50%';

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let outerX = mouseX;
  let outerY = mouseY;
  let rafId = null;
  let paused = false;

  const animate = () => {
    if (paused) return;
    // Spring-like follow for outer
    outerX += (mouseX - outerX) * 0.15;
    outerY += (mouseY - outerY) * 0.15;
    outer.style.left = outerX + 'px';
    outer.style.top = outerY + 'px';
    inner.style.left = mouseX + 'px';
    inner.style.top = mouseY + 'px';
    rafId = requestAnimationFrame(animate);
  };

  const onMove = (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  };

  const onOver = (e) => {
    const target = e.target.closest('button, .pressable, .tab-item, .quick-action, .journal-item, .masonry-item, .preset-card, .filter-chip, .gallery-item, .badge-item, .menu-item, .sheet-item, .color-card, .icon-item, .api-nav-item, .api-endpoint-header, .origin-tab, .more-link');
    if (target) {
      outer.classList.add('hover');
      inner.classList.add('hover');
    }
  };

  const onOut = (e) => {
    const target = e.target.closest('button, .pressable, .tab-item, .quick-action, .journal-item, .masonry-item, .preset-card, .filter-chip, .gallery-item, .badge-item, .menu-item, .sheet-item, .color-card, .icon-item, .api-nav-item, .api-endpoint-header, .origin-tab, .more-link');
    if (target) {
      outer.classList.remove('hover');
      inner.classList.remove('hover');
    }
  };

  const onClick = (e) => {
    // Ripple
    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);

    outer.classList.add('click');
    setTimeout(() => outer.classList.remove('click'), 150);
  };

  const onVis = () => {
    if (document.hidden) {
      paused = true;
      if (rafId) cancelAnimationFrame(rafId);
    } else {
      paused = false;
      rafId = requestAnimationFrame(animate);
    }
  };

  window.addEventListener('mousemove', onMove);
  document.addEventListener('mouseover', onOver);
  document.addEventListener('mouseout', onOut);
  window.addEventListener('click', onClick);
  document.addEventListener('visibilitychange', onVis);

  // Reduced motion check
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    outer.style.display = 'none';
    inner.style.display = 'none';
    return;
  }

  rafId = requestAnimationFrame(animate);
}

function initParticles() {
  const container = document.getElementById('teaParticles');
  if (!container) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'tea-particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay = Math.random() * 10 + 's';
    p.style.width = (2 + Math.random() * 4) + 'px';
    p.style.height = p.style.width;
    p.style.opacity = 0.2 + Math.random() * 0.4;
    container.appendChild(p);
  }
}

// === Render ===
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// Initialize cursor and particles after mount
window.addEventListener('load', () => {
  setTimeout(initCursor, 100);
  setTimeout(initParticles, 500);
});

// Announce upgrade capability
function announceUpgrade() {
  try {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  } catch(e) {}
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}

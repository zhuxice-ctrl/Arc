  .app-title {

  }
  .app-title strong {
    color: #4a6b3d;
    font-weight: 600;
  }
  /* ===== 设备外框 ===== */
  .phone-frame {
    position: relative;
    width: 375px;
    height: 760px;

    background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
    padding: 12px;
    box-shadow:

  .phone-screen {

    height: 100%;

  }

    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 100;
    font-size: 15px;
    font-weight: 600;
    color: #1a1a1a;
    pointer-events: none;
  }
  .status-bar .status-right {

    align-items: center;
    gap: 5px;
  }

  .notch {

    left: 50%;

    background: #000;
    border-radius: 20px;
    z-index: 101;
    pointer-events: none;

    left: 50%;
    transform: translateX(-50%);

    height: 5px;
    background: #1a1a1a;
    border-radius: 3px;
    z-index: 200;
    opacity: 0.3;
  }
  /* ===== 小程序胶囊按钮 ===== */
  .mp-capsule {
    position: absolute;
    top: 50px;
    right: 16px;
    width: 87px;
    height: 32px;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    z-index: 90;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border: 0.5px solid rgba(0,0,0,0.04);
  }
  .mp-capsule .capsule-icon {
    width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1a1a1a;

    width: 0.5px;
    height: 16px;
    background: rgba(0,0,0,0.1);

    top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden;
    background: #f7f5ee;
  }
  .page {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
    will-change: transform;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    background: #f7f5ee;
  }
  .page::-webkit-scrollbar { display: none; }
  .page.stack-in { transform: translateX(0); z-index: 10; }
  .page.stack-out { transform: translateX(-30%); z-index: 5; opacity: 0.85; }
  .page.stack-from-right { transform: translateX(100%); z-index: 10; }
  /* 下拉刷新 */
  .pull-refresh {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 60px;
    transform: translateY(-60px);
    transition: transform 0.3s ease;
    font-size: 13px;
    color: #6b8e5f;
    gap: 8px;
    z-index: 50;
  }
  .pull-refresh .refresh-leaf {
    animation: leafSpin 2s linear infinite;
  }
  @keyframes leafSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  /* ===== TabBar ===== */
  .tab-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 56px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    border-top: 0.5px solid rgba(0,0,0,0.06);
    z-index: 80;
    padding-bottom: 0;
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
  }
  .tab-item svg {
    width: 24px;
    height: 24px;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .tab-item.active svg {
    transform: scale(1.15) translateY(-2px);
  }
  .tab-item .tab-label {
    font-size: 10px;
    transition: all 0.2s ease;
    color: #999;
  }
  .tab-item.active .tab-label {
    color: #4a6b3d;
    font-weight: 600;
  }
  .tab-item.active .tab-icon-wrap {
    position: relative;
  }
  .tab-item.active .tab-icon-wrap::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #d68b54;
    animation: dotBounce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes dotBounce {
    0% { transform: translateX(-50%) scale(0); }
    100% { transform: translateX(-50%) scale(1); }

    align-items: center;
    z-index: 50;

    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;

    left: 50%;
    transform: translateX(-50%);
    font-size: 17px;
    font-weight: 600;
    top: 50%;
    margin-top: 4px;

  .sheet-mask {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .sheet-mask.show {
    opacity: 1;
    pointer-events: auto;
  }
  .sheet-panel {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: #fff;
    border-radius: 20px 20px 0 0;
    z-index: 201;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
    padding-bottom: 24px;
    max-height: 70%;
    overflow-y: auto;
  }
  .sheet-panel.show { transform: translateY(0); }
  .sheet-handle {
    display: flex;
    justify-content: center;
    padding: 12px 0 8px;

  .sheet-handle div {
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: #e0ddd4;
  }

  .skeleton {
    background: linear-gradient(90deg, #f0ede5 25%, #e8e5db 50%, #f0ede5 75%);

    animation: shimmer 1.5s infinite;
    border-radius: 8px;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .btn-primary {
    height: 48px;
    border-radius: 24px;
    background: linear-gradient(135deg, #6b8e5f, #4a6b3d);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(74,107,61,0.3);
    transition: all 0.2s ease;
  }
  .btn-primary:active {
    transform: scale(0.98);
  }
  /* ===== 浮动操作球 ===== */
  .fab {
    position: absolute;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #d68b54, #c27340);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(214,139,84,0.4);
    cursor: pointer;

  .fab svg { width: 26px; height: 26px; }
  /* ===== 工具类 ===== */
  .safe-bottom { height: 70px; }
  .safe-bottom-lg { height: 90px; }
  .hide-scroll::-webkit-scrollbar { display: none; }
  .hide-scroll { scrollbar-width: none; }

  .fade-in-up {

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .stagger-1 { animation-delay: 0.05s; }
  .stagger-2 { animation-delay: 0.1s; }
  .stagger-3 { animation-delay: 0.15s; }
  .stagger-4 { animation-delay: 0.2s; }
  .stagger-5 { animation-delay: 0.25s; }
  .stagger-6 { animation-delay: 0.3s; }
  .stagger-7 { animation-delay: 0.35s; }
  .stagger-8 { animation-delay: 0.4s; }

  .grow-anim {
    animation: plantGrow 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    transform-origin: bottom center;
  }
  @keyframes plantGrow {
    0% { transform: scaleY(0.3) scaleX(0.8); opacity: 0; }
    60% { transform: scaleY(1.05) scaleX(0.95); opacity: 1; }
    100% { transform: scaleY(1) scaleX(1); opacity: 1; }

  .leaf-sway {
    animation: leafSway 4s ease-in-out infinite;
    transform-origin: bottom center;

  @keyframes leafSway {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }

  .water-drop {
    animation: waterDrop 2s ease-in-out infinite;
  }
  @keyframes waterDrop {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  /* reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  .page-debug-nav {
    display: flex;
    gap: 6px;

  }
</style>

function GardenHomePage({ onPlantClick, onAddPlant }) {
  const [scrollY, setScrollY] = useState(0);
  const [isRefreshing, setIsRefreshing] = useState(false);
  const pageRef = useRef(null);
  const pullStartY = useRef(0);
  const pullDistance = useRef(0);
  const rafId = useRef(null);

  const handleScroll = useCallback((e) => {
    if (rafId.current) cancelAnimationFrame(rafId.current);
    rafId.current = requestAnimationFrame(() => {
      setScrollY(e.target.scrollTop);
    });
  }, []);

  const handleTouchStart = (e) => {
    if (pageRef.current && pageRef.current.scrollTop === 0) {
      pullStartY.current = e.touches[0].clientY;
    }
  };

  const handleTouchMove = (e) => {
    if (pageRef.current && pageRef.current.scrollTop <= 0) {
      const currentY = e.touches[0].clientY;
      const distance = currentY - pullStartY.current;
      if (distance > 0) {
        pullDistance.current = Math.min(distance * 0.5, 80);
        const pullEl = pageRef.current.querySelector('.pull-refresh');
        if (pullEl) {
          pullEl.style.transform = `translateY(${pullDistance.current - 60}px)`;
        }
      }
    }
  };

  const handleTouchEnd = () => {
    if (pullDistance.current > 50) {
      setIsRefreshing(true);
      const pullEl = pageRef.current.querySelector('.pull-refresh');
      if (pullEl) pullEl.style.transform = 'translateY(0px)';
      setTimeout(() => {
        setIsRefreshing(false);
        if (pullEl) pullEl.style.transform = 'translateY(-60px)';
        pullDistance.current = 0;
      }, 1500);
    } else {
      const pullEl = pageRef.current.querySelector('.pull-refresh');
      if (pullEl) pullEl.style.transform = 'translateY(-60px)';
      pullDistance.current = 0;
    }
  };

  useEffect(() => {
    return () => {
      if (rafId.current) cancelAnimationFrame(rafId.current);
    };
  }, []);

  const navOpacity = Math.min(scrollY / 200, 1);
  const heroScale = 1 + scrollY * 0.0005;
  const heroOpacity = Math.max(1 - scrollY / 300, 0);

  // 瀑布流左右列
  const leftCol = myPlants.filter((_, i) => i % 2 === 0);

    <div
      ref={pageRef}
      className="page stack-in"
      onScroll={handleScroll}
      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}

      {/* 下拉刷新 */}

// ================= 页面 3: 养护提醒 - 时间线列表 + 左滑操作 =================
function ReminderPage() {
  const [reminders, setReminders] = useState(careReminders);
  const [swipedId, setSwipedId] = useState(null);
  const touchStartX = useRef(0);
  const touchCurrentX = useRef(0);

  const handleTouchStart = (e, id) => {
    touchStartX.current = e.touches[0].clientX;
    touchCurrentX.current = e.touches[0].clientX;
    if (swipedId !== null && swipedId !== id) {
      setSwipedId(null);
    }
  };

  const handleTouchMove = (e, id) => {
    touchCurrentX.current = e.touches[0].clientX;
  };

  const handleTouchEnd = (id) => {
    const diff = touchStartX.current - touchCurrentX.current;
    if (diff > 40) {
      setSwipedId(id);
    } else if (diff < -20) {
      setSwipedId(null);
    }
  };

  const completeReminder = (id) => {
    setReminders(prev => prev.filter(r => r.id !== id));
    setSwipedId(null);
  };

  const deleteReminder = (id) => {
    setReminders(prev => prev.filter(r => r.id !== id));
    setSwipedId(null);
  };

  const todayReminders = reminders.filter(r => r.time.includes('今天'));
  const upcomingReminders = reminders.filter(r => !r.time.includes('今天'));

  return (
    <div className="page stack-in" style={{ background: '#f7f5ee' }}>
      {/* 导航栏 */}
      <div className="mp-nav solid" style={{ justifyContent: 'center' }}>
        <div className="nav-title">养护提醒</div>
      </div>

      {/* 环形进度概览卡片 */}
      <div className="fade-in-up" style={{
        margin: '16px',
        padding: '20px',
        background: 'linear-gradient(135deg, #4a6b3d 0%, #6b8e5f 100%)',
        borderRadius: 20,
        color: '#fff',
        position: 'relative',
        overflow: 'hidden',
      }}>
        {/* 装饰 */}
        <div className="leaf-sway" style={{
          position: 'absolute',
          right: -20,
          top: -10,
          fontSize: 80,
          opacity: 0.15,
        }}>
          <svg width="100" height="100" viewBox="0 0 24 24" fill="currentColor">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/>
          </svg>
        </div>

        <div style={{ display: 'flex', alignItems: 'center', gap: 20, position: 'relative', zIndex: 1 }}>
          {/* 环形进度 */}
          <div style={{ position: 'relative', width: 72, height: 72, flexShrink: 0 }}>
            <svg width="72" height="72" viewBox="0 0 72 72">
              <circle cx="36" cy="36" r="30" fill="none" stroke="rgba(255,255,255,0.2)" strokeWidth="6"/>
              <circle
                cx="36" cy="36" r="30" fill="none" stroke="#fff"
                strokeWidth="6" strokeLinecap="round"
                strokeDasharray={`${2 * Math.PI * 30 * (todayReminders.length > 0 ? 0.4 : 1)} ${2 * Math.PI * 30}`}
                transform="rotate(-90 36 36)"
              />
            </svg>
            <div style={{
              position: 'absolute', inset: 0,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              flexDirection: 'column',
            }}>
              <div style={{ fontSize: 18, fontWeight: 700 }}>{todayReminders.length > 0 ? reminders.length - todayReminders.length + 1 : reminders.length}</div>
              <div style={{ fontSize: 9, opacity: 0.8 }}>待完成</div>
            </div>
          </div>

          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>今日养护计划</div>
            <div style={{ fontSize: 12, opacity: 0.85, lineHeight: 1.6 }}>
              {todayReminders.length} 项待办 · 已完成 {reminders.length - todayReminders.length} 项
            </div>
            <div style={{
              marginTop: 10,
              display: 'inline-block',
              padding: '4px 12px',
              background: 'rgba(255,255,255,0.2)',
              borderRadius: 12,
              fontSize: 11,
              backdropFilter: 'blur(10px)',
            }}>
              🔥 连续打卡 12 天
            </div>
          </div>
        </div>
      </div>

      {/* 今天的提醒 */}
      <div style={{ padding: '0 16px' }}>
        <div style={{
          fontSize: 14, fontWeight: 600, color: '#2d3a2e',
          marginBottom: 10, display: 'flex', alignItems: 'center', gap: 6,
        }}>
          <div style={{ width: 3, height: 14, background: '#d68b54', borderRadius: 2 }}></div>
          今天 · {todayReminders.length} 项
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {todayReminders.map((r, i) => (
            <SwipeableReminder
              key={r.id}
              reminder={r}
              isSwiped={swipedId === r.id}
              onTouchStart={(e) => handleTouchStart(e, r.id)}
              onTouchMove={(e) => handleTouchMove(e, r.id)}
              onTouchEnd={() => handleTouchEnd(r.id)}
              onComplete={() => completeReminder(r.id)}
              onDelete={() => deleteReminder(r.id)}
              delay={i * 0.05}
            />
          ))}
          {todayReminders.length === 0 && (
            <div style={{
              padding: 30, textAlign: 'center',
              color: '#aaa', fontSize: 13,
              background: '#fff', borderRadius: 12,
            }}>
              🎉 今天的任务都完成啦
            </div>
          )}
        </div>
      </div>

      {/* 即将到来 */}
      <div style={{ padding: '20px 16px 0' }}>
        <div style={{
          fontSize: 14, fontWeight: 600, color: '#2d3a2e',
          marginBottom: 10, display: 'flex', alignItems: 'center', gap: 6,
        }}>
          <div style={{ width: 3, height: 14, background: '#6b8e5f', borderRadius: 2 }}></div>
          即将到来 · {upcomingReminders.length} 项
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {upcomingReminders.map((r, i) => (
            <SwipeableReminder
              key={r.id}
              reminder={r}
              isSwiped={swipedId === r.id}
              onTouchStart={(e) => handleTouchStart(e, r.id)}
              onTouchMove={(e) => handleTouchMove(e, r.id)}
              onTouchEnd={() => handleTouchEnd(r.id)}
              onComplete={() => completeReminder(r.id)}
              onDelete={() => deleteReminder(r.id)}
              delay={i * 0.05 + 0.1}
            />
          ))}
        </div>
      </div>

      <div className="safe-bottom-lg"></div>
    </div>
  );
}

function SwipeableReminder({ reminder, isSwiped, onTouchStart, onTouchMove, onTouchEnd, onComplete, onDelete, delay = 0 }) {
  const translateX = isSwiped ? -140 : 0;
  return (
    <div
      className="fade-in-up"
      style={{
        animationDelay: `${delay}s`,
        position: 'relative',
        overflow: 'hidden',
        borderRadius: 12,
      }}
    >
      {/* 背景操作按钮 */}
      <div style={{
        position: 'absolute',
        top: 0, right: 0, bottom: 0,
        display: 'flex',
      }}>
        <div
          onClick={onComplete}
          style={{
            width: 70,
            background: '#6b8e5f',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            color: '#fff', fontSize: 12, fontWeight: 600,
          }}
        >完成</div>
        <div
          onClick={onDelete}
          style={{
            width: 70,
            background: '#d68b54',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            color: '#fff', fontSize: 12, fontWeight: 600,
          }}
        >删除</div>
      </div>

      {/* 前景内容 */}
      <div
        style={{
          transform: `translateX(${translateX}px)`,
          transition: 'transform 0.3s cubic-bezier(0.22, 0.61, 0.36, 1)',
          background: '#fff',
          padding: '14px 16px',
          display: 'flex',
          alignItems: 'center',
          gap: 12,
          borderRadius: 12,
          touchAction: 'pan-y',
        }}
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
      >
        <div style={{
          width: 44, height: 44, borderRadius: 12,
          background: `${reminder.color}15`,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          flexShrink: 0,
        }}>
          <span style={{ fontSize: 20 }}>{reminder.icon}</span>
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 14, fontWeight: 600, color: '#2d3a2e' }}>
            给 {reminder.plantName} {reminder.action}
          </div>
          <div style={{ fontSize: 12, color: '#999', marginTop: 2 }}>
            {reminder.time}
          </div>
        </div>
        {reminder.status === 'due' && (
          <div style={{
            fontSize: 10, color: '#d68b54', fontWeight: 600,
            padding: '3px 8px', background: '#fff0e0',
            borderRadius: 8,
          }}>待完成</div>
        )}
      </div>
    </div>
  );
}

                响应示例
              </div>
              <pre style={{
                background: 'rgba(0,0,0,0.2)',
                borderRadius: 8,
                padding: '10px 12px',
                fontSize: 10,
                color: '#c8d4c0',
                fontFamily: "'SF Mono', Monaco, 'Courier New', monospace",
                lineHeight: 1.6,
                overflowX: 'auto',
                margin: 0,
              }}>{api.response}</pre>
            </div>
          </div>
        ))}
      </div>

      <div className="safe-bottom"></div>
    </div>
  );
}

// ================= 主应用 =================
function App() {
  const [activeTab, setActiveTab] = useState('garden');
  const [stackPage, setStackPage] = useState(null); // 'detail' | 'design' | 'api'
  const [selectedPlant, setSelectedPlant] = useState(null);
  const [showAddSheet, setShowAddSheet] = useState(false);
  const [pageVisible, setPageVisible] = useState(true);

  // 页面可见性变化
  useEffect(() => {
    const handleVisibility = () => {
      setPageVisible(!document.hidden);
    };
    document.addEventListener('visibilitychange', handleVisibility);
    return () => document.removeEventListener('visibilitychange', handleVisibility);
  }, []);

  const goToPlantDetail = (plant) => {
    setSelectedPlant(plant);
    setStackPage('detail');
  };

  const goBack = () => {
    setStackPage(null);
    setSelectedPlant(null);
  };

  const navigateTo = (page) => {
    if (page === 'design') setStackPage('design');
    if (page === 'api') setStackPage('api');
  };

  const handleTabChange = (tab) => {
    setActiveTab(tab);
    setStackPage(null);
  };

  // 调试按钮
  useEffect(() => {
    const nav = document.getElementById('debugNav');
    if (nav) {
      const pages = ['garden', 'guide', 'remind', 'community', 'me', 'detail', 'design', 'api'];
      const labels = ['我的花园', '植物图鉴', '养护提醒', '花友圈', '个人中心', '植物详情', '设计规范', '接口文档'];
      nav.innerHTML = '';
      pages.forEach((p, i) => {
        const btn = document.createElement('button');
        btn.textContent = labels[i];
        const isActive =
          (['garden', 'guide', 'remind', 'community', 'me'].includes(p) && activeTab === p && !stackPage) ||
          (p === 'detail' && stackPage === 'detail') ||
          (p === 'design' && stackPage === 'design') ||
          (p === 'api' && stackPage === 'api');
        if (isActive) btn.className = 'active';
        btn.onclick = () => {
          if (['garden', 'guide', 'remind', 'community', 'me'].includes(p)) {
            setActiveTab(p);
            setStackPage(null);
          } else if (p === 'detail') {
            setSelectedPlant(myPlants[0]);
            setStackPage('detail');
          } else {
            setStackPage(p);
          }
        };
        nav.appendChild(btn);
      });
    }
  }, [activeTab, stackPage]);

  // 渲染主页面
  const renderMainPage = () => {
    switch (activeTab) {
      case 'garden':
        return <GardenHomePage onPlantClick={goToPlantDetail} onAddPlant={() => setShowAddSheet(true)} />;
      case 'guide':
        return <GuidePage onPlantClick={goToPlantDetail} />;
      case 'remind':
        return <ReminderPage />;
      case 'community':
        return <CommunityPage />;
      case 'me':
        return <ProfilePage onNavigate={navigateTo} />;
      default:
        return null;
    }
  };

  // 渲染栈页面
  const renderStackPage = () => {
    if (!stackPage) return null;
    switch (stackPage) {
      case 'detail':
        return <PlantDetailPage plant={selectedPlant} onBack={goBack} />;
      case 'design':
        return <DesignSpecPage onBack={goBack} />;
      case 'api':
        return <ApiDocPage onBack={goBack} />;
      default:
        return null;
    }
  };

  return (
    <div className="phone-frame">
      <div className="phone-screen">
        <div className="notch"></div>
        <StatusBar light={stackPage === 'api' || (activeTab === 'me' && !stackPage)} />
        <CapsuleButton />

        <div className="page-container">
          {/* 主页面 */}
          <div style={{
            position: 'absolute',
            inset: 0,
            transform: stackPage ? 'translateX(-15%) scale(0.96)' : 'translateX(0)',
            opacity: stackPage ? 0.6 : 1,
            transition: 'all 0.35s cubic-bezier(0.22, 0.61, 0.36, 1)',
          }}>
            {renderMainPage()}
            {!stackPage && <TabBar active={activeTab} onChange={handleTabChange} />}
          </div>

          {/* 栈页面 */}
          {stackPage && (
            <div style={{
              position: 'absolute',
              inset: 0,
              transform: 'translateX(0)',
              transition: 'transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1)',
              zIndex: 10,
              animation: 'slideInRight 0.35s cubic-bezier(0.22, 0.61, 0.36, 1)',
            }}>
              {renderStackPage()}
            </div>
          )}
        </div>

        {/* 全局添加植物弹层 */}
        <div
          className={`sheet-mask ${showAddSheet ? 'show' : ''}`}
          onClick={() => setShowAddSheet(false)}
        />
        <div className={`sheet-panel ${showAddSheet ? 'show' : ''}`}>
          <div className="sheet-handle"><div></div></div>
          <div style={{ padding: '0 20px 20px' }}>
            <div style={{ fontSize: 18, fontWeight: 700, color: '#2d3a2e', marginBottom: 16 }}>
              添加新植物
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
              {[
                { icon: '📷', label: '拍照识别', desc: 'AI 识别植物品种', color: '#e8f0e3' },
                { icon: '🔍', label: '图鉴搜索', desc: '从图鉴中选择', color: '#fff0e0' },
                { icon: '📝', label: '手动录入', desc: '自己填写信息', color: '#fff7e6' },
                { icon: '🪴', label: '从花友添加', desc: '花友分享的小苗', color: '#f0e6f0' },
              ].map((opt, i) => (
                <div key={i} style={{
                  background: opt.color,
                  borderRadius: 14,
                  padding: '16px 12px',
                  textAlign: 'center',
                  cursor: 'pointer',
                }}>
                  <div style={{ fontSize: 28, marginBottom: 6 }}>{opt.icon}</div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: '#2d3a2e' }}>{opt.label}</div>
                  <div style={{ fontSize: 10, color: '#888', marginTop: 2 }}>{opt.desc}</div>
                </div>
              ))}
            </div>
            <button
              className="btn-primary"
              style={{ marginTop: 20, width: '100%' }}
              onClick={() => setShowAddSheet(false)}
            >
              取消
            </button>
          </div>
        </div>

        <div className="home-indicator"></div>
      </div>

      {/* 辅助样式 */}
      <style>{`
        @keyframes slideInRight {
          from { transform: translateX(100%); }
          to { transform: translateX(0); }
        }
      `}</style>
    </div>
  );
}

// ================= 渲染 =================
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// 宣告可升级为全栈应用
function announceUpgrade() {
  window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
}
announceUpgrade();
if (document.readyState !== 'complete') window.addEventListener('load', announceUpgrade, { once: true });
</script>

</body>
</html>

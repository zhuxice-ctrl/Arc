<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>胶片社 FilmSociety · 微信小程序 V2</title>
<style>
  /* ===== 全局变量（柯达胶片配色） ===== */
  :root {
    --c-kodak: #F5A800;       /* 柯达黄 */
    --c-kodak-dim: #D49000;
    --c-dark: #211D19;        /* 暖黑 */
    --c-dark-2: #2E2822;
    --c-dark-3: #3A332C;
    --c-cream: #F7F1E3;       /* 奶白 */
    --c-cream-2: #EFE6D0;
    --c-cream-3: #E5D9BE;
    --c-safelight: #C0392B;   /* 安全灯红 */
    --c-safelight-dim: #A93226;
    --c-sage: #6B7A6F;        /* 灰绿 */
    --c-sage-dim: #556359;
    --c-text: #211D19;
    --c-text-light: #6B635A;
    --c-text-muted: #9A9287;
    --c-border: rgba(33, 29, 25, 0.1);
    --c-border-light: rgba(33, 29, 25, 0.06);
    --shadow-sm: 0 2px 8px rgba(33, 29, 25, 0.06);
    --shadow-md: 0 8px 24px rgba(33, 29, 25, 0.1);
    --shadow-lg: 0 16px 48px rgba(33, 29, 25, 0.15);
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --radius-xl: 28px;
    --font-sans: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
    --font-serif: "Noto Serif SC", "Songti SC", "Source Han Serif SC", serif;
    --font-mono: "SF Mono", "JetBrains Mono", Menlo, monospace;
    --safe-bottom: 34px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: var(--font-sans);
    background: #1a1612;
    color: var(--c-text);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  /* ===== 舞台背景 ===== */
  .stage {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(245, 168, 0, 0.08), transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(192, 57, 43, 0.06), transparent 50%),
      #1a1612;
    position: relative;
  }

  .stage::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 24px 24px;
    pointer-events: none;
  }

  /* ===== 手机外壳 ===== */
  .phone-shell {
    position: relative;
    width: 390px;
    height: 844px;
    background: #0c0a08;
    border-radius: 54px;
    padding: 12px;
    box-shadow:
      0 40px 80px rgba(0,0,0,0.5),
      0 0 0 2px rgba(255,255,255,0.03) inset;
  }

  .phone-frame {
    width: 100%;
    height: 100%;
    background: var(--c-cream);
    border-radius: 44px;
    overflow: hidden;
    position: relative;
  }

  /* 灵动岛 */
  .dynamic-island {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 124px;
    height: 36px;
    background: #000;
    border-radius: 20px;
    z-index: 500;
    pointer-events: none;
  }

  /* 状态栏 */
  .status-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 54px;
    padding: 18px 28px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 15px;
    font-weight: 600;
    z-index: 400;
    pointer-events: none;
    color: var(--c-dark);
  }

  .status-bar.dark { color: #fff; }
  .status-bar .time { font-variant-numeric: tabular-nums; font-weight: 600; }
  .status-bar .indicators { display: flex; gap: 6px; align-items: center; }
  .status-bar .signal, .status-bar .wifi, .status-bar .battery {
    height: 12px;
    display: flex;
    align-items: center;
  }
  .status-bar .battery {
    width: 24px;
    height: 12px;
    border: 1px solid currentColor;
    border-radius: 3px;
    position: relative;
    padding: 1.5px;
  }
  .status-bar .battery::after {
    content: "";
    position: absolute;
    right: -3px;
    top: 50%;
    transform: translateY(-50%);
    width: 2px;
    height: 5px;
    background: currentColor;
    border-radius: 0 1px 1px 0;
  }
  .status-bar .battery-fill {
    height: 100%;
    width: 80%;
    background: currentColor;
    border-radius: 1px;
  }

  /* ===== 小程序胶囊按钮 ===== */
  .wx-capsule {
    position: absolute;
    top: 58px;
    right: 16px;
    width: 88px;
    height: 32px;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 390;
  }
  .wx-capsule.dark {
    background: rgba(0,0,0,0.4);
    border-color: rgba(255,255,255,0.1);
    color: #fff;
  }
  .wx-capsule-icon {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--c-dark);
  }
  .wx-capsule.dark .wx-capsule-icon { color: #fff; }
  .wx-capsule-divider {
    width: 1px;
    height: 16px;
    background: rgba(0,0,0,0.1);
  }
  .wx-capsule.dark .wx-capsule-divider { background: rgba(255,255,255,0.15); }

  /* ===== 页面容器 ===== */
  .app-container {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
  }

  .page {
    position: absolute;
    inset: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--c-cream);
    will-change: transform;
  }

  .page-content {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    position: relative;
    scrollbar-width: none;
  }
  .page-content::-webkit-scrollbar { display: none; }

  /* 页面转场 */
  .page-enter {
    animation: pageEnter 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  .page-leave {
    animation: pageLeave 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  .page-back-enter {
    animation: pageBackEnter 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  .page-back-leave {
    animation: pageBackLeave 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }

  @keyframes pageEnter {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }
  @keyframes pageLeave {
    from { transform: translateX(0); }
    to { transform: translateX(-30%); opacity: 0.7; }
  }
  @keyframes pageBackEnter {
    from { transform: translateX(-30%); opacity: 0.7; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes pageBackLeave {
    from { transform: translateX(0); }
    to { transform: translateX(100%); }
  }

  /* ===== 底部 TabBar ===== */
  .tabbar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: calc(56px + var(--safe-bottom));
    padding-bottom: var(--safe-bottom);
    background: rgba(255, 253, 247, 0.92);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid var(--c-border-light);
    display: flex;
    z-index: 200;
  }
  .tabbar.dark {
    background: rgba(33, 29, 25, 0.92);
    border-top-color: rgba(255,255,255,0.06);
  }

  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    color: var(--c-text-muted);
    font-size: 10px;
    cursor: pointer;
    position: relative;
    transition: color 0.2s;
  }
  .tabbar.dark .tab-item { color: rgba(255,255,255,0.4); }
  .tab-item.active { color: var(--c-kodak); }
  .tab-item .tab-icon {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .tab-item.active .tab-icon {
    transform: scale(1.15) translateY(-2px);
  }
  .tab-item.active .tab-icon svg {
    filter: drop-shadow(0 2px 6px rgba(245, 168, 0, 0.4));
  }

  /* ===== 胶片齿孔动效 ===== */
  .film-perforations {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 10px;
    background:
      repeating-linear-gradient(
        to bottom,
        var(--c-dark) 0px,
        var(--c-dark) 8px,
        transparent 8px,
        transparent 16px
      );
    opacity: 0;
    pointer-events: none;
    z-index: 50;
  }
  .film-perforations.left { left: 0; }
  .film-perforations.right { right: 0; }

  /* ===== 自定义光标 ===== */
  .custom-cursor {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 24px;
    height: 24px;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    mix-blend-mode: difference;
  }
  .cursor-ring {
    position: absolute;
    inset: 0;
    border: 2px solid #fff;
    border-radius: 50%;
    transition: width 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                height 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.25s;
  }
  .cursor-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 6px;
    height: 6px;
    background: var(--c-kodak);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 12px var(--c-kodak), 0 0 24px rgba(245,168,0,0.5);
    transition: width 0.2s, height 0.2s;
  }
  .custom-cursor.hovering .cursor-ring {
    width: 40px;
    height: 40px;
    border-color: var(--c-kodak);
    mix-blend-mode: normal;
  }
  .custom-cursor.hovering .cursor-dot {
    width: 4px;
    height: 4px;
  }
  .cursor-ripple {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    border: 2px solid var(--c-kodak);
    transform: translate(-50%, -50%);
    opacity: 0;
    pointer-events: none;
  }
  .cursor-ripple.active {
    animation: cursorRipple 0.6s ease-out forwards;
  }
  @keyframes cursorRipple {
    0% { width: 0; height: 0; opacity: 0.8; border-width: 2px; }
    100% { width: 80px; height: 80px; opacity: 0; border-width: 1px; }
  }

  @media (pointer: coarse) {
    .custom-cursor { display: none; }
  }

  /* ===== 首页样式 ===== */
  .home-header {
    padding: 88px 20px 16px;
    background: linear-gradient(180deg, var(--c-kodak) 0%, #FFBE3D 60%, var(--c-cream) 100%);
    position: relative;
    overflow: hidden;
  }
  .home-header::before {
    content: "";
    position: absolute;
    top: -60px;
    right: -40px;
    width: 180px;
    height: 180px;
    background: radial-gradient(circle, rgba(192,57,43,0.3), transparent 70%);
    border-radius: 50%;
    filter: blur(20px);
  }
  .home-greeting {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
  }
  .home-greeting-text { line-height: 1.3; }
  .home-greeting-text .hello {
    font-size: 13px;
    color: rgba(33,29,25,0.6);
    font-weight: 500;
  }
  .home-greeting-text .name {
    font-size: 22px;
    font-weight: 700;
    color: var(--c-dark);
    font-family: var(--font-serif);
  }
  .home-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--c-dark);
    border: 2px solid rgba(255,255,255,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--c-kodak);
    font-weight: 700;
    font-size: 14px;
  }

  /* 搜索框 */
  .search-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 18px;
    position: relative;
    z-index: 1;
    border: 1px solid rgba(255,255,255,0.6);
  }
  .search-bar input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 14px;
    color: var(--c-dark);
    font-family: var(--font-sans);
  }
  .search-bar input::placeholder { color: var(--c-text-muted); }

  /* 功能宫格 */
  .home-quick-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 0 20px;
    margin-bottom: 24px;
    position: relative;
    z-index: 1;
  }
  .quick-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .quick-item:active { transform: scale(0.92); }
  .quick-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    box-shadow: 0 4px 12px rgba(33,29,25,0.08);
    transition: box-shadow 0.25s, transform 0.25s;
  }
  .quick-item:hover .quick-icon {
    box-shadow: 0 6px 20px rgba(245,168,0,0.3);
    transform: translateY(-2px);
  }
  .quick-label {
    font-size: 11px;
    color: var(--c-dark);
    font-weight: 500;
  }

  /* 轮播画廊 */
  .gallery-section { margin-bottom: 24px; }
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px;
    margin-bottom: 14px;
  }
  .section-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--c-dark);
    font-family: var(--font-serif);
  }
  .section-subtitle {
    font-size: 11px;
    color: var(--c-text-muted);
    margin-top: 2px;
  }
  .section-more {
    font-size: 12px;
    color: var(--c-kodak-dim);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 2px;
    cursor: pointer;
  }

  .carousel-wrap {
    padding: 0 20px;
    position: relative;
    overflow: hidden;
  }
  .carousel-track {
    display: flex;
    gap: 12px;
    transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .gallery-card {
    flex-shrink: 0;
    width: 260px;
    height: 340px;
    border-radius: var(--radius-lg);
    overflow: hidden;
    position: relative;
    cursor: pointer;
    box-shadow: var(--shadow-md);
    transition: transform 0.3s;
  }
  .gallery-card:active { transform: scale(0.98); }
  .gallery-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .gallery-card-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.7) 100%);
  }
  .gallery-card-info {
    position: absolute;
    bottom: 16px;
    left: 16px;
    right: 16px;
    color: #fff;
  }
  .gallery-card-tag {
    display: inline-block;
    padding: 3px 8px;
    background: var(--c-kodak);
    color: var(--c-dark);
    border-radius: 6px;
    font-size: 10px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .gallery-card-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .gallery-card-meta {
    font-size: 11px;
    opacity: 0.8;
    display: flex;
    gap: 10px;
  }
  .carousel-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 14px;
  }
  .carousel-dot {
    width: 6px;
    height: 6px;
    border-radius: 3px;
    background: var(--c-cream-3);
    transition: width 0.3s, background 0.3s;
  }
  .carousel-dot.active {
    width: 20px;
    background: var(--c-kodak);
  }

  /* 冲扫进度卡片流 */
  .progress-section { margin-bottom: 100px; }
  .progress-list {
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .progress-card {
    background: #fff;
    border-radius: var(--radius-md);
    padding: 16px;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: transform 0.25s, box-shadow 0.25s;
    position: relative;
    overflow: hidden;
  }
  .progress-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .progress-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 4px;
    background: var(--c-kodak);
  }
  .progress-card.status-developing::before { background: var(--c-kodak); }
  .progress-card.status-scanning::before { background: var(--c-sage); }
  .progress-card.status-done::before { background: var(--c-safelight); }
  .progress-card.status-waiting::before { background: var(--c-text-muted); }

  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }
  .progress-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--c-dark);
    margin-bottom: 2px;
  }
  .progress-order {
    font-size: 11px;
    color: var(--c-text-muted);
  }
  .progress-status {
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
  }
  .progress-status.developing { background: rgba(245,168,0,0.15); color: var(--c-kodak-dim); }
  .progress-status.scanning { background: rgba(107,122,111,0.15); color: var(--c-sage-dim); }
  .progress-status.done { background: rgba(192,57,43,0.12); color: var(--c-safelight); }
  .progress-status.waiting { background: rgba(154,146,135,0.15); color: var(--c-text-muted); }

  .progress-steps {
    display: flex;
    justify-content: space-between;
    position: relative;
  }
  .progress-step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex: 1;
    position: relative;
    z-index: 1;
  }
  .progress-step-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--c-cream-2);
    border: 2px solid var(--c-cream-3);
    position: relative;
    transition: all 0.3s;
  }
  .progress-step.done .progress-step-dot {
    background: var(--c-kodak);
    border-color: var(--c-kodak);
  }
  .progress-step.current .progress-step-dot {
    background: var(--c-kodak);
    border-color: #fff;
    box-shadow: 0 0 0 3px var(--c-kodak), 0 0 0 6px rgba(245,168,0,0.2);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 3px var(--c-kodak), 0 0 0 6px rgba(245,168,0,0.2); }
    50% { box-shadow: 0 0 0 3px var(--c-kodak), 0 0 0 10px rgba(245,168,0,0); }
  }
  .progress-step-label {
    font-size: 10px;
    color: var(--c-text-muted);
    white-space: nowrap;
  }
  .progress-step.done .progress-step-label,
  .progress-step.current .progress-step-label {
    color: var(--c-dark);
    font-weight: 500;
  }
  .progress-bar-track {
    position: absolute;
    top: 8px;
    left: 8%;
    right: 8%;
    height: 2px;
    background: var(--c-cream-2);
  }
  .progress-bar-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: var(--c-kodak);
    border-radius: 1px;
    transition: width 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* ===== 胶卷图鉴页 ===== */
  .catalog-page {
    background: var(--c-dark);
    color: #fff;
  }
  .catalog-header {
    padding: 60px 20px 0;
    position: relative;
  }
  .catalog-header-bg {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 260px;
    background:
      linear-gradient(180deg, #2a231b 0%, var(--c-dark) 100%);
  }
  .catalog-title {
    font-family: var(--font-serif);
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
    position: relative;
  }
  .catalog-subtitle {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 20px;
    position: relative;
  }

  .sticky-filter {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--c-dark);

      if (cursorRef.current) cursorRef.current.style.opacity = "1";
    };

    const onLeave = () => {
      visibleRef.current = false;
      if (cursorRef.current) cursorRef.current.style.opacity = "0";
    };

    const onClick = (e) => {
      if (!cursorRef.current) return;
      const ripple = cursorRef.current.querySelector(".cursor-ripple");
      if (ripple) {
        ripple.classList.remove("active");
        void ripple.offsetWidth;
        ripple.classList.add("active");
      }
    };

    // 检测可悬停元素
    const onOver = (e) => {
      const target = e.target;
      if (target.closest && (
        target.closest("button") ||
        target.closest(".progress-card") ||
        target.closest(".film-card") ||
        target.closest(".gallery-card") ||
        target.closest(".quick-item") ||
        target.closest(".filter-chip") ||
        target.closest(".form-row") ||
        target.closest(".process-option") ||
        target.closest(".roll-count-btn") ||
        target.closest(".tab-item") ||
        target.closest(".action-icon-btn") ||
        target.closest(".action-primary-btn") ||
        target.closest(".profile-grid-item") ||
        target.closest(".profile-list-item") ||
        target.closest(".sheet-item") ||
        target.closest(".sheet-cancel") ||
        target.closest(".nav-back-btn") ||
        target.closest(".api-tab") ||
        target.closest(".section-more") ||
        target.closest(".color-chip")
      )) {
        hoveringRef.current = true;
        if (cursorRef.current) cursorRef.current.classList.add("hovering");
      } else {
        hoveringRef.current = false;
        if (cursorRef.current) cursorRef.current.classList.remove("hovering");
      }
    };

    const animate = () => {
      if (!cursorRef.current) {
        rafRef.current = requestAnimationFrame(animate);
        return;
      }
      const t = targetRef.current;
      const c = currentRef.current;
      c.x += (t.x - c.x) * 0.2;
      c.y += (t.y - c.y) * 0.2;
      cursorRef.current.style.transform = `translate(${c.x}px, ${c.y}px) translate(-50%, -50%)`;
      rafRef.current = requestAnimationFrame(animate);
    };

    container.addEventListener("mousemove", onMove);
    container.addEventListener("mouseenter", onEnter);
    container.addEventListener("mouseleave", onLeave);
    container.addEventListener("mousedown", onClick);
    container.addEventListener("mouseover", onOver);

    rafRef.current = requestAnimationFrame(animate);

    return () => {
      container.removeEventListener("mousemove", onMove);
      container.removeEventListener("mouseenter", onEnter);
      container.removeEventListener("mouseleave", onLeave);
      container.removeEventListener("mousedown", onClick);
      container.removeEventListener("mouseover", onOver);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [containerRef]);

  return cursorRef;
}

const ProfilePage = ({ onNavigate, showTabBar }) => {
  const [ringProgress, setRingProgress] = useState(0);
  const [rollsCount, setRollsCount] = useState(0);
  const scrollRef = useRef(null);
  const rafRef = useRef(null);

  // 环形进度数字计数动画
  useEffect(() => {
    const timer = setTimeout(() => {
      setRingProgress(68);
      // 数字计数
      let start = 0;
      const end = 24;
      const duration = 1500;
      const startTime = performance.now();
      const animate = (now) => {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        setRollsCount(Math.floor(start + (end - start) * eased));
        if (progress < 1) rafRef.current = requestAnimationFrame(animate);
      };
      rafRef.current = requestAnimationFrame(animate);
    }, 300);
    return () => {
      clearTimeout(timer);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, []);

/* ===== 主 App 组件 ===== */
const App = () => {
  const phoneRef = useRef(null);
  const cursorRef = useCustomCursor(phoneRef);
  const [pageStack, setPageStack] = useState([
    { key: "home", dir: "forward" }
  ]);
  const [toast, setToast] = useState({ visible: false, text: "", icon: "check" });
  const toastTimerRef = useRef(null);
  const [transitioning, setTransitioning] = useState(false);

  const currentPage = pageStack[pageStack.length - 1]?.key || "home";

  const showToast = useCallback((text: string, icon = "check") => {
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    setToast({ visible: true, text, icon });
    toastTimerRef.current = window.setTimeout(() => {
      setToast(t => ({ ...t, visible: false }));
    }, 1800);
  }, []);

  const navigate = useCallback((target: string) => {
    if (transitioning) return;

    // TabBar 页面之间切换（重置栈）
    const tabPages = ["home", "catalog", "booking", "profile"];
    if (tabPages.includes(target)) {
      setTransitioning(true);
      setPageStack([{ key: target, dir: "forward" }]);
      setTimeout(() => setTransitioning(false), 350);
      return;
    }

    // 推入新页面
    setTransitioning(true);
    setPageStack(prev => [...prev, { key: target, dir: "forward" }]);
    setTimeout(() => setTransitioning(false), 350);
  }, [transitioning]);

  const goBack = useCallback(() => {
    if (transitioning) return;
    if (pageStack.length <= 1) return;
    setTransitioning(true);
    setPageStack(prev => {
      const newStack = [...prev];
      newStack[newStack.length - 1] = { ...newStack[newStack.length - 1], dir: "back" };
      newStack.pop();
      if (newStack.length > 0) {
        newStack[newStack.length - 1] = { ...newStack[newStack.length - 1], dir: "back" };
      }
      return [...newStack, prev[prev.length - 1]]; // 临时保留旧页做退场动画
    });
    setTimeout(() => {
      setPageStack(prev => prev.slice(0, -1));
      setTransitioning(false);
    }, 350);
  }, [pageStack.length, transitioning]);

  // 当前页是否显示 TabBar
  const currentShowTabBar = ["home", "catalog", "booking", "profile"].includes(currentPage);

  const renderPage = (pageKey: string, isTop: boolean, dir: string) => {
    const showTab = isTop && currentShowTabBar;
    switch (pageKey) {
      case "home":
        return <HomePage onNavigate={navigate} showTabBar={showTab} />;
      case "catalog":
        return <CatalogPage onNavigate={navigate} showTabBar={showTab} />;
      case "booking":
        return <BookingPage onNavigate={navigate} showTabBar={showTab} onToast={showToast} />;
      case "detail":
        return <DetailPage onNavigate={navigate} onBack={goBack} />;
      case "profile":
        return <ProfilePage onNavigate={navigate} showTabBar={showTab} />;
      case "progressDetail":
        return <ProgressDetailPage onBack={goBack} onToast={showToast} />;
      case "design":
        return <DesignPage onBack={goBack} />;
      case "api":
        return <ApiPage onBack={goBack} />;
      default:
        return <HomePage onNavigate={navigate} showTabBar={showTab} />;
    }
  };

  return (
    <div className="stage">
      <div className="phone-shell" ref={phoneRef}>
        {/* 自定义光标 */}
        <div className="custom-cursor" ref={cursorRef} style={{ opacity: 0, position: "absolute", top: 0, left: 0 }}>
          <div className="cursor-ring"></div>
          <div className="cursor-dot"></div>
          <div className="cursor-ripple"></div>
        </div>

        <div className="phone-frame">
          <div className="dynamic-island"></div>

          <div className="app-container">
            {pageStack.map((p, i) => {
              const isTop = i === pageStack.length - 1;
              const isSecondTop = i === pageStack.length - 2;
              // 转场逻辑：顶层页入场，退栈时顶层旧页退场
              let transitionClass = "";
              if (isTop && p.dir === "forward" && i > 0) transitionClass = "page-enter";
              if (isTop && p.dir === "back" && i > 0) transitionClass = "page-back-leave";

              return (
                <div key={`${p.key}-${i}`}
                  className={`page ${transitionClass}`}
                  style={{
                    zIndex: isTop ? 10 : isSecondTop ? 5 : 1,
                    pointerEvents: isTop && !transitioning ? "auto" : "none",
                  }}>
                  {renderPage(p.key, isTop, p.dir)}
                </div>
              );
            })}
          </div>

          <Toast visible={toast.visible} text={toast.text} icon={toast.icon} />
        </div>
      </div>
    </div>
  );
};

/* ===== 渲染 ===== */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

// 宣告可升级
function announceUpgrade() {
  window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
}
announceUpgrade();
if (document.readyState !== 'complete') window.addEventListener('load', announceUpgrade, { once: true });
</script>
</body>
</html>

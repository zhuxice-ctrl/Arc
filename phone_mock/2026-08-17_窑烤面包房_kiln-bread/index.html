<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>窑烤面包房 · 微信小程序原型</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" />
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --cream: #F7F0E4;
      --cream-deep: #EDE2CE;
      --cream-dim: #F2E8D6;
      --caramel: #C98850;
      --caramel-deep: #B5773F;
      --caramel-light: #DBA876;
      --coffee: #4A3226;
      --coffee-deep: #362418;
      --coffee-soft: #6B4D3D;
      --pistachio: #7A8B5A;
      --pistachio-deep: #637247;
      --pistachio-light: #9AAA78;
      --terracotta: #A65A3E;
      --terracotta-deep: #8A462E;
      --terracotta-light: #C47458;
      --wheat: #E8D4A8;
      --ink: #3A2A1F;
      --ink-soft: #7A6A5E;
      --ink-dim: #B8AFA6;
      --surface: #FFFBF3;
      --shadow-sm: 0 2px 8px rgba(74, 50, 38, 0.08);
      --shadow-md: 0 8px 24px rgba(74, 50, 38, 0.12);
      --shadow-lg: 0 16px 48px rgba(74, 50, 38, 0.18);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 22px;
      --radius-xl: 32px;
      --font-display: 'Noto Serif SC', serif;
      --font-body: 'Noto Sans SC', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: var(--font-body); color: var(--ink); background: var(--cream); }
    body { cursor: none; user-select: none; }

    /* Page container - showroom */
    .showroom {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(201, 136, 80, 0.15), transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(122, 139, 90, 0.12), transparent 50%),
        linear-gradient(135deg, #F7F0E4 0%, #EDE2CE 100%);
      position: relative;
      overflow: hidden;
    }
    .showroom::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(74, 50, 38, 0.04) 1px, transparent 0);
      background-size: 24px 24px;
      pointer-events: none;
    }
    .showroom-title {
      position: absolute;
      top: 40px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 5;
    }
    .showroom-title h1 {
      font-family: var(--font-display);
      font-size: 28px;
      color: var(--coffee);
      font-weight: 700;
      letter-spacing: 4px;
    }
    .showroom-title p {
      font-size: 13px;
      color: var(--ink-soft);
      margin-top: 6px;
      letter-spacing: 2px;
    }
    .showroom-footer {
      position: absolute;
      bottom: 30px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 5;
      font-size: 12px;
      color: var(--ink-dim);
    }

    /* Phone frame */
    .phone-frame {
      width: 375px;
      height: 812px;
      background: #1a1a1a;
      border-radius: 54px;
      padding: 12px;
      box-shadow:
        0 40px 80px rgba(74, 50, 38, 0.25),
        0 10px 30px rgba(74, 50, 38, 0.15),
        inset 0 0 0 2px rgba(255, 255, 255, 0.08);
      position: relative;
      z-index: 2;
    }
    .phone-screen {
      width: 100%;
      height: 100%;
      background: var(--cream);
      border-radius: 42px;
      overflow: hidden;
      position: relative;
    }

    /* Status bar */
    .status-bar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      position: relative;
      z-index: 100;
      flex-shrink: 0;
    }
    .status-bar.dark { color: #fff; }
    .status-bar .right-icons {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
    }

    /* Navigation bar with capsule */
    .nav-bar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: relative;
      z-index: 90;
      flex-shrink: 0;
    }
    .nav-bar .nav-title {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 600;
      color: var(--ink);
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }
    .nav-bar.dark .nav-title { color: #fff; }
    .nav-bar .nav-back {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: none;
    }
    .capsule {
      width: 88px;
      height: 32px;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      border: 0.5px solid rgba(255, 255, 255, 0.4);
    }
    .capsule.dark-bg {
      background: rgba(74, 50, 38, 0.25);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .capsule button {
      background: none;
      border: none;
      color: var(--ink);
      font-size: 14px;
      cursor: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 24px;
    }
    .capsule.dark-bg button { color: #fff; }
    .capsule .divider {
      width: 0.5px;
      height: 16px;
      background: rgba(74, 50, 38, 0.2);
    }
    .capsule.dark-bg .divider { background: rgba(255, 255, 255, 0.3); }

    /* Page container */
    .page-wrap {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .page-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .page-content::-webkit-scrollbar { display: none; }

    /* Page transition */
    .page-enter {
      animation: pagePushIn 380ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .page-exit {
      animation: pagePushOut 380ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes pagePushIn {
      from { transform: translateX(100%); opacity: 0.8; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes pagePushOut {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(-30%); opacity: 0.6; }
    }
    .page-back-enter {
      animation: pageBackIn 380ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes pageBackIn {
      from { transform: translateX(-30%); opacity: 0.6; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* Tab bar */
    .tab-bar {
      height: 64px;
      background: rgba(255, 251, 243, 0.95);
      backdrop-filter: blur(20px);
      border-top: 0.5px solid rgba(74, 50, 38, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding-bottom: 8px;
      flex-shrink: 0;
      position: relative;
      z-index: 50;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: none;
      padding: 6px 12px;
      position: relative;
    }
    .tab-item svg {
      width: 24px;
      height: 24px;
      stroke: var(--ink-dim);
      stroke-width: 1.8;
      fill: none;
      transition: stroke 0.3s;
    }
    .tab-item.active svg { stroke: var(--caramel); }
    .tab-item span {
      font-size: 10px;
      color: var(--ink-dim);
      transition: all 0.3s;
    }
    .tab-item.active span {
      color: var(--caramel);
      font-weight: 500;
      transform: scale(1.05);
    }
    .tab-item .tab-dot {
      position: absolute;
      top: 4px;
      width: 4px;
      height: 4px;
      background: var(--terracotta);
      border-radius: 50%;
      opacity: 0;
      transform: scale(0);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .tab-item.active .tab-dot {
      opacity: 1;
      transform: scale(1);
    }

    /* ===== Home Page ===== */
    .home-hero {
      position: relative;
      padding: 0 20px 20px;
      background: linear-gradient(180deg, var(--cream-deep) 0%, var(--cream) 100%);
    }
    .hero-banner {
      position: relative;
      height: 180px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-md);
      animation: heroFadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
    }
    .hero-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .hero-banner::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(74, 50, 38, 0.3) 0%, rgba(74, 50, 38, 0) 60%);
    }
    .hero-banner-text {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      z-index: 2;
    }
    .hero-banner-text h2 {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    .hero-banner-text p {
      font-size: 12px;
      opacity: 0.9;
    }
    .hero-banner-badge {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      color: var(--coffee);
      font-weight: 500;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .hero-banner-badge .fire-dot {
      width: 6px;
      height: 6px;
      background: var(--terracotta);
      border-radius: 50%;
      animation: firePulse 2s ease-in-out infinite;
    }
    @keyframes firePulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(166, 90, 62, 0.6); }
      50% { box-shadow: 0 0 0 6px rgba(166, 90, 62, 0); }
    }
    @keyframes heroFadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .home-greeting {
      padding: 20px 20px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: heroFadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both;
    }
    .home-greeting h1 {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: var(--coffee);
    }
    .home-greeting .date-tag {
      font-size: 11px;
      color: var(--ink-soft);
      background: rgba(201, 136, 80, 0.12);
      padding: 4px 10px;
      border-radius: 12px;
    }

    /* Today's schedule - timeline */
    .today-section {
      padding: 0 20px 20px;
      animation: heroFadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .section-title {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      color: var(--coffee);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::before {
      content: '';
      width: 3px;
      height: 16px;
      background: var(--caramel);
      border-radius: 2px;
    }
    .section-more {
      font-size: 12px;
      color: var(--ink-soft);
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .schedule-timeline {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .schedule-timeline::-webkit-scrollbar { display: none; }
    .schedule-card {
      flex-shrink: 0;
      width: 130px;
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 12px;
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: none;
    }
    .schedule-card:active { transform: scale(0.96); }
    .schedule-card .time {
      font-size: 11px;
      color: var(--caramel-deep);
      font-weight: 600;
      margin-bottom: 6px;
    }
    .schedule-card .name {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .schedule-card .status {
      display: inline-block;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 8px;
      margin-top: 4px;
    }
    .status.hot { background: rgba(166, 90, 62, 0.12); color: var(--terracotta); }
    .status.soon { background: rgba(201, 136, 80, 0.15); color: var(--caramel-deep); }
    .status.soldout { background: rgba(122, 106, 94, 0.12); color: var(--ink-soft); }
    .schedule-card .heat-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--cream-dim);
    }
    .schedule-card .heat-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--caramel), var(--terracotta));
      border-radius: 0 3px 0 0;
      transition: width 1.5s cubic-bezier(0.22, 1, 0.36, 1) 0.5s;
    }

    /* Category grid - staggered */
    .category-section {
      padding: 0 20px 20px;
      animation: heroFadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
    }
    .category-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .cat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: none;
    }
    .cat-icon {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .cat-item:active .cat-icon { transform: scale(0.9) rotate(-5deg); }
    .cat-icon.c1 { background: linear-gradient(135deg, #F5E1C8, #E8C9A0); }
    .cat-icon.c2 { background: linear-gradient(135deg, #D8E2C0, #B8C89A); }
    .cat-icon.c3 { background: linear-gradient(135deg, #E8C4B4, #D4A58E); }
    .cat-icon.c4 { background: linear-gradient(135deg, #E8D8B8, #D4C090); }
    .cat-icon.c5 { background: linear-gradient(135deg, #C8D4C0, #A8BC98); }
    .cat-icon.c6 { background: linear-gradient(135deg, #E8C8C0, #D4A090); }
    .cat-icon.c7 { background: linear-gradient(135deg, #D8C8E0, #B8A0C8); }
    .cat-icon.c8 { background: linear-gradient(135deg, #E0D8C0, #C8B890); }
    .cat-item span {
      font-size: 11px;
      color: var(--ink-soft);
    }

    /* Featured breads - stacked card layout */
    .featured-section {
      padding: 0 20px 24px;
      animation: heroFadeUp 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.4s both;
    }
    .featured-stack {
      position: relative;
      height: 260px;
    }
    .featured-card {
      position: absolute;
      left: 0;
      right: 0;
      background: var(--surface);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-md);
      transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: none;
    }
    .featured-card:nth-child(1) { top: 0; z-index: 3; transform: scale(1); }
    .featured-card:nth-child(2) { top: 12px; z-index: 2; transform: scale(0.95); opacity: 0.8; }
    .featured-card:nth-child(3) { top: 24px; z-index: 1; transform: scale(0.9); opacity: 0.5; }
    .featured-card .fc-img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
    }
    .featured-card .fc-body {
      padding: 14px 16px;
    }
    .featured-card .fc-name {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      color: var(--coffee);
      margin-bottom: 4px;
    }
    .featured-card .fc-desc {
      font-size: 12px;
      color: var(--ink-soft);
      line-height: 1.5;
    }
    .featured-card .fc-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
    .featured-card .fc-price {
      font-family: var(--font-display);
      font-size: 18px;
      color: var(--terracotta);
      font-weight: 700;
    }
    .featured-card .fc-price small { font-size: 11px; font-weight: 400; }
    .featured-card .fc-btn {
      background: var(--coffee);
      color: #fff;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 16px;
      border: none;
      cursor: none;
      transition: transform 0.2s;
    }
    .featured-card .fc-btn:active { transform: scale(0.95); }

    /* ===== Category Page (sticky filter tabs) ===== */
    .category-page-header {
      position: sticky;
      top: 0;
      z-index: 80;
      background: var(--cream);
    }
    .sticky-tabs {
      display: flex;
      gap: 4px;
      padding: 8px 16px 12px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 0.5px solid rgba(74, 50, 38, 0.08);
    }
    .sticky-tabs::-webkit-scrollbar { display: none; }
    .tab-chip {
      flex-shrink: 0;
      padding: 7px 16px;
      font-size: 13px;
      color: var(--ink-soft);
      background: rgba(74, 50, 38, 0.06);
      border-radius: 18px;
      transition: all 0.3s;
      cursor: none;
      white-space: nowrap;
    }
    .tab-chip.active {
      background: var(--coffee);
      color: var(--cream);
      font-weight: 500;
    }

    .product-waterfall {
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .product-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      cursor: none;
      transition: transform 0.3s;
      animation: cardPopIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes cardPopIn {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .product-card:active { transform: scale(0.97); }
    .product-card .pc-img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
    }
    .product-card.tall .pc-img { height: 170px; }
    .product-card .pc-info { padding: 10px 12px; }
    .product-card .pc-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 2px;
    }
    .product-card .pc-tag {
      display: inline-block;
      font-size: 10px;
      color: var(--pistachio-deep);
      background: rgba(122, 139, 90, 0.15);
      padding: 2px 6px;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .product-card .pc-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .product-card .pc-price {
      font-size: 15px;
      color: var(--terracotta);
      font-weight: 600;
      font-family: var(--font-display);
    }
    .product-card .pc-add {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--coffee);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      line-height: 1;
    }

    /* Pull to refresh indicator */
    .pull-indicator {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      color: var(--ink-soft);
      height: 0;
      overflow: hidden;
      transition: height 0.3s;
    }
    .pull-indicator.show { height: 50px; }
    .pull-indicator .pull-icon {
      display: inline-block;
      transition: transform 0.3s;
    }
    .pull-indicator.spinning .pull-icon {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Skeleton */
    .skeleton-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      overflow: hidden;
      animation: skeletonPulse 1.5s ease-in-out infinite;
    }
    @keyframes skeletonPulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    .skeleton-img {
      width: 100%;
      height: 140px;
      background: linear-gradient(90deg, var(--cream-dim), var(--cream-deep), var(--cream-dim));
      background-size: 200% 100%;
      animation: skeletonShimmer 1.5s linear infinite;
    }
    @keyframes skeletonShimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .skeleton-line {
      height: 12px;
      background: var(--cream-dim);
      border-radius: 6px;
      margin: 8px 12px;
    }
    .skeleton-line.short { width: 60%; }

    /* ===== Detail Page ===== */
    .detail-hero {
      position: relative;
      height: 340px;
      overflow: hidden;
    }
    .detail-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      will-change: transform;
    }
    .detail-hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(74,50,38,0) 50%, rgba(74,50,38,0.6) 100%);
    }
    .detail-back {
      position: absolute;
      top: 50px;
      left: 16px;
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.3);
      backdrop-filter: blur(10px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      cursor: none;
      color: #fff;
    }
    .detail-share {
      position: absolute;
      top: 50px;
      right: 112px;
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.3);
      backdrop-filter: blur(10px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      cursor: none;
      color: #fff;
    }

    .detail-body {
      background: var(--cream);
      border-radius: 28px 28px 0 0;
      margin-top: -28px;
      position: relative;
      z-index: 5;
      padding: 24px 20px 100px;
    }
    .detail-title {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 700;
      color: var(--coffee);
      margin-bottom: 6px;
    }
    .detail-subtitle {
      font-size: 13px;
      color: var(--ink-soft);
      margin-bottom: 14px;
    }
    .detail-price-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 20px;
    }
    .detail-price {
      font-family: var(--font-display);
      font-size: 32px;
      color: var(--terracotta);
      font-weight: 700;
    }
    .detail-price small { font-size: 14px; font-weight: 400; }
    .detail-orig-price {
      font-size: 13px;
      color: var(--ink-dim);
      text-decoration: line-through;
    }
    .detail-badge-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .detail-badge {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 10px;
    }
    .detail-badge.b1 { background: rgba(166, 90, 62, 0.1); color: var(--terracotta); }
    .detail-badge.b2 { background: rgba(122, 139, 90, 0.12); color: var(--pistachio-deep); }
    .detail-badge.b3 { background: rgba(201, 136, 80, 0.12); color: var(--caramel-deep); }

    .detail-section {
      margin-bottom: 24px;
    }
    .detail-section h3 {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      color: var(--coffee);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .detail-section h3::before {
      content: '';
      width: 3px;
      height: 14px;
      background: var(--caramel);
      border-radius: 2px;
    }
    .detail-section p {
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 1.8;
    }
    .detail-meta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .detail-meta {
      text-align: center;
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 12px 6px;
    }
    .detail-meta .num {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 600;
      color: var(--coffee);
    }
    .detail-meta .lbl {
      font-size: 10px;
      color: var(--ink-soft);
      margin-top: 2px;
    }

    .spec-list {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 4px 16px;
    }
    .spec-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 0.5px solid rgba(74, 50, 38, 0.06);
      font-size: 13px;
    }
    .spec-row:last-child { border-bottom: none; }
    .spec-row .k { color: var(--ink-soft); }
    .spec-row .v { color: var(--ink); font-weight: 500; }

    /* Bottom safe area bar */
    .detail-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 0.5px solid rgba(74, 50, 38, 0.08);
      padding: 10px 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
      box-shadow: 0 -4px 20px rgba(74, 50, 38, 0.08);
    }
    .bottom-icon-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: none;
      padding: 4px 8px;
    }
    .bottom-icon-btn svg { width: 22px; height: 22px; stroke: var(--ink-soft); stroke-width: 1.5; fill: none; }
    .bottom-icon-btn span { font-size: 10px; color: var(--ink-soft); }
    .qty-control {
      display: flex;
      align-items: center;
      background: var(--cream-dim);
      border-radius: 20px;
      padding: 4px;
    }
    .qty-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--coffee);
      cursor: none;
    }
    .qty-num {
      width: 28px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
    }
    .bottom-cta {
      flex: 1;
      height: 44px;
      background: linear-gradient(135deg, var(--terracotta), var(--caramel-deep));
      border: none;
      border-radius: 22px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: none;
      box-shadow: 0 4px 12px rgba(166, 90, 62, 0.3);
      transition: transform 0.2s;
    }
    .bottom-cta:active { transform: scale(0.97); }

    /* ===== Class Page ===== */
    .class-header {
      position: relative;
      height: 220px;
      overflow: hidden;
    }
    .class-header img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .class-header::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(74,50,38,0.7) 0%, rgba(122, 139, 90, 0.4) 100%);
    }
    .class-header-content {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 60px 20px 24px;
      color: #fff;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .class-header h1 {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .class-header p {
      font-size: 13px;
      opacity: 0.85;
      margin-top: 4px;
    }
    .class-header .stats-row {
      display: flex;
      gap: 16px;
      font-size: 12px;
    }
    .class-header .stat {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .class-list-section {
      padding: 20px;
      background: var(--cream);
      border-radius: 24px 24px 0 0;
      margin-top: -20px;
      position: relative;
      z-index: 3;
      min-height: calc(100% - 200px);
    }
    .class-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 8px;
    }
    .class-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      cursor: none;
      display: flex;
      transition: transform 0.3s, box-shadow 0.3s;
      position: relative;
    }
    .class-card:active {
      transform: scale(0.98);
      box-shadow: var(--shadow-sm);
    }
    .class-card .cc-img {
      width: 110px;
      height: 130px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .class-card .cc-body {
      padding: 12px 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .class-card .cc-tag {
      display: inline-block;
      font-size: 10px;
      background: rgba(122, 139, 90, 0.15);
      color: var(--pistachio-deep);
      padding: 2px 8px;
      border-radius: 8px;
      margin-bottom: 6px;
    }
    .class-card .cc-name {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      color: var(--coffee);
      margin-bottom: 4px;
    }
    .class-card .cc-meta {
      font-size: 11px;
      color: var(--ink-soft);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .class-card .cc-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
    .class-card .cc-price {
      font-family: var(--font-display);
      font-size: 17px;
      color: var(--terracotta);
      font-weight: 700;
    }
    .class-card .cc-price small { font-size: 11px; font-weight: 400; }
    .class-card .cc-signup {
      background: var(--coffee);
      color: #fff;
      font-size: 11px;
      padding: 5px 12px;
      border-radius: 14px;
      border: none;
      cursor: none;
    }
    .class-card .cc-hot {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--terracotta);
      color: #fff;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 8px;
      font-weight: 500;
    }

    /* Floating action ball */
    .fab {
      position: absolute;
      right: 20px;
      bottom: 90px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--terracotta), var(--caramel-deep));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 8px 24px rgba(166, 90, 62, 0.4);
      z-index: 20;
      cursor: none;
      animation: fabFloat 3s ease-in-out infinite;
    }
    @keyframes fabFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .fab::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid rgba(166, 90, 62, 0.3);
      animation: fabPulse 2s ease-out infinite;
    }
    @keyframes fabPulse {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    /* ===== Member / Ticket Page ===== */
    .member-header {
      background: linear-gradient(180deg, var(--coffee) 0%, var(--coffee-deep) 100%);
      padding: 20px 20px 40px;
      position: relative;
      overflow: hidden;
    }
    .member-header::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(201, 136, 80, 0.15);
    }
    .member-header::after {
      content: '';
      position: absolute;
      bottom: -40px;
      left: -40px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(122, 139, 90, 0.12);
    }
    .member-top {
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
      z-index: 2;
    }
    .member-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.3);
      overflow: hidden;
    }
    .member-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .member-info h2 {
      font-family: var(--font-display);
      font-size: 20px;
      color: #fff;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .member-info .member-level {
      display: inline-block;
      font-size: 11px;
      background: rgba(201, 136, 80, 0.3);
      color: var(--wheat);
      padding: 2px 10px;
      border-radius: 10px;
      border: 0.5px solid rgba(201, 136, 80, 0.5);
    }

    .member-stats-row {
      display: flex;
      justify-content: space-around;
      margin-top: 24px;
      position: relative;
      z-index: 2;
    }
    .member-stat {
      text-align: center;
      color: #fff;
    }
    .member-stat .num {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
    }
    .member-stat .lbl {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 2px;
    }

    /* Ticket carousel */
    .ticket-section {
      padding: 0 16px;
      margin-top: -20px;
      position: relative;
      z-index: 5;
    }
    .ticket-card {
      background: linear-gradient(135deg, var(--caramel) 0%, var(--terracotta) 100%);
      border-radius: var(--radius-lg);
      padding: 20px;
      color: #fff;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
      min-height: 140px;
    }
    .ticket-card::before {
      content: '';
      position: absolute;
      left: 70px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      background: var(--coffee);
      border-radius: 50%;
      box-shadow: 0 150px 0 var(--coffee);
    }
    .ticket-card::after {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 100%;
      height: 0.5px;
      border-top: 2px dashed rgba(255,255,255,0.3);
    }
    .ticket-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 12px;
      border-bottom: 1px dashed rgba(255,255,255,0.2);
      margin-bottom: 12px;
    }
    .ticket-type {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 600;
    }
    .ticket-count {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 700;
    }
    .ticket-count small { font-size: 12px; font-weight: 400; opacity: 0.8; }
    .ticket-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      opacity: 0.9;
    }
    .ticket-bottom .expire { opacity: 0.8; }
    .ticket-use-btn {
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 500;
    }

    /* Ring progress */
    .ring-progress-section {
      padding: 20px 16px;
    }
    .ring-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .ring-container {
      position: relative;
      width: 80px;
      height: 80px;
      flex-shrink: 0;
    }
    .ring-container svg { transform: rotate(-90deg); }
    .ring-bg { fill: none; stroke: var(--cream-dim); stroke-width: 6; }
    .ring-fill {
      fill: none;
      stroke: url(#ringGradient);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 220;
      stroke-dashoffset: 66;
      transition: stroke-dashoffset 2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .ring-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .ring-text .pct {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      color: var(--coffee);
    }
    .ring-text .lbl {
      font-size: 9px;
      color: var(--ink-soft);
    }
    .ring-info h3 {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      color: var(--coffee);
      margin-bottom: 4px;
    }
    .ring-info p {
      font-size: 12px;
      color: var(--ink-soft);
      line-height: 1.6;
    }
    .ring-info .next-tip {
      margin-top: 6px;
      font-size: 11px;
      color: var(--caramel-deep);
    }

    /* Service grid */
    .service-section {
      padding: 0 16px 24px;
    }
    .service-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px 8px;
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 20px 10px;
      box-shadow: var(--shadow-sm);
    }
    .service-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: none;
    }
    .service-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(201, 136, 80, 0.12);
    }
    .service-icon svg { width: 20px; height: 20px; stroke: var(--caramel-deep); stroke-width: 1.8; fill: none; }
    .service-item span {
      font-size: 11px;
      color: var(--ink-soft);
    }

    /* Order list with swipe actions */
    .order-section {
      padding: 0 16px 24px;
    }
    .order-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .order-item {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 14px;
      box-shadow: var(--shadow-sm);
      cursor: none;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s;
    }
    .order-item.swipe-left { transform: translateX(-80px); }
    .order-swipe-actions {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      display: flex;
      transform: translateX(80px);
    }
    .order-swipe-btn {
      width: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #fff;
    }
    .order-swipe-btn.delete { background: var(--terracotta); }
    .order-swipe-btn.more { background: var(--caramel); }
    .order-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 12px;
    }
    .order-id { color: var(--ink-soft); }
    .order-status { color: var(--pistachio-deep); font-weight: 500; }
    .order-content {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .order-content img {
      width: 54px;
      height: 54px;
      border-radius: 10px;
      object-fit: cover;
    }
    .order-item-info { flex: 1; }
    .order-item-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 2px;
    }
    .order-item-spec { font-size: 11px; color: var(--ink-soft); }
    .order-total {
      font-size: 14px;
      color: var(--terracotta);
      font-weight: 600;
      font-family: var(--font-display);
      text-align: right;
    }

    /* ===== Profile / Personal Center Page ===== */
    .profile-hero {
      background: linear-gradient(180deg, #3A2A1F 0%, var(--coffee) 70%, var(--cream) 100%);
      padding: 20px 20px 80px;
      position: relative;
      overflow: hidden;
    }
    .profile-hero-bg {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 220px;
      opacity: 0.2;
    }
    .profile-hero-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(2px);
    }
    .profile-top {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .profile-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.4);
      overflow: hidden;
      position: relative;
    }
    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .profile-avatar::after {
      content: '';
      position: absolute;
      inset: -6px;
      border: 2px solid rgba(201, 136, 80, 0.5);
      border-radius: 50%;
      border-top-color: transparent;
      border-right-color: transparent;
      animation: avatarSpin 8s linear infinite;
    }
    @keyframes avatarSpin {
      to { transform: rotate(360deg); }
    }
    .profile-info h2 {
      font-family: var(--font-display);
      font-size: 22px;
      color: #fff;
      font-weight: 600;
    }
    .profile-info .profile-id {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      margin-top: 4px;
    }
    .profile-info .profile-badges {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .profile-badge {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 8px;

    // Custom cursor
    const initCursor = () => {
      const cursor = document.getElementById('customCursor');
      if (!cursor) return;

      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      let cursorX = mouseX;
      let cursorY = mouseY;
      let rafId = null;
      let hidden = false;

      const animate = () => {
        cursorX += (mouseX - cursorX) * 0.2;
        cursorY += (mouseY - cursorY) * 0.2;
        cursor.style.transform = `translate(${cursorX}px, ${cursorY}px) translate(-50%, -50%)`;
        if (!hidden && Math.abs(mouseX - cursorX) > 0.5) {
          rafId = requestAnimationFrame(animate);
        } else {
          rafId = null;
        }
      };

      const onMove = (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        if (!rafId) rafId = requestAnimationFrame(animate);
      };

      const onOver = (e) => {
        const t = e.target.closest('button, .tab-item, .cat-item, .schedule-card, .featured-card, .product-card, .class-card, .order-item, .service-item, .quick-item, .profile-list-item, .api-item-header, .action-sheet-item, .action-sheet-cancel, .tab-chip, .page-nav-dot, .bottom-icon-btn, .qty-btn, .bottom-cta, .list-arrow');
        if (t) {
          cursor.classList.add('hover');
        } else {
          cursor.classList.remove('hover');
        }
      };

      const onDown = (e) => {
        cursor.classList.add('clicking');
        const ripple = document.createElement('div');
        ripple.className = 'cursor-ripple';
        ripple.style.left = e.clientX + 'px';
        ripple.style.top = e.clientY + 'px';
        ripple.style.width = '24px';
        ripple.style.height = '24px';
        document.body.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
      };

      const onUp = () => cursor.classList.remove('clicking');
      const onLeave = () => { hidden = true; cursor.style.opacity = '0'; if (rafId) cancelAnimationFrame(rafId); };
      const onEnter = () => { hidden = false; cursor.style.opacity = '1'; };

      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseover', onOver);
      window.addEventListener('mousedown', onDown);
      window.addEventListener('mouseup', onUp);
      document.addEventListener('mouseleave', onLeave);
      document.addEventListener('mouseenter', onEnter);

      return () => {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseover', onOver);
        window.removeEventListener('mousedown', onDown);
        window.removeEventListener('mouseup', onUp);
        document.removeEventListener('mouseleave', onLeave);
        document.removeEventListener('mouseenter', onEnter);
        if (rafId) cancelAnimationFrame(rafId);
      };
    };

              response: `{
  "code": 0,
  "data": [
    { "id": 1, "type": "月票", "count": 6 }
  ]
}`,
            },
          ],
        },
        {
          title: '窑烤课堂',
          apis: [
            {
              method: 'GET',
              path: '/api/classes',
              desc: '获取课程列表，支持筛选与搜索。',
              params: [
                { n: 'level', t: 'string', d: 'beginner/intermediate/master' },
                { n: 'keyword', t: 'string', d: '搜索关键词' },
              ],
              response: `{
  "code": 0,
  "data": {
    "list": [{ "id": 1, "name": "酸种入门课" }],
    "total": 12
  }
}`,
            },
            {
              method: 'POST',
              path: '/api/classes/:id/signup',
              desc: '课程报名，提交预约信息。',
              params: [
                { n: 'id', t: 'number', d: '课程ID' },
                { n: 'date', t: 'string', d: '上课日期' },
                { n: 'name', t: 'string', d: '学员姓名' },
                { n: 'phone', t: 'string', d: '联系电话' },
              ],
              response: `{
  "code": 0,
  "data": { "signupId": "SC20240817001" }
}`,
            },
          ],
        },
      ];

      return (
        <div className="page-wrap">
          <div className="status-bar">
            <span>9:41</span>
            <div className="right-icons">
              <span>●●●</span>
              <span>📶</span>
              <span>🔋</span>
            </div>
          </div>
          <div className="nav-bar">
            <div className="nav-back" onClick={onBack}>
              <Icon name="back" size={16} />
            </div>
            <div className="nav-title">接口文档</div>
            <div className="capsule">
              <button>···</button>
              <div className="divider"></div>
              <button>⊙</button>
            </div>
          </div>
          <div className="page-content">
            <div className="api-page">
              <h1>API 文档</h1>
              <p className="subtitle">窑烤面包房小程序后端接口 v1.0</p>

              {apiGroups.map((group, gi) => (
                <div key={gi} className="api-group">
                  <div className="api-group-title">{group.title}</div>
                  {group.apis.map((api, ai) => {
                    const idx = `${gi}-${ai}`;
                    const isOpen = openIdx === idx;
                    return (
                      <div key={ai} className={`api-item ${isOpen ? 'open' : ''}`}>
                        <div className="api-item-header" onClick={() => setOpenIdx(isOpen ? null : idx)}>
                          <span className={`api-method ${api.method.toLowerCase()}`}>{api.method}</span>
                          <span className="api-path">{api.path}</span>
                          <span className="api-arrow">›</span>
                        </div>
                        <div className="api-item-body">
                          <div className="api-body-inner">
                            <div className="api-desc">{api.desc}</div>
                            <div className="api-params-label">请求参数</div>
                            {api.params.map((p, pi) => (
                              <div key={pi} className="api-param">
                                <span className="pn">{p.n}</span>
                                <span className="pt">{p.t}</span>
                                <span className="pd">{p.d}</span>
                              </div>
                            ))}
                            <div className="api-params-label" style={{ marginTop: 10 }}>返回示例</div>
                            <pre className="api-response">{api.response}</pre>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              ))}

              <div style={{ height: 20 }}></div>
            </div>
          </div>
        </div>
      );
    };

    // ============ MAIN APP ============
    const App = () => {
      const [currentPage, setCurrentPage] = useState('home');
      const [pageStack, setPageStack] = useState(['home']);
      const [transitionDirection, setTransitionDirection] = useState('push');
      const [transitioning, setTransitioning] = useState(false);
      const [actionSheetOpen, setActionSheetOpen] = useState(false);
      const pageRef = useRef(null);
      const timersRef = useRef([]);

      const isTabPage = (id) => TAB_PAGES.some(p => p.id === id);
      const currentIdx = PAGES.findIndex(p => p.id === currentPage);

      const navigate = useCallback((pageId) => {
        if (transitioning || pageId === currentPage) return;
        setTransitionDirection('push');
        setTransitioning(true);
        setPageStack(prev => [...prev, pageId]);
        setCurrentPage(pageId);
        const t = setTimeout(() => setTransitioning(false), 400);
        timersRef.current.push(t);
      }, [currentPage, transitioning]);

      const goBack = useCallback(() => {
        if (transitioning || pageStack.length <= 1) return;
        setTransitionDirection('pop');
        setTransitioning(true);
        const newStack = pageStack.slice(0, -1);
        setPageStack(newStack);
        setCurrentPage(newStack[newStack.length - 1]);
        const t = setTimeout(() => setTransitioning(false), 400);
        timersRef.current.push(t);
      }, [pageStack, transitioning]);

      const switchTab = useCallback((pageId) => {
        if (transitioning || pageId === currentPage) return;
        setTransitionDirection('push');
        setTransitioning(true);
        setPageStack([pageId]);
        setCurrentPage(pageId);
        const t = setTimeout(() => setTransitioning(false), 300);
        timersRef.current.push(t);
      }, [currentPage, transitioning]);

      const goToPageByDot = useCallback((idx) => {
        const pageId = PAGES[idx].id;
        if (pageId === currentPage) return;
        setTransitionDirection(idx > currentIdx ? 'push' : 'pop');
        setTransitioning(true);
        setCurrentPage(pageId);
        setPageStack([pageId]);
        const t = setTimeout(() => setTransitioning(false), 400);
        timersRef.current.push(t);
      }, [currentIdx, currentPage]);

      useEffect(() => {
        const cleanup = initCursor();
        return () => {
          if (cleanup) cleanup();
          timersRef.current.forEach(t => clearTimeout(t));
          timersRef.current = [];
        };
      }, []);

      // Pause timers when page hidden
      useEffect(() => {
        const onVisibility = () => {
          if (document.hidden) {
            // Could pause animations here
          }
        };
        document.addEventListener('visibilitychange', onVisibility);
        return () => document.removeEventListener('visibilitychange', onVisibility);
      }, []);

      const renderPage = () => {
        const transitionClass = transitionDirection === 'push'
          ? (transitioning ? 'page-enter' : '')
          : (transitioning ? 'page-back-enter' : '');

        switch (currentPage) {
          case 'home':
            return <div className={transitionClass}><HomePage onNavigate={navigate} /></div>;
          case 'category':
            return <div className={transitionClass}><CategoryPage onNavigate={navigate} /></div>;
          case 'detail':
            return <div className={transitionClass}><DetailPage onBack={goBack} onActionSheet={() => setActionSheetOpen(true)} /></div>;
          case 'class':
            return <div className={transitionClass}><ClassPage onNavigate={navigate} /></div>;
          case 'member':
            return <div className={transitionClass}><MemberPage onNavigate={navigate} /></div>;
          case 'profile':
            return <div className={transitionClass}><ProfilePage onNavigate={navigate} /></div>;
          case 'spec':
            return <div className={transitionClass}><SpecPage onBack={goBack} /></div>;
          case 'api':
            return <div className={transitionClass}><ApiPage onBack={goBack} /></div>;
          default:
            return <div className={transitionClass}><HomePage onNavigate={navigate} /></div>;
        }
      };

      const showTabBar = isTabPage(currentPage);

      const actionSheetItems = [
        { label: '到店自取', type: 'normal' },
        { label: '配送到家', type: 'normal' },
        { label: '预约明天取货', type: 'normal' },
        { label: '取消', type: 'cancel' },
      ];

      return (
        <div className="showroom">
          <div className="showroom-title">
            <h1>窑烤面包房</h1>
            <p>微信小程序 V2 · 高保真原型</p>
          </div>

          <div className="side-label left">石 窑 明 火</div>
          <div className="side-label right">麦 香 四 溢</div>

          <div className="phone-frame">
            <div className="phone-screen" ref={pageRef}>
              {renderPage()}

              {showTabBar && (
                <div className="tab-bar">
                  {TAB_PAGES.map((p) => (
                    <div
                      key={p.id}
                      className={`tab-item ${currentPage === p.id ? 'active' : ''}`}
                      onClick={() => switchTab(p.id)}
                    >
                      <div className="tab-dot"></div>
                      <Icon name={p.icon} size={24} />
                      <span>{p.name}</span>
                    </div>
                  ))}
                </div>
              )}

              {/* Action sheet */}
              <div
                className={`action-sheet-mask ${actionSheetOpen ? 'show' : ''}`}
                onClick={() => setActionSheetOpen(false)}
              ></div>
              <div className={`action-sheet ${actionSheetOpen ? 'show' : ''}`}>
                <div className="action-sheet-handle"></div>
                <div className="action-sheet-title">选择取货方式</div>
                {actionSheetItems.filter(i => i.type !== 'cancel').map((item, i) => (
                  <div
                    key={i}
                    className={`action-sheet-item ${item.type === 'danger' ? 'danger' : ''}`}
                    onClick={() => {
                      setActionSheetOpen(false);
                      showToast(item.label);
                    }}
                  >
                    {item.label}
                  </div>
                ))}
                <div
                  className="action-sheet-cancel"
                  onClick={() => setActionSheetOpen(false)}
                >
                  取消
                </div>
              </div>

              {/* Toast */}
              <div className="toast">操作成功</div>
            </div>
          </div>

          {/* Page navigation dots */}
          <div className="page-nav-dots">
            {PAGES.map((p, i) => (
              <div
                key={p.id}
                className={`page-nav-dot ${currentPage === p.id ? 'active' : ''}`}
                onClick={() => goToPageByDot(i)}
                title={p.label}
              ></div>
            ))}
          </div>

          <div className="showroom-footer">
            点击手机右侧圆点切换页面 · 共 {PAGES.length} 个页面
          </div>
        </div>
      );
    };

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Announce upgrade capability
    function announceUpgrade() {
      try {
        window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
      } catch(e) {}
    }
    announceUpgrade();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announceUpgrade, { once: true });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>蜂箱志 · 养蜂人查箱与收成日志</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --wax-yellow: #E8A820;
      --wax-yellow-dark: #D4960F;
      --honey-amber: #C47A1E;
      --wood-brown: #6B4A2C;
      --wood-brown-dark: #4D351E;
      --wood-brown-light: #8B6B4D;
      --smoke-white: #F6F1E6;
      --smoke-white-2: #EDE5D3;
      --bee-black: #2A2118;
      --bee-black-2: #4A3B2B;
      --danger-red: #B03A2E;
      --weak: #C9764A;
      --medium: #E8A820;
      --strong: #4A7C3A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif; }
    body {
      background: linear-gradient(135deg, #2A2118 0%, #4A3520 50%, #6B4A2C 100%);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .wood-grain {
      background-image:
        repeating-linear-gradient(90deg,
          transparent 0px, transparent 2px,
          rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 3px),
        repeating-linear-gradient(90deg,
          transparent 0px, transparent 23px,
          rgba(107,74,44,0.15) 23px, rgba(107,74,44,0.15) 24px);
    }
    /* Phone frame */
    .phone-frame {
      width: 390px; height: 844px;
      background: #1a1510;
      border-radius: 54px;
      padding: 12px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.3);
      position: relative;
      flex-shrink: 0;
    }
    .phone-screen {
      width: 100%; height: 100%;
      background: var(--smoke-white);
      border-radius: 44px;
      overflow: hidden;
      position: relative;
    }
    .notch {
      position: absolute; top: 10px; left: 50%;
      transform: translateX(-50%);
      width: 120px; height: 32px;
      background: #1a1510;
      border-radius: 20px;
      z-index: 1000;
    }
    /* Status bar */
    .status-bar {
      height: 50px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px 0 32px;
      font-size: 15px; font-weight: 600;
      color: var(--bee-black);
      position: relative; z-index: 999;
      flex-shrink: 0;
    }
    .status-bar-icons { display: flex; align-items: center; gap: 5px; }
    /* App container */
    .app-container {
      display: flex; flex-direction: column;
      height: calc(100% - 50px);
      position: relative;
      overflow: hidden;
    }
    /* Page stack */
    .page-stack { flex: 1; position: relative; overflow: hidden; }
    .page {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      background: var(--smoke-white);
      overflow-y: auto; overflow-x: hidden;
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
      will-change: transform;
      -webkit-overflow-scrolling: touch;
    }
    .page.entering { transform: translateX(100%); }
    .page.active { transform: translateX(0); }
    .page.leaving { transform: translateX(-30%); opacity: 0.7; }
    .page::-webkit-scrollbar { display: none; }
    .scroll-content { flex: 1; padding-bottom: 20px; }
    /* Nav bar */
    .nav-bar {
      height: 52px; min-height: 52px;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      background: var(--smoke-white);
      border-bottom: 1px solid rgba(107,74,44,0.1);
    }
    .nav-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 18px; font-weight: 600;
      color: var(--bee-black);
    }
    .nav-back {
      position: absolute; left: 12px; top: 50%;
      transform: translateY(-50%);
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; border-radius: 50%;
    }
    .nav-back:active { background: rgba(107,74,44,0.1); }
    .nav-right {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
    }
    /* Tab bar */
    .tab-bar {
      height: 83px; min-height: 83px;
      background: var(--wood-brown);
      display: flex;
      position: relative;
      border-top-left-radius: 0;
      border-top-right-radius: 0;
    }
    .tab-bar::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 0.5px;
      background: rgba(0,0,0,0.3);
    }
    .tab-item {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 3px;
      padding-bottom: 24px;
      cursor: pointer;
      color: rgba(246,241,230,0.6);
      transition: color 0.2s;
    }
    .tab-item.active { color: var(--wax-yellow); }
    .tab-item svg { width: 24px; height: 24px; }
    .tab-label { font-size: 11px; font-weight: 500; }
    /* Today page */
    .today-hero {
      background: linear-gradient(180deg, var(--wood-brown) 0%, var(--wood-brown-dark) 100%);
      color: var(--smoke-white);
      padding: 8px 24px 28px;
      position: relative; overflow: hidden;
    }
    .today-date {
      font-family: 'Noto Serif SC', serif;
      font-size: 28px; font-weight: 700;
      margin-bottom: 4px;
    }
    .today-sub {
      font-size: 13px; opacity: 0.7;
      display: flex; align-items: center; gap: 12px;
    }
    .weather-row {
      display: flex; align-items: center;
      margin-top: 14px;
      gap: 8px;
    }
    .weather-icon { font-size: 24px; }
    .weather-temp {
      font-family: 'JetBrains Mono', monospace;
      font-size: 32px; font-weight: 600;
    }
    .weather-detail { font-size: 13px; opacity: 0.75; }
    .flowering-banner {
      margin: -16px 20px 0;
      background: linear-gradient(135deg, var(--wax-yellow) 0%, var(--honey-amber) 100%);
      border-radius: 14px;
      padding: 14px 18px;
      color: var(--bee-black);
      display: flex; align-items: center; justify-content: space-between;
      position: relative; z-index: 10;
      box-shadow: 0 4px 12px rgba(232,168,32,0.3);
    }
    .flowering-title { font-size: 14px; font-weight: 600; }
    .flowering-sub { font-size: 11px; opacity: 0.75; margin-top: 2px; }
    .flowering-days {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px; font-weight: 600;
    }
    .section-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 18px; font-weight: 600;
      color: var(--bee-black);
      padding: 20px 20px 12px;
    }
    .section-title-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 20px 12px;
    }
    .section-title-row .section-title { padding: 0; }
    .section-sub { font-size: 12px; color: var(--wood-brown); }
    /* Hive list item */
    .hive-list-item {
      margin: 0 20px 10px;
      background: white;
      border-radius: 14px;
      padding: 14px 16px;
      display: flex; align-items: center; gap: 14px;
      box-shadow: 0 2px 8px rgba(107,74,44,0.06);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative;
      overflow: hidden;
    }
    .hive-list-item:active {
      transform: scale(0.98);
      box-shadow: 0 1px 4px rgba(107,74,44,0.08);
    }
    .hive-num-badge {
      width: 44px; height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--wax-yellow) 0%, var(--honey-amber) 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Noto Serif SC', serif;
      font-size: 16px; font-weight: 700;
      color: var(--bee-black);
      flex-shrink: 0;
    }
    .hive-info { flex: 1; min-width: 0; }
    .hive-name-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 4px;
    }
    .hive-name {
      font-size: 15px; font-weight: 600;
      color: var(--bee-black);
    }
    .bee-species-tag {
      font-size: 10px; padding: 2px 6px;
      border-radius: 4px;
      background: rgba(107,74,44,0.1);
      color: var(--wood-brown);
      font-weight: 500;
    }
    .hive-meta-row {
      display: flex; align-items: center; gap: 10px;
      font-size: 12px;
      color: var(--wood-brown);
    }
    .days-since {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
    }
    .risk-tag {
      font-size: 10px; padding: 2px 6px;
      border-radius: 4px;
      background: rgba(176,58,46,0.12);
      color: var(--danger-red);
      font-weight: 500;
    }
    .strength-dots {
      display: flex; gap: 3px;
      margin-left: auto;
    }
    .strength-dot {
      width: 6px; height: 12px;
      border-radius: 2px;
      background: var(--smoke-white-2);
    }
    .strength-dot.filled-strong { background: var(--strong); }
    .strength-dot.filled-medium { background: var(--medium); }
    .strength-dot.filled-weak { background: var(--weak); }
    /* Apiary grid */
    .hive-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 0 20px;
    }
    .hive-card {
      background: white;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(107,74,44,0.06);
      cursor: pointer;
      transition: transform 0.15s;
      position: relative;
    }
    .hive-card:active { transform: scale(0.96); }
    .hive-card-top {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 10px;
    }
    .hive-card-num {
      font-family: 'Noto Serif SC', serif;
      font-size: 22px; font-weight: 700;
      color: var(--bee-black);
    }
    .status-mark {
      width: 8px; height: 8px;
      border-radius: 50%;
    }
    .status-mark.warning { background: var(--danger-red); box-shadow: 0 0 6px var(--danger-red); }
    .status-mark.queen { background: var(--honey-amber); }
    .status-mark.normal { background: var(--strong); }
    .hive-card-species {
      font-size: 11px; color: var(--wood-brown);
      margin-bottom: 8px;
    }
    .hive-card-strength {
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 8px;
    }
    .strength-bar {
      flex: 1; height: 6px;
      background: var(--smoke-white-2);
      border-radius: 3px;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s;
    }
    .strength-fill.strong { background: var(--strong); width: 85%; }
    .strength-fill.medium { background: var(--medium); width: 55%; }
    .strength-fill.weak { background: var(--weak); width: 30%; }
    .strength-label { font-size: 10px; color: var(--wood-brown); width: 24px; }
    .hive-card-days {
      font-size: 11px;
      color: var(--wood-brown);
      display: flex; align-items: center; gap: 4px;
    }
    .hive-card-days-num {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600; color: var(--bee-black-2);
    }
    /* Hive detail */
    .detail-hero {
      background: linear-gradient(180deg, var(--wood-brown) 0%, var(--wood-brown-dark) 100%);
      padding: 10px 24px 24px;
      color: var(--smoke-white);
    }
    .detail-hive-num {
      font-family: 'Noto Serif SC', serif;
      font-size: 36px; font-weight: 700;
    }
    .detail-species { font-size: 13px; opacity: 0.7; margin-top: 4px; }
    .detail-stats-row {
      display: flex; gap: 24px;
      margin-top: 18px;
    }
    .detail-stat { text-align: left; }
    .detail-stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px; font-weight: 600;
    }
    .detail-stat-label { font-size: 11px; opacity: 0.7; margin-top: 2px; }
    .action-btns {
      display: flex; gap: 12px;
      padding: 16px 20px;
    }
    .action-btn {
      flex: 1;
      height: 52px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 15px; font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      border: none;
    }
    .action-btn:active { transform: scale(0.96); }
    .action-btn.primary {
      background: var(--wax-yellow);
      color: var(--bee-black);
    }
    .action-btn.secondary {
      background: rgba(107,74,44,0.12);
      color: var(--wood-brown);
    }
    .detail-section-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 16px; font-weight: 600;
      color: var(--bee-black);
      padding: 12px 20px 8px;
    }
    .record-item {
      margin: 0 20px 8px;
      background: white;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 1px 4px rgba(107,74,44,0.05);
    }
    .record-icon {
      width: 36px; height: 36px;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .record-icon.inspection { background: rgba(232,168,32,0.15); color: var(--honey-amber); }
    .record-icon.harvest { background: rgba(74,124,58,0.15); color: var(--strong); }
    .record-info { flex: 1; min-width: 0; }
    .record-title { font-size: 14px; font-weight: 500; color: var(--bee-black); margin-bottom: 2px; }
    .record-date { font-size: 11px; color: var(--wood-brown); }
    .record-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px; font-weight: 600;
      color: var(--honey-amber);
    }
    /* Inspection flow */
    .inspect-step-indicator {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 14px 20px;
      background: var(--smoke-white);
    }
    .step-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(107,74,44,0.2);
      transition: all 0.3s;
    }
    .step-dot.active { width: 20px; border-radius: 3px; background: var(--wax-yellow); }
    .step-dot.done { background: var(--strong); }
    /* Comb frame / pull up area */
    .comb-container {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      padding-bottom: 30px;
      position: relative;
      overflow: hidden;
    }
    .comb-frame {
      width: 220px;
      cursor: grab;
      touch-action: none;
      user-select: none;
      transition: transform 0.1s;
    }
    .comb-frame:active { cursor: grabbing; }
    .comb-body {
      width: 220px; height: 280px;
      background: linear-gradient(180deg, var(--wood-brown) 0%, var(--wood-brown-light) 5%, var(--wood-brown) 95%, var(--wood-brown-dark) 100%);
      border-radius: 8px;
      border: 2px solid var(--wood-brown-dark);
      position: relative;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
    }
    .comb-body::before {
      content: '';
      position: absolute; top: 8px; left: 8px; right: 8px; bottom: 8px;
      background:
        radial-gradient(ellipse at 50% 40%, var(--wax-yellow) 0%, var(--honey-amber) 40%, var(--wood-brown) 70%);
      border-radius: 4px;
      opacity: 0.85;
    }
    .comb-top-bar {
      width: 220px; height: 18px;
      background: linear-gradient(180deg, var(--wood-brown-light) 0%, var(--wood-brown) 100%);
      border-radius: 4px 4px 0 0;
      border: 2px solid var(--wood-brown-dark);
      border-bottom: none;
      position: relative;
    }
    .comb-top-bar::after {
      content: '';
      position: absolute; top: 4px; left: 12px; right: 12px; height: 4px;
      background: var(--wood-brown-dark);
      border-radius: 2px;
      opacity: 0.4;
    }
    .comb-hint {
      position: absolute; bottom: 10px;
      left: 50%; transform: translateX(-50%);
      font-size: 13px; color: var(--wood-brown);
      display: flex; align-items: center; gap: 6px;
      animation: hintBounce 2s ease-in-out infinite;
    }
    @keyframes hintBounce {
      0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.8; }
      50% { transform: translateX(-50%) translateY(-8px); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .comb-hint { animation: none; }
    }
    .pull-progress {
      position: absolute; top: 20px; left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--wood-brown);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .pull-progress.visible { opacity: 1; }
    /* Observation form */
    .obs-section {
      padding: 14px 20px;
    }
    .obs-label {
      font-size: 14px; font-weight: 600;
      color: var(--bee-black);
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .obs-options {
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .obs-option {
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      background: white;
      color: var(--wood-brown);
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }
    .obs-option:active { transform: scale(0.96); }
    .obs-option.selected {
      background: rgba(232,168,32,0.15);
      border-color: var(--wax-yellow);
      color: var(--bee-black);
    }
    .obs-option.danger.selected {
      background: rgba(176,58,46,0.12);
      border-color: var(--danger-red);
      color: var(--danger-red);
    }
    .measure-tags {
      display: flex; gap: 8px; flex-wrap: wrap;
      padding: 14px 20px 0;
    }
    .measure-tag {
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 12px;
      background: rgba(107,74,44,0.08);
      color: var(--wood-brown);
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }
    .measure-tag.selected {
      background: var(--wood-brown);
      color: var(--smoke-white);
    }
    .submit-area {
      padding: 16px 20px 24px;
    }
    .submit-btn {
      width: 100%; height: 52px;
      border-radius: 14px;
      background: var(--wax-yellow);
      color: var(--bee-black);
      font-size: 16px; font-weight: 600;
      border: none;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    /* Wax seal overlay */
    .wax-seal-overlay {
      position: absolute; inset: 0;
      background: rgba(42,33,24,0.6);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .wax-seal-overlay.show { opacity: 1; pointer-events: auto; }
    .wax-seal-card {
      width: 280px;
      background: var(--smoke-white);
      border-radius: 20px;
      padding: 24px;
      position: relative;
      overflow: hidden;
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .wax-seal-overlay.show .wax-seal-card { transform: scale(1); }
    .wax-drop {
      position: absolute; top: -40px; left: 50%;
      transform: translateX(-50%);
      width: 30px; height: 40px;
      background: radial-gradient(ellipse at 50% 30%, #F5C542 0%, var(--wax-yellow) 50%, var(--honey-amber) 100%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      opacity: 0;
      z-index: 10;
    }
    .wax-drop.falling {
      animation: waxDrop 0.9s cubic-bezier(0.55, 0, 0.675, 0.19) forwards;
    }
    @keyframes waxDrop {
      0% { top: -40px; opacity: 1; width: 30px; height: 40px; }
      85% { top: 70%; opacity: 1; width: 30px; height: 40px; }
      100% {
        top: 50%;
        opacity: 1;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        transform: translateX(-50%) translateY(-50%);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .wax-drop.falling { animation: none; opacity: 1; top: 50%; width: 120px; height: 120px; border-radius: 50%; transform: translateX(-50%) translateY(-50%); }
    }
    .seal-text {
      font-family: 'Noto Serif SC', serif;
      font-size: 18px; font-weight: 600;
      color: var(--bee-black);
      margin-top: 8px;
      position: relative; z-index: 20;
      opacity: 0;
      transition: opacity 0.3s 0.7s;
    }
    .wax-seal-overlay.show .seal-text.show-text { opacity: 1; }
    .seal-detail {
      font-size: 13px;
      color: var(--wood-brown);
      margin-top: 6px;

    ];

    const defaultHarvests = [
      { id: 'har_001', hiveId: 'B04', date: '2026-08-08', honeyType: '荆条蜜', weight: 12.5, combCount: 4 },
      { id: 'har_002', hiveId: 'A04', date: '2026-08-09', honeyType: '荆条蜜', weight: 9.8, combCount: 3 },
      { id: 'har_003', hiveId: 'C04', date: '2026-08-10', honeyType: '荆条蜜', weight: 14.2, combCount: 5 },
      { id: 'har_004', hiveId: 'A01', date: '2026-07-25', honeyType: '槐花蜜', weight: 8.6, combCount: 3 },
    ];

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const data = JSON.parse(raw);
          return {
            hives: data.hives || defaultHives,
            inspections: data.inspections || defaultInspections,
            harvests: data.harvests || defaultHarvests,
          };
        }
      } catch (e) {}
      return { hives: defaultHives, inspections: defaultInspections, harvests: defaultHarvests };
    }

    function saveData(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {}
    }

    // ========== CONTEXT ==========
    const AppContext = createContext(null);

    function useAppData() {
      const ctx = useContext(AppContext);
      if (!ctx) throw new Error('useAppData must be used within AppProvider');
      return ctx;

    // ========== APP ROOT ==========
    function App() {
      const [data, setData] = useState(() => loadData());
      const [activeTab, setActiveTab] = useState('today');
      const [pageStack, setPageStack] = useState([]);
      const [showWaxSeal, setShowWaxSeal] = useState(false);
      const [sealDetail, setSealDetail] = useState({ title: '', detail: '' });
      const [toast, setToast] = useState({ show: false, msg: '', action: null });
      const [pendingDelete, setPendingDelete] = useState(null);

      const save = useCallback((newData) => {
        setData(newData);
        saveData(newData);
      }, []);

      const pushPage = useCallback((page) => {
        setPageStack(s => [...s, page]);
      }, []);

      const popPage = useCallback(() => {
        setPageStack(s => s.slice(0, -1));
      }, []);

      const resetStack = useCallback(() => {
        setPageStack([]);
      }, []);

      const showToast = useCallback((msg, action = null) => {
        setToast({ show: true, msg, action });
      }, []);

      const hideToast = useCallback(() => {
        setToast({ show: false, msg: '', action: null });
      }, []);

      const triggerWaxSeal = useCallback((title, detail, onDone) => {
        setSealDetail({ title, detail });
        setShowWaxSeal(true);
        setTimeout(() => {
          setShowWaxSeal(false);
          if (onDone) onDone();
        }, 1800);
      }, []);

      const addInspection = useCallback((hiveId, record) => {
        const newInspection = {
          id: 'ins_' + Date.now(),
          hiveId,
          date: todayStr(),
          ...record,
        };
        const newHives = data.hives.map(h => h.id === hiveId ? {
          ...h,
          lastInspection: todayStr(),
          hasDisease: record.diseaseStatus !== '无',
          diseaseType: record.diseaseStatus === '无' ? null : record.diseaseStatus,
          hasQueen: record.queenStatus === '见王',
        } : h);
        const newData = {
          ...data,
          hives: newHives,
          inspections: [newInspection, ...data.inspections],
        };
        save(newData);
        triggerWaxSeal('查箱记录已封存', `${hiveId}号箱 · ${formatDate(todayStr())}`, () => {
          popPage();
          popPage();
          showToast('查箱记录已提交');
        });
      }, [data, save, triggerWaxSeal, popPage, showToast]);

      const addHarvest = useCallback((hiveId, record) => {
        const newHarvest = {
          id: 'har_' + Date.now(),
          hiveId,
          date: todayStr(),
          ...record,
        };
        const newData = {
          ...data,
          harvests: [newHarvest, ...data.harvests],
        };
        save(newData);
        triggerWaxSeal('摇蜜批次已入库', `${record.honeyType} · ${record.weight}kg`, () => {
          popPage();
          popPage();
          showToast('摇蜜批次已记录');
        });
      }, [data, save, triggerWaxSeal, popPage, showToast]);

      const deleteLog = useCallback((type, id) => {
        if (type === 'inspection') {
          const newData = { ...data, inspections: data.inspections.filter(i => i.id !== id) };
          save(newData);
        } else {
          const newData = { ...data, harvests: data.harvests.filter(h => h.id !== id) };
          save(newData);
        }
        showToast('已删除', '撤销');
        // Store for undo
        const orig = type === 'inspection'
          ? data.inspections.find(i => i.id === id)
          : data.harvests.find(h => h.id === id);
        setPendingDelete({ type, item: orig });
      }, [data, save, showToast]);

      const undoDelete = useCallback(() => {
        if (!pendingDelete) return;
        const { type, item } = pendingDelete;
        if (type === 'inspection') {
          const newData = { ...data, inspections: [item, ...data.inspections].sort((a,b) => b.date.localeCompare(a.date)) };
          save(newData);
        } else {
          const newData = { ...data, harvests: [item, ...data.harvests].sort((a,b) => b.date.localeCompare(a.date)) };
          save(newData);
        }
        setPendingDelete(null);
        hideToast();
      }, [pendingDelete, data, save, hideToast]);

      const stats = useMemo(() => {
        const yiCount = data.hives.filter(h => h.species === '意蜂').length;
        const zhongCount = data.hives.filter(h => h.species === '中蜂').length;
        const totalHoney = data.harvests.reduce((sum, h) => sum + h.weight, 0);
        return {
          totalHives: data.hives.length,
          yiCount, zhongCount,
          totalHoney: totalHoney.toFixed(1),
          inspectionCount: data.inspections.length,
        };
      }, [data]);

      const contextValue = {
        data, save,
        activeTab, setActiveTab,
        pageStack, pushPage, popPage, resetStack,
        addInspection, addHarvest, deleteLog, undoDelete,
        stats, showToast, hideToast, toast,
        showWaxSeal, sealDetail,
      };

      return (
        <AppContext.Provider value={contextValue}>
          <PhoneFrame />
        </AppContext.Provider>
      );
    }

    function PhoneFrame() {
      const { activeTab, setActiveTab, pageStack, resetStack, showToast, hideToast, toast, undoDelete, showWaxSeal, sealDetail } = useAppData();

      const handleTabChange = (tab) => {
        setActiveTab(tab);
        resetStack();
      };

      return (
        <div className="phone-frame">
          <div className="notch"></div>
          <div className="phone-screen wood-grain">
            <StatusBar />
            <div className="app-container">
              <div className="page-stack">
                <MainContent activeTab={activeTab} />
                {pageStack.map((page, i) => (
                  <PageLayer key={page.key || i} page={page} index={i} total={pageStack.length} />
                ))}
              </div>
              <TabBar activeTab={activeTab} onChange={handleTabChange} />
            </div>
            {toast.show && (
              <div className="toast show">
                {toast.msg}
                {toast.action && (
                  <span className="toast-action" onClick={undoDelete}>{toast.action}</span>
                )}
              </div>
            )}
            <WaxSealOverlay show={showWaxSeal} detail={sealDetail} />
          </div>
        </div>
      );
    }

    function StatusBar() {
      const now = new Date();
      const time = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
      return (
        <div className="status-bar">
          <span style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 600 }}>{time}</span>
          <div className="status-bar-icons">
            <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor">
              <rect x="0" y="7" width="3" height="4" rx="0.5" />
              <rect x="4.5" y="5" width="3" height="6" rx="0.5" />
              <rect x="9" y="2.5" width="3" height="8.5" rx="0.5" />
              <rect x="13.5" y="0" width="2.5" height="11" rx="0.5" />
            </svg>
            <svg width="24" height="11" viewBox="0 0 24 11" fill="none" stroke="currentColor" strokeWidth="1.2">
              <rect x="0.5" y="0.5" width="20" height="10" rx="2" />
              <rect x="21.5" y="3.5" width="2" height="4" rx="1" />
              <rect x="2" y="2" width="14" height="7" rx="1" fill="currentColor" stroke="none" />
            </svg>
          </div>
        </div>
      );
    }

    function TabBar({ activeTab, onChange }) {
      const tabs = [
        { key: 'today', label: '今日', Icon: Icon.Today },
        { key: 'apiary', label: '蜂场', Icon: Icon.Hive },
        { key: 'log', label: '日志', Icon: Icon.Log },
        { key: 'me', label: '我的', Icon: Icon.Me },
      ];
      return (
        <div className="tab-bar">
          {tabs.map(tab => (
            <div
              key={tab.key}
              className={`tab-item ${activeTab === tab.key ? 'active' : ''}`}
              onClick={() => onChange(tab.key)}
            >
              <tab.Icon active={activeTab === tab.key} />
              <span className="tab-label">{tab.label}</span>
            </div>
          ))}
        </div>
      );
    }

    function MainContent({ activeTab }) {
      return (
        <div className="page active">
          {activeTab === 'today' && <TodayPage />}
          {activeTab === 'apiary' && <ApiaryPage />}
          {activeTab === 'log' && <LogPage />}
          {activeTab === 'me' && <MePage />}
        </div>
      );
    }

    function PageLayer({ page, index, total }) {
      const { popPage } = useAppData();
      const pageRef = useRef(null);

      return (
        <div className="page active" ref={pageRef}>
          {page.type === 'hiveDetail' && <HiveDetailPage hiveId={page.hiveId} onBack={popPage} />}
          {page.type === 'inspection' && <InspectionPage hiveId={page.hiveId} onBack={popPage} />}
          {page.type === 'harvest' && <HarvestPage hiveId={page.hiveId} onBack={popPage} />}
          {page.type === 'designSpec' && <DesignSpecPage onBack={popPage} />}
          {page.type === 'apiDoc' && <ApiDocPage onBack={popPage} />}
        </div>
      );
    }

    function WaxSealOverlay({ show, detail }) {
      const [showText, setShowText] = useState(false);

      useEffect(() => {
        if (show) {
          const t = setTimeout(() => setShowText(true), 800);
          return () => clearTimeout(t);
        } else {
          setShowText(false);
        }
      }, [show]);

      return (
        <div className={`wax-seal-overlay ${show ? 'show' : ''}`}>
          <div className="wax-seal-card">
            <div className={`wax-drop ${show ? 'falling' : ''}`}></div>
            <div style={{ height: 80 }}></div>
            <div className={`seal-text ${showText ? 'show-text' : ''}`}>{detail.title}</div>
            <div className={`seal-detail ${showText ? 'show-text' : ''}`}>{detail.detail}</div>
          </div>
        </div>
      );
    }

    // ========== TODAY PAGE ==========
    function TodayPage() {
      const { data, pushPage } = useAppData();

      const today = todayStr();
      const d = new Date();
      const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      const dateDisplay = `${d.getMonth() + 1}月${d.getDate()}日`;
      const weekday = weekdays[d.getDay()];

      // Hives sorted by days since last inspection (desc) - those that need checking first
      const sortedHives = [...data.hives].sort((a, b) => {
        const daysA = daysSince(a.lastInspection);
        const daysB = daysSince(b.lastInspection);
        return daysB - daysA;
      });

      const hivesToCheck = sortedHives.filter(h => daysSince(h.lastInspection) >= 5);
      const weatherTemp = 28;
      const weatherCondition = '晴转多云';

      const openInspection = (hiveId) => {
        pushPage({ type: 'hiveDetail', hiveId });
      };

      return (
        <>
          <div className="scroll-content">
            <div className="today-hero">
              <div className="today-date">{dateDisplay}</div>
              <div className="today-sub">
                <span>{weekday}</span>
                <span>·</span>
                <span>第33周</span>
              </div>
              <div className="weather-row">
                <span className="weather-temp" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{weatherTemp}°</span>
                <div>
                  <div className="weather-detail">{weatherCondition}</div>
                  <div className="weather-detail">湿度 65% · 东南风 2级</div>
                </div>
              </div>
            </div>

            <div className="flowering-banner">
              <div>
                <div className="flowering-title">荆条盛花期</div>
                <div className="flowering-sub">流蜜期 · 抓紧采蜜</div>
              </div>
              <div style={{ textAlign: 'right' }}>
                <div className="flowering-days">12<span style={{ fontSize: 14, fontWeight: 400 }}>天</span></div>
                <div className="flowering-sub">预计剩余</div>
              </div>
            </div>

            <div className="section-title-row">
              <div className="section-title">今日待查</div>
              <div className="section-sub">{hivesToCheck.length} 箱需查</div>
            </div>

            {hivesToCheck.length === 0 ? (
              <div className="empty-state">
                <div className="empty-icon">🐝</div>
                <div className="empty-text">所有蜂箱状态良好<br/>暂无待查蜂箱</div>
              </div>
            ) : (
              hivesToCheck.map(hive => (
                <HiveListItem key={hive.id} hive={hive} onClick={() => openInspection(hive.id)} />
              ))
            )}

            <div className="section-title-row">
              <div className="section-title">近期已查</div>
              <div className="section-sub">{sortedHives.filter(h => daysSince(h.lastInspection) < 5).length} 箱正常</div>
            </div>

            {sortedHives.filter(h => daysSince(h.lastInspection) < 5).slice(0, 4).map(hive => (
              <HiveListItem key={hive.id} hive={hive} onClick={() => openInspection(hive.id)} compact />
            ))}
          </div>
        </>
      );
    }

    function HiveListItem({ hive, onClick, compact }) {
      const days = daysSince(hive.lastInspection);
      const strengthDots = [
        hive.strength === 'strong' || hive.strength === 'medium' || hive.strength === 'weak',
        hive.strength === 'strong' || hive.strength === 'medium',
        hive.strength === 'strong',
      ];
      const strengthClass = hive.strength;

      return (
        <div className="hive-list-item" onClick={onClick}>
          <div className="hive-num-badge">{hive.id}</div>
          <div className="hive-info">
            <div className="hive-name-row">
              <span className="hive-name">{hive.id}号蜂箱</span>
              <span className="bee-species-tag">{hive.species}</span>
              {hive.hasDisease && <span className="risk-tag">{hive.diseaseType}</span>}
            </div>
            <div className="hive-meta-row">
              <span className="days-since">距上次 {days}天</span>
              <span>·</span>
              <span>群势{hive.strength === 'strong' ? '强' : hive.strength === 'medium' ? '中' : '弱'}</span>
            </div>
          </div>
          <div className="strength-dots" style={{ flexDirection: 'column', gap: '3px', alignItems: 'flex-end' }}>
            {[...strengthDots].reverse().map((filled, i) => (
              <div
                key={i}
                className={`strength-dot ${filled ? `filled-${strengthClass}` : ''}`}
                style={{ width: filled ? '8px' : '6px', height: '6px' }}
              />
            ))}
          </div>
        </div>
      );
    }

      return (
        <div className="hive-card" onClick={onClick}>

            <div className={`status-mark ${statusMark}`}></div>

    // ========== INSPECTION PAGE ==========
    function InspectionPage({ hiveId, onBack }) {
      const { data, addInspection } = useAppData();
      const hive = data.hives.find(h => h.id === hiveId);
      const [step, setStep] = useState(0); // 0: pull comb, 1: observe, 2: measures
      const [pullProgress, setPullProgress] = useState(0);
      const [isPulling, setIsPulling] = useState(false);
      const combRef = useRef(null);
      const containerRef = useRef(null);
      const startY = useRef(0);
      const startPull = useRef(0);
      const rafId = useRef(null);

      const [queenStatus, setQueenStatus] = useState(null);
      const [broodStatus, setBroodStatus] = useState(null);
      const [honeyStatus, setHoneyStatus] = useState(null);
      const [diseaseStatus, setDiseaseStatus] = useState(null);
      const [selectedMeasures, setSelectedMeasures] = useState([]);

      const measures = ['换王', '治螨', '加脾', '补饲', '换脾', '清理'];

      // Comb pull gesture
      const handlePointerDown = (e) => {
        if (step !== 0) return;
        e.preventDefault();
        setIsPulling(true);
        startY.current = e.clientY || e.touches?.[0]?.clientY || 0;
        startPull.current = pullProgress;
        const target = e.currentTarget;
        target.setPointerCapture?.(e.pointerId);
      };

      const handlePointerMove = useCallback((e) => {
        if (!isPulling) return;
        const clientY = e.clientY || e.touches?.[0]?.clientY || 0;
        const deltaY = startY.current - clientY; // positive = pulling up
        // Damping
        let progress = startPull.current + deltaY * 0.8;
        if (progress > 200) {
          progress = 200 + (progress - 200) * 0.3; // damping beyond threshold
        }
        if (progress < 0) progress = 0;
        setPullProgress(progress);
      }, [isPulling]);

      const handlePointerUp = useCallback((e) => {
        if (!isPulling) return;
        setIsPulling(false);
        // Snap back or advance
        if (pullProgress > 120) {
          // Success - spring to full open
          setPullProgress(220);
          setTimeout(() => setStep(1), 400);
        } else {
          // Spring back
          setPullProgress(0);
        }
      }, [isPulling, pullProgress]);

      useEffect(() => {
        window.addEventListener('pointermove', handlePointerMove);
        window.addEventListener('pointerup', handlePointerUp);
        return () => {
          window.removeEventListener('pointermove', handlePointerMove);
          window.removeEventListener('pointerup', handlePointerUp);
        };
      }, [handlePointerMove, handlePointerUp]);

      const canSubmit = queenStatus && broodStatus && honeyStatus && diseaseStatus;

      const handleSubmit = () => {
        if (!canSubmit) return;
        addInspection(hiveId, {
          queenStatus, broodStatus, honeyStatus, diseaseStatus,
          measures: selectedMeasures,
          notes: '',
        });
      };

      const toggleMeasure = (m) => {
        setSelectedMeasures(prev =>
          prev.includes(m) ? prev.filter(x => x !== m) : [...prev, m]
        );
      };

      return (
        <>
          <div className="nav-bar">
            <div className="nav-back" onClick={onBack}>
              <Icon.Back />
            </div>
            <span className="nav-title">查箱 · {hiveId}号</span>
          </div>

          <div className="inspect-step-indicator">
            <div className={`step-dot ${step >= 0 ? (step > 0 ? 'done' : 'active') : ''}`}></div>
            <div className={`step-dot ${step >= 1 ? (step > 1 ? 'done' : 'active') : ''}`}></div>
            <div className={`step-dot ${step >= 2 ? 'active' : ''}`}></div>
          </div>

          {step === 0 && (
            <div className="scroll-content" style={{ display: 'flex', flexDirection: 'column' }}>
              <div className="comb-container" ref={containerRef}>
                <div className={`pull-progress ${pullProgress > 10 ? 'visible' : ''}`}>
                  {Math.min(100, Math.round(pullProgress / 2))}%
                </div>
                <div
                  ref={combRef}
                  className="comb-frame"
                  style={{ transform: `translateY(${-pullProgress}px)` }}
                  onPointerDown={handlePointerDown}
                >
                  <div className="comb-top-bar"></div>
                  <div className="comb-body"></div>
                </div>
                <div className="comb-hint">
                  <Icon.UpArrow />
                  上拉抽出巢脾
                </div>
              </div>
            </div>
          )}

          {(step === 1 || step === 2) && (
            <div className="scroll-content">
              <div className="obs-section">
                <div className="obs-label">
                  <span style={{ color: 'var(--honey-amber)' }}>●</span>
                  蜂王状态
                </div>
                <div className="obs-options">
                  {['见王', '未见', '见王台'].map(opt => (
                    <div
                      key={opt}
                      className={`obs-option ${queenStatus === opt ? 'selected' : ''}`}
                      onClick={() => setQueenStatus(opt)}
                    >
                      {opt}
                    </div>
                  ))}
                </div>
              </div>

              <div className="obs-section">
                <div className="obs-label">
                  <span style={{ color: 'var(--honey-amber)' }}>●</span>
                  卵虫脾
                </div>
                <div className="obs-options">
                  {['正常', '稀疏', '无'].map(opt => (
                    <div
                      key={opt}
                      className={`obs-option ${broodStatus === opt ? 'selected' : ''}`}
                      onClick={() => setBroodStatus(opt)}
                    >
                      {opt}
                    </div>
                  ))}
                </div>
              </div>

              <div className="obs-section">
                <div className="obs-label">
                  <span style={{ color: 'var(--honey-amber)' }}>●</span>
                  蜜粉脾
                </div>
                <div className="obs-options">
                  {['充足', '半足', '不足'].map(opt => (
                    <div
                      key={opt}
                      className={`obs-option ${honeyStatus === opt ? 'selected' : ''}`}
                      onClick={() => setHoneyStatus(opt)}
                    >
                      {opt}
                    </div>
                  ))}
                </div>
              </div>

              <div className="obs-section">
                <div className="obs-label">
                  <span style={{ color: 'var(--danger-red)' }}>●</span>
                  病害检查
                </div>
                <div className="obs-options">
                  {['无', '蜂螨', '巢虫', '白垩病'].map(opt => (
                    <div
                      key={opt}
                      className={`obs-option ${opt !== '无' ? 'danger' : ''} ${diseaseStatus === opt ? 'selected' : ''}`}
                      onClick={() => setDiseaseStatus(opt)}
                    >
                      {opt}
                    </div>
                  ))}
                </div>
              </div>

              <div style={{ padding: '12px 20px 0' }}>
                <div className="obs-label" style={{ marginBottom: 10 }}>
                  <span style={{ color: 'var(--wood-brown)' }}>●</span>
                  采取措施（可选）
                </div>
              </div>
              <div className="measure-tags" style={{ paddingTop: 0 }}>
                {measures.map(m => (
                  <div
                    key={m}
                    className={`measure-tag ${selectedMeasures.includes(m) ? 'selected' : ''}`}
                    onClick={() => toggleMeasure(m)}
                  >
                    {m}
                  </div>
                ))}
              </div>

              <div className="submit-area">
                <button
                  className="submit-btn"
                  disabled={!canSubmit}
                  onClick={handleSubmit}
                >
                  提交记录
                </button>
              </div>
            </div>
          )}
        </>
      );
    }

    // ========== HARVEST PAGE ==========
    function HarvestPage({ hiveId, onBack }) {
      const { addHarvest } = useAppData();
      const [combCount, setCombCount] = useState(3);
      const [honeyWeight, setHoneyWeight] = useState(0);
      const [rotation, setRotation] = useState(0); // total degrees
      const [crankAngle, setCrankAngle] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const [showSheet, setShowSheet] = useState(false);
      const [honeyType, setHoneyType] = useState(null);
      const crankRef = useRef(null);
      const barrelRef = useRef(null);
      const inertiaRaf = useRef(null);
      const velocity = useRef(0);
      const lastAngle = useRef(0);
      const lastTime = useRef(0);
      const crankCenter = useRef({ x: 0, y: 0 });
      const startAngle = useRef(0);
      const startRotation = useRef(0);

      const honeyTypes = [
        { name: '槐花蜜', desc: '清甜淡雅', color: '#F5DEB3' },
        { name: '荆条蜜', desc: '浓郁醇香', color: '#C47A1E' },
        { name: '椴树蜜', desc: '细腻雪白', color: '#E8E4D9' },
        { name: '百花蜜', desc: '花香丰富', color: '#D4A017' },
      ];

      const updateCrankCenter = () => {
        if (crankRef.current && crankRef.current.parentElement) {
          const parent = crankRef.current.parentElement;
          const rect = parent.getBoundingClientRect();
          crankCenter.current = {
            x: rect.left + rect.width / 2,
            y: rect.top + rect.height / 2,
          };
        }
      };

      const getAngle = (clientX, clientY) => {
        const dx = clientX - crankCenter.current.x;
        const dy = clientY - crankCenter.current.y;
        return Math.atan2(dy, dx) * (180 / Math.PI);
      };

      const handlePointerDown = (e) => {
        if (inertiaRaf.current) {
          cancelAnimationFrame(inertiaRaf.current);
          inertiaRaf.current = null;
        }
        updateCrankCenter();
        setIsDragging(true);
        const clientX = e.clientX || e.touches?.[0]?.clientX || 0;
        const clientY = e.clientY || e.touches?.[0]?.clientY || 0;
        startAngle.current = getAngle(clientX, clientY);
        startRotation.current = rotation;
        lastAngle.current = getAngle(clientX, clientY);
        lastTime.current = performance.now();
        velocity.current = 0;
        e.currentTarget.setPointerCapture?.(e.pointerId);
      };

      const handlePointerMove = useCallback((e) => {
        if (!isDragging) return;
        const clientX = e.clientX || e.touches?.[0]?.clientX || 0;
        const clientY = e.clientY || e.touches?.[0]?.clientY || 0;
        const currentAngle = getAngle(clientX, clientY);
        let delta = currentAngle - startAngle.current;
        // Handle angle wrapping
        if (delta > 180) delta -= 360;
        if (delta < -180) delta += 360;

        const now = performance.now();
        const dt = now - lastTime.current;
        if (dt > 0) {
          let angleDelta = currentAngle - lastAngle.current;
          if (angleDelta > 180) angleDelta -= 360;
          if (angleDelta < -180) angleDelta += 360;
          velocity.current = angleDelta / dt * 16; // per frame
        }
        lastAngle.current = currentAngle;
        lastTime.current = now;

        const newRotation = startRotation.current + delta;
        setRotation(newRotation);
        setCrankAngle(delta);
        // Update weight based on rotation
        const totalTurns = Math.abs(newRotation) / 360;
        const weightPerTurn = combCount * 0.15; // kg per turn, proportional to comb count
        const newWeight = Math.min(totalTurns * weightPerTurn, combCount * 3.5);
        setHoneyWeight(Math.round(newWeight * 10) / 10);
      }, [isDragging, rotation, combCount]);

      const handlePointerUp = useCallback((e) => {
        if (!isDragging) return;
        setIsDragging(false);
        // Inertia
        const startVel = velocity.current;
        let currentVel = startVel;
        let currentRot = rotation;

        const animate = () => {
          // Apply friction
          currentVel *= 0.95;
          currentRot += currentVel;
          setRotation(currentRot);

          const totalTurns = Math.abs(currentRot) / 360;
          const weightPerTurn = combCount * 0.15;
          const newWeight = Math.min(totalTurns * weightPerTurn, combCount * 3.5);
          setHoneyWeight(Math.round(newWeight * 10) / 10);

          if (Math.abs(currentVel) > 0.1) {
            inertiaRaf.current = requestAnimationFrame(animate);
          }
        };

        if (Math.abs(currentVel) > 0.5) {
          inertiaRaf.current = requestAnimationFrame(animate);
        }
      }, [isDragging, rotation, combCount]);

      useEffect(() => {
        window.addEventListener('pointermove', handlePointerMove);
        window.addEventListener('pointerup', handlePointerUp);
        return () => {
          window.removeEventListener('pointermove', handlePointerMove);
          window.removeEventListener('pointerup', handlePointerUp);
          if (inertiaRaf.current) cancelAnimationFrame(inertiaRaf.current);
        };
      }, [handlePointerMove, handlePointerUp]);

      // Barrel rotation (visual)
      const barrelRotation = useMemo(() => rotation * 2, [rotation]);

      const handleFinish = () => {
        if (honeyWeight < 0.5) return;
        setShowSheet(true);
      };

      const handleConfirmHarvest = () => {
        if (!honeyType) return;
        setShowSheet(false);
        addHarvest(hiveId, {
          honeyType,
          weight: honeyWeight,
          combCount,
        });
      };

      const maxWeight = combCount * 3.5;
      const progressPercent = Math.min(100, (honeyWeight / maxWeight) * 100);

      return (
        <>
          <div className="nav-bar">
            <div className="nav-back" onClick={onBack}>
              <Icon.Back />
            </div>
            <span className="nav-title">摇蜜 · {hiveId}号</span>
          </div>

          <div className="scroll-content" style={{ display: 'flex', flexDirection: 'column' }}>
            <div className="stepper-row">
              <span className="stepper-label">摇蜜脾数</span>
              <div className="stepper-control">
                <div className="stepper-btn" onClick={() => setCombCount(Math.max(1, combCount - 1))}>−</div>
                <div>
                  <div className="stepper-value">{combCount}</div>
                  <div className="comb-count-label" style={{ textAlign: 'center' }}>脾</div>
                </div>
                <div className="stepper-btn" onClick={() => setCombCount(Math.min(10, combCount + 1))}>+</div>
              </div>
            </div>

            <div className="extractor-container">
              <div className="honey-scale">
                <div>
                  <span className="honey-weight">{honeyWeight.toFixed(1)}</span>
                  <span className="honey-unit">kg</span>
                </div>
                <div className="honey-scale-bar">
                  <div className="honey-scale-fill" style={{ width: `${progressPercent}%` }}></div>
                </div>
                <div style={{ fontSize: 11, color: 'var(--wood-brown)', marginTop: 6 }}>
                  预计上限 {maxWeight.toFixed(1)} kg
                </div>
              </div>

              <div className="crank-area">
                <div
                  ref={barrelRef}
                  className="extractor-barrel"
                  style={{ transform: `rotate(${barrelRotation}deg)` }}
                ></div>
                <div
                  className="crank-arm"
                  style={{
                    height: 100,
                    transform: `translateX(-50%) rotate(${rotation}deg)`,
                    transformOrigin: 'top center',
                  }}
                ></div>
                <div
                  ref={crankRef}
                  className="crank-handle"
                  style={{
                    position: 'absolute',
                    left: '50%',
                    top: '50%',
                    transform: `translate(-50%, -50%) rotate(${rotation}deg) translateY(-100px)`,
                    margin: 0,
                  }}
                  onPointerDown={handlePointerDown}
                >
                  <div style={{ width: 20, height: 20, borderRadius: '50%', background: 'rgba(0,0,0,0.2)' }}></div>
                </div>
              </div>

              <div style={{ fontSize: 12, color: 'var(--wood-brown)', textAlign: 'center', marginTop: 10 }}>
                按住转柄，顺时针摇动
              </div>
            </div>

            <div className="submit-area">
              <button
                className="submit-btn"
                disabled={honeyWeight < 0.5}
                onClick={handleFinish}
              >
                完成摇蜜
              </button>
            </div>
          </div>

          {/* Bottom sheet for honey type selection */}
          <div className={`bottom-sheet-overlay ${showSheet ? 'show' : ''}`} onClick={() => setShowSheet(false)}></div>
          <div className={`bottom-sheet ${showSheet ? 'show' : ''}`}>
            <div className="sheet-handle"></div>
            <div className="sheet-title">选择蜜种</div>
            <div className="sheet-content">
              <div className="honey-type-grid">
                {honeyTypes.map(ht => (
                  <div
                    key={ht.name}
                    className={`honey-type-card ${honeyType === ht.name ? 'selected' : ''}`}
                    onClick={() => setHoneyType(ht.name)}
                  >
                    <div
                      style={{
                        width: 40, height: 40, borderRadius: '50%',
                        background: ht.color,
                        margin: '0 auto 8px',
                        boxShadow: 'inset 0 -4px 8px rgba(0,0,0,0.15)',
                      }}
                    ></div>
                    <div className="honey-type-name">{ht.name}</div>
                    <div className="honey-type-desc">{ht.desc}</div>
                  </div>
                ))}
              </div>
              <div style={{ marginTop: 20 }}>
                <button
                  className="submit-btn"
                  disabled={!honeyType}
                  onClick={handleConfirmHarvest}
                >
                  确认入库 · {honeyWeight.toFixed(1)}kg
                </button>
              </div>
            </div>
          </div>
        </>
      );
    }

    // ========== LOG PAGE ==========
    function LogPage() {
      const { data, deleteLog } = useAppData();
      const [filter, setFilter] = useState('all');
      const [openSwipe, setOpenSwipe] = useState(null);

      const allLogs = useMemo(() => {
        const inspections = data.inspections.map(i => ({
          type: 'inspection',
          id: i.id,
          date: i.date,
          hiveId: i.hiveId,
          title: `${i.hiveId}号箱 · 查箱`,
          desc: `蜂王${i.queenStatus} · ${i.diseaseStatus === '无' ? '无病害' : i.diseaseStatus}`,
        }));
        const harvests = data.harvests.map(h => ({
          type: 'harvest',
          id: h.id,
          date: h.date,
          hiveId: h.hiveId,
          title: `${h.hiveId}号箱 · ${h.honeyType}`,
          desc: `摇蜜 ${h.weight}kg · ${h.combCount}脾`,
          weight: h.weight,
        }));
        const merged = [...inspections, ...harvests].sort((a, b) => b.date.localeCompare(a.date));
        if (filter === 'inspection') return merged.filter(l => l.type === 'inspection');
        if (filter === 'harvest') return merged.filter(l => l.type === 'harvest');
        return merged;
      }, [data, filter]);

      const handleDelete = (type, id) => {
        deleteLog(type, id);
        setOpenSwipe(null);
      };

      return (
        <>
          <div className="nav-bar">
            <span className="nav-title">日志</span>
          </div>
          <div className="scroll-content">
            <div className="segment-control">
              <div
                className={`segment-btn ${filter === 'all' ? 'active' : ''}`}
                onClick={() => setFilter('all')}
              >
                全部
              </div>
              <div
                className={`segment-btn ${filter === 'inspection' ? 'active' : ''}`}
                onClick={() => setFilter('inspection')}
              >
                查箱
              </div>
              <div
                className={`segment-btn ${filter === 'harvest' ? 'active' : ''}`}
                onClick={() => setFilter('harvest')}
              >
                摇蜜
              </div>
            </div>

            {allLogs.length === 0 ? (
              <div className="empty-state">
                <div className="empty-icon">📋</div>
                <div className="empty-text">暂无记录</div>
              </div>
            ) : (
              <div className="timeline">
                {allLogs.map(log => (
                  <LogItem
                    key={log.type + log.id}
                    log={log}
                    isOpen={openSwipe === log.type + log.id}
                    onOpen={() => setOpenSwipe(log.type + log.id)}
                    onClose={() => setOpenSwipe(null)}
                    onDelete={() => handleDelete(log.type, log.id)}
                  />
                ))}
              </div>
            )}
          </div>
        </>

    function LogItem({ log, isOpen, onOpen, onClose, onDelete }) {
      const [translateX, setTranslateX] = useState(0);
      const startX = useRef(0);
      const isDragging = useRef(false);
      const itemRef = useRef(null);
      const lastMoveTime = useRef(0);

      const handlePointerDown = (e) => {
        isDragging.current = true;
        startX.current = e.clientX || e.touches?.[0]?.clientX || 0;
        e.currentTarget.setPointerCapture?.(e.pointerId);
      };

      const handlePointerMove = (e) => {
        if (!isDragging.current) return;
        const now = performance.now();
        if (now - lastMoveTime.current < 16) return; // throttle
        lastMoveTime.current = now;

        const clientX = e.clientX || e.touches?.[0]?.clientX || 0;
        let delta = clientX - startX.current;
        if (isOpen) delta = -80 + delta;

        // Clamp
        if (delta > 0) delta = delta * 0.3;
        if (delta < -100) delta = -100 + (delta + 100) * 0.3;

        setTranslateX(delta);
      };

      const handlePointerUp = () => {
        if (!isDragging.current) return;
        isDragging.current = false;
        // Snap
        if (translateX < -40) {
          setTranslateX(-80);
          onOpen();
        } else {
          setTranslateX(0);
          onClose();
        }
      };

      useEffect(() => {
        if (!isOpen && translateX !== 0 && !isDragging.current) {
          setTranslateX(0);
        }
      }, [isOpen, translateX]);

      return (
        <div className="timeline-item">
          <div className="timeline-item-left">
            <div className="timeline-date">{formatDate(log.date)}</div>
          </div>
          <div className="timeline-icon-container" style={{ flexShrink: 0 }}>
            <div className={`timeline-icon ${log.type}`}>
              {log.type === 'inspection' ? <Icon.Bee /> : <Icon.Honey />}
            </div>
          </div>
          <div className="swipe-wrapper" style={{ flex: 1 }}>
            <div className="swipe-delete-bg" onClick={onDelete}>删除</div>
            <div
              ref={itemRef}
              className="timeline-content swipe-content"
              style={{ transform: `translateX(${translateX}px)` }}
              onPointerDown={handlePointerDown}
              onPointerMove={handlePointerMove}
              onPointerUp={handlePointerUp}
              onPointerCancel={handlePointerUp}
            >
              <div className="timeline-title">{log.title}</div>
              <div className="timeline-desc">{log.desc}</div>
            </div>
          </div>
        </div>
      );
    }

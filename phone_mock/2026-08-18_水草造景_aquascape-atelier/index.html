// ==================== APP CONTEXT ====================
const AppContext = createContext(null);

function AppProvider({ children }) {
  const [pageStack, setPageStack] = useState([{ name: 'home', tab: true }]);
  const [activeTab, setActiveTab] = useState('home');
  const [liked, setLiked] = useState({});
  const [fav, setFav] = useState({});
  const [cart, setCart] = useState({});
  const [sheet, setSheet] = useState(null);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  const reducedMotion = useMediaQuery('(prefers-reduced-motion: reduce)');

  function useMediaQuery(q) {
    const [m, setM] = useState(false);
    useEffect(() => {
      const mql = window.matchMedia(q);
      setM(mql.matches);
      const h = e => setM(e.matches);
      mql.addEventListener('change', h);
      return () => mql.removeEventListener('change', h);
    }, [q]);
    return m;
  }

  const showToast = useCallback((msg) => {
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setToast(msg);
    toastTimer.current = setTimeout(() => setToast(null), 1800);
  }, []);

  const push = useCallback((name, params = {}) => {
    setPageStack(prev => [...prev, { name, params, tab: false }]);
  }, []);

  const pop = useCallback(() => {
    setPageStack(prev => {
      if (prev.length <= 1) return prev;
      return prev.slice(0, -1);
    });
  }, []);

  const switchTab = useCallback((tab) => {
    setActiveTab(tab);
    setPageStack([{ name: tab, tab: true }]);
  }, []);

  const toggleLike = useCallback((id) => {
    setLiked(prev => {
      const next = { ...prev };
      if (next[id]) delete next[id]; else next[id] = true;
      return next;
    });
  }, []);

  const toggleFav = useCallback((id) => {
    setFav(prev => {
      const next = { ...prev };
      if (next[id]) delete next[id]; else next[id] = true;
      return next;
    });
  }, []);

  const addToCart = useCallback((id) => {
    setCart(prev => ({ ...prev, [id]: (prev[id] || 0) + 1 }));
    showToast('已加入购物车');
  }, [showToast]);

  const openSheet = useCallback((config) => setSheet(config), []);
  const closeSheet = useCallback(() => setSheet(null), []);

  const value = {
    pageStack, activeTab, push, pop, switchTab,
    liked, fav, cart, toggleLike, toggleFav, addToCart,
    sheet, openSheet, closeSheet,
    toast, showToast,
    reducedMotion,
  };

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

function useApp() { return useContext(AppContext); }

// ==================== RIPPLE HELPER ====================
function createRipple(e) {
  const target = e.currentTarget;
  const rect = target.getBoundingClientRect();
  const ripple = document.createElement('div');
  ripple.className = 'ripple-point';
  ripple.style.left = (e.clientX - rect.left) + 'px';
  ripple.style.top = (e.clientY - rect.top) + 'px';
  target.style.position = target.style.position || 'relative';
  target.style.overflow = target.style.overflow || 'hidden';
  target.appendChild(ripple);
  setTimeout(() => ripple.remove(), 650);
}

// ==================== COUNT-UP NUMBER ====================
function CountNumber({ value, className = '' }) {
  const [display, setDisplay] = useState(0);
  const ref = useRef(null);
  const rafRef = useRef(null);
  const startRef = useRef(null);
  const prevRef = useRef(0);

  useEffect(() => {
    if (value === display) return;
    const start = prevRef.current;
    const end = value;
    const dur = 600;
    startRef.current = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - startRef.current) / dur);
      const ease = 1 - Math.pow(1 - t, 3);
      const cur = Math.round(start + (end - start) * ease);
      setDisplay(cur);
      if (t < 1) rafRef.current = requestAnimationFrame(tick);
      else prevRef.current = end;
    };
    rafRef.current = requestAnimationFrame(tick);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [value]);

  useEffect(() => {
    const onVis = () => {
      if (document.hidden && rafRef.current) {
        cancelAnimationFrame(rafRef.current);
        rafRef.current = null;
      }
    };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, []);

  return (
    <span ref={ref} className={className} style={{ display: 'inline-block' }}>
      {display}
    </span>
  );
}

// ==================== PULL TO REFRESH ====================
function PullToRefresh({ onRefresh, children, color = C.primary }) {
  const containerRef = useRef(null);
  const [pull, setPull] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const startY = useRef(0);
  const pulling = useRef(false);
  const maxPull = 70;
  const threshold = 50;

  const handleStart = (e) => {
    const el = containerRef.current;
    if (el && el.scrollTop <= 0) {
      pulling.current = true;
      startY.current = e.touches ? e.touches[0].clientY : e.clientY;
    }
  };

  const handleMove = (e) => {
    if (!pulling.current || refreshing) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    let d = y - startY.current;
    if (d > 0) {
      // Damping
      const damped = Math.min(maxPull, d * 0.5);
      setPull(damped);
      if (e.cancelable) e.preventDefault();
    }
  };

  const handleEnd = () => {
    if (!pulling.current) return;
    pulling.current = false;
    if (pull >= threshold && !refreshing) {
      setRefreshing(true);
      setPull(50);
      onRefresh?.().then(() => {
        setRefreshing(false);
        setPull(0);
      });
    } else {
      setPull(0);
    }
  };

  useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    const ts = handleStart;
    const tm = handleMove;
    const te = handleEnd;
    el.addEventListener('touchstart', ts, { passive: true });
    el.addEventListener('touchmove', tm, { passive: false });
    el.addEventListener('touchend', te);
    return () => {
      el.removeEventListener('touchstart', ts);
      el.removeEventListener('touchmove', tm);
      el.removeEventListener('touchend', te);
    };
  }, [pull, refreshing]);

  return (
    <div ref={containerRef} style={{ position: 'relative', height: '100%', overflow: 'auto' }} className="no-scrollbar">
      <div style={{
        position: 'absolute', top: 0, left: 0, right: 0,
        height: pull, display: 'flex', alignItems: 'center', justifyContent: 'center',
        pointerEvents: 'none',
      }}>
        {refreshing ? (
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, color }}>
            <div style={{
              width: 18, height: 18,
              border: `2px solid ${color}`, borderTopColor: 'transparent',
              borderRadius: '50%',
              animation: 'spin 0.8s linear infinite',
            }} />
            <span style={{ fontSize: 12 }}>刷新中…</span>
          </div>
        ) : pull > 10 && (
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, color, fontSize: 12 }}>
            <svg width="18" height="18" viewBox="0 0 24 24" style={{
              animation: 'wave-sway 1s ease-in-out infinite',
              transformOrigin: 'center bottom',
            }}>
              <path d="M12 4v10l4 4M6 18h12" stroke={color} strokeWidth="2"
                strokeLinecap="round" fill="none"/>
            </svg>
            <span>{pull >= threshold ? '松开刷新' : '下拉刷新'}</span>
          </div>
        )}
      </div>
      <div style={{
        transform: `translateY(${pull}px)`,
        transition: pulling.current ? 'none' : 'transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1)',
      }}>
        {children}
      </div>
    </div>
  );
}

    const y = el.scrollTop;
    setHeroY(y * 0.4);
    if (y > 160) setNavVariant('opaque');
    else setNavVariant('transparent');
  }, []);

  useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    let ticking = false;
    const onScroll = () => {
      if (!ticking) {
        requestAnimationFrame(() => {
          handleScroll();
          ticking = false;
        });
        ticking = true;
      }
    };
    el.addEventListener('scroll', onScroll, { passive: true });
    return () => el.removeEventListener('scroll', onScroll);

    const el = scrollRef.current;
    if (!el) return;
    if (el.scrollTop > 280) setNavVariant('opaque');
    else setNavVariant('transparent');

  useEffect(() => {
    const el = scrollRef.current;

    let ticking = false;
    const onScroll = () => {
      if (!ticking) {
        requestAnimationFrame(() => { handleScroll(); ticking = false; });
        ticking = true;
      }
    };
    el.addEventListener('scroll', onScroll, { passive: true });
    return () => el.removeEventListener('scroll', onScroll);
  }, [handleScroll]);

function MarketPage() {
  const { addToCart, reducedMotion, showToast } = useApp();
  const [cat, setCat] = useState('all');
  const [swipedId, setSwipedId] = useState(null);
  const startX = useRef(0);
  const moveX = useRef(0);
  const swiping = useRef(null);

  const filtered = cat === 'all' ? PRODUCTS : PRODUCTS.filter(p => p.cat === cat);

  const handleTouchStart = (e, id) => {
    startX.current = e.touches[0].clientX;
    moveX.current = 0;
    swiping.current = id;
  };

  const handleTouchMove = (e) => {
    if (!swiping.current) return;
    moveX.current = startX.current - e.touches[0].clientX;
    // Direct DOM manipulation for smoothness
    const el = e.currentTarget.querySelector(`[data-product="${swiping.current}"]`);
    if (el) {
      const offset = Math.max(0, Math.min(80, moveX.current));
      el.style.transform = `translateX(${-offset}px)`;
    }
  };

  const handleTouchEnd = (id) => {
    const el = document.querySelector(`[data-product="${id}"]`);
    if (moveX.current > 50) {
      setSwipedId(id);
      if (el) el.style.transform = 'translateX(-80px)';
    } else {
      setSwipedId(prev => prev === id ? null : prev);
      if (el) el.style.transform = 'translateX(0)';
      if (el && !reducedMotion && moveX.current > 10) {
        el.classList.remove('spring-back-anim');
        void el.offsetWidth;
        el.classList.add('spring-back-anim');
      }
    }
    swiping.current = null;
    moveX.current = 0;
  };

  const handleAdd = (p) => {
    addToCart(p.id);
    // close swipe
    const el = document.querySelector(`[data-product="${p.id}"]`);
    if (el) {
      el.style.transform = 'translateX(0)';
      setSwipedId(null);
    }
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', background: C.bg }}>
      <WeChatStatusBar dark={false} />
      <WeChatNavBar title="器材市集" variant="opaque" />

          display: 'flex', alignItems: 'center', gap: 8,
          background: '#fff', borderRadius: 20, padding: '8px 14px',
          color: C.sub, border: `1px solid ${C.paleSand}`,
        }}>
          <Icon.Search />
          <span style={{ fontSize: 13 }}>搜索水草 / 器材 / 品牌</span>
        </div>
      </div>

      {/* Split layout */}
      <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
        {/* Left category sidebar */}
        <div style={{
          width: 84, background: '#fff',
          borderRight: `1px solid ${C.paleSand}`,
          overflow: 'auto',
        }} className="no-scrollbar">
          {PRODUCT_CATS.map(c => (
            <div
              key={c.id}
              onClick={() => setCat(c.id)}
              style={{
                padding: '16px 8px',
                textAlign: 'center',
                fontSize: 12,
                cursor: 'pointer',
                position: 'relative',
                color: cat === c.id ? C.dark : C.sub,
                fontWeight: cat === c.id ? 600 : 400,
                background: cat === c.id ? C.bg : '#fff',
                transition: 'all 0.2s',
                display: 'flex', flexDirection: 'column', alignItems: 'center',
                gap: 4,
              }}
            >
              {cat === c.id && (
                <div style={{

                  width: 3, height: 24, borderRadius: '0 2px 2px 0',

                }} />
              )}

        {/* Right product list */}

              >

                  onClick={() => handleAdd(p)}

                {/* Product card (front) */}
                <div

                          <span style={{
                            color: C.dark, fontFamily: 'monospace',
                            fontWeight: 500, minWidth: 70,
                          }}>{p.name}</span>
                          <span style={{
                            color: C.wood, fontSize: 10,
                            minWidth: 40,
                          }}>{p.type}</span>
                          <span style={{ color: C.muted, flex: 1 }}>{p.desc}</span>
                          {p.required && (
                            <span style={{
                              color: C.accent, fontSize: 10, flexShrink: 0,
                            }}>必填</span>
                          )}
                        </div>
                      ))}
                    </div>
                  </>
                )}

                <div style={{ fontSize: 11, fontWeight: 600, color: C.dark, margin: '10px 0 6px' }}>
                  响应示例
                </div>
                <pre style={{
                  background: C.dark, color: '#A8D5BA',
                  padding: '10px 12px', borderRadius: 8,
                  fontSize: 10, lineHeight: 1.6,
                  overflowX: 'auto',
                  fontFamily: "'SF Mono', 'Menlo', monospace",
                }}>{api.response}</pre>
              </div>
            </div>
          ))}

          <div style={{
            marginTop: 8, padding: '12px 14px',
            background: C.paleGreen, borderRadius: 10,
            fontSize: 11, color: C.dark, lineHeight: 1.6,
          }}>
            <strong>通用响应格式</strong><br />
            code: 0 表示成功，非 0 表示错误<br />
            message: 错误描述（失败时返回）<br />
            data: 业务数据
          </div>
        </div>
      </div>
    </div>
  );
}

// ==================== PAGE ROUTER ====================
function PageRouter() {
  const { pageStack, activeTab, sheet, closeSheet, toast, reducedMotion } = useApp();
  const topPage = pageStack[pageStack.length - 1];
  const isTabPage = topPage.tab;

  const renderPage = (page) => {
    switch (page.name) {
      case 'home': return <HomePage />;
      case 'gallery': return <GalleryPage />;
      case 'school': return <SchoolPage />;
      case 'me': return <MePage />;
      case 'detail': return <DetailPage work={page.params?.work || WORKS[0]} />;
      case 'workshop': return <WorkshopPage />;
      case 'specs': return <SpecsPage />;
      case 'market': return <MarketPage />;
      case 'api': return <ApiPage />;
      default: return <HomePage />;
    }
  };

  const pageName = topPage.name;
  const key = `${pageName}-${pageStack.length}`;

  return (
    <div style={{ position: 'relative', width: '100%', height: '100%', overflow: 'hidden' }}>
      {/* Current page */}
      <div
        key={key}
        className={isTabPage ? '' : (reducedMotion ? '' : 'page-slide-in')}
        style={{
          position: 'absolute', inset: 0,
          display: 'flex', flexDirection: 'column',
        }}
      >
        {renderPage(topPage)}
      </div>

      {/* Tab bar (only on tab pages) */}
      {isTabPage && (
        <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0 }}>
          <TabBar />
        </div>
      )}

      {/* Action sheet */}
      <ActionSheet
        visible={!!sheet}
        onClose={closeSheet}
        title={sheet?.title}
        items={sheet?.items || []}
      />

      {/* Toast */}
      <Toast text={toast} />

      {/* Floating entry to workshop from home */}
      {/* Market is accessible from home quick entries, but we want all 8 pages reachable */}
    </div>
  );
}

// ==================== DEVICE WRAPPER ====================
function DeviceFrame() {
  return (
    <div className="device-wrap" style={{
      position: 'relative',
      width: 390, maxWidth: '100%',
      height: 844, maxHeight: 'calc(100vh - 48px)',
    }}>
      {/* Phone body */}
      <div style={{
        position: 'absolute', inset: 0,
        borderRadius: 46,
        background: '#1a1a1a',
        boxShadow: '0 0 0 2px #2a2a2a, inset 0 0 0 1px rgba(255,255,255,0.05)',
        padding: 10,
      }}>
        {/* Screen */}
        <div style={{
          width: '100%', height: '100%',
          borderRadius: 38,
          overflow: 'hidden',
          background: C.bg,
          position: 'relative',
        }}>
          {/* Dynamic island */}
          <div style={{
            position: 'absolute', top: 10, left: '50%',
            transform: 'translateX(-50%)',
            width: 95, height: 28,
            borderRadius: 20,
            background: '#000',
            zIndex: 1000,
          }} />

          {/* App content */}
          <div style={{
            position: 'absolute', inset: 0,
            display: 'flex', flexDirection: 'column',
          }}>
            <PageRouter />
          </div>

          {/* Home indicator */}
          <div style={{
            position: 'absolute', bottom: 6, left: '50%',
            transform: 'translateX(-50%)',
            width: 134, height: 5,
            borderRadius: 3,
            background: 'rgba(0,0,0,0.3)',
            zIndex: 100,
          }} />
        </div>
      </div>
    </div>
  );
}

// ==================== MAIN APP ====================
function App() {
  return (
    <AppProvider>
      <DeviceFrame />
    </AppProvider>
  );
}

// Announce upgrade capability
function announceUpgrade() {
  try {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  } catch (e) {}
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

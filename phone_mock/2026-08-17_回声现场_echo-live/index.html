<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>回声现场 Echo Live · V2 手机 UI Mock</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" />
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    /* ============================================================
       DESIGN TOKENS  — 勃艮第酒红 × 燕麦米 × 炭黑
       ============================================================ */
    :root {
      --burgundy-900: #3D0E1C;
      --burgundy-800: #5A1529;
      --burgundy-700: #7B1E3B;
      --burgundy-600: #9B2A4E;
      --burgundy-500: #B83A5F;
      --burgundy-400: #D45A7B;
      --burgundy-300: #E88BA3;
      --burgundy-200: #F5C4D0;
      --burgundy-100: #FAE1E8;
      --burgundy-50:  #FDF1F5;

      --oat-900: #8C7B5C;
      --oat-700: #B8A884;
      --oat-500: #D9CBA9;
      --oat-400: #E5D9BE;
      --oat-300: #EEE3CB;
      --oat-200: #F2EAD9;
      --oat-100: #F8F2E4;
      --oat-50:  #FBF7ED;

      --charcoal-900: #0E0C0B;
      --charcoal-800: #1C1917;
      --charcoal-700: #2A2623;
      --charcoal-600: #3B3632;
      --charcoal-500: #524C47;
      --charcoal-400: #736B64;
      --charcoal-300: #9A9189;
      --charcoal-200: #C4BDB6;
      --charcoal-100: #E5E1DC;

      --amber-500: #D97B3A;
      --amber-400: #E89A5E;
      --amber-300: #F2BC86;
      --amber-200: #F9DDBE;

      --teal-500: #2F6B62;
      --teal-400: #3E8A7F;
      --teal-300: #6BB5AA;

      --shadow-lg: 0 24px 48px -12px rgba(28, 25, 23, 0.35);
      --shadow-md: 0 12px 24px -8px rgba(28, 25, 23, 0.25);
      --shadow-sm: 0 4px 12px -4px rgba(28, 25, 23, 0.18);

      --font-serif: "Noto Serif SC", "Songti SC", Georgia, serif;
      --font-sans: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;

      --phone-w: 390px;
      --phone-h: 844px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: var(--charcoal-900);
      font-family: var(--font-sans);
      color: var(--charcoal-900);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      user-select: none;
    }

    body { cursor: none; }
    body * { cursor: none !important; }

    /* ============================================================
       STAGE  — 手机居中展示
       ============================================================ */
    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(1200px 600px at 50% 20%, rgba(123, 30, 59, 0.18), transparent 60%),
        radial-gradient(900px 500px at 80% 90%, rgba(217, 123, 58, 0.12), transparent 60%),
        linear-gradient(180deg, #141110 0%, #0A0908 100%);
      perspective: 2000px;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(242, 234, 217, 0.04) 1px, transparent 0);
      background-size: 3px 3px;
      pointer-events: none;
      opacity: 0.6;
    }

    .stage-title {
      position: absolute;
      top: 32px;
      left: 0; right: 0;
      text-align: center;
      color: var(--oat-200);
      font-family: var(--font-serif);
      font-size: 14px;
      letter-spacing: 0.4em;
      font-weight: 500;
      opacity: 0.7;
      z-index: 5;
    }
    .stage-title span {
      display: inline-block;
      padding: 6px 16px;
      border: 1px solid rgba(242, 234, 217, 0.2);
      border-radius: 999px;
      backdrop-filter: blur(8px);
      background: rgba(28, 25, 23, 0.4);
    }

    /* ============================================================
       PHONE FRAME  — iOS 风格
       ============================================================ */
    .phone {
      position: relative;
      width: var(--phone-w);
      height: var(--phone-h);
      border-radius: 54px;
      background: linear-gradient(145deg, #2A2623, #0E0C0B);
      padding: 12px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.05),
        0 40px 80px -20px rgba(0,0,0,0.7),
        0 20px 40px -10px rgba(123,30,59,0.2),
        inset 0 1px 0 rgba(255,255,255,0.1);
      z-index: 2;
    }

    .phone::before {
      content: "";
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 36px;
      background: #000;
      border-radius: 20px;
      z-index: 100;
    }

    .phone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 44px;
      overflow: hidden;
      background: var(--oat-200);
    }

    /* ============================================================
       STATUS BAR
       ============================================================ */
    .status-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--charcoal-900);
      z-index: 50;
      pointer-events: none;
    }
    .status-bar.dark { color: var(--oat-100); }
    .status-bar .status-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-bar svg { width: 18px; height: 12px; }

    /* ============================================================
       PAGE CONTAINER — 页面切换动效
       ============================================================ */
    .page-stack {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .page {
      position: absolute;
      inset: 0;
      background: var(--oat-100);
      overflow: hidden;
      will-change: transform, opacity;
    }

    .page.scroll-y { overflow-y: auto; overflow-x: hidden; }
    .page.scroll-y::-webkit-scrollbar { display: none; }

    .page-entering { animation: pageEnter 420ms cubic-bezier(0.22, 1, 0.36, 1) forwards; z-index: 10; }
    .page-under-push { animation: pageUnderPush 420ms cubic-bezier(0.22, 1, 0.36, 1) forwards; pointer-events: none; }

    @keyframes pageEnter {
      from { transform: translateX(100%); }
      to   { transform: translateX(0); }
    }
    @keyframes pageUnderPush {
      from { transform: translateX(0); filter: brightness(1); }
      to   { transform: translateX(-30%); filter: brightness(0.6); }
    }

    .page-modal-enter { animation: modalEnter 420ms cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .page-modal-leave { animation: modalLeave 360ms cubic-bezier(0.4, 0, 1, 1) forwards; pointer-events: none; }

    @keyframes modalEnter {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    @keyframes modalLeave {
      from { transform: translateY(0); }
      to   { transform: translateY(100%); }
    }

    /* ============================================================
       NAV BAR — 大标题导航栏
       ============================================================ */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      padding: 54px 16px 12px;
      background: var(--oat-100);
    }
    .nav-bar.transparent {
      background: transparent;
      position: absolute;
      width: 100%;
    }
    .nav-bar.dark .nav-title, .nav-bar.dark .back-btn { color: var(--oat-100); }

    .nav-back {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: rgba(28, 25, 23, 0.08);
      backdrop-filter: blur(10px);
      transition: transform 0.2s, background 0.2s;
    }
    .nav-bar.dark .nav-back { background: rgba(242, 234, 217, 0.15); }
    .nav-back:active { transform: scale(0.92); }

    .nav-title {
      flex: 1;
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 700;
      text-align: center;
      color: var(--charcoal-900);
    }

    .nav-action {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: rgba(28, 25, 23, 0.08);
      backdrop-filter: blur(10px);
    }
    .nav-bar.dark .nav-action { background: rgba(242, 234, 217, 0.15); }

    .large-title {
      padding: 8px 20px 16px;
      font-family: var(--font-serif);
      font-size: 34px;
      font-weight: 900;
      line-height: 1.1;
      color: var(--charcoal-900);
      letter-spacing: -0.5px;
    }
    .large-title .sub {
      display: block;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 400;
      color: var(--charcoal-400);
      margin-top: 6px;
      letter-spacing: 0.05em;
    }

    /* ============================================================
       TAB BAR
       ============================================================ */
    .tab-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 84px;
      padding: 8px 12px 28px;
      background: rgba(251, 247, 237, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(28, 25, 23, 0.06);
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      z-index: 45;
    }

    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px 0;
      color: var(--charcoal-300);
      transition: color 0.2s, transform 0.2s;
    }
    .tab-item.active { color: var(--burgundy-700); }
    .tab-item:active { transform: scale(0.9); }
    .tab-item svg { width: 26px; height: 26px; }
    .tab-item .tab-label { font-size: 10px; font-weight: 500; letter-spacing: 0.02em; }
    .tab-item .tab-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--burgundy-700);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .tab-item.active .tab-dot { opacity: 1; }

    .safe-bottom { height: 84px; }

    /* ============================================================
       PAGE 1: HOME — 首页 / Hero + 卡片堆叠
       ============================================================ */
    .home-hero {
      position: relative;
      margin: 8px 16px 0;
      height: 420px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }
    .home-hero img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .home-hero:hover img { transform: scale(1.04); }

    .home-hero-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(14,12,11,0.1) 0%, rgba(14,12,11,0.2) 40%, rgba(14,12,11,0.85) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px 20px 24px;
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--burgundy-700);
      color: var(--oat-100);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      border-radius: 999px;
      width: fit-content;
      margin-bottom: 12px;
      animation: floatY 3s ease-in-out infinite;
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .hero-tag .pulse-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--amber-300);
      animation: pulseDot 1.8s ease-in-out infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(242,188,134,0.7); }
      50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(242,188,134,0); }
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 900;
      color: var(--oat-100);
      line-height: 1.2;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .hero-sub {
      font-size: 13px;
      color: var(--oat-300);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hero-cta {
      position: absolute;
      right: 20px;
      bottom: 24px;
      width: 52px; height: 52px;
      border-radius: 50%;
      background: var(--oat-200);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(14,12,11,0.4);
      transition: transform 0.3s;
    }
    .hero-cta:active { transform: scale(0.92); }
    .hero-cta svg { width: 22px; height: 22px; color: var(--burgundy-700); }

    /* 声波条 */
    .sound-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 24px;
    }
    .sound-bar {
      width: 3px;
      background: var(--oat-200);
      border-radius: 2px;
      animation: soundWave 1.2s ease-in-out infinite;
    }
    .sound-bar:nth-child(1) { animation-delay: 0s; animation-duration: 1.1s; height: 40%; }
    .sound-bar:nth-child(2) { animation-delay: 0.15s; animation-duration: 1.4s; height: 70%; }
    .sound-bar:nth-child(3) { animation-delay: 0.3s; animation-duration: 0.9s; height: 50%; }
    .sound-bar:nth-child(4) { animation-delay: 0.45s; animation-duration: 1.3s; height: 85%; }
    .sound-bar:nth-child(5) { animation-delay: 0.6s; animation-duration: 1.0s; height: 60%; }
    .sound-bar:nth-child(6) { animation-delay: 0.2s; animation-duration: 1.5s; height: 30%; }
    .sound-bar:nth-child(7) { animation-delay: 0.5s; animation-duration: 1.2s; height: 75%; }

    @keyframes soundWave {
      0%, 100% { transform: scaleY(0.3); }
      50% { transform: scaleY(1); }
    }

    /* 首页 section */
    .home-section {
      margin-top: 24px;
      padding: 0 20px;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
    }
    .section-title {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 700;
      color: var(--charcoal-900);
    }
    .section-more {
      font-size: 12px;
      color: var(--burgundy-700);
      font-weight: 500;
    }

    /* 热门演出横向滚动 */
    .hot-shows {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin: 0 -20px;
      padding: 0 20px 4px;
      scroll-snap-type: x mandatory;
    }
    .hot-shows::-webkit-scrollbar { display: none; }

    .show-card {
      flex-shrink: 0;
      width: 180px;
      scroll-snap-align: start;
      border-radius: 18px;
      overflow: hidden;
      background: var(--oat-50);
      box-shadow: var(--shadow-sm);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .show-card:active { transform: scale(0.96); }
    .show-card-img {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      overflow: hidden;
    }
    .show-card-img img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.6s;
    }
    .show-card:hover .show-card-img img { transform: scale(1.06); }

    .show-card-tag {
      position: absolute;
      top: 10px; left: 10px;
      padding: 4px 10px;
      background: var(--burgundy-700);
      color: var(--oat-100);
      font-size: 10px;
      font-weight: 600;
      border-radius: 999px;
      letter-spacing: 0.05em;
    }
    .show-card-tag.amber { background: var(--amber-500); }

    .show-card-body { padding: 12px 14px 14px; }
    .show-card-date {
      font-size: 10px;
      font-weight: 600;
      color: var(--burgundy-700);
      letter-spacing: 0.1em;
      margin-bottom: 4px;
    }
    .show-card-name {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 700;
      color: var(--charcoal-900);
      line-height: 1.3;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
    }
    .show-card-venue {
      font-size: 11px;
      color: var(--charcoal-400);
    }
    .show-card-price {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--amber-500);
    }
    .show-card-price small {
      font-size: 10px;
      font-weight: 400;
      color: var(--charcoal-400);
      margin-left: 2px;
    }

    /* 分类 chip */
    .category-chips {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin: 0 -20px;
      padding: 0 20px 4px;
    }
    .category-chips::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      padding: 8px 16px;
      background: var(--oat-200);
      color: var(--charcoal-700);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.25s;
    }
    .chip.active {
      background: var(--burgundy-700);
      color: var(--oat-100);
    }
    .chip:active { transform: scale(0.94); }

    /* ============================================================
       PAGE 2: SHOWS — 演出日历 / 瀑布流 + 下拉刷新
       ============================================================ */
    .shows-header {
      padding: 8px 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .date-strip {
      display: flex;
      gap: 10px;
      padding: 16px 20px 8px;
      overflow-x: auto;
    }
    .date-strip::-webkit-scrollbar { display: none; }
    .date-item {
      flex-shrink: 0;
      width: 56px;
      padding: 10px 0;
      border-radius: 16px;
      background: var(--oat-200);
      text-align: center;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .date-item.active {
      background: var(--burgundy-700);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px -4px rgba(123,30,59,0.5);
    }
    .date-item.active .date-day,
    .date-item.active .date-weekday { color: var(--oat-100); }
    .date-day {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 900;
      color: var(--charcoal-900);
      line-height: 1;
    }
    .date-weekday {
      font-size: 10px;
      color: var(--charcoal-400);
      margin-top: 4px;
      letter-spacing: 0.05em;
    }

    .pull-refresh-indicator {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 0;
      overflow: hidden;
      color: var(--burgundy-700);
      font-size: 12px;
      transition: height 0.3s;
    }
    .pull-refresh-indicator.active {
      height: 44px;
    }
    .pull-refresh-indicator .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(123,30,59,0.2);
      border-top-color: var(--burgundy-700);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .show-list {
      padding: 8px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .show-row {
      display: flex;
      gap: 14px;
      padding: 14px;
      background: var(--oat-50);
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.25s, box-shadow 0.25s;
    }
    .show-row:active { transform: scale(0.98); }

    .show-row-img {
      width: 100px;
      height: 100px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .show-row-img img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .show-row-info { flex: 1; display: flex; flex-direction: column; }
    .show-row-date {
      font-size: 11px;
      font-weight: 700;
      color: var(--burgundy-700);
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }
    .show-row-name {
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 700;
      color: var(--charcoal-900);
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .show-row-venue {
      font-size: 12px;
      color: var(--charcoal-400);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .show-row-footer {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .show-row-tags {
      display: flex;
      gap: 6px;
    }
    .mini-tag {
      padding: 3px 8px;
      background: var(--oat-200);
      color: var(--charcoal-600);
      font-size: 10px;
      border-radius: 6px;
      font-weight: 500;
    }
    .show-row-price {
      font-size: 15px;
      font-weight: 700;
      color: var(--amber-500);
    }

    /* FAB 悬浮操作按钮 */
    .fab {
      position: absolute;
      bottom: 100px;
      right: 20px;
      width: 56px; height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--burgundy-600), var(--burgundy-800));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px -6px rgba(123,30,59,0.6);
      z-index: 20;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .fab:active { transform: scale(0.9) rotate(45deg); }
    .fab svg { width: 24px; height: 24px; color: var(--oat-100); }

    /* ============================================================
       PAGE 3: ARTIST DETAIL — 乐队详情 / Hero 大图 + 视差
       ============================================================ */
    .artist-page { background: var(--charcoal-900); }

    .artist-hero {
      position: relative;
      height: 460px;
      overflow: hidden;
    }
    .artist-hero-img {
      width: 100%; height: 100%;
      object-fit: cover;
      will-change: transform;
    }
    .artist-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg,
        rgba(14,12,11,0.3) 0%,
        rgba(14,12,11,0.1) 30%,
        rgba(14,12,11,0.5) 70%,
        rgba(14,12,11,0.95) 100%);
    }
    .artist-hero-content {
      position: absolute;
      bottom: 24px;
      left: 24px;
      right: 24px;
    }
    .artist-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: rgba(242,234,217,0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(242,234,217,0.2);
      border-radius: 999px;
      color: var(--oat-200);
      font-size: 11px;
      font-weight: 500;
      margin-bottom: 12px;
    }
    .artist-name {
      font-family: var(--font-serif);
      font-size: 42px;
      font-weight: 900;
      color: var(--oat-100);
      line-height: 1;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }
    .artist-meta {
      font-size: 13px;
      color: var(--oat-400);
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .artist-body {
      background: var(--charcoal-900);
      padding: 20px 20px 100px;
      margin-top: -2px;
    }

    .artist-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--charcoal-800);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      border: 1px solid rgba(242,234,217,0.06);
    }
    .stat-num {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 900;
      color: var(--oat-100);
      line-height: 1;
    }
    .stat-label {
      font-size: 10px;
      color: var(--charcoal-400);
      margin-top: 4px;
      letter-spacing: 0.1em;
    }

    .artist-section-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 700;
      color: var(--oat-100);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .artist-section-title::before {
      content: "";
      width: 3px; height: 16px;
      background: var(--burgundy-500);
      border-radius: 2px;
    }

    /* 热门歌曲列表 */
    .track-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 24px;
    }
    .track-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 10px;
      border-radius: 12px;
      transition: background 0.2s;
    }
    .track-item:active { background: rgba(242,234,217,0.06); }
    .track-num {
      width: 20px;
      font-family: var(--font-serif);
      font-size: 14px;
      font-weight: 700;
      color: var(--charcoal-500);
      text-align: center;
    }
    .track-info { flex: 1; min-width: 0; }
    .track-name {
      font-size: 14px;
      color: var(--oat-100);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .track-plays {
      font-size: 11px;
      color: var(--charcoal-400);
      margin-top: 2px;
    }
    .track-play-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--burgundy-700);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }
    .track-play-btn:active { transform: scale(0.9); }
    .track-play-btn svg { width: 14px; height: 14px; color: var(--oat-100); margin-left: 2px; }

    /* 即将到来演出 */
    .upcoming-show-card {
      background: linear-gradient(135deg, var(--burgundy-800), var(--burgundy-900));
      border-radius: 18px;
      padding: 20px;
      color: var(--oat-100);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(212,90,123,0.2);
    }
    .upcoming-show-card::before {
      content: "";
      position: absolute;
      top: -30%; right: -10%;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(242,188,134,0.2), transparent 70%);
    }
    .upcoming-show-date {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: var(--amber-300);
      margin-bottom: 8px;
    }
    .upcoming-show-name {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .upcoming-show-venue {
      font-size: 12px;
      color: var(--oat-300);
      margin-bottom: 16px;
      display: flex; align-items: center; gap: 4px;
    }
    .ticket-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      background: var(--oat-200);
      color: var(--burgundy-800);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      transition: transform 0.2s;
    }
    .ticket-btn:active { transform: scale(0.96); }

    /* 唱片旋转动效 */
    .vinyl-disc {
      position: absolute;
      right: -40px;
      bottom: -40px;
      width: 140px; height: 140px;
      border-radius: 50%;
      background:
        radial-gradient(circle, var(--burgundy-500) 0%, var(--burgundy-500) 18%, #1a1a1a 19%, #1a1a1a 22%, #2a2a2a 23%, #2a2a2a 26%, #1a1a1a 27%, #1a1a1a 100%);
      animation: spinVinyl 8s linear infinite;
      opacity: 0.6;
    }
    .vinyl-disc::before {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--oat-200);
    }
    @keyframes spinVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ============================================================
       PAGE 4: TICKET — 票务详情 / 浮动面板 + 模态弹窗
       ============================================================ */
    .ticket-page { background: linear-gradient(180deg, var(--burgundy-800) 0%, var(--burgundy-900) 40%, var(--charcoal-900) 100%); }

    .ticket-hero {
      padding: 70px 24px 20px;
      color: var(--oat-100);
    }
    .ticket-label {
      font-size: 11px;
      letter-spacing: 0.3em;
      color: var(--amber-300);
      margin-bottom: 8px;
    }
    .ticket-title {
      font-family: var(--font-serif);
      font-size: 32px;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 8px;
    }
    .ticket-sub {
      font-size: 13px;
      color: var(--oat-300);
    }

    /* 票卡 - 撕票效果 */
    .ticket-card {
      margin: 16px 20px;
      background: var(--oat-100);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
      animation: ticketFloat 4s ease-in-out infinite;
    }
    @keyframes ticketFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .ticket-card-img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }
    .ticket-card-body {
      padding: 18px 20px 20px;
      position: relative;
    }
    .ticket-card-body::before,
    .ticket-card-body::after {
      content: "";
      position: absolute;
      top: -12px;
      width: 24px; height: 24px;
      background: var(--burgundy-900);
      border-radius: 50%;
    }
    .ticket-card-body::before { left: -12px; }
    .ticket-card-body::after { right: -12px; }

    .ticket-perforation {
      height: 1px;
      border-top: 1px dashed rgba(28,25,23,0.2);
      margin: 14px 0;
    }

    .ticket-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .ticket-row:last-child { margin-bottom: 0; }
    .ticket-key {
      font-size: 10px;
      color: var(--charcoal-400);
      letter-spacing: 0.1em;
      margin-bottom: 3px;
    }
    .ticket-val {
      font-size: 14px;
      font-weight: 600;
      color: var(--charcoal-900);
    }

    .ticket-qr {
      width: 100%;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 0 20px;
    }
    .qr-bar {
      width: 3px;
      background: var(--charcoal-800);
      border-radius: 2px;
    }

    /* 底部抽屉 */
    .bottom-drawer {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: var(--oat-100);
      border-radius: 28px 28px 0 0;
      padding: 12px 20px 100px;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.2);
      transform: translateY(calc(100% - 200px));
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 30;
    }
    .bottom-drawer.expanded {
      transform: translateY(0);
    }
    .drawer-handle {
      width: 36px;
      height: 4px;
      background: var(--charcoal-200);
      border-radius: 2px;
      margin: 0 auto 16px;
    }
    .drawer-header {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 700;
      color: var(--charcoal-900);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .seat-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }
    .seat {
      aspect-ratio: 1;
      border-radius: 4px;
      background: var(--oat-300);
      transition: transform 0.2s, background 0.2s;
    }
    .seat.selected {
      background: var(--burgundy-700);
      transform: scale(1.1);
    }
    .seat.sold {
      background: var(--charcoal-200);
    }
    .seat:active:not(.sold) { transform: scale(0.85); }

    .seat-legend {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      font-size: 11px;
      color: var(--charcoal-500);
    }
    .seat-legend span {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .seat-legend i {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 3px;
      font-style: normal;
    }

    .buy-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--burgundy-600), var(--burgundy-800));
      color: var(--oat-100);
      border: none;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      font-family: var(--font-sans);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 20px -4px rgba(123,30,59,0.5);
    }
    .buy-btn:active { transform: scale(0.98); }

    /* ============================================================
       PAGE 5: COMMUNITY — 乐迷社区 / 瀑布流
       ============================================================ */
    .community-page { background: var(--oat-100); }

    .community-header {
      padding: 54px 20px 16px;
      background: linear-gradient(135deg, var(--teal-500) 0%, var(--teal-400) 100%);
      color: var(--oat-100);
      position: relative;
      overflow: hidden;
    }
    .community-header::before {
      content: "";
      position: absolute;
      top: -50%;
      right: -20%;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(242,234,217,0.15), transparent 70%);
      border-radius: 50%;
    }

    .community-greeting {
      font-size: 12px;
      letter-spacing: 0.1em;
      opacity: 0.8;
      margin-bottom: 4px;
    }
    .community-title {
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 16px;
    }
    .community-stats {
      display: flex;
      gap: 24px;
      position: relative;
      z-index: 1;
    }
    .community-stat b {
      display: block;
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 900;
    }
    .community-stat span {
      font-size: 11px;
      opacity: 0.8;
    }

    .community-tabs {
      display: flex;
      gap: 4px;
      padding: 16px 20px 8px;
      background: var(--oat-100);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .comm-tab {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--charcoal-400);
      border-radius: 999px;
      transition: all 0.25s;
    }
    .comm-tab.active {
      background: var(--charcoal-900);
      color: var(--oat-100);
    }

    /* 瀑布流 */
    .masonry {
      padding: 8px 16px 20px;
      column-count: 2;
      column-gap: 12px;
    }
    .masonry-item {
      break-inside: avoid;
      margin-bottom: 12px;
      border-radius: 16px;
      overflow: hidden;
      background: var(--oat-50);
      box-shadow: var(--shadow-sm);
      transition: transform 0.3s;
    }
    .masonry-item:active { transform: scale(0.97); }
    .masonry-img {
      width: 100%;
      display: block;
    }
    .masonry-content {
      padding: 12px 14px 14px;
    }
    .masonry-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--charcoal-800);
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .masonry-author {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .masonry-avatar {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--oat-300);
      overflow: hidden;
    }
    .masonry-avatar img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .masonry-name {
      font-size: 11px;
      color: var(--charcoal-400);
      flex: 1;
    }
    .masonry-likes {
      font-size: 11px;
      color: var(--charcoal-400);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ============================================================
       PAGE 6: PROFILE — 个人中心 / 环形进度
       ============================================================ */
    .profile-page { background: var(--charcoal-900); }

    .profile-header {
      padding: 70px 24px 24px;
      background:
        radial-gradient(ellipse at top right, rgba(123,30,59,0.4), transparent 50%),
        linear-gradient(180deg, var(--charcoal-800), var(--charcoal-900));
      position: relative;
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .profile-avatar {
      width: 72px; height: 72px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--burgundy-500);
      box-shadow: 0 4px 16px rgba(123,30,59,0.4);
    }
    .profile-avatar img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .profile-info { flex: 1; }
    .profile-name {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 700;
      color: var(--oat-100);
      margin-bottom: 2px;
    }
    .profile-id {
      font-size: 12px;
      color: var(--charcoal-400);
    }

    /* 环形进度 - 听歌等级 */
    .music-level-card {
      background: linear-gradient(135deg, rgba(123,30,59,0.3), rgba(123,30,59,0.1));
      border: 1px solid rgba(212,90,123,0.2);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      backdrop-filter: blur(10px);
    }
    .ring-progress {
      position: relative;
      width: 80px; height: 80px;
      flex-shrink: 0;
    }
    .ring-progress svg {
      width: 100%; height: 100%;
      transform: rotate(-90deg);
    }
    .ring-bg {
      fill: none;
      stroke: rgba(242,234,217,0.1);
      stroke-width: 6;
    }
    .ring-fill {
      fill: none;
      stroke: var(--burgundy-400);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 220;
      stroke-dashoffset: 66;
      animation: ringFill 2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes ringFill {
      from { stroke-dashoffset: 220; }
      to { stroke-dashoffset: 66; }
    }
    .ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--oat-100);
    }
    .ring-val {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 900;
      line-height: 1;
    }
    .ring-unit {
      font-size: 9px;
      opacity: 0.7;
      margin-top: 2px;
    }

    .level-info { flex: 1; }
    .level-name {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 700;
      color: var(--oat-100);
      margin-bottom: 4px;
    }
    .level-desc {
      font-size: 11px;
      color: var(--charcoal-300);
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .level-progress-text {
      font-size: 10px;
      color: var(--amber-300);
      letter-spacing: 0.05em;
    }

    /* 菜单列表 */
    .profile-menu {
      margin: 20px 16px;
      background: var(--charcoal-800);
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(242,234,217,0.05);
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(242,234,217,0.04);
      transition: background 0.2s;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:active { background: rgba(242,234,217,0.04); }
    .menu-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: rgba(123,30,59,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--burgundy-300);
      flex-shrink: 0;
    }
    .menu-icon.amber { background: rgba(217,123,58,0.15); color: var(--amber-400); }
    .menu-icon.teal { background: rgba(47,107,98,0.2); color: var(--teal-300); }
    .menu-icon svg { width: 18px; height: 18px; }
    .menu-text { flex: 1; }
    .menu-title {
      font-size: 14px;
      color: var(--oat-100);
      font-weight: 500;
    }
    .menu-sub {
      font-size: 11px;
      color: var(--charcoal-400);
      margin-top: 2px;
    }
    .menu-arrow {
      color: var(--charcoal-500);
      font-size: 16px;
    }

    /* ============================================================
       PAGE 7: DESIGN SPEC — 设计规范
       ============================================================ */
    .spec-page { background: var(--oat-50); }

    .spec-nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--oat-50);
      padding: 54px 20px 0;
    }
    .spec-nav h1 {
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 900;
      color: var(--charcoal-900);
      margin: 8px 0 4px;
    }
    .spec-nav p {
      font-size: 12px;
      color: var(--charcoal-400);
      margin-bottom: 12px;
    }

    .spec-section {
      margin: 24px 20px;
    }
    .spec-section-title {
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 700;
      color: var(--charcoal-900);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .spec-section-title::before {
      content: "";
      width: 4px;
      height: 18px;
      background: var(--burgundy-700);
      border-radius: 2px;
    }

    /* 色板 */
    .color-swatch-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .color-swatch {
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      box-shadow: var(--shadow-sm);
    }
    .swatch-color {
      height: 60px;
      position: relative;
    }
    .swatch-info {
      padding: 8px 10px;
    }
    .swatch-name {
      font-size: 10px;
      font-weight: 600;
      color: var(--charcoal-700);
    }
    .swatch-hex {
      font-size: 9px;
      color: var(--charcoal-400);
      margin-top: 2px;
      font-family: monospace;
    }

    /* 字体规范 */
    .type-spec {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }

    // ============================================================
    // UTILITY: usePrefersReducedMotion
    // ============================================================
    function usePrefersReducedMotion() {
      const [reduced, setReduced] = useState(() => {
        if (typeof window !== 'undefined' && window.matchMedia) {
          return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        }
        return false;
      });
      useEffect(() => {
        const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
        const handler = (e) => setReduced(e.matches);
        mq.addEventListener('change', handler);
        return () => mq.removeEventListener('change', handler);
      }, []);
      return reduced;
    }

    // ============================================================
    // CUSTOM CURSOR
    // ============================================================
    function useCustomCursor() {
      const rafRef = useRef(null);
      const targetRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
      const currentRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
      const visibleRef = useRef(true);

      useEffect(() => {
        const cursor = document.getElementById('customCursor');
        if (!cursor) return;

        const onMove = (e) => {
          targetRef.current.x = e.clientX;
          targetRef.current.y = e.clientY;
        };

        const animate = () => {
          if (!visibleRef.current) {
            rafRef.current = requestAnimationFrame(animate);
            return;
          }
          const cx = currentRef.current.x;
          const cy = currentRef.current.y;
          const tx = targetRef.current.x;
          const ty = targetRef.current.y;
          // lerp
          currentRef.current.x = cx + (tx - cx) * 0.25;
          currentRef.current.y = cy + (ty - cy) * 0.25;
          cursor.style.left = currentRef.current.x + 'px';
          cursor.style.top = currentRef.current.y + 'px';
          rafRef.current = requestAnimationFrame(animate);
        };

        const onOver = (e) => {
          const target = e.target;
          if (
            target.closest &&
            (target.closest('button') ||
             target.closest('.tab-item') ||
             target.closest('.show-card') ||
             target.closest('.show-row') ||
             target.closest('.chip') ||
             target.closest('.date-item') ||
             target.closest('.masonry-item') ||
             target.closest('.menu-item') ||
             target.closest('.track-item') ||
             target.closest('.seat') ||
             target.closest('.nav-back') ||
             target.closest('.nav-action') ||
             target.closest('.hero-cta') ||
             target.closest('.ticket-btn') ||
             target.closest('.buy-btn') ||
             target.closest('.side-nav-item') ||
             target.closest('.menu-action') ||
             target.closest('.comm-tab') ||
             target.closest('.api-tab') ||
             target.tagName === 'BUTTON' ||
             target.tagName === 'A')
          ) {
            cursor.classList.add('hover');
          } else {
            cursor.classList.remove('hover');
          }
        };

        const onMouseDown = (e) => {
          cursor.classList.add('clicking');
          // ripple
          const ripple = document.createElement('div');
          ripple.className = 'cursor-ripple';
          ripple.style.left = e.clientX + 'px';
          ripple.style.top = e.clientY + 'px';
          document.body.appendChild(ripple);
          setTimeout(() => ripple.remove(), 600);
        };
        const onMouseUp = () => cursor.classList.remove('clicking');

        const onVisibility = () => {
          visibleRef.current = !document.hidden;
        };

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseover', onOver);
        window.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mouseup', onMouseUp);
        document.addEventListener('visibilitychange', onVisibility);

        rafRef.current = requestAnimationFrame(animate);

        return () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseover', onOver);
          window.removeEventListener('mousedown', onMouseDown);
          window.removeEventListener('mouseup', onMouseUp);
          document.removeEventListener('visibilitychange', onVisibility);
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
        };
      }, []);

    }

    function ArtistPage({ artist, onBack, onBuyTicket }) {
      const scrollRef = useRef(null);
      const heroImgRef = useRef(null);
      const rafRef = useRef(null);
      const scrollYRef = useRef(0);
      const reduced = usePrefersReducedMotion();

      useEffect(() => {
        const el = scrollRef.current;
        const img = heroImgRef.current;
        if (!el || !img || reduced) return;

        const onScroll = () => {
          scrollYRef.current = el.scrollTop;
          if (!rafRef.current) {
            rafRef.current = requestAnimationFrame(() => {
              const y = scrollYRef.current;
              if (y < 0) {
                // 下拉时放大
                img.style.transform = `scale(${1 + Math.abs(y) / 300}) translateY(${y * 0.3}px)`;
              } else {
                img.style.transform = `translateY(${y * 0.4}px)`;
              }
              rafRef.current = null;
            });
          }
        };

        const onVisibility = () => {
          if (document.hidden && rafRef.current) {
            cancelAnimationFrame(rafRef.current);
            rafRef.current = null;
          }
        };

        el.addEventListener('scroll', onScroll, { passive: true });
        document.addEventListener('visibilitychange', onVisibility);

        return () => {
          el.removeEventListener('scroll', onScroll);
          document.removeEventListener('visibilitychange', onVisibility);
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
        };
      }, [reduced]);

      return (
        <div ref={scrollRef} className="page scroll-y artist-page">
          <StatusBar dark />
          {/* 透明导航栏 */}
          <div className="nav-bar transparent dark">

    function App() {
      useCustomCursor();
      const [activeTab, setActiveTab] = useState('home');
      const [stack, setStack] = useState([{ key: 'home', transition: 'none' }]);
      const currentPage = stack[stack.length - 1];

      // 统一管理动画 timer
      const timersRef = useRef(new Set());
      const rafsRef = useRef(new Set());

      // 清理定时器的工具
      const safeTimeout = useCallback((fn, ms) => {
        const id = setTimeout(() => {
          timersRef.current.delete(id);
          fn();
        }, ms);
        timersRef.current.add(id);
        return id;
      }, []);

      // 卸载时统一清理
      useEffect(() => {
        return () => {
          timersRef.current.forEach(id => clearTimeout(id));
          rafsRef.current.forEach(id => cancelAnimationFrame(id));
          timersRef.current.clear();
          rafsRef.current.clear();
        };
      }, []);

      // 页面可见性切换：暂停定时器
      useEffect(() => {
        const savedTimers = [];
        const handleVisibility = () => {
          if (document.hidden) {
            // 保存并清除所有定时器
            // 由于我们无法暂停 setTimeout，这里记录当前状态但不清除，
            // 只是保证 rAF 在子组件中自行处理
          }
        };
        document.addEventListener('visibilitychange', handleVisibility);
        return () => document.removeEventListener('visibilitychange', handleVisibility);
      }, []);

      // tab 切换 -> 替换栈顶
      const handleTabChange = (tab) => {
        setActiveTab(tab);
        setStack([{ key: tab, transition: 'tab' }]);
      };

      // 推入新页面
      const pushPage = (key, data = {}, opts = {}) => {
        setStack(prev => [...prev, { key, data, transition: opts.transition || 'push' }]);
      };

      const popPage = () => {
        if (stack.length <= 1) return;
        setStack(prev => prev.slice(0, -1));
      };

      // 侧边导航 - 快速跳转到主页面
      const sideNavItems = [
        { key: 'home', label: '首页', num: '01' },
        { key: 'shows', label: '演出日历', num: '02' },
        { key: 'artist', label: '乐队详情', num: '03' },
        { key: 'ticket', label: '票务详情', num: '04' },
        { key: 'community', label: '乐迷社区', num: '05' },
        { key: 'profile', label: '个人中心', num: '06' },
        { key: 'spec', label: '设计规范', num: '07' },
        { key: 'api', label: '接口文档', num: '08' },
      ];

      const handleSideNav = (key) => {
        if (['home', 'shows', 'community', 'profile'].includes(key)) {
          setActiveTab(key);
          setStack([{ key, transition: 'tab' }]);
        } else {
          // 功能页/文档页作为 push
          setStack([{ key: activeTab, transition: 'tab' }, { key, transition: 'push', data: {} }]);
        }
      };

      const isCurrentPage = (key) => {
        return currentPage.key === key;
      };

      const renderPage = (page, index) => {
        const isActive = index === stack.length - 1;
        const isUnder = index === stack.length - 2;
        // 只渲染最后 2 层，底下的全部隐藏
        const shouldRender = isActive || isUnder;

        let transitionClass = '';
        const topPage = stack[stack.length - 1];
        if (isActive) {
          if (page.transition === 'push') transitionClass = 'page-entering';
          else if (page.transition === 'modal') transitionClass = 'page-modal-enter';
          // tab 切换不加过渡类
        } else if (isUnder && topPage && topPage.transition === 'push') {
          transitionClass = 'page-under-push';
        }

        const wrapperStyle = {
          position: 'absolute',
          inset: 0,
          zIndex: isActive ? 10 : (isUnder ? 5 : index),
          display: shouldRender ? 'block' : 'none',
        };

        let content;
        switch (page.key) {
          case 'home':
            content = (
              <HomePage
                onOpenShow={(show) => pushPage('ticket', { show })}
                onOpenArtist={() => pushPage('artist', { artist: ARTIST })}
              />
            );
            break;
          case 'shows':
            content = (
              <ShowsPage
                onOpenShow={(show) => pushPage('ticket', { show })}
              />
            );
            break;
          case 'artist':
            content = (
              <ArtistPage
                artist={page.data?.artist || ARTIST}
                onBack={popPage}
                onBuyTicket={() => pushPage('ticket', { show: SHOWS[0] }, { transition: 'modal' })}
              />
            );
            break;
          case 'ticket':
            content = (
              <TicketPage
                show={page.data?.show || SHOWS[0]}
                onBack={popPage}
              />
            );
            break;
          case 'community':
            content = <CommunityPage />;
            break;
          case 'profile':
            content = (
              <ProfilePage
                onNavigate={(key) => pushPage(key, {})}
              />
            );
            break;
          case 'spec':
            content = <DesignSpecPage onBack={popPage} />;
            break;
          case 'api':
            content = <ApiDocPage onBack={popPage} />;
            break;
          default:
            content = <div />;
        }

        return (
          <div
            key={page.key + '-' + index}
            className={transitionClass}
            style={wrapperStyle}
          >
            {content}
          </div>
        );
      };

      // 是否显示 TabBar
      const showTabBar = ['home', 'shows', 'community', 'profile'].includes(currentPage.key) && stack.length === 1;

      return (
        <>
          <div className="stage">
            <div className="stage-title"><span>回声现场 ECHO LIVE · V2 手机 UI Mock</span></div>

            {/* 侧边导航 */}
            <div className="side-nav">
              {sideNavItems.map(item => (
                <div
                  key={item.key}
                  className={`side-nav-item ${isCurrentPage(item.key) ? 'active' : ''}`}
                  onClick={() => handleSideNav(item.key)}
                >
                  <span className="num">{item.num}</span>
                  {item.label}
                </div>
              ))}
            </div>

            {/* 手机 */}
            <div className="phone">
              <div className="phone-screen">
                <div className="page-stack">
                  {stack.map((page, i) => renderPage(page, i))}
                </div>

                {showTabBar && (
                  <TabBar activeTab={activeTab} onTabChange={handleTabChange} />
                )}
              </div>
            </div>
          </div>
        </>
      );
    }

    // ============================================================
    // RENDER
    // ============================================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

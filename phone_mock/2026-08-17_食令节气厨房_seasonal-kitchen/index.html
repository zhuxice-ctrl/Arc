<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="creative-medium" content="interactive-prototype">
<title>食令·节气厨房 | V2 微信小程序</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;900&family=ZCOOL+XiaoWei&family=DM+Serif+Display&display=swap">
<style>
/* ============================================================
   食令 · 节气厨房 — Seasonal Kitchen WeChat Mini Program
   Palette: 陶土红 #B5482E · 米白 #F5EDE0 · 竹青绿 #6B8E4E · 墨黑 #2A2520 · 柿橙 #D97E4A
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  background: linear-gradient(135deg, #EDE5D5 0%, #E0D5BE 100%);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Serif SC", system-ui, sans-serif;
  color: #2A2520;
  overflow: hidden;
  user-select: none;
}
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

/* ---------- Stage ---------- */
.stage {
  position: relative;
  display: flex;
  align-items: center;
  gap: 40px;
  padding: 40px;
}
.stage-title {
  position: fixed;
  top: 24px;
  left: 32px;
  font-family: "Noto Serif SC", serif;
  font-weight: 900;
  font-size: 13px;
  letter-spacing: 2px;
  color: #2A2520;
  opacity: 0.6;
}
.stage-sub {
  position: fixed;
  top: 44px;
  left: 32px;
  font-size: 11px;
  letter-spacing: 1px;
  color: #2A2520;
  opacity: 0.35;
}

/* ---------- Side panel (page nav) ---------- */
.side-nav {
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 160px;
}
.side-nav-group {
  font-size: 10px;
  letter-spacing: 1.5px;
  color: #2A2520;
  opacity: 0.4;
  margin-top: 10px;
  margin-bottom: 4px;
  text-transform: uppercase;
  font-weight: 600;
}
.side-nav-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
  color: #2A2520;
  opacity: 0.6;
  transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  border: 1px solid transparent;
}
.side-nav-btn:hover {
  opacity: 1;
  background: rgba(255, 255, 255, 0.4);
}
.side-nav-btn.active {
  opacity: 1;
  background: #2A2520;
  color: #F5EDE0;
  border-color: #2A2520;
}
.side-nav-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #B5482E;
  opacity: 0.6;
  flex-shrink: 0;
}
.side-nav-btn.active .side-nav-dot { opacity: 1; background: #D97E4A; }

/* ---------- Phone wrapper ---------- */
.phone-wrap {
  position: relative;
  transform-origin: center center;
}
.phone-shadow {
  position: absolute;
  bottom: -28px;
  left: 20px;
  right: 20px;
  height: 40px;
  background: radial-gradient(ellipse at center, rgba(42,37,32,0.25), transparent 70%);
  filter: blur(10px);
  pointer-events: none;
}

/* ---------- Custom cursor ---------- */
.cursor-outer, .cursor-inner, .cursor-glow {
  position: fixed;
  top: 0; left: 0;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  will-change: transform;
}
.cursor-outer {
  width: 38px; height: 38px;
  border: 2.5px solid #fff;
  border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(42,37,32,0.15), 0 2px 8px rgba(42,37,32,0.2);
  transition: width 0.25s cubic-bezier(0.2, 0.8, 0.2, 1),
              height 0.25s cubic-bezier(0.2, 0.8, 0.2, 1),
              border-color 0.25s ease;
  mix-blend-mode: difference;
}
.cursor-inner {
  width: 7px; height: 7px;
  background: #D97E4A;
  border-radius: 50%;
  box-shadow: 0 0 10px rgba(217,126,74,0.8), 0 0 20px rgba(217,126,74,0.4);
}
.cursor-glow {
  width: 60px; height: 60px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(217,126,74,0.15), transparent 70%);
  transition: transform 0.08s linear;
}
.cursor-outer.hovering {
  width: 56px; height: 56px;
  border-color: #fff;
}
.cursor-ripple {
  position: fixed;
  border-radius: 50%;
  border: 2px solid #B5482E;
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%, -50%) scale(0);
  opacity: 1;
  animation: ripple 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}
@keyframes ripple {
  to { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
}
@media (hover: none) {
  .cursor-outer, .cursor-inner, .cursor-glow { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .cursor-outer, .cursor-inner, .cursor-glow { transition: none !important; }
  .cursor-ripple { animation: none; }
}

/* ---------- Mini Program Capsule (wechat style) ---------- */
.wx-capsule {
  position: absolute;
  top: 50px;
  right: 12px;
  width: 88px;
  height: 32px;
  border-radius: 16px;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 100;
  border: 0.5px solid rgba(0,0,0,0.05);
  transition: background 0.3s ease;
}
.wx-capsule.dark {
  background: rgba(42,37,32,0.6);
  border-color: rgba(255,255,255,0.1);
}
.wx-capsule.dark .wx-cap-icon { color: #F5EDE0; }
.wx-cap-icon {
  font-size: 15px;
  color: #2A2520;
  opacity: 0.7;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  transition: all 0.2s ease;
  cursor: pointer;
}
.wx-cap-divider {
  width: 0.5px;
  height: 16px;
  background: rgba(42,37,32,0.15);
}
.wx-capsule.dark .wx-cap-divider { background: rgba(245,237,224,0.2); }

/* ---------- Screen container ---------- */
.screen {
  position: relative;
  width: 390px;
  height: 844px;
  border-radius: 48px;
  overflow: hidden;
  background: #F5EDE0;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Serif SC", system-ui, sans-serif;
  /* iOS frame look */
  border: 1px solid #DEE0E3;
  box-shadow:
    0 2px 0 rgba(255,255,255,0.6) inset,
    0 -2px 0 rgba(0,0,0,0.05) inset,
    0 20px 60px rgba(42,37,32,0.2);
}

/* iOS dynamic island */
.dynamic-island {
  position: absolute;
  top: 11px;
  left: 50%;
  transform: translateX(-50%);
  width: 126px;
  height: 37px;
  border-radius: 24px;
  background: #000;
  z-index: 200;
}

/* Status bar */
.status-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 62px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 0 24px 19px;
  z-index: 150;
  font-size: 17px;
  font-weight: 590;
  color: #2A2520;
  pointer-events: none;
}
.status-bar.dark { color: #F5EDE0; }
.status-bar-right {
  display: flex;
  gap: 7px;
  align-items: center;
}

/* Home indicator */
.home-indicator {
  position: absolute;
  bottom: 6px;
  left: 50%;
  transform: translateX(-50%);
  width: 139px;
  height: 5px;
  border-radius: 100px;
  background: rgba(42,37,32,0.25);
  z-index: 200;
}
.home-indicator.light { background: rgba(245,237,224,0.7); }

/* ---------- Page navigation ---------- */
.page-container {
  position: absolute;
  inset: 0;
  overflow: hidden;
}
.page {
  position: absolute;
  inset: 0;
  overflow: hidden;
  will-change: transform, opacity;
  transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.35s ease;
}
.page.slide-out-right { transform: translateX(100%); }
.page.slide-out-left { transform: translateX(-30%); opacity: 0; }
.page.active { transform: translateX(0); opacity: 1; }
.page.enter-left { transform: translateX(-100%); }
.page.enter-right { transform: translateX(100%); }

/* Page scroll area */
.page-scroll {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.page-scroll::-webkit-scrollbar { display: none; }

/* ---------- Tab bar ---------- */
.tab-bar {
  position: absolute;
  bottom: 0;
  left: 0; right: 0;
  height: 65px;
  padding-bottom: 24px;
  background: rgba(245, 237, 224, 0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 0.5px solid rgba(42,37,32,0.08);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 90;
}
.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  position: relative;
  width: 60px;
  padding-top: 6px;
}
.tab-icon {
  width: 26px; height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #8A8078;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
}
.tab-item.active .tab-icon {
  color: #B5482E;
  transform: translateY(-2px) scale(1.1);
}
.tab-item.active .tab-icon::after {
  content: '';
  position: absolute;
  bottom: -6px;
  left: 50%;
  transform: translateX(-50%);
  width: 4px; height: 4px;
  border-radius: 50%;
  background: #D97E4A;
  animation: tab-dot-pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes tab-dot-pop {
  0% { transform: translateX(-50%) scale(0); }
  100% { transform: translateX(-50%) scale(1); }
}
.tab-label {
  font-size: 10px;
  color: #8A8078;
  letter-spacing: 0.5px;
  transition: color 0.3s ease;
}
.tab-item.active .tab-label { color: #B5482E; font-weight: 600; }

/* ---------- Universal page styles ---------- */
.page-title {
  font-family: "Noto Serif SC", serif;
  font-weight: 900;
  font-size: 24px;
  letter-spacing: 2px;
  color: #2A2520;
}
.section-title {
  font-family: "Noto Serif SC", serif;
  font-weight: 600;
  font-size: 16px;
  letter-spacing: 1px;
  color: #2A2520;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title::before {
  content: '';
  width: 3px; height: 14px;
  background: #B5482E;
  border-radius: 2px;
}
.muted { color: #8A8078; }

/* ============================================================
   PAGE 1: HOME (食令首页) — Hero + Card Stack Layout
   ============================================================ */
.home-page .hero {
  position: relative;
  height: 420px;
  background: linear-gradient(180deg, #B5482E 0%, #C75D3A 40%, #D97E4A 100%);
  overflow: hidden;
}
.home-page .hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cpattern id='grain' x='0' y='0' width='100' height='100' patternUnits='userSpaceOnUse'%3E%3Ccircle cx='25' cy='25' r='0.5' fill='%23000' opacity='0.08'/%3E%3Ccircle cx='75' cy='75' r='0.5' fill='%23000' opacity='0.08'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width='400' height='400' fill='url(%23grain)'/%3E%3C/svg%3E");
  opacity: 0.5;
}
.hero-content {
  position: relative;
  z-index: 2;
  padding: 90px 24px 0;
  color: #F5EDE0;
}
.hero-season-label {
  font-size: 11px;
  letter-spacing: 3px;
  opacity: 0.7;
  margin-bottom: 6px;
  text-transform: uppercase;
}
.hero-season-name {
  font-family: "Noto Serif SC", serif;
  font-weight: 900;
  font-size: 52px;
  letter-spacing: 8px;
  line-height: 1.1;
  text-shadow: 0 2px 20px rgba(42,37,32,0.2);
}
.hero-season-en {
  font-family: "DM Serif Display", serif;
  font-size: 18px;
  font-style: italic;
  opacity: 0.6;
  margin-top: 4px;
  letter-spacing: 1px;
}
.hero-date {
  margin-top: 16px;
  font-size: 13px;
  opacity: 0.75;
  display: flex;
  align-items: center;
  gap: 8px;
}
.hero-date::before {
  content: '';
  width: 30px; height: 1px;
  background: currentColor;
  opacity: 0.5;
}
.hero-proverb {
  margin-top: 20px;
  font-size: 14px;
  line-height: 1.8;
  opacity: 0.85;
  max-width: 280px;
  font-family: "Noto Serif SC", serif;
}

/* Steam animation on hero */
.steam-container {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 18px;
  z-index: 3;
  pointer-events: none;
}
.steam {
  width: 4px;
  height: 60px;
  background: linear-gradient(0deg, rgba(245,237,224,0.8), rgba(245,237,224,0));
  border-radius: 2px;
  animation: steam-rise 3s ease-in-out infinite;
  filter: blur(1px);
}
.steam:nth-child(1) { animation-delay: 0s; height: 50px; }
.steam:nth-child(2) { animation-delay: 0.6s; height: 70px; }
.steam:nth-child(3) { animation-delay: 1.2s; height: 55px; }
.steam:nth-child(4) { animation-delay: 1.8s; height: 65px; }
.steam:nth-child(5) { animation-delay: 0.3s; height: 45px; }
@keyframes steam-rise {
  0% { transform: translateY(20px) scaleX(1); opacity: 0; }
  25% { opacity: 0.7; }
  50% { transform: translateY(-10px) scaleX(1.5); opacity: 0.5; }
  100% { transform: translateY(-50px) scaleX(2); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .steam { animation: none; opacity: 0.5; }
}

/* Hero bowl illustration */
.hero-bowl {
  position: absolute;
  bottom: -40px;
  right: -30px;
  width: 220px;
  height: 220px;
  z-index: 2;
  opacity: 0.15;
}

/* Home card stack */
.home-card-section {
  padding: 30px 20px 90px;
  margin-top: -50px;
  position: relative;
  z-index: 5;
}
.home-cards {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-top: 16px;
}
.home-card {
  background: #fff;
  border-radius: 20px;
  padding: 16px;
  display: flex;
  gap: 14px;
  align-items: center;
  box-shadow: 0 4px 20px rgba(42,37,32,0.06);
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  border: 1px solid rgba(42,37,32,0.04);
  position: relative;
  overflow: hidden;
}
.home-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(42,37,32,0.1);
}
.home-card-thumb {
  width: 68px; height: 68px;
  border-radius: 14px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
}
.home-card-info { flex: 1; min-width: 0; }
.home-card-title {
  font-weight: 600;
  font-size: 15px;
  color: #2A2520;
  margin-bottom: 4px;
  font-family: "Noto Serif SC", serif;
}
.home-card-desc {
  font-size: 12px;
  color: #8A8078;
  line-height: 1.5;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.home-card-tag {
  display: inline-block;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 8px;
  background: rgba(181,72,46,0.1);
  color: #B5482E;
  margin-top: 6px;
}

/* Quick actions row */
.quick-actions {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}
.quick-action {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 4px;
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.quick-action:hover {
  background: rgba(181,72,46,0.06);
  transform: scale(0.96);
}
.qa-icon {
  width: 44px; height: 44px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  background: #F5EDE0;
}
.qa-label {
  font-size: 11px;
  color: #2A2520;
  opacity: 0.7;
}

/* ============================================================
   PAGE 2: SOLAR TERMS WHEEL (节气图谱) — Radial Wheel Layout
   ============================================================ */
.terms-page {
  background: #2A2520;
  color: #F5EDE0;
}
.terms-header {
  padding: 90px 24px 20px;
  text-align: center;
}
.terms-title {
  font-family: "Noto Serif SC", serif;
  font-weight: 900;
  font-size: 28px;
  letter-spacing: 6px;
  margin-bottom: 6px;
}
.terms-subtitle {
  font-size: 12px;
  letter-spacing: 2px;
  opacity: 0.5;
  text-transform: uppercase;
}

/* Wheel container */
.terms-wheel-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 380px;
  position: relative;
  margin: 10px 0;
}
.terms-wheel {
  position: relative;
  width: 340px;
  height: 340px;
  animation: wheel-rotate 120s linear infinite;
}
@keyframes wheel-rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@media (prefers-reduced-motion: reduce) {
  .terms-wheel { animation: none; }
}
.wheel-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid rgba(245,237,224,0.1);
}
.wheel-ring-outer { inset: 10px; border-color: rgba(245,237,224,0.08); }
.wheel-ring-mid { inset: 60px; border-style: dashed; border-color: rgba(217,126,74,0.3); }
.wheel-ring-inner { inset: 110px; border-color: rgba(245,237,224,0.12); }
.wheel-center {
  position: absolute;
  inset: 140px;
  border-radius: 50%;
  background: linear-gradient(135deg, #B5482E, #D97E4A);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  animation: wheel-reverse 120s linear infinite;
  box-shadow: 0 0 40px rgba(217,126,74,0.3);
}
@keyframes wheel-reverse {
  from { transform: rotate(0deg); }
  to { transform: rotate(-360deg); }
}
@media (prefers-reduced-motion: reduce) {
  .wheel-center { animation: none; }
}
.wheel-center-label {
  font-size: 10px;
  letter-spacing: 2px;
  opacity: 0.7;
}
.wheel-center-term {
  font-family: "Noto Serif SC", serif;
  font-weight: 900;
  font-size: 22px;
  letter-spacing: 2px;
  margin: 2px 0;
}
.wheel-center-date {
  font-size: 10px;
  opacity: 0.6;
}

.term-item {
  position: absolute;
  top: 50%; left: 50%;
  transform-origin: center 150px;
  font-size: 11px;
  letter-spacing: 1px;
  opacity: 0.4;
  transition: all 0.3s ease;
  cursor: pointer;
  width: 40px;
  margin-left: -20px;
  text-align: center;
  font-family: "Noto Serif SC", serif;
}
.term-item.current {
  opacity: 1;
  color: #D97E4A;
  font-weight: 900;
  font-size: 13px;
}

/* Term detail below wheel */
.term-detail {
  padding: 0 24px;
  text-align: center;
}
.term-detail-name {
  font-family: "Noto Serif SC", serif;
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 8px;
  color: #D97E4A;
}
.term-detail-desc {
  font-size: 12px;
  line-height: 1.8;
  opacity: 0.6;
}
.term-detail-tags {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 14px;
}
.term-detail-tag {
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 11px;
  background: rgba(217,126,74,0.15);
  color: #D97E4A;
  border: 0.5px solid rgba(217,126,74,0.3);
}

/* Season dots at bottom */
.season-dots {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 20px 24px;
}
.season-dot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.season-dot-circle {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  opacity: 0.6;
  transition: all 0.2s ease;
}
.season-dot.active .season-dot-circle {
  opacity: 1;
  transform: scale(1.15);
  box-shadow: 0 0 12px currentColor;
}
.season-dot-label {
  font-size: 10px;
  opacity: 0.4;
}
.season-dot.active .season-dot-label { opacity: 0.8; }

/* ============================================================
   PAGE 3: RECIPE DETAIL (食单详情) — Parallax + Floating Bottom Bar
   ============================================================ */

  background: #F5EDE0;
}
.recipe-hero {

  height: 380px;
  overflow: hidden;
}
.recipe-hero-bg {

  background: linear-gradient(180deg, #D97E4A 0%, #B5482E 100%);
}
.recipe-hero-content {

  padding: 90px 24px 0;

}
.recipe-back-btn {

  align-items: center;
  justify-content: center;

}
.recipe-back-btn:hover {
  background: rgba(245,237,224,0.3);

}
.recipe-season-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 11px;
  background: rgba(245,237,224,0.2);
  backdrop-filter: blur(10px);
  letter-spacing: 2px;
  margin-bottom: 12px;
  border: 1px solid rgba(245,237,224,0.2);
}
.recipe-name {
  font-family: "Noto Serif SC", serif;
  font-weight: 900;
  font-size: 34px;

  margin-bottom: 10px;

}
.recipe-origin {
  font-size: 13px;

}
.recipe-meta {

}
.recipe-meta-item {

  align-items: center;

}

/* Recipe illustration (big steaming bowl) */
.recipe-dish {
  position: absolute;
  bottom: -50px;
  right: -20px;
  width: 180px;
  height: 180px;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: center;
}
.recipe-dish-bowl {
  width: 140px;
  height: 80px;
  border-radius: 0 0 70px 70px;
  background: linear-gradient(180deg, #F5EDE0 0%, #E8DDCC 100%);
  position: relative;
  box-shadow: 0 10px 30px rgba(42,37,32,0.3), inset 0 2px 4px rgba(255,255,255,0.5);
}
.recipe-dish-food {
  position: absolute;
  top: -15px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 40px;
  border-radius: 50%;
  background: radial-gradient(ellipse, #C47A3D 0%, #8B5A2B 100%);
  box-shadow: inset 0 -5px 10px rgba(42,37,32,0.3);
}

/* Recipe body */
.recipe-body {
  padding: 30px 20px 120px;
  position: relative;
  z-index: 5;
  margin-top: -40px;
  background: #F5EDE0;
  border-radius: 28px 28px 0 0;
}
.recipe-tabs {
  display: flex;
  gap: 24px;
  margin-bottom: 20px;
  border-bottom: 1px solid rgba(42,37,32,0.08);
  padding-bottom: 12px;
}
.recipe-tab {
  font-size: 14px;
  color: #8A8078;
  padding-bottom: 10px;
  position: relative;
  cursor: pointer;
  transition: color 0.2s ease;
  font-weight: 500;
}
.recipe-tab.active {
  color: #B5482E;
  font-weight: 700;
}
.recipe-tab.active::after {
  content: '';
  position: absolute;
  bottom: -13px;
  left: 0; right: 0;
  height: 2px;
  background: #B5482E;
  border-radius: 2px;
  animation: tab-line 0.3s ease;
}
@keyframes tab-line {
  from { width: 0; left: 50%; }
  to { width: 100%; left: 0; }
}

/* Ingredients */
.ingredients-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.ingredient-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: rgba(255,255,255,0.6);
  border-radius: 12px;
  border: 1px solid rgba(42,37,32,0.04);
}
.ingredient-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: #EDE5D5;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.ingredient-name { flex: 1; font-size: 14px; color: #2A2520; }
.ingredient-amount { font-size: 12px; color: #8A8078; font-family: "DM Serif Display", serif; font-style: italic; }

/* Steps */
.steps-list {
  display: flex;
  flex-direction: column;
  gap: 18px;
  counter-reset: step-counter;
}
.step-item {
  display: flex;
  gap: 14px;
  position: relative;
}
.step-item::before {
  counter-increment: step-counter;
  content: counter(step-counter,decimal-leading-zero);
  flex-shrink: 0;
  width: 32px; height: 32px;
  border-radius: 50%;
  background: #B5482E;
  color: #F5EDE0;
  font-family: "DM Serif Display", serif;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
}
.step-text {
  flex: 1;
  font-size: 13px;
  line-height: 1.7;
  color: #2A2520;
  padding-top: 6px;
}

/* Bottom action bar */
.recipe-bottom-bar {
  position: absolute;
  bottom: 34px;
  left: 0; right: 0;
  padding: 12px 20px 12px;
  background: rgba(245,237,224,0.95);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid rgba(42,37,32,0.06);
  display: flex;
  gap: 12px;
  align-items: center;
  z-index: 10;
}
.action-btn {
  width: 44px; height: 44px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(42,37,32,0.04);
  color: #2A2520;
  cursor: pointer;
  transition: all 0.2s ease;
  position: relative;
}
.action-btn:hover { background: rgba(42,37,32,0.08); }
.action-btn.liked { color: #B5482E; }
.primary-btn {
  flex: 1;
  height: 44px;
  border-radius: 14px;
  background: linear-gradient(135deg, #B5482E, #D97E4A);
  color: #F5EDE0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 4px 14px rgba(181,72,46,0.3);
  letter-spacing: 1px;
}
.primary-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(181,72,46,0.4);
}
.primary-btn:active { transform: translateY(0); }

/* ============================================================
   PAGE 4: INGREDIENTS (时令食材) — Sticky Tabs + Waterfall Grid
   ============================================================ */
.ingredients-page {
  background: #F5EDE0;
}
.ingredients-header {
  padding: 90px 20px 16px;
  background: #F5EDE0;
}
.ingredients-title {
  font-family: "Noto Serif SC", serif;
  font-weight: 900;
  font-size: 26px;
  letter-spacing: 3px;
  margin-bottom: 4px;
}
.ingredients-subtitle {
  font-size: 12px;
  color: #8A8078;
  letter-spacing: 1px;
}
/* Sticky filter bar */
.sticky-filter {
  position: sticky;
  top: 62px;
  z-index: 20;
  background: rgba(245,237,224,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 10px 16px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 0.5px solid rgba(42,37,32,0.06);
}
.sticky-filter::-webkit-scrollbar { display: none; }
.filter-chip {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 14px;
  font-size: 12px;
  background: rgba(42,37,32,0.04);
  color: #2A2520;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  white-space: nowrap;
  border: 1px solid transparent;
}
.filter-chip:hover { background: rgba(42,37,32,0.08); }
.filter-chip.active {
  background: #2A2520;
  color: #F5EDE0;
  font-weight: 600;
  border-color: #2A2520;
}

/* Waterfall grid */
.ingredient-grid {
  padding: 16px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding-bottom: 90px;
}
.ingredient-card {
  border-radius: 18px;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 4px 16px rgba(42,37,32,0.06);

  transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  position: relative;
  border: 1px solid rgba(42,37,32,0.04);
}
.ingredient-card:hover {
  transform: translateY(-3px) scale(1.01);
  box-shadow: 0 8px 24px rgba(42,37,32,0.12);
}
.ingredient-card-img {
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 52px;
  position: relative;
}
.ingredient-card.tall .ingredient-card-img { height: 150px; }
.ingredient-card.short .ingredient-card-img { height: 90px; }
.ingredient-card-body {
  padding: 12px;
}
.ingredient-card-name {
  font-weight: 600;
  font-size: 14px;
  color: #2A2520;
  margin-bottom: 2px;
  font-family: "Noto Serif SC", serif;
}
.ingredient-card-en {
  font-size: 10px;
  color: #8A8078;
  font-style: italic;
  font-family: "DM Serif Display", serif;
  margin-bottom: 8px;
}
.ingredient-card-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.ingredient-card-season {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 6px;
  background: rgba(107,142,78,0.12);
  color: #6B8E4E;
}
.ingredient-card-cal {
  font-size: 10px;
  color: #8A8078;
}

/* ============================================================
   PAGE 5: PERSONAL CENTER (我的) — Ring Progress + Grid Layout
   ============================================================ */
.profile-page {
  background: linear-gradient(180deg, #2A2520 0%, #2A2520 32%, #F5EDE0 32%, #F5EDE0 100%);
}
.profile-header {
  padding: 90px 24px 30px;
  color: #F5EDE0;
}
.profile-top {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
}
.profile-avatar {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, #B5482E, #D97E4A);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-family: "Noto Serif SC", serif;
  font-weight: 900;
  box-shadow: 0 4px 20px rgba(217,126,74,0.3);
  color: #F5EDE0;
  position: relative;
}
.profile-avatar::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 2px solid #D97E4A;
  animation: avatar-pulse 3s ease-in-out infinite;
}
@keyframes avatar-pulse {
  0%, 100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.1); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .profile-avatar::after { animation: none; }
}
.profile-info { flex: 1; }
.profile-name {
  font-family: "Noto Serif SC", serif;
  font-weight: 700;
  font-size: 20px;
  margin-bottom: 4px;
  letter-spacing: 1px;
}
.profile-motto {
  font-size: 12px;
  opacity: 0.6;
  font-style: italic;
}
.profile-settings {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(245,237,224,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: #F5EDE0;
  transition: all 0.2s ease;
}
.profile-settings:hover { background: rgba(245,237,224,0.2); }

/* Ring progress section */
.profile-stats-ring {
  display: flex;
  align-items: center;
  justify-content: space-around;
  background: #fff;
  border-radius: 20px;
  margin: -50px 16px 0;
  padding: 20px;
  box-shadow: 0 8px 30px rgba(42,37,32,0.1);
  position: relative;
  z-index: 5;
}
.ring-stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  position: relative;
}
.ring-chart {
  width: 70px; height: 70px;
  position: relative;
}
.ring-chart svg {
  width: 100%; height: 100%;
  transform: rotate(-90deg);
}
.ring-bg {
  fill: none;
  stroke: rgba(42,37,32,0.06);
  stroke-width: 5;
}
.ring-fg {
  fill: none;
  stroke-width: 5;
  stroke-linecap: round;
  stroke-dasharray: 188.5;
  transition: stroke-dashoffset 1.5s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.ring-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.ring-number {
  font-family: "DM Serif Display", serif;
  font-size: 18px;
  font-weight: 600;
  color: #2A2520;
}
.ring-label {
  font-size: 10px;
  color: #8A8078;
  margin-top: 2px;
}
.ring-stat-label {
  font-size: 11px;
  color: #2A2520;
  font-weight: 500;
}

/* Profile menu grid */
.profile-menu {
  padding: 24px 16px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
.menu-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.menu-item:hover { transform: scale(0.96); }
.menu-icon {
  width: 48px; height: 48px;
  border-radius: 14px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: 0 2px 8px rgba(42,37,32,0.06);
}
.menu-label {
  font-size: 11px;
  color: #2A2520;
  opacity: 0.7;
}

/* Recipe collection section */
.profile-section {
  padding: 0 20px 90px;
}
.profile-section-title {
  font-family: "Noto Serif SC", serif;
  font-weight: 600;
  font-size: 15px;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.profile-section-title span:last-child {
  font-size: 11px;
  color: #8A8078;
  font-weight: 400;
}
.collection-row {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 8px;
}
.collection-row::-webkit-scrollbar { display: none; }
.collection-card {
  flex-shrink: 0;
  width: 130px;
  border-radius: 14px;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 2px 10px rgba(42,37,32,0.06);
  cursor: pointer;
  transition: all 0.2s ease;
}
.collection-card:hover { transform: scale(0.98); }
.collection-thumb {
  height: 90px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
}
.collection-name {
  padding: 8px 10px;
  font-size: 12px;
  font-weight: 600;
  color: #2A2520;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ============================================================
   PAGE 6: DESIGN SPECS (设计规范) — Doc Layout with Side Nav
   ============================================================ */
.specs-page {
  background: #fff;
}
.specs-header {
  padding: 90px 20px 20px;
  border-bottom: 1px solid #EEE8DD;
  background: #F5EDE0;
}
.specs-title {
  font-family: "Noto Serif SC", serif;
  font-weight: 900;
  font-size: 22px;
  letter-spacing: 3px;
  margin-bottom: 4px;
}
.specs-subtitle {
  font-size: 11px;
  color: #8A8078;
  letter-spacing: 1px;
}

  padding: 20px;
  padding-bottom: 90px;
}
.spec-section {
  margin-bottom: 28px;
}
.spec-section-title {
  font-family: "Noto Serif SC", serif;
  font-weight: 700;
  font-size: 15px;

}

.type-sample-text {

/* Component gallery */

// ─── Custom Cursor (direct DOM manipulation, no React state) ──
function initCursor() {
  if (window.matchMedia('(hover: none)').matches) return;
  const outer = document.getElementById('cursorOuter');
  const inner = document.getElementById('cursorInner');
  const glow = document.getElementById('cursorGlow');
  if (!outer || !inner || !glow) return;

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let outerX = mouseX, outerY = mouseY;
  let glowX = mouseX, glowY = mouseY;
  let rafId = null;
  let paused = false;

  function animate() {
    if (paused) return;
    outerX += (mouseX - outerX) * 0.18;
    outerY += (mouseY - outerY) * 0.18;
    glowX += (mouseX - glowX) * 0.08;
    glowY += (mouseY - glowY) * 0.08;
    outer.style.transform = `translate(${outerX}px, ${outerY}px) translate(-50%, -50%)`;
    inner.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
    glow.style.transform = `translate(${glowX}px, ${glowY}px) translate(-50%, -50%)`;
    rafId = requestAnimationFrame(animate);
  }

  function onMove(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
    if (!rafId && !paused) {
      rafId = requestAnimationFrame(animate);
    }
    // update hover state
    const target = e.target;
    const interactive = target.closest('button, .side-nav-btn, .tab-item, .home-card, .quick-action, .filter-chip, .ingredient-card, .collection-card, .menu-item, .primary-btn, .action-btn, .api-method-card, .recipe-back-btn, .color-swatch, .fab, .sheet-action, .recipe-tab, .term-item, .season-dot');
    if (interactive) {
      outer.classList.add('hovering');
    } else {
      outer.classList.remove('hovering');
    }
  }

  function onClick(e) {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 650);
  }

  function handleVisibility() {
    if (document.hidden) {
      paused = true;
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    } else {
      paused = false;
      if (!rafId) rafId = requestAnimationFrame(animate);
    }
  }

  document.addEventListener('mousemove', onMove, { passive: true });
  document.addEventListener('click', onClick);
  document.addEventListener('visibilitychange', handleVisibility);

  // initial position
  outer.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
  inner.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
  glow.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
  rafId = requestAnimationFrame(animate);

  // cleanup on unload
  window.addEventListener('beforeunload', () => {
    if (rafId) cancelAnimationFrame(rafId);
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('click', onClick);
    document.removeEventListener('visibilitychange', handleVisibility);
  });
}

// ─── Scroll reveal observer ──────────────────────────────────
function initScrollReveal(container) {
  if (!container || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    container?.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
    return;
  }
  const elements = container.querySelectorAll('.reveal');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1, root: container });
  elements.forEach(el => observer.observe(el));
  return observer;
}

// ─── Number counter ──────────────────────────────────────────
function animateCounter(el, target, duration = 1500) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    el.textContent = target;
    return;
  }
  const start = 0;
  const startTime = performance.now();
  let rafId = null;

  function tick(now) {
    const progress = Math.min((now - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    el.textContent = Math.round(start + (target - start) * eased);
    if (progress < 1) rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);

  function handleVisibility() {
    if (document.hidden && rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    } else if (!document.hidden && !rafId) {
      // resume from current value
      const current = parseInt(el.textContent) || 0;
      if (current < target) {
        const remaining = target - current;
        const remainingDur = duration * (remaining / target);
        const s = performance.now();
        function resume(n) {
          const p = Math.min((n - s) / remainingDur, 1);
          const e = 1 - Math.pow(1 - p, 3);
          el.textContent = Math.round(current + remaining * e);
          if (p < 1) rafId = requestAnimationFrame(resume);
        }
        rafId = requestAnimationFrame(resume);
      }
    }
  }
  document.addEventListener('visibilitychange', handleVisibility);
  setTimeout(() => document.removeEventListener('visibilitychange', handleVisibility), duration + 100);
}

    return json
      .replace(/"(\w+)":/g, '<span class="api-code-key">"$1"</span>:')
      .replace(/: "([^"]+)"/g, ': <span class="api-code-string">"$1"</span>')
      .replace(/: (\d+)/g, ': <span class="api-code-number">$1</span>')
      .replace(/(true|false|null)/g, '<span class="api-code-keyword">$1</span>');
  };

  return (
    <div className="page-scroll api-page" ref={scrollRef}>
      <div className="api-header">
        <div className="api-title">接口文档</div>
        <div className="api-subtitle">API Documentation · v1.0</div>
      </div>

      <div className="api-body">
        {endpoints.map((ep, i) => (
          <div
            key={i}
            className={`api-method-card ${expanded === i ? 'expanded' : ''} reveal`}
            style={{transitionDelay: `${i * 0.04}s`}}
            onClick={() => setExpanded(expanded === i ? -1 : i)}
          >
            <div className="api-method-header">
              <span className={`api-method-badge ${methodClass(ep.method)}`}>{ep.method}</span>
              <span className="api-method-path">{ep.path}</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(245,237,224,0.4)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{
                transform: expanded === i ? 'rotate(180deg)' : 'rotate(0)',
                transition: 'transform 0.3s ease'
              }}>
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </div>
            <div className="api-method-desc">{ep.desc}</div>
            <div className="api-method-body">
              <div style={{fontSize: 10, color: 'rgba(245,237,224,0.5)', marginBottom: 4}}>响应示例 Response</div>
              <div className="api-code-block">
                <pre dangerouslySetInnerHTML={{ __html: highlightJSON(ep.response) }} />
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ============================================================
// APP SHELL
// ============================================================

function App() {
  const [currentPage, setCurrentPage] = useState('home');
  const [currentTab, setCurrentTab] = useState('home');
  const [direction, setDirection] = useState('left'); // left = new page comes from right
  const [selectedRecipeId, setSelectedRecipeId] = useState(1);
  const [isNavigating, setIsNavigating] = useState(false);

  const pagesWithTabBar = ['home', 'terms', 'ingredients', 'profile'];
  const showTabBar = pagesWithTabBar.includes(currentPage);

  // Determine capsule style per page
  const darkPages = ['terms', 'api', 'profile'];
  const isDark = darkPages.includes(currentPage);

  const switchToPage = useCallback((page, recipeId) => {
    if (isNavigating || page === currentPage) return;
    setIsNavigating(true);

    const tabPages = ['home', 'terms', 'ingredients', 'profile'];
    const fromTab = tabPages.indexOf(currentPage);
    const toTab = tabPages.indexOf(page);

    if (fromTab >= 0 && toTab >= 0) {
      // Tab switch: horizontal slide
      setDirection(toTab > fromTab ? 'left' : 'right');
    } else if (page === 'recipe') {
      // Push from right
      setDirection('left');
    } else if (currentPage === 'recipe') {
      // Pop back
      setDirection('right');
    } else {
      setDirection('left');
    }

    if (recipeId) setSelectedRecipeId(recipeId);
    setCurrentPage(page);

    // Update tab highlight
    if (tabPages.includes(page)) {
      setCurrentTab(page);
    }

    setTimeout(() => setIsNavigating(false), 380);
  }, [currentPage, isNavigating]);

  // Expose to global
  useEffect(() => {
    window.__switchPage = switchToPage;
  }, [switchToPage]);

  // Update status bar / capsule / home indicator
  useEffect(() => {
    const statusBar = document.getElementById('statusBar');
    const capsule = document.getElementById('wxCapsule');
    const homeInd = document.getElementById('homeIndicator');
    if (statusBar) {
      if (isDark) statusBar.classList.add('dark');
      else statusBar.classList.remove('dark');
    }
    if (capsule) {
      if (isDark) capsule.classList.add('dark');
      else capsule.classList.remove('dark');
    }
    if (homeInd) {
      if (isDark) homeInd.classList.add('light');
      else homeInd.classList.remove('light');
    }
  }, [isDark]);

  const renderPage = () => {
    switch (currentPage) {
      case 'home':
        return <HomePage
          onOpenRecipe={(id) => switchToPage('recipe', id)}
          onOpenTerms={() => switchToPage('terms')}
        />;
      case 'terms':
        return <TermsPage />;
      case 'recipe':
        return <RecipeDetailPage
          recipeId={selectedRecipeId}
          onBack={() => switchToPage('home')}
        />;
      case 'ingredients':
        return <IngredientsPage />;
      case 'profile':
        return <ProfilePage />;
      case 'specs':
        return <SpecsPage />;
      case 'api':
        return <ApiPage />;
      default:
        return <HomePage onOpenRecipe={(id) => switchToPage('recipe', id)} onOpenTerms={() => switchToPage('terms')} />;
    }
  };

  return (
    <>
      <div className={`page active`} key={currentPage}>
        {renderPage()}
      </div>
    </>
  );
}

// ─── Render ──────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('pageContainer'));
root.render(<App />);

// ─── Global page switcher (for side nav) ─────────────────────
function switchPage(page) {
  // Update side nav active state
  document.querySelectorAll('.side-nav-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.page === page);
  });

  if (window.__switchPage) {
    window.__switchPage(page);
  }
}

function switchTab(tab) {
  // Update tab active state
  document.querySelectorAll('.tab-item').forEach(item => {
    item.classList.toggle('active', item.dataset.tab === tab);
  });
  switchPage(tab);
}

// ─── Init cursor after DOM ready ─────────────────────────────
document.addEventListener('DOMContentLoaded', initCursor);

// ─── Announce upgrade capability ─────────────────────────────
function announceUpgrade() {
  try {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  } catch(e) {}
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}
</script>
</body>
</html>

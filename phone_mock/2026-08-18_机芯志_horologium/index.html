    pointer-events: none;
    z-index: 99999;
    transform: translate(-50%, -50%);
    transition: width 0.22s cubic-bezier(.2,.8,.2,1), height 0.22s cubic-bezier(.2,.8,.2,1),

    box-shadow: 0 0 18px rgba(201,111,74,0.6), 0 0 40px rgba(216,185,138,0.3);
    will-change: transform;
  }
  .cursor-dot {
    position: fixed;
    width: 6px; height: 6px;
    background: #C96F4A;
    border-radius: 50%;
    pointer-events: none;
    z-index: 100000;
    transform: translate(-50%, -50%);
    transition: background 0.2s, width 0.2s, height 0.2s;
    will-change: transform;
  }
  .cursor-outer.cursor-hover {
    width: 52px; height: 52px;
    border-color: #D8B98A;
    background: rgba(216,185,138,0.08);
  }
  .cursor-dot.cursor-hover {
    background: #D8B98A;
    width: 8px; height: 8px;
  }
  .cursor-ripple {
    position: fixed;
    width: 10px; height: 10px;
    border: 2px solid #C96F4A;
    border-radius: 50%;
    pointer-events: none;
    z-index: 99998;
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    animation: rippleAnim 0.6s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes rippleAnim {
    to { transform: translate(-50%, -50%) scale(8); opacity: 0; }
  }

  .stage {

    font-size: 12px;

  }

  /* ── 页面切换 ── */
  .screen-enter {
    animation: screenEnter 0.45s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes screenEnter {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .screen-back {
    animation: screenBack 0.4s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes screenBack {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .stagger-item {
    opacity: 0;
    transform: translateY(12px);
    animation: staggerIn 0.5s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes staggerIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .tab-bounce {
    animation: tabBounce 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes tabBounce {
    0% { transform: scale(1); }
    40% { transform: scale(1.25); }

  }

  .shimmer-card {
    position: relative;
    overflow: hidden;
  }
  .shimmer-card::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.12) 50%, transparent 70%);
    animation: shimmerSweep 3.5s ease-in-out infinite;
  }
  @keyframes shimmerSweep {
    0% { left: -100%; }

  }

  .glow-num {
    text-shadow: 0 0 20px rgba(216,185,138,0.5);

  .balance-wheel-swing {

  @media (prefers-reduced-motion: reduce) {

// ═══════════════════════════════════════════════════════════
//  自定义光标 (DOM 直操)
// ═══════════════════════════════════════════════════════════

function initCustomCursor() {
  const outer = document.getElementById('cursorOuter');
  const dot = document.getElementById('cursorDot');
  if (!outer || !dot) return;
  
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  
  // 初始居中
  outer.style.left = '50%';
  outer.style.top = '50%';
  dot.style.left = '50%';
  dot.style.top = '50%';
  
  let targetX = window.innerWidth / 2;
  let targetY = window.innerHeight / 2;
  let outerX = targetX;
  let outerY = targetY;
  let rafId = null;
  let running = true;
  
  const onMove = (e) => {
    targetX = e.clientX;
    targetY = e.clientY;
    // 内点直接跟随
    dot.style.transform = `translate(${targetX - dot.offsetWidth/2}px, ${targetY - dot.offsetHeight/2}px)`;
  };
  
  const animate = () => {
    if (!running) return;
    // 外环阻尼跟随
    outerX += (targetX - outerX) * 0.18;
    outerY += (targetY - outerY) * 0.18;
    outer.style.transform = `translate(${outerX - outer.offsetWidth/2}px, ${outerY - outer.offsetHeight/2}px)`;
    rafId = requestAnimationFrame(animate);
  };
  
  if (!reduced) {
    animate();
  } else {
    outer.style.left = '50%';
    outer.style.top = '50%';
  }
  
  const onVisibility = () => {
    if (document.hidden) {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
    } else if (!reduced) {
      running = true;
      animate();
    }
  };
  
  // hover 交互
  const onOver = (e) => {
    const el = e.target.closest('[data-interactive]');
    if (el) {
      outer.classList.add('cursor-hover');
      dot.classList.add('cursor-hover');
    } else {
      outer.classList.remove('cursor-hover');
      dot.classList.remove('cursor-hover');
    }
  };
  
  // 点击涟漪
  const onClick = (e) => {
    if (reduced) return;
    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  };
  
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseover', onOver);
  document.addEventListener('click', onClick);
  document.addEventListener('visibilitychange', onVisibility);
  
  // 保存清理函数
  window.__cursorCleanup = () => {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseover', onOver);
    document.removeEventListener('click', onClick);
    document.removeEventListener('visibilitychange', onVisibility);
  };
}

// ═══════════════════════════════════════════════════════════
//  摆轮组件（签名动效 #1：物理节律）
// ═══════════════════════════════════════════════════════════

function BalanceWheel() {
  const ref = useRef(null);
  const rafRef = useRef(null);
  const angleRef = useRef(0);
  const velRef = useRef(3); // 起始速度
  const targetAmpRef = useRef(25); // 目标振幅（度）
  
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) {
      el.style.transform = 'rotate(0deg)';
      return;
    }
    
    // 4Hz = 28800 vph, 一个来回 0.25s
    // 用简谐运动：angle = A * sin(ωt)
    // ω = 2π * 4 = 8π rad/s
    const omega = 8 * Math.PI;
    let t = 0;
    let last = performance.now();
    let running = true;
    
    const step = (now) => {
      if (!running) return;
      const dt = (now - last) / 1000;
      last = now;
      t += dt;
      
      // 振幅微扰动（模拟真实摆轮幅度变化）
      const wobble = Math.sin(t * 0.7) * 1.5;
      const amp = targetAmpRef.current + wobble;
      const angle = amp * Math.sin(omega * t);
      
      el.style.transform = `rotate(${angle}deg)`;
      rafRef.current = requestAnimationFrame(step);
    };
    
    rafRef.current = requestAnimationFrame(step);
    
    const onVis = () => {
      if (document.hidden) {
        running = false;
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      } else {
        running = true;
        last = performance.now();
        rafRef.current = requestAnimationFrame(step);
      }
    };
    document.addEventListener('visibilitychange', onVis);
    
    return () => {
      running = false;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, []);
  
  return (
    <div style={{ position: 'relative', width: 200, height: 200, margin: '0 auto' }}>
      {/* 背景刻度环 */}
      <svg width="200" height="200" viewBox="0 0 200 200" style={{ position: 'absolute', inset: 0 }}>
        <defs>
          <radialGradient id="wheelGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stopColor="#D8B98A" stopOpacity="0.3"/>
            <stop offset="70%" stopColor="#C96F4A" stopOpacity="0.1"/>
            <stop offset="100%" stopColor="#23272B" stopOpacity="0.5"/>
          </radialGradient>
        </defs>
        {/* 外圈刻度 */}
        {Array.from({length: 60}, (_, i) => {
          const angle = i * 6;
          const rad = angle * Math.PI / 180;
          const r1 = 95;
          const r2 = i % 5 === 0 ? 82 : 88;
          const x1 = 100 + r1 * Math.cos(rad);
          const y1 = 100 + r1 * Math.sin(rad);
          const x2 = 100 + r2 * Math.cos(rad);
          const y2 = 100 + r2 * Math.sin(rad);
          return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={i % 5 === 0 ? '#D8B98A' : 'rgba(140,146,153,0.4)'} strokeWidth={i % 5 === 0 ? 1.5 : 0.8}/>;
        })}
        {/* 内圈 */}
        <circle cx="100" cy="100" r="70" fill="none" stroke="rgba(216,185,138,0.2)" strokeWidth="1"/>
        <circle cx="100" cy="100" r="25" fill="url(#wheelGrad)"/>
      </svg>
      
      {/* 摆轮本体（旋转） */}
      <div ref={ref} style={{ position: 'absolute', inset: 0, transformOrigin: '100px 100px' }}>
        <svg width="200" height="200" viewBox="0 0 200 200">
          {/* 摆轮轮缘 */}
          <circle cx="100" cy="100" r="62" fill="none" stroke="#D8B98A" strokeWidth="5" strokeLinecap="round"/>
          {/* 轮辐 */}
          <line x1="100" y1="38" x2="100" y2="162" stroke="#D8B98A" strokeWidth="2"/>
          <line x1="38" y1="100" x2="162" y2="100" stroke="#D8B98A" strokeWidth="2"/>
          <line x1="56" y1="56" x2="144" y2="144" stroke="rgba(216,185,138,0.6)" strokeWidth="1.5"/>
          <line x1="56" y1="144" x2="144" y2="56" stroke="rgba(216,185,138,0.6)" strokeWidth="1.5"/>
          {/* 中心轴 */}
          <circle cx="100" cy="100" r="7" fill="#C96F4A"/>
          <circle cx="100" cy="100" r="3" fill="#23272B"/>
          {/* 游丝（螺旋形近似） */}
          <g transform="translate(100, 100)">
            <path d={(() => {
              let d = '';
              for (let i = 0; i <= 40; i++) {
                const a = i * 0.5;
                const r = 3 + i * 0.6;
                const x = r * Math.cos(a);
                const y = r * Math.sin(a);
                d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
              }
              return d;
            })()} fill="none" stroke="#C96F4A" strokeWidth="1.2"/>
          </g>
        </svg>
      </div>
      
      {/* 中心固定点（不旋转） */}
      <div style={{
        position: 'absolute', top: '50%', left: '50%',
        transform: 'translate(-50%, -50%)',
        width: 10, height: 10, borderRadius: '50%',
        background: '#23272B', border: '2px solid #C96F4A',
        boxShadow: '0 0 10px rgba(201,111,74,0.8)',
      }}/>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
//  表冠旋钮（签名动效 #2：可拖拽上链 + 阻尼回弹）
// ═══════════════════════════════════════════════════════════

function CrownKnob({ onWind }) {
  const ref = useRef(null);
  const rotationRef = useRef(0);
  const velocityRef = useRef(0);
  const draggingRef = useRef(false);
  const lastAngleRef = useRef(0);
  const rafRef = useRef(null);
  const [windCount, setWindCount] = useState(0);
  const [power, setPower] = useState(0); // 0-100
  
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    let running = true;
    
    const step = () => {
      if (!running) return;
      
      if (!draggingRef.current) {
        // 回弹 / 惯性
        velocityRef.current *= 0.92; // 阻尼
        rotationRef.current += velocityRef.current;
        
        // 如果没有被拖拽，缓慢回落到最近的整刻度（每15度一格）
        if (Math.abs(velocityRef.current) < 0.1) {
          const target = Math.round(rotationRef.current / 15) * 15;
          const diff = target - rotationRef.current;
          rotationRef.current += diff * 0.15;
        }
        
        // 上链动力缓慢下降（模拟动力消耗）
        setPower(p => Math.max(0, p - 0.02));
      }
      
      el.style.transform = `rotate(${rotationRef.current}deg)`;
      rafRef.current = requestAnimationFrame(step);
    };
    
    rafRef.current = requestAnimationFrame(step);
    
    const onVis = () => {
      if (document.hidden) {
        running = false;
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      } else {
        running = true;
        rafRef.current = requestAnimationFrame(step);
      }
    };
    document.addEventListener('visibilitychange', onVis);
    
    return () => {
      running = false;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, []);
  
  const getAngle = (e) => {
    const el = ref.current;
    if (!el) return 0;
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const x = e.clientX - cx;
    const y = e.clientY - cy;
    return Math.atan2(y, x) * 180 / Math.PI;
  };
  
  const handleStart = (e) => {
    draggingRef.current = true;
    lastAngleRef.current = getAngle(e);
    e.preventDefault();
  };
  
  const handleMove = useCallback((e) => {
    if (!draggingRef.current) return;
    const angle = getAngle(e);
    let delta = angle - lastAngleRef.current;
    
    // 处理角度跨越 180°
    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;
    
    rotationRef.current += delta;
    velocityRef.current = delta;
    lastAngleRef.current = angle;
    
    // 每旋转 30 度计入一次上链
    const totalDeg = rotationRef.current;
    const count = Math.floor(Math.abs(totalDeg) / 30);
    setWindCount(prev => {
      if (count > prev) {
        setPower(p => Math.min(100, p + 3));
        if (onWind) onWind(count - prev);
        return count;
      }
      return prev;
    });
  }, [onWind]);
  
  const handleEnd = () => {
    draggingRef.current = false;
  };
  
  useEffect(() => {
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);
    return () => {
      window.removeEventListener('mousemove', handleMove);
      window.removeEventListener('mouseup', handleEnd);
    };
  }, [handleMove]);
  
  const powerColor = power > 70 ? '#6BCB77' : power > 30 ? '#D8B98A' : '#C96F4A';
  
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16 }}>
      <div style={{
        width: 130, height: 130, borderRadius: '50%',
        background: 'radial-gradient(circle at 35% 35%, #3A3F45 0%, #1E2024 70%)',
        border: '3px solid #2A2D31',
        boxShadow: `
          inset 2px 2px 6px rgba(255,255,255,0.1),
          inset -2px -2px 6px rgba(0,0,0,0.6),
          0 8px 24px rgba(0,0,0,0.5),
          0 0 0 1px rgba(216,185,138,0.2)
        `,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        cursor: 'grab',
        touchAction: 'none',
      }} data-interactive
        onMouseDown={handleStart}
      >
        <div ref={ref} style={{
          width: 95, height: 95, borderRadius: '50%',
          background: `
            conic-gradient(from 0deg,
              #D8B98A 0deg, #A88E6A 20deg, #D8B98A 40deg, #A88E6A 60deg,
              #D8B98A 80deg, #A88E6A 100deg, #D8B98A 120deg, #A88E6A 140deg,
              #D8B98A 160deg, #A88E6A 180deg, #D8B98A 200deg, #A88E6A 220deg,
              #D8B98A 240deg, #A88E6A 260deg, #D8B98A 280deg, #A88E6A 300deg,
              #D8B98A 320deg, #A88E6A 340deg, #D8B98A 360deg
            )
          `,
          boxShadow: 'inset 0 0 20px rgba(0,0,0,0.5)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}>
          <div style={{
            width: 55, height: 55, borderRadius: '50%',
            background: 'radial-gradient(circle at 40% 40%, #2A2D31, #15171A)',
            border: '2px solid rgba(216,185,138,0.3)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            flexDirection: 'column',
          }}>
            <Icon name="crown" size={22} color="#D8B98A"/>
            <span style={{ color: '#8C9299', fontSize: 9, marginTop: 2, letterSpacing: 1 }}>WIND</span>
          </div>
        </div>
      </div>
      
      {/* 动力条 */}
      <div style={{ width: 130 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
          <span style={{ color: '#8C9299', fontSize: 11, letterSpacing: 0.5 }}>动力储存</span>
          <span style={{ color: powerColor, fontSize: 11, fontWeight: 600 }}>{Math.round(power)}%</span>
        </div>
        <div style={{
          height: 6, borderRadius: 3,
          background: 'rgba(140,146,153,0.2)',
          overflow: 'hidden',
        }}>
          <div style={{
            height: '100%', width: `${power}%`,
            background: `linear-gradient(90deg, ${powerColor}, ${power > 70 ? '#9DD8A5' : '#C96F4A'})`,
            borderRadius: 3,
            transition: 'width 0.3s ease',
            boxShadow: `0 0 8px ${powerColor}55`,
          }}/>
        </div>
        <div style={{ color: '#8C9299', fontSize: 10, marginTop: 6, textAlign: 'center', letterSpacing: 1 }}>
          已转动 {windCount} 格
        </div>
      </div>
    </div>
  );
}

function LargeNavHeader({ title, subtitle, rightAction, onBack, scrollRef }) {
  const [collapsed, setCollapsed] = useState(false);
  
  useEffect(() => {
    const el = scrollRef?.current;
    if (!el) return;
    let lastVal = 0;
    
    const onScroll = () => {
      const val = el.scrollTop;
      const shouldCollapse = val > 40;
      if (shouldCollapse !== lastVal) {
        lastVal = shouldCollapse;
        setCollapsed(shouldCollapse);
      }
    };
    el.addEventListener('scroll', onScroll, { passive: true });
    return () => el.removeEventListener('scroll', onScroll);
  }, [scrollRef]);
  
  return (
    <div style={{
      position: 'sticky', top: 0, zIndex: 20,
      background: collapsed ? 'rgba(20,22,25,0.9)' : 'transparent',
      backdropFilter: collapsed ? 'blur(20px)' : 'none',
      WebkitBackdropFilter: collapsed ? 'blur(20px)' : 'none',
      transition: 'all 0.3s cubic-bezier(.2,.8,.2,1)',
      paddingTop: 54,

      <div style={{
        display: 'flex', alignItems: 'center',
        padding: collapsed ? '8px 16px' : '0 16px',
        minHeight: collapsed ? 44 : 'auto',
        transition: 'all 0.3s cubic-bezier(.2,.8,.2,1)',
      }}>
        {onBack && (
          <div data-interactive onClick={onBack} style={{
            width: 36, height: 36, borderRadius: '50%',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            marginRight: 4,
          }}>
            <Icon name="back" size={20} color="#D8B98A"/>
          </div>
        )}
        {collapsed && (
          <div style={{ flex: 1, textAlign: 'center', color: '#F4EFE6', fontSize: 17, fontWeight: 600 }}>
            {title}
          </div>
        )}
        {rightAction && <div style={{ marginLeft: 'auto' }}>{rightAction}</div>}
        {!collapsed && onBack && <div style={{ width: 36 }}/>}
      </div>
      {!collapsed && (
        <div style={{ padding: '4px 20px 12px' }}>
          {subtitle && (
            <div style={{ color: '#8C9299', fontSize: 13, marginBottom: 4, letterSpacing: 0.5 }}>{subtitle}</div>

            color: '#F4EFE6',
            fontSize: 34, fontWeight: 700,
            letterSpacing: -0.5,
            lineHeight: 1.1,
            fontFamily: '"Noto Serif SC", serif',
          }}>{title}</h1>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
//  页面 2: 收藏库（瀑布流卡片 + 下拉刷新齿轮）
// ═══════════════════════════════════════════════════════════

function CollectionScreen({ onWatchClick }) {
  const scrollRef = useRef(null);
  const [pullDist, setPullDist] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const [activeFilter, setActiveFilter] = useState('全部');
  const pullStartRef = useRef(0);
  const pullingRef = useRef(false);
  
  const handleTouchStart = (e) => {
    const el = scrollRef.current;
    if (el && el.scrollTop <= 0) {
      pullingRef.current = true;
      pullStartRef.current = e.touches[0].clientY;
    }
  };
  
  const handleTouchMove = (e) => {
    if (!pullingRef.current) return;
    const delta = e.touches[0].clientY - pullStartRef.current;
    if (delta > 0) {
      const damped = Math.min(delta * 0.5, 100);
      setPullDist(damped);
    }
  };
  
  const handleTouchEnd = () => {
    if (!pullingRef.current) return;
    pullingRef.current = false;
    if (pullDist > 60) {
      setRefreshing(true);
      setPullDist(60);
      setTimeout(() => {
        setRefreshing(false);
        setPullDist(0);
      }, 1500);
    } else {
      setPullDist(0);
    }
  };
  
  // 瀑布流分栏
  const leftCol = WATCHES.filter((_, i) => i % 2 === 0);
  const rightCol = WATCHES.filter((_, i) => i % 2 === 1);
  
  const WatchCard = ({ watch, index, tall }) => (
    <div data-interactive
      key={watch.id}
      onClick={() => onWatchClick(watch)}
      className="stagger-item"
      style={{
        animationDelay: `${index * 0.08}s`,
        borderRadius: 20, overflow: 'hidden',
        background: 'rgba(35,39,43,0.8)',
        border: '1px solid rgba(140,146,153,0.12)',
        marginBottom: 12,
        transition: 'transform 0.3s',
      }}>
      <div style={{
        height: tall ? 180 : 140,
        background: `url(${WATCH_IMAGES[watch.color]}) center/cover`,
        position: 'relative',
      }}>
        <div style={{
          position: 'absolute', top: 10, right: 10,
          padding: '4px 8px', borderRadius: 10,
          background: 'rgba(0,0,0,0.5)',
          backdropFilter: 'blur(4px)',
          color: '#D8B98A', fontSize: 10, fontWeight: 500,
          letterSpacing: 0.5,
        }}>{watch.movement}</div>
      </div>
      <div style={{ padding: 12 }}>
        <div style={{ color: '#8C9299', fontSize: 10, letterSpacing: 1, marginBottom: 4 }}>
          {watch.brand}
        </div>
        <div style={{ color: '#F4EFE6', fontSize: 15, fontWeight: 600, marginBottom: 6 }}>
          {watch.name}
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <span style={{
            fontSize: 10, padding: '3px 7px', borderRadius: 6,
            background: 'rgba(216,185,138,0.12)',
            color: '#D8B98A',
          }}>{watch.caseSize}</span>
          <span style={{
            fontSize: 10, padding: '3px 7px', borderRadius: 6,
            background: 'rgba(201,111,74,0.12)',
            color: '#C96F4A',
          }}>{watch.freq}</span>
        </div>
      </div>
    </div>
  );
  
  const filters = ['全部', '正装', '运动', '复古', '军表'];
  
  return (
    <div ref={scrollRef} style={{
      position: 'absolute', inset: 0, bottom: 83,
      overflowY: 'auto',
      background: 'linear-gradient(180deg, #1A1D20 0%, #15171A 100%)',
    }}
    onTouchStart={handleTouchStart}
    onTouchMove={handleTouchMove}
    onTouchEnd={handleTouchEnd}
    data-screen-label="02">
      <LargeNavHeader title="收藏库" subtitle={`${WATCHES.length} 枚珍藏`} scrollRef={scrollRef}
        rightAction={
          <div data-interactive style={{ padding: 8 }}>
            <Icon name="search" size={22} color="#D8B98A"/>
          </div>
        }
      />
      
      {/* 下拉提示 */}
      <div style={{
        height: pullDist,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        overflow: 'hidden',
        transition: refreshing ? 'none' : 'height 0.3s cubic-bezier(.2,.8,.2,1)',
      }}>
        <div className={refreshing ? 'gear-spin' : ''}
          style={{ transition: 'transform 0.1s', transform: `rotate(${pullDist * 2}deg)` }}>
          <Icon name="gear" size={28} color={refreshing ? '#D8B98A' : '#8C9299'}/>
        </div>
      </div>
      
      {/* 分类筛选 */}
      <div style={{
        padding: '4px 16px 16px',
        display: 'flex', gap: 8,
        overflowX: 'auto',
      }}>
        {filters.map((f) => (
          <div key={f} data-interactive
            onClick={() => setActiveFilter(f)}
            style={{
              flexShrink: 0,
              padding: '8px 16px', borderRadius: 20,
              fontSize: 13, fontWeight: 500,
              background: activeFilter === f ? '#D8B98A' : 'rgba(140,146,153,0.15)',
              color: activeFilter === f ? '#23272B' : '#8C9299',
              transition: 'all 0.2s',
            }}>
            {f}
          </div>
        ))}
      </div>
      
      {/* 瀑布流 */}
      <div style={{ padding: '0 12px 24px', display: 'flex', gap: 10 }}>
        <div style={{ flex: 1 }}>
          {leftCol.map((w, i) => (
            <WatchCard key={w.id} watch={w} index={i*2} tall={i === 0}/>
          ))}
        </div>
        <div style={{ flex: 1 }}>
          {rightCol.map((w, i) => (
            <WatchCard key={w.id} watch={w} index={i*2+1} tall={i === 1}/>
          ))}
        </div>
      </div>
    </div>
  );
}

      if (y < 0) {

//  页面 6: 我的（统计圆环 + 设置列表）
// ═══════════════════════════════════════════════════════════

function ProfileScreen({ onGoSpec, onGoApi }) {
  const scrollRef = useRef(null);
  const canvasRef = useRef(null);
  const rafRef = useRef(null);
  const countRef = useRef({ total: 0, worn: 0, care: 0 });
  const targetRef = useRef({ total: 5, worn: 68, care: 12 });
  
  // 数字计数动画
  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) {
      countRef.current = { ...targetRef.current };
      return;
    }
    
    let running = true;
    const start = performance.now();
    const duration = 1200;
    
    const easeOut = (t) => 1 - Math.pow(1 - t, 3);
    
    const step = (now) => {
      if (!running) return;
      const t = Math.min((now - start) / duration, 1);
      const e = easeOut(t);
      
      countRef.current.total = Math.round(targetRef.current.total * e);
      countRef.current.worn = Math.round(targetRef.current.worn * e);
      countRef.current.care = Math.round(targetRef.current.care * e);
      
      // 更新 DOM
      const c = canvasRef.current;
      if (c) {
        const ctx = c.getContext('2d');
        const cx = 50, cy = 50, r = 42;
        
        ctx.clearRect(0, 0, 100, 100);
        // 背景环
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(140,146,153,0.2)';
        ctx.lineWidth = 6;
        ctx.stroke();
        
        // 进度环
        const percent = countRef.current.worn / 100;
        ctx.beginPath();
        ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * percent);
        const grad = ctx.createLinearGradient(0, 0, 100, 100);
        grad.addColorStop(0, '#D8B98A');
        grad.addColorStop(1, '#C96F4A');
        ctx.strokeStyle = grad;
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.stroke();
      }
      
      if (t < 1) {
        rafRef.current = requestAnimationFrame(step);
      }
    };
    
    rafRef.current = requestAnimationFrame(step);
    
    const onVis = () => {
      if (document.hidden) {
        running = false;
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      }
    };
    document.addEventListener('visibilitychange', onVis);
    
    return () => {
      running = false;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, []);
  
  const settingsGroups = [
    [
      { icon: 'bell', label: '养护提醒', detail: '开启', color: '#D8B98A' },
      { icon: 'flame', label: '动力预警阈值', detail: '30%', color: '#C96F4A' },

      { icon: 'shield', label: '数据备份', detail: 'iCloud', color: '#6BCB77', isLast: true },
    ],
  ];
  
  return (
    <div ref={scrollRef} style={{

// ═══════════════════════════════════════════════════════════
//  主 App
// ═══════════════════════════════════════════════════════════

function App() {
  const [activeTab, setActiveTab] = useState('today');
  const [detailWatch, setDetailWatch] = useState(null);
  const [showSpec, setShowSpec] = useState(false);
  const [showApi, setShowApi] = useState(false);
  const [transitionKey, setTransitionKey] = useState(0);
  const [transitionDir, setTransitionDir] = useState('forward');
  
  const handleTabChange = (tab) => {
    setActiveTab(tab);
    setDetailWatch(null);
    setShowSpec(false);
    setShowApi(false);
    setTransitionKey(k => k + 1);
    setTransitionDir('forward');
  };
  
  const handleWatchClick = (watch) => {
    setDetailWatch(watch);
    setTransitionKey(k => k + 1);
    setTransitionDir('forward');
  };
  
  const handleBack = () => {
    setDetailWatch(null);
    setShowSpec(false);
    setShowApi(false);
    setTransitionKey(k => k + 1);
    setTransitionDir('back');
  };
  
  const handleGoSpec = () => {
    setShowSpec(true);
    setTransitionKey(k => k + 1);
    setTransitionDir('forward');
  };
  
  const handleGoApi = () => {
    setShowApi(true);
    setTransitionKey(k => k + 1);
    setTransitionDir('forward');
  };
  
  // 决定当前显示的屏幕
  const renderScreen = () => {
    if (showSpec) {
      return <DesignSpecScreen onBack={handleBack}/>;
    }
    if (showApi) {
      return <ApiDocScreen onBack={handleBack}/>;
    }
    if (detailWatch) {
      return <WatchDetailScreen watch={detailWatch} onBack={handleBack}/>;
    }
    
    switch (activeTab) {
      case 'today':
        return <TodayScreen onGo={handleTabChange}/>;
      case 'collection':
        return <CollectionScreen onWatchClick={handleWatchClick}/>;
      case 'community':
        return <CommunityScreen/>;
      case 'profile':
        return <ProfileScreen onGoSpec={handleGoSpec} onGoApi={handleGoApi}/>;
      default:
        return <TodayScreen/>;
    }
  };
  
  const showTabBar = !detailWatch && !showSpec && !showApi;
  
  return (
    <IOSDevice width={390} height={844}>
      <div key={transitionKey}
        className={transitionDir === 'forward' ? 'screen-enter' : 'screen-back'}
        style={{
          position: 'absolute', inset: 0,
        }}>
        {renderScreen()}
      </div>
      {showTabBar && <TabBar activeTab={activeTab} onTabChange={handleTabChange}/>}
    </IOSDevice>
  );
}

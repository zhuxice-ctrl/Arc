// ─────────────────────────────────────────────────────────────
// Custom cursor
// ─────────────────────────────────────────────────────────────
function initCursor() {
  const cursor = document.getElementById('custom-cursor');
  const dot = document.getElementById('custom-cursor-dot');
  let x = window.innerWidth / 2, y = window.innerHeight / 2;
  let tx = x, ty = y;
  let rafId = null;
  let visible = true;

  const update = () => {
    if (!visible) return;
    x += (tx - x) * 0.18;
    y += (ty - y) * 0.18;
    cursor.style.left = x + 'px';
    cursor.style.top = y + 'px';
    dot.style.left = tx + 'px';
    dot.style.top = ty + 'px';
    rafId = requestAnimationFrame(update);
  };

  const onMove = (e) => {
    tx = e.clientX; ty = e.clientY;
    if (!rafId) rafId = requestAnimationFrame(update);
  };

  const onDown = () => cursor.classList.add('click');
  const onUp = () => cursor.classList.remove('click');

  const onOver = (e) => {
    const t = e.target.closest('button, .clickable, [role="button"], a, input, textarea');
    if (t) cursor.classList.add('hover'); else cursor.classList.remove('hover');
  };

  const onVisibility = () => {
    if (document.hidden) {
      visible = false;
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    } else {
      visible = true;
      rafId = requestAnimationFrame(update);
    }
  };

  // Initial center position
  tx = window.innerWidth / 2; ty = window.innerHeight / 2;
  x = tx; y = ty;
  cursor.style.left = x + 'px';
  cursor.style.top = y + 'px';
  dot.style.left = tx + 'px';
  dot.style.top = ty + 'px';

  window.addEventListener('mousemove', onMove, { passive: true });
  window.addEventListener('mousedown', onDown);
  window.addEventListener('mouseup', onUp);
  document.addEventListener('mouseover', onOver);
  document.addEventListener('visibilitychange', onVisibility);
}

  return flowers[type] || flowers.plum;
}

function WXNavBar({ title = '', dark = false, onBack, showBack = true, variant = 'default', scrollY = 0 }) {

  const bgStyle = isTransparent
    ? (isOpaque ? 'rgba(245,237,224,0.92)' : 'transparent')
    : 'rgba(245,237,224,0.85)';
  const borderColor = isTransparent && !isOpaque ? 'transparent' : 'rgba(107,78,93,0.08)';

  return (
    <div style={{
      position: 'absolute', top: 0, left: 0, right: 0, zIndex: 25,
      paddingTop: 'var(--ios-safe-top)',
      background: bgStyle,

function HomePage({ onNavigate }) {
  const scrollRef = useRef(null);
  const [scrollY, setScrollY] = useState(0);
  const [pulling, setPulling] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const startY = useRef(0);
  const rafRef = useRef(null);

  const onScroll = useCallback((e) => {
    if (rafRef.current) return;
    rafRef.current = requestAnimationFrame(() => {
      setScrollY(e.target.scrollTop);
      rafRef.current = null;
    });
  }, []);

  const onTouchStart = (e) => {
    if (scrollRef.current?.scrollTop === 0) {
      startY.current = e.touches[0].clientY;
    }
  };

  const onTouchMove = (e) => {
    if (scrollRef.current?.scrollTop === 0 && startY.current) {
      const dy = e.touches[0].clientY - startY.current;
      if (dy > 0) setPulling(Math.min(dy * 0.5, 80));
    }
  };

  const onTouchEnd = () => {
    if (pulling > 50) {
      setRefreshing(true);
      setPulling(50);
      setTimeout(() => {
        setRefreshing(false);
        setPulling(0);
      }, 1500);
    } else {
      setPulling(0);
    }
    startY.current = 0;
  };

  // Ambient petals
  const petals = useMemo(() =>
    [...Array(6)].map((_, i) => ({
      left: Math.random() * 100,

        {/* Pull-to-refresh indicator */}

          position: 'absolute', top: 0, left: 0, right: 0,

// ─────────────────────────────────────────────────────────────
// Main App — mini-program container with page stack
// ─────────────────────────────────────────────────────────────
function App() {
  const [activeTab, setActiveTab] = useState('home');
  const [pageStack, setPageStack] = useState([{ key: 'home', direction: 'forward' }]);
  const [loading, setLoading] = useState(true);
  const [isTransitioning, setIsTransitioning] = useState(false);

  const currentPage = pageStack[pageStack.length - 1];

  // Initial loading — skeleton -> content
  useEffect(() => {
    const t = setTimeout(() => setLoading(false), 1200);
    return () => clearTimeout(t);
  }, []);

  // Page visibility handling for animations/timers
  useEffect(() => {
    let hidden = false;
    const onVisibility = () => {
      hidden = document.hidden;
    };
    document.addEventListener('visibilitychange', onVisibility);
    return () => document.removeEventListener('visibilitychange', onVisibility);
  }, []);

  const navigate = useCallback((pageKey) => {
    if (isTransitioning) return;
    setIsTransitioning(true);
    setPageStack(prev => [...prev, { key: pageKey, direction: 'forward' }]);
    setTimeout(() => setIsTransitioning(false), 380);
  }, [isTransitioning]);

  const goBack = useCallback(() => {
    if (isTransitioning) return;
    if (pageStack.length <= 1) return;
    setIsTransitioning(true);
    setPageStack(prev => prev.slice(0, -1));
    setTimeout(() => setIsTransitioning(false), 320);
  }, [pageStack.length, isTransitioning]);

  const changeTab = useCallback((tab) => {
    if (isTransitioning) return;
    setActiveTab(tab);
    setPageStack([{ key: tab, direction: 'tab' }]);
  }, [isTransitioning]);

  const showTabBar = pageStack.length === 1 &&
    ['home', 'catalog', 'tutorial', 'community', 'profile'].includes(currentPage.key);

  const renderPage = (page) => {
    if (loading) return <SkeletonScreen/>;
    switch (page.key) {
      case 'home': return <HomePage onNavigate={navigate}/>;
      case 'catalog': return <CatalogPage onNavigate={navigate}/>;
      case 'tutorial': return <TutorialPage/>;
      case 'community': return <CommunityPage/>;
      case 'profile': return <ProfilePage/>;
      case 'detail': return <DetailPage onBack={goBack}/>;
      case 'spec': return <SpecPage onBack={goBack}/>;
      case 'api': return <ApiPage onBack={goBack}/>;
      default: return <HomePage onNavigate={navigate}/>;
    }
  };

  // iOS device frame inline
  return (
    <div style={{
      width: 402, height: 874, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: '#F2F2F7',
      border: '1px solid #DEE0E3',
      fontFamily: 'Noto Sans SC, -apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
      '--ios-safe-top': '62px',
      '--ios-safe-bottom': '34px',
      boxShadow: '0 40px 80px rgba(107,78,93,0.2), 0 20px 40px rgba(107,78,93,0.1)',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 100,
      }}/>
      {/* status bar */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 90 }}>
        <IOSStatusBar dark={false}/>
      </div>

      {/* screen content */}
      <div style={{
        height: '100%', display: 'flex', flexDirection: 'column',
        isolation: 'isolate', position: 'relative',
      }}>
        <div style={{ flex: 1, overflow: 'hidden', position: 'relative' }}>
          {/* Page stack — show current with transition */}
          <div key={currentPage.key + '-' + pageStack.length}
            className={currentPage.direction === 'forward' && pageStack.length > 1 ? 'page-enter' : ''}
            style={{ height: '100%' }}>
            {renderPage(currentPage)}
          </div>
        </div>

        {/* Tab bar */}
        {showTabBar && !loading && (
          <TabBar active={activeTab} onChange={changeTab}/>
        )}
      </div>

      {/* home indicator */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 110,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: 'rgba(0,0,0,0.25)',
        }}/>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Render
// ─────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);

// Initialize cursor
initCursor();

// Announce upgrade capability
function announceUpgrade() {
  window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
}
announceUpgrade();
if (document.readyState !== 'complete') window.addEventListener('load', announceUpgrade, { once: true });
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="creative-medium" content="interactive-prototype">
<title>香道·合香配方</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --bg: #f4ead5;
  --surface: #e8d9bc;
  --surface-2: #dcc9a3;
  --ink: #3d3530;
  --ink-soft: #6b5d4f;
  --amber: #b8722e;
  --amber-dark: #9a5e24;
  --cinnabar: #c2422f;
  --jade: #6b8e5a;
  --brass: #c9a24a;
  --brass-dark: #a88630;
  --muted: #a8967a;
  --line: #c9b896;
  --white: #faf6ed;
  --shadow-sm: 0 1px 3px rgba(61,53,48,.08);
  --shadow-md: 0 4px 12px rgba(61,53,48,.12);
  --shadow-lg: 0 12px 32px rgba(61,53,48,.18);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 20px;
  --tabbar-h: 84px;
  --nav-h: 52px;
  --safe-bottom: 24px;
}

/* ===== Reset & Base ===== */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; min-height: 100vh;
  font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
  color: var(--ink);
  background: linear-gradient(135deg, #e8d9bc 0%, #dcc9a3 100%);
  overflow: hidden;
  user-select: none;
}
body {
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
img { display: block; max-width: 100%; }
button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
input, textarea { font-family: inherit; color: inherit; }
.serif { font-family: 'Noto Serif SC', 'Songti SC', serif; }
.mono { font-family: 'SF Mono', 'Roboto Mono', 'Menlo', monospace; }

/* ===== Custom Cursor ===== */
.custom-cursor {
  position: fixed; top: 50%; left: 50%;
  width: 24px; height: 24px;
  border: 2px solid var(--cinnabar);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  transition: width .15s ease, height .15s ease, border-color .2s ease;
  mix-blend-mode: difference;
}
.custom-cursor::after {
  content: ''; position: absolute; top: 50%; left: 50%;
  width: 4px; height: 4px; background: var(--cinnabar);
  border-radius: 50%; transform: translate(-50%, -50%);
}
.custom-cursor.hover {
  width: 40px; height: 40px;
  border-color: var(--amber);
}

/* ===== Phone Frame ===== */
.phone-frame {
  position: relative;
  width: 390px;
  height: 844px;
  background: var(--ink);
  border-radius: 54px;
  padding: 12px;
  box-shadow: var(--shadow-lg), 0 0 0 2px #2a231f;
}
.phone-frame::before {
  content: ''; position: absolute;
  top: 20px; left: 50%; transform: translateX(-50%);
  width: 120px; height: 32px;
  background: var(--ink);
  border-radius: 20px;
  z-index: 100;
}
.phone-screen {
  position: relative;
  width: 100%; height: 100%;
  background: var(--bg);
  border-radius: 44px;
  overflow: hidden;
}

/* ===== Status Bar ===== */
.status-bar {
  position: absolute; top: 0; left: 0; right: 0;
  height: 54px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 28px 0;
  font-size: 15px; font-weight: 600;
  color: var(--ink);
  z-index: 50;
  pointer-events: none;
}
.status-bar .icons { display: flex; gap: 5px; align-items: center; }
.status-bar .icon { width: 16px; height: 11px; }

/* ===== Nav Bar (Large Title) ===== */
.nav-bar {
  position: absolute; top: 54px; left: 0; right: 0;
  height: var(--nav-h);
  display: flex; align-items: center; justify-content: center;
  padding: 0 16px;
  z-index: 40;
  background: transparent;
}
.nav-bar .nav-title {
  font-size: 17px; font-weight: 600;
  color: var(--ink);
  opacity: 0;
  transition: opacity .3s ease;
}
.nav-bar.scrolled .nav-title { opacity: 1; }
.nav-bar .nav-left, .nav-bar .nav-right {
  position: absolute; top: 50%; transform: translateY(-50%);
  display: flex; align-items: center; gap: 8px;
}
.nav-bar .nav-left { left: 16px; }
.nav-bar .nav-right { right: 16px; }
.nav-btn {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  color: var(--amber-dark);
  transition: background .2s ease;
}
.nav-btn:active { background: rgba(184,114,46,.15); }
.nav-btn svg { width: 22px; height: 22px; }
.nav-back {
  display: flex; align-items: center; gap: 4px;
  color: var(--amber-dark);
  font-size: 17px;
  padding: 4px 8px;
  border-radius: 8px;
}
.nav-back:active { background: rgba(184,114,46,.15); }
.nav-back svg { width: 20px; height: 20px; }

/* ===== Page Stack ===== */
.page-stack {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: var(--tabbar-h);
  overflow: hidden;
}
.page {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg);
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  transform: translateX(100%);
  transition: transform .3s cubic-bezier(.4,0,.2,1);
  will-change: transform;
}
.page.active { transform: translateX(0); }
.page.behind { transform: translateX(-30%); }
.page-content {
  padding-top: calc(54px + var(--nav-h));
  padding-bottom: 24px;
  min-height: 100%;
}
.large-title {
  padding: 0 20px 16px;
  font-size: 34px; font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--ink);
}
.large-title .subtitle {
  display: block;
  font-size: 15px; font-weight: 400;
  color: var(--ink-soft);
  margin-top: 4px;
}

/* ===== TabBar ===== */
.tabbar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: var(--tabbar-h);
  background: rgba(250,246,237,.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--line);
  display: flex;
  padding-bottom: var(--safe-bottom);
  z-index: 50;
}
.tab-item {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 3px;
  color: var(--muted);
  font-size: 10px;
  transition: color .2s ease;
}
.tab-item.active { color: var(--amber-dark); }
.tab-item svg { width: 24px; height: 24px; }

/* ===== Common Components ===== */
.section-title {
  padding: 20px 20px 12px;
  font-size: 13px; font-weight: 600;
  color: var(--ink-soft);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.card {
  margin: 0 16px;
  background: var(--white);
  border-radius: var(--radius-md);
  padding: 16px;
  box-shadow: var(--shadow-sm);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 12px 24px;
  border-radius: 100px;
  font-size: 15px; font-weight: 600;
  transition: all .2s ease;
  gap: 6px;
}
.btn-primary {
  background: var(--amber);
  color: #fff;
  box-shadow: 0 2px 8px rgba(184,114,46,.3);
}
.btn-primary:active { transform: scale(.97); background: var(--amber-dark); }
.btn-secondary {
  background: var(--surface);
  color: var(--ink);
}
.btn-secondary:active { background: var(--surface-2); }
.btn-ghost {
  background: transparent;
  color: var(--amber-dark);
  border: 1px solid var(--amber);
}
.chip {
  display: inline-flex; align-items: center;
  padding: 6px 14px;
  border-radius: 100px;
  font-size: 13px;
  background: var(--surface);
  color: var(--ink-soft);
  white-space: nowrap;
  transition: all .2s ease;
}
.chip.active {
  background: var(--amber);
  color: #fff;
}
.chip-row {
  display: flex; gap: 8px;
  padding: 0 16px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.chip-row::-webkit-scrollbar { display: none; }
.divider {
  height: 1px;
  background: var(--line);
  margin: 12px 16px;
  opacity: .6;
}

/* ===== Today Page ===== */
.hero-card {
  margin: 0 16px 16px;
  border-radius: var(--radius-lg);
  padding: 24px;
  background: linear-gradient(145deg, #faf6ed 0%, #e8d9bc 100%);
  box-shadow: var(--shadow-md);
  position: relative;
  overflow: hidden;
}
.hero-card::before {
  content: ''; position: absolute;
  top: -20px; right: -20px;
  width: 120px; height: 120px;
  background: radial-gradient(circle, rgba(184,114,46,.15) 0%, transparent 70%);
  border-radius: 50%;
}
.hero-badge {
  display: inline-block;
  padding: 4px 12px;
  background: var(--cinnabar);
  color: #fff;
  font-size: 12px; font-weight: 500;
  border-radius: 100px;
  margin-bottom: 12px;
}
.hero-title {
  font-size: 28px; font-weight: 700;
  color: var(--ink);
  margin-bottom: 6px;
}
.hero-desc {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.6;
  margin-bottom: 16px;
}
.hero-spices {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-bottom: 16px;
}
.hero-spice {
  padding: 3px 10px;
  background: rgba(184,114,46,.12);
  color: var(--amber-dark);
  font-size: 12px;
  border-radius: 100px;
}
.hero-meta {
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 14px;
  border-top: 1px dashed var(--line);
}
.hero-scene { font-size: 12px; color: var(--ink-soft); }
.radar-mini {
  width: 60px; height: 60px;
}

/* Timeline */
.timeline {
  padding: 0 16px;
}
.timeline-item {
  position: relative;
  padding: 14px 16px 14px 28px;
  background: var(--white);
  border-radius: var(--radius-md);
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
}
.timeline-item::before {
  content: ''; position: absolute;
  left: 12px; top: 20px;
  width: 8px; height: 8px;
  background: var(--amber);
  border-radius: 50%;
}
.timeline-date {
  font-size: 12px; color: var(--muted);
  margin-bottom: 4px;
}
.timeline-recipe {
  font-size: 15px; font-weight: 600;
  color: var(--ink);
  margin-bottom: 4px;
}
.timeline-text {
  font-size: 13px; color: var(--ink-soft);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.timeline-rating {
  color: var(--cinnabar);
  font-size: 12px;
  margin-top: 6px;
}

/* ===== Spices Page ===== */
.spice-list {
  padding: 8px 16px 16px;
}
.spice-item {
  display: flex; align-items: center; gap: 14px;
  padding: 14px;
  background: var(--white);
  border-radius: var(--radius-md);
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  transition: transform .15s ease;
}
.spice-item:active { transform: scale(.98); }
.spice-icon {
  width: 48px; height: 48px;
  border-radius: var(--radius-sm);
  background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.spice-info { flex: 1; min-width: 0; }
.spice-name {
  font-size: 16px; font-weight: 600;
  color: var(--ink);
  margin-bottom: 4px;
}
.spice-meta {
  font-size: 12px; color: var(--ink-soft);
  display: flex; gap: 8px; align-items: center;
  flex-wrap: wrap;
}
.spice-tag {
  padding: 2px 8px;
  background: rgba(107,142,90,.15);
  color: var(--jade);
  font-size: 11px;
  border-radius: 4px;
}
.spice-arrow {
  color: var(--muted);
  flex-shrink: 0;
}
.spice-arrow svg { width: 18px; height: 18px; }

/* ===== Workshop Page ===== */
.workshop-top {
  padding: 0 16px 8px;
}
.recipe-name-input {
  width: 100%;
  padding: 10px 16px;
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  font-size: 16px;
  text-align: center;
  color: var(--ink);
  outline: none;
}
.recipe-name-input:focus { border-color: var(--amber); }

/* Balance Scale */
.scale-container {
  position: relative;
  height: 180px;
  margin: 16px 16px 8px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.scale-beam-wrap {
  position: relative;
  width: 100%;
  height: 120px;
  display: flex; align-items: center; justify-content: center;
}
.scale-beam {
  position: relative;
  width: 280px;
  height: 6px;
  background: linear-gradient(to bottom, var(--brass) 0%, var(--brass-dark) 100%);
  border-radius: 3px;
  transform-origin: center center;
  transition: transform .4s cubic-bezier(.34,1.56,.64,1);
  box-shadow: 0 2px 4px rgba(0,0,0,.2);
}
.scale-beam::before {
  content: ''; position: absolute;
  top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 14px; height: 14px;
  background: radial-gradient(circle, #e8c96a 0%, var(--brass-dark) 100%);
  border-radius: 50%;
  box-shadow: 0 1px 3px rgba(0,0,0,.3);
}
.scale-pan {
  position: absolute;
  bottom: -50px;
  width: 80px; height: 60px;
  display: flex; flex-direction: column;
  align-items: center;
}
.scale-pan.left { left: -10px; }
.scale-pan.right { right: -10px; }
.scale-pan-rope {
  width: 2px; height: 20px;
  background: var(--brass-dark);
}
.scale-pan-plate {
  width: 80px; height: 20px;
  background: linear-gradient(to bottom, var(--brass), var(--brass-dark));
  border-radius: 0 0 40px 40px;
  box-shadow: 0 3px 6px rgba(0,0,0,.2);
  position: relative;
}
.scale-pan-plate::before {
  content: ''; position: absolute;
  top: -2px; left: 0; right: 0;
  height: 4px;
  background: var(--brass);
  border-radius: 2px;
}
.scale-pan-weight {
  margin-top: 6px;
  font-size: 11px;
  color: var(--ink-soft);
  font-family: 'SF Mono', monospace;
}
.scale-fulcrum {
  position: absolute;
  bottom: 10px;
  left: 50%; transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 24px solid transparent;
  border-right: 24px solid transparent;
  border-bottom: 36px solid var(--surface-2);
}
.scale-fulcrum::after {
  content: ''; position: absolute;
  top: 34px; left: -30px;
  width: 60px; height: 6px;
  background: var(--surface-2);
  border-radius: 3px;
}
.scale-target-label {
  position: absolute;
  top: 10px; right: 10px;
  font-size: 11px; color: var(--muted);
  display: flex; align-items: center; gap: 4px;
}
.scale-target-input {
  width: 40px;
  border: none;
  background: transparent;
  font-family: 'SF Mono', monospace;
  font-size: 12px;
  color: var(--amber-dark);
  text-align: right;
  outline: none;
}

/* Spice bundles on scale */
.scale-spices {
  position: absolute;
  bottom: 28px; left: 50%;
  transform: translateX(-50%);
  display: flex; gap: 2px;
  flex-wrap: wrap;
  justify-content: center;
  width: 70px;
}
.scale-spice-bundle {
  width: 18px; height: 22px;
  border-radius: 4px 4px 8px 8px;
  background: var(--amber);
  position: relative;
  animation: bundleDrop .3s cubic-bezier(.34,1.56,.64,1);
  box-shadow: 0 1px 2px rgba(0,0,0,.2);
}
.scale-spice-bundle::before {
  content: ''; position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: var(--cinnabar);
  border-radius: 2px 2px 0 0;
}
@keyframes bundleDrop {
  0% { transform: translateY(-30px) scale(.6); opacity: 0; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}

/* Spice Shelf */
.spice-shelf {
  margin: 8px 0 16px;
  padding: 12px 0;
  background: var(--surface);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.spice-shelf-title {
  padding: 0 16px 8px;
  font-size: 12px; font-weight: 600;
  color: var(--ink-soft);
  display: flex; justify-content: space-between; align-items: center;
}
.spice-shelf-scroll {
  display: flex; gap: 10px;
  padding: 4px 16px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.spice-shelf-scroll::-webkit-scrollbar { display: none; }
.shelf-spice {
  flex-shrink: 0;
  width: 64px;
  display: flex; flex-direction: column;
  align-items: center; gap: 4px;
  cursor: grab;
  touch-action: none;
}
.shelf-spice:active { cursor: grabbing; }
.shelf-spice-bundle {
  width: 44px; height: 52px;
  border-radius: 6px 6px 14px 14px;
  background: linear-gradient(145deg, var(--amber), var(--amber-dark));
  position: relative;
  box-shadow: var(--shadow-sm);
  transition: transform .2s ease;
}
.shelf-spice:active .shelf-spice-bundle { transform: scale(1.1); }
.shelf-spice-bundle::before {
  content: ''; position: absolute;
  top: 0; left: 0; right: 0;
  height: 8px;
  background: var(--cinnabar);
  border-radius: 3px 3px 0 0;
}
.shelf-spice-bundle::after {
  content: ''; position: absolute;
  top: 3px; left: 50%; transform: translateX(-50%);
  width: 3px; height: 10px;
  background: rgba(255,255,255,.3);
  border-radius: 2px;
}
.shelf-spice-name {
  font-size: 11px;
  color: var(--ink-soft);
  text-align: center;
}

/* Draggable ghost */
.drag-ghost {
  position: fixed;
  width: 44px; height: 52px;
  border-radius: 6px 6px 14px 14px;
  background: linear-gradient(145deg, var(--amber), var(--amber-dark));
  pointer-events: none;
  z-index: 9998;
  opacity: .9;
  transform: translate(-50%, -50%) scale(1.2);
  box-shadow: var(--shadow-lg);
}
.drag-ghost::before {
  content: ''; position: absolute;
  top: 0; left: 0; right: 0;
  height: 8px;
  background: var(--cinnabar);
  border-radius: 3px 3px 0 0;
}

/* Added spices list */
.added-spices {
  padding: 0 16px;
}
.added-spice-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  background: var(--white);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  box-shadow: var(--shadow-sm);
}
.added-spice-color {
  width: 8px; height: 28px;
  border-radius: 4px;
  flex-shrink: 0;
}
.added-spice-info { flex: 1; min-width: 0; }
.added-spice-name {
  font-size: 14px; font-weight: 600;
  color: var(--ink);
  margin-bottom: 6px;
}
.weight-slider-row {
  display: flex; align-items: center; gap: 8px;
}
.weight-slider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  background: var(--surface-2);
  border-radius: 2px;
  outline: none;
}
.weight-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--amber);
  cursor: pointer;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
}
.weight-value {
  width: 48px;
  text-align: right;
  font-family: 'SF Mono', monospace;
  font-size: 13px;
  color: var(--amber-dark);
  font-weight: 600;
}
.delete-btn {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted);
  border-radius: 50%;
  transition: all .2s ease;
}
.delete-btn:active { background: rgba(194,66,47,.15); color: var(--cinnabar); }
.delete-btn svg { width: 16px; height: 16px; }

/* Radar Chart */
.radar-section {
  padding: 12px 16px 16px;
}
.radar-card {
  background: var(--white);
  border-radius: var(--radius-md);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  display: flex; flex-direction: column;
  align-items: center;
}
.radar-title {
  font-size: 14px; font-weight: 600;
  color: var(--ink);
  margin-bottom: 8px;
}
.radar-canvas {
  width: 200px; height: 200px;
}
.radar-labels {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  width: 100%;
  margin-top: 12px;
}
.radar-label-item {
  text-align: center;
  font-size: 11px;
  color: var(--ink-soft);
}
.radar-label-item .dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  margin-right: 4px;
  vertical-align: middle;
}

/* Save bar */
.save-bar {
  position: sticky;
  bottom: 0;
  padding: 12px 16px calc(12px + var(--safe-bottom));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
  display: flex; gap: 10px;
}
.save-bar .btn { flex: 1; }
.btn-save {
  background: var(--jade);
  color: #fff;
  box-shadow: 0 2px 8px rgba(107,142,90,.3);
}
.btn-save:active { transform: scale(.97); background: #5a7a4a; }
.btn-save:disabled {
  background: var(--surface-2);

.sheet-mask {

  text-align: center;

}

}

}

}
.color-swatch {

}
.font-sample-label {

}

  font-size: 12px;
  color: var(--muted);
  font-family: monospace;
}
.spacing-bar {

  background: var(--amber);
  border-radius: 3px;
  opacity: .7;
}
.component-preview {
  padding: 16px;

  border-radius: var(--radius-sm);
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);

  align-items: center;

  box-shadow: var(--shadow-sm);
}

  border-radius: 50%;
  background: var(--amber);

}
.motion-ball:nth-child(2) { animation-delay: .2s; background: var(--cinnabar); }
.motion-ball:nth-child(3) { animation-delay: .4s; background: var(--jade); }
@keyframes motionBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }

.api-section {
  margin-bottom: 20px;
}

  padding: 14px;

.api-desc {

  margin-top: 8px;
  line-height: 1.5;
}
.api-code {

  border-radius: 6px;

  font-size: 11px;

.settings-list {

}

  display: flex; align-items: center; justify-content: space-between;

}

.pull-indicator {

  to { transform: translateX(-50%) translateY(-60px) rotate(360deg); }

@media (prefers-reduced-motion: reduce) {

  .custom-cursor { transition: none; }

// ===== UTILS =====
function $(s, p=document) { return p.querySelector(s); }
function $$(s, p=document) { return [...p.querySelectorAll(s)]; }
function getSpice(id) { return SPICES.find(s => s.id === id); }
function getRecipe(id) { return state.recipes.find(r => r.id === id); }

function calcRecipeRadar(spicesArr) {
  if (!spicesArr.length) return { sweet: 0, pungent: 0, bitter: 0, sour: 0, woody: 0, floral: 0 };
  let total = 0;
  const sum = { sweet: 0, pungent: 0, bitter: 0, sour: 0, woody: 0, floral: 0 };
  spicesArr.forEach(s => {
    const sp = getSpice(s.id);
    if (!sp) return;
    total += s.weight;
    TONE_KEYS.forEach(k => { sum[k] += sp.tones[k] * s.weight; });
  });
  const result = {};
  TONE_KEYS.forEach(k => { result[k] = total > 0 ? sum[k] / total : 0; });
  return result;
}

function totalWeight(spicesArr) {
  return spicesArr.reduce((s, i) => s + i.weight, 0);
}

// ===== CUSTOM CURSOR =====
const cursor = $('#customCursor');
let cursorX = window.innerWidth / 2, cursorY = window.innerHeight / 2;
let cursorTargetX = cursorX, cursorTargetY = cursorY;
let cursorRaf = null;

function updateCursor() {
  cursorX += (cursorTargetX - cursorX) * 0.15;
  cursorY += (cursorTargetY - cursorY) * 0.15;
  cursor.style.left = cursorX + 'px';
  cursor.style.top = cursorY + 'px';
  if (!document.hidden) cursorRaf = requestAnimationFrame(updateCursor);
}

document.addEventListener('mousemove', e => {
  cursorTargetX = e.clientX;
  cursorTargetY = e.clientY;
  if (!cursorRaf) cursorRaf = requestAnimationFrame(updateCursor);
});

document.addEventListener('mouseover', e => {
  if (e.target.closest('button, .chip, .spice-item, .timeline-item, .shelf-spice, .tab-item, .journal-card, .settings-row, .weight-slider, .rating-star, .fab, .nav-btn, .nav-back')) {
    cursor.classList.add('hover');
  }
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('button, .chip, .spice-item, .timeline-item, .shelf-spice, .tab-item, .journal-card, .settings-row, .weight-slider, .rating-star, .fab, .nav-btn, .nav-back')) {
    cursor.classList.remove('hover');
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden && cursorRaf) { cancelAnimationFrame(cursorRaf); cursorRaf = null; }
  if (!document.hidden && !cursorRaf) cursorRaf = requestAnimationFrame(updateCursor);
});

function switchTab(tab) {
  if (state.currentTab === tab && state.pageStack.length === 0) return;
  state.currentTab = tab;
  state.pageStack = [];
  $$('.tab-item').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  renderCurrentPage();
}

function pushPage(pageKey, data) {
  state.pageStack.push({ key: pageKey, data });
  renderCurrentPage();
}

function popPage() {
  state.pageStack.pop();
  renderCurrentPage();
}

function getCurrentPageInfo() {
  if (state.pageStack.length > 0) {
    const top = state.pageStack[state.pageStack.length - 1];
    const pages = { 'design-spec': { title: '设计规范', render: renderDesignSpec }, 'api-docs': { title: '接口文档', render: renderApiDocs } };
    return pages[top.key] || { title: '', render: () => '' };
  }
  return TAB_PAGES[state.currentTab];
}

function renderCurrentPage() {
  const info = getCurrentPageInfo();
  const isPushed = state.pageStack.length > 0;
  navTitle.textContent = info.title;
  
  // Nav left
  if (isPushed) {
    navLeft.innerHTML = `<button class="nav-back" id="navBackBtn">

  }
  
  // Nav right - settings on today tab
  if (!isPushed && state.currentTab === 'today') {
    navRight.innerHTML = `<button class="settings-btn" id="settingsBtn" title="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>`;
    $('#settingsBtn').onclick = showSettingsSheet;
  } else {
    navRight.innerHTML = '';
  }
  
  // Create new page element
  const page = document.createElement('div');
  page.className = 'page';
  page.innerHTML = '<div class="page-content">' + info.render() + '</div>';
  
  // Clear existing pages (but keep for transition)
  const oldPages = $$('.page', pageStack);
  if (oldPages.length > 0 && isPushed) {
    // slide new page in
    pageStack.appendChild(page);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        page.classList.add('active');
        oldPages.forEach(p => p.classList.add('behind'));
      });
    });
    // Clean up old pages after transition
    setTimeout(() => {
      oldPages.forEach(p => {
        if (p !== page) p.remove();
      });
    }, 320);
  } else if (state.pageStack.length === 0 && oldPages.length > 0) {
    // pop back
    page.classList.add('behind');
    pageStack.insertBefore(page, oldPages[0]);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        page.classList.remove('behind');
        page.classList.add('active');
        oldPages.forEach(p => p.classList.remove('active'));
      });
    });
    setTimeout(() => {
      oldPages.forEach(p => p.remove());
    }, 320);
  } else {
    page.classList.add('active');
    pageStack.innerHTML = '';
    pageStack.appendChild(page);
  }
  
  // Initialize page-specific features
  setTimeout(() => {
    info.init && info.init();
    if (state.currentTab === 'workshop' && !isPushed) initWorkshop();
    if (state.currentTab === 'spices' && !isPushed) initSpiceDrag();
  }, 20);
}

function adjustColor(hex, amt) {
  const h = hex.replace('#','');
  const r = Math.max(0, Math.min(255, parseInt(h.substr(0,2),16) + amt));
  const g = Math.max(0, Math.min(255, parseInt(h.substr(2,2),16) + amt));
  const b = Math.max(0, Math.min(255, parseInt(h.substr(4,2),16) + amt));
  return '#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join('');
}

function initWorkshop() {
  const ws = state.workshop;
  
  // Name input
  const nameInput = $('#recipeNameInput');
  if (nameInput) {
    nameInput.addEventListener('input', e => {

    });
  }
  
  // Target weight input
  const targetInput = $('#targetWeightInput');
  if (targetInput) {
    targetInput.addEventListener('input', e => {
      let v = parseFloat(e.target.value);
      if (isNaN(v) || v < 0.5) v = 0.5;
      if (v > 20) v = 20;
      ws.targetWeight = v;
      updateScale();
    });
  }
  
  // Weight sliders
  $$('.weight-slider').forEach(slider => {
    slider.addEventListener('input', e => {
      const idx = parseInt(e.target.dataset.index);
      const val = parseFloat(e.target.value);
      ws.spices[idx].weight = val;
      // Update weight display next to slider
      const valSpan = e.target.parentElement.querySelector('.weight-value');
      if (valSpan) valSpan.textContent = val.toFixed(1) + 'g';
      updateScale();
      updateRadar();
    });
  });

    };

function initDragAndDrop() {
  const shelfItems = $$('.shelf-spice');
  const ghost = $('#dragGhost');
  const leftPan = $('#scaleBeam .scale-pan.left .scale-pan-plate');
  
  shelfItems.forEach(item => {
    let longPressTimer = null;
    let isDragging = false;
    let startX = 0, startY = 0;
    
    item.addEventListener('pointerdown', e => {
      startX = e.clientX;
      startY = e.clientY;
      
      longPressTimer = setTimeout(() => {
        isDragging = true;
        const sp = getSpice(item.dataset.id);
        if (sp) {
          ghost.style.display = 'block';
          ghost.style.background = `linear-gradient(145deg, ${sp.color}, ${adjustColor(sp.color, -20)})`;
          ghost.style.left = e.clientX + 'px';
          ghost.style.top = e.clientY + 'px';
        }
        item.setPointerCapture(e.pointerId);
      }, 300);
    });
    
    item.addEventListener('pointermove', e => {
      if (isDragging) {
        ghost.style.left = e.clientX + 'px';
        ghost.style.top = e.clientY + 'px';
      } else {
        // If moved significantly before long press, cancel
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
          if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
        }
      }
    });
    
    item.addEventListener('pointerup', e => {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
      
      if (isDragging) {
        isDragging = false;
        ghost.style.display = 'none';
        
        // Check if dropped on left pan
        const panRect = leftPan.getBoundingClientRect();
        if (e.clientX >= panRect.left && e.clientX <= panRect.right &&
            e.clientY >= panRect.top - 40 && e.clientY <= panRect.bottom + 20) {
          addSpiceToScale(item.dataset.id);
        }
        
        item.releasePointerCapture(e.pointerId);
      }
    });
    
    item.addEventListener('pointercancel', e => {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
      if (isDragging) {
        isDragging = false;
        ghost.style.display = 'none';
        item.releasePointerCapture(e.pointerId);
      }
    });
    
    // Click to add (also works as fallback)
    item.addEventListener('click', () => {
      if (!isDragging) addSpiceToScale(item.dataset.id);
    });
  });
}

function addSpiceToScale(id) {
  const ws = state.workshop;
  if (ws.spices.find(s => s.id === id)) {

    existing.weight = Math.min(5.0, existing.weight + 0.5);

    if (ws.spices.length >= 10) {
      showAlert({ title: '香料已满', desc: '一付合香最多10味香料', buttons: [{ text: '知道了', type: 'primary' }] });

    ws.spices.push({ id, weight: 1.0 });

function updateScale() {
  const ws = state.workshop;
  const total = totalWeight(ws.spices);
  const diff = total - ws.targetWeight;
  // angle = atan2(diff, sensitivity) * limit
  const sensitivity = 8;
  const maxAngle = 15; // degrees
  let angle = Math.atan2(-diff, sensitivity) * (180 / Math.PI);
  angle = Math.max(-maxAngle, Math.min(maxAngle, angle));
  
  const beam = $('#scaleBeam');
  if (beam) beam.style.transform = `rotate(${angle}deg)`;
  
  const leftW = $('#leftWeight');
  const rightW = $('#rightWeight');
  if (leftW) leftW.textContent = total.toFixed(1) + ' g';
  if (rightW) rightW.textContent = ws.targetWeight.toFixed(1) + ' g';
  
  // Update save button state
  const saveBtn = $('#saveRecipeBtn');
  if (saveBtn) saveBtn.disabled = ws.spices.length < 2;
}

function drawRadar(canvas, data, cx, cy, radius, withLabels) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  
  // Handle high DPI
  if (canvas.width !== canvas.clientWidth * dpr) {
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
  }
  ctx.save();
  ctx.scale(dpr, dpr);
  const actualCX = canvas.clientWidth / 2;
  const actualCY = canvas.clientHeight / 2;
  const actualR = radius * (canvas.clientWidth / 400);
  
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  const levels = 4;
  const sides = 6;
  
  // Draw grid
  for (let i = 1; i <= levels; i++) {
    const r = actualR * (i / levels);
    ctx.beginPath();
    for (let j = 0; j < sides; j++) {
      const angle = (Math.PI * 2 * j / sides) - Math.PI / 2;
      const x = actualCX + r * Math.cos(angle);
      const y = actualCY + r * Math.sin(angle);
      if (j === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(201,184,150,0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  
  // Draw axes
  for (let j = 0; j < sides; j++) {
    const angle = (Math.PI * 2 * j / sides) - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(actualCX, actualCY);
    ctx.lineTo(actualCX + actualR * Math.cos(angle), actualCY + actualR * Math.sin(angle));
    ctx.strokeStyle = 'rgba(201,184,150,0.6)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  
  // Draw data
  ctx.beginPath();
  for (let j = 0; j < sides; j++) {
    const key = TONE_KEYS[j];
    const val = data[key] / 10; // normalize 0-1
    const angle = (Math.PI * 2 * j / sides) - Math.PI / 2;
    const r = actualR * val;
    const x = actualCX + r * Math.cos(angle);
    const y = actualCY + r * Math.sin(angle);
    if (j === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  
  // Fill
  const gradient = ctx.createRadialGradient(actualCX, actualCY, 0, actualCX, actualCY, actualR);
  gradient.addColorStop(0, 'rgba(184,114,46,0.4)');
  gradient.addColorStop(1, 'rgba(194,66,47,0.2)');
  ctx.fillStyle = gradient;
  ctx.fill();
  
  // Stroke
  ctx.strokeStyle = '#b8722e';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // Data points
  for (let j = 0; j < sides; j++) {
    const key = TONE_KEYS[j];
    const val = data[key] / 10;
    const angle = (Math.PI * 2 * j / sides) - Math.PI / 2;
    const r = actualR * val;
    const x = actualCX + r * Math.cos(angle);
    const y = actualCY + r * Math.sin(angle);
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#c2422f';
    ctx.fill();
  }
  
  ctx.restore();
}

// ===== ALERT SYSTEM =====
function showAlert({ title, desc, input, inputValue, inputPlaceholder, custom, buttons }) {
  const mask = $('#alertMask');
  const box = $('#alertBox');
  
  let html = `<div class="alert-title">${title}</div>`;
  if (desc) html += `<div class="alert-desc">${desc}</div>`;
  if (input) html += `<input type="text" class="alert-input" id="alertInput" value="${inputValue || ''}" placeholder="${inputPlaceholder || ''}">`;
  if (custom) html += custom;
  html += '<div class="alert-buttons">';
  buttons.forEach((b, i) => {
    html += `<button class="btn ${b.type === 'primary' ? 'btn-primary' : 'btn-secondary'}" data-idx="${i}">${b.text}</button>`;
  });
  html += '</div>';
  
  box.innerHTML = html;
  mask.classList.add('show');
  
  // Focus input
  if (input) {
    setTimeout(() => $('#alertInput') && $('#alertInput').focus(), 100);
  }
  
  // Button handlers
  $$('#alertBox .alert-buttons .btn').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.idx);
      const b = buttons[idx];
      if (input && b.action) {
        const val = $('#alertInput').value;
        b.action(val);
      } else if (b.action) {
        b.action();
      }
      hideAlert();
    };
  });
}

// ===== Scroll handler for nav bar =====
function setupScrollHandler() {
  const page = $('.page.active');
  if (!page) return;
  page.addEventListener('scroll', () => {
    if (page.scrollTop > 20) {
      navBar.classList.add('scrolled');
    } else {
      navBar.classList.remove('scrolled');
    }
  });
}
// Attach after each page render
const origRender = renderCurrentPage;
// Patch: add scroll handler after page render
const observer = new MutationObserver(() => {
  const active = $('.page.active');
  if (active && !active._scrollBound) {
    active._scrollBound = true;
    active.addEventListener('scroll', () => {
      if (active.scrollTop > 30) navBar.classList.add('scrolled');
      else navBar.classList.remove('scrolled');
    });
  }
});
observer.observe(pageStack, { childList: true, subtree: false });

// ===== Visibility handling =====
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    // Cancel any ongoing animations
    if (cursorRaf) { cancelAnimationFrame(cursorRaf); cursorRaf = null; }
  } else {
    if (!cursorRaf) cursorRaf = requestAnimationFrame(updateCursor);
  }
});

// ===== Announce upgrade capability =====
function announceUpgrade() {
  window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
}
announceUpgrade();
if (document.readyState !== 'complete') window.addEventListener('load', announceUpgrade, { once: true });
</script>

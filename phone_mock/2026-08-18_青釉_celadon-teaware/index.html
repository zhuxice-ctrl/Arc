// ─────────────────────────────────────────────────────────────
// USE RIPPLE hook
// ─────────────────────────────────────────────────────────────
function useRipple() {
  const createRipple = (e) => {
    if (prefersReduced()) return;
    const button = e.currentTarget;
    const circle = document.createElement('span');
    const diameter = Math.max(button.clientWidth, button.clientHeight);
    const radius = diameter / 2;
    const rect = button.getBoundingClientRect();
    circle.style.width = circle.style.height = `${diameter}px`;
    circle.style.left = `${e.clientX - rect.left - radius}px`;
    circle.style.top = `${e.clientY - rect.top - radius}px`;
    circle.className = 'ripple-effect';
    button.appendChild(circle);
    setTimeout(() => circle.remove(), 600);
  };
  return createRipple;
}

// ─────────────────────────────────────────────────────────────
// PULL TO REFRESH WRAPPER
// ─────────────────────────────────────────────────────────────
function PullToRefresh({ onRefresh, children, color = T.celadon }) {
  const ref = useRef(null);
  const [pulling, setPulling] = useState(false);
  const [pullDist, setPullDist] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const startY = useRef(0);
  const startScroll = useRef(0);
  const rafRef = useRef(null);

  const onTouchStart = (e) => {
    if (refreshing) return;
    const el = ref.current;
    if (el.scrollTop <= 0) {
      startY.current = e.touches[0].clientY;
      startScroll.current = el.scrollTop;
      setPulling(true);
    }
  };
  const onTouchMove = (e) => {
    if (!pulling || refreshing) return;
    const dy = e.touches[0].clientY - startY.current;
    if (dy > 0 && ref.current.scrollTop <= 0) {
      // damping
      const damped = Math.min(100, dy * 0.5);
      setPullDist(damped);
      e.preventDefault();
    }
  };
  const onTouchEnd = () => {
    if (!pulling) return;
    setPulling(false);
    if (pullDist > 60) {
      setRefreshing(true);
      setPullDist(60);
      onRefresh && onRefresh().then(() => {
        setRefreshing(false);
        setPullDist(0);
      }).catch(() => {
        setRefreshing(false);
        setPullDist(0);
      });
    } else {
      setPullDist(0);
    }
  };

  useEffect(() => () => {
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
  }, []);

  const threshold = 60;
  const progress = Math.min(1, pullDist / threshold);

  return (
    <div ref={ref} className="screen-scroll"
      style={{ position: 'relative', height: '100%', overflowY: 'auto', overflowX: 'hidden' }}
      onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}>
      {/* pull indicator */}
      <div style={{
        position: 'absolute', top: 0, left: 0, right: 0,
        height: pullDist,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        transition: refreshing ? 'none' : 'height 0.3s cubic-bezier(0.22, 1, 0.36, 1)',
        pointerEvents: 'none',
      }}>
        {refreshing ? (
          <div className="ptr-spinner" style={{
            width: 20, height: 20, border: `2px solid ${color}`,
            borderTopColor: 'transparent', borderRadius: '50%',
          }}/>
        ) : pullDist > 10 ? (
          <div style={{
            transform: `rotate(${progress * 180}deg)`,
            transition: 'transform 0.1s',
          }}>{Ic.arrowDown(color)}</div>
        ) : null}
      </div>
      <div style={{
        transform: `translateY(${pullDist}px)`,
        transition: pulling ? 'none' : 'transform 0.3s cubic-bezier(0.22, 1, 0.36, 1)',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// PAGE: CART (左滑列表 + 底部结算栏)
// ─────────────────────────────────────────────────────────────
function CartPage({ onCheckout }) {
  const [items, setItems] = useState([
    { id: 1, product: PRODUCTS[0], qty: 1, selected: true, swiped: false },
    { id: 2, product: PRODUCTS[2], qty: 2, selected: true, swiped: false },
    { id: 3, product: PRODUCTS[3], qty: 1, selected: false, swiped: false },
  ]);

  const setQty = (id, delta) => {
    setItems(prev => prev.map(it =>
      it.id === id ? { ...it, qty: Math.max(1, it.qty + delta) } : it
    ));
  };

  const toggleSelect = (id) => {
    setItems(prev => prev.map(it =>
      it.id === id ? { ...it, selected: !it.selected } : it
    ));
  };

  const toggleSwipe = (id) => {
    setItems(prev => prev.map(it =>
      it.id === id ? { ...it, swiped: !it.swiped } : { ...it, swiped: false }
    ));
  };

  const removeItem = (id) => {
    setItems(prev => prev.filter(it => it.id !== id));
  };

  const total = items.filter(i => i.selected).reduce((s, i) => s + i.product.price * i.qty, 0);
  const allSelected = items.length > 0 && items.every(i => i.selected);

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: T.rice }}>
      <div style={{
        padding: '14px 20px 10px',
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      }}>
        <div style={{
          fontFamily: 'Noto Serif SC, serif', fontSize: 18, fontWeight: 600,
          color: T.charcoal,
        }}>购物车</div>
        <div style={{ fontSize: 12, color: T.stone }}>共 {items.length} 件</div>
      </div>

      <div style={{ flex: 1, overflowY: 'auto', paddingBottom: 120 }}
        className="screen-scroll">
        {items.map((it, idx) => (
          <div key={it.id} className={`swipe-wrap ${it.swiped ? 'swipe-open' : ''}`}
            style={{
              background: '#fff', margin: '6px 16px', borderRadius: 12,
              overflow: 'hidden',
              animation: `fade-up 0.4s ease ${idx * 0.1}s both`,
            }}>
            <div className="swipe-actions" style={{ width: 140 }}>
              <button onClick={() => toggleSwipe(it.id)} style={{
                flex: 1, background: T.gold, border: 'none', color: '#fff',
                fontSize: 12, cursor: 'pointer',
                display: 'flex', flexDirection: 'column',
                alignItems: 'center', justifyContent: 'center', gap: 4,
              }}>
                {Ic.fav()}
                收藏
              </button>
              <button onClick={() => removeItem(it.id)} style={{
                flex: 1, background: '#E55', border: 'none', color: '#fff',
                fontSize: 12, cursor: 'pointer',
                display: 'flex', flexDirection: 'column',
                alignItems: 'center', justifyContent: 'center', gap: 4,
              }}>
                {Ic.delete()}
                删除
              </button>
            </div>
            <div className="swipe-content"
              onClick={() => it.swiped && toggleSwipe(it.id)}
              style={{
                display: 'flex', padding: 12, gap: 10,
                background: '#fff', alignItems: 'center',
                cursor: 'pointer',
              }}>
              <div
                onClick={(e) => { e.stopPropagation(); toggleSelect(it.id); }}
                style={{
                  width: 20, height: 20, borderRadius: '50%',
                  border: `2px solid ${it.selected ? T.celadon : '#ddd'}`,
                  background: it.selected ? T.celadon : 'transparent',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  flexShrink: 0, cursor: 'pointer',
                  transition: 'all 0.2s ease',
                }}>
                {it.selected && Ic.check('#fff')}
              </div>
              <div
                onTouchStart={(e) => {
                  const sx = e.touches[0].clientX;
                  const onMove = (ev) => {
                    if (Math.abs(ev.touches[0].clientX - sx) > 30) {
                      toggleSwipe(it.id);
                      document.removeEventListener('touchmove', onMove);
                    }
                  };
                  document.addEventListener('touchmove', onMove, { once: true });
                }}
                style={{
                  width: 70, height: 70, borderRadius: 10, flexShrink: 0,
                  background: `linear-gradient(135deg, ${T.frost} 0%, ${T.mist} 100%)`,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                }}>
                <TeawareImg type={it.product.img} size={60} />
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{
                  fontSize: 13, color: T.charcoal, fontWeight: 500,
                  overflow: 'hidden', textOverflow: 'ellipsis',
                  whiteSpace: 'nowrap',
                }}>{it.product.name}</div>
                <div style={{ fontSize: 11, color: T.stone, marginTop: 2 }}>
                  {it.product.craft}
                </div>
                <div style={{
                  marginTop: 8,
                  display: 'flex', alignItems: 'center',
                  justifyContent: 'space-between',
                }}>
                  <span style={{ color: T.ochre, fontWeight: 600, fontSize: 15 }}>
                    ¥{it.product.price}
                  </span>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 2 }}>
                    <button onClick={(e) => { e.stopPropagation(); setQty(it.id, -1); }}
                      style={{
                        width: 22, height: 22, borderRadius: '50%',
                        background: T.riceDeep, border: 'none',
                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                        cursor: 'pointer', color: T.ink,
                      }}>{Ic.minus(T.ink)}</button>
                    <span style={{
                      width: 24, textAlign: 'center', fontSize: 13,
                      color: T.charcoal,
                    }}>{it.qty}</span>
                    <button onClick={(e) => { e.stopPropagation(); setQty(it.id, 1); }}
                      style={{
                        width: 22, height: 22, borderRadius: '50%',
                        background: T.celadon, border: 'none',
                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                        cursor: 'pointer',
                      }}>{Ic.plus('#fff')}</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        ))}

        {items.length === 0 && (
          <div style={{
            padding: '60px 0', textAlign: 'center', color: T.stone,
          }}>
            <div style={{ fontSize: 40, marginBottom: 10, opacity: 0.3 }}>
              {Ic.cart(T.stone)}
            </div>
            <div style={{ fontSize: 13 }}>购物车空空如也</div>
          </div>
        )}
      </div>

      {/* bottom bar */}
      <div style={{
        position: 'absolute', left: 0, right: 0, bottom: 56,
        background: '#fff',
        borderTop: '0.5px solid rgba(0,0,0,0.06)',
        padding: '10px 16px',
        paddingBottom: 14,
        display: 'flex', alignItems: 'center',
        justifyContent: 'space-between',
        zIndex: 30,
      }}>
        <button
          onClick={() => setItems(prev => prev.map(it => ({ ...it, selected: !allSelected })))}
          style={{
            display: 'flex', alignItems: 'center', gap: 6,
            background: 'none', border: 'none', cursor: 'pointer',
            fontSize: 13, color: T.ink,
          }}>
          <div style={{
            width: 18, height: 18, borderRadius: '50%',
            border: `2px solid ${allSelected ? T.celadon : '#ddd'}`,
            background: allSelected ? T.celadon : 'transparent',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>{allSelected && Ic.check('#fff')}</div>
          全选
        </button>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <div style={{ textAlign: 'right' }}>
            <div style={{ fontSize: 12, color: T.stone }}>合计</div>
            <div style={{ fontSize: 18, fontWeight: 600, color: T.ochre }}>
              ¥{total}
            </div>
          </div>
          <button onClick={onCheckout}
            className="ripple"
            style={{
              height: 38, padding: '0 24px', borderRadius: 19,
              background: T.celadon, color: '#fff',
              border: 'none', fontSize: 14, fontWeight: 500,
              cursor: 'pointer', letterSpacing: 1,
            }}>
            结算 ({items.filter(i => i.selected).length})
          </button>
        </div>
      </div>
    </div>
  );
}

  const rafRef = useRef(null);

  const onScroll = useCallback(() => {
    if (rafRef.current) return;
    rafRef.current = requestAnimationFrame(() => {
      if (scrollRef.current) {
        setScrollY(scrollRef.current.scrollTop);
      }
      rafRef.current = null;
    });
  }, []);

  useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    el.addEventListener('scroll', onScroll, { passive: true });
    return () => {
      el.removeEventListener('scroll', onScroll);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [onScroll]);

  // visibility pause
  useEffect(() => {
    const onVis = () => {
      if (document.hidden && rafRef.current) {
        cancelAnimationFrame(rafRef.current);
        rafRef.current = null;
      }
    };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, []);

  const headerOpacity = Math.min(1, scrollY / 120);

// ─────────────────────────────────────────────────────────────
// MAIN APP
// ─────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState('home');
  const [stack, setStack] = useState([]); // pushed pages
  const [cartItems, setCartItems] = useState(3);
  const [toast, setToast] = useState({ msg: '', show: false });
  const toastTimer = useRef(null);
  const [sheet, setSheet] = useState({ open: false, title: '', content: null });
  const [transitioning, setTransitioning] = useState(false);

  const showToast = (msg) => {
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setToast({ msg, show: true });
    toastTimer.current = setTimeout(() => {
      setToast(t => ({ ...t, show: false }));
    }, 1800);
  };

  useEffect(() => () => {
    if (toastTimer.current) clearTimeout(toastTimer.current);
  }, []);

  const pushPage = (page, props = {}) => {
    if (transitioning) return;
    setTransitioning(true);
    setStack(prev => [...prev, { page, props }]);
    setTimeout(() => setTransitioning(false), 350);
  };

  const popPage = () => {
    if (transitioning || stack.length === 0) return;
    setTransitioning(true);
    setStack(prev => prev.slice(0, -1));
    setTimeout(() => setTransitioning(false), 350);
  };

  const handleProduct = (p) => pushPage('detail', { product: p });
  const handleAddCart = () => {
    setCartItems(n => n + 1);
    showToast('已加入购物车');
  };
  const handleBuy = () => {
    showToast('正在跳转结算...');
    setTimeout(() => {
      setSheet({
        open: true,
        title: '确认订单',
        content: 'order',
      });
    }, 500);
  };
  const handleCheckout = () => {
    setSheet({
      open: true,
      title: '确认订单',
      content: 'order',
    });
  };

  const handleTabChange = (key) => {
    if (transitioning) return;
    setTab(key);
    setStack([]);
  };

  const currentStackPage = stack[stack.length - 1];

  const renderMainPage = () => {
    switch (tab) {
      case 'home':
        return (
          <PullToRefresh onRefresh={() => new Promise(r => setTimeout(r, 1200))}>
            <div style={{ paddingTop: 8 }}>
              <PageHeader title="青釉" />
            </div>
            <HomePage onProduct={handleProduct} />
          </PullToRefresh>
        );
      case 'category':
        return (
          <>
            <div style={{ paddingTop: 8 }}>
              <PageHeader title="分类" />
            </div>
            <CategoryPage onProduct={handleProduct} />
          </>
        );
      case 'discover':
        return (
          <>
            <div style={{ paddingTop: 8 }}>
              <PageHeader title="发现" />
            </div>
            <DiscoverPage />
          </>
        );
      case 'cart':
        return (
          <CartPage onCheckout={handleCheckout} />
        );
      case 'profile':
        return (
          <PullToRefresh onRefresh={() => new Promise(r => setTimeout(r, 1000))}>
            <div style={{ paddingTop: 8 }}>
              <PageHeader title="我的" />
            </div>
            <ProfilePage onNavigate={(p) => pushPage(p)} />
          </PullToRefresh>
        );
      default:
        return null;
    }
  };

  const renderStackPage = (sp) => {
    switch (sp.page) {
      case 'detail':
        return (
          <DetailPage
            product={sp.props.product}
            onBack={popPage}
            onAddCart={handleAddCart}
            onBuy={handleBuy}
          />
        );
      case 'design':
        return <DesignSpecPage onBack={popPage} />;
      case 'api':
        return <ApiDocPage onBack={popPage} />;
      default:
        return null;
    }
  };

  const showTabBar = stack.length === 0;

  return (
    <div style={{
      position: 'relative',
    }}>

          )}

          {/* TabBar */}
          {showTabBar && (
            <WxTabBar
              current={tab}
              onChange={handleTabChange}
              cartCount={cartItems}
            />
          )}

          {/* home indicator */}
          <div style={{
            position: 'absolute', bottom: 6, left: 0, right: 0,
            height: 5, display: 'flex', justifyContent: 'center',
            zIndex: 70, pointerEvents: 'none',
          }}>
            <div style={{
              width: 120, height: 4, borderRadius: 2,
              background: 'rgba(0,0,0,0.3)',
            }}/>
          </div>

          {/* Bottom Sheet */}
          <BottomSheet
            open={sheet.open}
            onClose={() => setSheet({ ...sheet, open: false })}
            title={sheet.title}
          >
            {sheet.content === 'order' && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                <div style={{
                  display: 'flex', gap: 10, alignItems: 'center',
                  paddingBottom: 12, borderBottom: '0.5px solid #eee',
                }}>
                  <div style={{
                    width: 56, height: 56, borderRadius: 10,
                    background: `linear-gradient(135deg, ${T.frost} 0%, ${T.mist} 100%)`,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                  }}>
                    <TeawareImg type="tea1" size={48} />
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 13, fontWeight: 500 }}>龙泉青瓷·粉青釉莲瓣碗</div>
                    <div style={{ fontSize: 12, color: T.stone, marginTop: 2 }}>粉青釉 · 1件</div>
                  </div>
                  <div style={{ color: T.ochre, fontWeight: 600 }}>¥268</div>
                </div>

                <div style={{
                  display: 'flex', flexDirection: 'column', gap: 10,
                  fontSize: 13,
                }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <span style={{ color: T.stone }}>商品金额</span>
                    <span>¥268</span>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <span style={{ color: T.stone }}>运费</span>
                    <span>免运费</span>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <span style={{ color: T.stone }}>优惠券</span>
                    <span style={{ color: T.ochre }}>-¥10</span>
                  </div>
                </div>

                <div style={{
                  display: 'flex', justifyContent: 'space-between',
                  alignItems: 'center', paddingTop: 10,
                  borderTop: '0.5px solid #eee',
                }}>
                  <div>
                    <span style={{ fontSize: 12, color: T.stone }}>实付 </span>
                    <span style={{ fontSize: 18, fontWeight: 700, color: T.ochre }}>¥258</span>
                  </div>
                  <button
                    onClick={() => {
                      setSheet({ ...sheet, open: false });
                      showToast('下单成功！');
                    }}
                    className="ripple"
                    style={{
                      padding: '10px 28px', borderRadius: 22,
                      background: T.celadonDeep, color: '#fff',
                      border: 'none', fontSize: 14, fontWeight: 500,
                      cursor: 'pointer',
                    }}>提交订单</button>
                </div>
              </div>
            )}
          </BottomSheet>

          {/* Toast */}
          <Toast msg={toast.msg} show={toast.show} />
        </div>
      </div>

      {/* label under device */}
      <div style={{
        textAlign: 'center', marginTop: 20,
        fontSize: 12, color: T.stone, letterSpacing: 1,
      }}>
        微信小程序 · 青釉茶器美学 · 8 页交互原型
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// announce upgrade availability
function announceUpgrade() {
  try {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  } catch (e) {}
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}
</script>
</body>
</html>

// ─────── 自定义光标 ───────
function CustomCursor() {
  const ringRef = useRef(null);
  const dotRef = useRef(null);
  const [hovered, setHovered] = useState(false);
  const rafRef = useRef(null);
  const targetRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const currentRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const reduced = useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  useEffect(() => {
    if (reduced.current) return;

    const animate = () => {
      const cx = currentRef.current.x;
      const cy = currentRef.current.y;
      const tx = targetRef.current.x;
      const ty = targetRef.current.y;
      // 阻尼跟随
      currentRef.current.x += (tx - cx) * 0.25;
      currentRef.current.y += (ty - cy) * 0.25;

      if (ringRef.current) {
        ringRef.current.style.left = cx + 'px';
        ringRef.current.style.top = cy + 'px';
      }
      if (dotRef.current) {
        dotRef.current.style.left = tx + 'px';
        dotRef.current.style.top = ty + 'px';
      }
      rafRef.current = requestAnimationFrame(animate);
    };
    rafRef.current = requestAnimationFrame(animate);

    const onMove = (e) => {
      targetRef.current.x = e.clientX;
      targetRef.current.y = e.clientY;
    };

    const onOver = (e) => {
      if (e.target.closest('button, .tab-item, .tilt-card, .wood-btn, .sheet-item, .swipe-btn, .nav-back, .cap-btn, .joint-card, .workshop-card, .category-item, .star-btn, .bookmark-btn')) {
        setHovered(true);
      } else {
        setHovered(false);
      }
    };

    const onClick = (e) => {
      const ripple = document.createElement('div');
      ripple.className = 'cursor-ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    };

    const onVisibility = () => {
      if (document.hidden) {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      } else {
        rafRef.current = requestAnimationFrame(animate);
      }
    };

    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseover', onOver);
    window.addEventListener('click', onClick);
    document.addEventListener('visibilitychange', onVisibility);

    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseover', onOver);
      window.removeEventListener('click', onClick);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, []);

  if (reduced.current) return null;

  return (
    <>
      <div ref={ringRef} className={'cursor-ring' + (hovered ? ' hovered' : '')} />
      <div ref={dotRef} className={'cursor-dot' + (hovered ? ' hovered' : '')} />
    </>
  );
}

// ─────── 数字计数 Hook ───────
function useCountUp(target, duration = 1500, start = true) {
  const [val, setVal] = useState(0);
  const rafRef = useRef(null);

  useEffect(() => {
    if (!start) return;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) { setVal(target); return; }

    let startTime = null;
    const step = (t) => {
      if (!startTime) startTime = t;
      const progress = Math.min((t - startTime) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setVal(Math.round(target * eased));
      if (progress < 1) rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [target, duration, start]);

  return val;
}

// ─────── 图鉴页（吸顶Tab+网格+下拉刷新） ───────
function CataloguePage({ onOpenDetail }) {
  const [activeCat, setActiveCat] = useState('all');
  const [pullY, setPullY] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const [showSkeleton, setShowSkeleton] = useState(false);
  const startYRef = useRef(0);
  const scrollRef = useRef(null);
  const pullRef = useRef(null);
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const handleTouchStart = (e) => {
    if (scrollRef.current && scrollRef.current.scrollTop <= 0) {
      startYRef.current = e.touches[0].clientY;
    }
  };
  const handleTouchMove = (e) => {
    if (scrollRef.current && scrollRef.current.scrollTop <= 0 && startYRef.current) {
      const dy = e.touches[0].clientY - startYRef.current;
      if (dy > 0) {
        setPullY(Math.min(dy * 0.5, 80));
      }
    }
  };
  const handleTouchEnd = () => {
    if (pullY > 50) {
      setRefreshing(true);
      setPullY(50);
      setShowSkeleton(true);
      setTimeout(() => {
        setRefreshing(false);
        setPullY(0);
        setShowSkeleton(false);
      }, 1800);
    } else {
      setPullY(0);
    }
    startYRef.current = 0;
  };

  // 也支持鼠标滚轮触发下拉（桌面端体验）
  useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    const onWheel = (e) => {
      if (el.scrollTop <= 0 && e.deltaY < 0 && !refreshing) {
        e.preventDefault();
        setPullY(prev => Math.min(prev + Math.abs(e.deltaY) * 0.3, 80));
        clearTimeout(pullRef.current);
        pullRef.current = setTimeout(() => {
          if (pullRef.current) {
            // 松手判定
          }
        }, 150);
      }
    };
    el.addEventListener('wheel', onWheel, { passive: false });
    return () => el.removeEventListener('wheel', onWheel);
  }, [refreshing]);

  // 回弹定时器
  useEffect(() => {
    let t;
    if (!refreshing && pullY > 0) {
      t = setTimeout(() => {
        if (pullY < 50) setPullY(0);
        else {
          setRefreshing(true);
          setShowSkeleton(true);
          setTimeout(() => {
            setRefreshing(false);
            setPullY(0);
            setShowSkeleton(false);
          }, 1800);
        }
      }, 200);
    }
    return () => clearTimeout(t);
  }, [pullY, refreshing]);

  const filtered = activeCat === 'all' ? JOINTS : JOINTS.filter(j => {
    const map = { panel: '面板类', frame: '框架类', corner: '角接类', support: '支撑类' };
    return j.category === map[activeCat];
  });

  return (
    <div
      ref={scrollRef}
      className="page-content"
      style={{ paddingBottom: 56 }}
      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}
      onTouchEnd={handleTouchEnd}
    >
      {/* 下拉刷新指示 */}
      <div className="pull-refresh" style={{
        transform: `translateY(${pullY - 60}px)`,
        transition: refreshing ? 'none' : 'transform 0.3s cubic-bezier(.2,.8,.2,1)',
      }}>
        {refreshing ? <div className="pull-icon" /> : <Icon name="arrowDown" size={18} color="#a0522d" />}
        <span>{refreshing ? '正在刷新...' : pullY > 50 ? '释放刷新' : '下拉刷新'}</span>
      </div>

      {/* 页面标题区 */}
      <div style={{
        padding: '88px 20px 16px',
        background: 'linear-gradient(180deg, #f5ede4 0%, #f0e6d8 100%)',
      }}>
        <h1 className="serif" style={{ fontSize: 28, fontWeight: 700, color: '#2b1f17' }}>榫卯图鉴</h1>
        <p style={{ fontSize: 13, color: '#8a7a6a', marginTop: 6 }}>
          收录 {JOINTS.length} 种经典榫卯结构，拆解千年营造智慧
        </p>
      </div>

      {/* 吸顶 Tab */}
      <div style={{
        position: 'sticky', top: 88, zIndex: 10,
        background: 'rgba(245,237,228,0.95)',
        backdropFilter: 'blur(12px)',
        WebkitBackdropFilter: 'blur(12px)',
        padding: '10px 16px',
        borderBottom: '0.5px solid rgba(0,0,0,0.04)',
      }}>
        <div style={{ display: 'flex', gap: 8, overflowX: 'auto' }}>
          {CATEGORIES.map(cat => (
            <div
              key={cat.id}
              onClick={() => setActiveCat(cat.id)}
              className="category-item"
              style={{
                flexShrink: 0,
                padding: '7px 16px',
                borderRadius: 20,
                fontSize: 13,
                background: activeCat === cat.id ? 'linear-gradient(135deg, #a0522d, #8b4513)' : '#fff',
                color: activeCat === cat.id ? '#f5ede4' : '#5a4a3a',
                fontWeight: activeCat === cat.id ? 600 : 400,
                cursor: 'pointer',
                transition: 'all 0.3s',
                boxShadow: activeCat === cat.id ? '0 4px 12px rgba(160,82,45,0.3)' : 'none',
              }}
            >
              {cat.icon} {cat.name}
            </div>
          ))}
        </div>
      </div>

      {/* 网格内容 */}
      <div style={{
        padding: '16px',
        display: 'grid', gridTemplateColumns: '1fr 1fr',
        gap: 12,
      }}>
        {showSkeleton ? (
          Array.from({ length: 6 }).map((_, i) => (
            <div key={i} style={{
              background: '#fff', borderRadius: 14, overflow: 'hidden',
            }}>
              <div className="skeleton" style={{ height: 120, borderRadius: 0 }} />
              <div style={{ padding: 10 }}>
                <div className="skeleton" style={{ height: 14, width: '70%', marginBottom: 6 }} />
                <div className="skeleton" style={{ height: 10, width: '40%' }} />
              </div>
            </div>
          ))
        ) : (
          filtered.map((j, i) => (
            <div
              key={j.id}
              className="joint-card"
              onClick={() => onOpenDetail(j)}
              style={{
                background: '#fff', borderRadius: 14, overflow: 'hidden',
                cursor: 'pointer',
                boxShadow: '0 4px 14px rgba(90,58,32,0.06)',
                animation: `staggerIn 0.5s ease-out ${i * 0.06}s both`,
                transition: 'transform 0.2s',
              }}
              onMouseEnter={(e) => e.currentTarget.style.transform = 'translateY(-4px)'}
              onMouseLeave={(e) => e.currentTarget.style.transform = 'translateY(0)'}
            >
              <div style={{ position: 'relative', height: 120 }}>
                <img src={j.img} alt={j.name}
                  style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                <span className="wood-tag" style={{
                  position: 'absolute', top: 8, left: 8,
                  background: 'rgba(0,0,0,0.5)', color: '#fff',
                  fontSize: 10,
                }}>{j.category}</span>
              </div>
              <div style={{ padding: '10px 12px 12px' }}>
                <div className="serif" style={{ fontSize: 15, fontWeight: 600, color: '#2b1f17' }}>
                  {j.name}
                </div>
                <div style={{ fontSize: 11, color: '#9a8a7a', marginTop: 3 }}>
                  {j.pinyin}
                </div>
                <div style={{
                  display: 'flex', alignItems: 'center',
                  marginTop: 8, gap: 2,
                }}>
                  {Array.from({ length: 5 }).map((_, si) => (
                    <div key={si} style={{
                      width: 12, height: 12,
                      borderRadius: '50%',
                      background: si < j.difficulty ? '#c97145' : '#e8ddd0',
                    }} />
                  ))}
                  <span style={{ fontSize: 10, color: '#9a8a7a', marginLeft: 4 }}>难度</span>
                </div>
              </div>
            </div>
          ))
        )}
      </div>

      <div style={{ padding: '10px 20px 20px', textAlign: 'center' }}>
        <div className="divider-decor">
          <span>— 共 {filtered.length} 种结构 —</span>
        </div>
      </div>
    </div>
  );
}

// ─────── 主应用 ───────
function App() {
  const [activeTab, setActiveTab] = useState('home');
  const [stack, setStack] = useState(['home']);
  const [transitioning, setTransitioning] = useState(false);
  const [sheetVisible, setSheetVisible] = useState(false);
  const [currentDetail, setCurrentDetail] = useState(null);

  const currentPage = stack[stack.length - 1];

  const pushPage = (page, data) => {
    setTransitioning(true);
    setTimeout(() => {
      if (page === 'detail' && data) {
        setCurrentDetail(data);
      }
      setStack(prev => [...prev, page]);
      setTimeout(() => setTransitioning(false), 300);
    }, 50);
  };

  const popPage = () => {
    if (stack.length <= 1) return;
    setTransitioning(true);
    setTimeout(() => {
      setStack(prev => prev.slice(0, -1));
      setTimeout(() => setTransitioning(false), 300);
    }, 50);
  };

  const openDetail = (item) => {
    pushPage('detail', item);
  };

  const openSpec = () => {
    pushPage('spec');
  };

  const openApi = () => {
    pushPage('api');
  };

  const openActionSheet = () => {
    setSheetVisible(true);
  };

  const closeActionSheet = () => {
    setSheetVisible(false);
  };

  // Tab 对应的主页
  const renderMainPage = (tab) => {
    switch (tab) {
      case 'home': return <HomePage onOpenDetail={openDetail} />;
      case 'book': return <CataloguePage onOpenDetail={openDetail} />;
      case 'workshop': return <WorkshopPage onOpenDetail={openDetail} />;
      case 'mine': return <MinePage onOpenSpec={openSpec} onOpenApi={openApi} />;
      default: return null;
    }
  };

  // 渲染当前栈顶页面
  const renderPage = (page, idx) => {
    const isTop = idx === stack.length - 1;
    const pageStyle = {
      zIndex: idx + 1,
      background: '#f5ede4',
      opacity: transitioning ? undefined : 1,
    };

    let content;
    if (idx === 0) {
      content = (
        <>
          {renderMainPage(activeTab)}
          <WXTabBar activeTab={activeTab} setActiveTab={setActiveTab} stack={stack} setStack={setStack} />
        </>
      );
    } else if (page === 'detail' && currentDetail) {
      content = (
        <DetailPage
          item={currentDetail}
          onBack={popPage}
          onActionSheet={openActionSheet}
        />
      );
    } else if (page === 'spec') {
      content = <SpecPage onBack={popPage} />;
    } else if (page === 'api') {
      content = <ApiPage onBack={popPage} />;
    }

    return (
      <div key={page + '-' + idx} className="page page-enter-right" style={pageStyle}>
        {content}
      </div>
    );
  };

  // 状态栏颜色：深色页用浅色
  const darkStatus = currentPage === 'detail' || currentPage === 'spec' || currentPage === 'api' ||
    (stack.length === 1 && (activeTab === 'mine'));

  return (
    <div className="stage">
      <CustomCursor />

      <div className="wx-phone">
        <div className="wx-screen">
          {/* 状态栏 */}
          <WXStatusBar dark={darkStatus} />

          {/* 胶囊按钮 */}
          <WXCapsule dark={darkStatus} onMore={openActionSheet} />

          {/* 页面容器 */}
          <div className="page-container">
            {stack.map((page, idx) => renderPage(page, idx))}
          </div>

          {/* ActionSheet 遮罩 */}
          <div
            className={'action-sheet-mask' + (sheetVisible ? ' show' : '')}
            onClick={closeActionSheet}
          />

          {/* ActionSheet */}
          <div className={'action-sheet' + (sheetVisible ? ' show' : '')}>
            <div className="sheet-item" onClick={closeActionSheet}>
              <span style={{ color: '#a0522d' }}>分享给好友</span>
            </div>
            <div className="sheet-item" onClick={closeActionSheet}>
              分享到朋友圈
            </div>
            <div className="sheet-item" onClick={closeActionSheet}>
              收藏
            </div>
            <div className="sheet-item" onClick={closeActionSheet}>
              举报
            </div>
            <div className="sheet-item sheet-cancel" onClick={closeActionSheet}>
              取消
            </div>
          </div>
        </div>
      </div>

      {/* 信息提示 */}
      <div style={{
        position: 'fixed', bottom: 24, left: '50%',
        transform: 'translateX(-50%)',
        color: 'rgba(255,255,255,0.4)',
        fontSize: 11, letterSpacing: 1,
        fontFamily: '"Noto Serif SC", serif',
      }}>
        榫卯堂 · 微信小程序 · V2
      </div>
    </div>
  );
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>发酵实验室 · Fermentary — V2 手机应用 UI</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <style>
    /* ── Global Reset & Stage ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: radial-gradient(ellipse at 50% 30%, #1A130E 0%, #0E0A08 70%, #070504 100%);
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      color: #F7F2E9;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    /* Ambient warm glow behind the phone */
    body::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(217,164,65,0.18) 0%, rgba(217,164,65,0) 60%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }
    #root { position: relative; z-index: 1; }

    /* ── Typography tokens ── */
    .serif { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; }
    .mono { font-family: 'JetBrains Mono', monospace; }

    /* ── Page transition ── */
    .page-enter {
      animation: pageEnter 420ms cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes pageEnter {
      from { opacity: 0; transform: translateY(14px) scale(0.985); filter: blur(6px); }
      to   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    /* ── Scroll fade-in (observe via IntersectionObserver in JS) ── */
    .fade-item {
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 500ms cubic-bezier(.2,.8,.2,1), transform 500ms cubic-bezier(.2,.8,.2,1);
    }
    .fade-item.is-in { opacity: 1; transform: translateY(0); }

    /* ── Shimmer sweep ── */
    .shimmer {
      position: relative;
      overflow: hidden;
    }
    .shimmer::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
      transform: skewX(-20deg);
      animation: shimmerSweep 3.8s ease-in-out infinite;
    }
    @keyframes shimmerSweep {
      0%, 60% { left: -100%; }
      100% { left: 130%; }
    }

    /* ── Custom cursor (desktop only) ── */
    .custom-cursor,
    .custom-cursor-dot,
    .custom-cursor-aura {
      position: fixed;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 2147483647;
      transform: translate3d(-50%, -50%, 0);
      will-change: transform;
      mix-blend-mode: difference;
    }
    .custom-cursor {
      width: 32px; height: 32px;
      border: 2px solid #fff;
      border-radius: 50%;
      transition: width 200ms cubic-bezier(.2,.8,.2,1), height 200ms cubic-bezier(.2,.8,.2,1),
                  border-color 200ms, background 200ms;
      box-shadow: 0 0 12px rgba(217,164,65,0.6), 0 0 32px rgba(217,164,65,0.25);
    }
    .custom-cursor.hover {
      width: 48px; height: 48px;
      border-color: #D9A441;
      background: rgba(217,164,65,0.08);
      box-shadow: 0 0 20px rgba(217,164,65,0.8), 0 0 48px rgba(217,164,65,0.35);
    }
    .custom-cursor-dot {
      width: 6px; height: 6px;
      background: #D9A441;
      border-radius: 50%;
      box-shadow: 0 0 8px #D9A441, 0 0 16px rgba(217,164,65,0.6);
    }
    .custom-cursor-aura {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(217,164,65,0.15) 0%, transparent 70%);
      transition: opacity 300ms;
    }
    /* Cursor click ripple */
    .cursor-ripple {
      position: fixed;
      width: 10px; height: 10px;
      border: 2px solid #D9A441;
      border-radius: 50%;
      pointer-events: none;
      z-index: 2147483646;
      transform: translate3d(-50%, -50%, 0);
      animation: cursorRipple 600ms cubic-bezier(.2,.8,.2,1) forwards;
      mix-blend-mode: screen;
    }
    @keyframes cursorRipple {
      0% { width: 10px; height: 10px; opacity: 0.8; }
      100% { width: 60px; height: 60px; opacity: 0; border-width: 1px; }
    }

    @media (hover: none), (pointer: coarse) {
      .custom-cursor, .custom-cursor-dot, .custom-cursor-aura, .cursor-ripple { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .page-enter { animation: none; opacity: 1; transform: none; filter: none; }
      .shimmer::after { animation: none; opacity: 0; }
      .fade-item { opacity: 1; transform: none; transition: none; }
      .cursor-ripple { animation: none; opacity: 0; }
      .custom-cursor, .custom-cursor-dot, .custom-cursor-aura { transition: none; }
    }

    /* ── Scrollbar inside phone ── */
    .phone-scroll::-webkit-scrollbar { width: 0; height: 0; }
    .phone-scroll { scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- Starter components -->
  <script type="text/babel" src="components/ios-frame.jsx"></script>
  <script type="text/babel" src="components/tweaks-panel.jsx"></script>

  <!-- App modules (load order matters: data → utils → components → pages → app) -->
  <script type="text/babel" src="app/data.jsx"></script>
  <script type="text/babel" src="app/utils.jsx"></script>
  <script type="text/babel" src="app/effects.jsx"></script>
  <script type="text/babel" src="app/components.jsx"></script>
  <script type="text/babel" src="app/pages.jsx"></script>
  <script type="text/babel" src="app/app.jsx"></script>

  <!-- Main entry -->
  <script type="text/babel">
    // ── TWEAK DEFAULTS ──
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "butter": "#D9A441",
      "cream": "#F7F2E9",
      "cocoa": "#2B1D16",
      "accent": "#B87333",
      "doughScale": 1.05,
      "bubbleRate": 1.0,
      "speed": 1.0,
      "dark": true
    }/*EDITMODE-END*/;

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App defaults={TWEAK_DEFAULTS} />);

    // ── Custom cursor (imperative, outside React for perf) ──
    (function initCursor() {
      if (window.matchMedia('(hover: none), (pointer: coarse)').matches) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      const ring = document.createElement('div');
      ring.className = 'custom-cursor';
      const dot = document.createElement('div');
      dot.className = 'custom-cursor-dot';
      const aura = document.createElement('div');
      aura.className = 'custom-cursor-aura';
      document.body.appendChild(aura);
      document.body.appendChild(ring);
      document.body.appendChild(dot);

      let targetX = window.innerWidth / 2;
      let targetY = window.innerHeight / 2;
      let ringX = targetX, ringY = targetY;
      let dotX = targetX, dotY = targetY;
      let auraX = targetX, auraY = targetY;
      let rafId = null;
      let visible = true;
      let hover = false;

      function tick() {
        if (!visible) { rafId = null; return; }
        // Spring-like follow with different dampings for each layer
        ringX += (targetX - ringX) * 0.18;
        ringY += (targetY - ringY) * 0.18;
        dotX += (targetX - dotX) * 0.35;
        dotY += (targetY - dotY) * 0.35;
        auraX += (targetX - auraX) * 0.08;
        auraY += (targetY - auraY) * 0.08;

        ring.style.transform = `translate3d(${ringX}px, ${ringY}px, 0) translate(-50%, -50%)`;
        dot.style.transform = `translate3d(${dotX}px, ${dotY}px, 0) translate(-50%, -50%)`;
        aura.style.transform = `translate3d(${auraX}px, ${auraY}px, 0) translate(-50%, -50%)`;
        rafId = requestAnimationFrame(tick);
      }
      rafId = requestAnimationFrame(tick);

      const onMove = (e) => {
        targetX = e.clientX;
        targetY = e.clientY;
      };

      const onOver = (e) => {
        const t = e.target.closest('button, a, [role="button"], .interactive, .ferment-card, .tab-btn, input, textarea, select');
        if (t) {
          hover = true;
          ring.classList.add('hover');
        } else if (hover) {
          hover = false;
          ring.classList.remove('hover');
        }
      };

      const onClick = (e) => {
        const r = document.createElement('div');
        r.className = 'cursor-ripple';
        r.style.left = e.clientX + 'px';
        r.style.top = e.clientY + 'px';
        document.body.appendChild(r);
        setTimeout(() => r.remove(), 600);
      };

      const onVisibility = () => {
        if (document.hidden) {
          visible = false;
          if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        } else {
          visible = true;
          if (!rafId) rafId = requestAnimationFrame(tick);
        }
      };

      window.addEventListener('mousemove', onMove, { passive: true });
      window.addEventListener('mouseover', onOver, { passive: true });
      window.addEventListener('click', onClick, true);
      document.addEventListener('visibilitychange', onVisibility);

      // Cleanup on unload
      window.__cleanupCursor = () => {
        visible = false;
        if (rafId) cancelAnimationFrame(rafId);
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseover', onOver);
        window.removeEventListener('click', onClick, true);
        document.removeEventListener('visibilitychange', onVisibility);
        [ring, dot, aura].forEach(el => el.remove());
      };
    })();

    // ── Announce upgrade-ability ──
    function announceUpgrade() {
      try {
        window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
      } catch(e) {}
    }
    announceUpgrade();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announceUpgrade, { once: true });
    }
  </script>
</body>
</html>

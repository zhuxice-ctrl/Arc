<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>菇事集 Fungi Tales — 微信小程序 V2</title>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: #E8E3D8;
    font-family: "Noto Sans SC", -apple-system, system-ui, sans-serif;
    overflow: hidden;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at top, #F0EBDF 0%, #DCD4C2 100%);
  }

  /* ===== Design Tokens ===== */
  :root {
    --moss: #5C7A4E;
    --moss-dark: #3F5A34;
    --moss-light: #7A9968;
    --moss-pale: #B5C9A8;
    --ochre: #C97B3D;
    --ochre-light: #E09862;
    --ochre-dark: #A65A22;
    --cream: #FAF5E9;
    --cream-deep: #F0E8D2;
    --brown-deep: #3B2E24;
    --brown-mid: #5C4A3A;
    --brown-soft: #8A7662;
    --brick: #B3472C;
    --brick-light: #D66547;
  }

  /* ===== Phone Shell ===== */
  .phone-stage {
    position: relative;
    width: 393px;
    height: 852px;
    border-radius: 54px;
    background: #0a0a0a;
    padding: 12px;
    box-shadow:
      0 50px 100px -20px rgba(59,46,36,0.4),
      0 30px 60px -30px rgba(59,46,36,0.5),
      inset 0 0 0 1px rgba(255,255,255,0.06);
    flex-shrink: 0;
  }
  .phone-screen {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 44px;
    overflow: hidden;
    background: var(--cream);
  }

  /* ===== Dynamic Island ===== */
  .dynamic-island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 37px;
    background: #000;
    border-radius: 20px;
    z-index: 100;
  }

  /* ===== Status Bar ===== */
  .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px 0 32px;
    z-index: 50;
    font-family: -apple-system, "SF Pro", system-ui;
    font-weight: 600;
    font-size: 17px;
    color: var(--brown-deep);
    pointer-events: none;
  }
  .status-bar.dark { color: #fff; }
  .status-bar .right-icons {
    display: flex; align-items: center; gap: 6px;
  }

  /* ===== WeChat Mini Program Capsule ===== */
  .mp-capsule {
    position: absolute;
    top: 54px;
    right: 16px;
    width: 87px;
    height: 32px;
    background: rgba(59,46,36,0.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    z-index: 50;
    transition: background 0.3s ease;
  }
  .mp-capsule.dark {
    background: rgba(255,255,255,0.2);
  }
  .capsule-btn {
    flex: 1;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
  }
  .capsule-btn:first-child::after {
    content: '';
    position: absolute;
    right: 0;
    top: 8px;
    bottom: 8px;
    width: 0.5px;
    background: rgba(59,46,36,0.2);
  }
  .mp-capsule.dark .capsule-btn:first-child::after {
    background: rgba(255,255,255,0.3);
  }
  .capsule-btn svg {
    width: 18px; height: 18px;
    stroke: var(--brown-deep);
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .mp-capsule.dark .capsule-btn svg { stroke: #fff; }

  /* ===== Page Container ===== */
  .page-wrap {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .page {
    position: absolute;
    inset: 0;
    background: var(--cream);
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }
  .page::-webkit-scrollbar { display: none; }
  .page.hidden { display: none; }

  /* Page transitions - mini program push/pop */
  @keyframes pagePushIn {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }
  @keyframes pagePushOut {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(-30%); opacity: 0.5; }
  }
  @keyframes pagePopIn {
    from { transform: translateX(-30%); opacity: 0.5; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes pagePopOut {
    from { transform: translateX(0); }
    to { transform: translateX(100%); }
  }
  .page.enter-push { animation: pagePushIn 0.35s cubic-bezier(0.32, 0.72, 0, 1) both; }
  .page.enter-pop { animation: pagePopIn 0.35s cubic-bezier(0.32, 0.72, 0, 1) both; }
  .page.exit-push { animation: pagePushOut 0.35s cubic-bezier(0.32, 0.72, 0, 1) both; pointer-events: none; }
  .page.exit-pop { animation: pagePopOut 0.35s cubic-bezier(0.32, 0.72, 0, 1) both; pointer-events: none; }

  /* ===== TabBar ===== */
  .tabbar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: calc(84px + var(--tabbar-safe, 34px));
    background: rgba(250, 245, 233, 0.92);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-top: 0.5px solid rgba(59,46,36,0.1);
    display: flex;
    padding-bottom: var(--tabbar-safe, 34px);
    z-index: 40;
    padding-top: 8px;
  }
  .tabbar-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    color: var(--brown-soft);
    transition: color 0.25s ease;
  }
  .tabbar-item.active {
    color: var(--moss);
  }
  .tabbar-icon {
    position: relative;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .tabbar-item.active .tabbar-icon {
    transform: translateY(-2px) scale(1.1);
  }
  .tabbar-icon svg {
    width: 24px; height: 24px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .tabbar-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }
  .tabbar-dot {
    position: absolute;
    bottom: -1px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--moss);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .tabbar-item.active .tabbar-dot {
    transform: translateX(-50%) scale(1);
  }

  /* ===== Spore Canvas ===== */
  .spore-canvas {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    opacity: 0.6;
  }

  /* ===== Common ===== */
  .serif { font-family: "Noto Serif SC", serif; font-weight: 600; }
  .italic { font-family: "Cormorant Garamond", serif; font-style: italic; }

  /* ============================================================ */
  /* ===== HOME PAGE ===== */
  .home-page { background: var(--cream); }
  .home-hero {
    position: relative;
    height: 420px;
    background: linear-gradient(180deg, var(--moss-dark) 0%, var(--moss) 60%, var(--moss-light) 100%);
    overflow: hidden;
  }
  .home-hero-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 80%, rgba(201,123,61,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(181,201,168,0.2) 0%, transparent 40%);
  }
  .home-hero-content {
    position: relative;
    z-index: 10;
    padding: 90px 24px 0;
    color: var(--cream);
  }
  .home-hero-greeting {
    font-size: 14px;
    font-weight: 400;
    opacity: 0.8;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .home-hero-title {
    font-family: "Noto Serif SC", serif;
    font-size: 32px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 4px;
  }
  .home-hero-sub {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-size: 18px;
    opacity: 0.75;
    margin-bottom: 24px;
  }
  .search-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(250, 245, 233, 0.2);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(250, 245, 233, 0.25);
    border-radius: 14px;
    padding: 12px 16px;
  }
  .search-bar input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-size: 15px;
    color: var(--cream);
    font-family: "Noto Sans SC", sans-serif;
  }
  .search-bar input::placeholder { color: rgba(250, 245, 233, 0.55); }

  .season-banner {
    margin: -50px 16px 0;
    background: var(--cream);
    border-radius: 20px;
    padding: 18px 20px;
    box-shadow: 0 12px 40px -12px rgba(59,46,36,0.25);
    position: relative;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .season-icon {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, var(--ochre-light), var(--ochre));
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .season-info { flex: 1; min-width: 0; }
  .season-label {
    font-size: 12px;
    color: var(--brown-soft);
    margin-bottom: 2px;
  }
  .season-value {
    font-family: "Noto Serif SC", serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--brown-deep);
  }
  .season-count {
    font-size: 13px;
    color: var(--moss);
    font-weight: 500;
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 20px 14px;
  }
  .section-title {
    font-family: "Noto Serif SC", serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--brown-deep);
  }
  .section-more {
    font-size: 13px;
    color: var(--moss);
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }

  /* Mushroom Card - break ground animation */
  .mushroom-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    padding: 0 16px 100px;
  }
  .mushroom-card {
    background: #fff;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 4px 20px -6px rgba(59,46,36,0.12);
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
  }
  .mushroom-card:active {
    transform: scale(0.96);
  }
  .mushroom-card-img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    display: block;
  }
  .mushroom-card-body {
    padding: 12px 14px 14px;
  }
  .mushroom-card-name {
    font-family: "Noto Serif SC", serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--brown-deep);
    margin-bottom: 2px;
  }
  .mushroom-card-latin {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-size: 12px;
    color: var(--brown-soft);
    margin-bottom: 8px;
  }
  .mushroom-card-meta {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .edible-tag {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 500;
  }
  .edible-tag.safe { background: rgba(92,122,78,0.12); color: var(--moss); }
  .edible-tag.caution { background: rgba(201,123,61,0.15); color: var(--ochre); }
  .edible-tag.poison { background: rgba(179,71,44,0.12); color: var(--brick); }

  /* Mushroom cap spring bounce entrance */
  @keyframes mushroomBreakGround {
    0% { transform: translateY(40px) scaleY(0.3); opacity: 0; }
    50% { transform: translateY(-8px) scaleY(1.08); opacity: 1; }
    70% { transform: translateY(4px) scaleY(0.97); }
    100% { transform: translateY(0) scaleY(1); opacity: 1; }
  }
  .card-break-ground {
    animation: mushroomBreakGround 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  /* Floating Action Button */
  .fab {
    position: absolute;
    bottom: 110px;
    right: 20px;
    width: 56px;
    height: 56px;
    border-radius: 28px;
    background: linear-gradient(135deg, var(--moss-light), var(--moss));
    box-shadow:
      0 8px 24px -4px rgba(92,122,78,0.5),
      0 4px 8px -2px rgba(59,46,36,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 30;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .fab:active { transform: scale(0.9); }
  .fab svg {
    width: 24px; height: 24px;
    stroke: var(--cream);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  @keyframes fabPulse {
    0%, 100% { box-shadow: 0 8px 24px -4px rgba(92,122,78,0.5), 0 0 0 0 rgba(92,122,78,0.3); }
    50% { box-shadow: 0 8px 24px -4px rgba(92,122,78,0.5), 0 0 0 12px rgba(92,122,78,0); }
  }
  .fab-pulse { animation: fabPulse 2.5s ease-in-out infinite; }

  /* ===== CATALOG PAGE ===== */
  .catalog-page { background: var(--cream); }
  .catalog-header {
    padding: 60px 20px 14px;
    background: linear-gradient(180deg, var(--cream-deep), var(--cream));
  }
  .catalog-title {
    font-family: "Noto Serif SC", serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--brown-deep);
    margin-bottom: 4px;
  }
  .catalog-subtitle {
    font-size: 14px;
    color: var(--brown-soft);
    margin-bottom: 16px;
  }
  .catalog-search {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    border: 1px solid rgba(59,46,36,0.08);
    border-radius: 14px;
    padding: 11px 14px;
  }
  .catalog-search input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-size: 15px;
    color: var(--brown-deep);
    font-family: "Noto Sans SC", sans-serif;
  }

  /* Sticky filter tabs */
  .filter-sticky {
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--cream);
    padding: 12px 0 0;
    border-bottom: 1px solid rgba(59,46,36,0.06);
  }
  .filter-tabs {
    display: flex;
    gap: 0;
    padding: 0 16px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filter-tabs::-webkit-scrollbar { display: none; }
  .filter-tab {
    flex-shrink: 0;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 500;
    color: var(--brown-soft);
    cursor: pointer;
    position: relative;
    transition: color 0.25s ease;
  }
  .filter-tab.active {
    color: var(--moss);
    font-weight: 600;
  }
  .filter-tab::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%) scaleX(0);
    width: 20px;
    height: 3px;
    border-radius: 2px;
    background: var(--moss);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .filter-tab.active::after {
    transform: translateX(-50%) scaleX(1);
  }

  .filter-row {
    display: flex;
    gap: 8px;
    padding: 10px 16px 12px;
    flex-wrap: wrap;
  }
  .filter-chip {
    padding: 5px 12px;
    background: #fff;
    border: 1px solid rgba(59,46,36,0.1);
    border-radius: 16px;
    font-size: 12px;
    color: var(--brown-mid);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.2s ease;
  }
  .filter-chip.active {
    background: var(--moss);
    border-color: var(--moss);
    color: var(--cream);
  }

  /* Catalog list */
  .catalog-list {
    padding: 8px 16px 100px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .catalog-item {
    display: flex;
    gap: 14px;
    background: #fff;
    border-radius: 16px;
    padding: 12px;
    box-shadow: 0 2px 12px -4px rgba(59,46,36,0.08);
    cursor: pointer;
    transition: transform 0.25s ease;
  }
  .catalog-item:active { transform: scale(0.98); }
  .catalog-item-img {
    width: 80px;
    height: 80px;
    border-radius: 12px;
    object-fit: cover;
    flex-shrink: 0;
  }
  .catalog-item-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .catalog-item-name {
    font-family: "Noto Serif SC", serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--brown-deep);
    margin-bottom: 2px;
  }
  .catalog-item-latin {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-size: 12px;
    color: var(--brown-soft);
    margin-bottom: 6px;
  }
  .catalog-item-meta {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .meta-pill {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 6px;
    background: rgba(92,122,78,0.1);
    color: var(--moss);
    font-weight: 500;
  }
  .meta-pill.habitat { background: rgba(201,123,61,0.1); color: var(--ochre); }

  /* Pull to refresh */
  .ptr-indicator {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 60px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 12px;
    font-size: 12px;
    color: var(--brown-soft);
    opacity: 0;
    transform: translateY(-10px);
    transition: all 0.3s ease;
    pointer-events: none;
  }
  .ptr-indicator.show {
    opacity: 1;
    transform: translateY(0);
  }
  .ptr-icon {
    width: 20px; height: 20px;
    margin-right: 8px;
    animation: sporeFloat 2s ease-in-out infinite;
  }
  @keyframes sporeFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-4px) rotate(15deg); }
  }

  /* ===== DETAIL PAGE ===== */
  .detail-page { background: var(--cream); }
  .detail-hero {
    position: relative;
    height: 380px;
    overflow: hidden;
  }
  .detail-hero-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .detail-hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(59,46,36,0.3) 0%, transparent 40%, rgba(59,46,36,0.6) 100%);
  }
  .detail-back-btn {
    position: absolute;
    top: 60px;
    left: 16px;
    width: 36px;
    height: 36px;
    border-radius: 18px;
    background: rgba(250,245,233,0.25);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 20;
    border: 1px solid rgba(250,245,233,0.3);
  }
  .detail-back-btn svg {
    width: 20px; height: 20px;
    stroke: var(--cream);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .detail-hero-info {
    position: absolute;
    bottom: 20px;
    left: 20px;
    right: 20px;
    color: var(--cream);
    z-index: 10;
  }
  .detail-name {
    font-family: "Noto Serif SC", serif;
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .detail-latin {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-size: 17px;
    opacity: 0.85;

  .detail-section-title {

    font-size: 18px;

  .detail-desc {
    font-size: 14px;
    line-height: 1.75;

  .feature-grid {

  .feature-value {

    font-size: 15px;
    font-weight: 600;

  }

  .warning-box {
    background: linear-gradient(135deg, rgba(179,71,44,0.08), rgba(201,123,61,0.08));

  .warning-icon {

    font-weight: 600;

    margin-bottom: 4px;

  }

  .similar-item {

    gap: 12px;

    border-bottom: 1px solid rgba(59,46,36,0.06);

    font-size: 14px;
    font-weight: 500;
    color: var(--brown-deep);
    margin-bottom: 2px;
  }
  .similar-diff {
    font-size: 12px;
    color: var(--brown-soft);
  }

  /* Bottom action bar */
  .detail-bottom-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--cream);
    border-top: 1px solid rgba(59,46,36,0.08);

    display: flex;
    gap: 12px;
    z-index: 40;
    box-shadow: 0 -4px 20px -6px rgba(59,46,36,0.08);
  }
  .action-btn {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: #fff;
    border: 1px solid rgba(59,46,36,0.08);

    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s ease;
  }
  .action-btn:active { transform: scale(0.9); }
  .action-btn svg {
    width: 22px; height: 22px;
    stroke: var(--brown-mid);
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .action-btn.favorited svg {
    stroke: var(--ochre);
    fill: var(--ochre);
  }
  .primary-btn {
    flex: 1;
    height: 46px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--moss-light), var(--moss));
    color: var(--cream);

    font-weight: 600;

    font-family: "Noto Sans SC", sans-serif;

    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.2s ease;
  }
  .primary-btn:active { transform: scale(0.97); }

  /* ===== OBSERVATION PAGE ===== */
  .obs-page { background: var(--cream-deep); }
  .obs-header {
    padding: 60px 20px 16px;
    background: linear-gradient(135deg, var(--brown-deep), var(--brown-mid));
    color: var(--cream);
  }
  .obs-header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .obs-title {
    font-family: "Noto Serif SC", serif;
    font-size: 24px;
    font-weight: 700;
  }
  .obs-filter-btn {
    padding: 6px 12px;
    background: rgba(250,245,233,0.15);
    border-radius: 12px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  .obs-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .obs-stat {
    background: rgba(250,245,233,0.1);
    border-radius: 14px;
    padding: 12px;
    text-align: center;
  }
  .obs-stat-num {
    font-family: "Noto Serif SC", serif;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .obs-stat-label {
    font-size: 11px;
    opacity: 0.7;
  }

  .obs-list {
    padding: 12px 16px 100px;
  }
  .obs-section-label {
    font-size: 12px;
    color: var(--brown-soft);
    margin: 12px 4px 8px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  /* Swipe list item */
  .obs-swipe-wrap {
    position: relative;
    overflow: hidden;
    border-radius: 16px;
    margin-bottom: 10px;
  }
  .obs-swipe-actions {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    width: 180px;
    gap: 0;
  }
  .obs-action-btn {
    width: 60px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--cream);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    flex-direction: column;
    gap: 3px;
  }
  .obs-action-btn svg {
    width: 20px; height: 20px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .obs-action-btn.top { background: var(--ochre); }
  .obs-action-btn.edit { background: var(--moss); }
  .obs-action-btn.delete { background: var(--brick); }

  .obs-card {
    background: #fff;
    border-radius: 16px;
    padding: 14px;
    display: flex;
    gap: 14px;
    position: relative;
    z-index: 2;
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    cursor: grab;
    user-select: none;

  .obs-card.swiped { transform: translateX(-180px); }
  .obs-card-img {
    width: 64px; height: 64px;
    border-radius: 12px;
    object-fit: cover;
    flex-shrink: 0;
  }
  .obs-card-body { flex: 1; min-width: 0; }
  .obs-card-name {
    font-family: "Noto Serif SC", serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--brown-deep);
    margin-bottom: 3px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .pin-icon {
    color: var(--ochre);
    font-size: 11px;
  }
  .obs-card-location {
    font-size: 12px;
    color: var(--brown-soft);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .obs-card-date {
    font-size: 11px;
    color: var(--brown-soft);
    opacity: 0.7;
  }
  .obs-card-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 7px;
    font-weight: 500;
  }

  /* ===== PROFILE PAGE ===== */
  .profile-page { background: var(--cream); }
  .profile-hero {
    position: relative;
    background: linear-gradient(180deg, var(--moss-dark) 0%, var(--moss) 100%);
    padding: 70px 20px 80px;
    color: var(--cream);
    overflow: hidden;
  }
  .profile-moss-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(122,153,104,0.3) 0%, transparent 30%),
      radial-gradient(circle at 80% 60%, rgba(92,122,78,0.4) 0%, transparent 40%);
  }
  @keyframes mossBreath {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }
  .moss-breath { animation: mossBreath 8s ease-in-out infinite; }

  .profile-header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }
  .profile-avatar {
    width: 72px;
    height: 72px;
    border-radius: 36px;
    background: linear-gradient(135deg, var(--ochre-light), var(--ochre));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Noto Serif SC", serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--cream);
    border: 3px solid rgba(250,245,233,0.3);
    box-shadow: 0 4px 20px -4px rgba(59,46,36,0.3);
  }
  .profile-info { flex: 1; }
  .profile-name {
    font-family: "Noto Serif SC", serif;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .profile-id {
    font-size: 13px;
    opacity: 0.7;
    margin-bottom: 8px;
  }
  .profile-bio {
    font-size: 12px;
    line-height: 1.5;
    opacity: 0.85;
  }

  /* Circular progress rings */
  .profile-rings {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 140px;
    margin-bottom: 20px;
  }
  .ring-wrap {
    position: relative;
    width: 140px;
    height: 140px;
  }
  .ring-svg {
    position: absolute;
    inset: 0;
    transform: rotate(-90deg);
  }
  .ring-bg {
    fill: none;
    stroke: rgba(250,245,233,0.15);
    stroke-width: 6;
  }
  .ring-fill {
    fill: none;
    stroke: var(--cream);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 377;
    stroke-dashoffset: 377;
    transition: stroke-dashoffset 1.5s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .ring-fill.second {
    stroke: var(--moss-pale);
    stroke-width: 4;
  }
  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .ring-number {
    font-family: "Noto Serif SC", serif;
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
  }
  .ring-label {
    font-size: 11px;
    opacity: 0.75;
    margin-top: 4px;
  }

  .profile-stats-row {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: space-around;
    background: rgba(250,245,233,0.1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 16px;
  }
  .profile-stat {
    text-align: center;
  }
  .profile-stat-n {
    font-family: "Noto Serif SC", serif;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .profile-stat-l {
    font-size: 11px;
    opacity: 0.7;
  }

  .profile-content {
    margin-top: -50px;
    position: relative;
    z-index: 20;
    padding: 0 16px 100px;
  }
  .profile-card {
    background: #fff;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 8px 30px -10px rgba(59,46,36,0.15);
    margin-bottom: 16px;
  }
  .profile-card-title {
    font-family: "Noto Serif SC", serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--brown-deep);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .profile-card-title a {
    font-size: 12px;
    color: var(--brown-soft);
    font-weight: 400;
    font-family: "Noto Sans SC", sans-serif;
    cursor: pointer;
  }

  /* Grid of mini items */
  .mini-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .mini-grid-3 {
    grid-template-columns: repeat(3, 1fr);
  }
  .mini-item {
    aspect-ratio: 1;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
  }
  .mini-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
  }
  .mini-item:active img { transform: scale(1.1); }
  .mini-item .mini-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(59,46,36,0.6));
    display: flex;
    align-items: flex-end;
    padding: 6px 8px;
    font-size: 10px;
    color: var(--cream);
  }
  .mini-more {
    background: var(--cream-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: var(--brown-soft);
  }

  /* Menu list */
  .menu-list {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
  }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid rgba(59,46,36,0.05);
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .menu-item:last-child { border-bottom: none; }
  .menu-item:active { background: var(--cream-deep); }
  .menu-icon {
    width: 32px; height: 32px;
    border-radius: 10px;
    background: rgba(92,122,78,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .menu-icon.ochre { background: rgba(201,123,61,0.12); }
  .menu-icon.brown { background: rgba(59,46,36,0.08); }
  .menu-icon svg {
    width: 18px; height: 18px;
    stroke: var(--moss);
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .menu-icon.ochre svg { stroke: var(--ochre); }
  .menu-icon.brown svg { stroke: var(--brown-mid); }
  .menu-label {
    flex: 1;
    font-size: 14px;
    color: var(--brown-deep);
  }
  .menu-arrow {
    color: var(--brown-soft);
    opacity: 0.5;
  }

  /* ===== ACTION SHEET / HALF SCREEN ===== */
  .sheet-mask {
    position: absolute;
    inset: 0;
    background: rgba(59,46,36,0.4);
    z-index: 60;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .sheet-mask.show {
    opacity: 1;
    pointer-events: auto;
  }
  .sheet-panel {
    position: absolute;
    left: 0; right: 0;
    bottom: 0;
    background: var(--cream);
    border-radius: 24px 24px 0 0;
    z-index: 61;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    padding: 12px 20px calc(24px + 34px);
    max-height: 70%;
    overflow-y: auto;
  }
  .sheet-panel.show { transform: translateY(0); }
  .sheet-handle {
    width: 40px;
    height: 5px;
    border-radius: 3px;
    background: rgba(59,46,36,0.2);
    margin: 0 auto 16px;
  }
  .sheet-title {
    font-family: "Noto Serif SC", serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--brown-deep);
    margin-bottom: 16px;
    text-align: center;
  }
  .sheet-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sheet-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;

    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.2s ease;

  .sheet-option:active { transform: scale(0.98); }
  .sheet-option-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: rgba(92,122,78,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .sheet-option-icon svg {
    width: 20px; height: 20px;
    stroke: var(--moss);
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .sheet-option-info { flex: 1; }
  .sheet-option-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--brown-deep);
    margin-bottom: 2px;
  }
  .sheet-option-desc {
    font-size: 12px;
    color: var(--brown-soft);
  }

  /* ===== SEASONAL PAGE (Bonus 6th page) ===== */
  .seasonal-page { background: var(--cream); }
  .seasonal-hero {
    position: relative;
    height: 300px;
    background: linear-gradient(135deg, var(--ochre-dark), var(--ochre), var(--ochre-light));
    padding: 70px 20px 0;
    color: var(--cream);
    overflow: hidden;
  }
  .seasonal-leaves {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 10% 20%, rgba(250,245,233,0.15) 0%, transparent 40%),
      radial-gradient(ellipse at 90% 80%, rgba(179,71,44,0.2) 0%, transparent 50%);
  }
  .seasonal-title {
    position: relative;
    z-index: 5;
    font-family: "Noto Serif SC", serif;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .seasonal-sub {
    position: relative;
    z-index: 5;
    font-size: 14px;
    opacity: 0.85;
    margin-bottom: 20px;
  }
  .seasonal-calendar {

    z-index: 5;

  }

  .seasonal-body {
    padding: 20px 16px 100px;
    margin-top: -20px;
    background: var(--cream);
    border-radius: 24px 24px 0 0;
    position: relative;
    z-index: 10;

  .seasonal-section {
    margin-bottom: 20px;
  }
  .seasonal-section-head {
    font-family: "Noto Serif SC", serif;
    font-size: 16px;
    font-weight: 600;

    align-items: center;
    gap: 8px;

  .seasonal-dot {
    width: 8px; height: 8px;

  .seasonal-dot.peak { background: var(--ochre); }

  .peak-mushroom {
    display: flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(135deg, #fff, var(--cream));
    border: 1px solid rgba(201,123,61,0.15);

    padding: 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: transform 0.2s ease;
  }
  .peak-mushroom:active { transform: scale(0.98); }
  .peak-img {
    width: 56px; height: 56px;
    border-radius: 14px;
    object-fit: cover;
    flex-shrink: 0;
  }
  .peak-info { flex: 1; min-width: 0; }
  .peak-name {
    font-family: "Noto Serif SC", serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--brown-deep);
    margin-bottom: 2px;
  }
  .peak-peak {
    font-size: 12px;
    color: var(--ochre);
    font-weight: 500;
  }

  /* ===== DESIGN SPEC PAGE ===== */
  .spec-page { background: var(--cream); }
  .spec-header {
    background: linear-gradient(135deg, var(--brown-deep), var(--brown-mid));
    color: var(--cream);
    padding: 70px 20px 24px;
  }
  .spec-badge {
    display: inline-block;
    padding: 4px 10px;
    background: rgba(250,245,233,0.15);
    border-radius: 8px;

// ============================================================
// SPORE PARTICLE CANVAS
// ============================================================
function SporeCanvas({ count = 20, color = 'rgba(250,245,233,0.6)' }) {
  const canvasRef = useRef(null);
  const rafRef = useRef(null);
  const particlesRef = useRef([]);
  const animatingRef = useRef(false);
  const reducedMotion = useRef(false);

  useEffect(() => {
    reducedMotion.current = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reducedMotion.current) return;

    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width = canvas.offsetWidth;
    const h = canvas.height = canvas.offsetHeight;

    // Initialize spores
    particlesRef.current = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      size: 1.5 + Math.random() * 3,
      speedY: 0.2 + Math.random() * 0.5,
      speedX: -0.3 + Math.random() * 0.6,
      opacity: 0.2 + Math.random() * 0.5,
      phase: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.01 + Math.random() * 0.02,
    }));

    const animate = () => {
      if (!animatingRef.current) return;
      ctx.clearRect(0, 0, w, h);
      particlesRef.current.forEach(p => {
        p.phase += p.wobbleSpeed;
        p.x += p.speedX + Math.sin(p.phase) * 0.3;
        p.y += p.speedY;
        if (p.y > h + 10) { p.y = -10; p.x = Math.random() * w; }
        if (p.x > w + 10) p.x = -10;
        if (p.x < -10) p.x = w + 10;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.globalAlpha = p.opacity * (0.6 + Math.sin(p.phase * 2) * 0.4);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      rafRef.current = requestAnimationFrame(animate);
    };

    const onVis = () => {
      if (document.hidden) {
        animatingRef.current = false;
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      } else {
        animatingRef.current = true;
        animate();
      }
    };
    document.addEventListener('visibilitychange', onVis);
    animatingRef.current = true;
    animate();

    return () => {
      animatingRef.current = false;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, [count, color]);

  return <canvas ref={canvasRef} className="spore-canvas" />;
}

function CatalogPage({ onOpenDetail }) {
  const [activeTab, setActiveTab] = useState('科属');
  const [activeChips, setActiveChips] = useState(['鹅膏科']);
  const [ptrDistance, setPtrDistance] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const pageRef = useRef(null);
  const touchStartY = useRef(0);
  const touchMoved = useRef(false);

  const tabs = ['科属', '可食性', '生境', '海拔', '季节'];

  const chips = {
    '科属': ['鹅膏科', '牛肝菌科', '鸡油菌科', '口蘑科', '羊肚菌科'],
    '可食性': ['可食用', '药用', '有毒', '慎食'],
    '生境': ['阔叶林', '针叶林', '针阔混交', '草地', '火烧迹地'],
    '海拔': ['低海拔', '中海拔', '高海拔'],
    '季节': ['春季', '夏季', '秋季', '冬季'],
  };

  const toggleChip = (chip) => {
    setActiveChips(prev =>
      prev.includes(chip) ? prev.filter(c => c !== chip) : [...prev, chip]
    );
  };

  const onTouchStart = (e) => {
    const page = pageRef.current;
    if (page && page.scrollTop <= 0) {
      touchStartY.current = e.touches[0].clientY;
      touchMoved.current = false;
    } else {
      touchStartY.current = 0;
    }
  };

  const onTouchMove = (e) => {
    if (touchStartY.current === 0) return;
    const dy = e.touches[0].clientY - touchStartY.current;
    if (dy > 0) {
      touchMoved.current = true;
      const d = Math.min(dy * 0.5, 80);
      setPtrDistance(d);
    }
  };

  const onTouchEnd = () => {
    if (ptrDistance > 50 && !refreshing) {
      setRefreshing(true);
      setPtrDistance(60);
      setTimeout(() => {
        setRefreshing(false);
        setPtrDistance(0);
      }, 1500);
    } else {
      setPtrDistance(0);
    }
    touchStartY.current = 0;
    touchMoved.current = false;
  };

  const filtered = MUSHROOMS;

  return (
    <div
      className="page catalog-page"
      ref={pageRef}
      onTouchStart={onTouchStart}
      onTouchMove={onTouchMove}
      onTouchEnd={onTouchEnd}
    >
      <div
        className="ptr-indicator show"
        style={{
          opacity: ptrDistance > 10 ? 1 : 0,
          transform: `translateY(${ptrDistance - 10}px)`,
        }}
      >
        <svg className="ptr-icon" viewBox="0 0 24 24" style={{animation: ptrDistance > 50 || refreshing ? 'none' : undefined, stroke: '#5C7A4E', fill: 'none', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round'}}>
          {I.leaf}
        </svg>
        {refreshing ? '孢子更新中...' : ptrDistance > 50 ? '松开更新菌物' : '下拉刷新'}
      </div>

      <div className="catalog-header">
        <h1 className="catalog-title">图鉴分类</h1>
        <p className="catalog-subtitle">收录菌物 327 种 · 持续更新中</p>
        <div className="catalog-search">
          <svg width="18" height="18" viewBox="0 0 24 24" style={{stroke: '#8A7662', fill: 'none', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round'}}>
            {I.search}
          </svg>
          <input type="text" placeholder="搜索菌物..." />
        </div>
      </div>

      {/* Sticky filter */}
      <div className="filter-sticky">
        <div className="filter-tabs">
          {tabs.map(tab => (
            <div
              key={tab}
              className={`filter-tab ${activeTab === tab ? 'active' : ''}`}
              onClick={() => { setActiveTab(tab); setActiveChips([]); }}
            >
              {tab}
            </div>
          ))}
        </div>
        <div className="filter-row">
          {chips[activeTab]?.map(chip => (
            <div
              key={chip}
              className={`filter-chip ${activeChips.includes(chip) ? 'active' : ''}`}
              onClick={() => toggleChip(chip)}
            >
              {chip}
              {activeChips.includes(chip) && (
                <svg width="10" height="10" viewBox="0 0 24 24" style={{stroke: 'currentColor', fill: 'none', strokeWidth: 2.5, strokeLinecap: 'round', strokeLinejoin: 'round'}}>
                  {I.check}
                </svg>
              )}
            </div>
          ))}
        </div>
      </div>

      <div className="catalog-list">
        {filtered.map((m, i) => (
          <div
            key={m.id}
            className="catalog-item"
            onClick={() => onOpenDetail(m)}
          >
            <img src={m.img} alt={m.name} className="catalog-item-img" />
            <div className="catalog-item-info">
              <div className="catalog-item-name">{m.name}</div>
              <div className="catalog-item-latin">{m.latin}</div>
              <div className="catalog-item-meta">
                <span className="meta-pill">{m.family}</span>
                <span className="meta-pill habitat">{m.habitat}</span>
              </div>
            </div>
            <svg width="16" height="16" viewBox="0 0 24 24" style={{alignSelf: 'center', stroke: '#8A7662', fill: 'none', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round', flexShrink: 0, opacity: 0.5}}>
              {I.chevronRight}
            </svg>
          </div>
        ))}
      </div>
    </div>
  );
}

    "stats": {
      "observations": 156,
      "species": 72,
      "favorites": 32
    }
  }
}`,
      },
      {
        id: 9, method: 'POST', path: '/api/user/favorites/:mushroomId', desc: '收藏/取消收藏菌物',
        params: [
          { name: 'mushroomId', type: 'number', desc: '菌物 ID' },
          { name: 'action', type: 'string', desc: 'add 或 remove' },
        ],
        response: `{ "code": 0, "data": { "favorited": true } }`,
      },
    ],
  };

  const tabs = ['菌物', '观察', '用户'];

  return (
    <div className="page api-page">
      <div className="api-header">
        <div className="detail-back-btn" style={{ position: 'absolute', top: 60, left: 16, background: 'rgba(250,245,233,0.15)', border: '1px solid rgba(250,245,233,0.2)' }} onClick={onBack}>
          <svg viewBox="0 0 24 24">{I.back}</svg>
        </div>
        <div className="api-header-label italic">API Documentation</div>
        <h1 className="api-header-title">接口文档</h1>
        <p className="api-header-desc">菇事集小程序后端接口 v2.0<br />Base URL: api.fungitales.com</p>
      </div>

      <div className="api-tabs">
        {tabs.map(t => (
          <div
            key={t}
            className={`api-tab ${activeTab === t ? 'active' : ''}`}
            onClick={() => { setActiveTab(t); setOpenId(null); }}
          >
            {t}
          </div>
        ))}
      </div>

      <div className="api-body">
        {endpoints[activeTab].map(ep => (
          <div key={ep.id} className="api-endpoint">
            <div className="api-endpoint-head" onClick={() => setOpenId(openId === ep.id ? null : ep.id)}>
              <span className={`method-badge ${ep.method.toLowerCase()}`}>{ep.method}</span>
              <span className="api-path">{ep.path}</span>
              <svg
                className={`api-chevron ${openId === ep.id ? 'open' : ''}`}
                width="16" height="16" viewBox="0 0 24 24"
                style={{stroke: 'rgba(250,245,233,0.4)', fill: 'none', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round', flexShrink: 0}}
              >
                {I.chevronDown}
              </svg>
            </div>
            <div className={`api-endpoint-body ${openId === ep.id ? 'open' : ''}`}>
              <div className="api-desc">{ep.desc}</div>
              {ep.params.length > 0 && (
                <g>
                  <div style={{ fontSize: 11, color: 'rgba(250,245,233,0.4)', marginBottom: 4, letterSpacing: 1 }}>PARAMETERS</div>
                  {ep.params.map(p => (
                    <div key={p.name} className="api-param-row">
                      <span className="api-param-name">{p.name}</span>
                      <span className="api-param-type">{p.type}</span>
                      <span className="api-param-desc">{p.desc}</span>
                    </div>
                  ))}
                </g>
              )}
              <div style={{ fontSize: 11, color: 'rgba(250,245,233,0.4)', margin: '10px 0 4px', letterSpacing: 1 }}>RESPONSE</div>
              <div className="api-code-block">
                <pre style={{ whiteSpace: 'pre-wrap', margin: 0 }}>{ep.response}</pre>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ============================================================
// TAB BAR
// ============================================================
function TabBar({ active, onChange }) {
  const items = [
    { key: 'home', label: '首页', icon: I.home },
    { key: 'catalog', label: '图鉴', icon: I.book },
    { key: 'seasonal', label: '时令', icon: I.leaf },
    { key: 'observation', label: '观察', icon: I.map },
    { key: 'profile', label: '我的', icon: I.user },
  ];

  return (
    <div className="tabbar">
      {items.map(item => (
        <div
          key={item.key}
          className={`tabbar-item ${active === item.key ? 'active' : ''}`}
          onClick={() => onChange(item.key)}
        >
          <div className="tabbar-icon">
            <svg viewBox="0 0 24 24">{item.icon}</svg>
            <div className="tabbar-dot" />
          </div>
          <span className="tabbar-label">{item.label}</span>
        </div>
      ))}
    </div>
  );
}

// ============================================================
// TOAST
// ============================================================
function Toast({ show, message }) {
  return (
    <div className={`toast ${show ? 'show' : ''}`}>
      <svg width="18" height="18" viewBox="0 0 24 24" style={{stroke: 'currentColor', fill: 'none', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round'}}>
        {I.check}
      </svg>
      {message}
    </div>
  );
}

// ============================================================
// MAIN APP
// ============================================================
function App() {
  const [activeTab, setActiveTab] = useState('home');
  const [detailMushroom, setDetailMushroom] = useState(null);
  const [showSpec, setShowSpec] = useState(false);
  const [showApi, setShowApi] = useState(false);
  const [observations, setObservations] = useState(OBSERVATIONS);
  const [toast, setToast] = useState({ show: false, message: '' });
  const [navDirection, setNavDirection] = useState('push');
  const [previousTab, setPreviousTab] = useState('home');

  const showToast = (msg) => {
    setToast({ show: true, message: msg });
    setTimeout(() => setToast({ show: false, message: '' }), 2000);
  };

  const openDetail = (m) => {
    setNavDirection('push');
    setDetailMushroom(m);
  };

  const closeDetail = () => {
    setNavDirection('pop');
    setTimeout(() => setDetailMushroom(null), 300);
  };

  const openSpec = () => {
    setNavDirection('push');
    setShowSpec(true);
  };

  const closeSpec = () => {
    setNavDirection('pop');
    setTimeout(() => setShowSpec(false), 300);
  };

  const openApi = () => {
    setNavDirection('push');
    setShowApi(true);
  };

  const closeApi = () => {
    setNavDirection('pop');
    setTimeout(() => setShowApi(false), 300);
  };

  const handleTabChange = (key) => {
    if (key === activeTab) return;
    setPreviousTab(activeTab);
    setActiveTab(key);
    showToast(`切换到${key === 'home' ? '首页' : key === 'catalog' ? '图鉴' : key === 'seasonal' ? '时令' : key === 'observation' ? '观察' : '我的'}`);
  };

  const isDarkStatus = () => {
    if (showApi) return true;
    if (showSpec) return true;
    if (activeTab === 'observation') return true;
    if (activeTab === 'profile') return true;
    if (activeTab === 'seasonal') return true;
    if (activeTab === 'home') return true;
    return false;
  };

  const hasTabBar = !detailMushroom && !showSpec && !showApi;

  return (
    <div style={{ position: 'relative', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <div className="phone-stage">
        <div className="phone-screen">
          <div className="dynamic-island" />
          <StatusBar dark={isDarkStatus()} />
          <MPCapsule dark={isDarkStatus()} onMore={() => showToast('微信小程序菜单')} />

          <div className="page-wrap">
            {/* Tab pages */}
            <div
              className={`page ${activeTab !== 'home' && !detailMushroom && !showSpec && !showApi ? 'hidden' : ''}`}
              style={{ display: activeTab === 'home' || detailMushroom || showSpec || showApi ? 'block' : 'none' }}
            >
              <HomePage onOpenDetail={openDetail} onOpenTab={handleTabChange} />
            </div>

            <div style={{ display: activeTab === 'catalog' ? 'block' : 'none' }}>
              <CatalogPage onOpenDetail={openDetail} />
            </div>

            <div style={{ display: activeTab === 'seasonal' ? 'block' : 'none' }}>
              <SeasonalPage onOpenDetail={openDetail} />
            </div>

            <div style={{ display: activeTab === 'observation' ? 'block' : 'none' }}>
              <ObservationPage
                observations={observations}
                setObservations={setObservations}
                onOpenDetail={openDetail}
              />
            </div>

            <div style={{ display: activeTab === 'profile' ? 'block' : 'none' }}>
              <ProfilePage onOpenSpec={openSpec} onOpenApi={openApi} />
            </div>

            {/* Detail overlay page */}
            {detailMushroom && (
              <div className={`page enter-${navDirection}`} style={{ zIndex: 45 }}>
                <DetailPage mushroom={detailMushroom} onBack={closeDetail} />
              </div>
            )}

            {/* Spec overlay page */}
            {showSpec && (
              <div className={`page enter-${navDirection}`} style={{ zIndex: 45 }}>
                <SpecPage onBack={closeSpec} />
              </div>
            )}

            {/* API overlay page */}
            {showApi && (
              <div className={`page enter-${navDirection}`} style={{ zIndex: 45 }}>
                <ApiPage onBack={closeApi} />
              </div>
            )}
          </div>

          {/* TabBar */}
          {hasTabBar && <TabBar active={activeTab} onChange={handleTabChange} />}

          <Toast show={toast.show} message={toast.message} />

          {/* Home indicator */}
          <div style={{
            position: 'absolute',
            bottom: 8,
            left: '50%',
            transform: 'translateX(-50%)',
            width: 134,
            height: 5,
            borderRadius: 3,
            background: isDarkStatus() ? 'rgba(255,255,255,0.6)' : 'rgba(59,46,36,0.4)',
            zIndex: 200,
            pointerEvents: 'none',
          }} />
        </div>

        <div className="frame-label">
          <span className="serif">菇事集</span> Fungi Tales · 微信小程序 V2
        </div>
      </div>
    </div>
  );
}

// Announce upgrade capability
function announceUpgrade() {
  window.parent?.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

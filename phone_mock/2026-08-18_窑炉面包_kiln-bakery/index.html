<style>
/* ========== 全局样式 ========== */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  background: #1A120B;
  font-family: 'Noto Sans SC', -apple-system, system-ui, sans-serif;
  overflow: hidden;
  user-select: none;
}
:root {

  --cream-dark: #E8DEC8;

/* Stage */
.stage {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(200,113,43,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(166,61,47,0.08) 0%, transparent 50%),
    linear-gradient(135deg, #1A120B 0%, #241A12 50%, #1A120B 100%);
  position: relative;
}
.stage::before {
  content: '';
  position: absolute; inset: 0;
  background-image: radial-gradient(circle at 1px 1px, rgba(251,243,228,0.03) 1px, transparent 0);
  background-size: 24px 24px;
  pointer-events: none;
}

/* Ambient floating particles */
.ambient-particle {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  opacity: 0.4;
}

/* ========== 自定义光标 ========== */
.cursor-ring {
  position: fixed;
  width: 36px; height: 36px;
  border: 2px solid #FBF3E4;
  border-radius: 50%;
  pointer-events: none;
  z-index: 99999;
  transform: translate(-50%, -50%);
  transition: width 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
              height 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
              border-color 0.2s,
              background 0.2s;

    0 0 20px rgba(200,113,43,0.5),
    0 0 40px rgba(200,113,43,0.3),
    inset 0 0 10px rgba(251,243,228,0.3);
  mix-blend-mode: difference;
}
.cursor-dot {
  position: fixed;
  width: 6px; height: 6px;
  background: #C8712B;
  border-radius: 50%;
  pointer-events: none;
  z-index: 99999;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 8px rgba(200,113,43,0.8), 0 0 16px rgba(200,113,43,0.4);
  transition: transform 0.05s linear;
}
.cursor-ring.hover {
  width: 56px; height: 56px;
  border-color: #D9A84E;
  background: rgba(217,168,78,0.1);
}

/* ========== 涟漪 ========== */
.ripple-container {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: inherit;
  pointer-events: none;
}
.ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,0.4);
  transform: scale(0);
  animation: ripple-anim 0.6s ease-out forwards;
  pointer-events: none;
}
@keyframes ripple-anim {
  to { transform: scale(4); opacity: 0; }
}

/* ========== 滚动条 ========== */
::-webkit-scrollbar { width: 0; height: 0; background: transparent; }

/* ========== 动画关键帧 ========== */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(200%); }
}
@keyframes pulse-ring {
  0% { transform: scale(0.8); opacity: 0.8; }
  100% { transform: scale(1.6); opacity: 0; }
}
@keyframes spin-slow {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
@keyframes steam {
  0% { transform: translateY(0) scaleX(1); opacity: 0.6; }
  50% { opacity: 0.3; }
  100% { transform: translateY(-30px) scaleX(1.5); opacity: 0; }
}
@keyframes countUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes typing {
  from { width: 0; }
  to { width: 100%; }
}
@keyframes glow {
  0%, 100% { box-shadow: 0 0 20px rgba(200,113,43,0.4); }
  50% { box-shadow: 0 0 40px rgba(200,113,43,0.8), 0 0 60px rgba(217,168,78,0.3); }
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
@keyframes scaleIn {
  from { transform: scale(0.9); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
@keyframes tilt-3d {
  0%, 100% { transform: perspective(1000px) rotateY(0deg) rotateX(0deg); }
  25% { transform: perspective(1000px) rotateY(2deg) rotateX(-1deg); }
  75% { transform: perspective(1000px) rotateY(-2deg) rotateX(1deg); }
}
@keyframes bounce-in {
  0% { transform: scale(0.3); opacity: 0; }
  50% { transform: scale(1.05); }
  70% { transform: scale(0.95); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes progress-fill {

}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .cursor-ring, .cursor-dot { display: none; }
}

/* Screen title labels */

}

// ──────────────────────────────────────────────
// 自定义光标
// ──────────────────────────────────────────────
function setupCustomCursor() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  
  const ring = document.createElement('div');
  const dot = document.createElement('div');
  ring.className = 'cursor-ring';
  dot.className = 'cursor-dot';
  document.body.appendChild(ring);
  document.body.appendChild(dot);

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let ringX = mouseX;
  let ringY = mouseY;
  let animId = null;
  let visible = true;

  function animate() {
    if (!visible) return;
    ringX += (mouseX - ringX) * 0.15;
    ringY += (mouseY - ringY) * 0.15;
    ring.style.left = ringX + 'px';
    ring.style.top = ringY + 'px';
    dot.style.left = mouseX + 'px';
    dot.style.top = mouseY + 'px';
    animId = requestAnimationFrame(animate);
  }

  function onMove(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
    if (!animId) animate();
  }

  function onOver(e) {
    const target = e.target.closest('button, [role="button"], a, input, .interactive');
    if (target) {
      ring.classList.add('hover');
    } else {
      ring.classList.remove('hover');
    }
  }

  function onClick(e) {
    const ripple = document.createElement('div');
    ripple.style.cssText = `
      position: fixed;
      width: 10px; height: 10px;
      border: 2px solid #C8712B;
      border-radius: 50%;
      left: ${e.clientX}px;
      top: ${e.clientY}px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 99998;
      animation: pulse-ring 0.6s ease-out forwards;
    `;
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  }

  function onVisibility() {
    if (document.hidden) {
      visible = false;
      if (animId) { cancelAnimationFrame(animId); animId = null; }
    } else {
      visible = true;
      animate();
    }
  }

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseover', onOver);
  document.addEventListener('click', onClick);
  document.addEventListener('visibilitychange', onVisibility);

  // 初始位置：屏幕中央
  mouseX = window.innerWidth / 2;
  mouseY = window.innerHeight / 2;
  ring.style.left = mouseX + 'px';
  ring.style.top = mouseY + 'px';
  dot.style.left = mouseX + 'px';
  dot.style.top = mouseY + 'px';
  animate();

  return () => {
    visible = false;
    if (animId) cancelAnimationFrame(animId);
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseover', onOver);
    document.removeEventListener('click', onClick);
    document.removeEventListener('visibilitychange', onVisibility);
    ring.remove();
    dot.remove();
  };
}

// ──────────────────────────────────────────────
// 环境粒子（窑炉火星）
// ──────────────────────────────────────────────
function AmbientParticles() {
  const containerRef = useRef(null);
  const particlesRef = useRef([]);
  const animRef = useRef(null);

  useEffect(() => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const container = containerRef.current;
    if (!container) return;

    const rect = container.getBoundingClientRect();
    const particles = [];
    for (let i = 0; i < 20; i++) {
      const el = document.createElement('div');
      el.className = 'ambient-particle';
      const size = 2 + Math.random() * 4;
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.background = Math.random() > 0.5 ? '#C8712B' : '#D9A84E';
      el.style.boxShadow = `0 0 ${size * 3}px ${size > 3 ? '#C8712B' : '#D9A84E'}`;
      const p = {
        el,
        x: Math.random() * rect.width,
        y: Math.random() * rect.height,
        vx: (Math.random() - 0.5) * 0.3,
        vy: -0.2 - Math.random() * 0.5,
        life: Math.random(),
        maxLife: 1,
        size,
      };
      particles.push(p);
      container.appendChild(el);
    }
    particlesRef.current = particles;

    let running = true;
    function tick() {
      if (!running) return;
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.003;
        if (p.life <= 0 || p.y < -10) {
          p.x = Math.random() * rect.width;
          p.y = rect.height + 10;
          p.life = 1;
          p.vx = (Math.random() - 0.5) * 0.3;
          p.vy = -0.2 - Math.random() * 0.5;
        }
        p.el.style.left = p.x + 'px';
        p.el.style.top = p.y + 'px';
        p.el.style.opacity = p.life * 0.5;
      }
      animRef.current = requestAnimationFrame(tick);
    }
    tick();

    function onVis() {
      if (document.hidden) {
        running = false;
        if (animRef.current) cancelAnimationFrame(animRef.current);
      } else {
        running = true;
        tick();
      }
    }
    document.addEventListener('visibilitychange', onVis);

    return () => {
      running = false;
      if (animRef.current) cancelAnimationFrame(animRef.current);
      document.removeEventListener('visibilitychange', onVis);
      particles.forEach(p => p.el.remove());
    };
  }, []);

  return <div ref={containerRef} style={{ position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'hidden' }} />;
}

// ──────────────────────────────────────────────
// 数字计数动画
// ──────────────────────────────────────────────
function CountNumber({ value, duration = 1200, suffix = '', prefix = '' }) {
  const [display, setDisplay] = useState(0);
  const ref = useRef(null);
  const rafRef = useRef(null);

  useEffect(() => {
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const start = 0;
          const startTime = performance.now();
          const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
          function tick(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            setDisplay(Math.floor(easeOutCubic(progress) * value));
            if (progress < 1) rafRef.current = requestAnimationFrame(tick);
          }
          rafRef.current = requestAnimationFrame(tick);
          observer.disconnect();
        }
      });
    }, { threshold: 0.3 });
    if (ref.current) observer.observe(ref.current);
    return () => {
      observer.disconnect();
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [value, duration]);

  return <span ref={ref}>{prefix}{display.toLocaleString()}{suffix}</span>;
}

// ──────────────────────────────────────────────
// 打字机效果
// ──────────────────────────────────────────────
function Typewriter({ text, speed = 80, delay = 0 }) {
  const [shown, setShown] = useState('');
  const timeoutRef = useRef(null);

  useEffect(() => {
    let i = 0;
    const start = setTimeout(() => {
      function type() {
        if (i < text.length) {
          setShown(text.slice(0, i + 1));
          i++;
          timeoutRef.current = setTimeout(type, speed + Math.random() * 40);
        }
      }
      type();
    }, delay);
    timeoutRef.current = start;
    return () => clearTimeout(timeoutRef.current);
  }, [text, speed, delay]);

  return <span>{shown}<span style={{ opacity: shown.length < text.length ? 1 : 0, animation: 'blink 1s infinite' }}>|</span></span>;
}

// ──────────────────────────────────────────────
// 涟漪按钮
// ──────────────────────────────────────────────
function RippleButton({ children, onClick, style = {}, className = '' }) {
  const containerRef = useRef(null);
  const [ripples, setRipples] = useState([]);

  const handleClick = (e) => {
    const rect = containerRef.current.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const size = Math.max(rect.width, rect.height);
    const id = Date.now();
    setRipples(prev => [...prev, { id, x, y, size }]);
    setTimeout(() => setRipples(prev => prev.filter(r => r.id !== id)), 600);
    onClick && onClick(e);
  };

  return (
    <div
      ref={containerRef}
      className={`interactive ${className}`}
      onClick={handleClick}
      style={{ position: 'relative', overflow: 'hidden', cursor: 'pointer', ...style }}
    >
      {children}
      <div className="ripple-container">
        {ripples.map(r => (
          <div key={r.id} className="ripple" style={{
            left: r.x - r.size / 2,
            top: r.y - r.size / 2,
            width: r.size,
            height: r.size,
          }} />
        ))}
      </div>
    </div>
  );
}

function HomePage({ onNavigate }) {
  const scrollRef = useRef(null);
  const [scrollY, setScrollY] = useState(0);
  const [showRefresh, setShowRefresh] = useState(false);
  const [refreshing, setRefreshing] = useState(false);
  const startY = useRef(0);
  const pulling = useRef(false);

  const onScroll = useCallback((e) => {
    setScrollY(e.target.scrollTop);
  }, []);

  const onTouchStart = (e) => {
    if (scrollRef.current.scrollTop <= 0) {
      pulling.current = true;
      startY.current = e.touches[0].clientY;
    }
  };

  const onTouchMove = (e) => {
    if (!pulling.current) return;
    const diff = e.touches[0].clientY - startY.current;
    if (diff > 60) setShowRefresh(true);
  };

  const onTouchEnd = () => {
    if (showRefresh && pulling.current) {
      setRefreshing(true);
      setTimeout(() => {
        setRefreshing(false);
        setShowRefresh(false);
      }, 1500);
    } else {
      setShowRefresh(false);
    }
    pulling.current = false;
  };

  const heroScale = Math.max(1, 1 + scrollY * -0.002);
  const heroOpacity = Math.max(0.3, 1 - scrollY * 0.003);
  const titleY = scrollY * 0.4;

  return (
    <div
      ref={scrollRef}
      onScroll={onScroll}
      onTouchStart={onTouchStart}
      onTouchMove={onTouchMove}
      onTouchEnd={onTouchEnd}
      style={{
        height: '100%', overflowY: 'auto',
        background: '#FBF3E4',
        position: 'relative',
      }}
    >
      {/* 下拉刷新指示器 */}

          width: 24, height: 24,

      {/* Hero 大图 */}

        {/* 窑炉背景 */}

function CartPage({ onBack }) {
  const [items, setItems] = useState([
    { ...BREADS[0], qty: 2 },
    { ...BREADS[2], qty: 1 },
    { ...BREADS[5], qty: 3 },
  ]);

  const updateQty = (id, delta) => {
    setItems(prev => prev.map(item =>
      item.id === id ? { ...item, qty: Math.max(0, item.qty + delta) } : item
    ).filter(item => item.qty > 0));
  };

  const total = items.reduce((sum, item) => sum + item.price * item.qty, 0);

  return (
    <div style={{

              display: 'flex', alignItems: 'center', gap: 12,
            }}>
              <span style={{
                fontSize: 11, fontWeight: 700,
                padding: '3px 10px',
                borderRadius: 6,
                background: `${methodColor(ep.method)}22`,
                color: methodColor(ep.method),
                letterSpacing: 0.5,
              }}>{ep.method}</span>
              <code style={{
                fontSize: 13, color: '#FBF3E4',
                fontFamily: 'monospace',
                flex: 1,
              }}>{ep.path}</code>
            </div>

            <div style={{ padding: '14px 18px' }}>
              <div style={{ fontSize: 15, fontWeight: 600, color: '#FBF3E4', marginBottom: 4 }}>{ep.name}</div>
              <div style={{ fontSize: 12, color: 'rgba(251,243,228,0.5)', marginBottom: 14 }}>{ep.desc}</div>

              {/* 参数 */}
              {ep.params.length > 0 && (
                <div style={{ marginBottom: 14 }}>
                  <div style={{ fontSize: 11, color: '#D9A84E', marginBottom: 8, fontWeight: 500 }}>参数</div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                    {ep.params.map(p => (
                      <div key={p.name} style={{
                        display: 'flex', gap: 10,
                        fontSize: 12,
                      }}>
                        <code style={{ color: '#E8956B', minWidth: 80, fontFamily: 'monospace' }}>{p.name}</code>
                        <span style={{ color: 'rgba(251,243,228,0.4)', minWidth: 60 }}>{p.type}</span>
                        <span style={{ color: 'rgba(251,243,228,0.6)', flex: 1 }}>{p.desc}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* 响应 */}
              <div>
                <div style={{ fontSize: 11, color: '#D9A84E', marginBottom: 8, fontWeight: 500 }}>响应示例</div>
                <div style={{
                  background: '#1A120B',
                  borderRadius: 10,
                  padding: 12,
                  position: 'relative',
                  overflow: 'hidden',
                }}>
                  <pre style={{
                    fontSize: 11, color: '#D9A84E',
                    fontFamily: 'monospace',
                    lineHeight: 1.6,
                    margin: 0,
                    whiteSpace: 'pre-wrap',
                    wordBreak: 'break-all',
                  }}>{ep.response}</pre>
                </div>
              </div>
            </div>
          </div>
        ))}

        {/* Base URL */}
        <div style={{
          background: 'rgba(217,168,78,0.1)',
          borderRadius: 12,
          padding: 14,
          marginTop: 8,
          display: 'flex', alignItems: 'center', gap: 10,
        }}>
          <span style={{ fontSize: 16 }}>🔗</span>
          <div>
            <div style={{ fontSize: 11, color: 'rgba(251,243,228,0.5)', marginBottom: 2 }}>Base URL</div>
            <code style={{ fontSize: 12, color: '#D9A84E', fontFamily: 'monospace' }}>https://api.yaolubread.com/v1</code>
          </div>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// 主 App
// ============================================================
function App() {
  const [tab, setTab] = useState('home');
  const [overlay, setOverlay] = useState(null); // { type, params }
  const [transition, setTransition] = useState(false);

  const navigate = useCallback((page, params = {}) => {
    // 主 Tab 切换
    if (['home', 'order', 'journal', 'member'].includes(page)) {
      setTransition(true);
      setTimeout(() => {
        setTab(page);
        setTransition(false);
      }, 200);
      return;
    }
    // 覆盖层页面（详情、购物车、规范、文档）
    setOverlay({ type: page, params });
  }, []);

  const closeOverlay = useCallback(() => {
    setOverlay(null);
  }, []);

  const handleTabChange = useCallback((t) => {
    navigate(t);
  }, [navigate]);

  const isDarkTab = tab === 'member' || (overlay?.type === 'spec') || (overlay?.type === 'api');

  return (
    <div style={{ position: 'relative' }}>
      <div className="screen-label">窑炉面包 · 原生 App</div>

      <IOSDevice dark={false}>
        {/* 主内容区 */}
        <div style={{
          height: '100%',
          position: 'relative',
          opacity: transition ? 0.4 : 1,
          transform: transition ? 'scale(0.98)' : 'scale(1)',
          transition: 'all 0.25s ease-out',
        }}>
          {tab === 'home' && <HomePage onNavigate={navigate} />}
          {tab === 'order' && <OrderPage onNavigate={navigate} />}
          {tab === 'journal' && <JournalPage onNavigate={navigate} />}
          {tab === 'member' && <MemberPage onNavigate={navigate} />}
        </div>

        {/* TabBar */}
        {!overlay && <TabBar active={tab} onTabChange={handleTabChange} dark={tab === 'member'} />}

        {/* 覆盖层（模态/详情/购物车/规范/文档） */}
        {overlay && (
          <div style={{
            position: 'absolute', inset: 0,
            zIndex: 40,
            animation: 'scaleIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1)',
          }}>
            {overlay.type === 'detail' && (
              <DetailPage breadId={overlay.params.breadId} onBack={closeOverlay} />
            )}
            {overlay.type === 'cart' && (
              <CartPage onBack={closeOverlay} />
            )}
            {overlay.type === 'spec' && (
              <SpecPage onBack={closeOverlay} />
            )}
            {overlay.type === 'api' && (
              <ApiPage onBack={closeOverlay} />
            )}
          </div>
        )}
      </IOSDevice>
    </div>
  );
}

// ============================================================
// 渲染
// ============================================================
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  <>
    <AmbientParticles />
    <div style={{ position: 'relative', zIndex: 1 }}>
      <App />
    </div>
  </>
);

// 自定义光标
setupCustomCursor();

// 宣告升级
function announceUpgrade() {
  window.parent?.postMessage?.({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}
</script>
</body>
</html>

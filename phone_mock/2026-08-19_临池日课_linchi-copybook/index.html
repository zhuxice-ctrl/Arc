<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>临池日课 · 原生 App</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600;700&display=swap" />
  <style>
    /* 全局重置 */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "SF Pro Text", "PingFang SC", -apple-system, sans-serif;
      background: #2a241e;
      color: #ece5d8;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 桌面舞台 */
    .stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at center, #3a322a 0%, #1a1714 70%);
      padding: 20px;
    }

    /* 手机外壳 */
    .phone-shell {
      width: 430px;
      height: 904px;
      background: #1a1714;
      border-radius: 52px;
      padding: 14px;
      box-shadow:
        0 30px 60px rgba(0,0,0,0.6),
        0 0 0 1px rgba(255,255,255,0.04),
        inset 0 0 0 2px #2a241e;
      position: relative;
      flex-shrink: 0;
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      border-radius: 40px;
      overflow: hidden;
      background: #1a1714;
      position: relative;
    }

    /* 灵动岛 */
    .dynamic-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 34px;
      background: #000;
      border-radius: 20px;
      z-index: 1000;
    }

    /* App 根 */
    #root {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    /* 页面容器 */
    .page {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1a1714;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .page-enter-right {
      animation: pageEnterRight 0.35s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    }
    .page-exit-left {
      animation: pageExitLeft 0.35s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    }
    .page-enter-left {
      animation: pageEnterLeft 0.35s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    }
    .page-exit-right {
      animation: pageExitRight 0.35s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    }

    @keyframes pageEnterRight {
      from { transform: translateX(100%); opacity: 0.7; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes pageExitLeft {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(-30%); opacity: 0.4; }
    }
    @keyframes pageEnterLeft {
      from { transform: translateX(-30%); opacity: 0.4; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes pageExitRight {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(100%); opacity: 0.7; }
    }

    /* 模态页（底部弹出） */
    .modal-page {
      top: auto;
      bottom: 0;
      height: 92%;
      border-radius: 28px 28px 0 0;
    }
    .modal-enter {
      animation: modalEnter 0.4s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    }
    .modal-exit {
      animation: modalExit 0.35s cubic-bezier(0.55, 0.06, 0.68, 0.19) forwards;
    }
    @keyframes modalEnter {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes modalExit {
      from { transform: translateY(0); }
      to { transform: translateY(100%); }
    }

    /* 状态栏 */
    .status-bar {
      height: 54px;
      padding: 18px 28px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 600;
      color: #ece5d8;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }
    .status-bar .right {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .status-bar .battery {
      width: 24px;
      height: 11px;
      border: 1px solid #ece5d8;
      border-radius: 3px;
      position: relative;
      padding: 1px;
    }
    .status-bar .battery::after {
      content: '';
      position: absolute;
      right: -3px;
      top: 3px;
      width: 2px;
      height: 3px;
      background: #ece5d8;
      border-radius: 0 1px 1px 0;
    }
    .status-bar .battery > span {
      display: block;
      height: 100%;
      background: #ece5d8;
      border-radius: 1px;
      width: 80%;
    }

    /* 导航栏 */
    .nav-bar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }
    .nav-bar .title {
      font-family: "Ma Shan Zheng", "ZCOOL XiaoWei", serif;
      font-size: 18px;
      color: #ece5d8;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }
    .nav-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: #ece5d8;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .nav-btn:active {
      background: rgba(236,229,216,0.1);
    }

    /* 主内容区 */
    .content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .content::-webkit-scrollbar { display: none; }

    /* 底部 TabBar */
    .tab-bar {
      height: 83px;
      background: rgba(26,23,20,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 0.5px solid rgba(236,229,216,0.1);
      display: flex;
      padding: 8px 0 28px;
      flex-shrink: 0;
    }
    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: #7a7268;
      cursor: pointer;
      transition: color 0.2s;
      font-size: 11px;
      border: none;
      background: none;
      font-family: inherit;
    }
    .tab-item.active {
      color: #b06a3b;
    }
    .tab-item svg {
      width: 24px;
      height: 24px;
    }

    /* ===== 通用组件 ===== */

    .page-title {
      font-family: "Ma Shan Zheng", serif;
      font-size: 28px;
      color: #ece5d8;
      padding: 8px 20px 16px;
    }

    .card {
      background: #f2ead8;
      border-radius: 20px;
      margin: 0 16px 16px;
      padding: 20px;
      color: #1a1714;
      position: relative;
    }
    .card-dark {
      background: #2a241e;
      border: 1px solid rgba(236,229,216,0.08);
      color: #ece5d8;
    }
    .card-dark .card-title { color: #ece5d8; }

    .card-title {
      font-family: "Ma Shan Zheng", serif;
      font-size: 18px;
      margin-bottom: 10px;
    }

    /* 印章样式 */
    .seal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #b06a3b;
      color: #f2ead8;
      font-family: "Ma Shan Zheng", serif;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      letter-spacing: 1px;
    }

    /* 大字符展示 */
    .big-char {
      font-family: "Ma Shan Zheng", "ZCOOL XiaoWei", serif;
      font-size: 180px;
      line-height: 1;
      color: #1a1714;
      text-align: center;
    }
    .big-char-light {
      color: #ece5d8;
    }

    /* 按钮 */
    .btn {
      height: 48px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s;
      font-family: inherit;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-primary {
      background: #b06a3b;
      color: #f2ead8;
    }
    .btn-primary:active {
      background: #8c5128;
    }
    .btn-secondary {
      background: rgba(236,229,216,0.1);
      color: #ece5d8;
      border: 1px solid rgba(236,229,216,0.2);
    }
    .btn-secondary:active {
      background: rgba(236,229,216,0.15);
    }
    .btn-ghost {
      background: transparent;
      color: #ece5d8;
      border: 1px solid rgba(236,229,216,0.3);
    }
    .btn-full {
      width: 100%;
    }

    /* 滑杆 */
    .slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(236,229,216,0.2);
      border-radius: 2px;
      outline: none;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      background: #b06a3b;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(176,106,59,0.5);
    }
    .slider::-moz-range-thumb {
      width: 24px;
      height: 24px;
      background: #b06a3b;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: rgba(26,23,20,0.92);
      color: #ece5d8;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 14px;
      z-index: 5000;
      pointer-events: none;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
      border: 1px solid rgba(236,229,216,0.1);
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* 墨点晕染动画 */
    @keyframes inkSpread {
      0% { transform: scale(0); opacity: 0.8; }
      100% { transform: scale(1); opacity: 1; }
    }
    .ink-spread {
      animation: inkSpread 0.6s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    }

    /* 渐显（从下往上） */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up {
      animation: fadeUp 0.5s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }

    /* 横线装饰 */
    .divider {
      height: 1px;
      background: rgba(236,229,216,0.1);
      margin: 16px 0;
    }
    .divider-light {
      background: rgba(26,23,20,0.1);
    }

    /* 小标签 */
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      background: rgba(236,229,216,0.08);
      color: #c8c0b0;
    }

    /* 响应式：窄屏幕 */
    @media (max-width: 500px) {
      .stage { padding: 0; background: #1a1714; }
      .phone-shell {
        width: 100%;
        height: 100%;
        border-radius: 0;
        padding: 0;
        box-shadow: none;
      }
      .phone-screen { border-radius: 0; }
      .dynamic-island { display: none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone-shell">
      <div class="dynamic-island"></div>
      <div class="phone-screen">
        <div id="root"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- React + Babel -->
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- 数据层 -->
  <script src="js/data.js"></script>

  <!-- 状态管理 -->
  <script src="js/store.js"></script>

  <!-- 书写画布组件 -->
  <script type="text/babel" src="js/components/BrushCanvas.jsx"></script>

  <!-- 页面组件 -->
  <script type="text/babel" src="js/pages/TodayPage.jsx"></script>
  <script type="text/babel" src="js/pages/StelesPage.jsx"></script>
  <script type="text/babel" src="js/pages/CollectionPage.jsx"></script>
  <script type="text/babel" src="js/pages/MePage.jsx"></script>
  <script type="text/babel" src="js/pages/WritePage.jsx"></script>
  <script type="text/babel" src="js/pages/ComparePage.jsx"></script>
  <script type="text/babel" src="js/pages/DesignSpecPage.jsx"></script>
  <script type="text/babel" src="js/pages/ApiDocPage.jsx"></script>
  <script type="text/babel" src="js/pages/SteleDetailPage.jsx"></script>

  <!-- 主应用 -->
  <script type="text/babel" src="js/App.jsx"></script>

  <script>
    // 宣告可升级为全栈应用
    function announceUpgrade() {
      window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    }
    announceUpgrade();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announceUpgrade, { once: true });
    }
  </script>
</body>
</html>

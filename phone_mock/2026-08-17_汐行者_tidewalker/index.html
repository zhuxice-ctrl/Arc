<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="creative-medium" content="interactive-prototype">
<title>汐行者 Tidewalker · 赶海潮汐指南</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ================= RESET & BASE ================= */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1614; font-family: 'Outfit', -apple-system, sans-serif; color: #0E3B36; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body { display: flex; align-items: center; justify-content: center; }
button { border: none; background: none; font: inherit; color: inherit; cursor: inherit; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
img { display: block; max-width: 100%; }

/* ================= CUSTOM CURSOR ================= */
.custom-cursor {
  position: fixed;
  top: 0; left: 0;
  width: 22px; height: 22px;
  pointer-events: none;
  z-index: 99999;
  transform: translate(-50%, -50%);
  transition: width 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
              height 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
              background-color 0.2s ease,
              border-color 0.2s ease,
              opacity 0.2s ease;
  will-change: transform, width, height;
  mix-blend-mode: difference;
}
.custom-cursor::before {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 4px; height: 4px;
  background: #fff;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: opacity 0.2s ease;
}
.custom-cursor.hover {
  width: 48px; height: 48px;
}
.custom-cursor.click {
  width: 14px; height: 14px;
}
.cursor-ring {
  position: fixed;
  top: 0; left: 0;
  width: 44px; height: 44px;
  pointer-events: none;
  z-index: 99998;
  border: 1.5px solid rgba(217, 164, 65, 0.6);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: opacity 0.2s ease, transform 0.15s ease-out, width 0.3s ease, height 0.3s ease, border-color 0.3s ease;
  will-change: transform;
}
.cursor-ripple {
  position: fixed;
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 2px solid #D9A441;
  pointer-events: none;
  z-index: 99997;
  transform: translate(-50%, -50%) scale(1);
  animation: cursorRipple 0.6s ease-out forwards;
}
@keyframes cursorRipple {
  0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(3.5); opacity: 0; }
}
@media (hover: none) {
  .custom-cursor, .cursor-ring { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .custom-cursor, .cursor-ring, .cursor-ripple { display: none !important; }
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ================= PHONE FRAME ================= */
.phone-wrapper {
  position: relative;
  width: 390px;
  height: 844px;
  filter: drop-shadow(0 40px 80px rgba(0,0,0,0.5));
}
.phone-frame {
  position: relative;
  width: 100%;
  height: 100%;
  background: #1a1a1a;
  border-radius: 55px;
  padding: 12px;
  box-shadow:
    inset 0 0 0 2px #2a2a2a,
    inset 0 0 0 4px #0a0a0a;
}
.phone-screen {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 44px;
  overflow: hidden;
  background: #F6F0E4;
}

/* Dynamic Island */
.dynamic-island {
  position: absolute;
  top: 11px;
  left: 50%;
  transform: translateX(-50%);
  width: 126px;
  height: 37px;
  background: #000;
  border-radius: 20px;
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), height 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.dynamic-island.active {
  width: 360px;
  height: 52px;
  border-radius: 26px;
}
.di-content {
  opacity: 0;
  transition: opacity 0.3s ease 0.15s;
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  width: 100%;
}
.dynamic-island.active .di-content { opacity: 1; }
.di-icon {
  width: 24px; height: 24px;
  background: #D9A441;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
}
.di-text { flex: 1; font-size: 13px; }
.di-wave {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 2px solid #7FBFB0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  color: #7FBFB0;
}

/* Status Bar */
.status-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 54px;
  padding: 18px 32px 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  font-size: 15px;
  font-weight: 600;
  color: #0E3B36;
  z-index: 400;
  pointer-events: none;
  font-family: 'Outfit', sans-serif;
}
.status-bar.dark { color: #F6F0E4; }
.status-icons { display: flex; gap: 6px; align-items: center; }
.status-icon { font-size: 13px; }

/* ================= APP CONTAINER ================= */
.app-container {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

/* Page transitions */
.page {
  position: absolute;
  inset: 0;
  background: #F6F0E4;
  transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.3s ease;
  will-change: transform, opacity;
  overflow: hidden;
}
.page.entering-right { transform: translateX(100%); z-index: 30; }
.page.entering-right.active { transform: translateX(0); }
.page.leaving-left { transform: translateX(-30%); opacity: 0.3; z-index: 20; }
.page.entering-left { transform: translateX(-100%); z-index: 30; }
.page.entering-left.active { transform: translateX(0); }
.page.leaving-right { transform: translateX(30%); opacity: 0.3; z-index: 20; }
.page.modal-enter { transform: translateY(100%); z-index: 35; }
.page.modal-enter.active { transform: translateY(0); }
.page.modal-leave { transform: translateY(100%); z-index: 35; }
.page.under-modal { transform: scale(0.92); filter: brightness(0.7); z-index: 25; transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1), filter 0.4s ease; }

/* Content scroll area */
.page-content {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.page-content::-webkit-scrollbar { display: none; }

/* ================= NAVIGATION BAR ================= */
.nav-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(246, 240, 228, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 54px 16px 10px;
  transition: background 0.3s ease;
}
.nav-bar.dark {
  background: rgba(14, 59, 54, 0.85);
  color: #F6F0E4;
}
.nav-bar.transparent {
  background: transparent;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}
.nav-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 44px;
}
.nav-left, .nav-right {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 60px;
}
.nav-right { justify-content: flex-end; }
.nav-title {
  font-size: 17px;
  font-weight: 600;
  flex: 1;
  text-align: center;
  font-family: 'Outfit', sans-serif;
}
.nav-large-title {
  font-size: 34px;
  font-weight: 700;
  font-family: 'Cormorant Garamond', serif;
  margin-top: 4px;
  padding: 0 4px;
  line-height: 1.1;
  letter-spacing: -0.5px;
}
.nav-subtitle {
  font-size: 13px;
  opacity: 0.6;
  margin-top: 2px;
  padding: 0 4px;
  font-weight: 400;
  font-family: 'Outfit', sans-serif;
}
.nav-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  transition: background 0.2s ease, transform 0.15s ease;
}
.nav-btn:active { transform: scale(0.92); background: rgba(14, 59, 54, 0.1); }
.nav-btn.primary {
  background: #D9A441;
  color: #fff;
}
.nav-back {
  display: flex; align-items: center; gap: 4px;
  font-size: 17px;
  color: #0E3B36;
  padding: 6px 8px;
  border-radius: 8px;
  transition: background 0.2s ease;
}
.nav-bar.dark .nav-back { color: #F6F0E4; }
.nav-back:active { background: rgba(14, 59, 54, 0.1); }

/* ================= TAB BAR ================= */
.tab-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 83px;
  background: rgba(246, 240, 228, 0.92);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-top: 0.5px solid rgba(14, 59, 54, 0.1);
  display: flex;
  padding: 8px 12px 28px;
  z-index: 200;
}
.tab-bar.dark {
  background: rgba(14, 59, 54, 0.92);
  border-top-color: rgba(246, 240, 228, 0.1);
  color: rgba(246, 240, 228, 0.6);
}
.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 10px;
  font-weight: 500;
  color: rgba(14, 59, 54, 0.5);
  position: relative;
  transition: color 0.2s ease;
}
.tab-bar.dark .tab-item { color: rgba(246, 240, 228, 0.5); }
.tab-item.active { color: #D9A441; }
.tab-icon {
  font-size: 22px;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.tab-item.active .tab-icon { transform: translateY(-2px) scale(1.1); }
.tab-dot {
  position: absolute;
  top: 6px;
  width: 5px; height: 5px;
  background: #E86A4A;
  border-radius: 50%;
}

/* ================= FAB ================= */
.fab {
  position: absolute;
  right: 20px;
  bottom: 100px;
  width: 56px; height: 56px;
  background: linear-gradient(135deg, #D9A441 0%, #c98e2e 100%);
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  font-size: 26px;
  box-shadow: 0 8px 24px rgba(217, 164, 65, 0.4), 0 2px 6px rgba(0,0,0,0.1);
  z-index: 150;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
  cursor: pointer;
}
.fab:active { transform: scale(0.92); }
.fab-label {
  position: absolute;
  right: 70px;
  top: 50%;
  transform: translateY(-50%);
  background: #0E3B36;
  color: #F6F0E4;
  padding: 8px 14px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.fab:hover .fab-label {
  opacity: 1;
  transform: translateY(-50%) translateX(0);
}

/* ================= TIDE HOME PAGE ================= */
.tide-hero {
  position: relative;
  height: 420px;
  background: linear-gradient(180deg, #0E3B36 0%, #175048 50%, #1f665a 100%);
  color: #F6F0E4;
  overflow: hidden;
}
.tide-sky-gradient {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 200px;
  background: linear-gradient(180deg, rgba(217, 164, 65, 0.15) 0%, transparent 100%);
}
.tide-info-overlay {
  position: relative;
  padding: 70px 24px 0;
  z-index: 10;
}
.tide-location {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  opacity: 0.8;
  margin-bottom: 4px;
}
.tide-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: rgba(246, 240, 228, 0.15);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 16px;
  border: 1px solid rgba(246, 240, 228, 0.2);
}
.tide-status-dot {
  width: 8px; height: 8px;
  background: #7FBFB0;
  border-radius: 50%;
  animation: tidePulse 2s ease-in-out infinite;
}
@keyframes tidePulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.3); opacity: 0.7; }
}
.tide-main-value {
  font-family: 'Cormorant Garamond', serif;
  font-size: 72px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: -2px;
}
.tide-main-value sup {
  font-size: 28px;
  vertical-align: super;
  margin-left: 4px;
  opacity: 0.7;
}
.tide-main-label {
  font-size: 15px;
  opacity: 0.7;
  margin-top: 4px;
}
.tide-next-tide {
  margin-top: 20px;
  padding: 14px 18px;
  background: rgba(246, 240, 228, 0.1);
  border: 1px solid rgba(246, 240, 228, 0.15);
  border-radius: 16px;
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  gap: 12px;
}
.tide-next-icon {
  width: 40px; height: 40px;
  background: #D9A441;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.tide-next-info { flex: 1; }
.tide-next-title {
  font-size: 13px;
  opacity: 0.7;
  margin-bottom: 2px;
}
.tide-next-time {
  font-size: 17px;
  font-weight: 600;
}
.tide-next-countdown {
  font-size: 13px;
  color: #D9A441;
  font-weight: 500;
}

/* Tide wave SVG */
.tide-wave-container {
  position: absolute;
  bottom: 0;
  left: 0; right: 0;
  height: 180px;
  overflow: hidden;
}
.tide-wave-svg {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 200%;
  height: 100%;
}
.wave-path {
  fill: rgba(127, 191, 176, 0.3);
  animation: waveMove 8s ease-in-out infinite alternate;
}
.wave-path-2 {
  fill: rgba(127, 191, 176, 0.5);
  animation: waveMove 6s ease-in-out infinite alternate-reverse;
}
@keyframes waveMove {
  0% { transform: translateX(0) translateY(0); }
  100% { transform: translateX(-25%) translateY(8px); }
}

/* Tide chart */
.tide-chart-section {
  padding: 24px;
  background: #F6F0E4;
  margin-top: -20px;
  border-radius: 28px 28px 0 0;
  position: relative;
  z-index: 20;
}
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.section-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 600;
  color: #0E3B36;
}
.section-link {
  font-size: 13px;
  color: #D9A441;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 2px;
}
.tide-chart-wrap {
  position: relative;
  height: 160px;
  background: linear-gradient(180deg, rgba(127, 191, 176, 0.15) 0%, rgba(127, 191, 176, 0.05) 100%);
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid rgba(127, 191, 176, 0.2);
}
.tide-chart-canvas {
  width: 100%;
  height: 100%;
  display: block;
}
.tide-time-labels {
  display: flex;
  justify-content: space-between;
  padding: 8px 4px 0;
  font-size: 11px;
  color: rgba(14, 59, 54, 0.5);
  font-family: 'JetBrains Mono', monospace;
}

/* Tide timeline */
.tide-timeline {
  display: flex;
  flex-direction: column;
  gap: 0;
  margin-top: 8px;
}
.tide-timeline-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 0;
  border-bottom: 1px solid rgba(14, 59, 54, 0.08);
  position: relative;
  transition: background 0.2s ease;
}
.tide-timeline-item:last-child { border-bottom: none; }
.tide-timeline-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.tide-timeline-icon.high { background: rgba(217, 164, 65, 0.15); color: #b8862a; }
.tide-timeline-icon.low { background: rgba(127, 191, 176, 0.2); color: #5a9e8e; }
.tide-timeline-info { flex: 1; }
.tide-timeline-time {
  font-size: 16px;
  font-weight: 600;
  color: #0E3B36;
}
.tide-timeline-type {
  font-size: 12px;
  color: rgba(14, 59, 54, 0.5);
  margin-top: 2px;
}
.tide-timeline-height {
  font-size: 18px;
  font-weight: 600;
  color: #0E3B36;
  font-family: 'Cormorant Garamond', serif;
}
.tide-timeline-height span {
  font-size: 12px;
  font-weight: 400;
  opacity: 0.5;
}

/* Safety alert card */
.safety-alert {
  margin: 20px 24px;
  padding: 18px;
  background: linear-gradient(135deg, #E86A4A 0%, #d45436 100%);
  border-radius: 20px;
  color: #fff;
  position: relative;
  overflow: hidden;
}
.safety-alert::before {
  content: '';
  position: absolute;
  top: -30px; right: -30px;
  width: 120px; height: 120px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
}
.safety-alert-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
  position: relative;
}
.safety-alert-icon {
  width: 32px; height: 32px;
  background: rgba(255,255,255,0.2);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.safety-alert-title {
  font-size: 16px;
  font-weight: 600;
}
.safety-alert-desc {
  font-size: 13px;
  opacity: 0.9;
  line-height: 1.5;
  position: relative;
}

/* Quick actions */
.quick-actions {
  padding: 0 24px 120px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.quick-action-card {
  padding: 18px;
  background: #fff;
  border-radius: 18px;
  border: 1px solid rgba(14, 59, 54, 0.06);
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  cursor: pointer;
}
.quick-action-card:active { transform: scale(0.97); }
.quick-action-icon {
  width: 42px; height: 42px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.quick-action-icon.gear { background: rgba(217, 164, 65, 0.15); }
.quick-action-icon.moon { background: rgba(127, 191, 176, 0.2); }
.quick-action-icon.safety { background: rgba(232, 106, 74, 0.12); }
.quick-action-icon.community { background: rgba(14, 59, 54, 0.08); }
.quick-action-title {
  font-size: 15px;
  font-weight: 600;
  color: #0E3B36;
}
.quick-action-desc {
  font-size: 12px;
  color: rgba(14, 59, 54, 0.5);
  line-height: 1.4;
}

/* ================= SPOTS PAGE ================= */
.spots-hero {
  padding: 70px 24px 20px;
  background: linear-gradient(180deg, #0E3B36 0%, #1a5246 100%);
  color: #F6F0E4;
  position: relative;
  overflow: hidden;
}
.search-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: rgba(246, 240, 228, 0.12);
  border: 1px solid rgba(246, 240, 228, 0.15);
  border-radius: 14px;
  margin-top: 16px;
  backdrop-filter: blur(10px);
}
.search-bar input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: #F6F0E4;
  font-size: 15px;
  font-family: 'Outfit', sans-serif;
}
.search-bar input::placeholder { color: rgba(246, 240, 228, 0.5); }
.search-icon { font-size: 16px; opacity: 0.7; }

.filter-chips {
  display: flex;
  gap: 8px;
  padding: 16px 24px;
  background: #F6F0E4;
  overflow-x: auto;
  scrollbar-width: none;
  border-radius: 28px 28px 0 0;
  margin-top: -20px;
  position: relative;
  z-index: 10;
}
.filter-chips::-webkit-scrollbar { display: none; }
.filter-chip {
  padding: 8px 16px;
  background: #fff;
  border: 1px solid rgba(14, 59, 54, 0.1);
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  color: rgba(14, 59, 54, 0.7);
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.2s ease;
}
.filter-chip.active {
  background: #0E3B36;
  color: #F6F0E4;
  border-color: #0E3B36;
}

/* Spot cards carousel */

// Generate calendar data
function generateCalendar(year, month) {
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const days = [];
  // Previous month fill
  const prevMonthDays = new Date(year, month, 0).getDate();
  for (let i = firstDay - 1; i >= 0; i--) {
    days.push({ day: prevMonthDays - i, otherMonth: true });
  }
  // Current month
  for (let d = 1; d <= daysInMonth; d++) {
    const dayOfYear = Math.floor((new Date(year, month, d) - new Date(year, 0, 0)) / 86400000);
    // Approximate spring/neap tide cycle (~14.7 days)
    const tideCycle = (dayOfYear % 29.5) / 29.5;
    const isSpring = tideCycle < 0.12 || (tideCycle > 0.45 && tideCycle < 0.6);
    const isNeap = (tideCycle > 0.2 && tideCycle < 0.35) || (tideCycle > 0.72 && tideCycle < 0.87);
    days.push({ day: d, otherMonth: false, spring: isSpring, neap: isNeap, fishingRating: isSpring ? 5 : isNeap ? 2 : 3 });
  }
  // Next month fill
  const remaining = 42 - days.length;
  for (let i = 1; i <= remaining; i++) {
    days.push({ day: i, otherMonth: true });
  }
  return days;
}

// ================= APP CONTEXT =================
const AppContext = createContext(null);

function AppProvider({ children }) {
  const [currentTab, setCurrentTab] = useState('home');
  const [navStack, setNavStack] = useState([{ tab: 'home', screen: 'home' }]);
  const [modalOpen, setModalOpen] = useState(null);
  const [bottomSheet, setBottomSheet] = useState(null);
  const [darkStatusBar, setDarkStatusBar] = useState(false);
  const [diActive, setDiActive] = useState(false);

  const navigate = useCallback((screen, params = {}) => {
    setNavStack(prev => [...prev, { screen, params, direction: 'forward' }]);
  }, []);

  const goBack = useCallback(() => {
    setNavStack(prev => {
      if (prev.length <= 1) return prev;
      return prev.slice(0, -1);
    });
  }, []);

  const switchTab = useCallback((tab) => {
    setCurrentTab(tab);
    setNavStack([{ tab, screen: tab }]);
  }, []);

  const value = {
    currentTab, switchTab,
    navStack, navigate, goBack,
    modalOpen, setModalOpen,
    bottomSheet, setBottomSheet,
    darkStatusBar, setDarkStatusBar,
    diActive, setDiActive,
  };

  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
}

function useApp() { return useContext(AppContext); }

// ================= TIDE CHART (Canvas) =================
function TideChart() {
  const canvasRef = useRef(null);
  const rafRef = useRef(null);
  const startTimeRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    const w = rect.width;
    const h = rect.height;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Generate smooth tide curve
    const points = [];
    for (let i = 0; i <= 48; i++) {
      const hour = i / 2;
      // Simulate two high tides and two low tides
      const height = 2.5 + 2.2 * Math.sin((hour - 3) * Math.PI / 6.2) + 0.3 * Math.sin(hour * Math.PI / 3);
      points.push({ hour, height: Math.max(0.3, Math.min(5, height)) });
    }

    function draw(progress) {
      ctx.clearRect(0, 0, w, h);

      // Grid lines
      ctx.strokeStyle = 'rgba(14, 59, 54, 0.06)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = h - (i / 4) * h;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      // Gradient fill
      const gradient = ctx.createLinearGradient(0, 0, 0, h);
      gradient.addColorStop(0, 'rgba(127, 191, 176, 0.4)');
      gradient.addColorStop(1, 'rgba(127, 191, 176, 0.05)');

      const maxH = 5.2;
      const visible = Math.floor(points.length * progress);

      ctx.beginPath();
      ctx.moveTo(0, h);
      for (let i = 0; i < visible; i++) {
        const p = points[i];
        const x = (i / (points.length - 1)) * w;
        const y = h - (p.height / maxH) * h;
        if (i === 0) ctx.lineTo(x, y);
        else {
          const prev = points[i - 1];
          const prevX = ((i - 1) / (points.length - 1)) * w;
          const prevY = h - (prev.height / maxH) * h;
          const cpx = (prevX + x) / 2;
          ctx.bezierCurveTo(cpx, prevY, cpx, y, x, y);
        }
      }
      const lastX = ((visible - 1) / (points.length - 1)) * w;
      ctx.lineTo(lastX, h);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();

      // Line on top
      ctx.beginPath();
      for (let i = 0; i < visible; i++) {
        const p = points[i];
        const x = (i / (points.length - 1)) * w;
        const y = h - (p.height / maxH) * h;
        if (i === 0) ctx.moveTo(x, y);
        else {
          const prev = points[i - 1];
          const prevX = ((i - 1) / (points.length - 1)) * w;
          const prevY = h - (prev.height / maxH) * h;
          const cpx = (prevX + x) / 2;
          ctx.bezierCurveTo(cpx, prevY, cpx, y, x, y);
        }
      }
      ctx.strokeStyle = '#0E3B36';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Current time indicator
      const nowHour = 9 + 41/60; // ~9:41
      const currentX = (nowHour / 24) * w;
      const currentIdx = Math.floor((nowHour / 24) * (points.length - 1));
      if (currentIdx < visible && points[currentIdx]) {
        const y = h - (points[currentIdx].height / maxH) * h;

        // Vertical line
        ctx.strokeStyle = '#D9A441';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(currentX, 0);
        ctx.lineTo(currentX, h);
        ctx.stroke();
        ctx.setLineDash([]);

        // Dot
        ctx.fillStyle = '#D9A441';
        ctx.beginPath();
        ctx.arc(currentX, y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // High/low tide markers
      const keyPoints = [
        { hour: 0.25, label: '00:15 高潮' },
        { hour: 6.5, label: '06:32 低潮' },
        { hour: 12.8, label: '12:48 高潮' },
        { hour: 19.1, label: '19:05 低潮' },
      ];
      keyPoints.forEach((kp, idx) => {
        const px = (kp.hour / 24) * w;
        const pIdx = Math.floor((kp.hour / 24) * (points.length - 1));
        if (pIdx < visible && points[pIdx]) {
          const py = h - (points[pIdx].height / maxH) * h;
          ctx.fillStyle = idx % 2 === 0 ? '#D9A441' : '#7FBFB0';
          ctx.beginPath();
          ctx.arc(px, py, 4, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    if (reduced) {
      draw(1);
      return;
    }

    startTimeRef.current = performance.now();
    function animate(now) {
      const elapsed = now - startTimeRef.current;
      const duration = 1500;
      const progress = Math.min(1, elapsed / duration);
      const eased = 1 - Math.pow(1 - progress, 3);
      draw(eased);
      if (progress < 1) {
        rafRef.current = requestAnimationFrame(animate);
      } else {
        // Subtle wave after initial draw
        let waveStart = performance.now();
        function waveAnim(t) {
          const wElapsed = t - waveStart;
          const waveOffset = Math.sin(wElapsed / 1500) * 0.05;
          draw(1 + waveOffset);
          rafRef.current = requestAnimationFrame(waveAnim);
        }
        rafRef.current = requestAnimationFrame(waveAnim);
      }
    }
    rafRef.current = requestAnimationFrame(animate);

    // Pause on visibility change
    const handleVis = () => {
      if (document.hidden) {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      } else {
        startTimeRef.current = performance.now();
        rafRef.current = requestAnimationFrame(animate);
      }
    };
    document.addEventListener('visibilitychange', handleVis);

    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      document.removeEventListener('visibilitychange', handleVis);
    };
  }, []);

  return (
    <div className="tide-chart-wrap">
      <canvas ref={canvasRef} className="tide-chart-canvas"></canvas>
    </div>
  );
}

function SpeciesPage() {
  const { navigate, setDarkStatusBar, setBottomSheet } = useApp();
  const [activeCat, setActiveCat] = useState('all');
  const [longPress, setLongPress] = useState(null);
  const longPressTimerRef = useRef(null);
  const [lpPos, setLpPos] = useState({ x: 0, y: 0 });

  useEffect(() => {
    setDarkStatusBar(false);
    return () => setDarkStatusBar(false);
  }, [setDarkStatusBar]);

  const categories = [
    { id: 'all', label: '全部' },
    { id: 'mollusk', label: '贝类' },
    { id: 'crustacean', label: '甲壳类' },
    { id: 'cnidarian', label: '刺胞类' },
    { id: 'echinoderm', label: '棘皮类' },
  ];

  const handleLongPressStart = (e, species) => {
    e.preventDefault();
    const rect = e.currentTarget.getBoundingClientRect();
    const phoneRect = document.getElementById('phoneScreen').getBoundingClientRect();
    setLpPos({
      x: rect.left - phoneRect.left + rect.width / 2,
      y: rect.top - phoneRect.top + rect.height / 2,
    });
    longPressTimerRef.current = setTimeout(() => {
      setLongPress(species);
      if (navigator.vibrate) navigator.vibrate(10);
    }, 500);
  };

  const handleLongPressEnd = () => {
    if (longPressTimerRef.current) {
      clearTimeout(longPressTimerRef.current);
    }
  };

  const closeLongPress = () => {
    setLongPress(null);
  };

  // Arrange species in mosaic pattern
  const mosaicItems = SPECIES.map((s, i) => ({
    ...s,
    tall: i === 1 || i === 4,
    wide: i === 3,
  }));

  return (
    <div className="page-content">
      <div className="nav-bar">
        <div className="nav-header">
          <div className="nav-left"></div>
          <div className="nav-title">海物图鉴</div>
          <div className="nav-right">
            <div className="nav-btn primary">🔍</div>
          </div>
        </div>
        <div className="nav-large-title">海物图鉴</div>
        <div className="nav-subtitle">86 种常见海洋生物 · 含识别要点与季节</div>
      </div>

      <div className="species-grid-section">
        <div className="species-category-nav">
          {categories.map(cat => (
            <div
              key={cat.id}
              className={`species-cat-btn ${activeCat === cat.id ? 'active' : ''}`}
              onClick={() => setActiveCat(cat.id)}
            >
              {cat.label}
            </div>
          ))}
        </div>

        <div className="species-mosaic">
          {mosaicItems.map((species, idx) => (
            <div
              key={species.id}
              className={`species-card ${species.tall ? 'tall' : ''} ${species.wide ? 'wide' : ''}`}
              onClick={() => navigate('species-detail', { species })}
              onMouseDown={(e) => handleLongPressStart(e, species)}
              onMouseUp={handleLongPressEnd}
              onMouseLeave={handleLongPressEnd}
              onTouchStart={(e) => handleLongPressStart(e, species)}
              onTouchEnd={handleLongPressEnd}
            >
              <div className="species-card-image" style={{ background: species.gradient }}>
                {/* SVG pattern */}
                <svg style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', opacity: 0.25 }} viewBox="0 0 200 140">
                  {idx % 3 === 0 && (
                    <ellipse cx="100" cy="70" rx="60" ry="40" fill="none" stroke="#fff" strokeWidth="1.5"/>
                  )}
                  {idx % 3 === 1 && (
                    <>
                      <path d="M30,100 Q60,40 100,70 Q140,100 170,50" fill="none" stroke="#fff" strokeWidth="2"/>
                      <path d="M40,110 Q80,60 110,90 Q150,120 180,70" fill="none" stroke="#fff" strokeWidth="1" opacity="0.5"/>
                    </>
                  )}
                  {idx % 3 === 2 && (
                    <>
                      <circle cx="100" cy="70" r="40" fill="none" stroke="#fff" strokeWidth="2"/>
                      <line x1="100" y1="30" x2="100" y2="110" stroke="#fff" strokeWidth="1" opacity="0.5"/>
                      <line x1="60" y1="70" x2="140" y2="70" stroke="#fff" strokeWidth="1" opacity="0.5"/>
                    </>
                  )}
                </svg>
                <div className="species-card-season">
                  {species.peakSeason.length}月旺季
                </div>
                <div className={`species-card-rarity ${species.rarity}`}></div>
              </div>
              <div className="species-card-info">
                <div className="species-card-name">{species.name}</div>
                <div className="species-card-latin">{species.latin}</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* Long press menu */}
      {longPress && (
        <>
          <div className="menu-backdrop" onClick={closeLongPress}></div>
          <div
            className="longpress-menu"
            style={{
              left: Math.min(Math.max(lpPos.x - 100, 16), 390 - 216),
              top: Math.min(lpPos.y + 10, 600),
            }}
          >
            <div className="lp-menu-item" onClick={() => { closeLongPress(); navigate('species-detail', { species: longPress }); }}>
              <div className="lp-menu-icon" style={{ background: 'rgba(14, 59, 54, 0.1)' }}>👁️</div>
              <span>查看详情</span>
            </div>
            <div className="lp-menu-item" onClick={() => { closeLongPress(); }}>
              <div className="lp-menu-icon" style={{ background: 'rgba(217, 164, 65, 0.15)' }}>⭐</div>
              <span>收藏图鉴</span>
            </div>
            <div className="lp-menu-item" onClick={() => { closeLongPress(); }}>
              <div className="lp-menu-icon" style={{ background: 'rgba(127, 191, 176, 0.2)' }}>📍</div>
              <span>附近哪里能找到</span>

function CalendarPage() {
  const { setDarkStatusBar } = useApp();
  const [year, setYear] = useState(2026);
  const [month, setMonth] = useState(7); // Aug (0-indexed)
  const [selectedDay, setSelectedDay] = useState(17);
  const days = useMemo(() => generateCalendar(year, month), [year, month]);

  useEffect(() => {
    setDarkStatusBar(true);
    return () => setDarkStatusBar(false);
  }, [setDarkStatusBar]);

  const prevMonth = () => {
    if (month === 0) { setYear(year - 1); setMonth(11); }
    else setMonth(month - 1);
  };
  const nextMonth = () => {
    if (month === 11) { setYear(year + 1); setMonth(0); }
    else setMonth(month + 1);
  };

  const selectedDayData = days.find(d => d.day === selectedDay && !d.otherMonth);

  return (
    <div className="page-content calendar-page">

          fontFamily: "'Cormorant Garamond', serif",

  const pullDistRef = useRef(0);
  const [pullOffset, setPullOffset] = useState(0);
  const [showPull, setShowPull] = useState(false);

  useEffect(() => {
    setDarkStatusBar(false);
    return () => setDarkStatusBar(false);
  }, [setDarkStatusBar]);

  const handleTouchStart = (e) => {
    if (scrollRef.current && scrollRef.current.scrollTop === 0) {
      startYRef.current = e.touches[0].clientY;
    }
  };

  const handleTouchMove = (e) => {
    if (scrollRef.current && scrollRef.current.scrollTop <= 0) {
      const dist = e.touches[0].clientY - startYRef.current;
      if (dist > 0) {
        const pull = Math.min(dist * 0.5, 80);
        pullDistRef.current = pull;
        setPullOffset(pull);
        setShowPull(true);
      }
    }
  };

  const handleTouchEnd = () => {
    if (pullDistRef.current > 60) {
      setRefreshing(true);
      setTimeout(() => {
        setRefreshing(false);
        setPullOffset(0);
        setShowPull(false);
        pullDistRef.current = 0;
      }, 1500);
    } else {
      setPullOffset(0);
      setShowPull(false);
      pullDistRef.current = 0;
    }
  };

  const tabs = [
    { id: 'hot', label: '热门' },
    { id: 'latest', label: '最新' },
    { id: 'following', label: '关注' },
  ];

  return (
    <div className="page-content community-page"
         ref={scrollRef}
         onTouchStart={handleTouchStart}
         onTouchMove={handleTouchMove}
         onTouchEnd={handleTouchEnd}
    >
      <div className={`community-sticky-header ${refreshing ? 'refreshing' : ''}`} style={{ transform: `translateY(${pullOffset}px)` }}>
        <div className="pull-indicator">
          <div className="pull-spinner"></div>
          <span>{refreshing ? '刷新中...' : '下拉刷新'}</span>
        </div>
        <div style={{ padding: '10px 24px 0', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 28, fontWeight: 700, color: '#0E3B36' }}>
            社区
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <div className="nav-btn" style={{ background: 'rgba(14,59,54,0.06)' }}>🔔</div>
            <div className="nav-btn primary">+</div>
          </div>
        </div>
        <div className="community-tabs">
          {tabs.map(tab => (
            <div
              key={tab.id}
              className={`community-tab ${activeTab === tab.id ? 'active' : ''}`}
              onClick={() => setActiveTab(tab.id)}
            >
              {tab.label}
            </div>
          ))}
        </div>
      </div>

      <div className="masonry-grid" style={{ transform: `translateY(${pullOffset}px)` }}>
        {posts.map((post, idx) => (
          <div key={post.id} className="masonry-item" onClick={() => setBottomSheet('post-detail')}>
            <div className="masonry-image" style={{
              height: post.height,

            }}>
              {post.badge && <div className="masonry-badge">{post.badge}</div>}
              {/* Decorative SVG */}
              <svg style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', opacity: 0.2 }} viewBox="0 0 200 180">

                    <circle cx="100" cy="90" r="30" fill="none" stroke="#fff" strokeWidth="1" opacity="0.5"/>

// ================= NAVIGATION WRAPPER =================
function PageNavigator() {
  const { navStack, currentTab, bottomSheet, setBottomSheet } = useApp();

  const renderScreen = (screenName, params) => {
    switch (screenName) {
      case 'home': return <HomePage key="home" />;
      case 'spots': return <SpotsPage key="spots" />;
      case 'species': return <SpeciesPage key="species" />;
      case 'species-detail': return <SpeciesDetailPage key={`sd-${params?.species?.id}`} />;
      case 'calendar': return <CalendarPage key="calendar" />;
      case 'community': return <CommunityPage key="community" />;
      case 'design-system': return <DesignSystemPage key="ds" />;
      case 'api-docs': return <ApiDocsPage key="api" />;
      default: return <HomePage key="home" />;
    }
  };

  return (
    <>
      {navStack.map((item, idx) => {
        const isTop = idx === navStack.length - 1;
        const direction = item.direction === 'forward' ? 'right' : 'left';

        let className = 'page';
        if (!isTop) {
          className += ' leaving-' + (direction === 'right' ? 'left' : 'right');
        } else if (idx > 0) {
          className += ' entering-' + direction + ' active';
        } else {
          className += ' active';
        }
        if (bottomSheet && isTop) {
          className += ' under-modal';
        }

        return (
          <div key={idx} className={className} style={{ zIndex: 10 + idx }}>
            {renderScreen(item.screen, item.params)}
          </div>
        );
      })}

      {/* Bottom Sheet */}

// ================= MAIN APP =================
function App() {
  const { diActive, setDiActive, navigate } = useApp();

  // Dynamic Island interaction - triple tap opens dev menu
  const diTapCountRef = useRef(0);
  const diTapTimerRef = useRef(null);

  const handleDiClick = () => {
    diTapCountRef.current++;
    if (diTapCountRef.current >= 3) {
      setDiActive(!diActive);
      diTapCountRef.current = 0;
      clearTimeout(diTapTimerRef.current);
    } else {
      setDiActive(true);
      clearTimeout(diTapTimerRef.current);
      diTapTimerRef.current = setTimeout(() => {
        setDiActive(false);
        diTapCountRef.current = 0;
      }, 3000);
    }
  };

  // Set up dynamic island with dev entries
  useEffect(() => {
    const di = document.getElementById('dynamicIsland');
    if (di) {
      di.addEventListener('click', handleDiClick);
    }
    return () => {
      if (di) di.removeEventListener('click', handleDiClick);
    };
  }, [diActive]);

  return (
    <>
      <PageNavigator />

      {/* Dev menu in Dynamic Island expanded state */}
      {diActive && (
        <div style={{
          position: 'absolute', top: 65, left: 15, right: 15,
          background: '#000', borderRadius: 20, padding: 12,
          zIndex: 450, color: '#F6F0E4',

// ================= CUSTOM CURSOR INIT =================
function initCursor() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isTouch = !window.matchMedia('(hover: hover)').matches;
  if (reduced || isTouch) return;

  const cursor = document.getElementById('customCursor');
  const ring = document.getElementById('cursorRing');
  if (!cursor || !ring) return;

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let ringX = mouseX;
  let ringY = mouseY;
  let rafId = null;
  let visible = false;

  // Center initial position
  cursor.style.left = mouseX + 'px';
  cursor.style.top = mouseY + 'px';
  ring.style.left = mouseX + 'px';
  ring.style.top = mouseY + 'px';

  const animateRing = () => {
    ringX += (mouseX - ringX) * 0.15;
    ringY += (mouseY - ringY) * 0.15;
    ring.style.transform = `translate(${ringX - mouseX}px, ${ringY - mouseY}px) translate(-50%, -50%)`;
    // Actually simpler:
    ring.style.left = ringX + 'px';
    ring.style.top = ringY + 'px';
    rafId = requestAnimationFrame(animateRing);
  };

  const handleMove = (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    cursor.style.left = mouseX + 'px';
    cursor.style.top = mouseY + 'px';
    if (!visible) {
      visible = true;
      cursor.style.opacity = '1';
      ring.style.opacity = '1';
      rafId = requestAnimationFrame(animateRing);
    }
  };

  const handleDown = (e) => {
    cursor.classList.add('click');
    // Create ripple
    const ripple = document.createElement('div');
    ripple.className = 'cursor-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  };

  const handleUp = () => {
    cursor.classList.remove('click');
  };

  const handleOver = (e) => {
    const target = e.target.closest('button, .nav-btn, .tab-item, .spot-card, .species-card, .quick-action-card, .masonry-item, .calendar-day, .filter-chip, .community-tab, .fab, .api-endpoint-item, .lp-menu-item, .calendar-nav-btn, .species-cat-btn, .code-copy-btn, .api-try-btn');
    if (target) {
      cursor.classList.add('hover');
      ring.style.borderColor = 'rgba(217, 164, 65, 0.9)';
    } else {
      cursor.classList.remove('hover');
      ring.style.borderColor = 'rgba(217, 164, 65, 0.6)';
    }
  };

  const handleVis = () => {
    if (document.hidden && rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    } else if (!document.hidden && visible) {
      rafId = requestAnimationFrame(animateRing);
    }
  };

  document.addEventListener('mousemove', handleMove);
  document.addEventListener('mousedown', handleDown);
  document.addEventListener('mouseup', handleUp);
  document.addEventListener('mouseover', handleOver);
  document.addEventListener('visibilitychange', handleVis);

  // Initial hide until first mouse move
  cursor.style.opacity = '0';
  ring.style.opacity = '0';
}

// ================= RENDER =================
function Root() {
  useEffect(() => {
    initCursor();

    // Announce upgrade
    const announce = () => {
      window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    };
    announce();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announce, { once: true });
    }

    return () => {
      // cleanup handled by React unmount
    };
  }, []);

  return (
    <AppProvider>
      <App />
    </AppProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('appContainer'));
root.render(<Root />);

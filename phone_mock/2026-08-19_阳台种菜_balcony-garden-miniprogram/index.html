<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="creative-medium" content="interactive-prototype">
<title>阳台种菜 · 都市农夫种植日历</title>
<style>
  /* ============================================================
     DESIGN TOKENS — 阳台种菜 (Balcony Gardening)
     红陶土 #B5563C / 苔绿 #6B7F5E / 麦黄 #D9A441 / 瓷白 #F5F0E6
     ============================================================ */
  :root {
    --terracotta: #B5563C;
    --terracotta-dark: #8F422D;
    --terracotta-light: #D47A5F;
    --moss: #6B7F5E;
    --moss-dark: #4E6244;
    --moss-light: #8FA080;
    --wheat: #D9A441;
    --wheat-dark: #B9882E;
    --wheat-light: #E8BD66;
    --porcelain: #F5F0E6;
    --porcelain-deep: #EDE5D3;
    --ink: #2D2A26;
    --ink-soft: #5A554E;
    --ink-muted: #8C877E;
    --ink-faint: #B5B0A6;
    --card: #FFFFFF;
    --divider: rgba(45, 42, 38, 0.08);
    --shadow-sm: 0 1px 2px rgba(45, 42, 38, 0.04), 0 1px 3px rgba(45, 42, 38, 0.06);
    --shadow-md: 0 4px 12px rgba(45, 42, 38, 0.08), 0 2px 4px rgba(45, 42, 38, 0.04);
    --shadow-lg: 0 12px 32px rgba(45, 42, 38, 0.12), 0 4px 8px rgba(45, 42, 38, 0.06);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --tabbar-h: 56px;
    --navbar-h: 44px;
    --statusbar-h: 44px;
    --safe-bottom: 34px;
    --ease-standard: cubic-bezier(0.4, 0.0, 0.2, 1);
    --ease-enter: cubic-bezier(0.0, 0.0, 0.2, 1);
    --ease-exit: cubic-bezier(0.4, 0.0, 1, 1);
    --dur-fast: 180ms;
    --dur-standard: 280ms;
    --dur-slow: 420ms;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans CN", sans-serif;
    color: var(--ink);
    background: var(--porcelain);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    font-size: 15px;
    line-height: 1.5;
    overflow: hidden;
  }

  /* Tabular numbers for all numeric display */
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  /* ============================================================
     DESKTOP SHELL — phone frame centered on page
     ============================================================ */
  .workspace {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--porcelain);
    position: relative;
    gap: 20px;
  }
  .work-label {
    font-size: 13px; color: var(--ink-muted);
    letter-spacing: 0.08em;
    font-weight: 500;
  }
  .work-title {
    font-size: 15px; color: var(--ink-soft);
    font-weight: 600;
    margin-top: -14px;
  }

  .phone {
    position: relative;
    width: 390px;
    height: 844px;
    border-radius: 48px;
    background: var(--ink);
    padding: 12px;
    box-shadow:
      0 30px 60px rgba(45, 42, 38, 0.18),
      0 10px 20px rgba(45, 42, 38, 0.1),
      inset 0 0 0 1px rgba(255,255,255,0.05);
    overflow: hidden;
    cursor: none;
  }
  .phone-screen {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 38px;
    background: var(--porcelain);
    overflow: hidden;
  }

  /* Notch */
  .notch {
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 32px;
    background: var(--ink);
    border-radius: 20px;
    z-index: 1000;
    pointer-events: none;
  }

  /* ============================================================
     STATUS BAR
     ============================================================ */
  .status-bar {
    position: absolute; top: 0; left: 0; right: 0;
    height: var(--statusbar-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px 0 28px;
    font-size: 15px; font-weight: 600;
    color: var(--ink);
    z-index: 999;
    pointer-events: none;
  }
  .status-bar .sb-right {
    display: flex; align-items: center; gap: 6px;
  }
  .sb-signal, .sb-wifi, .sb-battery {
    display: flex; align-items: center;
  }
  .sb-battery {
    width: 26px; height: 12px;
    border: 1.5px solid var(--ink);
    border-radius: 3px;
    position: relative;
    padding: 1px;
  }
  .sb-battery::after {
    content: '';
    position: absolute;
    right: -3px; top: 3px;
    width: 2px; height: 4px;
    background: var(--ink);
    border-radius: 0 1px 1px 0;
  }
  .sb-battery-fill {
    width: 80%; height: 100%;
    background: var(--ink);
    border-radius: 1px;
  }

  /* ============================================================
     WECHAT CAPSULE — 小程序胶囊按钮
     ============================================================ */
  .wx-capsule {
    position: absolute;
    top: calc(var(--statusbar-h) + 6px);
    right: 12px;
    width: 87px; height: 32px;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 16px;
    border: 0.5px solid rgba(0,0,0,0.06);
    display: flex; align-items: center;
    z-index: 998;
    overflow: hidden;
    cursor: pointer;
  }
  .wx-cap-btn {
    flex: 1; height: 100%;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--dur-fast) var(--ease-standard);
  }
  .wx-cap-btn:active { background: rgba(0,0,0,0.06); }
  .wx-cap-btn svg {
    width: 16px; height: 16px;
    stroke: var(--ink-soft);
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .wx-cap-divider {
    width: 0.5px; height: 16px;
    background: rgba(0,0,0,0.1);
  }

  /* ============================================================
     APP CONTAINER — pages live here
     ============================================================ */
  .app-root {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden;
    background: var(--porcelain);
  }

  .pages-layer {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
  }

  .page {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--porcelain);
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* Navbar for non-tab detail pages */
  .navbar {
    height: calc(var(--statusbar-h) + var(--navbar-h));
    padding-top: var(--statusbar-h);
    display: flex; align-items: center;
    padding-left: 12px; padding-right: 12px;
    position: relative;
    flex-shrink: 0;
    background: transparent;
    z-index: 10;
  }
  .navbar-transparent { background: transparent; }
  .navbar .nav-back {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    cursor: pointer;
    transition: background var(--dur-fast) var(--ease-standard);
  }
  .navbar .nav-back:active { background: rgba(0,0,0,0.05); }
  .navbar .nav-back svg {
    width: 22px; height: 22px;
    stroke: var(--ink);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .navbar .nav-title {
    position: absolute;
    left: 0; right: 0; top: var(--statusbar-h);
    height: var(--navbar-h);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 600;
    color: var(--ink);
    pointer-events: none;
  }

  .page-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    position: relative;
  }
  .page-body::-webkit-scrollbar { display: none; }

  /* Page transition classes */
  .page-enter {
    transform: translateX(100%);
    animation: pageEnter var(--dur-standard) var(--ease-enter) forwards;
  }
  .page-leave {
    animation: pageLeave var(--dur-standard) var(--ease-exit) forwards;
  }
  .page-enter-back {
    transform: translateX(-30%);
    animation: pageEnterBack var(--dur-standard) var(--ease-enter) forwards;
  }
  .page-leave-back {
    animation: pageLeaveBack var(--dur-standard) var(--ease-exit) forwards;
  }

  @keyframes pageEnter {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }
  @keyframes pageLeave {
    from { transform: translateX(0); }
    to { transform: translateX(-30%); opacity: 0.6; }
  }
  @keyframes pageEnterBack {
    from { transform: translateX(-30%); opacity: 0.6; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes pageLeaveBack {
    from { transform: translateX(0); }
    to { transform: translateX(100%); }
  }

  /* ============================================================
     CUSTOM NAVBAR for tab pages (with title)
     ============================================================ */
  .tab-header {
    padding-top: calc(var(--statusbar-h) + 8px);
    padding-left: 20px; padding-right: 20px;
    flex-shrink: 0;
    position: relative;
    z-index: 5;
  }
  .tab-header .greeting {
    font-size: 13px; color: var(--ink-muted);
    margin-bottom: 4px;
  }
  .tab-header .page-title {
    font-size: 28px; font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.02em;
  }

  /* ============================================================
     TODAY TAB — 今日待办
     ============================================================ */
  .today-status-card {
    margin: 16px 20px 12px;
    background: linear-gradient(135deg, var(--moss) 0%, var(--moss-dark) 100%);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .today-status-card::before {
    content: '';
    position: absolute;
    right: -30px; top: -30px;
    width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, transparent 70%);
    border-radius: 50%;
  }
  .tsc-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .tsc-weather {
    display: flex; align-items: center; gap: 10px;
  }
  .tsc-weather svg {
    width: 28px; height: 28px;
    fill: var(--wheat-light);
  }
  .tsc-temp {
    font-size: 22px; font-weight: 700;
    line-height: 1;
  }
  .tsc-temp span {
    font-size: 13px; font-weight: 400;
    opacity: 0.8;
    margin-left: 2px;
  }
  .tsc-date {
    font-size: 12px; opacity: 0.8;
  }
  .tsc-progress-wrap {
    position: relative;
  }
  .tsc-progress-label {
    display: flex; justify-content: space-between;
    font-size: 12px; margin-bottom: 6px;
    opacity: 0.9;
  }
  .tsc-progress-bar {
    height: 6px;
    background: rgba(255,255,255,0.2);
    border-radius: 3px;
    overflow: hidden;
  }
  .tsc-progress-fill {
    height: 100%;
    background: var(--wheat-light);
    border-radius: 3px;
    width: 0%;
    transition: width 0.5s var(--ease-standard);
  }

  /* Section title */
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    margin: 20px 0 10px;
  }
  .section-title {
    font-size: 17px; font-weight: 600;
    color: var(--ink);
  }
  .section-count {
    font-size: 13px; color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }

  /* ============================================================
     TODO LIST — with left-swipe actions
     ============================================================ */
  .todo-list {
    padding: 0 20px 100px;
    display: flex; flex-direction: column; gap: 10px;
  }

  .todo-item {
    position: relative;
    overflow: hidden;
    border-radius: var(--radius-md);
    background: var(--card);
    box-shadow: var(--shadow-sm);
  }

  .todo-swipe-wrap {
    position: relative;
    display: flex; align-items: stretch;
    transition: transform 0.3s var(--ease-standard);
    touch-action: pan-y;
    cursor: grab;
  }
  .todo-swipe-wrap:active { cursor: grabbing; }

  .todo-content {
    flex: 1;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 14px;
    background: var(--card);
    position: relative;
    z-index: 2;
    min-width: 100%;
  }

  .todo-plant-ico {
    width: 48px; height: 48px;
    border-radius: 12px;
    background: var(--porcelain-deep);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .todo-plant-ico svg {
    width: 28px; height: 28px;
  }

  .todo-info { flex: 1; min-width: 0; }
  .todo-title {
    font-size: 15px; font-weight: 600;
    color: var(--ink);
    margin-bottom: 3px;
    display: flex; align-items: center; gap: 8px;
  }
  .todo-type-tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 500;
  }
  .tag-water { background: rgba(107, 127, 94, 0.12); color: var(--moss-dark); }
  .tag-fertilize { background: rgba(217, 164, 65, 0.18); color: var(--wheat-dark); }
  .tag-harvest { background: rgba(181, 86, 60, 0.12); color: var(--terracotta-dark); }
  .tag-prune { background: rgba(107, 127, 94, 0.12); color: var(--moss-dark); }

  .todo-desc {
    font-size: 13px; color: var(--ink-soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .todo-time {
    font-size: 12px; color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  /* Swipe action button */
  .todo-action-btn {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 80px;
    background: var(--moss);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    z-index: 1;
    border-radius: 0 var(--radius-md) var(--radius-md) 0;
  }
  .todo-action-btn:active {
    background: var(--moss-dark);
  }

  /* Completed state */
  .todo-item.completed .todo-content {
    opacity: 0.5;
  }
  .todo-item.completed .todo-title {
    text-decoration: line-through;
    color: var(--ink-muted);
  }
  .todo-item.completed .todo-type-tag {
    opacity: 0.5;
  }

  .check-done {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--moss);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .check-done svg {
    width: 14px; height: 14px;
    stroke: #fff; stroke-width: 2.5;
    fill: none;
    stroke-linecap: round; stroke-linejoin: round;
  }

  /* ============================================================
     PULL-TO-REFRESH
     ============================================================ */
  .ptr-indicator {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    background: transparent;
    color: var(--ink-muted);
    font-size: 13px;
    z-index: 0;
    transition: height 0.3s var(--ease-standard);
  }
  .ptr-icon {
    margin-right: 8px;
    transition: transform 0.3s;
  }
  .ptr-icon svg {
    width: 18px; height: 18px;
    stroke: var(--ink-muted);
    fill: none; stroke-width: 2;
    stroke-linecap: round;
  }

  /* ============================================================
     TAB BAR
     ============================================================ */
  .tab-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: calc(var(--tabbar-h) + var(--safe-bottom));
    padding-bottom: var(--safe-bottom);
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 0.5px solid var(--divider);
    display: flex;
    z-index: 100;
    transition: transform var(--dur-standard) var(--ease-standard),
                opacity var(--dur-fast) var(--ease-standard);
  }
  .tab-bar.hidden {
    transform: translateY(100%);
    opacity: 0;
    pointer-events: none;
  }
  .tab-item {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2px;
    cursor: pointer;
    transition: opacity var(--dur-fast) var(--ease-standard);
  }
  .tab-item:active { opacity: 0.6; }
  .tab-item svg {
    width: 24px; height: 24px;
    stroke: var(--ink-muted);
    fill: none; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round;
    transition: stroke var(--dur-fast) var(--ease-standard);
  }
  .tab-item.active svg {
    stroke: var(--terracotta);
  }
  .tab-item .tab-label {
    font-size: 10px;
    color: var(--ink-muted);
    transition: color var(--dur-fast) var(--ease-standard);
  }
  .tab-item.active .tab-label {
    color: var(--terracotta);
    font-weight: 500;
  }

  /* ============================================================
     GARDEN TAB — 菜园
     ============================================================ */
  .garden-grid {
    padding: 16px 20px 100px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .garden-card {
    background: var(--card);
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: transform var(--dur-fast) var(--ease-standard);
  }
  .garden-card:active {
    transform: scale(0.97);
  }
  .garden-card-img {
    height: 110px;
    background: var(--porcelain-deep);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .garden-card-img svg {
    width: 60px; height: 60px;
  }
  .garden-card-body {
    padding: 12px 14px;
  }
  .garden-card-name {
    font-size: 15px; font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .garden-card-meta {
    font-size: 12px; color: var(--ink-muted);
    display: flex; justify-content: space-between;
    font-variant-numeric: tabular-nums;
  }
  .garden-card-meta .days-harvest {
    color: var(--terracotta);
    font-weight: 500;
  }

  /* ============================================================
     CALENDAR TAB — 日历
     ============================================================ */
  .cal-month-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px 12px;
  }
  .cal-month-title {
    font-size: 20px; font-weight: 700;
    color: var(--ink);
  }
  .cal-month-nav {
    display: flex; gap: 8px;
  }
  .cal-nav-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--card);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: background var(--dur-fast);
  }
  .cal-nav-btn:active { background: var(--porcelain-deep); }
  .cal-nav-btn svg {
    width: 16px; height: 16px;
    stroke: var(--ink-soft); stroke-width: 2;
    fill: none; stroke-linecap: round; stroke-linejoin: round;
  }

  .cal-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr);
    padding: 0 12px 8px;
    text-align: center;
    font-size: 12px; color: var(--ink-muted);
    font-weight: 500;
  }

  .cal-days {
    display: grid; grid-template-columns: repeat(7, 1fr);
    padding: 0 8px;
    gap: 4px;
  }
  .cal-day {
    aspect-ratio: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 14px; font-weight: 500;
    color: var(--ink);
    border-radius: 50%;
    position: relative;
    cursor: pointer;
    transition: background var(--dur-fast);
  }
  .cal-day:active { background: rgba(0,0,0,0.04); }
  .cal-day.empty { pointer-events: none; }
  .cal-day.other-month { color: var(--ink-faint); }
  .cal-day.today {
    background: var(--terracotta);
    color: #fff;
    font-weight: 700;
  }
  .cal-day.selected:not(.today) {
    background: rgba(181, 86, 60, 0.12);
    color: var(--terracotta);
    font-weight: 600;
  }
  .cal-dot {
    position: absolute;
    bottom: 5px;
    width: 5px; height: 5px;
    border-radius: 50%;
  }
  .cal-dot.harvest { background: var(--terracotta); }
  .cal-dot.water { background: var(--moss); }
  .cal-dot.fertilize { background: var(--wheat); }
  .cal-day.today .cal-dot { background: rgba(255,255,255,0.8); }

  /* Calendar detail */
  .cal-detail {
    margin: 20px 20px 100px;
    background: var(--card);
    border-radius: var(--radius-md);
    padding: 16px;
    box-shadow: var(--shadow-sm);
  }
  .cal-detail-title {
    font-size: 15px; font-weight: 600;
    color: var(--ink);
    margin-bottom: 12px;
  }
  .cal-detail-list {
    display: flex; flex-direction: column; gap: 10px;
  }
  .cal-detail-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: var(--porcelain);
    border-radius: var(--radius-sm);
  }
  .cal-detail-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .cal-detail-icon.water { background: rgba(107,127,94,0.12); }
  .cal-detail-icon.harvest { background: rgba(181,86,60,0.12); }

  }

  /* ============================================================
     CROP DETAIL PAGE — 作物详情
     ============================================================ */
  .detail-hero {
    position: relative;
    padding: calc(var(--statusbar-h) + var(--navbar-h) + 10px) 24px 24px;
    background: linear-gradient(180deg, var(--moss-light) 0%, var(--porcelain) 100%);
    overflow: hidden;
  }
  .detail-plant-visual {
    height: 180px;
    display: flex; align-items: flex-end; justify-content: center;

  .detail-plant-visual svg {

  @keyframes plantStretch {
    0% { transform: scaleY(1) scaleX(1); }
    40% { transform: scaleY(1.08) scaleX(0.96); }
    70% { transform: scaleY(0.97) scaleX(1.03); }
    100% { transform: scaleY(1) scaleX(1); }
  }

  .detail-title-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 12px;
  }
  .detail-name {
    font-size: 24px; font-weight: 700;
    color: var(--ink);
  }
  .detail-variety {
    font-size: 13px; color: var(--ink-soft);
    margin-top: 2px;
  }
  .detail-health-tag {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 12px;
    background: rgba(107,127,94,0.15);
    color: var(--moss-dark);
    font-weight: 500;
  }

  .detail-stats {
    display: flex;
    background: var(--card);
    margin: 16px 20px 0;
    border-radius: var(--radius-lg);
    padding: 16px;
    box-shadow: var(--shadow-md);
    position: relative;
    z-index: 2;
  }
  .detail-stat {
    flex: 1; text-align: center;
    position: relative;
  }
  .detail-stat:not(:last-child)::after {

    position: absolute;
    right: 0; top: 8px; bottom: 8px;
    width: 1px; background: var(--divider);
  }
  .ds-num {
    font-size: 20px; font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .ds-label {
    font-size: 12px; color: var(--ink-muted);
    margin-top: 4px;
  }

  /* Watering can interaction area */
  .watering-mode {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(45, 42, 38, 0.3);
    z-index: 50;
    display: none;
    flex-direction: column;
    align-items: center; justify-content: flex-end;
    padding-bottom: calc(var(--tabbar-h) + 40px);
  }
  .watering-mode.active { display: flex; }

  .watering-can {
    position: absolute;
    width: 80px; height: 80px;
    cursor: grab;
    touch-action: none;
    z-index: 60;
    transition: transform 0.1s ease-out;
    pointer-events: auto;
    user-select: none;
    -webkit-user-select: none;
  }
  .watering-can:active { cursor: grabbing; }
  .watering-can svg {
    width: 100%; height: 100%;
    overflow: visible;
  }
  .watering-can.tilted {
    transform: rotate(-35deg);
  }
  .watering-hint {
    color: #fff;
    font-size: 14px;
    margin-top: 20px;
    opacity: 0.9;
    text-align: center;
    z-index: 55;
    pointer-events: none;

  /* Watering progress bar */
  .watering-progress {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, 60px);
    width: 140px;
    z-index: 55;
    pointer-events: none;

  .wp-bar {
    height: 8px;
    background: rgba(255,255,255,0.3);
    border-radius: 4px;
    overflow: hidden;
  }
  .wp-fill {
    height: 100%;
    width: 0%;

    border-radius: 4px;

  .wp-label {

    color: #fff;
    font-size: 12px;
    margin-top: 6px;
    font-variant-numeric: tabular-nums;

  /* Water drop particles */
  .water-drop {

    background: rgba(255, 255, 255, 0.85);

    pointer-events: none;
    z-index: 58;
  }

  /* Timeline */
  .timeline-section {
    padding: 24px 20px 120px;
  }
  .timeline-title {
    font-size: 17px; font-weight: 600;
    color: var(--ink);
    margin-bottom: 16px;
  }
  .timeline {
    position: relative;
    padding-left: 28px;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 9px; top: 4px; bottom: 4px;
    width: 2px;
    background: var(--divider);
  }
  .tl-item {
    position: relative;
    margin-bottom: 20px;
  }
  .tl-item:last-child { margin-bottom: 0; }
  .tl-dot {
    position: absolute;
    left: -28px; top: 2px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--card);
    border: 2px solid var(--moss);
    display: flex; align-items: center; justify-content: center;
    z-index: 1;
  }
  .tl-dot svg {
    width: 10px; height: 10px;
    fill: var(--moss);
  }
  .tl-item.past .tl-dot {
    background: var(--moss);
  }
  .tl-item.past .tl-dot svg {
    fill: #fff;
  }
  .tl-item.future .tl-dot {
    border-color: var(--ink-faint);
  }
  .tl-item.future .tl-dot svg {
    fill: var(--ink-faint);
  }
  .tl-date {
    font-size: 12px; color: var(--ink-muted);
    margin-bottom: 4px;
    font-variant-numeric: tabular-nums;
  }
  .tl-stage {
    font-size: 15px; font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .tl-note {
    font-size: 13px; color: var(--ink-soft);
    line-height: 1.5;
    margin-bottom: 8px;
  }

    display: flex; gap: 6px;
    flex-wrap: wrap;
  }
  .tl-photo {

    overflow: hidden;
  }

    width: 32px; height: 32px;
    opacity: 0.5;
  }

  /* Sticky bottom bar */
  .sticky-action-bar {
    position: absolute;

    gap: 6px;

  .btn-primary {
    background: var(--terracotta);
    color: #fff;
  }
  .btn-primary:active { background: var(--terracotta-dark); }
  .btn-secondary {
    background: var(--porcelain-deep);
    color: var(--ink);
  }
  .btn svg {
    width: 18px; height: 18px;
    stroke: currentColor; stroke-width: 2;
    fill: none; stroke-linecap: round; stroke-linejoin: round;
  }

     ============================================================ */

    pointer-events: none;
    transition: opacity var(--dur-standard) var(--ease-standard);

    opacity: 1;

  }

    max-height: 80%;
    overflow-y: auto;

    transform: translateY(0);

  .as-grabber {
    width: 36px; height: 4px;
    background: var(--ink-faint);
    border-radius: 2px;
    margin: 0 auto 16px;
  }

  .as-header {
    padding: 0 20px 16px;
    border-bottom: 0.5px solid var(--divider);
  }
  .as-title {
    font-size: 17px; font-weight: 600;
    color: var(--ink);
  }

    font-size: 13px; color: var(--ink-muted);
    margin-top: 4px;
  }

  .as-body {
    padding: 16px 20px;
  }

  .form-group {
    margin-bottom: 18px;
  }
  .form-label {
    font-size: 13px; font-weight: 500;
    color: var(--ink-soft);
    margin-bottom: 8px;
    display: block;
  }

  .stage-selector {
    display: flex; gap: 8px;
    flex-wrap: wrap;
  }
  .stage-chip {
    padding: 8px 14px;
    border-radius: 20px;
    background: var(--card);
    font-size: 13px;
    color: var(--ink-soft);

    border: 1.5px solid transparent;
    transition: all var(--dur-fast) var(--ease-standard);
    display: flex; align-items: center; gap: 6px;

    width: 16px; height: 16px;

    display: flex; gap: 8px;

  }
  .photo-add {
    width: 72px; height: 72px;
    border-radius: var(--radius-sm);
    background: var(--card);
    border: 1.5px dashed var(--ink-faint);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--ink-muted);
    transition: all var(--dur-fast);
  }
  .photo-add:active { background: var(--porcelain-deep); }

    width: 24px; height: 24px;
    stroke: currentColor; stroke-width: 1.8;
    fill: none; stroke-linecap: round; stroke-linejoin: round;
  }
  .photo-item {
    width: 72px; height: 72px;
    border-radius: var(--radius-sm);
    background: var(--porcelain-deep);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .photo-item svg {
    width: 32px; height: 32px;
    opacity: 0.6;
  }
  .photo-remove {
    position: absolute;
    top: -6px; right: -6px;
    width: 20px; height: 20px;
    background: var(--terracotta);
    color: #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    cursor: pointer;
  }

  .note-input {
    width: 100%;
    min-height: 80px;
    padding: 12px 14px;
    border: 1px solid var(--divider);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    background: var(--card);
    resize: none;
    outline: none;
    transition: border-color var(--dur-fast);
  }
  .note-input:focus {
    border-color: var(--moss);
  }

  .as-footer {
    padding: 12px 20px 0;
    border-top: 0.5px solid var(--divider);
  }
  .as-footer .btn {
    width: 100%;
    flex: none;
  }

  /* ============================================================
     CUSTOM CURSOR — 圆形触摸点
     ============================================================ */
  .custom-cursor {
    position: fixed;
    width: 28px; height: 28px;
    border: 2px solid var(--terracotta);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.15s ease, height 0.15s ease,
                border-color 0.2s ease, background 0.2s ease,
                opacity 0.2s ease;
    mix-blend-mode: difference;
    opacity: 0;
  }
  .custom-cursor.visible { opacity: 1; }
  .custom-cursor.dragging {
    width: 40px; height: 40px;
    background: rgba(181, 86, 60, 0.15);
    border-color: var(--terracotta);
    mix-blend-mode: normal;
  }
  .custom-cursor.pressing {
    width: 20px; height: 20px;
    background: var(--terracotta);
  }

  /* ============================================================
     TOAST
     ============================================================ */
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(45, 42, 38, 0.85);
    color: #fff;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    z-index: 300;
    opacity: 0;
    pointer-events: none;
    transition: all var(--dur-standard) var(--ease-standard);
    backdrop-filter: blur(10px);
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* ============================================================
     REDUCED MOTION
     ============================================================ */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .page-enter, .page-leave,
    .page-enter-back, .page-leave-back {
      animation: none !important;
      transform: none !important;
    }
    .water-drop { display: none !important; }
  }

  /* Empty state hint */
  .empty-list {
    padding: 40px 20px;
    text-align: center;
    color: var(--ink-muted);
    font-size: 14px;
  }

  /* Utility */
  .hidden { display: none !important; }

  function getCrop(id) { return CROPS.find(c => c.id === id); }

    return { water: 'tag-water', fertilize: 'tag-fertilize', harvest: 'tag-harvest', prune: 'tag-prune' }[type] || '';

  function showToast(msg, duration = 2000) {

  /* ============================================================
     CUSTOM CURSOR
     ============================================================ */
  const cursor = {
    el: null, x: 0, y: 0, visible: false,
    init() {
      this.el = $('#customCursor');
      const phone = $('#phone');

      phone.addEventListener('mouseenter', () => {
        this.visible = true;
        this.el.classList.add('visible');
      });
      phone.addEventListener('mouseleave', () => {
        this.visible = false;
        this.el.classList.remove('visible');
      });

      document.addEventListener('mousemove', (e) => {
        this.x = e.clientX;
        this.y = e.clientY;
        this.el.style.left = e.clientX + 'px';
        this.el.style.top = e.clientY + 'px';
      }, { passive: true });
    },
    setDragging(d) {
      this.el.classList.toggle('dragging', d);
    },
    setPressing(p) {
      this.el.classList.toggle('pressing', p);
    }
  };

  /* ============================================================
     TAB NAVIGATION
     ============================================================ */
  function switchTab(tabName) {
    if (state.currentTab === tabName) return;
    state.currentTab = tabName;

    $$('.tab-item').forEach(el => {
      el.classList.toggle('active', el.dataset.tab === tabName);
    });

    $$('.tab-page').forEach(p => {
      p.classList.toggle('hidden', p.dataset.tab !== tabName);
    });

    // Update nav title etc.
    if (tabName === 'calendar') {
      renderCalendar();
    }
    if (tabName === 'garden') {
      renderGarden();
    }
  }

  function initTabBar() {
    $$('.tab-item').forEach(item => {

        switchTab(item.dataset.tab);

  /* ============================================================
     TODO LIST — render + left swipe
     ============================================================ */
  function renderTodos() {
    const list = $('#todoList');
    const pending = todos.filter(t => !t.completed);
    const completed = todos.filter(t => t.completed);
    const all = [...pending, ...completed];

    if (all.length === 0) {
      list.innerHTML = '<div class="empty-list">今日没有待办，阳台的作物们都好好的 🌱</div>';
      updateProgress();
      return;
    }

    list.innerHTML = all.map(todo => {
      const crop = getCrop(todo.cropId);
      const icon = crop ? PLANT_ICONS[crop.icon] : '';
      const typeLabel = getTypeLabel(todo.type);
      const tagClass = getTypeTagClass(todo.type);

      if (todo.completed) {
        return `
          <div class="todo-item completed" data-id="${todo.id}">
            <div class="todo-content">
              <div class="todo-plant-ico">${icon}</div>
              <div class="todo-info">
                <div class="todo-title">
                  ${todo.title}
                  <span class="todo-type-tag ${tagClass}">${typeLabel}</span>
                </div>
                <div class="todo-desc">${todo.amount}</div>
              </div>
              <div class="check-done">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
              </div>
            </div>
          </div>
        `;
      }

      return `
        <div class="todo-item" data-id="${todo.id}">
          <div class="todo-swipe-wrap">
            <div class="todo-content">
              <div class="todo-plant-ico">${icon}</div>
              <div class="todo-info">
                <div class="todo-title">
                  ${todo.title}
                  <span class="todo-type-tag ${tagClass}">${typeLabel}</span>
                </div>
                <div class="todo-desc">${todo.amount}</div>
              </div>
              <div class="todo-time num">${todo.time}</div>
            </div>
            <div class="todo-action-btn" data-action="complete">标记完成</div>
          </div>
        </div>
      `;
    }).join('');

    // Bind swipe + tap
    $$('.todo-item', list).forEach(item => {
      const id = item.dataset.id;
      const todo = todos.find(t => t.id === id);
      if (!todo || todo.completed) {
        // Completed items: tap to go to detail
        item.addEventListener('click', () => openCropDetail(todo.cropId));
        return;
      }

      const wrap = item.querySelector('.todo-swipe-wrap');
      const actionBtn = item.querySelector('.todo-action-btn');
      let startX = 0, currentX = 0, isDragging = false, swipeAmount = 0;
      const ACTION_WIDTH = 80;

      const onStart = (e) => {
        if (e.touches) {
          startX = e.touches[0].clientX;
        } else {
          startX = e.clientX;
          cursor.setDragging(true);
        }
        currentX = startX;
        isDragging = true;
        wrap.style.transition = 'none';
      };

      const onMove = (e) => {
        if (!isDragging) return;
        e.preventDefault();
        let clientX;
        if (e.touches) {
          clientX = e.touches[0].clientX;
        } else {
          clientX = e.clientX;
        }
        const dx = clientX - startX;
        // Only allow left swipe (negative dx)
        swipeAmount = Math.min(0, Math.max(-ACTION_WIDTH, dx));
        wrap.style.transform = `translateX(${swipeAmount}px)`;
      };

      const onEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        cursor.setDragging(false);
        wrap.style.transition = '';

        if (swipeAmount < -ACTION_WIDTH * 0.5) {
          swipeAmount = -ACTION_WIDTH;
          wrap.style.transform = `translateX(${swipeAmount}px)`;
        } else {
          swipeAmount = 0;
          wrap.style.transform = '';
        }
      };

      wrap.addEventListener('mousedown', onStart);
      wrap.addEventListener('touchstart', onStart, { passive: true });
      document.addEventListener('mousemove', onMove);
      document.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('mouseup', onEnd);
      document.addEventListener('touchend', onEnd);

      // Tap action button
      actionBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        completeTodo(id);
      });

      // Tap item -> go to detail
      wrap.addEventListener('click', (e) => {
        if (Math.abs(swipeAmount) > 5) return; // was swiping
        openCropDetail(todo.cropId);
      });
    });

    updateProgress();
  }

  function completeTodo(id) {
    const todo = todos.find(t => t.id === id);
    if (todo) {
      todo.completed = true;
      renderTodos();
      showToast('已完成 ✓');
    }
  }

  function updateProgress() {
    const total = todos.length;
    const done = todos.filter(t => t.completed).length;
    const pct = total > 0 ? Math.round(done / total * 100) : 0;
    $('#progressFill').style.width = pct + '%';
    $('#progressText').textContent = `${done}/${total}`;
    $('#todoCountLabel').textContent = `${total - done} 项待完成`;
  }

  /* ============================================================
     PULL-TO-REFRESH on Today tab
     ============================================================ */
  function initPullToRefresh() {
    const scroll = $('#todayScroll');
    const indicator = $('#ptrIndicator');
    const ptrText = $('#ptrText');
    let startY = 0, pulling = false, pullDist = 0;
    const THRESHOLD = 60;

    const onStart = (e) => {
      if (scroll.scrollTop > 0) return;
      startY = e.touches ? e.touches[0].clientY : e.clientY;
      pulling = true;
    };

    const onMove = (e) => {
      if (!pulling) return;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const dy = clientY - startY;
      if (dy <= 0) {
        pullDist = 0;
        indicator.style.height = '0';
        return;
      }
      pullDist = dy * 0.5; // resistance
      if (pullDist > THRESHOLD * 1.5) pullDist = THRESHOLD * 1.5;
      indicator.style.height = pullDist + 'px';
      ptrText.textContent = pullDist >= THRESHOLD ? '释放刷新' : '下拉刷新';
      const icon = indicator.querySelector('.ptr-icon');
      if (icon) {
        icon.style.transform = pullDist >= THRESHOLD ? 'rotate(180deg)' : 'rotate(0deg)';
      }
    };

    const onEnd = () => {
      if (!pulling) return;
      pulling = false;

      if (pullDist >= THRESHOLD) {
        indicator.style.height = '40px';
        ptrText.textContent = '刷新中...';
        setTimeout(() => {
          indicator.style.height = '0';
          ptrText.textContent = '下拉刷新';
          showToast('已更新');
        }, 1000);
      } else {
        indicator.style.height = '0';
      }
      pullDist = 0;
    };

    scroll.addEventListener('mousedown', onStart);
    scroll.addEventListener('touchstart', onStart, { passive: true });
    document.addEventListener('mousemove', onMove);
    document.addEventListener('touchmove', onMove, { passive: true });
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchend', onEnd);
  }

  /* ============================================================
     CALENDAR TAB
     ============================================================ */
  // Generate calendar markers based on todos + harvest dates
  function getCalendarMarkers(year, month) {
    const markers = {};
    // Add watering every 2 days
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
      markers[d] = [];
      if (d % 2 === 0) markers[d].push({ type: 'water', name: '浇水', desc: '全部作物日常浇水' });
      if (d === 5 || d === 20) markers[d].push({ type: 'fertilize', name: '施肥', desc: '液肥稀释浇灌' });
    }
    // Specific harvest dates
    const harvestMap = {
      8: { 22: [{ type: 'harvest', name: '小辣椒采收', desc: '小米辣红透3颗' }],
           28: [{ type: 'harvest', name: '罗勒采收', desc: '掐取顶部嫩梢' }],
           19: [{ type: 'water', name: '浇水', desc: '樱桃番茄200ml' }],
           20: [{ type: 'fertilize', name: '施肥', desc: '生菜液肥1次' }]
         }
    };
    if (harvestMap[month + 1]) {
      for (const [day, items] of Object.entries(harvestMap[month + 1])) {
        const d = parseInt(day);
        if (!markers[d]) markers[d] = [];
        markers[d].push(...items);
      }
    }
    return markers;
  }

  function renderCalendar() {
    const year = state.calYear;
    const month = state.calMonth;
    const markers = getCalendarMarkers(year, month);

    const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    $('#calMonthTitle').textContent = `${year}年 ${months[month]}`;

    const firstDay = new Date(year, month, 1).getDay(); // 0 = Sunday
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const prevMonthDays = new Date(year, month, 0).getDate();

    let html = '';
    // Previous month days
    for (let i = firstDay - 1; i >= 0; i--) {
      html += `<div class="cal-day other-month empty">${prevMonthDays - i}</div>`;
    }
    // Current month days
    const isCurrentMonth = year === 2026 && month === 7;
    for (let d = 1; d <= daysInMonth; d++) {
      const isToday = isCurrentMonth && d === state.calSelectedDay;
      const isSelected = d === state.calSelectedDay;
      const dayMarkers = markers[d] || [];
      const dots = dayMarkers.slice(0, 3).map(m =>
        `<span class="cal-dot ${m.type}"></span>`
      ).join('');
      // Position dots: if multiple, spread them
      let dotsHtml = '';
      if (dayMarkers.length > 0) {
        dotsHtml = `<div style="position:absolute;bottom:5px;left:0;right:0;display:flex;justify-content:center;gap:2px;">${dayMarkers.slice(0,3).map(m => `<span class="cal-dot ${m.type}" style="position:static"></span>`).join('')}</div>`;
      }
      html += `
        <div class="cal-day ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" data-day="${d}">
          ${d}
          ${dotsHtml}
        </div>
      `;
    }
    // Fill rest with next month days to keep grid
    const totalCells = firstDay + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for (let i = 1; i <= trailing; i++) {
      html += `<div class="cal-day other-month empty">${i}</div>`;
    }

    $('#calDays').innerHTML = html;

    // Day click
    $$('.cal-day[data-day]', $('#calDays')).forEach(el => {
      el.addEventListener('click', () => {
        state.calSelectedDay = parseInt(el.dataset.day);
        renderCalendar();
        renderCalDetail();
      });
    });

    renderCalDetail();
  }

    $('#calDetailList').innerHTML = items.map(item => `

  function initCalendarNav() {
    $('#calPrev').addEventListener('click', () => {
      state.calMonth--;
      if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
      state.calSelectedDay = 1;
      renderCalendar();
    });
    $('#calNext').addEventListener('click', () => {
      state.calMonth++;
      if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
      state.calSelectedDay = 1;
      renderCalendar();
    });
  }

    // Create detail page
    const page = createDetailPage(crop);
    page.id = 'detailPage';
    page.classList.add('page-enter');
    $('#pagesLayer').appendChild(page);
    state.pageStack.push('detail');

    // Remove enter class after animation
    setTimeout(() => {
      page.classList.remove('page-enter');
    }, state.reducedMotion ? 0 : 300);

    const page = $('#detailPage');
    if (!page) return;

      page.remove();
      state.pageStack.pop();
      state.selectedCropId = null;
      // Clean up watering
      if (state.wateringActive) {
        stopWateringMode();
      }
    }, state.reducedMotion ? 0 : 280);

            <div style="display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 0.5px solid var(--divider);">
              <span style="color: var(--ink-muted); font-size: 13px;">栽种日期</span>
              <span style="font-size: 13px; color: var(--ink);" class="num">${crop.plantDate}</span>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 0.5px solid var(--divider);">
              <span style="color: var(--ink-muted); font-size: 13px;">生长阶段</span>
              <span style="font-size: 13px; color: var(--moss-dark);">${stageNames[crop.stage] || '生长期'}</span>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 6px 0;">
              <span style="color: var(--ink-muted); font-size: 13px;">预计采收</span>
              <span style="font-size: 13px; color: var(--terracotta);" class="num">${crop.daysToHarvest > 0 ? crop.daysToHarvest + ' 天后' : '现在就可以'}</span>
            </div>
          </div>
        </div>

        <!-- Timeline -->
        <div class="timeline-section">
          <div class="timeline-title">生长时间轴</div>
          <div class="timeline" id="detailTimeline">
            ${records.map((r, i) => {
              const isPast = i < records.length - 1 || records.length > 0;
              return `
                <div class="tl-item ${i < records.length ? 'past' : 'future'}">
                  <div class="tl-dot">${stageIcons[r.stage] || stageIcons.germination}</div>
                  <div class="tl-date num">${r.date}</div>
                  <div class="tl-stage">${r.stageLabel}</div>
                  ${r.note ? `<div class="tl-note">${r.note}</div>` : ''}
                  ${r.photos && r.photos.length > 0 ? `
                    <div class="tl-photos">
                      ${r.photos.map(p => `
                        <div class="tl-photo">${PLANT_ICONS[p] || ''}</div>
                      `).join('')}
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <!-- Watering mode overlay (inside page-body for positioning) -->
        <div class="watering-mode" id="wateringMode">
          <div class="watering-hint">按住浇水壶，拖到花盆上方浇水</div>
          <div class="watering-progress" id="wateringProgress">
            <div class="wp-bar"><div class="wp-fill" id="wpFill"></div></div>
            <div class="wp-label num"><span id="wpPct">0</span>%</div>
          </div>
          <div class="watering-can" id="wateringCan">
            <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
              <!-- Watering can body -->
              <path d="M20 35 Q20 28 28 26 L48 24 Q56 24 58 32 L60 55 Q60 62 53 63 L30 65 Q22 65 20 58 Z"
                    fill="#B5563C" stroke="#8F422D" stroke-width="1.5"/>
              <!-- Spout -->
              <path d="M58 34 Q70 32 72 24 L74 22 Q76 20 74 18 Q72 16 70 18 Q64 22 58 30 Z"
                    fill="#B5563C" stroke="#8F422D" stroke-width="1.5"/>
              <!-- Handle -->
              <path d="M28 28 Q12 28 12 45 Q12 58 22 58"
                    fill="none" stroke="#8F422D" stroke-width="3" stroke-linecap="round"/>
              <!-- Water line inside -->
              <path d="M26 45 L55 43 L57 55 Q57 58 53 58 L30 60 Q25 60 24 56 Z"
                    fill="#6B7F5E" opacity="0.3"/>
              <!-- Highlight -->
              <path d="M28 30 L40 29 L38 35 L26 37 Z" fill="rgba(255,255,255,0.25)"/>
              <!-- Rose (sprinkler head) -->
              <ellipse cx="73" cy="18" rx="3" ry="5" fill="#8F422D"/>
              <circle cx="72" cy="16" r="0.8" fill="#D47A5F"/>
              <circle cx="74" cy="17" r="0.8" fill="#D47A5F"/>
              <circle cx="72" cy="19" r="0.8" fill="#D47A5F"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Sticky bottom bar -->
      <div class="sticky-action-bar" id="detailActionBar">
        <button class="btn btn-secondary" id="btnWater">
          <svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
          浇水
        </button>
        <button class="btn btn-primary" id="btnRecord">
          <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          记录生长
        </button>
      </div>
    `;

    // Back button
    setTimeout(() => {
      const backBtn = page.querySelector('#detailBack');
      if (backBtn) backBtn.addEventListener('click', closeCropDetail);

      // Record button
      const recBtn = page.querySelector('#btnRecord');
      if (recBtn) recBtn.addEventListener('click', openActionSheet);

      // Water button
      const waterBtn = page.querySelector('#btnWater');
      if (waterBtn) waterBtn.addEventListener('click', startWateringMode);
    }, 0);

    return page;
  }

  /* ============================================================
     WATERING CAN SIGNATURE INTERACTION
     ============================================================ */
  function startWateringMode() {
    if (state.wateringActive) return;
    const mode = $('#wateringMode');
    if (!mode) return;
    state.wateringActive = true;
    state.wateringProgress = 0;
    mode.classList.add('active');

    // Reset progress
    $('#wpFill').style.width = '0%';
    $('#wpPct').textContent = '0';

    // Position can at bottom center
    const can = $('#wateringCan');
    const phone = $('.phone-screen');
    const phoneRect = phone.getBoundingClientRect();
    can.style.left = (phoneRect.width / 2 - 40) + 'px';
    can.style.top = (phoneRect.height - 180) + 'px';

    initWateringDrag();
  }

  function stopWateringMode() {
    state.wateringActive = false;
    const mode = $('#wateringMode');
    if (mode) mode.classList.remove('active');
    // Clean up drops
    state.waterDrops.forEach(d => d.el.remove());
    state.waterDrops = [];
    if (state.dropRAF) {
      cancelAnimationFrame(state.dropRAF);
      state.dropRAF = null;
    }
  }

  function initWateringDrag() {
    const can = $('#wateringCan');
    const phone = $('.phone-screen');
    const visual = $('#detailPlantVisual');
    if (!can || !visual) return;

    let isDragging = false;
    let offsetX = 0, offsetY = 0;
    let canX = 0, canY = 0;

    const onStart = (e) => {
      isDragging = true;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const rect = can.getBoundingClientRect();
      const phoneRect = phone.getBoundingClientRect();
      offsetX = clientX - rect.left;
      offsetY = clientY - rect.top;
      canX = rect.left - phoneRect.left;
      canY = rect.top - phoneRect.top;
      cursor.setDragging(true);
      e.preventDefault();
    };

    const onMove = (e) => {
      if (!isDragging || !state.wateringActive) return;
      e.preventDefault();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const phoneRect = phone.getBoundingClientRect();
      canX = clientX - phoneRect.left - offsetX;
      canY = clientY - phoneRect.top - offsetY;

      // Constrain within phone
      canX = Math.max(0, Math.min(phoneRect.width - 80, canX));
      canY = Math.max(0, Math.min(phoneRect.height - 80, canY));

      can.style.left = canX + 'px';
      can.style.top = canY + 'px';

      // Check if over plant area
      const visualRect = visual.getBoundingClientRect();
      const canRect = can.getBoundingClientRect();
      const canCenterX = canRect.left + canRect.width * 0.3; // spout area
      const canBottom = canRect.bottom;

      const overPlant = canCenterX > visualRect.left &&
                        canCenterX < visualRect.right &&
                        canBottom > visualRect.top &&
                        canBottom < visualRect.bottom + 30;

      // Tilt can when over plant
      if (overPlant) {
        can.classList.add('tilted');
        if (state.wateringProgress < 100 && !state.reducedMotion) {
          spawnWaterDrop(canCenterX - phoneRect.left, canBottom - phoneRect.top);
        }
        // Increase progress
        if (state.wateringProgress < 100) {
          state.wateringProgress = Math.min(100, state.wateringProgress + 0.8);
          $('#wpFill').style.width = state.wateringProgress + '%';
          $('#wpPct').textContent = Math.round(state.wateringProgress);
        }
      } else {
        can.classList.remove('tilted');
      }
    };

    const onEnd = () => {
      if (!isDragging) return;
      isDragging = false;
      cursor.setDragging(false);
      can.classList.remove('tilted');

      // Check if watering complete
      if (state.wateringProgress >= 100) {
        onWateringComplete();
      }
    };

    can.addEventListener('mousedown', onStart);
    can.addEventListener('touchstart', onStart, { passive: false });
    document.addEventListener('mousemove', onMove);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchend', onEnd);

    // Tap outside to close
    const mode = $('#wateringMode');
    mode.addEventListener('click', (e) => {
      if (e.target === mode) {
        stopWateringMode();
      }
    });
  }

  function spawnWaterDrop(x, y) {
    if (state.reducedMotion) return;
    if (state.waterDrops.length > 15) {
      // Remove oldest
      const oldest = state.waterDrops.shift();
      if (oldest && oldest.el) oldest.el.remove();
    }

    const drop = document.createElement('div');
    drop.className = 'water-drop';
    const mode = $('#wateringMode');
    mode.appendChild(drop);

    const dropData = {
      el: drop,
      x: x + (Math.random() - 0.5) * 10,
      y: y,
      vy: 2 + Math.random() * 2,
      life: 1,
      size: 4 + Math.random() * 4
    };

    state.waterDrops.push(dropData);

    // Start RAF if not running
    if (!state.dropRAF && state.visible) {
      animateDrops();
    }
  }

  function animateDrops() {
    if (!state.wateringActive || state.waterDrops.length === 0) {
      state.dropRAF = null;
      return;
    }
    if (!state.visible) {
      state.dropRAF = null;
      return;
    }

    const mode = $('#wateringMode');
    const modeRect = mode.getBoundingClientRect();
    const visual = $('#detailPlantVisual');
    const visualRect = visual ? visual.getBoundingClientRect() : null;
    const modeLeft = modeRect.left;

    for (let i = state.waterDrops.length - 1; i >= 0; i--) {
      const d = state.waterDrops[i];
      d.vy += 0.3; // gravity
      d.y += d.vy;
      d.life -= 0.015;

      // Check if hit soil (bottom of visual)
      if (visualRect) {
        const relativeY = d.y + (modeRect.top - modeRect.top); // same container
        const soilY = visualRect.bottom - modeRect.top - 20;
        if (d.y > soilY) {
          d.el.remove();
          state.waterDrops.splice(i, 1);
          continue;
        }
      }

      if (d.life <= 0 || d.y > modeRect.height) {
        d.el.remove();
        state.waterDrops.splice(i, 1);
        continue;
      }

      d.el.style.left = d.x + 'px';
      d.el.style.top = d.y + 'px';
      d.el.style.opacity = d.life;
      d.el.style.transform = `scale(${d.life})`;
    }

    state.dropRAF = requestAnimationFrame(animateDrops);
  }

  function onWateringComplete() {
    const visual = $('#detailPlantVisual');
    if (visual) {
      visual.classList.add('watered');
      setTimeout(() => visual.classList.remove('watered'), 800);
    }

    // Complete the corresponding todo
    const cropId = state.selectedCropId;
    if (cropId) {
      const waterTodo = todos.find(t => t.cropId === cropId && t.type === 'water' && !t.completed);
      if (waterTodo) {
        waterTodo.completed = true;
        renderTodos();
      }
    }

    setTimeout(() => {
      showToast('浇水完成 🌿');
      stopWateringMode();
    }, 600);
  }

  /* ============================================================
     ACTION SHEET — 记录生长
     ============================================================ */
  function openActionSheet() {
    const crop = getCrop(state.selectedCropId);
    if (!crop) return;

    $('#asSubtitle').textContent = `记录${crop.name}的生长变化`;

    // Reset state
    state.selectedStage = 'growing';
    state.photosAdded = [];
    $('#noteInput').value = '';
    renderPhotos();

    // Reset stage selector
    $$('.stage-chip').forEach(c => c.classList.toggle('active', c.dataset.stage === 'growing'));

    // Show
    $('#asMask').classList.add('show');
    $('#actionSheet').classList.add('show');
  }

  function closeActionSheet() {
    $('#asMask').classList.remove('show');
    $('#actionSheet').classList.remove('show');
  }

  function initActionSheet() {
    // Mask tap to close
    $('#asMask').addEventListener('click', closeActionSheet);

    // Stage selector
    $$('.stage-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        $$('.stage-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        state.selectedStage = chip.dataset.stage;
      });
    });

    // Photo add (adds a placeholder photo)
    $('#photoAdd').addEventListener('click', () => {
      if (state.photosAdded.length >= 4) {
        showToast('最多添加4张');
        return;
      }
      const crop = getCrop(state.selectedCropId);
      state.photosAdded.push(crop ? crop.icon : 'tomato');
      renderPhotos();
    });

    // Submit
    $('#asSubmit').addEventListener('click', () => {
      saveGrowthRecord();
    });
  }

  function renderPhotos() {
    const picker = $('#photoPicker');
    const items = state.photosAdded.map((p, i) => `
      <div class="photo-item" data-idx="${i}">
        ${PLANT_ICONS[p] || ''}
        <div class="photo-remove" data-idx="${i}">×</div>
      </div>
    `).join('');
    const addBtn = `<div class="photo-add" id="photoAdd">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </div>`;

    picker.innerHTML = items + (state.photosAdded.length < 4 ? addBtn : '');

    // Re-bind
    const addEl = picker.querySelector('#photoAdd');
    if (addEl) {
      addEl.addEventListener('click', () => {
        if (state.photosAdded.length >= 4) return;
        const crop = getCrop(state.selectedCropId);
        state.photosAdded.push(crop ? crop.icon : 'tomato');
        renderPhotos();
      });
    }
    $$('.photo-remove', picker).forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = parseInt(btn.dataset.idx);
        state.photosAdded.splice(idx, 1);
        renderPhotos();
      });
    });
  }

  function saveGrowthRecord() {
    const cropId = state.selectedCropId;
    if (!cropId) return;

    const stageMap = {
      growing: { stage: 'leafing', stageLabel: '生长期' },
      flowering: { stage: 'flowering', stageLabel: '开花期' },
      fruiting: { stage: 'fruiting', stageLabel: '挂果期' },
      harvest: { stage: 'harvest', stageLabel: '可采收' }
    };
    const stageInfo = stageMap[state.selectedStage] || stageMap.growing;

    const note = $('#noteInput').value.trim();

    const newRecord = {
      date: '2026-08-19',
      stage: stageInfo.stage,
      stageLabel: stageInfo.stageLabel,
      note: note || '今天也在好好生长~',
      photos: [...state.photosAdded]
    };

    if (!growthRecords[cropId]) growthRecords[cropId] = [];
    growthRecords[cropId].push(newRecord);

    closeActionSheet();
    showToast('记录已保存');

    // Re-render detail timeline
    const timeline = $('#detailTimeline');
    const crop = getCrop(cropId);
    const records = growthRecords[cropId];

    const stageIcons = {
      sowing: `<svg viewBox="0 0 24 24"><path d="M12 22v-5M12 17c-2.5 0-5-1.5-5-5 0-2 1-3.5 2.5-4.5M12 17c2.5 0 5-1.5 5-5 0-2-1-3.5-2.5-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
      germination: `<svg viewBox="0 0 24 24"><path d="M12 22V12M12 12C9 12 7 9 7 6M12 12c3 0 5-3 5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
      leafing: `<svg viewBox="0 0 24 24"><path d="M12 22V8M12 8c-4 0-7 2-7 6M12 8c4 0 7 2 7 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
      flowering: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
      fruiting: `<svg viewBox="0 0 24 24"><circle cx="12" cy="14" r="6"/><path d="M12 8V4M10 4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
      harvest: `<svg viewBox="0 0 24 24"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/><path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h2v-4h-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`
    };

    if (timeline) {
      timeline.innerHTML = records.map((r, i) => {
        return `
          <div class="tl-item past">
            <div class="tl-dot">${stageIcons[r.stage] || stageIcons.leafing}</div>
            <div class="tl-date num">${r.date}</div>
            <div class="tl-stage">${r.stageLabel}</div>
            ${r.note ? `<div class="tl-note">${r.note}</div>` : ''}
            ${r.photos && r.photos.length > 0 ? `
              <div class="tl-photos">
                ${r.photos.map(p => `
                  <div class="tl-photo">${PLANT_ICONS[p] || ''}</div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      // Update record count in stats
      const stats = document.querySelectorAll('.detail-stat .ds-num');
      if (stats.length >= 3) {
        stats[2].textContent = records.length;
      }
    }
  }

  /* ============================================================
     PAGE VISIBILITY — pause RAF/timers
     ============================================================ */
  document.addEventListener('visibilitychange', () => {
    state.visible = !document.hidden;
    if (state.visible && state.wateringActive && state.waterDrops.length > 0) {
      animateDrops();
    }
  });

  // Cleanup on unload
  window.addEventListener('beforeunload', () => {
    if (state.dropRAF) cancelAnimationFrame(state.dropRAF);
  });

  /* ============================================================
     INIT
     ============================================================ */
  function init() {
    // Set date
    const now = new Date();
    const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
    $('#todayDateLabel').textContent = `${now.getMonth() + 1}月${now.getDate()}日 ${weekdays[now.getDay()]}`;

    // Greeting based on time
    const hour = now.getHours();
    let greeting = '城市农夫';
    if (hour < 11) greeting = '周三早安，城市农夫';
    else if (hour < 14) greeting = '午安，城市农夫';
    else if (hour < 18) greeting = '下午好，城市农夫';
    else greeting = '晚上好，城市农夫';
    $('#greetingText').textContent = greeting;

    // Init cursor
    cursor.init();

    // Init tabs
    initTabBar();

    // Init todos
    renderTodos();

    // Init pull-to-refresh
    initPullToRefresh();

    // Init garden
    renderGarden();

    // Init calendar
    initCalendarNav();
    renderCalendar();

    // Init action sheet
    initActionSheet();

    // WeChat capsule
    $('#wxCapsule').addEventListener('click', () => {
      showToast('微信小程序胶囊按钮');
    });
  }

  // Run
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
</script>
</body>

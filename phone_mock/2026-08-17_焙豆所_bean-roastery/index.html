      { id: 2, method: '法压壶', time: '4:00', ratio: '1:14', temp: '93°C', grind: '粗研磨', steps: 4, icon: 'press' },

    /* ===================== CUSTOM HOOKS ===================== */
    function useReducedMotion() {
      const [reduced, setReduced] = useState(false);
      useEffect(() => {
        const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
        setReduced(mq.matches);
        const handler = (e) => setReduced(e.matches);
        mq.addEventListener?.('change', handler);
        return () => mq.removeEventListener?.('change', handler);
      }, []);
      return reduced;
    }

    function usePageVisibility() {
      const [visible, setVisible] = useState(true);
      useEffect(() => {
        const handler = () => setVisible(!document.hidden);
        document.addEventListener('visibilitychange', handler);
        return () => document.removeEventListener('visibilitychange', handler);
      }, []);
      return visible;
    }

    /* ===================== MINI PROGRAM CAPSULE BUTTON ===================== */
    function MiniProgramCapsule({ onMore, onMini, dark = false }) {
      const borderColor = dark ? 'rgba(245,230,211,0.25)' : 'rgba(44,24,16,0.12)';
      const iconColor = dark ? cream : deepBrown;
      const bgColor = dark ? 'rgba(44,24,16,0.4)' : 'rgba(255,255,255,0.6)';
      return (
        <div style={{
          position: 'absolute', top: 52, right: 12, zIndex: 30,
          display: 'flex', alignItems: 'center',
          height: 32, borderRadius: 16,
          background: bgColor,
          backdropFilter: 'blur(20px)',
          WebkitBackdropFilter: 'blur(20px)',
          border: `0.5px solid ${borderColor}`,
          overflow: 'hidden',
        }}>
          <button onClick={onMore} style={{
            width: 44, height: 32, display: 'flex', alignItems: 'center', justifyContent: 'center',
            background: 'transparent', border: 'none', cursor: 'pointer',
            borderRight: `0.5px solid ${borderColor}`,

            {Icon.moreCircle(iconColor)}

          <button onClick={onMini} style={{
            width: 44, height: 32, display: 'flex', alignItems: 'center', justifyContent: 'center',
            background: 'transparent', border: 'none', cursor: 'pointer',
          }}>
            {Icon.miniprogramCircle(iconColor)}
          </button>
        </div>
      );
    }

    /* ===================== NAV BAR ===================== */
    function NavBar({ title, transparent = false, gradient = false, scrollY = 0, dark = false, children, onBack }) {
      const isSolid = !transparent || (transparent && scrollY > 40);
      const bgStyle = gradient
        ? { background: `linear-gradient(to bottom, rgba(44,24,16,${Math.min(scrollY/80, 0.8)}), transparent)` }
        : isSolid
          ? { background: dark ? deepBrown : creamLight, boxShadow: scrollY > 40 ? '0 1px 0 rgba(0,0,0,0.05)' : 'none' }
          : { background: 'transparent' };
      const textColor = dark ? textOnDark : textPrimary;
      const iconColor = dark ? cream : deepBrown;
      return (
        <div style={{
          position: 'absolute', top: 0, left: 0, right: 0, zIndex: 20,
          paddingTop: 54, paddingBottom: 12,
          transition: 'background 0.3s, box-shadow 0.3s',
          ...bgStyle,
        }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: 32, paddingRight: 110 }}>
            {onBack && (
              <button onClick={onBack} style={{
                position: 'absolute', left: 16, top: 54, height: 32, width: 32,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                background: 'transparent', border: 'none', cursor: 'pointer', padding: 0,
              }}>

    /* ===================== TAB BAR ===================== */
    function TabBar({ active, onChange, items }) {
      return (
        <div style={{
          position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 25,
          height: 86, paddingTop: 6, paddingBottom: 28,
          background: 'rgba(250,243,231,0.95)',
          backdropFilter: 'blur(20px)',
          WebkitBackdropFilter: 'blur(20px)',
          borderTop: `0.5px solid ${creamDark}`,
          display: 'flex',
        }}>
          {items.map((item, i) => {
            const isActive = active === item.key;
            return (
              <button
                key={item.key}
                onClick={() => onChange(item.key)}
                style={{
                  flex: 1, display: 'flex', flexDirection: 'column',
                  alignItems: 'center', justifyContent: 'center',
                  gap: 3, background: 'transparent', border: 'none', cursor: 'pointer',
                  padding: 0,
                }}
              >
                <div style={{
                  transform: isActive ? 'scale(1.08)' : 'scale(1)',
                  transition: 'transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1)',
                  position: 'relative',
                }}>
                  {item.icon(isActive ? coffeeBrown : textTertiary)}
                  {isActive && (
                    <div style={{
                      position: 'absolute', bottom: -6, left: '50%', transform: 'translateX(-50%)',
                      width: 4, height: 4, borderRadius: '50%',
                      background: caramel,
                      animation: 'tabDot 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)',

                  )}

                <span style={{
                  fontSize: 10, fontWeight: isActive ? 600 : 400,
                  color: isActive ? coffeeBrown : textTertiary,
                  transition: 'all 0.2s',
                }}>{item.label}</span>
              </button>
            );
          })}
        </div>
      );
    }

    /* ===================== ACTION SHEET ===================== */
    function ActionSheet({ visible, title, items, onSelect, onClose }) {
      if (!visible) return null;
      return (
        <div style={{
          position: 'absolute', inset: 0, zIndex: 100,
          background: 'rgba(0,0,0,0.4)',
          animation: 'fadeIn 0.25s ease',
          display: 'flex', alignItems: 'flex-end',
        }} onClick={onClose}>
          <div
            onClick={e => e.stopPropagation()}
            style={{
              width: '100%',
              background: creamLight,
              borderTopLeftRadius: 16, borderTopRightRadius: 16,
              padding: '6px 0 30px',
              animation: 'slideUp 0.35s cubic-bezier(0.32, 0.72, 0, 1)',
            }}
          >
            <div style={{
              width: 36, height: 4, borderRadius: 2,
              background: creamDark, margin: '0 auto 10px',
            }} />
            {title && (
              <div style={{
                textAlign: 'center', padding: '8px 0 12px',
                fontSize: 13, color: textTertiary,
              }}>{title}</div>
            )}
            {items.map((item, i) => (
              <div key={i} onClick={() => { onSelect(item); onClose(); }} style={{
                padding: '16px 20px', textAlign: 'center',
                fontSize: 16, color: item.danger ? brickRed : textPrimary,
                borderTop: i === 0 ? 'none' : `0.5px solid ${creamDark}`,
                cursor: 'pointer',
              }}>

              </div>
            ))}
            <div style={{ height: 8, background: creamDark }} />

              fontSize: 16, color: textSecondary, fontWeight: 500,
              cursor: 'pointer',
            }}>取消</div>
          </div>
        </div>
      );
    }

    /* ===================== PULL TO REFRESH (scroll container) ===================== */
    function ScrollPage({ children, onRefresh, scrollRef, className }) {
      const containerRef = useRef(null);
      const [pullDist, setPullDist] = useState(0);
      const [refreshing, setRefreshing] = useState(false);
      const startY = useRef(0);
      const pulling = useRef(false);

      const handleTouchStart = (e) => {
        const el = containerRef.current;
        if (el && el.scrollTop <= 0) {
          startY.current = e.touches[0].clientY;
          pulling.current = true;
        }
      };

      const handleTouchMove = (e) => {
        if (!pulling.current) return;
        const dy = e.touches[0].clientY - startY.current;
        if (dy > 0) {
          const damped = Math.min(dy * 0.5, 80);
          setPullDist(damped);
        }
      };

      const handleTouchEnd = () => {
        if (!pulling.current) return;
        pulling.current = false;
        if (pullDist > 50 && onRefresh && !refreshing) {
          setRefreshing(true);
          setPullDist(60);
          setTimeout(() => {
            setRefreshing(false);
            setPullDist(0);
            onRefresh && onRefresh();
          }, 1200);
        } else {
          setPullDist(0);
        }
      };

      return (
        <div
          ref={containerRef}
          onTouchStart={handleTouchStart}
          onTouchMove={handleTouchMove}
          onTouchEnd={handleTouchEnd}
          className={className}
          style={{
            height: '100%',
            overflowY: 'auto',
            overflowX: 'hidden',
            WebkitOverflowScrolling: 'touch',
            position: 'relative',
          }}
        >
          <div style={{
            height: pullDist,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            overflow: 'hidden',
            transition: refreshing ? 'none' : 'height 0.3s',
          }}>
            <div style={{
              display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6,
              color: textSecondary, fontSize: 12,
            }}>
              <div style={{
                width: 20, height: 20,
                border: `2px solid ${creamDark}`,
                borderTopColor: caramel,
                borderRadius: '50%',
                animation: refreshing ? 'spin 0.8s linear infinite' : 'none',
                transform: pullDist > 50 ? 'rotate(180deg)' : 'rotate(0deg)',
                transition: 'transform 0.3s',
              }} />
              <span>{refreshing ? '更新中...' : pullDist > 50 ? '松手刷新' : '下拉刷新'}</span>
            </div>
          </div>
          <div ref={scrollRef}>{children}</div>
        </div>
      );
    }

    /* ===================== SKELETON LOADER ===================== */
    function Skeleton({ width, height, round = false }) {
      return (
        <div style={{
          width, height,
          borderRadius: round ? '50%' : 6,
          background: `linear-gradient(90deg, ${creamDark} 25%, ${creamLight} 50%, ${creamDark} 75%)`,
          backgroundSize: '200% 100%',
          animation: 'shimmer 1.5s infinite',
        }} />
      );
    }

    /* ===================== PAGE TRANSITION WRAPPER ===================== */
    function PageTransition({ children, direction = 'forward', visible }) {
      const animStyle = {
        transform: visible ? 'translateX(0)' : direction === 'forward' ? 'translateX(30%)' : 'translateX(-30%)',
        opacity: visible ? 1 : 0,
        transition: 'transform 0.35s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.3s',
      };
      return (
        <div style={{ position: 'absolute', inset: 0, ...animStyle }}>
          {children}
        </div>
      );
    }

      return (

          {Array.from({ length: count }).map((_, i) => (

              animation: `steamRise 2.5s ease-in-out infinite`,
              animationDelay: `${i * 0.4}s`,
              transformOrigin: 'bottom',
            }} />

        </div>
      );
    }

            }} />
            <div style={{ flex: 1, overflowY: 'auto' }}>
              {/* 顶部大图区 */}
              <div style={{
                height: 200,
                background: `linear-gradient(135deg, ${deepBrown}, ${coffeeBrown})`,
                position: 'relative',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
              }}>
                <BeanFloaters />
                <div style={{ fontSize: 80, opacity: 0.2 }}>●</div>
                <button onClick={onClose} style={{
                  position: 'absolute', top: 12, right: 16,
                  width: 32, height: 32, borderRadius: '50%',
                  background: 'rgba(255,255,255,0.2)',
                  border: 'none', cursor: 'pointer',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  zIndex: 10,
                }}>
                  {Icon.close(cream)}
                </button>
              </div>
              <div style={{ padding: 20 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 8 }}>
                  <div>
                    <span style={{
                      fontSize: 11, padding: '3px 8px', borderRadius: 6,
                      background: `${caramel}20`, color: caramelDark,
                      marginRight: 6,
                    }}>{bean.roast}</span>
                    <span style={{
                      fontSize: 11, padding: '3px 8px', borderRadius: 6,
                      background: `${brickRed}15`, color: brickRed,
                    }}>新品</span>
                  </div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 3 }}>
                    {Icon.star(gold)}
                    <span style={{ fontSize: 13, fontWeight: 600, color: textPrimary }}>{bean.rating}</span>
                  </div>
                </div>
                <h2 style={{
                  fontFamily: '"Noto Serif SC", serif',
                  fontSize: 24, fontWeight: 600, color: textPrimary,
                  marginBottom: 4,
                }}>{bean.name}</h2>
                <p style={{ fontSize: 13, color: textSecondary, marginBottom: 16 }}>{bean.origin} · {bean.process}</p>
                <div style={{
                  background: '#fff', borderRadius: 12, padding: 14,
                  marginBottom: 16,
                }}>
                  <div style={{ fontSize: 12, color: textTertiary, marginBottom: 8 }}>风味描述</div>
                  <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                    {bean.flavor.split('·').map(f => (
                      <span key={f} style={{
                        padding: '5px 12px', borderRadius: 12,
                        background: creamLight, fontSize: 12, color: textPrimary,
                      }}>{f}</span>
                    ))}
                  </div>
                </div>
                <div style={{
                  background: '#fff', borderRadius: 12, padding: 14,
                  marginBottom: 16,
                }}>
                  <div style={{ fontSize: 12, color: textTertiary, marginBottom: 10 }}>烘焙度</div>
                  <div style={{
                    display: 'flex', justifyContent: 'space-between',
                    alignItems: 'center',
                  }}>
                    {['浅', '中浅', '中', '中深', '深'].map((lvl, i) => (
                      <div key={lvl} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6 }}>
                        <div style={{
                          width: 20, height: 20, borderRadius: '50%',
                          background: i < bean.roastLevel ? coffeeBrown : creamDark,
                          transition: 'background 0.3s',
                        }} />
                        <span style={{ fontSize: 10, color: i === bean.roastLevel - 1 ? textPrimary : textTertiary }}>{lvl}</span>
                      </div>
                    ))}
                  </div>
                </div>
                <div style={{
                  background: '#fff', borderRadius: 12, padding: 14,
                  marginBottom: 20,
                }}>
                  <div style={{ fontSize: 12, color: textTertiary, marginBottom: 8 }}>冲煮建议</div>
                  <p style={{ fontSize: 13, color: textSecondary, lineHeight: 1.7 }}>
                    推荐使用 V60 手冲，粉水比 1:15，水温 92°C，研磨度中细。闷蒸 30 秒后分三段注水，总时长 2 分 30 秒。花果调性突出，适合冷萃也有惊喜表现。
                  </p>
                </div>
              </div>
            </div>
            {/* 底部吸底操作栏 */}
            <div style={{
              padding: '12px 16px 28px',
              background: '#fff',
              borderTop: `0.5px solid ${creamDark}`,
              display: 'flex', alignItems: 'center', gap: 12,
              flexShrink: 0,
            }}>
              <div style={{
                width: 36, height: 36, borderRadius: '50%',
                background: creamLight,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                cursor: 'pointer',
              }}>
                {Icon.heart(textTertiary)}
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 20, fontWeight: 700, color: brickRed, fontFamily: '"Noto Serif SC", serif' }}>
                  ¥{bean.price}
                </div>
                <div style={{ fontSize: 10, color: textTertiary }}>227g / 半磅装</div>
              </div>
              <button style={{
                padding: '10px 20px', borderRadius: 20,
                background: caramel, color: deepBrown,
                fontSize: 13, fontWeight: 600, border: 'none',
                cursor: 'pointer',
              }}>加入购物袋</button>
              <button style={{
                padding: '10px 20px', borderRadius: 20,
                background: deepBrown, color: cream,
                fontSize: 13, fontWeight: 600, border: 'none',
                cursor: 'pointer',
              }}>立即购买</button>
            </div>
          </div>
        </div>
      );
    }

    /* ===================== MAIN APP ===================== */
    function App() {
      const [tab, setTab] = useState('home');
      const [scrollY, setScrollY] = useState(0);
      const [actionSheetVisible, setActionSheetVisible] = useState(false);
      const [selectedBean, setSelectedBean] = useState(null);
      const [beanDetailVisible, setBeanDetailVisible] = useState(false);
      const [secondaryPage, setSecondaryPage] = useState(null); // 'specs' | 'api'
      const [pageDirection, setPageDirection] = useState('forward');
      const reduced = useReducedMotion();

      const tabItems = [
        { key: 'home', label: '首页', icon: Icon.home },
        { key: 'beans', label: '豆单', icon: Icon.bean },
        { key: 'roast', label: '烘焙', icon: Icon.roast },
        { key: 'brew', label: '冲煮', icon: Icon.cup },
        { key: 'member', label: '我的', icon: Icon.user },
      ];

      const handleTabChange = (key) => {
        if (key === tab) return;
        const currentIndex = tabItems.findIndex(t => t.key === tab);
        const newIndex = tabItems.findIndex(t => t.key === key);
        setPageDirection(newIndex > currentIndex ? 'forward' : 'back');
        setTab(key);
        setSecondaryPage(null);
      };

      const handleNavigate = (key) => {
        if (tabItems.find(t => t.key === key)) {
          handleTabChange(key);
        } else if (key === 'specs') {
          setPageDirection('forward');
          setSecondaryPage('specs');
        } else if (key === 'api') {
          setPageDirection('forward');
          setSecondaryPage('api');
        }
      };

      const handleSelectBean = (bean) => {
        setSelectedBean(bean);
        setBeanDetailVisible(true);
      };

      const handleBack = () => {
        setPageDirection('back');
        setSecondaryPage(null);
      };

      const renderPage = () => {
        if (secondaryPage === 'specs') {
          return <SpecsPage onBack={handleBack} />;
        }
        if (secondaryPage === 'api') {
          return <ApiPage onBack={handleBack} />;
        }
        switch (tab) {
          case 'home':
            return <HomePage onNavigate={handleNavigate} scrollY={scrollY} setScrollY={setScrollY} />;
          case 'beans':
            return <BeansPage onNavigate={handleNavigate} onSelectBean={handleSelectBean} />;
          case 'roast':
            return <RoastPage />;
          case 'brew':
            return <BrewPage />;
          case 'events':
            return <EventsPage />;
          case 'member':
            return <MemberPage />;
          default:
            return <HomePage onNavigate={handleNavigate} scrollY={scrollY} setScrollY={setScrollY} />;
        }
      };

      // Nav bar config per page
      const navConfig = {
        home: { title: '', transparent: true, gradient: true, dark: true, show: false },
        beans: { title: '咖啡豆单', transparent: false, dark: false, show: true },
        roast: { title: '烘焙工坊', transparent: false, dark: false, show: true },
        brew: { title: '冲煮指南', transparent: false, dark: false, show: true },
        events: { title: '杯测活动', transparent: false, dark: false, show: true },
        member: { title: '我的', transparent: true, dark: true, show: false },
      };

      const currentPageKey = secondaryPage || tab;
      const currentNav = navConfig[tab] || navConfig.home;
      const isSecondary = !!secondaryPage;

      return (
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 20 }}>
          {/* Phone frame */}
          <div style={{
            width: 390, height: 844, borderRadius: 52, overflow: 'hidden',
            position: 'relative', background: creamLight,
            border: '10px solid #1a0f08',
            boxShadow: '0 20px 60px rgba(0,0,0,0.5), inset 0 0 1px rgba(255,255,255,0.1)',
            fontFamily: '"Noto Sans SC", -apple-system, system-ui, sans-serif',
          }}>
            {/* Dynamic island */}
            <div style={{
              position: 'absolute', top: 12, left: '50%', transform: 'translateX(-50%)',
              width: 110, height: 34, borderRadius: 20, background: '#000',
              zIndex: 50,
            }} />

            {/* Status bar */}
            <div style={{
              position: 'absolute', top: 0, left: 0, right: 0, zIndex: 40,
              display: 'flex', justifyContent: 'space-between', alignItems: 'center',
              padding: '18px 28px 0',
              fontSize: 15, fontWeight: 600,
              color: currentNav.dark || isSecondary ? (isSecondary ? textPrimary : cream) : textPrimary,
              fontFamily: '-apple-system, system-ui',
            }}>
              <span>9:41</span>
              <div style={{ display: 'flex', gap: 5, alignItems: 'center' }}>
                {/* signal */}
                <svg width="17" height="11" viewBox="0 0 17 11">
                  <rect x="0" y="7" width="3" height="4" rx="0.5" fill="currentColor"/>
                  <rect x="5" y="4.5" width="3" height="6.5" rx="0.5" fill="currentColor"/>
                  <rect x="10" y="2" width="3" height="9" rx="0.5" fill="currentColor"/>
                  <rect x="14" y="0" width="3" height="11" rx="0.5" fill="currentColor"/>
                </svg>
                {/* wifi */}
                <svg width="15" height="11" viewBox="0 0 15 11">
                  <path d="M7.5 1.5c2.5 0 4.7 1 6.5 2.7L15.3 3C13.2 1 10.5 0 7.5 0S1.8 1 -0.3 3L1 4.2C2.8 2.5 5 1.5 7.5 1.5z" fill="currentColor"/>
                  <path d="M7.5 4.5c1.5 0 2.9.6 3.9 1.6L12.7 5c-1.4-1.4-3.3-2.2-5.2-2.2s-3.8.8-5.2 2.2L3.6 6.1C4.6 5.1 6 4.5 7.5 4.5z" fill="currentColor"/>
                  <path d="M7.5 7.5c.8 0 1.5.3 2.1.9l1.2-1.2c-1-.9-2.2-1.4-3.3-1.4s-2.3.5-3.3 1.4l1.2 1.2c.6-.6 1.3-.9 2.1-.9z" fill="currentColor"/>
                  <circle cx="7.5" cy="9.5" r="1.5" fill="currentColor"/>
                </svg>
                {/* battery */}
                <svg width="24" height="11" viewBox="0 0 24 11">
                  <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" strokeOpacity="0.35"/>
                  <rect x="2" y="2" width="18" height="7" rx="1.5" fill="currentColor"/>
                  <path d="M22.5 4v3c.8-.3 1.5-1 1.5-1.5s-.7-1.2-1.5-1.5z" fill="currentColor" fillOpacity="0.4"/>
                </svg>
              </div>
            </div>

            {/* Capsule button (WeChat mini program style) */}
            <MiniProgramCapsule
              dark={currentNav.dark && !isSecondary}
              onMore={() => setActionSheetVisible(true)}
              onMini={() => setActionSheetVisible(true)}
            />

            {/* Nav bar for secondary pages */}
            {isSecondary && (
              <NavBar
                title={secondaryPage === 'specs' ? '设计规范' : '接口文档'}
                onBack={handleBack}
                dark={false}
              />
            )}

            {/* Page content with transition */}
            <div style={{
              position: 'absolute', inset: 0,
              paddingBottom: tabItems.find(t => t.key === tab) ? 86 : 0,
            }}>
              <PageTransition direction={pageDirection} visible={true} key={currentPageKey}>
                {renderPage()}
              </PageTransition>
            </div>

            {/* Tab bar */}
            {!isSecondary && tabItems.find(t => t.key === tab) && (
              <TabBar active={tab} onChange={handleTabChange} items={tabItems} />
            )}

            {/* Action sheet */}
            <ActionSheet
              visible={actionSheetVisible}
              title="更多操作"
              items={[
                { label: '分享给朋友' },
                { label: '分享到朋友圈' },
                { label: '收藏' },
                { label: '查看设计规范', onClick: () => handleNavigate('specs') },
                { label: '查看接口文档', onClick: () => handleNavigate('api') },
                { label: '投诉与建议', danger: true },
              ]}
              onSelect={(item) => {
                if (item.onClick) item.onClick();
              }}
              onClose={() => setActionSheetVisible(false)}
            />

            {/* Bean detail bottom sheet */}
            <BeanDetail
              bean={selectedBean}
              visible={beanDetailVisible}
              onClose={() => setBeanDetailVisible(false)}
            />

            {/* Home indicator */}
            <div style={{
              position: 'absolute', bottom: 6, left: '50%',
              transform: 'translateX(-50%)',
              width: 134, height: 5, borderRadius: 3,
              background: 'rgba(0,0,0,0.3)',
              zIndex: 70,
            }} />
          </div>
        </div>
      );
    }

    /* ===================== GLOBAL STYLES via injected CSS ===================== */
    const styleSheet = document.createElement('style');
    styleSheet.textContent = `
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slideUp {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
      }
      @keyframes slideInRight {
        from { opacity: 0; transform: translateX(20px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.3); }
      }
      @keyframes steamRise {
        0% { transform: translateY(0) scaleX(1) scaleY(1); opacity: 0.6; }
        50% { transform: translateY(-10px) scaleX(1.2) scaleY(1.3); opacity: 0.4; }
        100% { transform: translateY(-20px) scaleX(0.8) scaleY(0.6); opacity: 0; }
      }
      @keyframes beanFloat {
        0% { transform: translateY(0) rotate(0deg); opacity: 0.2; }
        50% { transform: translateY(-60px) rotate(180deg); opacity: 0.4; }
        100% { transform: translateY(-120px) rotate(360deg); opacity: 0; }
      }
      @keyframes beanRotate {
        to { transform: rotate(360deg); }
      }
      @keyframes tabDot {
        from { transform: translateX(-50%) scale(0); opacity: 0; }
        to { transform: translateX(-50%) scale(1); opacity: 1; }
      }
      @keyframes fabBounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes expandDown {
        from { max-height: 0; opacity: 0; }
        to { max-height: 500px; opacity: 1; }
      }
      * { -webkit-tap-highlight-color: transparent; }
      ::-webkit-scrollbar { display: none; width: 0; height: 0; }
      @media (prefers-reduced-motion: reduce) {
        * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      }
    `;
    document.head.appendChild(styleSheet);

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // announce upgrade capability
    function announceUpgrade() {
      window.parent?.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    }
    announceUpgrade();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', announceUpgrade, { once: true });
    }
  </script>
</body>
</html>

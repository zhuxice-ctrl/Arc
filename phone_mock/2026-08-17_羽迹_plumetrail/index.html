/* ──────────────────────────────────────────────────────────────
   RIPPLE HELPER
   ────────────────────────────────────────────────────────────── */
function createRipple(e) {
  const btn = e.currentTarget;
  const rect = btn.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const size = Math.max(rect.width, rect.height);
  const wave = document.createElement('span');
  wave.className = 'ripple-wave';
  wave.style.width = wave.style.height = size + 'px';
  wave.style.left = x - size / 2 + 'px';
  wave.style.top = y - size / 2 + 'px';
  btn.appendChild(wave);
  setTimeout(() => wave.remove(), 600);
}

    }}>
      {TABS.map((tab) => {
        const isActive = active === tab.key;
        return (
          <div
            key={tab.key}
            className={'tab-item ripple-btn ' + (isActive ? 'active' : '')}
            style={{
              flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
              cursor: 'pointer', padding: '6px 0',
            }}
            onClick={(e) => { createRipple(e); onChange(tab.key); }}

              <div style={{
                width: 48, height: 48, borderRadius: '50%',
                background: 'linear-gradient(135deg, #D97E36, #C46928)',

              <Icon name={tab.icon} size={22} color={isActive ? '#22402F' : '#8CA08B'} stroke={isActive ? 2.5 : 2} />
            )}
            <span style={{
              fontSize: 10, marginTop: 2,
              color: isActive ? '#22402F' : '#8CA08B',
              fontWeight: isActive ? 600 : 400,
            }}>{tab.label}</span>
            <div className="tab-dot" />
          </div>

      <div
        className={'tab-item ripple-btn ' + (active === 'spec' || active === 'api' ? 'active' : '')}
        style={{
          flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',

/* ──────────────────────────────────────────────────────────────
   MAIN APP SHELL
   ────────────────────────────────────────────────────────────── */
function PlumeTrailApp() {
  const [tab, setTab] = useState('home');
  const [prevTab, setPrevTab] = useState('home');
  const [detailBird, setDetailBird] = useState(null);
  const [sightingSheet, setSightingSheet] = useState(null);
  const [pageKey, setPageKey] = useState(0);
  const [showDocsMenu, setShowDocsMenu] = useState(false);
  const [animClass, setAnimClass] = useState('page-enter');

  const changeTab = useCallback((newTab) => {
    if (newTab === tab) return;
    setPrevTab(tab);
    setTab(newTab);
    setDetailBird(null);
    setShowDocsMenu(false);
    setPageKey(k => k + 1);
    setAnimClass('page-enter');
  }, [tab]);

  const handleExtra = useCallback(() => {
    setShowDocsMenu(!showDocsMenu);
  }, [showDocsMenu]);

  const goToDoc = (which) => {
    setShowDocsMenu(false);
    setTab(which);
    setDetailBird(null);
    setPageKey(k => k + 1);
    setAnimClass('page-enter');
  };

  const handleBirdClick = (bird) => {
    setDetailBird(bird);
    setPageKey(k => k + 1);
    setAnimClass('page-enter');
  };

  const handleBackFromDetail = () => {
    setDetailBird(null);
    setPageKey(k => k + 1);
    setAnimClass('page-exit');
    setTimeout(() => setAnimClass('page-enter'), 280);
  };

  // Render current page content
  const renderPage = () => {
    if (detailBird) {
      return <BirdDetailPage key={pageKey} bird={detailBird} onBack={handleBackFromDetail} />;
    }
    switch (tab) {
      case 'home':
        return <HomePage key={pageKey} onBirdClick={handleBirdClick} onSightingClick={setSightingSheet} />;
      case 'map':
        return <MapPage key={pageKey} onBirdClick={handleBirdClick} />;
      case 'record':
        return <RecordPage key={pageKey} />;
      case 'field':
        return <FieldGuidePage key={pageKey} onBirdClick={handleBirdClick} />;
      case 'profile':
        return <ProfilePage key={pageKey} />;
      case 'spec':
        return <DesignSpecPage key={pageKey} />;
      case 'api':
        return <ApiDocPage key={pageKey} />;
      default:
        return null;
    }
  };

  const mainTabs = ['home', 'map', 'record', 'field', 'profile'].includes(tab);
  const showTabBar = !detailBird && mainTabs;

  return (
    <div className="app-screen">
      <div className={animClass} style={{ position: 'absolute', inset: 0 }}>
        {renderPage()}
      </div>

      {/* Floating action button on home */}
      {tab === 'home' && !detailBird && (
        <div
          className="fab-btn ripple-btn"
          onClick={(e) => { createRipple(e); changeTab('record'); }}
        >
          <Icon name="plus" size={24} color="#fff" stroke={2.5} />
        </div>
      )}

      {/* Tab bar */}
      {showTabBar && (
        <TabBar
          active={tab}
          onChange={changeTab}
          onExtraChange={handleExtra}
        />
      )}

      {/* Docs menu popover */}
      {showDocsMenu && (
        <>
          <div style={{ position: 'absolute', inset: 0, zIndex: 21 }} onClick={() => setShowDocsMenu(false)} />
          <div style={{
            position: 'absolute', right: 20, bottom: 'calc(var(--ios-safe-bottom, 34px) + 70px)',
            background: '#fff', borderRadius: 16,
            boxShadow: '0 12px 40px rgba(34,64,47,.2)',
            zIndex: 22, overflow: 'hidden',
            minWidth: 140,
            animation: 'fadeIn .2s ease',
          }}>
            {[
              { key: 'spec', label: '设计规范', icon: 'star' },
              { key: 'api', label: '接口文档', icon: 'settings' },
            ].map(item => (
              <div
                key={item.key}
                className="ripple-btn"
                style={{
                  padding: '14px 18px', display: 'flex', alignItems: 'center', gap: 10,
                  cursor: 'pointer', fontSize: 14, color: '#22402F', fontWeight: 500,
                  borderBottom: item.key === 'spec' ? '1px solid #E0E7DB' : 'none',
                }}
                onClick={(e) => { createRipple(e); goToDoc(item.key); }}
              >
                <Icon name={item.icon} size={16} color="#D97E36" />
                {item.label}
              </div>
            ))}
          </div>
        </>
      )}

      {/* Sighting bottom sheet */}
      {sightingSheet && (
        <SightingSheet sighting={sightingSheet} onClose={() => setSightingSheet(null)} />
      )}
    </div>
  );
}

/* ──────────────────────────────────────────────────────────────
   CUSTOM CURSOR CONTROLLER
   ────────────────────────────────────────────────────────────── */
function setupCustomCursor() {
  const cursor = document.getElementById('customCursor');
  if (!cursor) return;

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let cursorX = mouseX;
  let cursorY = mouseY;
  let rafId = null;
  let visible = false;
  let isReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (isReduced) {
    cursor.style.display = 'none';
    return;
  }

  const animate = () => {
    if (document.hidden) { rafId = null; return; }
    // Spring-like follow
    cursorX += (mouseX - cursorX) * 0.18;
    cursorY += (mouseY - cursorY) * 0.18;
    cursor.style.left = cursorX + 'px';
    cursor.style.top = cursorY + 'px';
    rafId = requestAnimationFrame(animate);
  };

  const startAnim = () => {
    if (!rafId && !document.hidden) {
      rafId = requestAnimationFrame(animate);
    }
  };

  const stopAnim = () => {
    if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  };

  // Initialize at center
  cursor.style.left = mouseX + 'px';
  cursor.style.top = mouseY + 'px';
  cursor.style.opacity = '0';

  const handleMove = (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    if (!visible) {
      visible = true;
      cursor.style.opacity = '1';
    }
    startAnim();
  };

  const handleClick = () => {
    cursor.classList.remove('click');
    void cursor.offsetWidth; // reflow
    cursor.classList.add('click');
  };

  const handleOver = (e) => {
    const target = e.target.closest('button, a, [role="button"], .card-paper, .ripple-btn, .fab-btn, .tab-item, .tilt-card');
    if (target) {
      cursor.classList.add('hover');
    }
  };

  const handleOut = (e) => {
    const target = e.target.closest('button, a, [role="button"], .card-paper, .ripple-btn, .fab-btn, .tab-item, .tilt-card');
    if (target) {
      cursor.classList.remove('hover');
    }
  };

  // Visibility change handling
  const handleVisibility = () => {
    if (document.hidden) {
      stopAnim();
    } else {
      startAnim();
    }
  };

  window.addEventListener('mousemove', handleMove);
  window.addEventListener('click', handleClick);
  document.addEventListener('mouseover', handleOver);
  document.addEventListener('mouseout', handleOut);
  document.addEventListener('visibilitychange', handleVisibility);

  // Start immediately
  startAnim();

  // Cleanup store for potential unmount
  window.__cursorCleanup = () => {
    stopAnim();
    window.removeEventListener('mousemove', handleMove);
    window.removeEventListener('click', handleClick);
    document.removeEventListener('mouseover', handleOver);
    document.removeEventListener('mouseout', handleOut);
    document.removeEventListener('visibilitychange', handleVisibility);
  };
}

// Announce upgrade capability
function announceUpgrade() {
  try {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  } catch (e) {}
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}

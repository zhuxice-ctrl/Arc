<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="creative-medium" content="interactive-prototype">
  <title>骑迹 VeloRoute · 原生 App</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    /* ============================================================
       VeloRoute · 骑迹 — 原生 App V2
       形态：原生 App
       主配色：信号橙 #E8622C / 沥青深灰 #23252A / 荧光黄 #E8F04A / 暖白 #F7F5F0 / 石灰绿 #7A8B6F
       ============================================================ */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%;
      font-family: 'Inter', -apple-system, 'SF Pro', system-ui, sans-serif;
      background: #1A1B1F;
      color: #23252A;
      overflow: hidden;
    }

    /* --- Canvas / Showcase background --- */
    .showcase {
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(232,98,44,0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(232,240,74,0.08) 0%, transparent 50%),
        #141518;
      position: relative;
    }

    .showcase-title {
      position: absolute; top: 32px; left: 48px;
      color: #F7F5F0;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.6;
    }
    .showcase-title .accent { color: #E8622C; opacity: 1; }

    .showcase-meta {
      position: absolute; top: 32px; right: 48px;
      color: #F7F5F0;
      font-size: 12px;
      opacity: 0.5;
      font-family: 'JetBrains Mono', monospace;
    }

    .device-wrapper {
      position: relative;
      transform: scale(1);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .device-wrapper:hover { transform: scale(1.02); }

    /* --- Custom Cursor --- */
    .custom-cursor {
      position: fixed;
      width: 40px; height: 40px;
      border: 2px solid #F7F5F0;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s, border-color 0.2s, background 0.2s;
      mix-blend-mode: difference;
      opacity: 0.9;
    }
    .custom-cursor .cursor-dot {
      position: absolute;
      top: 50%; left: 50%;
      width: 8px; height: 8px;
      background: #E8622C;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 12px rgba(232,98,44,0.8), 0 0 24px rgba(232,98,44,0.4);
    }
    .custom-cursor.hover {
      width: 60px; height: 60px;
      border-color: #E8F04A;
      background: rgba(232,240,74,0.15);
    }
    .cursor-ripple {
      position: fixed;
      border-radius: 50%;
      background: rgba(232,98,44,0.4);
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%) scale(0);
      animation: rippleExpand 0.6s ease-out forwards;
    }
    @keyframes rippleExpand {
      to { transform: translate(-50%, -50%) scale(3); opacity: 0; }
    }

    /* --- Typography utilities --- */
    .font-display { font-family: 'Space Grotesk', sans-serif; font-weight: 700; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .text-warm { color: #F7F5F0; }
    .text-asphalt { color: #23252A; }
    .text-orange { color: #E8622C; }
    .text-fluoro { color: #E8F04A; }
    .text-sage { color: #7A8B6F; }

    /* === iOS Frame overrides === */
    .velo-app {
      width: 100%; height: 100%;
      background: #F7F5F0;
      position: relative;
      overflow: hidden;
    }

    /* Screen transition */
    .screen {
      position: absolute; inset: 0;
      transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.3s;
      will-change: transform;
    }
    .screen.enter-right { transform: translateX(100%); }
    .screen.enter-left { transform: translateX(-100%); }
    .screen.active { transform: translateX(0); }
    .screen.exit-left { transform: translateX(-30%); opacity: 0.7; }
    .screen.exit-right { transform: translateX(30%); opacity: 0.7; }

    /* TabBar */
    .tabbar {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: calc(83px + var(--ios-safe-bottom, 34px));
      padding-bottom: var(--ios-safe-bottom, 34px);
      background: rgba(247,245,240,0.85);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-top: 0.5px solid rgba(35,37,42,0.1);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 40;
    }
    .tabbar.dark {
      background: rgba(35,37,42,0.85);
      border-top: 0.5px solid rgba(247,245,240,0.1);
    }
    .tab-item {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 4px;
      padding: 8px 0;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .tab-item:active { transform: scale(0.85); }
    .tab-item svg { transition: all 0.3s; }
    .tab-item .tab-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
    .tab-item.active svg { stroke: #E8622C; color: #E8622C; }
    .tab-item.dark .tab-label { color: rgba(247,245,240,0.6); }
    .tab-item.dark.active .tab-label { color: #E8622C; }
    .tab-item .tab-label { color: rgba(35,37,42,0.5); }
    .tab-item.active .tab-label { color: #E8622C; font-weight: 600; }
    .tab-center-btn {
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      width: 56px; height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #E8622C 0%, #F08A3E 100%);
      box-shadow: 0 6px 20px rgba(232,98,44,0.5), 0 2px 6px rgba(232,98,44,0.3);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      z-index: 5;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
    }
    .tab-center-btn:hover {
      transform: translateX(-50%) scale(1.08);
      box-shadow: 0 8px 28px rgba(232,98,44,0.6), 0 3px 10px rgba(232,98,44,0.4);
    }
    .tab-center-btn:active { transform: translateX(-50%) scale(0.92); }

    /* Scroll container */
    .scroll-wrap {
      position: absolute; inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .scroll-wrap::-webkit-scrollbar { display: none; }

    /* === HOME / DISCOVER PAGE === */
    .home-hero {
      position: relative;
      height: 340px;
      background: linear-gradient(180deg, #23252A 0%, #3A3D44 100%);
      overflow: hidden;
    }
    .home-hero::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 70% 30%, rgba(232,98,44,0.3) 0%, transparent 50%),
        radial-gradient(ellipse at 20% 80%, rgba(232,240,74,0.15) 0%, transparent 40%);
    }
    .home-hero-content {
      position: relative;
      padding: calc(var(--ios-safe-top, 62px) + 16px) 20px 0;
      color: #F7F5F0;
    }
    .hero-greeting {
      font-size: 13px;
      opacity: 0.6;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    .hero-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 16px;
    }
    .hero-title .highlight {
      background: linear-gradient(90deg, #E8F04A, #E8622C);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-search {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 20px;
    }
    .hero-search input {
      flex: 1;
      background: none; border: none; outline: none;
      color: #F7F5F0;
      font-size: 15px;
      font-family: inherit;
    }
    .hero-search input::placeholder { color: rgba(247,245,240,0.5); }

    .hero-stats {
      display: flex; gap: 12px;
    }
    .hero-stat {
      flex: 1;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .hero-stat-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #E8F04A;
    }
    .hero-stat-label {
      font-size: 10px;
      opacity: 0.6;
      margin-top: 2px;
    }

    /* Category pills */
    .categories {
      display: flex; gap: 8px;
      padding: 16px 20px 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }
    .cat-pill {
      flex-shrink: 0;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      background: #ECEAE4;
      color: #23252A;
      cursor: pointer;
      transition: all 0.25s;
      white-space: nowrap;
    }
    .cat-pill.active {
      background: #23252A;
      color: #F7F5F0;
      transform: scale(1.02);
    }

    /* Route cards */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 20px 12px;
    }
    .section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #23252A;
    }
    .section-more {
      font-size: 13px;
      color: #E8622C;
      font-weight: 500;
      cursor: pointer;
    }

    .route-card {
      margin: 0 20px 16px;
      border-radius: 20px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 4px 20px rgba(35,37,42,0.08);
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
      position: relative;
    }
    .route-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(35,37,42,0.12);
    }
    .route-card:active { transform: scale(0.98); }
    .route-card-image {
      height: 160px;
      position: relative;
      overflow: hidden;
    }
    .route-card-image::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.4) 100%);
    }
    .route-card-badge {
      position: absolute;
      top: 12px; left: 12px;
      background: rgba(232,240,74,0.95);
      color: #23252A;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      z-index: 2;
      font-family: 'JetBrains Mono', monospace;
    }
    .route-card-diff {
      position: absolute;
      top: 12px; right: 12px;
      background: rgba(35,37,42,0.7);
      backdrop-filter: blur(10px);
      color: #F7F5F0;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      z-index: 2;
    }
    .route-card-body {
      padding: 14px 16px 16px;
    }
    .route-card-name {
      font-size: 16px;
      font-weight: 600;
      color: #23252A;
      margin-bottom: 6px;
    }
    .route-card-meta {
      display: flex; gap: 14px;
      font-size: 12px;
      color: rgba(35,37,42,0.6);
    }
    .route-card-meta span {
      display: flex; align-items: center; gap: 4px;
    }

    /* === ROUTE DETAIL PAGE === */
    .detail-page {
      background: #23252A;
      color: #F7F5F0;
    }
    .detail-hero {
      position: relative;
      height: 320px;
      overflow: hidden;
    }
    .detail-hero-bg {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, #3A3D44 0%, #23252A 100%);
    }
    .detail-hero-bg::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 30% 40%, rgba(232,98,44,0.4) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 70%, rgba(232,240,74,0.2) 0%, transparent 40%);
    }
    .detail-nav {
      position: absolute;
      top: calc(var(--ios-safe-top, 62px) + 12px);
      left: 0; right: 0;
      display: flex; justify-content: space-between;
      padding: 0 16px;
      z-index: 10;
    }
    .nav-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.25); }
    .nav-actions { display: flex; gap: 10px; }

    .detail-title-section {
      padding: 20px 20px 0;
    }
    .detail-route-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 8px;
    }
    .detail-route-loc {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 16px;
      display: flex; align-items: center; gap: 6px;
    }

    .detail-stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 0 20px 20px;
    }
    .detail-stat {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 14px 12px;
      text-align: center;
    }
    .detail-stat-val {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #E8F04A;
      line-height: 1;
      margin-bottom: 4px;
    }
    .detail-stat-lbl {
      font-size: 10px;
      opacity: 0.6;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .detail-section {
      padding: 20px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .detail-section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .detail-desc {
      font-size: 14px;
      line-height: 1.6;
      opacity: 0.8;
    }

    .elevation-chart {
      height: 100px;
      position: relative;
      margin-top: 12px;
    }
    .elevation-bg {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(232,98,44,0.2) 0%, transparent 100%);
      clip-path: polygon(0% 100%, 10% 60%, 25% 70%, 40% 30%, 55% 45%, 70% 20%, 85% 35%, 100% 10%, 100% 100%);
    }
    .elevation-line {
      position: absolute; inset: 0;
      stroke: #E8622C;
      stroke-width: 2;
      fill: none;
    }

    /* Action buttons at bottom */
    .detail-action-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 16px 20px calc(16px + var(--ios-safe-bottom, 34px));
      background: linear-gradient(180deg, transparent 0%, #23252A 30%);
      display: flex; gap: 12px;
      z-index: 20;
    }
    .action-btn {
      flex: 1;
      height: 52px;
      border-radius: 26px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.25s;
    }
    .action-btn.primary {
      background: linear-gradient(135deg, #E8622C, #F08A3E);
      color: #fff;
      box-shadow: 0 4px 16px rgba(232,98,44,0.4);
    }
    .action-btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(232,98,44,0.5);
    }
    .action-btn.primary:active { transform: scale(0.96); }
    .action-btn.secondary {
      background: rgba(255,255,255,0.1);
      color: #F7F5F0;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .action-btn.secondary:hover { background: rgba(255,255,255,0.18); }

    /* === RIDE RECORD PAGE === */
    .ride-page {
      background: #23252A;
      color: #F7F5F0;
      position: relative;
    }
    .ride-header {
      padding: calc(var(--ios-safe-top, 62px) + 16px) 20px 0;
      text-align: center;
    }
    .ride-page-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .ride-subtitle {
      font-size: 12px;
      opacity: 0.5;
      margin-top: 4px;
    }

    .ride-timer {
      text-align: center;
      margin: 24px 0;
    }
    .ride-timer-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -2px;
      color: #E8F04A;
      text-shadow: 0 0 40px rgba(232,240,74,0.3);
    }
    .ride-timer-ms {
      font-size: 32px;
      opacity: 0.7;
    }
    .ride-timer-label {
      font-size: 11px;
      opacity: 0.5;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .ride-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 20px;
    }
    .ride-stat-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }
    .ride-stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: #E8622C;
    }
    .ride-stat-card.speed::before { background: #E8F04A; }
    .ride-stat-card.cal::before { background: #E8622C; }
    .ride-stat-card.elev::before { background: #7A8B6F; }
    .ride-stat-card.cad::before { background: #E8F04A; }
    .ride-stat-card.heart::before { background: #E8622C; }

    .ride-stat-label {
      font-size: 11px;
      opacity: 0.5;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .ride-stat-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
    }
    .ride-stat-unit {
      font-size: 13px;
      opacity: 0.6;
      margin-left: 4px;
      font-weight: 400;
    }

    .ride-controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 28px 20px calc(20px + var(--ios-safe-bottom, 34px));
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(180deg, transparent 0%, #23252A 40%);
    }
    .ride-btn {
      width: 64px; height: 64px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: none;
    }
    .ride-btn:hover { transform: scale(1.1); }
    .ride-btn:active { transform: scale(0.9); }
    .ride-btn.lap {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: #F7F5F0;
    }
    .ride-btn.play-pause {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #E8622C, #F08A3E);
      box-shadow: 0 6px 24px rgba(232,98,44,0.5);
    }
    .ride-btn.play-pause.paused {
      background: linear-gradient(135deg, #7A8B6F, #8FA083);
      box-shadow: 0 6px 24px rgba(122,139,111,0.5);
    }
    .ride-btn.stop {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: #F7F5F0;
    }

    .ride-map-mini {
      height: 120px;
      margin: 16px 20px;
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      position: relative;
      overflow: hidden;
    }
    .ride-map-route {
      position: absolute; inset: 0;
      stroke: #E8F04A;
      stroke-width: 2.5;
      fill: none;
      filter: drop-shadow(0 0 4px rgba(232,240,74,0.5));
    }

    /* === COMMUNITY PAGE === */
    .community-page { background: #F7F5F0; }
    .community-header {
      padding: calc(var(--ios-safe-top, 62px) + 12px) 20px 8px;
      display: flex; justify-content: space-between; align-items: center;
      background: #F7F5F0;
    }
    .community-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
    }
    .community-plus {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #23252A;
      color: #F7F5F0;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

  // ============================================================
  // CUSTOM CURSOR (DOM-based, no React re-render per frame)
  // ============================================================
  function initCustomCursor() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cursor = document.createElement('div');
    cursor.className = 'custom-cursor';
    cursor.innerHTML = '<div class="cursor-dot"></div>';
    document.body.appendChild(cursor);

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let cursorX = mouseX;
    let cursorY = mouseY;
    let rafId = null;
    let isVisible = true;

    // initial position at screen center
    cursor.style.left = mouseX + 'px';
    cursor.style.top = mouseY + 'px';

    function animate() {
      if (!isVisible) { rafId = null; return; }
      cursorX += (mouseX - cursorX) * 0.15;
      cursorY += (mouseY - cursorY) * 0.15;
      cursor.style.transform = `translate(${cursorX}px, ${cursorY}px) translate(-50%, -50%)`;
      rafId = requestAnimationFrame(animate);
    }

    function onMove(e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
      if (!rafId && isVisible) rafId = requestAnimationFrame(animate);
    }

    function onClick(e) {
      const ripple = document.createElement('div');
      ripple.className = 'cursor-ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      ripple.style.width = '10px';
      ripple.style.height = '10px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    }

    function onOver(e) {
      const t = e.target.closest('button, .tab-item, .route-card, .feed-card, .cat-pill, .nav-btn, .action-btn, .ride-btn, .profile-action-btn, .profile-list-row, .ds-btn, .api-tab, .community-tab, .section-more, .tab-center-btn, .community-plus');
      if (t) cursor.classList.add('hover');
    }
    function onOut(e) {
      const t = e.target.closest('button, .tab-item, .route-card, .feed-card, .cat-pill, .nav-btn, .action-btn, .ride-btn, .profile-action-btn, .profile-list-row, .ds-btn, .api-tab, .community-tab, .section-more, .tab-center-btn, .community-plus');
      if (t) cursor.classList.remove('hover');
    }

    function onVisibility() {
      if (document.hidden) {
        isVisible = false;
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      } else {
        isVisible = true;
        if (!rafId) rafId = requestAnimationFrame(animate);
      }
    }

    window.addEventListener('mousemove', onMove);
    window.addEventListener('click', onClick);
    window.addEventListener('mouseover', onOver);
    window.addEventListener('mouseout', onOut);
    document.addEventListener('visibilitychange', onVisibility);

    window.__cleanupCursor = function() {
      isVisible = false;
      if (rafId) cancelAnimationFrame(rafId);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('click', onClick);
      window.removeEventListener('mouseover', onOver);
      window.removeEventListener('mouseout', onOut);
      document.removeEventListener('visibilitychange', onVisibility);
      cursor.remove();
    };
  }

  // ============================================================
  // NUMBER COUNTER HOOK (DOM-based)
  // ============================================================
  function useCountUp(target, duration = 1500, startDelay = 0) {
    const ref = useRef(null);
    useEffect(() => {
      const el = ref.current;
      if (!el) return;
      let raf = null;
      let timeoutId = null;

      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduced) {
        el.textContent = target;
        return;
      }

      timeoutId = setTimeout(() => {
        const startTime = performance.now();
        const startVal = 0;
        function tick(now) {
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          const val = startVal + (target - startVal) * eased;
          el.textContent = Number.isInteger(target) ? Math.round(val) : val.toFixed(1);
          if (progress < 1) raf = requestAnimationFrame(tick);
          else el.textContent = target;
        }
        raf = requestAnimationFrame(tick);
      }, startDelay);

      return () => {
        if (raf) cancelAnimationFrame(raf);
        if (timeoutId) clearTimeout(timeoutId);
      };
    }, [target, duration, startDelay]);
    return ref;
  }

  // ---- RIDE RECORD ----
  function RideRecordPage() {
    const [isRunning, setIsRunning] = useState(true);
    const [time, setTime] = useState(0);
    const [distance, setDistance] = useState(0);
    const [speed, setSpeed] = useState(0);
    const rafRef = useRef(null);
    const startTimeRef = useRef(null);
    const isVisibleRef = useRef(true);

    useEffect(() => {
      startTimeRef.current = performance.now() - 4523000; // start at ~1:15:23
      let prevTime = performance.now();

      function tick(now) {
        if (!isVisibleRef.current || !isRunning) { rafRef.current = null; return; }
        const dt = now - prevTime;
        prevTime = now;
        setTime(t => t + dt);
        // Simulated distance + speed variation
        setSpeed(s => {
          const baseSpeed = 24.5;
          const variation = Math.sin(now / 3000) * 3 + Math.sin(now / 700) * 1.5;
          return Math.max(18, baseSpeed + variation);
        });
        setDistance(d => d + (speed * 1000 / 3600) * (dt / 1000));
        rafRef.current = requestAnimationFrame(tick);
      }

      if (isRunning) {
        rafRef.current = requestAnimationFrame(tick);
      }

      const onVisibility = () => {
        isVisibleRef.current = !document.hidden;
        if (!document.hidden && isRunning && !rafRef.current) {
          prevTime = performance.now();
          rafRef.current = requestAnimationFrame(tick);
        }
      };
      document.addEventListener('visibilitychange', onVisibility);

      return () => {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        document.removeEventListener('visibilitychange', onVisibility);
      };
    }, [isRunning, speed]);

    const totalSeconds = Math.floor(time / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    const ms = Math.floor((time % 1000) / 10);

    const calories = Math.floor(distance * 35); // approx
    const elevation = Math.floor(distance * 12);
    const cadence = 85 + Math.round(Math.sin(time / 2000) * 8);

    return (
      <div className="velo-app ride-page">
        <div className="scroll-wrap">
          <div className="ride-header">
            <div className="ride-page-title">正在骑行</div>
            <div className="ride-subtitle">西湖环山经典线 · 实时追踪中</div>
          </div>

          <div className="ride-timer">
            <div className="ride-timer-value">
              {String(hours).padStart(2,'0')}:{String(minutes).padStart(2,'0')}:{String(seconds).padStart(2,'0')}
              <span className="ride-timer-ms">{String(ms).padStart(2,'0')}</span>
            </div>
            <div className="ride-timer-label">骑行时长</div>
          </div>

          <div className="ride-map-mini">
            <svg className="ride-map-route" viewBox="0 0 360 120">
              <path
                d="M20 90 Q60 30 120 50 T200 70 T260 30 T340 60"
                stroke="#E8F04A"
                strokeWidth="2.5"
                fill="none"
                strokeDasharray="1000"
                strokeDashoffset={1000 - (distance / 28.6) * 500}
                filter="drop-shadow(0 0 4px rgba(232,240,74,0.5))"
              />
              <circle cx="20" cy="90" r="5" fill="#7A8B6F"/>
              <circle
                cx={Math.min(340, 20 + (distance / 28.6) * 320)}
                cy={90 - Math.sin((distance / 28.6) * Math.PI) * 40}
                r="6"
                fill="#E8622C"
                className="animate-pulse"
              />
            </svg>
          </div>

          <div className="ride-stats-grid">
            <div className="ride-stat-card speed">
              <div className="ride-stat-label">当前速度</div>
              <div className="ride-stat-value">
                {speed.toFixed(1)}<span className="ride-stat-unit">km/h</span>
              </div>
            </div>
            <div className="ride-stat-card">
              <div className="ride-stat-label">骑行距离</div>
              <div className="ride-stat-value">
                {distance.toFixed(1)}<span className="ride-stat-unit">km</span>
              </div>
            </div>
            <div className="ride-stat-card cal">
              <div className="ride-stat-label">消耗热量</div>
              <div className="ride-stat-value">
                {calories}<span className="ride-stat-unit">kcal</span>
              </div>
            </div>
            <div className="ride-stat-card elev">
              <div className="ride-stat-label">累计爬升</div>
              <div className="ride-stat-value">
                {elevation}<span className="ride-stat-unit">m</span>
              </div>
            </div>
            <div className="ride-stat-card cad">
              <div className="ride-stat-label">踏频</div>
              <div className="ride-stat-value">
                {cadence}<span className="ride-stat-unit">rpm</span>
              </div>
            </div>
            <div className="ride-stat-card heart">
              <div className="ride-stat-label">心率</div>
              <div className="ride-stat-value">
                148<span className="ride-stat-unit">bpm</span>

            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

  function CommunityPage() {
    const [activeTab, setActiveTab] = useState(0);
    const [refreshing, setRefreshing] = useState(false);
    const scrollRef = useRef(null);
    const startYRef = useRef(0);
    const pullRef = useRef(0);

    const handleTouchStart = (e) => {
      if (scrollRef.current?.scrollTop === 0) {
        startYRef.current = e.touches[0].clientY;
      }
    };
    const handleTouchMove = (e) => {
      if (scrollRef.current?.scrollTop === 0 && startYRef.current) {
        const diff = e.touches[0].clientY - startYRef.current;
        if (diff > 0) {
          pullRef.current = Math.min(diff * 0.5, 80);
          scrollRef.current.style.transform = `translateY(${pullRef.current}px)`;
        }
      }
    };
    const handleTouchEnd = () => {
      if (pullRef.current > 50) {
        setRefreshing(true);
        setTimeout(() => {
          setRefreshing(false);
          pullRef.current = 0;
          if (scrollRef.current) scrollRef.current.style.transform = 'translateY(0)';
        }, 1500);
      } else {
        pullRef.current = 0;
        if (scrollRef.current) scrollRef.current.style.transform = 'translateY(0)';
      }
      startYRef.current = 0;
    };

    const tabs = ['推荐', '关注', '附近', '话题'];

              <div key="center" style={{ flex: 1, position: 'relative' }}>
                <div className="tab-center-btn" onClick={onCenterClick}>
                  {Icon.Bike}
                </div>
              </div>
            );
          }
          const isActive = activeTab === tab.key;
          return (
            <div
              key={tab.key}
              className={`tab-item ${isActive ? 'active' : ''} ${dark ? 'dark' : ''}`}
              onClick={() => onTabClick(tab.key)}
            >
              {typeof tab.icon === 'function' ? tab.icon(isActive) : null}
              <span className="tab-label">{tab.label}</span>
            </div>
          );
        })}
      </div>
    );
  }

  // ============================================================
  // MAIN APP
  // ============================================================
  function App() {
    const [activeTab, setActiveTab] = useState('home');
    const [navStack, setNavStack] = useState([{ screen: 'home' }]);
    const [pageTransition, setPageTransition] = useState('');
    const [showRideModal, setShowRideModal] = useState(false);
    const [showDesignSystem, setShowDesignSystem] = useState(false);
    const [darkTabBar, setDarkTabBar] = useState(false);

    const currentScreen = navStack[navStack.length - 1]?.screen || 'home';

    // Custom cursor init
    useEffect(() => {
      initCustomCursor();
      return () => {
        if (window.__cleanupCursor) window.__cleanupCursor();
      };
    }, []);

    // Update dark tab bar based on current screen
    useEffect(() => {
      const darkScreens = ['detail', 'ride'];
      setDarkTabBar(darkScreens.includes(currentScreen));
    }, [currentScreen]);

    const goToRouteDetail = (route) => {
      setPageTransition('push');
      setTimeout(() => {
        setNavStack([...navStack, { screen: 'detail', route }]);
        setPageTransition('');
      }, 50);
    };

    const goBack = () => {
      if (navStack.length > 1) {
        setPageTransition('pop');
        setTimeout(() => {
          setNavStack(navStack.slice(0, -1));
          setPageTransition('');
        }, 50);
      }
    };

    const handleTabClick = (key) => {
      if (key === 'docs') {
        setShowDesignSystem(true);
        return;
      }
      if (key === 'gear') {
        setNavStack([{ screen: 'gear' }]);
        setActiveTab('gear');
        return;
      }
      if (navStack[0]?.screen !== key) {
        setNavStack([{ screen: key }]);
        setActiveTab(key);
      }
    };

    const handleCenterClick = () => {
      setShowRideModal(true);
    };

    const closeRideModal = () => {
      setShowRideModal(false);
    };

    // Render main content
    const renderScreen = () => {
      const top = navStack[navStack.length - 1];
      switch (top.screen) {
        case 'home':
          return <HomePage onRouteClick={goToRouteDetail} />;
        case 'community':
          return <CommunityPage />;
        case 'profile':
          return <ProfilePage onGearClick={() => {
            setPageTransition('push');
            setTimeout(() => {
              setNavStack([...navStack, { screen: 'gear' }]);
              setPageTransition('');
            }, 50);
          }} />;
        case 'detail':
          return <RouteDetailPage route={top.route} onBack={goBack} />;
        case 'gear':
          return <GearPage onBack={goBack} />;
        default:
          return <HomePage onRouteClick={goToRouteDetail} />;
      }
    };

    return (
      <div className="showcase">
        <div className="showcase-title">
          <span className="accent">骑迹</span> VeloRoute · 原生 App V2
        </div>
        <div className="showcase-meta">
          形态：原生 App · 8 Pages · iOS
        </div>

        <div className="device-wrapper">
          {/* Device Frame - custom build with proper safe areas */}
          <div style={{
            width: 390, height: 844, borderRadius: 48, overflow: 'hidden',
            position: 'relative', background: '#000',
            border: '1px solid #3A3D44',
            boxShadow: '0 30px 80px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.3)',
            fontFamily: 'Inter, -apple-system, system-ui, sans-serif',
            '--ios-safe-top': '54px',
            '--ios-safe-bottom': '34px',
          }}>
            {/* Dynamic Island */}
            <div style={{
              position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
              width: 120, height: 35, borderRadius: 22, background: '#000', zIndex: 100,
            }}/>

            {/* Status Bar */}
            <div style={{
              position: 'absolute', top: 0, left: 0, right: 0, zIndex: 90,
              display: 'flex', justifyContent: 'space-between', alignItems: 'center',
              padding: '18px 28px 0',
              color: darkTabBar ? '#fff' : '#23252A',
              fontFamily: '-apple-system, system-ui',
              fontWeight: 600, fontSize: 15,
              pointerEvents: 'none',
              transition: 'color 0.3s',
            }}>
              <span>9:41</span>
              <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                <svg width="17" height="11" viewBox="0 0 17 11">
                  <rect x="0" y="7" width="3" height="4" rx="0.6" fill="currentColor"/>
                  <rect x="4.7" y="4.5" width="3" height="6.5" rx="0.6" fill="currentColor"/>
                  <rect x="9.3" y="2" width="3" height="9" rx="0.6" fill="currentColor"/>
                  <rect x="14" y="0" width="3" height="11" rx="0.6" fill="currentColor"/>
                </svg>
                <svg width="16" height="11" viewBox="0 0 16 11">
                  <path d="M8 2.5c1.8 0 3.5 0.6 4.8 1.7L13.9 3.1C12.3 1.6 10.2 0.8 8 0.8S3.7 1.6 2.1 3.1L3.2 4.2C4.5 3.1 6.2 2.5 8 2.5z" fill="currentColor"/>
                  <path d="M8 5.8c1 0 1.9 0.3 2.7 1L11.8 5.8C10.7 4.8 9.4 4.2 8 4.2S5.3 4.8 4.2 5.8L5.3 6.8C6.1 6.1 7 5.8 8 5.8z" fill="currentColor"/>
                  <circle cx="8" cy="9" r="1.2" fill="currentColor"/>
                </svg>
                <svg width="25" height="12" viewBox="0 0 25 12">
                  <rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" strokeOpacity="0.4" fill="none"/>
                  <rect x="2" y="2" width="18" height="8" rx="1.5" fill="currentColor"/>
                  <path d="M23 4v4c0.7-0.3 1-1.1 1-2s-0.3-1.7-1-2z" fill="currentColor" fillOpacity="0.4"/>
                </svg>
              </div>
            </div>

            {/* Screen Container */}
            <div style={{
              position: 'absolute', inset: 0,
              overflow: 'hidden',
            }}>
              {renderScreen()}

              {/* TabBar - only show on root screens */}
              {navStack.length === 1 && activeTab !== 'docs' && (
                <TabBar
                  activeTab={activeTab}
                  onTabClick={handleTabClick}
                  onCenterClick={handleCenterClick}
                  dark={darkTabBar}
                />
              )}

              {/* Ride Recording Modal (full-screen) */}
              {showRideModal && (
                <div style={{
                  position: 'absolute', inset: 0,
                  zIndex: 200,
                  animation: 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
                }}>
                  <RideRecordPage />
                  {/* Custom close button in status bar area */}
                  <div
                    style={{
                      position: 'absolute',
                      top: 20, right: 16,
                      zIndex: 210,
                      width: 32, height: 32,
                      borderRadius: '50%',
                      background: 'rgba(255,255,255,0.15)',
                      backdropFilter: 'blur(10px)',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      cursor: 'pointer',
                    }}
                    onClick={closeRideModal}
                  >
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F7F5F0" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <line x1="18" y1="6" x2="6" y2="18"/>
                      <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                  </div>
                </div>
              )}

              {/* Design System / Docs Modal */}
              {showDesignSystem && (
                <DesignSystemModal onClose={() => setShowDesignSystem(false)} />
              )}
            </div>

            {/* Home Indicator */}
            <div style={{
              position: 'absolute', bottom: 8, left: '50%', transform: 'translateX(-50%)',
              width: 134, height: 5, borderRadius: 100,
              background: darkTabBar ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.3)',
              zIndex: 95,
              transition: 'background 0.3s',
            }}/>
          </div>
        </div>

        {/* Page selector dots below device */}
        <div style={{
          position: 'absolute',
          bottom: 40, left: '50%', transform: 'translateX(-50%)',
          display: 'flex', gap: 8,
          alignItems: 'center',
        }}>
          {['home', 'detail', 'ride', 'gear', 'community', 'profile', 'design-system', 'api-docs'].map((page, i) => (
            <div
              key={page}
              style={{
                width: 8, height: 8,
                borderRadius: '50%',
                background: i === 0 ? '#E8622C' : 'rgba(247,245,240,0.2)',
                cursor: 'pointer',
                transition: 'all 0.3s',
              }}
              onClick={() => {
                if (page === 'home') { setActiveTab('home'); setNavStack([{ screen: 'home' }]); setShowDesignSystem(false); setShowRideModal(false); }
                if (page === 'detail') { setActiveTab('home'); setNavStack([{ screen: 'home' }, { screen: 'detail', route: ROUTES[0] }]); setShowDesignSystem(false); setShowRideModal(false); }
                if (page === 'ride') { setShowRideModal(true); setShowDesignSystem(false); }
                if (page === 'gear') { setActiveTab('gear'); setNavStack([{ screen: 'gear' }]); setShowDesignSystem(false); setShowRideModal(false); }
                if (page === 'community') { setActiveTab('community'); setNavStack([{ screen: 'community' }]); setShowDesignSystem(false); setShowRideModal(false); }
                if (page === 'profile') { setActiveTab('profile'); setNavStack([{ screen: 'profile' }]); setShowDesignSystem(false); setShowRideModal(false); }
                if (page === 'design-system') { setShowDesignSystem(true); setShowRideModal(false); }
                if (page === 'api-docs') { setShowDesignSystem(true); }
              }}
              title={page}
            />
          ))}
        </div>
      </div>
    );
  }

  // Design System Modal (slides up with 2 sub-screens)
  function DesignSystemModal({ onClose }) {
    const [subPage, setSubPage] = useState('design'); // 'design' | 'api'

    return (
      <div style={{
        position: 'absolute', inset: 0,
        zIndex: 200,
        animation: 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
      }}>
        {subPage === 'design' ? <DesignSystemPage /> : <ApiDocsPage />}

        {/* Top close + tabs */}
        <div style={{
          position: 'absolute',
          top: 0, left: 0, right: 0,
          paddingTop: 'var(--ios-safe-top)',
          zIndex: 10,
          display: 'flex', alignItems: 'center',
          padding: 'calc(var(--ios-safe-top, 54px) + 4px) 16px 0',
          gap: 12,
          pointerEvents: 'none',
        }}>
          <div
            style={{
              width: 32, height: 32,
              borderRadius: '50%',
              background: subPage === 'design' ? 'rgba(247,245,240,0.9)' : 'rgba(255,255,255,0.15)',
              backdropFilter: 'blur(10px)',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              cursor: 'pointer',
              pointerEvents: 'auto',
            }}
            onClick={onClose}
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={subPage === 'design' ? '#23252A' : '#F7F5F0'} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </div>
          <div style={{
            flex: 1,
            display: 'flex', justifyContent: 'center',
            gap: 4,
            pointerEvents: 'auto',
          }}>
            <div
              style={{
                padding: '6px 14px',
                borderRadius: 20,
                fontSize: 12,
                fontWeight: 600,
                cursor: 'pointer',
                background: subPage === 'design'
                  ? (subPage === 'design' ? '#23252A' : 'rgba(255,255,255,0.2)')
                  : 'rgba(255,255,255,0.1)',
                color: subPage === 'design' ? '#F7F5F0' : 'rgba(255,255,255,0.5)',
              }}
              onClick={() => setSubPage('design')}
            >
              设计规范
            </div>
            <div
              style={{
                padding: '6px 14px',
                borderRadius: 20,
                fontSize: 12,
                fontWeight: 600,
                cursor: 'pointer',
                background: subPage === 'api' ? '#E8F04A' : 'rgba(255,255,255,0.1)',
                color: subPage === 'api' ? '#23252A' : 'rgba(255,255,255,0.5)',
              }}
              onClick={() => setSubPage('api')}
            >
              API 文档
            </div>
          </div>
          <div style={{ width: 32 }} />
        </div>
      </div>
    );
  }

  // ============================================================
  // Render
  // ============================================================
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);

  // Announce upgrade capability
  function announceUpgrade() {
    window.parent?.postMessage?.({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  }
  announceUpgrade();
  if (document.readyState !== 'complete') {
    window.addEventListener('load', announceUpgrade, { once: true });
  }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>节气厨房 · Solar Term Kitchen</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" />
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  /* ========== GLOBAL RESET & TOKENS ========== */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Noto Sans SC', -apple-system, system-ui, sans-serif;
    background: #e8dcc8;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    color: #3d3530;
    overflow-x: hidden;
  }

  :root {
    --clay: #c8704d;
    --clay-deep: #a85a3a;
    --clay-light: #e29574;
    --sage: #7a9460;
    --sage-deep: #5c7a45;
    --sage-light: #9cb47e;
    --cream: #f8f3e9;
    --cream-deep: #ede4d0;
    --charcoal: #3d3530;
    --charcoal-soft: #5c524b;
    --charcoal-mute: #8a7f76;
    --honey: #d4a04a;
    --honey-light: #e8c27a;
    --paper: #faf6ee;
    --card: #ffffff;
    --divider: rgba(61,53,48,0.1);
    --shadow-sm: 0 2px 8px rgba(61,53,48,0.06);
    --shadow-md: 0 8px 24px rgba(61,53,48,0.1);
    --shadow-lg: 0 16px 40px rgba(61,53,48,0.15);
    --font-serif: 'Noto Serif SC', 'Songti SC', serif;
    --font-sans: 'Noto Sans SC', -apple-system, system-ui, sans-serif;
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --radius-xl: 28px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ========== STAGE / BACKGROUND ========== */
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    position: relative;
    z-index: 1;
  }

  .stage-title {
    font-family: var(--font-serif);
    font-size: 28px;
    font-weight: 700;
    color: var(--charcoal);
    letter-spacing: 2px;
  }
  .stage-sub {
    font-size: 13px;
    color: var(--charcoal-mute);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .bg-decor {
    position: fixed;
    pointer-events: none;
    z-index: 0;
  }
  .bg-decor-1 {
    top: -100px; right: -100px;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(200,112,77,0.15), transparent 70%);
  }
  .bg-decor-2 {
    bottom: -150px; left: -100px;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(122,148,96,0.12), transparent 70%);
  }

  /* ========== PHONE FRAME ========== */
  .phone-wrap {
    position: relative;
    filter: drop-shadow(0 24px 48px rgba(61,53,48,0.18));
  }

  /* ========== CUSTOM CURSOR ========== */
  .custom-cursor {
    position: fixed;
    width: 32px; height: 32px;
    border: 2px solid #fff;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.2s, height 0.2s, border-color 0.2s;
    mix-blend-mode: difference;
    box-shadow: 0 0 12px rgba(200,112,77,0.6);
  }
  .custom-cursor::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 6px; height: 6px;
    background: var(--clay);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px var(--clay);
  }
  .custom-cursor.hovering {
    width: 48px; height: 48px;
    border-color: var(--clay);
    mix-blend-mode: normal;
  }

  @media (max-width: 768px) {
    .custom-cursor { display: none; }
    body { padding: 0; background: var(--cream); }
    .stage-title, .stage-sub { display: none; }
  }

  /* ========== APP CONTAINER ========== */
  .app {
    width: 390px;
    height: 844px;
    border-radius: 46px;
    overflow: hidden;
    background: var(--cream);
    position: relative;
    border: 1px solid rgba(61,53,48,0.1);
  }

  .app-screen {
    position: absolute;
    inset: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .screen-enter-right {
    animation: slideInRight 0.35s cubic-bezier(0.32, 0.72, 0, 1) forwards;
  }
  .screen-exit-left {
    animation: slideOutLeft 0.35s cubic-bezier(0.32, 0.72, 0, 1) forwards;
  }
  .screen-enter-bottom {
    animation: slideInBottom 0.35s cubic-bezier(0.32, 0.72, 0, 1) forwards;
  }
  .screen-exit-bottom {
    animation: slideOutBottom 0.35s cubic-bezier(0.32, 0.72, 0, 1) forwards;
  }
  @keyframes slideInRight {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }
  @keyframes slideOutLeft {
    from { transform: translateX(0); }
    to { transform: translateX(-30%); opacity: 0.6; }
  }
  @keyframes slideInBottom {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  @keyframes slideOutBottom {
    from { transform: translateY(0); }
    to { transform: translateY(100%); }
  }

  /* ========== DYNAMIC ISLAND & STATUS BAR ========== */
  .dynamic-island {
    position: absolute;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 34px;
    border-radius: 20px;
    background: #000;
    z-index: 100;
  }

  .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 28px 0;
    z-index: 90;
    font-size: 15px;
    font-weight: 600;
    color: var(--charcoal);
    pointer-events: none;
  }
  .status-bar.dark { color: #fff; }
  .status-bar-right {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .home-indicator {
    position: absolute;
    bottom: 8px; left: 50%;
    transform: translateX(-50%);
    width: 134px; height: 5px;
    border-radius: 3px;
    background: rgba(61,53,48,0.3);
    z-index: 100;
  }

  /* ========== WECHAT NAV CAPSULE ========== */
  .nav-capsule {
    position: absolute;
    top: 54px; right: 12px;
    width: 88px; height: 32px;
    border-radius: 16px;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 0.5px solid rgba(61,53,48,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 85;
    box-shadow: 0 2px 8px rgba(61,53,48,0.06);
  }
  .nav-capsule-icon {
    width: 18px; height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--charcoal);
    cursor: pointer;
  }
  .nav-capsule-divider {
    width: 1px; height: 16px;
    background: rgba(61,53,48,0.15);
  }

  /* ========== CUSTOM NAV BAR ========== */
  .custom-nav {
    position: absolute;
    top: 54px; left: 0; right: 0;
    height: 44px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    z-index: 80;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .custom-nav.transparent {
    background: transparent;
  }
  .custom-nav.solid {
    background: var(--cream);
    box-shadow: 0 0.5px 0 var(--divider);
  }
  .nav-back-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .nav-title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 17px;
    font-weight: 600;
    color: var(--charcoal);
    font-family: var(--font-serif);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .custom-nav.solid .nav-title { opacity: 1; }

  /* ========== TAB BAR ========== */
  .tab-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 83px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 0.5px solid var(--divider);
    display: flex;
    align-items: flex-start;
    padding: 6px 0 0;
    z-index: 70;
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    position: relative;
    padding-top: 6px;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .tab-item:active { transform: scale(0.92); }
  .tab-item-icon {
    width: 26px; height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--charcoal-mute);
    transition: color 0.25s;
    position: relative;
    z-index: 2;
  }
  .tab-item.active .tab-item-icon { color: var(--clay); }
  .tab-item.active {
    animation: tabBounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes tabBounce {
    0% { transform: scale(1); }
    40% { transform: scale(1.2); }
    70% { transform: scale(0.95); }
    100% { transform: scale(1); }
  }
  .tab-item-label {
    font-size: 11px;
    color: var(--charcoal-mute);
    font-weight: 500;
    transition: color 0.25s;
  }
  .tab-item.active .tab-item-label { color: var(--clay); }
  .tab-dot {
    position: absolute;
    bottom: -2px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--clay);
    transform: scale(0);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .tab-item.active .tab-dot { transform: scale(1); }

  /* ========== SCROLL CONTENT ========== */
  .scroll-content {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    position: relative;
  }
  .scroll-content::-webkit-scrollbar { display: none; }

  /* ========== HOME PAGE ========== */
  .home-hero {
    position: relative;
    height: 420px;
    overflow: hidden;
  }
  .hero-bg {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #e8c49a 0%, #d4a574 40%, #c8704d 100%);
  }
  .hero-bg::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.3), transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(122,148,96,0.2), transparent 40%);
  }
  .hero-decoration {
    position: absolute;
    top: 80px; right: -30px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212,160,74,0.4), transparent 70%);
  }
  .hero-decoration-2 {
    position: absolute;
    bottom: 60px; left: -40px;
    width: 150px; height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(122,148,96,0.35), transparent 70%);
  }
  .hero-content {
    position: relative;
    z-index: 2;
    padding: 108px 24px 0;
    color: #fff;
  }
  .hero-greeting {
    font-size: 14px;
    opacity: 0.85;
    margin-bottom: 6px;
    font-weight: 400;
  }
  .hero-term {
    font-family: var(--font-serif);
    font-size: 56px;
    font-weight: 900;
    letter-spacing: 8px;
    line-height: 1.1;
    margin-bottom: 4px;
    text-shadow: 0 2px 20px rgba(61,53,48,0.15);
  }
  .hero-term-en {
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.75;
    margin-bottom: 16px;
    font-weight: 300;
  }
  .hero-date-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .hero-date-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    background: rgba(255,255,255,0.22);
    backdrop-filter: blur(10px);
    border-radius: 100px;
    font-size: 12px;
    border: 0.5px solid rgba(255,255,255,0.3);
  }
  .hero-desc {
    font-size: 13px;
    line-height: 1.7;
    opacity: 0.9;
    max-width: 280px;
    font-weight: 300;
  }

  /* floating panel */
  .hero-floating-panel {
    position: absolute;
    bottom: -30px;
    left: 20px; right: 20px;
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    box-shadow: var(--shadow-lg);
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .floating-icon {
    width: 44px; height: 44px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--sage-light), var(--sage));
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #fff;
  }
  .floating-text { flex: 1; min-width: 0; }
  .floating-title {
    font-family: var(--font-serif);
    font-size: 15px;
    font-weight: 600;
    color: var(--charcoal);
    margin-bottom: 2px;
  }
  .floating-desc {
    font-size: 12px;
    color: var(--charcoal-mute);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .floating-arrow {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--clay);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* sections */
  .home-section {
    padding: 50px 20px 16px;
  }
  .section-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .section-title {
    font-family: var(--font-serif);
    font-size: 20px;
    font-weight: 700;
    color: var(--charcoal);
  }
  .section-more {
    font-size: 12px;
    color: var(--charcoal-mute);
    display: flex;
    align-items: center;
    gap: 2px;
  }

  /* recipe card (horizontal) */
  .recipe-card-row {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding: 4px 2px 12px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
  }
  .recipe-card-row::-webkit-scrollbar { display: none; }

  .recipe-card {
    flex-shrink: 0;
    width: 180px;
    background: var(--card);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    scroll-snap-align: start;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
    position: relative;
  }
  .recipe-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-md), 0 0 20px rgba(200,112,77,0.15);
  }
  .recipe-card-img {
    width: 100%;
    height: 130px;
    position: relative;
    overflow: hidden;
  }
  .recipe-card-body {
    padding: 12px 14px 14px;
  }
  .recipe-card-title {
    font-family: var(--font-serif);
    font-size: 15px;
    font-weight: 600;
    color: var(--charcoal);
    margin-bottom: 6px;
    line-height: 1.3;
  }
  .recipe-card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 8px;
  }
  .recipe-tag {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 100px;
    background: rgba(122,148,96,0.12);
    color: var(--sage-deep);
    font-weight: 500;
  }
  .recipe-card-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    color: var(--charcoal-mute);
  }
  .recipe-meta-item {
    display: flex;
    align-items: center;
    gap: 3px;
  }

  /* wellness tips */
  .wellness-card {
    background: linear-gradient(135deg, #f5ead3 0%, #ebdfc0 100%);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
    margin: 0 20px;
  }
  .wellness-card::before {
    content: '';
    position: absolute;
    top: -30px; right: -20px;
    width: 100px; height: 100px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212,160,74,0.3), transparent 70%);
  }
  .wellness-label {
    font-size: 11px;
    color: var(--honey);
    font-weight: 600;
    letter-spacing: 2px;
    margin-bottom: 8px;
    position: relative;
  }
  .wellness-title {
    font-family: var(--font-serif);
    font-size: 18px;
    font-weight: 700;
    color: var(--charcoal);
    margin-bottom: 8px;
    position: relative;
  }
  .wellness-desc {
    font-size: 13px;
    color: var(--charcoal-soft);
    line-height: 1.7;
    position: relative;
  }

  /* ========== RECIPE LIST PAGE ========== */
  .sticky-tabs {
    position: sticky;
    top: 98px;
    z-index: 30;
    background: var(--cream);
    padding: 0 16px 10px;
  }
  .tabs-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .tabs-scroll::-webkit-scrollbar { display: none; }
  .tab-pill {
    flex-shrink: 0;
    padding: 8px 18px;
    border-radius: 100px;
    font-size: 14px;
    color: var(--charcoal-mute);
    background: transparent;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.3s;
    white-space: nowrap;
  }
  .tab-pill.active {
    color: #fff;
    background: var(--clay);
    font-weight: 600;
    box-shadow: 0 4px 12px rgba(200,112,77,0.3);
  }

  /* waterfall / masonry */
  .waterfall {
    padding: 10px 12px 110px;
    columns: 2;
    column-gap: 10px;
  }
  .waterfall-item {
    break-inside: avoid;
    margin-bottom: 10px;
  }
  .wf-card {
    background: var(--card);
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
    position: relative;
  }
  .wf-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
  }
  .wf-card-img {
    width: 100%;
    position: relative;
    overflow: hidden;
  }
  .wf-card-body { padding: 10px 12px 12px; }
  .wf-card-title {
    font-family: var(--font-serif);
    font-size: 14px;
    font-weight: 600;
    color: var(--charcoal);
    margin-bottom: 6px;
    line-height: 1.4;
  }
  .wf-card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .wf-tag {
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 100px;
    background: rgba(200,112,77,0.1);
    color: var(--clay-deep);
    font-weight: 500;
  }
  .wf-card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 10px;
    color: var(--charcoal-mute);
  }

  /* pull to refresh */
  .pull-indicator {
    position: absolute;
    top: 98px;
    left: 0; right: 0;
    height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    z-index: 20;
    pointer-events: none;
  }
  .pull-spinner {
    width: 24px; height: 24px;
    border: 2.5px solid rgba(200,112,77,0.2);
    border-top-color: var(--clay);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* skeleton */
  .skeleton {
    background: linear-gradient(90deg, #eee5d4 25%, #f5ebd9 50%, #eee5d4 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 6px;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ========== RECIPE DETAIL PAGE ========== */
  .detail-hero {
    position: relative;
    height: 360px;
    overflow: hidden;
  }
  .detail-hero-img {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    will-change: transform;
  }

  const useRipple = () => {
    const createRipple = useCallback((e) => {
      if (prefersReducedMotion()) return;
      const target = e.currentTarget;
      const rect = target.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const x = e.clientX - rect.left - size / 2;
      const y = e.clientY - rect.top - size / 2;
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      target.style.position = 'relative';
      target.style.overflow = 'hidden';
      target.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    }, []);
    return createRipple;
  };

  const useCountUp = (target, duration = 1200, start = false) => {
    const [value, setValue] = useState(0);
    const rafRef = useRef(null);
    const startTimeRef = useRef(null);

    useEffect(() => {
      if (!start || prefersReducedMotion()) {
        setValue(target);
        return;
      }
      const animate = (ts) => {
        if (!startTimeRef.current) startTimeRef.current = ts;
        const elapsed = ts - startTimeRef.current;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        setValue(Math.round(target * eased));
        if (progress < 1) {
          rafRef.current = requestAnimationFrame(animate);
        }
      };
      rafRef.current = requestAnimationFrame(animate);
      return () => {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        startTimeRef.current = null;
      };
    }, [target, duration, start]);

    useEffect(() => {
      const onVisibility = () => {
        if (document.hidden && rafRef.current) {
          cancelAnimationFrame(rafRef.current);
          rafRef.current = null;
        }
      };
      document.addEventListener('visibilitychange', onVisibility);
      return () => document.removeEventListener('visibilitychange', onVisibility);
    }, []);

    return value;
  };

  "data": {
    "id": 1,
    "name": "百合莲子羹",
    "ingredients": [
      { "name": "干百合", "amount": "30克" },
      { "name": "莲子", "amount": "40克" }
    ],
    "steps": [
      { "step": 1, "title": "泡发食材", "detail": "百合、莲子提前浸泡..." }
    ],
    "tips": "处暑时节宜食温润之品..."
  }
}`
      },
      {
        method: 'GET',
        path: '/api/ingredient/list',
        desc: '获取当季食材列表，支持按节气筛选。',
        response: `{
  "code": 0,
  "data": {
    "season": "autumn",
    "ingredients": [
      {
        "id": 1,
        "name": "百合",
        "nature": "性微寒，味甘",
        "benefits": "润肺止咳，清心安神",
        "bestSeason": "处暑-霜降"
      }
    ]
  }
}`
      },
      {
        method: 'POST',
        path: '/api/user/favorite',
        desc: '收藏或取消收藏食谱。',
        response: `{
  "code": 0,
  "data": {
    "recipeId": 1,
    "favorited": true
  }
}`
      },
    ];

    const toggleEndpoint = (i) => {
      setExpanded(prev =>
        prev.includes(i) ? prev.filter(x => x !== i) : [...prev, i]
      );
    };

    const renderCode = (code) => {
      return code.split('\n').map((line, i) => {
        const highlighted = line
          .replace(/"(\w+)":/g, '<span class="api-code-key">"$1"</span>:')
          .replace(/: "([^"]+)"/g, ': <span class="api-code-str">"$1"</span>')
          .replace(/: (\d+)/g, ': <span class="api-code-num">$1</span>')
          .replace(/(\/\/.*)/g, '<span class="api-code-cmt">$1</span>');
        return <div key={i} dangerouslySetInnerHTML={{ __html: highlighted || '&nbsp;' }} />;
      });
    };

    return (
      <div className="app-screen">
        <StatusBar />
        <WeChatCapsule />
        <CustomNav title="接口文档" onBack={onBack} mode="solid" />

        <div className="scroll-content">
          <div className="api-page">
            <h1 className="ds-title">API 文档</h1>
            <p className="ds-sub">节气厨房后端接口契约 v1.0</p>

            <div style={{
              background: 'var(--card)', borderRadius: 14,
              padding: 14, marginBottom: 20, boxShadow: 'var(--shadow-sm)',
              fontSize: 12, lineHeight: 1.8, color: 'var(--charcoal-soft)',
            }}>
              <div style={{ marginBottom: 6 }}>
                <strong style={{ color: 'var(--charcoal)' }}>Base URL:</strong>
                <span style={{ fontFamily: 'monospace', marginLeft: 8 }}>https://api.solarkitchen.cn</span>
              </div>
              <div>
                <strong style={{ color: 'var(--charcoal)' }}>返回格式:</strong>
                <span style={{ marginLeft: 8 }}>统一 JSON 格式，code=0 表示成功</span>
              </div>
            </div>

            {endpoints.map((ep, i) => (
              <div key={i} className="api-endpoint">
                <div className="api-endpoint-header" onClick={() => toggleEndpoint(i)}>
                  <span className={`api-method ${ep.method.toLowerCase()}`}>{ep.method}</span>
                  <span className="api-path">{ep.path}</span>
                  <Icon
                    name="chevronDown"
                    size={16}
                    color="var(--charcoal-mute)"
                    style={{
                      transform: expanded.includes(i) ? 'rotate(180deg)' : 'rotate(0)',
                      transition: 'transform 0.3s',
                      flexShrink: 0,
                    }}
                  />
                </div>
                {expanded.includes(i) && (
                  <div className="api-endpoint-body">
                    <div className="api-desc">{ep.desc}</div>
                    <div style={{ fontSize: 11, color: 'var(--charcoal-mute)', marginBottom: 6 }}>响应示例：</div>
                    <div className="api-code-block">
                      {renderCode(ep.response)}
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  };

  // ============ PAGE: SETTINGS ============
  const SettingsPage = ({ onBack }) => {
    const [toggles, setToggles] = useState({
      push: true,
      sound: true,
      dark: false,
      autoUpdate: true,
    });

    const toggle = (key) => {
      setToggles(prev => ({ ...prev, [key]: !prev[key] }));
    };

    const settingGroups = [
      {
        title: '账户',
        items: [
          { icon: 'user', label: '个人资料', detail: '曦策的小厨房', color: 'var(--clay)' },
          { icon: 'shield', label: '账号安全', detail: '', color: 'var(--sage)' },
          { icon: 'bell', label: '消息通知', toggle: 'push', color: 'var(--honey)' },
        ]
      },
      {
        title: '偏好',
        items: [
          { icon: 'sun', label: '深色模式', toggle: 'dark', color: '#6b5b95' },
          { icon: 'flame', label: '口味偏好', detail: '清淡', color: 'var(--clay)' },
          { icon: 'mapPin', label: '地区设置', detail: '北京', color: 'var(--sage)' },
        ]
      },
      {
        title: '通用',
        items: [
          { icon: 'download', label: '自动更新食谱', toggle: 'autoUpdate', color: '#6b9ac4' },
          { icon: 'trash', label: '清除缓存', detail: '23.4MB', color: '#e57373' },
          { icon: 'info', label: '关于节气厨房', detail: 'v1.0.0', color: 'var(--charcoal-mute)' },
          { icon: 'feather', label: '意见反馈', detail: '', color: 'var(--sage)' },
        ]
      },
    ];

    return (
      <div className="app-screen">
        <StatusBar />
        <WeChatCapsule />
        <CustomNav title="设置" onBack={onBack} mode="solid" />

        <div className="scroll-content">
          <div className="settings-page">
            <h1 className="settings-title">设置</h1>

            {settingGroups.map((group, gi) => (
              <div key={gi}>
                {group.title && <div className="settings-group-title">{group.title}</div>}
                <div className="settings-group">
                  {group.items.map((item, ii) => (
                    <div
                      key={ii}
                      className="settings-row"
                      onClick={item.toggle ? () => toggle(item.toggle) : undefined}
                    >
                      <div className="settings-icon" style={{ background: item.color }}>
                        <Icon name={item.icon} size={16} />
                      </div>
                      <span className="settings-label">{item.label}</span>
                      {item.toggle ? (
                        <div className={`toggle-switch ${toggles[item.toggle] ? 'on' : ''}`} />
                      ) : (
                        <>
                          <span className="settings-detail">{item.detail}</span>
                          <div className="settings-chevron">
                            <Icon name="chevronRight" size={16} strokeWidth={2} />
                          </div>
                        </>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            ))}

            <div className="about-footer">
              <div className="about-logo">节气厨房</div>
              <div>Solar Term Kitchen</div>
              <div style={{ marginTop: 8 }}>应时而食，顺季而养</div>
              <div style={{ marginTop: 12, fontSize: 11 }}>
                © 2026 飞行社 · 保留所有权利
              </div>
            </div>
          </div>
        </div>
      </div>
    );
  };

  // ============ APP ROOT ============
  const App = () => {
    const [currentTab, setCurrentTab] = useState('home');
    const [pageStack, setPageStack] = useState([]);
    const [transition, setTransition] = useState(null);

    const pushPage = (page, params = {}) => {
      if (prefersReducedMotion()) {
        setPageStack(prev => [...prev, { page, params }]);
        return;
      }
      setTransition('push');
      setTimeout(() => {
        setPageStack(prev => [...prev, { page, params }]);
        setTransition(null);
      }, 10);
    };

    const popPage = () => {
      if (pageStack.length === 0) return;
      if (prefersReducedMotion()) {
        setPageStack(prev => prev.slice(0, -1));
        return;
      }
      setTransition('pop');
      setTimeout(() => {
        setPageStack(prev => prev.slice(0, -1));
        setTransition(null);
      }, 300);
    };

    const handleTabChange = (tab) => {
      if (tab === currentTab) return;
      setPageStack([]);
      setCurrentTab(tab);
    };

    const handleRecipeClick = (id) => {
      pushPage('recipeDetail', { recipeId: id });
    };

    const handleNavTo = (target) => {
      switch (target) {
        case 'recipes':
        case 'ingredients':
        case 'profile':
        case 'home':
          setPageStack([]);
          setCurrentTab(target);
          break;
        case 'design':
          pushPage('design');
          break;
        case 'api':
          pushPage('api');
          break;
        case 'settings':
          pushPage('settings');
          break;
        default:
          break;
      }
    };

    const renderTabPage = () => {
      switch (currentTab) {
        case 'home':
          return <HomePage onRecipeClick={handleRecipeClick} onNavTo={handleNavTo} key="home" />;
        case 'recipes':
          return <RecipeListPage onRecipeClick={handleRecipeClick} onNavTo={handleNavTo} key="recipes" />;
        case 'ingredients':
          return <IngredientPage onNavTo={handleNavTo} key="ingredients" />;
        case 'profile':
          return <ProfilePage onNavTo={handleNavTo} key="profile" />;
        default:
          return <HomePage onRecipeClick={handleRecipeClick} onNavTo={handleNavTo} key="home" />;
      }
    };

    const renderStackPage = (page, params) => {
      switch (page) {
        case 'recipeDetail':
          return <RecipeDetailPage recipeId={params.recipeId} onBack={popPage} key="detail" />;
        case 'design':
          return <DesignSystemPage onBack={popPage} key="design" />;
        case 'api':
          return <ApiDocsPage onBack={popPage} key="api" />;
        case 'settings':
          return <SettingsPage onBack={popPage} key="settings" />;
        default:
          return null;
      }
    };

    return (
      <div className="app">
        {renderTabPage()}
        {pageStack.map((item, i) => (
          <div
            key={i}
            className={`app-screen ${transition === 'push' && i === pageStack.length - 1 ? 'screen-enter-right' : ''}`}
          >
            {renderStackPage(item.page, item.params)}
          </div>
        ))}
      </div>
    );
  };

  // announce upgrade capability
  function announceUpgrade() {
    try {
      window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    } catch (e) {}
  }
  announceUpgrade();
  if (document.readyState !== 'complete') {
    window.addEventListener('load', announceUpgrade, { once: true });
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);

  // initialize custom cursor after DOM ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initCustomCursor);
  } else {
    initCustomCursor();
  }
</script>
</body>
</html>

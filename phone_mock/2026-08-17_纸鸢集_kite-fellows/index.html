<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="creative-medium" content="interactive-prototype" />
<title>纸鸢集 · V2 原生 App Mock</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Sans+Mono:wght@400;500&display=swap" />
<style>
  /* ============ 全局变量与重置 ============ */
  :root {
    --paper: #FAF8F3;         /* 棉纸白 底色 */
    --paper-2: #F3EFE5;       /* 棉纸二级 */
    --willow: #7BA05B;        /* 柳芽绿 主色 */
    --willow-dark: #5D8140;
    --willow-light: #A8C58A;
    --azure: #4A8FB5;         /* 天青 辅助 */
    --azure-dark: #2F6F94;
    --rouge: #C24A4A;         /* 燕脂红 强调 */
    --rouge-dark: #9A3636;
    --bamboo: #E8C872;        /* 竹篾黄 点缀 */
    --bamboo-dark: #C9A64A;
    --ink: #2A2722;           /* 墨色 主文字 */
    --ink-2: #5A554D;         /* 次级文字 */
    --ink-3: #9A9489;         /* 辅助文字 */
    --line: #E5DFD2;          /* 分割线 */
    --shadow-1: 0 2px 8px rgba(42,39,34,.06), 0 1px 2px rgba(42,39,34,.04);
    --shadow-2: 0 8px 24px rgba(42,39,34,.1), 0 2px 6px rgba(42,39,34,.06);
    --shadow-3: 0 16px 48px rgba(42,39,34,.14), 0 4px 12px rgba(42,39,34,.08);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: radial-gradient(ellipse at center, #E8E2D3 0%, #C9C1AE 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }

  /* 棉纸纹理背景 —— 用 SVG noise 模拟 */
  .paper-bg {
    background-color: var(--paper);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(123,160,91,.04) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(74,143,181,.04) 0, transparent 40%);
    position: relative;
  }

  /* ============ iOS 设备外壳 ============ */
  .phone-stage {
    position: relative;
    width: 390px;
    height: 844px;
    background: #1a1a1a;
    border-radius: 54px;
    padding: 12px;
    box-shadow:
      0 0 0 2px #2a2a2a,
      0 40px 80px rgba(0,0,0,.35),
      0 10px 20px rgba(0,0,0,.2);
    flex-shrink: 0;
  }
  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    background: var(--paper);
  }
  .dynamic-island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 35px;
    background: #000;
    border-radius: 20px;
    z-index: 1000;
  }
  .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 54px;
    padding: 18px 32px 0 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 999;
    pointer-events: none;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
  }
  .status-bar .icons { display: flex; gap: 5px; align-items: center; }
  .status-bar .icons svg { width: 16px; height: 12px; }

  /* ============ 页面容器 ============ */
  .app-root {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
  }
  .page {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    will-change: transform, opacity;
  }
  .page-enter-from-right { animation: slideInRight .35s cubic-bezier(.22,.61,.36,1) both; }
  .page-exit-to-left { animation: slideOutLeft .35s cubic-bezier(.22,.61,.36,1) both; }
  .page-enter-from-left { animation: slideInLeft .3s cubic-bezier(.22,.61,.36,1) both; }
  .page-exit-to-right { animation: slideOutRight .3s cubic-bezier(.22,.61,.36,1) both; }
  .page-modal-enter { animation: modalUp .38s cubic-bezier(.22,.61,.36,1) both; }
  .page-modal-exit { animation: modalDown .3s cubic-bezier(.55,0,.68,.3) both; }

  @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
  @keyframes slideOutLeft { from { transform: translateX(0); } to { transform: translateX(-30%); opacity: .5; } }
  @keyframes slideInLeft { from { transform: translateX(-30%); opacity: .5; } to { transform: translateX(0); opacity: 1; } }
  @keyframes slideOutRight { from { transform: translateX(0); } to { transform: translateX(100%); } }
  @keyframes modalUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes modalDown { from { transform: translateY(0); } to { transform: translateY(100%); } }

  /* ============ Tab Bar ============ */
  .tab-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 83px;
    padding: 8px 0 20px;
    background: rgba(250,248,243,.85);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 0.5px solid var(--line);
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 500;
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-size: 10px;
    color: var(--ink-3);
    cursor: pointer;
    transition: transform .15s;
  }
  .tab-item:active { transform: scale(.92); }
  .tab-item.active { color: var(--willow-dark); }
  .tab-item svg { width: 26px; height: 26px; }

  /* ============ 通用组件 ============ */
  .scroll-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .scroll-area::-webkit-scrollbar { display: none; }

  .nav-large-title {
    font-family: "Noto Serif SC", serif;
    font-size: 34px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -.5px;
    line-height: 1.2;
  }
  .nav-inline-title {
    font-family: "Noto Serif SC", serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
  }

  .nav-bar {
    position: relative;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
    z-index: 100;
  }
  .nav-bar .left-btn, .nav-bar .right-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: var(--willow-dark);
    font-size: 17px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .nav-bar .left-btn { left: 12px; }
  .nav-bar .right-btn { right: 16px; }

  .hstack { display: flex; align-items: center; }
  .vstack { display: flex; flex-direction: column; }
  .spacer { flex: 1; }

  /* 竹子分割线 */
  .bamboo-divider {
    height: 2px;
    background: repeating-linear-gradient(
      90deg,
      var(--bamboo-dark) 0px,
      var(--bamboo) 6px,
      var(--bamboo-dark) 12px,
      transparent 12px,
      transparent 20px
    );
    opacity: .6;
    margin: 16px 0;
  }

  /* ============ 首页 ============ */
  .home-safe-top {
    padding: 54px 20px 0;
  }
  .home-hero {
    position: relative;
    height: 200px;
    margin-top: 16px;
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: linear-gradient(135deg, var(--azure) 0%, var(--willow-light) 100%);
  }
  .wind-meter-wrap {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .wind-label {
    color: rgba(255,255,255,.9);
    font-size: 13px;
    margin-bottom: 6px;
  }
  .wind-speed {
    font-family: "Noto Serif SC", serif;
    font-size: 56px;
    font-weight: 900;
    color: white;
    line-height: 1;
    text-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .wind-unit {
    font-size: 16px;
    color: rgba(255,255,255,.85);
    margin-top: 2px;
  }
  .wind-poem {
    position: absolute;
    bottom: 16px;
    left: 20px;
    color: rgba(255,255,255,.75);
    font-size: 12px;
    font-family: "Noto Serif SC", serif;
    font-style: italic;
  }
  .wind-poem-right {
    position: absolute;
    top: 16px;
    right: 18px;
    color: white;
    font-size: 13px;
    font-weight: 500;
    background: rgba(255,255,255,.2);
    padding: 4px 10px;
    border-radius: 12px;
    backdrop-filter: blur(8px);
  }

  /* 风筝浮动动画容器 */
  .kites-layer {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .floating-kite {
    position: absolute;
    animation: kiteFloat linear infinite;
    will-change: transform;
  }
  @keyframes kiteFloat {
    0% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(8px, -6px) rotate(3deg); }
    50% { transform: translate(0, -10px) rotate(0deg); }
    75% { transform: translate(-8px, -4px) rotate(-3deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  /* 首页下方卡片 */
  .home-section {
    padding: 20px 20px 0;
  }
  .section-title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-title {
    font-family: "Noto Serif SC", serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
  }
  .section-more {
    font-size: 13px;
    color: var(--willow-dark);
    cursor: pointer;
  }

  .site-card {
    display: flex;
    gap: 14px;
    background: white;
    border-radius: var(--radius-md);
    padding: 14px;
    box-shadow: var(--shadow-1);
    margin-bottom: 12px;
    cursor: pointer;
    transition: transform .2s;
  }
  .site-card:active { transform: scale(.98); }
  .site-card .thumb {
    width: 90px;
    height: 90px;
    border-radius: 10px;
    flex-shrink: 0;
    background-size: cover;
    background-position: center;
    position: relative;
    overflow: hidden;
  }
  .site-card .thumb .badge {
    position: absolute;
    top: 6px;
    left: 6px;
    background: var(--rouge);
    color: white;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 6px;
    font-weight: 500;
  }
  .site-info h3 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 4px;
    color: var(--ink);
  }
  .site-info .meta {
    font-size: 12px;
    color: var(--ink-3);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .site-info .wind-index {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--willow-dark);
  }
  .wind-bar {
    display: flex;
    gap: 2px;
  }
  .wind-bar i {
    width: 3px;
    height: 12px;
    background: var(--line);
    border-radius: 1px;
    display: block;
  }
  .wind-bar i.active { background: var(--willow); }

  /* 风筝图谱横向滚动 */
  .kite-scroll {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding: 4px 20px 24px;
    scrollbar-width: none;
  }
  .kite-scroll::-webkit-scrollbar { display: none; }
  .kite-card {
    flex-shrink: 0;
    width: 140px;
    background: white;
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-1);
    cursor: pointer;
    transition: transform .25s;
  }
  .kite-card:active { transform: scale(.96); }
  .kite-card .kite-img {
    height: 120px;
    background: var(--paper-2);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .kite-card .kite-body {
    font-family: "Noto Serif SC", serif;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 12px 6px;
    color: var(--ink);
  }
  .kite-card .kite-cat {
    font-size: 11px;
    color: var(--ink-3);
    padding: 0 12px 12px;
  }

  /* 活动条目 */
  .activity-row {
    display: flex;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .activity-row:last-child { border-bottom: none; }
  .activity-row:active .activity-title { color: var(--willow-dark); }
  .activity-date {
    width: 54px;
    flex-shrink: 0;
    text-align: center;
    background: var(--paper-2);
    border-radius: var(--radius-sm);
    padding: 8px 4px;
  }
  .activity-date .day {
    font-family: "Noto Serif SC", serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--rouge);
    line-height: 1;
  }
  .activity-date .month {
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 2px;
  }
  .activity-info { flex: 1; }
  .activity-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
    transition: color .15s;
  }
  .activity-meta {
    font-size: 12px;
    color: var(--ink-3);
    display: flex;
    gap: 10px;
  }

  /* ============ 放飞场地页 ============ */
  .map-hero {
    height: 240px;
    position: relative;
    background:
      radial-gradient(ellipse at 30% 40%, rgba(123,160,91,.2) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 60%, rgba(74,143,181,.15) 0%, transparent 50%),
      linear-gradient(180deg, #E8F0E0 0%, #F0E8D8 100%);
    overflow: hidden;
  }
  .map-pin {
    position: absolute;
    width: 28px;
    height: 28px;
    cursor: pointer;
    animation: pinBounce 2s ease-in-out infinite;
  }
  @keyframes pinBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .map-pin.active { animation: pinBounceActive 1.2s ease-in-out infinite; }
  @keyframes pinBounceActive {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-8px) scale(1.15); }
  }

  .filter-chips {
    display: flex;
    gap: 8px;
    padding: 14px 20px 6px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filter-chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    padding: 7px 14px;
    background: white;
    border-radius: 20px;
    font-size: 13px;
    color: var(--ink-2);
    border: 1px solid var(--line);
    cursor: pointer;
    transition: all .2s;
  }
  .chip.active {
    background: var(--willow);
    color: white;
    border-color: var(--willow);
  }

  .site-detail-card {
    background: white;
    margin: 10px 20px;
    border-radius: var(--radius-lg);
    padding: 16px;
    box-shadow: var(--shadow-2);
    display: flex;
    gap: 14px;
  }
  .site-detail-card .big-thumb {
    width: 100px;
    height: 100px;
    border-radius: 12px;
    background-size: cover;
    flex-shrink: 0;
  }

  /* ============ 风筝图谱页（网格拼贴） ============ */
  .atlas-hero {
    padding: 54px 20px 16px;
    background: linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
    position: relative;
    overflow: hidden;
  }
  .atlas-masonry {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 10px 16px 100px;
  }
  .atlas-item {
    background: white;
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-1);
    cursor: pointer;
    transition: transform .25s;
  }
  .atlas-item:active { transform: scale(.97); }
  .atlas-item .atlas-img {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper-2);
  }
  .atlas-item.tall .atlas-img { height: 160px; }
  .atlas-item.short .atlas-img { height: 110px; }
  .atlas-item.wide { grid-column: span 2; }
  .atlas-item.wide .atlas-img { height: 180px; }
  .atlas-item .atlas-name {
    font-family: "Noto Serif SC", serif;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 12px 4px;
    color: var(--ink);
  }
  .atlas-item .atlas-tag {
    font-size: 11px;
    color: var(--ink-3);
    padding: 0 12px 12px;
  }

  /* ============ 风筝详情页（全屏转场） ============ */
  .kite-detail-page {
    background: var(--paper);
  }
  .kite-detail-hero {
    height: 360px;
    position: relative;
    background: linear-gradient(180deg, var(--azure) 0%, var(--willow-light) 70%, var(--paper) 100%);
    overflow: hidden;
  }
  .kite-detail-back {
    position: absolute;
    top: 54px;
    left: 16px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10;
    box-shadow: var(--shadow-1);
  }
  .kite-detail-svg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  .kite-detail-info {
    padding: 24px 20px 100px;
  }
  .kite-detail-info h1 {
    font-family: "Noto Serif SC", serif;
    font-size: 28px;
    font-weight: 900;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .kite-detail-info .subtitle {
    font-size: 14px;
    color: var(--ink-2);
    margin-bottom: 16px;
  }
  .kite-detail-info .tags {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .kite-detail-info .tag {
    padding: 4px 10px;
    background: var(--paper-2);
    border-radius: 12px;
    font-size: 12px;
    color: var(--ink-2);
  }
  .info-block {
    margin-bottom: 20px;
  }
  .info-block h3 {
    font-family: "Noto Serif SC", serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .info-block h3::before {
    content: '';
    width: 3px;
    height: 16px;
    background: var(--willow);
    border-radius: 2px;
  }
  .info-block p {
    font-size: 14px;
    line-height: 1.7;
    color: var(--ink-2);
  }

  /* 尾部飘带动画 */
  .tail-ribbon {
    position: absolute;
    transform-origin: top center;
    will-change: transform;
  }

  /* ============ 扎制教程页（步骤进度） ============ */
  .tutorial-page {
    background: var(--paper-2);
  }
  .tutorial-hero {
    padding: 54px 20px 0;
    background: var(--paper);
  }
  .tutorial-list {
    padding: 16px 16px 100px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .tutorial-card {
    background: white;
    border-radius: var(--radius-md);
    padding: 16px;
    box-shadow: var(--shadow-1);
    display: flex;
    gap: 14px;
    cursor: pointer;
    transition: transform .2s;
    position: relative;
    overflow: hidden;
  }
  .tutorial-card:active { transform: scale(.98); }
  .tutorial-card .step-num {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--bamboo) 0%, var(--bamboo-dark) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Noto Serif SC", serif;
    font-size: 22px;
    font-weight: 900;
    color: white;
    flex-shrink: 0;
    box-shadow: 0 4px 10px rgba(201,166,74,.3);
  }
  .tutorial-card .step-info { flex: 1; }
  .tutorial-card h3 {
    font-family: "Noto Serif SC", serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .tutorial-card p {
    font-size: 12px;
    color: var(--ink-3);
    line-height: 1.5;
  }
  .tutorial-card .duration {
    font-size: 11px;
    color: var(--willow-dark);
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* 线轴转动动画 */
  .spinner {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 3px solid var(--bamboo);
    position: relative;

/* ============ 下拉刷新 Hook ============ */
const usePullToRefresh = (onRefresh, scrollRef) => {
  const [pullDistance, setPullDistance] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const startY = useRef(0);
  const pulling = useRef(false);

  const handleTouchStart = e => {
    if (scrollRef.current && scrollRef.current.scrollTop <= 0) {
      startY.current = e.touches[0].clientY;
      pulling.current = true;
    }
  };

  const handleTouchMove = e => {
    if (!pulling.current || refreshing) return;
    const dy = e.touches[0].clientY - startY.current;
    if (dy > 0) {
      const damped = Math.min(dy * 0.5, 80);
      setPullDistance(damped);
    }
  };

  const handleTouchEnd = () => {
    if (!pulling.current) return;
    pulling.current = false;
    if (pullDistance > 60 && !refreshing) {
      setRefreshing(true);
      setPullDistance(60);
      onRefresh && onRefresh(() => {
        setRefreshing(false);
        setPullDistance(0);
      });
    } else {
      setPullDistance(0);
    }
  };

  return { pullDistance, refreshing, handleTouchStart, handleTouchMove, handleTouchEnd };
};

/* ============ 风力指针 (物理模拟) ============ */
const WindNeedle = ({ speed = 4.2 }) => {
  const needleRef = useRef(null);
  const angle = useRef(0);
  const velocity = useRef(0);
  const rafId = useRef(null);

  useEffect(() => {
    const target = speed * 8; // 风速 -> 角度
    const animate = () => {
      // 弹簧阻尼物理模型
      const spring = 0.06;
      const damping = 0.85;
      const force = (target - angle.current) * spring;
      velocity.current = (velocity.current + force) * damping;
      // 加入微小随机风扰动
      velocity.current += (Math.random() - 0.5) * 0.3;
      angle.current += velocity.current;

      if (needleRef.current) {
        needleRef.current.style.transform = `translateX(-50%) rotate(${angle.current}deg)`;
      }
      rafId.current = requestAnimationFrame(animate);
    };
    rafId.current = requestAnimationFrame(animate);
    return () => cancelAnimationFrame(rafId.current);
  }, [speed]);

  return (
    <div ref={needleRef} style={{
      position: 'absolute',
      bottom: '50%',
      left: '50%',
      width: '3px',
      height: '40px',
      background: 'linear-gradient(to top, white, transparent)',
      transformOrigin: 'bottom center',
      borderRadius: '2px',
      zIndex: 2,
    }}/>
  );
};

    if (kite.cat === '串式类') return 'dragon';
    if (kite.name.includes('八卦')) return 'bagua';
    return 'plate';

  // 视差滚动 + 风筝飘动

    const scroller = scrollRef.current;
    if (!scroller) return;

    let ticking = false;
    const handleScroll = () => {
      if (!ticking) {
        requestAnimationFrame(() => {
          const y = scroller.scrollTop;
          setScrollY(y);
          ticking = false;
        });
        ticking = true;
      }

    scroller.addEventListener('scroll', handleScroll, { passive: true });

const ProfilePage = ({ onOpenSpec, onOpenApi }) => {
  const progress = 68; // 68%
  const ringRef = useRef(null);
  const animatedProgress = useRef(0);
  const rafId = useRef(null);

  // 环形进度动画（弹簧）
  useEffect(() => {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;

    let vel = 0;
    let cur = 0;
    const target = progress;
    const spring = 0.08;
    const damping = 0.9;

    const animate = () => {
      const force = (target - cur) * spring;
      vel = (vel + force) * damping;
      cur += vel;
      animatedProgress.current = cur;

      if (ringRef.current) {
        const circle = ringRef.current.querySelector('.ring-foreground');
        if (circle) {
          const circumference = 2 * Math.PI * 40;
          const offset = circumference - (cur / 100) * circumference;
          circle.style.strokeDashoffset = offset;
        }
        const numEl = ringRef.current.querySelector('.big');
        if (numEl) numEl.textContent = Math.round(cur) + '%';
      }

      if (Math.abs(target - cur) > 0.1 || Math.abs(vel) > 0.05) {
        rafId.current = requestAnimationFrame(animate);
      }
    };
    rafId.current = requestAnimationFrame(animate);
    return () => cancelAnimationFrame(rafId.current);
  }, []);

  // 可见性切换时暂停/恢复
  useEffect(() => {
    const handleVis = () => {
      if (document.hidden) {

      }

    return () => document.removeEventListener('visibilitychange', handleVis);

          <h3 style={{ fontFamily: '"Noto Serif SC", serif', fontSize: 16, fontWeight: 700, color: 'var(--ink)' }}>基础信息</h3>
        </div>
        <div className="api-endpoint">
          <div style={{ fontSize: 13, color: 'var(--ink-2)', lineHeight: 1.8 }}>
            <div><b style={{ color: 'var(--ink)' }}>Base URL：</b><code style={{ fontFamily: '"Noto Sans Mono", monospace', background: 'var(--paper-2)', padding: '2px 6px', borderRadius: 4, fontSize: 12 }}>https://api.zhiyuanji.com/v1</code></div>
            <div><b style={{ color: 'var(--ink)' }}>认证方式：</b>Bearer Token (JWT)</div>
            <div><b style={{ color: 'var(--ink)' }}>数据格式：</b>JSON (UTF-8)</div>
            <div><b style={{ color: 'var(--ink)' }}>限流规则：</b>100 次/分钟 / IP</div>
          </div>
        </div>

        <div style={{ padding: '16px 20px 8px' }}>
          <h3 style={{ fontFamily: '"Noto Serif SC", serif', fontSize: 16, fontWeight: 700, color: 'var(--ink)' }}>接口列表</h3>
        </div>

        {endpoints.map((ep, i) => (
          <div key={i} className="api-endpoint">
            <div>
              <span className={`api-method ${ep.method.toLowerCase()}`}>{ep.method}</span>
              <span className="api-path">{ep.path}</span>
            </div>
            <div className="api-desc">{ep.desc}</div>
            <div className="api-code">{ep.response}</div>
          </div>
        ))}

        <div style={{ padding: '20px 20px 100px', fontSize: 12, color: 'var(--ink-3)', textAlign: 'center' }}>
          © 2026 纸鸢集 · 接口文档 v1.0
        </div>
      </div>
    </div>
  );
};

/* ============ 底部抽屉：活动详情 ============ */
const ActivitySheet = ({ activity, onClose }) => {
  if (!activity) return null;
  return (
    <>
      <div className="modal-backdrop" onClick={onClose}/>
      <div className="bottom-sheet">
        <div className="sheet-handle"/>
        <h2 style={{ fontFamily: '"Noto Serif SC", serif', fontSize: 22, fontWeight: 900, marginBottom: 4 }}>{activity.title}</h2>
        <p style={{ fontSize: 13, color: 'var(--ink-3)', marginBottom: 16 }}>
          {activity.month} {activity.day}日 · 📍 {activity.place}
        </p>

        <div style={{ background: 'var(--paper-2)', borderRadius: 12, padding: 14, marginBottom: 16 }}>
          <div style={{ fontSize: 13, lineHeight: 1.8, color: 'var(--ink-2)' }}>
            召集同城筝友一起放飞交流。现场提供风筝试用、新手教学，还有传统扎制艺人现场演示。
            欢迎带上你心爱的风筝，来一场春风里的聚会。
          </div>
        </div>

        <div style={{ display: 'flex', gap: 10, marginBottom: 16 }}>
          <div style={{ flex: 1, textAlign: 'center', padding: 10, background: 'var(--paper-2)', borderRadius: 10 }}>
            <div style={{ fontSize: 20, fontWeight: 700, color: 'var(--willow-dark)', fontFamily: '"Noto Serif SC", serif' }}>{activity.people}</div>
            <div style={{ fontSize: 11, color: 'var(--ink-3)' }}>已报名</div>
          </div>
          <div style={{ flex: 1, textAlign: 'center', padding: 10, background: 'var(--paper-2)', borderRadius: 10 }}>
            <div style={{ fontSize: 20, fontWeight: 700, color: 'var(--azure-dark)', fontFamily: '"Noto Serif SC", serif' }}>50</div>
            <div style={{ fontSize: 11, color: 'var(--ink-3)' }}>名额上限</div>
          </div>
          <div style={{ flex: 1, textAlign: 'center', padding: 10, background: 'var(--paper-2)', borderRadius: 10 }}>
            <div style={{ fontSize: 20, fontWeight: 700, color: 'var(--rouge)', fontFamily: '"Noto Serif SC", serif' }}>免费</div>
            <div style={{ fontSize: 11, color: 'var(--ink-3)' }}>费用</div>
          </div>
        </div>

        <button style={{
          width: '100%',
          height: 48,
          borderRadius: 24,
          border: 'none',
          background: 'var(--rouge)',
          color: 'white',
          fontSize: 15,
          fontWeight: 600,
          cursor: 'pointer',
          boxShadow: '0 4px 12px rgba(194,74,74,.35)',
        }} onClick={onClose}>立即报名</button>
      </div>
    </>
  );
};

/* ============ 主 App 组件 ============ */
const App = () => {
  // 主栈导航：home / sites / atlas / tutorial / profile 底部 tab
  // 详情页：kiteDetail, spec, api 为压栈页面
  // 底部抽屉：activitySheet
  const [tab, setTab] = useState('home');
  const [stack, setStack] = useState([]); // [{name, props, direction}]
  const [sheet, setSheet] = useState(null); // {type, data}
  const [animating, setAnimating] = useState(false);

  const tabs = [
    { key: 'home', label: '首页', icon: (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    )},
    { key: 'sites', label: '场地', icon: (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
    )},
    { key: 'atlas', label: '图谱', icon: (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
    )},
    { key: 'tutorial', label: '教程', icon: (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
    )},
    { key: 'profile', label: '我的', icon: (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    )},
  ];

  const pushPage = (name, props = {}) => {
    if (animating) return;
    setAnimating(true);
    setStack(prev => [...prev, { name, props, key: Date.now() }]);
    setTimeout(() => setAnimating(false), 350);
  };

  const popPage = () => {
    if (animating || stack.length === 0) return;
    setAnimating(true);
    // 标记最后一页为退出状态
    setStack(prev => prev.map((p, i) => i === prev.length - 1 ? { ...p, exiting: true } : p));
    setTimeout(() => {
      setStack(prev => prev.slice(0, -1));
      setAnimating(false);
    }, 300);
  };

  const openSheet = (type, data) => {
    setSheet({ type, data });
  };

  const closeSheet = () => setSheet(null);

  const handleTabSwitch = (key) => {
    if (animating) return;
    if (key === tab) return;
    setStack([]);
    setTab(key);
  };

  const renderTabPage = () => {
    switch (tab) {
      case 'home':
        return <HomePage
          onOpenSite={(site) => {
            if (site && site.id) pushPage('siteDetail', { site });
            else setTab('sites');
          }}
          onOpenKite={(kite) => {
            if (kite && kite.id) pushPage('kiteDetail', { kite });
            else setTab('atlas');
          }}
          onOpenActivity={(act) => {
            if (act && act.id) openSheet('activity', act);
            else openSheet('activityList');
          }}
        />;
      case 'sites':
        return <SitePage
          onBack={() => setTab('home')}
          onOpenSite={(site) => pushPage('siteDetail', { site })}
        />;
      case 'atlas':
        return <AtlasPage onOpenKite={(kite) => pushPage('kiteDetail', { kite })}/>;
      case 'tutorial':
        return <TutorialPage onOpenTutorial={() => {}}/>;
      case 'profile':
        return <ProfilePage
          onOpenSpec={() => pushPage('spec')}
          onOpenApi={() => pushPage('api')}
        />;
      default:
        return null;
    }
  };

  const renderStackPage = (page) => {
    switch (page.name) {
      case 'kiteDetail':
        return <KiteDetailPage kite={page.props.kite} onBack={popPage}/>;
      case 'siteDetail':
        // 简易场地详情
        return (
          <div className="page paper-bg">
            <StatusBar style="dark"/>
            <div className="nav-bar">
              <div className="left-btn" onClick={popPage}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                返回
              </div>
              <div className="nav-inline-title">场地详情</div>
              <div className="right-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
              </div>
            </div>
            <div className="scroll-area">
              <div style={{
                height: 200,
                background: `linear-gradient(135deg, ${page.props.site.color} 0%, var(--paper-2) 100%)`,
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                position: 'relative',
              }}>
                <KiteSVG color="white" size={100} type="swallow"/>
                <div style={{
                  position: 'absolute',
                  bottom: 16, right: 16,
                  background: 'rgba(255,255,255,.9)',
                  backdropFilter: 'blur(10px)',
                  padding: '6px 12px',
                  borderRadius: 14,
                  fontSize: 12,
                  fontWeight: 600,
                  color: 'var(--willow-dark)',
                }}>
                  ★ {page.props.site.rating}
                </div>
              </div>
              <div style={{ padding: 20 }}>
                <h1 style={{ fontFamily: '"Noto Serif SC", serif', fontSize: 24, fontWeight: 900, marginBottom: 6 }}>
                  {page.props.site.name}
                </h1>
                <p style={{ fontSize: 13, color: 'var(--ink-3)', marginBottom: 16 }}>
                  {page.props.site.district} · {page.props.site.distance} · {page.props.site.type}
                </p>
                <div className="bamboo-divider"/>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 20 }}>
                  <div style={{ textAlign: 'center' }}>
                    <div style={{ fontSize: 24, fontWeight: 900, color: 'var(--willow-dark)', fontFamily: '"Noto Serif SC", serif' }}>
                      {page.props.site.wind}
                    </div>
                    <div style={{ fontSize: 11, color: 'var(--ink-3)' }}>风速 m/s</div>
                  </div>
                  <div style={{ textAlign: 'center' }}>
                    <div style={{ fontSize: 24, fontWeight: 900, color: 'var(--azure-dark)', fontFamily: '"Noto Serif SC", serif' }}>
                      {page.props.site.level}
                    </div>
                    <div style={{ fontSize: 11, color: 'var(--ink-3)' }}>适飞等级</div>
                  </div>
                  <div style={{ textAlign: 'center' }}>
                    <div style={{ fontSize: 24, fontWeight: 900, color: 'var(--rouge)', fontFamily: '"Noto Serif SC", serif' }}>
                      {page.props.site.flyers}
                    </div>
                    <div style={{ fontSize: 11, color: 'var(--ink-3)' }}>在场筝友</div>
                  </div>
                </div>
                <h3 style={{ fontFamily: '"Noto Serif SC", serif', fontSize: 17, fontWeight: 700, marginBottom: 8 }}>场地介绍</h3>
                <p style={{ fontSize: 14, color: 'var(--ink-2)', lineHeight: 1.7, marginBottom: 100 }}>
                  该场地视野开阔，周边无高压线路与高层建筑，是理想的放飞场所。场地内有草坪与步行道，
                  适合各类中大型风筝放飞。节假日人流量较大，建议早间前往。附近设有停车场与卫生间，配套设施完善。
                </p>
              </div>
            </div>
          </div>
        );
      case 'spec':
        return <SpecPage onBack={popPage}/>;
      case 'api':
        return <ApiPage onBack={popPage}/>;
      default:
        return null;
    }
  };

  return (
    <div className="app-root">
      {/* Tab 页面 */}
      {renderTabPage()}

      {/* 底部 TabBar */}
      <TabBar active={tab} onSwitch={handleTabSwitch} tabs={tabs}/>

      {/* 栈页面（覆盖在上方） */}
      {stack.map((page, i) => (
        <div
          key={page.key}
          className={page.exiting ? 'page-exit-to-right' : 'page-enter-from-right'}
          style={{ zIndex: 300 + i }}
        >
          {renderStackPage(page)}
        </div>
      ))}

      {/* 底部抽屉 */}
      {sheet && sheet.type === 'activity' && (
        <ActivitySheet activity={sheet.data} onClose={closeSheet}/>
      )}
    </div>
  );
};

/* ============ 升级为全栈应用宣告 ============ */
function announceUpgrade() {
  try {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  } catch (e) {}
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}

/* ============ 渲染 ============ */
const root = ReactDOM.createRoot(document.getElementById('app'));
root.render(<App/>);
</script>
</body>
</html>

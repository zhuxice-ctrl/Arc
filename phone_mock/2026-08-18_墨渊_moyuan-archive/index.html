<style>
  /* ─── 全局重置 ─── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse at 20% 20%, rgba(194,59,34,0.08), transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(184,145,74,0.08), transparent 50%),
      linear-gradient(135deg, #E8DFC8 0%, #D4C4A0 50%, #C9B896 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans SC', -apple-system, system-ui, sans-serif;
    cursor: none;
    position: relative;
  }

  /* ─── 宣纸纹理背景 ─── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.65 0 0 0 0 0.55 0 0 0 0 0.4 0 0 0 0.08 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.6;
    pointer-events: none;
    z-index: 0;
  }

  /* ─── 自定义光标 ─── */
  .custom-cursor {
    position: fixed;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle, #C23B22 0%, #8B2A18 100%);
    box-shadow: 0 0 12px rgba(194,59,34,0.5), 0 0 2px #C23B22;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.2s cubic-bezier(.34,1.56,.64,1), height 0.2s cubic-bezier(.34,1.56,.64,1), background 0.2s, box-shadow 0.2s;
    will-change: transform;
  }
  .custom-cursor::after {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1px solid rgba(194,59,34,0.4);
    opacity: 0;
    transition: opacity 0.2s, inset 0.2s;
  }
  .custom-cursor.hovering {
    width: 36px;
    height: 36px;
    background: transparent;
    box-shadow: none;
  }
  .custom-cursor.hovering::after {
    opacity: 1;
    inset: 0;
    border-color: #C23B22;
    border-width: 1.5px;
  }
  .custom-cursor.clicking {
    transform: translate(-50%, -50%) scale(0.7);
  }

  /* ─── 涟漪效果 ─── */
  .cursor-ripple {
    position: fixed;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1.5px solid #C23B22;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    animation: rippleExpand 0.6s cubic-bezier(.25,.8,.25,1) forwards;
  }
  @keyframes rippleExpand {
    0% { width: 10px; height: 10px; opacity: 0.8; }
    100% { width: 60px; height: 60px; opacity: 0; }
  }

  /* ─── 设备容器 ─── */
  .app-stage {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .app-title {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 28px;
    color: #1A1612;
    letter-spacing: 8px;
    writing-mode: vertical-rl;
    position: absolute;
    right: 40px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.6;
  }
  .app-subtitle {
    font-family: 'Noto Serif SC', serif;
    font-size: 13px;
    color: #7A5C3E;
    letter-spacing: 3px;
    writing-mode: vertical-rl;
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.5;
  }

  /* ─── 印章装饰 ─── */
  .seal-decor {
    position: absolute;
    left: 30px;
    top: 50%;
    transform: translateY(-50%) rotate(-8deg);
    width: 80px;
    height: 80px;
    border: 3px solid #C23B22;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 22px;
    color: #C23B22;
    letter-spacing: 2px;
    writing-mode: vertical-rl;
    line-height: 1;
    opacity: 0.7;
  }

  /* ─── App 内容滚动区（隐藏滚动条） ─── */
  .app-scroll {
    overflow: hidden;
    scrollbar-width: none;
  }
  .app-scroll::-webkit-scrollbar { display: none; }

  /* ─── 通用 ─── */
  .serif { font-family: 'Noto Serif SC', serif; }
  .title-font { font-family: 'ZCOOL XiaoWei', serif; }
  .vrl { writing-mode: vertical-rl; }
  .no-select {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  /* ─── 入场墨迹动画 ─── */
  @keyframes inkSpread {
    0% { opacity: 0; transform: scale(0.3); filter: blur(20px); }
    50% { opacity: 0.8; filter: blur(2px); }
    100% { opacity: 1; transform: scale(1); filter: blur(0); }
  }
  @keyframes inkDrop {
    0% { opacity: 0; transform: translateY(-20px) scale(0.5); }
    60% { opacity: 1; transform: translateY(4px) scale(1.1); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes sealStamp {
    0% { opacity: 0; transform: scale(2) rotate(15deg); filter: blur(4px); }
    70% { opacity: 0.9; transform: scale(0.95) rotate(-2deg); }
    100% { opacity: 1; transform: scale(1) rotate(-3deg); filter: blur(0); }
  }
  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(16px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(1.03); opacity: 1; }
  }
  @keyframes floatY {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  @keyframes spinSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes pulseRing {
    0% { box-shadow: 0 0 0 0 rgba(194,59,34,0.4); }
    70% { box-shadow: 0 0 0 12px rgba(194,59,34,0); }
    100% { box-shadow: 0 0 0 0 rgba(194,59,34,0); }
  }

  /* reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .custom-cursor { transition: none; }
  }

  /* 页切换过渡 */
  .page-enter {
    animation: pageSlideIn 0.35s cubic-bezier(.32,.72,0,1);
  }
  @keyframes pageSlideIn {
    0% { opacity: 0; transform: translateX(30px); }
    100% { opacity: 1; transform: translateX(0); }
  }

  /* 模态弹窗背景 */
  .modal-bg {
    position: absolute;
    inset: 0;
    background: rgba(26,22,18,0.5);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .modal-bg.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* 底部抽屉 */
  .bottom-sheet {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 110;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(.32,.72,0,1);
    border-radius: 24px 24px 0 0;
  }
  .bottom-sheet.open {
    transform: translateY(0);
  }

  /* 长按菜单 */
  .long-press-menu {
    position: absolute;
    z-index: 200;
    background: rgba(30,26,22,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 14px;
    padding: 6px;
    opacity: 0;
    transform: scale(0.8);
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s cubic-bezier(.34,1.56,.64,1);
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  .long-press-menu.show {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }

  /* 下拉刷新指示器 */
  .pull-indicator {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: height 0.2s;
  }
</style>

// ───────────────────────────────────────────
// 工具：自定义光标控制
// ───────────────────────────────────────────
function useCustomCursor() {
  const cursorRef = useRef(null);
  const rafRef = useRef(null);
  const targetRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });
  const currentRef = useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2 });

  useEffect(() => {
    const cursor = document.getElementById('customCursor');
    cursorRef.current = cursor;
    if (!cursor) return;

    // 初始位置屏幕中央
    cursor.style.left = window.innerWidth / 2 + 'px';
    cursor.style.top = window.innerHeight / 2 + 'px';

    const onMove = (e) => {
      targetRef.current.x = e.clientX;
      targetRef.current.y = e.clientY;
    };

    const animate = () => {
      const cx = currentRef.current.x;
      const cy = currentRef.current.y;
      const tx = targetRef.current.x;
      const ty = targetRef.current.y;
      // 阻尼跟随
      const nx = cx + (tx - cx) * 0.25;
      const ny = cy + (ty - cy) * 0.25;
      currentRef.current.x = nx;
      currentRef.current.y = ny;
      if (cursorRef.current) {
        cursorRef.current.style.transform = `translate(${nx}px, ${ny}px) translate(-50%, -50%)`;
      }
      rafRef.current = requestAnimationFrame(animate);
    };
    rafRef.current = requestAnimationFrame(animate);

    const onVisibility = () => {
      if (document.hidden) {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
      } else {
        rafRef.current = requestAnimationFrame(animate);
      }
    };

    window.addEventListener('mousemove', onMove);
    document.addEventListener('visibilitychange', onVisibility);

    return () => {
      window.removeEventListener('mousemove', onMove);
      document.removeEventListener('visibilitychange', onVisibility);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, []);
}

// 涟漪点击效果
function createRipple(x, y) {
  const ripple = document.createElement('div');
  ripple.className = 'cursor-ripple';
  ripple.style.left = x + 'px';
  ripple.style.top = y + 'px';
  document.body.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
}

// hover 交互元素检测
function useCursorHover() {
  useEffect(() => {
    const cursor = document.getElementById('customCursor');
    if (!cursor) return;

    const onOver = (e) => {
      const el = e.target.closest('button, a, [role="button"], .clickable');
      if (el) cursor.classList.add('hovering');
    };
    const onOut = (e) => {
      const el = e.target.closest('button, a, [role="button"], .clickable');
      if (el) cursor.classList.remove('hovering');
    };
    const onDown = () => cursor.classList.add('clicking');
    const onUp = () => cursor.classList.remove('clicking');

    document.addEventListener('mouseover', onOver);
    document.addEventListener('mouseout', onOut);
    document.addEventListener('mousedown', onDown);
    document.addEventListener('mouseup', onUp);

    return () => {
      document.removeEventListener('mouseover', onOver);
      document.removeEventListener('mouseout', onOut);
      document.removeEventListener('mousedown', onDown);
      document.removeEventListener('mouseup', onUp);
    };
  }, []);
}

// 全局点击涟漪
function useGlobalRipple() {
  useEffect(() => {
    const onClick = (e) => {
      const el = e.target.closest('button, a, [role="button"], .clickable');
      if (el) createRipple(e.clientX, e.clientY);
    };
    document.addEventListener('click', onClick);
    return () => document.removeEventListener('click', onClick);
  }, []);
}

function HomePage({ onOpenBook }) {
  const scrollRef = useRef(null);
  const [pullDistance, setPullDistance] = useState(0);
  const [isRefreshing, setIsRefreshing] = useState(false);
  const touchStartY = useRef(0);
  const isPulling = useRef(false);

  const handleTouchStart = (e) => {
    if (scrollRef.current && scrollRef.current.scrollTop <= 0) {
      touchStartY.current = e.touches ? e.touches[0].clientY : e.clientY;
      isPulling.current = true;
    }
  };
  const handleTouchMove = (e) => {
    if (!isPulling.current || isRefreshing) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const diff = y - touchStartY.current;
    if (diff > 0) {
      const damped = Math.min(diff * 0.5, 80);
      setPullDistance(damped);
    }
  };
  const handleTouchEnd = () => {
    if (!isPulling.current) return;
    isPulling.current = false;
    if (pullDistance > 50) {
      setIsRefreshing(true);
      setPullDistance(60);
      setTimeout(() => {
        setIsRefreshing(false);
        setPullDistance(0);
      }, 1500);
    } else {
      setPullDistance(0);
    }
  };

  const featured = BOOKS[3]; // 金刚经
  const dailyBook = BOOKS[0]; // 南华经

      ref={scrollRef}

        background: `linear-gradient(180deg, ${C.paperWarm} 0%, ${C.paper} 30%, ${C.paperDark} 100%)`,

      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}
      onTouchEnd={handleTouchEnd}
      onMouseDown={handleTouchStart}

      onMouseUp={handleTouchEnd}
      onMouseLeave={handleTouchEnd}

      {/* 下拉刷新指示器 */}

function DiscoveryPage() {
  const [activeSlide, setActiveSlide] = useState(0);
  const scrollRef = useRef(null);
  const timerRef = useRef(null);

  const slides = [
    { title: '宋版风韵', desc: '两宋刻本珍品展', color: C.vermilion, img: BOOKS[0].coverGradient },
    { title: '敦煌遗书', desc: '藏经洞写卷精选', color: C.gold, img: BOOKS[3].coverGradient },
    { title: '古版新研', desc: '当代学者论著', color: C.celadon, img: BOOKS[2].coverGradient },
  ];

  // 自动轮播
  useEffect(() => {
    const startAuto = () => {
      if (timerRef.current) clearInterval(timerRef.current);
      timerRef.current = setInterval(() => {
        setActiveSlide(p => (p + 1) % slides.length);
      }, 4000);
    };
    startAuto();
    const onVisibility = () => {
      if (document.hidden) {
        if (timerRef.current) clearInterval(timerRef.current);
      } else {
        startAuto();
      }
    };
    document.addEventListener('visibilitychange', onVisibility);
    return () => {
      if (timerRef.current) clearInterval(timerRef.current);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, [slides.length]);

  return (
    <div ref={scrollRef} className="app-scroll" style={{

function ProfilePage({ onOpenSpecs, onOpenAPI }) {
  const [readProgress, setReadProgress] = useState(0);

  useEffect(() => {
    // 环形进度动画
    let raf;
    let startTime = null;
    const target = 72;
    const duration = 1500;
    const animate = (ts) => {
      if (!startTime) startTime = ts;
      const progress = Math.min((ts - startTime) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setReadProgress(Math.round(target * eased));
      if (progress < 1) raf = requestAnimationFrame(animate);
    };
    raf = requestAnimationFrame(animate);
    const onVis = () => {
      if (document.hidden && raf) cancelAnimationFrame(raf);
    };
    document.addEventListener('visibilitychange', onVis);
    return () => {
      if (raf) cancelAnimationFrame(raf);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, []);

  const stats = [
    { label: '已藏', value: 28 },

function BookDetailPage({ book, onBack }) {
  const scrollRef = useRef(null);
  const [scrollY, setScrollY] = useState(0);
  const [liked, setLiked] = useState(false);
  const [bookmarked, setBookmarked] = useState(true);
  const [showLongPress, setShowLongPress] = useState(false);
  const longPressPos = useRef({ x: 0, y: 0 });
  const longPressTimer = useRef(null);

  const handleScroll = useCallback(() => {
    if (scrollRef.current) {
      setScrollY(scrollRef.current.scrollTop);
    }
  }, []);

  const parallax = scrollY * 0.3;
  const headerOpacity = Math.min(scrollY / 200, 1);
  const titleScale = Math.max(1 - scrollY / 500, 0.8);

  // 长按
  const handleLongPressStart = (e) => {
    const x = e.clientX || e.touches?.[0]?.clientX || 0;
    const y = e.clientY || e.touches?.[0]?.clientY || 0;
    longPressPos.current = { x, y };
    longPressTimer.current = setTimeout(() => {
      setShowLongPress(true);
      // 触觉反馈效果
    }, 500);
  };
  const handleLongPressEnd = () => {
    if (longPressTimer.current) clearTimeout(longPressTimer.current);
  };

  return (
    <div style={{ position: 'relative', height: '100%' }}>
      {/* 滚动容器 */}
      <div
        ref={scrollRef}
        className="app-scroll"
        style={{
          height: '100%',
          overflowY: 'auto',
          background: C.paper,
        }}
        onScroll={handleScroll}
        onTouchStart={handleLongPressStart}
        onTouchEnd={handleLongPressEnd}
        onMouseDown={handleLongPressStart}
        onMouseUp={handleLongPressEnd}
        onMouseLeave={() => { handleLongPressEnd(); setShowLongPress(false); }}

// ───────────────────────────────────────────
// 主 App 组件
// ───────────────────────────────────────────
function App() {
  const [activeTab, setActiveTab] = useState('home');
  const [navStack, setNavStack] = useState([]);
  const [selectedBook, setSelectedBook] = useState(null);
  const [showSpecs, setShowSpecs] = useState(false);
  const [showAPI, setShowAPI] = useState(false);
  const [fabVisible, setFabVisible] = useState(true);

  // 自定义光标
  useCustomCursor();
  useCursorHover();
  useGlobalRipple();

  const handleTabChange = (tab) => {
    setActiveTab(tab);
    setNavStack([]);
    setSelectedBook(null);
    setShowSpecs(false);
    setShowAPI(false);
  };

  const handleOpenBook = (book) => {
    setSelectedBook(book);
    setNavStack(prev => [...prev, 'book-detail']);
  };

  const handleBack = () => {
    const newStack = navStack.slice(0, -1);
    setNavStack(newStack);
    if (navStack[navStack.length - 1] === 'book-detail') {
      setSelectedBook(null);
    }
  };

  const handleOpenSpecs = () => {
    setShowSpecs(true);
    setNavStack(prev => [...prev, 'specs']);
  };

  const handleOpenAPI = () => {
    setShowAPI(true);
    setNavStack(prev => [...prev, 'api']);
  };

  const handleCloseSpecs = () => {
    setShowSpecs(false);
    setNavStack(prev => prev.filter(p => p !== 'specs'));
  };

  const handleCloseAPI = () => {
    setShowAPI(false);
    setNavStack(prev => prev.filter(p => p !== 'api'));
  };

  const inDetail = navStack.length > 0;
  const showTabBar = !inDetail;

  // 渲染主内容
  const renderMainContent = () => {
    switch (activeTab) {
      case 'home': return <HomePage onOpenBook={handleOpenBook} />;
      case 'shelf': return <ShelfPage onOpenBook={handleOpenBook} />;
      case 'discovery': return <DiscoveryPage />;
      case 'profile': return <ProfilePage onOpenSpecs={handleOpenSpecs} onOpenAPI={handleOpenAPI} />;
      default: return null;
    }
  };

  return (
    <IOSDevice dark={activeTab === 'discovery' && !inDetail || (showSpecs && activeTab === 'profile') ? false : false}>
      <div style={{
        position: 'relative',
        height: '100%',
        overflow: 'hidden',
      }}>
        {/* 主页面层 */}
        <div style={{
          position: 'absolute',
          inset: 0,
          opacity: inDetail ? 0.3 : 1,
          transition: 'opacity 0.3s',
          pointerEvents: inDetail ? 'none' : 'auto',
        }}>
          {renderMainContent()}
        </div>

        {/* 书籍详情页（覆盖层） */}
        {selectedBook && (
          <div className="page-enter" style={{
            position: 'absolute',
            inset: 0,
            zIndex: 50,
          }}>
            <BookDetailPage
              book={selectedBook}
              onBack={handleBack}
            />
          </div>
        )}

        {/* 设计规范页 */}
        {showSpecs && (
          <div className="page-enter" style={{
            position: 'absolute',
            inset: 0,
            zIndex: 50,
          }}>
            <DesignSpecsPage onBack={handleCloseSpecs} />
          </div>
        )}

        {/* 接口文档页 */}
        {showAPI && (
          <div className="page-enter" style={{
            position: 'absolute',
            inset: 0,
            zIndex: 50,
          }}>
            <APIDocsPage onBack={handleCloseAPI} />
          </div>
        )}

        {/* TabBar */}
        {showTabBar && (
          <TabBar activeTab={activeTab} onTabChange={handleTabChange} />
        )}

        {/* FAB - 首页显示 */}
        <FAB
          visible={activeTab === 'home' && !inDetail}
          onClick={() => {}}
        />
      </div>
    </IOSDevice>
  );
}

// ───────────────────────────────────────────
// 渲染
// ───────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('appRoot'));
root.render(<App />);

// 宣告可升级
function announceUpgrade() {
  try {
    window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
  } catch (e) {}
}
announceUpgrade();
if (document.readyState !== 'complete') {
  window.addEventListener('load', announceUpgrade, { once: true });
}
</script>
</body>

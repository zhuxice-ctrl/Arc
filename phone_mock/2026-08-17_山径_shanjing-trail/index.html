/* ============================================================
   自定义光标
   ============================================================ */
function CustomCursor() {
  const ringRef = useRef(null);
  const dotRef = useRef(null);
  const [hovering, setHovering] = useState(false);
  const [clicking, setClicking] = useState(false);
  const rippleRef = useRef(null);
  const rafRef = useRef(0);
  const targetRef = useRef({ x: 0, y: 0 });
  const currentRef = useRef({ x: 0, y: 0 });
  const visibleRef = useRef(false);

  useEffect(() => {
    let running = true;
    let hidden = false;

    const tick = () => {
      if (!running) return;
      if (hidden) { rafRef.current = requestAnimationFrame(tick); return; }
      const t = targetRef.current;
      const c = currentRef.current;
      // 阻尼跟随
      c.x += (t.x - c.x) * 0.18;
      c.y += (t.y - c.y) * 0.18;
      if (ringRef.current) {
        ringRef.current.style.transform = `translate3d(${c.x}px, ${c.y}px, 0) translate(-50%,-50%) scale(${hovering ? 1.6 : 1})`;
      }
      if (dotRef.current) {
        dotRef.current.style.transform = `translate3d(${t.x}px, ${t.y}px, 0) translate(-50%,-50%) scale(${clicking ? 0.6 : 1})`;
      }
      rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);

    const onMove = (e) => {
      targetRef.current.x = e.clientX;
      targetRef.current.y = e.clientY;
      if (!visibleRef.current) {
        visibleRef.current = true;
        if (ringRef.current) ringRef.current.style.opacity = "1";
        if (dotRef.current) dotRef.current.style.opacity = "1";
      }
    };

    const onOver = (e) => {
      const t = e.target.closest("button, a, .interactive, [role=button]");
      setHovering(!!t);
    };

    const onDown = () => {
      setClicking(true);
      // 涟漪
      const ripple = document.createElement("div");
      ripple.style.cssText = `
        position:fixed;z-index:9998;pointer-events:none;
        left:${targetRef.current.x}px;top:${targetRef.current.y}px;
        width:20px;height:20px;border-radius:50%;
        border:2px solid ${T.sun};transform:translate(-50%,-50%) scale(1);
        opacity:.9;
      `;
      document.body.appendChild(ripple);
      requestAnimationFrame(() => {
        ripple.style.transition = "all .6s cubic-bezier(.2,.8,.2,1)";
        ripple.style.transform = "translate(-50%,-50%) scale(8)";
        ripple.style.opacity = "0";
      });
      setTimeout(() => ripple.remove(), 650);
    };

    const onUp = () => setClicking(false);

    const onVisibility = () => {
      hidden = document.hidden;
    };

    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseover", onOver);
    window.addEventListener("mousedown", onDown);
    window.addEventListener("mouseup", onUp);
    document.addEventListener("visibilitychange", onVisibility);

    return () => {
      running = false;
      cancelAnimationFrame(rafRef.current);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseover", onOver);
      window.removeEventListener("mousedown", onDown);
      window.removeEventListener("mouseup", onUp);
      document.removeEventListener("visibilitychange", onVisibility);
    };
  }, [hovering, clicking]);

  return (
    <>
      <div
        ref={ringRef}
        style={{
          position: "fixed", top: 0, left: 0,
          width: 32, height: 32, borderRadius: "50%",
          border: "2.5px solid #fff",
          boxShadow: `0 0 12px ${T.sun}aa, 0 0 24px ${T.moss}66, inset 0 0 6px rgba(255,255,255,.4)`,
          pointerEvents: "none", zIndex: 9999,
          opacity: 0, transition: "opacity .3s ease",
          mixBlendMode: "difference",
        }}
      />
      <div
        ref={dotRef}
        style={{
          position: "fixed", top: 0, left: 0,
          width: 8, height: 8, borderRadius: "50%",
          background: T.sun,
          boxShadow: `0 0 8px ${T.sun}`,
          pointerEvents: "none", zIndex: 9999,
          opacity: 0, transition: "opacity .3s ease",
        }}
      />
    </>
  );
}

/* ============================================================

   签名动效：入场序列 · 下拉弹性

function HomePage({ onOpenDetail }) {
  const scrollRef = useRef(null);
  const [scrollY, setScrollY] = useState(0);
  const [refreshing, setRefreshing] = useState(false);
  const [pullY, setPullY] = useState(0);
  const touchStartRef = useRef(0);
  const pullingRef = useRef(false);
  const rafRef = useRef(0);
  const heroRef = useRef(null);
  const [mounted, setMounted] = useState(false);

  useEffect(() => {
    const reduced = prefersReducedMotion();
    if (!reduced) {
      setTimeout(() => setMounted(true), 50);
    } else {
      setMounted(true);
    }
  }, []);

  // 视差滚动（直接操作 DOM，不 setState）
  useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    const reduced = prefersReducedMotion();
    let ticking = false;

    const onScroll = () => {
      if (reduced) return;
      const y = el.scrollTop;
      // 直接 transform hero
      const hero = heroRef.current;
      if (hero) {
        const parallax = y * 0.4;
        const scale = Math.max(1, 1 + y * 0.0008);
        hero.style.transform = `translate3d(0, ${parallax}px, 0) scale(${scale})`;
      }
      if (!ticking) {
        ticking = true;
        requestAnimationFrame(() => {
          setScrollY(y);
          ticking = false;
        });
      }
    };
    el.addEventListener("scroll", onScroll, { passive: true });
    return () => el.removeEventListener("scroll", onScroll);
  }, []);

  // 下拉刷新
  const onTouchStart = (e) => {
    if (scrollRef.current?.scrollTop <= 0) {
      pullingRef.current = true;
      touchStartRef.current = e.touches[0].clientY;
    }
  };
  const onTouchMove = (e) => {
    if (!pullingRef.current) return;
    const dy = e.touches[0].clientY - touchStartRef.current;
    if (dy > 0) {
      // 阻尼感
      const damped = dy * 0.5;
      setPullY(Math.min(damped, 120));
    }
  };
  const onTouchEnd = () => {
    if (!pullingRef.current) return;
    pullingRef.current = false;
    if (pullY > 70) {
      setRefreshing(true);
      setPullY(60);
      setTimeout(() => {
        setRefreshing(false);
        setPullY(0);
      }, 1500);
    } else {
      setPullY(0);
    }
  };

  const featuredTrails = [
    { id: 1, name: "雾灵山脊线",   height: 2150, distance: 12.8, hours: "7h 30m", level: "中级", img: IMG.hero,    color: T.moss },
    { id: 2, name: "苍岭十八盘",   height: 1680, distance: 9.4,  hours: "5h 10m", level: "初级", img: IMG.aerial,  color: T.sun  },
    { id: 3, name: "鹰嘴崖环线",   height: 2430, distance: 18.2, hours: "10h",    level: "高级", img: IMG.summit,  color: T.burgundy },
    { id: 4, name: "云栖谷溯溪",   height: 980,  distance: 7.6,  hours: "4h",     level: "初级", img: IMG.hikers,  color: T.clay },
  ];

  const recommend = [
    { id: 5, name: "北岭秋径",   height: 1320, distance: 10.5, tag: "赏秋" },
    { id: 6, name: "冰川遗址线", height: 3200, distance: 22.0, tag: "挑战" },
  ];

  const headerOpacity = clamp(scrollY / 120, 0, 1);
  const reduced = prefersReducedMotion();

  return (
    <div
      ref={scrollRef}
      style={{
        position: "absolute", inset: 0,
        overflowY: "auto", overflowX: "hidden",
        background: T.mist,
        WebkitOverflowScrolling: "touch",
      }}
      onTouchStart={onTouchStart}
      onTouchMove={onTouchMove}
      onTouchEnd={onTouchEnd}
    >
      {/* Hero */}
      <div style={{ position: "relative", height: 340, overflow: "hidden" }}>
        <div
          ref={heroRef}
          style={{
            position: "absolute", inset: -40,
            backgroundImage: `url(${IMG.hero})`,

            willChange: "transform",
          }}
        />
        {/* 渐变遮罩 */}
        <div style={{
          position: "absolute", inset: 0,
          background: `linear-gradient(180deg, rgba(38,38,31,.5) 0%, rgba(38,38,31,0) 40%, rgba(242,239,231,.0) 70%, ${T.mist} 100%)`,
        }} />

        {/* 下拉刷新指示器 */}
        <div style={{
          position: "absolute", top: 54 + 10, left: "50%",
          transform: `translateX(-50%) translateY(${-40 + pullY * 0.7}px)`,
          opacity: pullY > 10 ? 1 : 0,
          transition: refreshing ? "none" : "opacity .3s",
          zIndex: 5,
        }}>
          <div style={{
            width: 32, height: 32, borderRadius: "50%",

            borderTopColor: "transparent",

    const el = scrollRef.current;

    let ticking = false;
    const onScroll = () => {
      const y = el.scrollTop;
      const hero = heroRef.current;
      if (hero) {
        const parallax = y * 0.35;
        const opacity = 1 - Math.min(1, y / 200);
        hero.style.transform = `translate3d(0, ${parallax}px, 0)`;
        hero.style.opacity = opacity;

      // 进度环
      setProgress(clamp(y / 6, 0, 100));
      if (!ticking) {
        ticking = true;
        requestAnimationFrame(() => { ticking = false; });
      }
    };
    el.addEventListener("scroll", onScroll, { passive: true });
    return () => el.removeEventListener("scroll", onScroll);
  }, []);

   页面 3: 轨迹记录 —— FAB 悬浮操作球 · 实时数据
   签名动效：脉冲环 · 数据跳动
   ============================================================ */
function RecordPage() {
  const [recording, setRecording] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const [distance, setDistance] = useState(0);
  const [elevation, setElevation] = useState(0);
  const [pace, setPace] = useState(0);
  const timerRef = useRef(0);
  const rafRef = useRef(0);
  const reduced = prefersReducedMotion();

  useEffect(() => {
    let hidden = false;
    const onVis = () => { hidden = document.hidden; };
    document.addEventListener("visibilitychange", onVis);

    if (recording) {
      const tick = () => {
        if (hidden) { timerRef.current = setTimeout(tick, 1000); return; }
        setElapsed(e => e + 1);
        setDistance(d => +(d + 0.012).toFixed(2));
        setElevation(el => +(el + 0.42).toFixed(1));
        setPage(p => 4.5 + Math.random() * 1.5);
        timerRef.current = setTimeout(tick, 1000);
      };
      timerRef.current = setTimeout(tick, 1000);
    }
    return () => {
      clearTimeout(timerRef.current);
      document.removeEventListener("visibilitychange", onVis);
    };
  }, [recording]);

  const fmtTime = (s) => {
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;

  const [checks, setChecks] = useState({});

  const cats = [
    { key: "core", label: "核心装备", color: T.moss },
    { key: "cloth", label: "服装", color: T.sun },
    { key: "food", label: "补给", color: T.clay },
    { key: "safety", label: "安全", color: T.burgundy },
  ];

  const items = {
    core: [
      { id: 1, name: "登山包 45L", brand: "Osprey", weight: "1.2 kg", checked: true, color: T.moss },
      { id: 2, name: "登山杖", brand: "Black Diamond", weight: "480 g", checked: true, color: T.sun },
      { id: 3, name: "头灯", brand: "Petzl", weight: "85 g", checked: false, color: T.clay },
      { id: 4, name: "水袋 2L", brand: "Camelbak", weight: "160 g", checked: true, color: T.moss },
      { id: 5, name: "登山鞋", brand: "La Sportiva", weight: "980 g", checked: true, color: T.burgundy },
      { id: 6, name: "护膝", brand: "LP", weight: "220 g", checked: false, color: T.rock },
    ],
    cloth: [
      { id: 7, name: "冲锋衣", brand: "Arc'teryx", weight: "420 g", checked: true, color: T.moss },
      { id: 8, name: "抓绒衣", brand: "Patagonia", weight: "380 g", checked: true, color: T.sun },
      { id: 9, name: "速干裤", brand: "Salomon", weight: "320 g", checked: false, color: T.clay },
    ],
    food: [
      { id: 10, name: "能量胶 × 5", brand: "GU", weight: "150 g", checked: true, color: T.sun },
      { id: 11, name: "运动饮料", brand: "宝矿力", weight: "500 g", checked: false, color: T.moss },
      { id: 12, name: "巧克力", brand: "Ritter Sport", weight: "100 g", checked: true, color: T.burgundy },
    ],
    safety: [
      { id: 13, name: "急救包", brand: "国产", weight: "200 g", checked: true, color: T.burgundy },
      { id: 14, name: "保温毯", brand: "", weight: "50 g", checked: true, color: T.rock },
      { id: 15, name: "指南针", brand: "Suunto", weight: "35 g", checked: false, color: T.moss },
    ],
  };

  const list = items[activeCat] || [];
  const total = list.length;
  const done = list.filter(i => checks[i.id] !== undefined ? checks[i.id] : i.checked).length;
  const pct = total ? Math.round(done / total * 100) : 0;

  const toggle = (id) => {
    setChecks(c => ({ ...c, [id]: c[id] === undefined ? !(items[activeCat].find(i=>i.id===id)?.checked) : !c[id] }));
  };

  const isChecked = (item) => checks[item.id] !== undefined ? checks[item.id] : item.checked;

  const activeColor = cats.find(c => c.key === activeCat)?.color || T.moss;

  return (
    <div style={{
      position: "absolute", inset: 0,
      background: T.mist,
      overflowY: "auto",
      paddingBottom: 100,
      paddingTop: 54,
      WebkitOverflowScrolling: "touch",
    }}>
      {/* Hero 区域 —— 对角分割 */}
      <div style={{
        position: "relative",
        height: 180,
        marginBottom: -30,
      }}>
        <div style={{
          position:"absolute", inset: 0,
          background: `linear-gradient(135deg, ${T.moss} 0%, ${T.mossD} 100%)`,
        }} />
        {/* 对角分割装饰 */}
        <div style={{
          position:"absolute", right: 0, bottom: 0,
          width: "55%", height: "100%",
          clipPath: "polygon(30% 0, 100% 0, 100% 100%, 0 100%)",
          background: `linear-gradient(135deg, ${T.sun}dd 0%, ${T.sunD} 100%)`,
          opacity: .9,
        }} />
        {/* 装备图 */}
        <div style={{
          position:"absolute", right: -20, bottom: -10,
          width: 160, height: 160,
          backgroundImage: `url(${IMG.gear})`,
          backgroundSize: "cover",
          backgroundPosition: "center",
          borderRadius: 12,
          transform: "rotate(-6deg)",
          boxShadow: "-8px 8px 24px rgba(0,0,0,.2)",
        }} />

        <div style={{
          position:"relative", padding: "12px 20px",
          color: "#fff",
        }}>
          <div style={{ fontSize: 28, fontWeight: 900, fontFamily: "'Noto Serif SC', serif" }}>
            装备清单
          </div>
          <div style={{ fontSize: 12, opacity: .85, marginTop: 4, fontFamily: "'Noto Sans SC', sans-serif" }}>
            雾灵山脊线 · 12.8 km · 中级
          </div>
          <div style={{ marginTop: 14, display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{
              width: 100, height: 6, borderRadius: 3,
              background: "rgba(255,255,255,.3)",
              overflow: "hidden",
            }}>
              <div style={{
                width: `${pct}%`, height: "100%",
                background: "#fff",
                borderRadius: 3,
                transition: "width .4s cubic-bezier(.2,.8,.2,1)",
              }} />
            </div>
            <span style={{ fontSize: 13, fontWeight: 600, fontFamily: "'Noto Sans SC', sans-serif" }}>
              {done}/{total}
            </span>
          </div>
        </div>
      </div>

      {/* 分类切换 */}
      <div style={{
        position: "relative", zIndex: 5,
        display: "flex", gap: 8,
        padding: "0 16px",
        marginBottom: 14,
      }}>
        {cats.map((c) => (
          <button
            key={c.key}
            className="interactive"
            onClick={() => setActiveCat(c.key)}
            style={{
              flex: 1, padding: "10px 0",
              borderRadius: 12,
              border: "none",
              background: activeCat === c.key ? c.color : "#fff",
              color: activeCat === c.key ? "#fff" : T.rock,
              fontSize: 12, fontWeight: activeCat === c.key ? 600 : 400,
              cursor: "none",
              fontFamily: "'Noto Sans SC', sans-serif",
              boxShadow: activeCat === c.key ? `0 4px 12px ${c.color}44` : "0 2px 8px rgba(0,0,0,.04)",
              transition: "all .25s cubic-bezier(.2,.8,.2,1)",
            }}
          >{c.label}</button>
        ))}
      </div>

      {/* 装备网格 */}
      <div style={{
        padding: "0 16px",
        display: "grid", gridTemplateColumns: "1fr 1fr",
        gap: 12,
      }}>
        {list.map((item, i) => {
          const checked = isChecked(item);
          return (
            <button
              key={item.id}
              className="interactive"
              onClick={() => toggle(item.id)}
              style={{
                position: "relative",
                background: "#fff",
                borderRadius: 14,
                padding: 12,
                textAlign: "left",
                border: `1.5px solid ${checked ? item.color : "transparent"}`,
                boxShadow: "0 2px 10px rgba(0,0,0,.04)",
                cursor: "none",
                transition: "all .25s cubic-bezier(.2,.8,.2,1)",
                overflow: "hidden",
              }}
            >
              {/* 颜色条 */}
              <div style={{
                position: "absolute", top: 0, left: 0, bottom: 0,
                width: 4,
                background: item.color,
                opacity: checked ? 1 : .3,
                transition: "opacity .3s ease",
              }} />

              {/* 图标占位 */}
              <div style={{
                width: 44, height: 44, borderRadius: 10,
                background: `${item.color}18`,
                marginBottom: 10,
                display: "flex", alignItems: "center", justifyContent: "center",
                fontSize: 22,
              }}>
                {item.id === 1 && "🎒"}
                {item.id === 2 && "🥢"}
                {item.id === 3 && "🔦"}
                {item.id === 4 && "💧"}
                {item.id === 5 && "🥾"}
                {item.id === 6 && "🦵"}
                {item.id === 7 && "🧥"}
                {item.id === 8 && "🧶"}
                {item.id === 9 && "👖"}
                {item.id === 10 && "🍫"}
                {item.id === 11 && "🥤"}
                {item.id === 12 && "🍪"}
                {item.id === 13 && "🧰"}
                {item.id === 14 && "🧣"}
                {item.id === 15 && "🧭"}
              </div>

              <div style={{
                fontSize: 14, fontWeight: 600, color: T.char,
                fontFamily: "'Noto Sans SC', sans-serif",
                lineHeight: 1.3,
                marginBottom: 2,
                textDecoration: checked ? "line-through" : "none",
                opacity: checked ? .5 : 1,
                transition: "all .3s ease",
              }}>{item.name}</div>

              <div style={{
                fontSize: 11, color: T.rockL,
                fontFamily: "'Noto Sans SC', sans-serif",
                marginBottom: 8,
              }}>{item.brand}</div>

              <div style={{
                display: "flex", justifyContent: "space-between",
                alignItems: "center",
              }}>
                <span style={{ fontSize: 11, color: T.rock, fontFamily: "'Noto Sans SC', sans-serif" }}>
                  {item.weight}
                </span>
                <div style={{
                  width: 20, height: 20, borderRadius: "50%",
                  background: checked ? item.color : "#fff",
                  border: `2px solid ${checked ? item.color : T.mistD}`,
                  display: "flex", alignItems: "center", justifyContent: "center",
                  transition: "all .25s cubic-bezier(.2,.8,.2,1)",
                  transform: checked ? "scale(1)" : "scale(.9)",
                }}>
                  {checked && (
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M5 13l4 4L19 7"/>
                    </svg>
                  )}
                </div>
              </div>
            </button>
          );
        })}
      </div>

      {/* 总重量卡片 */}
      <div style={{
        margin: "20px 16px 0", padding: 16,
        borderRadius: 16,
        background: `linear-gradient(135deg, ${activeColor} 0%, ${activeColor}dd 100%)`,
        color: "#fff",
        display: "flex", alignItems: "center", justifyContent: "space-between",
      }}>
        <div>
          <div style={{ fontSize: 11, opacity: .8, fontFamily: "'Noto Sans SC', sans-serif" }}>背包总重量</div>
          <div style={{ fontSize: 26, fontWeight: 800, fontFamily: "'Noto Sans SC', sans-serif", marginTop: 2 }}>
            6.8 <span style={{ fontSize: 14, fontWeight: 400 }}>kg</span>
          </div>
        </div>
        <div style={{ textAlign: "right" }}>
          <div style={{ fontSize: 11, opacity: .8, fontFamily: "'Noto Sans SC', sans-serif" }}>建议上限</div>
          <div style={{ fontSize: 18, fontWeight: 600, fontFamily: "'Noto Sans SC', sans-serif", marginTop: 2 }}>
            8.0 kg
          </div>
        </div>
      </div>

      <style>{`
        ::-webkit-scrollbar { display: none; }
      `}</style>
    </div>
  );
}

      }}>
        <span>参数名</span>
        <span>类型</span>
        <span>说明</span>
      </div>
      {params.map((p, i) => (
        <div key={i} style={{
          display: "grid", gridTemplateColumns: "90px 70px 1fr",
          fontSize: 11,
          padding: "6px 8px",
          borderTop: "0.5px solid rgba(255,255,255,.04)",
          gap: 4,
          fontFamily: "'Noto Sans SC', sans-serif",
        }}>
          <span style={{ color: T.sunL, wordBreak: "break-all" }}>{p.name}</span>
          <span style={{ color: T.mossL }}>{p.type}</span>
          <span style={{ color: "rgba(255,255,255,.75)" }}>{p.desc}</span>
        </div>
      ))}
    </div>
  );
}

function ApiResponse({ children }) {
  return (
    <div style={{
      background: "rgba(0,0,0,.3)",
      borderRadius: 8,
      padding: 10,
      overflowX: "auto",
    }}>
      <div style={{ fontSize: 10, color: T.mossL, marginBottom: 6, fontFamily: "'Noto Sans SC', sans-serif" }}>
        Response 200 OK
      </div>
      <pre style={{
        margin: 0, fontSize: 11,
        color: "#d4d4d4",
        fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
        lineHeight: 1.5,
        whiteSpace: "pre-wrap",
      }}>{children}</pre>
    </div>
  );
}

/* ============================================================
   顶层 App：页面路由 + 转场动画
   ============================================================ */
function App() {
  const [tab, setTab] = useState("home");
  const [detailOpen, setDetailOpen] = useState(false);
  const [detailId, setDetailId] = useState(1);
  const [designOpen, setDesignOpen] = useState(false);
  const [apiOpen, setApiOpen] = useState(false);
  const [transitionDir, setTransitionDir] = useState("forward");
  const reduced = prefersReducedMotion();

  const openDetail = (id) => {
    setDetailId(id);
    setTransitionDir("forward");
    setTimeout(() => setDetailOpen(true), 10);
  };
  const closeDetail = () => {
    setTransitionDir("back");
    setDetailOpen(false);
  };
  const openDesign = () => {
    setTransitionDir("forward");
    setTimeout(() => setDesignOpen(true), 10);
  };
  const closeDesign = () => {
    setTransitionDir("back");
    setDesignOpen(false);
  };
  const openApi = () => {
    setTransitionDir("forward");
    setTimeout(() => setApiOpen(true), 10);
  };
  const closeApi = () => {
    setTransitionDir("back");
    setApiOpen(false);
  };

  const handleTabChange = (key) => {
    setTab(key);
  };

  // 顶层页面列表（tab 切换）
  const renderTabPage = () => {
    switch (tab) {
      case "home":      return <HomePage onOpenDetail={openDetail} />;
      case "record":    return <RecordPage />;
      case "community": return <CommunityPage />;
      case "gear":      return <GearPage />;
      case "me":        return <MePage onOpen={(p) => p === "design" ? openDesign() : openApi()} />;
      default:          return null;
    }
  };

  const modalOpen = detailOpen || designOpen || apiOpen;

  return (
    <div style={{
      width: "100vw", height: "100vh",
      display: "flex", alignItems: "center", justifyContent: "center",
      background: `linear-gradient(135deg, ${T.mistD} 0%, ${T.sand}55 100%)`,
      position: "relative",
      overflow: "hidden",
      cursor: "none",
    }}>
      {/* 背景装饰 —— 山形 */}
      <div style={{
        position:"absolute", bottom: 0, left: 0, right: 0,
        height: "40%",
        background: `linear-gradient(180deg, transparent 0%, ${T.moss}22 100%)`,
        clipPath: "polygon(0 100%, 0 60%, 15% 40%, 30% 55%, 45% 25%, 60% 45%, 75% 20%, 90% 50%, 100% 35%, 100% 100%)",
        opacity: .6,
      }} />

      {/* 标题 */}
      <div style={{
        position:"absolute", top: 30, left: 0, right: 0,
        textAlign: "center",
        pointerEvents: "none",
      }}>
        <div style={{
          fontSize: 28, fontWeight: 900,
          color: T.mossD,
          fontFamily: "'Noto Serif SC', serif",
          letterSpacing: 8,
        }}>山 径</div>
        <div style={{
          fontSize: 12, color: T.rock,
          fontFamily: "'Noto Sans SC', sans-serif",
          letterSpacing: 3, marginTop: 4,
        }}>徒步与山野路线社区 · V2</div>
      </div>

      {/* 手机外壳 */}
      <IOSDevice>
        <div style={{
          position:"absolute", inset: 0,
          overflow: "hidden",
        }}>
          {/* Tab 页面 */}
          <div key={tab} style={{
            position:"absolute", inset: 0,
            animation: reduced ? "none" : `tabFadeIn .35s cubic-bezier(.2,.8,.2,1)`,
          }}>
            {renderTabPage()}
            {/* TabBar */}
            {!modalOpen && <TabBar current={tab} onChange={handleTabChange} />}
          </div>

          {/* 详情页（模态栈导航） */}
          {detailOpen && (
            <div
              key="detail"
              style={{
                position:"absolute", inset: 0,
                zIndex: 40,
                animation: reduced ? "none" : `slideFromRight .4s cubic-bezier(.2,.8,.2,1)`,
              }}
            >
              <DetailPage onBack={closeDetail} />
            </div>
          )}

          {/* 设计规范页 */}
          {designOpen && (
            <div
              key="design"
              style={{
                position:"absolute", inset: 0,
                zIndex: 45,
                animation: reduced ? "none" : `slideFromRight .4s cubic-bezier(.2,.8,.2,1)`,
              }}
            >
              <DesignPage onBack={closeDesign} />
            </div>
          )}

          {/* 接口文档页 */}
          {apiOpen && (
            <div
              key="api"
              style={{
                position:"absolute", inset: 0,
                zIndex: 45,
                animation: reduced ? "none" : `slideFromRight .4s cubic-bezier(.2,.8,.2,1)`,
              }}
            >
              <ApiPage onBack={closeApi} />
            </div>
          )}
        </div>
      </IOSDevice>

      {/* 底部提示 */}
      <div style={{
        position:"absolute", bottom: 24, left: 0, right: 0,
        textAlign: "center",
        fontSize: 11, color: T.rockL,
        fontFamily: "'Noto Sans SC', sans-serif",
        letterSpacing: 1,
        pointerEvents: "none",
      }}>
        点击 Tab 切换页面 · 长按动态卡片弹出菜单 · 下拉首页刷新
      </div>

      <style>{`
        @keyframes tabFadeIn {
          from { opacity: 0; transform: translateY(8px); }
          to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideFromRight {
          from { transform: translateX(100%); }
          to { transform: translateX(0); }
        }
        * { -webkit-tap-highlight-color: transparent; }
      `}</style>
    </div>
  );
}

/* ============================================================
   渲染 + 升级宣告
   ============================================================ */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(
  <>
    <CustomCursor />
    <App />
  </>
);

function announceUpgrade() {
  try {
    window.parent.postMessage({ type: "miaoda:upgrade:available", kind: "interactive-prototype" }, "*");
  } catch (e) {}
}
announceUpgrade();
if (document.readyState !== "complete") {
  window.addEventListener("load", announceUpgrade, { once: true });
}
</script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    cursor: none;
  }
  button { font-family: inherit; }
  #root { width: 100%; height: 100%; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>

</head>
<body>
<div id="root"></div>
</body>
</html>

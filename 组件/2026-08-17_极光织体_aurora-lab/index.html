<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="creative-medium" content="interactive-prototype">
<title>AURORA · 极光织体实验室</title>
<style>
:root {
  --night: #0A0F0D;
  --night-2: #0E1613;
  --night-3: #13201A;
  --aurora: #4DFFB8;
  --magenta: #FF3E8A;
  --ice: #7FE7E0;
  --silver: #E8F5F0;
  --line: rgba(232, 245, 240, 0.08);
  --line-strong: rgba(232, 245, 240, 0.14);
  --glow-aurora: 0 0 20px rgba(77, 255, 184, 0.45), 0 0 60px rgba(77, 255, 184, 0.18);
  --glow-magenta: 0 0 20px rgba(255, 62, 138, 0.45), 0 0 60px rgba(255, 62, 138, 0.18);
  --glow-ice: 0 0 20px rgba(127, 231, 224, 0.45), 0 0 60px rgba(127, 231, 224, 0.18);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--night);
  color: var(--silver);
  font-family: 'SF Mono', 'JetBrains Mono', 'Menlo', 'Consolas', monospace;
  font-size: 13px;
  letter-spacing: 0.02em;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  cursor: none;
}

body {
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(77, 255, 184, 0.06), transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%, rgba(255, 62, 138, 0.05), transparent 60%),
    linear-gradient(180deg, #070C0A 0%, #0A0F0D 50%, #08100E 100%);
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 2px,
      rgba(232, 245, 240, 0.015) 2px,
      rgba(232, 245, 240, 0.015) 3px
    );
  pointer-events: none;
  z-index: 100;
  mix-blend-mode: overlay;
}

/* ===== Custom cursor ===== */
.cursor-outer {
  position: fixed;
  top: 50%; left: 50%;
  width: 32px; height: 32px;
  margin: -16px 0 0 -16px;
  border: 1.5px solid rgba(232, 245, 240, 0.85);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transition: width 0.25s cubic-bezier(.2,.8,.2,1),
              height 0.25s cubic-bezier(.2,.8,.2,1),
              margin 0.25s cubic-bezier(.2,.8,.2,1),
              border-color 0.25s,
              opacity 0.3s;
  box-shadow:
    0 0 12px rgba(232, 245, 240, 0.3),
    inset 0 0 8px rgba(232, 245, 240, 0.1);
  will-change: transform;
}
.cursor-inner {
  position: fixed;
  top: 50%; left: 50%;
  width: 6px; height: 6px;
  margin: -3px 0 0 -3px;
  background: var(--aurora);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transition: background 0.25s, width 0.25s, height 0.25s, margin 0.25s;
  box-shadow:
    0 0 6px var(--aurora),
    0 0 16px rgba(77, 255, 184, 0.6),
    0 0 32px rgba(77, 255, 184, 0.3);
  will-change: transform;
}
.cursor-hover .cursor-outer {
  width: 48px; height: 48px;
  margin: -24px 0 0 -24px;
  border-color: var(--aurora);
  box-shadow:
    0 0 20px rgba(77, 255, 184, 0.5),
    inset 0 0 12px rgba(77, 255, 184, 0.15);
}
.cursor-hover .cursor-inner {
  background: var(--magenta);
  box-shadow:
    0 0 6px var(--magenta),
    0 0 16px rgba(255, 62, 138, 0.7),
    0 0 32px rgba(255, 62, 138, 0.35);
}
.cursor-active .cursor-outer {
  width: 24px; height: 24px;
  margin: -12px 0 0 -12px;
}

.ripple {
  position: fixed;
  width: 10px; height: 10px;
  border: 1px solid var(--aurora);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  animation: ripple-anim 0.7s cubic-bezier(.1,.6,.2,1) forwards;
  box-shadow: 0 0 12px rgba(77, 255, 184, 0.4);
}
@keyframes ripple-anim {
  0%   { transform: translate(-50%, -50%) scale(0.5); opacity: 1; border-width: 1.5px; }
  100% { transform: translate(-50%, -50%) scale(6);   opacity: 0; border-width: 0.5px; }
}

/* ===== Top nav ===== */
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  border-bottom: 1px solid var(--line);
  background: rgba(10, 15, 13, 0.65);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 50;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 500;
  letter-spacing: 0.25em;
  font-size: 12px;
}
.brand-mark {
  width: 10px; height: 10px;
  background: var(--aurora);
  border-radius: 50%;
  box-shadow: var(--glow-aurora);
  animation: brand-pulse 2.4s ease-in-out infinite;
}
@keyframes brand-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.6; transform: scale(0.85); }
}
.brand-title { color: var(--silver); }
.brand-sub { color: rgba(232,245,240,0.45); font-size: 10px; letter-spacing: 0.2em; }

.zone-nav {
  display: flex;
  align-items: center;
  gap: 4px;
}
.zone-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 4px;
  color: rgba(232,245,240,0.5);
  font-family: inherit;
  font-size: 11px;
  letter-spacing: 0.15em;
  cursor: none;
  transition: all 0.25s ease;
  text-transform: uppercase;
}
.zone-btn:hover {
  color: var(--silver);
  border-color: var(--line-strong);
  background: rgba(232,245,240,0.03);
}
.zone-btn.active {
  color: var(--aurora);
  border-color: rgba(77,255,184,0.3);
  background: rgba(77,255,184,0.06);
  text-shadow: 0 0 8px rgba(77,255,184,0.4);
}
.zone-btn .zone-num {
  font-size: 9px;
  color: rgba(232,245,240,0.3);
}
.zone-btn.active .zone-num { color: rgba(77,255,184,0.5); }

.topbar-right {
  display: flex;
  align-items: center;
  gap: 20px;
  font-size: 10px;
  letter-spacing: 0.2em;
  color: rgba(232,245,240,0.4);
  text-transform: uppercase;
}
.status-dot {
  width: 6px; height: 6px;
  background: var(--aurora);
  border-radius: 50%;
  box-shadow: 0 0 6px var(--aurora);
  animation: brand-pulse 1.8s ease-in-out infinite;
}
.status-line {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ===== Stage ===== */
.stage {
  position: fixed;
  top: 56px; left: 0; right: 0; bottom: 0;
  overflow: hidden;
}
.stage-canvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  display: block;
  transition: opacity 0.6s cubic-bezier(.2,.8,.2,1),
              filter 0.6s cubic-bezier(.2,.8,.2,1);
}
.stage-canvas.fading-out {
  opacity: 0;
  filter: blur(8px) brightness(1.5);
}
.stage-canvas.fading-in {
  opacity: 0;
  filter: blur(8px) brightness(0.5);
}
.stage-canvas.fading-in.active-fade {
  opacity: 1;
  filter: blur(0) brightness(1);
}

/* ===== Zone info ===== */
.zone-info {
  position: absolute;
  left: 32px;
  top: 32px;
  z-index: 10;
  pointer-events: none;
  max-width: 340px;
}
.zone-info .eyebrow {
  font-size: 10px;
  letter-spacing: 0.3em;
  color: var(--aurora);
  text-transform: uppercase;
  margin-bottom: 10px;
  opacity: 0.8;
}
.zone-info h2 {
  font-family: 'Georgia', 'Noto Serif SC', serif;
  font-size: 36px;
  font-weight: 400;
  letter-spacing: 0.02em;
  color: var(--silver);
  margin-bottom: 12px;
  line-height: 1.1;
}
.zone-info p {
  font-size: 12px;
  line-height: 1.7;
  color: rgba(232,245,240,0.55);
  max-width: 300px;
  letter-spacing: 0.04em;
}

.zone-hint {
  position: absolute;
  left: 32px;
  bottom: 28px;
  z-index: 10;
  font-size: 10px;
  letter-spacing: 0.25em;
  color: rgba(232,245,240,0.35);
  text-transform: uppercase;
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: 8px;
}
.zone-hint::before {
  content: '';
  width: 24px; height: 1px;
  background: rgba(232,245,240,0.25);
}

/* ===== Control panel ===== */
.panel {
  position: absolute;
  right: 24px;
  top: 50%;
  transform: translateY(-50%);
  width: 240px;
  background: rgba(14, 22, 19, 0.72);
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  z-index: 20;
  padding: 18px 18px 20px;
  transition: all 0.45s cubic-bezier(.2,.8,.2,1);
}
.panel.panel-enter {
  opacity: 0;
  transform: translateY(-50%) translateX(20px);
}
.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}
.panel-title {
  font-size: 10px;
  letter-spacing: 0.3em;
  color: var(--aurora);
  text-transform: uppercase;
}
.panel-tag {
  font-size: 9px;
  letter-spacing: 0.2em;
  color: rgba(232,245,240,0.4);
}

.control {
  margin-bottom: 16px;
}
.control:last-child { margin-bottom: 0; }
.control-label {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
  font-size: 11px;
  color: rgba(232,245,240,0.65);
  letter-spacing: 0.08em;
}
.control-value {
  font-size: 10px;
  color: var(--aurora);
  font-variant-numeric: tabular-nums;
}

/* Custom range slider */
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 2px;
  background: var(--line-strong);
  border-radius: 1px;
  outline: none;
  cursor: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--night);
  border: 1.5px solid var(--aurora);
  box-shadow: 0 0 8px rgba(77,255,184,0.5), inset 0 0 4px rgba(77,255,184,0.3);
  cursor: none;
  transition: box-shadow 0.2s;
}
input[type="range"]::-webkit-slider-thumb:hover {
  box-shadow: 0 0 12px rgba(77,255,184,0.7), inset 0 0 6px rgba(77,255,184,0.4);
}
input[type="range"]::-moz-range-thumb {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--night);
  border: 1.5px solid var(--aurora);
  box-shadow: 0 0 8px rgba(77,255,184,0.5);
  cursor: none;
}

/* Color swatches for zones with multiple color controls */
.swatches {
  display: flex;
  gap: 8px;
  margin-top: 6px;
}
.swatch {
  flex: 1;
  height: 20px;
  border-radius: 3px;
  border: 1px solid var(--line-strong);
  cursor: none;
  transition: transform 0.2s, border-color 0.2s;
  position: relative;
}
.swatch.active {
  border-color: var(--silver);
  transform: scale(1.05);
}

/* ===== Footer HUD ===== */
.hud {
  position: absolute;
  left: 0; right: 0;
  bottom: 0;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  border-top: 1px solid var(--line);
  background: rgba(10,15,13,0.5);
  font-size: 9px;
  letter-spacing: 0.25em;
  color: rgba(232,245,240,0.35);
  text-transform: uppercase;
  z-index: 10;
  pointer-events: none;
}
.hud-group { display: flex; align-items: center; gap: 20px; }
.hud-item { display: flex; align-items: center; gap: 6px; }
.hud-item span:last-child { color: rgba(232,245,240,0.55); }

/* ===== Reduced motion ===== */
@media (prefers-reduced-motion: reduce) {
  .brand-mark, .status-dot { animation: none; }
  .cursor-outer, .cursor-inner { transition: none; }
  .stage-canvas { transition: none; }
  .panel { transition: none; }
}

/* ===== Mobile ===== */
@media (max-width: 768px) {
  .topbar { padding: 0 12px; height: 48px; }
  .brand-sub { display: none; }
  .zone-btn { padding: 6px 8px; font-size: 10px; }
  .zone-btn .zone-name { display: none; }
  .zone-btn .zone-num { display: inline; }
  .topbar-right .coord-display { display: none; }
  .stage { top: 48px; }
  .zone-info { left: 16px; top: 20px; max-width: 220px; }
  .zone-info h2 { font-size: 24px; }
  .zone-info p { font-size: 11px; }
  .panel {
    right: 12px;
    width: 180px;
    padding: 12px 12px 14px;
  }
  .hud { padding: 0 12px; }
}
</style>
</head>
<body>

<!-- Custom cursor -->
<div class="cursor-outer" id="cursorOuter"></div>
<div class="cursor-inner" id="cursorInner"></div>

<!-- Top navigation -->
<header class="topbar">
  <div class="brand">
    <div class="brand-mark"></div>
    <span class="brand-title">AURORA LAB</span>
    <span class="brand-sub">/ 极光织体实验室 v3.0</span>
  </div>

  <nav class="zone-nav" id="zoneNav">
    <button class="zone-btn active" data-zone="0">
      <span class="zone-num">01</span>
      <span class="zone-name">Curtain</span>
    </button>
    <button class="zone-btn" data-zone="1">
      <span class="zone-num">02</span>
      <span class="zone-name">Trails</span>
    </button>
    <button class="zone-btn" data-zone="2">
      <span class="zone-num">03</span>
      <span class="zone-name">Ribbon</span>
    </button>
    <button class="zone-btn" data-zone="3">
      <span class="zone-num">04</span>
      <span class="zone-name">Frost</span>
    </button>
    <button class="zone-btn" data-zone="4">
      <span class="zone-num">05</span>
      <span class="zone-name">Stream</span>
    </button>
    <button class="zone-btn" data-zone="5">
      <span class="zone-num">06</span>
      <span class="zone-name">Hologram</span>
    </button>
  </nav>

  <div class="topbar-right">
    <div class="status-line">
      <div class="status-dot"></div>
      <span id="fpsDisplay">60 FPS</span>
    </div>
  </div>
</header>

<!-- Main stage -->
<main class="stage" id="stage">
  <canvas class="stage-canvas" id="canvas"></canvas>

  <div class="zone-info" id="zoneInfo">
    <div class="eyebrow" id="zoneEyebrow">Exhibit 01 / Aurora Curtain</div>
    <h2 id="zoneTitle">极光帘幕</h2>
    <p id="zoneDesc">噪声场生成的极光帷幕，拖动改变风向与帘幕褶皱。多层叠加的 Perlin 噪声模拟极光带的流动与脉动，光照沿帘高呈指数衰减。</p>
  </div>

  <!-- Control panel -->
  <aside class="panel" id="panel">
    <div class="panel-header">
      <span class="panel-title">控制面板</span>
      <span class="panel-tag" id="panelTag">ZONE 01</span>
    </div>
    <div id="panelControls">
      <!-- Controls injected per zone -->
    </div>
  </aside>

  <div class="zone-hint" id="zoneHint">
    <span>拖动以交互</span>
  </div>

  <!-- HUD -->
  <div class="hud">
    <div class="hud-group">
      <div class="hud-item"><span>MODE</span><span id="hudMode">INTERACTIVE</span></div>
      <div class="hud-item"><span>ENGINE</span><span>CANVAS 2D</span></div>
    </div>
    <div class="hud-group">
      <div class="hud-item"><span>COORD</span><span id="hudCoord">0.00, 0.00</span></div>
      <div class="hud-item"><span>PARTICLES</span><span id="hudCount">—</span></div>
    </div>
  </div>
</main>

<script>
/* =====================================================================
   AURORA LAB — Aurora Weaving Laboratory
   Single-file vanilla HTML/CSS/JS. 6 effect zones. Custom cursor.
   ===================================================================== */

'use strict';

// ---------- Utils ----------
const $ = (s, p = document) => p.querySelector(s);
const $$ = (s, p = document) => [...p.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;

// Simplex-like 2D value noise (cheap, good enough for visual effects)
const noise2D = (() => {
  const perm = new Uint8Array(512);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [p[i], p[j]] = [p[j], p[i]];
  }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];

  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const grad = (h, x, y) => {
    const hh = h & 3;
    const u = hh < 2 ? x : y;
    const v = hh < 2 ? y : x;
    return ((hh & 1) ? -u : u) + ((hh & 2) ? -v : v);
  };

  return (x, y) => {
    const X = Math.floor(x) & 255;
    const Y = Math.floor(y) & 255;
    x -= Math.floor(x);
    y -= Math.floor(y);
    const u = fade(x), v = fade(y);
    const A = perm[X] + Y, B = perm[X + 1] + Y;
    return lerp(
      lerp(grad(perm[A],     x,     y    ), grad(perm[B],     x - 1, y    ), u),
      lerp(grad(perm[A + 1], x,     y - 1), grad(perm[B + 1], x - 1, y - 1), u),
      v
    );
  };
})();

// ---------- Animation engine (visibility + reduced motion) ----------
const Engine = {
  raf: 0,
  running: false,
  lastTime: 0,
  fpsFrames: 0,
  fpsTime: 0,
  onFrame: null,
  reduced: window.matchMedia('(prefers-reduced-motion: reduce)').matches,

  start(fn) {
    this.onFrame = fn;
    if (this.running) return;
    this.running = true;
    this.lastTime = performance.now();
    const loop = (t) => {
      if (!this.running) return;
      const dt = Math.min(50, t - this.lastTime);
      this.lastTime = t;
      this.fpsFrames++;
      if (t - this.fpsTime > 500) {
        const fps = Math.round(this.fpsFrames * 1000 / (t - this.fpsTime));
        const el = $('#fpsDisplay');
        if (el) el.textContent = fps + ' FPS';
        this.fpsFrames = 0;
        this.fpsTime = t;
      }
      if (this.onFrame) this.onFrame(dt / 1000, t);
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  },

  stop() {
    this.running = false;
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = 0;
  },

  pause() { this.stop(); },
  resume() {
    if (this.onFrame) this.start(this.onFrame);
  }
};

// Visibility: pause when tab hidden
document.addEventListener('visibilitychange', () => {
  if (document.hidden) Engine.pause();
  else Engine.resume();
});
window.addEventListener('pagehide', () => Engine.stop());

// ---------- Custom cursor ----------
const Cursor = {
  x: window.innerWidth / 2,
  y: window.innerHeight / 2,
  targetX: window.innerWidth / 2,
  targetY: window.innerHeight / 2,
  vx: 0, vy: 0,
  outer: null, inner: null,
  down: false,

  init() {
    this.outer = $('#cursorOuter');
    this.inner = $('#cursorInner');
    this.updateTransform(0);

    window.addEventListener('mousemove', (e) => {
      this.targetX = e.clientX;
      this.targetY = e.clientY;
      const hud = $('#hudCoord');
      if (hud) hud.textContent = e.clientX.toFixed(0) + ', ' + e.clientY.toFixed(0);
    });

    window.addEventListener('mousedown', () => {
      this.down = true;
      document.body.classList.add('cursor-active');
      this.spawnRipple(this.targetX, this.targetY);
    });
    window.addEventListener('mouseup', () => {
      this.down = false;
      document.body.classList.remove('cursor-active');
    });

    // Hover detection
    const hoverSel = 'button, input, a, .swatch, [data-hover]';
    document.addEventListener('mouseover', (e) => {
      if (e.target.closest(hoverSel)) {
        document.body.classList.add('cursor-hover');
      }
    });
    document.addEventListener('mouseout', (e) => {
      if (e.target.closest(hoverSel)) {
        document.body.classList.remove('cursor-hover');
      }
    });

    // Touch fallback
    window.addEventListener('touchmove', (e) => {
      if (e.touches[0]) {
        this.targetX = e.touches[0].clientX;
        this.targetY = e.touches[0].clientY;
      }
    }, { passive: true });
  },

  spawnRipple(x, y) {
    if (Engine.reduced) return;
    const r = document.createElement('div');
    r.className = 'ripple';
    r.style.left = x + 'px';
    r.style.top = y + 'px';
    document.body.appendChild(r);
    setTimeout(() => r.remove(), 700);
  },

  tick(dt) {
    const ease = 0.22;
    this.vx = (this.targetX - this.x) * ease;
    this.vy = (this.targetY - this.y) * ease;
    this.x += this.vx;
    this.y += this.vy;
    this.updateTransform(dt);
  },

  updateTransform(dt) {
    if (!this.outer) return;
    // outer lags a bit behind inner for trailing feel
    this.outer.style.transform = `translate(${this.x - (innerWidth/2)}px, ${this.y - (innerHeight/2)}px) translate(${Math.sin(performance.now()/800)*0.5}px, 0)`;
    this.inner.style.transform = `translate(${this.x - innerWidth/2}px, ${this.y - innerHeight/2}px)`;
  }
};

// ---------- Canvas stage ----------
const Stage = {
  canvas: null,
  ctx: null,
  dpr: 1,
  w: 0, h: 0,

  init() {
    this.canvas = $('#canvas');
    this.ctx = this.canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());
  },

  resize() {
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = this.canvas.parentElement.getBoundingClientRect();
    this.w = rect.width;
    this.h = rect.height;
    this.canvas.width = this.w * this.dpr;
    this.canvas.height = this.h * this.dpr;
    this.canvas.style.width = this.w + 'px';
    this.canvas.style.height = this.h + 'px';
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    if (App && App.currentZone && App.currentZone.resize) App.currentZone.resize();
  },

  clear() {
    this.ctx.clearRect(0, 0, this.w, this.h);
  }
};

// ---------- Control panel ----------
const Panel = {
  values: {},

  build(zoneIdx) {
    const z = zones[zoneIdx];
    const container = $('#panelControls');
    $('#panelTag').textContent = 'ZONE ' + String(zoneIdx + 1).padStart(2, '0');
    this.values = {};

    let html = '';
    for (const c of z.controls) {
      this.values[c.id] = c.value;
      const step = c.step || (c.max - c.min) / 100;
      html += `
        <div class="control">
          <div class="control-label">
            <span>${c.label}</span>
            <span class="control-value" data-val="${c.id}">${c.value}${c.unit || ''}</span>
          </div>
          <input type="range" id="ctrl_${c.id}" min="${c.min}" max="${c.max}" value="${c.value}" step="${step}">
        </div>
      `;
    }
    container.innerHTML = html;

    // Wire events
    for (const c of z.controls) {
      const input = $('#ctrl_' + c.id);
      input.addEventListener('input', () => {
        const v = parseFloat(input.value);
        this.values[c.id] = v;
        const valEl = document.querySelector(`[data-val="${c.id}"]`);
        if (valEl) valEl.textContent = (c.step && c.step >= 1) ? Math.round(v) + (c.unit || '') : v.toFixed(1) + (c.unit || '');
        if (App.currentZone && App.currentZone.onParamChange) {
          App.currentZone.onParamChange(c.id, v);
        }
      });
    }

    // Panel enter animation
    const panel = $('#panel');
    panel.classList.add('panel-enter');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => panel.classList.remove('panel-enter'));
    });
  },

  get(id, fallback = 0) {
    return this.values[id] !== undefined ? this.values[id] : fallback;
  }
};

/* =====================================================================
   ZONE 01 — Aurora Curtain
   ===================================================================== */
const ZoneCurtain = {
  time: 0,
  windX: 0,
  windY: 0,
  mouseDown: false,

  init() {
    this.time = 0;
    this.windX = 0;
    this.windY = 0;
    this.mouseDown = false;
    this.onMouseDown = () => { this.mouseDown = true; };
    this.onMouseUp = () => { this.mouseDown = false; };
    window.addEventListener('mousedown', this.onMouseDown);
    window.addEventListener('mouseup', this.onMouseUp);
    $('#hudCount').textContent = '4 层';
  },

  destroy() {
    window.removeEventListener('mousedown', this.onMouseDown);
    window.removeEventListener('mouseup', this.onMouseUp);
  },

  onParamChange() {
    $('#hudCount').textContent = Math.round(Panel.get('layers', 4)) + ' 层';
  },

  resize() {},

  tick(dt) {
    const ctx = Stage.ctx;
    const w = Stage.w, h = Stage.h;
    this.time += dt;

    // Wind follows mouse with smooth inertia
    const mx = (Cursor.x - w / 2) / w;
    const my = (Cursor.y - h / 2) / h;
    const windTarget = mx * 0.8;
    const foldTarget = 0.5 + my * 0.4;
    const ease = this.mouseDown ? 0.08 : 0.03;
    this.windX = lerp(this.windX, windTarget, ease);
    this.windY = lerp(this.windY, foldTarget, ease);

    const intensity = Panel.get('intensity', 60) / 100;
    const speed = Panel.get('speed', 40) / 100;
    const layers = Math.round(Panel.get('layers', 4));

    ctx.clearRect(0, 0, w, h);

    // Subtle starfield backdrop
    this.drawStars(ctx, w, h);

    // Draw aurora curtain layers
    const baseY = h * 0.35;
    const curtainHeight = h * 0.55;

    for (let l = 0; l < layers; l++) {
      const layerOffset = l / layers;
      const phase = this.time * speed * (0.5 + layerOffset * 0.7);
      const amp = curtainHeight * 0.15 * (1 - layerOffset * 0.4) * intensity;

      ctx.beginPath();
      ctx.moveTo(-10, h + 10);

      const segments = 120;
      const topPoints = [];
      for (let i = 0; i <= segments; i++) {
        const x = (i / segments) * (w + 20) - 10;
        const nx = x * 0.006 + phase + this.windX * 2;
        const ny = layerOffset * 3 + this.time * speed * 0.3;
        const n = noise2D(nx, ny);
        const n2 = noise2D(nx * 0.5, ny * 0.7 + 5);
        const topY = baseY + layerOffset * 40 + n * amp + n2 * amp * 0.5 * this.windY;
        topPoints.push({ x, y: topY });
        ctx.lineTo(x, topY);
      }
      ctx.lineTo(w + 10, h + 10);
      ctx.closePath();

      // Gradient along curtain height
      const colorMix = layerOffset;
      const col1 = this.mixColor('#4DFFB8', '#7FE7E0', colorMix);
      const col2 = this.mixColor('rgba(77,255,184,0.3)', 'rgba(127,231,224,0.15)', colorMix);

      const grad = ctx.createLinearGradient(0, baseY - amp, 0, h);
      grad.addColorStop(0, this.rgba(col1, 0.35 * intensity));
      grad.addColorStop(0.3, this.rgba(col1, 0.2 * intensity));
      grad.addColorStop(0.7, col2);
      grad.addColorStop(1, 'rgba(10,15,13,0)');

      ctx.fillStyle = grad;
      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = 0.7 - layerOffset * 0.1;
      ctx.fill();

      // Bright top edge
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.6 * intensity;
      ctx.beginPath();
      for (let i = 0; i < topPoints.length; i++) {
        if (i === 0) ctx.moveTo(topPoints[i].x, topPoints[i].y);
        else ctx.lineTo(topPoints[i].x, topPoints[i].y);
      }
      ctx.strokeStyle = this.mixColor('#4DFFB8', '#FFFFFF', colorMix * 0.5);
      ctx.lineWidth = 1.5;
      ctx.shadowColor = col1;
      ctx.shadowBlur = 20 * intensity;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  },

  drawStars(ctx, w, h) {
    if (!this._stars) {
      this._stars = [];
      for (let i = 0; i < 80; i++) {
        this._stars.push({
          x: Math.random() * w,
          y: Math.random() * h * 0.6,
          r: Math.random() * 1.2 + 0.3,
          phase: Math.random() * TAU,
          speed: Math.random() * 0.8 + 0.2
        });
      }
    }
    ctx.fillStyle = 'rgba(232,245,240,0.7)';
    for (const s of this._stars) {
      const tw = 0.5 + 0.5 * Math.sin(this.time * s.speed + s.phase);
      ctx.globalAlpha = 0.3 + tw * 0.5;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  },

  mixColor(a, b, t) {
    const pa = this.parseHex(a);
    const pb = this.parseHex(b);
    const r = Math.round(lerp(pa.r, pb.r, t));
    const g = Math.round(lerp(pa.g, pb.g, t));
    const bl = Math.round(lerp(pa.b, pb.b, t));
    return `rgb(${r},${g},${bl})`;
  },

  rgba(rgbStr, alpha) {
    return rgbStr.replace('rgb(', 'rgba(').replace(')', `,${alpha})`);
  },

  parseHex(h) {
    if (h.startsWith('rgb')) {
      const m = h.match(/[\d.]+/g);
      return { r: +m[0], g: +m[1], b: +m[2] };
    }
    const hex = h.replace('#', '');
    return {
      r: parseInt(hex.substring(0,2), 16),
      g: parseInt(hex.substring(2,4), 16),
      b: parseInt(hex.substring(4,6), 16)
    };
  }
};

/* =====================================================================
   ZONE 02 — Star Trails
   ===================================================================== */
const ZoneTrails = {
  time: 0,
  drawing: false,
  lastX: 0, lastY: 0,
  stars: [],
  trailPoints: [],

  init() {
    this.time = 0;
    this.drawing = false;
    this.trailPoints = [];
    this._starsCache = null;

    this.onDown = (e) => {
      this.drawing = true;
      const pt = this.getPt(e);
      this.lastX = pt.x; this.lastY = pt.y;
    };
    this.onUp = () => { this.drawing = false; };
    this.onMove = (e) => {
      if (!this.drawing) return;
      const pt = this.getPt(e);
      const steps = Math.max(1, Math.floor(Math.hypot(pt.x - this.lastX, pt.y - this.lastY) / 3));
      for (let i = 0; i < steps; i++) {
        const t = i / steps;
        this.trailPoints.push({
          x: lerp(this.lastX, pt.x, t),
          y: lerp(this.lastY, pt.y, t),
          life: 1,
          size: rand(0.8, Panel.get('thickness', 4))
        });
      }
      this.lastX = pt.x; this.lastY = pt.y;
    };

    const canvas = Stage.canvas;
    canvas.addEventListener('mousedown', this.onDown);
    window.addEventListener('mouseup', this.onUp);
    window.addEventListener('mousemove', this.onMove);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); this.onDown(e.touches[0]); }, { passive: false });
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); this.onUp(); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); this.onMove(e.touches[0]); }, { passive: false });

    this.rebuildStars();
    $('#hudCount').textContent = '100';
  },

  destroy() {
    const canvas = Stage.canvas;
    canvas.removeEventListener('mousedown', this.onDown);
    window.removeEventListener('mouseup', this.onUp);
    window.removeEventListener('mousemove', this.onMove);
  },

  onParamChange(id, v) {
    if (id === 'density') this.rebuildStars();
    $('#hudCount').textContent = Math.round(Panel.get('density', 100));
  },

  rebuildStars() {
    const count = Math.round(Panel.get('density', 100));
    this._starsCache = [];
    for (let i = 0; i < count; i++) {
      this._starsCache.push({
        x: Math.random() * Stage.w,
        y: Math.random() * Stage.h,
        r: Math.random() * 1.4 + 0.2,
        phase: Math.random() * TAU,
        speed: rand(0.3, 1.2),
        hue: Math.random() < 0.3 ? Math.random() < 0.5 ? 'aurora' : 'magenta' : 'white'
      });
    }
  },

  getPt(e) {
    const rect = Stage.canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  },

  resize() { this.rebuildStars(); },

  tick(dt) {
    const ctx = Stage.ctx;
    const w = Stage.w, h = Stage.h;
    this.time += dt;

    const decay = Panel.get('decay', 35) / 100;

    // Fade previous frame (long exposure feel)
    ctx.fillStyle = `rgba(10, 15, 13, ${0.08 + decay * 0.05})`;
    ctx.fillRect(0, 0, w, h);

    // Background stars
    const stars = this._starsCache || [];
    ctx.globalCompositeOperation = 'lighter';
    for (const s of stars) {
      const tw = 0.4 + 0.6 * Math.sin(this.time * s.speed + s.phase);
      let color;
      if (s.hue === 'aurora') color = `rgba(77,255,184,${0.3 + tw * 0.6})`;
      else if (s.hue === 'magenta') color = `rgba(255,62,138,${0.25 + tw * 0.5})`;
      else color = `rgba(232,245,240,${0.2 + tw * 0.5})`;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.fill();
    }

    // Update and draw trail points
    const lifeDecay = decay * dt * 0.8;
    for (let i = this.trailPoints.length - 1; i >= 0; i--) {
      const p = this.trailPoints[i];
      p.life -= lifeDecay;
      if (p.life <= 0) { this.trailPoints.splice(i, 1); continue; }

      const alpha = p.life;
      ctx.fillStyle = `rgba(77,255,184,${alpha * 0.8})`;
      ctx.shadowColor = 'rgba(77,255,184,0.8)';
      ctx.shadowBlur = 8 * alpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, TAU);
      ctx.fill();

      // Sprinkle small stars along trail
      if (Math.random() < 0.05) {
        ctx.fillStyle = `rgba(232,245,240,${alpha})`;
        ctx.beginPath();
        ctx.arc(p.x + rand(-3,3), p.y + rand(-3,3), rand(0.5, 1.5), 0, TAU);
        ctx.fill();
      }
    }
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';
  }
};

/* =====================================================================
   ZONE 03 — Ribbon Field (Verlet)
   ===================================================================== */
const ZoneRibbon = {
  ribbons: [],
  time: 0,

  init() {
    this.time = 0;
    this.ribbons = [];
    this.buildRibbons();
    $('#hudCount').textContent = '22 条';
  },

  destroy() {},

  onParamChange(id, v) {
    if (id === 'count') this.buildRibbons();
    $('#hudCount').textContent = Math.round(Panel.get('count', 22)) + ' 条';
  },

  buildRibbons() {
    const count = Math.round(Panel.get('count', 22));
    this.ribbons = [];
    for (let i = 0; i < count; i++) {
      const startX = rand(0, Stage.w);
      const startY = rand(Stage.h * 0.2, Stage.h * 0.8);
      const pts = [];
      const segLen = rand(8, 14);
      for (let j = 0; j < 24; j++) {
        pts.push({
          x: startX + j * segLen * (Math.random() < 0.5 ? 1 : -1),
          y: startY + rand(-2, 2),
          px: startX + j * segLen,
          py: startY,
          len: segLen
        });
      }
      // color per ribbon: cycle through aurora/ice/magenta
      const hue = i % 3;
      let color;
      if (hue === 0) color = '#4DFFB8';
      else if (hue === 1) color = '#7FE7E0';
      else color = '#FF3E8A';

      this.ribbons.push({
        pts,
        color,
        speed: rand(0.7, 1.3),
        anchor: { x: pts[0].x, y: pts[0].y }
      });
    }
  },

  resize() { this.buildRibbons(); },

  tick(dt) {
    const ctx = Stage.ctx;
    const w = Stage.w, h = Stage.h;
    this.time += dt;

    ctx.clearRect(0, 0, w, h);

    // Subtle grid backdrop
    ctx.strokeStyle = 'rgba(232,245,240,0.025)';
    ctx.lineWidth = 1;
    const gs = 48;
    for (let x = 0; x < w; x += gs) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
    for (let y = 0; y < h; y += gs) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }

    const stiffness = Panel.get('stiffness', 4) / 10;
    const gravity = Panel.get('gravity', 20) / 100 * 80;
    const rect = Stage.canvas.getBoundingClientRect();
    const mx = Cursor.x - rect.left;
    const my = Cursor.y - rect.top;

    for (const r of this.ribbons) {
      const pts = r.pts;

      // Verlet integration
      for (let i = 1; i < pts.length; i++) {
        const p = pts[i];
        const vx = (p.x - p.px) * 0.98;
        const vy = (p.y - p.py) * 0.98;
        p.px = p.x;
        p.py = p.y;
        p.x += vx;
        p.y += vy + gravity * dt * dt * 60 * 0.02;

        // Mouse attraction / repulsion (soft)
        const dx = p.x - mx;
        const dy = p.y - my;
        const dist = Math.hypot(dx, dy);
        const radius = 180;
        if (dist < radius && dist > 0.1) {
          const force = (1 - dist / radius) * 3;
          p.x += (dx / dist) * force;
          p.y += (dy / dist) * force;
        }

        // Global wind / flow
        p.x += Math.sin(this.time * r.speed + p.y * 0.01) * 0.3;
      }

      // Constraint: fixed first point, spring rest
      pts[0].x += (r.anchor.x + Math.sin(this.time * 0.5) * 40 - pts[0].x) * 0.02;
      pts[0].y += (r.anchor.y + Math.cos(this.time * 0.3) * 20 - pts[0].y) * 0.02;

      for (let iter = 0; iter < 4; iter++) {
        for (let i = 0; i < pts.length - 1; i++) {
          const a = pts[i], b = pts[i + 1];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const dist = Math.hypot(dx, dy) || 0.01;
          const diff = (b.len - dist) / dist;
          const offset = diff * stiffness;
          a.x -= dx * offset * 0.5;
          a.y -= dy * offset * 0.5;
          b.x += dx * offset * 0.5;
          b.y += dy * offset * 0.5;
        }
      }

      // Draw ribbon
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Glow pass
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = r.color;
      ctx.globalAlpha = 0.3;
      ctx.lineWidth = 6;
      ctx.shadowColor = r.color;
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) {
        ctx.lineTo(pts[i].x, pts[i].y);
      }
      ctx.stroke();

      // Core pass
      ctx.globalAlpha = 0.9;
      ctx.lineWidth = 1.5;
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) {
        ctx.lineTo(pts[i].x, pts[i].y);
      }
      ctx.stroke();
    }

    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }
};

/* =====================================================================
   ZONE 04 — Frost Bloom
   ===================================================================== */
const ZoneFrost = {
  crystals: [],
  time: 0,
  onClick: null,

  init() {
    this.crystals = [];
    this.time = 0;

    this.onClick = (e) => {
      const rect = Stage.canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      this.spawnCrystal(x, y);
    };
    Stage.canvas.addEventListener('click', this.onClick);
    Stage.canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const rect = Stage.canvas.getBoundingClientRect();
      const t = e.touches[0];
      this.spawnCrystal(t.clientX - rect.left, t.clientY - rect.top);
    }, { passive: false });

    $('#hudCount').textContent = '0';
  },

  destroy() {
    Stage.canvas.removeEventListener('click', this.onClick);
  },

  onParamChange() {
    $('#hudCount').textContent = this.crystals.length;
  },

  resize() {},

  spawnCrystal(x, y) {
    const branches = Math.round(Panel.get('branches', 7));
    const crystal = {
      x, y,
      branches: [],
      life: 1,
      growing: true,
      startBranches: branches
    };
    for (let i = 0; i < branches; i++) {
      const angle = (i / branches) * TAU + rand(-0.15, 0.15);
      crystal.branches.push({
        segments: [{ x, y, angle, length: 0 }],
        growthAngle: angle,
        maxLen: rand(40, 100)
      });
    }
    this.crystals.push(crystal);
    $('#hudCount').textContent = this.crystals.length;
  },

  tick(dt) {
    const ctx = Stage.ctx;
    const w = Stage.w, h = Stage.h;
    this.time += dt;

    const speed = Panel.get('speed', 60) / 100;
    const meltRate = Panel.get('meltrate', 20) / 100;

    // Fade previous (very subtle)
    ctx.fillStyle = 'rgba(10,15,13,0.12)';
    ctx.fillRect(0, 0, w, h);

    ctx.globalCompositeOperation = 'lighter';

    for (let i = this.crystals.length - 1; i >= 0; i--) {
      const c = this.crystals[i];

      if (c.growing) {
        // Grow each branch
        let allDone = true;
        for (const b of c.branches) {
          const seg = b.segments[b.segments.length - 1];
          const growAmt = dt * 40 * speed;

          if (seg.length < b.maxLen) {
            seg.length += growAmt;
            allDone = false;

            // Branch occasionally
            if (b.segments.length < 5 && Math.random() < 0.02 * speed) {
              const newAngle = seg.angle + (Math.random() < 0.5 ? -1 : 1) * rand(0.4, 0.8);
              const endX = seg.x + Math.cos(seg.angle) * seg.length;
              const endY = seg.y + Math.sin(seg.angle) * seg.length;
              b.segments.push({
                x: endX, y: endY,
                angle: newAngle,
                length: 0
              });
            }
          }
        }
        if (allDone) c.growing = false;
      } else {
        c.life -= dt * meltRate * 0.3;
      }

      if (c.life <= 0) {
        this.crystals.splice(i, 1);
        $('#hudCount').textContent = this.crystals.length;
        continue;
      }

      // Draw crystal
      const alpha = c.life;
      ctx.strokeStyle = `rgba(127,231,224,${alpha * 0.8})`;
      ctx.shadowColor = 'rgba(127,231,224,0.6)';
      ctx.shadowBlur = 8;
      ctx.lineWidth = 1;

      for (const b of c.branches) {
        ctx.beginPath();
        let cx = b.segments[0].x;
        let cy = b.segments[0].y;
        ctx.moveTo(cx, cy);
        for (const seg of b.segments) {
          const ex = seg.x + Math.cos(seg.angle) * seg.length;
          const ey = seg.y + Math.sin(seg.angle) * seg.length;
          ctx.lineTo(ex, ey);
          cx = ex; cy = ey;
        }
        ctx.stroke();
      }

      // Center glow
      const grad = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, 30);
      grad.addColorStop(0, `rgba(127,231,224,${alpha * 0.4})`);
      grad.addColorStop(1, 'rgba(127,231,224,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(c.x, c.y, 30, 0, TAU);
      ctx.fill();
    }

    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';
  }
};

/* =====================================================================
   ZONE 05 — Particle Stream
   ===================================================================== */
const ZoneStream = {
  particles: [],
  time: 0,
  gridSize: 20,

  init() {
    this.time = 0;
    this.particles = [];
    this.buildParticles();
    $('#hudCount').textContent = '3000';
  },

  destroy() {},

  onParamChange(id, v) {
    if (id === 'count') this.buildParticles();
    $('#hudCount').textContent = Math.round(Panel.get('count', 3000));
  },

  buildParticles() {
    const count = Math.round(Panel.get('count', 3000));
    this.particles = [];
    for (let i = 0; i < count; i++) {
      this.particles.push({
        x: Math.random() * Stage.w,
        y: Math.random() * Stage.h,
        vx: 0, vy: 0,
        life: Math.random(),
        hue: Math.random()
      });
    }
  },

  resize() { this.buildParticles(); },

  tick(dt) {
    const ctx = Stage.ctx;
    const w = Stage.w, h = Stage.h;
    this.time += dt;

    const speed = Panel.get('speed', 80) / 100;
    const force = Panel.get('force', 60) / 100;

    // Trailing effect: semi-transparent overlay
    ctx.fillStyle = 'rgba(10,15,13,0.1)';
    ctx.fillRect(0, 0, w, h);

    const rect = Stage.canvas.getBoundingClientRect();
    const mx = Cursor.x - rect.left;
    const my = Cursor.y - rect.top;

    ctx.globalCompositeOperation = 'lighter';

    for (const p of this.particles) {
      // Flow field (curl-noise-ish with noise2D)
      const scale = 0.004;
      const nx = noise2D(p.x * scale, p.y * scale + this.time * speed * 0.3);
      const ny = noise2D(p.x * scale + 100, p.y * scale + this.time * speed * 0.3);
      const angle = nx * TAU + ny * 0.5;
      const speedMag = 1.2 + ny * 0.8;

      p.vx += Math.cos(angle) * speedMag * speed * dt * 60;
      p.vy += Math.sin(angle) * speedMag * speed * dt * 60;

      // Mouse repulsion / vortex
      const dx = p.x - mx;
      const dy = p.y - my;
      const dist = Math.hypot(dx, dy);
      const radius = 140;
      if (dist < radius && dist > 0.1) {
        const f = (1 - dist / radius) * force * 4;
        // Tangential + outward (vortex feel)
        const tx = -dy / dist;
        const ty = dx / dist;
        p.vx += (tx * 0.7 + dx / dist * 0.3) * f;
        p.vy += (ty * 0.7 + dy / dist * 0.3) * f;
      }

      // Damping
      p.vx *= 0.94;
      p.vy *= 0.94;

      p.x += p.vx;
      p.y += p.vy;

      // Wrap
      if (p.x < -5) p.x = w + 5;
      if (p.x > w + 5) p.x = -5;
      if (p.y < -5) p.y = h + 5;
      if (p.y > h + 5) p.y = -5;

      // Color based on speed
      const sp = Math.hypot(p.vx, p.vy);
      const hueT = Math.min(1, sp / 3);

      // Draw particle
      let col;
      if (p.hue < 0.6) col = `rgba(77,255,184,${0.3 + hueT * 0.5})`;
      else if (p.hue < 0.85) col = `rgba(127,231,224,${0.3 + hueT * 0.5})`;
      else col = `rgba(255,62,138,${0.25 + hueT * 0.4})`;

      ctx.fillStyle = col;
      const size = 0.8 + hueT * 1.2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, size, 0, TAU);
      ctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over';
  }
};

/* =====================================================================
   ZONE 06 — Hologram Scan
   ===================================================================== */
const ZoneHologram = {
  time: 0,
  scanY: 0,
  textLines: [],

  init() {
    this.time = 0;
    this.scanY = 0;

    // Pre-compute text layout
    this.textLines = [
      { y: 0.3, text: 'AURORA', size: 72, weight: '300', tracking: '0.2em' },
      { y: 0.38, text: 'LABORATORY', size: 48, weight: '200', tracking: '0.35em' },
      { y: 0.48, text: '— 极光织体实验室 —', size: 18, weight: '300', tracking: '0.5em' },
      { y: 0.6, text: 'EXHIBIT 06 / HOLOGRAM SCAN', size: 11, weight: '400', tracking: '0.4em' },
      { y: 0.65, text: 'SIGNAL STRENGTH:  98.7%', size: 12, weight: '400', tracking: '0.15em' },
      { y: 0.68, text: 'CARRIER FREQ:  432.7 THz', size: 12, weight: '400', tracking: '0.15em' },
      { y: 0.71, text: 'POLARIZATION:  CIRCULAR', size: 12, weight: '400', tracking: '0.15em' },
      { y: 0.74, text: 'PHASE:  LOCKED', size: 12, weight: '400', tracking: '0.15em' },
    ];

    $('#hudCount').textContent = '60 线';
  },

  destroy() {},

  onParamChange(id, v) {
    if (id === 'density') $('#hudCount').textContent = Math.round(v) + ' 线';
  },

  resize() {},

  tick(dt) {
    const ctx = Stage.ctx;
    const w = Stage.w, h = Stage.h;
    this.time += dt;

    const density = Panel.get('density', 60);
    const glow = Panel.get('glow', 70) / 100;
    const speed = Panel.get('speed', 50) / 100;

    const rect = Stage.canvas.getBoundingClientRect();
    const my = clamp((Cursor.y - rect.top) / h, 0, 1);

    ctx.clearRect(0, 0, w, h);

    // Background grid
    ctx.strokeStyle = 'rgba(77,255,184,0.04)';
    ctx.lineWidth = 1;
    const gs = 40;
    for (let x = 0; x < w; x += gs) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
    for (let y = 0; y < h; y += gs) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }

    // Radar circles
    const cx = w / 2, cy = h / 2;
    ctx.strokeStyle = 'rgba(77,255,184,0.08)';
    for (let r = 80; r < Math.max(w, h); r += 80) {
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, TAU);
      ctx.stroke();
    }

    // Horizontal scan lines (density)
    const lineSpacing = h / density;
    const scanY = (this.time * speed * 60) % h;

    ctx.globalCompositeOperation = 'lighter';

    // Draw text, but only visible through scan window
    const scanWindow = h * 0.15; // height of scan glow band

    // Draw illuminated text
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (const line of this.textLines) {
      const ly = line.y * h;
      // How close is scan line to this line?
      const dist = Math.abs(ly - scanY);
      const illum = clamp(1 - dist / scanWindow, 0, 1);
      if (illum <= 0.01) continue;

      const alpha = illum * (0.3 + glow * 0.7);

      // Text glow
      ctx.font = `${line.weight} ${line.size}px 'Georgia', serif`;
      ctx.fillStyle = `rgba(77,255,184,${alpha * 0.2})`;
      ctx.shadowColor = `rgba(77,255,184,${alpha})`;
      ctx.shadowBlur = 20 * glow;
      ctx.fillText(line.text, cx, ly);

      // Core
      ctx.fillStyle = `rgba(232,245,240,${alpha * 0.9})`;
      ctx.shadowBlur = 6 * glow;
      ctx.fillText(line.text, cx, ly);
    }
    ctx.shadowBlur = 0;

    // Scan line itself
    const grad = ctx.createLinearGradient(0, scanY - scanWindow, 0, scanY + scanWindow);
    grad.addColorStop(0, 'rgba(77,255,184,0)');
    grad.addColorStop(0.5, `rgba(77,255,184,${0.5 + glow * 0.3})`);
    grad.addColorStop(1, 'rgba(77,255,184,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, scanY - scanWindow, w, scanWindow * 2);

    // Bright scan line core
    ctx.fillStyle = `rgba(232,245,240,${0.6 + glow * 0.3})`;
    ctx.fillRect(0, scanY - 0.5, w, 1);

    // Horizontal interference lines
    ctx.strokeStyle = 'rgba(77,255,184,0.12)';
    ctx.lineWidth = 1;
    for (let y = 0; y < h; y += lineSpacing) {
      const yOff = (y + this.time * speed * 30) % h;
      ctx.beginPath();
      ctx.moveTo(0, yOff);
      ctx.lineTo(w, yOff);
      ctx.stroke();
    }

    // Glitch: occasional horizontal displacement near scan line
    if (Math.random() < 0.02 * speed) {
      const gy = scanY + rand(-40, 40);
      const gl = rand(20, 120);
      const gx = rand(0, w - gl);
      ctx.fillStyle = 'rgba(255,62,138,0.3)';
      ctx.fillRect(gx, gy, gl, 2);
    }

    // Corner markers
    const marker = 30;
    ctx.strokeStyle = 'rgba(77,255,184,0.4)';
    ctx.lineWidth = 1;
    const corners = [[20,20],[w-20,20],[20,h-20],[w-20,h-20]];
    const dirs = [[1,1],[-1,1],[1,-1],[-1,-1]];
    for (let i = 0; i < 4; i++) {
      const [x, y] = corners[i];
      const [dx, dy] = dirs[i];
      ctx.beginPath();
      ctx.moveTo(x, y + dy * marker);
      ctx.lineTo(x, y);
      ctx.lineTo(x + dx * marker, y);
      ctx.stroke();
    }

    ctx.globalCompositeOperation = 'source-over';
  }
};

// Map zone index to effect object
const zoneEffects = [ZoneCurtain, ZoneTrails, ZoneRibbon, ZoneFrost, ZoneStream, ZoneHologram];

/* =====================================================================
   App controller
   ===================================================================== */
const App = {
  currentIdx: 0,
  currentZone: null,
  transitioning: false,

  init() {
    Stage.init();
    Cursor.init();

    // Build initial panel
    Panel.build(0);
    this.currentZone = zoneEffects[0];
    this.currentZone.init();
    $('#hudMode').textContent = zones[0].hudMode;

    // Nav buttons
    $$('.zone-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.zone);
        if (idx === this.currentIdx || this.transitioning) return;
        this.switchTo(idx);
      });
    });

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.key >= '1' && e.key <= '6') {
        const idx = parseInt(e.key) - 1;
        if (idx !== this.currentIdx && !this.transitioning) {
          this.switchTo(idx);
        }
      }
    });

    // Start engine
    Engine.start((dt, t) => this.frame(dt, t));

    // Announce upgrade
    this.announceUpgrade();
  },

  switchTo(idx) {
    if (this.transitioning) return;
    this.transitioning = true;

    // Fade out current
    const canvas = $('#canvas');
    canvas.classList.add('fading-out');

    setTimeout(() => {
      // Destroy old
      if (this.currentZone && this.currentZone.destroy) {
        this.currentZone.destroy();
      }

      this.currentIdx = idx;
      this.currentZone = zoneEffects[idx];

      // Update nav
      $$('.zone-btn').forEach((b, i) => {
        b.classList.toggle('active', i === idx);
      });

      // Update info
      const z = zones[idx];
      $('#zoneEyebrow').textContent = z.eyebrow;
      $('#zoneTitle').textContent = z.title;
      $('#zoneDesc').textContent = z.desc;
      $('#zoneHint').innerHTML = '<span>' + z.hint + '</span>';
      $('#hudMode').textContent = z.hudMode;

      // Build panel
      Panel.build(idx);

      // Init new zone
      Stage.clear();
      this.currentZone.init();

      // Fade in
      canvas.classList.remove('fading-out');
      canvas.classList.add('fading-in');
      // Force reflow
      void canvas.offsetWidth;
      requestAnimationFrame(() => {
        canvas.classList.add('active-fade');
      });

      setTimeout(() => {
        canvas.classList.remove('fading-in', 'active-fade');
        this.transitioning = false;
      }, 650);
    }, 400);
  },

  frame(dt, t) {
    Cursor.tick(dt);
    if (this.currentZone && this.currentZone.tick) {
      this.currentZone.tick(dt);
    }
  },

  announceUpgrade() {
    const send = () => {
      try {
        window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
      } catch(e) {}
    };
    send();
    if (document.readyState !== 'complete') {
      window.addEventListener('load', send, { once: true });
    }
  }
};

// Boot
window.addEventListener('DOMContentLoaded', () => App.init());
</script>

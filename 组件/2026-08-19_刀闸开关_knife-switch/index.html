<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="creative-medium" content="interactive-prototype">
<title>主电源刀闸 · 机械开关</title>
<style>
  /* ============ 基础 ============ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #141412;
    font-family: -apple-system, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #C8BFA8;
    user-select: none;
    -webkit-user-select: none;
    cursor: none;
  }

  /* ============ 场景容器 ============ */
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1200px;
    background:
      radial-gradient(ellipse at 50% 40%, #1e1e1b 0%, #141412 60%, #0a0a09 100%);
  }

  /* 金属拉丝面板 */
  .panel {
    position: relative;
    width: 640px;
    height: 760px;
    background:
      /* 顶部高光 */
      linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.01) 8%, transparent 15%),
      /* 底部阴影 */
      linear-gradient(0deg, rgba(0,0,0,0.4) 0%, transparent 12%),
      /* 拉丝纹理 */
      repeating-linear-gradient(90deg,
        #2d2d2a 0px, #32322f 1px, #2b2b28 2px, #30302d 3px, #2c2c29 4px),
      /* 基底色 */
      #2a2a28;
    border: 1px solid #1a1a18;
    border-radius: 6px;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.7),
      0 8px 20px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.05),
      inset 0 -1px 0 rgba(0,0,0,0.4);
    transform: rotateX(1.5deg);
    transform-style: preserve-3d;
  }

  /* 面板边框铆钉 */
  .rivet {
    position: absolute;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #5a5a55, #242420 70%);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.15),
      inset 0 -1px 1px rgba(0,0,0,0.5),
      0 1px 2px rgba(0,0,0,0.6);
  }
  .rivet.tl { top: 14px; left: 14px; }
  .rivet.tr { top: 14px; right: 14px; }
  .rivet.bl { bottom: 14px; left: 14px; }
  .rivet.br { bottom: 14px; right: 14px; }
  .rivet.tm { top: 14px; left: 50%; transform: translateX(-50%); }
  .rivet.bm { bottom: 14px; left: 50%; transform: translateX(-50%); }

  /* ============ 顶部：指示灯 ============ */
  .indicators {
    position: absolute;
    top: 40px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 140px;
  }

  .indicator {
    position: relative;
    width: 48px; height: 48px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #4a4a45, #1a1a18 70%);
    border: 2px solid #1a1a18;
    box-shadow:
      inset 0 2px 4px rgba(0,0,0,0.6),
      inset 0 -1px 2px rgba(255,255,255,0.06),
      0 2px 4px rgba(0,0,0,0.5);
  }
  .indicator .lens {
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.25), transparent 50%);
    mix-blend-mode: screen;
  }
  .indicator.red .lens { background-color: #4a1815; }
  .indicator.green .lens { background-color: #1a3a28; }

  .indicator.on.red .lens {
    background-color: #e84840;
    box-shadow:
      0 0 12px #e84840,
      0 0 24px rgba(232,72,64,0.6),
      0 0 48px rgba(232,72,64,0.3);
    animation: none;
  }
  .indicator.on.green .lens {
    background-color: #48c878;
    box-shadow:
      0 0 12px #48c878,
      0 0 24px rgba(72,200,120,0.6),
      0 0 48px rgba(72,200,120,0.3);
  }

  .indicator-label {
    position: absolute;
    top: 52px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 2px;
    color: #8a8270;
    white-space: nowrap;
  }

  /* ============ 中部：刀闸区 ============ */
  .switch-area {
    position: absolute;
    top: 140px;
    left: 50%;
    transform: translateX(-50%);
    width: 260px;
    height: 400px;
  }

  .switch-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* 瓷座 */
  .ceramic-base {
    fill: #1a1a18;
    stroke: #0a0a09;
    stroke-width: 1.5;
  }
  .ceramic-base-highlight {
    fill: none;
    stroke: rgba(255,255,255,0.06);
    stroke-width: 1;
  }

  /* 铜接线柱 */
  .terminal {
    fill: url(#brassGrad);
    stroke: #6a4a0a;
    stroke-width: 1;
  }

  /* 刀闸本体（黄铜片） */
  .blade {
    fill: url(#bladeGrad);
    stroke: #7a5a10;
    stroke-width: 1;
    transform-origin: 130px 340px;
    cursor: none;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    transition: filter 0.2s ease;
  }

  .blade.hover {
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6))
            drop-shadow(0 0 2px rgba(255,215,0,0.15));
  }

  .blade.dragging {
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
  }

  /* 绝缘瓷柄 */
  .handle {
    fill: #1e1e1c;
    stroke: #0a0a09;
    stroke-width: 1.5;
  }
  .handle-highlight {
    fill: rgba(255,255,255,0.08);
  }
  .handle-ring {
    fill: #8a7010;
    stroke: #5a4008;
    stroke-width: 0.5;
  }

  /* 静触头 */
  .contact {
    fill: url(#contactGrad);
    stroke: #5a4008;
    stroke-width: 1;
  }

  /* 接触电弧 - canvas */
  .arc-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* ============ 下部：仪表 ============ */
  .meters {
    position: absolute;
    bottom: 70px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 40px;
  }

  .meter {
    position: relative;
    width: 130px;
    height: 130px;
  }

  .meter-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .meter-face {
    fill: #e8dcc4;
    stroke: #2a2a28;
    stroke-width: 4;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));
  }

  .meter-inner-ring {
    fill: none;
    stroke: #6a5a3a;
    stroke-width: 1;
  }

  .meter-scale {
    stroke: #2a2a28;
    stroke-width: 1;
  }
  .meter-scale-major {
    stroke-width: 1.5;
  }
  .meter-scale-minor {
    stroke-width: 0.6;
    opacity: 0.7;
  }

  .meter-label {
    font-size: 9px;
    fill: #4a3a20;
    font-family: "SimHei", "Microsoft YaHei", serif;
    text-anchor: middle;
    font-weight: bold;
  }

  .meter-needle {
    stroke: #8a1818;
    stroke-width: 1.8;
    stroke-linecap: round;
    transform-origin: 65px 80px;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.3));
  }

  .meter-needle-cap {
    fill: #2a2a28;
    stroke: #6a5a3a;
    stroke-width: 1;
  }

  .meter-value {
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: #4a3a20;
    font-family: "Consolas", monospace;
    font-weight: bold;
  }

  .meter-title {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: #8a7a5a;
    letter-spacing: 3px;
  }

  /* 仪表玻璃反光 */
  .meter-glass {
    fill: url(#glassGrad);
    pointer-events: none;
  }

  /* ============ 铭牌 ============ */
  .nameplate {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 4px 16px;
    background: linear-gradient(180deg, #3a3a36, #262623);
    border: 1px solid #1a1a18;
    border-radius: 2px;
    font-size: 13px;
    letter-spacing: 6px;
    color: #b8a880;
    text-shadow: 0 1px 1px rgba(0,0,0,0.6);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.06),
      0 2px 4px rgba(0,0,0,0.4);
    font-family: "SimHei", "Microsoft YaHei", serif;
  }

  /* ============ 状态提示 ============ */
  .status-hint {
    position: absolute;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #6a6250;
    letter-spacing: 3px;
    opacity: 0.7;
    transition: opacity 0.5s;
  }
  .status-hint.hidden { opacity: 0; }

  /* ============ 自定义光标 ============ */
  .cursor {
    position: fixed;
    width: 40px;
    height: 40px;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s ease-out;
    will-change: transform;
  }

  .cursor svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .cursor-hand {
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: 20px 20px;
  }

  /* 预接触：微微抖动 */
  .cursor.pre-contact .cursor-hand {
    animation: cursorWiggle 0.4s ease-in-out infinite alternate;
  }

  @keyframes cursorWiggle {
    from { transform: rotate(-3deg) scale(1.02); }
    to { transform: rotate(3deg) scale(1.02); }
  }

  /* 抓取状态：握紧 */
  .cursor.grabbing .cursor-hand {
    transform: scale(0.92) rotate(-5deg);
    animation: none;
  }

  /* 拖拽状态 */
  .cursor.dragging .cursor-hand {
    transform: scale(0.88) rotate(-8deg);
    animation: none;
  }

  /* ============ 面板震动 ============ */
  .panel.impact {
    animation: panelImpact 0.15s ease-out;
  }
  @keyframes panelImpact {
    0% { transform: rotateX(1.5deg) translateY(0); }
    30% { transform: rotateX(1.5deg) translateY(1px); }
    60% { transform: rotateX(1.5deg) translateY(-0.5px); }
    100% { transform: rotateX(1.5deg) translateY(0); }
  }

  /* ============ 面板通电氛围光 ============ */
  .panel-glow {
    position: absolute;
    inset: 0;
    border-radius: 6px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
    box-shadow:
      inset 0 0 60px rgba(232,72,64,0.08),
      inset 0 0 20px rgba(255,180,40,0.05);
  }
  .panel.powered .panel-glow {
    opacity: 1;
  }

  /* ============ 震动阴影 ============ */
  .panel.powered {
    box-shadow:
      0 30px 80px rgba(0,0,0,0.7),
      0 8px 20px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.05),
      inset 0 -1px 0 rgba(0,0,0,0.4),
      0 0 0 1px rgba(232,72,64,0.15);
  }

  /* ============ prefers-reduced-motion ============ */
  @media (prefers-reduced-motion: reduce) {
    .cursor.pre-contact .cursor-hand,
    .panel.impact {
      animation: none;
    }
    .blade, .panel-glow {
      transition: none;
    }
    .meter-needle {
      transition: transform 0.3s ease-out;
    }
  }

  /* 底部提示 */
  .footer-hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #4a4638;
    letter-spacing: 2px;
    cursor: none;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="panel" id="panel">
    <div class="panel-glow"></div>

    <!-- 铆钉 -->
    <div class="rivet tl"></div>
    <div class="rivet tr"></div>
    <div class="rivet bl"></div>
    <div class="rivet br"></div>
    <div class="rivet tm"></div>
    <div class="rivet bm"></div>

    <!-- 指示灯 -->
    <div class="indicators">
      <div class="indicator red" id="indPower">
        <div class="lens"></div>
        <div class="indicator-label">电源</div>
      </div>
      <div class="indicator green" id="indOff">
        <div class="lens"></div>
        <div class="indicator-label">断电</div>
      </div>
    </div>

    <!-- 状态提示 -->
    <div class="status-hint" id="statusHint">抓住手柄 · 向下合闸</div>

    <!-- 刀闸区 -->
    <div class="switch-area" id="switchArea">
      <svg class="switch-svg" viewBox="0 0 260 400" id="switchSvg">
        <defs>
          <!-- 黄铜渐变 -->
          <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#8a6810"/>
            <stop offset="30%" stop-color="#d4a828"/>
            <stop offset="50%" stop-color="#e8c040"/>
            <stop offset="70%" stop-color="#c89818"/>
            <stop offset="100%" stop-color="#7a5808"/>
          </linearGradient>
          <!-- 刀闸片渐变 -->
          <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#6a4a08"/>
            <stop offset="15%" stop-color="#b8860b"/>
            <stop offset="35%" stop-color="#daa520"/>
            <stop offset="50%" stop-color="#f0c840"/>
            <stop offset="65%" stop-color="#daa520"/>
            <stop offset="85%" stop-color="#b8860b"/>
            <stop offset="100%" stop-color="#6a4a08"/>
          </linearGradient>
          <!-- 静触头渐变 -->
          <linearGradient id="contactGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#c89818"/>
            <stop offset="50%" stop-color="#e8c040"/>
            <stop offset="100%" stop-color="#8a6810"/>
          </linearGradient>
          <!-- 仪表玻璃反光 -->
          <radialGradient id="glassGrad" cx="35%" cy="25%" r="60%">
            <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
            <stop offset="40%" stop-color="rgba(255,255,255,0.06)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </radialGradient>
        </defs>

        <!-- 瓷底座（下方固定座） -->
        <rect class="ceramic-base" x="100" y="330" width="60" height="55" rx="4" ry="4"/>
        <rect class="ceramic-base-highlight" x="102" y="332" width="56" height="2" rx="1"/>
        <ellipse cx="115" cy="355" rx="6" ry="8" fill="rgba(255,255,255,0.04)"/>

        <!-- 下接线柱（铜） -->
        <rect class="terminal" x="112" y="375" width="36" height="14" rx="2"/>
        <circle cx="122" cy="382" r="3" fill="#5a4008"/>
        <circle cx="138" cy="382" r="3" fill="#5a4008"/>

        <!-- 上静触头（U型卡口） -->
        <g id="upperContact">
          <!-- 上瓷座 -->
          <rect class="ceramic-base" x="100" y="45" width="60" height="45" rx="4"/>
          <rect class="ceramic-base-highlight" x="102" y="47" width="56" height="2" rx="1"/>
          <!-- 上接线柱 -->
          <rect class="terminal" x="112" y="25" width="36" height="14" rx="2"/>
          <circle cx="122" cy="32" r="3" fill="#5a4008"/>
          <circle cx="138" cy="32" r="3" fill="#5a4008"/>
          <!-- 静触头夹片（U型开口朝下） -->
          <rect class="contact" x="112" y="85" width="10" height="22" rx="1"/>
          <rect class="contact" x="138" y="85" width="10" height="22" rx="1"/>
          <rect class="contact" x="112" y="85" width="36" height="8" rx="1"/>
          <!-- 卡口内阴影 -->
          <rect x="122" y="93" width="16" height="14" fill="rgba(0,0,0,0.4)"/>
        </g>

        <!-- 刀闸刀片 + 手柄（可旋转） -->
        <g id="bladeGroup" class="blade">
          <!-- 刀刀片（黄铜片） -->
          <rect x="120" y="95" width="20" height="250" rx="2"/>
          <!-- 刀片中线棱线 -->
          <line x1="130" y1="97" x2="130" y2="340" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <!-- 刀片上端圆弧 -->
          <path d="M 120 95 Q 130 85 140 95" fill="url(#bladeGrad)" stroke="#7a5a10" stroke-width="1"/>
          
          <!-- 绝缘瓷柄（黑色，带铜箍） -->
          <g id="handleGroup">
            <!-- 瓷柄主体 -->
            <rect class="handle" x="108" y="200" width="44" height="80" rx="8"/>
            <!-- 瓷柄上铜箍 -->
            <rect class="handle-ring" x="106" y="208" width="48" height="5" rx="1"/>
            <!-- 瓷柄中铜箍 -->
            <rect class="handle-ring" x="106" y="238" width="48" height="4" rx="1"/>
            <!-- 瓷柄下铜箍 -->
            <rect class="handle-ring" x="106" y="268" width="48" height="5" rx="1"/>
            <!-- 瓷柄高光 -->
            <ellipse class="handle-highlight" cx="118" cy="230" rx="4" ry="25"/>
          </g>
        </g>

      </svg>
      <canvas class="arc-canvas" id="arcCanvas"></canvas>
    </div>

    <!-- 仪表 -->
    <div class="meters">
      <div class="meter">
        <div class="meter-title">电压表</div>
        <svg class="meter-svg" viewBox="0 0 130 130">
          <circle class="meter-face" cx="65" cy="70" r="52"/>
          <circle class="meter-inner-ring" cx="65" cy="70" r="44"/>
          <!-- 刻度 -->
          <g id="voltScale"></g>
          <text class="meter-label" x="65" y="112">V</text>
          <!-- 指针 -->
          <line class="meter-needle" id="voltNeedle" x1="65" y1="80" x2="65" y2="30"/>
          <circle class="meter-needle-cap" cx="65" cy="80" r="5"/>
          <!-- 玻璃反光 -->
          <circle class="meter-glass" cx="65" cy="70" r="50"/>
        </svg>
      </div>
      <div class="meter">
        <div class="meter-title">电流表</div>
        <svg class="meter-svg" viewBox="0 0 130 130">
          <circle class="meter-face" cx="65" cy="70" r="52"/>
          <circle class="meter-inner-ring" cx="65" cy="70" r="44"/>
          <!-- 刻度 -->
          <g id="ampScale"></g>
          <text class="meter-label" x="65" y="112">A</text>
          <!-- 指针 -->
          <line class="meter-needle" id="ampNeedle" x1="65" y1="80" x2="65" y2="30"/>
          <circle class="meter-needle-cap" cx="65" cy="80" r="5"/>
          <!-- 玻璃反光 -->
          <circle class="meter-glass" cx="65" cy="70" r="50"/>
        </svg>
      </div>
    </div>

    <!-- 铭牌 -->
    <div class="nameplate">主电源</div>
  </div>
</div>

<div class="footer-hint">按住手柄 · 越过失点 · 听咔嗒</div>

<!-- 自定义光标 -->
<div class="cursor" id="cursor">
  <svg viewBox="0 0 40 40">
    <g class="cursor-hand">
      <!-- 绝缘手套剪影（橙色+黑色腕带）-->
      <!-- 手掌主体 -->
      <path d="M 14 6 L 18 5 L 20 8 L 22 5 L 26 6 L 27 14 L 30 18 L 30 24 L 26 28 L 22 30 L 18 30 L 14 28 L 10 24 L 10 18 L 13 14 Z"
            fill="#d4750a" stroke="#6a3804" stroke-width="1.2" stroke-linejoin="round"/>
      <!-- 手套腕带 -->
      <rect x="9" y="25" width="22" height="5" rx="1" fill="#2a2a28" stroke="#0a0a09" stroke-width="0.8"/>
      <!-- 手套皱褶线 -->
      <path d="M 14 12 L 14 22" stroke="rgba(0,0,0,0.2)" stroke-width="0.8"/>
      <path d="M 20 10 L 20 22" stroke="rgba(0,0,0,0.15)" stroke-width="0.8"/>
      <path d="M 26 12 L 26 22" stroke="rgba(0,0,0,0.2)" stroke-width="0.8"/>
      <!-- 拇指 -->
      <ellipse cx="10" cy="20" rx="3" ry="4" fill="#d4750a" stroke="#6a3804" stroke-width="1.2"/>
      <!-- 指尖高光 -->
      <path d="M 15 7 L 17 6" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-linecap="round"/>
      <path d="M 23 6 L 25 7" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-linecap="round"/>
    </g>
  </svg>
</div>

<script>
(function() {
  'use strict';

  // ===================== 配置 =====================
  const CONFIG = {
    // 双势阱参数
    wellK: 6,           // 势阱刚度 (U = 0.5*k*(x^2-1)^2)
    damping: 4.5,       // 拖动阻尼
    snapAccel: 28,      // 越过死点后吸合加速度倍数
    snapDamping: 6,     // 吸合过程阻尼
    impactDecay: 18,    // 撞击余振衰减系数
    impactFreq: 28,     // 撞击余振频率
    impactAmp: 0.06,    // 撞击余振初始振幅

    // 仪表二阶阻尼系统
    meterOmega: 4.5,    // 固有角频率
    meterZeta: 0.28,    // 阻尼比 (欠阻尼，有余振)
    voltTarget: 220,    // 合闸电压目标值
    ampTarget: 45,      // 合闸电流目标值

    // 光标
    preContactDist: 80, // 预接触距离(像素，基于屏幕坐标)

    // 刀闸角度映射
    angleUp: -22,       // 向上（断电）角度
    angleDown: 4,       // 向下（合闸）角度
  };

  // ===================== 状态 =====================
  const state = {
    // 刀闸物理状态
    x: -1,              // 位置: -1=上稳态, +1=下稳态
    v: 0,               // 速度
    isDragging: false,
    isHolding: false,   // 已抓住手柄
    lastDragY: 0,       // 上一次拖拽Y坐标
    // 吸合动画状态
    isSnapping: false,
  };

  // 仪表状态 (二阶系统)
  const volt = { pos: 0, vel: 0, target: 0 };
  const amp = { pos: 0, vel: 0, target: 0 };

  // 撞击余振
  const impact = { active: false, t: 0, amp: 0, dir: 1 };

  // 电弧粒子
  const arcParticles = [];
  let arcBurstActive = false;
  let arcBurstTimer = 0;

  // ===================== DOM =====================
  const $ = id => document.getElementById(id);
  const bladeGroup = $('bladeGroup');
  const panel = $('panel');
  const switchArea = $('switchArea');
  const arcCanvas = $('arcCanvas');
  const arcCtx = arcCanvas.getContext('2d');
  const voltNeedle = $('voltNeedle');
  const ampNeedle = $('ampNeedle');
  const cursor = $('cursor');
  const indPower = $('indPower');
  const indOff = $('indOff');
  const statusHint = $('statusHint');

  // ===================== 初始化 =====================
  function init() {
    resizeArcCanvas();
    drawMeterScales();
    updateBladeAngle();
    updateIndicators();
    hideStatusHintAfterDelay();

    // 光标初始在屏幕中央
    cursor.style.left = window.innerWidth / 2 + 'px';
    cursor.style.top = window.innerHeight / 2 + 'px';

    // 事件
    window.addEventListener('mousemove', onMouseMove, { passive: true });
    window.addEventListener('mousedown', onMouseDown);
    window.addEventListener('mouseup', onMouseUp);
    window.addEventListener('resize', resizeArcCanvas);

    // 可见性
    document.addEventListener('visibilitychange', onVisibilityChange);
    window.addEventListener('beforeunload', onBeforeUnload);

    // 启动主循环
    lastTime = performance.now();
    rafId = requestAnimationFrame(loop);
  }

  function hideStatusHintAfterDelay() {
    setTimeout(() => {
      if (!state.isDragging && !state.isHolding) {
        statusHint.classList.add('hidden');
      }
    }, 3500);
  }

  function resizeArcCanvas() {
    const rect = switchArea.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    arcCanvas.width = rect.width * dpr;
    arcCanvas.height = rect.height * dpr;
    arcCtx.scale(dpr, dpr);
  }

  function drawMeterScales() {
    const voltScale = $('voltScale');
    const ampScale = $('ampScale');
    const cx = 65, cy = 70;
    const startAngle = -150; // deg
    const endAngle = 150;
    const rOuter = 38;
    const rInner = 34;
    const rLabel = 28;

    function drawScale(group, range, majorStep, minorStep) {
      const steps = Math.floor(range / minorStep);
      const angleRange = endAngle - startAngle;
      for (let i = 0; i <= steps; i++) {
        const val = i * minorStep;
        const angle = startAngle + (val / range) * angleRange;
        const rad = angle * Math.PI / 180;
        const isMajor = val % majorStep === 0;
        const r1 = isMajor ? rOuter : rOuter - 2;
        const r2 = rInner;
        const x1 = cx + Math.sin(rad) * r1;
        const y1 = cy - Math.cos(rad) * r1;
        const x2 = cx + Math.sin(rad) * r2;
        const y2 = cy - Math.cos(rad) * r2;
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1);
        line.setAttribute('y1', y1);
        line.setAttribute('x2', x2);
        line.setAttribute('y2', y2);
        line.setAttribute('class', isMajor ? 'meter-scale meter-scale-major' : 'meter-scale meter-scale-minor');
        group.appendChild(line);

        if (isMajor && val <= range) {
          const tx = cx + Math.sin(rad) * rLabel;
          const ty = cy - Math.cos(rad) * rLabel + 3;
          const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('x', tx);
          text.setAttribute('y', ty);
          text.setAttribute('text-anchor', 'middle');
          text.setAttribute('font-size', '8');
          text.setAttribute('fill', '#4a3a20');
          text.setAttribute('font-family', 'Consolas, monospace');
          text.setAttribute('font-weight', 'bold');
          text.textContent = val;
          group.appendChild(text);
        }
      }
    }

    drawScale(voltScale, 300, 50, 10);
    drawScale(ampScale, 60, 10, 2);
  }

  // ===================== 光标 =====================
  let mouseX = 0, mouseY = 0;

  function onMouseMove(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
    cursor.style.left = mouseX + 'px';
    cursor.style.top = mouseY + 'px';

    // 预接触检测
    if (!state.isDragging) {
      const handleRect = getHandleScreenRect();
      const dist = pointToRectDist(mouseX, mouseY, handleRect);
      if (dist < CONFIG.preContactDist) {
        bladeGroup.classList.add('hover');
        cursor.classList.add('pre-contact');
      } else {
        bladeGroup.classList.remove('hover');
        cursor.classList.remove('pre-contact');
      }
    }

    // 拖动
    if (state.isDragging) {
      const dy = e.clientY - state.lastDragY;
      state.lastDragY = e.clientY;
      // 将像素位移转换为"势能场坐标"速度输入
      // 拖动范围大约 300px 对应 x 从 -1 到 1
      const dx = dy / 180;
      applyDragInput(dx);
    }
  }

  function getHandleScreenRect() {
    // 手柄在 SVG 中的位置 (相对 viewBox)
    // 瓷柄: x=108, y=200, w=44, h=80
    // 但刀片旋转了，所以需要变换
    const svg = $('switchSvg');
    const rect = svg.getBoundingClientRect();
    const vbW = 260, vbH = 400;
    const sx = rect.width / vbW;
    const sy = rect.height / vbH;
    // 近似：手柄中心在 (130, 240) 在 SVG 坐标中
    // 刀片绕 (130, 340) 旋转
    const pivotX = rect.left + 130 * sx;
    const pivotY = rect.top + 340 * sy;
    const handleCenterOffset = -140; // 从 pivot 到手柄中心的距离(向上为负)
    const angle = mapXtoAngle(state.x) * Math.PI / 180;
    const hx = pivotX + Math.sin(angle) * handleCenterOffset * sx;
    const hy = pivotY + Math.cos(angle) * handleCenterOffset * sy;
    const hw = 44 * sx;
    const hh = 80 * sy;
    return { x: hx - hw/2, y: hy - hh/2, w: hw, h: hh, cx: hx, cy: hy };
  }

  function pointToRectDist(px, py, r) {
    const dx = Math.max(r.x - px, 0, px - (r.x + r.w));
    const dy = Math.max(r.y - py, 0, py - (r.y + r.h));
    return Math.sqrt(dx*dx + dy*dy);
  }

  function onMouseDown(e) {
    if (e.button !== 0) return;
    const handleRect = getHandleScreenRect();
    const dist = pointToRectDist(e.clientX, e.clientY, handleRect);

    if (dist < CONFIG.preContactDist) {
      state.isDragging = true;
      state.isHolding = true;
      state.lastDragY = e.clientY;
      state.isSnapping = false;
      bladeGroup.classList.add('dragging');
      bladeGroup.classList.remove('hover');
      cursor.classList.add('dragging');
      cursor.classList.remove('pre-contact');
      statusHint.classList.add('hidden');
    }
  }

  function onMouseUp() {
    if (state.isDragging) {
      state.isDragging = false;
      state.isHolding = false;
      state.isSnapping = true; // 松手后由势阱决定去向
      bladeGroup.classList.remove('dragging');
      cursor.classList.remove('dragging');
    }
  }

  // ===================== 物理引擎 =====================

  // 双势阱: U(x) = 0.5 * k * (x^2 - 1)^2
  // 力: F = -dU/dx = -k * (x^2 - 1) * 2x = -2k*x*(x^2-1)
  //   = -2k*x^3 + 2k*x
  // 死点在 x=0，稳态在 x=±1
  function wellForce(x) {
    return -2 * CONFIG.wellK * x * (x * x - 1);
  }

  // 拖动时施加输入 + 阻尼
  // 拖动模式：光标位置决定目标位置，但带阻尼和死点阻力
  let dragInput = 0; // 来自鼠标的速度输入（每帧累积后清零）

  function applyDragInput(dx) {
    // 累积这一帧的位移输入
    dragInput += dx;
  }

  function physicsStep(dt) {
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    if (state.isDragging) {
      // 拖动模式：位置由用户主导，但受势阱阻力和阻尼影响
      // 直接用鼠标位移作为目标速度，乘以阻力系数（接近死点时阻力大）
      const resistance = 1 + Math.abs(state.x) < 0.6 ?
        2.5 * (1 - Math.abs(state.x) / 0.6) + 1 : 1;
      // 解释：越接近死点(x=0)，resistance 越大(最大3.5)，鼠标位移被"吃掉"越多

      // 势阱力 + 鼠标输入 + 阻尼
      const F_well = wellForce(state.x);
      const F_drag = dragInput * 8 / resistance;
      const F_damp = -CONFIG.damping * state.v;
      const a = F_well + F_drag + F_damp;

      state.v += a * dt;
      state.x += state.v * dt;

      // 限制范围
      state.x = clamp(state.x, -1.3, 1.3);
      dragInput = 0; // 清零本帧输入

    } else if (state.isSnapping) {
      // 松手/吸合模式：势阱主导，带阻尼
      const F_well = wellForce(state.x) * CONFIG.snapAccel;
      const F_damp = -CONFIG.snapDamping * state.v;
      const a = F_well + F_damp;

      state.v += a * dt;
      state.x += state.v * dt;

      // 检测是否到达稳态附近且速度很小
      const targetX = state.x > 0 ? 1 : -1;
      if (Math.abs(state.x - targetX) < 0.02 && Math.abs(state.v) < 0.1) {
        state.x = targetX;
        state.v = 0;
        state.isSnapping = false;
        onReachSteady(targetX);
      }
    }
    // 非拖动非吸合 = 已经在稳态，什么都不做
  }

  // 到达稳态触发
  let lastSteadyState = -1;

  function onReachSteady(side) {
    // 撞击余振
    impact.active = true;
    impact.t = 0;
    impact.amp = CONFIG.impactAmp;
    impact.dir = side;

    // 面板震动
    panel.classList.remove('impact');
    void panel.offsetWidth; // reflow
    panel.classList.add('impact');

    // 状态切换
    if (side === 1 && lastSteadyState !== 1) {
      // 合闸
      triggerArcBurst();
      panel.classList.add('powered');
    } else if (side === -1 && lastSteadyState !== -1) {
      // 断电
      panel.classList.remove('powered');
    }

    lastSteadyState = side;
    updateIndicators();
  }

  function updateIndicators() {
    const isOn = state.x > 0.5 || (state.isSnapping && state.x > 0);
    // 更精确地：看当前稳态方向
    const steadyOn = lastSteadyState === 1 || (state.x > 0 && state.isSnapping);

    if (steadyOn) {
      indPower.classList.add('on');
      indOff.classList.remove('on');
      volt.target = CONFIG.voltTarget;
      amp.target = CONFIG.ampTarget;
    } else {
      indPower.classList.remove('on');
      indOff.classList.add('on');
      volt.target = 0;
      amp.target = 0;
    }
  }

  // ===================== 电弧粒子 =====================
  function triggerArcBurst() {
    arcBurstActive = true;
    arcBurstTimer = 0.25; // 持续 250ms

    // 找到上静触头位置 (SVG 坐标，相对 switchArea)
    // 上触头在 y≈95，x=130 (刀片顶端要插入的位置)
    const svg = $('switchSvg');
    const rect = svg.getBoundingClientRect();
    const areaRect = switchArea.getBoundingClientRect();
    const sx = rect.width / 260;
    const sy = rect.height / 400;
    const contactX = 130 * sx + (rect.left - areaRect.left);
    const contactY = 95 * sy + (rect.top - areaRect.top);

    // 生成一批电弧粒子
    for (let i = 0; i < 35; i++) {
      const angle = (Math.random() - 0.5) * Math.PI * 1.2;
      const speed = 60 + Math.random() * 180;
      arcParticles.push({
        x: contactX + (Math.random() - 0.5) * 12,
        y: contactY + (Math.random() - 0.5) * 8,
        vx: Math.sin(angle) * speed,
        vy: Math.cos(angle) * speed - 40,
        life: 0.3 + Math.random() * 0.4,
        age: 0,
        size: 1 + Math.random() * 2.5,
        hue: 200 + Math.random() * 60, // 蓝紫
        type: Math.random() < 0.3 ? 'spark' : 'arc',
      });
    }
  }

  function updateParticles(dt) {
    if (arcBurstActive) {
      arcBurstTimer -= dt;
      if (arcBurstTimer <= 0) arcBurstActive = false;
    }

    for (let i = arcParticles.length - 1; i >= 0; i--) {
      const p = arcParticles[i];
      p.age += dt;
      if (p.age >= p.life) {
        arcParticles.splice(i, 1);
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 200 * dt; // 重力
      p.vx *= 0.98;
    }
  }

  function drawParticles() {
    arcCtx.clearRect(0, 0, arcCanvas.width, arcCanvas.height);

    for (const p of arcParticles) {
      const alpha = 1 - p.age / p.life;
      const size = p.size * (0.5 + alpha * 0.5);
      const grad = arcCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 3);
      grad.addColorStop(0, `hsla(${p.hue}, 100%, 85%, ${alpha})`);
      grad.addColorStop(0.3, `hsla(${p.hue}, 100%, 65%, ${alpha * 0.7})`);
      grad.addColorStop(1, `hsla(${p.hue + 20}, 100%, 40%, 0)`);
      arcCtx.fillStyle = grad;
      arcCtx.beginPath();
      arcCtx.arc(p.x, p.y, size * 3, 0, Math.PI * 2);
      arcCtx.fill();

      // 亮核
      arcCtx.fillStyle = `hsla(${p.hue}, 100%, 95%, ${alpha})`;
      arcCtx.beginPath();
      arcCtx.arc(p.x, p.y, size * 0.5, 0, Math.PI * 2);
      arcCtx.fill();
    }
  }

  // ===================== 仪表二阶阻尼系统 =====================
  function updateMeter(meter, dt) {
    // 二阶系统: pos'' + 2*zeta*omega*pos' + omega^2*pos = omega^2*target
    const omega = CONFIG.meterOmega;
    const zeta = CONFIG.meterZeta;
    const a = -2 * zeta * omega * meter.vel - omega * omega * (meter.pos - meter.target);
    meter.vel += a * dt;
    meter.pos += meter.vel * dt;
  }

  function updateNeedles() {
    // 电压: 0-300V 对应 -150°~+150°
    const voltAngle = (volt.pos / 300) * 300 - 150;
    voltNeedle.setAttribute('transform', `rotate(${voltAngle}, 65, 80)`);

    // 电流: 0-60A 对应 -150°~+150°
    const ampAngle = (amp.pos / 60) * 300 - 150;
    ampNeedle.setAttribute('transform', `rotate(${ampAngle}, 65, 80)`);
  }

  // ===================== 刀闸角度 =====================
  function mapXtoAngle(x) {
    // x=-1 -> angleUp, x=1 -> angleDown
    const t = (x + 1) / 2; // 0..1
    return CONFIG.angleUp + t * (CONFIG.angleDown - CONFIG.angleUp);
  }

  function updateBladeAngle() {
    let displayX = state.x;

    // 加上撞击余振
    if (impact.active) {
      const decay = Math.exp(-CONFIG.impactDecay * impact.t);
      const osc = Math.sin(CONFIG.impactFreq * impact.t) * impact.amp * impact.dir * -1;
      displayX += osc * decay;
    }

    const angle = mapXtoAngle(displayX);
    bladeGroup.style.transform = `rotate(${angle}deg)`;
  }

  // ===================== 主循环 =====================
  let rafId = null;
  let lastTime = 0;
  let running = true;

  function loop(now) {
    if (!running) return;
    const dt = Math.min(0.033, (now - lastTime) / 1000); // 限制最大步长
    lastTime = now;

    // 物理
    if (state.isDragging || state.isSnapping) {
      physicsStep(dt);
    }

    // 撞击余振计时
    if (impact.active) {
      impact.t += dt;
      if (impact.t > 1.0) impact.active = false;
    }

    // 仪表
    updateMeter(volt, dt);
    updateMeter(amp, dt);

    // 渲染
    updateBladeAngle();
    updateNeedles();
    updateParticles(dt);
    drawParticles();

    // 持续更新指示灯状态（拖动过程中越过0线时渐变）
    if (state.isDragging || state.isSnapping) {
      updateIndicators();
    }

    rafId = requestAnimationFrame(loop);
  }

  // ===================== 生命周期 =====================
  function onVisibilityChange() {
    if (document.hidden) {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
    } else {
      running = true;
      lastTime = performance.now();
      rafId = requestAnimationFrame(loop);
    }
  }

  function onBeforeUnload() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
  }

  // ===================== 启动 =====================
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // 宣告可升级
  function announceUpgrade() {
    try {
      window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    } catch (e) {}
  }
  announceUpgrade();
  if (document.readyState !== 'complete') {
    window.addEventListener('load', announceUpgrade, { once: true });
  }

})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拨浪鼓·甩珠击鼓 — V3 交互组件</title>
<meta name="creative-medium" content="interactive-prototype">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  }
  body {
    background: #1a120f;
    cursor: none;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
  }

  /* 颜色方案 —— 朱砂红 */
  body.scheme-red {
    --bg-0: #1a120f;
    --bg-1: #2a1a15;
    --drum-face-0: #d6452a;
    --drum-face-1: #a82a18;
    --drum-face-2: #7a1a0e;
    --drum-rim: #3d140a;
    --drum-body: #5a2010;
    --handle-0: #c8a070;
    --handle-1: #8b6840;
    --handle-2: #5a4028;
    --rope: #e8d5a8;
    --bead-0: #d4a858;
    --bead-1: #8b6020;
    --bead-2: #4a3010;
    --text: #f0e6d8;
    --text-dim: rgba(240, 230, 216, 0.6);
    --accent: #e8b840;
    --panel-bg: rgba(26, 18, 15, 0.7);
    --panel-border: rgba(232, 184, 64, 0.3);
    --particle: #e8b840;
  }

  /* 颜色方案 —— 墨黑金 */
  body.scheme-ink {
    --bg-0: #0d1014;
    --bg-1: #1a1f26;
    --drum-face-0: #2a3442;
    --drum-face-1: #1a2230;
    --drum-face-2: #0e1420;
    --drum-rim: #0a0d12;
    --drum-body: #15191f;
    --handle-0: #e8dcc8;
    --handle-1: #b0a088;
    --handle-2: #706048;
    --rope: #c0b090;
    --bead-0: #f0d480;
    --bead-1: #c09030;
    --bead-2: #705010;
    --text: #e8ecf0;
    --text-dim: rgba(232, 236, 240, 0.55);
    --accent: #f0d480;
    --panel-bg: rgba(13, 16, 20, 0.75);
    --panel-border: rgba(240, 212, 128, 0.25);
    --particle: #f0d480;
  }

  /* 颜色方案 —— 青釉绿 */
  body.scheme-celadon {
    --bg-0: #141814;
    --bg-1: #1e241e;
    --drum-face-0: #6b9470;
    --drum-face-1: #4a7050;
    --drum-face-2: #2d4a32;
    --drum-rim: #1a2a1c;
    --drum-body: #2e3d2a;
    --handle-0: #d4c498;
    --handle-1: #988860;
    --handle-2: #5a5030;
    --rope: #c8d8b0;
    --bead-0: #b8c8d0;
    --bead-1: #708898;
    --bead-2: #3a4a58;
    --text: #e0e8d8;
    --text-dim: rgba(224, 232, 216, 0.55);
    --accent: #a8d0b0;
    --panel-bg: rgba(20, 24, 20, 0.75);
    --panel-border: rgba(168, 208, 176, 0.25);
    --particle: #a8d0b0;
  }

  #stage {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: block;
  }

  /* 自定义光标 —— 铜钱形 */
  .cursor {
    position: fixed;
    width: 28px; height: 28px;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.18s cubic-bezier(.2,.8,.2,1),
                height 0.18s cubic-bezier(.2,.8,.2,1),
                opacity 0.2s;
    will-change: transform;
  }
  .cursor .coin-outer {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid var(--accent);
    box-shadow: 0 0 12px rgba(232, 184, 64, 0.4);
    background: radial-gradient(circle at 30% 30%, rgba(255, 220, 120, 0.15), transparent 60%);
  }
  .cursor .coin-hole {
    position: absolute;
    top: 50%; left: 50%;
    width: 8px; height: 8px;
    transform: translate(-50%, -50%);
    background: var(--bg-0);
    border: 1.5px solid var(--accent);
  }
  .cursor.hover {
    width: 36px; height: 36px;
  }
  .cursor.hover .coin-outer {
    border-width: 2.5px;
    box-shadow: 0 0 20px rgba(232, 184, 64, 0.6);
  }
  .cursor.hover .coin-hole {
    width: 10px; height: 10px;
  }
  .cursor.grab {
    width: 32px; height: 32px;
  }
  .cursor.grab .coin-outer {
    animation: coinSpin 0.6s ease-out;
  }
  .cursor.hidden { opacity: 0; }

  @keyframes coinSpin {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(180deg) scale(1.15); }
    100% { transform: rotate(360deg) scale(1); }
  }

  /* 减少动画偏好 */
  @media (prefers-reduced-motion: reduce) {
    body { cursor: default; }
    .cursor { display: none; }
    * { animation: none !important; transition: none !important; }
  }

  /* UI 面板 */
  .ui-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 100;
  }

  .title-block {
    position: absolute;
    top: 48px; left: 56px;
    pointer-events: none;
  }
  .title-block .main-title {
    font-size: 32px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 4px;
    line-height: 1.2;
  }
  .title-block .sub-title {
    font-size: 15px;
    color: var(--text-dim);
    margin-top: 6px;
    letter-spacing: 2px;
    font-weight: 300;
  }
  .title-block .divider {
    width: 40px; height: 2px;
    background: var(--accent);
    margin-top: 12px;
    opacity: 0.8;
  }

  .hint-block {
    position: absolute;
    bottom: 56px; left: 56px;
    pointer-events: none;
    max-width: 300px;
  }
  .hint-block .hint-title {
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 2px;
    margin-bottom: 8px;
    opacity: 0.9;
  }
  .hint-block .hint-text {
    font-size: 14px;
    color: var(--text-dim);
    line-height: 1.8;
    font-weight: 300;
  }

  .scheme-panel {
    position: absolute;
    top: 48px; right: 56px;
    pointer-events: auto;
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .scheme-panel .label {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-right: 4px;
  }
  .scheme-btn {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: none;
    transition: transform 0.2s, border-color 0.2s;
    position: relative;
  }
  .scheme-btn:hover { transform: scale(1.15); }
  .scheme-btn.active { border-color: var(--accent); transform: scale(1.1); }
  .scheme-btn.red { background: radial-gradient(circle at 30% 30%, #e86040, #8b1a0a); }
  .scheme-btn.ink { background: radial-gradient(circle at 30% 30%, #4a5868, #0e1420); }
  .scheme-btn.celadon { background: radial-gradient(circle at 30% 30%, #88b890, #2d4a32); }

  .stat-panel {
    position: absolute;
    bottom: 56px; right: 56px;
    pointer-events: none;
    text-align: right;
  }
  .stat-panel .stat-row {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
    margin-bottom: 6px;
  }
  .stat-panel .stat-label {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }
  .stat-panel .stat-value {
    font-size: 14px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    min-width: 40px;
  }

  .signature-flash {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 72px;
    font-weight: 900;
    color: var(--accent);
    opacity: 0;
    pointer-events: none;
    letter-spacing: 12px;
    text-shadow: 0 0 40px var(--accent), 0 0 80px var(--accent);
    z-index: 200;
  }
  .signature-flash.show {
    animation: sigFlash 0.9s cubic-bezier(.1,.8,.2,1) forwards;
  }
  @keyframes sigFlash {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); letter-spacing: 4px; }
    30% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); letter-spacing: 16px; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1); letter-spacing: 24px; }
  }

  .entry-fade {
    position: fixed;
    inset: 0;
    background: var(--bg-0);
    pointer-events: none;
    z-index: 1000;
    animation: entryFade 1.4s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes entryFade {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body class="scheme-red">
<div class="entry-fade"></div>
<canvas id="stage"></canvas>

<!-- 自定义光标 -->
<div class="cursor" id="cursor">
  <div class="coin-outer"></div>
  <div class="coin-hole"></div>
</div>

<!-- UI 层 -->
<div class="ui-overlay">
  <div class="title-block">
    <div class="main-title">拨浪鼓</div>
    <div class="sub-title">甩珠击鼓</div>
    <div class="divider"></div>
  </div>

  <div class="hint-block">
    <div class="hint-title">操 作 指 引</div>
    <div class="hint-text">
      抓住木柄或鼓身，左右甩动鼠标。<br>
      铜珠因惯性摆动，击打漆红鼓面。<br>
      快速猛甩触发双珠齐鸣。
    </div>
  </div>

  <div class="scheme-panel">
    <span class="label">配色</span>
    <button class="scheme-btn red active" data-scheme="red" title="朱砂红"></button>
    <button class="scheme-btn ink" data-scheme="ink" title="墨黑金"></button>
    <button class="scheme-btn celadon" data-scheme="celadon" title="青釉绿"></button>
  </div>

  <div class="stat-panel">
    <div class="stat-row">
      <span class="stat-label">击鼓次数</span>
      <span class="stat-value" id="hitCount">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">连击数</span>
      <span class="stat-value" id="combo">0</span>
    </div>
  </div>

  <div class="signature-flash" id="sigFlash">双 珠 齐 鸣</div>
</div>

<script>
(function() {
  'use strict';

  // ==================== 配置 ====================
  const CONFIG = {
    drum: {
      radius: 120,
      rimWidth: 14,
      bodyThickness: 30,
      handleLength: 170,
      handleWidth: 16,
      // 弹簧回中参数
      springStrength: 3.5,
      springDamping: 0.92,
      // 最大角度（弧度）
      maxAngle: Math.PI * 0.55
    },
    bead: {
      radius: 14,
      stringLength: 92,
      // 摆锤位置（在鼓面上的锚点角度，从+x轴逆时针）
      leftPivotAngle: Math.PI * 0.72,   // 129.6° ≈ 10:30 位置
      rightPivotAngle: Math.PI * 0.28,  // 50.4° ≈ 1:30 位置
      gravity: 1400,
      damping: 0.998,
      bounce: 0.62,
      impactThreshold: 120,  // 冲击力阈值（像素/秒）
      hardHitThreshold: 420
    },
    particle: {
      maxCount: 80
    }
  };

  // ==================== 状态 ====================
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const drum = {
    cx: 0, cy: 0,
    angle: 0,
    angVel: 0,
    shakeX: 0, shakeY: 0, shakeAng: 0,
    shakeVelX: 0, shakeVelY: 0, shakeVelAng: 0,
    scale: 1,
    scaleVel: 0
  };

  // 珠子（Verlet 积分）
  function createBead() {
    return {
      x: 0, y: 0,
      px: 0, py: 0,  // 上一帧位置
      vx: 0, vy: 0,
      hitFlash: 0,    // 击中闪光强度 0-1
      trail: []       // 拖尾点
    };
  }
  const leftBead = createBead();
  const rightBead = createBead();

  // 粒子
  const particles = [];
  function spawnParticle(x, y, vx, vy, life, size, type) {
    if (particles.length >= CONFIG.particle.maxCount) {
      particles.shift();
    }
    particles.push({ x, y, vx, vy, life, maxLife: life, size, type });
  }

  // 鼓面涟漪
  const ripples = [];
  function spawnRipple(angle, force) {
    ripples.push({
      angle: angle,     // 击中位置（相对于鼓心的角度，世界坐标）
      force: force,
      radius: 8,
      maxRadius: 40 + force * 0.08,
      alpha: Math.min(1, force / 200)
    });
  }

  // 鼓面凹陷
  let dentAngle = 0;     // 最近一次凹陷位置（鼓面坐标角度）
  let dentDepth = 0;     // 凹陷深度 0-1
  let dentTarget = 0;

  // 统计
  let hitCount = 0;
  let combo = 0;
  let lastHitTime = 0;
  let lastHitBead = null;

  // 交互状态
  let mouseX = 0, mouseY = 0;
  let prevMouseX = 0, prevMouseY = 0;
  let mouseVelX = 0, mouseVelY = 0;
  let isGrabbing = false;
  let grabOffsetX = 0, grabOffsetY = 0;
  let isHoveringDrum = false;
  let grabAngleOffset = 0;  // 抓取时鼠标角度与鼓角度的差

  // 签名时刻
  let sigCooldown = 0;

  // 音频
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch(e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playDrumSound(force) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const intensity = Math.min(1, force / 500);

    // 鼓身音 —— 低频
    const osc1 = audioCtx.createOscillator();
    const gain1 = audioCtx.createGain();
    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(120 + intensity * 40, now);
    osc1.frequency.exponentialRampToValueAtTime(50, now + 0.25);
    gain1.gain.setValueAtTime(0.3 + intensity * 0.4, now);
    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    osc1.connect(gain1).connect(audioCtx.destination);
    osc1.start(now);
    osc1.stop(now + 0.4);

    // 击打音 —— 高频噪声
    const noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.1, audioCtx.sampleRate);
    const noiseData = noiseBuffer.getChannelData(0);
    for (let i = 0; i < noiseData.length; i++) {
      noiseData[i] = (Math.random() * 2 - 1) * (1 - i / noiseData.length);
    }
    const noiseSrc = audioCtx.createBufferSource();
    noiseSrc.buffer = noiseBuffer;
    const noiseGain = audioCtx.createGain();
    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.value = 800 + intensity * 1200;
    noiseFilter.Q.value = 1.5;
    noiseGain.gain.setValueAtTime(0.15 + intensity * 0.35, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    noiseSrc.connect(noiseFilter).connect(noiseGain).connect(audioCtx.destination);
    noiseSrc.start(now);
    noiseSrc.stop(now + 0.15);

    // 清脆泛音（力度大时）
    if (intensity > 0.5) {
      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(280 + intensity * 100, now);
      osc2.frequency.exponentialRampToValueAtTime(140, now + 0.18);
      gain2.gain.setValueAtTime((intensity - 0.5) * 0.4, now);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc2.connect(gain2).connect(audioCtx.destination);
      osc2.start(now);
      osc2.stop(now + 0.25);
    }
  }

  // ==================== 尺寸 ====================
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    drum.cx = W * 0.5;
    drum.cy = H * 0.46;

    // 初始化珠子位置
    initBeads();
  }

  function initBeads() {
    const { radius, handleLength } = CONFIG.drum;
    const sl = CONFIG.bead.stringLength;

    // 左珠
    const lp = getPivotPos('left');
    leftBead.x = lp.x;
    leftBead.y = lp.y + sl;
    leftBead.px = leftBead.x;
    leftBead.py = leftBead.y;
    leftBead.trail = [];

    // 右珠
    const rp = getPivotPos('right');
    rightBead.x = rp.x;
    rightBead.y = rp.y + sl;
    rightBead.px = rightBead.x;
    rightBead.py = rightBead.y;
    rightBead.trail = [];
  }

  // 获取珠锚点的世界坐标
  function getPivotPos(side) {
    const baseAngle = side === 'left' ? CONFIG.bead.leftPivotAngle : CONFIG.bead.rightPivotAngle;
    const angle = baseAngle + drum.angle + drum.shakeAng;
    const r = CONFIG.drum.radius;
    return {
      x: drum.cx + drum.shakeX + Math.cos(angle) * r,
      y: drum.cy + drum.shakeY - Math.sin(angle) * r  // y向上为正，画布y向下
    };
  }

  // ==================== 交互 ====================
  function getMousePos(e) {
    if (e.touches && e.touches.length > 0) {
      return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    return { x: e.clientX, y: e.clientY };
  }

  function pointInDrum(x, y) {
    const dx = x - drum.cx;
    const dy = y - drum.cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist <= CONFIG.drum.radius + CONFIG.drum.rimWidth) return true;

    // 检查手柄区域
    const handleTop = drum.cy + CONFIG.drum.radius;
    const handleBottom = drum.cy + CONFIG.drum.radius + CONFIG.drum.handleLength;
    const handleHalfW = CONFIG.drum.handleWidth * 1.5;
    // 考虑鼓的旋转
    const handleAngle = drum.angle + drum.shakeAng;
    // 旋转手柄矩形
    const localX = dx * Math.cos(-handleAngle) + dy * Math.sin(-handleAngle);
    const localY = -dx * Math.sin(-handleAngle) + dy * Math.cos(-handleAngle);
    if (localY >= CONFIG.drum.radius - 10 &&
        localY <= CONFIG.drum.radius + CONFIG.drum.handleLength &&
        Math.abs(localX) <= handleHalfW) {
      return true;
    }
    return false;
  }

  function updateCursor(x, y) {
    const cursor = document.getElementById('cursor');
    if (reducedMotion) return;
    cursor.style.left = x + 'px';
    cursor.style.top = y + 'px';

    cursor.classList.toggle('hover', isHoveringDrum && !isGrabbing);
    cursor.classList.toggle('grab', isGrabbing);
  }

  function onMouseMove(e) {
    const pos = getMousePos(e);
    prevMouseX = mouseX;
    prevMouseY = mouseY;
    mouseX = pos.x;
    mouseY = pos.y;

    mouseVelX = mouseX - prevMouseX;
    mouseVelY = mouseY - prevMouseY;

    isHoveringDrum = pointInDrum(mouseX, mouseY);

    if (isGrabbing) {
      // 根据鼠标相对鼓心的角度计算鼓的目标角度
      const dx = mouseX - drum.cx;
      const dy = mouseY - drum.cy;
      const mouseAngle = Math.atan2(-dy, dx);  // 数学角度
      drum.angVel = (mouseAngle - grabAngleOffset - drum.angle) * 12;
      drum.angVel = Math.max(-CONFIG.drum.maxAngle * 8,
                    Math.min(CONFIG.drum.maxAngle * 8, drum.angVel));
    }

    updateCursor(mouseX, mouseY);
  }

  function onMouseDown(e) {
    const pos = getMousePos(e);
    ensureAudio();

    if (pointInDrum(pos.x, pos.y)) {
      isGrabbing = true;
      const dx = pos.x - drum.cx;
      const dy = pos.y - drum.cy;
      const mouseAngle = Math.atan2(-dy, dx);
      grabAngleOffset = mouseAngle - drum.angle;
      updateCursor(pos.x, pos.y);
      e.preventDefault();
    }
  }

  function onMouseUp(e) {
    if (isGrabbing) {
      isGrabbing = false;
      updateCursor(mouseX, mouseY);
    }
  }

  // 鼠标/触摸事件
  canvas.addEventListener('mousemove', onMouseMove);
  canvas.addEventListener('mousedown', onMouseDown);
  window.addEventListener('mouseup', onMouseUp);

  canvas.addEventListener('touchstart', function(e) {
    const pos = getMousePos(e);
    mouseX = pos.x; mouseY = pos.y;
    prevMouseX = mouseX; prevMouseY = mouseY;
    onMouseDown(e);
  }, { passive: false });
  canvas.addEventListener('touchmove', function(e) {
    onMouseMove(e);
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchend', onMouseUp);

  // 配色切换
  document.querySelectorAll('.scheme-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      const scheme = this.getAttribute('data-scheme');
      document.body.className = 'scheme-' + scheme;
      document.querySelectorAll('.scheme-btn').forEach(function(b) {
        b.classList.remove('active');
      });
      this.classList.add('active');
      ensureAudio();
    });
  });

  // ==================== 物理 ====================
  function updateBead(bead, pivot, dt) {
    const { gravity, damping, stringLength, bounce, impactThreshold, hardHitThreshold } = CONFIG.bead;

    // Verlet 积分
    let vx = (bead.x - bead.px) / dt;
    let vy = (bead.y - bead.py) / dt;
    if (!isFinite(vx)) vx = 0;
    if (!isFinite(vy)) vy = 0;

    // 重力
    vy += gravity * dt;

    // 空气阻尼
    vx *= damping;
    vy *= damping;

    bead.px = bead.x;
    bead.py = bead.y;
    bead.x += vx * dt;
    bead.y += vy * dt;

    // 丝绳约束
    const dx = bead.x - pivot.x;
    const dy = bead.y - pivot.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > stringLength) {
      const ratio = stringLength / dist;
      const targetX = pivot.x + dx * ratio;
      const targetY = pivot.y + dy * ratio;
      bead.x = targetX;
      bead.y = targetY;
      // 沿绳方向速度清零（能量损失）
      const nx = dx / dist;
      const ny = dy / dist;
      const vAlong = vx * nx + vy * ny;
      if (vAlong > 0) {
        vx -= vAlong * nx * 0.5;
        vy -= vAlong * ny * 0.5;
      }
    }

    bead.vx = vx;
    bead.vy = vy;

    // 拖尾
    bead.trail.push({ x: bead.x, y: bead.y });
    if (bead.trail.length > 8) bead.trail.shift();

    // 击中闪光衰减
    if (bead.hitFlash > 0) bead.hitFlash *= 0.88;

    // 鼓面碰撞检测
    const cx = drum.cx + drum.shakeX;
    const cy = drum.cy + drum.shakeY;
    const dx2 = bead.x - cx;
    const dy2 = bead.y - cy;
    const distToCenter = Math.sqrt(dx2 * dx2 + dy2 * dy2);
    const drumR = CONFIG.drum.radius;
    const beadR = CONFIG.bead.radius;

    if (distToCenter < drumR + beadR * 0.3 && distToCenter > 0) {
      // 计算法向速度（朝向鼓心为正）
      const nx = dx2 / distToCenter;
      const ny = dy2 / distToCenter;
      const vNormal = vx * nx + vy * ny;

      // 只有朝向鼓面运动才算击中
      if (vNormal < -30) {
        const impactForce = Math.abs(vNormal);

        // 反弹
        const vTangentX = vx - vNormal * nx;
        const vTangentY = vy - vNormal * ny;
        const newVNormal = -vNormal * bounce;
        vx = vTangentX + newVNormal * nx;
        vy = vTangentY + newVNormal * ny;

        // 将珠子推出鼓面
        const overlap = drumR + beadR * 0.3 - distToCenter;
        bead.x += nx * overlap;
        bead.y += ny * overlap;

        bead.px = bead.x - vx * dt;
        bead.py = bead.y - vy * dt;
        bead.vx = vx;
        bead.vy = vy;

        // 击中效果
        handleImpact(bead, impactForce, nx, ny);
      }
    }
  }

  function handleImpact(bead, force, nx, ny) {
    bead.hitFlash = Math.min(1, force / 300);

    // 统计
    hitCount++;
    document.getElementById('hitCount').textContent = hitCount;

    const now = performance.now();
    if (now - lastHitTime < 600 && lastHitBead !== bead) {
      combo++;
    } else if (now - lastHitTime < 400) {
      combo++;
    } else {
      combo = 1;
    }
    lastHitTime = now;
    lastHitBead = bead;
    document.getElementById('combo').textContent = combo;

    // 鼓面凹陷
    const impactAngle = Math.atan2(-ny, nx);  // 数学角度
    dentAngle = impactAngle - drum.angle - drum.shakeAng;  // 转为鼓面局部角度
    dentTarget = Math.min(1, force / 400);

    // 鼓身震动
    const shakeMag = Math.min(8, force / 80);
    drum.shakeVelX += nx * shakeMag * -0.5;
    drum.shakeVelY += ny * shakeMag * -0.5;
    drum.shakeVelAng += (Math.random() - 0.5) * shakeMag * 0.02;

    // 鼓身缩放脉冲（打击时略微膨胀）
    drum.scaleVel += Math.min(0.03, force / 15000);

    // 涟漪
    spawnRipple(impactAngle, force);

    // 粒子
    const particleCount = Math.floor(Math.min(18, 4 + force / 40));
    for (let i = 0; i < particleCount; i++) {
      const angle = impactAngle + (Math.random() - 0.5) * Math.PI * 0.8;
      const speed = 60 + Math.random() * (force * 0.3 + 80);
      const px = bead.x - nx * bead.radius;
      const py = bead.y - ny * bead.radius;
      spawnParticle(
        px, py,
        Math.cos(angle) * speed * 0.6 + (Math.random() - 0.5) * 40,
        -Math.sin(angle) * speed * 0.6 + (Math.random() - 0.5) * 40,
        0.4 + Math.random() * 0.5,
        2 + Math.random() * 3,
        force > CONFIG.bead.hardHitThreshold ? 'shard' : 'dust'
      );
    }

    // 重击额外粒子（漆片碎裂）
    if (force > CONFIG.bead.hardHitThreshold) {
      for (let i = 0; i < 8; i++) {
        const angle = impactAngle + (Math.random() - 0.5) * Math.PI * 0.6;
        const speed = 120 + Math.random() * 200;
        spawnParticle(
          bead.x - nx * bead.radius,
          bead.y - ny * bead.radius,
          Math.cos(angle) * speed + (Math.random() - 0.5) * 60,
          -Math.sin(angle) * speed - 40 - Math.random() * 60,
          0.6 + Math.random() * 0.6,
          3 + Math.random() * 4,
          'shard'
        );
      }
    }

    // 声音
    playDrumSound(force);

    // 签名时刻检测 —— 双珠同时击打（120ms 内两珠各击一次）
    checkSignatureMoment(bead, force);
  }

  let sigLeftTime = 0;
  let sigRightTime = 0;
  function checkSignatureMoment(bead, force) {
    if (sigCooldown > 0) return;
    const now = performance.now();

    if (bead === leftBead) sigLeftTime = now;
    else sigRightTime = now;

    const timeDiff = Math.abs(sigLeftTime - sigRightTime);
    if (timeDiff < 120 && sigLeftTime > 0 && sigRightTime > 0 && force > 300) {
      triggerSignatureMoment();
      sigCooldown = 1500;
      sigLeftTime = 0;
      sigRightTime = 0;
    }
  }

  function triggerSignatureMoment() {
    // 巨震
    drum.shakeVelX += (Math.random() - 0.5) * 20;
    drum.shakeVelY += (Math.random() - 0.5) * 20;
    drum.shakeVelAng += (Math.random() - 0.5) * 0.3;
    drum.scaleVel += 0.08;

    // 文字闪现
    const flash = document.getElementById('sigFlash');
    flash.classList.remove('show');
    void flash.offsetWidth;
    flash.classList.add('show');

    // 大量粒子
    for (let i = 0; i < 40; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 100 + Math.random() * 350;
      spawnParticle(
        drum.cx + drum.shakeX,
        drum.cy + drum.shakeY,
        Math.cos(angle) * speed,
        Math.sin(angle) * speed - 50,
        0.8 + Math.random() * 0.8,
        3 + Math.random() * 5,
        'shard'
      );
    }

    // 连击+10
    combo += 10;
    document.getElementById('combo').textContent = combo;
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += CONFIG.bead.gravity * 0.4 * dt;
      p.vx *= 0.98;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) {
        particles.splice(i, 1);
      }
    }
  }

  function updateRipples(dt) {
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.radius += 180 * dt;
      r.alpha *= 0.92;
      if (r.radius >= r.maxRadius || r.alpha < 0.02) {
        ripples.splice(i, 1);
      }
    }
  }

  function updatePhysics(dt) {
    const D = CONFIG.drum;

    // 非抓取状态下，鼓通过弹簧回中
    if (!isGrabbing) {
      const springForce = -drum.angle * D.springStrength;
      drum.angVel += springForce * dt;
      drum.angVel *= D.springDamping;
    }

    // 应用角速度
    drum.angle += drum.angVel * dt;
    // 限制最大角度
    if (drum.angle > D.maxAngle) {
      drum.angle = D.maxAngle;
      drum.angVel = -drum.angVel * 0.3;
    }
    if (drum.angle < -D.maxAngle) {
      drum.angle = -D.maxAngle;
      drum.angVel = -drum.angVel * 0.3;
    }

    // 鼓身震动衰减
    drum.shakeX += drum.shakeVelX * dt;
    drum.shakeY += drum.shakeVelY * dt;
    drum.shakeAng += drum.shakeVelAng * dt;
    drum.shakeVelX *= 0.88;
    drum.shakeVelY *= 0.88;
    drum.shakeVelAng *= 0.85;
    drum.shakeX *= 0.92;
    drum.shakeY *= 0.92;
    drum.shakeAng *= 0.92;

    // 鼓身缩放脉冲
    drum.scale += drum.scaleVel * dt;
    drum.scaleVel += (1 - drum.scale) * 20 * dt;
    drum.scaleVel *= 0.82;

    // 凹陷回弹
    dentDepth += (dentTarget - dentDepth) * 0.25;
    dentTarget *= 0.86;

    // 更新珠子
    const leftPivot = getPivotPos('left');
    const rightPivot = getPivotPos('right');
    updateBead(leftBead, leftPivot, dt);
    updateBead(rightBead, rightPivot, dt);

    // 粒子
    updateParticles(dt);

    // 涟漪
    updateRipples(dt);

    // 签名冷却
    if (sigCooldown > 0) sigCooldown -= dt * 1000;
  }

  // ==================== 渲染 ====================
  function getVar(name) {
    return getComputedStyle(document.body).getPropertyValue(name).trim();
  }

  function render() {
    const cx = drum.cx + drum.shakeX;
    const cy = drum.cy + drum.shakeY;
    const ang = drum.angle + drum.shakeAng;
    const scl = drum.scale;
    const R = CONFIG.drum.radius * scl;

    ctx.clearRect(0, 0, W, H);

    // 背景装饰 —— 同心圆弧线
    drawBackground();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-ang);
    ctx.scale(scl, scl);

    // 鼓身厚度（侧面）
    drawDrumBody();

    // 鼓面
    drawDrumFace();

    // 鼓面涟漪
    drawRipples();

    // 鼓边装饰
    drawDrumRim();

    // 手柄（下半部分，鼓面后）
    // 不，手柄在鼓面下方，应该在鼓身之后画... 算了，鼓是正视图

    ctx.restore();

    // 手柄（鼓下方，不受鼓旋转影响的视觉锚点，但其实要跟随）
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-ang);
    ctx.scale(scl, scl);
    drawHandle();
    ctx.restore();

    // 丝绳 + 珠子
    drawRopeAndBead(leftBead, getPivotPos('left'));
    drawRopeAndBead(rightBead, getPivotPos('right'));

    // 粒子
    drawParticles();
  }

  function drawBackground() {
    // 深色背景渐变
    const grad = ctx.createRadialGradient(
      W * 0.5, H * 0.45, 50,
      W * 0.5, H * 0.45, Math.max(W, H) * 0.7
    );
    grad.addColorStop(0, getVar('--bg-1'));
    grad.addColorStop(1, getVar('--bg-0'));
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // 微妙的装饰弧线
    const cx = drum.cx + drum.shakeX;
    const cy = drum.cy + drum.shakeY;
    ctx.strokeStyle = getVar('--accent');
    ctx.globalAlpha = 0.04;
    ctx.lineWidth = 1;
    for (let i = 1; i <= 5; i++) {
      ctx.beginPath();
      ctx.arc(cx, cy, CONFIG.drum.radius + 40 + i * 40, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawDrumBody() {
    const R = CONFIG.drum.radius;
    const thickness = CONFIG.drum.bodyThickness;

    // 鼓身侧面（下侧厚度）
    ctx.fillStyle = getVar('--drum-body');
    ctx.beginPath();
    ctx.arc(0, thickness * 0.6, R, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawDrumFace() {
    const R = CONFIG.drum.radius;

    // 鼓面底色 —— 径向渐变
    const faceGrad = ctx.createRadialGradient(-R * 0.3, -R * 0.3, R * 0.1, 0, 0, R);
    faceGrad.addColorStop(0, getVar('--drum-face-0'));
    faceGrad.addColorStop(0.5, getVar('--drum-face-1'));
    faceGrad.addColorStop(1, getVar('--drum-face-2'));

    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.fillStyle = faceGrad;
    ctx.fill();

    // 鼓面凹陷（在击中位置）
    if (dentDepth > 0.01) {
      const dentX = Math.cos(dentAngle) * R * 0.7;
      const dentY = -Math.sin(dentAngle) * R * 0.7;
      const dentR = 30 + dentDepth * 20;

      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, R, 0, Math.PI * 2);
      ctx.clip();

      const dentGrad = ctx.createRadialGradient(dentX, dentY, 2, dentX, dentY, dentR);
      dentGrad.addColorStop(0, 'rgba(0,0,0,' + (dentDepth * 0.5) + ')');
      dentGrad.addColorStop(0.6, 'rgba(0,0,0,' + (dentDepth * 0.25) + ')');
      dentGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = dentGrad;
      ctx.fillRect(dentX - dentR, dentY - dentR, dentR * 2, dentR * 2);

      ctx.restore();
    }

    // 鼓面中心装饰 —— 太极纹 / 传统纹样
    drawDrumPattern(R);
  }

  function drawDrumPattern(R) {
    // 传统纹样：中心圆环
    ctx.save();
    ctx.strokeStyle = getVar('--accent');
    ctx.globalAlpha = 0.3;
    ctx.lineWidth = 1.5;

    // 中心小圈
    ctx.beginPath();
    ctx.arc(0, 0, R * 0.15, 0, Math.PI * 2);
    ctx.stroke();

    // 中圈
    ctx.globalAlpha = 0.2;
    ctx.beginPath();
    ctx.arc(0, 0, R * 0.4, 0, Math.PI * 2);
    ctx.stroke();

    // 四向装饰短线
    ctx.globalAlpha = 0.25;
    ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const r1 = R * 0.55;
      const r2 = R * 0.7;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r1, -Math.sin(a) * r1);
      ctx.lineTo(Math.cos(a) * r2, -Math.sin(a) * r2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawRipples() {
    const R = CONFIG.drum.radius;
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.clip();

    for (let i = 0; i < ripples.length; i++) {
      const r = ripples[i];
      const rx = Math.cos(r.angle) * R * 0.8;
      const ry = -Math.sin(r.angle) * R * 0.8;

      ctx.strokeStyle = getVar('--accent');
      ctx.globalAlpha = r.alpha * 0.6;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(rx, ry, r.radius, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawDrumRim() {
    const R = CONFIG.drum.radius;
    const rimW = CONFIG.drum.rimWidth;

    // 鼓边（鼓圈）
    const rimGrad = ctx.createRadialGradient(0, 0, R - 2, 0, 0, R + rimW);
    rimGrad.addColorStop(0, getVar('--drum-rim'));
    rimGrad.addColorStop(0.5, getVar('--drum-rim'));
    rimGrad.addColorStop(1, 'rgba(0,0,0,0.3)');

    ctx.beginPath();
    ctx.arc(0, 0, R + rimW, 0, Math.PI * 2);
    ctx.arc(0, 0, R - 2, 0, Math.PI * 2, true);
    ctx.fillStyle = rimGrad;
    ctx.fill();

    // 鼓边高光
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(-R * 0.3, -R * 0.5, R + rimW * 0.4, Math.PI * 0.1, Math.PI * 0.4);
    ctx.stroke();
  }

  function drawHandle() {
    const R = CONFIG.drum.radius;
    const len = CONFIG.drum.handleLength;
    const w = CONFIG.drum.handleWidth;

    // 手柄主体
    const handleGrad = ctx.createLinearGradient(-w/2, 0, w/2, 0);
    handleGrad.addColorStop(0, getVar('--handle-2'));
    handleGrad.addColorStop(0.3, getVar('--handle-0'));
    handleGrad.addColorStop(0.7, getVar('--handle-1'));
    handleGrad.addColorStop(1, getVar('--handle-2'));

    ctx.fillStyle = handleGrad;
    ctx.beginPath();
    // 从鼓底开始
    ctx.moveTo(-w/2, R - 5);
    ctx.lineTo(-w/2 + 1, R + len - 8);
    // 底部圆弧
    ctx.quadraticCurveTo(0, R + len + 4, w/2 - 1, R + len - 8);
    ctx.lineTo(w/2, R - 5);
    // 顶部圆弧（与鼓连接处）
    ctx.quadraticCurveTo(0, R - 10, -w/2, R - 5);
    ctx.fill();

    // 手柄木纹
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
      const xOff = -w/2 + 3 + i * 4;
      ctx.beginPath();
      ctx.moveTo(xOff, R + 10);
      ctx.quadraticCurveTo(xOff + 1, R + len * 0.5, xOff + 0.5, R + len - 10);
      ctx.stroke();
    }

    // 手柄底部装饰环
    ctx.fillStyle = getVar('--accent');
    ctx.globalAlpha = 0.6;
    ctx.fillRect(-w/2 - 1, R + len * 0.35, w + 2, 3);
    ctx.fillRect(-w/2 - 1, R + len * 0.6, w + 2, 3);
    ctx.globalAlpha = 1;
  }

  function drawRopeAndBead(bead, pivot) {
    const br = CONFIG.bead.radius;

    // 拖尾（高速时）
    if (bead.trail.length >= 3) {
      const speed = Math.sqrt(bead.vx * bead.vx + bead.vy * bead.vy);
      if (speed > 200) {
        ctx.save();
        ctx.strokeStyle = getVar('--bead-0');
        ctx.lineCap = 'round';
        for (let i = 1; i < bead.trail.length; i++) {
          const alpha = (i / bead.trail.length) * 0.3 * (speed / 500);
          ctx.globalAlpha = alpha;
          ctx.lineWidth = br * (i / bead.trail.length) * 0.8;
          ctx.beginPath();
          ctx.moveTo(bead.trail[i - 1].x, bead.trail[i - 1].y);
          ctx.lineTo(bead.trail[i].x, bead.trail[i].y);
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    // 丝绳
    const ropeColor = getVar('--rope');
    // 丝绳曲线（考虑重力下垂）
    const midX = (pivot.x + bead.x) * 0.5;
    const midY = (pivot.y + bead.y) * 0.5 + 4;  // 轻微下垂
    ctx.strokeStyle = ropeColor;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(pivot.x, pivot.y);
    ctx.quadraticCurveTo(midX, midY, bead.x, bead.y);
    ctx.stroke();

    // 丝绳高光
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(pivot.x - 0.5, pivot.y - 0.5);
    ctx.quadraticCurveTo(midX - 0.5, midY - 0.5, bead.x - 0.5, bead.y - 0.5);
    ctx.stroke();

    // 铜珠
    const beadGrad = ctx.createRadialGradient(
      bead.x - br * 0.35, bead.y - br * 0.35, br * 0.1,
      bead.x, bead.y, br
    );
    beadGrad.addColorStop(0, getVar('--bead-0'));
    beadGrad.addColorStop(0.5, getVar('--bead-1'));
    beadGrad.addColorStop(1, getVar('--bead-2'));

    ctx.fillStyle = beadGrad;
    ctx.beginPath();
    ctx.arc(bead.x, bead.y, br, 0, Math.PI * 2);
    ctx.fill();

    // 铜珠高光
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath();
    ctx.arc(bead.x - br * 0.35, bead.y - br * 0.35, br * 0.28, 0, Math.PI * 2);
    ctx.fill();

    // 击中闪光
    if (bead.hitFlash > 0.01) {
      ctx.save();
      ctx.globalAlpha = bead.hitFlash;
      ctx.fillStyle = getVar('--particle');
      ctx.beginPath();
      ctx.arc(bead.x, bead.y, br * 1.6, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalAlpha = bead.hitFlash * 0.6;
      ctx.beginPath();
      ctx.arc(bead.x, bead.y, br * 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawParticles() {
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const alpha = Math.min(1, p.life / p.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;

      if (p.type === 'shard') {
        // 漆片碎片
        ctx.fillStyle = getVar('--particle');
        ctx.translate(p.x, p.y);
        ctx.rotate(p.life * 8);
        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.6);
      } else {
        // 灰尘/粉末
        ctx.fillStyle = getVar('--particle');
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  // ==================== 循环 ====================
  let rafId = null;
  let lastTime = 0;

  function loop(t) {
    if (!lastTime) { lastTime = t; rafId = requestAnimationFrame(loop); return; }
    let dt = (t - lastTime) / 1000;
    lastTime = t;
    if (dt > 0.033) dt = 0.033;  // 限制最大步长
    if (dt <= 0) { rafId = requestAnimationFrame(loop); return; }

    updatePhysics(dt);
    render();

    rafId = requestAnimationFrame(loop);
  }

  // 可见性暂停
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    } else {
      if (!rafId) {
        lastTime = 0;
        rafId = requestAnimationFrame(loop);
      }
    }
  });

  // 卸载清理
  window.addEventListener('beforeunload', function() {
    if (rafId) cancelAnimationFrame(rafId);
    if (audioCtx) audioCtx.close();
  });

  // ==================== 初始化 ====================
  function init() {
    resize();

    // 光标初始居中
    if (!reducedMotion) {
      updateCursor(W / 2, H / 2);
      mouseX = W / 2;
      mouseY = H / 2;
      prevMouseX = mouseX;
      prevMouseY = mouseY;
    } else {
      document.body.style.cursor = 'default';
    }

    window.addEventListener('resize', resize);

    rafId = requestAnimationFrame(loop);
  }

  init();
})();
</script>
</body>
</html>

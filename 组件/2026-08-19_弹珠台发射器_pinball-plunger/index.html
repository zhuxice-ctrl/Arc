<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弹珠台发射器</title>
<meta name="creative-medium" content="interactive-prototype">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", system-ui, sans-serif;
    background-color: #2D1810;
    color: #F0E6D2;
    user-select: none;
    -webkit-user-select: none;
    cursor: none;
    position: relative;
  }

  /* 木纹背景 */
  .bg-wood {
    position: fixed;
    inset: 0;
    background-color: #2D1810;
    background-image:
      repeating-linear-gradient(
        90deg,
        rgba(139, 90, 43, 0.09) 0px,
        rgba(139, 90, 43, 0.09) 1px,
        transparent 1px,
        transparent 11px
      ),
      repeating-linear-gradient(
        90deg,
        rgba(80, 40, 20, 0.13) 0px,
        rgba(80, 40, 20, 0.13) 2px,
        transparent 2px,
        transparent 26px
      ),
      repeating-linear-gradient(
        90deg,
        rgba(200, 150, 80, 0.04) 0px,
        rgba(200, 150, 80, 0.04) 1px,
        transparent 1px,
        transparent 60px
      ),
      radial-gradient(
        ellipse at 28% 18%,
        rgba(180, 120, 60, 0.14) 0%,
        transparent 60%
      );
    z-index: 0;
  }
  .bg-wood::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(
      ellipse at 80% 85%,
      rgba(20, 8, 4, 0.4) 0%,
      transparent 55%
    );
  }
  .bg-wood::after {
    content: '';
    position: absolute;
    inset: 0;
    animation: woodBreathe 9s ease-in-out infinite;
    background: radial-gradient(
      ellipse at 30% 20%,
      rgba(255, 200, 140, 0.05) 0%,
      transparent 50%
    );
  }
  @keyframes woodBreathe {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* 暖光效果 */
  .bg-light {
    position: fixed;
    inset: 0;
    background: radial-gradient(
      ellipse at 22% 12%,
      rgba(255, 210, 150, 0.18) 0%,
      transparent 45%
    );
    pointer-events: none;
    z-index: 1;
  }

  /* 场景容器 */
  .scene {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .header {
    position: absolute;
    top: 32px;
    text-align: center;
    pointer-events: none;
  }
  .header h1 {
    font-size: 26px;
    font-weight: 600;
    color: #E8D5B0;
    letter-spacing: 5px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
  }
  .header p {
    font-size: 13px;
    color: #A89276;
    margin-top: 8px;
    letter-spacing: 3px;
  }

  .footer-tip {
    position: absolute;
    bottom: 32px;
    text-align: center;
    font-size: 13px;
    color: #A89276;
    letter-spacing: 4px;
    pointer-events: none;
  }

  /* 发射舞台 */
  .plunger-stage {
    position: relative;
    width: 240px;
    height: 820px;
  }

  /* 发射轨道 */
  .track {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 64px;
    height: 500px;
    background: linear-gradient(
      180deg,
      #120704 0%,
      #220f08 50%,
      #120704 100%
    );
    border: 3px solid #C19A3B;
    border-radius: 32px 32px 6px 6px;
    box-shadow:
      inset 0 4px 16px rgba(0,0,0,0.9),
      inset 2px 0 5px rgba(193, 154, 59, 0.22),
      inset -2px 0 4px rgba(0, 0, 0, 0.6),
      0 4px 24px rgba(0,0,0,0.55);
    overflow: hidden;
    z-index: 5;
  }

  /* 轨道内壁高光 */
  .track::before {
    content: '';
    position: absolute;
    top: 0;
    left: 4px;
    width: 3px;
    height: 100%;
    background: linear-gradient(
      180deg,
      rgba(255, 220, 160, 0.42) 0%,
      rgba(193, 154, 59, 0.06) 100%
    );
    border-radius: 2px;
  }
  .track::after {
    content: '';
    position: absolute;
    top: 0;
    right: 5px;
    width: 2px;
    height: 100%;
    background: linear-gradient(
      180deg,
      rgba(255, 220, 160, 0.1) 0%,
      transparent 100%
    );
    border-radius: 1px;
  }

  /* 轨道顶部弧形 */
  .track-top-arc {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 74px;
    height: 42px;
    border: 3px solid #C19A3B;
    border-bottom: none;
    border-radius: 37px 37px 0 0;
    background: linear-gradient(
      180deg,
      rgba(45, 24, 16, 0.4) 0%,
      #1a0d07 100%
    );
    z-index: 6;
    box-shadow:
      inset 0 3px 6px rgba(193, 154, 59, 0.18),
      0 -2px 6px rgba(0,0,0,0.3);
  }
  .track-top-arc::after {
    content: '';
    position: absolute;
    bottom: -3px;
    left: -3px;
    right: -3px;
    height: 6px;
    background: #1a0d07;
    opacity: 0.8;
  }

  /* 弹珠 */
  .ball {
    position: absolute;
    left: 50%;
    bottom: 30px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: radial-gradient(
      circle at 35% 28%,
      #FF9999 0%,
      #E81C3A 25%,
      #C8102E 45%,
      #8B0000 75%,
      #4A0000 100%
    );
    box-shadow:
      inset -3px -4px 10px rgba(0,0,0,0.55),
      0 2px 10px rgba(0,0,0,0.5);
    transform: translateX(-50%);
    z-index: 7;
    will-change: bottom, opacity;
  }
  .ball-highlight {
    position: absolute;
    top: 5px;
    left: 7px;
    width: 9px;
    height: 7px;
    background: rgba(255, 255, 255, 0.88);
    border-radius: 50%;
    filter: blur(0.3px);
  }
  .ball-highlight-small {
    position: absolute;
    top: 10px;
    left: 14px;
    width: 3px;
    height: 2px;
    background: rgba(255, 255, 255, 0.55);
    border-radius: 50%;
  }
  .ball-shadow {
    position: absolute;
    bottom: -3px;
    left: 50%;
    transform: translateX(-50%);
    width: 22px;
    height: 4px;
    background: rgba(0, 0, 0, 0.4);
    border-radius: 50%;
    filter: blur(2px);
  }

  /* 柱塞头（在轨道底部的推头） */
  .plunger-tip {
    position: absolute;
    left: 50%;
    bottom: 12px;
    width: 28px;
    height: 18px;
    transform: translateX(-50%);
    background: linear-gradient(
      180deg,
      #4A4A4A 0%,
      #2A2A2A 40%,
      #1A1A1A 100%
    );
    border-radius: 4px 4px 2px 2px;
    z-index: 6;
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.2),
      0 1px 3px rgba(0,0,0,0.5);
  }
  .plunger-tip::before {
    content: '';
    position: absolute;
    top: -3px;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 4px;
    background: linear-gradient(
      180deg,
      #6A6A6A 0%,
      #3A3A3A 100%
    );
    border-radius: 2px;
  }

  /* 柱塞旋钮（抓取的部分） */
  .plunger-knob {
    position: absolute;
    left: 50%;
    top: 560px;
    width: 56px;
    height: 40px;
    transform: translateX(-50%);
    background: linear-gradient(
      180deg,
      #ECD080 0%,
      #C19A3B 28%,
      #A88330 55%,
      #7A5E24 100%
    );
    border-radius: 6px 6px 5px 5px;
    box-shadow:
      inset 0 1px 2px rgba(255, 240, 200, 0.5),
      inset 0 -2px 4px rgba(0, 0, 0, 0.3),
      0 2px 8px rgba(0, 0, 0, 0.55);
    z-index: 10;
    cursor: none;
    will-change: top, transform;
  }
  .plunger-knob::before {
    /* 顶部法兰盘 */
    content: '';
    position: absolute;
    top: -5px;
    left: 50%;
    transform: translateX(-50%);
    width: 62px;
    height: 6px;
    background: linear-gradient(
      180deg,
      #E8C97A 0%,
      #C19A3B 50%,
      #9C7A2E 100%
    );
    border-radius: 3px;
    box-shadow:
      inset 0 1px 1px rgba(255, 240, 200, 0.5),
      0 1px 3px rgba(0, 0, 0, 0.4);
  }
  .plunger-knob::after {
    /* 中部装饰线 */
    content: '';
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 44px;
    height: 2px;
    background: rgba(255, 240, 200, 0.26);
    border-radius: 1px;
  }

  /* 柱塞杆（连接推头和旋钮） */
  .plunger-rod {
    position: absolute;
    left: 50%;
    width: 18px;
    transform: translateX(-50%);
    background: linear-gradient(
      90deg,
      #181818 0%,
      #383838 25%,
      #525252 45%,
      #404040 60%,
      #282828 80%,
      #121212 100%
    );
    border-radius: 0;
    z-index: 8;
    top: 518px;
    height: 42px;
    will-change: top, height;
  }
  .plunger-rod::before {
    content: '';
    position: absolute;
    top: 0;
    left: 2px;
    width: 2px;
    height: 100%;
    background: linear-gradient(
      180deg,
      rgba(255,255,255,0.18) 0%,
      rgba(255,255,255,0.04) 100%
    );
  }

  /* 轨道底部基座（弹簧顶部的固定环） */
  .track-base-ring {
    position: absolute;
    left: 50%;
    top: 500px;
    transform: translateX(-50%);
    width: 70px;
    height: 18px;
    background: linear-gradient(
      180deg,
      #3D2915 0%,
      #2A1B0D 50%,
      #1A0F05 100%
    );
    border-radius: 4px 4px 2px 2px;
    box-shadow:
      inset 0 1px 2px rgba(255, 200, 150, 0.15),
      0 2px 8px rgba(0,0,0,0.5);
    z-index: 7;
  }
  .track-base-ring::before {
    content: '';
    position: absolute;
    top: 5px;
    left: 50%;
    transform: translateX(-50%);
    width: 22px;
    height: 4px;
    background: #0a0a0a;
    border-radius: 2px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.9);
  }
  .track-base-ring::after {
    content: '';
    position: absolute;
    top: 0;
    left: 8px;
    right: 8px;
    height: 2px;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(193, 154, 59, 0.3) 50%,
      transparent 100%
    );
  }

  /* 弹簧（底部锚定在底座上，顶部顶在旋钮底部） */
  .spring-wrap {
    position: absolute;
    left: 50%;
    bottom: 18px;
    width: 42px;
    transform: translateX(-50%);
    z-index: 9;
    pointer-events: none;
  }
  .spring-svg {
    width: 42px;
    display: block;
    overflow: visible;
  }

  /* 弹簧底座 */
  .spring-base {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 88px;
    height: 18px;
    background: linear-gradient(
      180deg,
      #5A4632 0%,
      #3A2A1E 50%,
      #20130a 100%
    );
    border-radius: 4px 4px 2px 2px;
    box-shadow:
      inset 0 1px 2px rgba(255, 200, 150, 0.18),
      0 2px 10px rgba(0,0,0,0.6);
    z-index: 7;
  }
  .spring-base::before {
    content: '';
    position: absolute;
    top: 3px;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 3px;
    background: #111;
    border-radius: 1px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.9);
  }

  /* 力度刻度 */
  .force-scale {
    position: absolute;
    right: 14px;
    top: 10px;
    height: 500px;
    width: 62px;
    pointer-events: none;
  }
  .force-scale-label {
    position: absolute;
    top: 0;
    left: 0;
    font-size: 11px;
    color: #C19A3B;
    letter-spacing: 2px;
  }
  .force-value {
    position: absolute;
    top: 18px;
    left: 0;
    font-size: 22px;
    font-weight: 700;
    color: #E8C97A;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 12px rgba(193, 154, 59, 0.5);
    line-height: 1;
  }
  .force-unit {
    font-size: 12px;
    font-weight: 400;
    color: #A89276;
    margin-left: 2px;
  }
  .full-power-tip {
    position: absolute;
    top: 46px;
    left: 0;
    font-size: 11px;
    color: #FF6B6B;
    letter-spacing: 2px;
    opacity: 0;
    transition: opacity 0.15s ease;
    text-shadow: 0 0 8px rgba(255, 107, 107, 0.6);
  }
  .full-power-tip.show { opacity: 1; }

  .tick {
    position: absolute;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    color: #6B5638;
    font-size: 10px;
    transition: color 0.15s ease;
  }
  .tick-line {
    width: 12px;
    height: 1px;
    background: #5a4528;
    transition: all 0.15s ease;
    flex-shrink: 0;
  }
  .tick.major .tick-line {
    width: 18px;
    height: 2px;
  }
  .tick.active { color: #C19A3B; }
  .tick.active .tick-line {
    background: #C19A3B;
    box-shadow: 0 0 4px rgba(193, 154, 59, 0.6);
  }
  .tick.major.active {
    color: #E8C97A;
    font-weight: 600;
  }
  .tick.major.active .tick-line {
    background: #E8C97A;
    box-shadow: 0 0 6px rgba(232, 201, 122, 0.8);
  }

  /* 预接触状态 */
  .plunger-knob.pre-contact {
    box-shadow:
      inset 0 1px 2px rgba(255, 240, 200, 0.6),
      inset 0 -2px 4px rgba(0, 0, 0, 0.3),
      0 2px 8px rgba(0, 0, 0, 0.55),
      0 0 16px rgba(255, 220, 150, 0.5);
  }

  /* 阈值状态（满力警告） */
  .plunger-knob.threshold {
    background: linear-gradient(
      180deg,
      #FF9F55 0%,
      #E86525 28%,
      #B04515 55%,
      #7A2E0A 100%
    );
  }
  .plunger-knob.threshold::before {
    background: linear-gradient(
      180deg,
      #FFB070 0%,
      #E57030 50%,
      #B04818 100%
    );
  }

  /* 自定义光标 */
  .custom-cursor {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 24px;
    height: 24px;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .cursor-ring {
    position: absolute;
    top: 0;
    left: 0;
    width: 24px;
    height: 24px;
    border: 2px solid #FFFFFF;
    border-radius: 50%;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.55),
      0 0 6px rgba(255,255,255,0.25);
    box-sizing: border-box;
  }
  .cursor-cross-h {
    position: absolute;
    top: 50%;
    left: 3px;
    right: 3px;
    height: 2px;
    background: #FFFFFF;
    transform: translateY(-50%);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4);
  }
  .cursor-cross-v {
    position: absolute;
    left: 50%;
    top: 3px;
    bottom: 3px;
    width: 2px;
    background: #FFFFFF;
    transform: translateX(-50%);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4);
  }
  .custom-cursor.grab {
    transform: translate(-50%, -50%) scale(1.15);
  }
  .custom-cursor.grab .cursor-ring {
    border-color: #E8C97A;
  }
  .custom-cursor.grab .cursor-cross-h,
  .custom-cursor.grab .cursor-cross-v {
    background: #E8C97A;
  }
  .custom-cursor.grabbing {
    transform: translate(-50%, -50%) scale(0.82);
  }
  .custom-cursor.grabbing .cursor-ring {
    border-color: #FF6B6B;
    border-width: 3px;
  }
  .custom-cursor.grabbing .cursor-cross-h,
  .custom-cursor.grabbing .cursor-cross-v {
    background: #FF6B6B;
  }

  /* 减少动效模式 */
  @media (prefers-reduced-motion: reduce) {
    body { cursor: auto; }
    .custom-cursor { display: none; }
    .bg-wood::after { animation: none; }
  }
</style>
</head>
<body>

<div class="bg-wood"></div>
<div class="bg-light"></div>

<div class="scene">
  <div class="header">
    <h1>弹珠台发射器</h1>
    <p>拖拽下拉压缩弹簧，释放发射弹珠</p>
  </div>

  <div class="plunger-stage" id="stage">
    <div class="track-top-arc"></div>

    <div class="track">
      <div class="ball" id="ball">
        <div class="ball-shadow"></div>
        <div class="ball-highlight"></div>
        <div class="ball-highlight-small"></div>
      </div>
      <div class="plunger-tip" id="plungerTip"></div>
    </div>

    <!-- 轨道底部基座 -->
    <div class="track-base-ring"></div>

    <!-- 柱塞杆（连接推头和旋钮） -->
    <div class="plunger-rod" id="plungerRod"></div>

    <!-- 柱塞旋钮 -->
    <div class="plunger-knob" id="plungerKnob"></div>

    <!-- 弹簧（底部锚定到弹簧底座） -->
    <div class="spring-wrap" id="springWrap">
      <svg class="spring-svg" id="springSvg" viewBox="0 0 42 204" preserveAspectRatio="xMidYMax meet">
        <defs>
          <linearGradient id="springGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#3A3A3A"/>
            <stop offset="30%" stop-color="#8A8A8A"/>
            <stop offset="50%" stop-color="#B8B8B8"/>
            <stop offset="70%" stop-color="#7A7A7A"/>
            <stop offset="100%" stop-color="#2A2A2A"/>
          </linearGradient>
        </defs>
        <path id="springPath" d="" fill="none" stroke="url(#springGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- 弹簧底座 -->
    <div class="spring-base"></div>

    <!-- 力度刻度 -->
    <div class="force-scale" id="forceScale">
      <div class="force-scale-label">力度</div>
      <div class="force-value" id="forceValue">0<span class="force-unit">%</span></div>
      <div class="full-power-tip" id="fullPowerTip">满力</div>
    </div>
  </div>

  <div class="footer-tip">拖拽下拉 · 释放发射</div>
</div>

<!-- 自定义光标 -->
<div class="custom-cursor" id="customCursor">
  <div class="cursor-ring"></div>
  <div class="cursor-cross-h"></div>
  <div class="cursor-cross-v"></div>
</div>

<script>
(function() {
  'use strict';

  // ===== 配置 =====
  // 所有几何坐标基于 plunger-stage 内部坐标系（从上到下）
  var CFG = {
    stageHeight: 820,
    trackTop: 0,
    trackHeight: 500,
    trackBottom: 500,
    ballRestBottom: 30,     // 弹珠距轨道底部的距离
    tipRestBottom: 12,        // 推头底部距轨道底部（静止时）
    knobRestTop: 560,       // 旋钮静止时的 top
    knobHeight: 40,
    rodTopRest: 518,        // 杆静止时的 top（轨道基座下方）
    springBaseOffset: 18,   // 弹簧底座距 stage 底部
    maxCompression: 140,    // 最大压缩量 px（旋钮下移距离）
    springCoils: 8,
    springWidth: 36,
    // 物理
    hardThreshold: 0.70,
    hardFactor: 1.8,
    dampingRatio: 0.46,
    naturalFreq: 13.5,
    totalOscillationMs: 800,
    ballAccelMs: 110,
    gravity: 0.0072,        // px / ms^2
    // 交互
    preContactRadius: 46,
    thresholdVibrateAmp: 1.0,
    thresholdVibrateHz: 32,
  };

  // 减少动效检测
  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ===== DOM =====
  var $stage = document.getElementById('stage');
  var $knob = document.getElementById('plungerKnob');
  var $rod = document.getElementById('plungerRod');
  var $tip = document.getElementById('plungerTip');
  var $springWrap = document.getElementById('springWrap');
  var $springSvg = document.getElementById('springSvg');
  var $springPath = document.getElementById('springPath');
  var $ball = document.getElementById('ball');
  var $ballHl = $ball.querySelector('.ball-highlight');
  var $ballHl2 = $ball.querySelector('.ball-highlight-small');
  var $forceVal = document.getElementById('forceValue');
  var $forceNum = $forceVal.firstChild;
  var $fullTip = document.getElementById('fullPowerTip');
  var $cursor = document.getElementById('customCursor');
  var $scale = document.getElementById('forceScale');

  // ===== 状态 =====
  var S = {
    dragging: false,
    dragStartY: 0,          // 鼠标起始位置（clientY）
    knobStartY: 0,          // 旋钮起始 top
    compression: 0,         // 当前压缩量 px（0 = 静止，正数 = 向下压缩）
    releasing: false,
    releaseStart: 0,
    releaseAmp: 0,
    lastTime: 0,
    rafId: null,
    paused: false,
    thresholdOn: false,
    vibratePhase: 0,
    // 弹珠
    ballActive: false,
    ballY: 0,               // 距初始位置的高度 px（向上为正）
    ballVY: 0,              // 速度 px/ms（向上为正）
    ballInitialVY: 0,
    ballAccelPhase: false,
    ballAccelStart: 0,
    ballFading: false,
    ballFadeStart: 0,
    ballTopPause: 0,
  };

  // ===== 衍生几何 =====
  // 弹簧底部 y = stageHeight - springBaseOffset
  // 弹簧顶部 y = knobRestTop + knobHeight = 600
  // 弹簧静止高度 = 820 - 18 - 600 = 202
  var springRestTop = CFG.knobRestTop + CFG.knobHeight;   // 600
  var springBottomY = CFG.stageHeight - CFG.springBaseOffset; // 802
  var springRestHeight = springBottomY - springRestTop;   // 202
  // 弹珠最大飞行高度由发射位置和目标位置动态计算
  // 柱塞推头在轨道中的位置


  // ===== 刻度构建 =====
  function buildTicks() {
    var scaleH = CFG.trackHeight - 80; // 刻度区域高度
    var scaleTop = 70;
    var frag = document.createDocumentFragment();
    for (var i = 0; i <= 10; i++) {
      var pct = i * 10;
      var major = (pct % 20 === 0);
      var tick = document.createElement('div');
      tick.className = 'tick' + (major ? ' major' : '');
      // 100% 在顶部，0% 在底部
      var y = scaleTop + (1 - pct / 100) * (scaleH - 20);
      tick.style.top = y + 'px';
      tick.dataset.pct = pct;
      var line = document.createElement('div');
      line.className = 'tick-line';
      tick.appendChild(line);
      if (major) {
        var label = document.createElement('span');
        label.textContent = pct;
        tick.insertBefore(label, line);
      }
      frag.appendChild(tick);
    }
    $scale.appendChild(frag);
  }

  // ===== 弹簧 SVG 路径（侧视锯齿） =====
  function buildSpringPath(height) {
    var halfW = CFG.springWidth / 2;
    var cx = 21; // SVG 中心 x
    var segs = CFG.springCoils * 2;
    var topPad = height * 0.04;
    var botPad = height * 0.04;
    var bodyH = height - topPad - botPad;

    var d = 'M ' + cx + ' 0';
    // 顶部小过渡段：从中心向右下方
    d += ' L ' + (cx + halfW * 0.3).toFixed(2) + ' ' + topPad.toFixed(2);
    // 锯齿主体
    for (var i = 0; i < segs; i++) {
      var rightSide = (i % 2 === 0);
      var x = rightSide ? (cx + halfW) : (cx - halfW);
      var y = topPad + (i + 1) * bodyH / segs;
      d += ' L ' + x.toFixed(2) + ' ' + y.toFixed(2);
    }
    // 底部过渡到中心
    d += ' L ' + cx + ' ' + height.toFixed(2);
    return d;
  }

  function setSpringHeight(height) {
    var h = Math.max(8, height);
    var d = buildSpringPath(h);
    $springPath.setAttribute('d', d);
    $springSvg.setAttribute('viewBox', '0 0 42 ' + h);
    $springSvg.style.height = h + 'px';
  }

  // ===== 更新整个柱塞系统位置 =====
  // compression: 压缩量 px（0 = 静止，正 = 向下压缩）
  function setCompression(c) {
    S.compression = c;

    // 旋钮位置
    var knobTop = CFG.knobRestTop + c;
    $knob.style.top = knobTop + 'px';

    // 杆的位置：杆连接轨道底部基座和旋钮
    // 杆的 top = 轨道基座下方
    var rodTop = CFG.rodTopRest + c;
    var rodBot = knobTop; // 杆底部 = 旋钮顶部
    var rodH = rodBot - rodTop;
    if (rodH < 0) rodH = 0;
    $rod.style.top = rodTop + 'px';
    $rod.style.height = rodH + 'px';

    // 推头位置：压缩时向下收回，弹珠随推头一起下降
    var tipBottom = CFG.tipRestBottom - c;
    $tip.style.bottom = tipBottom + 'px';
    // 弹珠在推头上，一起移动（直到发射）
    if (!S.ballActive) {
      var ballBottom = CFG.tipRestBottom + 18 - c; // tip top = tipBottom + 18
      $ball.style.bottom = ballBottom + 'px';
    }

    // 弹簧：顶部 = 旋钮底部，底部 = 固定底座
    var springTopY = knobTop + CFG.knobHeight;
    var springH = springBottomY - springTopY;
    if (springH < 8) springH = 8;
    setSpringHeight(springH);

    // 刻度更新
    updateScale(c);
  }

  function setCompressionWithVibe(c, vibe) {
    // vibe: 振动偏移 px（正 = 向下，负 = 向上）
    S.compression = c;

    var knobTop = CFG.knobRestTop + c + vibe;
    $knob.style.top = knobTop + 'px';

    var rodTop = CFG.rodTopRest + c + vibe;
    var rodBot = knobTop;
    var rodH = rodBot - rodTop;
    if (rodH < 0) rodH = 0;
    $rod.style.top = rodTop + 'px';
    $rod.style.height = rodH + 'px';

    var tipBottom = CFG.tipRestBottom - c - vibe;
    $tip.style.bottom = tipBottom + 'px';
    if (!S.ballActive) {
      var ballBottom = CFG.tipRestBottom + 18 - c - vibe;
      $ball.style.bottom = ballBottom + 'px';
    }

    var springTopY = knobTop + CFG.knobHeight;
    var springH = springBottomY - springTopY;
    if (springH < 8) springH = 8;
    setSpringHeight(springH);

    updateScale(c);
  }

  // ===== 刻度更新 =====
  function updateScale(c) {
    var pct = Math.max(0, Math.min(100, Math.round(c / CFG.maxCompression * 100)));
    $forceNum.nodeValue = pct;

    var ticks = $scale.querySelectorAll('.tick');
    for (var i = 0; i < ticks.length; i++) {
      var t = ticks[i];
      var p = parseInt(t.dataset.pct, 10);
      if (p <= pct) t.classList.add('active');
      else t.classList.remove('active');
    }

    var over = pct >= 80;
    if (over !== S.thresholdOn) {
      S.thresholdOn = over;
      if (over) {
        $knob.classList.add('threshold');
        $fullTip.classList.add('show');
      } else {
        $knob.classList.remove('threshold');
        $fullTip.classList.remove('show');
      }
    }
  }

  // ===== 弹珠位置 =====
  function setBallY(y) {
    $ball.style.bottom = (S.ballLaunchBottom + y) + 'px';
  }

  function updateBallHighlight(y, maxY) {
    var ratio = Math.max(0, Math.min(1, y / maxY));
    // 光源固定左上，弹珠升高时高光相对位置微调
    var hlL = 7 - ratio * 2.5;
    var hlT = 5 - ratio * 1.5;
    $ballHl.style.left = hlL + 'px';
    $ballHl.style.top = hlT + 'px';
    $ballHl2.style.left = (14 - ratio * 1.5) + 'px';
    $ballHl2.style.top = (10 - ratio) + 'px';
  }

  // ===== 发射弹珠 =====
  function launchBall(compression) {
    if (S.ballActive) return;
    var ratio = Math.min(1, compression / CFG.maxCompression);
    // 最大速度：使弹珠飞到接近轨道顶部（95%高度）
    // 运动学公式 v0 = sqrt(2 * g * h)
    // h = 从发射位置到目标高度的距离
    // 发射位置：ball bottom = tipRestBottom + 18 - compression
    // 目标位置：ball bottom = trackHeight - 30（顶部附近）
    var launchBottom = CFG.tipRestBottom + 18 - compression;
    var targetBottom = CFG.trackHeight - 30;
    var maxTravel = targetBottom - launchBottom; // 最大可飞距离
    var maxV = Math.sqrt(2 * CFG.gravity * maxTravel * 0.97);
    var v0 = maxV * ratio;

    S.ballActive = true;
    S.ballY = 0; // 相对发射位置的高度
    S.ballLaunchBottom = launchBottom; // 记录发射时的 bottom 值
    S.ballVY = v0 * 0.45;
    S.ballInitialVY = v0;
    S.ballMaxTravel = maxTravel;
    S.ballAccelPhase = true;
    S.ballAccelStart = performance.now();
    S.ballFading = false;
    $ball.style.opacity = '1';
    $ball.style.bottom = launchBottom + 'px';
  }

  // ===== 主循环 =====
  function loop(ts) {
    if (!S.lastTime) S.lastTime = ts;
    var dt = Math.min(48, ts - S.lastTime);
    S.lastTime = ts;

    if (!S.paused) {
      // 释放回弹
      if (S.releasing) {
        var elapsed = ts - S.releaseStart;
        var tSec = elapsed / 1000;
        var zeta = CFG.dampingRatio;
        var wn = CFG.naturalFreq;
        var wd = wn * Math.sqrt(1 - zeta * zeta);
        var decay = Math.exp(-zeta * wn * tSec);
        var disp = S.releaseAmp * decay * Math.cos(wd * tSec);

        // disp: 弹簧相对平衡位置的位移
        // 正 = 向下（仍在压缩），负 = 向上过冲
        var c = disp;

        // 限制过冲
        var overshootLimit = -35;
        if (c < overshootLimit) c = overshootLimit;

        S.compression = c;

        // 阈值振动（回弹中经过 80%+ 区域时）
        var vib = 0;
        if (c > CFG.maxCompression * 0.8 && !reducedMotion) {
          S.vibratePhase += dt * CFG.thresholdVibrateHz / 1000 * Math.PI * 2;
          vib = Math.sin(S.vibratePhase) * CFG.thresholdVibrateAmp;
        }

        if (c >= 0) {
          setCompressionWithVibe(c, vib);
        } else {
          // 过冲：压缩量为0，整体向上偏移 c（负值）
          setCompressionWithVibe(0, c);
        }

        // 结束判定
        if (elapsed > CFG.totalOscillationMs && Math.abs(disp) < 0.6) {
          S.releasing = false;
          S.compression = 0;
          setCompression(0);
        }
      }

      // 拖拽时的阈值振动
      if (S.dragging && S.compression > CFG.maxCompression * 0.8 && !reducedMotion) {
        S.vibratePhase += dt * CFG.thresholdVibrateHz / 1000 * Math.PI * 2;
        var v = Math.sin(S.vibratePhase) * CFG.thresholdVibrateAmp;
        var kt = CFG.knobRestTop + S.compression + v;
        $knob.style.top = kt + 'px';
      // 同时微调整个系统的小振动
        var tipB = CFG.tipRestBottom - S.compression - v;
        $tip.style.bottom = tipB + 'px';
        if (!S.ballActive) {
          var ballB = CFG.tipRestBottom + 18 - S.compression - v;
          $ball.style.bottom = ballB + 'px';
        }
      }

      // 弹珠物理
      if (S.ballActive) {
        stepBall(dt, ts);
      }
    }

    S.rafId = requestAnimationFrame(loop);
  }

  // ===== 弹珠物理步进 =====
  function stepBall(dt, ts) {
    var maxY = S.ballMaxTravel;
    // 加速阶段
    if (S.ballAccelPhase) {
      var elapsed = ts - S.ballAccelStart;
      if (elapsed < CFG.ballAccelMs) {
        var p = elapsed / CFG.ballAccelMs;
        var ease = 1 - Math.pow(1 - p, 2); // ease-out quad
        S.ballVY = S.ballInitialVY * (0.45 + 0.55 * ease);
      } else {
        S.ballAccelPhase = false;
        S.ballVY = S.ballInitialVY;
      }
    } else {
      // 重力减速
      S.ballVY -= CFG.gravity * dt;
    }

    S.ballY += S.ballVY * dt;

    // 顶部：到达后减速回落（弧形转向，不是弹性碰撞）
    if (S.ballY >= maxY) {
      S.ballY = maxY;
      if (S.ballVY > 0) {
        S.ballVY = 0; // 到达顶部，速度归零，开始回落
        S.ballTopPause = ts; // 顶部短暂停留
      }
    }

    // 顶部短暂停留后再下落
    if (S.ballTopPause && S.ballY >= maxY) {
      if (ts - S.ballTopPause < 120) {
        S.ballVY = 0;
      } else {
        S.ballTopPause = 0;
        S.ballVY = -0.05; // 开始缓慢下落
      }
    }

    // 底部回落
    if (S.ballY <= 0) {
      S.ballY = 0;
      S.ballVY = 0;
      if (!S.ballFading) {
        S.ballFading = true;
        S.ballFadeStart = ts;
      }
    }

    if (S.ballFading) {
      var fe = ts - S.ballFadeStart;
      if (fe < 350) {
        $ball.style.opacity = String(1 - fe / 350);
      } else {
        S.ballActive = false;
        S.ballY = 0;
        S.ballVY = 0;
        S.ballFading = false;
        S.ballTopPause = 0;
        $ball.style.opacity = '1';
        setBallY(0);
        return;
      }
    } else {
      setBallY(S.ballY);
      updateBallHighlight(S.ballY, maxY);
    }
  }

  // ===== 自定义光标 =====
  var cursorX = window.innerWidth / 2;
  var cursorY = window.innerHeight / 2;

  function setCursorPos(x, y) {
    cursorX = x;
    cursorY = y;
    $cursor.style.left = x + 'px';
    $cursor.style.top = y + 'px';
  }

  function setCursorState(name) {
    $cursor.classList.remove('grab', 'grabbing');
    if (name === 'grab') $cursor.classList.add('grab');
    else if (name === 'grabbing') $cursor.classList.add('grabbing');
  }

  // ===== 预接触检测 =====
  function checkPreContact(x, y) {
    if (S.dragging || S.releasing) return;
    if (reducedMotion) return;

    var r = $knob.getBoundingClientRect();
    var kx = r.left + r.width / 2;
    var ky = r.top + r.height / 2;
    var dx = x - kx;
    var dy = y - ky;
    var dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < CFG.preContactRadius + 30) {
      $knob.classList.add('pre-contact');
      if (!S.dragging) {
        $knob.style.transform = 'translateX(-50%) translateY(-2px)';
      }
      setCursorState('grab');
    } else {
      $knob.classList.remove('pre-contact');
      if (!S.dragging) {
        $knob.style.transform = 'translateX(-50%)';
      }
      setCursorState('default');
    }
  }

  // ===== 拖拽 =====
  function onMove(e) {
    setCursorPos(e.clientX, e.clientY);
    if (S.dragging) {
      doDrag(e.clientY);
    } else {
      checkPreContact(e.clientX, e.clientY);
    }
  }

  function onDown(e) {
    if (e.button !== 0) return;
    if (S.releasing) return;
    // 命中测试
    var r = $knob.getBoundingClientRect();
    if (
      e.clientX >= r.left - 16 &&
      e.clientX <= r.right + 16 &&
      e.clientY >= r.top - 24 &&
      e.clientY <= r.bottom + 14
    ) {
      startDrag(e.clientY);
    }
  }

  function startDrag(y) {
    S.dragging = true;
    S.dragStartY = y;
    S.compression = 0;
    $knob.classList.remove('pre-contact');
    // 接触按压：下沉 1px
    $knob.style.transform = 'translateX(-50%) translateY(1px)';
    setCursorState('grabbing');
  }

  function doDrag(y) {
    var dy = y - S.dragStartY;
    if (dy <= 0) {
      S.compression = 0;
      setCompression(0);
      return;
    }

    // 非线性阻力：超过70%后硬化
    var c = dy;
    var softLimit = CFG.maxCompression * CFG.hardThreshold;
    if (c > softLimit) {
      var excess = c - softLimit;
      c = softLimit + excess / CFG.hardFactor;
    }
    if (c > CFG.maxCompression) c = CFG.maxCompression;

    S.compression = c;
    setCompression(c);
  }

  function onUp() {
    if (!S.dragging) return;
    S.dragging = false;
    $knob.style.transform = 'translateX(-50%)';
    $knob.classList.remove('pre-contact');
    setCursorState('default');

    if (S.compression > 2) {
      startRelease();
    } else {
      S.compression = 0;
      setCompression(0);
    }
  }

  function startRelease() {
    S.releasing = true;
    S.releaseStart = performance.now();
    S.releaseAmp = S.compression;
    S.lastTime = 0;
    launchBall(S.compression);
  }

  // ===== 页面可见性 =====
  function onVis() {
    S.paused = document.hidden;
    if (!S.paused) {
      S.lastTime = 0;
    }
  }

  // ===== 初始化 =====
  function init() {
    buildTicks();
    setCompression(0);
    setCursorPos(window.innerWidth / 2, window.innerHeight / 2);

    if (!reducedMotion) {
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mousedown', onDown);
      document.addEventListener('mouseup', onUp);
      document.addEventListener('mouseleave', function() {
        if (S.dragging) onUp();
      });
    } else {
      document.body.style.cursor = 'auto';
      $cursor.style.display = 'none';
      $knob.style.cursor = 'grab';

      $knob.addEventListener('mousedown', function(e) {
        if (S.releasing) return;
        startDrag(e.clientY);
      });
      document.addEventListener('mousemove', function(e) {
        if (S.dragging) doDrag(e.clientY);
      });
      document.addEventListener('mouseup', function() {
        if (S.dragging) {
          if (S.compression > 2) startRelease();
          else { S.compression = 0; setCompression(0); }
          S.dragging = false;
          $knob.style.transform = 'translateX(-50%)';
        }
      });
    }

    document.addEventListener('visibilitychange', onVis);
    S.rafId = requestAnimationFrame(loop);
    updateScale(0);
  }

  // ===== 清理 =====
  window.addEventListener('beforeunload', function() {
    if (S.rafId) cancelAnimationFrame(S.rafId);
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

</body>
</html>

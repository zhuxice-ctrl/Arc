<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="creative-medium" content="interactive-prototype">
<title>竖直刻度尺悬停注释</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    cursor: none;
  }

  /* 粉色箭头光标 */
  .custom-cursor {
    position: fixed;
    top: 0;
    left: 0;
    width: 20px;
    height: 24px;
    pointer-events: none;
    z-index: 9999;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .custom-cursor.visible {
    opacity: 1;
  }
  .custom-cursor svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* 交互轨道（足够宽，快速滑动不丢） */
  .ruler-track {
    position: fixed;
    top: 0;
    left: 0;
    width: 160px;
    height: 100vh;
    z-index: 30;
    touch-action: none;
    user-select: none;
  }

  /* 刻度尺容器（视觉） */
  .ruler-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 90px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 16px 0;
    z-index: 10;
    pointer-events: none;
  }

  /* 单条刻度 —— 左对齐，统一长度和颜色 */
  .tick {
    width: 100%;
    height: 2px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    pointer-events: none;
  }

  .tick-line {
    margin-left: 16px;
    height: 2px;
    border-radius: 1px;
    background: #555;
    /* 初始状态：所有刻度等长 */
    width: 52px;
  }

  /* 注释卡片 */
  .annotation-card {
    position: fixed;
    top: 0;
    left: 108px;
    min-width: 420px;
    max-width: 520px;
    background: #1c1c1e;
    border: 1px solid #2c2c2e;
    border-radius: 20px;
    padding: 24px 28px;
    z-index: 100;
    pointer-events: none;
    opacity: 0;
    transform: translateY(-50%) scale(0.96);
    transition: opacity 0.25s ease,
                transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    will-change: top, opacity, transform;
  }

  .annotation-card.visible {
    opacity: 1;
    transform: translateY(-50%) scale(1);
  }

  .card-label {
    display: inline-block;
    padding: 6px 14px;
    background: #2c2c2e;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    color: #c7c7cc;
    margin-bottom: 18px;
    letter-spacing: 0.5px;
  }

  .card-body {
    font-size: 22px;
    line-height: 1.5;
    color: #d1d1d6;
    font-weight: 500;
  }

  .card-body p {
    margin-bottom: 14px;
  }

  .card-body p:last-child {
    margin-bottom: 0;
  }

  .card-body ul {
    list-style: none;
    padding-left: 0;
    margin-top: 8px;
  }

  .card-body ul li {
    position: relative;
    padding-left: 22px;
    margin-bottom: 6px;
    font-size: 20px;
  }

  .card-body ul li::before {
    content: "";
    position: absolute;
    left: 4px;
    top: 0.7em;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #8e8e93;
  }

  /* 减少动效偏好 */
  @media (prefers-reduced-motion: reduce) {
    .custom-cursor,
    .annotation-card,
    .tick-line {
      transition: none !important;
    }
  }

  /* 触屏 */
  @media (hover: none) and (pointer: coarse) {
    html, body { cursor: default; }
    .custom-cursor { display: none; }
  }
</style>

  // ===== DOM =====
  const rulerTrack = document.getElementById('rulerTrack');
  const ruler = document.getElementById('ruler');
  const annotationCard = document.getElementById('annotationCard');
  const cardLabel = document.getElementById('cardLabel');
  const cardBody = document.getElementById('cardBody');
  const customCursor = document.getElementById('customCursor');

  // ===== 生成刻度（全部等长，左对齐）=====
  const tickLineElements = [];

  for (let i = 0; i < TICK_COUNT; i++) {
    const tick = document.createElement('div');
    tick.className = 'tick';

    const line = document.createElement('div');
    line.className = 'tick-line';
    line.style.width = BASE_WIDTH + 'px';

    tick.appendChild(line);
    ruler.appendChild(tick);
    tickLineElements.push(line);
  }

  // ===== 尺寸缓存 =====
  let rulerTop = 0;
  let rulerHeight = 0;
  let tickSpacing = 0;

  function updateCache() {
    const rect = ruler.getBoundingClientRect();
    rulerTop = rect.top;
    rulerHeight = rect.height;
    tickSpacing = rulerHeight / TICK_COUNT;
  }
  updateCache();
  window.addEventListener('resize', updateCache);
  window.addEventListener('orientationchange', updateCache);

  // ===== 状态 =====
  let activeIndex = -1;
  let isHovering = false;
  let cardVisible = false;
  let contentIndex = -1;
  let lastContentIndex = -1;

  // 鼠标/光标平滑
  let mouseX = 0;
  let mouseY = 0;
  let cursorX = 0;
  let cursorY = 0;

  // 卡片位置缓动
  let cardTargetY = 0;
  let cardCurrentY = 0;

  // ===== 工具函数 =====
  function getTickIndexFromY(y) {
    const relativeY = y - rulerTop;
    let index = Math.round(relativeY / tickSpacing - 0.5);
    return Math.max(0, Math.min(TICK_COUNT - 1, index));
  }

  function getTickCenterY(index) {
    return rulerTop + (index + 0.5) * tickSpacing;
  }

  // ===== 核心：连续坐标驱动刻度向右突出波形 =====
  // 左对齐，所以延伸全部发生在右端；中心刻度最长最亮，向两侧高斯衰减
  function updateTickDynamics(cursorY) {
    const cursorRelY = cursorY - rulerTop;
    const cursorIdx = cursorRelY / tickSpacing; // 浮点刻度索引

    const startIdx = Math.max(0, Math.floor(cursorIdx - GLOW_RADIUS));
    const endIdx = Math.min(TICK_COUNT - 1, Math.ceil(cursorIdx + GLOW_RADIUS));

    // 先把所有刻度重置为基础态
    for (let i = 0; i < TICK_COUNT; i++) {
      const line = tickLineElements[i];
      if (i < startIdx || i > endIdx) {
        line.style.width = BASE_WIDTH + 'px';
        line.style.background = '#555';
      }
    }

    // 给范围内的刻度计算突出量
    const sigma = GLOW_RADIUS / 2.8;
    for (let i = startIdx; i <= endIdx; i++) {
      const dist = Math.abs(i + 0.5 - cursorIdx);
      if (dist > GLOW_RADIUS) {
        tickLineElements[i].style.width = BASE_WIDTH + 'px';
        tickLineElements[i].style.background = '#555';
        continue;
      }

      // 高斯衰减
      const intensity = Math.exp(-(dist * dist) / (2 * sigma * sigma));

      const line = tickLineElements[i];
      // 宽度：基础 + 向右延伸（左对齐，所以右端延伸）
      line.style.width = (BASE_WIDTH + MAX_EXTRA_WIDTH * intensity) + 'px';

      // 颜色：灰 → 白，中心最亮
      const r = Math.round(85 + (255 - 85) * intensity);
      const g = Math.round(85 + (255 - 85) * intensity);
      const b = Math.round(85 + (255 - 85) * intensity * 0.95);
      line.style.background = `rgb(${r}, ${g}, ${b})`;
    }
  }

  function resetAllTicks() {
    for (let i = 0; i < TICK_COUNT; i++) {
      const line = tickLineElements[i];
      line.style.width = BASE_WIDTH + 'px';
      line.style.background = '#555';
    }
  }

  // ===== 卡片 =====
  function showAnnotation(index) {
    const data = annotations[index];
    if (!data) return;

    if (contentIndex === index) return;

    cardLabel.textContent = data.label;
    cardBody.innerHTML = data.html;
    contentIndex = index;
    lastContentIndex = index;

    if (!cardVisible) {
      cardVisible = true;
      cardCurrentY = getTickCenterY(index);
      cardTargetY = cardCurrentY;
      annotationCard.style.top = cardCurrentY + 'px';
      requestAnimationFrame(() => {
        annotationCard.classList.add('visible');
      });
    } else {
      // 切换内容时轻微弹动
      annotationCard.style.transform = 'translateY(-50%) scale(0.98)';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          annotationCard.style.transform = 'translateY(-50%) scale(1)';
        });
      });
    }
  }

  function hideAnnotation() {
    cardVisible = false;
    contentIndex = -1;
    lastContentIndex = -1;
    annotationCard.classList.remove('visible');
  }

  function clampCardY(y) {
    const vh = window.innerHeight;
    const half = annotationCard.offsetHeight / 2;
    if (y + half > vh - 20) return vh - half - 20;
    if (y - half < 20) return half + 20;
    return y;
  }

  // ===== rAF 动画循环 =====
  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  // 减少动效偏好检测
  const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function animate() {
    if (prefersReducedMotion) {
      // 无缓动，直接同步
      cursorX = mouseX;
      cursorY = mouseY;
    } else {
      cursorX = lerp(cursorX, mouseX, CURSOR_LERP);
      cursorY = lerp(cursorY, mouseY, CURSOR_LERP);
    }
    customCursor.style.transform = 'translate(' + cursorX + 'px, ' + cursorY + 'px)';

    if (isHovering) {
      // 刻度动态波形（跟随平滑后的光标，更丝滑）
      updateTickDynamics(cursorY);

      // 卡片位置缓动
      if (cardVisible && activeIndex >= 0) {
        cardTargetY = getTickCenterY(activeIndex);
        if (prefersReducedMotion) {
          cardCurrentY = cardTargetY;
        } else {
          cardCurrentY = lerp(cardCurrentY, cardTargetY, CARD_LERP);
        }
        annotationCard.style.top = clampCardY(cardCurrentY) + 'px';
      }
    }

    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  // ===== 交互检测 =====
  const TRACK_PAD_LEFT = 30;
  const TRACK_PAD_RIGHT = 80;

  function isInTrack(clientX) {
    return clientX >= -TRACK_PAD_LEFT && clientX <= 160 + TRACK_PAD_RIGHT;
  }

  function handlePointerMove(clientX, clientY) {
    mouseX = clientX;
    mouseY = clientY;

    const inTrack = isInTrack(clientX);

    if (inTrack) {
      if (!isHovering) {
        isHovering = true;
        cursorX = clientX;
        cursorY = clientY;
        cardCurrentY = clientY;
        cardTargetY = clientY;
      }
      const index = getTickIndexFromY(clientY);
      activeIndex = index;
      showAnnotation(index);
    } else {
      if (isHovering) {
        isHovering = false;
        activeIndex = -1;
        resetAllTicks();
        hideAnnotation();
      }
    }
  }

  // ===== 鼠标 =====
  document.addEventListener('pointermove', (e) => {
    customCursor.classList.add('visible');
    handlePointerMove(e.clientX, e.clientY);
  });

  document.addEventListener('pointerenter', () => {
    customCursor.classList.add('visible');
  });

  document.addEventListener('pointerleave', () => {
    customCursor.classList.remove('visible');
    isHovering = false;
    activeIndex = -1;
    resetAllTicks();
    hideAnnotation();
  });

  // ===== 触屏 =====
  let isTouching = false;

  rulerTrack.addEventListener('touchstart', (e) => {
    e.preventDefault();
    isTouching = true;
    const t = e.touches[0];
    handlePointerMove(t.clientX, t.clientY);
  }, { passive: false });

  rulerTrack.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (!isTouching) return;
    const t = e.touches[0];
    handlePointerMove(t.clientX, t.clientY);
  }, { passive: false });

  function endTouch() {
    isTouching = false;
    isHovering = false;
    activeIndex = -1;
    resetAllTicks();
    hideAnnotation();
  }

  rulerTrack.addEventListener('touchend', endTouch, { passive: false });
  rulerTrack.addEventListener('touchcancel', endTouch, { passive: false });

  // resize
  window.addEventListener('resize', () => {
    if (activeIndex >= 0 && cardVisible) {
      cardTargetY = getTickCenterY(activeIndex);
      cardCurrentY = cardTargetY;
      annotationCard.style.top = clampCardY(cardCurrentY) + 'px';
    }
    if (!isHovering) resetAllTicks();
  });
</script>

</body>
</html>

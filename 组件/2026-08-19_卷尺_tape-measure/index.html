<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="creative-medium" content="interactive-prototype">
<title>V3 交互组件实验室 · 钢卷尺</title>
<style>
  /* ========== 全局 ========== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--workbench);
    cursor: none;
    user-select: none;
    -webkit-user-select: none;
  }

  :root {
    /* 工作台暖灰底 */
    --workbench: #c9bfb0;
    --workbench-dark: #b5a997;
    --workbench-light: #d9cfc0;
    /* 工业工程黄 */
    --tape-yellow: #f2c200;
    --tape-yellow-deep: #d4a600;
    --tape-yellow-dark: #a88000;
    /* 橡胶黑 */
    --rubber: #2b2b2b;
    --rubber-light: #3d3d3d;
    --rubber-dark: #1a1a1a;
    /* 铬钢银 */
    --chrome: #d8d8d8;
    --chrome-dark: #9a9a9a;
    --chrome-deep: #6b6b6b;
    --chrome-light: #eeeeee;
    /* 文字 */
    --ink: #1f1b15;
    --ink-soft: #5a4f42;
  }

  /* ========== 工作台背景 ========== */
  .workbench {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 50% 35%, rgba(255,248,230,0.45) 0%, transparent 55%),
      linear-gradient(180deg, var(--workbench-light) 0%, var(--workbench) 45%, var(--workbench-dark) 100%);
  }
  .workbench::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 20% 70%, rgba(0,0,0,0.04) 0%, transparent 40%),
      radial-gradient(circle at 80% 20%, rgba(255,255,255,0.06) 0%, transparent 35%);
  }
  /* 木纹 */
  .workbench::after {
    content: ""; position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      90deg,
      transparent 0px, transparent 38px,
      rgba(90,70,40,0.06) 38px, rgba(90,70,40,0.06) 39px,
      transparent 39px, transparent 120px,
      rgba(90,70,40,0.04) 120px, rgba(90,70,40,0.04) 121px
    );
    mix-blend-mode: multiply;
    opacity: 0.6;
  }

  /* ========== 顶部标题 ========== */
  .header {
    position: fixed; top: 32px; left: 40px;
    color: var(--ink); z-index: 5;
    pointer-events: none;
  }
  .header .lab {
    font-size: 12px; letter-spacing: 3px;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .header .title {
    font-size: 22px; font-weight: 700;
    letter-spacing: 0.5px;
  }
  .header .subtitle {
    font-size: 13px; color: var(--ink-soft);
    margin-top: 4px;
  }

  /* ========== 读数面板 ========== */
  .readout {
    position: fixed; top: 32px; right: 40px;
    background: rgba(26,26,26,0.85);
    backdrop-filter: blur(8px);
    border-radius: 10px;
    padding: 14px 20px;
    color: var(--tape-yellow);
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    text-align: right;
    z-index: 5;
    pointer-events: none;
    min-width: 160px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .readout .label {
    font-size: 10px; letter-spacing: 2px;
    color: #888; text-transform: uppercase;
    margin-bottom: 4px;
  }
  .readout .value {
    font-size: 28px; font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
  }
  .readout .unit {
    font-size: 12px; color: #aaa;
    margin-left: 4px;
  }
  .readout .sub {
    font-size: 11px; color: #777;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  /* ========== 操作提示 ========== */
  .hint {
    position: fixed; bottom: 32px; left: 50%;
    transform: translateX(-50%);
    color: var(--ink-soft);
    font-size: 13px;
    letter-spacing: 0.5px;
    z-index: 5;
    pointer-events: none;
    display: flex; gap: 24px;
    background: rgba(255,255,255,0.35);
    backdrop-filter: blur(6px);
    padding: 10px 20px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.5);
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .hint.show { opacity: 1; }
  .hint-item { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .hint-item .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--tape-yellow-dark);
  }

  /* ========== 舞台 ========== */
  .stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
  }

  /* ========== 卷尺整体 ========== */
  .tape-measure {
    position: relative;
    width: 700px; height: 200px;
  }

  /* --- 尺壳 --- */
  .case {
    position: absolute;
    left: 0; top: 50%;
    transform: translateY(-50%);
    width: 220px; height: 200px;
    z-index: 3;
  }
  .case-body {
    position: absolute;
    left: 0; top: 10px;
    width: 210px; height: 180px;
    background: linear-gradient(145deg, var(--rubber-light) 0%, var(--rubber) 50%, var(--rubber-dark) 100%);
    border-radius: 28px 28px 28px 28px;
    box-shadow:
      0 20px 40px rgba(0,0,0,0.35),
      0 8px 16px rgba(0,0,0,0.25),
      inset 0 2px 4px rgba(255,255,255,0.12),
      inset 0 -4px 8px rgba(0,0,0,0.4);
  }
  .case-top {
    position: absolute;
    left: 12px; top: 0;
    width: 170px; height: 28px;
    background: linear-gradient(180deg, var(--chrome-light) 0%, var(--chrome) 50%, var(--chrome-dark) 100%);
    border-radius: 14px 14px 6px 6px;
    box-shadow:
      0 2px 6px rgba(0,0,0,0.3),
      inset 0 1px 2px rgba(255,255,255,0.8);
  }
  .case-top::after {
    content: ""; position: absolute;
    top: 50%; left: 10px; right: 10px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,0,0,0.15), transparent);
  }
  /* 尺带出口 */
  .tape-mouth {
    position: absolute;
    right: -2px; top: 50%;
    transform: translateY(-50%);
    width: 30px; height: 28px;
    background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
    border-radius: 3px;
    box-shadow:
      inset 0 2px 4px rgba(0,0,0,0.9),
      inset 0 -1px 2px rgba(255,255,255,0.05);
  }
  .tape-mouth::before {
    content: ""; position: absolute;
    left: 2px; top: -2px; right: 2px; height: 3px;
    background: linear-gradient(180deg, var(--chrome-dark), var(--chrome-deep));
    border-radius: 2px 2px 0 0;
  }
  .tape-mouth::after {
    content: ""; position: absolute;
    left: 2px; bottom: -2px; right: 2px; height: 3px;
    background: linear-gradient(0deg, var(--chrome-dark), var(--chrome-deep));
    border-radius: 0 0 2px 2px;
  }

  /* 尺口阴影（悬停尺爪时变化） */
  .mouth-shadow {
    position: absolute;
    right: -6px; top: 50%;
    transform: translateY(-50%);
    width: 8px; height: 34px;
    background: linear-gradient(90deg, rgba(0,0,0,0.4), transparent);
    pointer-events: none;
    opacity: 0.6;
    transition: opacity 0.2s ease, width 0.2s ease;
    z-index: 2;
  }
  .mouth-shadow.hovered {
    opacity: 1;
    width: 12px;
  }

  /* --- 锁定开关 --- */
  .lock-switch {
    position: absolute;
    top: -8px; left: 70px;
    width: 50px; height: 32px;
    cursor: pointer;
    z-index: 10;
    cursor: none;
  }
  .lock-track {
    position: absolute;
    left: 2px; top: 8px;
    width: 46px; height: 18px;
    background: linear-gradient(180deg, #111 0%, #222 100%);
    border-radius: 4px;
    box-shadow:
      inset 0 2px 4px rgba(0,0,0,0.8),
      0 1px 1px rgba(255,255,255,0.1);
  }
  .lock-knob {
    position: absolute;
    top: 2px;
    width: 22px; height: 28px;
    background: linear-gradient(180deg, var(--chrome-light) 0%, var(--chrome) 40%, var(--chrome-dark) 100%);
    border-radius: 4px;
    box-shadow:
      0 3px 6px rgba(0,0,0,0.4),
      inset 0 1px 1px rgba(255,255,255,0.6),
      inset 0 -1px 2px rgba(0,0,0,0.2);
    left: 1px;
    transition: left 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .lock-knob::before {
    content: "";
    position: absolute;
    top: 4px; left: 3px; right: 3px;
    height: 2px;
    background: rgba(0,0,0,0.15);
    border-radius: 1px;
  }
  .lock-knob::after {
    content: "";
    position: absolute;
    top: 8px; left: 3px; right: 3px;
    height: 2px;
    background: rgba(0,0,0,0.15);
    border-radius: 1px;
  }
  .lock-switch.locked .lock-knob {
    left: 27px;
  }
  .lock-label {
    position: absolute;
    top: 36px; left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: var(--ink-soft);
    letter-spacing: 1px;
    white-space: nowrap;
    pointer-events: none;
  }

  /* 尺壳底部品牌条 */
  .case-brand {
    position: absolute;
    bottom: 30px; left: 20px; right: 20px;
    height: 22px;
    background: linear-gradient(180deg, var(--tape-yellow) 0%, var(--tape-yellow-deep) 100%);
    border-radius: 3px;
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.4),
      inset 0 -1px 1px rgba(0,0,0,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; letter-spacing: 2px;
    color: var(--rubber-dark);
    font-weight: 700;
  }
  /* 铆钉 */
  .rivet {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--chrome-light), var(--chrome-dark));
    box-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .rivet.r1 { top: 55px; left: 25px; }
  .rivet.r2 { top: 55px; right: 35px; }
  .rivet.r3 { bottom: 70px; left: 25px; }
  .rivet.r4 { bottom: 70px; right: 35px; }

  /* --- 尺带容器 --- */
  .tape-container {
    position: absolute;
    left: 208px; top: 50%;
    transform: translateY(-50%);
    height: 26px;
    width: 460px;
    z-index: 1;
    overflow: visible;
  }
  .tape-blade {
    position: absolute;
    left: 0; top: 0;
    height: 26px;
    width: 100%;
    will-change: width;
  }
  .tape-blade canvas {
    display: block;
    height: 100%;
    width: 100%;
  }
  /* 尺带立体效果：顶部高光 + 底部阴影 */
  .tape-blade::before {
    content: "";
    position: absolute;
    left: 0; top: 0; right: 0; height: 4px;
    background: linear-gradient(180deg, rgba(255,255,255,0.35), transparent);
    pointer-events: none;
    z-index: 2;
  }
  .tape-blade::after {
    content: "";
    position: absolute;
    left: 0; bottom: 0; right: 0; height: 6px;
    background: linear-gradient(0deg, rgba(0,0,0,0.25), transparent);
    pointer-events: none;
    z-index: 2;
  }

  /* 尺带侧面速度感 */
  .speed-streak {
    position: absolute;
    left: 0; top: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0;
    background: repeating-linear-gradient(
      90deg,
      transparent 0px,
      transparent 6px,
      rgba(255,255,255,0.12) 6px,
      rgba(255,255,255,0.12) 7px
    );
    transition: opacity 0.08s linear;
    mask-image: linear-gradient(90deg, transparent 0%, black 10%, black 90%, transparent 100%);
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, black 10%, black 90%, transparent 100%);
  }

  /* --- 尺爪（金属钩） --- */
  .tape-hook {
    position: absolute;
    right: -14px; top: 50%;
    transform: translateY(-50%);
    width: 20px; height: 36px;
    z-index: 10;
    cursor: none;
  }
  .hook-body {
    position: absolute;
    right: 0; top: 6px;
    width: 14px; height: 24px;
    background: linear-gradient(90deg, var(--chrome-dark) 0%, var(--chrome) 40%, var(--chrome-light) 70%, var(--chrome) 100%);
    border-radius: 2px 2px 0 0;
    box-shadow:
      2px 2px 6px rgba(0,0,0,0.3),
      inset 0 1px 1px rgba(255,255,255,0.8);
  }
  .hook-tip {
    position: absolute;
    right: 0; bottom: 0;
    width: 20px; height: 8px;
    background: linear-gradient(180deg, var(--chrome-light) 0%, var(--chrome) 50%, var(--chrome-dark) 100%);
    border-radius: 2px 2px 4px 4px;
    box-shadow:
      2px 3px 8px rgba(0,0,0,0.4),
      inset 0 1px 1px rgba(255,255,255,0.7);
  }
  .hook-rivet {
    position: absolute;
    right: 4px; top: 12px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff, var(--chrome-dark));
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }

  /* 尺爪悬停微颤 — 像被磁场吸引般轻轻颤动 */
  @keyframes hookTremble {
    0%, 100% { transform: translateY(-50%) translateX(0) rotate(0deg); }
    20% { transform: translateY(-51%) translateX(0.8px) rotate(0.3deg); }
    40% { transform: translateY(-49%) translateX(-0.6px) rotate(-0.2deg); }
    60% { transform: translateY(-50.5%) translateX(0.4px) rotate(0.15deg); }
    80% { transform: translateY(-49.5%) translateX(-0.3px) rotate(-0.1deg); }
  }
  .tape-hook.hovered {
    animation: hookTremble 0.18s ease-in-out infinite;
  }
  .tape-hook.grabbed {
    animation: none;
  }
  .tape-hook.grabbed .hook-body {
    background: linear-gradient(90deg, var(--chrome-deep) 0%, var(--chrome-dark) 40%, var(--chrome) 70%, var(--chrome-dark) 100%);
  }
  /* 尺带绷紧视觉：被拉出时增加高光强度 */
  .tape-blade.taut::before {
    background: linear-gradient(180deg, rgba(255,255,255,0.5), transparent);
  }

  /* 刻度脉冲 */
  @keyframes tickPulse {
    0% { transform: scaleX(1) scaleY(1); opacity: 1; }
    100% { transform: scaleX(1.8) scaleY(1.4); opacity: 0; }
  }

  /* ========== 自定义光标 ========== */
  .cursor {
    position: fixed;
    width: 28px; height: 28px;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.15s cubic-bezier(0.34, 1.56, 0.64, 1),
                height 0.15s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.2s;
  }
  .cursor-ring {
    position: absolute; inset: 0;
    border: 2px solid var(--rubber);
    border-radius: 50%;
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1),
                border-color 0.15s,
                border-width 0.15s;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.4);
  }
  .cursor-dot {
    position: absolute;
    left: 50%; top: 50%;
    width: 4px; height: 4px;
    background: var(--rubber);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  /* 握紧状态 */
  .cursor.grabbed .cursor-ring {
    border-width: 3px;
    border-color: var(--tape-yellow-dark);
    transform: scale(0.55);
  }
  .cursor.grabbed .cursor-dot {
    width: 6px; height: 6px;
    background: var(--tape-yellow-dark);
  }
  /* 悬停可抓状态 */
  .cursor.hover .cursor-ring {
    border-color: var(--tape-yellow-deep);
    transform: scale(1.15);
  }
  /* 隐藏状态 */
  .cursor.hidden { opacity: 0; }

  /* ========== 锁定状态指示 ========== */
  .lock-indicator {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -100px);
    background: var(--rubber);
    color: var(--tape-yellow);
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 12px;
    letter-spacing: 2px;
    font-weight: 600;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .lock-indicator.show {
    opacity: 1;
    transform: translate(-50%, -120px);
  }

  /* ========== 降低动效偏好 ========== */
  @media (prefers-reduced-motion: reduce) {
    body { cursor: default; }
    .cursor { display: none; }
    .tape-hook.hovered { animation: none; }
    .lock-knob { transition: left 0.1s linear; }
  }

  /* 版本号 */
  .version {
    position: fixed; bottom: 12px; right: 16px;
    font-size: 10px; color: var(--ink-soft);
    letter-spacing: 1px; z-index: 5;
    pointer-events: none;
    opacity: 0.6;
  }
</style>
</head>
<body>

<div class="workbench"></div>

<div class="header">
  <div class="lab">V3 Interaction Lab</div>
  <div class="title">钢卷尺 · 拉出与回卷</div>
  <div class="subtitle">光标驱动的拟物化微交互</div>
</div>

<div class="readout">
  <div class="label">当前读数</div>
  <div class="value"><span id="readoutCm">0.0</span><span class="unit">厘米</span></div>
  <div class="sub"><span id="readoutM">0.000</span> 米</div>
</div>

<div class="hint" id="hint">
  <div class="hint-item"><span class="dot"></span>抓住尺爪向外拖拽</div>
  <div class="hint-item"><span class="dot"></span>松手回卷</div>
  <div class="hint-item"><span class="dot"></span>拨动锁扣固定尺带</div>
</div>

<div class="stage">
  <div class="tape-measure" id="tapeMeasure">
    <!-- 尺壳 -->
    <div class="case">
      <div class="case-body"></div>
      <div class="case-top"></div>
      <div class="tape-mouth"></div>
      <div class="mouth-shadow" id="mouthShadow"></div>
      <div class="rivet r1"></div>
      <div class="rivet r2"></div>
      <div class="rivet r3"></div>
      <div class="rivet r4"></div>
      <div class="case-brand">FLYING · 5M</div>

      <!-- 锁定开关 -->
      <div class="lock-switch" id="lockSwitch">
        <div class="lock-track"></div>
        <div class="lock-knob"></div>
        <div class="lock-label">锁定</div>
      </div>
    </div>

    <!-- 尺带 -->
    <div class="tape-container">
      <div class="tape-blade" id="tapeBlade">
        <canvas id="tapeCanvas"></canvas>
        <div class="speed-streak" id="speedStreak"></div>
        <!-- 尺爪 -->
        <div class="tape-hook" id="tapeHook">
          <div class="hook-body"></div>
          <div class="hook-tip"></div>
          <div class="hook-rivet"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="lock-indicator" id="lockIndicator">已锁定</div>

<div class="cursor" id="cursor">
  <div class="cursor-ring"></div>
  <div class="cursor-dot"></div>
</div>

<div class="version">V3.0 · TAPE MEASURE</div>

<script>
(function() {
  'use strict';

  // ===== 配置 =====
  const CONFIG = {
    minLength: 2,        // 最小拉出长度 px（留一点缓冲）
    maxLength: 440,      // 最大拉出长度 px
    pxPerCm: 8,          // 每厘米像素数 → 440px ≈ 55cm
    springK: 0.12,       // 弹簧劲度系数
    damping: 0.84,       // 阻尼系数 (每帧速度衰减)
    mass: 0.9,           // 质量（惯性）
    resistanceBase: 0.25, // 阻力系数（随长度递增比例）
    dragStiffness: 0.35, // 拖拽跟随刚度
    bounceDecay: 0.45,   // 弹跳衰减率（越低弹得越少）
    bounceMinVel: 0.4,   // 低于此速度停止弹跳
    reducedMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches,
  };

  // 将 px 转换为 cm（尺带的"显示长度"）
  // 1 cm = CONFIG.pxPerCm px
  const pxToCm = (px) => px / CONFIG.pxPerCm;
  const cmToPx = (cm) => cm * CONFIG.pxPerCm;

  // ===== 状态 =====
  const state = {
    // 物理状态
    position: 0,      // 当前拉出长度 px
    velocity: 0,      // 当前速度 px/帧
    targetPos: 0,     // 拖拽时的目标位置
    // 交互状态
    isDragging: false,
    isLocked: false,
    isHovering: false,
    // 鼠标
    mouseX: 0,
    mouseY: 0,
    // 尺带起始拖拽偏移
    dragOffsetX: 0,
    // 刻度脉冲
    lastMeterTick: 0,
    // 动画
    rafId: null,
    running: true,
    // 弹跳
    bouncing: false,
    bouncePhase: 0,
  };

  // ===== DOM =====
  const $ = (id) => document.getElementById(id);
  const cursor = $('cursor');
  const tapeBlade = $('tapeBlade');
  const tapeHook = $('tapeHook');
  const tapeCanvas = $('tapeCanvas');
  const lockSwitch = $('lockSwitch');
  const mouthShadow = $('mouthShadow');
  const speedStreak = $('speedStreak');
  const readoutCm = $('readoutCm');
  const readoutM = $('readoutM');
  const lockIndicator = $('lockIndicator');
  const hint = $('hint');

  const ctx = tapeCanvas.getContext('2d');

  // ===== 初始化 Canvas =====
  let canvasReady = false;
  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    tapeCanvas.width = CONFIG.maxLength * dpr;
    tapeCanvas.height = 26 * dpr;
    tapeCanvas.style.width = CONFIG.maxLength + 'px';
    tapeCanvas.style.height = '26px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
    drawTape(CONFIG.maxLength);
    canvasReady = true;
  }

  // ===== 绘制尺带刻度 =====
  function drawTape(widthPx) {
    const h = 26;
    ctx.clearRect(0, 0, widthPx, h);

    // 底色 — 工程黄
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#f5c900');
    grad.addColorStop(0.5, '#f2c200');
    grad.addColorStop(1, '#e5b600');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, widthPx, h);

    // 刻度 — 每 mm 一条，每 cm 长刻度，每 10cm 数字
    const totalCm = pxToCm(widthPx);
    const mmPerPx = 1 / (CONFIG.pxPerCm / 10);

    ctx.fillStyle = '#1a1a1a';
    ctx.font = '10px -apple-system, "PingFang SC", sans-serif';
    ctx.textBaseline = 'top';
    ctx.textAlign = 'center';

    for (let mm = 0; mm <= totalCm * 10; mm++) {
      const x = mm * (CONFIG.pxPerCm / 10);
      if (x > widthPx) break;

      let tickHeight;
      if (mm % 100 === 0) {
        tickHeight = 18; // 整米 最长
      } else if (mm % 10 === 0) {
        tickHeight = 14; // 整厘米
      } else if (mm % 5 === 0) {
        tickHeight = 10; // 半厘米
      } else {
        tickHeight = 6;  // 毫米
      }

      ctx.fillRect(x, h - tickHeight - 2, mm % 100 === 0 ? 1.5 : 1, tickHeight);

      // 数字
      if (mm % 10 === 0 && mm > 0) {
        const cmVal = Math.floor(mm / 10);
        const fontSize = mm % 100 === 0 ? 11 : 9;
        ctx.font = `600 ${fontSize}px -apple-system, "PingFang SC", sans-serif`;
        ctx.fillText(cmVal.toString(), x + 2, 2);
      }
    }

    // 起始端（0刻度附近的红色起始标记）
    ctx.fillStyle = '#e53935';
    ctx.fillRect(0, h - 22, 2, 18);
  }

  // ===== 更新尺带长度 =====
  function updateTapeLength(px) {
    const clampedPx = Math.max(0, Math.min(CONFIG.maxLength, px));
    tapeBlade.style.width = clampedPx + 'px';

    // 更新读数
    const cm = pxToCm(clampedPx);
    readoutCm.textContent = cm.toFixed(1);
    readoutM.textContent = (cm / 100).toFixed(3);

    // 速度感条纹
    const speed = Math.abs(state.velocity);
    if (speed > 1.5) {
      speedStreak.style.opacity = Math.min(0.6, speed / 15);
    } else {
      speedStreak.style.opacity = 0;
    }

    // 尺带绷紧状态
    if (state.isDragging || speed > 3) {
      tapeBlade.classList.add('taut');
    } else {
      tapeBlade.classList.remove('taut');
    }

    // 整米刻度脉冲
    const currentCm = cm;
    const currentMeter = Math.floor(currentCm / 100);
    if (currentMeter > state.lastMeterTick && speed > 0.5) {
      state.lastMeterTick = currentMeter;
      triggerMeterSnap();
    } else if (currentMeter < state.lastMeterTick && speed < -0.5) {
      state.lastMeterTick = currentMeter;
      triggerMeterSnap();
    }
  }

  // ===== 整米吸附微顿 =====
  function triggerMeterSnap() {
    // 速度方向上给一个微小的阻尼"咔哒"感
    state.velocity *= 0.6;
  }

  // ===== 物理积分（弹簧-阻尼-惯性） =====
  function physicsStep(dt) {
    const dtFactor = dt; // 时间因子（60fps 下=1）

    if (state.isDragging) {
      // 拖拽模式：弹簧跟随鼠标，阻力随长度递增
      const desired = state.targetPos;
      const diff = desired - state.position;

      // 阻力随长度递增：拉得越长越费劲（弹簧储能感）
      const lengthRatio = Math.min(1, state.position / CONFIG.maxLength);
      const resistanceFactor = 1 - lengthRatio * CONFIG.resistanceBase;
      const effectiveStiffness = CONFIG.dragStiffness * resistanceFactor;

      state.velocity += diff * effectiveStiffness * dtFactor;
      state.velocity *= Math.pow(CONFIG.damping, dtFactor);

      state.position += state.velocity * dtFactor;

      // 边界
      if (state.position >= CONFIG.maxLength) {
        state.position = CONFIG.maxLength;
        if (state.velocity > 0) state.velocity = -state.velocity * 0.2;
      }
      if (state.position <= CONFIG.minLength) {
        state.position = CONFIG.minLength;
        if (state.velocity < 0) state.velocity = 0;
      }
    } else if (state.isLocked) {
      // 锁定：保持不动
      state.velocity *= 0.9;
    } else {
      // 回卷模式：弹簧拉回起始点
      const springForce = -state.position * CONFIG.springK;
      state.velocity += springForce / CONFIG.mass * dtFactor;
      state.velocity *= Math.pow(CONFIG.damping, dtFactor);

      state.position += state.velocity * dtFactor;

      // 末端弹跳 — 尺爪撞击尺口
      if (state.position <= CONFIG.minLength && state.velocity < -CONFIG.bounceMinVel) {
        // 撞击反弹：速度反向并衰减
        state.velocity = -state.velocity * CONFIG.bounceDecay;
        state.position = CONFIG.minLength;
        state.bounceCount = (state.bounceCount || 0) + 1;
        state.bouncing = true;
      }

      // 完全静止条件
      if (state.position <= CONFIG.minLength && Math.abs(state.velocity) < CONFIG.bounceMinVel) {
        state.position = CONFIG.minLength;
        state.velocity = 0;
        state.bouncing = false;
        state.bounceCount = 0;
      }
    }
  }

  // ===== 主循环 =====
  let lastTime = 0;
  function loop(timestamp) {
    if (!state.running) return;

    const dt = Math.min(32, timestamp - lastTime) / 16.67; // 归一化到 60fps
    lastTime = timestamp;

    physicsStep(dt);
    updateTapeLength(state.position);

    state.rafId = requestAnimationFrame(loop);
  }

  // ===== 自定义光标 =====
  function updateCursor(x, y) {
    cursor.style.left = x + 'px';
    cursor.style.top = y + 'px';
  }

  function setCursorState(stateName) {
    cursor.classList.remove('hover', 'grabbed');
    if (stateName) cursor.classList.add(stateName);
  }

  // ===== 尺爪交互 =====
  function getHookCenterX() {
    const rect = tapeHook.getBoundingClientRect();
    return rect.left + rect.width / 2;
  }

  function handleMouseMove(e) {
    state.mouseX = e.clientX;
    state.mouseY = e.clientY;

    if (!CONFIG.reducedMotion) {
      updateCursor(e.clientX, e.clientY);
    }

    if (state.isDragging) {
      // 计算新的目标位置
      const tapeContainer = tapeBlade.parentElement;
      const containerRect = tapeContainer.getBoundingClientRect();
      const newX = e.clientX - containerRect.left - state.dragOffsetX;
      state.targetPos = Math.max(CONFIG.minLength, Math.min(CONFIG.maxLength, newX));
    }
  }

  function handleMouseDown(e) {
    if (e.button !== 0) return;

    // 检查是否点中尺爪
    const hookRect = tapeHook.getBoundingClientRect();
    if (e.clientX >= hookRect.left && e.clientX <= hookRect.right &&
        e.clientY >= hookRect.top && e.clientY <= hookRect.bottom) {
      startDrag(e);
    }
  }

  function handleMouseUp(e) {
    if (state.isDragging) {
      endDrag();
    }
  }

  function startDrag(e) {
    state.isDragging = true;
    state.isLocked = false;
    lockSwitch.classList.remove('locked');

    tapeHook.classList.add('grabbed');
    tapeHook.classList.remove('hovered');
    mouthShadow.classList.remove('hovered');
    setCursorState('grabbed');

    // 计算拖拽偏移（鼠标相对于尺带末端的位置）
    const tapeContainer = tapeBlade.parentElement;
    const containerRect = tapeContainer.getBoundingClientRect();
    state.dragOffsetX = e.clientX - containerRect.left - state.position;
    state.targetPos = state.position;
    state.velocity = 0;
  }

  function endDrag() {
    state.isDragging = false;
    tapeHook.classList.remove('grabbed');
    setCursorState(null);

    // 如果有锁定，不回卷
    if (state.isLocked) {
      state.velocity = 0;
      return;
    }

    // 松手 — 弹簧回卷开始
    // velocity 保留从拖拽获得的惯性
  }

  // ===== 悬停检测 =====
  function checkHover() {
    if (state.isDragging) return;

    const hookRect = tapeHook.getBoundingClientRect();
    const cx = hookRect.left + hookRect.width / 2;
    const cy = hookRect.top + hookRect.height / 2;

    const dx = state.mouseX - cx;
    const dy = state.mouseY - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);

    // 接近检测 — 40px 范围内触发微颤
    if (dist < 40) {
      state.isHovering = true;
      tapeHook.classList.add('hovered');
      mouthShadow.classList.add('hovered');
      setCursorState('hover');
    } else {
      if (state.isHovering) {
        state.isHovering = false;
        tapeHook.classList.remove('hovered');
        mouthShadow.classList.remove('hovered');
        setCursorState(null);
      }
    }
  }

  // hover 检测使用独立的 rAF（轻量）
  function hoverLoop() {
    checkHover();
    requestAnimationFrame(hoverLoop);
  }

  // ===== 锁定开关 =====
  function toggleLock() {
    state.isLocked = !state.isLocked;
    lockSwitch.classList.toggle('locked', state.isLocked);

    // 显示提示
    const indicator = lockIndicator;
    indicator.textContent = state.isLocked ? '已锁定' : '已释放';
    indicator.classList.add('show');
    clearTimeout(toggleLock._t);
    toggleLock._t = setTimeout(() => {
      indicator.classList.remove('show');
    }, 1200);

    if (state.isLocked) {
      // 锁定：停止运动，固定当前位置
      state.velocity = 0;
    } else {
      // 解锁且非拖拽中 → 唰地回卷
      if (!state.isDragging) {
        // 给一个初速度（拨开关的"释放"感）
        state.velocity = -2;
      }
    }
  }

  lockSwitch.addEventListener('mousedown', (e) => {
    e.stopPropagation();
    toggleLock();
  });

  // ===== 页面可见性 =====
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      state.running = false;
      if (state.rafId) cancelAnimationFrame(state.rafId);
    } else {
      state.running = true;
      lastTime = performance.now();
      state.rafId = requestAnimationFrame(loop);
    }
  });

  // ===== 全局事件 =====
  document.addEventListener('mousemove', handleMouseMove);
  document.addEventListener('mousedown', handleMouseDown);
  document.addEventListener('mouseup', handleMouseUp);
  document.addEventListener('mouseleave', () => {
    cursor.classList.add('hidden');
  });
  document.addEventListener('mouseenter', () => {
    cursor.classList.remove('hidden');
  });

  // ===== 初始化 =====
  function init() {
    // 尺带初始长度设置
    tapeBlade.style.width = CONFIG.minLength + 'px';
    resizeCanvas();
    updateTapeLength(CONFIG.minLength);

    // 光标初始位置在屏幕中央
    const w = window.innerWidth / 2;
    const h = window.innerHeight / 2;
    state.mouseX = w;
    state.mouseY = h;
    updateCursor(w, h);

    // 启动主循环
    lastTime = performance.now();
    state.rafId = requestAnimationFrame(loop);

    // 启动 hover 检测
    hoverLoop();

    // 显示操作提示（延迟）
    setTimeout(() => hint.classList.add('show'), 800);
    // 3 秒后淡出
    setTimeout(() => hint.classList.remove('show'), 5000);

    // 窗口大小变化重绘
    window.addEventListener('resize', () => {
      canvasReady = false;
      requestAnimationFrame(resizeCanvas);
    });
  }

  // 页面完全加载后初始化
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // 清理
  window.addEventListener('beforeunload', () => {
    state.running = false;
    if (state.rafId) cancelAnimationFrame(state.rafId);
  });

})();
</script>
</body>
</html>

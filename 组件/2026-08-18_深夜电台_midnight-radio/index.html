<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深夜电台 · 老式收音机工作台</title>
<meta name="creative-medium" content="interactive-prototype">
<style>
/* =========================================================
   深夜电台 · 老式收音机工作台 — 拟物化交互实验室
   配色：胡桃木 #4A3226 / 深木色 #2C1F16 / 黄铜 #C9A227
        墨绿辉光 #24423C / 暖橙 #E8A54B / 奶白 #F2E8D5
   ========================================================= */

:root {
  --walnut: #4A3226;
  --walnut-light: #5C3E2E;
  --walnut-dark: #2C1F16;
  --walnut-deep: #1a120b;
  --brass: #C9A227;
  --brass-light: #E0BB4A;
  --brass-dark: #8B7420;
  --brass-shadow: #6b5615;
  --magic-green: #4ade80;
  --magic-green-deep: #24423C;
  --magic-glow: #6ef5a0;
  --warm-orange: #E8A54B;
  --warm-orange-deep: #c4862b;
  --cream: #F2E8D5;
  --cream-dim: #c9bfae;
  --ivory: #e8dcc4;
  --chassis-top: #3a281d;
  --chassis-bottom: #1e140d;
  --panel-cream: #d9ccb3;
  --panel-cream-dark: #8a7d66;
  --dial-bg: #2b1d12;
  --dial-line: #c9a66b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #0d0906;
  color: var(--cream);
  user-select: none;
  -webkit-user-select: none;
  cursor: none;
}

/* 自定义光标 */
.cursor {
  position: fixed;
  left: 50%; top: 50%;
  width: 32px; height: 32px;
  margin: -16px 0 0 -16px;
  pointer-events: none;
  z-index: 9999;
  transition: width .25s cubic-bezier(.2, .8, .2, 1),
              height .25s cubic-bezier(.2, .8, .2, 1),
              margin .25s cubic-bezier(.2, .8, .2, 1),
              border-color .2s ease;
}
.cursor::before {
  content: "";
  position: absolute; inset: 0;
  border: 2px solid var(--cream);
  border-radius: 50%;
  box-shadow: 0 0 12px rgba(242, 232, 213, .6),
              0 0 24px rgba(232, 165, 75, .3);
}
.cursor::after {
  content: "";
  position: absolute;
  left: 50%; top: 50%;
  width: 6px; height: 6px;
  margin: -3px 0 0 -3px;
  background: var(--warm-orange);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--warm-orange),
              0 0 16px rgba(232, 165, 75, .6);
}
.cursor.hover {
  width: 48px; height: 48px;
  margin: -24px 0 0 -24px;
}
.cursor.hover::before {
  border-color: var(--brass-light);
  box-shadow: 0 0 16px rgba(201, 162, 39, .7),
              0 0 32px rgba(201, 162, 39, .4);
}
.cursor.hover::after {
  background: var(--brass);
  box-shadow: 0 0 10px var(--brass-light),
              0 0 20px var(--brass);
}
.cursor.click {
  width: 24px; height: 24px;
  margin: -12px 0 0 -12px;
  transition-duration: .08s;
}
.cursor.drag {
  width: 56px; height: 56px;
  margin: -28px 0 0 -28px;
}
.cursor.drag::before {
  border-color: var(--magic-green);
  border-style: dashed;
  box-shadow: 0 0 20px rgba(110, 245, 160, .6);
}
.cursor.drag::after {
  background: var(--magic-green);
  box-shadow: 0 0 12px var(--magic-glow);
}

/* 点击涟漪 */
.cursor-ripple {
  position: fixed;
  width: 0; height: 0;
  border: 2px solid var(--cream);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  opacity: 0;
  animation: ripple-out .6s ease-out forwards;
}
@keyframes ripple-out {
  0%   { width: 0; height: 0; margin: 0; opacity: .8; border-width: 2px; }
  100% { width: 60px; height: 60px; margin: -30px 0 0 -30px; opacity: 0; border-width: 1px; }
}

/* 场景容器 */
.scene {
  position: relative;
  width: 100%; height: 100%;
  background:
    radial-gradient(ellipse at 50% 20%, #2a1f16 0%, #120b07 55%, #070503 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 1400px;
}

/* 桌面 */
.desk {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 22%;
  background:
    linear-gradient(180deg,
      #3a281c 0%,
      #2c1f15 30%,
      #1e150c 100%);
  box-shadow:
    inset 0 2px 0 rgba(255, 220, 180, .08),
    inset 0 30px 60px rgba(0, 0, 0, .4);
}
.desk::before {
  content: "";
  position: absolute; inset: 0;
  background-image:
    repeating-linear-gradient(92deg,
      transparent 0px,
      rgba(0, 0, 0, .08) 1px,
      transparent 2px,
      transparent 80px),
    repeating-linear-gradient(88deg,
      transparent 0px,
      rgba(255, 200, 150, .02) 1px,
      transparent 3px,
      transparent 120px);
  pointer-events: none;
}

/* 电台标题 */
.station-label {
  position: absolute;
  top: 40px; left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 20;
}
.station-label .title {
  font-size: 28px;
  font-weight: 300;
  letter-spacing: 8px;
  color: var(--cream);
  text-shadow: 0 2px 8px rgba(0, 0, 0, .6);
}
.station-label .subtitle {
  font-size: 12px;
  font-weight: 300;
  letter-spacing: 4px;
  color: var(--brass);
  margin-top: 6px;
  opacity: .7;
}

/* 提示文字 */
.tip {
  position: absolute;
  bottom: 30px; left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  color: var(--cream-dim);
  letter-spacing: 2px;
  opacity: .5;
  z-index: 20;
}

/* ======================================================
   收音机机身
   ====================================================== */
.radio {
  position: relative;
  width: 720px;
  height: 440px;
  transform: translateY(-10px);
  z-index: 10;
}

/* 机身上部斜面（顶盖） */
.radio-top {
  position: absolute;
  top: -12px; left: 20px; right: 20px;
  height: 30px;
  background: linear-gradient(180deg, #5C3E2E, #3a281d);
  border-radius: 6px 6px 0 0;
  box-shadow:
    inset 0 1px 0 rgba(255, 220, 180, .15),
    0 -2px 8px rgba(0, 0, 0, .4);
}

/* 机身主体 */
.radio-body {
  position: absolute;
  top: 16px; left: 0; right: 0; bottom: 0;
  border-radius: 12px 12px 8px 8px;
  background:
    linear-gradient(180deg,
      var(--chassis-top) 0%,
      var(--walnut) 15%,
      var(--walnut-dark) 85%,
      var(--chassis-bottom) 100%);
  box-shadow:
    0 20px 60px rgba(0, 0, 0, .7),
    0 4px 12px rgba(0, 0, 0, .5),
    inset 0 1px 0 rgba(255, 220, 180, .12),
    inset 0 -2px 0 rgba(0, 0, 0, .4);
}

/* 木纹纹理 */
.radio-body::before {
  content: "";
  position: absolute; inset: 0;
  border-radius: inherit;
  background-image:
    repeating-linear-gradient(91deg,
      rgba(0, 0, 0, .06) 0px,
      transparent 1px,
      transparent 40px,
      rgba(255, 200, 150, .03) 41px,
      transparent 42px,
      transparent 90px),
    repeating-linear-gradient(89deg,
      rgba(139, 94, 52, .08) 0px,
      transparent 2px,
      transparent 140px);
  pointer-events: none;
  opacity: .7;
}

/* 前面板（奶油色） */
.front-panel {
  position: absolute;
  top: 28px; left: 28px; right: 28px; bottom: 28px;
  border-radius: 6px;
  background:
    linear-gradient(180deg,
      var(--panel-cream) 0%,
      #c4b69a 100%);
  box-shadow:
    inset 0 2px 4px rgba(0, 0, 0, .2),
    inset 0 -1px 0 rgba(255, 255, 255, .15),
    0 1px 0 rgba(255, 240, 210, .3);
  overflow: hidden;
}
.front-panel::before {
  content: "";
  position: absolute; inset: 0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.1) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(0,0,0,.08) 0%, transparent 50%);
  pointer-events: none;
}

/* 面板上的分区标题 */
.panel-title {
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--walnut-dark);
  text-transform: uppercase;
  font-weight: 600;
  opacity: .7;
}

/* ======================================================
   ① 拉绳电源开关（左上）
   ====================================================== */
.pull-cord {
  position: absolute;
  top: 0; left: 36px;
  width: 60px;
  height: 100%;
  z-index: 5;
}
.pull-cord .knob-base {
  position: absolute;
  top: -4px; left: 50%;
  transform: translateX(-50%);
  width: 36px; height: 18px;
  background: linear-gradient(180deg, var(--brass-light), var(--brass-dark));
  border-radius: 4px 4px 0 0;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .4),
    inset 0 -1px 0 rgba(0, 0, 0, .3),
    0 2px 4px rgba(0, 0, 0, .3);
}
.pull-cord .cord {
  position: absolute;
  top: 14px; left: 50%;
  width: 2px;
  transform: translateX(-50%);
  background: linear-gradient(180deg, #8a7235, #c9a227 30%, #8a7235 70%, #c9a227);
  border-radius: 1px;
  transform-origin: top center;
  /* 长度动态控制 */
  height: 80px;
}
.pull-cord .tassel {
  position: absolute;
  left: 50%;
  width: 20px; height: 30px;
  transform: translateX(-50%);
  bottom: -28px;
  background:
    radial-gradient(ellipse at 50% 20%, var(--brass-light), var(--brass-dark));
  border-radius: 50% 50% 45% 45% / 30% 30% 70% 70%;
  box-shadow:
    inset 0 2px 2px rgba(255, 255, 255, .4),
    inset 0 -2px 2px rgba(0, 0, 0, .3),
    0 3px 6px rgba(0, 0, 0, .4);
  cursor: none;
}
.pull-cord .tassel::before {
  content: "";
  position: absolute;
  top: -3px; left: 50%;
  transform: translateX(-50%);
  width: 6px; height: 4px;
  background: var(--brass-dark);
  border-radius: 2px;
}
.pull-cord .label {
  position: absolute;
  bottom: -4px; left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  color: var(--walnut-dark);
  letter-spacing: 1px;
  opacity: .6;
  white-space: nowrap;
}

/* ======================================================
   ② 魔术眼电子管（右上）
   ====================================================== */
.magic-eye {
  position: absolute;
  top: 10px; right: 36px;
  width: 120px; height: 100px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.magic-eye .tube {
  position: relative;
  width: 90px; height: 72px;
  background:
    radial-gradient(ellipse at 50% 70%, #111 0%, #000 100%);
  border-radius: 45px 45px 40px 40px / 36px 36px 32px 32px;
  box-shadow:
    inset 0 4px 8px rgba(255, 255, 255, .08),
    inset 0 -2px 4px rgba(0, 0, 0, .6),
    0 2px 4px rgba(0, 0, 0, .4);
  overflow: hidden;
}
.magic-eye .tube::before {
  /* 玻璃反光 */
  content: "";
  position: absolute;
  top: 4px; left: 8px;
  width: 20px; height: 30px;
  background: linear-gradient(180deg, rgba(255,255,255,.12), transparent);
  border-radius: 50%;
  pointer-events: none;
}
.magic-eye .glow {
  position: absolute;
  left: 50%; top: 55%;
  transform: translate(-50%, -50%);
  width: 60px; height: 30px;
  background:
    radial-gradient(ellipse at center, var(--magic-glow) 0%, var(--magic-green) 30%, transparent 70%);
  border-radius: 50%;
  filter: blur(1px);
  opacity: 0.15;
  transition: opacity .3s ease;
}
.magic-eye.powered .glow { opacity: 0.9; }

/* 猫眼扇形 */
.magic-eye .eye-petal {
  position: absolute;
  left: 50%; top: 50%;
  width: 38px; height: 38px;
  margin: -19px 0 0 -19px;
  border-radius: 50%;
  clip-path: polygon(50% 50%, 100% 0, 100% 100%);
  background: conic-gradient(from 0deg, var(--magic-glow) 0deg, transparent 60deg);
  filter: blur(.5px);
  opacity: 0;
  transition: opacity .3s ease;
}
.magic-eye.powered .eye-petal { opacity: .95; }

.magic-eye .eye-petal.left {
  transform: scaleX(-1);
  clip-path: polygon(50% 50%, 0 0, 0 100%);
}

/* 信号强度：开合角度由 --eye-angle 控制 */
.magic-eye .eye-left {
  position: absolute;
  left: 50%; top: 50%;
  width: 40px; height: 28px;
  margin: -14px 0 0 -40px;
  background: linear-gradient(90deg, transparent, var(--magic-glow));
  border-radius: 50% 0 0 50%;
  transform-origin: right center;
  transform: scaleX(0.3);
  filter: blur(0.5px);
  opacity: 0;
}
.magic-eye.powered .eye-left { opacity: 1; }

.magic-eye .eye-right {
  position: absolute;
  left: 50%; top: 50%;
  width: 40px; height: 28px;
  margin: -14px 0 0 0;
  background: linear-gradient(-90deg, transparent, var(--magic-glow));
  border-radius: 0 50% 50% 0;
  transform-origin: left center;
  transform: scaleX(0.3);
  filter: blur(0.5px);
  opacity: 0;
}
.magic-eye.powered .eye-right { opacity: 1; }

/* 暗部三角（阴影区） */
.magic-eye .shadow-tri {
  position: absolute;
  left: 50%; top: 50%;
  width: 42px; height: 30px;
  margin: -15px 0 0 -21px;
  background: #0a1a12;
  clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
  transform-origin: center bottom;
  transform: scaleY(0.6);
  opacity: 0;
}
.magic-eye.powered .shadow-tri { opacity: .85; }

.magic-eye .label {
  margin-top: 6px;
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--walnut-dark);
  opacity: .6;
}

/* ======================================================
   ③ 调谐刻度盘（中上部横跨）
   ====================================================== */
.tuning-dial {
  position: absolute;
  top: 110px; left: 36px; right: 36px;
  height: 80px;
  background:
    linear-gradient(180deg, #1a110a 0%, #2b1d12 50%, #1a110a 100%);
  border-radius: 4px;
  box-shadow:
    inset 0 2px 4px rgba(0, 0, 0, .6),
    inset 0 -1px 0 rgba(255, 200, 150, .1);
  overflow: hidden;
}

/* 刻度盘玻璃 */
.tuning-dial .glass {
  position: absolute; inset: 0;
  background: linear-gradient(180deg,
    rgba(255, 220, 180, .06) 0%,
    transparent 40%,
    transparent 60%,
    rgba(0, 0, 0, .15) 100%);
  pointer-events: none;
  z-index: 3;
}
.tuning-dial .glass::before {
  content: "";
  position: absolute;
  top: 2px; left: 4px;
  width: 30%; height: 30%;
  background: linear-gradient(135deg, rgba(255,255,255,.1), transparent);
  border-radius: 4px;
}

/* 刻度带 */
.tuning-dial .scale {
  position: absolute;
  top: 18px;
  height: 36px;
  left: -50%;
  width: 200%;
  will-change: transform;
}
.tuning-dial .scale-tick {
  position: absolute;
  top: 0;
  width: 1px;
  background: var(--warm-orange);
  opacity: .4;
}
.tuning-dial .scale-tick.major {
  height: 18px;
  opacity: .9;
}
.tuning-dial .scale-tick.minor {
  height: 10px;
  top: 4px;
  opacity: .5;
}
.tuning-dial .scale-num {
  position: absolute;
  top: 22px;
  font-size: 9px;
  color: var(--warm-orange);
  opacity: .85;
  transform: translateX(-50%);
  font-family: "Courier New", monospace;
  letter-spacing: -0.5px;
  text-shadow: 0 0 4px rgba(232, 165, 75, .5);
}

/* 波段频率带 */
.dial-band {
  position: absolute;
  left: 30px; right: 30px;
  height: 2px;
  background: var(--warm-orange);
  opacity: .4;
  border-radius: 1px;
}
.dial-band.mhz { top: 6px; }
.dial-band.khz { top: 52px; }
.dial-band-label {
  position: absolute;
  font-size: 8px;
  color: var(--warm-orange);
  opacity: .6;
  top: -10px;
  letter-spacing: 1px;
}
.dial-band-label.right {
  right: 0;
  top: auto;
  bottom: -14px;
}

/* 指针 */
.tuning-dial .needle {
  position: absolute;
  top: 6px;
  left: 50%;
  transform: translateX(-50%);
  width: 2px;
  height: 62px;
  background: linear-gradient(180deg,
    var(--brass-light) 0%,
    var(--brass) 50%,
    var(--brass-dark) 100%);
  z-index: 4;
  box-shadow:
    0 0 6px rgba(201, 162, 39, .8),
    0 0 12px rgba(232, 165, 75, .4);
}
.tuning-dial .needle::before {
  content: "";
  position: absolute;
  top: -3px; left: 50%;
  transform: translateX(-50%);
  width: 8px; height: 8px;
  background: var(--brass);
  border-radius: 50%;
  box-shadow: 0 0 4px var(--brass-light);
}

/* 电台标记 */
.station-mark {
  position: absolute;
  top: 44px;
  width: 3px; height: 3px;
  background: var(--cream);
  border-radius: 50%;
  transform: translateX(-50%);
  opacity: .6;
  box-shadow: 0 0 3px rgba(242, 232, 213, .6);
}

/* 频率数字显示 */
.freq-display {
  position: absolute;
  bottom: 6px; left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  font-family: "Courier New", monospace;
  color: var(--warm-orange);
  letter-spacing: 2px;
  text-shadow: 0 0 6px rgba(232, 165, 75, .6);
  z-index: 4;
}

/* 整机背光效果（开机时） */
.radio.powered .tuning-dial {
  box-shadow:
    inset 0 2px 4px rgba(0, 0, 0, .6),
    inset 0 -1px 0 rgba(255, 200, 150, .1),
    0 0 20px rgba(232, 165, 75, .15);
}
.radio.powered .front-panel {
  box-shadow:
    inset 0 2px 4px rgba(0, 0, 0, .2),
    inset 0 -1px 0 rgba(255, 255, 255, .15),
    0 1px 0 rgba(255, 240, 210, .3),
    0 0 30px rgba(232, 165, 75, .08);
}

/* 暖光扩散（整机氛围） */
.warm-glow {
  position: absolute;
  top: 50%; left: 50%;
  width: 900px; height: 600px;
  margin: -300px 0 0 -450px;
  background: radial-gradient(ellipse at center,
    rgba(232, 165, 75, .18) 0%,
    rgba(232, 165, 75, .06) 30%,
    transparent 60%);
  pointer-events: none;
  opacity: 0;
  transition: opacity 1.2s ease;
  z-index: 1;
}
.radio.powered ~ .warm-glow,
.warm-glow.on { opacity: 1; }

/* ======================================================
   ④ 波段拨杆（左下）
   ====================================================== */
.band-switch {
  position: absolute;
  bottom: 26px; left: 46px;
  width: 80px; height: 80px;
}
.band-switch .title {
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--walnut-dark);
  opacity: .7;
}
.band-switch .base {
  position: absolute;
  left: 50%; top: 20px;
  transform: translateX(-50%);
  width: 56px; height: 22px;
  background:
    linear-gradient(180deg, var(--brass-dark), var(--brass-shadow));
  border-radius: 4px;
  box-shadow:
    inset 0 2px 2px rgba(0, 0, 0, .4),
    0 1px 0 rgba(255, 240, 200, .4);
}
.band-switch .base::before {
  content: "";
  position: absolute;
  top: 4px; left: 4px; right: 4px; bottom: 4px;
  background: #1a1208;
  border-radius: 2px;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, .8);
}
.band-switch .lever {
  position: absolute;
  left: 50%; top: 12px;
  width: 8px; height: 32px;
  margin-left: -4px;
  background:
    linear-gradient(90deg, var(--brass-dark), var(--brass-light) 50%, var(--brass-dark));
  border-radius: 4px;
  transform-origin: bottom center;
  transform: rotate(-25deg);
  transition: none;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .3),
    0 2px 4px rgba(0, 0, 0, .4);
  cursor: none;
  z-index: 2;
}
.band-switch .lever::before {
  /* 拨杆顶部握柄 */
  content: "";
  position: absolute;
  top: -4px; left: -3px;
  width: 14px; height: 10px;
  background: linear-gradient(180deg, var(--brass-light), var(--brass-dark));
  border-radius: 3px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.4),
    inset 0 -1px 0 rgba(0,0,0,.3);
}
.band-switch .labels {
  position: absolute;
  bottom: 14px; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 4px;
  font-size: 9px;
  font-family: "Courier New", monospace;
  color: var(--walnut-dark);
  opacity: .7;
  letter-spacing: 1px;
}

/* 波段指示灯 */
.band-indicators {
  position: absolute;
  top: 46px; left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
}
.band-dot {

<script>
/* =========================================================
   深夜电台 · 老式收音机工作台

(function () {
  'use strict';

  // ========== 工具函数 ==========
  const $ = (id) => document.getElementById(id);

    cursorTargetY = e.clientY;

  // 点击涟漪

    if (reduceMotion) return;
    const r = document.createElement('div');
    r.className = 'cursor-ripple';
    r.style.left = x + 'px';
    r.style.top = y + 'px';
    document.body.appendChild(r);
    setTimeout(() => r.remove(), 650);
  }

  document.addEventListener('mousedown', (e) => {
    cursor.classList.add('click');
    spawnRipple(e.clientX, e.clientY);
  });
  document.addEventListener('mouseup', () => {
    cursor.classList.remove('click');
  });

  // 悬停交互元素时改变形态
  document.querySelectorAll('[data-cursor]').forEach(el => {
    el.addEventListener('mouseenter', () => setCursorState(el.dataset.cursor));
    el.addEventListener('mouseleave', () => setCursorState(null));
  });

  // ========== 物理引擎 ==========
  // 基于 RAF 积分器的弹簧/惯性/阻尼系统
  const physics = {
    items: [],
    rafId: null,
    running: false,
    lastTime: 0,

    add(item) {
      if (!this.items.includes(item)) this.items.push(item);
      if (!this.running) this.start();
    },
    remove(item) {
      const i = this.items.indexOf(item);
      if (i >= 0) this.items.splice(i, 1);
      if (this.items.length === 0) this.stop();
    },
    start() {
      if (this.running) return;
      this.running = true;
      this.lastTime = performance.now();
      const loop = (t) => {
        if (!this.running) return;
        const dt = Math.min(32, t - this.lastTime) / 1000; // 秒，最大 dt 防跳变
        this.lastTime = t;
        for (let i = 0; i < this.items.length; i++) {
          this.items[i].step(dt);
        }
        this.rafId = requestAnimationFrame(loop);
      };
      this.rafId = requestAnimationFrame(loop);
    },
    stop() {
      this.running = false;
      if (this.rafId) {
        cancelAnimationFrame(this.rafId);
        this.rafId = null;
      }
    },
    pause() {
      if (this.running) {
        this.stop();
        this._wasRunning = true;
      }
    },
    resume() {
      if (this._wasRunning && this.items.length > 0) {
        this._wasRunning = false;
        this.lastTime = performance.now();
        this.start();

  // 弹簧积分器：向目标值 spring.target 收敛，带速度和阻尼
  function makeSpring(opts) {
    return {
      value: opts.value ?? 0,
      target: opts.target ?? 0,
      velocity: opts.velocity ?? 0,
      stiffness: opts.stiffness ?? 300,   // 弹性系数 k
      damping: opts.damping ?? 20,        // 阻尼系数 c
      mass: opts.mass ?? 1,
      onUpdate: opts.onUpdate || null,
      min: opts.min ?? -Infinity,
      max: opts.max ?? Infinity,

      step(dt) {
        // Hooke's law: F = -kx - cv + f_ext (外力)
        const x = this.value - this.target;
        const a = (-this.stiffness * x - this.damping * this.velocity) / this.mass;
        this.velocity += a * dt;
        this.value += this.velocity * dt;
        // 边界钳制（带反弹）
        if (this.value < this.min) {
          this.value = this.min;
          if (this.velocity < 0) this.velocity = -this.velocity * 0.3;
        }
        if (this.value > this.max) {
          this.value = this.max;
          if (this.velocity > 0) this.velocity = -this.velocity * 0.3;
        }
        if (this.onUpdate) this.onUpdate(this.value, this.velocity);

      kick(impulse) {

      },
      setTarget(t) {

        if (this.value < this.min) {
          this.value = this.min;
          if (this.velocity < 0) this.velocity = 0;
        }
        if (this.value > this.max) {
          this.value = this.max;
          if (this.velocity > 0) this.velocity = 0;
        }
        if (Math.abs(this.velocity) < 0.01) this.velocity = 0;
        if (this.onUpdate) this.onUpdate(this.value, this.velocity);
      },
      setValue(v, trackVelocity) {
        if (trackVelocity) {
          const now = performance.now();
          const dt = (now - this._lastTime) / 1000;
          if (dt > 0 && dt < 0.1) {
            this.velocity = (v - this._lastValue) / dt;
          }
          this._lastValue = v;
          this._lastTime = now;
        }
        this.value = clamp(v, this.min, this.max);
        if (this.onUpdate) this.onUpdate(this.value, this.velocity);
      }
    };
  }

  // ========== 页面可见性暂停 ==========
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      physics.pause();
    } else {
      physics.lastTime = performance.now();
      physics.resume();
    }
  });

  // 卸载时清理
  window.addEventListener('beforeunload', () => {
    physics.stop();
  });

  // ========== 整机状态 ==========
  const state = {
    powered: false,
    volume: 0.35,         // 0 - 1
    volumeAngle: -85,     // -135 到 135 度
    tuning: 0.5,          // 0 - 1 (波段内位置)
    tuningAngle: 0,       // -180 到 180
    band: 1,              // 0=MW, 1=FM, 2=SW
    antenna: 0.1,         // 0 - 1 (伸出比例)
    signalStrength: 0,    // 0 - 1 计算值
    eyeOpenness: 0.1,     // 0 - 1 (猫眼开合)
    cordY: 0,             // 拉绳位移 px
    pullY: 0,             // 拖拽中位移
    leverAngle: -25,      // 拨杆角度
    vuValue: 0,           // VU 表 0-1
    vuTarget: 0,
  };

  const radio = $('radio');

  // ========== ③ 调谐刻度生成 ==========
  const scaleEl = $('scale');
  const freqDisplay = $('freqDisplay');

  // 波段频率范围
  const bands = [
    { name: 'MW', unit: 'KHz', min: 530, max: 1600, step: 10, stations: [640, 880, 1030, 1280, 1500] },
    { name: 'FM', unit: 'MHz', min: 88, max: 108, step: 0.5, stations: [91.5, 94.5, 97.2, 101.3, 104.7, 107.1] },
    { name: 'SW', unit: 'MHz', min: 3.5, max: 18, step: 0.5, stations: [5.9, 7.4, 9.6, 12.1, 15.4, 17.8] },
  ];

  function buildScale(bandIdx) {
    const band = bands[bandIdx];
    scaleEl.innerHTML = '';
    const range = band.max - band.min;
    const totalPx = scaleEl.offsetWidth || 648; // fallback
    const actualW = 648; // scale width

    // 主刻度
    const majorCount = band.name === 'FM' ? 9 : band.name === 'MW' ? 11 : 8;
    const majorStep = range / majorCount;
    for (let i = 0; i <= majorCount; i++) {
      const val = band.min + majorStep * i;
      const x = (val - band.min) / range * actualW;
      const tick = document.createElement('div');
      tick.className = 'scale-tick major';
      tick.style.left = x + 'px';
      tick.style.height = '18px';
      scaleEl.appendChild(tick);

      const num = document.createElement('div');
      num.className = 'scale-num';
      num.style.left = x + 'px';
      num.textContent = band.name === 'FM' ? val.toFixed(1) : Math.round(val);
      scaleEl.appendChild(num);
    }
    // 次刻度
    for (let i = 0; i < majorCount * 5; i++) {
      if (i % 5 === 0) continue;
      const val = band.min + majorStep * i / 5;
      if (val > band.max) break;
      const x = (val - band.min) / range * actualW;
      const tick = document.createElement('div');
      tick.className = 'scale-tick minor';
      tick.style.left = x + 'px';
      tick.style.height = '8px';
      tick.style.top = '5px';
      scaleEl.appendChild(tick);
    }
  }

  function updateDial() {
    const band = bands[state.band];
    const freq = band.min + state.tuning * (band.max - band.min);
    // 刻度盘偏移：指针在中间，刻度带向左移动
    const offset = state.tuning * 50;  // 0-50%
    scaleEl.style.transform = `translateX(${-offset}%)`;

    const decimals = band.name === 'MW' ? 0 : (band.name === 'FM' ? 1 : 1);
    freqDisplay.textContent = freq.toFixed(decimals) + ' ' + band.unit;

    // 计算信号强度：离最近电台的距离
    let nearestDist = Infinity;
    for (const s of band.stations) {
      const d = Math.abs(freq - s);
      if (d < nearestDist) nearestDist = d;
    }
    const range = band.max - band.min;
    const signalPeak = 1 - (nearestDist / (range * 0.03));
    const baseSignal = 0.1 + state.antenna * 0.3;
    const signal = state.powered
      ? clamp(baseSignal + signalPeak * 0.6, 0, 1)
      : 0;
    state.signalStrength = signal;
    state.eyeOpenness = signal;

    updateMagicEye();
    updateSignalBars();
    updateVUTarget();
  }

  // ========== ② 魔术眼 ==========
  const eyeLeft = $('eyeLeft');
  const eyeRight = $('eyeRight');
  const eyeShadow = $('eyeShadow');
  const magicEye = $('magicEye');

  function updateMagicEye() {
    if (!state.powered) {
      magicEye.classList.remove('powered');
      return;
    }
    magicEye.classList.add('powered');
    // openness = 1 完全张开（信号强）→ scaleX=1，阴影三角小
    const open = state.eyeOpenness;
    const scaleL = 0.2 + open * 0.8;
    const scaleR = 0.2 + open * 0.8;
    eyeLeft.style.transform = `scaleX(${scaleL})`;
    eyeRight.style.transform = `scaleX(${scaleR})`;
    eyeShadow.style.transform = `scaleY(${1 - open * 0.7})`;

    // 辉光强度
    const glow = magicEye.querySelector('.glow');
    if (glow) glow.style.opacity = 0.4 + open * 0.5;
  }

  // ========== 信号强度条 ==========
  const signalBars = $('signalBars').querySelectorAll('.signal-bar');
  function updateSignalBars() {
    const s = state.powered ? state.signalStrength : 0;
    const count = Math.round(s * 5);
    signalBars.forEach((bar, i) => {
      bar.classList.toggle('on', i < count);
    });
  }

  // ========== ⑤ VU 表 ==========
  const vuNeedle = $('vuNeedle');
  const vuMeterScale = $('meterScale');

  // 生成 VU 刻度
  function buildVUScale() {
    vuMeterScale.innerHTML = '';
    // -20 到 +3 dB，共 23 dB，弧形
    const marks = [-20, -10, -5, -2, 0, 1, 2, 3];
    const total = 110; // 度（-55 到 +55）
    marks.forEach(db => {
      const ratio = (db + 20) / 23;
      const x = ratio * 100;
      const tick = document.createElement('div');
      tick.className = 'meter-tick ' + (db % 5 === 0 || db === 0 ? 'major' : 'minor');
      tick.style.left = x + '%';
      vuMeterScale.appendChild(tick);
      if (db % 10 === 0 || db === 0) {
        const lab = document.createElement('div');
        lab.className = 'meter-label';
        lab.style.left = x + '%';
        lab.textContent = (db > 0 ? '+' : '') + db;
        vuMeterScale.appendChild(lab);
      }
    });
  }
  buildVUScale();

  // VU 表用弹簧物理
  const vuSpring = makeSpring({
    value: 0,
    target: 0,
    stiffness: 80,
    damping: 6,
    onUpdate(v) {
      // v 0-1 → -55deg 到 +55deg（超出到 +60 表示红区）
      const deg = -55 + v * 120;
      vuNeedle.style.transform = `rotate(${deg}deg)`;
    }
  });

  function updateVUTarget() {
    if (!state.powered) {
      vuSpring.target = 0;
      return;
    }
    // 基础音量 + 信号带来的摆动
    const base = state.volume * 0.7;
    // 信号强 → VU 摆动大，模拟节目电平
    const wobble = Math.random() * 0.15 * state.signalStrength;
    const noise = Math.sin(performance.now() / 200) * 0.03 * state.volume;
    vuSpring.target = clamp(base + wobble + noise, 0, 1.05);
  }

  // 每隔一段时间更新 VU 目标（模拟音频）
  let vuTimer = null;
  function startVUMeter() {
    if (vuTimer) clearInterval(vuTimer);
    vuTimer = setInterval(() => {
      if (state.powered) updateVUTarget();
      else {
        vuSpring.target = 0;
      }
    }, 120);
  }

  // ========== ① 拉绳电源开关 ==========
  const tassel = $('tassel');
  const cord = $('cord');
  let cordDragging = false;
  let cordStartY = 0;
  let cordMouseStartY = 0;

  // 拉绳弹簧
  const cordSpring = makeSpring({
    value: 0,
    target: 0,
    stiffness: 400,
    damping: 18,
    mass: 0.8,
    min: 0,
    max: 120,
    onUpdate(v) {
      state.cordY = v;
      cord.style.height = (80 + v) + 'px';
      // 绳索摆动（轻微）
      const sway = Math.sin(performance.now() / 300 + v * 0.05) * 1.5 * (1 - v / 120);
      cord.style.transform = `translateX(calc(-50% + ${sway}px)) rotate(${sway * 0.3}deg)`;
    }
  });

  function togglePower() {
    state.powered = !state.powered;
    if (state.powered) {
      radio.classList.add('powered');
      $('warmGlow').classList.add('on');
      // 通电渐亮
      setTimeout(() => {
        updateDial();
        updateMagicEye();
        updateSignalBars();
      }, 200);
      startVUMeter();
    } else {
      radio.classList.remove('powered');
      $('warmGlow').classList.remove('on');
      updateMagicEye();
      updateSignalBars();
      if (vuTimer) { clearInterval(vuTimer); vuTimer = null; }
      vuSpring.target = 0;
    }
  }

  // 拉绳拖拽
  tassel.addEventListener('mousedown', (e) => {
    e.preventDefault();
    cordDragging = true;
    cordMouseStartY = e.clientY;
    cordStartY = cordSpring.value;
    cordSpring.dragging = true;
    setCursorState('drag');
    // 移除弹簧自动回归
    physics.remove(cordSpring);
  });

  document.addEventListener('mousemove', (e) => {
    if (cordDragging) {
      const dy = e.clientY - cordMouseStartY;
      const y = clamp(cordStartY + dy, 0, 120);
      state.cordY = y;
      cord.style.height = (80 + y) + 'px';
    }
  }, { passive: true });

  document.addEventListener('mouseup', (e) => {
    if (cordDragging) {
      cordDragging = false;
      // 判断是否拉到底触发
      const wasPulled = state.cordY > 60;
      // 弹簧回弹
      cordSpring.value = state.cordY;
      cordSpring.velocity = 0;
      cordSpring.target = 0;
      physics.add(cordSpring);
      // 若拉到底则切换电源（在回弹过程中触发）
      if (wasPulled) {
        setTimeout(() => togglePower(), 150);
        // 给予一个"咔哒"反弹
        setTimeout(() => {
          cordSpring.kick(-200);
        }, 150);
      }
      setTimeout(() => setCursorState('drag'), 50);
    }
  });

  // ========== ⑥ 天线伸缩杆 ==========
  const antenna = $('antenna');
  const antennaSections = $('antennaSections').querySelectorAll('.antenna-sec');
  const antennaBall = $('antennaBall');
  let antennaDragging = false;
  let antennaStartY = 0;
  let antennaMouseStartY = 0;

  const antennaSpring = makeSpring({
    value: 0.1,
    target: 0.1,
    stiffness: 200,
    damping: 14,
    mass: 1,
    min: 0,
    max: 1,
    onUpdate(v) {
      state.antenna = v;
      applyAntennaHeight(v);
      updateDial();
    }
  });

  function applyAntennaHeight(v) {
    // 每节依次伸出
    const secs = [
      { el: antennaSections[4], travel: 22, base: 0 },
      { el: antennaSections[3], travel: 24, base: 20 },
      { el: antennaSections[2], travel: 26, base: 42 },
      { el: antennaSections[1], travel: 28, base: 64 },
      { el: antennaSections[0], travel: 22, base: 88 },
    ];
    // 顶部小球随最顶端移动
    const totalTravel = secs.reduce((s, x) => s + x.travel, 0);
    const extendPx = v * totalTravel;
    let remaining = extendPx;
    let topY = 0;

    for (let i = secs.length - 1; i >= 0; i--) {
      const s = secs[i];
      const extend = Math.min(remaining, s.travel);
      remaining -= extend;
      const bottom = s.base + extend;
      s.el.style.bottom = bottom + 'px';
      if (i === 0) topY = bottom + 22; // 最底一节高度
      if (i === secs.length - 1) topY = bottom;
    }
    antennaBall.style.bottom = (extendPx + 6) + 'px';
  }
  applyAntennaHeight(state.antenna);

  antenna.addEventListener('mousedown', (e) => {
    e.preventDefault();
    antennaDragging = true;
    antennaMouseStartY = e.clientY;
    antennaStartY = antennaSpring.value;
    physics.remove(antennaSpring);
    setCursorState('drag');
  });

  document.addEventListener('mousemove', (e) => {
    if (antennaDragging) {
      const dy = antennaMouseStartY - e.clientY; // 向上拉增大
      const v = clamp(antennaStartY + dy / 120, 0, 1);
      state.antenna = v;
      applyAntennaHeight(v);
    }
  }, { passive: true });

  document.addEventListener('mouseup', () => {
    if (antennaDragging) {
      antennaDragging = false;
      antennaSpring.value = state.antenna;
      antennaSpring.target = state.antenna;
      antennaSpring.velocity = 0;
      // 轻微回弹到最近"节"
      const snap = Math.round(state.antenna * 5) / 5;
      antennaSpring.target = snap;
      physics.add(antennaSpring);
      updateDial();
    }
  });

  // ========== ④ 波段拨杆开关 ==========
  const bandLever = $('bandLever');
  const bandDots = [$('bandDot0'), $('bandDot1'), $('bandDot2')];
  let leverDragging = false;
  let leverStartAngle = 0;
  let leverMouseStartX = 0;

  // 拨杆弹簧（三个档位 -25, 0, +25）
  const leverSpring = makeSpring({
    value: -25,
    target: -25,
    stiffness: 500,
    damping: 25,
    mass: 0.6,
    min: -35,
    max: 35,
    onUpdate(v) {
      state.leverAngle = v;
      bandLever.style.transform = `rotate(${v}deg)`;
    }
  });

  function setBand(idx) {
    state.band = clamp(idx, 0, 2);
    const angles = [-25, 0, 25];
    leverSpring.target = angles[idx];
    bandDots.forEach((d, i) => d.classList.toggle('active', i === idx));
    // 重建刻度
    buildScale(state.band);
    updateDial();
  }
  // 初始化
  leverSpring.value = 0; // FM 档
  leverSpring.target = 0;
  physics.add(leverSpring);
  setBand(1);

  bandLever.addEventListener('mousedown', (e) => {
    e.preventDefault();
    leverDragging = true;
    leverMouseStartX = e.clientX;
    leverStartAngle = leverSpring.value;
    setCursorState('drag');
  });

  document.addEventListener('mousemove', (e) => {
    if (leverDragging) {
      const dx = e.clientX - leverMouseStartX;
      const angle = clamp(leverStartAngle + dx * 0.8, -35, 35);
      state.leverAngle = angle;
      bandLever.style.transform = `rotate(${angle}deg)`;
    }
  }, { passive: true });

  document.addEventListener('mouseup', () => {
    if (leverDragging) {
      leverDragging = false;
      const ang = state.leverAngle;
      let target = 1;
      if (ang < -12) target = 0;
      else if (ang > 12) target = 2;
      leverSpring.value = state.leverAngle;
      leverSpring.velocity = 0;
      // 给予一个朝目标方向的冲量（弹簧归位感）
      const angles = [-25, 0, 25];
      const diff = angles[target] - state.leverAngle;
      leverSpring.velocity = diff * 8;
      leverSpring.target = angles[target];
      physics.add(leverSpring);
      // 触点震动：微抖一下
      setTimeout(() => {
        leverSpring.kick(diff > 0 ? 80 : -80);
      }, 80);
      setBand(target);
      setCursorState('hover');
    }
  });

  // 点击也可切换（无拖拽时）
  bandLever.addEventListener('click', (e) => {
    // 只有没有明显拖拽时才走点击切换
    if (Math.abs(state.leverAngle - [-25, 0, 25][state.band]) < 5) {
      const next = (state.band + 1) % 3;
      setBand(next);
      leverSpring.kick(50);
    }
  });

  // ========== ⑤ 音量旋钮 ==========
  const volumeKnob = $('volumeKnob');
  const volIndicator = $('volIndicator');
  let volDragging = false;
  let volStartAngle = 0;
  let volMouseStartY = 0;
  let volLastAngle = -85;

  const volInertial = makeInertial({
    value: -85,
    friction: 6,
    min: -135,
    max: 135,
    onUpdate(v) {
      state.volumeAngle = v;
      volIndicator.style.transform = `rotate(${v}deg)`;
      // 角度 → 音量
      state.volume = (v + 135) / 270;
      updateVUTarget();
    }
  });

  function angleFromVolume(v) {
    return -135 + v * 270;
  }

  // 初始状态
  volInertial.value = angleFromVolume(state.volume);
  volIndicator.style.transform = `rotate(${volInertial.value}deg)`;

  volumeKnob.addEventListener('mousedown', (e) => {
    e.preventDefault();
    volDragging = true;
    volMouseStartY = e.clientY;
    volStartAngle = state.volumeAngle;
    volInertial.dragging = true;
    physics.remove(volInertial);
    setCursorState('drag');
  });

  document.addEventListener('mousemove', (e) => {
    if (volDragging) {
      const dy = volMouseStartY - e.clientY;
      const angle = clamp(volStartAngle + dy * 1.8, -135, 135);
      state.volumeAngle = angle;
      volIndicator.style.transform = `rotate(${angle}deg)`;
      state.volume = (angle + 135) / 270;
      updateVUTarget();
    }
  }, { passive: true });

  document.addEventListener('mouseup', () => {
    if (volDragging) {
      volDragging = false;
      volInertial.value = state.volumeAngle;
      volInertial.velocity = 0;
      volInertial.dragging = false;
      // 阻尼回弹（无），直接停
      physics.add(volInertial);
      // 刻度吸附（轻微）
      const snapped = Math.round(state.volume * 10) / 10;
      volInertial.value = angleFromVolume(snapped);
      state.volume = snapped;
      state.volumeAngle = volInertial.value;
    }
  });

  // 滚轮调节
  volumeKnob.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -8 : 8;
    const angle = clamp(state.volumeAngle + delta, -135, 135);
    state.volumeAngle = angle;
    volIndicator.style.transform = `rotate(${angle}deg)`;
    state.volume = (angle + 135) / 270;
    volInertial.value = angle;
    updateVUTarget();
  }, { passive: false });

  // ========== ③ 调谐旋钮 ==========
  const tuningKnob = $('tuningKnob');
  const tuningIndicator = $('tuningIndicator');
  let tuningDragging = false;
  let tuningStartAngle = 0;
  let tuningMouseStartY = 0;

  const tuningInertial = makeInertial({
    value: 0,
    friction: 3.5,
    min: -360,
    max: 360,
    onUpdate(v) {
      state.tuningAngle = v;
      tuningIndicator.style.transform = `rotate(${v}deg)`;
      // 旋钮角度 → 调谐位置（一圈 = 波段全范围）
      const norm = ((v % 360) + 360) % 360;
      state.tuning = norm / 360;
      updateDial();
    }
  });

  // 初始角度（对应 state.tuning = 0.5 → 180deg）
  tuningInertial.value = 180;
  state.tuningAngle = 180;
  state.tuning = 0.5;
  tuningIndicator.style.transform = `rotate(180deg)`;
  buildScale(1);
  updateDial();

  tuningKnob.addEventListener('mousedown', (e) => {
    e.preventDefault();
    tuningDragging = true;
    tuningMouseStartY = e.clientY;
    tuningStartAngle = state.tuningAngle;
    tuningInertial.dragging = true;
    physics.remove(tuningInertial);
    setCursorState('drag');
  });

  document.addEventListener('mousemove', (e) => {
    if (tuningDragging) {
      const dy = tuningMouseStartY - e.clientY;
      const angle = tuningStartAngle + dy * 2.5;
      state.tuningAngle = angle;
      tuningIndicator.style.transform = `rotate(${angle}deg)`;
      const norm = ((angle % 360) + 360) % 360;
      state.tuning = norm / 360;
      updateDial();
    }
  }, { passive: true });

  document.addEventListener('mouseup', () => {
    if (tuningDragging) {
      tuningDragging = false;
      tuningInertial.value = state.tuningAngle;
      tuningInertial.velocity = 0;
      tuningInertial.dragging = false;
      // 惯性继续
      physics.add(tuningInertial);
      // 找到最近的电台并吸附（如果天线拉出足够）
      if (state.antenna > 0.3) {
        const band = bands[state.band];
        const freq = band.min + state.tuning * (band.max - band.min);
        let nearestDist = Infinity, nearestFreq = freq;
        for (const s of band.stations) {
          const d = Math.abs(freq - s);
          if (d < nearestDist) { nearestDist = d; nearestFreq = s; }
        }
        const range = band.max - band.min;
        if (nearestDist < range * 0.02) {
          // 磁吸到电台
          const targetTuning = (nearestFreq - band.min) / range;
          const targetAngle = targetTuning * 360;
          // 找最近的角度等价
          const currentMod = state.tuningAngle;
          const diff = targetAngle - (currentMod % 360 + 360) % 360;
          tuningInertial.target = currentMod + diff;
          tuningInertial.velocity += diff * 5;
        }
      }
    }
  });

  // 调谐旋钮滚轮
  tuningKnob.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -15 : 15;
    const angle = state.tuningAngle + delta;
    state.tuningAngle = angle;
    tuningIndicator.style.transform = `rotate(${angle}deg)`;
    const norm = ((angle % 360) + 360) % 360;
    state.tuning = norm / 360;
    tuningInertial.value = angle;
    updateDial();
  }, { passive: false });

  // ========== 物理启动 ==========
  // 初始时加入核心物理项
  physics.add(leverSpring);
  physics.add(vuSpring);
  physics.add(tuningInertial);
  physics.add(volInertial);
  physics.add(antennaSpring);
  physics.add(cordSpring);

  // ========== 光标动画循环（独立轻量循环） ==========
  let cursorRAF = null;
  function cursorLoop() {
    // 缓动跟随
    cursorX = lerp(cursorX, cursorTargetX, 0.25);
    cursorY = lerp(cursorY, cursorTargetY, 0.25);
    cursor.style.left = cursorX + 'px';
    cursor.style.top = cursorY + 'px';
    cursorRAF = requestAnimationFrame(cursorLoop);
  }
  cursorRAF = requestAnimationFrame(cursorLoop);

  // 可见性同步暂停光标循环
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (cursorRAF) { cancelAnimationFrame(cursorRAF); cursorRAF = null; }
    } else {
      if (!cursorRAF) cursorRAF = requestAnimationFrame(cursorLoop);
    }
  });

  // ========== 环境氛围：轻微的整机呼吸 ==========
  let ambientTimer = null;
  function ambientPulse() {
    if (!state.powered) return;
    // 信号强度随机微调
    if (Math.random() < 0.3) {
      const jitter = (Math.random() - 0.5) * 0.08;
      state.eyeOpenness = clamp(state.eyeOpenness + jitter, 0, 1);
      updateMagicEye();
    }
  }
  ambientTimer = setInterval(ambientPulse, 200);

  // ========== 入场动画 ==========
  function entranceAnim() {
    if (reduceMotion) return;
    const radio = document.querySelector('.radio');
    radio.style.opacity = '0';
    radio.style.transform = 'translateY(20px)';
    radio.style.transition = 'opacity 1s ease, transform 1s cubic-bezier(.2, .8, .2, 1)';
    requestAnimationFrame(() => {
      radio.style.opacity = '1';
      radio.style.transform = 'translateY(-10px)';
    });
  }
  entranceAnim();

  // ========== 宣告可升级 ==========
  function announceUpgrade() {
    try {
      window.parent.postMessage({ type: 'miaoda:upgrade:available', kind: 'interactive-prototype' }, '*');
    } catch (e) {}
  }
  announceUpgrade();
  if (document.readyState !== 'complete') {
    window.addEventListener('load', announceUpgrade, { once: true });
  }

  // ========== 防止选中文字 ==========
  document.addEventListener('selectstart', (e) => e.preventDefault());

})();
</script>
</body>
</html>

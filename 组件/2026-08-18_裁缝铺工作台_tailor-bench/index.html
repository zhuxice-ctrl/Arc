<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="creative-medium" content="interactive-prototype">
<title>V3 裁缝铺 · 拟物化组件实验室</title>
<link rel="stylesheet" href="main.css">
</head>
<body>

<!-- 自定义光标 -->
<div id="cursor" class="cursor" aria-hidden="true">
  <div class="cursor-ring"></div>
  <div class="cursor-dot"></div>
  <div class="cursor-glow"></div>
</div>
<div id="cursor-ripple" class="cursor-ripple" aria-hidden="true"></div>

<!-- 环境背景 -->
<div class="ambient-bg">
  <div class="bg-wall"></div>
  <div class="bg-wall-texture"></div>
  <div class="bg-lamp-glow"></div>
</div>

<!-- 顶栏 -->
<header class="top-bar">
  <div class="brand">
    <span class="brand-mark">✂</span>
    <span class="brand-name">V3 裁缝铺</span>
    <span class="brand-sub">拟物化组件实验室</span>
  </div>
  <nav class="top-nav">
    <span class="nav-label">展区导航</span>
    <div class="nav-dots">
      <button class="nav-dot" data-target="measure" title="拉皮尺"></button>
      <button class="nav-dot" data-target="sewing" title="缝纫机"></button>
      <button class="nav-dot" data-target="spool" title="绕线轴"></button>
      <button class="nav-dot" data-target="chalk" title="划粉片"></button>
      <button class="nav-dot" data-target="iron" title="蒸汽熨斗"></button>
      <button class="nav-dot" data-target="thimble" title="顶针纽扣"></button>
    </div>
  </nav>
  <div class="top-meta">
    <span class="meta-time" id="workshop-time">子时 · 深夜裁缝铺</span>
    <span class="meta-divider">·</span>
    <span class="meta-status">六件套 · 可把玩</span>
  </div>
</header>

<!-- 主展示区 -->
<main class="workshop">

  <!-- 展区 01: 拉皮尺 -->
  <section class="exhibit" id="measure" data-screen-label="01">
    <div class="exhibit-plaque">
      <span class="plaque-num">01</span>
      <span class="plaque-name">拉皮尺</span>
      <span class="plaque-hint">拖拽拉出 · 松手回卷</span>
    </div>
    <div class="exhibit-stage stage-measure">
      <div class="measure-case">
        <div class="measure-case-body">
          <div class="measure-case-window"></div>
          <div class="measure-case-button"></div>
          <div class="measure-case-logo">软尺</div>
        </div>
        <div class="measure-tape" id="measureTape">
          <div class="tape-surface" id="tapeSurface"></div>
          <div class="tape-tip" id="tapeTip"></div>
        </div>
      </div>
      <div class="measure-ruler-hint">向左拉出皮尺，松手感弹簧回卷</div>
    </div>
  </section>

  <!-- 展区 02: 缝纫机 -->
  <section class="exhibit" id="sewing" data-screen-label="02">
    <div class="exhibit-plaque">
      <span class="plaque-num">02</span>
      <span class="plaque-name">缝纫机</span>
      <span class="plaque-hint">按住踏板 · 机针走线</span>
    </div>
    <div class="exhibit-stage stage-sewing">
      <div class="sewing-machine">
        <div class="sewing-arm">
          <div class="sewing-spool-pin"></div>
          <div class="sewing-spool-thread"></div>
          <div class="sewing-needle-bar">
            <div class="sewing-needle"></div>
          </div>
          <div class="sewing-presser"></div>
        </div>
        <div class="sewing-base">
          <div class="sewing-plate">
            <div class="sewing-feed-dog"></div>
            <div class="sewing-needle-hole"></div>
          </div>
          <div class="sewing-wheel"></div>
        </div>
        <div class="sewing-fabric" id="sewingFabric">
          <div class="fabric-texture"></div>
          <div class="fabric-stitches" id="fabricStitches"></div>
        </div>
      </div>
      <div class="sewing-pedal" id="sewingPedal">
        <div class="pedal-body"></div>
        <div class="pedal-plate">踏板</div>
      </div>
    </div>
  </section>

  <!-- 展区 03: 绕线轴 -->
  <section class="exhibit" id="spool" data-screen-label="03">
    <div class="exhibit-plaque">
      <span class="plaque-num">03</span>
      <span class="plaque-name">绕线轴</span>
      <span class="plaque-hint">拖拽旋转 · 换色绕线</span>
    </div>
    <div class="exhibit-stage stage-spool">
      <div class="spool-stand">
        <div class="spool-spindle"></div>
        <div class="spool-wheel" id="spoolWheel">
          <div class="spool-flange spool-flange-left"></div>
          <div class="spool-core" id="spoolCore"></div>
          <div class="spool-flange spool-flange-right"></div>
        </div>
        <div class="spool-base"></div>
      </div>
      <div class="spool-colors" id="spoolColors">
        <button class="color-swatch" data-color="#C84C5F" style="--sw: #C84C5F" title="胭脂红"></button>
        <button class="color-swatch" data-color="#8B5A3C" style="--sw: #8B5A3C" title="赭石棕"></button>
        <button class="color-swatch" data-color="#DAA520" style="--sw: #DAA520" title="黄铜金"></button>
        <button class="color-swatch" data-color="#5C7A4F" style="--sw: #5C7A4F" title="苔藓绿"></button>
        <button class="color-swatch" data-color="#2F4858" style="--sw: #2F4858" title="藏青蓝"></button>
      </div>
      <div class="spool-readout">
        <span class="readout-label">匝数</span>
        <span class="readout-value" id="spoolCount">0</span>
      </div>
    </div>
  </section>

  <!-- 展区 04: 划粉片 -->
  <section class="exhibit" id="chalk" data-screen-label="04">
    <div class="exhibit-plaque">
      <span class="plaque-num">04</span>
      <span class="plaque-name">划粉片</span>
      <span class="plaque-hint">拖拽留痕 · 消散粉线</span>
    </div>
    <div class="exhibit-stage stage-chalk">
      <div class="chalk-fabric" id="chalkFabric">
        <canvas id="chalkCanvas"></canvas>
        <div class="chalk-fabric-pattern"></div>
        <div class="chalk-pin-tl"></div>
        <div class="chalk-pin-tr"></div>
        <div class="chalk-pin-bl"></div>
        <div class="chalk-pin-br"></div>
      </div>
      <button class="chalk-clear" id="chalkClear">轻扫粉迹</button>
    </div>
  </section>

  <!-- 展区 05: 蒸汽熨斗 -->
  <section class="exhibit" id="iron" data-screen-label="05">
    <div class="exhibit-plaque">
      <span class="plaque-num">05</span>
      <span class="plaque-name">蒸汽熨斗</span>
      <span class="plaque-hint">悬停喷气 · 拖熨褶皱</span>
    </div>
    <div class="exhibit-stage stage-iron">
      <div class="iron-board">
        <div class="iron-board-fabric" id="ironFabric">
          <div class="wrinkle-row" style="--wr: 1"></div>
          <div class="wrinkle-row" style="--wr: 2"></div>
          <div class="wrinkle-row" style="--wr: 3"></div>
          <div class="wrinkle-row" style="--wr: 4"></div>
          <div class="wrinkle-row" style="--wr: 5"></div>
          <div class="wrinkle-row" style="--wr: 6"></div>
        </div>
        <div class="iron-stand">
          <div class="iron-stand-top"></div>
          <div class="iron-stand-leg leg-l"></div>
          <div class="iron-stand-leg leg-r"></div>
        </div>
      </div>
      <div class="iron-tool" id="ironTool">
        <div class="iron-body">
          <div class="iron-handle"></div>
          <div class="iron-top-plate"></div>
          <div class="iron-sole"></div>
          <div class="iron-steam-vents"></div>
        </div>
        <div class="iron-steam" id="ironSteam"></div>
      </div>
    </div>
  </section>

  <!-- 展区 06: 顶针纽扣盒 -->
  <section class="exhibit" id="thimble" data-screen-label="06">
    <div class="exhibit-plaque">
      <span class="plaque-num">06</span>
      <span class="plaque-name">顶针纽扣</span>
      <span class="plaque-hint">拖拽归位 · 磁性吸附</span>
    </div>
    <div class="exhibit-stage stage-thimble">
      <div class="button-tray">
        <div class="tray-lip"></div>
        <div class="tray-felt"></div>
        <div class="button-slots" id="buttonSlots"></div>
      </div>
      <div class="button-scatter" id="buttonScatter"></div>
      <button class="button-spill" id="buttonSpill">倾倒纽扣</button>
    </div>
  </section>

</main>

<!-- 底栏说明 -->
<footer class="foot-bar">
  <div class="foot-left">
    <span class="foot-title">实验室说明</span>
    <span class="foot-desc">六件拟物化装置 · 光标驱动微交互 · 物理模型驱动动效</span>
  </div>
  <div class="foot-right">
    <span class="foot-tag">弹簧回卷</span>
    <span class="foot-tag">惯性动量</span>
    <span class="foot-tag">磁性反平方</span>
    <span class="foot-tag">阻尼摩擦</span>
    <span class="foot-tag">RAF 积分器</span>
  </div>
</footer>

<script src="main.js"></script>
</body>
</html>

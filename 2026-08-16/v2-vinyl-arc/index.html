<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>Vinyl Arc — 黑胶收藏 App</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1a1814;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(198, 100, 62, 0.12), transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(120, 80, 50, 0.15), transparent 50%),
        #1a1814;
      pointer-events: none;
    }
    .stage {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 48px;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    .stage-info {
      position: absolute;
      top: 24px;
      left: 32px;
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .stage-info span { color: #C86A3E; }

    /* 自定义光标 — 清晰可见的复古唱针光标 */
    @media (pointer: fine) {
      * { cursor: none !important; }
      .cursor-outer, .cursor-inner {
        position: fixed;
        pointer-events: none;
        z-index: 9999;
        top: 0;
        left: 0;
        transition: transform 0.18s cubic-bezier(0.4, 0, 0.2, 1),
                    width 0.25s ease, height 0.25s ease,
                    opacity 0.2s ease;
        will-change: transform;
      }
      .cursor-outer {
        width: 32px;
        height: 32px;
        border: 1.5px solid #C86A3E;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        opacity: 0.9;
        mix-blend-mode: difference;
      }
      .cursor-inner {
        width: 4px;
        height: 4px;
        background: #E8D9C4;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 8px rgba(200, 106, 62, 0.6);
      }
      .cursor-outer.hover {
        width: 56px;
        height: 56px;
        border-color: #E8D9C4;
        opacity: 0.6;
      }
    }
  </style>
</head>
<body>
  <div class="stage-info">
    <span>Vinyl Arc</span> &nbsp;/&nbsp; Mobile UI Mock v2.0 &nbsp;/&nbsp; 黑胶收藏与播放
  </div>
  <div class="stage">
    <div id="root"></div>
  </div>

  <!-- 自定义光标 -->
  <div class="cursor-outer" id="cursorOuter"></div>
  <div class="cursor-inner" id="cursorInner"></div>

  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="pages.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
